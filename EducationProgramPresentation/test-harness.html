<script>
/* ── MOCK TOOL SDK ── */
(function() {
  var STORAGE_KEY = 'egitim_sunumu_test_db';
  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [] };
  var _readOnly = false, _fields = {}, _value = null;
  var _user = { id: 'user-1', name: 'Test Kullanıcı', email: 'test@example.org', roles: ['editor'], locale: 'tr' };
  function load() { try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; } catch(e) { _value = null; } }
  function save(v) { _value = v; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch(e) {} }
  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { save(data); listeners.valueChange.forEach(function(cb) { try { cb(data); } catch(e) {} }); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },
    getFields: function() { return Object.assign({}, _fields); },
    setField: function(id, value) { _fields[id] = value; },
    setFields: function(obj) { Object.assign(_fields, obj); },
    watchField: function(id, cb) { listeners.fieldsChange.push(cb); },
    onFieldsChange: function(cb) { listeners.fieldsChange.push(cb); },
    param: function(name, fb) { var p = (new URLSearchParams(window.location.search)).get(name); return p !== null && p !== '' ? p : fb; },
    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    _setReadOnly: function(v) { _readOnly = !!v; listeners.readonlyChange.forEach(function(cb) { try { cb(v); } catch(e) {} }); document.getElementById('th-status').textContent = _readOnly ? 'SALT OKUNUR' : 'DÜZENLEME'; },
    getUser: function() { return _user; },
    onUserChange: function(cb) { listeners.userChange.push(cb); },
    getPermittedUsers: function() { return []; },
    onPermittedUsersChange: function(cb) {},
    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#0d9488', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message; document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 2500);
    },
    resize: function() {},
    declareOutput: function() {},
    declareParams: function() {},
    onReady: function(cb) { load(); cb(_value, _fields); },
    _loadSampleData: function() { save({ currentSlide: 5 }); window.location.reload(); },
    _clearData: function() { localStorage.removeItem(STORAGE_KEY); window.location.reload(); },
    _toggleReadOnly: function() { this._setReadOnly(!_readOnly); },
    _dump: function() { console.log('📊 DB:', JSON.parse(JSON.stringify(_value))); },
    requestAI: function() { var cb = arguments[arguments.length-1]; setTimeout(function() { cb(null, 'Mock'); }, 100); },
    requestUpload: function(a, cb) { setTimeout(function() { cb(null, { name: 't.pdf', url: '#', size: 1, type: 'pdf' }); }, 100); },
    requestFileContent: function(u, cb) { setTimeout(function() { cb(null, 'Mock'); }, 100); },
    requestExportPdf: function(o, cb) { setTimeout(function() { cb(null, { name: 'e.html', url: '#', size: 1, type: 'html' }); }, 100); },
    requestSendEmail: function(o, cb) { setTimeout(function() { cb(null, { ok: true }); }, 100); },
    requestObjects: function(a, p, cb) { setTimeout(function() { cb(null, { objects: [], ok: true }); }, 100); }
  };
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); window.tool._toggleReadOnly(); window.tool.notify(window.tool.isReadOnly() ? 'SALT OKUNUR' : 'DÜZENLEME', 'info'); }
    if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault(); window.tool._dump(); window.tool.notify('DB konsola yazıldı', 'info'); }
  });
})();
</script>
