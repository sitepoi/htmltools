<!--
  DOCS INDEX TEMPLATE - _docs/templates/_index-template.html
  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), the screenshots
  viewer (MEDIA) and the test harness into a full-page pane - open ONLY
  this file to review everything about the tool.
  MINIMAL BY DESIGN: this file carries ONLY the tool's DATA (the two JSON
  payloads below). All design and behavior live ONCE in
  _docs/assets/index.css + index.js - edit those to change every docs
  index at once, no per-file updates needed.
  The code panes are refreshed with `npm run docs:index-code -- <Tool>`
  and the screenshots payload with `npm run docs:index-shots -- <Tool>`
  (both replace the JSON between their marker comments).
  URL shortcut: index.html?doc=help (or ?doc=code-js) opens directly.
-->
<link rel="stylesheet" href="../../../../../../_docs/assets/index.css" />
<script src="../../../../../../_docs/assets/index.js" defer="defer"></script>
</head>
<body>

      <div class="docs-brand-name">Travel Planner</div>
      <div class="docs-brand-sub">docs index</div>

      <button class="docs-nav-item" data-doc="help" data-src="help.html">User help<span class="docs-nav-sub">how to use the tool</span></button>
      <button class="docs-nav-item" data-doc="presentation" data-src="presentation.html">Presentation<span class="docs-nav-sub">marketing deck</span></button>
      <button class="docs-nav-item" data-doc="updates" data-src="updates.html">Updates<span class="docs-nav-sub">release history</span></button>
      <button class="docs-nav-item" data-doc="social" data-src="social.html">Social share kit<span class="docs-nav-sub">posts and WhatsApp</span></button>
      <hr class="docs-nav-sep" />
      <div class="docs-nav-group-label">Code</div>
      <button class="docs-nav-item docs-nav-code" data-doc="code-html">HTML code<span class="docs-nav-sub">markup of the tool</span></button>
      <button class="docs-nav-item docs-nav-code" data-doc="code-css">CSS code<span class="docs-nav-sub">stylesheet of the tool</span></button>
      <button class="docs-nav-item docs-nav-code" data-doc="code-js">JS code<span class="docs-nav-sub">logic of the tool</span></button>
      <hr class="docs-nav-sep" />
      <div class="docs-nav-group-label">Media</div>
      <button class="docs-nav-item docs-nav-shots" data-doc="screenshots">Screenshots<span class="docs-nav-sub">captured views of the tool</span></button>
      <hr class="docs-nav-sep" />
      <button class="docs-nav-item docs-nav-harness" data-doc="harness" data-src="../app/test-harness.html">Test harness<span class="docs-nav-sub">live tool with mock SDK</span></button>
    </nav>
    <div class="docs-menu-footer">One page for everything in this docs folder. 2026-09-23</div>
  </aside>

  <main class="docs-stage">
    <iframe class="docs-frame" id="docs-frame" src="ssot.html" title="Document viewer"></iframe>
    <button class="docs-open" id="docs-open" type="button" title="Open the current document in a new browser tab">Open in new tab ↗</button>
    <div class="docs-code-view" id="docs-code-view">
      <div class="docs-code-head">
        <span class="docs-code-title" id="docs-code-title"></span>
        <span class="docs-code-meta" id="docs-code-meta"></span>
        <button class="docs-code-btn" id="docs-code-copy" type="button">Copy code</button>
        <button class="docs-code-btn" id="docs-code-open" type="button" title="Open the code file in a new browser tab">Open ↗</button>

    <div class="docs-shots-view" id="docs-shots-view">
      <div class="docs-shots-viewer" id="docs-shots-viewer">
        <button class="docs-shots-arrow prev" id="docs-shots-prev" type="button" title="Previous screenshot">&#9664;</button>
        <img class="docs-shots-img" id="docs-shots-img" alt="Screenshot of the tool" />
        <button class="docs-shots-arrow next" id="docs-shots-next" type="button" title="Next screenshot">&#9654;</button>
        <div class="docs-shots-empty" id="docs-shots-empty">No screenshots yet.<br />Run <b>npm run screenshots -- &lt;ToolName&gt;</b> to capture them.</div>
      </div>
      <div class="docs-shots-info" id="docs-shots-info"></div>
      <div class="docs-shots-thumbs" id="docs-shots-thumbs"></div>
    </div>
  </main>

</div>

<script type="application/json" id="code-payload">{"html":{"name":"TravelPlanner.html","src":"../app/TravelPlanner.html","content":"<div id=\"app\">\r\n  <!-- HEADER -->\r\n  <header class=\"app-header\">\r\n    <div class=\"header-left\">\r\n      <div class=\"app-logo\">✈️<\/div>\r\n      <div class=\"header-title\">\r\n        <h1>Travel Planner<\/h1>\r\n        <span class=\"header-sub\">Chat-driven • Describe your trip and the AI builds the full plan<\/span>\r\n      <\/div>\r\n    <\/div>\r\n    <div class=\"header-right\">\r\n      <span class=\"tp-badge\" id=\"tp-day-badge\" title=\"Number of planned days\">0 days<\/span>\r\n      <span class=\"tp-badge\" id=\"tp-budget-badge\" title=\"Trip budget\" style=\"display:none\"><\/span>\r\n      <span class=\"version-badge\" id=\"tool-version\" title=\"Plan version\">v1.0.0<\/span>\r\n      <button class=\"btn btn-sm btn-ghost\" id=\"btn-goto-export\" title=\"Export or share the travel plan\">📥 Export<\/button>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <!-- MAIN LAYOUT: Chat (left) + Plan (right) -->\r\n  <div class=\"main-layout\">\r\n    <!-- LEFT: Chat Panel -->\r\n    <aside class=\"chat-panel\" id=\"chat-panel\">\r\n      <div class=\"chat-tab-bar\" id=\"chat-tab-bar\">\r\n        <button class=\"chat-tab active\" data-chat-tab=\"chat\">💬 Chat<\/button>\r\n        <button class=\"chat-tab\" data-chat-tab=\"history\">📋 Chats<\/button>\r\n        <span class=\"chat-status-dot\" id=\"chat-conn-status\" title=\"AI Connection\"><\/span>\r\n        <span class=\"chat-panel-badge\" id=\"chat-msg-count\">0<\/span>\r\n        <button class=\"btn btn-sm btn-ghost\" id=\"btn-new-session\" title=\"New Chat Session\" style=\"margin-left:auto;font-size:14px;padding:2px 6px\">+<\/button>\r\n      <\/div>\r\n\r\n      <div class=\"chat-tab-content\" id=\"chat-tab-content\">\r\n        <!-- Tab: Chat -->\r\n        <div class=\"chat-tab-panel active\" data-chat-panel=\"chat\">\r\n          <div class=\"chat-messages\" id=\"chat-messages\">\r\n            <div class=\"chat-welcome\">\r\n              <div class=\"chat-welcome-icon\">✈️<\/div>\r\n              <h3>Where are we going?<\/h3>\r\n              <p>Tell me about your trip — <b>destination, dates, who's traveling, budget and style<\/b> — and I'll plan it day by day: stays, transport, activities, meals, packing list, budget and more.<\/p>\r\n              <div class=\"welcome-hints\">\r\n                <button class=\"hint-chip\" data-hint=\"Plan a 7-day family trip to Istanbul for 4 (kids 6 and 9), mid budget, with kid-friendly activities and a Bosphorus boat day.\">👨‍👩‍👧‍👦 Family city trip<\/button>\r\n                <button class=\"hint-chip\" data-hint=\"3-day solo city break in Paris, foodie style, hotel near Le Marais, one full day for museums and one for walking neighborhoods.\">🎒 Solo city break<\/button>\r\n                <button class=\"hint-chip\" data-hint=\"5-day friends roadtrip along the California coast from Los Angeles to San Francisco, surf stops, coastal hikes and local food.\">🚗 Friends roadtrip<\/button>\r\n                <button class=\"hint-chip\" data-hint=\"10-day Japan trip for 2 with a rail pass: Tokyo, Kyoto and Osaka, budget style, temples, street food and day trips.\">🗾 Couple adventure<\/button>\r\n              <\/div>\r\n              <p style=\"font-size:10px;color:var(--text3);margin-top:12px\">💡 <b>Tip:<\/b> After the plan is built you can say <b>\"add a beach day\"<\/b>, <b>\"change day 2 to more museums\"<\/b>, <b>\"make it cheaper\"<\/b> or <b>\"add a packing list\"<\/b> — I'll only change what you asked.<\/p>\r\n            <\/div>\r\n          <\/div>\r\n        <\/div>\r\n        <!-- Tab: Chat History -->\r\n        <div class=\"chat-tab-panel\" data-chat-panel=\"history\">\r\n          <div class=\"session-list\" id=\"session-list\">\r\n            <div class=\"session-empty\">Loading chats…<\/div>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n\r\n      <div class=\"chat-input-area\">\r\n        <div class=\"chat-target-chip\" id=\"chat-target-chip\" style=\"display:none\">\r\n          <span>🎯 <b id=\"chat-target-label\">Day<\/b> — the next AI message edits only this day<\/span>\r\n          <button id=\"btn-target-clear\" title=\"Clear target\">✕<\/button>\r\n        <\/div>\r\n        <div class=\"chat-input-row\">\r\n          <textarea id=\"chat-input\" class=\"chat-input\" rows=\"2\" placeholder=\"Describe your trip or ask for changes… (Enter to send, Shift+Enter for new line)\" spellcheck=\"false\"><\/textarea>\r\n          <button class=\"btn btn-primary btn-sm\" id=\"btn-chat-send\" title=\"Send (Enter)\">▶<\/button>\r\n          <button class=\"btn btn-sm\" id=\"btn-chat-stop\" title=\"Stop AI generation\" style=\"display:none\">⏹<\/button>\r\n        <\/div>\r\n      <\/div>\r\n    <\/aside>\r\n\r\n    <!-- RIGHT: Plan Panel -->\r\n    <main class=\"content-panel\" id=\"content-panel\">\r\n      <div class=\"content-tabs\" id=\"content-tabs\">\r\n        <button class=\"ctab active\" data-tab=\"itinerary\">🗺️ Itinerary<\/button>\r\n        <button class=\"ctab\" data-tab=\"essentials\">🧳 Essentials<\/button>\r\n        <button class=\"ctab\" data-tab=\"export\">📦 Export<\/button>\r\n      <\/div>\r\n\r\n      <div class=\"content-editors\">\r\n        <!-- Itinerary: trip header + day cards -->\r\n        <div class=\"content-editor active\" id=\"editor-itinerary\">\r\n          <div class=\"trip-toolbar\">\r\n            <input class=\"trip-title-input\" id=\"trip-title-input\" placeholder=\"Trip title…\" title=\"Trip title (editable)\">\r\n            <span class=\"trip-meta-line\" id=\"trip-meta-line\"><\/span>\r\n            <button class=\"btn btn-sm btn-outline\" id=\"btn-add-day\" title=\"Add a blank day at the end\">+ Day<\/button>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-export-quick\" title=\"Go to Export\">📥<\/button>\r\n          <\/div>\r\n          <div class=\"itinerary-scroll\" id=\"itinerary-scroll\">\r\n            <div class=\"itinerary-empty\" id=\"itinerary-empty\">\r\n              <div class=\"empty-icon\">🗺️<\/div>\r\n              <p>Your travel plan will appear here<\/p>\r\n              <p class=\"empty-sub\">Describe your trip in the chat on the left to generate the first days<\/p>\r\n            <\/div>\r\n            <div class=\"days-wrap\" id=\"days-wrap\"><\/div>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <!-- Essentials: sections (packing, budget, documents…) -->\r\n        <div class=\"content-editor\" id=\"editor-essentials\">\r\n          <div class=\"essentials-toolbar\">\r\n            <h2>🧳 Essentials<\/h2>\r\n            <p class=\"essentials-hint\">Packing lists, budget breakdown, documents, local tips, phrases, emergency info, flights and key places — all generated by the AI. Ask for them in the chat, e.g. <b>\"add a packing list\"<\/b> or <b>\"show the budget breakdown\"<\/b>.<\/p>\r\n          <\/div>\r\n          <div class=\"essentials-scroll\" id=\"essentials-scroll\">\r\n            <div class=\"essentials-empty\" id=\"essentials-empty\">\r\n              <div class=\"empty-icon\">🧳<\/div>\r\n              <p>No extras yet<\/p>\r\n              <p class=\"empty-sub\">Ask the AI for a packing list, budget breakdown, documents checklist, local tips, key phrases, emergency info or flights<\/p>\r\n            <\/div>\r\n            <div class=\"sections-grid\" id=\"sections-grid\"><\/div>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <!-- Export -->\r\n        <div class=\"content-editor\" id=\"editor-export\">\r\n          <div class=\"export-scroll\">\r\n            <div class=\"export-header\">\r\n              <h2>📦 Export &amp; share<\/h2>\r\n              <p>Everything below works without leaving the tool. The PDF is created from a print-ready page — use your browser's <b>Print → Save as PDF<\/b>.<\/p>\r\n            <\/div>\r\n            <div class=\"export-row\">\r\n              <button class=\"btn btn-outline\" id=\"btn-export-copy-json\">📋 Copy Plan JSON<\/button>\r\n              <button class=\"btn btn-outline\" id=\"btn-export-download-json\">📥 Download .json<\/button>\r\n              <button class=\"btn btn-primary\" id=\"btn-export-pdf\">🖨️ Print / PDF<\/button>\r\n              <button class=\"btn btn-outline\" id=\"btn-export-copy-text\">📄 Copy text itinerary<\/button>\r\n              <button class=\"btn btn-outline\" id=\"btn-export-email\">✉️ Email plan<\/button>\r\n            <\/div>\r\n            <div class=\"export-info\" id=\"export-info\"><\/div>\r\n            <div class=\"import-box\">\r\n              <label class=\"import-label\" for=\"import-json\">Import plan (replaces the current plan)<\/label>\r\n              <textarea class=\"import-textarea\" id=\"import-json\" rows=\"8\" spellcheck=\"false\" placeholder='Paste a plan JSON here: {\"title\":\"…\",\"days\":[…],\"sections\":[…]}'><\/textarea>\r\n              <div class=\"import-actions\"><button class=\"btn btn-outline btn-sm\" id=\"btn-import-json\">📥 Import<\/button><\/div>\r\n            <\/div>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/main>\r\n  <\/div>\r\n\r\n  <!-- CONFIRM DIALOG -->\r\n  <div class=\"confirm-overlay\" id=\"confirm-overlay\" style=\"display:none\">\r\n    <div class=\"confirm-box\">\r\n      <div class=\"confirm-message\" id=\"confirm-message\"><\/div>\r\n      <div class=\"confirm-actions\">\r\n        <button class=\"btn btn-outline\" id=\"btn-confirm-no\">Cancel<\/button>\r\n        <button class=\"btn btn-danger\" id=\"btn-confirm-yes\">Yes<\/button>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>"},"css":{"name":"TravelPlanner.css","src":"../app/TravelPlanner.css","content":"/* ═══════════════ TRAVEL PLANNER — UniconHub html-tool ═══════════════ */\r\n:root {\r\n  --tp-accent: #0e7490;\r\n  --tp-accent2: #0ea5a4;\r\n  --tp-deep: #155e75;\r\n  --tp-bg: #f1f5f9;\r\n  --tp-card: #ffffff;\r\n  --tp-border: #e2e8f0;\r\n  --tp-ink: #0f172a;\r\n  --text2: #475569;\r\n  --text3: #94a3b8;\r\n  --ok: #16a34a;\r\n  --warn: #d97706;\r\n  --danger: #dc2626;\r\n}\r\n\r\n* { box-sizing: border-box; }\r\nhtml, body { margin: 0; padding: 0; }\r\nbody {\r\n  font-family: system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\r\n  background: var(--tp-bg);\r\n  color: var(--tp-ink);\r\n  font-size: 14px;\r\n}\r\n#app { display: flex; flex-direction: column; height: 100vh; min-height: 480px; }\r\n\r\n/* ── Buttons ── */\r\n.btn {\r\n  border: 1px solid var(--tp-border);\r\n  background: #fff;\r\n  color: var(--tp-ink);\r\n  border-radius: 8px;\r\n  padding: 7px 14px;\r\n  font-size: 13px;\r\n  cursor: pointer;\r\n  transition: all 0.15s;\r\n  white-space: nowrap;\r\n}\r\n.btn:hover { border-color: var(--tp-accent); color: var(--tp-accent); }\r\n.btn-sm { padding: 5px 10px; font-size: 12px; }\r\n.btn-primary { background: linear-gradient(135deg, var(--tp-accent), var(--tp-accent2)); border-color: transparent; color: #fff; }\r\n.btn-primary:hover { color: #fff; filter: brightness(1.08); }\r\n.btn-outline { background: #fff; }\r\n.btn-ghost { border-color: transparent; background: transparent; color: var(--text2); }\r\n.btn-ghost:hover { background: #f1f5f9; color: var(--tp-accent); }\r\n.btn-danger { background: #fef2f2; border-color: #fecaca; color: var(--danger); }\r\n.btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }\r\n.btn:disabled { opacity: 0.4; cursor: not-allowed; }\r\n.btn-icon {\r\n  border: none; background: transparent; cursor: pointer;\r\n  font-size: 13px; padding: 2px 5px; border-radius: 6px; color: var(--text3);\r\n}\r\n.btn-icon:hover { background: #e2e8f0; color: var(--tp-ink); }\r\n.btn-icon.danger:hover { background: #fee2e2; color: var(--danger); }\r\n.btn-icon.on { background: #cffafe; color: var(--tp-accent); }\r\n\r\n/* ── Header ── */\r\n.app-header {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--tp-border);\r\n  gap: 12px; flex-shrink: 0;\r\n}\r\n.header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }\r\n.app-logo {\r\n  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;\r\n  background: linear-gradient(135deg, var(--tp-accent), var(--tp-accent2));\r\n  display: flex; align-items: center; justify-content: center; font-size: 22px;\r\n  box-shadow: 0 4px 10px rgba(14, 116, 144, 0.25);\r\n}\r\n.header-title { min-width: 0; }\r\n.header-title h1 { margin: 0; font-size: 17px; }\r\n.header-sub { font-size: 11px; color: var(--text3); }\r\n.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }\r\n.tp-badge, .version-badge {\r\n  font-size: 11px; padding: 4px 10px; border-radius: 999px;\r\n  background: #ecfeff; color: var(--tp-deep); border: 1px solid #cffafe; white-space: nowrap;\r\n}\r\n.version-badge { background: #f1f5f9; color: var(--text2); border-color: var(--tp-border); }\r\n\r\n/* ── Layout ── */\r\n.main-layout { display: flex; flex: 1; min-height: 0; }\r\n.chat-panel {\r\n  width: 360px; min-width: 280px; max-width: 42%;\r\n  display: flex; flex-direction: column;\r\n  background: #fff; border-right: 1px solid var(--tp-border); min-height: 0;\r\n}\r\n.content-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }\r\n\r\n/* ── Chat tabs ── */\r\n.chat-tab-bar {\r\n  display: flex; align-items: center; gap: 6px; padding: 8px 10px;\r\n  border-bottom: 1px solid var(--tp-border); flex-shrink: 0;\r\n}\r\n.chat-tab {\r\n  border: none; background: transparent; cursor: pointer;\r\n  padding: 6px 10px; border-radius: 8px; font-size: 12px; color: var(--text2); font-weight: 600;\r\n}\r\n.chat-tab.active { background: #ecfeff; color: var(--tp-accent); }\r\n.chat-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; margin-left: 4px; }\r\n.chat-status-dot.ok { background: var(--ok); }\r\n.chat-status-dot.busy { background: var(--warn); animation: tpPulse 1s infinite; }\r\n.chat-status-dot.error { background: var(--danger); }\r\n@keyframes tpPulse { 50% { opacity: 0.35; } }\r\n.chat-panel-badge {\r\n  font-size: 10px; background: #f1f5f9; color: var(--text2);\r\n  border-radius: 999px; padding: 1px 7px;\r\n}\r\n.chat-tab-content { flex: 1; min-height: 0; display: flex; }\r\n.chat-tab-panel { display: none; flex: 1; min-width: 0; flex-direction: column; }\r\n.chat-tab-panel.active { display: flex; }\r\n\r\n/* ── Messages ── */\r\n.chat-messages { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }\r\n.chat-welcome { text-align: center; padding: 22px 10px; }\r\n.chat-welcome-icon { font-size: 42px; margin-bottom: 8px; }\r\n.chat-welcome h3 { margin: 4px 0; font-size: 16px; }\r\n.chat-welcome p { color: var(--text2); font-size: 12px; line-height: 1.55; margin: 6px 0; }\r\n.welcome-hints { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }\r\n.hint-chip {\r\n  text-align: left; border: 1px solid var(--tp-border); background: #f8fafc;\r\n  border-radius: 10px; padding: 8px 12px; font-size: 12px; cursor: pointer; color: var(--tp-ink);\r\n  transition: all 0.15s;\r\n}\r\n.hint-chip:hover { border-color: var(--tp-accent); background: #ecfeff; }\r\n\r\n.chat-msg { display: flex; gap: 8px; margin-bottom: 12px; }\r\n.chat-msg .chat-avatar {\r\n  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;\r\n  display: flex; align-items: center; justify-content: center; font-size: 15px; margin-top: 2px;\r\n}\r\n.chat-msg.user { flex-direction: row-reverse; }\r\n.chat-msg.user .chat-avatar { background: #e0f2fe; }\r\n.chat-msg.ai .chat-avatar { background: #ccfbf1; }\r\n.chat-bubble {\r\n  max-width: 86%; padding: 8px 12px; border-radius: 14px; font-size: 12.5px; line-height: 1.55;\r\n  white-space: normal; word-break: break-word;\r\n}\r\n.chat-msg.user .chat-bubble { background: var(--tp-accent); color: #fff; border-bottom-right-radius: 4px; }\r\n.chat-msg.ai .chat-bubble { background: #f1f5f9; border-bottom-left-radius: 4px; }\r\n.chat-msg.ai .chat-bubble code { background: #e2e8f0; border-radius: 4px; padding: 0 4px; font-size: 11px; }\r\n.chat-time { font-size: 9.5px; color: var(--text3); margin-top: 3px; }\r\n.chat-msg.user .chat-time { text-align: right; }\r\n.msg-options { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }\r\n.msg-option {\r\n  text-align: left; border: 1px solid #a5f3fc; background: #ecfeff; color: var(--tp-deep);\r\n  border-radius: 9px; padding: 6px 10px; font-size: 11.5px; cursor: pointer; transition: all 0.15s;\r\n}\r\n.msg-option:hover { background: #cffafe; }\r\n.msg-error-chip { color: var(--danger); font-size: 10.5px; margin-top: 4px; }\r\n.msg-version-chip { font-size: 10px; color: var(--text3); margin-top: 4px; }\r\n\r\n/* ── Thinking bubble ── */\r\n.think-bubble {\r\n  flex: 1; max-width: 86%; background: #f1f5f9; border-radius: 14px; padding: 8px 12px;\r\n  border-bottom-left-radius: 4px;\r\n}\r\n.think-header { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text2); }\r\n.think-label { flex: 1; }\r\n.think-time { color: var(--text3); font-size: 10px; }\r\n.think-toggle { font-size: 10px; color: var(--text3); }\r\n.think-cancel { border: 1px solid #fecaca; background: #fef2f2; color: var(--danger); border-radius: 6px; font-size: 10px; padding: 2px 8px; cursor: pointer; }\r\n.chat-thinking-dots { display: inline-flex; gap: 3px; }\r\n.chat-thinking-dots span {\r\n  width: 5px; height: 5px; background: var(--text3); border-radius: 50%;\r\n  animation: tpDot 1.2s infinite;\r\n}\r\n.chat-thinking-dots span:nth-child(2) { animation-delay: 0.2s; }\r\n.chat-thinking-dots span:nth-child(3) { animation-delay: 0.4s; }\r\n@keyframes tpDot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }\r\n.think-body { margin-top: 6px; border-top: 1px dashed #cbd5e1; padding-top: 6px; }\r\n.think-stream-label { font-size: 10px; color: var(--text3); }\r\n.think-stream {\r\n  font: 10.5px Consolas, Monaco, monospace; color: var(--text2); white-space: pre-wrap;\r\n  word-break: break-word; max-height: 140px; overflow-y: auto; background: #fff;\r\n  border-radius: 8px; padding: 6px 8px; border: 1px solid var(--tp-border);\r\n}\r\n\r\n/* ── Chat input ── */\r\n.chat-input-area { padding: 10px; border-top: 1px solid var(--tp-border); flex-shrink: 0; }\r\n.chat-target-chip {\r\n  display: flex; align-items: center; justify-content: space-between; gap: 8px;\r\n  background: #ecfeff; border: 1px solid #a5f3fc; color: var(--tp-deep);\r\n  border-radius: 9px; padding: 5px 10px; font-size: 11px; margin-bottom: 8px;\r\n}\r\n.chat-target-chip button { border: none; background: transparent; cursor: pointer; color: var(--tp-deep); font-size: 11px; }\r\n.chat-input-row { display: flex; gap: 6px; align-items: flex-end; }\r\n.chat-input {\r\n  flex: 1; resize: none; border: 1px solid var(--tp-border); border-radius: 10px;\r\n  padding: 9px 12px; font-family: inherit; font-size: 13px; line-height: 1.45;\r\n  min-height: 68px; max-height: 180px; outline: none;\r\n}\r\n.chat-input:focus { border-color: var(--tp-accent); box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.12); }\r\n\r\n/* ── Sessions list ── */\r\n.session-list { flex: 1; overflow-y: auto; padding: 10px; }\r\n.session-empty { color: var(--text3); font-size: 12px; text-align: center; padding: 24px 10px; line-height: 1.6; }\r\n.session-item {\r\n  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;\r\n  cursor: pointer; border: 1px solid transparent; margin-bottom: 4px;\r\n}\r\n.session-item:hover { background: #f8fafc; }\r\n.session-active { background: #ecfeff; border-color: #a5f3fc; }\r\n.session-dot { font-size: 9px; color: var(--tp-accent); }\r\n.session-info { flex: 1; min-width: 0; }\r\n.session-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n.session-time { font-size: 10.5px; color: var(--text3); }\r\n.session-name-input {\r\n  flex: 1; min-width: 0; font-size: 12.5px; padding: 3px 6px;\r\n  border: 1px solid var(--tp-accent); border-radius: 6px; outline: none; font-family: inherit;\r\n}\r\n.session-rename, .session-delete { border: none; background: transparent; cursor: pointer; color: var(--text3); font-size: 12px; padding: 2px 5px; border-radius: 6px; }\r\n.session-rename:hover { background: #e2e8f0; color: var(--tp-ink); }\r\n.session-delete:hover { background: #fee2e2; color: var(--danger); }\r\n\r\n/* ── Content tabs ── */\r\n.content-tabs {\r\n  display: flex; gap: 4px; padding: 8px 14px 0; background: var(--tp-bg); flex-shrink: 0;\r\n}\r\n.ctab {\r\n  border: 1px solid var(--tp-border); border-bottom: none; background: #fff;\r\n  padding: 8px 16px; font-size: 12.5px; cursor: pointer; border-radius: 10px 10px 0 0;\r\n  color: var(--text2); font-weight: 600;\r\n}\r\n.ctab.active { background: #fff; color: var(--tp-accent); border-color: var(--tp-border); box-shadow: inset 0 2px 0 var(--tp-accent); }\r\n.content-editors { flex: 1; min-height: 0; display: flex; }\r\n.content-editor { display: none; flex: 1; flex-direction: column; min-width: 0; background: #fff; }\r\n.content-editor.active { display: flex; }\r\n\r\n/* ── Itinerary ── */\r\n.trip-toolbar {\r\n  display: flex; align-items: center; gap: 10px; padding: 10px 16px;\r\n  border-bottom: 1px solid var(--tp-border); flex-wrap: wrap; flex-shrink: 0;\r\n}\r\n.trip-title-input {\r\n  border: none; border-bottom: 2px solid transparent; font-size: 17px; font-weight: 700;\r\n  padding: 3px 2px; outline: none; background: transparent; min-width: 180px; flex: 1; max-width: 420px;\r\n  font-family: inherit;\r\n}\r\n.trip-title-input:focus { border-bottom-color: var(--tp-accent); }\r\n.trip-meta-line { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--text2); margin-left: auto; }\r\n.trip-meta-line .meta-chip {\r\n  background: #f1f5f9; border-radius: 999px; padding: 3px 9px; white-space: nowrap;\r\n  border: 1px solid var(--tp-border);\r\n}\r\n.itinerary-scroll { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; background: var(--tp-bg); }\r\n.itinerary-empty, .essentials-empty { text-align: center; color: var(--text3); padding: 48px 16px; }\r\n.empty-icon { font-size: 46px; margin-bottom: 8px; }\r\n.itinerary-empty p, .essentials-empty p { margin: 4px 0; font-size: 13px; }\r\n.empty-sub { font-size: 11.5px !important; }\r\n.days-wrap { display: flex; flex-direction: column; gap: 14px; max-width: 860px; margin: 0 auto; }\r\n\r\n/* ── Day card ── */\r\n.tp-day-card { background: var(--tp-card); border: 1px solid var(--tp-border); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05); }\r\n.tp-day-head {\r\n  display: flex; align-items: center; gap: 10px; padding: 10px 14px;\r\n  background: linear-gradient(135deg, #ecfeff, #f0fdfa); border-bottom: 1px solid var(--tp-border);\r\n}\r\n.tp-day-num {\r\n  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;\r\n  background: linear-gradient(135deg, var(--tp-accent), var(--tp-accent2)); color: #fff;\r\n  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;\r\n}\r\n.tp-day-title-wrap { flex: 1; min-width: 0; }\r\n.tp-day-title { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n.tp-day-date { font-size: 11px; color: var(--text3); }\r\n.tp-day-head .btn-icon { flex-shrink: 0; }\r\n.tp-day-body { padding: 6px 14px 14px; }\r\n\r\n/* ── Timeline items ── */\r\n.tp-item { display: flex; gap: 10px; padding: 10px 0; position: relative; }\r\n.tp-item + .tp-item { border-top: 1px dashed #eef2f7; }\r\n.tp-item-ico {\r\n  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;\r\n  background: #f1f5f9; border: 1px solid var(--tp-border);\r\n  display: flex; align-items: center; justify-content: center; font-size: 15px; margin-top: 2px;\r\n}\r\n.tp-item-ico.transport { background: #e0f2fe; }\r\n.tp-item-ico.stay { background: #fce7f3; }\r\n.tp-item-ico.meal { background: #fef3c7; }\r\n.tp-item-ico.freeTime { background: #ecfccb; }\r\n.tp-item-ico.alert { background: #fee2e2; }\r\n.tp-item-main { flex: 1; min-width: 0; }\r\n.tp-item-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }\r\n.tp-item-time { font-size: 11px; font-weight: 700; color: var(--tp-accent); background: #ecfeff; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }\r\n.tp-item-title { font-size: 13px; font-weight: 700; }\r\n.tp-item-sub { font-size: 11.5px; color: var(--text2); margin-top: 2px; }\r\n.tp-item-desc { font-size: 12px; color: var(--text2); line-height: 1.55; margin-top: 4px; }\r\n.tp-item-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }\r\n.tp-chip {\r\n  font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: #f1f5f9;\r\n  border: 1px solid var(--tp-border); color: var(--text2); white-space: nowrap;\r\n}\r\n.tp-chip.cost { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }\r\n.tp-chip.booking { background: #fefce8; border-color: #fef08a; color: #a16207; }\r\n.tp-chip.tag { background: #e0f2fe; border-color: #bae6fd; color: #0369a1; }\r\n.tp-chip.essential { background: #ecfeff; border-color: #a5f3fc; color: var(--tp-deep); }\r\n.tp-chip.status-ready { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }\r\n.tp-chip.status-pending { background: #fefce8; border-color: #fef08a; color: #a16207; }\r\n.tp-chip.status-apply { background: #fee2e2; border-color: #fecaca; color: #b91c1c; }\r\n.tp-tips-list { margin: 6px 0 0; padding-left: 16px; font-size: 11.5px; color: var(--text2); line-height: 1.55; }\r\n.tp-tips-list li { margin-bottom: 2px; }\r\n.tp-alert-strip {\r\n  border-radius: 9px; padding: 7px 10px; font-size: 12px; margin-top: 6px; line-height: 1.5;\r\n}\r\n.tp-alert-strip.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }\r\n.tp-alert-strip.warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }\r\n.tp-alert-strip.danger { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }\r\n.tp-item-unknown {\r\n  background: #fff7ed; border: 1px dashed #fdba74; border-radius: 9px;\r\n  padding: 7px 10px; font-size: 11px; color: #9a3412; margin-top: 6px; font-family: Consolas, monospace;\r\n}\r\n\r\n/* ── Essentials ── */\r\n.essentials-toolbar { padding: 12px 16px 4px; flex-shrink: 0; }\r\n.essentials-toolbar h2 { margin: 0; font-size: 15px; }\r\n.essentials-hint { color: var(--text2); font-size: 11.5px; line-height: 1.55; margin: 4px 0 0; max-width: 720px; }\r\n.essentials-scroll { flex: 1; overflow-y: auto; padding: 12px 16px 16px; min-height: 0; background: var(--tp-bg); }\r\n.sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }\r\n.tp-section-card { background: var(--tp-card); border: 1px solid var(--tp-border); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05); }\r\n.tp-section-head { display: flex; align-items: center; gap: 9px; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid var(--tp-border); }\r\n.tp-section-ico { font-size: 17px; }\r\n.tp-section-title { font-weight: 700; font-size: 13px; flex: 1; }\r\n.tp-section-sub { font-size: 10.5px; color: var(--text3); }\r\n.tp-section-body { padding: 10px 14px 12px; }\r\n.tp-list-row { display: flex; gap: 9px; padding: 6px 0; border-bottom: 1px dashed #eef2f7; align-items: flex-start; }\r\n.tp-list-row:last-child { border-bottom: none; }\r\n.tp-list-row .ico { flex-shrink: 0; font-size: 13px; margin-top: 1px; }\r\n.tp-list-main { flex: 1; min-width: 0; }\r\n.tp-list-title { font-size: 12.5px; font-weight: 600; }\r\n.tp-list-text { font-size: 11.5px; color: var(--text2); line-height: 1.5; }\r\n.tp-list-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }\r\n.tp-phrase { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed #eef2f7; flex-wrap: wrap; }\r\n.tp-phrase:last-child { border-bottom: none; }\r\n.tp-phrase-orig { font-weight: 700; font-size: 12.5px; min-width: 90px; }\r\n.tp-phrase-trans { color: var(--text2); font-size: 12px; }\r\n.tp-phrase-phon { color: var(--text3); font-size: 10.5px; }\r\n.tp-budget-row { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed #eef2f7; }\r\n.tp-budget-row:last-of-type { border-bottom: none; }\r\n.tp-budget-label { flex: 1; font-size: 12px; }\r\n.tp-budget-cat { font-size: 10px; color: var(--text3); }\r\n.tp-budget-amount { font-weight: 700; font-size: 12px; white-space: nowrap; }\r\n.tp-budget-total {\r\n  margin-top: 8px; padding-top: 8px; border-top: 2px solid var(--tp-accent2);\r\n  display: flex; justify-content: space-between; font-weight: 700; font-size: 13px;\r\n}\r\n.tp-cat-sum { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); padding: 3px 0 3px 12px; }\r\n.tp-map-btn {\r\n  border: 1px solid var(--tp-border); background: #f8fafc; border-radius: 7px;\r\n  font-size: 10.5px; padding: 2px 8px; cursor: pointer; color: var(--tp-accent);\r\n}\r\n.tp-map-btn:hover { border-color: var(--tp-accent); }\r\n\r\n/* ── Export ── */\r\n.export-scroll { flex: 1; overflow-y: auto; padding: 16px; background: var(--tp-bg); }\r\n.export-header { max-width: 760px; margin: 0 auto 12px; }\r\n.export-header h2 { margin: 0 0 4px; font-size: 16px; }\r\n.export-header p { margin: 0; color: var(--text2); font-size: 12px; line-height: 1.55; }\r\n.export-row { display: flex; flex-wrap: wrap; gap: 8px; max-width: 760px; margin: 0 auto 12px; }\r\n.export-info { max-width: 760px; margin: 0 auto 14px; font-size: 11.5px; color: var(--text2); }\r\n.export-info .ok-line { color: var(--ok); }\r\n.export-info .warn-line { color: var(--warn); }\r\n.import-box {\r\n  max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid var(--tp-border);\r\n  border-radius: 12px; padding: 14px;\r\n}\r\n.import-label { font-size: 12.5px; font-weight: 700; display: block; margin-bottom: 6px; }\r\n.import-textarea {\r\n  width: 100%; border: 1px solid var(--tp-border); border-radius: 9px; padding: 9px;\r\n  font: 11.5px Consolas, Monaco, monospace; outline: none; resize: vertical; background: #f8fafc;\r\n}\r\n.import-textarea:focus { border-color: var(--tp-accent); }\r\n.import-actions { margin-top: 8px; display: flex; gap: 8px; }\r\n\r\n/* ── Confirm ── */\r\n.confirm-overlay {\r\n  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);\r\n  display: flex; align-items: center; justify-content: center; z-index: 100;\r\n}\r\n.confirm-box {\r\n  background: #fff; border-radius: 14px; padding: 20px; width: min(420px, 92%);\r\n  box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);\r\n}\r\n.confirm-message { font-size: 13.5px; line-height: 1.55; margin-bottom: 16px; }\r\n.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }\r\n\r\n/* ── Read-only ── */\r\nbody.readonly .tp-day-head .btn-icon { display: none !important; }\r\nbody.readonly #btn-add-day { display: none !important; }\r\nbody.readonly .import-actions { display: none !important; }\r\n\r\n/* ── Responsive ── */\r\n@media (max-width: 860px) {\r\n  .main-layout { flex-direction: column; }\r\n  .chat-panel { width: 100%; max-width: none; height: 44%; border-right: none; border-bottom: 1px solid var(--tp-border); }\r\n  .content-panel { height: 56%; }\r\n  .app-header { flex-wrap: wrap; }\r\n}"},"js":{"name":"TravelPlanner.js","src":"../app/TravelPlanner.js","content":"/* ═══════════════════════════════════════════════════════════\r\n   TRAVEL PLANNER — UniconHub html-tool\r\n   Chat-driven travel planning. The AI answers with JSON plans\r\n   built from the component catalog below; this tool renders\r\n   every component itself.\r\n   ═══════════════════════════════════════════════════════════ */\r\n'use strict';\r\n\r\n/* ── Tiny helpers ── */\r\nfunction esc(s) {\r\n  return String(s === null || s === undefined ? '' : s)\r\n    .replace(/&/g, '&amp;').replace(/<\/g, '&lt;')\r\n    .replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\r\n}\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction copyText(text) {\r\n  if (navigator.clipboard && navigator.clipboard.writeText) {\r\n    navigator.clipboard.writeText(text).then(function() {\r\n      try { tool.notify('Copied to clipboard', 'success'); } catch (e) {}\r\n    }, function() {\r\n      fallbackCopy(text);\r\n    });\r\n  } else {\r\n    fallbackCopy(text);\r\n  }\r\n}\r\nfunction fallbackCopy(text) {\r\n  try {\r\n    var ta = document.createElement('textarea');\r\n    ta.value = text;\r\n    ta.style.position = 'fixed';\r\n    ta.style.opacity = '0';\r\n    document.body.appendChild(ta);\r\n    ta.select();\r\n    document.execCommand('copy');\r\n    document.body.removeChild(ta);\r\n    try { tool.notify('Copied to clipboard', 'success'); } catch (e) {}\r\n  } catch (e) {\r\n    try { tool.notify('Copy failed — please copy manually', 'warning'); } catch (e2) {}\r\n  }\r\n}\r\nfunction fmtMoney(amount, currency) {\r\n  if (amount === null || amount === undefined || amount === '') return '';\r\n  var n = Number(amount);\r\n  if (isNaN(n)) return '';\r\n  var s = n.toLocaleString('en-US', { maximumFractionDigits: 2 });\r\n  return (currency ? String(currency) + ' ' : '') + s;\r\n}\r\nfunction fmtDate(d) {\r\n  try {\r\n    var t = new Date(String(d) + (String(d).length === 10 ? 'T00:00:00' : ''));\r\n    if (isNaN(t.getTime())) return String(d);\r\n    return t.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });\r\n  } catch (e) { return String(d); }\r\n}\r\nfunction slugify(s) {\r\n  var out = String(s || '').toLowerCase().normalize('NFKD').replace(/[\\u0300-\\u036f]/g, '')\r\n    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');\r\n  return out || 'travel-plan';\r\n}\r\nfunction daysBetween(startDate, endDate) {\r\n  try {\r\n    var a = new Date(startDate + 'T00:00:00');\r\n    var b = new Date(endDate + 'T00:00:00');\r\n    if (isNaN(a.getTime()) || isNaN(b.getTime())) return 0;\r\n    return Math.round((b.getTime() - a.getTime()) / 86400000) + 1;\r\n  } catch (e) { return 0; }\r\n}\r\n\r\n/* ═══════════════════════════════════════════════════════════\r\n   COMPONENT CATALOG — the ONLY building blocks the AI may use.\r\n   Each entry: icon, label, desc, fields, render(d).\r\n   ═══════════════════════════════════════════════════════════ */\r\nvar TRANSPORT_ICONS = {\r\n  flight: '✈️', train: '🚆', bus: '🚌', car: '🚗', taxi: '🚕',\r\n  ferry: '⛴️', metro: '🚇', tram: '🚋', walk: '🚶', bike: '🚲',\r\n  rental: '🔑', other: '🚐'\r\n};\r\nvar MEAL_ICONS = {\r\n  breakfast: '🥐', lunch: '🥗', dinner: '🍽️', snack: '🍿', coffee: '☕', other: '🍴'\r\n};\r\nvar STYLE_OPTIONS = ['mixed', 'relaxed', 'culture', 'adventure', 'beach', 'foodie', 'budget', 'luxury', 'nature', 'city'];\r\nvar TRAVELER_OPTIONS = ['solo', 'couple', 'friends', 'family', 'group'];\r\n\r\nvar DAY_COMPONENTS = {\r\n  activity: {\r\n    icon: '🎯', label: 'Activity', kind: 'day',\r\n    desc: 'A sightseeing stop, tour, museum, beach time, hike or experience.',\r\n    fields: '{title, time:\"HH:MM\", duration, location, description, cost, booking, tips:[], tags:[]}',\r\n    render: function(d) {\r\n      return tpItem('activity', '🎯', tpTime(d.time), esc(d.title || 'Activity'), sub(\r\n        (d.location ? '📍 ' + esc(d.location) : '') +\r\n        (d.duration ? (d.location ? ' · ' : '') + '⏱ ' + esc(d.duration) : '')\r\n      ), esc(d.description || ''), chips(\r\n        (d.cost !== undefined && d.cost !== null && d.cost !== '' ? chip(fmtMoney(d.cost, d.currency), 'cost') : '') +\r\n        (d.booking ? chip(esc(d.booking), 'booking') : '') +\r\n        (d.tags || []).map(function(t) { return chip(esc(t), 'tag'); }).join('')\r\n      ), tipsHtml(d.tips));\r\n    }\r\n  },\r\n  sightseeing: {\r\n    icon: '🏛️', label: 'Sightseeing', kind: 'day',\r\n    desc: 'A landmark, monument, viewpoint or cultural site to visit.',\r\n    fields: '{title, time, location, description, cost, tips:[]}',\r\n    render: function(d) {\r\n      return tpItem('sightseeing', '🏛️', tpTime(d.time), esc(d.title || 'Sightseeing'), sub(\r\n        (d.location ? '📍 ' + esc(d.location) : '')\r\n      ), esc(d.description || ''), chips(\r\n        (d.cost !== undefined && d.cost !== null && d.cost !== '' ? chip(fmtMoney(d.cost, d.currency), 'cost') : '') +\r\n        (d.booking ? chip(esc(d.booking), 'booking') : '')\r\n      ), tipsHtml(d.tips));\r\n    }\r\n  },\r\n  transport: {\r\n    icon: '🚆', label: 'Transport', kind: 'day',\r\n    desc: 'A journey leg: flight, train, bus, taxi, ferry, metro, walk, rental car…',\r\n    fields: '{mode:\"flight|train|bus|car|taxi|ferry|metro|tram|walk|bike|rental|other\", from, to, departure:\"HH:MM\", arrival:\"HH:MM\", ref, cost, booking, notes}',\r\n    render: function(d) {\r\n      var mode = String(d.mode || 'other').toLowerCase();\r\n      var ico = TRANSPORT_ICONS[mode] || '🚐';\r\n      var route = esc(d.from || '') + (d.from && d.to ? ' → ' : '') + esc(d.to || '');\r\n      var times = (d.departure ? esc(d.departure) : '') + (d.departure && d.arrival ? ' – ' : '') + (d.arrival ? esc(d.arrival) : '');\r\n      return tpItem('transport', ico, tpTime(d.departure), route || ('Transport'), sub(times), esc(d.notes || ''), chips(\r\n        (d.ref ? chip(esc(d.ref), 'booking') : '') +\r\n        (d.cost !== undefined && d.cost !== null && d.cost !== '' ? chip(fmtMoney(d.cost, d.currency), 'cost') : '') +\r\n        (d.booking ? chip(esc(d.booking), 'booking') : '')\r\n      ), '');\r\n    }\r\n  },\r\n  stay: {\r\n    icon: '🏨', label: 'Stay / Accommodation', kind: 'day',\r\n    desc: 'Where the traveler sleeps: hotel, apartment, hostel, resort, camp…',\r\n    fields: '{name, type:\"hotel|apartment|hostel|airbnb|resort|camp|other\", checkIn:\"HH:MM\", checkOut:\"HH:MM\", address, cost, booking, notes, rating:0-5}',\r\n    render: function(d) {\r\n      var stars = '';\r\n      var r = Number(d.rating);\r\n      if (!isNaN(r) && r > 0) stars = ' ' + '★'.repeat(Math.min(5, Math.round(r)));\r\n      var check = (d.checkIn ? 'Check-in ' + esc(d.checkIn) : '') +\r\n        (d.checkIn && d.checkOut ? ' · ' : '') + (d.checkOut ? 'Check-out ' + esc(d.checkOut) : '');\r\n      return tpItem('stay', '🏨', '', esc(d.name || 'Accommodation') + stars, sub(\r\n        (d.type ? esc(d.type) : '') + (d.type && check ? ' · ' : '') + check\r\n      ), esc(d.notes || ''), chips(\r\n        (d.address ? chip('📍 ' + esc(d.address), '') : '') +\r\n        (d.cost !== undefined && d.cost !== null && d.cost !== '' ? chip(fmtMoney(d.cost, d.currency), 'cost') : '') +\r\n        (d.booking ? chip(esc(d.booking), 'booking') : '')\r\n      ), '');\r\n    }\r\n  },\r\n  meal: {\r\n    icon: '🍽️', label: 'Meal / Food stop', kind: 'day',\r\n    desc: 'A breakfast, lunch, dinner, snack or coffee stop.',\r\n    fields: '{meal:\"breakfast|lunch|dinner|snack|coffee|other\", name, place, cuisine, cost, reservation, kidFriendly:bool, notes}',\r\n    render: function(d) {\r\n      var m = String(d.meal || 'other').toLowerCase();\r\n      var ico = MEAL_ICONS[m] || '🍴';\r\n      var title = esc(d.name || d.place || 'Meal');\r\n      return tpItem('meal', ico, tpTime(d.time), title, sub(\r\n        (d.place ? '📍 ' + esc(d.place) : '') +\r\n        (d.cuisine ? (d.place ? ' · ' : '') + esc(d.cuisine) : '')\r\n      ), esc(d.notes || ''), chips(\r\n        (d.kidFriendly ? chip('👶 kid-friendly', 'tag') : '') +\r\n        (d.reservation ? chip(esc(d.reservation), 'booking') : '') +\r\n        (d.cost !== undefined && d.cost !== null && d.cost !== '' ? chip(fmtMoney(d.cost, d.currency), 'cost') : '')\r\n      ), '');\r\n    }\r\n  },\r\n  freeTime: {\r\n    icon: '☕', label: 'Free time', kind: 'day',\r\n    desc: 'An unplanned block with optional suggestions (shopping, wandering, rest).',\r\n    fields: '{title, duration, suggestions:[], notes}',\r\n    render: function(d) {\r\n      var body = esc(d.notes || '');\r\n      if (d.suggestions && d.suggestions.length) {\r\n        body += '<ul class=\"tp-tips-list\">';\r\n        for (var i = 0; i < d.suggestions.length; i++) body += '<li>' + esc(d.suggestions[i]) + '<\/li>';\r\n        body += '<\/ul>';\r\n      }\r\n      return tpItem('freeTime', '☕', '', esc(d.title || 'Free time'), sub(d.duration ? '⏱ ' + esc(d.duration) : ''), body, '', '');\r\n    }\r\n  },\r\n  note: {\r\n    icon: '📝', label: 'Note', kind: 'day',\r\n    desc: 'A plain informational note for the day (reminders, addresses, names).',\r\n    fields: '{title, text}',\r\n    render: function(d) {\r\n      return tpItem('note', '📝', '', esc(d.title || 'Note'), '', esc(d.text || ''), '', '');\r\n    }\r\n  },\r\n  alert: {\r\n    icon: '⚠️', label: 'Alert', kind: 'day',\r\n    desc: 'A day-level warning: weather, closure, visa reminder, scam warning…',\r\n    fields: '{level:\"info|warning|danger\", text}',\r\n    render: function(d) {\r\n      var lvl = String(d.level || 'info').toLowerCase();\r\n      if (['info', 'warning', 'danger'].indexOf(lvl) === -1) lvl = 'info';\r\n      return '<div class=\"tp-item\"><div class=\"tp-item-ico alert\">⚠️<\/div><div class=\"tp-item-main\">' +\r\n        '<div class=\"tp-alert-strip ' + lvl + '\">' + esc(d.text || '') + '<\/div><\/div><\/div>';\r\n    }\r\n  }\r\n};\r\n\r\nvar SECTION_COMPONENTS = {\r\n  packing: {\r\n    icon: '🧳', label: 'Packing list', kind: 'section',\r\n    desc: 'What to pack, grouped by category.',\r\n    fields: '{items:[{name, category:\"Clothing|Toiletries|Documents|Electronics|Health|Kids|Other\", essential:bool, note}]}',\r\n    render: function(d) {\r\n      var items = (d.items || []).filter(function(x) { return x && (x.name || x.text); });\r\n      if (!items.length) return '<div class=\"tp-list-text\">Empty packing list.<\/div>';\r\n      var groups = {};\r\n      var order = [];\r\n      items.forEach(function(it) {\r\n        var cat = String(it.category || 'General').trim() || 'General';\r\n        if (!groups[cat]) { groups[cat] = []; order.push(cat); }\r\n        groups[cat].push(it);\r\n      });\r\n      var h = '';\r\n      for (var g = 0; g < order.length; g++) {\r\n        var cat = order[g];\r\n        h += '<div style=\"font-weight:700;font-size:11px;color:#0e7490;margin:8px 0 3px\">' + esc(cat) + '<\/div>';\r\n        for (var i = 0; i < groups[cat].length; i++) {\r\n          var it = groups[cat][i];\r\n          h += '<div class=\"tp-list-row\"><span class=\"ico\">' + (it.essential ? '✅' : '▫️') + '<\/span>' +\r\n            '<div class=\"tp-list-main\"><div class=\"tp-list-title\">' + esc(it.name || it.text) + '<\/div>' +\r\n            (it.note ? '<div class=\"tp-list-text\">' + esc(it.note) + '<\/div>' : '') + '<\/div>' +\r\n            (it.essential ? '<span class=\"tp-chip essential\">essential<\/span>' : '') + '<\/div>';\r\n        }\r\n      }\r\n      return h;\r\n    }\r\n  },\r\n  budget: {\r\n    icon: '💰', label: 'Budget breakdown', kind: 'section',\r\n    desc: 'Estimated costs per category with a total.',\r\n    fields: '{currency, items:[{label, amount, category}], notes}',\r\n    render: function(d) {\r\n      var items = (d.items || []).filter(function(x) { return x && (x.label || x.name); });\r\n      var cur = d.currency || DB.plan.budget.currency || '';\r\n      var h = '';\r\n      for (var i = 0; i < items.length; i++) {\r\n        var it = items[i];\r\n        var label = it.label || it.name;\r\n        var amt = it.amount !== undefined ? it.amount : it.cost;\r\n        h += '<div class=\"tp-budget-row\"><span class=\"tp-budget-label\">' + esc(label) +\r\n          (it.category ? ' <span class=\"tp-budget-cat\">' + esc(it.category) + '<\/span>' : '') + '<\/span>' +\r\n          '<span class=\"tp-budget-amount\">' + esc(fmtMoney(amt, cur)) + '<\/span><\/div>';\r\n      }\r\n      if (items.length > 1) {\r\n        var sums = {};\r\n        items.forEach(function(it) {\r\n          var c = String(it.category || 'Other');\r\n          var a = Number(it.amount !== undefined ? it.amount : it.cost) || 0;\r\n          sums[c] = (sums[c] || 0) + a;\r\n        });\r\n        var cats = Object.keys(sums);\r\n        if (cats.length > 1) {\r\n          for (var c2 = 0; c2 < cats.length; c2++) {\r\n            h += '<div class=\"tp-cat-sum\"><span>' + esc(cats[c2]) + '<\/span><span>' + esc(fmtMoney(sums[cats[c2]], cur)) + '<\/span><\/div>';\r\n          }\r\n        }\r\n      }\r\n      var total = 0;\r\n      items.forEach(function(it) { total += Number(it.amount !== undefined ? it.amount : it.cost) || 0; });\r\n      if (total > 0) {\r\n        h += '<div class=\"tp-budget-total\"><span>Estimated total<\/span><span>' + esc(fmtMoney(total, cur)) + '<\/span><\/div>';\r\n        var cnt = (DB.plan.travelers && DB.plan.travelers.count) ? Number(DB.plan.travelers.count) : 0;\r\n        if (cnt > 1) h += '<div class=\"tp-cat-sum\"><span>Per person<\/span><span>' + esc(fmtMoney(total / cnt, cur)) + '<\/span><\/div>';\r\n      }\r\n      if (d.notes) h += '<div class=\"tp-list-text\" style=\"margin-top:8px\">' + esc(d.notes) + '<\/div>';\r\n      return h || '<div class=\"tp-list-text\">No budget items yet.<\/div>';\r\n    }\r\n  },\r\n  documents: {\r\n    icon: '🛂', label: 'Documents & visas', kind: 'section',\r\n    desc: 'Passport, visa, insurance and other paperwork with a status.',\r\n    fields: '{items:[{name, status:\"apply|pending|ready\", note}]}',\r\n    render: function(d) {\r\n      var items = (d.items || []).filter(function(x) { return x && (x.name || x.title); });\r\n      if (!items.length) return '<div class=\"tp-list-text\">No documents listed.<\/div>';\r\n      var h = '';\r\n      for (var i = 0; i < items.length; i++) {\r\n        var it = items[i];\r\n        var st = String(it.status || '').toLowerCase();\r\n        var cls = 'status-' + (st === 'ready' || st === 'booked' || st === 'done' ? 'ready' : st === 'pending' ? 'pending' : st === 'apply' || st === 'required' || st === 'needed' ? 'apply' : 'pending');\r\n        h += '<div class=\"tp-list-row\"><span class=\"ico\">📄<\/span><div class=\"tp-list-main\">' +\r\n          '<div class=\"tp-list-title\">' + esc(it.name || it.title) + '<\/div>' +\r\n          (it.note ? '<div class=\"tp-list-text\">' + esc(it.note) + '<\/div>' : '') + '<\/div>' +\r\n          '<span class=\"tp-chip ' + cls + '\">' + esc(it.status || 'pending') + '<\/span><\/div>';\r\n      }\r\n      return h;\r\n    }\r\n  },\r\n  tips: {\r\n    icon: '💡', label: 'Local tips & customs', kind: 'section',\r\n    desc: 'Dos and don\\u2019ts, local etiquette, money, transport and safety tips.',\r\n    fields: '{items:[{title, text}]}',\r\n    render: function(d) {\r\n      var items = (d.items || []).filter(function(x) { return x && (x.title || x.text); });\r\n      if (!items.length) return '<div class=\"tp-list-text\">No tips yet.<\/div>';\r\n      var h = '';\r\n      for (var i = 0; i < items.length; i++) {\r\n        var it = items[i];\r\n        h += '<div class=\"tp-list-row\"><span class=\"ico\">💡<\/span><div class=\"tp-list-main\">' +\r\n          '<div class=\"tp-list-title\">' + esc(it.title || it.text) + '<\/div>' +\r\n          (it.title && it.text ? '<div class=\"tp-list-text\">' + esc(it.text) + '<\/div>' : '') + '<\/div><\/div>';\r\n      }\r\n      return h;\r\n    }\r\n  },\r\n  phrases: {\r\n    icon: '🗣️', label: 'Useful phrases', kind: 'section',\r\n    desc: 'Key phrases in the local language with translation and pronunciation.',\r\n    fields: '{language, items:[{phrase, translation, phonetic}]}',\r\n    render: function(d) {\r\n      var items = (d.items || [ t(prompt.length, function() {\r\n    if (settled) return;\r\n    settled = true;\r\n    console.warn('[TRAVELPLANNER:TIMEOUT] batch AI got no callback (prompt ' + prompt.length + ' chars)');\r\n    _aiCallActive = false;\r\n    hideThinkingBubble();\r\n    _setAiUIActive(false);\r\n    addChatMessage('ai', '⏰ **The AI service did not respond within 10 minutes.** The gateway handles only 1 request at a time and queues the rest — but a wait this long usually means AI is not enabled for this tool. Verify \"allowAi\": \"yes\" in the field settings, check the console for [TRAVELPLANNER:AI] logs, then press Send to try again.', { isError: true });\r\n    updateConnStatus('error');\r\n    tool.resize();\r\n  });\r\n}\r\n\r\n/* ═══════════════════════════════════════════════════════════\r\n   SESSION CRUD (ai-chat-sessions-uniconbaseapps)\r\n   ═══════════════════════════════════════════════════════════ */\r\nvar SESSION_TYPE = 'ai-chat-sessions-uniconbaseapps';\r\nvar CHAT_CACHE_MAX = 20;\r\nvar CHAT_CACHE_TEXT_MAX = 2000;\r\nvar _sessions = [];\r\nvar _sessionsLoaded = false;\r\nvar _sessionWarnShown = false;\r\n\r\nfunction _resolveInstanceId() {\r\n  if (DB._instanceId) return DB._instanceId;\r\n  var parentId = DB._parentRecordId || '';\r\n  if (!parentId) {\r\n    try {\r\n      var m = (window.location.search || '').match(/[?&](?:objectId|recordId|id)=([^&?#]+)/);\r\n      if (m) parentId = decodeURIComponent(m[1]);\r\n    } catch (e) {}\r\n  }\r\n  if (!parentId) {\r\n    try {\r\n      var f = tool.getFields();\r\n      if (f && (f._id || f.id)) parentId = String(f._id || f.id);\r\n    } catch (e) {}\r\n  }\r\n  if (!parentId) { try { var p1 = tool.param('objectId', ''); if (p1) parentId = String(p1); } catch (e) {} }\r\n  if (!parentId) { try { var p2 = tool.param('recordId', ''); if (p2) parentId = String(p2); } catch (e) {} }\r\n  DB._instanceId = parentId ? ('rec_' + parentId) : 'inst_unknown';\r\n  try { persist(); } catch (e) {}\r\n  return DB._instanceId;\r\n}\r\n\r\nfunction _toolInstanceId() {\r\n  var myId = _resolveInstanceId();\r\n  var parentId = (myId && myId.indexOf('rec_') === 0) ? myId.substring(4) : (DB._parentRecordId || 'unknown');\r\n  return 'travel_' + parentId;\r\n}\r\n\r\nfunction _warnSessionStorage(msg) {\r\n  if (_sessionWarnShown) return;\r\n  _sessionWarnShown = true;\r\n  console.warn('[TRAVELPLANNER:SESSION] ' + msg);\r\n  try {\r\n    tool.notify('⚠ Chat history storage unavailable — messages are cached inside the record until it is fixed. Check allowObjectCRUD: yes and the ai-chat-sessions-uniconbaseapps type in field settings.', 'warning');\r\n  } catch (e) {}\r\n}\r\n\r\nfunction loadSessions(callback) {\r\n  try {\r\n    tool.requestObjects('query', { mainObjectType: SESSION_TYPE }, function(err, result) {\r\n      if (err) { _warnSessionStorage('Query error: ' + err); _sessions = []; }\r\n      else {\r\n        var all = (result && result.objects) ? result.objects : [];\r\n        var myId = _toolInstanceId();\r\n        var myRec = _resolveInstanceId();\r\n        _sessions = [];\r\n        for (var i = 0; i < all.length; i++) {\r\n          var obj = all[i];\r\n          var pd = obj.productData || {};\r\n          var dcb = pd.data_categoriesBased || {};\r\n          if (dcb._toolInstanceId === myId ||\r\n              (myId !== 'travel_unknown' && dcb._toolInstanceId && String(dcb._toolInstanceId).indexOf(myId) === 0)) {\r\n            _sessions.push(obj);\r\n          } else if (!dcb._toolInstanceId && obj._parentObjectId && DB._parentRecordId && obj._parentObjectId === DB._parentRecordId) {\r\n            _sessions.push(obj);\r\n            tool.requestObjects('update', {\r\n              mainObjectType: SESSION_TYPE,\r\n              objectId: obj.id,\r\n              productData: { data_categoriesBased: { _toolInstanceId: myId } }\r\n            }, function() {});\r\n          } else if (!dcb._toolInstanceId && obj._parentObjectId && myRec !== 'inst_unknown') {\r\n            /* adopt legacy sessions for this record */\r\n            _sessions.push(obj);\r\n            tool.requestObjects('update', {\r\n              mainObjectType: SESSION_TYPE,\r\n              objectId: obj.id,\r\n              productData: { data_categoriesBased: { _toolInstanceId: myId } }\r\n            }, function() {});\r\n          }\r\n        }\r\n      }\r\n      _sessionsLoaded = true;\r\n      if (callback) callback(_sessions);\r\n    });\r\n  } catch (e) {\r\n    _warnSessionStorage('query threw: ' + e.message);\r\n    _sessions = [];\r\n    _sessionsLoaded = true;\r\n    if (callback) callback([]);\r\n  }\r\n}\r\n\r\nfunction createSession(callback) {\r\n  var user = getUserSafe() || {};\r\n  try {\r\n    tool.requestObjects('create', {\r\n      mainObjectType: SESSION_TYPE,\r\n      name: 'New Chat',\r\n      productData: {\r\n        data_categoriesBased: {\r\n          messages: [],\r\n          createdAt: new Date().toISOString(),\r\n          updatedAt: new Date().toISOString(),\r\n          createdBy: { userId: user.id || 'anon', userName: user.name || 'Anonymous' },\r\n          _toolInstanceId: _toolInstanceId()\r\n        }\r\n      }\r\n    }, function(err, result) {\r\n      if (err) { _warnSessionStorage('create error: ' + err); if (callback) callback(null); return; }\r\n      var session = result.object;\r\n      if (session._parentObjectId && !DB._parentRecordId) DB._parentRecordId = session._parentObjectId;\r\n      _sessions.unshift(session);\r\n      if (callback) callback(session);\r\n    });\r\n  } catch (e) {\r\n    _warnSessionStorage('create threw: ' + e.message);\r\n    if (callback) callback(null);\r\n  }\r\n}\r\n\r\nfunction saveCurrentSession(callback) {\r\n  if (!DB.activeSessionId) { if (callback) callback(null); return; }\r\n  try {\r\n    var session = null;\r\n    for (var si = 0; si < _sessions.length; si++) {\r\n      if (_sessions[si].id === DB.activeSessionId) { session = _sessions[si]; break; }\r\n    }\r\n    var oldDcb =
