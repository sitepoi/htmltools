\t\t\t\t\t\t<label class=\"pp-label\" for=\"f-financialNotes\">Financial notes<\/label>\r\n\t\t\t\t\t\t<textarea class=\"pp-input pp-textarea\" id=\"f-financialNotes\" rows=\"3\" placeholder=\"Costs, budget or aid already secured\"><\/textarea>\r\n\t\t\t\t\t<\/div>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/section>\r\n\r\n\t\t\t<div class=\"pp-pager\" id=\"pp-pager\"><\/div>\r\n\r\n\t\t<\/main>\r\n\t<\/div>\r\n\r\n\t<!-- Modal for custom sections -->\r\n\t<div class=\"pp-modal-overlay\" id=\"pp-modal-overlay\">\r\n\t\t<div class=\"pp-modal\" id=\"pp-modal\">\r\n\t\t\t<div class=\"pp-modal-header\">\r\n\t\t\t\t<h3 class=\"pp-modal-title\" id=\"pp-modal-title\"><\/h3>\r\n\t\t\t\t<button type=\"button\" class=\"pp-btn pp-btn-icon pp-modal-close\" id=\"pp-modal-close\">✕<\/button>\r\n\t\t\t<\/div>\r\n\t\t\t<div class=\"pp-modal-body\" id=\"pp-modal-body\"><\/div>\r\n\t\t\t<div class=\"pp-modal-footer\">\r\n\t\t\t\t<button class=\"pp-btn pp-btn-secondary\" id=\"pp-modal-cancel\">Cancel<\/button>\r\n\t\t\t\t<button class=\"pp-btn pp-btn-primary\" id=\"pp-modal-save\">Save<\/button>\r\n\t\t\t<\/div>\r\n\t\t<\/div>\r\n\t<\/div>\r\n\r\n\t<!-- Share and export drawer -->\r\n\t<div class=\"pp-drawer-overlay\" id=\"pp-drawer-overlay\"><\/div>\r\n\t<aside class=\"pp-drawer\" id=\"pp-drawer\" aria-hidden=\"true\" aria-labelledby=\"pp-drawer-title\">\r\n\t\t<header class=\"pp-drawer-head\">\r\n\t\t\t<div class=\"pp-drawer-title-group\">\r\n\t\t\t\t<h2 class=\"pp-drawer-title\" id=\"pp-drawer-title\">Share &amp; export<\/h2>\r\n\t\t\t\t<p class=\"pp-drawer-sub\">Built from this record only - nothing leaves until you copy or download it.<\/p>\r\n\t\t\t<\/div>\r\n\t\t\t<button type=\"button\" class=\"pp-btn pp-btn-icon\" id=\"pp-drawer-close\" aria-label=\"Close share and export\">✕<\/button>\r\n\t\t<\/header>\r\n\t\t<div class=\"pp-drawer-body\">\r\n\t\t\t<div class=\"pp-share-card\">\r\n\t\t\t\t<h3 class=\"pp-subsection-title\">Profile readiness<\/h3>\r\n\t\t\t\t<ul class=\"pp-readiness-list\" id=\"pp-readiness-list\"><\/ul>\r\n\t\t\t<\/div>\r\n\t\t\t<div class=\"pp-share-card\">\r\n\t\t\t\t<h3 class=\"pp-subsection-title\">Export<\/h3>\r\n\t\t\t\t<label class=\"pp-checkbox-label\"><input type=\"checkbox\" id=\"f-export-sensitive\"> Include sensitive sections<\/label>\r\n\t\t\t\t<p class=\"pp-field-help\">Adds personal details, identity, health, funding and document numbers to the export. The summary text never includes them.<\/p>\r\n\t\t\t\t<div class=\"pp-share-actions\">\r\n\t\t\t\t\t<button type=\"button\" class=\"pp-btn\" data-action=\"copy-summary\">Copy summary<\/button>\r\n\t\t\t\t\t<button type=\"button\" class=\"pp-btn\" data-action=\"copy-json\">Copy JSON<\/button>\r\n\t\t\t\t\t<button type=\"button\" class=\"pp-btn pp-btn-primary\" data-action=\"download-json\">Download JSON<\/button>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/div>\r\n\t\t\t<div class=\"pp-field\">\r\n\t\t\t\t<label class=\"pp-label\" for=\"pp-output-preview\">Summary preview<\/label>\r\n\t\t\t\t<pre class=\"pp-output-preview\" id=\"pp-output-preview\"><\/pre>\r\n\t\t\t<\/div>\r\n\t\t<\/div>\r\n\t<\/aside>\r\n\r\n<\/div>\r\n"},"css":{"name":"PersonalProfile.css","src":"../app/PersonalProfile.css","content":"/* ── Personal Profile - design system ──\r\n   Light shell with a complete dark token set. Every component reads from\r\n   tokens, so the header theme toggle works everywhere.\r\n──────────────────────────────────────── */\r\n\r\n:root {\r\n\t--pp-bg: #f4f6fb;\r\n\t--pp-surface: #ffffff;\r\n\t--pp-surface-2: #f8fafc;\r\n\t--pp-surface-3: #f1f5f9;\r\n\t--pp-line: #e4e9f3;\r\n\t--pp-line-soft: #eef2f8;\r\n\t--pp-line-strong: #d5ddec;\r\n\r\n\t--pp-ink: #0f172a;\r\n\t--pp-ink-2: #475569;\r\n\t--pp-ink-3: #86909f;\r\n\r\n\t--pp-accent: #0f766e;\r\n\t--pp-accent-strong: #115e59;\r\n\t--pp-accent-soft: #ecfdf5;\r\n\t--pp-accent-soft-2: #d1fae5;\r\n\t--pp-accent-line: #99f6e4;\r\n\r\n\t--pp-success: #15803d;\r\n\t--pp-success-soft: #ecfdf5;\r\n\t--pp-warning: #b45309;\r\n\t--pp-warning-soft: #fffbeb;\r\n\t--pp-danger: #b91c1c;\r\n\t--pp-danger-soft: #fef2f2;\r\n\r\n\t--pp-radius-sm: 8px;\r\n\t--pp-radius: 12px;\r\n\t--pp-radius-lg: 16px;\r\n\r\n\t--pp-shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);\r\n\t--pp-shadow: 0 1px 3px rgba(15, 23, 42, .07), 0 8px 24px rgba(15, 23, 42, .05);\r\n\t--pp-shadow-lg: 0 24px 60px rgba(15, 23, 42, .18);\r\n\r\n\t--pp-sidebar-w: 272px;\r\n\t--pp-header-h: 60px;\r\n\t--pp-transition: .16s cubic-bezier(.4, 0, .2, 1);\r\n\t--pp-font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;\r\n\t--pp-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;\r\n}\r\n\r\n#app.pp-dark {\r\n\t--pp-bg: #0b1220;\r\n\t--pp-surface: #111a2e;\r\n\t--pp-surface-2: #0e1729;\r\n\t--pp-surface-3: #162034;\r\n\t--pp-line: #22304d;\r\n\t--pp-line-soft: #1b2740;\r\n\t--pp-line-strong: #2d3d5e;\r\n\r\n\t--pp-ink: #e9eefb;\r\n\t--pp-ink-2: #a9b6cf;\r\n\t--pp-ink-3: #7f8da8;\r\n\r\n\t--pp-accent: #2dd4bf;\r\n\t--pp-accent-strong: #99f6e4;\r\n\t--pp-accent-soft: #0f2e2b;\r\n\t--pp-accent-soft-2: #14403c;\r\n\t--pp-accent-line: #1f6159;\r\n\r\n\t--pp-success: #4ade80;\r\n\t--pp-success-soft: #10281d;\r\n\t--pp-warning: #fbbf24;\r\n\t--pp-warning-soft: #2a2110;\r\n\t--pp-danger: #f87171;\r\n\t--pp-danger-soft: #2c1418;\r\n\r\n\t--pp-shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);\r\n\t--pp-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .25);\r\n\t--pp-shadow-lg: 0 30px 70px rgba(0, 0, 0, .5);\r\n}\r\n\r\n/* ── Reset ── */\r\n#app { font-family: var(--pp-font); background: var(--pp-bg); color: var(--pp-ink); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }\r\n#app *, #app *::before, #app *::after { box-sizing: border-box; }\r\n#app input, #app textarea, #app select, #app button { font-family: inherit; font-size: inherit; }\r\n#app button { cursor: pointer; }\r\n#app input:focus, #app textarea:focus, #app select:focus { outline: none; }\r\n#app h1, #app h2, #app h3, #app p { margin: 0; }\r\n\r\n/* ── Icons ── */\r\n.pp-ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; flex-shrink: 0; }\r\n\r\n/* ── Header ── */\r\n.pp-header {\r\n\tposition: sticky; top: 0; z-index: 60;\r\n\tdisplay: flex; align-items: center; justify-content: space-between; gap: 16px;\r\n\theight: var(--pp-header-h); padding: 0 20px;\r\n\tbackground: var(--pp-surface); border-bottom: 1px solid var(--pp-line);\r\n}\r\n.pp-header-left { display: flex; align-items: center; gap: 11px; min-width: 0; }\r\n.pp-logo {\r\n\twidth: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;\r\n\tdisplay: grid; place-items: center; color: #fff;\r\n\tbackground: linear-gradient(135deg, #0f766e 0%, #0891b2 55%, #6366f1 100%);\r\n\tbox-shadow: 0 6px 16px rgba(15, 118, 110, .28);\r\n}\r\n.pp-logo .pp-ico { width: 18px; height: 18px; stroke-width: 1.8; }\r\n.pp-title-group { display: flex; flex-direction: column; min-width: 0; }\r\n.pp-app-title { font-size: 13px; font-weight: 700; letter-spacing: -.2px; color: var(--pp-ink); line-height: 1.25; }\r\n.pp-app-sub { font-size: 10.5px; font-weight: 500; color: var(--pp-ink-3); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.pp-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }\r\n\r\n.pp-save-indicator {\r\n\tdisplay: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;\r\n\tborder: 1px solid var(--pp-line); border-radius: 999px; background: var(--pp-surface-2);\r\n\tfont-size: 10.5px; font-weight: 500; color: var(--pp-ink-3);\r\n}\r\n.pp-save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pp-success); flex-shrink: 0; }\r\n.pp-save-indicator.saving .pp-save-dot { background: var(--pp-warning); animation: pp-pulse 1s infinite; }\r\n.pp-save-indicator.saving .pp-save-text { color: var(--pp-warning); }\r\n@keyframes pp-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }\r\n\r\n.pp-completion {\r\n\tdisplay: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px 0 5px;\r\n\tborder: 1px solid var(--pp-line); border-radius: 999px; background: var(--pp-surface-2);\r\n}\r\n.pp-ring { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: conic-gradient(var(--pp-accent) 0%, var(--pp-line) 0%); transition: background .4s ease; }\r\n.pp-ring-inner { width: 22px; height: 22px; border-radius: 50%; background: var(--pp-surface); display: grid; place-items: center; font-size: 8.5px; font-weight: 700; color: var(--pp-ink-2); }\r\n.pp-completion-text { display: flex; flex-direction: column; line-height: 1.15; }\r\n.pp-completion-text strong { font-size: 10.5px; font-weight: 700; color: var(--pp-ink); }\r\n.pp-completion-text span { font-size: 9px; color: var(--pp-ink-3); }\r\n\r\n/* ── Avatar and account menu ── */\r\n.pp-avatar {\r\n\tdisplay: grid; place-items: center; flex-shrink: 0;\r\n\tborder-radius: 50%; overflow: hidden;\r\n\tbackground: linear-gradient(135deg, #0f766e 0%, #0891b2 55%, #6366f1 100%) center / cover no-repeat;\r\n\tcolor: #fff; font-weight: 700; letter-spacing: .3px; line-height: 1;\r\n}\r\n.pp-avatar .pp-avatar-initials { display: none; }\r\n.pp-avatar:not(.has-photo) .pp-avatar-initials { display: block; }\r\n.pp-avatar-sm { width: 32px; height: 32px; font-size: 11px; }\r\n.pp-avatar-md { width: 40px; height: 40px; font-size: 13px; }\r\n.pp-avatar-lg { width: 84px; height: 84px; font-size: 27px; border: 2px solid var(--pp-surface); box-shadow: var(--pp-shadow); }\r\n.pp-account { position: relative; }\r\n.pp-account-btn {\r\n\tdisplay: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 4px;\r\n\tborder: 1px solid var(--pp-line); border-radius: 999px; background: var(--pp-surface-2); color: var(--pp-ink);\r\n}\r\n.pp-account-btn:hover { border-color: var(--pp-line-strong); background: var(--pp-surface); }\r\n.pp-account-text { display: flex; flex-direction: column; min-width: 0; text-align: left; line-height: 1.2; }\r\n.pp-account-text strong, .pp-account-text span { max-width: 148px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.pp-account-text strong { font-size: 11px; font-weight: 700; }\r\n.pp-account-text span { font-size: 9px; color: var(--pp-ink-3); }\r\n.pp-account-caret { display: flex; color: var(--pp-ink-3); }\r\n.pp-account-caret .pp-ico { width: 13px; height: 13px; }\r\n.pp-menu {\r\n\tposition: absolute; top: calc(100% + 8px); right: 0; z-index: 120; width: 260px; padding: 8px;\r\n\tbackground: var(--pp-surface); border: 1px solid var(--pp-line); border-radius: 14px; box-shadow: var(--pp-shadow-lg);\r\n}\r\n.pp-menu[hidden] { display: none; }\r\n.pp-menu-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; padding: 8px 8px 10px; border-bottom: 1px solid var(--pp-line-soft); }\r\n.pp-menu-head-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }\r\n.pp-menu-head-text strong, .pp-menu-head-text span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.pp-menu-head-text strong { font-size: 12px; font-weight: 700; color: var(--pp-ink); }\r\n.pp-menu-head-text span { font-size: 10px; color: var(--pp-ink-3); }\r\n.pp-menu-item {\r\n\tdisplay: flex; align-items: center; gap: 9px; width: 100%; padding: 8px;\r\n\tborder: 0; border-radius: 8px; background: transparent;\r\n\tfont-size: 11.5px; font-weight: 500; color: var(--pp-ink); text-align: left;\r\n}\r\n.pp-menu-item:hover { background: var(--pp-surface-2); }\r\n.pp-menu-ico { display: flex; color: var(--pp-ink-3); }\r\n.pp-menu-ico .pp-ico { width: 14px; height: 14px; }\r\n.pp-menu-sep { height: 1px; margin: 6px 4px; background: var(--pp-line-soft); }\r\n\r\n/* ── Buttons ── */\r\n.pp-btn {\r\n\tdisplay: inline-flex; align-items: center; justify-content: center; gap: 6px;\r\n\tmin-height: 34px; padding: 7px 14px;\r\n\tborder: 1px solid var( r(--pp-accent-soft); }\r\n.pp-custom-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }\r\n.pp-custom-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pp-accent-strong); }\r\n.pp-custom-note { font-size: 10px; color: var(--pp-ink-3); }\r\n.pp-custom-rows { display: flex; flex-direction: column; gap: 7px; }\r\n.pp-custom-row { display: grid; grid-template-columns: minmax(120px, 1.1fr) 120px minmax(140px, 1.8fr) 30px; gap: 7px; align-items: center; }\r\n.pp-custom-row-head { font-size: 9px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--pp-ink-3); }\r\n.pp-custom-row .pp-input { min-height: 32px; padding: 5px 8px; font-size: 11.5px; }\r\n.pp-custom-row .pp-textarea { min-height: 52px; }\r\n.pp-custom-remove { width: 28px; height: 28px; min-height: 28px; padding: 0; border-color: transparent; background: transparent; color: var(--pp-ink-3); }\r\n.pp-custom-remove:hover { background: var(--pp-danger-soft); color: var(--pp-danger); }\r\n\r\n/* ── Identity head with the photo card ── */\r\n.pp-identity-head { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 18px; align-items: start; }\r\n.pp-identity-fields { display: flex; flex-direction: column; gap: 12px; min-width: 0; }\r\n.pp-identity-fields .pp-field-row { margin: 0; }\r\n.pp-photo-field { min-width: 0; }\r\n.pp-photo-card {\r\n\tdisplay: flex; flex-direction: column; align-items: center; gap: 9px;\r\n\tpadding: 16px 14px 14px; border: 1px dashed var(--pp-line-strong); border-radius: 14px;\r\n\tbackground: var(--pp-surface-2); text-align: center;\r\n}\r\n.pp-photo-copy { display: flex; flex-direction: column; gap: 5px; align-items: center; width: 100%; }\r\n.pp-photo-title { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pp-ink-2); }\r\n.pp-photo-hint { font-size: 10px; line-height: 1.45; color: var(--pp-ink-3); }\r\n.pp-photo-actions { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }\r\n.pp-photo-url-wrap { width: 100%; margin-top: 3px; }\r\n.pp-photo-url { width: 100%; }\r\n\r\n/* ── Share and export drawer ── */\r\n.pp-drawer-overlay {\r\n\tposition: fixed; inset: 0; z-index: 150; background: rgba(15, 23, 42, .42);\r\n\topacity: 0; pointer-events: none; transition: opacity var(--pp-transition);\r\n}\r\n.pp-drawer-overlay.open { opacity: 1; pointer-events: auto; }\r\n.pp-drawer {\r\n\tposition: fixed; top: 0; right: 0; bottom: 0; z-index: 160;\r\n\twidth: min(440px, 100vw); display: flex; flex-direction: column;\r\n\tbackground: var(--pp-surface); border-left: 1px solid var(--pp-line); box-shadow: var(--pp-shadow-lg);\r\n\ttransform: translateX(102%); transition: transform .22s cubic-bezier(.4, 0, .2, 1);\r\n}\r\n.pp-drawer.open { transform: none; }\r\n.pp-drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--pp-line); }\r\n.pp-drawer-title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: var(--pp-ink); }\r\n.pp-drawer-sub { margin-top: 3px; font-size: 10.5px; line-height: 1.45; color: var(--pp-ink-3); }\r\n.pp-drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 26px; display: flex; flex-direction: column; gap: 14px; }\r\n.pp-drawer-body > .pp-field { margin: 0; }\r\n.pp-drawer .pp-output-preview { max-height: none; }\r\n\r\n/* ── Share section ── */\r\n.pp-share-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }\r\n.pp-share-card { padding: 14px 15px; border: 1px solid var(--pp-line); border-radius: 12px; background: var(--pp-surface-2); }\r\n.pp-share-card .pp-subsection-title { margin-bottom: 10px; }\r\n.pp-readiness-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }\r\n.pp-readiness-item { display: flex; align-items: flex-start; gap: 7px; font-size: 11px; line-height: 1.45; color: var(--pp-ink-2); }\r\n.pp-readiness-item .pp-ico { width: 13px; height: 13px; margin-top: 1px; color: var(--pp-ink-3); }\r\n.pp-readiness-item.is-done .pp-ico { color: var(--pp-success); stroke-width: 2.6; }\r\n.pp-readiness-item.is-missing .pp-ico { color: var(--pp-warning); }\r\n.pp-readiness-item strong { font-weight: 600; color: var(--pp-ink); }\r\n.pp-share-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }\r\n.pp-output-preview {\r\n\tmargin: 0; padding: 13px 14px; max-height: 320px; overflow: auto;\r\n\tborder: 1px solid var(--pp-line); border-radius: 10px;\r\n\tbackground: var(--pp-surface-3); color: var(--pp-ink-2);\r\n\tfont-family: var(--pp-mono); font-size: 10.5px; line-height: 1.6;\r\n\twhite-space: pre-wrap; word-break: break-word;\r\n}\r\n\r\n/* ── Read-only ── */\r\n.pp-readonly .pp-input { background: var(--pp-surface-2); color: var(--pp-ink-2); pointer-events: none; }\r\n.pp-readonly .pp-btn-add,\r\n.pp-readonly .pp-array-item-actions,\r\n.pp-readonly #pp-scope-toggle,\r\n.pp-readonly .pp-custom-remove,\r\n.pp-readonly .pp-share-actions,\r\n.pp-readonly [data-apply-preset] { display: none !important; }\r\n.pp-readonly .pp-focus-chip { pointer-events: none; opacity: .8; }\r\n.pp-readonly .pp-array-item { background: var(--pp-surface-2); }\r\n.pp-readonly .pp-stmt-edit { display: none !important; }\r\n.pp-readonly .pp-array-item.is-collapsed .pp-array-item-body { display: flex; }\r\n.pp-readonly .pp-array-item.is-collapsed .pp-array-item-header { border-bottom: 1px dashed var(--pp-line-soft); padding-bottom: 9px; margin-bottom: 10px; }\r\n.pp-readonly .pp-photo-actions { display: none; }\r\n.pp-readonly #pp-add-custom-section { display: none; }\r\n\r\n/* ── Modal ── */\r\n.pp-modal-overlay {\r\n\tdisplay: none; position: fixed; inset: 0; z-index: 200;\r\n\talign-items: center; justify-content: center;\r\n\tbackground: rgba(15, 23, 42, .45); backdrop-filter: blur(3px);\r\n}\r\n.pp-modal-overlay.open { display: flex; }\r\n.pp-modal {\r\n\twidth: 90%; max-width: 680px; max-height: 85vh;\r\n\tdisplay: flex; flex-direction: column; overflow: hidden;\r\n\tbackground: var(--pp-surface); border: 1px solid var(--pp-line);\r\n\tborder-radius: var(--pp-radius-lg); box-shadow: var(--pp-shadow-lg);\r\n\tanimation: pp-modal-in .2s ease;\r\n}\r\n@keyframes pp-modal-in { from { opacity: 0; transform: scale(.96) translateY(10px); } to { opacity: 1; transform: none; } }\r\n.pp-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--pp-line); }\r\n.pp-modal-title { font-size: 14px; font-weight: 700; color: var(--pp-ink); }\r\n.pp-modal-body { flex: 1; overflow-y: auto; padding: 20px; }\r\n.pp-modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--pp-line); background: var(--pp-surface-2); }\r\n.pp-modal-danger { margin-top: 20px; padding-top: 14px; border-top: 1px dashed var(--pp-line); }\r\n\r\n/* ── Pager ── */\r\n.pp-pager {\r\n\tdisplay: flex; align-items: center; justify-content: space-between; gap: 12px;\r\n\tpadding: 4px 2px;\r\n}\r\n.pp-pager:empty { display: none; }\r\n.pp-pager-btn {\r\n\tdisplay: inline-flex; align-items: center; gap: 9px;\r\n\tpadding: 8px 13px; border: 1px solid var(--pp-line); border-radius: 10px;\r\n\tbackground: var(--pp-surface); color: var(--pp-ink-2); text-align: left;\r\n\ttransition: border-color var(--pp-transition), background var(--pp-transition);\r\n}\r\n.pp-pager-btn:hover { border-color: var(--pp-accent-line); background: var(--pp-surface-2); }\r\n.pp-pager-text { display: flex; flex-direction: column; line-height: 1.25; }\r\n.pp-pager-eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pp-ink-3); }\r\n.pp-pager-text strong { font-size: 11.5px; font-weight: 600; color: var(--pp-ink); }\r\n.pp-pager-count { font-size: 10.5px; font-weight: 600; color: var(--pp-ink-3); }\r\n.pp-pager-next { text-align: right; }\r\n\r\n/* ── Responsive ── */\r\n@media (max-width: 1000px) {\r\n\t:root { --pp-sidebar-w: 232px; }\r\n\t.pp-main { padding: 18px 16px 36px; }\r\n\t.pp-account-text { display: none; }\r\n\t.pp-account-btn { padding: 0 8px 0 4px; gap: 5px; }\r\n}\r\n@media (max-width: 820px) {\r\n\t.pp-layout { flex-direction: column; }\r\n\t.pp-sidebar {\r\n\t\tposition: static; width: 100%; height: auto;\r\n\t\tborder-right: 0; border-bottom: 1px solid var(--pp-line);\r\n\t\tpadding: 12px;\r\n\t}\r\n\t.pp-nav { flex: 0 0 auto; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }\r\n\t.pp-nav-group { display: none; }\r\n\t.pp-nav-item { width: auto; flex: 0 0 auto; white-space: nowrap; }\r\n\t.pp-nav-label { max-width: 160px; }\r\n\t.pp-sidebar-foot { flex-direction: row; flex-wrap: wrap; align-items: center; }\r\n\t.pp-main { padding: 14px 12px 32px; gap: 14px; }\r\n\t.pp-section-body { padding: 16px; }\r\n\t.pp-field-row, .pp-field-row-2, .pp-field-row-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\r\n\t.pp-share-grid { grid-template-columns: 1fr; }\r\n\t.pp-stmt-grid { grid-template-columns: 1fr; }\r\n\t.pp-identity-head { grid-template-columns: 1fr; }\r\n\t.pp-photo-card { flex-direction: row; text-align: left; align-items: center; }\r\n\t.pp-photo-copy { align-items: flex-start; }\r\n\t.pp-photo-actions { justify-content: flex-start; }\r\n\t.pp-custom-row { grid-template-columns: 1fr 100px 1fr 28px; }\r\n}\r\n@media (max-width: 600px) {\r\n\t.pp-header { padding: 0 12px; gap: 8px; }\r\n\t.pp-app-sub { max-width: 150px; }\r\n\t.pp-save-indicator { display: none; }\r\n\t.pp-completion { height: 32px; padding: 0 8px 0 4px; }\r\n\t.pp-completion-text { display: none; }\r\n\t.pp-field-row, .pp-field-row-2, .pp-field-row-3 { grid-template-columns: 1fr; }\r\n\t.pp-focus-grid { grid-template-columns: 1fr; }\r\n\t.pp-section-header { padding: 13px 14px; gap: 10px; }\r\n\t.pp-section-icon { width: 32px; height: 32px; }\r\n\t.pp-section-title { font-size: 13.5px; }\r\n\t.pp-section-state { display: none; }\r\n\t.pp-custom-row { grid-template-columns: 1fr 1fr; }\r\n\t.pp-custom-row-head { display: none; }\r\n\t.pp-pager-btn { flex: 1; }\r\n\t.pp-pager-text strong { font-size: 10.5px; }\r\n\t.pp-pager-count { display: none; }\r\n\t.pp-drawer { width: 100%; }\r\n\t.pp-avatar-lg { width: 64px; height: 64px; font-size: 21px; }\r\n\t.pp-photo-card { flex-direction: column; text-align: center; }\r\n\t.pp-photo-copy { align-items: center; }\r\n\t.pp-photo-actions { justify-content: center; }\r\n}\r\n"},"js":{"name":"PersonalProfile.js","src":"../app/PersonalProfile.js","content":"/* ── Personal Profile ──\r\n   One reusable profile for a person, with sections that adapt to the\r\n   application in front of them (résumé, university, scholarship, immigration,\r\n   volunteer work, portfolio, care forms and so on).\r\n   Built for the UniconHub CMS HTML-tool system.\r\n──────────────────────────────────────── */\r\n\r\n/* ── Helpers ── */\r\nfunction esc(value) {\r\n\treturn String(value === undefined || value === null ? '' : value)\r\n\t\t.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\r\n}\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction val(id) { return (el(id) || {}).value || ''; }\r\nfunction setVal(id, value) { var node = el(id); if (node) node.value = value === undefined || value === null ? '' : String(value); }\r\nfunction setChecked(id, checked) { var node = el(id); if (node) node.checked = !!checked; }\r\nfunction newId(prefix) { return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }\r\nfunction countWords(text) {\r\n\tvar trimmed = String(text || '').trim();\r\n\tif (!trimmed) return 0;\r\n\treturn trimmed.split(/\\s+/).length;\r\n}\r\nfunction nowIso() { return new Date().toISOString(); }\r\nfunction notify(message, severity) {\r\n\tif (typeof tool.notify === 'function') tool.notify(message, severity || 'info');\r\n}\r\nfunction daysUntilDate(isoDate) {\r\n\tif (!isoDate) return null;\r\n\tvar target = new Date(isoDate + 'T00:00:00');\r\n\tif (isNaN(target.getTime())) return null;\r\n\tvar today = new Date();\r\n\ttoday.setHours(0, 0, 0, 0);\r\n\treturn Math.round((target.getTime() - today.getTime()) / 86400000);\r\n}\r\nfunction formatShortDate(isoDate) {\r\n\tif (!isoDate) return '';\r\n\tvar parsed = new Date(isoDate + 'T00:00:00');\r\n\tif (isNaN(parsed.getTime())) return String(isoDate);\r\n\treturn parsed.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' });\r\n}\r\nfunction getUserSafe() {\r\n\ttry { return typeof tool.getUser === 'function' ? tool.getUser() : null; } catch (error) { return null; }\r\n}\r\n\r\n/* ── Sections ──\r\n   `needs` lists the profile focus areas that make a section appear.\r\n   A section without `needs` always appears. */\r\nvar SECTIONS = [\r\n\t{ id: 'basic',          group: 'Foundation',           icon: 'user',       title: 'Basic Information',            desc: 'Who you are and what this profile is for' },\r\n\t{ id: 'summary',        group: 'Foundation',           icon: 'spark',      title: 'Profile Summary',              desc: 'Your headline, story and direction' },\r\n\t{ id: 'contact',        group: 'Foundation',           icon: 'mail',       title: 'Contact & Web Presence',       navLabel: 'Contact & Links', desc: 'How you can be reached and found online' },\r\n\t{ id: 'languages',      group: 'Foundation',           icon: 'globe',      title: 'Languages',                    desc: 'Spoken and written languages', needs: ['languages', 'university', 'immigration', 'employment', 'scholarship'], count: function () { return DB.languages.length; } },\r\n\r\n\t{ id: 'personal',       group: 'Identity & Records',   icon: 'shield', r\n\t{ id: 'essays',         group: 'Applications',         icon: 'pen',        title: 'Essays & Statements',          desc: 'A reusable bank of written material', needs: ['university', 'scholarship', 'research'], count: function () { return DB.essays.length; } },\r\n\t{ id: 'preferences',    group: 'Applications',         icon: 'target',     title: 'Goals & Preferences',          desc: 'What you are looking for next', needs: ['employment', 'university', 'immigration', 'scholarship'] },\r\n{ id: 'funding',        group: 'Applications',         icon: 'wallet',     title: 'Funding & Financial Aid',      navLabel: 'Funding & Aid', desc: 'What funding you need and target', needs: ['scholarship', 'university', 'research'] }\r\n];\r\n\r\n/* ── Profile uses (drive the suggested section set) ── */\r\nvar PROFILE_KINDS = [\r\n\t{ id: 'general',     label: 'General personal profile', desc: 'A little of everything, kept ready for any form',      preset: [] },\r\n\t{ id: 'resume',      label: 'Résumé / CV',              desc: 'Work history, skills, education and references',       preset: ['employment', 'credentials', 'identity'] },\r\n\t{ id: 'job',         label: 'Job application',          desc: 'Résumé plus role preferences and licences',            preset: ['employment', 'credentials', 'identity'] },\r\n\t{ id: 'university',  label: 'University application',   desc: 'Education, test scores, activities and essays',        preset: ['university', 'tests', 'community'] },\r\n\t{ id: 'scholarship', label: 'Scholarship / fellowship', desc: 'Achievements, essays, service and funding',            preset: ['scholarship', 'research', 'community', 'tests'] },\r\n\t{ id: 'research',    label: 'Research & grants',        desc: 'Publications, projects and academic references',       preset: ['research', 'scholarship', 'university'] },\r\n\t{ id: 'volunteer',   label: 'Volunteer application',    desc: 'Service history, references and languages',            preset: ['volunteer', 'communit
