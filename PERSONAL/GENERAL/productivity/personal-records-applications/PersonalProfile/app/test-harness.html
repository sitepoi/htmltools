<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PersonalProfile - Test Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="PersonalProfile.css">
<style>
body { padding-top: 28px !important; margin: 0; }
#app { min-height: calc(100vh - 28px); }
.pp-header { top: 28px !important; }
.pp-sidebar { top: calc(var(--pp-header-h) + 28px) !important; height: calc(100vh - var(--pp-header-h) - 28px) !important; }
.pp-layout { min-height: calc(100vh - var(--pp-header-h) - 28px); }
@media (max-width: 820px) {
  .pp-sidebar { top: auto !important; height: auto !important; }
}
#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #0f172a; color: #e6edf5; font-family: system-ui; font-size: 11px; padding: 4px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; }
#th-bar strong { color: #38bdf8; letter-spacing: 0.5px; }
#th-bar .sep { color: #475569; }
#th-bar button { border: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; font-family: system-ui; font-weight: 600; }
#th-bar .btn-load { background: #0284c7; color: #fff; }
#th-bar .btn-clear { background: #dc2626; color: #fff; }
#th-bar .btn-reload { background: #16a34a; color: #fff; }
#th-bar .btn-dump { background: #7c3aed; color: #fff; }
#th-bar .btn-qa { background: #ca8a04; color: #fff; }
#th-bar .hint { color: #64748b; font-size: 10px; }
#th-bar select { border: 1px solid #475569; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-family: system-ui; background: #1e293b; color: #e6edf5; }
body.th-bare { padding-top: 0 !important; }
body.th-bare #th-bar { display: none; }
body.th-bare .pp-header { top: 0 !important; }
body.th-bare .pp-sidebar { top: var(--pp-header-h) !important; height: calc(100vh - var(--pp-header-h)) !important; }
body.th-bare .pp-layout { min-height: calc(100vh - var(--pp-header-h)); }
@media (max-width: 820px) {
  body.th-bare .pp-sidebar { top: auto !important; height: auto !important; }
}
#qa-results { position: fixed; inset: auto 12px 12px 12px; max-height: 42vh; overflow: auto; z-index: 10000; background: #0b1220; color: #d7e3f4; border: 1px solid #22304d; border-radius: 8px; padding: 10px 12px; font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; display: none; }
#qa-results.open { display: block; }
@keyframes toolFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="th-bar">
  <strong>TEST HARNESS - Personal Profile</strong><span class="sep">|</span>
  <button class="btn-load" id="th-load-sample">Load Sample Data</button>
  <button class="btn-clear" id="th-clear">Clear All</button>
  <button class="btn-reload" id="th-reload">Reload</button>
  <button class="btn-dump" id="th-dump">Dump DB</button>
  <button class="btn-qa" id="th-qa">Run QA</button>
  <span class="sep">|</span>
  <button id="th-readonly" style="background:#b45309;color:#fff">Toggle Read-only</button>
  <button id="th-user" style="background:#0f766e;color:#fff">Toggle Signed-in User</button>
  <span class="sep">|</span>
  <label class="hint">Sections:
    <select id="th-sections-filter">
      <option value="all">All Sections</option>
      <option value="basic">Basic Only</option>
      <option value="basic,summary,contact,education,skills">Core</option>
      <option value="basic,summary,contact,education,testscores,essays">University</option>
      <option value="basic,contact,personal,identity,documents,health,languages">Immigration</option>
    </select>
  </label>
  <span class="sep">|</span>
  <span id="th-status" class="hint">Loading...</span>
</div>
<div id="app-container"></div>

<script type="text/template" id="pp-html-template">
<div id="app">
	<header class="pp-header">
		<div class="pp-header-left">
			<div class="pp-logo" data-icon="user"></div>
			<div class="pp-title-group">
				<div class="pp-app-title">Personal Profile</div>
				<div class="pp-app-sub" id="pp-person-name-display">Untitled profile</div>
			</div>
		</div>
		<div class="pp-header-right">
			<div class="pp-save-indicator" id="pp-save-indicator">
				<span class="pp-save-dot"></span>
				<span class="pp-save-text">All changes saved</span>
			</div>
			<div class="pp-completion" id="pp-completion" title="Profile completion">
				<span class="pp-ring" id="pp-completion-ring"><span class="pp-ring-inner" id="pp-completion-pct">0%</span></span>
				<span class="pp-completion-text">
					<strong id="pp-completion-count">0 of 0</strong>
					<span>sections ready</span>
				</span>
			</div>
			<div class="pp-account">
				<button type="button" class="pp-account-btn" id="pp-menu-toggle" aria-haspopup="menu" aria-expanded="false" title="Profile menu">
					<span class="pp-avatar pp-avatar-sm" id="pp-header-avatar" aria-hidden="true"><span class="pp-avatar-initials" id="pp-header-avatar-initials">?</span></span>
					<span class="pp-account-text">
						<strong id="pp-account-name">Your profile</strong>
						<span id="pp-account-sub">Choose a profile use</span>
					</span>
					<span class="pp-account-caret" data-icon="chevronDown"></span>
				</button>
				<div class="pp-menu" id="pp-menu" role="menu" hidden>
					<div class="pp-menu-head">
						<span class="pp-avatar pp-avatar-md" id="pp-menu-avatar" aria-hidden="true"><span class="pp-avatar-initials" id="pp-menu-avatar-initials">?</span></span>
						<span class="pp-menu-head-text">
							<strong id="pp-menu-name">Your profile</strong>
							<span id="pp-menu-sub">Choose a profile use</span>
						</span>
					</div>
					<button type="button" class="pp-menu-item" role="menuitem" data-menu-action="basic"><span class="pp-menu-ico" data-icon="user"></span>Edit basic information</button>
					<button type="button" class="pp-menu-item" role="menuitem" data-menu-action="share"><span class="pp-menu-ico" data-icon="share"></span>Share &amp; export</button>
					<div class="pp-menu-sep" role="separator"></div>
					<button type="button" class="pp-menu-item" role="menuitem" data-action="copy-summary"><span class="pp-menu-ico" data-icon="copy"></span>Copy summary</button>
					<button type="button" class="pp-menu-item" role="menuitem" data-action="copy-json"><span class="pp-menu-ico" data-icon="copy"></span>Copy JSON</button>
					<button type="button" class="pp-menu-item" role="menuitem" data-action="download-json"><span class="pp-menu-ico" data-icon="download"></span>Download JSON</button>
				</div>
			</div>
			<button type="button" class="pp-btn pp-btn-icon" id="pp-theme-toggle" title="Toggle dark / light mode" aria-label="Toggle dark mode"></button>
		</div>
	</header>

	<div class="pp-layout">
		<aside class="pp-sidebar" id="pp-sidebar">
			<div class="pp-profile-chip">
				<span class="pp-profile-chip-label">Profile</span>
				<strong class="pp-profile-chip-value" id="pp-profile-chip-value">Not set</strong>
				<span class="pp-profile-chip-sub" id="pp-profile-chip-sub">Choose a profile use in Basic Information</span>
			</div>
			<nav class="pp-nav" id="pp-nav" aria-label="Profile sections"></nav>
			<div class="pp-sidebar-foot">
				<div class="pp-hidden-note" id="pp-hidden-note"></div>
				<button type="button" class="pp-linkbtn" id="pp-scope-toggle">Show all sections</button>
				<button type="button" class="pp-linkbtn pp-linkbtn-strong" id="pp-add-custom-section">+ New custom section</button>
			</div>
		</aside>

		<main class="pp-main" id="pp-main">

			<!-- BASIC INFORMATION -->
			<section class="pp-section" data-section="basic" id="sec-basic">
				<div class="pp-section-header">
					<div class="pp-section-icon" data-icon="user"></div>
					<div class="pp-section-title-group">
						<h2 class="pp-section-title">Basic Information</h2>
						<p class="pp-section-desc">Who you are and what this profile is for</p>
					</div>
					<div class="pp-section-toggle">▾</div>
				</div>
				<div class="pp-section-body">
					<div class="pp-setup">
						<div class="pp-setup-head">
							<span class="pp-step">1</span>
							<div class="pp-setup-head-text">
								<h3 class="pp-block-title">Personal identity</h3>
								<p class="pp-block-sub">The details every résumé and application asks for. Private details stay out of this block and appear only in the sections that need them.</p>
							</div>
						</div>
						<div class="pp-identity-head">
							<div class="pp-photo-field" id="pp-photo-field"></div>
							<div class="pp-identity-fields">
								<div class="pp-field-row pp-field-row-2">
									<div class="pp-field">
										<label class="pp-label" for="f-legalName">Full legal name <span class="pp-required">*</span></label>
										<input type="text" class="pp-input" id="f-legalName" placeholder="As printed on your ID" maxlength="120">
										<span class="pp-field-help">Exactly as it appears on your passport, licence or school record.</span>
									</div>
									<div class="pp-field">
										<label class="pp-label" for="f-preferredName">Preferred name</label>
										<input type="text" class="pp-input" id="f-preferredName" placeholder="What people should call you" maxlength="80">
										<span class="pp-field-help">The name you want on the top of a résumé, if it differs.</span>
									</div>
								</div>
								<div class="pp-field-row pp-field-row-2">
									<div class="pp-field">
										<label class="pp-label" for="f-email">Email <span class="pp-required">*</span></label>
										<input type="email" class="pp-input" id="f-email" placeholder="you@example.com">
										<span class="pp-field-help">Use an address you check every day - applications reply here.</span>
									</div>
									<div class="pp-field">
										<label class="pp-label" for="f-phone">Phone</label>
										<input type="text" class="pp-input" id="f-phone" placeholder="+1 (555) 000-0000" maxlength="40">
										<span class="pp-field-help">Include the country code if you may be called from abroad.</span>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pp-setup">
						<div class="pp-setup-head">
							<span class="pp-step">2</span>
							<div class="pp-setup-head-text">
								<h3 class="pp-block-title">Profile setup</h3>
								<p class="pp-block-sub">Now choose the main use of this profile. The sidebar adapts to what that use needs - changing it never removes saved data.</p>
							</div>
						</div>
						<div class="pp-field-row">
							<div class="pp-field pp-field-full">
								<label class="pp-label" for="f-profile-kind">Primary profile use</label>
								<select class="pp-input pp-select" id="f-profile-kind"></select>
								<span class="pp-field-help" id="pp-kind-hint"></span>
							</div>
						</div>
						<div class="pp-focus-head">
							<span class="pp-label">What this profile covers</span>
							<span class="pp-focus-hint" id="pp-focus-hint"></span>
						</div>
						<div class="pp-focus-grid" id="pp-focus-grid"></div>
						<div class="pp-setup-actions">
							<button type="button" class="pp-btn pp-btn-sm" data-apply-preset>Use suggested areas</button>
							<span class="pp-setup-hint">Only the sidebar changes - every answer stays saved.</span>
						</div>
						<p class="pp-note" id="pp-profile-note"></p>
					</div>
				</div>
			</section>

			<!-- PROFILE SUMMARY -->
			<section class="pp-section" data-section="summary" id="sec-summary">
				<div class="pp-section-header">
					<div class="pp-section-icon" data-icon="spark"></div>
					<div class="pp-section-title-group">
						<h2 class="pp-section-title">Profile Summary</h2>
						<p class="pp-section-desc">Your headline, story and direction</p>
					</div>
					<div class="pp-section-toggle">▾</div>
				</div>
				<div class="pp-section-body">
					<p class="pp-section-intro">These statements are read-only cards, so the profile reads at a glance. Open Edit on one card - the other cards stay readable, and every editor shows an example you can start from.</p>
					<div class="pp-stmt-grid" id="pp-summary-cards"></div>
				</div>
			</section>

			<!-- CONTACT -->
			<section class="pp-section" data-section="contact" id="sec-contact">
				<div class="pp-section-header">
					<div class="pp-section-icon" data-icon="mail"></div>
					<div class="pp-section-title-group">
						<h2 class="pp-section-title">Contact &amp; Web Presence</h2>
						<p class="pp-section-desc">How you can be reached and found online</p>
					</div>
					<div class="pp-section-toggle">▾</div>
				</div>
				<div class="pp-section-body">
					<div class="pp-subsection">
						<div class="pp-subsection-head">
							<h3 class="pp-subsection-title">Contact details</h3>
							<span class="pp-subsection-note">Email and phone are in Basic Information</span>
						</div>
						<div class="pp-field-row pp-field-row-2">
							<div class="pp-field">
								<label class="pp-label" for="f-altPhone">Alternate phone</label>
								<input type="text" class="pp-input" id="f-altPhone" placeholder="Optional second number" maxlength="40">
							</div>
							<div class="pp-field">
								<label class="pp-label" for="f-timeZone">Time zone</label>
								<input type="text" class="pp-input" id="f-timeZone" placeholder="e.g. Pacific Time (UTC-8)" maxlength="60">
							</div>
						</div>
						<div class="pp-field">
							<label class="pp-label" for="f-address">Street address</label>
							<input type="text" class="pp-input" id="f-address" placeholder="Street, building, unit" maxlength="200">
						</div>
						<div class="pp-field-row pp-field-row-3">
							<div class="pp-field"><label class="pp-label" for="f-city">City</label><input type="text" class="pp-input" id="f-city" maxlength="80"></div>
							<div class="pp-field"><label class="pp-label" for="f-state">State / Province</label><input type="text" class="pp-input" id="f-state" maxlength="80"></div>
							<div class="pp-field"><label class="pp-label" for="f-postal">Postal / ZIP code</label><input type="text" class="pp-input" id="f-postal" maxlength="20"></div>
						</div>
						<div class="pp-field-row pp-field-row-2">
							<div class="pp-field"><label class="pp-label" for="f-country">Country</label><input type="text" class="pp-input" id="f-country" maxlength="80"></div>
						</div>
					</div>
					<div class="pp-subsection">
						<div class="pp-subsection-head">
							<h3 class="pp-subsection-title">Links</h3>
							<span class="pp-subsection-note">Leave a field empty when it does not apply</span>
						</div>
						<div class="pp-field-row pp-field-row-3">
							<div class="pp-field"><label class="pp-label" for="f-website">Website</label><input type="url" class="pp-input" id="f-website" placeholder="https://"></div>
							<div class="pp-field"><label class="pp-label" for="f-linkedin">LinkedIn</label><input type="url" class="pp-input" id="f-linkedin" placeholder="https://linkedin.com/in/"></div>
							<div class="pp-field"><label class="pp-label" for="f-github">GitHub / code</label><input type="url" class="pp-input" id="f-github" placeholder="https://github.com/"></div>
						</div>
						<div class="pp-array-container" id="pp-links-container"></div>
						<button type="button" class="pp-btn pp-btn-add" data-action="add-item" data-list="links">+ Add another link</button>
					</div>
				</div>
			</section>

			<!-- LANGUAGES -->
			<section class="pp-section" data-section="languages" id="sec-languages">
				<div class="pp-section-header">
					<div class="pp-section-icon" data-icon="globe"></div>
					<div class="pp-section-title-group">
						<h2 class="pp-section-title">Languages</h2>
						<p class="pp-section-desc">Spoken and written languages with proficiency</p>
					</div>
					<div class="pp-section-badge" id="pp-languages-count">0</div>
					<div class="pp-section-toggle">▾</div>
				</div>
				<div class="pp-section-body">
					<div class="pp-array-container" id="pp-languages-container"></div>
					<button type="button" class="pp-btn pp-btn-add" data-action="add-item" data-list="languages">+ Add language</button>
				</div>
			</section>

			<!-- PERSONAL DETAILS -->
			<section class="pp-section" data-section="personal" id="sec-personal">
				<div class="pp-section-header">
					<div class="pp-section-icon" data-icon="shield"></div>
					<div class="pp-section-title-group">
						<h2 class="pp-section-title">Personal Details</h2>
						<p class="pp-section-desc">Private details that only official forms ask for</p>
					</div>
					<div class="pp-section-toggle">▾</div>
				</div>
				<div class="pp-section-body">
					<p class="pp-note">This section appears only for immigration, government and health profiles. Fill in what the form in front of you asks for - empty answers are fine.</p>
					<div class="pp-subsection">
						<div class="pp-subsection-head">
							<h3 class="pp-subsection-title">Birth details</h3>
							<span class="pp-subsection-note">The year is enough for most forms</span>
						</div>
						<div class="pp-field-row pp-field-row-3">
							<div class="pp-field">
								<label class="pp-label" for="f-birthYear">Year of birth</label>
								<input type="text" class="pp-input" id="f-birthYear" inputmode="numeric" maxlength="4" placeholder="e.g. 2005">
								<span class="pp-field-help">Four digits. A general profile never needs more than this.</span>
							</div>
							<div class="pp-field">
								<label class="pp-label" for="f-placeOfBirth">Place of birth</label>
								<input type="text" class="pp-input" id="f-placeOfBirth" placeholder="City, country" maxlength="120">
							</div>
							<div class="pp-field">
								<label class="pp-label" for="f-dateOfBirth">Full date of birth</label>
								<input type="date" class="pp-input" id="f-dateOfBirth">
								<span class="pp-field-help">Only when an official form demands the exact day.</span>
							</div>
						</div>
					</div>
					<div class="pp-subsection">
						<div class="pp-subsection-head">
							<h3 class="pp-subsection-title">Personal status</h3>
							<span class="pp-subsection-note">Leave anything empty that the form does not ask</span>
						</div>
						<div class="pp-field-row pp-field-row-3">
							<div class="pp-field">
								<label class="pp-label" for="f-nationality">Nationality</label>
								<input type="text" class="pp-input" id="f-nationality" placeholder="e.g. Canadian" maxlength="80">
							</div>
							<div class="pp-field">
								<label class="pp-label" for="f-citizenship">Citizenship</label>
								<input type="text" class="pp-input" id="f-citizenship" placeholder="e.g. Canadian" maxlength="80">
							</div>
							<div class="pp-field">
								<label class="pp-label" for="f-maritalStatus">Marital status</label>
								<select class="pp-input pp-select" id="f-maritalStatus"></select>
							</div>
						</div>
						<div class="pp-field-row pp-field-row-2">
							<div class="pp-field">
								<label class="pp-label" for="f-gender">Gender</label>
								<select class="pp-input pp-select" id="f-gender"></select>
							</div>
							<div class="pp-field">
								<label class="pp-label" for="f-pronouns">Pronouns</label>
								<select class="pp-input pp-select" id="f-pronouns"></select>
							</div>
						</div>
					</div>
				</div>
			</section>

			<!-- IDENTITY -->
			<section class="pp-section" data-section="identity" id="sec-identity">
				<div class="pp-section-header">
					<div class="pp-section-icon" data-icon="shield"></div>
					<div class="pp-section-title-group">
						<h2 class="pp-section-title">Identity &amp; Status</h2>
						<p class="pp-section-desc">Identity documents, passport and residency status</p>
					</div>
					<div class="pp-section-toggle">▾</div>
				</div>
				<div class="pp-section-body">
					<p class="pp-note">These details are stored only in this CMS record. Leave anything empty that the profile does not need.</p>
					<div class="pp-subsection">
						<div class="pp-subsection-head"><h3 class="pp-subsection-title">Identity document</h3></div>
						<div class="pp-field-row pp-field-row-3">
							<div class="pp-field">
								<label class="pp-label" for="f-idType">Document type</label>
								<select class="pp-input pp-select" id="f-idType"></select>
							</div>
							<div class="pp-field"><label class="pp-label" for="f-idNumber">Document number</label><input type="text" class="pp-input" id="f-idNumber" maxlength="60"></div>
							<div class="pp-field"><label class="pp-label" for="f-idIssuedBy">Issued by</label><input type="text" class="pp-input" id="f-idIssuedBy" placeholder="Authority / country" maxlength="120"></div>
						</div>
						<div class="pp-field-row pp-field-row-3">
							<div class="pp-field"><label class="pp-label" for="f-idIssueDate">Issue date</label><input type="date" class="pp-input" id="f-idIssueDate"></div>
							<div class="pp-field"><label class="pp-label" for="f-idExpiry">Expiry date</label><input type="date" class="pp-input" id="f-idExpiry"></div>
							<div class="pp-field"><label class="pp-label" for="f-taxIdNumber">Tax / national ID number</label><input type="text" class="pp-input" id="f-taxIdNumber" maxlength="60"></div>
						</div>
					</div>
					<div class="pp-subsection">
						<div class="pp-subsection-head"><h3 class="pp-subsection-title">Passport</h3></div>
						<div class="pp-field-row pp-field-row-3">
							<div class="pp-field"><label class="pp-label" for="f-passportNumber">Passport number</label><input type="text" class="pp-input" id="f-passportNumber" maxlength="60"></div>
							<div class="pp-field"><label class="pp-label" for="f-passportCountry">Issuing country</label><input type="text" class="pp-input" id="f-passportCountry" maxlength="80"></div>

<script>
/* ── Mock tool SDK ── */
(function () {
  var STORAGE_KEY = 'personal_profile_test_db';
  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [] };
  var query = new URLSearchParams(window.location.search);
  var _readOnly = query.get('ro') === '1';
  var _value = null;
  var _user = query.get('user') === '1'
    ? { name: 'Alex Morgan', firstName: 'Alex', lastName: 'Morgan', email: 'alex.morgan@example.com', userId: 'u_alex' }
    : null;

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch (error) { _value = null; }
  }
  function save(value) {
    _value = value;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch (error) {}
  }

  window.tool = {
    getValue: function () { return _value; },
    setValue: function (data) {
      save(data);
      listeners.valueChange.forEach(function (cb) {
        try { cb(data); }
        catch (error) {
          window.__toolListenerErrors = window.__toolListenerErrors || [];
          window.__toolListenerErrors.push(String(error && error.stack ? error.stack : error));
          console.error('[tool onValueChange]', error);
        }
      });
    },
    onValueChange: function (cb) { listeners.valueChange.push(cb); },
    getFields: function () { return {}; },
    setField: function () {},
    setFields: function () {},
    onFieldsChange: function (cb) { listeners.fieldsChange.push(cb); },
    param: function (name, fallback) {
      var fromUrl = query.get(name);
      if (fromUrl !== null && fromUrl !== '') return fromUrl;
      var select = document.getElementById('th-sections-filter');
      if (select && name === 'visibleSections') return select.value;
      return fallback;
    },
    isReadOnly: function () { return _readOnly; },
    onReadonlyChange: function (cb) { listeners.readonlyChange.push(cb); },
    getUser: function () { return _user; },
    onUserChange: function (cb) { listeners.userChange.push(cb); },
    reportValid: function (valid, message) { if (!valid) console.warn('[Validation]', message); },
    notify: function (message, severity) {
      severity = severity || 'info';
      var colors = { info: '#3b82f6', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function () { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function () { toast.remove(); }, 300); }, 2200);
    },
    resize: function () {},
    declareOutput: function () {},
    declareParams: function () {},
    onReady: function (cb) { load(); cb(_value, {}); },
    requestUpload: function (accept, callback) {
      var picker = document.createElement('input');
      picker.type = 'file';
      picker.accept = accept || '';
      picker.style.display = 'none';
      document.body.appendChild(picker);
      picker.addEventListener('change', function () {
        var file = picker.files && picker.files[0];
        picker.remove();
        if (!file) { callback('No file selected'); return; }
        callback(null, { name: file.name, url: URL.createObjectURL(file), size: file.size, type: file.type });
      });
      picker.click();
    },
    _loadSampleData: function (data) { save(data); window.location.reload(); },
    _clearData: function () { localStorage.removeItem(STORAGE_KEY); window.location.reload(); },
    _toggleReadOnly: function () { _readOnly = !_readOnly; listeners.readonlyChange.forEach(function (cb) { try { cb(_readOnly); } catch (error) {} }); },
    _toggleUser: function () {
      _user = _user ? null : { name: 'Alex Morgan', firstName: 'Alex', lastName: 'Morgan', email: 'alex.morgan@example.com', userId: 'u_alex' };
      listeners.userChange.forEach(function (cb) { try { cb(_user); } catch (error) {} });
    },
    _dump: function () { console.log('Personal Profile DB', JSON.parse(JSON.stringify(_value))); }
  };
})();
</script>

    if (confirm('Clear ALL personal profile data? This cannot be undone.')) window.tool._clearData();
  });
  document.getElementById('th-reload').addEventListener('click', function () { window.location.reload(); });
  document.getElementById('th-dump').addEventListener('click', function () {
    window.tool._dump();
    window.tool.notify('DB dumped to the console', 'info');
  });
  document.getElementById('th-readonly').addEventListener('click', function () { window.tool._toggleReadOnly(); });

    var kindField = document.getElementById('f-profile-kind');
    if (kindField) { kindField.value = requestedKind; kindField.dispatchEvent(new Event('change', { bubbles: true })); }

  if (query.get('menu') === '1') {
    var menuToggle = document.getElementById('pp-menu-toggle');
    if (menuToggle) menuToggle.click();

  var requestedSection = query.get('section') || query.get('page');
  if (requestedSection === 'share') {
    var shareMenuItem = document.querySelector('[data-menu-action="share"]');
    if (shareMenuItem) shareMenuItem.click();
  } else if (requestedSection) {
    var sectionButton = document.querySelector('[data-nav="' + requestedSection + '"]');

  var summaryEditKey = query.get('summaryEdit');
  if (summaryEditKey) {
    var summaryEditButton = document.querySelector('[data-summary-edit="' + summaryEditKey + '"]');
    if (summaryEditButton) summaryEditButton.click();
  }
  status.textContent = 'Ready';
}

/* ── Quality checks (also usable from the command line with ?qa=1) ── */
function runQualityChecks() {
  var output = document.getElementById('qa-results');
  if (!output) {
    output = document.createElement('pre');
    output.id = 'qa-results';
    document.body.appendChild(output);
  }
  output.classList.add('open');
  output.textContent = '';
  var passed = 0;
  var failed = 0;
  function check(label, condition, detail) {
    if (condition) { passed++; output.textContent += 'PASS  ' + label + '\n'; }
    else { failed++; output.textContent += 'FAIL  ' + label + (detail ? '  (' + detail + ')' : '') + '\n'; }
  }
  function q(selector) { return document.querySelector(selector); }
  function qa(selector) { return Array.prototype.slice.call(document.querySelectorAll(selector)); }
  // A previous run may have stored edits in localStorage; QA always starts
  // from the same sample record.
  ensureSampleProfile(true);
  check('sample record is loaded', (window.tool.getValue().skills || []).length >= 2, 'skills=' + (window.tool.getValue().skills || []).length);
  var listenerErrors = window.__toolListenerErrors || [];
  check('the record renders without errors', listenerErrors.length === 0, (listenerErrors[0] || '').split('\n').slice(0, 2).join(' | '));

  // 1. Shell rendered
  check('header title renders', (q('.pp-app-title') || {}).textContent === 'Personal Profile');
  check('sidebar has nav items', qa('.pp-nav-item').length >= 5, 'found ' + qa('.pp-nav-item').length);
  check('only one section is active', qa('.pp-section.active').length === 1);
  check('completion ring has a percent', /%$/.test((document.getElementById('pp-completion-pct') || {}).textContent || ''));
  var setupBlocks = qa('#sec-basic .pp-setup');
  check('personal identity is the first block in Basic Information', setupBlocks.length >= 2 && (setupBlocks[0].querySelector('.pp-block-title') || {}).textContent === 'Personal identity');
  check('profile setup is the second block', setupBlocks.length >= 2 && (setupBlocks[1].querySelector('.pp-block-title') || {}).textContent === 'Profile setup');
  check('Basic Information asks for no private details', ['f-pronouns', 'f-dateOfBirth', 'f-nationality', 'f-maritalStatus', 'f-gender'].every(function (id) {
    var node = document.getElementById(id);
    return !node || !node.closest('#sec-basic');
  }));
  check('email and phone sit in Basic Information', !!document.getElementById('f-email').closest('#sec-basic') && !!document.getElementById('f-phone').closest('#sec-basic'));
  check('the photo card renders at the top of Basic Information', !!q('#sec-basic .pp-photo-card .pp-avatar-lg'));
  check('the header shows the person avatar', (document.getElementById('pp-header-avatar-initials') || {}).textContent === 'MC', (document.getElementById('pp-header-avatar-initials') || {}).textContent);
  check('year of birth is the default birth field', !!document.getElementById('f-birthYear') && !!document.getElementById('f-birthYear').closest('#sec-personal'));

  // 1b. Summary reads first and edits one card at a time
  check('summary renders one card per statement', qa('#pp-summary-cards .pp-stmt-card').length === 5, 'found ' + qa('#pp-summary-cards .pp-stmt-card').length);
  check('summary cards start read-only', qa('#pp-summary-cards .pp-stmt-input').length === 0);
  var summaryEditButton = q('#pp-summary-cards [data-summary-edit="summary"]');
  check('summary card has an edit control', !!summaryEditButton);
  summaryEditButton.click();
  check('edit opens exactly one editor', qa('#pp-summary-cards .pp-stmt-input').length === 1);
  check('the other summary cards stay readable', qa('#pp-summary-cards .pp-stmt-card').length === 5);
  check('the editor shows an example sentence', !!q('#pp-summary-cards .pp-stmt-sample'));
  var sampleButton = q('#pp-summary-cards [data-summary-sample="summary"]');
  check('the example can be applied with one click', !!sampleButton);
  if (sampleButton) sampleButton.click();
  check('using the example fills the editor', ((document.getElementById('pp-stmt-input') || {}).value || '').length > 60);
  var summaryEditor = document.getElementById('pp-stmt-input');
  summaryEditor.value = 'Edited summary for the test.';
  summaryEditor.dispatchEvent(new Event('input', { bubbles: true }));
  q('#pp-summary-cards [data-summary-save]').click();
  check('summary save writes the record', (window.tool.getValue().summary.summary || '') === 'Edited summary for the test.');
  check('the editor closes after saving', qa('#pp-summary-cards .pp-stmt-input').length === 0);
  check('the card shows the saved text', ((q('#pp-summary-cards .pp-stmt-wide .pp-stmt-text') || {}).textContent || '').indexOf('Edited summary for the test.') !== -1);

  // 1c. List items read first and expand one at a time
  var skillItems = qa('#pp-skills-container .pp-array-item');
  check('list items start collapsed', skillItems.length >= 2 && skillItems[0].classList.contains('is-collapsed'));
  q('#pp-skills-container .pp-array-edit').click();
  check('edit opens one list item', qa('#pp-skills-container .pp-array-item.is-editing').length === 1);
  qa('#pp-skills-container .pp-array-edit')[1].click();
  check('opening another item closes the first', qa('#pp-skills-container .pp-array-item.is-editing').length === 1);
  check('the second item is the open one', qa('#pp-skills-container .pp-array-item')[1].classList.contains('is-editing'));
  qa('#pp-skills-container .pp-array-edit')[1].click();
  check('closing the item returns it to read-only', qa('#pp-skills-container .pp-array-item.is-editing').length === 0);

  // 2. An unconfigured record shows only the basic sections
  var kindSelect = document.getElementById('f-profile-kind');
  check('kind select is populated', !!kindSelect && kindSelect.options.length >= 10);
  kindSelect.value = '';
  kindSelect.dispatchEvent(new Event('change', { bubbles: true }));
  var navUnconfigured = qa('[data-nav]').map(function (node) { return node.getAttribute('data-nav'); });
  check('basic sections stay visible with no profile', ['basic', 'summary', 'contact', 'education', 'skills'].every(function (id) { return navUnconfigured.indexOf(id) !== -1; }), navUnconfigured.join(','));
  check('profile-only sections are hidden with no profile', ['personal', 'identity', 'documents', 'health', 'work', 'essays', 'references'].every(function (id) { return navUnconfigured.indexOf(id) === -1; }), navUnconfigured.join(','));
  check('sidebar explains the basic-only default', ((document.getElementById('pp-hidden-note') || {}).textContent || '').indexOf('Basic sections only') !== -1);
  kindSelect.value = 'university';
  kindSelect.dispatchEvent(new Event('change', { bubbles: true }));
  var navAfterUniversity = qa('[data-nav]').map(function (node) { return node.getAttribute('data-nav'); });
  check('university shows essays', navAfterUniversity.indexOf('essays') !== -1);
  check('university hides identity', navAfterUniversity.indexOf('identity') === -1);
  check('university hides health', navAfterUniversity.indexOf('health') === -1);
  check('university hides personal details', navAfterUniversity.indexOf('personal') === -1);
  kindSelect.value = 'immigration';
  kindSelect.dispatchEvent(new Event('change', { bubbles: true }));
  var navAfterImmigration = qa('[data-nav]').map(function (node) { return node.getAttribute('data-nav'); });
  check('immigration shows identity', navAfterImmigration.indexOf('identity') !== -1);
  check('immigration shows health', navAfterImmigration.indexOf('health') !== -1);
  check('immigration hides essays', navAfterImmigration.indexOf('essays') === -1);
  check('immigration shows personal details', navAfterImmigration.indexOf('personal') !== -1);

  // 2b. A shared section stays while another selected area still needs it
  var healthChip = q('[data-focus="health"]');
  check('health area is selected for immigration', !!healthChip && healthChip.getAttribute('aria-pressed') === 'true');
  healthChip.click();
  check('health stays visible because immigration still needs it', qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'health'; }));
  check('saved focus list drops the removed area', (window.tool.getValue().profile.focus || []).length === 3);
  var healthChipAfter = q('[data-focus="health"]');
  check('health chip now reports itself as off', !!healthChipAfter && healthChipAfter.getAttribute('aria-pressed') === 'false');
  healthChipAfter.click();
  check('selecting health again keeps the section', qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'health'; }));
  check('focus list is back to the full immigration set', (window.tool.getValue().profile.focus || []).length === 4);

  check('sections still hold their data', !!window.tool.getValue().summary.summary);
  kindSelect.value = 'university';
  kindSelect.dispatchEvent(new Event('change', { bubbles: true }));
  check('changing back re-hides identity', !qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'identity'; }));

  // 2c. An area that is the only owner of a section really removes it
  check('essays are visible for the university profile', qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'essays'; }));
  var universityChip = q('[data-focus="university"]');
  check('university area is selected', !!universityChip && universityChip.getAttribute('aria-pressed') === 'true');
  universityChip.click();
  check('unselecting university hides essays', !qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'essays'; }));
  check('test scores stay because the tests area still needs them', qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'testscores'; }));
  check('saved focus list drops university', (window.tool.getValue().profile.focus || []).indexOf('university') === -1);
  var universityChipAfter = q('[data-focus="university"]');
  check('university chip now reports itself as off', !!universityChipAfter && universityChipAfter.getAttribute('aria-pressed') === 'false');
  universityChipAfter.click();
  check('selecting university again restores essays', qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'essays'; }));

  // 3. Show all sections
  var scopeButton = document.getElementById('pp-scope-toggle');
  scopeButton.click();
  check('show all reveals identity', qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'identity'; }));
  scopeButton.click();
  check('hide again removes identity', !qa('[data-nav]').some(function (node) { return node.getAttribute('data-nav') === 'identity'; }));

  // 4. Repeatable list: add, fill, remove
  document.querySelector('[data-action="add-item"][data-list="skills"]').click();
  var skillCount = window.tool.getValue().skills ? window.tool.getValue().skills.length : 0;
  check('add skill increases the list', skillCount >= 2, 'count ' + skillCount);
  var firstSkillName = q('[data-list="skills"][data-field="name"]');
  firstSkillName.value = 'Community water sampling';
  firstSkillName.dispatchEvent(new Event('input', { bubbles: true }));
  firstSkillName.dispatchEvent(new Event('change', { bubbles: true }));
  var savedSkills = window.tool.getValue().skills || [];
  check('typed skill is saved', savedSkills.some(function (skill) { return skill.name === 'Community water sampling'; }));
  var skillCountBeforeRemove = savedSkills.length;
  document.querySelector('[data-action="remove-item"][data-list="skills"]').click();
  check('remove skill shrinks the list', (window.tool.getValue().skills || []).length === skillCountBeforeRemove - 1);

  // 5. Share and export lives in the header menu, not in the section list
  check('share is not a section', !q('[data-nav="share"]') && !document.getElementById('sec-share'));
  document.getElementById('pp-menu-toggle').click();
  check('the header menu opens', document.getElementById('pp-menu').hidden === false);
  check('the menu offers share and export', !!q('[data-menu-action="share"]'));
  q('[data-menu-action="share"]').click();
  var preview = document.getElementById('pp-output-preview');
  check('the share drawer opens', document.getElementById('pp-drawer').classList.contains('open'));
  check('the menu closes once an action is chosen', document.getElementById('pp-menu').hidden === true);
  check('summary preview has the name', (preview.textContent || '').indexOf((window.tool.getValue().basicInfo.legalName || '').toUpperCase()) !== -1);
  check('summary never exposes identity numbers', (preview.textContent || '').indexOf(window.tool.getValue().identity.idNumber) === -1);
  var personalRecord = window.tool.getValue().personal || {};
  check('summary never exposes personal details', (preview.textContent || '').indexOf(personalRecord.dateOfBirth || '1970-01-01') === -1 && (preview.textContent || '').indexOf(personalRecord.pronouns || 'no-pronouns') === -1);
  check('readiness list has items', qa('.pp-readiness-item').length >= 3, 'found ' + qa('.pp-readiness-item').length);
  var sensitiveToggle = document.getElementById('f-export-sensitive');
  if (sensitiveToggle) { sensitiveToggle.checked = true; sensitiveToggle.dispatchEvent(new Event('change', { bubbles: true })); }
  check('sensitive export flag saves', window.tool.getValue().profile.exportIncludeSensitive === true);
  document.getElementById('pp-drawer-close').click();
  check('the drawer closes', !document.getElementById('pp-drawer').classList.contains('open'));

  // 6. Custom section renders
  check('custom section is in the nav', qa('[data-nav^="custom-"]').length >= 1);
  q('[data-nav^="custom-"]').click();
  check('custom section is active', qa('.pp-section.active')[0].id.indexOf('sec-custom-') === 0);
  check('custom field values render', (q('.pp-section.active .pp-custom-value') || {}).value === 'DELF B2');

  // 7. Completion and document alerts are wired
  check('completion count text exists', /\d+ of \d+/.test((document.getElementById('pp-completion-count') || {}).textContent || ''));
  var documentsNav = q('[data-nav="documents"]');
  if (documentsNav) {
    documentsNav.click();
    check('documents section opens', qa('.pp-section.active')[0].id === 'sec-documents');
  }

  // 8. Read-only
  window.tool._toggleReadOnly();
  check('read-only class is applied', document.getElementById('app').classList.contains('pp-readonly'));
  window.tool._toggleReadOnly();
  check('read-only class is removed', !document.getElementById('app').classList.contains('pp-readonly'));

  output.textContent += '\nSUMMARY  ' + passed + ' passed, ' + failed + ' failed\n';
  output.setAttribute('data-passed', String(passed));
  output.setAttribute('data-failed', String(failed));
  document.title = failed ? 'QA FAIL - PersonalProfile' : 'QA PASS - PersonalProfile';
}
</script>

</html>
