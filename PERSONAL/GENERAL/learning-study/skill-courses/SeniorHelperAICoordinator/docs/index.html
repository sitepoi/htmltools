<script type="application/json" id="code-payload">{"html":{"name":"SeniorHelperAICoordinator.html","src":"../app/SeniorHelperAICoordinator.html","content":"<div id=\"shc-app\">\r\n  <header class=\"shc-header\">\r\n    <div class=\"shc-heading\">\r\n      <div class=\"shc-greeting\" id=\"shc-greeting\">Good day! What would you like help with?<\/div>\r\n      <div class=\"shc-subline\">Choose a task below, or type your question in your own words. You can also say it - many phones let you talk instead of type.<\/div>\r\n    <\/div>\r\n    <div class=\"shc-header-tools\">\r\n      <button type=\"button\" class=\"shc-toolbtn\" id=\"shc-text-bigger\" title=\"Make all text bigger\">Bigger text<\/button>\r\n      <button type=\"button\" class=\"shc-toolbtn\" id=\"shc-text-smaller\" title=\"Make all text smaller\">Smaller text<\/button>\r\n      <button type=\"button\" class=\"shc-toolbtn\" id=\"shc-listen-toggle\" title=\"Read the answers out loud\">Listen: off<\/button>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <div class=\"shc-category-grid\" id=\"shc-category-grid\">\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"free-question\"><span class=\"shc-catname\">My own question<\/span><span class=\"shc-cathint\">Ask anything in your own words<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"write-letter\"><span class=\"shc-catname\">Write a letter or email<\/span><span class=\"shc-cathint\">Complaints, thank-you notes, requests<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"explain-text\"><span class=\"shc-catname\">Explain a letter or paper<\/span><span class=\"shc-cathint\">Bank, insurance, government letters<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"plan-week\"><span class=\"shc-catname\">Plan my week and meals<\/span><span class=\"shc-cathint\">Menus and a shopping list<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"health-helper\"><span class=\"shc-catname\">Health helper<\/span><span class=\"shc-cathint\">Meals, movement, schedules - ideas only<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"family-message\"><span class=\"shc-catname\">Message for family<\/span><span class=\"shc-cathint\">Birthdays, stories, homework help<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"hobby-project\"><span class=\"shc-catname\">Hobbies and projects<\/span><span class=\"shc-cathint\">Gardening, crafts, music, games<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"trip-plan\"><span class=\"shc-catname\">Plan a trip<\/span><span class=\"shc-cathint\">Day-by-day plans and packing<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"learn-new\"><span class=\"shc-catname\">Learn something new<\/span><span class=\"shc-cathint\">A gentle plan from zero<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"my-stories\"><span class=\"shc-catname\">Write my stories<\/span><span class=\"shc-cathint\">Memoir, family stories, recipes<\/span><\/button>\r\n    <button type=\"button\" class=\"shc-catbtn\" data-category-key=\"safety-check\"><span class=\"shc-catname\">Check a suspicious message<\/span><span class=\"shc-cathint\">Is this a scam? Paste it here<\/span><\/button>\r\n  <\/div>\r\n\r\n  <main class=\"shc-main\">\r\n    <section class=\"shc-panel shc-form-panel\" id=\"shc-form-panel\"><\/section>\r\n\r\n    <section class=\"shc-panel shc-chat-panel\" id=\"shc-chat-panel\">\r\n      <div class=\"shc-chat-messages\" id=\"shc-chat-messages\">\r\n        <div class=\"shc-welcome-note\" id=\"shc-welcome-note\">\r\n          <div class=\"shc-welcome-title\">This is your helper<\/div>\r\n          <p>Ask anything. The helper answers in plain words, in short paragraphs, and never gets impatient.<\/p>\r\n          <p>Remember the five golden rules at the bottom of this page. For health, money, and legal matters, the helper gives ideas - your doctor, bank, and family make the decisions.<\/p>\r\n        <\/div>\r\n      <\/div>\r\n      <div class=\"shc-chat-input-row\">\r\n        <textarea class=\"shc-chat-input\" id=\"shc-chat-input\" rows=\"2\" placeholder=\"Type your question here... (Enter to send)\"><\/textarea>\r\n        <button type=\"button\" class=\"shc-send-btn\" id=\"shc-send-button\">Ask<\/button>\r\n      <\/div>\r\n    <\/section>\r\n  <\/main>\r\n\r\n  <footer class=\"shc-safety-card\" id=\"shc-safety-card\">\r\n    <div class=\"shc-safety-title\">Your five golden safety rules<\/div>\r\n    <ol class=\"shc-safety-list\">\r\n      <li>No secrets in the chat - never passwords, card numbers, or ID numbers.<\/li>\r\n      <li>Never send money because of a phone call or message.<\/li>\r\n      <li>AI does not call you first - hang up.<\/li>\r\n      <li>Check important facts with official sources.<\/li>\r\n      <li>When in doubt, stop and ask family.<\/li>\r\n    <\/ol>\r\n  <\/footer>\r\n\r\n  <div class=\"shc-modal-overlay\" id=\"shc-copy-modal-overlay\">\r\n    <div class=\"shc-modal-box\">\r\n      <div class=\"shc-modal-title\">Copy your question<\/div>\r\n      <div class=\"shc-modal-hint\">Select the text below, then copy it. You can paste it into any AI app, like ChatGPT or Gemini.<\/div>\r\n      <textarea class=\"shc-modal-textarea\" id=\"shc-copy-modal-text\" rows=\"6\"><\/textarea>\r\n      <div class=\"shc-modal-actions\">\r\n        <button type=\"button\" class=\"shc-modal-btn\" id=\"shc-copy-modal-done\">Done<\/button>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"SeniorHelperAICoordinator.css","src":"../app/SeniorHelperAICoordinator.css","content":"/* Senior Helper AI Coordinator - friendly, large, high-contrast styles */\r\n#shc-app {\r\n  --shc-ink: #1f2a3a;\r\n  --shc-muted: #52627a;\r\n  --shc-accent: #0f5c8a;\r\n  --shc-accent-dark: #0a4166;\r\n  --shc-accent-2: #b2622f;\r\n  --shc-soft: #f4f7fa;\r\n  --shc-soft-warm: #fdf6ee;\r\n  --shc-line: #dfe6ec;\r\n  --shc-good: #1d7a36;\r\n  --shc-warn-bg: #fdf0e0;\r\n  --shc-warn-line: #d99a2b;\r\n  --shc-danger-bg: #fdeaea;\r\n  --shc-danger-line: #c0392b;\r\n  --shc-base-font: 17px;\r\n  font-size: var(--shc-base-font);\r\n  font-family: \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\r\n  color: var(--shc-ink);\r\n  background: #ffffff;\r\n  line-height: 1.55;\r\n  padding: 0 0 4px;\r\n}\r\n#shc-app.shc-scale-large { --shc-base-font: 20px; }\r\n#shc-app.shc-scale-extra { --shc-base-font: 23px; }\r\n#shc-app *, #shc-app *::before, #shc-app *::after { box-sizing: border-box; }\r\n#shc-app button { font: inherit; cursor: pointer; }\r\n#shc-app button:disabled { opacity: .45; cursor: default; }\r\n\r\n/* ---------- Header ---------- */\r\n.shc-header {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  justify-content: space-between;\r\n  gap: 1em;\r\n  flex-wrap: wrap;\r\n  padding: 0.9em 1em;\r\n  border-bottom: 2px solid var(--shc-line);\r\n}\r\n.shc-greeting { font-size: 1.35em; font-weight: 700; color: var(--shc-accent-dark); }\r\n.shc-subline { color: var(--shc-muted); font-size: .9em; margin-top: .25em; max-width: 46em; }\r\n.shc-header-tools { display: flex; gap: .5em; flex-wrap: wrap; }\r\n.shc-toolbtn {\r\n  border: 1.5px solid var(--shc-accent);\r\n  background: #ffffff;\r\n  color: var(--shc-accent);\r\n  border-radius: 999px;\r\n  padding: .45em 1em;\r\n  font-weight: 700;\r\n  font-size: .9em;\r\n}\r\n.shc-toolbtn:hover { background: #eaf3fa; }\r\n.shc-toolbtn.shc-toolbtn-active { background: var(--shc-accent); color: #ffffff; }\r\n\r\n/* ---------- Category grid ---------- */\r\n.shc-category-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(15em, 1fr));\r\n  gap: .7em;\r\n  padding: .9em 1em;\r\n}\r\n.shc-catbtn {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: flex-start;\r\n  gap: .25em;\r\n  text-align: left;\r\n  border: 1.5px solid var(--shc-line);\r\n  border-radius: .8em;\r\n  background: var(--shc-soft);\r\n  padding: .8em 1em;\r\n  min-height: 4.4em;\r\n}\r\n.shc-catbtn:hover { border-color: var(--shc-accent); background: #eaf3fa; }\r\n.shc-catbtn.shc-catbtn-active { border-color: var(--shc-accent); background: #eaf3fa; box-shadow: inset 0 0 0 2px #d8e9f7; }\r\n.shc-catname { font-weight: 700; color: var(--shc-ink); font-size: 1em; }\r\n.shc-cathint { font-size: .8em; color: var(--shc-muted); }\r\n\r\n/* ---------- Main panels ---------- */\r\n.shc-main { display: grid; grid-template-columns: 1fr; gap: .9em; padding: 0 1em; }\r\n.shc-panel { border: 1px solid var(--shc-line); border-radius: .9em; background: #ffffff; }\r\n\r\n/* ---------- Form panel ---------- */\r\n.shc-form-panel { display: none; background: var(--shc-soft-warm); border-color: #ecdcc8; }\r\n.shc-form-panel.shc-panel-open { display: block; }\r\n.shc-form-head { padding: .9em 1em .5em; }\r\n.shc-form-title { font-weight: 700; font-size: 1.1em; color: var(--shc-accent-dark); }\r\n.shc-form-hint { color: var(--shc-muted); font-size: .88em; margin-top: .25em; }\r\n.shc-form-body { padding: .2em 1em; display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: .8em; }\r\n.shc-field { display: flex; flex-direction: column; gap: .3em; }\r\n.shc-field.shc-field-wide { grid-column: 1 / -1; }\r\n.shc-field label { font-weight: 700; font-size: .9em; }\r\n.shc-field input, .shc-field textarea, .shc-field select {\r\n  font: inherit;\r\n  font-size: .95em;\r\n  padding: .6em .7em;\r\n  border: 1.5px solid var(--shc-line);\r\n  border-radius: .55em;\r\n  background: #ffffff;\r\n  color: var(--shc-ink);\r\n}\r\n.shc-field input:focus, .shc-field textarea:focus, .shc-field select:focus { border-color: var(--shc-accent); outline: none; }\r\n.shc-form-actions { display: flex; gap: .7em; flex-wrap: wrap; padding: .8em 1em 1em; }\r\n.shc-action-btn {\r\n  border: 0;\r\n  border-radius: .6em;\r\n  padding: .7em 1.3em;\r\n  font-weight: 700;\r\n  background: var(--shc-accent);\r\n  color: #ffffff;\r\n}\r\n.shc-action-btn:hover { background: var(--shc-accent-dark); }\r\n.shc-action-btn.shc-action-secondary { background: #ffffff; color: var(--shc-accent); border: 1.5px solid var(--shc-accent); }\r\n.shc-action-btn.shc-action-secondary:hover { background: #eaf3fa; }\r\n.shc-form-preview { margin: 0 1em 1em; padding: .7em .9em; background: #ffffff; border: 1px dashed var(--shc-accent-2); border-radius: .55em; color: var(--shc-ink); font-size: .92em; white-space: pre-wrap; }\r\n.shc-form-preview .shc-preview-label { display: block; font-size: .75em; text-transform: uppercase; letter-spacing: .07em; color: var(--shc-accent-2); font-weight: 700; margin-bottom: .3em; }\r\n\r\n/* ---------- Chat panel ---------- */\r\n.shc-chat-panel { display: flex; flex-direction: column; min-height: 22em; }\r\n.shc-chat-messages { flex: 1; overflow-y: auto; padding: 1em; display: flex; flex-direction: column; gap: .8em; max-height: 32em; }\r\n.shc-welcome-note { background: var(--shc-soft); border: 1px dashed var(--shc-line); border-radius: .8em; padding: 1em 1.2em; color: var(--shc-muted); font-size: .95em; }\r\n.shc-welcome-title { font-weight: 700; color: var(--shc-accent); margin-bottom: .4em; }\r\n.shc-msg { max-width: 88%; border-radius: .9em; padding: .8em 1em; font-size: .97em; }\r\n.shc-msg-user { align-self: flex-end; background: var(--shc-accent); color: #ffffff; border-bottom-right-radius: .2em; white-space: pre-wrap; }\r\n.shc-msg-ai { align-self: flex-start; background: var(--shc-soft); border: 1px solid var(--shc-line); border-bottom-left-radius: .2em; }\r\n.shc-msg-ai p { margin: 0 0 .55em; }\r\n.shc-msg-ai p:last-child { margin-bottom: 0; }\r\n.shc-msg-ai.shc-msg-warn { background: var(--shc-danger-bg); border-color: var(--shc-danger-line); }\r\n.shc-msg-meta { font-size: .72em; color: var(--shc-muted); margin-top: .4em; display: flex; gap: .7em; align-items: center; flex-wrap: wrap; }\r\n.shc-msg-user .shc-msg-meta { color: #d5e2ee; }\r\n.shc-msg-meta button {\r\n  border: 1px solid currentColor;\r\n  background: transparent;\r\n  color: inherit;\r\n  border-radius: 999px;\r\n  padding: .15em .7em;\r\n  font-size: .95em;\r\n}\r\n.shc-msg-meta button:hover { background: rgba(255,255,255,.18); }\r\n.shc-msg-ai .shc-msg-meta button:hover { background: #e5edf4; }\r\n.shc-chat-input-row { display: flex; gap: .6em; padding: .8em 1em 1em; border-top: 1px solid var(--shc-line); }\r\n.shc-chat-input {\r\n  flex: 1;\r\n  font: inherit;\r\n  font-size: .95em;\r\n  padding: .7em .8em;\r\n  border: 1.5px solid var(--shc-line);\r\n  border-radius: .6em;\r\n  resize: vertical;\r\n  min-height: 2.8em;\r\n  background: #ffffff;\r\n  color: var(--shc-ink);\r\n}\r\n.shc-chat-input:focus { border-color: var(--shc-accent); outline: none; }\r\n.shc-send-btn {\r\n  border: 0;\r\n  border-radius: .6em;\r\n  padding: 0 1.6em;\r\n  font-weight: 700;\r\n  background: var(--shc-accent-2);\r\n  color: #ffffff;\r\n}\r\n.shc-send-btn:hover { background: #9a5327; }\r\n.shc-thinking { color: var(--shc-muted); font-style: italic; }\r\n\r\n/* ---------- Safety card ---------- */\r\n.shc-safety-card { margin: .9em 1em 0; padding: .9em 1.1em; background: var(--shc-warn-bg); border: 1.5px solid var(--shc-warn-line); border-radius: .8em; }\r\n.shc-safety-title { font-weight: 700; color: #8a5a1f; font-size: 1em; margin-bottom: .4em; }\r\n.shc-safety-list { margin: 0; padding-left: 1.5em; color: var(--shc-ink); font-size: .9em; }\r\n.shc-safety-list li { margin: .25em 0; }\r\n\r\n/* ---------- Modal ---------- */\r\n.shc-modal-overlay {\r\n  display: none;\r\n  position: fixed;\r\n  inset: 0;\r\n  background: rgba(15, 23, 42, .5);\r\n  z-index: 60;\r\n  align-items: center;\r\n  justify-content: center;\r\n  padding: 1em;\r\n}\r\n.shc-modal-overlay.shc-modal-open { display: flex; }\r\n.shc-modal-box { background: #ffffff; border-radius: .9em; padding: 1.2em; width: min(34em, 100%); }\r\n.shc-modal-title { font-weight: 700; font-size: 1.1em; color: var(--shc-accent-dark); }\r\n.shc-modal-hint { color: var(--shc-muted); font-size: .85em; margin: .4em 0 .8em; }\r\n.shc-modal-textarea { width: 100%; font: inherit; font-size: .92em; padding: .6em; border: 1.5px solid var(--shc-line); border-radius: .55em; }\r\n.shc-modal-actions { display: flex; justify-content: flex-end; gap: .6em; margin-top: .8em; }\r\n.shc-modal-btn { border: 0; border-radius: .6em; padding: .6em 1.4em; font-weight: 700; background: var(--shc-accent); color: #fff; }\r\n.shc-modal-btn:hover { background: var(--shc-accent-dark); }\r\n\r\n/* ---------- Narrow screens ---------- */\r\n@media (max-width: 620px) {\r\n  .shc-category-grid { grid-template-columns: 1fr 1fr; }\r\n  .shc-msg { max-width: 96%; }\r\n}\r\n"},"js":{"name":"SeniorHelperAICoordinator.js","src":"../app/SeniorHelperAICoordinator.js","content":"/* Senior Helper AI Coordinator - the post-course AI companion for older adults.\r\n   Chat with AI + guided question builders for everyday tasks, with safety rules always visible. */\r\n\r\n(function () {\r\n  \"use strict\";\r\n\r\n  var CHAT_SESSION_TYPE = \"ai-chat-sessions-uniconbaseapps\";\r\n  var INSTANCE_PREFIX = \"seniorhelper_\";\r\n  var VALUE_VERSION = 1;\r\n  var TEXT_SCALES = [\"normal\", \"large\", \"extra\"];\r\n\r\n  var SENIOR_SYSTEM_PROMPT =\r\n    \"You are a patient, kind AI helper for an older adult who is learning to use AI. \" +\r\n    \"Rules you must follow: use plain everyday words; keep sentences short; \" +\r\n    \"put each idea in its own short paragraph; explain any uncommon word the first time you use it; \" +\r\n    \"be warm and encouraging; never ask for personal details such as passwords, card numbers, or ID numbers; \" +\r\n    \"for health, money, or legal matters give ideas and questions to ask a professional, \" +\r\n    \"but never decisions, diagnoses, or guarantees, and gently remind the person to check with their doctor, bank, or family; \" +\r\n    \"if anything sounds like a scam, say so clearly. Answer in plain text, no tables unless asked, no jargon.\";\r\n\r\n  var CATEGORY_DEFINITIONS = [\r\n    {\r\n      categoryKey: \"free-question\",\r\n      title: \"My own question\",\r\n      hint: \"Ask anything, in your own words. You do not need to fill anything in - just type your question in the box below.\",\r\n      fields: []\r\n    },\r\n    {\r\n      categoryKey: \"write-letter\",\r\n      title: \"Write a letter or email\",\r\n      hint: \"Fill in the boxes and the helper writes a polite letter you can edit and send.\",\r\n      fields: [\r\n        { fieldKey: \"recipient\", label: \"Who is it for?\", placeholder: \"My landlord, my doctor's office, the internet company...\", kind: \"text\" },\r\n        { fieldKey: \"topic\", label: \"What is it about?\", placeholder: \"A dripping tap, a thank-you, a refund request...\", kind: \"text\" },\r\n        { fieldKey: \"wish\", label: \"What do you want to happen?\", placeholder: \"A repair, an appointment, a refund...\", kind: \"text\" },\r\n        { fieldKey: \"length\", label: \"How long should it be?\", kind: \"select\", options: [\"short\", \"medium\"], defaultOption: \"short\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        return \"Please write a \" + values.length + \", polite letter to \" + values.recipient + \" about \" + values.topic + \". \" +\r\n          \"What I want: \" + values.wish + \". \" +\r\n          \"Keep it warm and clear, and leave placeholders for my name and the date.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"explain-text\",\r\n      title: \"Explain a letter or paper\",\r\n      hint: \"Paste a difficult letter here and the helper explains it in plain words.\",\r\n      fields: [\r\n        { fieldKey: \"pastedText\", label: \"Paste the letter or paper here\", placeholder: \"Paste the text of the letter...\", kind: \"textarea\", wide: true },\r\n        { fieldKey: \"source\", label: \"Where is it from?\", kind: \"select\", options: [\"my bank or insurance\", \"a doctor or health service\", \"the government\", \"another office\"], defaultOption: \"another office\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        return \"Please explain this letter in plain words, like you are talking to a friend who is not a lawyer. \" +\r\n          \"It came from \" + values.source + \". Then tell me, step by step, what I need to DO and any deadlines I must not miss:\\n\\n\" +\r\n          values.pastedText;\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"plan-week\",\r\n      title: \"Plan my week and meals\",\r\n      hint: \"Five simple dinners plus one shopping list.\",\r\n      fields: [\r\n        { fieldKey: \"people\", label: \"For how many people?\", kind: \"select\", options: [\"one person\", \"two people\"], defaultOption: \"one person\" },\r\n        { fieldKey: \"foodRules\", label: \"Any food rules?\", placeholder: \"Low salt, no fish, soft food, vegetarian... (leave empty if none)\", kind: \"text\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        var rulesPart = values.foodRules ? \" The meals should fit these food rules: \" + values.foodRules + \".\" : \"\";\r\n        return \"Plan five simple dinners this week for \" + values.people + \".\" + rulesPart +\r\n          \" Each dinner should use common ingredients and be easy to prepare. \" +\r\n          \"Then give me one shopping list for all five dinners.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"health-helper\",\r\n      title: \"Health helper\",\r\n      hint: \"Ideas only - your doctor and pharmacist make the decisions.\",\r\n      fields: [\r\n        { fieldKey: \"helpKind\", label: \"What kind of help?\", kind: \"select\", options: [\"meal ideas within my limits\", \"a gentle seated exercise routine\", \"a medication schedule table\", \"explain a health term in plain words\"], defaultOption: \"meal ideas within my limits\" },\r\n        { fieldKey: \"detail\", label: \"Tell me the details\", placeholder: \"Low salt, high blood pressure, the name of the medicine...\", kind: \"text\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        if (values.helpKind.indexOf(\"meal\") === 0) {\r\n          return \"Give me five simple meal ideas that fit these limits: \" + values.detail + \". Each with fewer than eight ingredients. \" +\r\n            \"Do not give medical advice - I will check with my doctor or dietitian.\";\r\n        }\r\n        if (values.helpKind.indexOf(\"exercise\") === 0) {\r\n          return \"Create a gentle 15-minute seated exercise routine for a beginner, using only a chair. \" +\r\n            \"Details: \" + values.detail + \". List each exercise with simple instructions and timing. \" +\r\n            \"Add a note that I should check with my doctor before starting.\";\r\n        }\r\n        if (values.helpKind.indexOf(\"medication\") === 0) {\r\n          return \"Make a large, easy-to-read daily medication schedule table with columns for morning, noon, evening, and night. \" +\r\n            \"I will fill in my medicines and doses from my labels. Details: \" + values.detail + \". \" +\r\n            \"Add a note that a pharmacist should check the final table.\";\r\n        }\r\n        return \"Explain what \" + values.detail + \" means in plain words, and list five good questions I should ask my doctor about it. Do not diagnose anything.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"family-message\",\r\n      title: \"Message for family\",\r\n      hint: \"A warm message for someone you love.\",\r\n      fields: [\r\n        { fieldKey: \"person\", label: \"Who is it for?\", kind: \"select\", options: [\"my grandson\", \"my granddaughter\", \"my son\", \"my daughter\", \"a friend\", \"another family member\"], defaultOption: \"my grandson\" },\r\n        { fieldKey: \"occasion\", label: \"What is the occasion?\", placeholder: \"A birthday, congratulations, a thank-you...\", kind: \"text\" },\r\n        { fieldKey: \"interests\", label: \"What do they love?\", placeholder: \"Dinosaurs, football, gardening, music...\", kind: \"text\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        var interestsPart = values.interests ? \" They love \" + values.interests + \".\" : \"\";\r\n        return \"Write a warm \" + values.occasion + \" message for \" + values.person + \".\" + interestsPart +\r\n          \" About 60 words, cheerful, from me. Keep the sentences short.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"hobby-project\",\r\n      title: \"Hobbies and projects\",\r\n      hint: \"Ideas for the things you enjoy.\",\r\n      fields: [\r\n        { fieldKey: \"hobby\", label: \"My hobby or project\", placeholder: \"Balcony gardening, crochet, chess, model trains...\", kind: \"text\" },\r\n        { fieldKey: \"helpWanted\", label: \"What help do you want?\", placeholder: \"Three new ideas to try, a month-by-month plan, a fix for a problem...\", kind: \"text\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        return \"My hobby or project: \" + values.hobby + \". I would like help with: \" + values.helpWanted + \". \" +\r\n          \"Ask me a question if you need one more detail, then give me three specific things I could try, from easy to challenging. Plain words, please.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"trip-plan\",\r\n      title: \"Plan a trip\",\r\n      hint: \"A relaxed day-by-day plan with rest time.\",\r\n      fields: [\r\n        { fieldKey: \"place\", label: \"Where to?\", placeholder: \"Chicago, Vancouver, a day trip to the lake...\", kind: \"text\" },\r\n        { fieldKey: \"days\", label: \"How many days?\", kind: \"select\", options: [\"2 days\", \"3 days\", \"5 days\"], defaultOption: \"3 days\" },\r\n        { fieldKey: \"likes\", label: \"What do you like?\", placeholder: \"Museums, short walks, early dinners, no stairs...\", kind: \"text\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        return \"Plan a relaxed \" + values.days + \" trip to \" + values.place + \" for me. I like \" + values.likes + \". \" +\r\n          \"One simple plan per day, with rest time, and a packing list at the end.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"learn-new\",\r\n      title: \"Learn something new\",\r\n      hint: \"A gentle plan from zero, 20 minutes a day.\",\r\n      fields: [\r\n        { fieldKey: \"topic\", label: \"What do you want to learn?\", placeholder: \"Bird watching, basic chess, a few words of Spanish...\", kind: \"text\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        return \"I want to learn the basics of \" + values.topic + \". \" +\r\n          \"Design me a gentle 4-week plan, 20 minutes a day, starting from zero, in plain words. \" +\r\n          \"Each week should have one clear goal.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"my-stories\",\r\n      title: \"Write my stories\",\r\n      hint: \"Your life is the material. The helper interviews you and writes.\",\r\n      fields: [\r\n        { fieldKey: \"storyKind\", label: \"What do you want to write?\", kind: \"select\", options: [\"a memoir about my life\", \"a family memory as a short story\", \"a family recipe keepsake\", \"a children's story\"], defaultOption: \"a memoir about my life\" },\r\n        { fieldKey: \"detail\", label: \"Tell me the starting point\", placeholder: \"My years as a nurse, the day we moved, grandma's cookies...\", kind: \"text\" }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        if (values.storyKind.indexOf(\"memoir\") === 0) {\r\n          return \"I want to write a memoir about \" + values.detail + \". \" +\r\n            \"Interview me one question at a time, starting with the very beginning. \" +\r\n            \"After each answer, ask the next question. At the end, propose a chapter outline with a title for each chapter.\";\r\n        }\r\n        if (values.storyKind.indexOf(\"family memory\") === 0) {\r\n          return \"Help me turn a family memory into a short story. The memory: \" + values.detail + \". \" +\r\n            \"Ask me a few questions one at a time, then write it warmly, about 300 words.\";\r\n        }\r\n        if (values.storyKind.indexOf(\"recipe\") === 0) {\r\n          return \"Help me write down a family recipe as a keepsake. The dish: \" + values.detail + \". \" +\r\n            \"Ask me for the ingredients, the steps, and the story behind the dish, then write a beautiful recipe page with a story note.\";\r\n        }\r\n        return \"Write a children's story about \" + values.detail + \" for a young child. \" +\r\n          \"About 200 words, gentle, happy ending, and suggest a title.\";\r\n      }\r\n    },\r\n    {\r\n      categoryKey: \"safety-check\",\r\n      title: \"Check a suspicious message\",\r\n      hint: \"Paste a strange message, email, or call summary. The helper checks it for scams.\",\r\n      fields: [\r\n        { fieldKey: \"pastedText\", label: \"Paste the message or describe the call\", placeholder: \"Paste the suspicious text here...\", kind: \"textarea\", wide: true }\r\n      ],\r\n      buildPrompt: function (values) {\r\n        return \"SCAM ANALYSIS TASK. An older adult received this message or call. \" +\r\n          \"Please say clearly whether it looks like a scam, why, and exactly what the person should do - and what not to do. \" +\r\n          \"Remind them: never send money because of a call or message, never share passwords or card numbers, \" +\r\n          \"hang up and call the real number themselves, and ask family when unsure.\\n\\n\" +\r\n          values.pastedText;\r\n      }\r\n    }\r\n  ];\r\n\r\n  var appElement = null;\r\n  var savedValue = null;\r\n  var currentCategoryKey = \"free-question\";\r\n  var currentUser = null;\r\n  var noIdentityMode = false;\r\n  var readOnlyMode = false;\r\n  var chatMessages = [];\r\n  var chatSessionObjectId = \"\";\r\n  var instanceId = \"\";\r\n  var parentRecordId = \"\";\r\n  var lastStagedJson = \"\";\r\n  var chatStoreAvailable = true;\r\n  var warnedChatStoreMissing = false;\r\n  var persistTimer = null;\r\n  var speakingNow = false;\r\n  var listenMode = false;\r\n  var textScaleIndex = 0;\r\n  var askedForAiBefore = false;\r\n\r\n  function byId(id) { return document.getElementById(id); }\r\n\r\n  /* ---------- small helpers ---------- */\r\n\r\n  function escapeHtml(text) {\r\n    return String(text)\r\n      .replace(/&/g, \"&amp;\")\r\n      .replace(/<\/g, \"&lt;\")\r\n      .replace(/>/g, \"&gt;\")\r\n      .replace(/\"/g, \"&quot;\");\r\n  }\r\n\r\n  function escapePromptText(text) {\r\n    return escapeHtml(text);\r\n  }\r\n\r\n  function formatAiAnswer(plainText) {\r\n    var paragraphs = String(plainText || \"\").split(/\\n{2,}/);\r\n    var htmlParts = [];\r\n    paragraphs.forEach(function (paragraph) {\r\n      var trimmed = paragraph.replace(/\\s+/g, \" \").trim();\r\n      if (trimmed) { htmlParts.push(\"<p>\" + escapeHtml(trimmed) + \"<\/p>\"); }\r\n    });\r\n    return htmlParts.join(\"\");\r\n  }\r\n\r\n  function displayNameOf(user) {\r\n    if (!user) { return \"\"; }\r\n    if (user.name) { return user.name; }\r\n    if (user.email) { return user.email.split(\"@\")[0]; }\r\n    return \"\";\r\n  }\r\n\r\n  function firstNameOf(userName) {\r\n    if (!userName) { return \"\"; }\r\n    return userName.split(\" \")[0];\r\n  }\r\n\r\n  function timestampLabel() {\r\n    var now = new Date();\r\n    var hours = String(now.getHours()).padStart(2, \"0\");\r\n    var minutes = String(now.getMinutes()).padStart(2, \"0\");\r\n    return hours + \":\" + minutes;\r\n  }\r\n\r\n  function tryNotify(message, severity) {\r\n    if (typeof tool.notify === \"function\") { tool.notify(message, severity); }\r\n  }\r\n\r\n  /* ---------- roles ---------- */\r\n\r\n  function userRoles() {\r\n    if (currentUser && currentUser.roles && currentUser.roles.length) { return currentUser.roles; }\r\n    if (currentUser && currentUser.effectiveAccess) {\r\n      var rolesFromAccess = [];\r\n      if (currentUser.effectiveAccess.isManager) { rolesFromAccess.push(\"admin\"); }\r\n      else if (currentUser.effectiveAccess.isEditor) { rolesFromAccess.push(\"editor\"); }\r\n      else if (currentUser.effectiveAccess.isViewer) { rolesFromAccess.push(\"viewer\"); }\r\n      if (rolesFromAccess.length) { return rolesFromAccess; }\r\n    }\r\n    return [];\r\n  }\r\n\r\n  function canAskAi() {\r\n    if (readOnlyMode) { return false; }\r\n    if (noIdentityMode) { return true; }\r\n    var roles = userRoles();\r\n    return roles.indexOf(\"admin\") !== -1 ||\r\n      roles.indexOf(\"editor\") !== -1 ||\r\n      roles.indexOf(\"owner\") !== -1 ||\r\n      roles.indexOf(\"developer\") !== -1 ||\r\n      roles.indexOf(\"user-manager\") !== -1;\r\n  }\r\n\r\n  function hasUserApi() {\r\n    return typeof tool.getUser === \"function\";\r\n  }\r\n\r\n  function refreshUserWithFallback() {\r\n    if (!hasUserApi()) { return; }\r\n    try {\r\n      var userNow = tool.getUser();\r\n      if (userNow) { currentUser = userNow; }\r\n    } catch (error) { /* ignore */ }\r\n  }\r\n\r\n  function startIdentityPolling() {\r\n    if (typeof tool.getUser !== \"function\") {\r\n      noIdentityMode = true;\r\n      applyReadOnlyState();\r\n      return;\r\n    }\r\n    var delays = [400, 1200, 2600, 5000];\r\n    delays.forEach(function (delay) {\r\n      setTimeout(function () {\r\n        refreshUserWithFallback();\r\n        if (!currentUser || !userRoles().length) { noIdentityMode = true; }\r\n        applyReadOnlyState();\r\n      }, delay);\r\n    });\r\n  }\r\n\r\n  /* ---------- saved value ---------- */\r\n\r\n  function normalizeSavedValue(value) {\r\n    if (!value || typeof value !== \"object\") { value = {}; }\r\n    if (!value.settings || typeof value.settings !== \"object\") { value.settings = {}; }\r\n    value.version = VALUE_VERSION;\r\n    if (!value.settings.textScale) { value.settings.textScale = \"normal\"; }\r\n    if (typeof value.settings.listenMode !== \"boolean\") { value.settings.listenMode = false; }\r\n    if (!value._instanceId) { value._instanceId = instanceId || (INSTANCE_PREFIX + \"local\"); }\r\n    if (!value._parentRecordId) { value._parentRecordId = parentRecordId; }\r\n    if (!value._sessionObjectId) { value._sessionObjectId = \"\"; }\r\n    return value;\r\n  }\r\n\r\n  function persistSavedValue() {\r\n    var snapshotJson = JSON.stringify(savedValue);\r\n    if (snapshotJson === lastStagedJson) { return; }\r\n    lastStagedJson = snapshotJson;\r\n    if (typeof tool.setValue === \"function\") { tool.setValue(JSON.parse(snapshotJson)); }\r\n  }\r\n\r\n  /* ---------- chat session persistence ---------- */\r\n\r\n  function parentRecordIdFromUrl() {\r\n    if (typeof tool.getParentPageUrl !== \"function\") { return \"\"; }\r\n    var pageUrl = tool.getParentPageUrl() || \"\";\r\n    var cutIndex = Math.max(pageUrl.indexOf(\"?\"), pageUrl.indexOf(\"#\"));\r\n    if (cutIndex >= 0) { pageUrl = pageUrl.slice(0, cutIndex); }\r\n    var parts = pageUrl.split(\"/\").filter(function (part) { return part.length > 0; });\r\n    return parts.length ? parts[parts.length - 1] : \"\";\r\n  }\r\n\r\n  function buildSessionData() {\r\n    return {\r\n      _toolInstanceId: instanceId,\r\n      messages: chatMessages\r\n    };\r\n  }\r\n\r\n  function createChatSessionObject() {\r\n    if (!chatStoreAvailable) { return; }\r\n    tool.requestObjects(\"create\", {\r\n      mainObjectType: CHAT_SESSION_TYPE,\r\n      name: \"Senior Helper Chat\",\r\n      productData: { data_categoriesBased: buildSessionData() }\r\n    }, function (error, result) {\r\n      if (error || !result || !result.object) {\r\n        chatStoreAvailable = false;\r\n        warnChatStoreUnavailableOnce();\r\n        return;\r\n      }\r\n      chatSessionObjectId = result.object.id;\r\n      savedValue._sessionObjectId = chatSessionObjectId;\r\n      persistSavedValue();\r\n    });\r\n  }\r\n\r\n  function loadChatSessionObject() {\r\n    if (typeof tool.requestObjects !== \"function\") {\r\n      chatStoreAvailable = false;\r\n      warnChatStoreUnavailableOnce();\r\n      return;\r\n    }\r\n    tool.requestObjects(\"query\", { mainObjectType: CHAT_SESSION_TYPE }, function (error, result) {\r\n      if (error) {\r\n        chatStoreAvailable = false;\r\n        warnChatStoreUnavailableOnce();\r\n        return;\r\n      }\r\n      var objects = (result && result.objects) || [];\r\n      var matchingSession = null;\r\n      for (var i = 0; i < objects.length; i++) {\r\n        var objectData = objects[i];\r\n        var dataFields = (objectData.productData && objectData.productData.data_categoriesBased) || {};\r\n        if (dataFields._toolInstanceId === instanceId) {\r\n          matchingSession = objectData;\r\n          break;\r\n        }\r\n      }\r\n      if (!matchingSession) {\r\n        createChatSessionObject();\r\n        return;\r\n      }\r\n      chatSessionObjectId = matchingSession.id;\r\n      savedValue._sessionObjectId = chatSessionObjectId;\r\n      persistSavedValue();\r\n      var storedMessages = matchingSession.productData.data_categoriesBased.messages;\r\n      if (Array.isArray(storedMessages)) { chatMessages = storedMessages; }\r\n      renderChatMessages();\r\n    });\r\n  }\r\n\r\n  function warnChatStoreUnavailableOnce() {\r\n    if (warnedChatStoreMissing) { return; }\r\n    warnedChatStoreMissing = true;\r\n    tryNotify(\"Chat history will not be saved for this record\", \"warning\");\r\n  }\r\n\r\n  function persistChatSessionSoon() {\r\n    if (!chatStoreAvailable || !chatSessionObjectId || typeof tool.requestObjects !== \"function\") { return; }\r\n    if (persistT
