<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Company Work Order — Test Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="BusCompanyWorkOrder.css">
<style>
body { padding-top: 28px !important; margin: 0; }
#app { min-height: calc(100vh - 28px); }
#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #0f172a; color: #e6edf5; font-family: system-ui; font-size: 11px; padding: 4px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#th-bar strong { color: #60a5fa; letter-spacing: 0.5px; }
#th-bar .sep { color: #475569; }
#th-bar button { border: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; font-family: system-ui; font-weight: 600; white-space: nowrap; }
#th-bar .btn-load { background: #2563eb; color: #fff; }
#th-bar .btn-clear { background: #dc2626; color: #fff; }
#th-bar .btn-reload { background: #16a34a; color: #fff; }
#th-bar .btn-dump { background: #7c3aed; color: #fff; }
#th-bar .btn-toggle-ro { background: #d97706; color: #fff; }
#th-bar .btn-add-vehicles { background: #0d9488; color: #fff; }
#th-bar .btn-add-staff { background: #0891b2; color: #fff; }
#th-bar .hint { color: #64748b; font-size: 10px; }
@keyframes toolFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="th-bar">
  <strong>TEST HARNESS — Bus Work Order</strong><span class="sep">|</span>
  <button class="btn-load" id="th-load-sample">Load Sample</button>
  <button class="btn-clear" id="th-clear">Clear All</button>
  <button class="btn-reload" id="th-reload">Reload</button>
  <button class="btn-dump" id="th-dump">Dump DB</button>
  <button class="btn-toggle-ro" id="th-toggle-ro">Toggle RO</button>
  <button class="btn-add-vehicles" id="th-add-vehicles">+Mock Vehicles</button>
  <button class="btn-add-staff" id="th-add-staff">+Mock Staff</button>
  <span class="sep">|</span>
  <span id="th-status" class="hint">Ready</span>
</div>
<div id="app-container"></div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- STEP 1: Mock tool SDK with param-based types + staff     -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script>
(function() {
  var STORAGE_KEY = 'bus_workorder_test_db';

  /* ── Separate localStorage keys for each mock CMS type ── */
  function storageKeyForType(typeId) { return 'mock_cms_' + typeId; }
  function loadObjects(typeId) {
    try { var raw = localStorage.getItem(storageKeyForType(typeId)); return raw ? JSON.parse(raw) : []; }
    catch(e) { return []; }
  }
  function saveObjects(typeId, arr) { try { localStorage.setItem(storageKeyForType(typeId), JSON.stringify(arr)); } catch(e) {} }

  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [], permittedUsersChange: [] };
  var _readOnly = false, _user = null, _fields = {}, _value = null;

  /* Permitted users — acts as fallback when no staff type is configured */
  var _permittedUsers = [
    { id: 'user-1', name: 'Ahmet Yilmaz', email: 'ahmet@buscompany.com', roles: ['technician'] },
    { id: 'user-2', name: 'Mehmet Demir', email: 'mehmet@buscompany.com', roles: ['technician'] },
    { id: 'user-3', name: 'Ayse Kaya', email: 'ayse@buscompany.com', roles: ['senior-tech'] }
  ];

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch(e) { _value = null; }
  }
  function save(v) { _value = v; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch(e) {} }

  var _uploadCounter = 0;

  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { save(data); listeners.valueChange.forEach(function(cb) { try { cb(data); } catch(e) {} }); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },
    getFields: function() { return Object.assign({}, _fields); },
    setField: function(id, value) { _fields[id] = value; },
    setFields: function(obj) { Object.assign(_fields, obj); },
    watchField: function(id, cb) { listeners.fieldsChange.push(function(f) { try { cb(f[id], f); } catch(e) {} }); },
    onFieldsChange: function(cb) { listeners.fieldsChange.push(cb); },

    /* param() supports URL overrides for testing custom types */
    param: function(name, fallback) {
      var p = (new URLSearchParams(window.location.search)).get(name);
      return p !== null && p !== '' ? p : fallback;
    },

    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    getUser: function() { return _user || { id: 'test-user', name: 'Test User', email: 'test@buscompany.com', roles: ['admin'] }; },
    onUserChange: function(cb) { listeners.userChange.push(cb); },
    getPermittedUsers: function() { return _permittedUsers; },
    onPermittedUsersChange: function(cb) { listeners.permittedUsersChange.push(cb); },
    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#2563eb', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 2500);
    },
    resize: function() {},
    declareOutput: function() {},
    declareParams: function() {},
    reportMissingParams: function(missing, message) {
      if (missing && missing.length > 0) {
        console.warn('[Missing Params] ' + (message || 'Parameters need configuration'));
        missing.forEach(function(p) {
          console.warn('  • ' + p.label + ' (' + p.name + '): ' + p.reason + ' [default: ' + p.default + ']');
        });
        window.tool.notify('⚠️ ' + missing.length + ' parameter(s) need configuration. Check console for details.', 'warning');
      }
    },

    /* ── requestObjects mock — handles any type ID dynamically ── */
    requestObjects: function(action, params, callback) {
      setTimeout(function() {
        var typeId = params.mainObjectType;
        if (action === 'query') {
          var objects = loadObjects(typeId);
          callback(null, { objects: objects });
        } else if (action === 'create') {
          var objects = loadObjects(typeId);
          var pd = params.productData || { data_categoriesBased: {} };
          var newObj = {
            id: typeId + '-' + Date.now(),
            _id: typeId + '-' + Date.now(),
            contentId: typeId + '-' + Date.now(),
            name: params.name || 'Untitled',
            slug: (params.name || 'untitled').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''),
            cmsObjectType: typeId,
            typeId: params.typeId || 'default',
            tenantId: 'test-tenant',
            productData: pd,
            permissions: {},
            created: new Date().toISOString(),
            updated: new Date().toISOString()
          };
          objects.push(newObj);
          saveObjects(typeId, objects);
          callback(null, { object: newObj });
        } else if (action === 'get') {
          var objects = loadObjects(typeId);
          var found = objects.find(function(o) { return o.id === params.objectId; }) || null;
          callback(null, { object: found });
        } else if (action === 'update') {
          var objects = loadObjects(typeId);
          var idx = objects.findIndex(function(o) { return o.id === params.objectId; });
          if (idx >= 0) {
            if (params.name) objects[idx].name = params.name;
            if (params.productData) objects[idx].productData = params.productData;
            objects[idx].updated = new Date().toISOString();
            saveObjects(typeId, objects);
          }
          callback(null, { ok: true });
        } else if (action === 'delete') {
          var objects = loadObjects(typeId);
          saveObjects(typeId, objects.filter(function(o) { return o.id !== params.objectId; }));
          callback(null, { ok: true });
        } else {
          callback(null, { ok: true });
        }
      }, 100);
    },

    requestUpload: function(accept, callback) {
      _uploadCounter++;
      var mockFile = {
        name: 'sample-document-' + _uploadCounter + '.pdf',
        url: 'https://example.com/files/sample-document-' + _uploadCounter + '.pdf',
        size: Math.floor(Math.random() * 5000000) + 50000,
        type: 'application/pdf'
      };
      setTimeout(function() { callback(null, mockFile); }, 150);
    },

    onReady: function(cb) { load(); cb(_value, _fields); },

    /* ── Test harness helpers ── */
    _setReadOnly: function(v) {
      _readOnly = v;
      listeners.readonlyChange.forEach(function(cb) { try { cb(v); } catch(e) {} });
    },
    _clearData: function() {
      localStorage.removeItem(STORAGE_KEY);
      /* Also clear mock CMS data */
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('mock_cms_') === 0 || k.indexOf('bus_workorder_test') === 0)) keys.push(k);
      }
      keys.forEach(function(k) { localStorage.removeItem(k); });
      window.location.reload();
    },
    _dump: function() {
      console.log('Work Order DB:', JSON.parse(JSON.stringify(_value)));
      console.log('Mock Vehicles:', loadObjects('vehicles-uniconbaseapps'));
      console.log('Mock Staff:', loadObjects('staff-uniconbaseapps'));
    },

    _loadSampleData: function() {
      /* First ensure mock vehicles and staff exist */
      if (loadObjects('vehicles-uniconbaseapps').length === 0) this._addMockVehicles();
      if (loadObjects('staff-uniconbaseapps').length === 0) this._addMockStaff();
      /* Now load sample work order */
      var sample = {
        status: 'active', busId: 'vehicles-uniconbaseapps-1', busName: '34 ABC 123', odometer: '125000', date: '2026-07-09',
        technician: 'Ahmet Yilmaz', technicianId: 'staff-uniconbaseapps-1',
        files: [
          { name: 'inspection-report.pdf', url: 'https://example.com/files/inspection.pdf', size: 245000, type: 'application/pdf' },
          { name: 'engine-photo.jpg', url: 'https://example.com/files/engine.jpg', size: 1800000, type: 'image/jpeg' }
        ],
        records: [
          { id: 'rec1', complaint: 'Brake noise when stopping at low speeds', solution: 'Replaced front brake pads and resurfaced rotors', technician: 'Mehmet Demir', technicianId: 'staff-uniconbaseapps-2', isDone: true },
          { id: 'rec2', complaint: 'Air conditioning not cooling properly', solution: 'Recharged AC refrigerant and replaced cabin filter', technician: 'Ayse Kaya', technicianId: 'staff-uniconbaseapps-3', isDone: true },
          { id: 'rec3', complaint: 'Check engine light on — error code P0401 (EGR flow insufficient)', solution: '', technician: '', technicianId: '', isDone: false }
        ],
        lockedAt: null, lockedBy: null, _theme: 'light'
      };
      save(sample);
      window.location.reload();
    },

    _addMockVehicles: function() {
      var typeId = this.param('vehiclesTypeId', 'vehicles-uniconbaseapps');
      var vehicles = [
        { id: typeId + '-1', _id: typeId + '-1', contentId: typeId + '-1', name: '34 ABC 123', slug: '34-abc-123', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { plate: '34 ABC 123', make: 'Mercedes-Benz', model: 'Sprinter 315 CDI', year: 2024 } }, permissions: {}, created: '2026-01-15T10:00:00Z', updated: '2026-01-15T10:00:00Z' },
        { id: typeId + '-2', _id: typeId + '-2', contentId: typeId + '-2', name: '34 DEF 456', slug: '34-def-456', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { plate: '34 DEF 456', make: 'Volvo', model: 'B8R', year: 2023 } }, permissions: {}, created: '2026-02-20T10:00:00Z', updated: '2026-02-20T10:00:00Z' },
        { id: typeId + '-3', _id: typeId + '-3', contentId: typeId + '-3', name: '06 GHI 789', slug: '06-ghi-789', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { plate: '06 GHI 789', make: 'MAN', model: "Lion's Coach", year: 2025 } }, permissions: {}, created: '2026-03-10T10:00:00Z', updated: '2026-03-10T10:00:00Z' },
        { id: typeId + '-4', _id: typeId + '-4', contentId: typeId + '-4', name: '34 JKL 012', slug: '34-jkl-012', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { plate: '34 JKL 012', make: 'Mercedes-Benz', model: 'Tourismo 16 RHD', year: 2024 } }, permissions: {}, created: '2026-04-05T10:00:00Z', updated: '2026-04-05T10:00:00Z' }
      ];
      saveObjects(typeId, vehicles);
      window.tool.notify('4 mock vehicles added to "' + typeId + '". Reload to use.', 'success');
    },

    _addMockStaff: function() {
      var typeId = this.param('staffTypeId', 'staff-uniconbaseapps');
      var staff = [
        { id: typeId + '-1', _id: typeId + '-1', contentId: typeId + '-1', name: 'Ahmet Yilmaz', slug: 'ahmet-yilmaz', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { role: 'technician', email: 'ahmet@buscompany.com', phone: '555-1001' } }, permissions: {}, created: '2026-01-10T10:00:00Z', updated: '2026-01-10T10:00:00Z' },
        { id: typeId + '-2', _id: typeId + '-2', contentId: typeId + '-2', name: 'Mehmet Demir', slug: 'mehmet-demir', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { role: 'technician', email: 'mehmet@buscompany.com', phone: '555-1002' } }, permissions: {}, created: '2026-02-15T10:00:00Z', updated: '2026-02-15T10:00:00Z' },
        { id: typeId + '-3', _id: typeId + '-3', contentId: typeId + '-3', name: 'Ayse Kaya', slug: 'ayse-kaya', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { role: 'technician', email: 'ayse@buscompany.com', phone: '555-1003' } }, permissions: {}, created: '2026-03-01T10:00:00Z', updated: '2026-03-01T10:00:00Z' },
        { id: typeId + '-4', _id: typeId + '-4', contentId: typeId + '-4', name: 'Fatma Sahin', slug: 'fatma-sahin', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { role: 'technician', email: 'fatma@buscompany.com', phone: '555-1004' } }, permissions: {}, created: '2026-04-01T10:00:00Z', updated: '2026-04-01T10:00:00Z' },
        { id: typeId + '-5', _id: typeId + '-5', contentId: typeId + '-5', name: 'Mustafa Ozturk', slug: 'mustafa-ozturk', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { role: 'supervisor', email: 'mustafa@buscompany.com', phone: '555-2001' } }, permissions: {}, created: '2026-01-20T10:00:00Z', updated: '2026-01-20T10:00:00Z' },
        { id: typeId + '-6', _id: typeId + '-6', contentId: typeId + '-6', name: 'Ali Celik', slug: 'ali-celik', cmsObjectType: typeId, typeId: 'default', tenantId: 'test-tenant', productData: { data_categoriesBased: { role: 'driver', email: 'ali@buscompany.com', phone: '555-3001' } }, permissions: {}, created: '2026-05-10T10:00:00Z', updated: '2026-05-10T10:00:00Z' }
      ];
      saveObjects(typeId, staff);
      window.tool.notify('6 mock staff added to "' + typeId + '" (4 technicians, 1 supervisor, 1 driver). Reload to use.', 'success');
    }
  };

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); window.tool._setReadOnly(!window.tool.isReadOnly()); window.tool.notify(window.tool.isReadOnly() ? 'READ-ONLY MODE' : 'EDIT MODE', 'info'); }
    if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); window.tool._dump(); window.tool.notify('DB dumped to console', 'info'); }
  });
})();
</script>

<script>
document.getElementById('app-container').innerHTML =
  '<div id="app">' +
  '  <header class="header">' +
  '    <div class="header-left">' +
  '      <div class="brand-icon">🔧</div>' +
  '      <div>' +
  '        <h1 class="title">Bus Work Order</h1>' +
  '        <div class="subtitle" id="header-bus-name">No vehicle selected</div>' +
  '      </div>' +
  '    </div>' +
  '    <div class="header-right">' +
  '      <span class="status-badge" id="status-badge">● Active</span>' +
  '      <button class="btn-icon theme-toggle" id="theme-toggle" title="Toggle theme" onclick="toggleTheme()">🌙</button>' +
  '    </div>' +
  '  </header>' +
  '  <section class="card">' +
  '    <div class="card-header"><h2 class="card-title">📋 General Information</h2></div>' +
  '    <div class="card-body">' +
  '      <div class="form-grid">' +
  '        <div class="form-group">' +
  '          <label class="form-label" for="bus-select">Vehicle <span class="req">*</span></label>' +
  '          <div class="input-row">' +
  '            <select id="bus-select" class="form-select" onchange="onBusChange()"><option value="">— Select a Vehicle —</option></select>' +
  '            <button class="btn-icon-sm" id="btn-refresh-buses" title="Refresh vehicle list" onclick="loadBuses(function(){renderBusDropdown()})">↻</button>' +
  '            <button class="btn-icon-sm btn-add-bus" id="btn-add-bus" title="Add a new vehicle" onclick="openAddBusModal()">＋</button>' +

  '          <span class="diag-info" id="diag-vehicles"></span>' +
  '        </div>' +

  '          <label class="form-label" for="odometer">Odometer (km) <span class="req">*</span></label>' +
  '          <input type="number" id="odometer" class="form-input" placeholder="e.g. 125000" min="0" step="1" onchange="onOdometerChange()">' +
  '        </div>' +
  '        <div class="form-group">' +
  '          <label class="form-label" for="work-date">Work Order Date <span class="req">*</span></label>' +
  '          <input type="date" id="work-date" class="form-input" onchange="onDateChange()">' +
  '        </div>' +
  '        <div class="form-group">' +
  '          <label class="form-label" for="technician-select">Assigned Technician</label>' +
  '          <select id="technician-select" class="form-select" onchange="onTechnicianChange()"><option value="">— Select Technician —</option></select>' +
  '          <span class="diag-info" id="diag-staff"></span>' +
  '        </div>' +
  '      </div>' +
  '      <div class="files-section">' +
  '        <label class="form-label">Attachments</label>' +
  '        <div class="files-area">' +
  '          <button class="btn btn-upload" id="btn-upload" onclick="uploadFile()">📎 Upload File</button>' +
  '          <span class="upload-hint">PDF, DOCX, XLSX, images — max 10MB each</span>' +
  '        </div>' +
  '        <div class="files-list" id="files-list"></div>' +
  '      </div>' +
  '    </div>' +
  '  </section>' +
  '  <section class="card">' +
  '    <div class="card-header">' +
  '      <h2 class="card-title">🔩 Complaints &amp; Solutions</h2>' +
  '      <span class="card-badge" id="records-count">0 records</span>' +
  '      <button class="btn btn-primary btn-sm" id="btn-add-record" onclick="addRecord()">＋ Add Record</button>' +
  '    </div>' +
  '    <div class="card-body card-body-table">' +
  '      <div class="table-wrapper">' +
  '        <table class="data-table" id="records-table">' +
  '          <thead><tr><th class="col-num">#</th><th class="col-complaint">Complaint</th><th class="col-solution">Solution Applied</th><th class="col-tech">Technician</th><th class="col-done">Done?</th><th class="col-actions"></th></tr></thead>' +
  '          <tbody id="records-tbody"></tbody>' +
  '        </table>' +
  '      </div>' +
  '      <div class="empty-state" id="records-empty">No maintenance records yet. Click <strong>＋ Add Record</strong> to begin.</div>' +
  '    </div>' +
  '  </section>' +
  '  <footer class="footer">' +
  '    <div class="footer-left"><span class="footer-hint" id="save-hint">All changes auto-saved</span></div>' +
  '    <div class="footer-right">' +
  '      <span class="locked-info" id="locked-info" style="display:none"></span>' +
  '      <button class="btn btn-lock" id="btn-lock" onclick="lockWorkOrder()">🔒 Lock &amp; Close Work Order</button>' +
  '    </div>' +
  '  </footer>' +
  '  <div class="modal-overlay" id="modal-overlay" style="display:none"></div>' +
  '  <div class="modal" id="modal-add-bus" style="display:none">' +
  '    <div class="modal-header"><h3>🚌 Add New Vehicle</h3><button class="btn-close-modal" id="btn-close-modal" onclick="closeAddBusModal()">✕</button></div>' +
  '    <div class="modal-body">' +
  '      <div class="form-group"><label class="form-label" for="new-bus-plate">Plate / Vehicle Number <span class="req">*</span></label><input type="text" id="new-bus-plate" class="form-input" placeholder="e.g. 34 ABC 123"></div>' +
  '      <div class="form-group"><label class="form-label" for="new-bus-make">Make</label><input type="text" id="new-bus-make" class="form-input" placeholder="e.g. Mercedes-Benz"></div>' +
  '      <div class="form-group"><label class="form-label" for="new-bus-model">Model</label><input type="text" id="new-bus-model" class="form-input" placeholder="e.g. Sprinter 315 CDI"></div>' +
  '      <div class="form-group"><label class="form-label" for="new-bus-year">Year</label><input type="number" id="new-bus-year" class="form-input" placeholder="e.g. 2024" min="1990" max="2035" step="1"></div>' +
  '    </div>' +
  '    <div class="modal-footer"><button class="btn btn-cancel" id="btn-cancel-bus" onclick="closeAddBusModal()">Cancel</button><button class="btn btn-primary" id="btn-save-bus" onclick="saveNewBus()">Save Vehicle</button></div>' +
  '  </div>' +
  '  <div class="modal-overlay" id="lock-overlay" style="display:none"></div>' +
  '  <div class="modal modal-sm" id="modal-lock" style="display:none">' +
  '    <div class="modal-header"><h3>🔒 Lock Work Order?</h3><button class="btn-close-modal" id="btn-close-lock" onclick="closeLockModal()">✕</button></div>' +
  '    <div class="modal-body">' +
