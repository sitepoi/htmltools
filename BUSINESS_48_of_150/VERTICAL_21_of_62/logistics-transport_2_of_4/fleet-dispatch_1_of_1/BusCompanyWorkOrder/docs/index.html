chnician<\/th>\r\n              <th class=\"col-done\">Done?<\/th>\r\n              <th class=\"col-actions\"><\/th>\r\n            <\/tr>\r\n          <\/thead>\r\n          <tbody id=\"records-tbody\"><\/tbody>\r\n        <\/table>\r\n      <\/div>\r\n      <div class=\"empty-state\" id=\"records-empty\">No maintenance records yet. Click <strong>＋ Add Record<\/strong> to begin.<\/div>\r\n    <\/div>\r\n  <\/section>\r\n\r\n  <!-- FOOTER -->\r\n  <footer class=\"footer\">\r\n    <div class=\"footer-left\">\r\n      <span class=\"footer-hint\" id=\"save-hint\">All changes auto-saved<\/span>\r\n    <\/div>\r\n    <div class=\"footer-right\">\r\n      <span class=\"locked-info\" id=\"locked-info\" style=\"display:none\"><\/span>\r\n      <button class=\"btn btn-lock\" id=\"btn-lock\" onclick=\"lockWorkOrder()\">🔒 Lock &amp; Close Work Order<\/button>\r\n    <\/div>\r\n  <\/footer>\r\n\r\n  <!-- ADD BUS MODAL -->\r\n  <div class=\"modal-overlay\" id=\"modal-overlay\" style=\"display:none\"><\/div>\r\n  <div class=\"modal\" id=\"modal-add-bus\" style=\"display:none\">\r\n    <div class=\"modal-header\">\r\n      <h3>🚌 Add New Vehicle<\/h3>\r\n      <button class=\"btn-close-modal\" id=\"btn-close-modal\" onclick=\"closeAddBusModal()\">✕<\/button>\r\n    <\/div>\r\n    <div class=\"modal-body\">\r\n      <div class=\"form-group\">\r\n        <label class=\"form-label\" for=\"new-bus-plate\">Plate / Vehicle Number <span class=\"req\">*<\/span><\/label>\r\n        <input type=\"text\" id=\"new-bus-plate\" class=\"form-input\" placeholder=\"e.g. 34 ABC 123\">\r\n      <\/div>\r\n      <div class=\"form-group\">\r\n        <label class=\"form-label\" for=\"new-bus-make\">Make<\/label>\r\n        <input type=\"text\" id=\"new-bus-make\" class=\"form-input\" placeholder=\"e.g. Mercedes-Benz\">\r\n      <\/div>\r\n      <div class=\"form-group\">\r\n        <label class=\"form-label\" for=\"new-bus-model\">Model<\/label>\r\n        <input type=\"text\" id=\"new-bus-model\" class=\"form-input\" placeholder=\"e.g. Sprinter 315 CDI\">\r\n      <\/div>\r\n      <div class=\"form-group\">\r\n        <label class=\"form-label\" for=\"new-bus-year\">Year<\/label>\r\n        <input type=\"number\" id=\"new-bus-year\" class=\"form-input\" placeholder=\"e.g. 2024\" min=\"1990\" max=\"2035\" step=\"1\">\r\n      <\/div>\r\n    <\/div>\r\n    <div class=\"modal-footer\">\r\n      <button class=\"btn btn-cancel\" id=\"btn-cancel-bus\" onclick=\"closeAddBusModal()\">Cancel<\/button>\r\n      <button class=\"btn btn-primary\" id=\"btn-save-bus\" onclick=\"saveNewBus()\">Save Vehicle<\/button>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- LOCK CONFIRMATION MODAL -->\r\n  <div class=\"modal-overlay\" id=\"lock-overlay\" style=\"display:none\"><\/div>\r\n  <div class=\"modal modal-sm\" id=\"modal-lock\" style=\"display:none\">\r\n    <div class=\"modal-header\">\r\n      <h3>🔒 Lock Work Order?<\/h3>\r\n      <button class=\"btn-close-modal\" id=\"btn-close-lock\" onclick=\"closeLockModal()\">✕<\/button>\r\n    <\/div>\r\n    <div class=\"modal-body\">\r\n      <p class=\"lock-warning\">Once locked, this work order becomes <strong>permanently read-only<\/strong>. No further edits can be made.<\/p>\r\n      <p>Are you sure you want to continue?<\/p>\r\n    <\/div>\r\n    <div class=\"modal-footer\">\r\n      <button class=\"btn btn-cancel\" id=\"btn-cancel-lock\" onclick=\"closeLockModal()\">Cancel<\/button>\r\n      <button class=\"btn btn-danger\" id=\"btn-confirm-lock\" onclick=\"confirmLock()\">Yes, Lock It<\/button>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"BusCompanyWorkOrder.css","src":"../app/BusCompanyWorkOrder.css","content":"*,\r\n*::before,\r\n*::after {\r\n  box-sizing: border-box;\r\n  margin: 0;\r\n  padding: 0;\r\n}\r\n\r\n:root {\r\n  --bg: #f4f6f9;\r\n  --surface: #ffffff;\r\n  --surface2: #f0f2f6;\r\n  --surface3: #e4e7ed;\r\n  --border: #dde0e6;\r\n  --border2: #c8ccd4;\r\n  --text: #0f172a;\r\n  --text2: #475569;\r\n  --text3: #94a3b8;\r\n  --accent: #2563eb;\r\n  --accent2: #1d4ed8;\r\n  --accent-bg: #eff6ff;\r\n  --green: #16a34a;\r\n  --green-bg: #eaf7ee;\r\n  --amber: #d97706;\r\n  --amber-bg: #fffbeb;\r\n  --red: #dc2626;\r\n  --red-bg: #fef2f2;\r\n  --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;\r\n  --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace;\r\n  --r: 12px;\r\n  --r2: 8px;\r\n  --r3: 6px;\r\n  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);\r\n  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);\r\n  --shadow-md: 0 4px 16px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);\r\n  --shadow-lg: 0 12px 40px rgba(0,0,0,.15);\r\n  --max-w: 960px;\r\n}\r\n\r\n[data-theme=\"dark\"] {\r\n  --bg: #0a0e14;\r\n  --surface: #11161d;\r\n  --surface2: #161c26;\r\n  --surface3: #1c2330;\r\n  --border: #212837;\r\n  --border2: #2d3548;\r\n  --text: #e6edf5;\r\n  --text2: #8b96a8;\r\n  --text3: #555f73;\r\n  --accent: #60a5fa;\r\n  --accent2: #3b82f6;\r\n  --accent-bg: #0b1a30;\r\n  --green: #4ade80;\r\n  --green-bg: #0a2618;\r\n  --amber: #fbbf24;\r\n  --amber-bg: #1f1708;\r\n  --red: #f87171;\r\n  --red-bg: #260d0d;\r\n  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);\r\n  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.2);\r\n  --shadow-md: 0 4px 16px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.25);\r\n  --shadow-lg: 0 12px 40px rgba(0,0,0,.5);\r\n}\r\n\r\nbody {\r\n  font-family: var(--font);\r\n  background: var(--bg);\r\n  color: var(--text);\r\n  font-size: 14px;\r\n  line-height: 1.6;\r\n  min-height: 100vh;\r\n  transition: background .2s, color .2s;\r\n  -webkit-font-smoothing: antialiased;\r\n}\r\n\r\n/* ── App Container ── */\r\n#app {\r\n  max-width: var(--max-w);\r\n  margin: 0 auto;\r\n  padding: 20px 24px 40px;\r\n  animation: fadeIn .3s ease;\r\n}\r\n@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }\r\n\r\n/* ── Header ── */\r\n.header {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  padding: 20px 24px;\r\n  background: var(--surface);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--r);\r\n  box-shadow: var(--shadow-sm);\r\n  margin-bottom: 20px;\r\n}\r\n.header-left { display: flex; align-items: center; gap: 14px; }\r\n.brand-icon { font-size: 32px; line-height: 1; }\r\n.title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }\r\n.subtitle { font-size: 13px; color: var(--text3); margin-top: 2px; }\r\n.header-right { display: flex; align-items: center; gap: 12px; }\r\n\r\n.status-badge {\r\n  display: inline-flex; align-items: center; gap: 6px;\r\n  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;\r\n  padding: 5px 14px; border-radius: 20px;\r\n}\r\n.status-badge.active { background: var(--green-bg); color: var(--green); }\r\n.status-badge.locked { background: var(--red-bg); color: var(--red); }\r\n.theme-toggle {\r\n  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r3);\r\n  padding: 6px 10px; cursor: pointer; font-size: 16px; line-height: 1;\r\n  transition: background .15s;\r\n}\r\n.theme-toggle:hover { background: var(--surface3); }\r\n\r\n/* ── Cards ── */\r\n.card {\r\n  background: var(--surface);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--r);\r\n  box-shadow: var(--shadow-sm);\r\n  margin-bottom: 20px;\r\n  overflow: hidden;\r\n}\r\n.card-header {\r\n  display: flex; align-items: center; gap: 12px;\r\n  padding: 16px 24px; border-bottom: 1px solid var(--border);\r\n  background: var(--surface2);\r\n}\r\n.card-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }\r\n.card-badge {\r\n  font-size: 11px; font-weight: 600; color: var(--text3);\r\n  background: var(--surface); border: 1px solid var(--border);\r\n  padding: 3px 10px; border-radius: 12px;\r\n}\r\n.card-body { padding: 24px; }\r\n.card-body-table { padding: 0; }\r\n\r\n/* ── Form Grid ── */\r\n.form-grid {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 18px 20px;\r\n}\r\n@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }\r\n\r\n.form-group { display: flex; flex-direction: column; gap: 5px; }\r\n.form-label { font-size: 13px; font-weight: 600; color: var(--text2); }\r\n.diag-info {\r\n  display: block; font-size: 11px; margin-top: 3px; min-height: 15px;\r\n  font-family: var(--mono); word-break: break-all;\r\n}\r\n.diag-info.ok { color: var(--green); }\r\n.diag-info.warn { color: var(--amber); }\r\n.diag-info.err { color: var(--red); }\r\n.req { color: var(--red); }\r\n.form-input, .form-select {\r\n  font-family: var(--font); font-size: 14px;\r\n  padding: 9px 12px; border: 1px solid var(--border2); border-radius: var(--r3);\r\n  background: var(--surface); color: var(--text);\r\n  transition: border-color .15s, box-shadow .15s;\r\n  outline: none; width: 100%;\r\n}\r\n.form-input:focus, .form-select:focus {\r\n  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg);\r\n}\r\n.form-input:read-only, .form-select:disabled {\r\n  background: var(--surface2); color: var(--text2); cursor: not-allowed; opacity: 0.7;\r\n}\r\n.form-input[type=\"number\"] { -moz-appearance: textfield; }\r\n.form-input[type=\"number\"]::-webkit-inner-spin-button,\r\n.form-input[type=\"number\"]::-webkit-outer-spin-button { -webkit-appearance: none; }\r\n\r\n.input-row { display: flex; gap: 6px; align-items: center; }\r\n.input-row .form-select { flex: 1; }\r\n\r\n/* ── Buttons ── */\r\n.btn {\r\n  display: inline-flex; align-items: center; gap: 6px;\r\n  font-family: var(--font); font-size: 13px; font-weight: 600;\r\n  padding: 9px 18px; border: 1px solid var(--border2); border-radius: var(--r3);\r\n  cursor: pointer; transition: all .15s; background: var(--surface); color: var(--text);\r\n  white-space: nowrap;\r\n}\r\n.btn:hover { background: var(--surface2); }\r\n.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }\r\n.btn-primary:hover { background: var(--accent2); }\r\n.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }\r\n.btn-danger:hover { background: #b91c1c; }\r\n.btn-sm { padding: 5px 12px; font-size: 12px; }\r\n.btn-cancel { background: var(--surface2); color: var(--text2); }\r\n.btn-cancel:hover { background: var(--surface3); }\r\n.btn-icon {\r\n  background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px;\r\n  color: var(--text2); transition: color .15s; line-height: 1;\r\n}\r\n.btn-icon:hover { color: var(--text); }\r\n.btn-icon-sm {\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  width: 34px; height: 34px; font-size: 16px; font-weight: 700;\r\n  background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r3);\r\n  cursor: pointer; color: var(--text2); transition: all .15s; line-height: 1;\r\n  flex-shrink: 0;\r\n}\r\n.btn-icon-sm:hover { background: var(--surface3); color: var(--text); }\r\n.btn-add-bus { color: var(--green); }\r\n.btn-add-bus:hover { background: var(--green-bg); color: var(--green); }\r\n\r\n/* ── Files ── */\r\n.files-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }\r\n.files-area { display: flex; align-items: center; gap: 12px; margin-top: 6px; flex-wrap: wrap; }\r\n.btn-upload { gap: 4px; }\r\n.upload-hint { font-size: 12px; color: var(--text3); }\r\n.files-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }\r\n.file-item {\r\n  display: flex; align-items: center; gap: 10px;\r\n  padding: 8px 12px; background: var(--surface2); border-radius: var(--r3);\r\n  font-size: 13px;\r\n}\r\n.file-item .file-icon { font-size: 18px; flex-shrink: 0; }\r\n.file-item .file-name { flex: 1; font-weight: 500; color: var(--text); word-break: break-all; }\r\n.file-item .file-name a { color: var(--accent); text-decoration: none; }\r\n.file-item .file-name a:hover { text-decoration: underline; }\r\n.file-item .file-size { font-size: 11px; color: var(--text3); flex-shrink: 0; }\r\n.file-item .btn-remove {\r\n  background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text3);\r\n  padding: 2px 6px; border-radius: var(--r3); transition: all .15s; line-height: 1;\r\n}\r\n.file-item .btn-remove:hover { background: var(--red-bg); color: var(--red); }\r\n\r\n/* ── Table ── */\r\n.table-wrapper { overflow-x: auto; }\r\n.data-table {\r\n  width: 100%; border-collapse: collapse; font-size: 13px;\r\n}\r\n.data-table thead { background: var(--surface2); }\r\n.data-table th {\r\n  text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase;\r\n  letter-spacing: 0.5px; color: var(--text2); padding: 12px 14px;\r\n  border-bottom: 2px solid var(--border); white-space: nowrap;\r\n}\r\n.data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }\r\n.data-table tbody tr { transition: background .1s; }\r\n.data-table tbody tr:hover { background: var(--surface2); }\r\n.data-table tbody tr.row-done { opacity: 0.55; }\r\n.data-table tbody tr.row-done td { text-decoration: line-through; text-decoration-color: var(--text3); }\r\n.col-num { width: 40px; text-align: center; }\r\n.col-done { width: 60px; text-align: center; }\r\n.col-actions { width: 50px; text-align: center; }\r\n\r\n.table-input {\r\n  font-family: var(--font); font-size: 13px; padding: 7px 10px;\r\n  border: 1px solid var(--border2); border-radius: var(--r3);\r\n  background: var(--surface); color: var(--text); width: 100%; min-width: 130px;\r\n  outline: none; transition: border-color .15s, box-shadow .15s;\r\n}\r\n.table-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }\r\n.table-input:read-only { background: var(--surface2); opacity: 0.7; cursor: not-allowed; }\r\n.table-select {\r\n  font-family: var(--font); font-size: 13px; padding: 7px 10px;\r\n  border: 1px solid var(--border2); border-radius: var(--r3);\r\n  background: var(--surface); color: var(--text); width: 100%; min-width: 120px;\r\n  outline: none;\r\n}\r\n.table-select:disabled { background: var(--surface2); opacity: 0.7; cursor: not-allowed; }\r\n.done-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: var(--green); }\r\n.done-checkbox:disabled { cursor: not-allowed; opacity: 0.6; }\r\n\r\n.btn-delete-row {\r\n  background: none; border: none; cursor: pointer; font-size: 18px;\r\n  color: var(--text3); padding: 4px 8px; border-radius: var(--r3);\r\n  transition: all .15s; line-height: 1;\r\n}\r\n.btn-delete-row:hover { background: var(--red-bg); color: var(--red); }\r\n\r\n/* ── Empty State ── */\r\n.empty-state {\r\n  text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px;\r\n}\r\n\r\n/* ── Footer ── */\r\n.footer {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 16px 24px; background: var(--surface); border: 1px solid var(--border);\r\n  border-radius: var(--r); box-shadow: var(--shadow-sm);\r\n}\r\n.footer-hint { font-size: 12px; color: var(--text3); }\r\n.locked-info { font-size: 12px; color: var(--red); font-weight: 600; margin-right: 12px; }\r\n.btn-lock { font-weight: 700; border-color: var(--amber); color: var(--amber); }\r\n.btn-lock:hover { background: var(--amber-bg); }\r\n\r\n/* ── Modal ── */\r\n.modal-overlay {\r\n  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000;\r\n  animation: fadeIn .2s ease;\r\n}\r\n.modal {\r\n  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);\r\n  background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-lg);\r\n  z-index: 1001; width: 480px; max-width: 94vw; animation: modalIn .25s ease;\r\n}\r\n.modal-sm { width: 420px; }\r\n@keyframes modalIn { from { opacity: 0; transform: translate(-50%,-48%); } to { opacity: 1; transform: translate(-50%,-50%); } }\r\n.modal-header {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 18px 24px; border-bottom: 1px solid var(--border);\r\n}\r\n.modal-header h3 { font-size: 16px; font-weight: 700; }\r\n.btn-close-modal {\r\n  background: none; border: none; font-size: 18px; cursor: pointer;\r\n  color: var(--text3); padding: 2px 8px; border-radius: var(--r3); transition: all .15s;\r\n}\r\n.btn-close-modal:hover { background: var(--surface3); color: var(--text); }\r\n.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }\r\n.modal-footer {\r\n  display: flex; justify-content: flex-end; gap: 10px;\r\n  padding: 16px 24px; border-top: 1px solid var(--border); background: var(--surface2);\r\n}\r\n.lock-warning {\r\n  background: var(--amber-bg); border: 1px solid var(--amber);\r\n  padding: 12px 16px; border-radius: var(--r3);\r\n  font-size: 13px; color: var(--amber);\r\n}\r\n\r\n/* ── Read-only overrides ── */\r\nbody.locked .btn-lock,\r\nbody.locked .btn-add-bus,\r\nbody.locked .btn-upload,\r\nbody.locked .btn-add-record,\r\nbody.locked .btn-delete-row,\r\nbody.locked #btn-add-record,\r\nbody.locked #btn-upload,\r\nbody.locked #btn-add-bus,\r\nbody.locked #btn-refresh-buses { display: none !important; }\r\n\r\nbody.locked .form-input,\r\nbody.locked .form-select,\r\nbody.locked .table-input,\r\nbody.locked .table-select { pointer-events: none; }\r\n"},"js":{"name":"BusCompanyWorkOrder.js","src":"../app/BusCompanyWorkOrder.js","content":"/* ── Bus Company Work Order ──\r\n   Single work order management for bus maintenance.\r\n   Built for UniconHub CMS HTML-tool system.\r\n\r\n   CONFIGURABLE TYPE IDs (via tool.param):\r\n     vehiclesTypeId       — CMS Object Type for vehicles/buses (default: vehicles-uniconbaseapps)\r\n     staffTypeId          — CMS Object Type for staff/technicians (default: staff-uniconbaseapps)\r\n     technicianRoleFilter — role field value to filter technicians (default: technician, empty = all)\r\n\r\n   Admin changes these in the html-tool field settings to match the company's\r\n   existing CMS types. The app never hardcodes a type name.\r\n────────────────────────────────────────── */\r\n\r\n/* ── Configurable Type ID Helpers ── */\r\nfunction getVehiclesTypeId()  { return tool.param('vehiclesTypeId',       'vehicles-uniconbaseapps'); }\r\nfunction getStaffTypeId()     { return tool.param('staffTypeId',          'staff-uniconbaseapps'); }\r\nfunction getTechRoleFilter()  { return tool.param('technicianRoleFilter', 'technician'); }\r\n\r\n/* ── Constants ── */\r\nconst FILE_ACCEPT = '.pdf,.docx,.xlsx,.csv,.jpg,.jpeg,.png,.gif,.webp,.txt';\r\nconst DEFAULT_DB = {\r\n  status: 'active',\r\n  busId: '',\r\n  busName: '',\r\n  odometer: '',\r\n  date: '',\r\n  technician: '',\r\n  technicianId: '',\r\n  files: [],\r\n  records: [],\r\n  lockedAt: null,\r\n  lockedBy: null,\r\n  _theme: 'light'\r\n};\r\n\r\n/* ── Helpers ── */\r\nfunction genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\r\nfunction esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction todayStr() { return new Date().toISOString().slice(0, 10); }\r\nfunction fmtFileSize(bytes) {\r\n  if (!bytes) return '';\r\n  if (bytes < 1024) return bytes + ' B';\r\n  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';\r\n  return (bytes / 1048576).toFixed(1) + ' MB';\r\n}\r\nfunction fileIcon(type) {\r\n  if (!type) return '📄';\r\n  if (type.includes('pdf')) return '📕';\r\n  if (type.includes('word') || type.includes('docx')) return '📝';\r\n  if (type.includes('sheet') || type.includes('xlsx') || type.includes('csv')) return '📊';\r\n  if (type.includes('image')) return '🖼️';\r\n  return '📎';\r\n}\r\n\r\n/* ── State ── */\r\nlet DB = JSON.parse(JSON.stringify(DEFAULT_DB));\r\nlet isReadOnly = false;\r\nlet isLocked = false;\r\nlet buses = [];           // vehicles loaded from CMS\r\nlet staffList = [];       // staff loaded from CMS (technicians)\r\nlet permittedUsers = [];  // fallback from object ACL\r\n\r\n/* ── Persistence ── */\r\nfunction persist() {\r\n  tool.setValue(JSON.parse(JSON.stringify(DB)));\r\n  tool.resize();\r\n}\r\n\r\nfunction isEditable() { return !isReadOnly && !isLocked; }\r\n\r\n/* ── Theme ── */\r\nfunction applyTheme(t) {\r\n  DB._theme = t;\r\n  document.documentElement.setAttribute('data-theme', t);\r\n  el('theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';\r\n}\r\nfunction toggleTheme() {\r\n  applyTheme(DB._theme === 'dark' ? 'light' : 'dark');\r\n  persist();\r\n}\r\n\r\n/* ── Lock / Unlock ── */\r\nfunction setLocked(locked) {\r\n  isLocked = locked;\r\n  if (locked) {\r\n    document.body.classList.add('locked');\r\n    el('status-badge').textContent = '🔒 Locked';\r\n    el('status-badge').className = 'status-badge locked';\r\n    el('locked-info').style.display = '';\r\n    var at = DB.lockedAt ? new Date(DB.lockedAt).toLocaleString() : 'just now';\r\n    var by = DB.lockedBy || 'Unknown';\r\n    el('locked-info').textContent = 'Locked ' + at + ' by ' + by;\r\n    el('btn-lock').style.display = 'none';\r\n  } else {\r\n    document.body.classList.remove('locked');\r\n    el('status-badge').textContent = '● Active';\r\n    el('status-badge').className = 'status-badge active';\r\n    el('locked-info').style.display = 'none';\r\n    el('btn-lock').style.display = '';\r\n  }\r\n}\r\n\r\nfunction lockWorkOrder() {\r\n  el('lock-overlay').style.display = '';\r\n  el('modal-lock').style.display = '';\r\n}\r\n\r\nfunction confirmLock() {\r\n  DB.status = 'locked';\r\n  DB.lockedAt = new Date().toISOString();\r\n  var user = tool.getUser();\r\n  DB.lockedBy = user ? user.name : 'System';\r\n  setLocked(true);\r\n  persist();\r\n  tool.notify('Work order locked permanently.', 'warning');\r\n  closeLockModal();\r\n}\r\n\r\nfunction closeLockModal() {\r\n  el('lock-overlay').style.display = 'none';\r\n  el('modal-lock').style.display = 'none';\r\n}\r\n\r\n/* ── Diagnostic helpers ── */\r\nfunction _diag(title, typeId, err, result) {\r\n  console.group('🔍 ' + title + ' — typeId: \"' + typeId + '\"');\r\n  if (err) {\r\n    console.error('❌ ERROR:', err);\r\n    console.log('👉 This usually means the type is not in allowedObjectTypes, or the typeId is wrong.');\r\n  } else {\r\n    var count = (result && result.objects) ? result.objects.length : 0;\r\n    console.log('✅ SUCCESS — ' + count + ' object(s) returned');\r\n    if (count > 0) {\r\n      console.log('📋 First object:');\r\n      var first = result.objects[0];\r\n      console.log('  id:      ', first.id);\r\n      console.log('  name:    ', first.name);\r\n      console.log('  slug:    ', first.slug);\r\n      console.log('  cmsObjectType:', first.cmsObjectType);\r\n      var pd = (first.productData && first.productData.data_categoriesBased) ? first.productData.data_categoriesBased : null;\r\n      console.log('  productData.data_categoriesBased:', pd);\r\n      if (pd) {\r\n        console.log('  Available field keys:', Object.keys(pd));\r\n      } else {\r\n        console.warn('  ⚠️  No productData.data_categoriesBased — object may have no custom fields defined.');\r\n      }\r\n      console.log('📋 All objects (' + count + '):');\r\n      result.objects.forEach(function(o, i) {\r\n        var oPd = (o.productData && o.productData.data_categoriesBased) ? o.productData.data_categoriesBased : {};\r\n        console.log('  [' + i + '] id=' + o.id + ' name=\"' + o.name + '\" fields=' + JSON.stringify(Object.keys(oPd)));\r\n      });\r\n    } else {\r\n      console.warn('⚠️  Empty result — no objects exist in type \"' + typeId + '\"');\r\n      console.log('👉 Possible causes:');\r\n      console.log('   1. No objects have been created in this type yet.');\r\n      console.log('   2. The type ID is wrong (check allowedObjectTypes in field settings).');\r\n      console.log('   3. The type is not registered in CMS Settings → App Designer.');\r\n      console.log('   4. scope:\"instance\" but there are no objects scoped to this parent record.');\r\n    }\r\n  }\r\n  console.groupEnd();\r\n}\r\n\r\nfunction _updateDiagVehicles() {\r\n  var elm = document.getElementById('diag-vehicles');\r\n  if (!elm) return;\r\n  var typeId = getVehiclesTypeId();\r\n  if (buses.length > 0) {\r\n    elm.textContent = '✓ ' + buses.length + ' vehicle(s) loaded from \"' + typeId + '\"';\r\n    elm.className = 'diag-info ok';\r\n  } else {\r\n    elm.textContent = '⚠️ 0 vehicles in \"' + typeId + '\" — open browser console (F12) for details';\r\n    elm.className = 'diag-info warn';\r\n  }\r\n}\r\n\r\nfunction _updateDiagStaff() {\r\n  var elm = document.getElementById('diag-staff');\r\n  if (!elm) return;\r\n  var typeId = getStaffTypeId();\r\n  if (staffList.length > 0) {\r\n    elm.textContent = '✓ ' + staffList.length + ' technician(s) loaded from \"' + typeId + '\"';\r\n    elm.className = 'diag-info ok';\r\n  } else if (permittedUsers.length > 0) {\r\n    elm.textContent = '⚠️ 0 staff in \"' + typeId + '\" — falling back to ' + permittedUsers.length + ' permitted user(s). Open console for details.';\r\n    elm.className = 'diag-info warn';\r\n  } else {\r\n    elm.textContent = '⚠️ 0 staff in \"' + typeId + '\" and 0 permitted users — open browser console (F12) for details';\r\n    elm.className = 'diag-info err';\r\n  }\r\n}\r\n\r\n/* ── Vehicles (Bus) Management ── */\r\nfunction loadBuses(callback) {\r\n  if (typeof tool.requestObjects !== 'function') {\r\n    tool.notify('Vehicle list unavailable — CMS object access not configured.', 'warning');\r\n    _diag('Vehicles', getVehiclesTypeId(), 'tool.requestObjects is not a function', null);\r\n    buses = [];\r\n    if (callback) callback();\r\n    return;\r\n  }\r\n  var typeId = getVehiclesTypeId();\r\n  tool.requestObjects('query', { mainObjectType: typeId }, function(err, result) {\r\n    _diag('Vehicles', typeId, err, result);\r\n    if (err) {\r\n      tool.notify('Could not load vehicle list (' + typeId + '): ' + err, 'warning');\r\n      buses = [];\r\n    } else {\r\n      buses = (result && result.objects) ? result.objects : [];\r\n      buses.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });\r\n      tool.notify('Loaded ' + buses.length + ' vehicle(s) from \"' + typeId + '\"', 'info');\r\n    }\r\n    _updateDiagVehicles();\r\n    if (callback) callback();\r\n  });\r\n}\r\n\r\nfunction renderBusDropdown() {\r\n  var sel = el('bus-select');\r\n  var currentVal = sel.value;\r\n  sel.innerHTML = '<option value=\"\">— Select a Vehicle —<\/option>';\r\n  buses.forEach(function(b) {\r\n    var opt = document.createElement('option');\r\n    opt.value = b.id;\r\n    var pd = (b.productData && b.productData.data_categoriesBased) ? b.productData.data_categoriesBased : {};\r\n    var plate = pd.plate || pd.plateNumber || '';\r\n    var make = pd.make || '';\r\n    var model = pd.model || '';\r\n    var parts = [b.name, plate, make, model].filter(Boolean);\r\n    opt.textContent = parts.join(' — ');\r\n    sel.appendChild(opt);\r\n  });\r\n  if (currentVal && buses.some(function(b) { return b.id === currentVal; })) {\r\n    sel.value = currentVal;\r\n  }\r\n  sel.disabled = !isEditable();\r\n  _updateDiagVehicles();\r\n}\r\n\r\nfunction onBusChange() {\r\n  var busId = el('bus-select').value;\r\n  if (!busId) {\r\n    DB.busId = '';\r\n    DB.busName = '';\r\n    el('header-bus-name').textContent = 'No vehicle selected';\r\n    persist();\r\n    return;\r\n  }\r\n  var bus = buses.find(function(b) { return b.id === busId; });\r\n  if (bus) {\r\n    DB.busId = bus.id;\r\n    DB.busName = bus.name;\r\n    el('header-bus-name').textContent = bus.name;\r\n    persist();\r\n  }\r\n}\r\n\r\nfunction openAddBusModal() {\r\n  el('new-bus-plate').value = '';\r\n  el('new-bus-make').value = '';\r\n  el('new-bus-model').value = '';\r\n  el('new-bus-year').value = '';\r\n  el('modal-overlay').style.display = '';\r\n  el('modal-add-bus').style.display = '';\r\n  setTimeout(function() { el('new-bus-plate').focus(); }, 100);\r\n}\r\n\r\nfunction closeAddBusModal() {\r\n  el('modal-overlay').style.display = 'none';\r\n  el('modal-add-bus').style.display = 'none';\r\n}\r\n\r\nfunction saveNewBus() {\r\n  var plate = el('new-bus-plate').value.trim();\r\n  if (!plate) { tool.notify('Please enter a plate or vehicle number.', 'warning'); return; }\r\n  var make = el('new-bus-make').value.trim();\r\n  var model = el('new-bus-model').value.trim();\r\n  var year = el('new-bus-year').value.trim();\r\n  var busName = plate + (make ? ' ' + make : '') + (model ? ' ' + model : '');\r\n\r\n  if (typeof tool.requestObjects !== 'function') {\r\n    tool.notify('Cannot create vehicle — CMS object access not configured.', 'error');\r\n    return;\r\n  }\r\n\r\n  var pd = { plate: plate };\r\n  if (make) pd.make = make;\r\n  if (model) pd.model = model;\r\n  if (year) pd.year = parseInt(year, 10);\r\n\r\n  el('btn-save-bus').disabled = true;\r\n  el('btn-save-bus').textContent = 'Saving...';\r\n\r\n  var typeId = getVehiclesTypeId();\r\n  tool.requestObjects('create', {\r\n    mainObjectType: typeId,\r\n    name: busName,\r\n    productData: { data_categoriesBased: pd }\r\n  }, function(err, result) {\r\n    el('btn-save-bus').disabled = false;\r\n    el('btn-save-bus').textContent = 'Save Vehicle';\r\n    if (err) {\r\n      tool.notify('Failed to create vehicle: ' + err, 'error');\r\n      return;\r\n    }\r\n    tool.notify('Vehicle \"' + busName + '\" created.', 'success');\r\n    closeAddBusModal();\r\n    loadBuses(function() {\r\n      renderBusDropdown();\r\n      if (result && result.object) {\r\n        el('bus-select').value = result.object.id;\r\n        onBusChange();\r\n      }\r\n    });\r\n  });\r\n}\r\n\r\n/* ── Staff (Technician) Management ── */\r\nfunction loadStaff(callback) {\r\n  if (typeof tool.requestObjects !== 'function') {\r\n    staffList = [];\r\n    if (callback) callback();\r\n    return;\r\n  }\r\n  var typeId = getStaffTypeId();\r\n  var roleFilter = getTechRoleFilter();\r\n  tool.requestObjects('query', { mainObjectType: typeId }, function(err, result) {\r\n    _diag('Staff', typeId, err, result);\r\n    if (err) {\r\n      staffList = [];\r\n    } else {\r\n      var all = (result && result.objects) ? result.objects : [];\r\n      /* Filter by technician role if a filter is configured */\r\n      if (roleFilter) {\r\n        var before = all.length;\r\n        staffList = all.filter(function(s) {\r\n          var pd = (s.productData && s.productData.data_categoriesBased) ? s.productData.data_categoriesBased : {};\r\n          var role = (pd.role || '').toLowerCase();\r\n          return role === roleFilter.toLowerCase();\r\n        });\r\n        console.log('🔍 Staff role filter: \"' + roleFilter + '\" → kept ' + staffList.length + ' of ' + before + ' staff (filtered out ' + (before - staffList.length) + ' non-matching)');\r\n      } else {\r\n        staffList = all;\r\n      }\r\n      staffList.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });\r\n      tool.notify('Loaded ' + staffList.length + ' technician(s) from \"' + typeId + '\" (role filter: \"' + (roleFilter || 'none') + '\")', 'info');\r\n    }\r\n    _updateDiagStaff();\r\n    if (callback) callback();\r\n  });\r\n}\r\n\r\n/* Returns the effective list of technicians: staff from CMS first, fall back to permitted users */\r\nfunction getTechnicians() {\r\n  if (staffList.length > 0) return staffList;\r\n  /* Fallback: convert permittedUsers to same shape as staff objects */\r\n  return permittedUsers.map(function(u) {\r\n    return {\r\n      id: u.id,\r\n      name: u.name,\r\n      productData: { data_categoriesBased: { role: 'technician', email: u.email } }\r\n    };\r\n  });\r\n}\r\n\r\n/* ── File Management ── */\r\nfunction uploadFile() {\r\n  if (typeof tool.requestUpload !== 'function') {\r\n    tool.notify('File upload not available — upload access not configured.', 'warning');\r\n    return;\r\n  }\r\n  el('btn-upload').disabled = true;\r\n  el('btn-upload').textContent = '⏳ Uploading...';\r\n  tool.requestUpload(FILE_ACCEPT, function(err, file) {\r\n    el('btn-upload').disabled = false;\r\n    el('btn-upload').textContent = '📎 Upload File';\r\n    if (err) {\r\n      tool.notify('Upload failed: ' + err, 'error');\r\n      return;\r\n    }\r\n    DB.files.push({\r\n      name: file.name,\r\n      url: file.url,\r\n      size: file.size,\r\n      type: file.type\r\n    });\r\n    tool.notify('File \"' + file.name + '\" uploaded.', 'success');\r\n    persist();\r\n    renderFiles();\r\n  });\r\n}\r\n\r\nfunction removeFile(index) {\r\n  var f = DB.files[index];\r\n  DB.files.splice(index, 1);\r\n  tool.notify('File \"' + (f ? f.name : '') + '\" removed.', 'info');\r\n  persist();\r\n  renderFiles();\r\n}\r\n\r\nfunction renderFiles() {\r\n  var container = el('files-list');\r\n  if (!DB.files || DB.files.length === 0) {\r\n    container.innerHTML = '';\r\n    return;\r\n  }\r\n  var html = '';\r\n  DB.files.forEach(function(f, i) {\r\n    html += '<div class=\"file-item\">';\r\n    html += '<span class=\"file-icon\">' + fileIcon(f.type) + '<\/span>';\r\n    html += '<span class=\"file-name\"><a href=\"' + esc(f.url) + '\" target=\"_blank\" rel=\"noopener\">' + esc(f.name) + '<\/a><\/span>';\r\n    html += '<span class=\"file-size\">' + fmtFileSize(f.size) + '<\/span>';\r\n    if (isEditable()) {\r\n      html += '<button class=\"btn-remove\" onclick=\"removeFile(' + i + ')\" title=\"Remove file\">✕<\/button>';\r\n    }\r\n    html += '<\/div>';\r\n  });\r\n  container.innerHTML = html;\r\n}\r\n\r\n/* ── Records (Complaints & Solutions) ── */\r\nfunction addRecord() {\r\n  DB.records.push({\r\n    id: genId(),\r\n    complaint: '',\r\n    solution: '',\r\n    technician: '',\r\n    technicianId: '',\r\n    isDone: false\r\n  });\r\n  persist();\r\n  renderRecords();\r\n  tool.resize();\r\n}\r\n\r\nfunction updateRecord(index, field, value) {\r\n  if (index < 0 || index >= DB.records.length) return;\r\n  DB.records[index][field] = value;\r\n  persist();\r\n}\r\n\r\nfunction deleteRecord(index) {\r\n  if (index < 0 || index >= DB.records.length) return;\r\n  DB.records.splice(index, 1);\r\n  tool.notify('Record removed.', 'info');\r\n  persist();\r\n  renderRecords();\r\n}\r\n\r\nfunction renderRecords() {\r\n  var tbody = el('records-tbody');\r\n  var empty = el('records-empty');\r\n  var count = el('records-count');\r\n\r\n  count.textContent = DB.records.length + ' record' + (DB.records.length !== 1 ? 's' : '');\r\n\r\n  if (DB.records.length === 0) {\r\n    tbody.innerHTML = '';\r\n    empty.style.display = '';\r\n    el('records-table').style.display = 'none';\r\n    return;\r\n  }\r\n\r\n  empty.style.display = 'none';\r\n  el('records-table').style.display = '';\r\n\r\n  var techs = getTechnicians();\r\n  var html = '';\r\n  DB.records.forEach(function(r, i) {\r\n    var rowClass = r.isDone ? ' row-done' : '';\r\n    html += '<tr class=\"' + rowClass + '\">';\r\n    html += '<td class=\"col-num\">' + (i + 1) + '<\/td>';\r\n    html += '<td><input type=\"text\" class=\"table-input\" value=\"' + esc(r.complaint) + '\" placeholder=\"Describe the complaint...\" onchange=\"updateRecord(' + i + ',\\'complaint\\',this.value)\"' + (isEditable() ? '' : ' readonly') + '><\/td>';\r\n    html += '<td><input type=\"text\" class=\"table-input\" value=\"' + esc(r.solution) + '\" placeholder=\"Solution applied...\" onchange=\"updateRecord(' + i + ',\\'solution\\',this.value)\"' + (isEditable() ? '' : ' readonly') + '><\/td>';\r\n    html += '<td><select class=\"table-select\" onchange=\"updateRecord(' + i + ',\\'technician\\',this.value);updateRecord(' + i + ',\\'technicianId\\',this.selectedOptions[0]?this.selectedOptions[0].dataset.staffid||\\'\\':\\'\\')\"' + (isEditable() ? '' : ' disabled') + '>';\r     name: 'vehiclesTypeId',\r\n        label: 'Vehicles CMS Object Type ID',\r\n        type: 'text',\r\n        default: 'vehicles-uniconbaseapps',\r\n        hint: 'mainObjectType for the vehicles/buses fleet. Change this to match the company\\'s existing vehicle type (e.g. buses-companya, fleet-custom).'\r\n      },\r\n      {\r\n        name: 'staffTypeId',\r\n        label: 'Staff CMS Object Type ID',\r\n        type: 'text',\r\n        default: 'staff-uniconbaseapps',\r\n        hint: 'mainObjectType for staff records. Used to populate technician dropdowns. Change to match the company\\'s staff type.'\r\n      },\r\n      {\r\n        name: 'technicianRoleFilter',\r\n        label: 'Technician Role Filter',\r\n        type: 'text',\r\n        default: 'technician',\r\n        hint: 'Value of the \"role\" field on staff objects that identifies technicians. Leave empty to show all staff.'\r\n      }\r\n    ]);\r\n  }\r\n\r\n  /* ── Report missing required parameters ── */\r\n  if (typeof tool.reportMissingParams === 'function') {\r\n    var missing = [];\r\n    var vType = tool.param('vehiclesTypeId');       /* no fallback — check if configured */\r\n    var sType = tool.param('staffTypeId');\r\n    var roleF  = tool.param('technicianRoleFilter');\r\n\r\n    if (!vType) {\r\n      missing.push({\r\n        name: 'vehiclesTypeId',\r\n        label: 'Vehicles CMS Object Type ID',\r\n        type: 'text',\r\n        default: 'vehicles-uniconbaseapps',\r\n        hint: 'CMS object type that holds vehicle/bus records (e.g. vehicles-uniconbaseapps, buses-companya)',\r\n        reason: 'Cannot load the vehicle dropdown list without a vehicles type ID. The work order cannot be assigned to a vehicle.'\r\n      });\r\n    }\r\n    if (!sType) {\r\n      missing.push({\r\n        name: 'staffTypeId',\r\n        label: 'Staff CMS Object Type ID',\r\n        type: 'text',\r\n        default: 'staff-uniconbaseapps',\r\n        hint: 'CMS object type that holds staff records with a \"role\" field (e.g. staff-uniconbaseapps, employees-customc)',\r\n        reason: 'Cannot load the technician dropdown list without a staff type ID. Technicians cannot be assigned to records.'\r\n      });\r\n    }\r\n    /* technicianRoleFilter is optional — it has a sensible default, so only warn if explicitly empty */\r\n    if (roleF === '') {\r\n      missing.push({\r\n        name: 'technicianRoleFilter',\r\n        label: 'Technician Role Filter',\r\n        type: 'text',\r\n        default: 'technician',\r\n        hint: 'The \"role\" field value that identifies a staff member as a technician. Leave empty to show all staff, or set to e.g. \"mechanic\".',\r\n        reason: 'The role filter is empty, which means ALL staff will appear in technician dropdowns — including supervisors, drivers, etc. Set this to filter properly.'\r\n      });\r\n    }\r\n    if (missing.length > 0) {\r\n      tool.reportMissingParams(missing,\r\n        'This tool needs ' + missing.length + ' parameter(s) configured before it can load vehicle and technician data. Click \"Configure\" below to set them up.');\r\n    }\r\n  }\r\n\r\n  /* ── Declare output schema ── */\r\n  if (typeof tool.declareOutput === 'function') {\r\n    tool.declareOutput({\r\n      type: 'object',\r\n      properties: {\r\n        status:     { type: 'string', enum: ['active', 'locked'] },\r\n        busId:      { type: 'string', description: 'Selected vehicle CMS object ID' },\r\n        busName:    { type: 'string', description: 'Selected vehicle display name' },\r\n        odometer:   { type: 'string', description: 'Odometer reading in km' },\r\n        date:       { type: 'string', description: 'Work order date (ISO)' },\r\n        technician: { type: 'string', description: 'Assigned technician name' },\r\n        technicianId: { type: 'string', description: 'Assigned technician staff ID' },\r\n        files:      { type: 'array',  description: 'Uploaded file attachments' },\r\n        records: <script>
(function () {
  'use strict';
  var frame = document.getElementById('docs-frame');
  var openButton = document.getElementById('docs-open');
  var codeView = document.getElementById('docs-code-view');
  var codeTitle = document.getElementById('docs-code-title');
  var codeMeta = document.getElementById('docs-code-meta');
  var codeElement = document.getElementById('docs-code-code');
  var codeCopyButton = document.getElementById('docs-code-copy');
  var codeOpenButton = document.getElementById('docs-code-open');
  var navItems = Array.prototype.slice.call(document.querySelectorAll('.docs-nav-item'));
  var currentSource = 'ssot.html';
  var currentCodeKind = '';

  var codePayload = { html: null, css: null, js: null };
  try {
    codePayload = JSON.parse(document.getElementById('code-payload').textContent) || codePayload;
  } catch (error) { /* payload unavailable */ }

  /* ---- screenshots viewer ---- */
  var shotsView = document.getElementById('docs-shots-view');
  var shotsViewer = document.getElementById('docs-shots-viewer');
  var shotsImg = document.getElementById('docs-shots-img');
  var shotsEmpty = document.getElementById('docs-shots-empty');
  var shotsInfo = document.getElementById('docs-shots-info');
  var shotsThumbs = document.getElementById('docs-shots-thumbs');
  var shotsPrev = document.getElementById('docs-shots-prev');
  var shotsNext = document.getElementById('docs-shots-next');
  var shotsPayload = [];
  try {
    shotsPayload = JSON.parse(document.getElementById('shots-payload').textContent) || [];
  } catch (error) { /* payload unavailable */ }
  var currentShotIndex = 0;

  function renderShotsInfo(shot) {
    if (!shotsInfo) return;
    if (!shot) { shotsInfo.innerHTML = ''; return; }
    var fields = [
      ['File', shot.name || ''],
      ['Shot', shot.label || ''],
      ['Page', shot.page || ''],
      ['Viewport', shot.viewport || ''],
      ['Dimensions', shot.width && shot.height ? shot.width + ' \u00d7 ' + shot.height + ' px' : ''],
      ['Captured', shot.capturedAt ? shot.capturedAt.replace('T', ' ').slice(0, 19) + ' UTC' : ''],
      ['Used in', Array.isArray(shot.usedIn) && shot.usedIn.length ? shot.usedIn.join(', ') : 'docs index viewer'],
    ];
    shotsInfo.innerHTML = '<p class="docs-shots-counter">Screenshot ' + (currentShotIndex + 1) + ' of ' + shotsPayload.length + '</p>' +
      '<dl>' + fields.filter(function (field) { return field[1]; })
        .map(function (field) { return '<div><dt>' + field[0] + '</dt><dd>' + field[1] + '</dd></div>'; })
        .join('') + '</dl>';
  }

  function showShot(index) {
    if (!shotsPayload.length) {
      if (shotsImg) shotsImg.style.display = 'none';
      if (shotsEmpty) shotsEmpty.style.display = '';
      if (shotsPrev) shotsPrev.style.display = 'none';
      if (shotsNext) shotsNext.style.display = 'none';
      if (shotsThumbs) shotsThumbs.style.display = 'none';
      renderShotsInfo(null);
      return;
    }
    currentShotIndex = ((index % shotsPayload.length) + shotsPayload.length) % shotsPayload.length;
    var shot = shotsPayload[currentShotIndex];
    if (shotsImg) {
      shotsImg.style.display = '';
      shotsImg.src = shot.src;
    }
    if (shotsEmpty) shotsEmpty.style.display = 'none';
    if (shotsPrev) shotsPrev.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsNext) shotsNext.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsThumbs) {
      shotsThumbs.innerHTML = shotsPayload.map(function (entry, i) {
        return '<button class="docs-shots-thumb' + (i === currentShotIndex ? ' active' : '') + '" type="button" data-shot-index="' + i + '">' +
          '<img src="' + entry.src + '" alt="' + (entry.label || entry.name) + '" loading="lazy" />' +
          '<span>' + (entry.label || entry.name) + '</span></button>';
      }).join('');
    }
    renderShotsInfo(shot);
  }

  function openShotsPane() {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.add('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    showShot(currentShotIndex);
  }

  if (shotsThumbs) {
    shotsThumbs.addEventListener('click', function (event) {
      var thumb = event.target.closest ? event.target.closest('.docs-shots-thumb') : null;
      if (!thumb) return;
      showShot(Number(thumb.getAttribute('data-shot-index')) || 0);
    });
  }
  if (shotsPrev) shotsPrev.addEventListener('click', function () { showShot(currentShotIndex - 1); });
  if (shotsNext) shotsNext.addEventListener('click', function () { showShot(currentShotIndex + 1); });
  document.addEventListener('keydown', function (event) {
    if (!shotsView.classList.contains('visible')) return;
    if (event.key === 'ArrowLeft') showShot(currentShotIndex - 1);
    if (event.key === 'ArrowRight') showShot(currentShotIndex + 1);
    if (event.key === 'Escape') { shotsView.classList.remove('visible'); frame.style.display = ''; if (openButton) openButton.style.display = ''; }
  });

  function activateItem(activeItem) {
    navItems.forEach(function (item) { item.classList.toggle('active', item === activeItem); });
  }

  function showCodePane(kind) {
    var entry = codePayload[kind];
    currentCodeKind = kind;
    codeView.classList.add('visible');
    shotsView.classList.remove('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    if (!entry) {
      codeTitle.textContent = kind.toUpperCase() + ' code';
      codeMeta.textContent = 'no ' + kind + ' file in the app folder';
      codeElement.textContent = '';
      return;
    }
    codeTitle.textContent = entry.name;
    var lineCount = entry.content ? entry.content.split('\n').length : 0;
    codeMeta.textContent = lineCount + ' lines - ' + (entry.content ? entry.content.length : 0) + ' characters';
    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {
      showCodePane(item.getAttribute('data-doc').slice(5));
    } else {
      showDocumentPane(item);
    }
    try { window.location.hash = 'doc=' + item.getAttribute('data-doc'); } catch (error) { /* ignore */ }
  }

  navItems.forEach(function (item) {
    item.addEventListener('click', function () { openItem(item); });
  });

  if (openButton) {
    openButton.addEventListener('click', function () {
      var fullUrl = new URL(currentSource, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  if (codeCopyButton) {
    codeCopyButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      var text = entry && entry.content ? entry.content : '';
      if (!text) return;
      function markCopied() {
        codeCopyButton.textContent = 'Copied ✓';
        codeCopyButton.classList.add('copied');
        setTimeout(function () {
          codeCopyButton.textContent = 'Copy code';
          codeCopyButton.classList.remove('copied');
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function () { fallbackCopy(text, markCopied); });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
