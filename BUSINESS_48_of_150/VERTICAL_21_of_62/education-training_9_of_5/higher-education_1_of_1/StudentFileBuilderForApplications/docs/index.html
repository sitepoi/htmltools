t\t\t\t\t<button class=\"btn btn-primary\" id=\"ai-send\">Ask<\/button>\r\n\t\t\t\t\t\t<\/div>\r\n\t\t\t\t\t<\/div>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/div>\r\n\t\t<\/section>\r\n\t<\/main>\r\n<\/div>\r\n\r\n<!-- MODAL -->\r\n<div class=\"modal-overlay\" id=\"modal-overlay\">\r\n\t<div class=\"modal\" id=\"modal\">\r\n\t\t<div class=\"modal-header\">\r\n\t\t\t<h3 id=\"modal-title\">Title<\/h3>\r\n\t\t\t<button class=\"btn btn-icon modal-close\" id=\"modal-close\">✕<\/button>\r\n\t\t<\/div>\r\n\t\t<div class=\"modal-body\" id=\"modal-body\"><\/div>\r\n\t\t<div class=\"modal-footer\" id=\"modal-footer\"><\/div>\r\n\t<\/div>\r\n<\/div>\r\n\r\n<!-- DRAWER -->\r\n<div class=\"drawer-overlay\" id=\"drawer-overlay\">\r\n\t<div class=\"drawer\" id=\"drawer\">\r\n\t\t<div class=\"drawer-header\">\r\n\t\t\t<div class=\"drawer-title-wrap\">\r\n\t\t\t\t<h3 id=\"drawer-title\">Application<\/h3>\r\n\t\t\t\t<div class=\"drawer-sub\" id=\"drawer-sub\"><\/div>\r\n\t\t\t<\/div>\r\n\t\t\t<button class=\"btn btn-icon\" id=\"drawer-close\">✕<\/button>\r\n\t\t<\/div>\r\n\t\t<div class=\"drawer-body\" id=\"drawer-body\"><\/div>\r\n\t<\/div>\r\n<\/div>\r\n"},"css":{"name":"StudentFileBuilderForApplications.css","src":"../app/StudentFileBuilderForApplications.css","content":"/* ── StudentFile Builder for Applications ── Professional Modern Design ── */\r\n\r\n:root {\r\n\t--bg: #f8f9fb;\r\n\t--bg2: #ffffff;\r\n\t--bg3: #f0f2f5;\r\n\t--bg4: #e8eaef;\r\n\t--text: #1a1d23;\r\n\t--text2: #5f6368;\r\n\t--text3: #9aa0a6;\r\n\t--border: #e1e4e8;\r\n\t--border2: #d0d5dd;\r\n\t--primary: #2563eb;\r\n\t--primary-hover: #1d4ed8;\r\n\t--primary-light: #eff6ff;\r\n\t--primary-bg: #dbeafe;\r\n\t--green: #16a34a;\r\n\t--green-bg: #dcfce7;\r\n\t--green-text: #15803d;\r\n\t--red: #dc2626;\r\n\t--red-bg: #fee2e2;\r\n\t--red-text: #b91c1c;\r\n\t--amber: #d97706;\r\n\t--amber-bg: #fef3c7;\r\n\t--amber-text: #92400e;\r\n\t--purple: #7c3aed;\r\n\t--purple-bg: #ede9fe;\r\n\t--purple-text: #6d28d9;\r\n\t--blue: #0ea5e9;\r\n\t--blue-bg: #e0f2fe;\r\n\t--blue-text: #0369a1;\r\n\t--gray: #64748b;\r\n\t--gray-bg: #f1f5f9;\r\n\t--gray-text: #475569;\r\n\t--shadow-sm: 0 1px 2px rgba(0,0,0,.05);\r\n\t--shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);\r\n\t--shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);\r\n\t--shadow-lg: 0 12px 32px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);\r\n\t--radius-sm: 6px;\r\n\t--radius: 10px;\r\n\t--radius-lg: 14px;\r\n\t--radius-xl: 20px;\r\n\t--transition: 180ms ease;\r\n\t--font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;\r\n\t--sidebar-w: 232px;\r\n}\r\n\r\n[data-theme=\"dark\"] {\r\n\t--bg: #0f1117;\r\n\t--bg2: #1a1d27;\r\n\t--bg3: #232630;\r\n\t--bg4: #2c2f3a;\r\n\t--text: #e4e6eb;\r\n\t--text2: #b0b3b8;\r\n\t--text3: #6b6f78;\r\n\t--border: #2d3039;\r\n\t--border2: #3a3d47;\r\n\t--primary: #3b82f6;\r\n\t--primary-hover: #2563eb;\r\n\t--primary-light: #1e293b;\r\n\t--primary-bg: #1e3a5f;\r\n\t--green: #22c55e;\r\n\t--green-bg: #14532d;\r\n\t--green-text: #86efac;\r\n\t--red: #ef4444;\r\n\t--red-bg: #450a0a;\r\n\t--red-text: #fca5a5;\r\n\t--amber: #f59e0b;\r\n\t--amber-bg: #451a03;\r\n\t--amber-text: #fcd34d;\r\n\t--purple: #8b5cf6;\r\n\t--purple-bg: #2e1065;\r\n\t--purple-text: #c4b5fd;\r\n\t--blue: #38bdf8;\r\n\t--blue-bg: #0c2d48;\r\n\t--blue-text: #7dd3fc;\r\n\t--gray: #94a3b8;\r\n\t--gray-bg: #1e293b;\r\n\t--gray-text: #cbd5e1;\r\n\t--shadow-sm: 0 1px 2px rgba(0,0,0,.2);\r\n\t--shadow: 0 1px 3px rgba(0,0,0,.3);\r\n\t--shadow-md: 0 4px 12px rgba(0,0,0,.4);\r\n\t--shadow-lg: 0 12px 32px rgba(0,0,0,.5);\r\n}\r\n\r\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\r\n\r\nbody {\r\n\tfont-family: var(--font);\r\n\tbackground: var(--bg);\r\n\tcolor: var(--text);\r\n\tfont-size: 14px;\r\n\tline-height: 1.5;\r\n\t-webkit-font-smoothing: antialiased;\r\n}\r\n\r\n#app { display: flex; min-height: 100vh; }\r\n\r\n/* ── Read-only banner ── */\r\n.ro-banner {\r\n\tposition: fixed; top: 0; left: 0; right: 0; z-index: 9000;\r\n\tbackground: var(--amber-bg); color: var(--amber-text);\r\n\tfont-weight: 600; font-size: 12.5px; text-align: center; padding: 6px 12px;\r\n}\r\n\r\n/* ── Sidebar ── */\r\n.sidebar {\r\n\twidth: var(--sidebar-w);\r\n\tmin-width: var(--sidebar-w);\r\n\tbackground: var(--bg2);\r\n\tborder-right: 1px solid var(--border);\r\n\tdisplay: flex;\r\n\tflex-direction: column;\r\n\tposition: sticky;\r\n\ttop: 0;\r\n\theight: 100vh;\r\n}\r\n.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid var(--border); }\r\n.brand-icon {\r\n\twidth: 40px; height: 40px; border-radius: 10px;\r\n\tbackground: linear-gradient(135deg, var(--primary), #7c3aed);\r\n\tcolor: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;\r\n\tbox-shadow: var(--shadow-md);\r\n}\r\n.brand-name { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }\r\n.brand-sub { font-size: 11px; color: var(--text3); margin-top: -2px; }\r\n\r\n.nav { flex: 1; padding: 10px 8px; overflow-y: auto; }\r\n.nav-item {\r\n\tdisplay: flex; align-items: center; gap: 10px;\r\n\tpadding: 9px 12px; border-radius: 8px; cursor: pointer;\r\n\tcolor: var(--text2); font-weight: 500; font-size: 13.5px;\r\n\tmargin-bottom: 2px; transition: background var(--transition), color var(--transition);\r\n\tuser-select: none;\r\n}\r\n.nav-item:hover { background: var(--bg3); color: var(--text); }\r\n.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }\r\n.nav-icon { width: 18px; text-align: center; font-size: 15px; }\r\n.nav-badge {\r\n\tmargin-left: auto; background: var(--bg3); color: var(--text2);\r\n\tfont-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px;\r\n}\r\n.nav-item.active .nav-badge { background: var(--primary-bg); color: var(--primary); }\r\n\r\n.sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }\r\n.foot-card { background: var(--bg3); border-radius: var(--radius); padding: 12px; }\r\n.foot-label { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }\r\n.foot-value { font-size: 20px; font-weight: 800; margin: 2px 0 8px; }\r\n\r\n.progress { height: 7px; background: var(--bg4); border-radius: 999px; overflow: hidden; }\r\n.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #7c3aed); border-radius: 999px; transition: width 300ms ease; }\r\n\r\n/* ── Main ── */\r\n.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }\r\n\r\n.topbar {\r\n\tdisplay: flex; align-items: center; justify-content: space-between;\r\n\tpadding: 16px 24px; border-bottom: 1px solid var(--border);\r\n\tbackground: var(--bg2); position: sticky; top: 0; z-index: 100;\r\n\tgap: 12px;\r\n}\r\n.page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }\r\n.page-sub { font-size: 12.5px; color: var(--text3); margin-top: 1px; }\r\n.topbar-actions { display: flex; align-items: center; gap: 8px; }\r\n\r\n.section { display: none; padding: 24px; gap: 20px; flex-direction: column; }\r\n.section.active { display: flex; }\r\n\r\n/* ── Panels ── */\r\n.panel {\r\n\tbackground: var(--bg2); border: 1px solid var(--border);\r\n\tborder-radius: var(--radius-lg); padding: 18px;\r\n\tbox-shadow: var(--shadow-sm);\r\n}\r\n.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }\r\n.panel-head h3 { font-size: 15px; font-weight: 700; }\r\n.panel-hint { font-size: 12.5px; color: var(--text3); margin-bottom: 12px; }\r\n\r\n/* ── Buttons ── */\r\n.btn {\r\n\tdisplay: inline-flex; align-items: center; justify-content: center; gap: 6px;\r\n\tborder: 1px solid transparent; border-radius: 8px; cursor: pointer;\r\n\tfont-family: var(--font); font-size: 13px; font-weight: 600;\r\n\tpadding: 8px 14px; transition: all var(--transition); white-space: nowrap;\r\n\tbackground: var(--bg3); color: var(--text);\r\n}\r\n.btn:hover { filter: brightness(0.96); }\r\n.btn:disabled { opacity: .5; cursor: not-allowed; }\r\n.btn-primary { background: var(--primary); color: #fff; }\r\n.btn-primary:hover { background: var(--primary-hover); }\r\n.btn-ghost { background: transparent; border-color: var(--border2); color: var(--text2); }\r\n.btn-ghost:hover { background: var(--bg3); }\r\n.btn-outline { background: transparent; border-color: var(--primary); color: var(--primary); }\r\n.btn-outline:hover { background: var(--primary-light); }\r\n.btn-danger { background: var(--red); color: #fff; }\r\n.btn-danger:hover { background: #b91c1c; }\r\n.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }\r\n.btn-icon { width: 30px; height: 30px; padding: 0; border-radius: 7px; background: transparent; border-color: var(--border2); color: var(--text2); }\r\n.btn-icon:hover { background: var(--bg3); }\r\n.btn-full { width: 100%; }\r\n.theme-toggle { border: 1px solid var(--border2); background: var(--bg2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; }\r\n\r\n/* ── Forms ── */\r\n.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\r\n.field { display: flex; flex-direction: column; gap: 5px; }\r\n.field-full { grid-column: 1 / -1; }\r\n.field label { font-size: 12px; font-weight: 600; color: var(--text2); }\r\n.field input, .field select, .field textarea, .modal-body input, .modal-body select, .modal-body textarea {\r\n\tfont-family: var(--font); font-size: 13.5px; color: var(--text);\r\n\tbackground: var(--bg); border: 1px solid var(--border2); border-radius: 8px;\r\n\tpadding: 9px 11px; outline: none; transition: border var(--transition), box-shadow var(--transition);\r\n\twidth: 100%;\r\n}\r\n.field textarea, .modal-body textarea { resize: vertical; min-height: 38px; }\r\n.field input:focus, .field select:focus, .field textarea:focus,\r\n.modal-body input:focus, .modal-body select:focus, .modal-body textarea:focus {\r\n\tborder-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);\r\n}\r\n.field input:disabled, .field textarea:disabled { opacity: .6; cursor: not-allowed; background: var(--bg3); }\r\n\r\n/* ── Stats ── */\r\n.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }\r\n.stat-card {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg);\r\n\tpadding: 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px;\r\n}\r\n.stat-top { display: flex; align-items: center; justify-content: space-between; }\r\n.stat-icon { font-size: 20px; }\r\n.stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }\r\n.stat-label { font-size: 12px; color: var(--text3); font-weight: 600; }\r\n\r\n.dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\r\n@media (max-width: 900px) { .dash-cols { grid-template-columns: 1fr; } }\r\n\r\n/* ── Lists & cards ── */\r\n.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }\r\n.apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }\r\n\r\n.card {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg);\r\n\tpadding: 14px; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition), transform var(--transition);\r\n\tdisplay: flex; flex-direction: column; gap: 8px;\r\n}\r\n.card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }\r\n.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }\r\n.card-title { font-weight: 700; font-size: 14.5px; }\r\n.card-sub { font-size: 12px; color: var(--text3); }\r\n.card-actions { display: flex; gap: 6px; margin-left: auto; }\r\n\r\n.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }\r\n\r\n.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }\r\n.chip {\r\n\tborder: 1px solid var(--border2); background: var(--bg2); color: var(--text2);\r\n\tpadding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 600;\r\n\ttransition: all var(--transition);\r\n}\r\n.chip:hover { background: var(--bg3); }\r\n.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }\r\n\r\n.empty-state {\r\n\ttext-align: center; padding: 34px 20px; color: var(--text3);\r\n\tborder: 2px dashed var(--border2); border-radius: var(--radius-lg);\r\n}\r\n.empty-icon { font-size: 34px; margin-bottom: 8px; }\r\n.empty-state h3 { color: var(--text2); font-size: 15px; margin-bottom: 4px; }\r\n.empty-state p { font-size: 13px; margin-bottom: 14px; }\r\n\r\n/* ── Tables ── */\r\n.table-wrap { overflow-x: auto; }\r\n.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }\r\n.data-table th {\r\n\ttext-align: left; padding: 10px 12px; font-size: 11.5px; text-transform: uppercase;\r\n\tletter-spacing: .4px; color: var(--text3); border-bottom: 2px solid var(--border);\r\n}\r\n.data-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }\r\n.data-table tr:hover td { background: var(--bg3); }\r\n.th-actions { width: 90px; text-align: right; }\r\n.td-actions { text-align: right; white-space: nowrap; }\r\n.td-actions .btn { margin-left: 4px; }\r\n\r\n/* ── Requirement list (drawer) ── */\r\n.req-list { display: flex; flex-direction: column; gap: 10px; }\r\n.req-item {\r\n\tborder: 1px solid var(--border); border-radius: var(--radius); padding: 12px;\r\n\tdisplay: flex; gap: 10px; align-items: flex-start; background: var(--bg2);\r\n}\r\n.req-check {\r\n\twidth: 22px; height: 22px; min-width: 22px; border-radius: 50%;\r\n\tborder: 2px solid var(--border2); cursor: pointer; display: flex; align-items: center; justify-content: center;\r\n\tfont-size: 12px; color: #fff; transition: all var(--transition); margin-top: 2px;\r\n}\r\n.req-check.done { background: var(--green); border-color: var(--green); }\r\n.req-main { flex: 1; min-width: 0; }\r\n.req-title { font-weight: 600; font-size: 13.5px; }\r\n.req-title.done { text-decoration: line-through; color: var(--text3); }\r\n.req-desc { font-size: 12px; color: var(--text3); margin-top: 2px; }\r\n.req-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }\r\n\r\n/* ── Notes ── */\r\n.notes-list { display: flex; flex-direction: column; gap: 10px; }\r\n.note-item { border-left: 3px solid var(--primary); background: var(--bg3); border-radius: var(--radius-sm); padding: 10px 12px; }\r\n.note-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }\r\n.note-title { font-weight: 700; font-size: 13px; }\r\n.note-date { font-size: 11px; color: var(--text3); }\r\n.note-text { font-size: 13px; color: var(--text2); margin-top: 4px; white-space: pre-wrap; }\r\n.note-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }\r\n\r\n/* ── AI box ── */\r\n.ai-box { display: flex; flex-direction: column; height: 440px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\r\n.ai-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg3); }\r\n.ai-msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }\r\n.ai-msg-user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 3px; }\r\n.ai-msg-bot { align-self: flex-start; background: var(--bg2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }\r\n.ai-inputrow { display: flex; gap: 8px; padding: 10px; background: var(--bg2); border-top: 1px solid var(--border); }\r\n.ai-inputrow textarea { flex: 1; resize: none; }\r\n\r\n/* ── Modal ── */\r\n.modal-overlay {\r\n\tposition: fixed; inset: 0; background: rgba(15,17,23,.5); z-index: 7000;\r\n\tdisplay: none; align-items: center; justify-content: center; padding: 20px;\r\n}\r\n.modal-overlay.open { display: flex; }\r\n.modal {\r\n\tbackground: var(--bg2); border-radius: var(--radius-lg); width: 100%; max-width: 520px;\r\n\tmax-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg);\r\n}\r\n.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }\r\n.modal-header h3 { font-size: 16px; font-weight: 700; }\r\n.modal-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }\r\n.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }\r\n\r\n/* ── Drawer ── */\r\n.drawer-overlay {\r\n\tposition: fixed; inset: 0; background: rgba(15,17,23,.4); z-index: 6000;\r\n\tdisplay: none; justify-content: flex-end;\r\n}\r\n.drawer-overlay.open { display: flex; }\r\n.drawer {\r\n\tbackground: var(--bg); width: 100%; max-width: 560px; height: 100%;\r\n\tdisplay: flex; flex-direction: column; box-shadow: var(--shadow-lg);\r\n\tanimation: drawerIn .22s ease;\r\n}\r\n@keyframes drawerIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }\r\n.drawer-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--border); background: var(--bg2); }\r\n.drawer-header h3 { font-size: 17px; font-weight: 800; }\r\n.drawer-sub { font-size: 12.5px; color: var(--text3); margin-top: 2px; }\r\n.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }\r\n\r\n/* ── Utility color chips ── */\r\n.bg-green { background: var(--green-bg); color: var(--green-text); }\r\n.bg-amber { background: var(--amber-bg); color: var(--amber-tex e : \"\") + '\"><\/div>' +\r\n\t\t\t'<div class=\"field\"><label>Related Section<\/label><select id=\"m-rq-section\">' + selectOptions(REQUEST_SECTIONS, rq ? rq.section : \"general\") + '<\/select><\/div>' +\r\n\t\t\t'<div class=\"field\"><label>Due Date<\/label><input type=\"date\" id=\"m-rq-due\" value=\"' + esc(rq ? rq.due : \"\") + '\"><\/div>' +\r\n\t\t\t'<div class=\"field\"><label>Status<\/label><select id=\"m-rq-status\">' + selectOptions(REQUEST_STATUS_META, rq ? rq.status : \"open\") + '<\/select><\/div>' +\r\n\t\t\t'<div class=\"field field-full\"><label>Description<\/label><textarea id=\"m-rq-desc\" rows=\"3\" placeholder=\"What data or evidence is needed, and why.\">' + esc(rq ? rq.description : \"\") + '<\/textarea><\/div>' +\r\n\t\t\t(editing ? '<div class=\"drawer-section-title\">Conversation<\/div>' + commentHTML(rq.replies) +\r\n\t\t\t\t(isReadOnly ? \"\" : '<div class=\"comment-form\"><textarea id=\"m-rq-reply\" rows=\"2\" placeholder=\"Reply...\"><\/textarea><button class=\"btn btn-primary\" id=\"m-rq-reply-btn\">Reply<\/button><\/div>') : '');\r\n\r\n\t\topenModal(editing ? \"Data Request\" : \"New Data Request\", body,\r\n\t\t\t'<button class=\"btn btn-ghost\" id=\"m-cancel\">Close<\/button><button class=\"btn btn-primary\" id=\"m-save\">' + (editing ? \"Update\" : \"Create\") + '<\/button>');\r\n\r\n\t\tdocument.getElementById(\"m-cancel\").onclick = closeModal;\r\n\t\tdocument.getElementById(\"m-save\").onclick = function () {\r\n\t\t\tvar title = document.getElementById(\"m-rq-title\").value.trim();\r\n\t\t\tif (!title) { notify(\"Please enter a title.\", \"warning\"); return; }\r\n\t\t\tvar data = {\r\n\t\t\t\ttitle: title,\r\n\t\t\t\tsection: document.getElementById(\"m-rq-section\").value,\r\n\t\t\t\tdue: document.getElementById(\"m-rq-due\").value,\r\n\t\t\t\tstatus: document.getElementById(\"m-rq-status\").value,\r\n\t\t\t\tdescription: document.getElementById(\"m-rq-desc\").value\r\n\t\t\t};\r\n\t\t\tif (editing) { for (var k in data) <script>
(function () {

  var codeOpenButton = document.getElementById('docs-code-open');

  var shotsPrev = document.getElementById('docs-shots-prev');

    shotsPayload = JSON.parse(document.getElementById('shots-payload').textContent) || [];
  } catch (error) { /* payload unavailable */ }
  var currentShotIndex = 0;

  function renderShotsInfo(shot) {
    if (!shotsInfo) return;
    if (!shot) { shotsInfo.innerHTML = ''; return; }
    var fields = [
      ['File', shot.name || ''],
      ['Shot', shot.label || ''],
      ['Page', shot.page || ''],
      ['Viewport', shot.viewport || ''],
      ['Dimensions', shot.width && shot.height ? shot.width + ' \u00d7 ' + shot.height + ' px' : ''],
      ['Captured', shot.capturedAt ? shot.capturedAt.replace('T', ' ').slice(0, 19) + ' UTC' : ''],
      ['Used in', Array.isArray(shot.usedIn) && shot.usedIn.length ? shot.usedIn.join(', ') : 'docs index viewer'],
    ];

      '<dl>' + fields.filter(function (field) { return field[1]; })

      if (shotsNext) shotsNext.style.display = 'none';

      return;

      shotsImg.style.display = '';
      shotsImg.src = shot.src;
    }

          '<img src="' + entry.src + '" alt="' + (entry.label || entry.name) + '" loading="lazy" />' +
          '<span>' + (entry.label || entry.name) + '</span></button>';
      }).join('');
    }
    renderShotsInfo(shot);
  }

  function openShotsPane() {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.add('visible');

  if (shotsPrev) shotsPrev.addEventListener('click', function () { showShot(currentShotIndex - 1); });

    shotsView.classList.remove('visible');

    if (openButton) openButton.style.display = 'none';

    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {

      } else {
        fallbackCopy(text, markCopied);
      }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
</body>
</html>
