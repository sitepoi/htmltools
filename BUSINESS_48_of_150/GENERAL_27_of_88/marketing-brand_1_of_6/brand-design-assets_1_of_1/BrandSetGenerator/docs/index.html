    <p class=\"bsg-hint\">Design the logo — or upload an existing one. All brand assets are generated from it.<\/p>\r\n          <\/div>\r\n\r\n          <div class=\"bsg-source-tabs\">\r\n            <button class=\"bsg-source-tab active\" id=\"src-builder\">🎨 Logo Builder<\/button>\r\n            <button class=\"bsg-source-tab\" id=\"src-upload\">📤 Upload a logo<\/button>\r\n          <\/div>\r\n\r\n          <div id=\"builder-controls\">\r\n            <div class=\"bsg-control-group\">\r\n              <label>Symbol<\/label>\r\n              <div class=\"bsg-seg\" id=\"symbol-type\">\r\n                <button class=\"bsg-seg-btn active\" data-symbol=\"icon\">Icon<\/button>\r\n                <button class=\"bsg-seg-btn\" data-symbol=\"monogram\">Monogram<\/button>\r\n                <button class=\"bsg-seg-btn\" data-symbol=\"none\">None<\/button>\r\n              <\/div>\r\n              <div id=\"icon-picker-wrap\" style=\"margin-top:12px\">\r\n                <input class=\"bsg-input bsg-icon-search\" id=\"icon-search\" placeholder=\"🔍 Search icons…\">\r\n                <div class=\"bsg-icon-grid\" id=\"icon-grid\"><\/div>\r\n              <\/div>\r\n              <div id=\"monogram-wrap\" style=\"display:none;margin-top:12px\">\r\n                <input class=\"bsg-input\" id=\"f-monogram\" placeholder=\"e.g. NL\" maxlength=\"4\" style=\"text-transform:uppercase;font-weight:700;letter-spacing:2px\">\r\n              <\/div>\r\n            <\/div>\r\n\r\n            <div class=\"bsg-control-group\">\r\n              <label>Layout<\/label>\r\n              <div class=\"bsg-seg\" id=\"layout-type\">\r\n                <button class=\"bsg-seg-btn active\" data-layout=\"horizontal\">Horizontal<\/button>\r\n                <button class=\"bsg-seg-btn\" data-layout=\"stacked\">Stacked<\/button>\r\n                <button class=\"bsg-seg-btn\" data-layout=\"emblem\">Emblem<\/button>\r\n                <button class=\"bsg-seg-btn\" data-layout=\"mark\">Mark only<\/button>\r\n              <\/div>\r\n            <\/div>\r\n\r\n            <div class=\"bsg-control-group\">\r\n              <label>Icon container<\/label>\r\n              <div class=\"bsg-seg\" id=\"shape-type\">\r\n                <button class=\"bsg-seg-btn\" data-shape=\"none\">None<\/button>\r\n                <button class=\"bsg-seg-btn active\" data-shape=\"rounded\">Rounded<\/button>\r\n                <button class=\"bsg-seg-btn\" data-shape=\"circle\">Circle<\/button>\r\n                <button class=\"bsg-seg-btn\" data-shape=\"squircle\">Squircle<\/button>\r\n              <\/div>\r\n            <\/div>\r\n\r\n            <div class=\"bsg-control-group\">\r\n              <label>Typography<\/label>\r\n              <div class=\"bsg-color-mini-row\">\r\n                <div class=\"bsg-field\"><label>Name font<\/label><select class=\"bsg-select\" id=\"f-font\"><\/select><\/div>\r\n                <div class=\"bsg-field\"><label>Tagline font<\/label><select class=\"bsg-select\" id=\"f-tagfont\"><\/select><\/div>\r\n              <\/div>\r\n              <div class=\"bsg-toggle-row\" style=\"margin-top:12px\"><input type=\"checkbox\" id=\"t-upper\"> UPPERCASE name<\/div>\r\n              <div class=\"bsg-toggle-row\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"t-tagline\" checked> Show tagline<\/div>\r\n              <div class=\"bsg-toggle-row\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"t-shadow\" checked> Soft shadow on symbol<\/div>\r\n            <\/div>\r\n\r\n            <div class=\"bsg-control-group\">\r\n              <label>Sizing<\/label>\r\n              <div class=\"bsg-range-row\"><label>Tracking<\/label><input type=\"range\" id=\"r-track\" min=\"0\" max=\"12\" step=\"0.5\" value=\"2\"><span class=\"bsg-range-val\" id=\"track-val\">2<\/span><\/div>\r\n              <div class=\"bsg-range-row\" style=\"margin-top:10px\"><label>Symbol size<\/label><input type=\"range\" id=\"r-scale\" min=\"60\" max=\"130\" step=\"1\" value=\"100\"><span class=\"bsg-range-val\" id=\"scale-val\">100%<\/span><\/div>\r\n            <\/div>\r\n\r\n            <div class=\"bsg-control-group\">\r\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\r\n                <label style=\"margin:0\">Colors<\/label>\r\n                <button class=\"bsg-btn bsg-btn-ghost bsg-btn-sm\" id=\"btn-colors-reset\">↺ Use palette<\/button>\r\n              <\/div>\r\n              <div class=\"bsg-color-mini-row\">\r\n                <div class=\"bsg-color-mini\"><label>Symbol<\/label><input type=\"color\" class=\"bsg-color-input\" id=\"f-c-primary\" value=\"#4f46e5\"><\/div>\r\n                <div class=\"bsg-color-mini\"><label>Text<\/label><input type=\"color\" class=\"bsg-color-input\" id=\"f-c-text\" value=\"#0f172a\"><\/div>\r\n                <div class=\"bsg-color-mini\"><label>Tagline<\/label><input type=\"color\" class=\"bsg-color-input\" id=\"f-c-tag\" value=\"#64748b\"><\/div>\r\n                <div class=\"bsg-color-mini\"><label>Badge bg<\/label><input type=\"color\" class=\"bsg-color-input\" id=\"f-c-bg\" value=\"#4f46e5\"><\/div>\r\n              <\/div>\r\n            <\/div>\r\n          <\/div>\r\n\r\n          <div id=\"upload-controls\" style=\"display:none\">\r\n            <div class=\"bsg-upload-drop\" id=\"btn-upload\">\r\n              <div class=\"bsg-up-icon\">⬆️<\/div>\r\n              <b>Upload your logo<\/b>\r\n              <div style=\"font-size:12px;margin-top:4px\">PNG, JPG or SVG — we generate every other asset from it<\/div>\r\n            <\/div>\r\n            <div class=\"bsg-upload-preview\" id=\"upload-preview\" style=\"display:none\">\r\n              <img id=\"upload-img\" alt=\"Uploaded logo\">\r\n              <div class=\"bsg-upload-name\" id=\"upload-name\"><\/div>\r\n            <\/div>\r\n            <div class=\"bsg-control-group\">\r\n              <label>Uploaded logo style<\/label>\r\n              <div class=\"bsg-field\"><label>Fit<\/label><select class=\"bsg-select\" id=\"f-upload-fit\">\r\n                <option value=\"plain\">Plain (transparent)<\/option>\r\n                <option value=\"badge\">White badge (circle)<\/option>\r\n                <option value=\"card\">Brand color card<\/option>\r\n              <\/select><\/div>\r\n              <div class=\"bsg-range-row\" style=\"margin-top:12px\"><label>Size<\/label><input type=\"range\" id=\"r-upload-pad\" min=\"55\" max=\"95\" step=\"1\" value=\"72\"><span class=\"bsg-range-val\" id=\"upload-pad-val\">72%<\/span><\/div>\r\n            <\/div>\r\n            <button class=\"bsg-btn bsg-btn-danger bsg-btn-sm\" id=\"btn-upload-remove\" style=\"margin-top:8px\">Remove uploaded logo<\/button>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"bsg-card bsg-studio-preview\">\r\n          <div class=\"bsg-preview-toolbar\">\r\n            <div class=\"bsg-bg-btns\">\r\n              <button class=\"bsg-bg-btn light active\" data-bg=\"light\" title=\"Light background\"><\/button>\r\n              <button class=\"bsg-bg-btn dark\" data-bg=\"dark\" title=\"Dark background\"><\/button>\r\n              <button class=\"bsg-bg-btn checker\" data-bg=\"checker\" title=\"Transparent\"><\/button>\r\n            <\/div>\r\n            <button class=\"bsg-btn bsg-btn-ghost bsg-btn-sm\" id=\"btn-regenerate\">🔄 Rebuild all assets<\/button>\r\n          <\/div>\r\n          <div class=\"bsg-preview-stage\" id=\"preview-stage\" data-bg=\"light\">\r\n            <div id=\"logo-preview\"><\/div>\r\n          <\/div>\r\n          <div class=\"bsg-preview-caption\">Primary logo — live preview<\/div>\r\n          <div class=\"bsg-variants\" id=\"variant-previews\"><\/div>\r\n        <\/div>\r\n      <\/div>\r\n      <div class=\"bsg-step-actions\">\r\n        <button class=\"bsg-btn bsg-btn-primary\" id=\"btn-step2-next\">Continue to Creative Lab →<\/button>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- ============ STEP 3 — CREATIVE LAB ============ -->\r\n    <section class=\"bsg-pane\" id=\"pane-3\" style=\"display:none\">\r\n      <div class=\"bsg-lab\">\r\n        <aside class=\"bsg-kit-side\">\r\n          <div class=\"bsg-kit-side-title\">Creative tools<\/div>\r\n          <nav class=\"bsg-kit-nav\" id=\"lab-nav\"><\/nav>\r\n        <\/aside>\r\n        <div class=\"bsg-kit-content\" id=\"lab-content\"><\/div>\r\n      <\/div>\r\n      <div class=\"bsg-step-actions\">\r\n        <button class=\"bsg-btn bsg-btn-primary\" id=\"btn-step3-next\">Continue to Brand Kit →<\/button>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- ============ STEP 4 — BRAND KIT ============ -->\r\n    <section class=\"bsg-pane\" id=\"pane-4\" style=\"display:none\">\r\n      <div class=\"bsg-kit-toolbar\">\r\n        <div>\r\n          <h2>Brand Kit<\/h2>\r\n          <p id=\"kit-subtitle\">Every asset below is generated from your logo — download individually or as a ZIP.<\/p>\r\n        <\/div>\r\n        <div class=\"bsg-kit-actions\">\r\n          <button class=\"bsg-btn bsg-btn-primary\" id=\"btn-zip\">⬇ Download all (ZIP)<\/button>\r\n          <button class=\"bsg-btn bsg-btn-ghost\" id=\"btn-pdf-guidelines\">📄 Guidelines PDF<\/button>\r\n          <button class=\"bsg-btn bsg-btn-ghost\" id=\"btn-kit-dark\">🌙 Dark variant<\/button>\r\n          <button class=\"bsg-btn bsg-btn-ghost\" id=\"btn-copy-json\">📋 Copy Brand JSON<\/button>\r\n          <button class=\"bsg-btn bsg-btn-ghost\" id=\"btn-download-json\">⬇ brand.json<\/button>\r\n        <\/div>\r\n      <\/div>\r\n      <div class=\"bsg-kit-settings\">\r\n        <details class=\"bsg-kit-setting\">\r\n          <summary>🏷️ File naming scheme<\/summary>\r\n          <div class=\"bsg-kit-setting-body\">\r\n            <label class=\"bsg-set-field\"><span>Slug<\/span><input id=\"f-slug\" type=\"text\" placeholder=\"auto: nova-labs\"><\/label>\r\n            <label class=\"bsg-set-field\"><span>Prefix<\/span><input id=\"f-prefix\" type=\"text\" placeholder=\"e.g. brand\"><\/label>\r\n            <label class=\"bsg-set-field\"><span>Suffix<\/span><input id=\"f-suffix\" type=\"text\" placeholder=\"e.g. 2026\"><\/label>\r\n            <div class=\"bsg-hint\" style=\"align-self:center\">Example: <code id=\"f-name-sample\">nova-labs-primary-logo.svg<\/code><\/div>\r\n          <\/div>\r\n        <\/details>\r\n        <details class=\"bsg-kit-setting\">\r\n          <summary>📦 Export preferences<\/summary>\r\n          <div class=\"bsg-kit-setting-body\" id=\"export-prefs\"><\/div>\r\n        <\/details>\r\n      <\/div>\r\n      <div class=\"bsg-kit-layout\">\r\n        <aside class=\"bsg-kit-side\">\r\n          <div class=\"bsg-kit-side-title\">Asset categories<\/div>\r\n          <nav class=\"bsg-kit-nav\" id=\"kit-nav\"><\/nav>\r\n        <\/aside>\r\n        <div class=\"bsg-kit-content\">\r\n          <div id=\"kit-content\"><\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n  <\/main>\r\n\r\n  <div class=\"bsg-lightbox\" id=\"lightbox\" style=\"display:none\">\r\n    <div class=\"bsg-lightbox-inner\">\r\n      <div class=\"bsg-lightbox-bar\">\r\n        <span id=\"lightbox-title\"><\/span>\r\n        <div class=\"bsg-lightbox-actions\">\r\n          <div class=\"bsg-lb-bg-btns\" id=\"lb-bg-btns\" title=\"Preview background\">\r\n            <button class=\"bsg-lb-bg checker active\" data-lbbg=\"checker\" title=\"Transparent (checker)\"><\/button>\r\n            <button class=\"bsg-lb-bg light\" data-lbbg=\"light\" title=\"White background\"><\/button>\r\n            <button class=\"bsg-lb-bg dark\" data-lbbg=\"dark\" title=\"Dark background\"><\/button>\r\n            <button class=\"bsg-lb-bg brand\" data-lbbg=\"brand\" title=\"Brand color\"><\/button>\r\n          <\/div>\r\n          <select class=\"bsg-lb-scale\" id=\"lb-scale\" title=\"PNG / WebP export size\">\r\n            <option value=\"1\">1× native<\/option>\r\n            <option value=\"2\" selected>2× retina<\/option>\r\n            <option value=\"4\">4× large<\/option>\r\n          <\/select>\r\n          <button class=\"bsg-btn bsg-btn-ghost bsg-btn-sm\" id=\"lb-download-svg\">⬇ SVG<\/button>\r\n          <button class=\"bsg-btn bsg-btn-ghost bsg-btn-sm\" id=\"lb-download-png\">🖼 PNG<\/button>\r\n          <button class=\"bsg-btn bsg-btn-ghost bsg-btn-sm\" id=\"lb-download-html\" style=\"display:none\">⬇ HTML<\/button>\r\n          <button class=\"bsg-lb-close\" id=\"lb-close\" title=\"Close\">✕<\/button>\r\n        <\/div>\r\n      <\/div>\r\n      <div class=\"bsg-lightbox-stage\" id=\"lightbox-stage\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"BrandSetGenerator.css","src":"../app/BrandSetGenerator.css","content":"/* ============================================================\r\n   Brand Set Generator — stylesheet\r\n   UniconHub html-tool (sandboxed iframe)\r\n   ============================================================ */\r\n\r\n@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');\r\n\r\n:root {\r\n  --bsg-accent: #4f46e5;\r\n  --bsg-accent-2: #7c3aed;\r\n  --bsg-grad: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);\r\n  --bsg-ink: #0f172a;\r\n  --bsg-muted: #64748b;\r\n  --bsg-faint: #94a3b8;\r\n  --bsg-line: #e5e9f2;\r\n  --bsg-bg: #f4f5fa;\r\n  --bsg-card: #ffffff;\r\n  --bsg-radius: 16px;\r\n  --bsg-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 10px 28px -12px rgba(15, 23, 42, .18);\r\n  --bsg-font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;\r\n}\r\n\r\n* { box-sizing: border-box; }\r\n\r\n.bsg-root {\r\n  font-family: var(--bsg-font);\r\n  color: var(--bsg-ink);\r\n  background: var(--bsg-bg);\r\n  padding: 0 0 40px 0;\r\n  font-size: 14px;\r\n  line-height: 1.5;\r\n  -webkit-font-smoothing: antialiased;\r\n}\r\n\r\n.bsg-root h1, .bsg-root h2, .bsg-root h3, .bsg-root p { margin: 0; }\r\n\r\n/* ---------- Header ---------- */\r\n.bsg-header {\r\n  background: #0f172a;\r\n  color: #e6edf5;\r\n  padding: 22px 28px 0;\r\n  position: relative;\r\n  overflow: hidden;\r\n}\r\n.bsg-header::after {\r\n  content: '';\r\n  position: absolute;\r\n  right: -120px;\r\n  top: -160px;\r\n  width: 460px;\r\n  height: 460px;\r\n  border-radius: 50%;\r\n  background: radial-gradient(circle, rgba(124, 58, 237, .35) 0%, rgba(79, 70, 229, .18) 55%, transparent 72%);\r\n  pointer-events: none;\r\n}\r\n.bsg-header-inner {\r\n  max-width: 1180px;\r\n  margin: 0 auto;\r\n  display: flex;\r\n  align-items: flex-start;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  position: relative;\r\n  z-index: 1;\r\n}\r\n.bsg-brand { display: flex; align-items: center; gap: 14px; }\r\n.bsg-logo-mark {\r\n  width: 46px;\r\n  height: 46px;\r\n  flex: none;\r\n  display: grid;\r\n  place-items: center;\r\n  border-radius: 13px;\r\n  background: var(--bsg-grad);\r\n  color: #fff;\r\n  font-size: 20px;\r\n  font-weight: 700;\r\n  box-shadow: 0 8px 22px -8px rgba(124, 58, 237, .8);\r\n}\r\n.bsg-brand h1 { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }\r\n.bsg-brand p { font-size: 12.5px; color: #9aa7bd; margin-top: 2px; }\r\n.bsg-header-actions { display: flex; align-items: center; gap: 10px; padding-top: 6px; }\r\n.bsg-save-state {\r\n  font-size: 11.5px;\r\n  padding: 6px 12px;\r\n  border-radius: 999px;\r\n  background: rgba(255, 255, 255, .08);\r\n  border: 1px solid rgba(255, 255, 255, .12);\r\n  color: #cbd5e1;\r\n  white-space: nowrap;\r\n}\r\n.bsg-save-state.ok { color: #86efac; border-color: rgba(134, 239, 172, .35); }\r\n.bsg-role-badge {\r\n  font-size: 11.5px;\r\n  font-weight: 600;\r\n  padding: 6px 12px;\r\n  border-radius: 999px;\r\n  background: rgba(124, 58, 237, .25);\r\n  border: 1px solid rgba(139, 92, 246, .45);\r\n  color: #ddd6fe;\r\n  white-space: nowrap;\r\n}\r\n.bsg-lock-note {\r\n  font-size: 11px;\r\n  color: #fbbf24;\r\n  background: rgba(251, 191, 36, .12);\r\n  border: 1px solid rgba(251, 191, 36, .4);\r\n  padding: 6px 12px;\r\n  border-radius: 999px;\r\n  white-space: nowrap;\r\n}\r\n\r\n/* ---------- Steps ---------- */\r\n.bsg-steps {\r\n  max-width: 1180px;\r\n  margin: 20px auto 0;\r\n  display: flex;\r\n  gap: 8px;\r\n  position: relative;\r\n  z-index: 1;\r\n}\r\n.bsg-step {\r\n  border: 1px solid rgba(255, 255, 255, .14);\r\n  background: rgba(255, 255, 255, .06);\r\n  color: #aeb9cd;\r\n  border-radius: 999px;\r\n  padding: 9px 18px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  font-family: var(--bsg-font);\r\n  cursor: pointer;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  transition: all .18s ease;\r\n}\r\n.bsg-step .num {\r\n  width: 22px;\r\n  height: 22px;\r\n  border-radius: 50%;\r\n  background: rgba(255, 255, 255, .12);\r\n  display: grid;\r\n  place-items: center;\r\n  font-size: 11.5px;\r\n}\r\n.bsg-step:hover { background: rgba(255, 255, 255, .1); color: #fff; }\r\n.bsg-step.active {\r\n  background: var(--bsg-grad);\r\n  border-color: transparent;\r\n  color: #fff;\r\n  box-shadow: 0 8px 20px -8px rgba(124, 58, 237, .7);\r\n}\r\n.bsg-step.active .num { background: rgba(255, 255, 255, .22); }\r\n\r\n/* ---------- Main / panes ---------- */\r\n.bsg-main { max-width: 1180px; margin: 26px auto 0; padding: 0 20px; }\r\n.bsg-pane { animation: bsgFade .25s ease; }\r\n@keyframes bsgFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\r\n\r\n.bsg-card {\r\n  background: var(--bsg-card);\r\n  border: 1px solid var(--bsg-line);\r\n  border-radius: var(--bsg-radius);\r\n  box-shadow: var(--bsg-shadow);\r\n  padding: 26px 28px;\r\n}\r\n.bsg-card h2 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }\r\n.bsg-card .bsg-hint { color: var(--bsg-muted); font-size: 13px; margin-top: 4px; }\r\n.bsg-card + .bsg-card { margin-top: 18px; }\r\n\r\n/* ---------- Forms ---------- */\r\n.bsg-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; margin-top: 20px; }\r\n.bsg-field { display: flex; flex-direction: column; gap: 6px; }\r\n.bsg-field.wide { grid-column: 1 / -1; }\r\n.bsg-field label, .bsg-subgroup > label { font-size: 12px; font-weight: 700; color: #334155; letter-spacing: .2px; text-transform: uppercase; }\r\n.bsg-field .bsg-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }\r\n.bsg-input, .bsg-select {\r\n  font-family: var(--bsg-font);\r\n  font-size: 14px;\r\n  color: var(--bsg-ink);\r\n  background: #fbfcfe;\r\n  border: 1.5px solid var(--bsg-line);\r\n  border-radius: 10px;\r\n  padding: 10px 13px;\r\n  width: 100%;\r\n  outline: none;\r\n  transition: border-color .15s, box-shadow .15s;\r\n}\r\n.bsg-input:focus, .bsg-select:focus {\r\n  border-color: var(--bsg-accent);\r\n  box-shadow: 0 0 0 3px rgba(79, 70, 229, .14);\r\n  background: #fff;\r\n}\r\n.bsg-input::placeholder { color: #a3afc2; }\r\ntextarea.bsg-input { resize: vertical; min-height: 70px; }\r\n\r\n.bsg-subgroup { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--bsg-line); }\r\n.bsg-subgroup > label { display: block; margin-bottom: 10px; }\r\n\r\n/* chips */\r\n.bsg-chips { display: flex; flex-wrap: wrap; gap: 8px; }\r\n.bsg-chip {\r\n  border: 1.5px solid var(--bsg-line);\r\n  background: #fbfcfe;\r\n  border-radius: 999px;\r\n  padding: 7px 15px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  color: #475569;\r\n  cursor: pointer;\r\n  font-family: var(--bsg-font);\r\n  transition: all .15s ease;\r\n}\r\n.bsg-chip:hover { border-color: #c7cff0; color: var(--bsg-accent); }\r\n.bsg-chip.active {\r\n  background: linear-gradient(135deg, rgba(99, 102, 241, .12), rgba(124, 58, 237, .12));\r\n  border-color: var(--bsg-accent);\r\n  color: var(--bsg-accent);\r\n}\r\n\r\n/* colo       var thumb = event.target.closest ? event.target.closest('.docs-shots-thumb') : null;
      if (!thumb) return;
      showShot(Number(thumb.getAttribute('data-shot-index')) || 0);
    });
  }
  if (shotsPrev) shotsPrev.addEventListener('click', function () { showShot(currentShotIndex - 1); });
  if (shotsNext) shotsNext.addEventListener('click', function () { showShot(currentShotIndex + 1); });
  document.addEventListener('keydown', function (event) {
    if (!shotsView.classList.contains('visible')) return;
    if (event.key === 'ArrowLeft') showShot(currentShotIndex - 1);
    if (event.key === 'ArrowRight') showShot(currentShotIndex + 1);
    if (event.key === 'Escape') { shotsView.classList.remove('visible'); frame.style.display = ''; if (openButton) openButton.style.display = ''; }
  });

  function activateItem(activeItem) {
    navItems.forEach(function (item) { item.classList.toggle('active', item === activeItem); });
  }

  function showCodePane(kind) {
    var entry = codePayload[kind];
    currentCodeKind = kind;
    codeView.classList.add('visible');
    shotsView.classList.remove('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    if (!entry) {
      codeTitle.textContent = kind.toUpperCase() + ' code';
      codeMeta.textContent = 'no ' + kind + ' file in the app folder';
      codeElement.textContent = '';
      return;
    }
    codeTitle.textContent = entry.name;
    var lineCount = entry.content ? entry.content.split('\n').length : 0;
    codeMeta.textContent = lineCount + ' lines - ' + (entry.content ? entry.content.length : 0) + ' characters';
    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {
      showCodePane(item.getAttribute('data-doc').slice(5));
    } else {
      showDocumentPane(item);
    }
    try { window.location.hash = 'doc=' + item.getAttribute('data-doc'); } catch (error) { /* ignore */ }
  }

  navItems.forEach(function (item) {
    item.addEventListener('click', function () { openItem(item); });
  });

  if (openButton) {
    openButton.addEventListener('click', function () {
      var fullUrl = new URL(currentSource, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  if (codeCopyButton) {
    codeCopyButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      var text = entry && entry.content ? entry.content : '';
      if (!text) return;
      function markCopied() {
        codeCopyButton.textContent = 'Copied ✓';
        codeCopyButton.classList.add('copied');
        setTimeout(function () {
          codeCopyButton.textContent = 'Copy code';
          codeCopyButton.classList.remove('copied');
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function () { fallbackCopy(text, markCopied); });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
</body>
</html>
