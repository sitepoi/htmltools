<title>AI Legal Formatted Document Builder - Docs Index</title>
<!--
  DOCS INDEX TEMPLATE - _docs/templates/_index-template.html
  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), and the test harness
  into a full-page pane - open ONLY this file to review everything about the
  tool. Self-contained (no shared assets) so it works anywhere. Created by
  scripts/init-docs.js as docs/index.html for every tool; the test-harness
  menu item appears only when the tool has app/test-harness.html. The code
  panes are embedded between the CODE-PAYLOAD markers and refreshed with
  `node scripts/refresh-docs-index.js <Tool>` after code changes.
  URL shortcut: index.html?doc=help (or ?doc=code-js) opens directly.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #1f2937; }
  .docs-shell { display: flex; height: 100vh; height: 100dvh; }
  .docs-menu {
    width: 236px; flex: 0 0 236px;
    background: #0f172a; color: #cbd5e1;
    display: flex; flex-direction: column;
    border-right: 1px solid #1e293b;
  }
  .docs-brand { padding: 18px 16px 14px; border-bottom: 1px solid #1e293b; }
  .docs-brand-name { font-weight: 800; color: #f8fafc; font-size: 0.95rem; line-height: 1.3; }
  .docs-brand-sub { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .docs-nav { flex: 1; overflow-y: auto; padding: 10px 10px; }
  .docs-nav-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    color: #cbd5e1; padding: 9px 12px; margin-bottom: 2px;
    border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 0.86rem; font-weight: 600;
  }
  .docs-nav-item:hover { background: #1e293b; color: #f1f5f9; }
  .docs-nav-item.active { background: #4f46e5; color: #ffffff; }
  .docs-nav-item .docs-nav-sub { display: block; font-size: 0.7rem; font-weight: 500; color: #64748b; margin-top: 1px; }
  .docs-nav-item.active .docs-nav-sub { color: #c7d2fe; }
  .docs-nav-item.docs-nav-code { color: #fbbf24; }
  .docs-nav-item.docs-nav-code:hover { background: #1e293b; color: #fcd34d; }
  .docs-nav-item.docs-nav-code.active { background: #b45309; color: #fffbeb; }
  .docs-nav-item.docs-nav-code.active .docs-nav-sub { color: #fde68a; }
  .docs-nav-item.docs-nav-harness { color: #86efac; }
  .docs-nav-item.docs-nav-harness:hover { background: #1e293b; color: #bbf7d0; }
  .docs-nav-sep { border: 0; border-top: 1px solid #1e293b; margin: 10px 4px; }
  .docs-nav-group-label { font-size: 0.66rem; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; padding: 8px 12px 2px; }
  .docs-menu-footer {
    padding: 12px 16px; border-top: 1px solid #1e293b;
    font-size: 0.72rem; color: #64748b;
  }
  .docs-stage { flex: 1; min-width: 0; background: #e2e8f0; position: relative; }
  .docs-frame {
    width: 100%; height: 100%; border: 0;
    display: block; background: #ffffff;
  }
  .docs-open {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: #0f172a; color: #e2e8f0; border: 0; border-radius: 8px;
    padding: 7px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    font-family: inherit; opacity: 0.9;
  }
  .docs-open:hover { opacity: 1; }
  /* code viewer pane */
  .docs-code-view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-code-view.visible { display: flex; }
  .docs-code-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #111c30; border-bottom: 1px solid #1e293b;
    flex-wrap: wrap;
  }
  .docs-code-title { color: #fbbf24; font-weight: 800; font-size: 0.9rem; font-family: ui-monospace, Consolas, monospace; }
  .docs-code-meta { color: #64748b; font-size: 0.75rem; margin-right: auto; }
  .docs-code-btn {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
    padding: 6px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .docs-code-btn:hover { background: #334155; }
  .docs-code-btn.copied { background: #14532d; border-color: #16a34a; color: #bbf7d0; }
  .docs-code-pre { flex: 1; overflow: auto; margin: 0; padding: 16px 18px; }
  .docs-code-code {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; color: #dbeafe;
    white-space: pre; tab-size: 4;
  }
  .docs-code-empty { color: #64748b; padding: 40px; text-align: center; font-size: 0.9rem; }
  /* screenshots viewer pane */
  .docs-nav-item.docs-nav-shots { color: #93c5fd; }
  .docs-nav-item.docs-nav-shots:hover { background: #1e293b; color: #bfdbfe; }
  .docs-nav-item.docs-nav-shots.active { background: #1d4ed8; color: #eff6ff; }
  .docs-nav-item.docs-nav-shots.active .docs-nav-sub { color: #bfdbfe; }
  .docs-shots-view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-shots-view.visible { display: flex; }
  .docs-shots-viewer {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 72px;
  }
  .docs-shots-img {
    max-width: 100%; max-height: 100%;
    border-radius: 10px; border: 1px solid #1e293b;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5); background: #1e293b;
  }
  .docs-shots-empty { color: #64748b; text-align: center; font-size: 0.9rem; line-height: 1.7; }
  .docs-shots-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    font-size: 1.05rem; font-family: inherit;
  }
  .docs-shots-arrow:hover { background: #334155; }
  .docs-shots-arrow.prev { left: 14px; }
  .docs-shots-arrow.next { right: 14px; }
  .docs-shots-info {
    border-top: 1px solid #1e293b; background: #111c30;
    padding: 12px 18px;
  }
  .docs-shots-counter { color: #93c5fd; font-weight: 800; font-size: 0.8rem; margin: 0 0 8px; }
  .docs-shots-info dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 22px; margin: 0; }
  .docs-shots-info dt { color: #64748b; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .docs-shots-info dd { color: #e2e8f0; font-size: 0.8rem; margin: 2px 0 0; overflow-wrap: anywhere; }
  .docs-shots-thumbs {
    border-top: 1px solid #1e293b; padding: 10px 14px;
    display: flex; gap: 10px; overflow-x: auto;
  }
  .docs-shots-thumb {
    flex: 0 0 auto; width: 150px; padding: 0;
    border: 2px solid #1e293b; border-radius: 8px; overflow: hidden;
    cursor: pointer; background: #0f172a; font-family: inherit;
  }
  .docs-shots-thumb.active { border-color: #60a5fa; }
  .docs-shots-thumb img { width: 100%; height: 84px; object-fit: cover; object-position: top; display: block; }
  .docs-shots-thumb span { display: block; padding: 5px 7px; font-size: 0.66rem; color: #94a3b8; text-align: left; }
  .docs-shots-thumb.active span { color: #bfdbfe; }
  @media (max-width: 860px) {
    .docs-shots-viewer { padding: 14px 46px; }
    .docs-shots-arrow.prev { left: 4px; }
    .docs-shots-arrow.next { right: 4px; }
  }
  @media (max-width: 860px) {
    .docs-shell { flex-direction: column; }
    .docs-menu { width: 100%; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid #1e293b; }
    .docs-nav { display: flex; overflow-x: auto; padding: 6px; }
    .docs-nav-item { white-space: nowrap; margin: 0 2px; }
    .docs-brand { display: none; }
    .docs-menu-footer { display: none; }
  }
</style>
</head>

<div class="docs-shell">

    </div>
  </main>

</div>

ument Panel (full height; Components & Settings open as drawers) -->\r\n    <main class=\"content-panel\" id=\"content-panel\">\r\n      <div class=\"content-editors\">\r\n        <!-- Document preview (always visible, full height) -->\r\n        <div class=\"content-editor\" id=\"editor-document\">\r\n          <div class=\"preview-toolbar\">\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-toggle-edit\" title=\"Edit the document text directly\">✏️ Edit<\/button>\r\n            <span class=\"edit-format-bar\" id=\"edit-format-bar\" style=\"display:none\">\r\n              <button class=\"efb-btn\" data-fmt-op=\"bold\" title=\"Bold\"><b>B<\/b><\/button>\r\n              <button class=\"efb-btn\" data-fmt-op=\"italic\" title=\"Italic\"><i>I<\/i><\/button>\r\n              <button class=\"efb-btn\" data-fmt-op=\"underline\" title=\"Underline\"><u>U<\/u><\/button>\r\n              <button class=\"efb-btn\" data-fmt-op=\"strikeThrough\" title=\"Strikethrough\"><s>S<\/s><\/button>\r\n              <label class=\"efb-color\" title=\"Text color\">🎨<input type=\"color\" id=\"edit-color\" value=\"#111111\"><\/label>\r\n              <label class=\"efb-color\" title=\"Highlight\">🖍️<input type=\"color\" id=\"edit-highlight\" value=\"#fef08a\"><\/label>\r\n              <button class=\"btn btn-sm btn-outline\" id=\"btn-edit-cancel\" title=\"Discard edits\">✕ Discard<\/button>\r\n            <\/span>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-undo\" title=\"Undo (Ctrl+Z)\">↶<\/button>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-redo\" title=\"Redo (Ctrl+Y)\">↷<\/button>\r\n            <span class=\"tb-sep\"><\/span>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-open-nav\" title=\"Document navigation — jump to sections\">📑 Nav<\/button>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-zoom-minus\" title=\"Zoom out\">🔍−<\/button>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-zoom-plus\" title=\"Zoom in\">🔍＋100%<\/button>\r\n            <span class=\"tb-sep\"><\/span>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-open-variables\" title=\"Dynamic document variables ({{name}} fields)\">🔤 Variables<\/button>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-open-outline\" title=\"Document outline — reorder, duplicate, delete blocks\">🧭 Outline<\/button>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-open-components\" title=\"Open the legal component library\">🧩 Components<\/button>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-open-settings\" title=\"Open settings &amp; export\">⚙️ Settings &amp; Export<\/button>\r\n            <span class=\"doc-type-chip\" id=\"doc-type-chip\" style=\"display:none\"><\/span>\r\n            <span class=\"ph-chip\" id=\"placeholder-chip\" style=\"display:none\"><\/span>\r\n            <span class=\"staged-chip\" id=\"staged-chip\" style=\"display:none\"><\/span>\r\n            <span class=\"status-chip\" id=\"status-chip\" style=\"display:none\"><\/span>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-focus-mode\" title=\"Collapse the chat for a full-width document view\">⛶ Focus<\/button>\r\n            <span class=\"sel-hint\" id=\"sel-target-info\">🎯 Select text inside the document to target it for the next AI edit<\/span>\r\n            <span class=\"ro-banner\" id=\"ro-banner\" style=\"display:none\">🔒 Read-only mode — ask an editor to make changes<\/span>\r\n            <button class=\"btn btn-sm btn-ghost\" id=\"btn-refresh-preview\" title=\"Refresh preview\">↻<\/button>\r\n          <\/div>\r\n          <div class=\"doc-stage\" id=\"doc-stage\">\r\n            <iframe id=\"doc-preview\" class=\"doc-preview\" sandbox=\"allow-scripts allow-forms allow-downloads allow-popups\" title=\"Document preview\"><\/iframe>\r\n          <\/div>\r\n          <div class=\"preview-empty\" id=\"preview-empty\">\r\n            <div class=\"empty-icon\">📄<\/div>\r\n            <p>Your document will appear here<\/p>\r\n            <p class=\"empty-sub\">Describe the document in the chat — e.g. “Draft a service agreement between two companies”.<\/p>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <!-- Navigation panel (sections — click to jump) -->\r\n        <div class=\"nav-panel\" id=\"nav-panel\">\r\n          <div class=\"nav-panel-header\">\r\n            <span>📑 Navigate<\/span>\r\n            <button class=\"btn btn-ghost btn-xs\" id=\"btn-close-nav\" title=\"Close navigation\">✕<\/button>\r\n          <\/div>\r\n          <div id=\"nav-list\" class=\"nav-list\"><\/div>\r\n        <\/div>\r\n\r\n        <!-- Side drawer: Component library -->\r\n        <div class=\"side-drawer\" id=\"drawer-components\">\r\n          <div class=\"drawer-header\">\r\n            <h2>🧩 Component Library<\/h2>\r\n            <button class=\"btn btn-ghost btn-sm\" id=\"btn-close-components\" title=\"Close\">✕<\/button>\r\n          <\/div>\r\n          <div class=\"drawer-body\">\r\n            <div class=\"comp-panel\">\r\n              <p class=\"drawer-hint\">Ready-made blocks for legal documents (agreement clauses, signature pages, schedules, notices…). Click <b>➕ Add<\/b> to ask the AI to insert one — or mention any component by name in the chat.<\/p>\r\n              <input id=\"comp-search\" class=\"comp-search\" placeholder=\"🔍 Filter components… (e.g. signature, confidentiality, payment)\">\r\n              <div id=\"components-list\" class=\"components-list\"><\/div>\r\n            <\/div>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <!-- Side drawer: Settings & export -->\r\n        <div class=\"side-drawer\" id=\"drawer-settings\">\r\n          <div class=\"drawer-header\">\r\n            <h2>⚙️ Settings &amp; Export<\/h2>\r\n            <button class=\"btn btn-ghost btn-sm\" id=\"btn-close-settings\" title=\"Close\">✕<\/button>\r\n          <\/div>\r\n          <div class=\"drawer-body\">\r\n            <div class=\"settings-panel\">\r\n              <p class=\"drawer-hint\">One document per tool. Everything — including every component's HTML/CSS/JS — is embedded in the exports, so the files work standalone.<\/p>\r\n              <div class=\"settings-section\">\r\n                <h3>📄 Document<\/h3>\r\n                <div id=\"doc-stats\" class=\"doc-stats\">—<\/div>\r\n                <div class=\"settings-row\">\r\n                  <button class=\"btn btn-outline\" id=\"btn-reset-doc\" title=\"Remove all blocks and start over\">🗑 Reset document<\/button>\r\n                  <button class=\"btn btn-outline\" id=\"btn-copy-blocks\" title=\"Copy the blocks JSON (for diagnostics)\">📋 Copy Blocks JSON<\/button>\r\n                <\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📦 Export<\/h3>\r\n                <div class=\"export-row\">\r\n                  <button class=\"btn btn-primary\" id=\"btn-export-html2\">📥 Download .html<\/button>\r\n                  <button class=\"btn btn-primary\" id=\"btn-export-docx2\">📄 Download .docx<\/button>\r\n                  <button class=\"btn btn-primary\" id=\"btn-export-pdf2\">🖨️ Export PDF<\/button>\r\n                <\/div>\r\n                <div class=\"export-row\">\r\n                  <button class=\"btn btn-outline\" id=\"btn-export-md\">📝 Download .md<\/button>\r\n                  <button class=\"btn btn-outline\" id=\"btn-export-chat\">💬 Export chat transcript<\/button>\r\n                <\/div>\r\n                <p class=\"gen-hint\">The exported HTML is one complete standalone file (all styles and scripts embedded, printable A4). The DOCX converts the document into a real Word file. The PDF is generated through the CMS export service.<\/p>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🔌 Parameters &amp; Data<\/h3>\r\n                <div class=\"params-summary\" id=\"params-summary\">Loading…<\/div>\r\n                <p class=\"gen-hint\">Formatting defaults are configured as tool parameters in the field settings. Chat history is stored in the CMS <b>ai-chat-sessions-uniconbaseapps<\/b> object type.<\/p>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🧩 Gap Analysis<\/h3>\r\n                <div id=\"gap-list\"><\/div>\r\n                <button class=\"btn btn-outline\" id=\"btn-gap-fix\" title=\"Ask the AI to add the missing essential clauses\">➕ Add missing clauses<\/button>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📏 Type Rules<\/h3>\r\n                <div id=\"rules-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🟢 Status<\/h3>\r\n                <div class=\"settings-row\">\r\n                  <select id=\"doc-status\">\r\n                    <option value=\"draft\">📝 Draft<\/option>\r\n                    <option value=\"in-review\">🔍 In Review<\/option>\r\n                    <option value=\"approved\">✅ Approved<\/option>\r\n                  <\/select>\r\n                <\/div>\r\n                <div id=\"status-log\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🔎 Find &amp; Replace<\/h3>\r\n                <div class=\"settings-row\">\r\n                  <input type=\"text\" id=\"find-input\" class=\"var-value\" placeholder=\"Find…\">\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <input type=\"text\" id=\"replace-input\" class=\"var-value\" placeholder=\"Replace with…\">\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <button class=\"btn btn-outline btn-sm\" id=\"btn-find\">🔎 Find<\/button>\r\n                  <button class=\"btn btn-outline btn-sm\" id=\"btn-replace-all\">🔁 Replace all<\/button>\r\n                <\/div>\r\n                <div id=\"find-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🌍 Translate<\/h3>\r\n                <div class=\"settings-row\">\r\n                  <select id=\"translate-lang\">\r\n                    <option value=\"English\">English<\/option>\r\n                    <option value=\"Turkish\">Turkish<\/option>\r\n                    <option value=\"German\">German<\/option>\r\n                    <option value=\"French\">French<\/option>\r\n                    <option value=\"Spanish\">Spanish<\/option>\r\n                    <option value=\"Arabic\">Arabic<\/option>\r\n                    <option value=\"Dutch\">Dutch<\/option>\r\n                  <\/select>\r\n                  <button class=\"btn btn-outline\" id=\"btn-translate\">🌍 Translate whole document<\/button>\r\n                <\/div>\r\n                <p class=\"gen-hint\">Keeps block structure, numbering and formatting intact.<\/p>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🚨 Risk Review<\/h3>\r\n                <p class=\"gen-hint\">The AI reviews the document from each party’s perspective and flags one-sided or risky clauses with suggested rewrites.<\/p>\r\n                <button class=\"btn btn-outline\" id=\"btn-risk-review\">🚨 Review risks<\/button>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📑 Defined Terms<\/h3>\r\n                <div id=\"terms-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📌 My Clauses<\/h3>\r\n                <div id=\"snippet-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📇 Party Contact Book<\/h3>\r\n                <div id=\"contacts-list\"><\/div>\r\n                <button class=\"btn btn-outline\" id=\"btn-contacts-save\">💾 Save parties from document<\/button>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📧 Send for Signature<\/h3>\r\n                <div class=\"settings-row\">\r\n                  <input type=\"text\" id=\"email-to\" class=\"var-value\" placeholder=\"recipient@example.com\">\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <input type=\"text\" id=\"email-subject\" class=\"var-value\" placeholder=\"Subject (optional)\">\r\n                <\/div>\r\n                <button class=\"btn btn-outline\" id=\"btn-send-email\">📧 Email the document<\/button>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🕘 Version History<\/h3>\r\n                <div id=\"history-list\"><\/div>\r\n                <div id=\"diff-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>♿ Accessibility<\/h3>\r\n                <div id=\"a11y-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>⌨ Prompt Macros<\/h3>\r\n                <p class=\"gen-hint\">Type these in the chat (e.g. /plain) or click a chip above the input. Add context after the command to refine it.<\/p>\r\n                <div id=\"macro-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🖨️ Page &amp; Export Options<\/h3>\r\n                <div class=\"settings-row\">\r\n                  <label class=\"settings-label\" for=\"page-size-select\">Page size<\/label>\r\n                  <select id=\"page-size-select\">\r\n                    <option value=\"A4\">A4 (210 × 297 mm)<\/option>\r\n                    <option value=\"Letter\">US Letter (216 × 279 mm)<\/option>\r\n                  <\/select>\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <label class=\"settings-label\" for=\"page-numbers-check\">Show page numbers<\/label>\r\n                  <input type=\"checkbox\" id=\"page-numbers-check\" checked>\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <label class=\"settings-label\" for=\"watermark-select\">Watermark<\/label>\r\n                  <select id=\"watermark-select\">\r\n                    <option value=\"\">None<\/option>\r\n                    <option value=\"DRAFT\">DRAFT<\/option>\r\n                    <option value=\"CONFIDENTIAL\">CONFIDENTIAL<\/option>\r\n                    <option value=\"FOR REVIEW\">FOR REVIEW<\/option>\r\n                    <option value=\"SAMPLE\">SAMPLE<\/option>\r\n                  <\/select>\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <label class=\"settings-label\" for=\"docx-margins\">DOCX margins<\/label>\r\n                  <select id=\"docx-margins\">\r\n                    <option value=\"normal\">Normal (1 in)<\/option>\r\n                    <option value=\"moderate\">Moderate (0.75 in)<\/option>\r\n                    <option value=\"narrow\">Narrow (0.5 in)<\/option>\r\n                    <option value=\"wide\">Wide (1.25 in)<\/option>\r\n                  <\/select>\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <label class=\"settings-label\" for=\"docx-cover\">Add cover page to DOCX<\/label>\r\n                  <input type=\"checkbox\" id=\"docx-cover\">\r\n                <\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🛠️ Document Tools<\/h3>\r\n                <div class=\"settings-row\">\r\n                  <button class=\"btn btn-outline\" id=\"btn-renumber\" title=\"Renumber all numbered sections 1..N\">🔢 Renumber sections<\/button>\r\n                  <button class=\"btn btn-outline\" id=\"btn-add-cover\" title=\"Add a title cover block on top\">📕 Add cover page<\/button>\r\n                <\/div>\r\n                <div class=\"settings-row\">\r\n                  <button class=\"btn btn-outline\" id=\"btn-sync-cms\" title=\"Push blocks back into the parent CMS record\">⬆ Sync to CMS record<\/button>\r\n                <\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📥 Import<\/h3>\r\n                <p class=\"gen-hint\">Paste blocks JSON (the format copied with “Copy Blocks JSON”), plain text / Markdown, or upload a .docx / .pdf / .txt / .md file and let the AI convert it.<\/p>\r\n                <textarea id=\"import-area\" class=\"import-area\" placeholder='[{\"type\":\"h\",\"data\":\"Section 1\"}, …] or plain text'><\/textarea>\r\n                <div class=\"settings-row\">\r\n                  <button class=\"btn btn-outline\" id=\"btn-import\">📥 Import into document<\/button>\r\n                  <button class=\"btn btn-outline\" id=\"btn-import-file\">📤 Upload file…<\/button>\r\n                <\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>🧪 Quality Lint<\/h3>\r\n                <div id=\"lint-list\"><\/div>\r\n                <button class=\"btn btn-outline\" id=\"btn-lint-fix\" title=\"Ask the AI to fix the issues found\">🔧 Fix with AI<\/button>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>📖 Readability<\/h3>\r\n                <div id=\"readability-list\"><\/div>\r\n              <\/div>\r\n              <div class=\"settings-section\">\r\n                <h3>💾 CMS Storage<\/h3>\r\n                <div class=\"size-meter-track\"><div class=\"size-meter-fill\" id=\"size-meter-fill\"><\/div><\/div>\r\n                <div class=\"size-meter-label\" id=\"size-meter-label\">—<\/div>\r\n              <\/div>\r\n            <\/div>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <!-- Side drawer: Document variables -->\r\n        <div class=\"side-drawer\" id=\"drawer-variables\">\r\n          <div class=\"drawer-header\">\r\n            <h2>🔤 Document Variables<\/h2>\r\n            <button class=\"btn btn-ghost btn-sm\" id=\"btn-close-variables\" title=\"Close\">✕<\/button>\r\n          <\/div>\r\n          <div class=\"drawer-body\">\r\n            <div class=\"comp-panel\">\r\n              <p class=\"drawer-hint\">Fill-once fields used anywhere in the document as <b>{{variableName}}<\/b>. Change a value here — or click a highlighted field inside the document — and every occurrence updates instantly.<\/p>\r\n              <div id=\"var-list\" class=\"var-list\"><\/div>\r\n              <div class=\"settings-row\">\r\n                <button class=\"btn btn-outline btn-sm\" id=\"btn-var-add\">➕ Add variable<\/button>\r\n                <button class=\"btn btn-outline btn-sm\" id=\"btn-var-scan\">🔍 Scan document<\/button>\r\n              <\/div>\r\n            <\/div>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <!-- Side drawer: Document outline -->\r\n        <div class=\"side-drawer\" id=\"drawer-outline\">\r\n          <div class=\"drawer-header\">\r\n            <h2>🧭 Document Outline<\/h2>\r\n            <button class=\"btn btn-ghost btn-sm\" id=\"btn-close-outline\" title=\"Close\">✕<\/button>\r\n          <\/div>\r\n          <div class=\"drawer-body\">\r\n            <p class=\"drawer-hint\">Drag ⠿ to reorder blocks. Use ✏️ to target, ⧉ to duplicate, � to save a clause, 💬 to comment, 🗑 to delete.<\/p>\r\n            <div id=\"outline-list\" class=\"outline-list\"><\/div>\r\n            <div class=\"outline-comments\" id=\"outline-comments\">\r\n              <p class=\"drawer-hint\"><b>💬 Comments:<\/b> <span id=\"comment-target-label\">click 💬 on a block<\/span><\/p>\r\n              <div id=\"comment-list\"><\/div>\r\n              <div class=\"settings-row\">\r\n                <input type=\"text\" id=\"comment-input\" class=\"var-value\" placeholder=\"Add a comment…\">\r\n                <button class=\"btn btn-outline btn-sm\" id=\"btn-comment-add\">💬 Add<\/button>\r\n              <\/div>\r\n            <\/div>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/main>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"AILegalFormattedDocumentBuilder.css","src":"../app/AILegalFormattedDocumentBuilder.css","content":"/* ── Legal Document Builder — app shell styles ── */\r\n:root {\r\n  --primary: #4f46e5;\r\n  --primary-dark: #3730a3;\r\n  --primary-light: #818cf8;\r\n  --primary-bg: #eef2ff;\r\n  --success: #059669;\r\n  --success-bg: #ecfdf5;\r\n  --warning: #d97706;\r\n  --warning-bg: #fef3c7;\r\n  --danger: #dc2626;\r\n  --danger-bg: #fee2e2;\r\n  --border: #e2e8f0;\r\n  --text: #1e293b;\r\n  --text-muted: #64748b;\r\n  --text3: #94a3b8;\r\n  --bg: #f6f7fb;\r\n  --surface: #ffffff;\r\n  --radius: 10px;\r\n  --radius-lg: 14px;\r\n  --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);\r\n  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);\r\n  --serif: Georgia, 'Times New Roman', serif;\r\n}\r\n\r\n* { box-sizing: border-box; }\r\nhtml, body { margin: 0; padding: 0; }\r\nbody {\r\n  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;\r\n  font-size: 14px;\r\n  color: var(--text);\r\n  background: var(--bg);\r\n  -webkit-font-smoothing: antialiased;\r\n}\r\n#app { display: flex; flex-direction: column; height: 100vh; min-height: 520px; overflow: hidden; }\r\n\r\n/* ── Buttons ── */\r\n.btn {\r\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\r\n  border: 1px solid transparent; border-radius: 8px; cursor: pointer;\r\n  font-family: inherit; font-size: 13px; font-weight: 600;\r\n  padding: 8px 14px; line-height: 1.2; transition: all 0.15s ease;\r\n  background: #fff; color: var(--text); white-space: nowrap;\r\n}\r\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\r\n.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }\r\n.btn-xs { padding: 2px 7px; font-size: 11px; border-radius: 6px; }\r\n.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }\r\n.btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }\r\n.btn-outline { background: #fff; color: var(--text); border-color: var(--border); }\r\n.btn-outline:hover:not(:disabled) { border-color: var(--primary-light); color: var(--primary); background: var(--primary-bg); }\r\n.btn-ghost { background: transparent; color: var(--text-muted); }\r\n.btn-ghost:hover:not(:disabled) { background: #f1f5f9; color: var(--text); }\r\n.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }\r\n.btn-danger:hover:not(:disabled) { background: #b91c1c; }\r\n\r\n/* ── Header ── */\r\n.app-header {\r\n  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\r\n  padding: 8px 16px; background: var(--surface);\r\n  border-bottom: 1px solid var(--border); z-index: 20;\r\n}\r\n.app-logo {\r\n  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;\r\n  background: linear-gradient(135deg, #312e81, #4f46e5);\r\n  display: flex; align-items: center; justify-content: center; font-size: 18px;\r\n  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);\r\n}\r\n\r\n.fmt-group { display: flex; align-items: center; gap: 4px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 3px; }\r\n.fmt-select {\r\n  border: none; background: transparent; font-family: inherit; font-size: 12px;\r\n  padding: 4px 6px; border-radius: 6px; outline: none; cursor: pointer; color: var(--text);\r\n}\r\n.fmt-select:hover { background: #eef2ff; }\r\n.fmt-color { width: 26px; height: 26px; border: none; border-radius: 6px; padding: 0; cursor: pointer; background: transparent; }\r\n.fmt-color::-webkit-color-swatch-wrapper { padding: 2px; }\r\n.fmt-color::-webkit-color-swatch { border-radius: 4px; border: 1px solid var(--border); }\r\n\r\n.header-btns { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }\r\n.version-badge {\r\n  background: var(--primary-bg); color: var(--primary-dark); border: 1px solid #c7d2fe;\r\n  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; cursor: default;\r\n}\r\n\r\n/* ── Main layout ── */\r\n.main-layout { flex: 1; display: flex; min-height: 0; }\r\n\r\n/* ── Chat panel ── */\r\n.chat-panel {\r\n  width: 360px; min-width: 280px; max-width: 42vw; flex-shrink: 0;\r\n  display: flex; flex-direction: column;\r\n  background: var(--surface); border-right: 1px solid var(--border);\r\n}\r\n.chat-panel-header {\r\n  display: flex; align-items: center; gap: 8px; padding: 10px 14px;\r\n  border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px;\r\n}\r\n.chat-status-dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }\r\n.chat-status-dot.ok { background: var(--success); }\r\n.chat-status-dot.busy { background: var(--warning); animation: pulseDot 1s ease-in-out infinite; }\r\n.chat-status-dot.error { background: var(--danger); }\r\n@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }\r\n\r\n.chat-target-chip {\r\n  display: flex; align-items: center; gap: 8px; margin: 8px 12px 0; padding: 6px 10px;\r\n  background: var(--warning-bg); border: 1px solid #fcd34d; border-radius: 8px;\r\n  font-size: 11px; color: #92400e; font-weight: 600;\r\n}\r\n.chat-target-chip #chat-target-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.chip-x {\r\n  border: none; background: transparent; cursor: pointer; color: #92400e;\r\n  font-size: 12px; padding: 0 2px; line-height: 1;\r\n}\r\n.chip-x:hover { color: var(--danger); }\r\n\r\n.chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }\r\n\r\n.chat-welcome { text-align: center; padding: 18px 10px; color: var(--text-muted); }\r\n.chat-welcome-icon { font-size: 42px; margin-bottom: 8px; }\r\n.chat-welcome h3 { margin: 0 0 6px; color: var(--text); font-size: 16px; }\r\n.chat-welcome p { margin: 0 auto 12px; font-size: 13px; line-height: 1.6; max-width: 280px; }\r\n.welcome-prompts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; max-width: 300px; margin: 0 auto; }\r\n.welcome-prompts .btn { justify-content: flex-start; text-align: left; font-weight: 500; }\r\n.welcome-tip { font-size: 11px; margin-top: 12px; }\r\n\r\n.chat-msg { display: flex; gap: 8px; align-items: flex-start; }\r\n.chat-msg.user { flex-direction: row-reverse; }\r\n.chat-avatar {\r\n  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;\r\n  display: flex; align-items: center; justify-content: center; font-size: 15px;\r\n}\r\n.chat-msg.ai .chat-avatar { background: var(--primary-bg); }\r\n.chat-msg.user .chat-avatar { background: #e2e8f0; }\r\n.chat-msg > div:last-child { max-width: calc(100% - 42px); }\r\n.chat-bubble {\r\n  padding: 9px 12px; border-radius: 12px; font-size: 13px; line-height: 1.55;\r\n  overflow-wrap: break-word; white-space: pre-wrap;\r\n}\r\n.chat-msg.user .chat-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }\r\n.chat-msg.ai .chat-bubble { background: #f1f5f9; color: var(--text); border-bottom-left-radius: 4px; }\r\n.chat-msg.ai.err .chat-bubble { background: var(--danger-bg); }\r\n.chat-msg-time { font-size: 10px; color: var(--text3); margin-top: 3px; }\r\n.chat-bubble strong { font-weight: 700; }\r\n.chat-version-chip {\r\n  display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 700;\r\n  background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7;\r\n  padding: 1px 8px; border-radius: 10px;\r\n}\r\n\r\n.chat-options { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; align-items: flex-start; }\r\n.chat-option-btn {\r\n  border: 1px solid var(--border); background: #fff; color: var(--primary-dark);\r\n  font-size: 12px; font-weight: 600; padd
