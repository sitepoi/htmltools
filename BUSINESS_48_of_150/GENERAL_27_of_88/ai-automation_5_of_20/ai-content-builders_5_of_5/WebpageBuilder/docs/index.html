-border); border-radius: var(--radius-sm);\r\n  font-family: var(--font); font-size: 12px; background: var(--bg); color: var(--text); outline: none;\r\n  transition: all var(--transition);\r\n}\r\n.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }\r\n.form-textarea { resize: vertical; line-height: 1.5; }\r\n.form-hint { font-size: 10px; color: var(--text3); display: block; margin-top: 3px; }\r\n.sec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; }\r\n.sec-card {\r\n  display: flex; align-items: center; gap: 7px; padding: 7px 10px;\r\n  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);\r\n  cursor: pointer; font-size: 11.5px; font-weight: 600; transition: all var(--transition); user-select: none;\r\n}\r\n.sec-card:hover { border-color: var(--accent); }\r\n.sec-card input { accent-color: var(--accent); }\r\n.config-actions { text-align: center; margin: 6px 0 14px; }\r\n.gen-hint { font-size: 11px; color: var(--text3); margin-top: 8px; }\r\n.gen-status {\r\n  margin: 4px 0 14px; padding: 12px; background: var(--accent-light);\r\n  border: 1px solid var(--accent); border-radius: var(--radius-lg); text-align: center;\r\n}\r\n.gen-status-icon { font-size: 22px; animation: spin 1.2s linear infinite; display: inline-block; }\r\n@keyframes spin { to { transform: rotate(360deg); } }\r\n.gen-status-text { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 4px; }\r\n.export-row { display: flex; gap: 8px; flex-wrap: wrap; }\r\n\r\n/* ── Design-direction parameter summary ── */\r\n.params-summary { display: flex; flex-direction: column; gap: 6px; }\r\n.param-chip {\r\n  display: flex; align-items: baseline; gap: 10px;\r\n  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);\r\n  padding: 6px 10px; font-size: 11.5px;\r\n}\r\n.param-key { color: var(--text2); font-weight: 700; min-width: 140px; flex-shrink: 0; }\r\n.param-val { color: var(--text); font-family: var(--font-mono); font-size: 11px; word-break: break-word; }\r\n\r\n/* ── Modals ── */\r\n.modal-backdrop {\r\n  position: fixed; inset: 0; background: rgba(15, 13, 25, 0.55); z-index: 100;\r\n}\r\n.modal {\r\n  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);\r\n  width: min(680px, 92vw); max-height: 82vh; z-index: 101;\r\n  background: var(--bg2); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);\r\n  display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border);\r\n}\r\n.modal-header {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;\r\n}\r\n.modal-header h3 { font-size: 14px; font-weight: 700; }\r\n.modal-sub { font-size: 10.5px; color: var(--text3); margin: 3px 0 0; max-width: 420px; line-height: 1.4; }\r\n.modal-body { padding: 14px 16px; overflow-y: auto; }\r\n.empty-state { text-align: center; color: var(--text3); font-size: 12px; padding: 30px 10px; }\r\n.rules-loading { text-align: center; color: var(--text3); font-size: 12px; padding: 20px; }\r\n.rules-body pre {\r\n  font-family: var(--font-mono); font-size: 11px; line-height: 1.6; white-space: pre-wrap;\r\n  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);\r\n  padding: 14px; color: var(--text2); word-break: break-word;\r\n}\r\n.history-item {\r\n  display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 7px;\r\n  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);\r\n}\r\n.history-item:hover { border-color: var(--accent); }\r\n.history-ver {\r\n  font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--accent);\r\n  background: var(--accent-light); padding: 3px 8px; border-radius: 8px; flex-shrink: 0;\r\n}\r\n.history-meta { flex: 1; min-width: 0; }\r\n.history-label { font-size: 11.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.history-time { font-size: 9.5px; color: var(--text3); }\r\n.history-actions { display: flex; gap: 4px; flex-shrink: 0; }\r\n/* ── Template modal ── */\r\n.template-modal-body { padding: 14px 16px; overflow-y: auto; }\r\n.template-modal-info { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }\r\n.tmi-icon { font-size: 34px; }\r\n.tmi-meta { flex: 1; min-width: 0; }\r\n.tmi-title { font-size: 14px; font-weight: 700; }\r\n.tmi-desc { font-size: 11.5px; color: var(--text2); }\r\n.template-prompt-area { margin-bottom: 12px; }\r\n.template-prompt-label { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }\r\n.template-prompt-text {\r\n  width: 100%; min-height: 220px; padding: 10px 12px; resize: vertical;\r\n  font-family: var(--font-mono); font-size: 11px; line-height: 1.6;\r\n  border: 1px solid var(--border); border-radius: var(--radius); outline: none;\r\n  background: var(--bg); color: var(--text);\r\n}\r\n.template-prompt-text:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }\r\n.template-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }\r\n\r\n/* ── Compliance panel ── */\r\n#editor-compliance { background: var(--bg); }\r\n.compliance-panel { flex: 1; overflow-y: auto; padding: 16px 22px 32px; }\r\n.compliance-header h2 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }\r\n.compliance-header p { font-size: 11.5px; color: var(--text2); margin-bottom: 10px; max-width: 760px; }\r\n.compliance-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }\r\n.rules-source-note {\r\n  font-size: 10.5px; color: var(--text3); margin-bottom: 12px;\r\n  background: var(--bg2); border: 1px dashed var(--border);\r\n  padding: 6px 10px; border-radius: var(--radius-sm);\r\n}\r\n.compliance-score {\r\n  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg);\r\n  padding: 14px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;\r\n}\r\n.score-ring { flex-shrink: 0; text-align: center; }\r\n.score-ring .score-pct { font-size: 26px; font-weight: 800; font-family: var(--font-mono); line-height: 1; }\r\n.score-ring .score-total { font-size: 10px; color: var(--text3); }\r\n.score-verdict { font-size: 14px; font-weight: 800; }\r\n.score-verdict.pass { color: var(--success); }\r\n.score-verdict.warn { color: var(--warning); }\r\n.score-verdict.fail { color: var(--danger); }\r\n.score-counts { display: flex; gap: 12px; font-size: 11px; color: var(--text2); font-weight: 600; flex-wrap: wrap; }\r\n.score-counts b { font-family: var(--font-mono); }\r\n.score-time { font-size: 10px; color: var(--text3); }\r\n.compliance-list { display: flex; flex-direction: column; gap: 6px; }\r\n.compliance-item {\r\n  display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px;\r\n  background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--text3);\r\n  border-radius: var(--radius-sm);\r\n}\r\n.compliance-item.pass { border-left-color: var(--success); }\r\n.compliance-item.warn { border-left-color: var(--warning); }\r\n.compliance-item.fail { border-left-color: var(--danger); }\r\n.compliance-item-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }\r\n.compliance-item-body { flex: 1; min-width: 0; }\r\n.compliance-item-label { font-size: 12px; font-weight: 700; color: var(--text); }\r\n.compliance-item-detail { font-size: 11px; color: var(--text2); line-height: 1.45; word-break: break-word; }\r\n.compliance-item-section {\r\n  font-size: 9px; font-weight: 700; color: var(--text3); font-family: var(--font-mono);\r\n  background: var(--bg3); padding: 1px 6px; border-radius: 8px; margin-left: 6px; white-space: nowrap;\r\n}\r\n.ai-review-wrap { margin-top: 16px; }\r\n.ai-review-status {\r\n  font-size: 11px; font-weight: 700; color: var(--accent);\r\n  margin-bottom: 8px; min-height: 16px;\r\n}\r\n.ai-review-output {\r\n  background: #0d1117; color: #c9d1d9; border-radius: var(--radius-lg);\r\n  padding: 14px 16px; font-family: var(--font-mono); font-size: 11px; line-height: 1.6;\r\n  white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow-y: auto;\r\n}\r\n.chat-compliance-chip {\r\n  display: inline-block; margin: 6px 6px 0 0; font-size: 10px; font-weight: 700;\r\n  color: var(--accent); background: var(--accent-light);\r\n  padding: 2px 8px; border-radius: 10px; cursor: pointer; border: 1px solid var(--border);\r\n}\r\n.chat-compliance-chip:hover { background: var(--accent); color: var(--accent-text); }\r\n\r\n/* ── Thinking bubble (progress indicator with expandable stream body) ── */\r\n.think-bubble { display:flex; flex-direction:column; gap:4px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-lg); padding:10px 14px; max-width:85%; }\r\n.think-header { display:flex; align-items:center; gap:8px; cursor:pointer; }\r\n.think-icon { font-size:13px; }\r\n.chat-thinking-dots { display:inline-flex; gap:3px; }\r\n.chat-thinking-dots span { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:thinkJump 1s ease-in-out infinite; }\r\n.chat-thinking-dots span:nth-child(2) { animation-delay:0.15s; }\r\n.chat-thinking-dots span:nth-child(3) { animation-delay:0.3s; }\r\n.think-label { font-size:11.5px; font-weight:600; color:var(--text2); }\r\n.think-time { font-size:10px; color:var(--text3); font-family:var(--font-mono); }\r\n.think-toggle { font-size:10px; color:var(--text3); margin-left:auto; }\r\n.think-cancel { background:none; border:none; color:var(--danger); font-size:10.5px; font-weight:700; cursor:pointer; padding:2px 6px; border-radius:var(--radius-sm); }\r\n.think-cancel:hover { background:var(--danger-light); }\r\n.think-body { margin-top:6px; }\r\n.think-stream-label { font-size:10px; color:var(--text3); font-weight:700; }\r\n.think-stream { font-family:var(--font-mono); font-size:10px; line-height:1.5; color:var(--text2); white-space:pre-wrap; word-break:break-word; max-height:140px; overflow-y:auto; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 8px; }\r\n\r\n/* ── Live tabbed streaming viewer (💬 / HTML / CSS / JS) ── */\r\n.chat-stream-tabs { margin-top:6px; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; background:var(--bg); }\r\n.stream-tab-header { display:flex; gap:2px; padding:3px; background:var(--bg3); border-bottom:1px solid var(--border); }\r\n.stream-tab-btn { border:none; background:transparent; color:var(--text3); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font); }\r\n.stream-tab-btn:hover { color:var(--text); background:var(--bg2); }\r\n.stream-tab-btn.active { background:var(--accent); color:var(--accent-text); }\r\n.stream-tab-panel { display:none; }\r\n.stream-tab-panel.active { display:block; }\r\n.stream-pre { margin:0; padding:8px 10px; font-family:var(--font-mono); font-size:10.5px; line-height:1.5; color:var(--text); white-space:pre-wrap; word-break:break-word; max-height:220px; overflow-y:auto; }\r\n\r\n/* ── Developer visual diff (jsdiff) ── */\r\n.chat-diff-tabs { margin-top:6px; border:1px solid #30363d; border-radius:var(--radius-lg); overflow:hidden; background:#0d1117; }\r\n.chat-diff-tab-header { display:flex; gap:2px; padding:3px; background:#161b22; border-bottom:1px solid #30363d; }\r\n.diff-tab-btn { border:none; background:transparent; color:#8b949e; font-size:10px; font-weight:700; padding:3px 9px; border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font); line-height:1.2; }\r\n.diff-tab-btn:hover { color:#e6edf3; background:#21262d; }\r\n.diff-tab-btn.active { background:#7c3aed; color:#fff; }\r\n.chat-diff-tab-body { display:none; max-height:220px; overflow-y:auto; }\r\n.chat-diff-tab-body.active { display:block; }\r\n.chat-diff-line { font-family:var(--font-mono); font-size:10px; line-height:1.5; padding:0 8px; white-space:pre-wrap; word-break:break-all; }\r\n.diff-same { color:#8b949e; }\r\n.diff-add { color:#7ee787; background:rgba(63,185,80,0.12); }\r\n.diff-remove { color:#ffa198; background:rgba(248,81,73,0.12); }\r\n\r\n/* ── Error chat message ── */\r\n.chat-msg.err .chat-bubble { border-color: var(--danger); background: var(--danger-light); }\r\n\r\n/* ── Rules modal + editor ── */\r\n.modal-header-actions { display: flex; align-items: center; gap: 6px; }\r\n.rules-source-label {\r\n  font-size: 10px; font-weight: 700; color: var(--accent);\r\n  background: var(--accent-light); padding: 2px 8px; border-radius: 10px; margin-left: 8px;\r\n}\r\n.rules-edit-wrap { margin-top: 4px; }\r\n.rules-edit-hint { font-size: 11px; color: var(--text2); margin-bottom: 8px; line-height: 1.5; }\r\n.rules-editor {\r\n  width: 100%; min-height: 360px; padding: 10px 12px; resize: vertical;\r\n  font-family: var(--font-mono); font-size: 10.5px; line-height: 1.55;\r\n  border: 1px solid var(--border); border-radius: var(--radius); outline: none;\r\n  background: var(--bg); color: var(--text);\r\n}\r\n.rules-editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }\r\n.rules-edit-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }\r\n\r\n/* ── Readonly lock ── */\r\nbody.readonly .btn, body.readonly .ctab, body.readonly .chat-tab,\r\nbody.readonly input, body.readonly textarea, body.readonly select,\r\nbody.readonly .sec-card, body.readonly .template-card, body.readonly .dev-btn,\r\nbody.readonly .qa-chip, body.readonly .session-item { pointer-events: none; opacity: 0.65; }\r\nbody.readonly .chat-input, body.readonly .code-textarea { pointer-events: none; opacity: 0.65; }\r\n\r\n/* ── Scrollbars ── */\r\n::-webkit-scrollbar { width: 10px; height: 10px; }\r\n::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }\r\n::-webkit-scrollbar-thumb:hover { background: var(--text3); background-clip: content-box; }\r\n::-webkit-scrollbar-track { background: transparent; }\r\n\r\n/* ── Responsive (narrow iframes) ── */\r\n@media (max-width: 900px) {\r\n  .chat-panel { width: 320px; min-width: 280px; }\r\n  .header-sub { display: none; }\r\n}\r\n@media (max-width: 700px) {\r\n  .main-layout { flex-direction: column; }\r\n  .chat-panel { width: 100%; max-width: none; height: 46%; border-right: none; border-bottom: 1px solid var(--border); }\r\n  .content-panel { height: 54%; }\r\n  .header-right .btn-ghost { padding: 4px 6px; font-size: 10px; }\r\n}\r\n"},"js":{"name":"WebpageBuilder.js","src":"../app/WebpageBuilder.js","content":"/* ── Webpage Builder ──\r\n   AI-first single-page website design studio.\r\n   Chat-left + Studio-right. Chat handles initial design & iterative refinement.\r\n   Preview updates live on every code change. Built for UniconHub CMS HTML-tool system.\r\n────────────────────────────────────────── */\r\n\r\n/* ── Helpers ── */\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction qs(sel) { return document.querySelector(sel); }\r\nfunction qsa(sel) { return document.querySelectorAll(sel); }\r\nfunction esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\r\nfunction debounce(fn, ms) {\r\n  var t = null;\r\n  return function() {\r\n    var args = arguments, self = this;\r\n    if (t) clearTimeout(t);\r\n    t = setTimeout(function() { fn.apply(self, args); }, ms);\r\n  };\r\n}\r\n\r\n/* ── Turkish-safe slugifier (NFKD before transliteration — avoids İ → i- artifacts) ── */\r\nfunction slugify(s) {\r\n  var str = String(s || '').normalize('NFKD').replace(/[\\u0300-\\u036f]/g, '');\r\n  str = str\r\n    .replace(/ş/g, 's').replace(/Ş/g, 's')\r\n    .replace(/ğ/g, 'g').replace(/Ğ/g, 'g')\r\n    .replace(/ü/g, 'u').replace(/Ü/g, 'u')\r\n    .replace(/ö/g, 'o').replace(/Ö/g, 'o')\r\n    .replace(/ç/g, 'c').replace(/Ç/g, 'c')\r\n    .replace(/ı/g, 'i').replace(/İ/g, 'i');\r\n  str = str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');\r\n  return str || 'page';\r\n}\r\n\r\n/* ── State ──\r\n   The SAVED value is slim: only page code + version + session plumbing.\r\n   Version snapshots live as SEPARATE objects (never in this object) so it\r\n   stays far below the 1 MB Firestore document limit. Identity/SEO live on the parent CMS content record;\r\n   design direction comes from ADMIN PARAMETERS (shared across pages);\r\n   chatMessages stay in memory (canonical copy in ai-chat-sessions-uniconbaseapps); history snapshots in webpagebuilder-history-uniconbaseapps. ── */\r\nvar DB = {\r\n  code: { html: '', css: '', js: '' },\r\n  history: [],\r\n  chatMessages: [],   // in-memory — canonical copy in ai-chat-sessions-uniconbaseapps\r\n  chatCache: { sessionId: '', messages: [] }, // bounded fallback kept IN the record value so chat survives even if session storage fails\r\n  seo: null,          // === SEO === JSON from the AI (publicwebsite rules)\r\n  pageMeta: null,     // === PAGE META === JSON from the AI\r\n  configNeeded: '',   // === CMS CONFIG NEEDED === notes for the CMS author\r\n  emailTemplate: '',  // === EMAIL TEMPLATE === artifact (for email hooks)\r\n  activeSessionId: '',\r\n  version: '1.0.0'\r\n};\r\n\r\nvar _theme = 'light';          // builder UI theme (in-memory only)\r\nvar currentDevice = 'desktop'; // preview device (in-memory only)\r\n\r\nvar isReadOnly = false;\r\nvar currentTab = 'preview';\r\nvar _advSubCurrent = '';   // last active Advanced sub-tab (html/css/js/console/settings/compliance)\r\nvar attachedFile = null;        // { name, url, size, type, extractedText }\r\nvar interviewMode = false;      // Guided interview mode\r\nvar _lastPersistedSnapshot = '';\r\nvar _snapshotInitialized = false;\r\nvar _aiJustUpdated = false;\r\nvar _currentTemplate = null;\r\nvar _aiCallActive = false;\r\nvar _reqToken = null;\r\nvar _streamingMsgEl = null;   // live tabbed streaming bubble (DOM)\r\nvar _streamingMsgIdx = -1;    // index of the streaming placeholder in DB.chatMessages\r\nvar _streamCurrentTab = 'text'; // which tab receives tokens: text|html|css|js\r\nvar _streamTabEls = {};        // { text: <pre>, html: <pre>, css: <pre>, js: <pre> }\r\nvar _streamBuf = '';           // buffer for detecting code-block boundaries\r\nvar _aiTimeoutId = null;       // AI watchdog timer\r\nvar _thinkingTimer = null;\r\nvar _thinkingMsgEl = null;\r\nvar _thinkingStartTime = 0;\r\nvar _lastTokenAt = 0;   // last streamed token time — distinguishes \"working\" from \"waiting\"\r\nvar _streamCallback = null;\r\nvar _pendingScrollId = '';\r\nvar _consoleEntries = [];\r\nvar _previewBuildSeq = 0;   // stamp counter — forces the preview iframe to re-navigate every render\r\n\r\n/* ── Session state ── */\r\nvar _sessions = [];\r\nvar _activeSessionId = '';\r\nvar _sessionsLoaded = false;\r\nvar SESSION_TYPE = 'ai-chat-sessions-uniconbaseapps';\r\nvar HISTORY_TYPE = 'webpagebuilder-history-uniconbaseapps'; // version snapshots live as separate objects — the main CMS object stays tiny\r\nvar HISTORY_MAX = 50;\r\nvar _historyMigrated = false; // one-shot migration of legacy `history` arrays found inside the saved value\r\nvar _imagesUpgraded = false; // one-shot: random picsum placeholders → concept-relevant keyword images\r\n\r\n/* ── Rules text — loaded from embedded DOM element ──\r\n   Priority: admin tool.param('pageRules') → built-in embedded copy of\r\n   generalwebsite-page-rules.txt. ── */\r\nvar pageGuideText = '';\r\n\r\nfunction _decodeEmbedded(t) {\r\n  // The embedded rules text is HTML-entity escaped so it can never terminate\r\n  // the <script type=\"text/plain\"> element. Decode all entities back.\r\n  return String(t || '')\r\n    .replace(/&lt;/g, '<')\r\n    .replace(/&gt;/g, '>')\r\n    .replace(/&amp;/g, '&');\r\n}\r\n\r\nfunction getActiveRules() {\r\n  try {\r\n    var p = tool.param('pageRules', '');\r\n    if (p && String(p).trim().length > 200) return String(p).trim();\r\n  } catch (e) {}\r\n  return pageGuideText || '';\r\n}\r\n\r\nfunction getRulesSourceName() {\r\n  try {\r\n    var p = tool.param('pageRules', '');\r\n    if (p && String(p).trim().length > 200) return 'Admin parameter (pageRules)';\r\n  } catch (e) {}\r\n  return 'Built-in (public-website-page-rules.txt v2.0)';\r\n}\r\n\r\n/* ── Stable instance ID for chat-session isolation ──\r\n   DETERMINISTIC: derived from the parent record id (no random suffix), so it\r\n   recomputes the SAME id on every load — sessions can never be orphaned even\r\n   if the saved value was lost. */\r\nfunction _resolveInstanceId() {\r\n  if (DB._instanceId) return DB._instanceId;\r\n  var parentId = DB._parentRecordId || '';\r\n  if (!parentId) {\r\n    try {\r\n      var m = (window.location.search || '').match(/[?&](?:objectId|recordId|id)=([^&?#]+)/);\r\n      if (m) parentId = decodeURIComponent(m[1]);\r\n    } catch (e) {}\r\n  }\r\n  if (!parentId) {\r\n    try {\r\n      var f = tool.getFields();\r\n      if (f && (f._id || f.id)) parentId = String(f._id || f.id);\r\n    } catch (e) {}\r\n  }\r\n  if (!parentId) {\r\n    try { var p = tool.param('objectId', ''); if (p) parentId = String(p); } catch (e) {}\r\n  }\r\n  if (!parentId) {\r\n    try { var s = tool.param('recordId', ''); if (s) parentId = String(s); } catch (e) {}\r\n  }\r\n  DB._instanceId = parentId ? ('rec_' + parentId) : 'inst_unknown';\r\n  try { persist(); } catch (e) {}\r\n  return DB._instanceId;\r\n}\r\n\r\n/* ── Admin parameter helper — design direction & context shared across pages ── */\r\nfunction _p(name, def) {\r\n  try {\r\n    var v = tool.param(name, def);\r\n    return (v === null || v === undefined || v === '') ? def : String(v);\r\n  } catch (e) { return def; }\r\n}\r\n\r\n/* ── Parent CMS object fields (cached) — page identity, slug and SEO live on the\r\n   object itself, so we read them instead of asking for duplicate parameters ── */\r\nvar _parentFields = null;\r\nfunction _fields() {\r\n  if (_parentFields === null) {\r\n    _parentFields = {};\r\n    try {\r\n      var f = tool.getFields();\r\n      if (f && typeof f === 'object') _parentFields = f;\r\n    } catch (e) {}\r\n  }\r\n  return _parentFields;\r\n}\r\nfunction _parentSlug() {\r\n  var f = _fields();\r\n  return String(f.slug || f.pageSlug || '');\r\n}\r\nfunction _parentBrand() {\r\n  var f = _fields();\r\n  return String(f.brandName || f.brand || f.companyName || f.organizationName || f.title || f.name || '');\r\n}\r\nfunction _parentSeo() {\r\n  var f = _fields();\r\n  var seo = (f.seo && typeof f.seo === 'object') ? f.seo : {};\r\n  return {\r\n    title: String(seo.metaTitle || f.seoTitle || f.title || f.name || ''),\r\n    desc: String(seo.metaDesc || f.seoDesc || ''),\r\n    keywords: String(seo.metaKeywords || f.seoKeywords || '')\r\n  };\r\n}\r\n\r\n/* ── Persistence (with automatic patch-version bumping) ── */\r\nfunction _dbSnapshot() {\r\n  return [\r\n    DB.code.html, DB.code.css, DB.code.js,\r\n    JSON.stringify(DB.seo || null),\r\n    JSON.stringify(DB.pageMeta || null),\r\n    DB.configNeeded || '',\r\n    DB.emailTemplate || ''\r\n  ].join('\\u0001');\r\n}\r\n\r\n/* ── Version stamping: the current `vX.Y.Z` is kept as the first line of\r\n   every code block so the page itself always shows which version it is. ── */\r\nvar _stampedVersion = '';\r\nfunction _stampBlock(code, stamp) {\r\n  if (!code) return code;\r\n  // Remove any previous version stamp lines, then prepend the current one.\r\n  // (comment opener built by concatenation — this file runs inline in the CMS page)\r\n  var re = new RegExp('^(?:[ \\t]*(?:<' + '!--\\\\s*v[\\\\d.]+\\\\s*-->|\\\\/\\\\*\\\\s*v[\\\\d.]+\\\\s*\\\\*\\\\/)[ \\t]*[\\\\r\\\\n]+)+');\r\n  return stamp + '\\n' + String(code).replace(re, '');\r\n}\r\nfunction _stampVersionInCode() {\r\n  var v = DB.version || '1.0.0';\r\n  if (_stampedVersion === v) return false;\r\n  _stampedVersion = v;\r\n  var h = _stampBlock(DB.code.html, '<' + '!-- v' + v + ' -->');\r\n  var c = _stampBlock(DB.code.css, '/* v' + v + ' */');\r\n  var j = _stampBlock(DB.code.js, '/* v' + v + ' */');\r\n  var changed = h !== DB.code.html || c !== DB.code.css || j !== DB.code.js;\r\n  DB.code.html = h;\r\n  DB.code.css = c;\r\n  DB.code.js = j;\r\n  return changed;\r\n}\r\n\r\n/* The slim payload actually saved to the parent CMS object ── */\r\nfunction _slimValue() {\r\n  return {\r\n    code: { html: DB.code.html, css: DB.code.css, js: DB.code.js },\r\n    seo: DB.seo || null,\r\n    pageMeta: DB.pageMeta || null,\r\n    configNeeded: DB.configNeeded || '',\r\n    emailTemplate: DB.emailTemplate || '',\r\n    version: DB.version,\r\n    activeSessionId: DB.activeSessionId || '',\r\n    chatCache: { sessionId: _activeSessionId || '', messages: _trimChatCache(DB.chatMessages) },\r\n    _instanceId: DB._instanceId || '',\r\n    _parentRecordId: DB._parentRecordId || ''\r\n  };\r\n}\r\n\r\nfunction persist() {\r\n  if (!_snapshotInitialized) {\r\n    _lastPersistedSnapshot = _dbSnapshot();\r\n    _snapshotInitialized = true;\r\n  } else {\r\n    var snap = _dbSnapshot();\r\n    if (_lastPersistedSnapshot && snap !== _lastPersistedSnapshot && !_aiJustUpdated) _bumpVersion('patch');\r\n    // Refresh AFTER the bump — version stamping changes the code itself.\r\n    _lastPersistedSnapshot = _dbSnapshot();\r\n  }\r\n  _aiJustUpdated = false;\r\n  DB.chatCache = { sessionId: _activeSessionId, messages: _trimChatCache(DB.chatMessages) };\r\n  try { tool.setValue(_slimValue()); } catch (e) {}\r\n  if (_activeSessionId) saveCurrentSession();\r\n  tool.resize();\r\n}\r\n\r\n/* ── Bounded chat cache: last N messages with capped text, kept in the record\r\n   value so chat survives a refresh even when session storage is misconfigured. ── */\r\nvar CHAT_CACHE_MAX = 20;\r\nvar CHAT_CACHE_TEXT_MAX = 2000;\r\nfunction _trimChatCache(list) {\r\n  var out = [];\r\n  var msgs = (list && list.messages) ? list.messages : (list || []);\r\n  var src = msgs.slice ? msgs.slice(-CHAT_CACHE_MAX) : [];\r\n  for (var i = 0; i < src.length; i++) {\r\n    var m = src[i];\r\n    if (!m || typeof m !== 'object') continue;\r\n    var copy = {\r\n      role: m.role,\r\n      text: String(m.text || '').substring(0, CHAT_CACHE_TEXT_MAX),\r\n      time: m.time\r\n    };\r\n    if (m.version) copy.version = m.version;\r\n    if (m.isError) copy.isError = true;\r\n    if (m.tasks) copy.tasks = m.tasks;\r\n    out.push(copy);\r\n  }\r\n  return out;\r\n}\r\n\r\n/* ── Semantic version bump (AI updates → minor, manual edits → patch) ── */\r\nfunction _bumpVersion(level) {\r\n  if (!DB.version) DB.version = '1.0.0';\r\n  var parts = DB.version.split('.');\r\n  var maj = parseInt(parts[0], 10) || 0;\r\n  var min = parseInt(parts[1], 10) || 0;\r\n  var pat = parseInt(parts[2], 10) || 0;\r\n  if (level === 'major') { maj += 1; min = 0; pat = 0; }\r\n  else if (level === 'minor') { min += 1; pat = 0; }\r\n  else { pat += 1; }\r\n  DB.version = maj + '.' + min + '.' + pat;\r\n  _stampVersionInCode();\r\n  _renderVersion();\r\n}\r\nfunction _renderVersion() {\r\n  var badge = el('tool-version');\r\n  if (badge) badge.textContent = 'v' + (DB.version || '1.0.0');\r\n}\r\nfunction _onVersionClick() {\r\n  var display = el('tool-version');\r\n  if (!display) return;\r\n  var currentVer = DB.version || '1.0.0';\r\n  var input = document.createElement('input');\r\n  input.type = 'text';\r\n  input.className = 'version-input';\r\n  input.value = currentVer;\r\n  display.parentNode.replaceChild(input, display);\r\n  input.focus();\r\n  input.select();\r\n  var save = function() {\r\n    var newVer = input.value.trim();\r\n    if (!/^\\d+\\.\\d+\\.\\d+$/.test(newVer)) {\r\n      showToast('Version must be like 1.0.0', 'warning');\r\n      newVer = currentVer;\r\n    } else {\r\n      var np = newVer.split('.');\r\n      var cp = currentVer.split('.');\r\n      var higher =\r\n        (parseInt(np[0], 10) > parseInt(cp[0], 10)) ||\r\n        (np[0] === cp[0] && parseInt(np[1], 10) > parseInt(cp[1], 10)) ||\r\n        (np[0] === cp[0] && np[1] === cp[1] && parseInt(np[2], 10) >= parseInt(cp[2], 10));\r\n      if (!higher) {\r\n        showToast('Version must be ≥ ' + currentVer + ' (no downgrade)', 'warning');\r\n        newVer = currentVer;\r\n      }\r\n    }\r\n    DB.version = newVer;\r\n    persist();\r\n    _renderVersion();\r\n    var newDisplay = document.createElement('span');\r\n    newDisplay.id = 'tool-version';\r\n    newDisplay.className = 'version-badge';\r\n    newDisplay.textContent = 'v' + newVer;\r\n    newDisplay.title = 'Click to change version (increment only)';\r\n    newDisplay.onclick = _onVersionClick;\r\n    if (input.parentNode) input.parentNode.replaceChild(newDisplay, input);\r\n  };\r\n  input.onblur = save;\r\n  input.onkeydown = function(e) {\r\n    if (e.key === 'Enter') input.blur();\r\n    if (e.key === 'Escape') { input.value = currentVer; input.blur(); }\r\n  };\r\n}\r\n\r\n/* ── Session CRUD (ai-chat-sessions-uniconbaseapps) ── */\r\nvar _sessionWarnShown = false;\r\nfunction _warnSessionStorage(msg) {\r\n  if (_sessionWarnShown) return;\r\n  _sessionWarnShown = true;\r\n  console.warn('[WEBPAGEBUILDER:SESSION] ' + msg);\r\n  try {\r\n    showToast('⚠ Chat history storage unavailable — messages are cached inside the record until it is fixed. Check allowObjectCRUD: yes and the ai-chat-sessions-uniconbaseapps object type in field settings.', 'warning');\r\n  } catch (e) {}\r\n}\r\nfunction loadSessions(callback) {\r\n  try {\r\n    tool.requestObjects('query', { mainObjectType: SESSION_TYPE }, function(err, result) {\r\n      if (err) {\r\n        _warnSessionStorage('Query error: ' + err);\r\n        _sessions = [];\r\n      }\r\n      else {\r\n        var all = (result && result.objects) ? result.objects : [];\r\n        var myId = _resolveInstanceId();\r\n        _sessions = [];\r\n        var needsStamp = [];\r\n        for (var i = 0; i < all.length; i++) {\r\n          var obj = all[i];\r\n          var pd = obj.productData || {};\r\n          var dcb = pd.data_categoriesBased || {};\r\n          // Deterministic id 'rec_<parent>' also matches legacy 'rec_<parent>_<rand>' ids.\r\n          if (dcb._toolInstanceId === myId ||\r\n              (myId !== 'inst_unknown' && dcb._toolInstanceId && String(dcb._toolInstanceId).indexOf(myId) === 0)) {\r\n            _sessions.push(obj);\r\n          }\r\n          else if (!dcb._toolInstanceId && obj._parentObjectId && DB._parentRecordId && obj._parentObjectId === DB._parentRecordId) {\r\n            needsStamp.push(obj);\r\n            _sessions.push(obj);\r\n          }\r\n        }\r\n        for (var s = 0; s < needsStamp.length; s++) {\r\n          (function(session) {\r\n            tool.requestObjects('update', {\r\n              mainObjectType: SESSION_TYPE,\r\n              objectId: session.id,\r\n              productData: { data_categoriesBased: { _toolInstanceId: myId } }\r\n            }, function() {});\r\n          })(needsStamp[s]);\r\n        }\r\n      }\r\n      _sessionsLoaded = true;\r\n      if (callback) callback(_sessions);\r\n    });\r\n  } catch (e) {\r\n    _warnSessionStorage('query threw: ' + e.message);\r\n    _sessions = [];\r\n    _sessionsLoaded = true;\r\n    if (callback) callback([]);\r\n  }\r\n}\r\n\r\nfunction createSession(callback) {\r\n  var user = tool.getUser() || {};\r\n  var instId = _resolveInstanceId();\r\n  try {\r\n    tool.requestObjects('create', {\r\n      mainObjectType: SESSION_TYPE,\r\n      name: 'New Chat',\r\n      productData: {\r\n        data_categoriesBased: {\r\n          messages: [],\r\n          createdAt: new Date().toISOString(),\r\n          updatedAt: new Date().toISOString(),\r\n          createdBy: { userId: user.id || 'anon', userName: user.name || 'Anonymous' },\r\n          _toolInstanceId: instId\r\n        }\r\n      }\r\n    }, function(err, result) {\r\n      if (err) { _warnSessionStorage('create error: ' + err); if (callback) callback(null); return; }\r\n      var session = result.object;\r\n      if (session._parentObjectId && !DB._parentRecordId) DB._parentRecordId = session._parentObjectId;\r\n      _sessions.unshift(session);\r\n      if (callback) callback(session);\r\n    });\r\n  } catch (e) {\r\n    _warnSessionStorage('create threw: ' + e.message);\r\n    if (callback) callback(null);\r\n  }\r\n}\r\n\r\nfunction saveCurrentSession(callback) {\r\n  if (!_activeSessionId) { if (callback) callback(null); return; }\r\n  try {\r\n    // Merge with the EXISTING session data (protects _toolInstanceId,\r\n    // createdAt, createdBy and any other stored keys from being wiped).\r\n    var session = null;\r\n    for (var si = 0; si < _sessions.length; si++) {\r\n      if (_sessions[si].id === _activeSessionId) { session = _sessions[si]; break; }\r\n    }\r\n    var oldDcb = (session && session.productData && session.productData.data_categoriesBased) ? session.productData.data_categoriesBased : {};\r\n    var dcb = {};\r\n    for (var k in oldDcb) {\r\n      if (Object.prototype.hasOwnProperty.call(oldDcb, k)) dcb[k] = oldDcb[k];\r\n    }\r\n    dcb.messages = DB.chatMessages || [];\r\n    dcb.updatedAt = new Date().toISOString();\r\n    tool.requestObjects('update', {\r\n      mainObjectType: SESSION_TYPE,\r\n      objectId: _activeSessionId,\r\n      productData: { data_categoriesBased: dcb }\r\n    }, function(err, result) {\r\n      if (err) _warnSessionStorage('save error: ' + err);\r\n      if (callback) callback(err ? null : result);\r\n    });\r\n  } catch (e) {\r\n    _warnSessionStorage('save threw: ' + e.message);\r\n    if (callback) callback(null);\r\n  }\r\n}\r\n\r\nfunction deleteSession(sessionId, ember cards showing photos, names and roles.',\r\n  suggest_gallery: 'Add a photo gallery with a responsive grid and lightbox effect.',\r\n  suggest_contact: 'Add a contact section with a form, phone, email, address and a map placeholder.',\r\n  suggest_cta: 'Add a bold call-to-action band near the end with a big button.',\r\n  suggest_seo: 'Improve SEO: better heading hierarchy, meta-friendly structure and descriptive alt texts.',\r\n  suggest_fonts: 'Improve the typography: better font pairing, hierarchy and line spacing.',\r\n  suggest_colors: 'Refine the color palette for better contrast and brand feel.',\r\n  suggest_hero: 'Redesign the hero section to be more impactful with a stronger headline and CTA.',\r\n  suggest_navbar: 'Improve the navbar: sticky behavior, active section highlighting and smoother mobile menu.',\r\n  suggest_backtotop: 'Add a back-to-top floating button that appears after scrolling.',\r\n  suggest_newsletter: 'Add a newsletter signup section with an email input.',\r\n  suggest_stats: 'Add a stats band with animated counters (years, clients, projects, awards).'\r\n};\r\nfunction _getSuggestDetail(id, text) {\r\n  if (SUGGEST_DETAILS[id]) return SUGGEST_DETAILS[id];\r\n  // Section suggestions reuse the context-aware section prompt.\r\n  var sectionKey = String(id).replace(/^suggest_/, '');\r\n  if (SECTION_CANDIDATES[sectionKey]) return buildSectionPrompt(sectionKey);\r\n  return text;\r\n}\r\n\r\n/* ── Chat messages ── */\r\nfunction addChatMessage(role, text, extra) {\r\n  var user = tool.getUser() || {};\r\n  var msg = {\r\n    role: role,\r\n    text: text || '',\r\n    time: new Date().toISOString(),\r\n    userId: role === 'user' ? (user.id || 'anon') : 'ai',\r\n    userName: role === 'user' ? (user.name || 'Anonymous') : 'AI Assistant'\r\n  };\r\n  if (extra && extra.options && extra.options.length) msg.options = extra.options;\r\n  if (extra && extra.version) msg.version = extra.version;\r\n  if (extra && extra.compliance) msg.compliance = extra.compliance;\r\n  if (extra && extra.diffHtml) msg.diffHtml = extra.diffHtml;\r\n  if (extra && extra.isError) msg.isError = true;\r\n  DB.chatMessages.push(msg);\r\n  if (DB.chatMessages.length > 500) DB.chatMessages = DB.chatMessages.slice(-500);\r\n  DB.chatCache = { sessionId: _activeSessionId, messages: _trimChatCache(DB.chatMessages) };\r\n  renderChatMessages();\r\n  updateChatBadge();\r\n  if (_activeSessionId) {\r\n    saveCurrentSession();\r\n    renderSessionList(); // keep chat list timestamps fresh\r\n    // Auto-title: on the 1st user message and every 3rd (earlier ones may be generic)\r\n    if (role === 'user') {\r\n      var userMsgCount = 0;\r\n      for (var mi = 0; mi < DB.chatMessages.length; mi++) {\r\n        if (DB.chatMessages[mi].role === 'user') userMsgCount++;\r\n      }\r\n      if (userMsgCount === 1 || userMsgCount % 3 === 0) autoTitleSession();\r\n    } else if (!(extra && extra.isError)) {\r\n      autoTitleSession();\r\n    }\r\n    // Keep the bounded cache in the record value up to date on EVERY message\r\n    // (the value change is a no-op for the code — the guard re-renders cheaply).\r\n    try { tool.setValue(_slimValue()); } catch (e) {}\r\n  } else {\r\n    // No session object yet — still persist the bounded cache into the\r\n    // record value so chat survives a refresh no matter what.\r\n    try { persist(); } catch (e) {}\r\n  }\r\n}\r\n\r\nfunction shortTime(iso) {\r\n  try {\r\n    var d = new Date(iso);\r\n    var h = d.getHours(), m = d.getMinutes();\r\n    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;\r\n  } catch (e) { return ''; }\r\n}\r\n\r\nfunction markdownLite(text) {\r\n  var t = esc(text || '');\r\n  t = t.replace(/\\*\\*(.+?)\\*\\*/g, '<b>$1<\/b>');\r\n  t = t.replace(/`([^`]+)`/g, '<code>$1<\/code>');\r\n  t = t.replace(/^#{1,3} (.+)$/gm, '<h4>$1<\/h4>');\r\n  t = t.replace(/^\\s*[-*] (.+)$/gm, '• $1');\r\n  t = t.replace(/\\n/g, '<br>');\r\n  return t;\r\n}\r\n\r\nfunction FromChat()\" title=\"Open version history\">✓ page v' + esc(m.version) + '<\/span>';\r\n      if (m.compliance && m.compliance.total) {\r\n        var cs = m.compliance;\r\n        var cicon = cs.failed ? '❌' : cs.warned ? '⚠️' : '✅';\r\n        h += '<span class=\"chat-compliance-chip\" title=\"Open the Compliance tab\" onclick=\"openComplianceTab()\">🧪 ' + cicon + ' ' + cs.passed + '/' + cs.total + ' checks<\/span>';\r\n      }\r\n      if (m.diffHtml) h += m.diffHtml;\r\n      if (m.options && m.options.length) h += optionsHtml(m.options);\r\n      h += '<div class=\"chat-msg-time\">' + time + '<\/div><\/div>' +\r\n      '<\/div>';\r\n    }\r\n  }\r\n  box.innerHTML = h;\r\n  var diffBtns = box.querySelectorAll('.diff-tab-btn');\r\n  for (var db = 0; db < diffBtns.length; db++) {\r\n    diffBtns[db].onclick = function() { handleDiffTabClick(this); };\r\n  }\r\n  scrollChatToBottom();\r\n}\r\n\r\nfunction scrollChatToBottom() {\r\n  var box = el('chat-messages');\r\n  if (box) box.scrollTop = box.scrollHeight;\r\n}\r\n\r\nfunction updateChatBadge() {\r\n  var badge = el('chat-msg-count');\r\n  if (badge) badge.textContent = (DB.chatMessages || []).length;\r\n}\r\n\r\nfunction handleOptionClick(btn) {\r\n  var optId = btn.getAttribute('data-opt-id');\r\n  var optText = btn.getAttribute('data-opt-text');\r\n  if (optId && optId.indexOf('suggest_') === 0) {\r\n    var inp = el('chat-input');\r\n    if (!inp) return;\r\n    var isSelected = btn.classList.contains('chat-suggest-selected');\r\n    if (isSelected) btn.classList.remove('chat-suggest-selected');\r\n    else btn.classList.add('chat-suggest-selected');\r\n    var checkEl = btn.querySelector('.opt-check');\r\n    if (checkEl) checkEl.textContent = isSelected ? '☐' : '☑';\r\n    _rebuildSuggestInput();\r\n    _updateSelectAllButton(btn.parentNode);\r\n    return;\r\n  }\r\n  var parent = btn.parentNode;\r\n  if (parent) {\r\n    var allBtns = parent.querySelectorAll('.chat-option-btn');\r\n    for (var i = 0; i < allBtns.length; i++) {\r\n      allBtns[i].classList.add('chat-option-used');\r\n      allBtns[i].disabled = true;\r\n    }\r\n  }\r\n  var inp2 = el('chat-input');\r\n  if (inp2) {\r\n    inp2.value = optText;\r\n    inp2.style.height = 'auto';\r\n  }\r\n  sendChatMessage();\r\n}\r\n\r\nfunction _rebuildSuggestInput() {\r\n  var inp = el('chat-input');\r\n  if (!inp) return;\r\n  var allSuggestBtns = document.querySelectorAll('.chat-option-btn.chat-suggest-selected');\r\n  var lines = [];\r\n  var num = 1;\r\n  for (var i = 0; i < allSuggestBtns.length; i++) {\r\n    var detail = allSuggestBtns[i].getAttribute('data-opt-detail');\r\n    var title = allSuggestBtns[i].getAttribute('data-opt-text');\r\n    var txt = detail || title || '';\r\n    if (txt) { lines.push(num + '- ' + txt); num++; }\r\n  }\r\n  var currentVal = inp.value || '';\r\n  var freeText = currentVal.replace(/^\\d+-\\s+.+$/gm, '').replace(/\\n{2,}/g, '\\n').trim();\r\n  if (freeText && lines.length > 0) inp.value = freeText + '\\n\\n' + lines.join('\\n');\r\n  else if (lines.length > 0) inp.value = lines.join('\\n');\r\n  else inp.value = freeText;\r\n}\r\n\r\nfunction _updateSelectAllButton(container) {\r\n  var selectAll = container.querySelector('.chat-options-select-all');\r\n  if (!selectAll) return;\r\n  var btns = container.querySelectorAll('.chat-option-btn.chat-suggest-btn');\r\n  var allSelected = btns.length > 0;\r\n  for (var i = 0; i < btns.length; i++) {\r\n    if (!btns[i].classList.contains('chat-suggest-selected')) { allSelected = false; break; }\r\n  }\r\n  selectAll.textContent = allSelected ? 'Clear All' : 'Select All';\r\n}\r\n\r\nfunction toggleSelectAllSuggestions(btn) {\r\n  var container = btn.parentNode ? btn.parentNode.parentNode : null;\r\n  if (!container) return;\r\n  var btns = container.querySelectorAll('.chat-option-btn.chat-suggest-btn');\r\n  var allSelected = true;\r\n  for (var i = 0; i < btns.length; i++) {\r\n    if (!btns[i].classList.contains('chat-sugge : 'optional', hint: 'Optional: paste the full public-website-page-rules.txt (v2.0) text here to override the built-in rules for every instance of this tool.' },\r\n    { name: 'colorScheme', label: 'Color Scheme', type: 'text', default: 'indigo', severity: 'optional', hint: 'Site-wide palette shared across pages. Options: emerald | blue | indigo | violet | rose | amber | teal | ocean | forest | sunset | mono.' },\r\n    { name: 'typography', label: 'Typography', type: 'text', default: 'modern-sans', severity: 'optional', hint: 'Site-wide font pairing: modern-sans | elegant-serif | friendly-rounded | tech-mono | editorial.' },\r\n    { name: 'thinkingLevel', label: 'AI Thinking Depth', type: 'text', default: 'balanced', severity: 'optional', hint: 'How much reasoning effort the AI spends per request: quick | balanced | deep. Deeper = more thoughtful structure and copy, but slower. Works best when the AI gateway runs a reasoning-capable model (e.g. DeepSeek V4 Pro).' },\r\n    { name: 'skills', label: 'Default Skills', type: 'text', default: '', severity: 'optional', hint: 'Comma-separated default skills the AI applies to every page: creative | a11y | seo | nonprofit | luxury | playful | minimal | copy. Page-type guidance is added automatically from the page content.' },\r\n    { name: 'lang', label: 'Page Language', type: 'text', default: 'en', severity: 'optional', hint: 'Language used in generated copy (en, tr, fr, de, es, ar).' }\r\n  ]);\r\n\r\n  var aiParam = tool.param('allowAi');\r\n  if (!aiParam || aiParam !== 'yes') {\r\n    tool.reportMissingParams([{\r\n      name: 'allowAi', label: 'Enable AI Prompt Relay',\r\n      type: 'toggle', default: 'yes', severity: 'mandatory',\r\n      hint: 'Set to \"yes\" to enable AI page generation via tool.requestAI().',\r\n      reason: 'This tool requires AI access to design webpages. Without it, chat generation will not work.'\r\n    }], 'AI Prompt Relay must be enabled for this tool to function. Set allowAi: yes in the field settings.');\r\n  }\r\n  try { tool.reportValid(true); } catch (e) {}\r\n\r\n  render(val);\r\n  _resolveInstanceId();\r\n  bindEvents();\r\n  initConsoleCapture();\r\n  applyTheme('light');\r\n\r\n  loadSessions(function() {\r\n    var hasLegacyChat = DB.chatMessages && DB.chatMessages.length > 0;\r\n    var hasActiveSession = DB.activeSessionId && DB.activeSessionId.length > 0;\r\n    if (hasLegacyChat && !hasActiveSession) {\r\n      var legacy = DB.chatMessages.slice();\r\n      DB.chatMessages = [];\r\n      persist();\r\n      createSession(function(newSession) {\r\n        if (newSession) {\r\n          tool.requestObjects('update', {\r\n            mainObjectType: SESSION_TYPE,\r\n            objectId: newSession.id,\r\n            productData: { data_categoriesBased: { messages: legacy, updatedAt: new Date().toISOString(), _toolInstanceId: _resolveInstanceId() } }\r\n          }, function() {\r\n            _activeSessionId = newSession.id;\r\n            DB.activeSessionId = newSession.id;\r\n            persist();\r\n            renderSessionList();\r\n          });\r\n        }\r\n      });\r\n    } else if (hasActiveSession) {\r\n      // switchSession sets _activeSessionId itself (setting it here first\r\n      // would trigger its same-session early return and skip loading).\r\n      switchSession(DB.activeSessionId);\r\n    }\r\n    renderSessionList();\r\n    renderChatMessages();\r\n  });\r\n\r\n  updateConnStatus('ok');\r\n  if (tool.isReadOnly()) lockUI(true);\r\n  updateDeveloperUI();\r\n\r\n  var hasCode = !!(DB.code.html || DB.code.css || DB.code.js);\r\n  switchTab('preview');\r\n  renderSections();\r\n  if (hasCode) runComplianceChecks();\r\n  tool.resize();\r\n});\r\n\r\ntool.onValueChange(function(v) { render(v); });\r\ntool.onFieldsChange(function(f) {});\r\ntool.onReadonlyChange(function(ro) { lockUI(ro); });\r\ntool.onUserChange(function() { updateDeveloperUI(); });\r\n"}}</script>

<!-- SCREENSHOTS-PAYLOAD-START - refresh-docs-index.js replaces the payload between these markers -->
<script type="application/json" id="shots-payload">[]</script>
<!-- SCREENSHOTS-PAYLOAD-END -->

<script>
(function () {
  'use strict';
  var frame = document.getElementById('docs-frame');
  var openButton = document.getElementById('docs-open');
  var codeView = document.getElementById('docs-code-view');
  var codeTitle = document.getElementById('docs-code-title');
  var codeMeta = document.getElementById('docs-code-meta');
  var codeElement = document.getElementById('docs-code-code');
  var codeCopyButton = document.getElementById('docs-code-copy');
  var codeOpenButton = document.getElementById('docs-code-open');
  var navItems = Array.prototype.slice.call(document.querySelectorAll('.docs-nav-item'));
  var currentSource = 'ssot.html';
  var currentCodeKind = '';

  var codePayload = { html: null, css: null, js: null };
  try {
    codePayload = JSON.parse(document.getElementById('code-payload').textContent) || codePayload;
  } catch (error) { /* payload unavailable */ }

  /* ---- screenshots viewer ---- */
  var shotsView = document.getElementById('docs-shots-view');
  var shotsViewer = document.getElementById('docs-shots-viewer');
  var shotsImg = document.getElementById('docs-shots-img');
  var shotsEmpty = document.getElementById('docs-shots-empty');
  var shotsInfo = document.getElementById('docs-shots-info');
  var shotsThumbs = document.getElementById('docs-shots-thumbs');
  var shotsPrev = document.getElementById('docs-shots-prev');
  var shotsNext = document.getElementById('docs-shots-next');
  var shotsPayload = [];
  try {
    shotsPayload = JSON.parse(document.getElementById('shots-payload').textContent) || [];
  } catch (error) { /* payload unavailable */ }
  var currentShotIndex = 0;

  function renderShotsInfo(shot) {
    if (!shotsInfo) return;
    if (!shot) { shotsInfo.innerHTML = ''; return; }
    var fields = [
      ['File', shot.name || ''],
      ['Shot', shot.label || ''],
      ['Page', shot.page || ''],
      ['Viewport', shot.viewport || ''],
      ['Dimensions', shot.width && shot.height ? shot.width + ' \u00d7 ' + shot.height + ' px' : ''],
      ['Captured', shot.capturedAt ? shot.capturedAt.replace('T', ' ').slice(0, 19) + ' UTC' : ''],
      ['Used in', Array.isArray(shot.usedIn) && shot.usedIn.length ? shot.usedIn.join(', ') : 'docs index viewer'],
    ];
    shotsInfo.innerHTML = '<p class="docs-shots-counter">Screenshot ' + (currentShotIndex + 1) + ' of ' + shotsPayload.length + '</p>' +
      '<dl>' + fields.filter(function (field) { return field[1]; })
        .map(function (field) { return '<div><dt>' + field[0] + '</dt><dd>' + field[1] + '</dd></div>'; })
        .join('') + '</dl>';
  }

  function showShot(index) {
    if (!shotsPayload.length) {
      if (shotsImg) shotsImg.style.display = 'none';
      if (shotsEmpty) shotsEmpty.style.display = '';
      if (shotsPrev) shotsPrev.style.display = 'none';
      if (shotsNext) shotsNext.style.display = 'none';
      if (shotsThumbs) shotsThumbs.style.display = 'none';
      renderShotsInfo(null);
      return;
    }
    currentShotIndex = ((index % shotsPayload.length) + shotsPayload.length) % shotsPayload.length;
    var shot = shotsPayload[currentShotIndex];
    if (shotsImg) {
      shotsImg.style.display = '';
      shotsImg.src = shot.src;
    }
    if (shotsEmpty) shotsEmpty.style.display = 'none';
    if (shotsPrev) shotsPrev.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsNext) shotsNext.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsThumbs) {
      shotsThumbs.innerHTML = shotsPayload.map(function (entry, i) {
        return '<button class="docs-shots-thumb' + (i === currentShotIndex ? ' active' : '') + '" type="button" data-shot-index="' + i + '">' +
          '<img src="' + entry.src + '" alt="' + (entry.label || entry.name) + '" loading="lazy" />' +
          '<span>' + (entry.label || entry.name) + '</span></button>';
      }).join('');
    }
    renderShotsInfo(shot);
  }

  function openShotsPane() {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.add('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    showShot(currentShotIndex);
  }

  if (shotsThumbs) {
    shotsThumbs.addEventListener('click', function (event) {
      var thumb = event.target.closest ? event.target.closest('.docs-shots-thumb') : null;
      if (!thumb) return;
      showShot(Number(thumb.getAttribute('data-shot-index')) || 0);
    });
  }
  if (shotsPrev) shotsPrev.addEventListener('click', function () { showShot(currentShotIndex - 1); });
  if (shotsNext) shotsNext.addEventListener('click', function () { showShot(currentShotIndex + 1); });
  document.addEventListener('keydown', function (event) {
    if (!shotsView.classList.contains('visible')) return;
    if (event.key === 'ArrowLeft') showShot(currentShotIndex - 1);
    if (event.key === 'ArrowRight') showShot(currentShotIndex + 1);
    if (event.key === 'Escape') { shotsView.classList.remove('visible'); frame.style.display = ''; if (openButton) openButton.style.display = ''; }
  });

  function activateItem(activeItem) {
    navItems.forEach(function (item) { item.classList.toggle('active', item === activeItem); });
  }

  function showCodePane(kind) {
    var entry = codePayload[kind];
    currentCodeKind = kind;
    codeView.classList.add('visible');
    shotsView.classList.remove('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    if (!entry) {
      codeTitle.textContent = kind.toUpperCase() + ' code';
      codeMeta.textContent = 'no ' + kind + ' file in the app folder';
      codeElement.textContent = '';
      return;
    }
    codeTitle.textContent = entry.name;
    var lineCount = entry.content ? entry.content.split('\n').length : 0;
    codeMeta.textContent = lineCount + ' lines - ' + (entry.content ? entry.content.length : 0) + ' characters';
    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {
      showCodePane(item.getAttribute('data-doc').slice(5));
    } else {
      showDocumentPane(item);
    }
    try { window.location.hash = 'doc=' + item.getAttribute('data-doc'); } catch (error) { /* ignore */ }
  }

  navItems.forEach(function (item) {
    item.addEventListener('click', function () { openItem(item); });
  });

  if (openButton) {
    openButton.addEventListener('click', function () {
      var fullUrl = new URL(currentSource, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  if (codeCopyButton) {
    codeCopyButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      var text = entry && entry.content ? entry.content : '';
      if (!text) return;
      function markCopied() {
        codeCopyButton.textContent = 'Copied ✓';
        codeCopyButton.classList.add('copied');
        setTimeout(function () {
          codeCopyButton.textContent = 'Copy code';
          codeCopyButton.classList.remove('copied');
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function () { fallbackCopy(text, markCopied); });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
</body>
</html>
