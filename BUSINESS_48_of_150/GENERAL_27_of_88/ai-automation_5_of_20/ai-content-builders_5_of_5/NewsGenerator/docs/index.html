<title>News Generator - Docs Index</title>
<!--
  DOCS INDEX TEMPLATE - _docs/templates/_index-template.html
  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), and the test harness
  into a full-page pane - open ONLY this file to review everything about the
  tool. Self-contained (no shared assets) so it works anywhere. Created by
  scripts/init-docs.js as docs/index.html for every tool; the test-harness
  menu item appears only when the tool has app/test-harness.html. The code
  panes are embedded between the CODE-PAYLOAD markers and refreshed with
  `node scripts/refresh-docs-index.js <Tool>` after code changes.
  URL shortcut: index.html?doc=help (or ?doc=code-js) opens directly.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #1f2937; }
  .docs-shell { display: flex; height: 100vh; height: 100dvh; }
  .docs-menu {
    width: 236px; flex: 0 0 236px;
    background: #0f172a; color: #cbd5e1;
    display: flex; flex-direction: column;
    border-right: 1px solid #1e293b;
  }
  .docs-brand { padding: 18px 16px 14px; border-bottom: 1px solid #1e293b; }
  .docs-brand-name { font-weight: 800; color: #f8fafc; font-size: 0.95rem; line-height: 1.3; }
  .docs-brand-sub { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .docs-nav { flex: 1; overflow-y: auto; padding: 10px 10px; }
  .docs-nav-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    color: #cbd5e1; padding: 9px 12px; margin-bottom: 2px;
    border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 0.86rem; font-weight: 600;
  }
  .docs-nav-item:hover { background: #1e293b; color: #f1f5f9; }
  .docs-nav-item.active { background: #4f46e5; color: #ffffff; }
  .docs-nav-item .docs-nav-sub { display: block; font-size: 0.7rem; font-weight: 500; color: #64748b; margin-top: 1px; }
  .docs-nav-item.active .docs-nav-sub { color: #c7d2fe; }
  .docs-nav-item.docs-nav-code { color: #fbbf24; }
  .docs-nav-item.docs-nav-code:hover { background: #1e293b; color: #fcd34d; }
  .docs-nav-item.docs-nav-code.active { background: #b45309; color: #fffbeb; }
  .docs-nav-item.docs-nav-code.active .docs-nav-sub { color: #fde68a; }
  .docs-nav-item.docs-nav-harness { color: #86efac; }
  .docs-nav-item.docs-nav-harness:hover { background: #1e293b; color: #bbf7d0; }
  .docs-nav-sep { border: 0; border-top: 1px solid #1e293b; margin: 10px 4px; }
  .docs-nav-group-label { font-size: 0.66rem; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; padding: 8px 12px 2px; }
  .docs-menu-footer {
    padding: 12px 16px; border-top: 1px solid #1e293b;
    font-size: 0.72rem; color: #64748b;
  }
  .docs-stage { flex: 1; min-width: 0; background: #e2e8f0; position: relative; }
  .docs-frame {
    width: 100%; height: 100%; border: 0;
    display: block; background: #ffffff;
  }
  .docs-open {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: #0f172a; color: #e2e8f0; border: 0; border-radius: 8px;
    padding: 7px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    font-family: inherit; opacity: 0.9;
  }
  .docs-open:hover { opacity: 1; }
  /* code viewer pane */
  .docs-code-view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-code-view.visible { display: flex; }
  .docs-code-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #111c30; border-bottom: 1px solid #1e293b;
    flex-wrap: wrap;
  }
  .docs-code-title { color: #fbbf24; font-weight: 800; font-size: 0.9rem; font-family: ui-monospace, Consolas, monospace; }
  .docs-code-meta { color: #64748b; font-size: 0.75rem; margin-right: auto; }
  .docs-code-btn {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
    padding: 6px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .docs-code-btn:hover { background: #334155; }
  .docs-code-btn.copied { background: #14532d; border-color: #16a34a; color: #bbf7d0; }
  .docs-code-pre { flex: 1; overflow: auto; margin: 0; padding: 16px 18px; }
  .docs-code-code {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; color: #dbeafe;
    white-space: pre; tab-size: 4;
  }
  .docs-code-empty { color: #64748b; padding: 40px; text-align: center; font-size: 0.9rem; }
  /* screenshots viewer pane */
  .docs-nav-item.docs-nav-shots { color: #93c5fd; }
  .docs-nav-item.docs-nav-shots:hover { background: #1e293b; color: #bfdbfe; }
  .docs-nav-item.docs-nav-shots.active { background: #1d4ed8; color: #eff6ff; }
  .docs-nav-item.docs-nav-shots.active .docs-nav-sub { color: #bfdbfe; }
  .docs-shots-view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-shots-view.visible { display: flex; }
  .docs-shots-viewer {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 72px;
  }
  .docs-shots-img {
    max-width: 100%; max-height: 100%;
    border-radius: 10px; border: 1px solid #1e293b;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5); background: #1e293b;
  }
  .docs-shots-empty { color: #64748b; text-align: center; font-size: 0.9rem; line-height: 1.7; }
  .docs-shots-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    font-size: 1.05rem; font-family: inherit;
  }
  .docs-shots-arrow:hover { background: #334155; }
  .docs-shots-arrow.prev { left: 14px; }
  .docs-shots-arrow.next { right: 14px; }
  .docs-shots-info {
    border-top: 1px solid #1e293b; background: #111c30;
    padding: 12px 18px;
  }
  .docs-shots-counter { color: #93c5fd; font-weight: 800; font-size: 0.8rem; margin: 0 0 8px; }
  .docs-shots-info dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 22px; margin: 0; }
  .docs-shots-info dt { color: #64748b; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .docs-shots-info dd { color: #e2e8f0; font-size: 0.8rem; margin: 2px 0 0; overflow-wrap: anywhere; }
  .docs-shots-thumbs {
    border-top: 1px solid #1e293b; padding: 10px 14px;
    display: flex; gap: 10px; overflow-x: auto;
  }
  .docs-shots-thumb {
    flex: 0 0 auto; width: 150px; padding: 0;
    border: 2px solid #1e293b; border-radius: 8px; overflow: hidden;
    cursor: pointer; background: #0f172a; font-family: inherit;
  }
  .docs-shots-thumb.active { border-color: #60a5fa; }
  .docs-shots-thumb img { width: 100%; height: 84px; object-fit: cover; object-position: top; display: block; }
  .docs-shots-thumb span { display: block; padding: 5px 7px; font-size: 0.66rem; color: #94a3b8; text-align: left; }
  .docs-shots-thumb.active span { color: #bfdbfe; }
  @media (max-width: 860px) {
    .docs-shots-viewer { padding: 14px 46px; }
    .docs-shots-arrow.prev { left: 4px; }
    .docs-shots-arrow.next { right: 4px; }
  }
  @media (max-width: 860px) {
    .docs-shell { flex-direction: column; }
    .docs-menu { width: 100%; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid #1e293b; }
    .docs-nav { display: flex; overflow-x: auto; padding: 6px; }
    .docs-nav-item { white-space: nowrap; margin: 0 2px; }
    .docs-brand { display: none; }
    .docs-menu-footer { display: none; }
  }
</style>
</head>

<script type="application/json" id="code-payload">{"html":{"name":"NewsGenerator.html","src":"../app/NewsGenerator.html","content":"<div class=\"ng-app\" id=\"ng-app\">\r\n\r\n  <!-- ═══════ TOP BAR ═══════ -->\r\n  <header class=\"ng-topbar\">\r\n    <div class=\"ng-brand\">\r\n      <span class=\"ng-logo\">📰<\/span>\r\n      <div class=\"ng-brand-txt\">\r\n        <strong>News Page Studio<\/strong>\r\n        <span id=\"ng-story-title\">No story yet — describe the event in the AI Newsroom<\/span>\r\n      <\/div>\r\n    <\/div>\r\n    <div class=\"ng-top-actions\">\r\n      <span class=\"ng-chip\" id=\"ng-page-chip\">📄 No page<\/span>\r\n      <span class=\"ng-chip ng-chip-dim\" id=\"ng-ver-chip\">v0<\/span>\r\n      <button class=\"ng-btn ng-btn-accent\" id=\"ng-btn-generate\" title=\"Build or rebuild the page from the story brief + chat\">⚡ Generate Page<\/button>\r\n      <button class=\"ng-btn\" id=\"ng-btn-save\" title=\"Stage the value and request an immediate CMS save\">💾 Save<\/button>\r\n      <span class=\"ng-userchip\" id=\"ng-user-chip\">…<\/span>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <!-- ═══════ WORKSPACE ═══════ -->\r\n  <div class=\"ng-workspace\">\r\n\r\n    <!-- ───── AI NEWSROOM (chat sidebar) ───── -->\r\n    <aside class=\"ng-side\" id=\"ng-side\">\r\n      <div class=\"ng-side-head\">\r\n        <span class=\"ng-side-title\">🤖 AI Newsroom<\/span>\r\n        <div class=\"ng-side-head-btns\">\r\n          <button class=\"ng-iconbtn\" id=\"ng-btn-interview\" title=\"Interview mode — the AI interviews you question by question to gather the facts\">🎙 Interview<\/button>\r\n          <button class=\"ng-iconbtn\" id=\"ng-btn-newchat\" title=\"Clear this conversation (the page is kept)\">↺ New chat<\/button>\r\n        <\/div>\r\n      <\/div>\r\n\r\n      <div class=\"ng-chat-body\" id=\"ng-chat-body\">\r\n        <div class=\"ng-chat-empty\" id=\"ng-chat-empty\">\r\n          <div class=\"ng-chat-empty-emoji\">🗞️<\/div>\r\n          <p><b>Tell the AI about the event.<\/b> Paste a press note, list the facts, or drop links — it will keep asking until the story is complete, then compose the page.<\/p>\r\n          <p class=\"ng-chat-empty-sub\">Try: <i>\"A community solar farm opened in Izmir today — 4,000 panels, will power 1,200 homes…\"<\/i><\/p>\r\n        <\/div>\r\n      <\/div>\r\n\r\n      <div class=\"ng-chips\" id=\"ng-chips\"><\/div>\r\n\r\n      <div class=\"ng-chat-foot\">\r\n        <textarea id=\"ng-chat-input\" rows=\"2\" placeholder=\"Describe the event, paste a press note, or ask for changes…\"><\/textarea>\r\n        <div class=\"ng-chat-actions\">\r\n          <span class=\"ng-chat-hint\" id=\"ng-chat-hint\">Enter ↵ to send · Shift+Enter for new line<\/span>\r\n          <button class=\"ng-btn ng-btn-accent\" id=\"ng-btn-send\">Send ✦<\/button>\r\n        <\/div>\r\n      <\/div>\r\n    <\/aside>\r\n\r\n    <!-- ───── MAIN PANELS ───── -->\r\n    <main class=\"ng-main\">\r\n      <nav class=\"ng-tabs\" id=\"ng-tabs\">\r\n        <button class=\"ng-tab active\" data-tab=\"preview\">👁 Preview<\/button>\r\n        <button class=\"ng-tab\" data-tab=\"gallery\">🎨 Gallery & Theme<\/button>\r\n        <button class=\"ng-tab\" data-tab=\"story\">📝 Story<\/button>\r\n        <button class=\"ng-tab\" data-tab=\"code\">⌨ Code<\/button>\r\n        <button class=\"ng-tab\" data-tab=\"publish\">🚀 Publish<\/button>\r\n      <\/nav>\r\n\r\n      <!-- ── PREVIEW ── -->\r\n      <section class=\"ng-pane active\" id=\"pane-preview\">\r\n        <div class=\"ng-prev-toolbar\">\r\n          <div class=\"ng-device-group\" id=\"ng-device-group\">\r\n            <button class=\"ng-device active\" data-dev=\"mobile\" title=\"Mobile 390px\">📱<\/button>\r\n            <button class=\"ng-device\" data-dev=\"tablet\" title=\"Tablet 768px\">📟<\/button>\r\n            <button class=\"ng-device\" data-dev=\"desktop\" title=\"Desktop — fill width\">🖥<\/button>\r\n            <button class=\"ng-device\" data-dev=\"all\" title=\"Device lab — all three side by side\">🗂 Lab<\/button>\r\n          <\/div>\r\n          <span class=\"ng-prev-meta\" id=\"ng-prev-meta\">—<\/span>\r\n          <span class=\"ng-spacer\"><\/span>\r\n          <button class=\"ng-btn ng-btn-ghost\" id=\"ng-btn-rerun\" title=\"Re-run the page scripts in the preview\">⟳ Re-run<\/button>\r\n        <\/div>\r\n        <div class=\"ng-prev-stage\" id=\"ng-prev-stage\">\r\n          <div class=\"ng-prev-viewport\" id=\"ng-prev-viewport\"><\/div>\r\n          <div class=\"ng-empty-prev\" id=\"ng-empty-prev\">\r\n            <div class=\"ng-empty-prev-emoji\">🗞️<\/div>\r\n            <h3>No page yet<\/h3>\r\n            <p>Describe the event in the <b>AI Newsroom<\/b>, or pick a story template in <b>🎨 Gallery & Theme<\/b>, then press <b>⚡ Generate Page<\/b>.<br>The generated page will appear here exactly as visitors will see it — animations, polls, charts and all.<\/p>\r\n            <button class=\"ng-btn ng-btn-accent\" id=\"ng-btn-generate-empty\">⚡ Generate Page<\/button>\r\n          <\/div>\r\n        <\/div>\r\n        <details class=\"ng-console\" id=\"ng-console-wrap\">\r\n          <summary>🖥 Preview console <span class=\"ng-console-count\" id=\"ng-console-count\"><\/span><\/summary>\r\n          <div class=\"ng-console-out\" id=\"ng-console-out\">\r\n            <div class=\"ng-console-line ng-console-dim\">Script logs and errors from the preview appear here.<\/div>\r\n          <\/div>\r\n        <\/details>\r\n      <\/section>\r\n\r\n      <!-- ── GALLERY & THEME ── -->\r\n      <section class=\"ng-pane\" id=\"pane-gallery\">\r\n        <div class=\"ng-story-head\">\r\n          <h2>🎨 Component gallery & theme<\/h2>\r\n          <p>Every available component rendered with the <b>current color set<\/b>. Pick a color set — it applies to the gallery below AND to the generated page instantly (no AI call needed). <b>＋ Insert<\/b> adds a component to the current page plan.<\/p>\r\n        <\/div>\r\n        <div class=\"ng-gallery-tools\">\r\n          <div class=\"ng-colorsets\" id=\"ng-colorsets\" role=\"radiogroup\" aria-label=\"Color sets\"><\/div>\r\n          <span class=\"ng-spacer\"><\/span>\r\n          <span class=\"ng-chip ng-chip-dim\" id=\"ng-archetype-chip\">🧭 archetype: —<\/span>\r\n        <\/div>\r\n        <div class=\"ng-templates-wrap\" id=\"ng-templates-wrap\"><\/div>\r\n        <div class=\"ng-gallery-grid\" id=\"ng-gallery-grid\"><\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🧪 Component unit tests<\/span><span id=\"ng-comptest-score\"><\/span><\/div>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-comptest\" type=\"button\">Run component tests<\/button>\r\n          <ul class=\"ng-pub-checks\" id=\"ng-comptest-list\"><\/ul>\r\n        <\/div>\r\n      <\/section>\r\n\r\n      <!-- ── STORY BRIEF ── -->\r\n      <section class=\"ng-pane\" id=\"pane-story\">\r\n        <div class=\"ng-story-head\">\r\n          <h2>📝 Story Brief<\/h2>\r\n          <p>These are the <b>facts of record<\/b>. The AI reads them on every generation, so the page always reflects the latest truth. The AI also keeps its own editorial notes in the chat.<\/p>\r\n          <div class=\"ng-archetype-bar\" id=\"ng-archetype-bar\"><\/div>\r\n        <\/div>\r\n        <div class=\"ng-brief-grid\">\r\n          <label class=\"ng-field ng-field-wide\">\r\n            <span>Headline / working title *<\/span>\r\n            <input type=\"text\" id=\"bf-title\" placeholder=\"e.g. Solar Farm Opens, Powering 1,200 Homes\" maxlength=\"160\">\r\n          <\/label>\r\n          <label class=\"ng-field\">\r\n            <span>URL slug (auto)<\/span>\r\n            <input type=\"text\" id=\"bf-slug\" placeholder=\"auto\" maxlength=\"120\">\r\n            <em class=\"ng-field-hint\">Leave empty to auto-generate from the title.<\/em>\r\n          <\/label>\r\n          <label class=\"ng-field\">\r\n            <span>Category / kicker<\/span>\r\n            <input type=\"text\" id=\"bf-category\" placeholder=\"e.g. ENERGY · CITY\" maxlength=\"60\">\r\n          <\/label>\r\n          <label class=\"ng-field\">\r\n            <span>Author / byline<\/span>\r\n            <input type=\"text\" id=\"bf-author\" placeholder=\"e.g. Newsroom\" maxlength=\"80\">\r\n          <\/label>\r\n          <label class=\"ng-field\">\r\n            <span>Event date<\/span>\r\n            <input type=\"text\" id=\"bf-date\" placeholder=\"e.g. 2026-08-19 or August 19, 2026\" maxlength=\"60\">\r\n          <\/label>\r\n          <label class=\"ng-field\">\r\n            <span>Location<\/span>\r\n            <input type=\"text\" id=\"bf-location\" placeholder=\"e.g. Izmir, Türkiye\" maxlength=\"120\">\r\n          <\/label>\r\n          <label class=\"ng-field\">\r\n            <span>Page language<\/span>\r\n            <select id=\"bf-language\">\r\n              <option value=\"en\">English<\/option>\r\n              <option value=\"tr\">Türkçe<\/option>\r\n              <option value=\"de\">Deutsch<\/option>\r\n              <option value=\"fr\">Français<\/option>\r\n              <option value=\"es\">Español<\/option>\r\n              <option value=\"ar\">العربية<\/option>\r\n            <\/select>\r\n          <\/label>\r\n          <label class=\"ng-field ng-field-wide\">\r\n            <span>Hero image URL<\/span>\r\n            <input type=\"text\" id=\"bf-heroimage\" placeholder=\"https://… (optional — AI can also pick fitting visuals)\" maxlength=\"500\">\r\n          <\/label>\r\n          <label class=\"ng-field ng-field-wide\">\r\n            <span>Summary (1–3 sentences of the story)<\/span>\r\n            <textarea id=\"bf-summary\" rows=\"3\" placeholder=\"What happened, why it matters…\"><\/textarea>\r\n          <\/label>\r\n          <label class=\"ng-field ng-field-wide\">\r\n            <span>Tags (comma separated)<\/span>\r\n            <input type=\"text\" id=\"bf-tags\" placeholder=\"solar, energy, izmir\" maxlength=\"200\">\r\n          <\/label>\r\n          <label class=\"ng-field ng-field-wide\">\r\n            <span>Sources & links (one per line: <i>Name | https://url<\/i>)<\/span>\r\n            <textarea id=\"bf-sources\" rows=\"3\" placeholder=\"City Press Office | https://…\"><\/textarea>\r\n          <\/label>\r\n        <\/div>\r\n        <div class=\"ng-story-actions\">\r\n          <button class=\"ng-btn\" id=\"ng-btn-brief-save\">💾 Save brief<\/button>\r\n          <button class=\"ng-btn ng-btn-ghost\" id=\"ng-btn-brief-generate\">⚡ Save & regenerate page<\/button>\r\n          <span class=\"ng-brief-status\" id=\"ng-brief-status\"><\/span>\r\n        <\/div>\r\n\r\n        <div class=\"ng-phase2-lab\">\r\n          <div class=\"ng-lab-row\">\r\n            <div class=\"ng-lab-box\">\r\n              <strong>✍️ Headline lab<\/strong>\r\n              <small>Five headline variants; click one to apply to hero + SEO title.<\/small>\r\n              <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-headline-lab\">Generate headlines<\/button>\r\n              <div class=\"ng-lab-results\" id=\"ng-headline-results\"><\/div>\r\n            <\/div>\r\n            <div class=\"ng-lab-box\">\r\n              <strong>🎬 Standfirst & social deck<\/strong>\r\n              <small>Auto-write the standfirst + share decks for X / Facebook / WhatsApp.<\/small>\r\n              <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-deck-lab\">Generate deck copy<\/button>\r\n              <div class=\"ng-lab-results\" id=\"ng-deck-results\"><\/div>\r\n            <\/div>\r\n            <div class=\"ng-lab-box\">\r\n              <strong>🔗 Draft from URL<\/strong>\r\n              <small>Paste a press release or article URL — extract, draft the brief, then compose.<\/small>\r\n              <div class=\"ng-draft-row\">\r\n                <input type=\"text\" id=\"ng-draft-url\" placeholder=\"https://…\">\r\n                <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-draft-url\">Draft<\/button>\r\n              <\/div>\r\n            <\/div>\r\n          <\/div>\r\n          <div class=\"ng-lab-row\">\r\n            <div class=\"ng-lab-box ng-lab-wide\">\r\n              <strong>🎚️ Tone & style sliders<\/strong>\r\n              <small>Applied to every AI prompt and saved with this story.<\/small>\r\n              <div class=\"ng-sliders\">\r\n                <label class=\"ng-slider\"><span>Serious ↔ Lively<\/span><input type=\"range\" id=\"ng-tone-lively\" min=\"-2\" max=\"2\" step=\"1\" value=\"0\"><\/label>\r\n                <label class=\"ng-slider\"><span>Dense ↔ Scannable<\/span><input type=\"range\" id=\"ng-tone-dense\" min=\"-2\" max=\"2\" step=\"1\" value=\"0\"><\/label>\r\n                <label class=\"ng-slider\"><span>Formal ↔ Conversational<\/span><input type=\"range\" id=\"ng-tone-formal\" min=\"-2\" max=\"2\" step=\"1\" value=\"0\"><\/label>\r\n              <\/div>\r\n            <\/div>\r\n            <div class=\"ng-lab-box ng-lab-wide\">\r\n              <strong>📎 Source manager<\/strong>\r\n              <small>Paste URLs (one per line) and extract their text — the AI cites these when writing.<\/small>\r\n              <div class=\"ng-draft-row ng-src-row\">\r\n                <textarea id=\"ng-src-urls\" rows=\"2\" placeholder=\"https://…\"><\/textarea>\r\n                <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-src-extract\">Extract<\/button>\r\n              <\/div>\r\n              <div class=\"ng-lab-results\" id=\"ng-src-results\"><\/div>\r\n            <\/div>\r\n          <\/div>\r\n          <div class=\"ng-lab-row\">\r\n            <div class=\"ng-lab-box\">\r\n              <strong>🌐 Language variants<\/strong>\r\n              <small>Translate the whole plan — same contentId, ready for language routing.<\/small>\r\n              <div class=\"ng-draft-row\">\r\n                <select id=\"ng-ml-lang\" aria-label=\"Target language\">\r\n                  <option value=\"en\">English<\/option>\r\n                  <option value=\"tr\">Türkçe<\/option>\r\n                  <option value=\"de\">Deutsch<\/option>\r\n                  <option value=\"fr\">Français<\/option>\r\n                  <option value=\"es\">Español<\/option>\r\n                  <option value=\"ar\">العربية<\/option>\r\n                <\/select>\r\n                <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-translate\">Translate page<\/button>\r\n              <\/div>\r\n              <div class=\"ng-lab-results\" id=\"ng-translate-result\"><\/div>\r\n            <\/div>\r\n            <div class=\"ng-lab-box\">\r\n              <strong>🤖 Agentic build<\/strong>\r\n              <small>The AI plans 2–4 build steps, then executes each one in sequence.<\/small>\r\n              <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-agentic\">Plan &amp; run build<\/button>\r\n            <\/div>\r\n            <div class=\"ng-lab-box\">\r\n              <strong>⚖ A/B composer<\/strong>\r\n              <small>Two alternative pages — human interest vs data driven. Preview both, keep one.<\/small>\r\n              <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-ab\">Compose A/B variants<\/button>\r\n            <\/div>\r\n          <\/div>\r\n          <div class=\"ng-lab-row\">\r\n            <div class=\"ng-lab-box ng-lab-wide\">\r\n              <strong>🧭 House preference (prompt optimizer)<\/strong>\r\n              <small>Learned from your 👍/👎 prompt votes and injected into every AI call. Editable.<\/small>\r\n              <textarea id=\"ng-extra-prompt\" rows=\"2\" placeholder=\"e.g. Always use short paragraphs, quote at least two named people, keep it under 600 words…\"><\/textarea>\r\n              <button class=\"ng-btn ng-btn-sm\" id=\"ng-btn-prompt-opt\">✨ Optimize with AI<\/button>\r\n              <div class=\"ng-lab-results\" id=\"ng-prompt-opt-result\"><\/div>\r\n            <\/div>\r\n          <\/div>\r\n        <\/div>\r\n      <\/section>\r\n\r\n      <!-- ── CODE ── -->\r\n      <section class=\"ng-pane\" id=\"pane-code\">\r\n        <div class=\"ng-code-bar\">\r\n          <div class=\"ng-code-tabs\" id=\"ng-code-tabs\">\r\n            <button class=\"ng-codetab active\" data-code=\"html\">HTML<\/button>\r\n            <button class=\"ng-codetab\" data-code=\"css\">CSS<\/button>\r\n            <button class=\"ng-codetab\" data-code=\"js\">JS<\/button>\r\n            <button class=\"ng-codetab\" data-code=\"seo\">SEO<\/button>\r\n            <button class=\"ng-codetab\" data-code=\"meta\">PAGE META<\/button>\r\n            <button class=\"ng-codetab\" data-code=\"config\">CMS CONFIG<\/button>\r\n          <\/div>\r\n          <span class=\"ng-spacer\"><\/span>\r\n          <span class=\"ng-code-meta\" id=\"ng-code-meta\"><\/span>\r\n        <\/div>\r\n        <textarea class=\"ng-code-out\" id=\"ng-code-out\" readonly spellcheck=\"false\" wrap=\"off\"><\/textarea>\r\n        <div class=\"ng-code-actions\">\r\n          <button class=\"ng-btn\" id=\"ng-btn-copy-current\">📋 Copy this section<\/button>\r\n          <button class=\"ng-btn\" id=\"ng-btn-copy-all\">📋 Copy generator output (=== sections)<\/button>\r\n          <button class=\"ng-btn\" id=\"ng-btn-download\">⬇ Download standalone .html<\/button>\r\n          <button class=\"ng-btn ng-btn-ghost\" id=\"ng-btn-export-pdf\">🖨 Print / PDF<\/button>\r\n        <\/div>\r\n        <p class=\"ng-code-note\">The code is compiled from the AI's component plan by the tool itself — the AI never writes raw page code. Every section is scoped to <code>.news-<i>slug<\/i><\/code>, idempotent, and passes the platform guardrails.<\/p>\r\n      <\/section>\r\n\r\n      <!-- ── PUBLISH ── -->\r\n      <section class=\"ng-pane\" id=\"pane-publish\">\r\n        <div class=\"ng-pub-head\">\r\n          <h2>🚀 Publish the story<\/h2>\r\n          <p>Two routes into the platform — pick whichever fits your CMS workflow.<\/p>\r\n        <\/div>\r\n        <div class=\"ng-pub-cards\">\r\n          <div class=\"ng-pub-card\">\r\n            <h3>1 · Page object JSON<\/h3>\r\n            <p>One JSON that contains everything: <code>name<\/code>, <code>slug<\/code>, <code>data.htmlPage.code.{html,css,js}<\/code> and <code>seo<\/code>. Create the page object in your site app with this payload.<\/p>\r\n            <button class=\"ng-btn ng-btn-accent\" id=\"ng-btn-copy-pageobj\">📦 Copy Page Object JSON<\/button>\r\n          <\/div>\r\n          <div class=\"ng-pub-card\">\r\n            <h3>2 · Generator output<\/h3>\r\n            <p>The plain <code>=== HTML / CSS / JS / SEO / PAGE META ===<\/code> sections used by the page generator — paste into the CMS tool builder fields.<\/p>\r\n            <button class=\"ng-btn\" id=\"ng-btn-copy-gen\">📋 Copy generator output<\/button>\r\n          <\/div>\r\n          <div class=\"ng-pub-card\">\r\n            <h3>3 · Proof & share<\/h3>\r\n            <p>Open a standalone HTML copy for quick proofing, or send it to the CMS print pipeline as a PDF.<\/p>\r\n            <button class=\"ng-btn\" id=\"ng-btn-download2\">⬇ Download standalone .html<\/button>\r\n            <button class=\"ng-btn ng-btn-ghost\" id=\"ng-btn-export-pdf2\">🖨 Print / PDF<\/button>\r\n          <\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-json-wrap\">\r\n          <div class=\"ng-pub-json-head\">\r\n            <span>Page object JSON preview<\/span>\r\n            <button class=\"ng-btn ng-btn-ghost ng-btn-sm\" id=\"ng-btn-refresh-pub\">⟳ Refresh<\/button>\r\n          <\/div>\r\n          <pre class=\"ng-pub-json\" id=\"ng-pub-json\">No page generated yet.<\/pre>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🧪 Platform guardrail checks<\/span><span id=\"ng-check-score\"><\/span><\/div>\r\n          <ul class=\"ng-pub-checks\" id=\"ng-pub-checks\"><\/ul>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🔍 SEO & schema scorecard<\/span><span class=\"ng-seo-score\" id=\"ng-seo-score\"><\/span><\/div>\r\n          <ul class=\"ng-pub-checks\" id=\"ng-seo-list\"><\/ul>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>✅ Pre-flight checklist<\/span><span id=\"ng-checklist-score\"><\/span><\/div>\r\n          <div class=\"ng-checklist\" id=\"ng-checklist-list\"><\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🕵️ Fact-check assistant<\/span><span id=\"ng-factcheck-score\"><\/span><\/div>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-factcheck\" type=\"button\">Check draft against sources<\/button>\r\n          <ul class=\"ng-pub-checks\" id=\"ng-factcheck-list\"><\/ul>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>📊 Performance budget<\/span><span id=\"ng-perf-score\"><\/span><\/div>\r\n          <div class=\"ng-perf\" id=\"ng-perf-list\"><\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>📇 Social card preview<\/span><span id=\"ng-social-meta\"><\/span><\/div>\r\n          <div class=\"ng-social\" id=\"ng-social-preview\"><\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🖼️ Image credits<\/span><span id=\"ng-credits-score\"><\/span><\/div>\r\n          <div class=\"ng-credits\" id=\"ng-credits-list\"><\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🕘 Version history<\/span><span id=\"ng-history-count\"><\/span><\/div>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-history\" type=\"button\">Open history<\/button>\r\n          <div class=\"ng-history\" id=\"ng-history-list\"><\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>👥 Review workflow<\/span><span id=\"ng-review-badge\"><\/span><\/div>\r\n          <div class=\"ng-review\">\r\n            <select id=\"ng-review-status\" aria-label=\"Review status\">\r\n              <option value=\"draft\">✏️ Draft<\/option>\r\n              <option value=\"review\">🔍 In review<\/option>\r\n              <option value=\"approved\">✅ Approved<\/option>\r\n            <\/select>\r\n            <input type=\"text\" id=\"ng-review-note\" placeholder=\"Editor note…\" maxlength=\"300\">\r\n          <\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>📧 Notify editors<\/span><\/div>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-notify\" type=\"button\">📧 Send “story ready for review” email<\/button>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>⏰ Scheduled publish<\/span><\/div>\r\n          <div class=\"ng-publish-at-row\">\r\n            <input type=\"datetime-local\" id=\"ng-publish-at\" aria-label=\"Scheduled publish time\">\r\n            <span class=\"ng-hint\" id=\"ng-publish-at-hint\"><\/span>\r\n          <\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🚀 One-click CMS page object<\/span><\/div>\r\n          <p class=\"ng-hint\">Creates the page object (name, slug, htmlPage.code, seo) directly in the CMS, then asks the CMS to open it. Object type comes from the <code>pageTypeId<\/code> param or the dialog.<\/p>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-pageobj\" type=\"button\">📄 Create CMS page object…<\/button>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🔗 Related stories picker<\/span><\/div>\r\n          <p class=\"ng-hint\">Query a CMS object type, tick stories, and inject them into the page’s related block. Source type from the <code>relatedTypeId<\/code> param or the dialog.<\/p>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-related\" type=\"button\">🔍 Pick related stories…<\/button>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>✉ Email newsletter edition<\/span><\/div>\r\n          <div class=\"ng-email\" id=\"ng-email-edition\"><\/div>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-email\" type=\"button\">✉ Write email edition<\/button>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🖋 Style & cliché lint<\/span><span id=\"ng-lint-score\"><\/span><\/div>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-lint\" type=\"button\">Run draft lint<\/button>\r\n          <button class=\"ng-btn ng-btn-sm ng-comptest-run\" id=\"ng-btn-style\" type=\"button\">🖋 AI style review<\/button>\r\n          <div class=\"ng-lint\" id=\"ng-lint-results\"><\/div>\r\n        <\/div>\r\n        <div class=\"ng-pub-check-wrap\">\r\n          <div class=\"ng-pub-json-head\"><span>🧭 Prompt lab<\/span><\/div>\r\n          <p class=\"ng-hint\">Prompts that produced pages — vote on them and the optimizer learns your house style.<\/p>\r\n          <div class=\"ng-prompt-lab\" id=\"ng-prompt-lab\"><\/div>\r\n        <\/div>\r\n      <\/section>\r\n    <\/main>\r\n  <\/div>\r\n\r\n  <!-- ═══════ STATUS STRIP ═══════ -->\r\n  <footer class=\"ng-statusbar\" id=\"ng-statusbar\">\r\n    <span id=\"ng-status-text\">Ready — waiting for the story.<\/span>\r\n  <\/footer>\r\n\r\n  <!-- ═══════ MODAL (history / diffs) ═══════ -->\r\n  <div class=\"ng-modal-overlay\" id=\"ng-modal-overlay\" style=\"display:none\">\r\n    <div class=\"ng-modal-box\">\r\n      <div class=\"ng-modal-head\">\r\n        <span id=\"ng-modal-title\">Modal<\/span>\r\n        <button class=\"ng-iconbtn\" id=\"ng-modal-close\" type=\"button\">✕<\/button>\r\n      <\/div>\r\n      <div class=\"ng-modal-body\" id=\"ng-modal-body\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"NewsGenerator.css","src":"../app/NewsGenerator.css","content":"/* ═══════════════════════════════════════════════════════════════════\r\n   NewsGenerator — tool UI styles (dark studio theme).\r\n   All selectors scoped under .ng- (generated page code never uses .ng-).\r\n   ═══════════════════════════════════════════════════════════════════ */\r\n.ng-app {\r\n  --ng-bg: #0f1220;\r\n  --ng-panel: #171a2c;\r\n  --ng-panel-2: #1d2137;\r\n  --ng-line: #2a2f4d;\r\n  --ng-text: #e8eaf6;\r\n  --ng-dim: #9aa1c0;\r\n  --ng-accent: #f59e0b;\r\n  --ng-accent-2: #fbbf24;\r\n  --ng-indigo: #6366f1;\r\n  --ng-good: #34d399;\r\n  --ng-bad: #f87171;\r\n  --ng-warn: #fbbf24;\r\n  font-family: \"Segoe UI\", system-ui, -apple-system, sans-serif;\r\n  background: var(--ng-bg);\r\n  color: var(--ng-text);\r\n  display: flex;\r\n  flex-direction: column;\r\n  height: 100vh;\r\n  min-height: 480px;\r\n  overflow: hidden;\r\n}\r\n.ng-app *, .ng-app *::before, .ng-app *::after { box-sizing: border-box; }\r\n\r\n/* ── Top bar ── */\r\n.ng-topbar {\r\n  display: flex; align-items: center; gap: 14px;\r\n  padding: 10px 16px;\r\n  background: linear-gradient(180deg, #191d33, #14172a);\r\n  border-bottom: 1px solid var(--ng-line);\r\n  flex: 0 0 auto;\r\n}\r\n.ng-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }\r\n.ng-logo {\r\n  font-size: 22px; line-height: 1;\r\n  background: linear-gradient(135deg, #2b3058, #3b3f78);\r\n  border: 1px solid #454b85;\r\n  border-radius: 10px; padding: 8px;\r\n  box-shadow: 0 4px 14px rgba(0,0,0,.35);\r\n}\r\n.ng-brand-txt { display: flex; flex-direction: column; min-width: 0; }\r\n.ng-brand-txt strong { font-size: 14.5px; letter-spacing: .2px; }\r\n.ng-brand-txt span {\r\n  font-size: 11.5px; color: var(--ng-dim);\r\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px;\r\n}\r\n.ng-top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }\r\n\r\n.ng-chip {\r\n  font-size: 11px; font-weight: 600; letter-spacing: .3px;\r\n  padding: 5px 10px; border-radius: 999px;\r\n  background: rgba(245,158,11,.14); color: var(--ng-accent-2);\r\n  border: 1px solid rgba(245,158,11,.35);\r\n  white-space: nowrap;\r\n}\r\n.ng-chip-dim { background: rgba(148,163,184,.1); color: var(--ng-dim); border-color: var(--ng-line); }\r\n.ng-chip-good { background: rgba(52,211,153,.12); color: var(--ng-good); border-color: rgba(52,211,153,.35); }\r\n.ng-userchip {\r\n  font-size: 11.5px; color: var(--ng-dim);\r\n  padding: 6px 10px; border: 1px solid var(--ng-line); border-radius: 999px;\r\n  max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\r\n}\r\n\r\n/* ── Buttons ── */\r\n.ng-btn {\r\n  font: inherit; font-size: 12.5px; font-weight: 600;\r\n  color: var(--ng-text);\r\n  background: var(--ng-panel-2);\r\n  border: 1px solid var(--ng-line);\r\n  border-radius: 9px; padding: 8px 13px; cursor: pointer;\r\n  transition: background .15s, border-color .15s, transform .05s;\r\n  white-space: nowrap;\r\n}\r\n.ng-btn:hover { background: #252a45; border-color: #3a4068; }\r\n.ng-btn:active { transform: translateY(1px); }\r\n.ng-btn:focus-visible { outline: 2px solid var(--ng-accent); outline-offset: 2px; }\r\n.ng-btn-accent {\r\n  background: linear-gradient(135deg, #f59e0b, #f97316);\r\n  color: #201303; border-color: #fbbf24;\r\n  box-shadow: 0 2px 10px rgba(245,158,11,.28);\r\n}\r\n.ng-btn-accent:hover { background: linear-gradient(135deg, #fbbf24, #fb923c); color: #1a1002; }\r\n.ng-btn-ghost { background: transparent; }\r\n.ng-btn-ghost:hover { background: rgba(148,163,184,.08); }\r\n.ng-btn-sm { padding: 5px 9px; font-size: 11.5px; }\r\n.ng-btn[disabled], .ng-btn.ng-disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }\r\n.ng-iconbtn {\r\n  font: inherit; font-size: 12px; color: var(--ng-dim);\r\n  background: transparent; border: 1px solid var(--ng-line); border-radius: 8px;\r\n  padding: 5px 9px; cursor: pointer;\r\n}\r\n.ng-iconbtn:hover { color: var(--ng-text); background: var(--ng-panel-2); }\r\n.ng-side-head-btns { display: flex; gap: 6px; }\r\n.ng-iconbtn.ng-on { color: var(--ng-accent-2); border-color: var(--ng-accent); background: rgba(245,158,11,.12); }\r\n\r\n/* ── Workspace layout ── */\r\n.ng-workspace { flex: 1 1 auto; display: flex; min-height: 0; }\r\n\r\n/* ── Chat sidebar ── */\r\n.ng-side {\r\n  width: 372px; flex: 0 0 auto;\r\n  display: flex; flex-direction: column;\r\n  background: var(--ng-panel);\r\n  border-right: 1px solid var(--ng-line);\r\n  min-height: 0;\r\n}\r\n.ng-side-head {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 10px 12px; border-bottom: 1px solid var(--ng-line);\r\n  flex: 0 0 auto;\r\n}\r\n.ng-side-title { font-size: 13px; font-weight: 700; }\r\n.ng-chat-body { flex: 1 1 auto; overflow-y: auto; padding: 12px; min-height: 120px; }\r\n.ng-chat-body::-webkit-scrollbar { width: 8px; }\r\n.ng-chat-body::-webkit-scrollbar-thumb { background: #2c3152; border-radius: 4px; }\r\n\r\n.ng-chat-empty { text-align: center; color: var(--ng-dim); padding: 26px 10px; }\r\n.ng-chat-empty-emoji { font-size: 34px; margin-bottom: 8px; }\r\n.ng-chat-empty p { font-size: 12.5px; line-height: 1.55; margin: 8px 0; }\r\n.ng-chat-empty-sub { font-size: 11.5px; opacity: .8; }\r\n\r\n.ng-msg { margin-bottom: 12px; display: flex; flex-direction: column; }\r\n.ng-msg-user { align-items: flex-end; }\r\n.ng-msg-ai { align-items: flex-start; }\r\n.ng-bubble {\r\n  max-width: 92%;\r\n  padding: 9px 12px; border-radius: 14px;\r\n  font-size: 12.5px; line-height: 1.55;\r\n  white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;\r\n}\r\n.ng-msg-user .ng-bubble {\r\n  background: linear-gradient(135deg, #6366f1, #4f46e5);\r\n  border-bottom-right-radius: 4px; color: #eef0ff;\r\n}\r\n.ng-msg-ai .ng-bubble {\r\n  background: var(--ng-panel-2);\r\n  border: 1px solid var(--ng-line);\r\n  border-bottom-left-radius: 4px;\r\n}\r\n.ng-bubble.ng-bubble-stream { border-left: 2px solid var(--ng-accent); }\r\n.ng-bubble.ng-bubble-err { border-color: rgba(248,113,113,.5); color: #fecaca; background: rgba(248,113,113,.08); }\r\n.ng-msg-meta {\r\n  font-size: 10px; color: #6b7299; margin: 3px 4px 0; letter-spacing: .3px;\r\n}\r\n.ng-plan-card {\r\n  max-width: 94%; margin-top: 6px;\r\n  background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.35);\r\n  border-radius: 10px; padding: 8px 11px; font-size: 11.5px; color: #c7caf0;\r\n}\r\n.ng-plan-card b { color: #a5b4fc; }\r\n\r\n/* suggestion chips */\r\n.ng-chips { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 6px; flex: 0 0 auto; }\r\n.ng-chip-sug {\r\n  font: inherit; font-size: 11px; color: var(--ng-dim);\r\n  background: rgba(148,163,184,.07);\r\n  border: 1px dashed #3a4068; border-radius: 999px;\r\n  padding: 5px 10px; cursor: pointer; text-align: left;\r\n  transition: color .15s, border-color .15s;\r\n}\r\n.ng-chip-sug:hover { color: var(--ng-accent-2); border-color: var(--ng-accent); }\r\n.ng-chip-sug.ng-chip-accent { border-style: solid; color: var(--ng-accent-2); border-color: rgba(245,158,11,.45); }\r\n\r\n/* chat input */\r\n.ng-chat-foot { padding: 10px 12px; border-top: 1px solid var(--ng-line); flex: 0 0 auto; background: var(--ng-panel); }\r\n.ng-chat-foot textarea {\r\n  width: 100%; resize: vertical; min-height: 68px; max-height: 180px;\r\n  font: inherit; font-size: 12.5px; color: var(--ng-text);\r\n  background: var(--ng-bg); border: 1px solid var(--ng-line); border-radius: 10px;\r\n  padding: 9px 11px; outline: none;\r\n}\r\n.ng-chat-foot textarea:focus { border-color: var(--ng-indigo); }\r\n.ng-chat-foot textarea[disabled] { opacity: .5; }\r\n.ng-chat-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; }\r\n.ng-chat-hint { font-size: 10.5px; color: #6b7299; }\r\n\r\n/* ── Main panels ── */\r\n.ng-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }\r\n.ng-tabs {\r\n  display: flex; gap: 2px; padding: 0 12px;\r\n  background: var(--ng-panel); border-bottom: 1px solid var(--ng-line);\r\n  flex: 0 0 auto;\r\n}\r\n.ng-tab {\r\n  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ng-dim);\r\n  background: transparent; border: none; border-bottom: 2px solid transparent;\r\n  padding: 11px 14px; cursor: pointer;\r\n}\r\n.ng-tab:hover { color: var(--ng-text); }\r\n.ng-tab.active { color: var(--ng-accent-2); border-bottom-color: var(--ng-accent); }\r\n.ng-pane { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }\r\n.ng-pane.active { display: flex; }\r\n\r\n/* ── Preview pane ── */\r\n.ng-prev-toolbar {\r\n  display: flex; align-items: center; gap: 10px;\r\n  padding: 8px 12px; background: var(--ng-panel); border-bottom: 1px solid var(--ng-line);\r\n  flex: 0 0 auto;\r\n}\r\n.ng-spacer { flex: 1 1 auto; }\r\n.ng-device-group { display: flex; gap: 4px; }\r\n.ng-device {\r\n  font: inherit; font-size: 14px;\r\n  background: var(--ng-panel-2); border: 1px solid var(--ng-line);\r\n  border-radius: 8px; padding: 5px 9px; cursor: pointer; line-height: 1;\r\n}\r\n.ng-device.active { border-color: var(--ng-accent); background: rgba(245,158,11,.12); }\r\n.ng-prev-meta { font-size: 11.5px; color: var(--ng-dim); }\r\n.ng-prev-stage {\r\n  flex: 1 1 auto; min-height: 0; position: relative;\r\n  background:\r\n    radial-gradient(circle at 30% 20%, rgba(99,102,241,.08), transparent 45%),\r\n    radial-gradient(circle at 75% 75%, rgba(245,158,11,.05), transparent 40%),\r\n    #0b0d18;\r\n  display: flex; justify-content: center;\r\n  overflow: auto; padding: 18px;\r\n}\r\n.ng-prev-viewport { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; justify-content: center; align-items: stretch; }\r\n.ng-prev-frame {\r\n  width: 100%; max-width: 1280px; height: 100%;\r\n  background: #fff; border-radius: 8px; overflow: hidden;\r\n  box-shadow: 0 10px 40px rgba(0,0,0,.5);\r\n  transition: max-width .2s ease;\r\n}\r\n.ng-prev-frame[data-dev=\"mobile\"] { max-width: 390px; }\r\n.ng-prev-frame[data-dev=\"tablet\"] { max-width: 768px; }\r\n.ng-prev-viewport.ng-prev-lab { gap: 14px; align-items: stretch; }\r\n.ng-prev-viewport.ng-prev-lab .ng-prev-frame { height: 100%; max-height: none; }\r\n.ng-prev-viewport.ng-prev-lab .ng-lab-frame-m { flex: 0 0 340px; max-width: 340px; }\r\n.ng-prev-viewport.ng-prev-lab .ng-lab-frame-t { flex: 0 0 500px; max-width: 500px; }\r\n.ng-prev-viewport.ng-prev-lab .ng-lab-frame-d { flex: 1 1 0; min-width: 320px; }\r\n.ng-preview { width: 100%; height: 100%; border: none; display: block; background: #fff; }\r\n.ng-empty-prev {\r\n  position: absolute; inset: 0; margin: auto;\r\n  width: min(520px, 86%); height: max-content;\r\n  text-align: center; color: var(--ng-dim);\r\n  background: rgba(23,26,44,.85); border: 1px dashed #3a4068; border-radius: 16px;\r\n  padding: 34px 28px;\r\n}\r\n.ng-empty-prev h3 { margin: 6px 0; color: var(--ng-text); font-size: 16px; }\r\n.ng-empty-prev p { font-size: 12.5px; line-height: 1.6; }\r\n.ng-empty-prev .ng-btn { margin-top: 12px; }\r\n.ng-empty-prev-emoji { font-size: 40px; }\r\n\r\n.ng-console { flex: 0 0 auto; background: #0b0d18; border-top: 1px solid var(--ng-line); }\r\n.ng-console summary {\r\n  cursor: pointer; list-style: none; padding: 6px 14px;\r\n  font-size: 11.5px; color: var(--ng-dim); user-select: none;\r\n}\r\n.ng-console summary::-webkit-details-marker { display: none; }\r\n.ng-console[open] summary { border-bottom: 1px solid #1c1f35; }\r\n.ng-console-count { font-size: 10.5px; background: #1c1f35; border-radius: 99px; padding: 1px 7px; }\r\n.ng-console-out {\r\n  max-height: 170px; overflow-y: auto; padding: 6px 14px 10px;\r\n  font-family: Consolas, \"Cascadia Mono\", monospace; font-size: 11px; line-height: 1.5;\r\n}\r\n.ng-console-line { color: #9aa1c0; word-break: break-all; }\r\n.ng-console-line.ng-console-err { color: #fca5a5; }\r\n.ng-console-line.ng-console-warn { color: #fcd34d; }\r\n.ng-console-line.ng-console-dim { color: #5b6285; }\r\n\r\n/* ── Story brief ── */\r\n.ng-pane#pane-story { overflow-y: auto; padding: 18px 20px; display: none; }\r\n.ng-pane#pane-story.active { display: block; }\r\n.ng-story-head h2 { margin: 0 0 4px; font-size: 17px; }\r\n.ng-story-head p { margin: 0 0 16px; font-size: 12.5px; color: var(--ng-dim); max-width: 720px; line-height: 1.55; }\r\n.ng-brief-grid {\r\n  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;\r\n  max-width: 900px;\r\n}\r\n.ng-field { display: flex; flex-direction: column; gap: 5px; }\r\n.ng-field-wide { grid-column: 1 / -1; }\r\n.ng-field > span { font-size: 11.5px; font-weight: 700; color: #c3c8e4; letter-spacing: .2px; }\r\n.ng-field input, .ng-field textarea, .ng-field select {\r\n  font: inherit; font-size: 12.5px; color: var(--ng-text);\r\n  background: var(--ng-panel); border: 1px solid var(--ng-line); border-radius: 9px;\r\n  padding: 9px 11px; outline: none; width: 100%;\r\n}\r\n.ng-field textarea { resize: vertical; }\r\n.ng-field input:focus, .ng-field textarea:focus, .ng-field select:focus { border-color: var(--ng-indigo); }\r\n.ng-field input[disabled], .ng-field textarea[disabled], .ng-field select[disabled] { opacity: .5; }\r\n.ng-field-hint { font-size: 10.5px; color: #6b7299; font-style: normal; }\r\n.ng-story-actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; max-width: 900px; }\r\n.ng-brief-status { font-size: 11.5px; color: var(--ng-good); }\r\n\r\n/* ── Code pane ── */\r\n.ng-code-bar {\r\n  display: flex; align-items: center; gap: 10px;\r\n  padding: 8px 12px; background: var(--ng-panel); border-bottom: 1px solid var(--ng-line);\r\n  flex: 0 0 auto;\r\n}\r\n.ng-code-tabs { display: flex; gap: 4px; flex-wrap: wrap; }\r\n.ng-codetab {\r\n  font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .4px;\r\n  color: var(--ng-dim); background: transparent;\r\n  border: 1px solid transparent; border-radius: 7px; padding: 6px 11px; cursor: pointer;\r\n}\r\n.ng-codetab:hover { color: var(--ng-text); }\r\n.ng-codetab.active { color: var(--ng-accent-2); background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); }\r\n.ng-code-meta { font-size: 11px; color: #6b7299; }\r\n.ng-code-out {\r\n  flex: 1 1 auto; min-height: 0; width: 100%;\r\n  resize: none; border: none; outline: none;\r\n  background: #0b0d18; color: #cbd2ee;\r\n  font-family: Consolas, \"Cascadia Mono\", monospace; font-size: 12px; line-height: 1.55;\r\n  padding: 14px 16px; tab-size: 2; white-space: pre;\r\n}\r\n.ng-code-actions { display: flex; gap: 8px; padding: 10px 12px; flex: 0 0 auto; flex-wrap: wrap; }\r\n.ng-code-note { padding: 0 14px 12px; margin: 0; font-size: 11.5px; color: #6b7299; line-height: 1.5; }\r\n.ng-code-note code { background: #1c1f35; border-radius: 5px; padding: 1px 6px; font-size: 11px; color: #a5b4fc; }\r\n\r\n/* ── Publish pane ── */\r\n.ng-pane#pane-publish { overflow-y: auto; padding: 18px 20px; display: none; }\r\n.ng-pane#pane-publish.active { display: block; }\r\n.ng-pub-head h2 { margin: 0 0 4px; font-size: 17px; }\r\n.ng-pub-head p { margin: 0 0 16px; font-size: 12.5px; color: var(--ng-dim); }\r\n.ng-pub-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; max-width: 980px; }\r\n.ng-pub-card {\r\n  background: var(--ng-panel); border: 1px solid var(--ng-line); border-radius: 12px;\r\n  padding: 14px; display: flex; flex-direction: column; gap: 8px;\r\n}\r\n.ng-pub-card h3 { margin: 0; font-size: 13.5px; }\r\n.ng-pub-card p { margin: 0; font-size: 11.5px; color: var(--ng-dim); line-height: 1.55; flex: 1 1 auto; }\r\
