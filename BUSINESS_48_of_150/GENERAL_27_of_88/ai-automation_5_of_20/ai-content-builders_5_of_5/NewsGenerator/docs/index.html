play: flex; flex-direction: column; gap: 8px; font-size: 12px; }\r\n.ng-ab-col b { color: var(--ng-text); }\r\n.ng-ab-col .ng-diff-frame { height: 340px; }\r\n@media (max-width: 980px) { .ng-ab-results { grid-template-columns: 1fr; } }\r\n.ng-pageobj-pre { max-height: 300px; overflow: auto; font-size: 11px; }\r\n.ng-pageobj-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\r\n.ng-related-actions { display: flex; gap: 8px; flex-wrap: wrap; }\r\n.ng-related-rows { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }\r\n.ng-related-row { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ng-text); background: var(--ng-panel-2); border: 1px solid var(--ng-line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }\r\n.ng-related-row small { color: var(--ng-dim); }\r\n.ng-email-html { font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.5; }\r\n.ng-email-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; background: var(--ng-panel-2); border: 1px solid var(--ng-line); border-radius: 8px; padding: 8px 12px; }\r\n.ng-email-row b { color: var(--ng-text); flex: 1; }\r\n.ng-email-row span { color: var(--ng-dim); font-size: 11px; }\r\n.ng-email-actions { display: flex; gap: 8px; margin-top: 8px; }\r\n.ng-lint-list, .ng-style-list { margin: 0; padding: 0 0 0 16px; font-size: 12px; color: var(--ng-dim); display: flex; flex-direction: column; gap: 5px; }\r\n.ng-lint-list b, .ng-style-list b { color: var(--ng-text); }\r\n.ng-style-list li { line-height: 1.45; }\r\n.ng-style-list em { color: var(--ng-good); font-style: normal; }\r\n.ng-lint { padding: 8px 14px 14px; }\r\n.ng-prompt-lab { padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 6px; }\r\n.ng-prompt-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; background: var(--ng-panel-2); border: 1px solid var(--ng-line); border-radius: 8px; padding: 6px 10px; }\r\n.ng-prompt-snippet { flex: 1; color: var(--ng-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.ng-prompt-meta { color: var(--ng-dim); font-size: 10.5px; white-space: nowrap; }\r\n.ng-publish-at-row { padding: 8px 14px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }\r\n.ng-publish-at-row input {\r\n  font: inherit; font-size: 12px; color: var(--ng-text);\r\n  background: var(--ng-panel-2); border: 1px solid var(--ng-line); border-radius: 8px; padding: 7px 9px; outline: none;\r\n}\r\n.ng-publish-at-row .ng-hint { margin: 0; }\r\n.ng-email { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 8px; }\r\n\r\n/* ── Status bar ── */\r\n.ng-statusbar {\r\n  flex: 0 0 auto; padding: 6px 14px;\r\n  background: #131629; border-top: 1px solid var(--ng-line);\r\n  font-size: 11px; color: var(--ng-dim);\r\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\r\n}\r\n.ng-statusbar .ng-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #64748b; }\r\n.ng-statusbar .ng-dot.ng-dot-good { background: var(--ng-good); }\r\n.ng-statusbar .ng-dot.ng-dot-busy { background: var(--ng-accent); animation: ng-pulse 1s infinite; }\r\n.ng-statusbar .ng-dot.ng-dot-err { background: var(--ng-bad); }\r\n@keyframes ng-pulse { 50% { opacity: .35; } }\r\n\r\n/* streaming caret */\r\n.ng-caret { display: inline-block; animation: ng-blink 1s steps(2) infinite; color: var(--ng-accent); font-weight: 700; }\r\n@keyframes ng-blink { 50% { opacity: 0; } }\r\n\r\n/* lock badge */\r\n.ng-lockbadge {\r\n  display: none; font-size: 10px; font-weight: 700; letter-spacing: .6px;\r\n  color: #fecaca; background: rgba(248,113,113,.12);\r\n  border: 1px solid rgba(248,113,113,.4); border-radius: 999px; padding: 3px 8px;\r\n}\r\n.ng-app.ng-ro .ng-lockbadge { display: inline-block; }\r\n\r\n/* responsive tool chrome */\r\n@media (max-width: 980px) {\r\n  .ng-side { width: 300px; }\r\n  .ng-brand-txt span { max-width: 160px; }\r\n  .ng-brief-grid { grid-template-columns: 1fr; }\r\n}\r\n@media (max-width: 760px) {\r\n  .ng-workspace { flex-direction: column; }\r\n  .ng-side { width: 100%; height: 46%; border-right: none; border-bottom: 1px solid var(--ng-line); }\r\n  .ng-topbar { flex-wrap: wrap; }\r\n  .ng-top-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }\r\n}\r\n"},"js":{"name":"NewsGenerator.js","src":"../app/NewsGenerator.js","content":"/* ═══════════════════════════════════════════════════════════════════════\r\n   NewsGenerator — AI chat-driven news page generator (UniconHub html-tool)\r\n   ───────────────────────────────────────────────────────────────────────\r\n   • ONE news page per tool instance. The AI composes a JSON plan from a\r\n     pre-defined component catalog; THIS tool renders the HTML/CSS/JS.\r\n   • Generated code follows the embedded PAGE GENERATOR RULES (platform\r\n     public website contract) — the rules text is embedded at build time.\r\n   • Chat history persists in ai-chat-sessions-uniconbaseapps.\r\n   ═══════════════════════════════════════════════════════════════════════ */\r\n\r\n/* ── Embedded platform rules (injected by build script: JSON string with\r\n      every \"<\" escaped as \\u003c so the file is safe as an inline script) ── */\r\nvar PAGE_RULES = JSON.parse(\"\\\"PAGE GENERATOR RULES\\\\n====================\\\\nThese are the complete, active rules for generating pages for this\\\\nplatform. Every rule below is binding — generated HTML, CSS and JS must\\\\nrun exactly as described, through the page object schema, the window.gw\\\\nSDK and the platform APIs.\\\\n\\\\n----------------------------------------------------------------------------\\\\n0. WHAT YOU PRODUCE\\\\n----------------------------------------------------------------------------\\\\nProduce EXACTLY three code parts plus optional metadata, in this layout:\\\\n\\\\n    === HTML ===\\\\n    \\u003csection class=\\\\\\\"shop-home\\\\\\\"> ... body fragment ... \\u003c/section>\\\\n    === CSS ===\\\\n    .shop-home { ... }\\\\n    === JS ===\\\\n    (function () { ... })();\\\\n    === SEO ===\\\\n    { \\\\\\\"metaTitle\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"metaDesc\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"schemaItems\\\\\\\": [ ... ] }\\\\n    === PAGE META ===\\\\n    { \\\\\\\"name\\\\\\\": \\\\\\\"Shop\\\\\\\", \\\\\\\"slug\\\\\\\": \\\\\\\"shop\\\\\\\", \\\\\\\"meta\\\\\\\": { \\\\\\\"language\\\\\\\": \\\\\\\"en\\\\\\\" },\\\\n      \\\\\\\"data\\\\\\\": { \\\\\\\"status\\\\\\\": \\\\\\\"published\\\\\\\", \\\\\\\"requireAuth\\\\\\\": false } }\\\\n\\\\nMapping to the CMS page object (Section 2):\\\\n- HTML -> data.htmlPage.code.html\\\\n- CSS  -> data.htmlPage.code.css\\\\n- JS   -> data.htmlPage.code.js\\\\n- SEO  -> the object `seo` section (Section 14)\\\\n- PAGE META -> object fields `name`, `slug`, `meta.language`,\\\\n               `data.status`, `data.requireAuth`\\\\n\\\\nYou may also be asked to produce OTHER artifacts. The same HTML/CSS/JS\\\\ncontract applies everywhere except where noted:\\\\n- === CHROME ===         default-header / default-footer objects\\\\n                         (Section 12.4) — rendered on EVERY page.\\\\n- === TEMPLATE ===       a template page + its content objects\\\\n                         (Section 12.1) — routed at /t/\\u003cT>/\\u003ccontentId>.\\\\n- === EMAIL TEMPLATE === object with data.templateId for email hooks\\\\n                         (Section 12.2) — a full HTML document is allowed.\\\\n\\\\nCAPABILITY MAP (how to reach every platform feature):\\\\n  Static content      -> htmlPage.code html/css on any page object\\\\n  Site chrome         -> default-header / default-footer objects\\\\n  Reusable blocks     -> data.sections referencing shared objects\\\\n  Templates           -> template page + data.templateContentType\\\\n                         -> /t/\\u003cT>/\\u003ccontentId>\\\\n  Object detail pages -> object's own htmlPage -> /\\u003ctype>/\\u003cid>\\\\n  App pages           -> page with slug app-\\u003cappId> -> /app/\\u003cappId>/...\\\\n  Forms               -> \\u003cform data-gw-form> + gw.forms.bind()\\\\n                         -> POST /api/forms/submit\\\\n  Reads               -> gw.db.query / gw.db.get / gw.db.subscribe\\\\n  Writes              -> gw.db.operation -> POST /api/data/op\\\\n                         (CMS-defined operations ONLY)\\\\n  Multi-step flows    -> checkout-flow widget / POST /api/flow/[flowId]\\\\n  Cart                -> POST|GET /api/cart (+ menu/cart widgets)\\\\n  Search              -> GET /api/search (+ search-box widget)\\\\n  Account data        -> GET /api/account/{profile|orders|tickets|bookings}\\\\n  Payment             -> POST /api/pay/stripe/* (amount always server-side)\\\\n  Email               -> POST /api/email/send + data.templateId templates\\\\n  Realtime updates    -> gw.db.subscribe (SSE + polling fallback)\\\\n  Auth & gating       -> data.requireAuth + gw.getUser/login/logout\\\\n  Languages           -> meta.language + contentId siblings; gw.language\\\\n  Theme               -> --gw-color-* CSS vars + sharedCss (admin-owned)\\\\n  SEO / discovery     -> seo section; /sitemap.xml, /robots.txt, /llms.txt\\\\n  Analytics           -> site plugins (admin-owned); gw.track in pages\\\\n\\\\nIf the page needs an operation, a flow or an email template that the user\\\\nhas not confirmed exists, still generate the page but append:\\\\n\\\\n    === CMS CONFIG NEEDED ===\\\\n    { description of the operation/flow/template the CMS author must create }\\\\n\\\\n----------------------------------------------------------------------------\\\\n1. THE PAGE MODEL\\\\n----------------------------------------------------------------------------\\\\n- A tenant has apps; each app can host folders (sites). A site is a folder\\\\n  that contains an object with slug `default-settings` (Section 15).\\\\n- A PAGE is an object of the site's app type inside the website folder,\\\\n  routed by its object-level `slug`:\\\\n\\\\n    slug `home-page`            -> `/`\\\\n    any other slug `\\u003cslug>`     -> `/\\u003cslug>`\\\\n    any object of a registered\\\\n    object type                 -> `/\\u003ccmsObjectType>/\\u003cid>`   (object detail)\\\\n    template page with slug T   -> `/t/\\u003cT>/\\u003ccontentId>`\\\\n    page with slug `app-\\u003cappId>`-> `/app/\\u003cappId>/...`       (capability page)\\\\n\\\\n- Language comes from `meta.language`. There are NO locale path prefixes.\\\\n- Sibling pages = same `contentId`, other languages (hreflang + language\\\\n  switcher are handled by the platform).\\\\n- Reserved slugs that are NOT pages: `default-settings`, `default-header`,\\\\n  `default-footer`. Never generate pages with these slugs.\\\\n- The site chrome (header/footer) is rendered by the platform from the\\\\n  `default-header` / `default-footer` objects. Do NOT build your own global\\\\n  nav/header/footer unless the request explicitly says so.\\\\n- Object detail pages and template pages: full contracts in Section 12.1\\\\n  (object pages render their own htmlPage at `/\\u003ctype>/\\u003cid>`; templates\\\\n  route content objects through `/t/\\u003cT>/\\u003ccontentId>`).\\\\n- Reusable sections: `data.sections` composes shared objects into the page\\\\n  before the page's own content (full contract in Section 12.3).\\\\n\\\\n----------------------------------------------------------------------------\\\\n2. PAGE OBJECT SCHEMA\\\\n----------------------------------------------------------------------------\\\\n{\\\\n  \\\\\\\"id\\\\\\\": \\\\\\\"obj-123\\\\\\\", \\\\\\\"name\\\\\\\": \\\\\\\"About Us\\\\\\\", \\\\\\\"slug\\\\\\\": \\\\\\\"about\\\\\\\",\\\\n  \\\\\\\"meta\\\\\\\": { \\\\\\\"language\\\\\\\": \\\\\\\"en\\\\\\\" },\\\\n  \\\\\\\"data\\\\\\\": {\\\\n    \\\\\\\"status\\\\\\\": \\\\\\\"published\\\\\\\",        // OPTIONAL; absent = published.\\\\n                                  // Anything else = draft (hidden without\\\\n                                  // preview: ?gw-preview=\\u003cpreviewSecret>).\\\\n    \\\\\\\"requireAuth\\\\\\\": true,          // OPTIONAL. Anonymous visitors are\\\\n                                  // redirected to /p/user/login?returnUrl=...\\\\n    \\\\\\\"templateContentType\\\\\\\": \\\\\\\"trips\\\\\\\", // TEMPLATE PAGES ONLY\\\\n    \\\\\\\"sections\\\\\\\": [                 // OPTIONAL. Reusable sections —\\\\n      { \\\\\\\"cmsObjectType\\\\\\\": \\\\\\\"shared-sections\\\\\\\", \\\\\\\"objectId\\\\\\\": \\\\\\\"obj-cta\\\\\\\" }\\\\n    ],                            // ordered, flat only, max 20 entries.\\\\n    \\\\\\\"htmlPage\\\\\\\": {                  // FIXED field name of the html tool\\\\n      \\\\\\\"code\\\\\\\": { \\\\\\\"html\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"css\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"js\\\\\\\": \\\\\\\"...\\\\\\\" }\\\\n    }\\\\n  },\\\\n  \\\\\\\"seo\\\\\\\": { ... }                   // Section 14\\\\n}\\\\n\\\\n- DATA NORMALIZATION: the platform reads `data` first and falls back to\\\\n  `productData.data_categoriesBased`. You always output `data`.\\\\n- CONTENT IS ONLY `data.htmlPage.code.{html,css,js}`. There is NO block\\\\n  rendering, NO template languages (Nunjucks), no cssClassNames/settingsJSON.\\\\n- `data.css` / `data.js` are tolerated as embedded style/script blocks but\\\\n  the canonical fields are `htmlPage.code.css` / `.js`. Always use the\\\\n  canonical fields.\\\\n\\\\n----------------------------------------------------------------------------\\\\n3. EMBEDDING CONTRACT (HOW YOUR CODE RUNS) — MOST IMPORTANT SECTION\\\\n----------------------------------------------------------------------------\\\\n3.1 No document tags\\\\n- NEVER emit `\\u003c!DOCTYPE>`, `\\u003chtml>`, `\\u003chead>` or `\\u003cbody>` tags. Your HTML is\\\\n  a PURE BODY FRAGMENT injected into a page container\\\\n  (`\\u003cdiv class=\\\\\\\"gw-page-content\\\\\\\">`) that sits between the site header and\\\\n  footer. A full document is a hard error.\\\\n\\\\n3.2 Lifecycle on every load and every SPA navigation\\\\n  1. DOMPurify script + gw bootstrap run first (`window.gw` is guaranteed\\\\n     to exist when your scripts run).\\\\n  2. Your `html` is injected into the container.\\\\n  3. Your `css` is appended to \\u003chead> as `\\u003cstyle data-gw-css>`, deduped per\\\\n     page, and removed again on unmount.\\\\n  4. Your `js` runs AFTER injection and after a double requestAnimationFrame,\\\\n     inside an IIFE executed via a Blob URL. Embedded \\u003cscript> tags found in\\\\n     the html are extracted and run first; `code.js` runs last.\\\\n  5. The platform then auto-mounts all `[data-gw-app]` islands (idempotent)\\\\n     and dispatches `gw:content-ready`.\\\\n\\\\n3.3 Your JS re-runs on every visit AND every SPA navigation\\\\n- Scripts MUST be idempotent:\\\\n  * Prefer listeners attached to elements inside YOUR html (they die with\\\\n    the DOM on unmount).\\\\n  * If you must use window/document-level listeners, guard them:\\\\n      if (window.__myPageInit) return; window.__myPageInit = true;\\\\n    or remove them via the cleanup you can register (gw.onRouteChange\\\\n    listeners, gw.db.subscribe unsubscribes, widget cleanup functions).\\\\n  * Loop closures: use let/const per iteration. `var` in a loop makes every\\\\n    button act on the LAST item (classic bug).\\\\n- Top-level `function name(...)` declarations are automatically hoisted to\\\\n  `window.name` by the platform. Everything else stays inside the IIFE.\\\\n- Attach page-level helpers to `gw.ns` (a FRESH object per page visit,\\\\n  re-created on every SPA navigation) — never rely on hoisted window\\\\n  functions for page logic.\\\\n- NO top-level `await` (your code is wrapped in a non-async function).\\\\n  Use async functions, promises, or `gw.authReady`.\\\\n- A failing script is isolated (reported as `gw:script-error`) and never\\\\n  breaks the app shell — but write defensive code anyway.\\\\n\\\\n3.4 Scripts and styles placement rules\\\\n- Put ALL styling in `css`, ALL behavior in `js`. Embedded `\\u003cstyle>` /\\\\n  `\\u003cscript>` inside the html are tolerated (see Section 3.2) but avoid\\\\n  them.\\\\n- EXTERNAL scripts (`\\u003cscript src=\\\\\\\"...\\\\\\\">`) in the html are NOT supported.\\\\n  Never load frameworks/CDN JS (no jQuery, no React, no lodash). Plain\\\\n  vanilla JavaScript only. External images/fonts by absolute URL are fine.\\\\n- Your `css` is injected GLOBALLY into the page (header, footer and other\\\\n  pages share \\u003chead> while yours is mounted). Scope everything:\\\\n  * give your root element a unique class (e.g. `.shop-home`) and prefix\\\\n    every selector with it;\\\\n  * never style bare `html`, `body`, `*`, `a`, `button`, `h1` globally;\\\\n  * avoid generic class names that could collide (`button`, `.row`, `.card`).\\\\n- The `gw-` prefix is RESERVED for the platform shell, built-in widgets and\\\\n  the site's `sharedCss`. Page authors must NEVER define `gw-*` class\\\\n  selectors of their own (your CSS may USE --gw-color-* variables and\\\\n  gw-shared-* classes, just not define gw-* rules).\\\\n\\\\n3.5 SPA navigation\\\\n- Deep links: `\\u003ca data-ic-nav-href=\\\\\\\"/shop\\\\\\\" href=\\\\\\\"/shop\\\\\\\">Shop\\u003c/a>`. The\\\\n  click is intercepted by the SPA router; keep the plain `href` for\\\\n  fallback/SEO. Or call `gw.navigate('/shop')` in JS.\\\\n- After SPA navigation to another page, your DOM and styles are removed and\\\\n  your scripts re-run (idempotency rules of Section 3.3 apply).\\\\n\\\\n3.6 Content trust rules\\\\n- Your generated HTML is ADMIN content (trusted, injected raw). Anything\\\\n  that comes from DATA or USER INPUT must be escaped: build DOM with\\\\n  `textContent`, never `innerHTML` with interpolated values. Use\\\\n  `gw.sanitize(html)` (DOMPurify) when you must inject HTML strings.\\\\n- Never put secrets, passwords, API keys, tokens, admin URLs or preview\\\\n  secrets into html/css/js.\\\\n\\\\n----------------------------------------------------------------------------\\\\n4. HARD GUARDRAILS (violating any of these = invalid output)\\\\n----------------------------------------------------------------------------\\\\n 1. No \\u003chtml>, \\u003chead>, \\u003cbody>, \\u003c!DOCTYPE> tags. Body fragment only.\\\\n 2. No raw client writes. Every write is a CMS-defined operation, a flow,\\\\n    a form submit, or a cart call. No direct database/REST/API writes.\\\\n 3. No secrets in generated code.\\\\n 4. No reliance on removed features: blocks, cssClassNames/settingsJSON,\\\\n    JSON renderers, template languages (Nunjucks).\\\\n 5. No external JS libraries or CDN scripts; vanilla JS.\\\\n 6. No global (unscoped) CSS and no styling of the shell (html/body).\\\\n 7. Scripts must be idempotent (SPA re-runs) and must not use top-level\\\\n    await.\\\\n 8. No duplicate/leaking window-level listeners without guards.\\\\n 9. Field names `gw_hp`, `website`, `company` are RESERVED for honeypots.\\\\n    Never use them for real inputs.\\\\n10. `data-gw-config` must be VALID JSON (no comments, no trailing commas,\\\\n    no single-quoted strings).\\\\n11. Drafts are hidden: set `\\\\\\\"status\\\\\\\": \\\\\\\"published\\\\\\\"` (or omit it) unless the\\\\n    user asked for a draft.\\\\n12. Keep ids unique per page and prefixed (the header/footer coexist in the\\\\n    same document): `id=\\\\\\\"shop-cart-btn\\\\\\\"`, not `id=\\\\\\\"btn\\\\\\\"`.\\\\n13. Never auto-submit forms on load (the server rejects submissions faster\\\\n    than 2 s after page load — honeypot timing guard).\\\\n14. Do not use `document.write`, inline `eval` on user data, or\\\\n    `window.open` popups for navigation (use gw.navigate / openUrl).\\\\n\\\\n----------------------------------------------------------------------------\\\\n5. window.gw SDK REFERENCE (the ONLY integration surface)\\\\n----------------------------------------------------------------------------\\\\nContext properties: gw.pageId, gw.siteId, gw.folderId, gw.language,\\\\ngw.host, gw.currency.\\\\ngw.ns — a FRESH per-page namespace object (re-created on every SPA\\\\nnavigation). Attach page helpers here; never rely on hoisted window\\\\nfunctions.\\\\n\\\\nRouting\\\\n- gw.getPageParams() -> object merging live URL query params + context\\\\n  query + pathParams. pathParams by route kind:\\\\n    slug page      -> { slug }\\\\n    object detail  -> { cmsObjectType, id }\\\\n    template page  -> { template, contentId }\\\\n    app page       -> { appId, rest }\\\\n- gw.navigate(path)          SPA navigation to an internal path\\\\n- gw.openUrl(url)            new tab (noopener)\\\\n- gw.onRouteChange(cb)       -> returns unsubscribe function\\\\n\\\\nAuth\\\\n- gw.getUser() -> { id, email?, roles: string[] } | null\\\\n- gw.isAuthenticated() -> boolean\\\\n- gw.authReady -> Promise (resolves after the initial session load)\\\\n- gw.refreshAuth() -> Promise\\u003cuser | null>\\\\n- gw.login(returnUrl?) -> full-page redirect to /p/user/login?returnUrl=...\\\\n- gw.logout() -> POST /api/auth/session {action:'logout'}, then '/'\\\\n\\\\nStorage (host-scoped; failures ignored e.g. private mode)\\\\n- gw.storage.get(key) / .set(key, value) / .remove(key)   (localStorage)\\\\n- gw.storage.session.get/set/remove                        (sessionStorage)\\\\n\\\\nFormatting / UI\\\\n- gw.formatCurrency(amount, currency?)   uses the site currency config\\\\n- gw.formatDate(value, locale?)\\\\n- gw.notify(message, { severity: 'info'|'success'|'warning'|'error',\\\\n                       duration?, title? })   toast; message shown as TEXT\\\\n- gw.showModal(html, { title?, closeable? }) -> returns close function\\\\n  (html here is admin-authored, trusted)\\\\n- gw.setLoading(bool)                     overlay spinner\\\\n- gw.sanitize(html)                       DOMPurify wrapper (safe fallback)\\\\n- gw.track(event, data?) / gw.trackPageView()   guarded analytics no-ops\\\\n  when the site has no gtag/pixel\\\\n\\\\nForms\\\\n- gw.forms.bind(root?)   attaches submit handling to form[data-gw-form]\\\\n                         and form.gw-form. IDEMPOTENT. NOT automatic — call\\\\n                         it once from your js (Section 6).\\\\n- gw.forms.submit(form, { formTypeId? })  programmatic submit\\\\n\\\\nData (read-only; server enforces public access)\\\\n- gw.db.query(params) -> POST /api/data/query. STRICT params:\\\\n    { cmsObjectType (required), folder?, filters?, search?, orderBy?,\\\\n      orderDir?: 'asc'|'desc', page?, pageSize? (\\u003c=200), language?,\\\\n      relations?, facets? }\\\\n    filters: [ { field, op: '=='|'!='|'>'|'>='|'\\u003c'|'\\u003c='|'in'|'contains',\\\\n                 value } ]\\\\n    relations: [ { field, targetType, targetField? } ]\\\\n    -> { items: ObjectRecord[], total, page, pageSize, facets, relations }\\\\n- gw.db.get({ cmsObjectType, objectId }) -> GET /api/data/\\u003ctype>/\\u003cid>\\\\n    404 -> null\\\\n- gw.db.operation(operationId, payload, { idempotencyKey? })\\\\n    -> POST /api/data/op    (the ONLY set path, Section 8)\\\\n- gw.db.subscribe({ cmsObjectType?, folder? }, onChange) -> unsubscribe\\\\n    SSE-first with 5 s polling fallback.\\\\n    onChange receives { type: 'added'|'modified'|'removed', object }\\\\n    or { type: 'gw-event', event }.\\\\n\\\\nApps (island embedding, Section 11)\\\\n- gw.apps.register(name, factory)   idempotent; factory receives\\\\n    { el, config, gw } and may return a cleanup function.\\\\n- gw.apps.mount(root?) / gw.apps.unmount(root?)\\\\n- The platform auto-mounts [data-gw-app] elements after your scripts on\\\\n  every (re)mount; you normally never call mount yourself.\\\\n- Builtin widget names lazy-load /gw-widgets.js on first use.\\\\n- gw.service(name) -> NOT AVAILABLE (always rejects). Do not use.\\\\n\\\\nEvents (window CustomEvents you may listen for)\\\\n- 'gw:ready'            bootstrap installed; detail = page context\\\\n- 'gw:content-ready'    page scripts ran; detail { contentId }\\\\n- 'gw:script-error'     a blob script failed; detail { message, filename }\\\\n- 'gw:form-success' {form, data} · 'gw:form-error' {form, error, status?}\\\\n  · 'gw:form-invalid' {form, errors}        (all BUBBLE)\\\\n- 'gw:app-error' { name, message | error }\\\\n- 'gw:cart-changed'     cart contents changed\\\\n- 'gw:slot-picked' { slotId, slot }   (slot-picker without bookOperationId)\\\\n- 'ic-navigate' { detail: { href } }  -> SPA router\\\\n\\\\nObjectRecord shape (what query/get return): { id, slug?, name?,\\\\ncmsObjectType?, typeId?, data?, meta?, seo?, rules?, created?,\\\\nlastUpdated?, ... }. Field values live under `data.*`; access nested values\\\\nwith dotted paths, e.g. item.data.price (widgets use a `pick(obj,path)`\\\\nstyle, e.g. 'data.rows').\\\\n\\\\nAccess limits: only object types registered in the site app's\\\\n`cms-settings.objectTypes[]` with rules.publicAccess != 'no' are queryable;\\\\nprivate/unregistered types -> 403/404. The folder's fieldAllowlist /\\\\npublicFields projects fields (id is always kept). Read data with\\\\n`language` filter to match gw.language when available.\\\\n\\\\nService endpoints (for hand-rolled UI beyond the built-in widgets)\\\\n- Search: GET /api/search?type=\\u003ccmsObjectType>&folder?=&q=\\u003ctext>&lang?=&\\\\n  limit?= (int 1..100, default 24) -> { items, total }.\\\\n  fuse.js ranking over PUBLIC records only (private records excluded,\\\\n  language-filtered by `lang`). Debounce >= 300 ms; 60 req/min/IP.\\\\n- Account: GET /api/account/\\u003cresource> with resource = profile | orders |\\\\n  tickets | bookings. 401 when logged out. Scope is ALWAYS the session\\\\n  user (server forces customerId === uid) — you can never widen it.\\\\n  profile -> { ok, profile: { user, ... } };\\\\n  others  -> { ok, resource, items }.\\\\n- Email: POST /api/email/send { to, templateId, subject?, data?,\\\\n  gw_hp? }. Template is selected SERVER-side (Section 12.2); values are\\\\n  HTML-escaped; raw client html is NEVER accepted. 20 req/min/IP.\\\\n- Payment: POST /api/pay/stripe/intent { flowStateId } — amount ALWAYS\\\\n  computed server-side from the flow's amountFormula (never from the\\\\n  client). Returns the Stripe clientSecret. POST /api/pay/stripe/confirm\\\\n  { paymentIntentId }. The webhook is server-only (never call it).\\\\n\\\\n----------------------------------------------------------------------------\\\\n6. FORMS (data-gw-form protocol)\\\\n----------------------------------------------------------------------------\\\\n\\u003cform data-gw-form class=\\\\\\\"shop-contact\\\\\\\">\\\\n  \\u003clabel>Name \\u003cinput type=\\\\\\\"text\\\\\\\" name=\\\\\\\"name\\\\\\\" required>\\u003c/label>\\\\n  \\u003clabel>Email \\u003cinput type=\\\\\\\"email\\\\\\\" name=\\\\\\\"email\\\\\\\" required>\\u003c/label>\\\\n  \\u003ctextarea name=\\\\\\\"message\\\\\\\" required>\\u003c/textarea>\\\\n  \\u003c!-- honeypot: hidden via CSS, never a real field -->\\\\n  \\u003cinput type=\\\\\\\"text\\\\\\\" name=\\\\\\\"website\\\\\\\" class=\\\\\\\"shop-hp\\\\\\\" tabindex=\\\\\\\"-1\\\\\\\"\\\\n         autocomplete=\\\\\\\"off\\\\\\\" aria-hidden=\\\\\\\"true\\\\\\\">\\\\n  \\u003cbutton type=\\\\\\\"submit\\\\\\\">Send\\u003c/button>\\\\n  \\u003cdiv data-gw-form-status role=\\\\\\\"status\\\\\\\">\\u003c/div>\\\\n\\u003c/form>\\\\n\\\\n- Bind with: gw.forms.bind();  (idempotent; call once in your js).\\\\n- Honeypot: field named `gw_hp`, `website` or `company`, OR any field with\\\\n  attribute `data-gw-honeypot`. Hide with CSS (.shop-hp { position:\\\\n  absolute; left: -9999px; }). Filled honeypots are silently dropped.\\\\n- Status element `[data-gw-form-status]` shows busy text (\\\\\\\"Submitting…\\\\\\\")\\\\n  automatically; the form gets class .gw-busy while submitting.\\\\n- Submit payload (JSON): { formTypeId?, submittedAt, gw_hp,\\\\n  values: {\\u003cname>: \\u003cvalue string>} }. Files present -> multipart FormData.\\\\n- Events: gw:form-success / gw:form-error / gw:form-invalid (bubble —\\\\n  listen on the form or window).\\\\n- Server guardrails (design for them): origin check, hashed-IP rate limit,\\\\n  JSON body \\u003c= 256 KB, multipart \\u003c= 10 MB, honeypot, min fill time 2 s,\\\\n  optional reCAPTCHA (site setting).\\\\n- formTypeId links to a CMS `form-type-definition` object that defines the\\\\n  destination table + server hooks. The page can never set destination\\\\n  table or hooks. If the form must land somewhere specific, emit a\\\\n  `=== CMS CONFIG NEEDED ===` note for the CMS author.\\\\n- Do not put honeypot-looking names on real fields.\\\\n\\\\n----------------------------------------------------------------------------\\\\n7. DATA READS — static content with data\\\\n----------------------------------------------------------------------------\\\\nUse gw.db.query / gw.db.get / gw.db.subscribe. Example:\\\\n\\\\n  gw.db.query({ cmsObjectType: 'menu-items', folder: 'menu',\\\\n                orderBy: 'name', orderDir: 'asc', pageSize: 50,\\\\n                language: gw.language })\\\\n    .then(function (res) { /* render res.items with textContent */ })\\\\n    .catch(function () { /* show a quiet error state */ });\\\\n\\\\nRules:\\\\n- Always render in a .then/catch; never block on reads; show loading and\\\\n  empty states.\\\\n- Respect pageSize \\u003c= 200 (server cap).\\\\n- Reads are rate-limited (Section 16) and cached server-side; do not poll\\\\n  in a loop — use gw.db.subscribe for live updates.\\\\n- NEVER write via gw.db. There is no write API except operations (Section 8).\\\\n\\\\n----------------------------------------------------------------------------\\\\n8. WRITES THROUGH OPERATIONS (gw.db.operation)\\\\n----------------------------------------------------------------------------\\\\nOperations are CMS-authored config objects of the site app type with\\\\n`data.operationId`:\\\\n\\\\n{\\\\n  \\\\\\\"operationId\\\\\\\": \\\\\\\"create-order\\\\\\\",\\\\n  \\\\\\\"validation\\\\\\\": { \\\\\\\"required\\\\\\\": [\\\\\\\"items\\\\\\\"],\\\\n                  \\\\\\\"properties\\\\\\\": { \\\\\\\"email\\\\\\\": { \\\\\\\"type\\\\\\\": \\\\\\\"string\\\\\\\" } } },\\\\n  \\\\\\\"permission\\\\\\\": { \\\\\\\"roles\\\\\\\": [\\\\\\\"customer\\\\\\\"], \\\\\\\"ownerField\\\\\\\": \\\\\\\"customerId\\\\\\\" },\\\\n  \\\\\\\"formulas\\\\\\\": [ { \\\\\\\"out\\\\\\\": \\\\\\\"total\\\\\\\",\\\\n                  \\\\\\\"code\\\\\\\": \\\\\\\"sum(payload.items, price * qty)\\\\\\\" } ],\\\\n  \\\\\\\"writes\\\\\\\": [\\\\n    { \\\\\\\"targetType\\\\\\\": \\\\\\\"orders\\\\\\\", \\\\\\\"mode\\\\\\\": \\\\\\\"create\\\\\\\",\\\\n      \\\\\\\"with\\\\\\\": { \\\\\\\"customerId\\\\\\\": \\\\\\\"user.id\\\\\\\", \\\\\\\"total\\\\\\\": \\\\\\\"payload.total\\\\\\\" } },\\\\n    { \\\\\\\"targetType\\\\\\\": \\\\\\\"products\\\\\\\", \\\\\\\"mode\\\\\\\": \\\\\\\"update\\\\\\\",\\\\n      \\\\\\\"by\\\\\\\": { \\\\\\\"id\\\\\\\": \\\\\\\"payload.productId\\\\\\\" },\\\\n      \\\\\\\"fields\\\\\\\": { \\\\\\\"stock\\\\\\\": \\\\\\\"decrement\\\\\\\" } }\\\\n  ],\\\\n  \\\\\\\"hooks\\\\\\\": [ { \\\\\\\"type\\\\\\\": \\\\\\\"email\\\\\\\" }, { \\\\\\\"type\\\\\\\": \\\\\\\"contextFunction\\\\\\\",\\\\n                                      \\\\\\\"codeId\\\\\\\": \\\\\\\"...\\\\\\\" } ],\\\\n  \\\\\\\"transaction\\\\\\\": true\\\\n}\\\\n\\\\nCall: gw.db.operation('create-order', payload, { idempotencyKey: '...' })\\\\n      -> POST /api/data/op { operation, payload, idempotencyKey? }\\\\nResponse: { ok: true, result, idempotent? }\\\\n\\\\n- Value templates in `with`: `payload.x.y`, `user.id`.\\\\n- Formula DSL (safe subset): + - * / %, parentheses,\\\\n  sum/count/avg/min/max/round/floor/ceil/abs/str, dotted property paths;\\\\n  inside list functions the per-item scope is the ITEM OBJECT itself, e.g.\\\\n  sum(payload.items, price * qty).\\\\n- Permission: roles checked against the session-derived caller\\\\n  (anonymous -> roles: []). ownerField restricts to own records.\\\\n- Idempotency: pass a stable idempotencyKey per logical action so retries\\\\n  replay instead of duplicating (e.g. key = 'order-' + cartId).\\\\n- The page NEVER defines operations. Reference existing operationIds only.\\\\n  If a needed operation is missing, emit `=== CMS CONFIG NEEDED ===`.\\\\n\\\\n----------------------------------------------------------------------------\\\\n9. FLOWS (multi-step processes: checkout, booking, registration)\\\\n----------------------------------------------------------------------------\\\\nFlows are CMS-authored objects of the site app type with `data.flowId`:\\\\n\\\\n{\\\\n  \\\\\\\"flowId\\\\\\\": \\\\\\\"restaurant-checkout\\\\\\\",\\\\n  \\\\\\\"steps\\\\\\\": [\\\\n    { \\\\\\\"id\\\\\\\": \\\\\\\"cart\\\\\\\", \\\\\\\"dataDefinitions\\\\\\\": [\\\\n        { \\\\\\\"field\\\\\\\": \\\\\\\"notes\\\\\\\", \\\\\\\"type\\\\\\\": \\\\\\\"text\\\\\\\", \\\\\\\"label\\\\\\\": \\\\\\\"Notes\\\\\\\",\\\\n          \\\\\\\"required\\\\\\\": false } ] },\\\\n    { \\\\\\\"id\\\\\\\": \\\\\\\"delivery\\\\\\\", \\\\\\\"dataDefinitions\\\\\\\": [\\\\n        { \\\\\\\"field\\\\\\\": \\\\\\\"address\\\\\\\", \\\\\\\"type\\\\\\\": \\\\\\\"text\\\\\\\", \\\\\\\"label\\\\\\\": \\\\\\\"Address\\\\\\\",\\\\n          \\\\\\\"required\\\\\\\": true } ],\\\\n      \\\\\\\"validationRules\\\\\\\": [\\\\n        { \\\\\\\"field\\\\\\\": \\\\\\\"address\\\\\\\", \\\\\\\"rule\\\\\\\": \\\\\\\"minLength\\\\\\\", \\\\\\\"value\\\\\\\": 5,\\\\n          \\\\\\\"message\\\\\\\": \\\\\\\"Address too short\\\\\\\" } ] },\\\\n    { \\\\\\\"id\\\\\\\": \\\\\\\"payment\\\\\\\", \\\\\\\"paymentProvider\\\\\\\": \\\\\\\"stripe-test\\\\\\\",\\\\n      \\\\\\\"amountFormula\\\\\\\": \\\\\\\"cart.total + delivery.fee\\\\\\\" },\\\\n    { \\\\\\\"id\\\\\\\": \\\\\\\"done\\\\\\\", \\\\\\\"hooks\\\\\\\": [\\\\n        { \\\\\\\"type\\\\\\\": \\\\\\\"operation\\\\\\\", \\\\\\\"operationId\\\\\\\": \\\\\\\"create-order\\\\\\\",\\\\n          \\\\\\\"payload\\\\\\\": { \\\\\\\"customerId\\\\\\\": \\\\\\\"user.id\\\\\\\" } } ] }\\\\n  ]\\\\n}\\\\n\\\\nRules:\\\\n- The LAST step MUST have id \\\\\\\"done\\\\\\\" and carries the hooks.\\\\n- dataDefinitions types: text | number | boolean | array | object.\\\\n- Validation rule subset (server-enforced): required, email, min, max,\\\\n  minLength, maxLength, regex, integer. Unknown rules fail loud — use only\\\\n  this subset.\\\\n- amountFormula is evaluated over the accumulated per-step values:\\\\n  `state.steps.\\u003cstepId>.\\u003cfield>` — e.g. 'seats.count * 25',\\\\n  'cart.total + delivery.fee'.\\\\n- Hook payload templates resolve `steps.\\u003cstepId>.\\u003cfield>` and `user.id`.\\\\n- API:\\\\n    POST /api/flow/[flowId] { action: 'start' }\\\\n      -> { ok, flowStateId, step }\\\\n    POST /api/flow/[flowId] { action: 'step', values }\\\\n      -> { ok, flowStateId, nextStep } | 400 { errors }\\\\n    POST /api/flow/[flowId] { action: 'complete' }\\\\n      -> { ok, result: { operations, paymentIntent } }\\\\n- Flow state is SERVER-side in an httpOnly cookie (gw-flow-\\u003csessionKey>).\\\\n  The client sends NO state and cannot forge steps.\\\\n- Payment: a step with paymentProvider + amountFormula produces a\\\\n  paymentIntent on completion. In test setups the intent is a STUB\\\\n  (pi_stub_*).\\\\n  Production checkout: POST /api/pay/stripe/intent { flowStateId } returns\\\\n  the Stripe clientSecret — the amount ALWAYS comes from the flow's\\\\n  amountFormula server-side. Pages must NEVER hard-code amounts or\\\\n  construct intents themselves; prefer the checkout-flow widget, which\\\\n  drives start/step/complete for you.\\\\n- The checkout-flow widget shows a \\\\\\\"Completed\\\\\\\" element (data-testid\\\\n  \\\\\\\"gw-flow-done\\\\\\\") after a successful completion — you may watch for it to\\\\n  trigger follow-ups (e.g. mounting an order-status island).\\\\n\\\\n----------------------------------------------------------------------------\\\\n10. CART API\\\\n----------------------------------------------------------------------------\\\\n- GET /api/cart\\\\n    -> { items: [{ cmsObjectType, objectId, name, price, qty }],\\\\n         total, count, cartId }\\\\n- POST /api/cart { action: 'add'|'update'|'remove'|'clear',\\\\n                   item: { cmsObjectType, objectId, qty? } }\\\\n  'remove' and 'clear' take NO qty.\\\\n- Totals are ALWAYS computed server-side from the stored product price.\\\\n  Never calculate money client-side.\\\\n- Identity is automatic (anon gw-cart cookie or logged-in user).\\\\n- The platform dispatches 'gw:cart-changed' after changes; the built-in\\\\n  cart widget refreshes itself on it.\\\\n\\\\n----------------------------------------------------------------------------\\\\n11. WIDGETS — READY-MADE ISLANDS (prefer over hand-coding)\\\\n----------------------------------------------------------------------------\\\\nEmbed a widget as a div island; config comes from data-gw-config JSON:\\\\n\\\\n    \\u003cdiv data-gw-app=\\\\\\\"menu\\\\\\\"\\\\n         data-gw-config='{\\\\\\\"cmsObjectType\\\\\\\":\\\\\\\"menu-items\\\\\\\",\\\\n                           \\\\\\\"folder\\\\\\\":\\\\\\\"menu\\\\\\\",\\\\\\\"priceField\\\\\\\":\\\\\\\"price\\\\\\\"}'>\\u003c/div>\\\\n\\\\n- Attribute quoting: prefer a single-quoted attribute containing JSON with\\\\n  double-quoted strings (as above). If the config must contain apostrophes,\\\\n  use a double-quoted attribute and escape inner quotes as &quot;.\\\\n- Config MUST be valid JSON. No comments, no trailing commas.\\\\n- The platform mounts islands automatically after your scripts; mounting is\\\\n  idempotent (no double mounts on SPA re-navigation).\\\\n- Never nest [data-gw-app] islands inside each other.\\\\n\\\\nBuiltin widgets (register as data-gw-app names):\\\\n  menu             { cmsObjectType (req), folder?, fields?:\\\\n                     [{field,label}], titleField?='name', priceField?='price',\\\\n                     addToCart?=true, limit?=50 }\\\\n                   Lists items via gw.db.query; Add buttons POST /api/cart.\\\\n  cart             {}   Shows GET /api/cart; refreshes on 'gw:cart-changed'.\\\\n  checkout-flow    { flowId (req) }  Renders the flow's dataDefinitions\\\\n                   inputs step by step; Start / Next / \\\\\\\"Complete order\\\\\\\".\\\\n  slot-picker      { cmsObjectType (req), folder?, labelField?='label',\\\\n                     bookedField?='booked', slotField?='id',\\\\n                     bookOperationId?, limit?=100 }\\\\n                   With bookOperationId: books via gw.db.operation.\\\\n                   Without: dispatches 'gw:slot-picked' { slotId, slot }.\\\\n  seat-map         { cmsObjectType (req), objectId (req),\\\\n                     rowsField?='rows', seatsField?='seats',\\\\n                     bookedField?='booked', seatIdField?='id' }\\\\n                   Loads the object via gw.db.get; renders seat buttons.\\\\n                   NOTE: seat data must sit at the top level of the object's\\\\n                   data (the widget has no data-fallback in pick()).\\\\n  account-dashboard {}   Shows /api/account/profile + /api/account/orders;\\\\n                   sign-in prompt -> gw.login().\\\\n  rewards          { cmsObjectType?='rewards', customerField?='customerId',\\\\n                     pointsField?='points', limit?=50 }\\\\n                   Requires a logged-in user; filters by user.id.\\\\n  order-status     { orderId (req), statusField?='status' }\\\\n                   Reads /api/account/orders + live-updates via\\\\n                   gw.db.subscribe.\\\\n  search-box       { cmsObjectType (req), placeholder?, lang?,\\\\n                     titleField?='name' }\\\\n                   Debounced GET /api/search?type=...&q=...&lang=...\\\\n  list             { cmsObjectType (req), folder?, filters?,\\\\n                     orderBy?, orderDir?: 'asc'|'desc', pageSize? (\\u003c=200),\\\\n                     language?: 'auto'|code, fields?: [{field,label,\\\\n                     format?: 'date'|'currency'}], emptyText? }\\\\n                   No-code read list: renders via gw.db.query, every\\\\n                   value as inert TEXT (textContent — XSS-safe by\\\\n                   construction), loading/empty/error states, live refresh\\\\n                   via gw.db.subscribe when pageSize \\u003c= 50.\\\\n\\\\nCustom islands: in your js, BEFORE or independent of auto-mount:\\\\n  gw.apps.register('my-gallery', function (ctx) {\\\\n    var el = ctx.el, config = ctx.config, gw = ctx.gw;\\\\n    // build UI with textContent / createElement\\\\n    return function cleanup() { /* remove listeners */ };\\\\n  });\\\\n\\\\n----------------------------------------------------------------------------\\\\n12. TEMPLATES AND REUSABLE CONTENT (build flexible pages)\\\\n----------------------------------------------------------------------------\\\\n12.1 Template pages — /t/\\u003ctemplateSlug>/\\u003ccontentId>\\\\n- A template page is a page object whose slug is the template slug and\\\\n  whose `data.templateContentType` declares the object type supplying the\\\\n  CONTENT objects. Fallback when missing: the template slug itself is the\\\\n  content type.\\\\n- At /t/\\u003cT>/\\u003ccontentId> the platform fetches the content object:\\\\n  * content object has its own data.htmlPage.code -> THAT object renders\\\\n    (its html/css/js AND its SEO section are used);\\\\n  * otherwise -> the template page's htmlPage renders.\\\\n- In JS, gw.getPageParams() returns { template, contentId } (plus live\\\\n  query params). Fetch content fields with\\\\n  gw.db.get({ cmsObjectType: \\u003ccontentType>, objectId: contentId }).\\\\n- Best practice: LAYOUT lives in the template page (hero, sections, widget\\\\n  islands); DATA lives in the content objects (fields read via gw.db, e.g.\\\\n  data.title, data.price). Give a content object its own htmlPage only\\\\n  when it needs a fully custom layout.\\\\n- Per-content SEO: put it on the content object's seo section (used only\\\\n  when the content object renders its own htmlPage); otherwise the\\\\n  template page's SEO applies.\\\\n\\\\n12.2 Email templates (for operation/flow \\\\\\\"email\\\\\\\" hooks)\\\\n- An email template is an object in the site app with `data.templateId`\\\\n  (e.g. \\\\\\\"order-confirmation\\\\\\\"), html in `data.html` OR\\\\n  `data.htmlPage.code.html`, optional `data.subject`.\\\\n- Placeholders use double curly braces {{key}}; the server HTML-ESCAPES\\\\n  every substituted value — never expect raw html injection.\\\\n- Emails are REAL emails: a full HTML document is allowed HERE (the\\\\n  no-document rule applies to page fragments only).\\\\n- Sent via POST /api/email/send (Section 5) — normally triggered by a CMS\\\\n  operation/flow hook, not by the page directly. When your\\\\n  === CMS CONFIG NEEDED === asks for an email hook, also output\\\\n  === EMAIL TEMPLATE === { templateId, subject, html }.\\\\n\\\\n12.3 Reusable sections (data.sections)\\\\n- A page may carry `data.sections`: an ordered, FLAT list (max 20) of\\\\n  { cmsObjectType, objectId } references to shared objects whose own\\\\n  htmlPage.code is composed into the page BEFORE the page's own content.\\\\n- Sections inside sections are ignored; missing, private or draft section\\\\n  objects are skipped silently.\\\\n- Sections contribute html/css/js ONLY — no SEO, no chrome. Editing a\\\\n  section object updates every page referencing it.\\\\n- Use for shared strips: promo bars, CTAs, social proof, disclaimer\\\\n  blocks. Scope each section's CSS under its own wrapper class.\\\\n\\\\n12.4 Site chrome (default-header / default-footer)\\\\n- Same htmlPage.code contract; rendered by the platform on EVERY page,\\\\n  above/below the page content.\\\\n- MUST be: pure fragment (no document tags), scoped CSS (own wrapper\\\\n  class), idempotent + guarded JS, and LIGHT (runs site-wide).\\\\n- Nav links MUST use \\u003ca data-ic-nav-href=\\\\\\\"/path\\\\\\\" href=\\\\\\\"/path\\\\\\\"> for SPA\\\\n  navigation. Keep href for SEO/fallback.\\\\n- Islands ([data-gw-app]) are allowed but remember they mount on every\\\\n  page — keep them lightweight (cart icon, search-box).\\\\n- Language variants: sibling chrome objects by contentId with\\\\n  meta.language; the platform picks the matching language.\\\\n\\\\n12.5 Multi-language pages\\\\n- In code: branch static text on gw.language, or fetch language-filtered\\\\n  data (gw.db.query { language: gw.language }; /api/search lang=...).\\\\n- Generate one page object per language when text differs; all variants\\\\n  share the same contentId (siblings — see Section 1).\\\\n\\\\n----------------------------------------------------------------------------\\\\n13. PAGE STRUCTURE + COOKBOOK (compose, don't invent)\\\\n----------------------------------------------------------------------------\\\\nA) Catalog + cart (no checkout yet):\\\\n   search-box or the list widget (or gw.db.query list) + menu islands +\\\\n   cart island.\\\\n\\\\nB) Full shop checkout:\\\\n   menu (addToCart) + cart + checkout-flow {flowId: 'shop-checkout'}.\\\\n   The flow's done-step operation hook creates the order; after the widget\\\\n   shows \\\\\\\"Completed\\\\\\\" you may re-fetch or show order-status.\\\\n\\\\nC) Booking / tickets:\\\\n   slot-picker or seat-map (islands) -> a checkout-flow whose amountFormula\\\\n   references the chosen values (e.g. 'seats.count * 25') -> done-step\\\\n   operation hook writes the booking. Page JS may collect\\\\n   'gw:slot-picked' events into gw.storage and start the flow with them.\\\\n\\\\nD) Account area:\\\\n   Page with data.requireAuth: true + account-dashboard + order-status\\\\n   islands. Anonymous visitors are redirected to login automatically.\\\\n\\\\nE) Static content:\\\\n   Pure HTML + CSS (+ minimal JS). Still respect Section 3/4 (fragment,\\\\n   scoped CSS, idempotent JS, no document tags).\\\\n\\\\nF) Page structure standards (every generated page):\\\\n   - one unique root wrapper class on the FIRST element of the fragment;\\\\n   - semantic landmarks (\\u003csection>/\\u003carticle>/\\u003cnav>); exactly ONE \\u003ch1>;\\\\n     the site-wide header/footer are platform chrome — never duplicate;\\\\n   - heading order h1 > h2 > h3 with no skips;\\\\n   - vertical rhythm + colors from theme variables (--gw-color-*);\\\\n   - mobile-first responsive (flex/grid), no fixed viewport widths;\\\\n   - buttons as \\u003cbutton>, links as \\u003ca>; visible focus states;\\\\n   - images: alt text, width/height, loading=\\\\\\\"lazy\\\\\\\";\\\\n   - EVERY data-driven island needs loading / empty / error states.\\\\n\\\\nG) Custom search UI (instead of the search-box widget):\\\\n   Debounce >= 300 ms and call GET /api/search (Section 5); render titles\\\\n   with textContent; show a \\\\\\\"no results\\\\\\\" state.\\\\n\\\\nH) Custom account UI (instead of account-dashboard):\\\\n   Call GET /api/account/\\u003cresource> (Section 5). On 401 show a sign-in\\\\n   button calling gw.login().\\\\n\\\\nVertical logic (pricing rules, seat layouts, reward math) lives in CMS\\\\nCONFIG (operations, flows, object data) — the page is UI + configuration.\\\\nNever hard-code business rules into the page beyond presentation.\\\\n\\\\n----------------------------------------------------------------------------\\\\n14. SEO SECTION (=== SEO ===)\\\\n----------------------------------------------------------------------------\\\\nAll fields optional:\\\\n{\\\\n  \\\\\\\"metaTitle\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"metaDesc\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"metaRobots\\\\\\\": \\\\\\\"index, follow\\\\\\\",\\\\n  \\\\\\\"canonicalUrl\\\\\\\": \\\\\\\"https://...\\\\\\\", \\\\\\\"metaImage\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"metaAuthor\\\\\\\": \\\\\\\"...\\\\\\\",\\\\n  \\\\\\\"metaKeywords\\\\\\\": \\\\\\\"comma, separated\\\\\\\",\\\\n  \\\\\\\"ogTitle\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"ogDesc\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"ogImage\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"ogType\\\\\\\": \\\\\\\"...\\\\\\\",\\\\n  \\\\\\\"ogUrl\\\\\\\": \\\\\\\"...\\\\\\\",\\\\n  \\\\\\\"twitterCard\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"twitterSite\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"twitterTitle\\\\\\\": \\\\\\\"...\\\\\\\",\\\\n  \\\\\\\"twitterCreator\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"twitterImage\\\\\\\": \\\\\\\"...\\\\\\\",\\\\n  \\\\\\\"sitemapPriority\\\\\\\": \\\\\\\"0.8\\\\\\\", \\\\\\\"sitemapChangefreq\\\\\\\": \\\\\\\"weekly\\\\\\\",\\\\n  \\\\\\\"schemaItems\\\\\\\": [\\\\n    { \\\\\\\"id\\\\\\\": \\\\\\\"opt\\\\\\\", \\\\\\\"type\\\\\\\": \\\\\\\"FAQPage\\\\\\\",\\\\n      \\\\\\\"json\\\\\\\": \\\\\\\"{\\\\\\\\\\\\\\\"@type\\\\\\\\\\\\\\\":\\\\\\\\\\\\\\\"FAQPage\\\\\\\\\\\\\\\",\\\\\\\\\\\\\\\"mainEntity\\\\\\\\\\\\\\\":[ ... ]}\\\\\\\" }\\\\n  ],\\\\n  \\\\\\\"aiDescription\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"aiEntityType\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"aiIntent\\\\\\\": \\\\\\\"...\\\\\\\",\\\\n  \\\\\\\"aiKeyTopics\\\\\\\": \\\\\\\"...\\\\\\\", \\\\\\\"aiAudience\\\\\\\": \\\\\\\"...\\\\\\\"\\\\n}\\\\n\\\\nRules:\\\\n- ogType: only 'website' or 'article' are honored by the metadata layer;\\\\n  other values are ignored. twitterCard: only 'summary' or\\\\n  'summary_large_image'.\\\\n- schemaItems produce JSON-LD. `json` is a JSON STRING of the full\\\\n  {\\\\\\\"@type\\\\\\\": ...} payload (never wrap it in \\u003cscript>). Missing json ->\\\\n  bare {\\\\\\\"@type\\\\\\\": \\\\\\\"\\u003ctype>\\\\\\\"} entry. No schemaItems -> default WebPage.\\\\n- Use sensible types: WebPage, Product, FAQPage, Organization,\\\\n  BlogPosting, Event, BreadcrumbList, ...\\\\n- metaKeywords is a comma-separated string.\\\\n- metaRobots 'noindex, follow' for gated/requireAuth pages is recommended.\\\\n- sitemapPriority / sitemapChangefreq feed /sitemap.xml. Keep title\\\\n  ~60 chars and description ~155 chars (best practice, not enforced).\\\\n- Canonical/hreflang origin = settings.primaryHost, else request host —\\\\n  do not hard-code a host unless the user confirms it.\\\\n\\\\n----------------------------------------------------------------------------\\\\n15. THEME / SITE CONTEXT AVAILABLE TO PAGES\\\\n----------------------------------------------------------------------------\\\\n- Theme colors from default-settings.theme.colors are exposed as CSS\\\\n  variables: --gw-color-\\u003ckey> (e.g. --gw-color-primary). Custom\\\\n  theme.cssVariables are exposed as-is. Use them in your CSS instead of\\\\n  hard-coding brand colors.\\\\n- default-settings.sharedCss is a site-level stylesheet injected BEFORE\\\\n  page css (ADMIN-owned). Pages may use its classes.\\\\n- The platform prepends an auto trace comment to the page container\\\\n  (\\u003c!-- gw-page: ... -->) — platform-owned, never emit your own\\\\n  GW-PAGE-ID-style comments.\\\\n- theme.cssClasses are applied to the page shell wrapper — do not style\\\\n  them blindly; scope your own selectors.\\\\n- Currency: use gw.formatCurrency (never format money yourself).\\\\n- Language: gw.language; prefer data-driven text or gw.language checks\\\\n  over hard-coded locales. Static text should match the page's language.\\\\n- headCode / bodyStartCode / bodyEndCode / plugins (analytics) are\\\\n  ADMIN-owned site settings — the generator NEVER emits them.\\\\n\\\\n----------------------------------------------------------------------------\\\\n16. PERFORMANCE, QUALITY AND LIMITS SUMMARY\\\\n----------------------------------------------------------------------------\\\\n- Keep css/js small (a few KB to low tens of KB). No heavy dependencies.\\\\n- Lazy-load images (loading=\\\\\\\"lazy\\\\\\\", width/height to avoid CLS); use\\\\n  absolute URLs or site-relative paths for assets.\\\\n- Reads are rate-limited and cached — batch queries, use pageSize sensibly,\\\\n  use gw.db.subscribe for live views.\\\\n- Server rate limits (per IP): data reads 120/min · flows 60/min ·\\\\n  search 60/min · cart 60/min · email 20/min · pay 20/min · auth 10/min.\\\\n  Debounce user input, cache in gw.storage, prefer gw.db.subscribe over\\\\n  polling.\\\\n- Accessibility and responsiveness follow Section 13 F — both are hard\\\\n  quality standards.\\\\n- Forms: required attributes for client checks; server rules may differ —\\\\n  design for the server error events.\\\\n- No console noise: never log secrets; keep console output minimal.\\\\n\\\\n----------------------------------------------------------------------------\\\\n17. SELF-CHECK BEFORE RETURNING OUTPUT\\\\n----------------------------------------------------------------------------\\\\n[ ] Every HARD GUARDRAIL in Section 4 passes (body fragment only, scoped\\\\n    CSS, idempotent vanilla JS, no secrets, valid data-gw-config JSON,\\\\n    honeypots, published status).\\\\n[ ] Page helpers live on gw.ns, not hoisted window functions.\\\\n[ ] All writes go through operations/flows/forms/cart; gw.db is read-only.\\\\n[ ] data.sections (if used) is flat, ordered, and tolerates skipped objects.\\\\n[ ] gw.forms.bind() called if the page has data-gw-form forms.\\\\n[ ] User/data content rendered with textContent or gw.sanitize.\\\\n[ ] SEO section filled (title/description/schema at minimum).\\\\n[ ] No global nav/header/footer (platform chrome exists).\\\\n[ ] Missing operation/flow/email-template called out in CMS CONFIG NEEDED.\\\\n[ ] Template pages declare data.templateContentType; layout vs data split.\\\\n[ ] Chrome (header/footer) is light, scoped, idempotent, SPA-nav links.\\\\n[ ] Email templates use {{key}} placeholders (full document allowed there).\\\\n[ ] Language variants share contentId; text branched on gw.language.\\\\n\\\"\")\r\n\r\n/* ═══════════════════════════════════════════════════════════════════\r\n   CONSTANTS + STATE\r\n   ═══════════════════════════════════════════════════════════════════ */\r\nvar SESSION_TYPE = 'ai-chat-sessions-uniconbaseapps';\r\nvar CACHE_MSG_LIMIT = 20;          // messages kept in the slim value cache\r\nvar SESSION_MSG_LIMIT = 500;       // messages per session document\r\nvar APP_CLASS = 'ng-app';\r\n\r\nvar WRITE_ROLES = ['developer', 'owner', 'admin', 'user-manager', 'editor'];\r\n\r\nvar DB = null;                     // slim saved value\r\nvar _chat = { messages: [], sessionId: '', sessionObj: null, crudOk: null };\r\nvar _user = null;\r\nvar _readOnly = false;\r\nvar _pollTries = 0;\r\nvar _pollTimer = null;\r\nvar _staged = '';                  // JSON of the last value we staged (echo guard)\r\nvar _persistTimer = null;\r\nvar _saving = false;\r\nvar _currentTab = 'preview';\r\nvar _codeTab = 'html';\r\nvar _device = 'desktop';\r\nvar _genBusy = false;\r\nvar _chatBusy = false;\r\nvar _stream = null;                // active streaming message state\r\nvar _uidCtr = 0;\r\nvar _consoleLines = [];\r\nvar _briefTimer = null;\r\nvar _lastPlanNotes = '';\r\nvar _interviewMode = false;\r\n\r\n/* ── Color sets (newsroom palettes) — applied to the gallery AND the page ── */\r\nvar COLOR_SETS = [\r\n  { id: 'newsprint', label: 'Classic Newsprint', primary: '#1f4e8c', accent: '#b91c1c' },\r\n  { id: 'midnight', label: 'Midnight Desk', primary: '#0f172a', accent: '#e11d48' },\r\n  { id: 'crimson', label: 'Crimson Extra', primary: '#7f1d1d', accent: '#1d4ed8' },\r\n  { id: 'forest', label: 'Forest Edition', primary: '#14532d', accent: '#b45309' },\r\n  { id: 'royal', label: 'Royal Broadsheet', primary: '#312e81', accent: '#d97706' },\r\n  { id: 'ocean', label: 'Ocean Wire', primary: '#0e7490', accent: '#be123c' },\r\n  { id: 'mono', label: 'Monochrome Press', primary: '#111827', accent: '#6b7280' }\r\n];\r\nfunction colorSetById(id) {\r\n  SMALL UTILITIES\r\n   ═══════════════════════════════════════════════════════════════════ */\r\nfunction el(id) { return document.getElementById(id); }\r\n\r\nfunction esc(s) {\r\n  return String(s == null ? '' : s)\r\n    .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;')\r\n    .replace(/\"/g, '&quot;').replace(/'/g, '&#39;');\r\n}\r\n\r\nfunction fmtTime(iso) {\r\n  try {\r\n    var d = new Date(iso);\r\n    if (isNaN(d.getTime())) return '';\r\n    var hh = ('0' + d.getHours()).slice(-2);\r\n    var mm = ('0' + d.getMinutes()).slice(-2);\r\n    return hh + ':' + mm;\r\n  } catch (e) { return ''; }\r\n}\r\n\r\nfunction slugify(s) {\r\n  var t = String(s == null ? '' : s);\r\n  try {\r\n    t = t.normalize('NFKD');                      // decompose before stripping marks\r\n    t = t.replace(/[\\u0300-\\u036f]/g, '');        // remove combining marks FIRST\r\n  } catch (e) {}\r\n  var map = {\r\n    'ı': 'i', 'İ': 'i', 'i': 'i', 'ş': 's', 'Ş': 's', 'ğ': 'g', 'Ğ': 'g',\r\n    'ü': 'u', 'Ü': 'u', 'ö': 'o', 'Ö': 'o', 'ç': 'c', 'Ç': 'c', 'ə': 'e'\r\n  };\r\n  t = t.toLowerCase().replace(/[ışğüöçİŞĞÜÖÇə]/g, function (c) { return map[c] || c; });\r\n  t = t.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');\r\n  if (!t) t = 'news-story';\r\n  if (t === 'default-settings' || t === 'default-header' || t === 'default-footer') t = 'news-' + t;\r\n  return t;\r\n}\r\n\r\nfunction isObj(v) { return v && typeof v === 'object' && !Array.isArray(v); }\r\n\r\nfunction safeUrl(u) {\r\n  var s = String(u == null ? '' : u).trim();\r\n  if (!s) return '';\r\n  if (/^(https?:\\/\\/)/i.test(s)) return s;\r\n  if (s.charAt(0) === '/' || s.charAt(0) === '#') return s;\r\n  return '';\r\n}\r\n\r\nfunction imgSrc(u) {\r\n  var s = String(u == null ? '' : u).trim();\r\n  if (!s) return '';\r\n  if (/^https?:\\/\\//i.test(s) && s.length < 1500) return s;\r\n  return '';\r\n}\r\n\r\nfunction num(v, dflt) {\r\n  var n = parseFloat(v);\r\n  return isFinite(n) ? n : (dflt == null ? 0 : dflt);\r\n}\r\n\r\nfunction str(v, dflt) {\r\n  var s = String(v == null ? '' : v);\r\n  if (s !== '' && s !== 'undefined' && s !== 'null') return s;\r\n  return dflt == null ? '' : dflt;\r\n}\r\n\r\nfunction clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }\r\n\r\nfunction stripSuggests(text) {\r\n  var sugg = [];\r\n  var t = String(text == null ? '' : text);\r\n  var re = /\\[\\[suggest_[^\\]]*\\]\\]([^\\n]*)/g;\r\n  t = t.replace(re, function (m, tail) {\r\n    var label = (tail || '').trim();\r\n    if (label) sugg.push(label);\r\n    return '';\r\n  });\r\n  t = t.replace(/\\n{3,}/g, '\\n\\n').trim();\r\n  return { text: t, suggests: sugg };\r\n}\r\n\r\n/* Lenient AI JSON: cut prose/fences around the outermost { … } */\r\nfunction parseAiJson(text) {\r\n  var s = String(text == null ? '' : text).trim();\r\n  s = s.replace(/^```(?:json)?\\s*/i, '').replace(/```\\s*$/, '');\r\n  var a = s.indexOf('{');          // FIRST opening brace\r\n  var b = s.lastIndexOf('}');      // LAST closing brace\r\n  if (a === -1 || b === -1 || b < a) {\r\n    return { ok: false, error: 'No JSON object found in the AI response.' };\r\n  }\r\n  var slice = s.substring(a, b + 1);\r\n  slice = slice.replace(/,\\s*([}\\]])/g, '$1');          // trailing commas\r\n  slice = slice.replace(/\\/\\*[\\s\\S]*?\\*\\//g, '');       // block comments\r\n  slice = slice.replace(/(^|[^:\"\\\\])\\/\\/[^\\n]*/g, '$1'); // line comments\r\n  try {\r\n    var data = JSON.parse(slice);\r\n    return { ok: true, data: data };\r\n  } catch (e) {\r\n    return { ok: false, error: 'JSON parse error: ' + e.message };\r\n  }\r\n}\r\n\r\n/* Allow-list rich text sanitizer (used for AI-supplied article HTML).\r\n   Uses DOMParser when available; falls back to full escaping. */\r\nvar SANITIZE_TAGS = {\r\n  P: 1, H2: 1, H3: 1, H4: 1, STRONG: 1, B: 1, EM: 1, I: 1, U: 1, S: 1,\r\n  BR: 1, UL: 1, OL: 1, LI: 1, BLOCKQUOTE: 1, CODE: 1, PRE: 1, SUB: 1, SUP: 1,\r\n  A: 1, IMG: 1, HR: 1, FIGURE: 1, FIG   breaking: {\r\n    ai: 'Urgent breaking strip (dark/red with pulsing dot) for flash updates. content: { label?, text, time? }. Use at the very top for developing stories.',\r\n    render: function (d, c) {\r\n      var t = str(d.text, '').trim();\r\n      if (!t) return '';\r\n      return '<div class=\"n-breaking n-reveal\" role=\"alert\"><span class=\"n-breaking-badge\"><i class=\"n-live-dot\" aria-hidden=\"true\"><\/i>' + esc(str(d.label, 'BREAKING')) + '<\/span>'\r\n        + '<span class=\"n-breaking-text\">' + esc(t) + '<\/span>'\r\n        + (str(d.time, '') ? '<time class=\"n-breaking-time\">' + esc(str(d.time)) + '<\/time>' : '')\r\n        + '<\/div>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── LIVE BLOG ── */\r\n  liveblog: {\r\n    ai: 'Live coverage feed, newest first, with a pulsing LIVE badge. content: { title?, entries: [{ time, text, tag? (\"update\"|\"quote\"|\"fact\"|\"milestone\") }] }. The newsroom way to cover developing stories.',\r\n    render: function (d, c) {\r\n      var entries = Array.isArray(d.entries) ? d.entries : [];\r\n      if (!entries.length) return '';\r\n      var head = str(d.title, '') ? '<h2 class=\"n-sec-title n-reveal\">' + esc(str(d.title)) + '<\/h2>' : '';\r\n      var rows = entries.map(function (it) {\r\n        var tag = str(it.tag, 'update');\r\n        return '<li class=\"n-live-entry n-reveal\"><time class=\"n-live-time\">' + esc(str(it.time, '')) + '<\/time>'\r\n          + '<div class=\"n-live-body\">'\r\n          + (tag ? '<span class=\"n-live-tag n-live-tag-' + esc(tag) + '\">' + esc(tag).toUpperCase() + '<\/span>' : '')\r\n          + '<p class=\"n-live-text\">' + esc(str(it.text, '')) + '<\/p><\/div><\/li>';\r\n      }).join('');\r\n      return '<section class=\"n-sec n-liveblog\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<div class=\"n-live-head n-reveal\"><i class=\"n-live-dot\" aria-hidden=\"true\"><\/i><span class=\"n-live-label\">LIVE<\/span><\/div>'\r\n        + head + '<ol class=\"n-live-list\">' + rows + '<\/ol><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── KEY POINTS (at a glance) ── */\r\n  keypoints: {\r\n    ai: '\"At a glance\" fact box — the 3-6 things readers must know. content: { title?, points: [..] }.',\r\n    render: function (d, c) {\r\n      var points = Array.isArray(d.points) ? d.points : [];\r\n      if (!points.length) return '';\r\n      var rows = points.map(function (p) { return '<li>' + esc(String(p)) + '<\/li>'; }).join('');\r\n      return '<section class=\"n-sec n-keypoints\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<div class=\"n-keypoints-card n-reveal\"><h2 class=\"n-keypoints-title\">' + esc(str(d.title, 'At a glance')) + '<\/h2>'\r\n        + '<ul class=\"n-keypoints-list\">' + rows + '<\/ul><\/div><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── FACT CHECK ── */\r\n  factcheck: {\r\n    ai: 'Newsroom fact-check panel. content: { claim, verdict: \"true\"|\"mostly-true\"|\"half-true\"|\"mostly-false\"|\"false\"|\"unverified\", by?, explanation }. Builds trust — use for contested claims.',\r\n    render: function (d, c) {\r\n      var claim = str(d.claim, '').trim();\r\n      if (!claim) return '';\r\n      var verdict = str(d.verdict, 'unverified');\r\n      var vlabels = { 'true': 'TRUE', 'mostly-true': 'MOSTLY TRUE', 'half-true': 'HALF TRUE', 'mostly-false': 'MOSTLY FALSE', 'false': 'FALSE', 'unverified': 'UNVERIFIED' };\r\n      if (!vlabels[verdict]) verdict = 'unverified';\r\n      return '<section class=\"n-sec n-factcheck\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<div class=\"n-fc-card n-fc-' + verdict + ' n-reveal\">'\r\n        + '<span class=\"n-fc-label\">Fact check<\/span>'\r\n        + '<p class=\"n-fc-claim\">“' + esc(claim) + '”<\/p>'\r\n        + '<span class=\"n-fc-verdict\">' + vlabels[verdict] + '<\/span>'\r\n        + (str(d.by, '') ? '<span class=\"n-fc-by\">— ' + esc(str(d.by)) + '<\/span>' : '')\r\n        + (str(d.explanation, '') ? '<p class=\"n-fc-expl\">' + sanitizeRich(str(d.explanation)) + '<\/p>' : '')\r\n        + '<\/div><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── SCORECARD (sports) ── */\r\n  scorecard: {\r\n    ai: 'Sports scoreboard. content: { sport?, status? (\"FT\"|\"LIVE\"|time), venue?, home: { name, score }, away: { name, score }, note? }. Dark board with big numbers.',\r\n    render: function (d, c) {\r\n      var home = isObj(d.home) ? d.home : {};\r\n      var away = isObj(d.away) ? d.away : {};\r\n      if (!str(home.name, '') && !str(away.name, '')) return '';\r\n      return '<section class=\"n-sec n-scorecard\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<div class=\"n-score-card n-reveal\">'\r\n        + '<span class=\"n-score-sport\">' + esc(str(d.sport, 'MATCH')) + '<\/span>'\r\n        + '<span class=\"n-score-status\">' + esc(str(d.status, 'FT')) + '<\/span>'\r\n        + '<div class=\"n-score-row\"><span class=\"n-score-team\">' + esc(str(home.name, 'Home')) + '<\/span>'\r\n        + '<span class=\"n-score-num\">' + esc(String(home.score == null ? 0 : home.score)) + '<\/span>'\r\n        + '<span class=\"n-score-div\">–<\/span>'\r\n        + '<span class=\"n-score-num\">' + esc(String(away.score == null ? 0 : away.score)) + '<\/span>'\r\n        + '<span class=\"n-score-team\">' + esc(str(away.name, 'Away')) + '<\/span><\/div>'\r\n        + (str(d.venue, '') ? '<span class=\"n-score-venue\">' + esc(str(d.venue)) + '<\/span>' : '')\r\n        + (str(d.note, '') ? '<p class=\"n-score-note\">' + esc(str(d.note)) + '<\/p>' : '')\r\n        + '<\/div><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── PHOTO STORY ── */\r\n  photostory: {\r\n    ai: 'Full-bleed photo essay image with caption and credit line. content: { image, alt, caption?, credit?, kicker?, title? }. Use for the defining photo of the story.',\r\n    render: function (d, c) {\r\n      var src = imgSrc(d.image);\r\n      if (!src) return '';\r\n      return '<section class=\"n-sec n-photostory\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner\">'\r\n        + (str(d.kicker, '') || str(d.title, '') ? '<div class=\"n-ps-head n-reveal\">'\r\n          + (str(d.kicker, '') ? '<span class=\"n-hero-kicker\">' + esc(str(d.kicker)) + '<\/span>' : '')\r\n          + (str(d.title, '') ? '<h2 class=\"n-ps-title\">' + esc(str(d.title)) + '<\/h2>' : '') + '<\/div>' : '')\r\n        + '<figure class=\"n-ps-fig n-reveal\"><img class=\"n-ps-img\" src=\"' + esc(src) + '\" alt=\"' + esc(str(d.alt, 'photo')) + '\" loading=\"lazy\" width=\"1600\" height=\"1000\">'\r\n        + '<figcaption class=\"n-ps-cap\">'\r\n        + (str(d.caption, '') ? '<span class=\"n-ps-caption\">' + esc(str(d.caption)) + '<\/span>' : '')\r\n        + (str(d.credit, '') ? '<span class=\"n-ps-credit\">' + esc(str(d.credit)) + '<\/span>' : '')\r\n        + '<\/figcaption><\/figure><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── PERSON CARD (who's who) ── */\r\n  personcard: {\r\n    ai: '\"Who is\" profile card for a person in the story. content: { name, role?, photo?, bio?, quote?, connection? (\"Why they matter\") }.',\r\n    render: function (d, c) {\r\n      var photo = imgSrc(d.photo);\r\n      return '<section class=\"n-sec n-person\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<div class=\"n-person-card n-reveal\">'\r\n        + (photo ? '<img class=\"n-person-photo\" src=\"' + esc(photo) + '\" alt=\"' + esc(str(d.name, 'person')) + '\" loading=\"lazy\" width=\"160\" height=\"160\">'\r\n          : '<span class=\"n-person-photo n-person-photo-txt\">' + esc(String(str(d.name, '?')).charAt(0).toUpperCase()) + '<\/span>')\r\n        + '<div class=\"n-person-body\"><span class=\"n-person-kicker\">Who is this<\/span>'\r\n        + '<h2 class=\"n-person-name\">' + esc(str(d.name, '')) + '<\/h2>'\r\n        + (str(d.role, '') ? '<span class=\"n-person-role\">' + esc(str(d.role)) + '<\/span>' : '')\r\n        + (str(d.bio, '') ? '<p class=\"n-person-bio\">' + esc(str(d.bio)) + '<\/p>' : '')\r\n        + (str(d.quote, '') ? '<p class=\"n-person-quote\">“' + esc(str(d.quote)) + '”<\/p>' : '')\r\n        + (str(d.connection, '') ? '<p class=\"n-person-connection\"><strong>Why it matters:<\/strong> ' + esc(str(d.connection)) + '<\/p>' : '')\r\n        + '<\/div><\/div><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── EDITOR'S NOTE ── */\r\n  editorsnote: {\r\n    ai: 'Italic editor\\'s note box explaining methodology, sensitivity or context. content: { text }.',\r\n    render: function (d, c) {\r\n      var t = str(d.text, '').trim();\r\n      if (!t) return '';\r\n      return '<section class=\"n-sec n-ednote\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<aside class=\"n-ednote-box n-reveal\"><strong>Editor’s note:<\/strong> ' + esc(t) + '<\/aside><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── CORRECTIONS ── */\r\n  corrections: {\r\n    ai: 'Newsroom-standard \"Corrections & clarifications\" small print. content: { note }. Builds trust — add when a story was amended.',\r\n    render: function (d, c) {\r\n      var t = str(d.note, '').trim();\r\n      if (!t) return '';\r\n      return '<section class=\"n-sec n-corrections\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<p class=\"n-corrections-p n-reveal\"><strong>Corrections & clarifications:<\/strong> ' + esc(t) + '<\/p><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── STORY QUIZ (graded, shareable result) ── */\r\n  quiz: {\r\n    ai: 'Graded story quiz with a shareable result card. content: { title?, questions: [{ q, options: [..], correct: index }], note? }. 3-5 questions; scores and result text are copied with a link.',\r\n    render: function (d, c) {\r\n      var qs = Array.isArray(d.questions) ? d.questions : [];\r\n      if (!qs.length) return '';\r\n      var key = 'ng-quiz-' + c.slug + '-' + c.uid('q');\r\n      var out = qs.map(function (q, qi) {\r\n        var opts = Array.isArray(q.options) ? q.options : [];\r\n        if (!opts.length) return '';\r\n        return '<div class=\"n-quiz-q\"><h3 class=\"n-quiz-q-title\">' + (qi + 1) + '. ' + esc(str(q.q, '')) + '<\/h3>'\r\n          + '<div class=\"n-quiz-opts\">' + opts.map(function (o, oi) {\r\n            return '<button class=\"n-quiz-opt\" type=\"button\" data-quiz-q=\"' + qi + '\" data-quiz-a=\"' + oi + '\">' + esc(String(o)) + '<\/button>';\r\n          }).join('') + '<\/div><\/div>';\r\n      }).join('');\r\n      return '<section class=\"n-sec n-quiz\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + '<div class=\"n-quiz-card n-reveal\" data-quiz-key=\"' + key + '\">'\r\n        + '<h2 class=\"n-quiz-title\">🧠 ' + esc(str(d.title, 'How well did you follow the story?')) + '<\/h2>'\r\n        + out\r\n        + '<div class=\"n-quiz-actions\"><button class=\"n-btn n-btn-primary n-quiz-submit\" type=\"button\">Check my score<\/button><\/div>'\r\n        + '<div class=\"n-quiz-result\" hidden><p class=\"n-quiz-score\"><\/p><div class=\"n-quiz-result-actions\">'\r\n        + '<button class=\"n-quiz-share\" type=\"button\">📋 Share my result<\/button>'\r\n        + '<button class=\"n-quiz-retry\" type=\"button\">↺ Try again<\/button><\/div><\/div>'\r\n        + (str(d.note, '') ? '<p class=\"n-quiz-note\">' + esc(str(d.note)) + '<\/p>' : '')\r\n        + '<\/div><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── HEAT STRIP (data visual) ── */\r\n  heatstrip: {\r\n    ai: 'Heat-strip data visual — a row of cells colored by value. content: { title?, items: [{ label, value }], unit?, note? }. Great for rankings, temperatures, budgets.',\r\n    render: function (d, c) {\r\n      var items = Array.isArray(d.items) ? d.items : [];\r\n      if (!items.length) return '';\r\n      var maxV = 1;\r\n      items.forEach(function (it) { maxV = Math.max(maxV, num(it.value, 0)); });\r\n      var cells = items.map(function (it) {\r\n        var v = num(it.value, 0);\r\n        var pct = maxV > 0 ? Math.round((v / maxV) * 100) : 0;\r\n        return '<div class=\"n-heat-cell\"><span class=\"n-heat-bar\" style=\"height:' + Math.max(6, pct) + '%\"><\/span>'\r\n          + '<span class=\"n-heat-val\">' + esc(String(it.value)) + (str(d.unit, '') ? '<small>' + esc(str(d.unit)) + '<\/small>' : '') + '<\/span>'\r\n          + '<span class=\"n-heat-label\">' + esc(str(it.label, '')) + '<\/span><\/div>';\r\n      }).join('');\r\n      return '<section class=\"n-sec n-heatstrip\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner\">'\r\n        + (str(d.title, '') ? '<h2 class=\"n-sec-title n-reveal\">' + esc(str(d.title)) + '<\/h2>' : '')\r\n        + '<div class=\"n-heat n-reveal\">' + cells + '<\/div>'\r\n        + (str(d.note, '') ? '<p class=\"n-chart-source\">' + esc(str(d.note)) + '<\/p>' : '')\r\n        + '<\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── ANNOTATED SVG MAP ── */\r\n  annotatedmap: {\r\n    ai: 'Annotated SVG map — points plotted by percentage coordinates with labels (no external embeds). content: { title?, image? (background URL), points: [{ x: 0-100, y: 0-100, label, note? }], note? }.',\r\n    render: function (d, c) {\r\n      var points = Array.isArray(d.points) ? d.points : [];\r\n      if (!points.length) return '';\r\n      var img = imgSrc(d.image);\r\n      var marks = points.map(function (p) {\r\n        var x = clamp(num(p.x, 50), 2, 98);\r\n        var y = clamp(num(p.y, 50), 4, 96);\r\n        var label = str(p.label, '');\r\n        return '<g class=\"n-amap-point\">'\r\n          + '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"2.6\">' + (str(p.note, '') ? '<title>' + esc(label + ': ' + str(p.note)) + '<\/title>' : '<title>' + esc(label) + '<\/title>') + '<\/circle>'\r\n          + '<text x=\"' + x + '\" y=\"' + (y - 6) + '\" class=\"n-amap-label\">' + esc(label) + '<\/text><\/g>';\r\n      }).join('');\r\n      return '<section class=\"n-sec n-amap\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner\">'\r\n        + (str(d.title, '') ? '<h2 class=\"n-sec-title n-reveal\">' + esc(str(d.title)) + '<\/h2>' : '')\r\n        + '<figure class=\"n-amap-fig n-reveal\"><svg class=\"n-amap-svg\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"' + esc(str(d.title, 'annotated map')) + '\">'\r\n        + (img ? '<image href=\"' + esc(img) + '\" x=\"0\" y=\"0\" width=\"100\" height=\"100\" preserveAspectRatio=\"xMidYMid slice\"><\/image>' : '<rect x=\"0\" y=\"0\" width=\"100\" height=\"100\" fill=\"#eef1f6\"><\/rect>')\r\n        + marks + '<\/svg>'\r\n        + (str(d.note, '') ? '<figcaption class=\"n-chart-source\">' + esc(str(d.note)) + '<\/figcaption>' : '')\r\n        + '<\/figure><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── CLICKABLE ORG CHART ── */\r\n  orgchart: {\r\n    ai: 'Clickable org chart (native details, expandable branches). content: { title?, root: { label, role?, note?, children?: [ same shape ] } }. For \"who is who\" structures.',\r\n    render: function (d, c) {\r\n      function node(n) {\r\n        if (!isObj(n)) return '';\r\n        var kids = Array.isArray(n.children) ? n.children.map(node).join('') : '';\r\n        var inner = '<summary><b>' + esc(str(n.label, '')) + '<\/b>'\r\n          + (str(n.role, '') ? '<small>' + esc(str(n.role)) + '<\/small>' : '') + '<\/summary>'\r\n          + (str(n.note, '') ? '<p class=\"n-org-note\">' + esc(str(n.note)) + '<\/p>' : '')\r\n          + (kids ? '<ul>' + kids + '<\/ul>' : '');\r\n        return '<li><details' + (kids ? ' open' : '') + '>' + inner + '<\/details><\/li>';\r\n      }\r\n      var tree = node(d.root);\r\n      if (!tree) return '';\r\n      return '<section class=\"n-sec n-orgchart\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + (str(d.title, '') ? '<h2 class=\"n-sec-title n-reveal\">' + esc(str(d.title)) + '<\/h2>' : '')\r\n        + '<div class=\"n-org n-reveal\"><ul>' + tree + '<\/ul><\/div><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── VIDEO BEFORE/AFTER COMPARE ── */\r\n  videocompare: {\r\n    ai: 'Before/after VIDEO comparison slider (two muted looping videos, drag the handle). content: { title?, before: { src, label? }, after: { src, label? }, note? }.',\r\n    render: function (d, c) {\r\n      var b = isObj(d.before) ? d.before : {};\r\n      var a = isObj(d.after) ? d.after : {};\r\n      var bs = imgSrc(b.src);\r\n      var as = imgSrc(a.src);\r\n      if (!bs || !as) return '';\r\n      return '<section class=\"n-sec n-vcmp\" id=\"' + c.uid('sec') + '\"><div class=\"n-inner n-inner-narrow\">'\r\n        + (str(d.title, '') ? '<h2 class=\"n-sec-title n-reveal\">' + esc(str(d.title)) + '<\/h2>' : '')\r\n        + '<figure class=\"n-vcmp n-reveal\" data-vcmp>'\r\n        + '<div class=\"n-vcmp-stage\">'\r\n        + '<video class=\"n-vcmp-after\" src=\"' + esc(as) + '\" muted loop playsinline preload=\"metadata\"><\/video>'\r\n        + '<div class=\"n-vcmp-before-wrap\"><video class=\"n-vcmp-before\" src=\"' + esc(bs) + '\" muted loop playsinline preload=\"metadata\"><\/video><\/div>'\r\n        + '<div class=\"n-vcmp-handle\" role=\"slider\" tabindex=\"0\" aria-label=\"Drag to compare videos\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"50\"><span class=\"n-vcmp-grip\">⇔<\/span><\/div>'\r\n        + '<button class=\"n-vcmp-play\" type=\"button\">▶ Play<\/button>'\r\n        + '<span class=\"n-cmp-tag n-cmp-tag-b\">' + esc(str(b.label, 'Before')) + '<\/span>'\r\n        + '<span class=\"n-cmp-tag n-cmp-tag-a\">' + esc(str(a.label, 'After')) + '<\/span>'\r\n        + '<\/div>'\r\n        + (str(d.note, '') ? '<figcaption class=\"n-cmp-cap\">' + esc(str(d.note)) + '<\/figcaption>' : '')\r\n        + '<\/figure><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── SCROLLYTELLING CHAPTERS ── */\r\n  scrolly: {\r\n    ai: 'Scrollytelling chapters: a sticky full-bleed image stage that crossfades as readers scroll past chapter cards. content: { title?, chapters: [{ title, text, image, alt? }] }. Longform magic.',\r\n    render: function (d, c) {\r\n      var chs = Array.isArray(d.chapters) ? d.chapters : [];\r\n      if (!chs.length) return '';\r\n      var frames = chs.map(function (ch, i) {\r\n        var img = imgSrc(ch.image);\r\n        return '<div class=\"n-scrolly-frame' + (i === 0 ? ' active' : '') + '\">'\r\n          + (img ? '<img src=\"' + esc(img) + '\" alt=\"' + esc(str(ch.alt, str(ch.title, 'chapter'))) + '\" loading=\"lazy\" width=\"1600\" height=\"1000\">' : '<div class=\"n-scrolly-frame-empty\"><\/div>')\r\n          + '<span class=\"n-scrolly-cap\">' + esc(str(ch.title, '')) + '<\/span><\/div>';\r\n      }).join('');\r\n      var cards = chs.map(function (ch, i) {\r\n        return '<div class=\"n-scrolly-chapter\" data-scrolly=\"' + i + '\"><h3 class=\"n-scrolly-ch-title\">' + esc(str(ch.title, '')) + '<\/h3>'\r\n          + (str(ch.text, '') ? '<p class=\"n-scrolly-ch-text\">' + esc(str(ch.text)) + '<\/p>' : '') + '<\/div>';\r\n      }).join('');\r\n      return '<section class=\"n-sec n-scrolly\" id=\"' + c.uid('sec') + '\">'\r\n        + (str(d.title, '') ? '<h2 class=\"n-sec-title n-reveal\">' + esc(str(d.title)) + '<\/h2>' : '')\r\n        + '<div class=\"n-scrolly-wrap\"><div class=\"n-scrolly-stage\" aria-hidden=\"true\">' + frames + '<\/div>'\r\n        + '<div class=\"n-scrolly-chapters\">' + cards + '<\/div><\/div><\/section>';\r\n    },\r\n    css: ''\r\n  },\r\n\r\n  /* ── COMMENTS / DISCUSSION HOOK ── */\r\n  comments: {\r\n    ai: 'Comments hook. content: { formTypeId?, title?, note? }. With formTypeId, renders a data-gw-form discussion form (comment + honeypot) bound via gw.
