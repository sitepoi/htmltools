<!--
  DOCS INDEX TEMPLATE - _docs/templates/_index-template.html
  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), and the test harness
  into a full-page pane - open ONLY this file to review everything about the
  tool. Self-contained (no shared assets) so it works anywhere. Created by
  scripts/init-docs.js as docs/index.html for every tool; the test-harness
  menu item appears only when the tool has app/test-harness.html. The code
  panes are embedded between the CODE-PAYLOAD markers and refreshed with

  URL shortcut: index.html?doc=help (or ?doc=code-js) opens directly.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #1f2937; }
  .docs-shell { display: flex; height: 100vh; height: 100dvh; }
  .docs-menu {
    width: 236px; flex: 0 0 236px;
    background: #0f172a; color: #cbd5e1;
    display: flex; flex-direction: column;
    border-right: 1px solid #1e293b;
  }
  .docs-brand { padding: 18px 16px 14px; border-bottom: 1px solid #1e293b; }
  .docs-brand-name { font-weight: 800; color: #f8fafc; font-size: 0.95rem; line-height: 1.3; }
  .docs-brand-sub { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .docs-nav { flex: 1; overflow-y: auto; padding: 10px 10px; }
  .docs-nav-item {

    font-family: inherit; font-size: 0.86rem; font-weight: 600;
  }
  .docs-nav-item:hover { background: #1e293b; color: #f1f5f9; }
  .docs-nav-item.active { background: #4f46e5; color: #ffffff; }
  .docs-nav-item .docs-nav-sub { display: block; font-size: 0.7rem; font-weight: 500; color: #64748b; margin-top: 1px; }
  .docs-nav-item.active .docs-nav-sub { color: #c7d2fe; }
  .docs-nav-item.docs-nav-code { color: #fbbf24; }
  .docs-nav-item.docs-nav-code:hover { background: #1e293b; color: #fcd34d; }
  .docs-nav-item.docs-nav-code.active { background: #b45309; color: #fffbeb; }
  .docs-nav-item.docs-nav-code.active .docs-nav-sub { color: #fde68a; }
  .docs-nav-item.docs-nav-harness { color: #86efac; }
  .docs-nav-item.docs-nav-harness:hover { background: #1e293b; color: #bbf7d0; }
  .docs-nav-sep { border: 0; border-top: 1px solid #1e293b; margin: 10px 4px; }
  .docs-nav-group-label { font-size: 0.66rem; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; padding: 8px 12px 2px; }
  .docs-menu-footer {

    font-size: 0.72rem; color: #64748b;
  }
  .docs-stage { flex: 1; min-width: 0; background: #e2e8f0; position: relative; }

    width: 100%; height: 100%; border: 0;

  }

    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: #0f172a; color: #e2e8f0; border: 0; border-radius: 8px;
    padding: 7px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    font-family: inherit; opacity: 0.9;
  }
  .docs-open:hover { opacity: 1; }
  /* code viewer pane */
  .docs-code-view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-code-view.visible { display: flex; }
  .docs-code-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #111c30; border-bottom: 1px solid #1e293b;
    flex-wrap: wrap;
  }
  .docs-code-title { color: #fbbf24; font-weight: 800; font-size: 0.9rem; font-family: ui-monospace, Consolas, monospace; }
  .docs-code-meta { color: #64748b; font-size: 0.75rem; margin-right: auto; }
  .docs-code-btn {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
    padding: 6px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: inherit;

  .docs-code-btn.copied { background: #14532d; border-color: #16a34a; color: #bbf7d0; }
  .docs-code-pre { flex: 1; overflow: auto; margin: 0; padding: 16px 18px; }

  .docs-nav-item.docs-nav-shots.active { background: #1d4ed8; color: #eff6ff; }
  .docs-nav-item.docs-nav-shots.active .docs-nav-sub { color: #bfdbfe; }

    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-shots-view.visible { display: flex; }
  .docs-shots-viewer {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 72px;

  .docs-shots-img {
    max-width: 100%; max-height: 100%;
    border-radius: 10px; border: 1px solid #1e293b;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5); background: #1e293b;

  .docs-shots-arrow:hover { background: #334155; }

  .docs-shots-arrow.next { right: 14px; }

    border-top: 1px solid #1e293b; background: #111c30;

  }
  .docs-shots-counter { color: #93c5fd; font-weight: 800; font-size: 0.8rem; margin: 0 0 8px; }

  .docs-shots-info dt { color: #64748b; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .docs-shots-info dd { color: #e2e8f0; font-size: 0.8rem; margin: 2px 0 0; overflow-wrap: anywhere; }
  .docs-shots-thumbs {

  .docs-shots-thumb {

  .docs-shots-thumb span { display: block; padding: 5px 7px; font-size: 0.66rem; color: #94a3b8; text-align: left; }
  .docs-shots-thumb.active span { color: #bfdbfe; }
  @media (max-width: 860px) {

    .docs-shots-arrow.prev { left: 4px; }
    .docs-shots-arrow.next { right: 4px; }

  @media (max-width: 860px) {
    .docs-shell { flex-direction: column; }
    .docs-menu { width: 100%; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid #1e293b; }
    .docs-nav { display: flex; overflow-x: auto; padding: 6px; }
    .docs-nav-item { white-space: nowrap; margin: 0 2px; }
    .docs-brand { display: none; }
    .docs-menu-footer { display: none; }
  }
</style>

e=\"1:1\" selected>Square 1:1<\/option>\r\n              <option value=\"4:3\">Landscape 4:3<\/option>\r\n              <option value=\"3:2\">Photo 3:2<\/option>\r\n              <option value=\"16:9\">Wide 16:9<\/option>\r\n            <\/select>\r\n          <\/div>\r\n          <div class=\"iet-field\">\r\n            <label for=\"col-width\">Canvas width (px)<\/label>\r\n            <input type=\"number\" id=\"col-width\" class=\"iet-input\" min=\"200\" max=\"8000\" step=\"10\" value=\"1600\">\r\n          <\/div>\r\n          <div class=\"iet-field\">\r\n            <label for=\"col-gap\">Gap <span class=\"iet-val\" id=\"col-gap-val\">8<\/span>px<\/label>\r\n            <input type=\"range\" id=\"col-gap\" class=\"iet-range\" min=\"0\" max=\"40\" value=\"8\">\r\n          <\/div>\r\n          <div class=\"iet-field\">\r\n            <label for=\"col-pad\">Padding <span class=\"iet-val\" id=\"col-pad-val\">24<\/span>px<\/label>\r\n            <input type=\"range\" id=\"col-pad\" class=\"iet-range\" min=\"0\" max=\"100\" value=\"24\">\r\n          <\/div>\r\n          <div class=\"iet-field\"><label for=\"col-bg\">Background<\/label><input type=\"color\" id=\"col-bg\" class=\"iet-color\" value=\"#ffffff\"><\/div>\r\n        <\/div>\r\n        <div class=\"iet-field\">\r\n          <label>Slots<\/label>\r\n          <div id=\"col-slots\" class=\"iet-slots\"><\/div>\r\n        <\/div>\r\n        <div class=\"iet-field\">\r\n          <label>Selected slot <span class=\"iet-val\" id=\"col-slot-sel-label\">— click a slot —<\/span><\/label>\r\n          <div class=\"iet-row\">\r\n            <div class=\"iet-field iet-grow\">\r\n              <label for=\"col-slot-border\">Border <span class=\"iet-val\" id=\"col-slot-border-val\">0<\/span>px<\/label>\r\n              <input type=\"range\" id=\"col-slot-border\" class=\"iet-range\" min=\"0\" max=\"40\" value=\"0\">\r\n            <\/div>\r\n            <div class=\"iet-field iet-grow\">\r\n              <label for=\"col-slot-radius\">Radius <span class=\"iet-val\" id=\"col-slot-radius-val\">0<\/span>px<\/label>\r\n              <input type=\"range\" id=\"col-slot-radius\" class=\"iet-range\" min=\"0\" max=\"200\" value=\"0\">\r\n            <\/div>\r\n          <\/div>\r\n          <div class=\"iet-row\">\r\n            <label for=\"col-slot-borderc\" style=\"align-self:center;\">Border color<\/label>\r\n            <input type=\"color\" id=\"col-slot-borderc\" class=\"iet-color\" value=\"#ffffff\">\r\n          <\/div>\r\n        <\/div>\r\n        <div class=\"iet-row\">\r\n          <button id=\"col-ai\" class=\"iet-btn\" type=\"button\" title=\"Ask the AI to propose a layout for your photos\">✨ AI layout<\/button>\r\n          <button id=\"col-build\" class=\"iet-btn iet-btn-primary\" type=\"button\">🧩 Build collage<\/button>\r\n        <\/div>\r\n      <\/div>\r\n\r\n      <!-- OCR -->\r\n      <div class=\"iet-pane\" id=\"pane-ocr\">\r\n        <h3 class=\"iet-pane-title\">OCR — text from image<\/h3>\r\n        <p class=\"iet-pane-hint\">Load a photo or scan of a document and pull out its text. The built-in engine runs fully in the browser; the AI engine works through the CMS AI gateway.<\/p>\r\n        <div class=\"iet-field\">\r\n          <label for=\"ocr-lang\">Language<\/label>\r\n          <select id=\"ocr-lang\" class=\"iet-input\">\r\n            <option value=\"eng\" selected>English<\/option>\r\n            <option value=\"tur\">Türkçe<\/option>\r\n            <option value=\"deu\">Deutsch<\/option>\r\n            <option value=\"fra\">Français<\/option>\r\n            <option value=\"spa\">Español<\/option>\r\n            <option value=\"ita\">Italiano<\/option>\r\n            <option value=\"por\">Português<\/option>\r\n            <option value=\"rus\">Русский<\/option>\r\n            <option value=\"ara\">العربية<\/option>\r\n            <option value=\"chi_sim\">中文 (简体)<\/option>\r\n            <option value=\"jpn\">日本語<\/option>\r\n            <option value=\"kor\">한국어<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"iet-row iet-wrap\">\r\n          <button id=\"ocr-btn-local\" class=\"iet-btn iet-btn-primary\" type=\"button\">🔍 Extract (built-in engine)<\/button>\r\n          <button id=\"ocr-btn-ai\" class=\"iet-btn\" type=\"button\">🤖 Extract with AI<\/button>\r\n          <button id=\"ocr-btn-cms\" class=\"iet-btn\" type=\"button\" style=\"display:none\">☁️ From CMS<\/button>\r\n          <button id=\"ocr-pdf\" class=\"iet-btn\" type=\"button\" title=\"Upload a PDF and extract its text\">📄 From PDF<\/button>\r\n        <\/div>\r\n        <div class=\"iet-row iet-wrap\">\r\n          <button id=\"ocr-save\" class=\"iet-btn\" type=\"button\" title=\"Save the current result to history\">💾 Save to history<\/button>\r\n          <button id=\"ocr-csv\" class=\"iet-btn\" type=\"button\" title=\"Detect tables/lists in the result and export CSV\">📊 Table → CSV<\/button>\r\n          <button id=\"ocr-tsv\" class=\"iet-btn\" type=\"button\" title=\"Detect tables/lists and export TSV\">📊 Table → TSV<\/button>\r\n          <button id=\"ocr-tr\" class=\"iet-btn\" type=\"button\" title=\"Translate the extracted text with AI\">🌐 Translate<\/button>\r\n        <\/div>\r\n        <div class=\"iet-field\">\r\n          <label for=\"ocr-tr-lang\">Translate to<\/label>\r\n          <select id=\"ocr-tr-lang\" class=\"iet-input\">\r\n            <option value=\"English\" selected>English<\/option>\r\n            <option value=\"Turkish\">Türkçe<\/option>\r\n            <option value=\"German\">Deutsch<\/option>\r\n            <option value=\"French\">Français<\/option>\r\n            <option value=\"Spanish\">Español<\/option>\r\n            <option value=\"Arabic\">العربية<\/option>\r\n            <option value=\"Russian\">Русский<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"iet-field\">\r\n          <label for=\"ocr-search\">History (click to reopen)<\/label>\r\n          <input type=\"text\" id=\"ocr-search\" class=\"iet-input\" placeholder=\"Search saved extractions…\">\r\n          <div id=\"ocr-history\" class=\"iet-ocr-history\"><\/div>\r\n        <\/div>\r\n        <div class=\"iet-status\" id=\"ocr-status\" style=\"display:none\"><\/div>\r\n        <div class=\"iet-field\">\r\n          <label for=\"ocr-result\">Result<\/label>\r\n          <textarea id=\"ocr-result\" class=\"iet-textarea\" rows=\"9\" placeholder=\"Extracted text appears here…\"><\/textarea>\r\n        <\/div>\r\n        <div class=\"iet-row iet-wrap\">\r\n          <button id=\"ocr-copy\" class=\"iet-btn\" type=\"button\">📋 Copy<\/button>\r\n          <button id=\"ocr-download\" class=\"iet-btn\" type=\"button\">⬇ Save .txt<\/button>\r\n          <button id=\"ocr-clear\" class=\"iet-btn\" type=\"button\">🗑 Clear<\/button>\r\n        <\/div>\r\n      <\/div>\r\n    <\/aside>\r\n\r\n    <section class=\"iet-stage\" id=\"iet-stage\">\r\n      <div class=\"iet-dropzone\" id=\"iet-drop\" role=\"button\" tabindex=\"0\" aria-label=\"Drop an image here\">\r\n        <div class=\"iet-drop-ic\">🖼️<\/div>\r\n        <div class=\"iet-drop-title\" id=\"iet-drop-title\">Drop an image here<\/div>\r\n        <div class=\"iet-drop-sub\">or click to browse · paste with Ctrl+V<\/div>\r\n        <button class=\"iet-linkbtn\" id=\"iet-drop-cms\" type=\"button\" style=\"display:none\">…or pick a file from CMS storage<\/button>\r\n      <\/div>\r\n      <div class=\"iet-canvas-wrap\" id=\"iet-canvas-wrap\" style=\"display:none\">\r\n        <canvas id=\"iet-preview\"><\/canvas>\r\n      <\/div>\r\n      <div class=\"iet-restore\" id=\"iet-restore\" style=\"display:none\">\r\n        <span>💾 Last session: <b id=\"iet-restore-name\">—<\/b><\/span>\r\n        <button id=\"iet-restore-btn\" class=\"iet-zoom-btn\" type=\"button\" title=\"Restore the low-res session preview\">Restore<\/button>\r\n        <button id=\"iet-restore-x\" class=\"iet-zoom-btn\" type=\"button\" title=\"Dismiss\">✕<\/button>\r\n      <\/div>\r\n      <div class=\"iet-workspace\" id=\"iet-workspace\" style=\"display:none\"><\/div>\r\n      <div class=\"iet-stage-meta\" id=\"iet-stage-meta\" style=\"display:none\">\r\n        <div class=\"iet-viewbar\">\r\n          <select id=\"iet-zoom-preset\" class=\"iet-zoom-select\" title=\"How to show the image\">\r\n            <option value=\"fit\" selected>Fit to window<\/option>\r\n            <option value=\"0.25\">25%<\/option>\r\n            <option value=\"0.5\">50%<\/option>\r\n            <option value=\"1\">Full size (100%)<\/option>\r\n            <option value=\"2\">200%<\/option>\r\n            <option value=\"4\">400%<\/option>\r\n            <option value=\"custom\" hidden>Custom<\/option>\r\n          <\/select>\r\n          <button id=\"iet-zoom-out\" class=\"iet-zoom-btn\" type=\"button\" title=\"Zoom out\">−<\/button>\r\n          <button id=\"iet-zoom-pct\" class=\"iet-zoom-btn iet-zoom-pct\" type=\"button\" title=\"Click to fit to window\">Fit<\/button>\r\n          <button id=\"iet-zoom-in\" class=\"iet-zoom-btn\" type=\"button\" title=\"Zoom in\">+<\/button>\r\n          <button id=\"iet-zoom-100\" class=\"iet-zoom-btn\" type=\"button\" title=\"Full size (100%)\">1:1<\/button>\r\n          <button id=\"iet-compare\" class=\"iet-zoom-btn\" type=\"button\" title=\"Before / after — drag the divider on the preview\">⇆<\/button>\r\n        <\/div>\r\n        <span id=\"iet-meta-dims\">—<\/span>\r\n        <span id=\"iet-meta-steps\">—<\/span>\r\n        <span class=\"iet-chain-hint\">Scroll = zoom · drag = pan · edits chain (Undo / Reset)<\/span>\r\n      <\/div>\r\n      <div class=\"iet-busy\" id=\"iet-busy\" style=\"display:none\">\r\n        <div class=\"iet-spinner\"><\/div>\r\n        <span id=\"iet-busy-text\">Working…<\/span>\r\n      <\/div>\r\n    <\/section>\r\n  <\/div>\r\n\r\n  <div class=\"iet-modal\" id=\"iet-modal\" style=\"display:none\">\r\n    <div class=\"iet-modal-box\">\r\n      <div class=\"iet-modal-head\">\r\n        <span id=\"iet-modal-title\">…<\/span>\r\n        <button id=\"iet-modal-close\" class=\"iet-modal-x\" type=\"button\" title=\"Close\">✕<\/button>\r\n      <\/div>\r\n      <div class=\"iet-modal-body\" id=\"iet-modal-body\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <input type=\"file\" id=\"iet-file\" accept=\"image/*\" hidden>\r\n  <input type=\"file\" id=\"iet-logo-file\" accept=\"image/*\" hidden>\r\n  <input type=\"file\" id=\"iet-batch-file\" accept=\"image/*\" multiple hidden>\r\n  <input type=\"file\" id=\"iet-gif-file\" accept=\"image/gif\" hidden>\r\n  <input type=\"file\" id=\"iet-project-file\" accept=\".json,application/json\" hidden>\r\n<\/div>\r\n"},"css":{"name":"ImageEditingTools.css","src":"../app/ImageEditingTools.css","content":"*,\r\n*::before,\r\n*::after {\r\n  box-sizing: border-box;\r\n  margin: 0;\r\n  padding: 0;\r\n}\r\n\r\nhtml,\r\nbody {\r\n  height: 100%;\r\n  background: transparent;\r\n  font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif);\r\n}\r\n\r\n#app {\r\n  display: flex;\r\n  flex-direction: column;\r\n  height: 100vh;\r\n  border: 0.5px solid var(--color-border-tertiary, #e2e2e2);\r\n  border-radius: var(--border-radius-lg, 12px);\r\n  overflow: hidden;\r\n  background: var(--color-background-primary, #fff);\r\n  color: var(--color-text-primary, #111);\r\n  --iet-accent: #4338ca;\r\n  --iet-accent-soft: #eef0ff;\r\n}\r\n\r\n/* ── Header ─────────────────────────────────────────── */\r\n.iet-header {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  padding: 10px 14px;\r\n  border-bottom: 0.5px solid var(--color-border-tertiary, #e2e2e2);\r\n  background: var(--color-background-secondary, #f5f5f3);\r\n  flex-shrink: 0;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.iet-brand { display: flex; align-items: center; gap: 10px; }\r\n.iet-brand-icon {\r\n  width: 34px; height: 34px;\r\n  display: flex; align-items: center; justify-content: center;\r\n  font-size: 18px;\r\n  background: var(--iet-accent-soft);\r\n  border-radius: 9px;\r\n}\r\n.iet-brand-text { display: flex; flex-direction: column; line-height: 1.2; }\r\n.iet-brand-text strong { font-size: 14px; }\r\n.iet-sub { font-size: 11px; color: var(--color-text-secondary, #666); }\r\n\r\n.iet-filechip { display: flex; align-items: center; gap: 6px; min-width: 0; }\r\n.iet-chip {\r\n  font-size: 11.5px; font-weight: 500;\r\n  padding: 3px 10px;\r\n  border-radius: 999px;\r\n  background: var(--color-background-primary, #fff);\r\n  border: 0.5px solid var(--color-border-tertiary, #e2e2e2);\r\n  max-width: 260px;\r\n  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\r\n}\r\n.iet-chip-dim { color: var(--color-text-secondary, #666); font-weight: 400; }\r\n\r\n.iet-header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\r\n.iet-lock {\r\n  font-size: 11px; color: #9a6700; background: #fff7e0;\r\n  border: 0.5px solid #f0d78c; border-radius: 6px; padding: 3px 8px;\r\n}\r\n\r\n/* ── Buttons ────────────────────────────────────────── */\r\n.iet-btn {\r\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\r\n  padding: 7px 13px;\r\n  font-size: 12.5px; font-weight: 500; font-family: inherit;\r\n  color: var(--color-text-primary, #111);\r\n  background: var(--color-background-primary, #fff);\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  cursor: pointer;\r\n  transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;\r\n  white-space: nowrap;\r\n}\r\n.iet-btn:hover:not(:disabled) { background: var(--color-background-secondary, #f5f5f3); }\r\n.iet-btn:disabled { opacity: 0.45; cursor: not-allowed; }\r\n.iet-btn-primary {\r\n  background: var(--iet-accent); color: #fff;\r\n  border-color: var(--iet-accent);\r\n}\r\n.iet-btn-primary:hover:not(:disabled) { background: #3730a3; }\r\n.iet-btn-fit { align-self: flex-end; margin-bottom: 13px; }\r\n\r\n/* ── Tabs ───────────────────────────────────────────── */\r\n.iet-tabs {\r\n  display: flex;\r\n  gap: 4px;\r\n  padding: 8px 12px;\r\n  border-bottom: 0.5px solid var(--color-border-tertiary, #e2e2e2);\r\n  background: var(--color-background-secondary, #f5f5f3);\r\n  overflow-x: auto;\r\n  flex-shrink: 0;\r\n}\r\n.iet-tabs::-webkit-scrollbar { height: 0; }\r\n.iet-tab {\r\n  flex-shrink: 0;\r\n  padding: 6px 13px;\r\n  font-size: 12.5px; font-weight: 500; font-family: inherit;\r\n  color: var(--color-text-secondary, #666);\r\n  background: transparent;\r\n  border: 0.5px solid transparent;\r\n  border-radius: 999px;\r\n  cursor: pointer;\r\n  transition: color 0.15s, background 0.15s, border-color 0.15s;\r\n}\r\n.iet-tab:hover { color: var(--color-text-primary, #111); background: var(--color-background-primary, #fff); }\r\n.iet-tab.active {\r\n  color: var(--iet-accent);\r\n  background: var(--iet-accent-soft);\r\n  border-color: #d9dbfb;\r\n  font-weight: 600;\r\n}\r\n\r\n/* ── Layout ─────────────────────────────────────────── */\r\n.iet-main { display: flex; flex: 1; min-height: 0; }\r\n\r\n.iet-side {\r\n  width: 330px; flex-shrink: 0;\r\n  overflow-y: auto;\r\n  padding: 14px;\r\n  border-right: 0.5px solid var(--color-border-tertiary, #e2e2e2);\r\n  background: var(--color-background-primary, #fff);\r\n}\r\n\r\n.iet-stage {\r\n  flex: 1; min-width: 0;\r\n  display: flex; flex-direction: column;\r\n  position: relative;\r\n  background: #14161c;\r\n  padding: 12px;\r\n}\r\n\r\n/* ── Panes ──────────────────────────────────────────── */\r\n.iet-pane { display: none; }\r\n.iet-pane.active { display: block; animation: ietFade 0.18s ease; }\r\n@keyframes ietFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\r\n\r\n.iet-pane-title { font-size: 14.5px; margin-bottom: 4px; }\r\n.iet-pane-hint {\r\n  font-size: 12px; color: var(--color-text-secondary, #666);\r\n  line-height: 1.5; margin-bottom: 12px;\r\n}\r\n\r\n.iet-field { margin-bottom: 11px; }\r\n.iet-field > label {\r\n  display: block;\r\n  font-size: 11.5px; font-weight: 600;\r\n  color: var(--color-text-secondary, #555);\r\n  margin-bottom: 5px;\r\n}\r\n.iet-val { color: var(--iet-accent); font-weight: 600; }\r\n\r\n.iet-input, .iet-textarea {\r\n  width: 100%;\r\n  padding: 7px 10px;\r\n  font-size: 12.5px; font-family: inherit;\r\n  color: var(--color-text-primary, #111);\r\n  background: var(--color-background-primary, #fff);\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  outline: none;\r\n}\r\n.iet-input:focus, .iet-textarea:focus { border-color: var(--iet-accent); box-shadow: 0 0 0 2px rgba(67, 56, 202, 0.15); }\r\n.iet-textarea { resize: vertical; line-height: 1.5; min-height: 120px; }\r\n.iet-color { width: 100%; height: 34px; padding: 3px; border: 0.5px solid var(--color-border-secondary, #cfcfcf); border-radius: 8px; background: var(--color-background-primary, #fff); cursor: pointer; }\r\n\r\n.iet-range { width: 100%; accent-color: var(--iet-accent); cursor: pointer; }\r\n\r\n.iet-row { display: flex; gap: 8px; margin-bottom: 11px; align-items: center; }\r\n.iet-wrap { flex-wrap: wrap; }\r\n.iet-grow { flex: 1; }\r\n\r\n.iet-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }\r\n.iet-grid2 .iet-field { min-width: 0; }\r\n\r\n.iet-lockbtn {\r\n  align-self: flex-end; margin-bottom: 11px;\r\n  width: 34px; height: 34px;\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px; background: var(--color-background-primary, #fff);\r\n  cursor: pointer; font-size: 14px;\r\n}\r\n.iet-lockbtn.active { background: var(--iet-accent-soft); border-color: #c7cbf5; }\r\n\r\n.iet-chips { display: flex; flex-wrap: wrap; gap: 6px; }\r\n.iet-chip-btn {\r\n  padding: 4px 11px;\r\n  font-size: 11.5px; font-weight: 500; font-family: inherit;\r\n  color: var(--color-text-secondary, #555);\r\n  background: var(--color-background-primary, #fff);\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 999px;\r\n  cursor: pointer;\r\n  transition: all 0.15s;\r\n}\r\n.iet-chip-btn:hover { border-color: var(--iet-accent); color: var(--iet-accent); }\r\n.iet-chip-btn.active { background: var(--iet-accent); border-color: var(--iet-accent); color: #fff; }\r\n\r\n.iet-est {\r\n  font-size: 12px; color: var(--color-text-secondary, #555);\r\n  background: var(--color-background-secondary, #f5f5f3);\r\n  border: 0.5px dashed var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  padding: 8px 10px;\r\n  margin-bottom: 11px;\r\n  line-height: 1.5;\r\n}\r\n\r\n/* ── Watermark ──────────────────────────────────────── */\r\n.iet-posgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }\r\n.iet-pos-btn {\r\n  padding: 8px 0;\r\n  font-size: 13px;\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  background: var(--color-background-primary, #fff);\r\n  cursor: pointer;\r\n  transition: all 0.15s;\r\n}\r\n.iet-pos-btn:hover { border-color: var(--iet-accent); }\r\n.iet-pos-btn.active { background: var(--iet-accent); border-color: var(--iet-accent); color: #fff; }\r\n.iet-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--color-text-primary, #111); cursor: pointer; }\r\n.iet-check input { accent-color: var(--iet-accent); }\r\n\r\n/* ── Collage ────────────────────────────────────────── */\r\n.iet-layouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }\r\n.iet-layout-btn {\r\n  display: flex; flex-direction: column; align-items: center; gap: 4px;\r\n  padding: 8px 4px 7px;\r\n  font-size: 10.5px; font-weight: 500; font-family: inherit;\r\n  color: var(--color-text-secondary, #555);\r\n  background: var(--color-background-primary, #fff);\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  cursor: pointer;\r\n  transition: all 0.15s;\r\n}\r\n.iet-layout-ic { font-size: 16px; line-height: 1; letter-spacing: 2px; }\r\n.iet-layout-btn:hover { border-color: var(--iet-accent); color: var(--iet-accent); }\r\n.iet-layout-btn.active { border-color: var(--iet-accent); background: var(--iet-accent-soft); color: var(--iet-accent); }\r\n\r\n.iet-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\r\n.iet-slot {\r\n  border: 0.5px dashed var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 10px;\r\n  overflow: hidden;\r\n  background: var(--color-background-secondary, #f5f5f3);\r\n  transition: border-color 0.15s, background 0.15s;\r\n}\r\n.iet-slot.dragover { border-color: var(--iet-accent); background: var(--iet-accent-soft); }\r\n.iet-slot-body { height: 82px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }\r\n.iet-slot-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }\r\n.iet-slot-empty { text-align: center; color: var(--color-text-secondary, #888); font-size: 11px; line-height: 1.5; }\r\n.iet-slot-empty b { display: block; font-size: 18px; font-weight: 400; }\r\n.iet-slot-bar { display: flex; gap: 4px; align-items: center; padding: 5px; border-top: 0.5px solid var(--color-border-tertiary, #e2e2e2); background: var(--color-background-primary, #fff); }\r\n.iet-slot-fit { flex: 1; min-width: 0; font-size: 11px; padding: 4px 6px; border: 0.5px solid var(--color-border-secondary, #cfcfcf); border-radius: 6px; background: var(--color-background-primary, #fff); }\r\n.iet-slot-btn {\r\n  width: 24px; height: 24px; flex-shrink: 0;\r\n  font-size: 11px;\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 6px; background: var(--color-background-primary, #fff);\r\n  cursor: pointer;\r\n}\r\n.iet-slot-btn:hover { border-color: var(--iet-accent); color: var(--iet-accent); }\r\n\r\n/* ── Stage ──────────────────────────────────────────── */\r\n.iet-dropzone {\r\n  flex: 1;\r\n  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;\r\n  margin: 10px;\r\n  border: 2px dashed #3d465a;\r\n  border-radius: 16px;\r\n  color: #aab3c8;\r\n  cursor: pointer;\r\n  text-align: center;\r\n  transition: border-color 0.15s, background 0.15s, color 0.15s;\r\n  outline: none;\r\n}\r\n.iet-dropzone:hover, .iet-dropzone:focus-visible, .iet-dropzone.dragover {\r\n  border-color: #6d7cff;\r\n  background: rgba(109, 124, 255, 0.08);\r\n  color: #cdd3ff;\r\n}\r\n.iet-drop-ic { font-size: 44px; }\r\n.iet-drop-title { font-size: 16px; font-weight: 600; color: #e8eaf5; }\r\n.iet-drop-sub { font-size: 12px; }\r\n.iet-linkbtn {\r\n  margin-top: 8px;\r\n  background: none; border: none; cursor: pointer;\r\n  color: #8d9cff; font-size: 12px; font-family: inherit; text-decoration: underline;\r\n}\r\n.iet-linkbtn:hover { color: #b4bfff; }\r\n\r\n.iet-canvas-wrap {\r\n  flex: 1; min-height: 0;\r\n  display: flex; align-items: center; justify-content: center;\r\n}\r\n.iet-canvas-wrap canvas { border-radius: 6px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); touch-action: none; }\r\n\r\n.iet-stage-meta {\r\n  display: flex; align-items: center; gap: 8px;\r\n  padding-top: 10px; flex-shrink: 0;\r\n  color: #9aa3ba; font-size: 11.5px;\r\n}\r\n.iet-stage-meta span {\r\n  background: #1d2130;\r\n  border: 0.5px solid #2c3245;\r\n  border-radius: 6px;\r\n  padding: 3px 9px;\r\n}\r\n.iet-chain-hint { color: #6d7895 !important; background: transparent !important; border-color: transparent !important; margin-left: auto; }\r\n\r\n.iet-busy {\r\n  position: absolute; inset: 0; z-index: 10;\r\n  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;\r\n  background: rgba(13, 15, 21, 0.72);\r\n  color: #dfe3f0; font-size: 13px;\r\n}\r\n.iet-spinner {\r\n  width: 30px; height: 30px;\r\n  border: 3px solid rgba(255, 255, 255, 0.2);\r\n  border-top-color: #6d7cff;\r\n  border-radius: 50%;\r\n  animation: ietSpin 0.8s linear infinite;\r\n}\r\n@keyframes ietSpin { to { transform: rotate(360deg); } }\r\n\r\n/* ── OCR status ─────────────────────────────────────── */\r\n.iet-status {\r\n  font-size: 12px;\r\n  border-radius: 8px;\r\n  padding: 8px 10px;\r\n  margin-bottom: 11px;\r\n  line-height: 1.5;\r\n  background: var(--iet-accent-soft);\r\n  color: var(--iet-accent);\r\n  border: 0.5px solid #d9dbfb;\r\n}\r\n.iet-status.warn { background: #fff7e0; color: #9a6700; border-color: #f0d78c; }\r\n.iet-status.error { background: #fdeaea; color: #b3261e; border-color: #f3c1bd; }\r\n.iet-status.ok { background: #e8f7ee; color: #1a7a43; border-color: #bfe5cf; }\r\n\r\n/* ── Viewer zoom bar ──────────────────────────────────── */\r\n.iet-viewbar {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 4px;\r\n  background: #1d2130;\r\n  border: 0.5px solid #2c3245;\r\n  border-radius: 8px;\r\n  padding: 2px 4px;\r\n}\r\n.iet-zoom-select {\r\n  background: #1d2130;\r\n  color: #cbd2e4;\r\n  border: none;\r\n  font-size: 11.5px;\r\n  font-family: inherit;\r\n  padding: 3px 6px;\r\n  border-radius: 6px;\r\n  cursor: pointer;\r\n}\r\n.iet-zoom-select:hover,\r\n.iet-zoom-select:focus { background: #262c3f; outline: none; }\r\n.iet-zoom-btn {\r\n  min-width: 24px;\r\n  height: 22px;\r\n  background: transparent;\r\n  border: none;\r\n  border-radius: 6px;\r\n  color: #aeb6ca;\r\n  font-size: 13px;\r\n  font-family: inherit;\r\n  padding: 0 6px;\r\n  cursor: pointer;\r\n  transition: background 0.15s, color 0.15s;\r\n}\r\n.iet-zoom-btn:hover { background: #2a3042; color: #fff; }\r\n.iet-zoom-pct {\r\n  min-width: 46px;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  color: #8d9cff;\r\n  text-align: center;\r\n}\r\n\r\n/* ── Modal ───────────────────────────────────────────── */\r\n.iet-modal {\r\n  position: fixed;\r\n  inset: 0;\r\n  z-index: 100;\r\n  background: rgba(10, 12, 18, 0.55);\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  padding: 20px;\r\n}\r\n.iet-modal-box {\r\n  background: var(--color-background-primary, #fff);\r\n  color: var(--color-text-primary, #111);\r\n  border-radius: 12px;\r\n  width: 100%;\r\n  max-width: 560px;\r\n  max-height: 80vh;\r\n  display: flex;\r\n  flex-direction: column;\r\n  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);\r\n  overflow: hidden;\r\n}\r\n.iet-modal-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  padding: 12px 16px;\r\n  border-bottom: 0.5px solid var(--color-border-tertiary, #e2e2e2);\r\n  font-weight: 600;\r\n  font-size: 13.5px;\r\n  flex-shrink: 0;\r\n}\r\n.iet-modal-x {\r\n  border: none;\r\n  background: none;\r\n  cursor: pointer;\r\n  font-size: 14px;\r\n  color: var(--color-text-secondary, #666);\r\n  padding: 4px 8px;\r\n}\r\n.iet-modal-x:hover { color: var(--color-text-primary, #111); }\r\n.iet-modal-body { padding: 14px 16px; overflow-y: auto; font-size: 12.5px; line-height: 1.6; }\r\n\r\n/* ── Step history (op log) ───────────────────────────── */\r\n.iet-oplog-item {\r\n  display: flex;\r\n  gap: 8px;\r\n  align-items: center;\r\n  padding: 6px 8px;\r\n  border-radius: 8px;\r\n  cursor: pointer;\r\n}\r\n.iet-oplog-item:hover { background: var(--color-background-secondary, #f5f5f3); }\r\n.iet-oplog-item.current { background: var(--iet-accent-soft); }\r\n.iet-oplog-step { font-weight: 700; color: var(--iet-accent); min-width: 30px; font-size: 11px; }\r\n.iet-oplog-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.iet-oplog-time { color: var(--color-text-secondary, #888); font-size: 10.5px; }\r\n\r\n/* ── Misc controls ───────────────────────────────────── */\r\n.iet-subhint { font-size: 11px; color: var(--iet-accent); line-height: 1.4; }\r\n.iet-logo-name {\r\n  font-size: 11.5px;\r\n  color: var(--color-text-secondary, #666);\r\n  max-width: 180px;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n  align-self: center;\r\n}\r\n.iet-ocr-history {\r\n  max-height: 190px;\r\n  overflow-y: auto;\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  padding: 6px;\r\n  margin-top: 6px;\r\n}\r\n.iet-ocr-item {\r\n  padding: 6px 8px;\r\n  border-radius: 6px;\r\n  cursor: pointer;\r\n  display: flex;\r\n  gap: 6px;\r\n  align-items: center;\r\n  font-size: 11.5px;\r\n}\r\n.iet-ocr-item:hover { background: var(--color-background-secondary, #f5f5f3); }\r\n.iet-ocr-item b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.iet-ocr-empty { color: var(--color-text-secondary, #888); font-size: 11px; padding: 6px 8px; }\r\n.iet-meta-table { width: 100%; border-collapse: collapse; font-size: 12px; }\r\n.iet-meta-table td { padding: 4px 6px; border-bottom: 0.5px solid var(--color-border-tertiary, #e2e2e2); vertical-align: top; }\r\n.iet-meta-table td:first-child { color: var(--color-text-secondary, #666); width: 38%; }\r\n.iet-snippet-textarea {\r\n  width: 100%;\r\n  min-height: 110px;\r\n  font-family: ui-monospace, \"Cascadia Mono\", Consolas, monospace;\r\n  font-size: 11px;\r\n  padding: 8px;\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  background: var(--color-background-secondary, #f5f5f3);\r\n}\r\n\r\n/* ── Phase 2: workspace / restore / batch ─────────────── */\r\n.iet-restore {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 8px 12px;\r\n  margin: 0 10px 8px;\r\n  background: #1d2130;\r\n  border: 0.5px solid #2c3245;\r\n  border-radius: 10px;\r\n  color: #aeb6ca;\r\n  font-size: 12px;\r\n  flex-shrink: 0;\r\n}\r\n.iet-restore b { color: #dfe3f0; }\r\n.iet-workspace {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  overflow-x: auto;\r\n  padding: 4px 10px 8px;\r\n  flex-shrink: 0;\r\n}\r\n.iet-ws-chip {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  flex-shrink: 0;\r\n  padding: 4px 10px;\r\n  background: #1d2130;\r\n  border: 0.5px solid #2c3245;\r\n  border-radius: 999px;\r\n  color: #aeb6ca;\r\n  font-size: 11px;\r\n  cursor: pointer;\r\n  max-width: 180px;\r\n}\r\n.iet-ws-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.iet-ws-chip.active { border-color: #6d7cff; color: #cdd3ff; }\r\n.iet-ws-chip .x { color: #6d7895; font-size: 10px; padding: 0 2px; }\r\n.iet-ws-chip .x:hover { color: #ff6b63; }\r\n.iet-ws-add {\r\n  flex-shrink: 0;\r\n  padding: 4px 10px;\r\n  background: transparent;\r\n  border: 0.5px dashed #3d4661;\r\n  border-radius: 999px;\r\n  color: #8d9cff;\r\n  font-size: 11px;\r\n  cursor: pointer;\r\n  font-family: inherit;\r\n}\r\n.iet-ws-add:hover { border-color: #6d7cff; }\r\n.iet-zoom-btn.active { background: #3d4661; color: #fff; }\r\n.iet-batch-list {\r\n  max-height: 170px;\r\n  overflow-y: auto;\r\n  border: 0.5px solid var(--color-border-secondary, #cfcfcf);\r\n  border-radius: 8px;\r\n  padding: 6px;\r\n}\r\n.iet-batch-item {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  padding: 4px 8px;\r\n  border-radius: 6px;\r\n  font-size: 11.5px;\r\n}\r\n.iet-batch-item:hover { background: var(--color-background-secondary, #f5f5f3); }\r\n.iet-batch-item b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.iet-batch-item .size { color: var(--color-text-secondary, #888); font-size: 10.5px; }\r\n.iet-slot.selected { border-color: var(--iet-accent); border-style: solid; box-shadow: 0 0 0 2px rgba(67, 56, 202, 0.18); }\r\n#ann-emoji-pick .iet-chip-btn { font-size: 15px; padding: 3px 9px; }\r\n.iet-gif-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 6px 8px;\r\n  border-radius: 8px;\r\n  font-size: 12px;\r\n}\r\n.iet-gif-row:hover { background: var(--color-background-secondary, #f5f5f3); }\r\n.iet-gif-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n\r\n/* ── Responsive ─────────────────────────────────────── */\r\n@media (max-width: 900px) {\r\n  .iet-main { flex-direction: column; overflow-y: auto; }\r\n  .iet-side { width: 100%; border-right: none; border-bottom: 0.5px solid var(--color-border-tertiary, #e2e2e2); }\r\n  .iet-stage { min-height: 340px; }\r\n  .iet-sub { display: none; }\r\n}\r\n"},"js":{"name":"ImageEditingTools.js","src":"../app/ImageEditingTools.js","content":"// ════════════════════════════════════════════════════════════════\r\n// Image Editing Tools — UniconHub html-tool\r\n// A lightweight, event-based image editing toolbox for the CMS:\r\n//   • Convert   — PNG / JPEG / WebP converter, favicon pack, base64\r\n//   • Resize    — pixel dimensions with aspect lock\r\n//   • Crop      — drag/numeric crop, social-size presets, circle crop\r\n//   • Rotate    — quarter turns, flips, fine rotation, horizon straighten\r\n//   • Frame     — border / mat / radius / shadow + Polaroid preset\r\n//   • Filters   — live sliders, presets v2, duotone, vignette, grain,\r\n//                 auto-enhance, area pixelate/blur, portrait blur\r\n//   • Annotate  — arrows, boxes, circles, freehand, highlighter,\r\n//                 speech/thought bubbles, emoji stickers\r\n//   • Batch     — one pipeline over many files, ZIP download\r\n//   • Compress  — quality slider + auto-tune to a target size\r\n//   • Watermark — text stamp, pill, meme, logo, free placement,\r\n//                 photo stamp (date/time/camera), AI suggestions\r\n//   • Collage   — predefined + custom N×M frames, drag-reorder slots,\r\n//                 per-slot borders/radius\r\n//   • OCR       — built-in engine or AI gateway, history, tables →\r\n//                 CSV/TSV, PDF text extraction\r\n// Editing is chained: undo/redo, step-history jump, keyboard shortcuts,\r\n// before/after compare, multi-image workspace, touch pinch zoom, session\r\n// thumbnail restore, GIF frame explorer, print/PDF export, AI captions.\r\n// All edits are local (canvas in memory); only lightweight settings and\r\n// OCR history persist via tool.setValue(). No CMS object CRUD required.\r\n// ════════════════════════════════════════════════════════════════\r\n'use strict';\r\n\r\n// ── Constants ─────────────────────────────────────────────────\r\nvar MIME_EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' };\r\nvar MAX_PIXELS = 40 * 1000 * 1000; // 40 MP safety cap\r\nvar MAX_HISTORY = 25;\r\nvar MAX_FILE_BYTES = 40 * 1024 * 1024; // 40 MB\r\nvar ZOOM_STEPS = [0.1, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4];\r\nvar ANNOT_EMOJIS = ['🌟', '❤️', '🔥', '✅', '❗', '💯', '😂', '😍', '🎉', '👍', '⚡', '💡', '📌', '🏷️', '😎', '🦄', '🎂', '🎈', '🚀', '🔔', '💎', '😢'];\r\nvar FRAME_TEMPLATES = {\r\n  none: null,\r\n  birthday: { bg: '#fde8f2', accent: '#d63384', icon: '🎂' },\r\n  thanks: { bg: '#dff5ef', accent: '#0f766e', icon: '🙏' },\r\n  anniversary: { bg: '#fdeaea', accent: '#b91c1c', icon: '💕' },\r\n  holiday: { bg: '#e4f5e4', accent: '#15803d', icon: '🎄' }\r\n};\r\nvar SOCIAL_CROPS = [\r\n  { id: 'ig', label: 'IG 1:1', ar: 1, w: 1080, h: 1080 },\r\n  { id: 'story', label: 'Story 9:16', ar: 9 / 16, w: 1080, h: 1920 },\r\n  { id: 'yt', label: 'YouTube 16:9', ar: 16 / 9, w: 1280, h: 720 },\r\n  { id: 'fb', label: 'FB Cover', ar: 820 / 312, w: 820, h: 312 },\r\n  { id: 'li', label: 'LinkedIn', ar: 1584 / 396, w: 1584, h: 396 }\r\n];\r\n\r\nvar OCR_PROMPT = [\r\n  'You are an OCR (optical character recognition) assistant. The image to read is attached as a base64 data URL.',\r\n  'Transcribe ALL readable text from the image.',\r\n  'Rules:',\r\n  '- Return ONLY the transcribed text, preserving line breaks and reading order.',\r\n  '- Keep numbers, prices, dates, names and punctuation exactly as written.',\r\n  '- If the image contains no readable text, reply with exactly: NO_TEXT_FOUND',\r\n  '- Do not describe the image. Do not add commentary.'\r\n].join('\\n');\r\n\r\nvar LAYOUTS = {\r\n  side: {\r\n    label: 'Side by side',\r\n    slots: [{ x: 0, y: 0, w: 0.5, h: 1 }, { x: 0.5, y: 0, w: 0.5, h: 1 }]\r\n  },\r\n  stack: {\r\n    label: 'Stacked',\r\n    slots: [{ x: 0, y: 0, w: 1, h: 0.5 }, { x: 0, y: 0.5, w: 1, h: 0.5 }]\r\n  },\r\n  grid4: {\r\n    label: '2×2 grid',\r\n    slots: [\r\n      { x: 0, y: 0, w: 0.5, h: 0.5 }, { x: 0.5, y: 0, w: 0.5, h: 0.5 },\r\n      { x: 0, y: 0.5, w: 0.5, h: 0.5 }, { x: 0.5, y: 0.5, w: 0.5, h: 0.5 }\r\n    ]\r\n  },\r\n  strip3: {\r\n    label: '3 strips',\r\n    slots: [\r\n      { x: 0, y: 0, w: 1 / 3, h: 1 }, { x: 1 / 3, y: 0, w: 1 / 3, h: 1 }, { x: 2 / 3, y: 0, w: 1 / 3, h: 1 }\r\n    ]\r\n  },\r\n  col3: {\r\n    label: '3 rows',\r\n    slots: [\r\n      { x: 0, y: 0, w: 1, h: 1 / 3 }, { x: 0, y: 1 / 3, w: 1, h: 1 / 3 }, { x: 0, y: 2 / 3, w: 1, h: 1 / 3 }\r\n    ]\r\n  },\r\n  hero: {\r\n    label: 'Hero + 2',\r\n    slots: [\r\n      { x: 0, y: 0, w: 0.55, h: 1 },\r\n      { x: 0.55, y: 0, w: 0.45, h: 0.5 },\r\n      { x: 0.55, y: 0.5, w: 0.45, h: 0.5 }\r\n    ]\r\n  }\r\n};\r\n\r\nvar FONT_STACKS = {\r\n  sans: 'Arial, Helvetica, sans-serif',\r\n  serif: 'Georgia, \"Times New Roman\", serif',\r\n  mono: '\"Courier New\", Courier, monospace',\r\n  script: '\"Segoe Script\", \"Brush Script MT\", cursive',\r\n  impact: 'Impact, \"Arial Narrow\", sans-serif'\r\n};\r\n\r\nvar FILTER_SLIDERS = [\r\n  { id: 'flt-brightness', val: 'flt-brightness-val', unit: '%' },\r\n  { id: 'flt-contrast', val: 'flt-contrast-val', unit: '%' },\r\n  { id: 'flt-saturate', val: 'flt-saturate-val', unit: '%' },\r\n  { id: 'flt-hue', val: 'flt-hue-val', unit: '°' },\r\n  { id: 'flt-blur', val: 'flt-blur-val', unit: 'px' },\r\n  { id: 'flt-grayscale', val: 'flt-grayscale-val', unit: '%' },\r\n  { id: 'flt-sepia', val: 'flt-sepia-val', unit: '%' },\r\n  { id: 'flt-invert', val: 'flt-invert-val', unit: '%' },\r\n  { id: 'flt-vignette', val: 'flt-vignette-val', unit: '%' },\r\n  { id: 'flt-vig-soft', val: 'flt-vig-soft-val', unit: '%' },\r\n  { id: 'flt-grain', val: 'flt-grain-val', unit: '' }\r\n];\r\n\r\nvar FILTER_PRESETS = {\r\n  none: {},\r\n  bw: { 'flt-grayscale': 100 },\r\n  sepia: { 'flt-sepia': 100 },\r\n  vintage: { 'flt-sepia': 60, 'flt-contrast': 110, 'flt-brightness': 105, 'flt-hue': -15 },\r\n  cool: { 'flt-hue': -150, 'flt-saturate': 90, 'flt-brightness': 105 },\r\n  warm: { 'flt-hue': -25, 'flt-saturate': 125, 'flt-contrast': 105 },\r\n  vivid: { 'flt-saturate': 170, 'flt-contrast': 115 },\r\n  fade: { 'flt-brightness': 115, 'flt-contrast': 80, 'flt-saturate': 60 },\r\n  film: { 'flt-contrast': 115, 'flt-saturate': 85, 'flt-brightness': 95, 'flt-sepia': 15 },\r\n  neon: { 'flt-saturate': 200, 'flt-contrast': 130, 'flt-brightness': 110 },\r\n  kodak: { 'flt-sepia': 25, 'flt-contrast': 110, 'flt-saturate': 110, 'flt-brightness': 105 },\r\n  drama: { 'flt-contrast': 140, 'flt-grayscale': 30, 'flt-brightness': 95 },\r\n  noir: { 'flt-grayscale': 100, 'flt-contrast': 130, 'flt-brightness': 90 },\r\n  duotone: { 'flt-grayscale': 100, 'flt-contrast': 115 }\r\n};\r\n\r\nvar DEFAULTS = {\r\n  fmt: 'image/jpeg', quality: 85,\r\n  cmpFmt: 'image/jpeg', cmpQuality: 85,\r\n  ocrLang: 'eng', ocrHistory: [],\r\n  colLayout: 'side', colAspect: '1:1', colWidth: 1600,\r\n  colGap: 8, colPad: 24, colBg: '#ffffff',\r\n  wmText: '', wmSize: 48, wmFont: 'sans', wmColor: '#ffffff',\r\n  wmOpacity: 60, wmPos: 'mc', wmRot: 0, wmTile: false, wmShadow: true,\r\n  rszLock: true, cropAr: 'free', fltPreset: 'none',\r\n  frTemplate: 'none', frHeadline: ''\r\n};\r\n\r\n// ── State ─────────────────────────────────────────────────────\r\nvar _working = null;      // canvas — the image currently being edited\r\nvar _orig = null;         // canvas — pristine original\r\nvar _history = [];        // canvas undo stack\r\nvar _origMeta = { name: 'image', size: 0, type: '' };\r\nvar _filterLive = null;   // ctx.filter string while previewing filters\r\nvar _filterTimer = null;\r\nvar _cropRect = null;     // {x,y,w,h} in image coords\r\nvar _cropAr = 'free';\r\nvar _cropPtr = null;      // {start:{x,y}} while dragging a crop\r\nvar _previewFit = null;   // {dx,dy,dw,dh} of last drawn image\r\nvar _slots = [];          // collage slots: null or {canvas,name,fit}\r\nvar _pendingSlot = -1;    // slot index waiting for a file picker\r\nvar _ocrCanvas = null;\r\nvar _ocrBusy = false;\r\nvar _wmPos = 'mc';\r\nvar _rszLock = true;\r\nvar _fltPreset = 'none';\r\nvar _activeTab = 'convert';\r\nvar _settings = null;\r\nvar _saving = false;\r\nvar _saveTimer = null;\r\nvar _cnvEstTimer = null;\r\nvar _cmpEstTimer = null;\r\nvar _readOnly = false;\r\nvar _resizeObs = null;\r\nvar _zoomMode = 'fit';      // 'fit' = fit to window, 'zoom' = explicit scale\r\nvar _zoomScale = 1;         // 1 = full size (100%)\r\nvar _panX = 0, _panY = 0;   // pan offsets in CSS px\r\nvar _viewW = 0, _viewH = 0; // last preview viewport size\r\nvar _panPtr = null;         // {x, y, px, py} while panning\r\nvar _redo = [];             // canvas redo stack\r\nvar _opLog = [];            // [{label, time}] applied ops in order\r\nvar _opIndex = 0;           // number of ops currently applied (0 = original)\r\nvar _socialCrop = null;     // active social crop preset or null\r\nvar _straightenActive = false;\r\nvar _lineStart = null, _lineEnd = null; // horizon line in 0..1 preview coords\r\nvar _regionActive = false;\r\nvar _regionPtr = null;\r\nvar _regionRect = null;\r\nvar _annotMarks = [];\r\nvar _annotTool = 'arrow';\r\nvar _annotPtr = null;\r\nvar _logoCanvas = null;\r\nvar _logoName = '';\r\nvar _exifData = null;\r\nvar _frPreset = 'none';\r\nvar _ocrHistory = [];     // saved OCR extractions (persisted in settings)\r\nvar _colLayout = 'side';  // collage layout id (buttons set this, no input element)\r\nvar _compare = false;     // before/after split view\r\nvar _compareX = 0.5;      // divider position 0..1 across the image\r\nvar _comparePtr = null;\r\nvar _workspace = [];      // [{canvas, name}] multi-image workspace\r\nvar _batchFiles = [];     // File objects for batch mode\r\nvar _batchBusy = false;\r\nvar _annotEmoji = '🌟';\r\nvar _wmPlace = false;\r\nvar _wmFree = null;       // {x,y} free watermark position in image coords\r\nvar _wmPlacePtr = null;\r\nvar _gifFrames = [];\r\nvar _slotSel = -1;        // selected collage slot index\r\nvar _touch = {};          // pointerId -> {x,y} for pinch\r\nvar _pinch = null;        // {dist, scale, midX, midY, panX, panY}\r\nvar _pinching = false;\r\nvar _restoreThumb = '';\r\nvar _restoreName = '';\r\nvar _frTemplate = 'none';\r\nvar _aiLayout = null;      // AI-proposed collage layout override\r\nvar _avifSupport = null;   // cached AVIF encode capability probe\r\n\r\n// ── Small helpers ─────────────────────────────────────────────\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction esc(s) {\r\n  return String(s === null || s === undefined ? '' : s)\r\n    .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\r\n}\r\nfunction parseNum(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }\r\nfunction clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }\r\nfunction v(id) { var e = el(id); return e ? e.value : ''; }\r\nfunction setV(id, val) { var e = el(id); if (e) e.value = val; }\r\nfunction checked(id) { var e = el(id); return !!e && !!e.checked; }\r\nfunction fmtSize(bytes) {\r\n  var b = +bytes || 0;\r\n  if (b < 1024) return b + ' B';\r\n  if (b < 1024 * 1024) return (Math.round(b / 102.4) / 10) + ' KB';\r\n  return (Math.round(b / 104857.6) / 10) + ' MB';\r\n}\r\nfunction extOf(mime) { return MIME_EXT[mime] || 'img'; }\r\nfunction baseName() {\r\n  var n = _origMeta && _origMeta.name ? _origMeta.name : 'image';\r\n  n = String(n).replace(/\\.[^.]+$/, '');\r\n  return n || 'image';\r\n}\r\nfunction notify(msg, sev) {\r\n  if (typeof tool.notify === 'function') {\r\n    try { tool.notify(msg, sev || 'info'); return; } catch (e) {}\r\n  }\r\n  if (typeof console !== 'undefined') console.log( <script>
(function () {
  'use strict';
  var frame = document.getElementById('docs-frame');
  var openButton = document.getElementById('docs-open');
  var codeView = document.getElementById('docs-code-view');
  var codeTitle = document.getElementById('docs-code-title');
  var codeMeta = document.getElementById('docs-code-meta');
  var codeElement = document.getElementById('docs-code-code');
  var codeCopyButton = document.getElementById('docs-code-copy');
  var codeOpenButton = document.getElementById('docs-code-open');
  var navItems = Array.prototype.slice.call(document.querySelectorAll('.docs-nav-item'));
  var currentSource = 'ssot.html';
  var currentCodeKind = '';

  var codePayload = { html: null, css: null, js: null };
  try {
    codePayload = JSON.parse(document.getElementById('code-payload').textContent) || codePayload;
  } catch (error) { /* payload unavailable */ }

  /* ---- screenshots viewer ---- */
  var shotsView = document.getElementById('docs-shots-view');
  var shotsViewer = document.getElementById('docs-shots-viewer');
  var shotsImg = document.getElementById('docs-shots-img');
  var shotsEmpty = document.getElementById('docs-shots-empty');
  var shotsInfo = document.getElementById('docs-shots-info');
  var shotsThumbs = document.getElementById('docs-shots-thumbs');
  var shotsPrev = document.getElementById('docs-shots-prev');
  var shotsNext = document.getElementById('docs-shots-next');
  var shotsPayload = [];
  try {
    shotsPayload = JSON.parse(document.getElementById('shots-payload').textContent) || [];
  } catch (error) { /* payload unavailable */ }
  var currentShotIndex = 0;

  function renderShotsInfo(shot) {
    if (!shotsInfo) return;
    if (!shot) { shotsInfo.innerHTML = ''; return; }
    var fields = [
      ['File', shot.name || ''],
      ['Shot', shot.label || ''],
      ['Page', shot.page || ''],
      ['Viewport', shot.viewport || ''],
      ['Dimensions', shot.width && shot.height ? shot.width + ' \u00d7 ' + shot.height + ' px' : ''],
      ['Captured', shot.capturedAt ? shot.capturedAt.replace('T', ' ').slice(0, 19) + ' UTC' : ''],
      ['Used in', Array.isArray(shot.usedIn) && shot.usedIn.length ? shot.usedIn.join(', ') : 'docs index viewer'],
    ];
    shotsInfo.innerHTML = '<p class="docs-shots-counter">Screenshot ' + (currentShotIndex + 1) + ' of ' + shotsPayload.length + '</p>' +
      '<dl>' + fields.filter(function (field) { return field[1]; })
        .map(function (field) { return '<div><dt>' + field[0] + '</dt><dd>' + field[1] + '</dd></div>'; })
        .join('') + '</dl>';
  }

  function showShot(index) {
    if (!shotsPayload.length) {
      if (shotsImg) shotsImg.style.display = 'none';
      if (shotsEmpty) shotsEmpty.style.display = '';
      if (shotsPrev) shotsPrev.style.display = 'none';
      if (shotsNext) shotsNext.style.display = 'none';
      if (shotsThumbs) shotsThumbs.style.display = 'none';
      renderShotsInfo(null);
      return;
    }
    currentShotIndex = ((index % shotsPayload.length) + shotsPayload.length) % shotsPayload.length;
    var shot = shotsPayload[currentShotIndex];
    if (shotsImg) {
      shotsImg.style.display = '';
      shotsImg.src = shot.src;
    }
    if (shotsEmpty) shotsEmpty.style.display = 'none';
    if (shotsPrev) shotsPrev.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsNext) shotsNext.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsThumbs) {
      shotsThumbs.innerHTML = shotsPayload.map(function (entry, i) {
        return '<button class="docs-shots-thumb' + (i === currentShotIndex ? ' active' : '') + '" type="button" data-shot-index="' + i + '">' +
          '<img src="' + entry.src + '" alt="' + (entry.label || entry.name) + '" loading="lazy" />' +
          '<span>' + (entry.label || entry.name) + '</span></button>';
      }).join('');
    }
    renderShotsInfo(shot);
  }

  function openShotsPane() {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.add('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    showShot(currentShotIndex);
  }

  if (shotsThumbs) {
    shotsThumbs.addEventListener('click', function (event) {
      var thumb = event.target.closest ? event.target.closest('.docs-shots-thumb') : null;
      if (!thumb) return;
      showShot(Number(thumb.getAttribute('data-shot-index')) || 0);
    });
  }
  if (shotsPrev) shotsPrev.addEventListener('click', function () { showShot(currentShotIndex - 1); });
  if (shotsNext) shotsNext.addEventListener('click', function () { showShot(currentShotIndex + 1); });
  document.addEventListener('keydown', function (event) {
    if (!shotsView.classList.contains('visible')) return;
    if (event.key === 'ArrowLeft') showShot(currentShotIndex - 1);
    if (event.key === 'ArrowRight') showShot(currentShotIndex + 1);
    if (event.key === 'Escape') { shotsView.classList.remove('visible'); frame.style.display = ''; if (openButton) openButton.style.display = ''; }
  });

  function activateItem(activeItem) {
    navItems.forEach(function (item) { item.classList.toggle('active', item === activeItem); });
  }

  function showCodePane(kind) {
    var entry = codePayload[kind];
    currentCodeKind = kind;
    codeView.classList.add('visible');
    shotsView.classList.remove('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    if (!entry) {
      codeTitle.textContent = kind.toUpperCase() + ' code';
      codeMeta.textContent = 'no ' + kind + ' file in the app folder';
      codeElement.textContent = '';
      return;
    }
    codeTitle.textContent = entry.name;
    var lineCount = entry.content ? entry.content.split('\n').length : 0;
    codeMeta.textContent = lineCount + ' lines - ' + (entry.content ? entry.content.length : 0) + ' characters';
    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {
      showCodePane(item.getAttribute('data-doc').slice(5));
    } else {
      showDocumentPane(item);
    }
    try { window.location.hash = 'doc=' + item.getAttribute('data-doc'); } catch (error) { /* ignore */ }
  }

  navItems.forEach(function (item) {
    item.addEventListener('click', function () { openItem(item); });
  });

  if (openButton) {
    openButton.addEventListener('click', function () {
      var fullUrl = new URL(currentSource, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  if (codeCopyButton) {
    codeCopyButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      var text = entry && entry.content ? entry.content : '';
      if (!text) return;
      function markCopied() {
        codeCopyButton.textContent = 'Copied ✓';
        codeCopyButton.classList.add('copied');
        setTimeout(function () {
          codeCopyButton.textContent = 'Copy code';
          codeCopyButton.classList.remove('copied');
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function () { fallbackCopy(text, markCopied); });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
