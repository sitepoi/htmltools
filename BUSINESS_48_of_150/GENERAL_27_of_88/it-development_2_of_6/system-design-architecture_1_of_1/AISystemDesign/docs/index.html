<!--
  DOCS INDEX TEMPLATE - _docs/templates/_index-template.html
  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), and the test harness
  into a full-page pane - open ONLY this file to review everything about the
  tool. Self-contained (no shared assets) so it works anywhere. Created by
  scripts/init-docs.js as docs/index.html for every tool; the test-harness
  menu item appears only when the tool has app/test-harness.html. The code
  panes are embedded between the CODE-PAYLOAD markers and refreshed with
  `node scripts/refresh-docs-index.js <Tool>` after code changes.
  URL shortcut: index.html?doc=help (or ?doc=code-js) opens directly.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #1f2937; }
  .docs-shell { display: flex; height: 100vh; height: 100dvh; }
  .docs-menu {
    width: 236px; flex: 0 0 236px;
    background: #0f172a; color: #cbd5e1;
    display: flex; flex-direction: column;
    border-right: 1px solid #1e293b;
  }
  .docs-brand { padding: 18px 16px 14px; border-bottom: 1px solid #1e293b; }
  .docs-brand-name { font-weight: 800; color: #f8fafc; font-size: 0.95rem; line-height: 1.3; }
  .docs-brand-sub { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .docs-nav { flex: 1; overflow-y: auto; padding: 10px 10px; }
  .docs-nav-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    color: #cbd5e1; padding: 9px 12px; margin-bottom: 2px;
    border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 0.86rem; font-weight: 600;
  }
  .docs-nav-item:hover { background: #1e293b; color: #f1f5f9; }
  .docs-nav-item.active { background: #4f46e5; color: #ffffff; }
  .docs-nav-item .docs-nav-sub { display: block; font-size: 0.7rem; font-weight: 500; color: #64748b; margin-top: 1px; }
  .docs-nav-item.active .docs-nav-sub { color: #c7d2fe; }
  .docs-nav-item.docs-nav-code { color: #fbbf24; }
  .docs-nav-item.docs-nav-code:hover { background: #1e293b; color: #fcd34d; }
  .docs-nav-item.docs-nav-code.active { background: #b45309; color: #fffbeb; }
  .docs-nav-item.docs-nav-code.active .docs-nav-sub { color: #fde68a; }
  .docs-nav-item.docs-nav-harness { color: #86efac; }
  .docs-nav-item.docs-nav-harness:hover { background: #1e293b; color: #bbf7d0; }
  .docs-nav-sep { border: 0; border-top: 1px solid #1e293b; margin: 10px 4px; }
  .docs-nav-group-label { font-size: 0.66rem; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; padding: 8px 12px 2px; }
  .docs-menu-footer {
    padding: 12px 16px; border-top: 1px solid #1e293b;
    font-size: 0.72rem; color: #64748b;
  }
  .docs-stage { flex: 1; min-width: 0; background: #e2e8f0; position: relative; }
  .docs-frame {
    width: 100%; height: 100%; border: 0;
    display: block; background: #ffffff;
  }
  .docs-open {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: #0f172a; color: #e2e8f0; border: 0; border-radius: 8px;
    padding: 7px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    font-family: inherit; opacity: 0.9;
  }
  .docs-open:hover { opacity: 1; }
  /* code viewer pane */
  .docs-code-view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-code-view.visible { display: flex; }
  .docs-code-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #111c30; border-bottom: 1px solid #1e293b;
    flex-wrap: wrap;
  }
  .docs-code-title { color: #fbbf24; font-weight: 800; font-size: 0.9rem; font-family: ui-monospace, Consolas, monospace; }
  .docs-code-meta { color: #64748b; font-size: 0.75rem; margin-right: auto; }
  .docs-code-btn {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
    padding: 6px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .docs-code-btn:hover { background: #334155; }
  .docs-code-btn.copied { background: #14532d; border-color: #16a34a; color: #bbf7d0; }
  .docs-code-pre { flex: 1; overflow: auto; margin: 0; padding: 16px 18px; }
  .docs-code-code {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; color: #dbeafe;
    white-space: pre; tab-size: 4;
  }
  .docs-code-empty { color: #64748b; padding: 40px; text-align: center; font-size: 0.9rem; }
  /* screenshots viewer pane */
  .docs-nav-item.docs-nav-shots { color: #93c5fd; }
  .docs-nav-item.docs-nav-shots:hover { background: #1e293b; color: #bfdbfe; }
  .docs-nav-item.docs-nav-shots.active { background: #1d4ed8; color: #eff6ff; }
  .docs-nav-item.docs-nav-shots.active .docs-nav-sub { color: #bfdbfe; }
  .docs-shots-view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; background: #0b1220;
  }
  .docs-shots-view.visible { display: flex; }
  .docs-shots-viewer {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 72px;
  }
  .docs-shots-img {
    max-width: 100%; max-height: 100%;
    border-radius: 10px; border: 1px solid #1e293b;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5); background: #1e293b;
  }
  .docs-shots-empty { color: #64748b; text-align: center; font-size: 0.9rem; line-height: 1.7; }
  .docs-shots-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    font-size: 1.05rem; font-family: inherit;
  }
  .docs-shots-arrow:hover { background: #334155; }
  .docs-shots-arrow.prev { left: 14px; }
  .docs-shots-arrow.next { right: 14px; }
  .docs-shots-info {
    border-top: 1px solid #1e293b; background: #111c30;
    padding: 12px 18px;
  }
  .docs-shots-counter { color: #93c5fd; font-weight: 800; font-size: 0.8rem; margin: 0 0 8px; }
  .docs-shots-info dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 22px; margin: 0; }
  .docs-shots-info dt { color: #64748b; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .docs-shots-info dd { color: #e2e8f0; font-size: 0.8rem; margin: 2px 0 0; overflow-wrap: anywhere; }
  .docs-shots-thumbs {
    border-top: 1px solid #1e293b; padding: 10px 14px;
    display: flex; gap: 10px; overflow-x: auto;
  }
  .docs-shots-thumb {
    flex: 0 0 auto; width: 150px; padding: 0;
    border: 2px solid #1e293b; border-radius: 8px; overflow: hidden;
    cursor: pointer; background: #0f172a; font-family: inherit;
  }
  .docs-shots-thumb.active { border-color: #60a5fa; }
  .docs-shots-thumb img { width: 100%; height: 84px; object-fit: cover; object-position: top; display: block; }
  .docs-shots-thumb span { display: block; padding: 5px 7px; font-size: 0.66rem; color: #94a3b8; text-align: left; }
  .docs-shots-thumb.active span { color: #bfdbfe; }
  @media (max-width: 860px) {
    .docs-shots-viewer { padding: 14px 46px; }
    .docs-shots-arrow.prev { left: 4px; }
    .docs-shots-arrow.next { right: 4px; }
  }
  @media (max-width: 860px) {
    .docs-shell { flex-direction: column; }
    .docs-menu { width: 100%; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid #1e293b; }
    .docs-nav { display: flex; overflow-x: auto; padding: 6px; }
    .docs-nav-item { white-space: nowrap; margin: 0 2px; }
    .docs-brand { display: none; }
    .docs-menu-footer { display: none; }
  }
</style>

════════════════════════════════ -->\r\n<section class=\"ai-view active\" id=\"view-summary\">\r\n  <div class=\"ai-view-header\">\r\n    <div>\r\n      <div class=\"ai-view-title\">🧠 AI Architecture — Choose Your Solution<\/div>\r\n      <div class=\"ai-view-sub\">Three complete architectures. Compare side-by-side. Click any tab for deep-dive details.<\/div>\r\n    <\/div>\r\n  <\/div>\r\n  <div id=\"summary-content\">\r\n    <div style=\"text-align:center;padding:60px;color:var(--ai-text-muted)\">⏳ Loading solutions…<\/div>\r\n  <\/div>\r\n<\/section>\r\n<\/section>\r\n\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<!-- ARCHITECTURE VIEW -->\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<section class=\"ai-view\" id=\"view-architecture\">\r\n\r\n<!-- 1. ARCHITECTURE VIEW -->\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<section class=\"ai-view\" id=\"view-architecture\">\r\n  <div class=\"ai-view-header\">\r\n    <div>\r\n      <div class=\"ai-view-title\">System Architecture<\/div>\r\n      <div class=\"ai-view-sub\">Click any box to learn what it does and how it works<\/div>\r\n    <\/div>\r\n    <div class=\"ai-view-toolbar\">\r\n      <select class=\"ai-select\" id=\"arch-diagram-mode\" style=\"width:auto\">\r\n        <option value=\"dataflow\">📊 Data Flow Diagram<\/option>\r\n        <option value=\"agentic\">🔄 Agentic Flow Diagram<\/option>\r\n        <option value=\"assembly\">📝 Prompt Assembly Diagram<\/option>\r\n        <option value=\"localFlow\">🏠 Local LLM Flow (Simplified)<\/option>\r\n        <option value=\"cloudFlow\">☁️ Cloud API Flow (Simplified)<\/option>\r\n      <\/select>\r\n      <button class=\"ai-btn ai-btn-outline ai-btn-sm\" id=\"btn-export-diagram\">📋 View Plan<\/button>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Diagram + Side Panel Container -->\r\n  <div class=\"ai-arch-layout\" id=\"arch-layout\">\r\n    <!-- Diagram Area -->\r\n    <div class=\"ai-arch-diagram-area\">\r\n      <div class=\"ai-card\" id=\"arch-diagram-container\" style=\"margin-bottom:0\">\r\n        <div class=\"ai-card-header\">\r\n          <span class=\"ai-card-title\" id=\"arch-diagram-title\">🔀 Data Flow Diagram<\/span>\r\n        <\/div>\r\n        <div class=\"ai-diagram-wrap\" id=\"arch-diagram-svg\"><\/div>\r\n        <div class=\"ai-flow-legend\" style=\"padding:4px 12px;font-size:10px;color:var(--ai-text-muted);border-top:1px solid var(--ai-border-light)\">\r\n          <span>💡 Click any box for details →<\/span>\r\n        <\/div>\r\n      <\/div>\r\n    <\/div>\r\n    <!-- Side Detail Panel -->\r\n    <div class=\"ai-arch-side-panel\" id=\"arch-side-panel\">\r\n      <div class=\"ai-arch-side-inner\">\r\n        <div class=\"ai-card-header\" style=\"padding:0 0 10px 0;margin-bottom:10px\">\r\n          <span class=\"ai-card-title\" id=\"arch-side-title\">📌 Component Details<\/span>\r\n        <\/div>\r\n        <div class=\"ai-arch-side-body\" id=\"arch-side-body\"><\/div>\r\n        <div class=\"ai-arch-side-placeholder\" id=\"arch-side-placeholder\">\r\n          <div class=\"ai-empty\">👈 Click any component<br>in the diagram to see<br>its details here<\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n<\/section>\r\n\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<!-- MEMORY SYSTEM VIEW -->\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<section class=\"ai-view\" id=\"view-memory\">\r\n  <div class=\"ai-view-header\">\r\n    <div>\r\n      <div class=\"ai-view-title\">🧠 External Memory System<\/div>\r\n      <div class=\"ai-view-sub\">One memory backbone for ALL your apps — ask in one tool, remembered everywhere<\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Diagram -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🔀 Cross-App Memory Architecture<\/span><\/div>\r\n    <div class=\"ai-diagram-wrap\" id=\"memory-diagram-svg\"><\/div>\r\n  <\/div>\r\n\r\n  <!-- How it works -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🔧 How It Works — Step by Step<\/span><\/div>\r\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:12px;line-height:1.6;padding:8px 0\">\r\n      <div style=\"background:var(--ai-primary-bg);border-radius:8px;padding:14px\">\r\n        <strong style=\"color:var(--ai-primary)\">1️⃣ Collect<\/strong><br>\r\n        Every app (Ephorm, Copilot, VS Code, web chat) sends conversation data to the Memory API. What was asked? What was the context? What was the answer?\r\n      <\/div>\r\n      <div style=\"background:var(--ai-success-bg);border-radius:8px;padding:14px\">\r\n        <strong style=\"color:var(--ai-success)\">2️⃣ Extract<\/strong><br>\r\n        The Memory System processes each interaction: extracts facts (\"Client XYZ revenue is $50M\"), preferences (\"User prefers bullet points\"), entities, and relationships.\r\n      <\/div>\r\n      <div style=\"background:var(--ai-accent-bg);border-radius:8px;padding:14px\">\r\n        <strong style=\"color:var(--ai-accent)\">3️⃣ Store<\/strong><br>\r\n        Structured memories are saved to Redis/Mem0 as key-value pairs + vector embeddings. Memories are tagged by user, app, topic, and time — searchable and retrievable.\r\n      <\/div>\r\n      <div style=\"background:var(--ai-info-bg);border-radius:8px;padding:14px\">\r\n        <strong style=\"color:var(--ai-info)\">4️⃣ Retrieve & Embed<\/strong><br>\r\n        When ANY app sends a new query, the Memory API retrieves relevant memories and embeds them in the prompt. The AI now has full context — regardless of which app you are using.\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Before vs After -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">💡 Prompt Enrichment — Before vs After<\/span><\/div>\r\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 0\">\r\n      <div style=\"background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px\">\r\n        <strong style=\"color:#dc2626\">❌ WITHOUT External Memory<\/strong>\r\n        <pre style=\"font-size:11px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;margin:8px 0 0 0;color:#7f1d1d;background:none\">System: You are an AI assistant.\r\nUser: Draft an audit memo for client XYZ.\r\n\r\nAI: [Generates generic memo — does not know:\r\n• Client XYZ industry or revenue\r\n• Previous audit findings\r\n• User's preferred format\r\n• Which standards to cite]<\/pre>\r\n      <\/div>\r\n      <div style=\"background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:14px\">\r\n        <strong style=\"color:#059669\">✅ WITH External Memory (Redis/Mem0)<\/strong>\r\n        <pre style=\"font-size:11px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;margin:8px 0 0 0;color:#065f46;background:none\">System: You are an AI assistant.\r\n[Memory Context]:\r\n• Client XYZ: Manufacturing, $50M revenue\r\n• Last audit: Revenue recognition issue Q3 2025\r\n• User prefers: Bullet points, IFRS citations\r\n• PKF template: ENG-LTR-2024-v3\r\n\r\nUser: Draft an audit memo for client XYZ.\r\n\r\nAI: [Generates personalized memo with:\r\n• Industry-specific risk factors\r\n• References to prior findings\r\n• Bullet-point format per user preference\r\n• Correct template and IFRS citations]<\/pre>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n    <!-- REALISTIC: How It Actually Works -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px;border-left:4px solid #f59e0b\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">⚠️ The Honest Answer: Apps You Control vs Apps You Don't<\/span><\/div>\r\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13px;line-height:1.7;padding:8px 0\">\r\n      <div style=\"background:#ecfdf5;border-radius:8px;padding:14px\">\r\n        <strong style=\"color:#059669\">✅ Apps YOU Build or Control<\/strong><br><br>\r\n        <strong>How to SEND memories:<\/strong> Every time a user sends a message or the AI responds, your app calls:<br>\r\n        <code style=\"background:#d1fae5;padding:1px 4px;border-radius:3px;font-size:11px\">POST /api/memories {user, message, context, response}<\/code><br><br>\r\n        <strong>How to USE memories:<\/strong> Before calling the LLM, your app fetches relevant context:<br>\r\n        <code style=\"background:#d1fae5;padding:1px 4px;border-radius:3px;font-size:11px\">GET /api/memories/search?user=X&query=Y<\/code><br>\r\n        Then embeds it in the system prompt. Your app has full control.<br><br>\r\n        <strong>Examples:<\/strong> Custom web chat, internal tools, VS Code extension (you wrote), your own API wrapper.\r\n      <\/div>\r\n      <div style=\"background:#fef2f2;border-radius:8px;padding:14px\">\r\n        <strong style=\"color:#dc2626\">❌ Third-Party Apps You DON'T Control<\/strong><br><br>\r\n        <strong>ChatGPT Web, Claude Web, MS Copilot Web:<\/strong> You CANNOT intercept their conversations or inject custom memory into their prompts. Their backend is a black box.<br><br>\r\n        <strong>Realistic workarounds:<\/strong><br>\r\n        • <strong>Browser Extension:<\/strong> Can read web chat content and send to your memory API. Can prepend context to the chat input box before you hit send. Limited but works.<br>\r\n        • <strong>MS Copilot Studio:<\/strong> Can add Graph Connectors for organizational data — but you can't inject per-user memory dynamically.<br>\r\n        • <strong>Use the API instead of the Web UI:<\/strong> If you use OpenAI/Claude/DeepSeek API directly (not the chat website), you have FULL control over the prompt — add any memory you want.<br><br>\r\n        <strong>🏆 Best Approach:<\/strong> Build ONE unified chat interface that wraps ALL LLM APIs and adds your memory layer. Don't try to hack individual web UIs.\r\n      <\/div>\r\n    <\/div>\r\n    <div style=\"background:#e0f2fe;border-radius:8px;padding:14px;margin-top:8px;font-size:12px;line-height:1.6\">\r\n      <strong>🏗️ The Recommended Architecture:<\/strong><br>\r\n      <strong>1. Build a single \"PKF AI Hub\"<\/strong> — a web app / desktop app that is the ONE place users go for AI.<br>\r\n      <strong>2. Behind the scenes, it connects to:<\/strong> OpenAI API, Claude API, DeepSeek API, local Ollama — whatever LLM you choose.<br>\r\n      <strong>3. Every message in and out<\/strong> is automatically sent to your Memory API (Redis/Mem0).<br>\r\n      <strong>4. Before every LLM call,<\/strong> the Memory API returns relevant context, which is embedded in the system prompt.<br>\r\n      <strong>5. Users get a consistent experience<\/strong> regardless of which underlying LLM is used — because the memory layer is consistent.<br><br>\r\n      <strong>This is how ChatGPT \"remembers\" things — they built their own memory system. You can build the same thing with Redis + Mem0.<\/strong>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Implementation Options -->\r\n  <div class=\"ai-card\"><!-- Implementation Options -->\r\n  <div class=\"ai-card\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🛠️ Memory Libraries — Local vs Cloud Options<\/span><\/div>\r\n    <div style=\"overflow-x:auto\">\r\n      <table class=\"ai-compare-table\" style=\"font-size:12px;width:100%\">\r\n        <thead><tr>\r\n          <th>Library<\/th><th>Type<\/th><th>🏠 Local?<\/th><th>How Apps Connect<\/th><th>Key Features<\/th><th>Cost<\/th>\r\n        <\/tr><\/thead>\r\n        <tbody>\r\n          <tr style=\"background:#ecfdf5\">\r\n            <td><strong>Redis Stack<\/strong><\/td>\r\n            <td>Key-Value + Vector DB<\/td>\r\n            <td>✅ Full local<\/td>\r\n            <td>REST API / Redis protocol — any language<\/td>\r\n            <td>Ultra-fast (<1ms), JSON + vector search, pub/sub, TTL, all data stays on your server<\/td>\r\n            <td>Free (OSS self-host) / $30/mo cloud<\/td>\r\n          <\/tr>\r\n          <tr>\r\n            <td><strong>Mem0 v2 (Cloud)<\/strong><\/td>\r\n            <td>AI-Native Memory Platform<\/td>\r\n            <td>❌ Cloud only<\/td>\r\n            <td>SDK (Python/JS) + REST API<\/td>\r\n            <td>Auto fact extraction, preference learning, entity tracking, semantic search<\/td>\r\n            <td>$99/mo (Pro)<\/td>\r\n          <\/tr>\r\n          <tr style=\"background:#ecfdf5\">\r\n            <td><strong>Mem0 OSS<\/strong><\/td>\r\n            <td>AI-Native Memory (Self-Hosted)<\/td>\r\n            <td>✅ Full local<\/td>\r\n            <td>Same SDK — point to your own server<\/td>\r\n            <td>Same AI features as cloud version. Self-hosted = full data sovereignty. Uses your own PostgreSQL/Redis.<\/td>\r\n            <td>Free (OSS)<\/td>\r\n          <\/tr>\r\n          <tr style=\"background:#ecfdf5\">\r\n            <td><strong>Letta (MemGPT)<\/strong><\/td>\r\n            <td>Hierarchical Agent Memory<\/td>\r\n            <td>✅ Full local<\/td>\r\n            <td>Python SDK + REST — self-hosted<\/td>\r\n            <td>Long-term + working memory, self-editing, archival, fully open-source<\/td>\r\n            <td>Free (OSS)<\/td>\r\n          <\/tr>\r\n          <tr>\r\n            <td><strong>Zep v2<\/strong><\/td>\r\n            <td>Enterprise Memory Graph<\/td>\r\n            <td>⚠️ Cloud or self-host<\/td>\r\n            <td>REST API + SDKs<\/td>\r\n            <td>Graph entity tracking, semantic search, message history, user facts<\/td>\r\n            <td>Free OSS / Paid cloud<\/td>\r\n          <\/tr>\r\n        <\/tbody>\r\n      <\/table>\r\n    <\/div>\r\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px\">\r\n      <div style=\"background:#e0f2fe;border-radius:8px;padding:12px;font-size:11px;line-height:1.6\">\r\n        <strong>☁️ For Cloud Scenario:<\/strong><br>\r\n        Redis Cloud ($30/mo) + Mem0 Cloud ($99/mo). Fastest setup. Zero maintenance. Data on provider infrastructure — ensure SOC 2 compliance.\r\n      <\/div>\r\n      <div style=\"background:#ecfdf5;border-radius:8px;padding:12px;font-size:11px;line-height:1.6\">\r\n        <strong>🏠 For Local Scenario:<\/strong><br>\r\n        Redis Stack OSS (free) + Mem0 OSS (free). Everything self-hosted. Full data sovereignty. No external dependencies. Use your existing PostgreSQL.\r\n      <\/div>\r\n      <div style=\"background:#fffbeb;border-radius:8px;padding:12px;font-size:11px;line-height:1.6\">\r\n        <strong>🔀 For Hybrid Scenario:<\/strong><br>\r\n        Redis Stack OSS (local) for sensitive data. Mem0 Cloud for convenience on non-sensitive. Route by data classification.\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<!-- GPU GUIDE VIEW -->\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<section class=\"ai-view\" id=\"view-gpu\">\r\n  <div class=\"ai-view-header\">\r\n    <div>\r\n      <div class=\"ai-view-title\">💻 GPU Hardware Guide — Local LLM<\/div>\r\n      <div class=\"ai-view-sub\">How trillion-parameter models run on consumer GPUs — MoE, quantization, and the real math<\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- KEY CONCEPT: MoE + Quantization -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px;border-left:4px solid #7c3aed\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🧠 The Key Concept: Why a $2,000 GPU Can Run a \"Trillion Parameter\" Model<\/span><\/div>\r\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13px;line-height:1.7;padding:8px 0\">\r\n      <div>\r\n        <strong style=\"color:#7c3aed\">🔹 Dense Models (Traditional)<\/strong><br>\r\n        All parameters are active on EVERY token. If a model has 70B parameters, all 70B are loaded in VRAM and used for every word generated.<br><br>\r\n        <em>Example: Llama 3.3 70B = 70B active params.<\/em><br>\r\n        VRAM at 4-bit: 70B × 0.5 bytes ≈ <strong>35 GB<\/strong> → needs A100.\r\n      <\/div>\r\n      <div>\r\n        <strong style=\"color:#059669\">🔹 MoE — Mixture of Experts (Modern)<\/strong><br>\r\n        Only a SMALL FRACTION of parameters are active per token. The model has many \"experts\" but only routes each token to 1-3 of them. Total params can be huge — but VRAM depends on ACTIVE params, not total.<br><br>\r\n        <em>Example: DeepSeek V4 Pro = 1.6 TRILLION total but only 49 BILLION active.<\/em><br>\r\n        VRAM at 4-bit: 49B × 0.5 bytes ≈ <strong>25 GB<\/strong> → fits on RTX 5090! 🎉\r\n      <\/div>\r\n    <\/div>\r\n    <div style=\"background:#fef3c7;border-radius:8px;padding:14px;margin-top:8px;font-size:12px;line-height:1.6\">\r\n      <strong>🔢 Quantization — The 4x VRAM Multiplier<\/strong><br>\r\n      <strong>FP16 (full precision):<\/strong> 2 bytes per parameter. Best quality. Used for training.<br>\r\n      <strong>4-bit (quantized):<\/strong> ~0.5 bytes per parameter. 4× less VRAM. Tiny quality loss. Used for inference.<br>\r\n      <strong>Rule of thumb:<\/strong> Active params × 0.5 = VRAM needed at 4-bit. Active params × 2 = VRAM at FP16.\r\n    <\/div>\r\n    <div style=\"background:#e0f2fe;border-radius:8px;padding:14px;margin-top:8px;font-size:12px;line-height:1.6\">\r\n      <strong>⚠️ \"Do I need to load ALL 1.6 trillion parameters somewhere?\" — YES. Here's the full picture:<\/strong><br><br>\r\n      <strong>Storage Hierarchy for MoE Models:<\/strong><br>\r\n      🗄️ <strong>SSD/Disk:<\/strong> Full model stored here. DeepSeek V4 Pro at 4-bit = ~800 GB on disk.<br>\r\n      🧠 <strong>System RAM (CPU):<\/strong> Frequently used experts cached here for fast access. 64-128 GB RAM helps.<br>\r\n      ⚡ <strong>GPU VRAM:<\/strong> Only the <strong>49B active experts for the current token<\/strong> sit here. ~25 GB needed.<br><br>\r\n      <strong>How It Actually Works — \"Expert Offloading\":<\/strong><br>\r\n      1. The model files (~800 GB) live on your SSD.<br>\r\n      2. When you start the model, frequently used \"core\" layers load into GPU VRAM.<br>\r\n      3. As each token is processed, the router decides which experts to activate.<br>\r\n      4. Needed experts are <strong>prefetched from RAM/SSD into VRAM<\/strong> before they're used.<br>\r\n      5. Unused experts are <strong>swapped out<\/strong> — they don't stay in VRAM.<br>\r\n      6. Only ~49B parameters are <strong>computed<\/strong> per token, but all 1.6T are <strong>accessible<\/strong> via the storage hierarchy.<br><br>\r\n      <strong>This is why you need:<\/strong><br>\r\n      • <strong>GPU VRAM:<\/strong> Enough for active experts (~25 GB for DeepSeek V4 Pro at 4-bit)<br>\r\n      • <strong>System RAM:<\/strong> Helps cache experts — 64 GB recommended for smooth performance<br>\r\n      • <strong>Fast SSD:<\/strong> NVMe SSD for expert swapping — SATA SSD is too slow<br>\r\n      • <strong>The result:<\/strong> DeepSeek V4 Pro (1.6T total) runs on RTX 5090 (32 GB VRAM) + 64 GB system RAM + NVMe SSD at ~48 tok/s<br><br>\r\n      <strong>🔑 Key insight:<\/strong> \"49B active\" doesn't mean the other 1.55T parameters vanish — they live on your SSD and in system RAM, ready to be swapped into the GPU when the router calls for them. The GPU only COMPUTES 49B per token, but all 1.6T must be STORED and ACCESSIBLE.\r\n    <\/div>\r\n    <div style=\"background:#fce7f3;border-radius:8px;padding:14px;margin-top:8px;font-size:12px;line-height:1.6\">\r\n      <strong>⚡ Performance Deep-Dive: What Happens When Every Question Uses Different Experts?<\/strong><br><br>\r\n      <strong>The concern:<\/strong> If each query activates completely different experts, won't constant loading/unloading kill performance?<br><br>\r\n      <strong>The reality — three techniques make it work:<\/strong><br><br>\r\n      <strong>1. 🧠 Expert Prefetching (like CPU branch prediction, but for AI)<\/strong><br>\r\n      The inference engine doesn't wait until it needs an expert. The router predicts which experts will be needed next and <strong>prefetches them from RAM to VRAM before the computation reaches that layer<\/strong>. By the time the GPU is ready to compute, the expert is already there. This hides most of the latency.<br><br>\r\n      <strong>2. 🔥 Expert Caching — The 80/20 Rule<\/strong><br>\r\n      Expert usage follows a <strong>power law<\/strong>. Some experts handle general knowledge (\"What is IFRS 16?\") and get used constantly. These \"hot\" experts stay permanently cached in VRAM. Cold experts (specialized topics) may swap in/out, but they're rarely needed. <strong>~20% of experts handle ~80% of tokens.<\/strong><br><br>\r\n      <strong>3. 📦 Batched & Overlapped I/O<\/strong><br>\r\n      While the GPU computes one layer, the engine simultaneously loads the next layer's experts from RAM. This <strong>compute/IO overlap<\/strong> means the GPU rarely sits idle waiting for data. NVMe SSDs (~7 GB/s) can load a 4-bit expert (~200 MB) in ~30ms — but this happens in parallel with computation, not after it.<br><br>\r\n      <strong>Real-World Performance Numbers (DeepSeek V4 Pro on RTX 5090):<\/strong><br>\r\n      • <strong>64 GB system RAM:<\/strong> ~48 tok/s — most experts cached in RAM, minimal SSD access<br>\r\n      • <strong>32 GB system RAM:<\/strong> ~35 tok/s — more SSD reads, but prefetching hides most latency<br>\r\n      • <strong>16 GB system RAM:<\/strong> ~20 tok/s — heavy SSD thrashing, noticeable slowdown on diverse queries<br><br>\r\n      <strong>🎯 The practical takeaway:<\/strong> For a presentation or Q&A session where questions vary, you'll get ~48 tok/s with adequate RAM (64 GB). The system is designed for this — it's not like loading a new app every time. The router, prefetcher, and cache work together to make expert switching nearly invisible. The $300 extra for 64 GB instead of 32 GB RAM is the best performance investment you can make.\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- GPU Comparison Table -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🖥️ NVIDIA GPU Comparison — What Each GPU Can Actually Run<\/span><\/div>\r\n    <div style=\"overflow-x:auto\">\r\n      <table class=\"ai-compare-table\" style=\"font-size:12px;width:100%\">\r\n        <thead><tr>\r\n          <th>GPU<\/th><th>VRAM<\/th><th>Max Dense<br>Model (4-bit)<\/th><th>Max MoE Active<br>Params (4-bit)<\/th><th>MoE Models It Runs<br>(Total / Active)<\/th><th>Price (USD)<\/th><th>Best For<\/th>\r\n        <\/tr><\/thead>\r\n        <tbody>\r\n          <tr style=\"background:#f0fdf4\">\r\n            <td><strong>RTX 5060<\/strong><\/td><td>12 GB<\/td><td>~10B<\/td><td>~20B active<\/td>\r\n            <td>DeepSeek V4 Lite (~16B active)<br>Phi-4 Mini 3.8B, Gemma 3 4B<\/td>\r\n            <td>$300–400<\/td><td>Entry-level · Laptop AI<\/td>\r\n          <\/tr>\r\n          <tr style=\"background:#f0fdf4\">\r\n            <td><strong>RTX 5070<\/strong><\/td><td>16 GB<\/td><td>~14B<\/td><td>~28B active<\/td>\r\n            <td>Phi-4 Medium 14B, Mistral Small 22B (quant)<br>DeepSeek V4 Lite, Qwen 3 MoE 20B active<\/td>\r\n            <td>$600–750<\/td><td>Single-user pilot<\/td>\r\n          <\/tr>\r\n          <tr style=\"background:#fef3c7\">\r\n            <td><strong>RTX 5080<\/strong><\/td><td>24 GB<\/td><td>~22B<\/td><td>~44B active<\/td>\r\n            <td>Llama 4 (quant), Qwen 3 32B (quant)<br>DeepSeek V4 Pro (49B active @ 4-bit!)<\/td>\r\n            <td>$1,000–1,200<\/td><td>Small team 2-5 users<\/td>\r\n          <\/tr>\r\n          <tr style=\"background:#fef3c7\">\r\n ong>$10<\/strong><\/td><td>$113<\/td><td>$390<\/td><td>$11<\/td><td>$55<\/td>\r\n          <\/tr>\r\n          <tr style=\"background:#fffbeb\">\r\n            <td><strong>100 Million<\/strong><\/td><td>~1,667/day<\/td>\r\n            <td style=\"background:#ecfdf5\"><strong>$169<\/strong><\/td>\r\n            <td style=\"background:#ecfdf5\"><strong>$20<\/strong><\/td><td>$225<\/td><td>$780<\/td><td>$22<\/td><td>$110<\/td>\r\n          <\/tr>\r\n          <tr>\r\n            <td><strong>500 Million<\/strong><\/td><td>~8,333/day<\/td>\r\n            <td style=\"background:#fef3c7\">$302*<\/td>\r\n            <td>$98<\/td><td>$1,125<\/td><td>$3,900<\/td><td>$110<\/td><td>$550<\/td>\r\n          <\/tr>\r\n          <tr>\r\n            <td><strong>1 Billion<\/strong><\/td><td>~16,667/day<\/td>\r\n            <td style=\"background:#fef3c7\">$302**<\/td>\r\n            <td>$196<\/td><td>$2,250<\/td><td>$7,800<\/td><td>$220<\/td><td>$1,100<\/td><\/tbody>\r\n      <\/table>\r\n    <\/div>\r\n    <div style=\"font-size:10px;color:var(--ai-text-muted);margin-top:6px;line-height:1.5\">\r\n      * At 500M tokens/month, a single RTX 5090 may need to run 24/7. Still within capacity at 48 tok/s.<br>\r\n      ** At 1B tokens/month, add a second RTX 5090 ($349 + $350 extra = $699/mo). Or upgrade to A100 ($700/mo amortized).\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Premium Tier Comparison -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🚀 Premium Tier Comparison — Best Models<\/span><\/div>\r\n    <div style=\"overflow-x:auto\">\r\n      <table class=\"ai-compare-table\" style=\"font-size:11px;width:100%\">\r\n        <thead><tr>\r\n          <th>Monthly Tokens<\/th><th>🏠 Local<br>DeepSeek V4 Pro<\/th><th>☁️ DeepSeek V4 Pro API<\/th><th>☁️ GPT-5.4<\/th><th>☁️ Claude Opus 4.8<\/th><th>☁️ Gemini 3.0 Ultra<\/th>\r\n        <\/tr><\/thead>\r\n        <tbody>\r\n          <tr><td><strong>10 Million<\/strong><\/td><td style=\"background:#ecfdf5\">$349<\/td><td>$12.00<\/td><td>$18.00<\/td><td>$25.00<\/td><td>$50.00<\/td><\/tr>\r\n          <tr style=\"background:#fffbeb\"><td><strong>100 Million<\/strong><\/td><td style=\"background:#ecfdf5\">$349<\/td><td>$120.00<\/td><td>$180.00<\/td><td>$250.00<\/td><td>$500.00<\/td><\/tr>\r\n          <tr><td><strong>500 Million<\/strong><\/td><td style=\"background:#fef3c7\">$349*<\/td><td>$600.00<\/td><td>$900.00<\/td><td>$1,250.00<\/td><td>$2,500.00<\/td><\/tr>\r\n          <tr><td><strong>1 Billion<\/strong><\/td><td style=\"background:#fef3c7\">$699**<\/td><td>$1,200.00<\/td><td>$1,800.00<\/td><td>$2,500.00<\/td><td>$5,000.00<\/td><\/tr>\r\n        <\/tbody>\r\n      <\/table>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Break-Even Analysis -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">⏱️ Break-Even — When Local Hardware Pays for Itself<\/span><\/div>\r\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;font-size:12px;line-height:1.7;padding:8px 0\">\r\n      <div style=\"background:var(--ai-primary-bg);border-radius:8px;padding:14px\">\r\n        <strong>vs DeepSeek V4 Pro API (cheapest premium cloud)<\/strong><br>\r\n        Cloud cost at 100M tok/mo: <strong>$120/mo<\/strong><br>\r\n        Local cost: <strong>$349/mo<\/strong><br>\r\n        <strong>❌ Cloud is cheaper at all volumes.<\/strong><br>\r\n        <em>Choose local for PRIVACY, not cost — or use the Balanced tier.<\/em>\r\n      <\/div>\r\n      <div style=\"background:var(--ai-success-bg);border-radius:8px;padding:14px\">\r\n        <strong>vs GPT-5.4 (premium)<\/strong><br>\r\n        Break-even: <strong>~250M tokens/month<\/strong><br>\r\n        At that volume: Cloud = $450/mo, Local = $349/mo<br>\r\n        <strong>✅ Local saves $100/mo after break-even.<\/strong><br>\r\n        ~50 queries/day by 10 users reaches this.\r\n      <\/div>\r\n      <div style=\"background:var(--ai-accent-bg);border-radius:8px;padding:14px\">\r\n        <strong>vs Claude Opus 4.8 (premium)<\/strong><br>\r\n        Break-even: <strong>~170M tokens/month<\/strong><br>\r\n        At that volume: Cloud = $425/mo, Local = $349/mo<br>\r\n        <strong>✅ Local saves $75/mo after break-even.<\/strong>\r\n      <\/div>\r\n      <div style=\"background:var(--ai-danger-bg);border-radius:8px;padding:14px\">\r\n        <strong>vs GPT-5.5 Mini / Gemini Flash (budget)<\/strong><br>\r\n        <strong>❌ Cloud is ALWAYS cheaper.<\/strong><br>\r\n        Budget cloud APIs are so cheap ($0.15-0.40/M tok) that local hardware never breaks even on cost alone.<br>\r\n        <em>Choose local for PRIVACY, LATENCY, or DATA SOVEREIGNTY — not to save money vs budget APIs.<\/em>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Prompt Caching -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">💾 Prompt Caching — What Actually Gets Saved (and What Doesn't)<\/span><\/div>\r\n    <div style=\"font-size:12px;line-height:1.7;padding:8px 0\">\r\n\r\n      <div style=\"background:#fef3c7;border-radius:8px;padding:14px;margin-bottom:12px\">\r\n        <strong>⚠️ You're right — every parameter IS loaded, and every NEW token IS fully processed. Caching does NOT skip neural network layers.<\/strong><br>\r\n        So what DOES get saved? The answer is the <strong>KV-Cache (Key-Value Cache)<\/strong> — a specific part of the attention mechanism.\r\n      <\/div>\r\n\r\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0\">\r\n        <div>\r\n          <strong style=\"color:#7c3aed\">🔬 What the KV-Cache Actually Saves<\/strong><br><br>\r\n          Every transformer layer computes <strong>attention<\/strong> between all pairs of tokens: \"How much should token 5 pay attention to token 1, token 2, token 3, token 4?\" This is O(n²) — expensive.<br><br>\r\n          For each token, the model computes a <strong>Key (K) and Value (V) vector<\/strong> at every layer. These K,V vectors are stored in the KV-cache.<br><br>\r\n          <strong>When the next request starts with the EXACT same prefix (system prompt):<\/strong><br>\r\n          • The K,V for those cached tokens are already computed — <strong>skip the matrix multiplications for attention<\/strong><br>\r\n          • New tokens still go through ALL layers fully<br>\r\n          • All parameters are still loaded in VRAM — nothing changes there<br><br>\r\n          <strong>What's saved:<\/strong> Attention computation (Q×K^T) for the cached prefix — this is the O(n²) part. For a 10K token system prompt, this is ~100M operations skipped per layer.<br>\r\n          <strong>What's NOT saved:<\/strong> Forward pass through feed-forward layers for new tokens. Parameter loading. Output generation.\r\n        <\/div>\r\n        <div>\r\n          <strong style=\"color:#059669\">☁️ Cloud Pricing: Why Cached Tokens Cost 90% Less<\/strong><br><br>\r\n          Cloud providers charge less for cached tokens because they save real GPU compute — not just networking:<br><br>\r\n          <strong>OpenAI:<\/strong> 90% discount on cached input (GPT-5.4: $2.50 → $0.25/M tok)<br>\r\n          <strong>Anthropic:<\/strong> 90% discount (Claude Opus 4.8: $5.00 → $0.50/M tok)<br>\r\n          <strong>DeepSeek:<\/strong> <strong>98% discount!<\/strong> ($0.14 → $0.0028/M tok cache hit)<br><br>\r\n          <strong>Real savings example:<\/strong> Enterprise app with 10K token system prompt, used 1,000 times/day = 10M tokens/day that are cached. Without cache: $1.40/day. With DeepSeek cache: <strong>$0.028/day<\/strong>. That's $500/yr vs $10/yr.<br><br>\r\n          <strong>🖥️ Local KV-Cache:<\/strong> Built into every inference engine (Ollama, vLLM, llama.cpp). Saves real GPU cycles — lets you serve more users with the same GPU. Since local is fixed-cost, it doesn't \"save money\" directly, but it increases throughput (more queries/sec on the same hardware).\r\n        <\/div>\r\n      <\/div>\r\n\r\n      <div style=\"background:#e0f2fe;border-radius:8px;padding:14px;font-size:11px;line-height:1.6\">\r\n        <strong>💡 Design for cache hits:<\/strong> Put static content at the BEGINNING of every prompt (system prompt, tool definitions, RAG templates). Put dynamic content at the END (user query, retrieved documents). This maximizes the prefix that can be cached. In enterprise apps, 80-95% of input tokens can be cacheable.\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Why Cloud Can Be Cheaper -->\r\n  <div class=\"ai-card\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🤔 Why Can Cloud Be Cheaper Than Local? (The Utilization Answer)<\/span><\/div>\r\n    <div style=\"font-size:12px;line-height:1.7;padding:8px 0\">\r\n\r\n      <div style=\"background:#fef2f2;border-radius:8px;padding:14px;margin-bottom:12px\">\r\n        <strong>The core reason: GPU UTILIZATION.<\/strong> Your RTX 5090 sits idle ~90% of the time (you query it for a few seconds, then it waits). Cloud GPUs run 24/7 serving thousands of users. A GPU that runs at 10% utilization costs 10× more per token than one at 100% utilization — even if the hardware is cheaper.\r\n      <\/div>\r\n\r\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0\">\r\n        <div style=\"background:var(--ai-primary-bg);border-radius:8px;padding:14px\">\r\n          <strong>1. 📊 Utilization Economics<\/strong><br>\r\n          <strong>Your RTX 5090 ($2,500):<\/strong><br>\r\n          • 5 users, 15 queries each = 75 queries/day<br>\r\n          • Each query: ~3 seconds of GPU time<br>\r\n          • GPU active: ~4 min/day = <strong>0.3% utilization<\/strong><br>\r\n          • Cost per token: very high because the GPU sits idle<br><br>\r\n          <strong>Cloud H100 ($30,000):<\/strong><br>\r\n          • 500 users, 50 queries each = 25,000 queries/day<br>\r\n          • Continuous batch processing<br>\r\n          • GPU active: 24h/day = <strong>~95% utilization<\/strong><br>\r\n          • Cost per token: very low because the GPU never sleeps\r\n        <\/div>\r\n        <div style=\"background:var(--ai-success-bg);border-radius:8px;padding:14px\">\r\n          <strong>2. ⚡ Hardware Efficiency<\/strong><br>\r\n          • H100: ~150 tok/s at FP16, 700W<br>\r\n          • RTX 5090: ~48 tok/s at 4-bit, 575W<br>\r\n          • H100 produces <strong>3× more tokens per watt<\/strong><br>\r\n          • Data center electricity: $0.06/kWh (industrial)<br>\r\n          • Home/office electricity: $0.12/kWh (residential)<br>\r\n          • Cloud providers get bulk hardware discounts (30-50% off list)\r\n        <\/div>\r\n        <div style=\"background:var(--ai-accent-bg);border-radius:8px;padding:14px\">\r\n          <strong>3. 📦 Batch Processing<\/strong><br>\r\n          • One H100 serves 50-100 users simultaneously via continuous batching<br>\r\n          • Your RTX 5090 serves 1-5 users sequentially<br>\r\n          • Batching amortizes the fixed cost of loading parameters across many requests<br>\r\n          • DeepSeek specifically: their infrastructure efficiency is industry-leading, which is why they can charge $0.14/M tok at a profit\r\n        <\/div>\r\n        <div style=\"background:var(--ai-info-bg);border-radius:8px;padding:14px\">\r\n          <strong>4. 🔄 The Break-Even Reality<\/strong><br>\r\n          <strong>When local DOES beat cloud:<\/strong><br>\r\n          • 50+ users, 100+ queries/day each<br>\r\n          • GPU runs at 60%+ utilization<br>\r\n          • Sensitive data that CANNOT leave premises<br>\r\n          • Latency-critical applications (local = no network round-trip)<br><br>\r\n          <strong>When cloud wins:<\/strong><br>\r\n          • Low-to-medium volume (under 500M tok/mo)<br>\r\n          • Variable/spiky workloads<br>\r\n          • Need latest models (GPT-5.4, Claude 4.8)<br>\r\n          • Zero DevOps overhead needed\r\n        <\/div>\r\n      <\/div>\r\n\r\n      <div style=\"background:#fef3c7;border-radius:8px;padding:14px;margin-bottom:12px;font-size:12px;line-height:1.7\">\r\n        <strong>🔢 The Math: How Many Tokens Can One RTX 5090 Process at 100% Utilization?<\/strong><br><br>\r\n        <strong>RTX 5090 running DeepSeek V4 Pro at 4-bit: ~48 tok/s<\/strong><br>\r\n        • Per second: 48 tokens<br>\r\n        • Per minute: 48 × 60 = <strong>2,880 tokens<\/strong><br>\r\n        • Per hour: 2,880 × 60 = <strong>172,800 tokens<\/strong><br>\r\n        • Per day: 172,800 × 24 = <strong>4.1 million tokens<\/strong><br>\r\n        • Per month: 4.1M × 30 = <strong>~124 million tokens<\/strong> at 100% utilization 24/7<br><br>\r\n        <strong>So 1 billion tokens/month requires:<\/strong> 1,000M ÷ 124M = <strong>~8 RTX 5090s<\/strong> running 24/7 at 100% utilization.<br>\r\n        • Cost: 8 × $169/mo = <strong>$1,352/mo<\/strong> for the local cluster<br><br>\r\n        <strong>Compare cloud costs at 1B tokens/month:<\/strong><br>\r\n        • DeepSeek V4 Pro: 1B × $0.196/M = <strong>$196/mo<\/strong> 🏆 (still cheaper than 8 GPUs!)<br>\r\n        • GPT-5.4: 1B × $7.50/M = <strong>$7,500/mo<\/strong> (local saves $6,148/mo!)<br>\r\n        • Claude Opus 4.8: 1B × $13/M = <strong>$13,000/mo<\/strong> (local saves $11,648/mo!)<br>\r\n        • Claude Sonnet 4.6: 1B × $7.80/M = <strong>$7,800/mo<\/strong> (local saves $6,448/mo!)<br><br>\r\n        <strong>The honest conclusion:<\/strong> Against DeepSeek's aggressive cloud pricing ($0.14/$0.28 per M tok), <strong>local NEVER wins on pure cost<\/strong> — even at 100% utilization. Against OpenAI or Anthropic premium tiers, <strong>local wins massively at 100M+ tokens/month<\/strong>. The choice between local and cloud DeepSeek is about <strong>privacy, latency, and control<\/strong> — not cost.\r\n      <\/div>\r\n\r\n      <div class=\"ai-rec-highlight\">\r\n        <strong>💡 The Bottom Line:<\/strong> DeepSeek can charge $0.14/M tok at a profit because their H100 clusters run at near-100% utilization serving millions of users. Your RTX 5090 costs $169/mo whether you use it 1 hour or 24 hours. <strong>Cloud is cheaper at any volume where your GPU utilization is below ~50%.<\/strong> Once you cross that threshold (typically 50+ daily active users making 50+ queries each), local hardware starts to win. Choose local for <strong>privacy, latency, and data sovereignty<\/strong> — the cost advantage only comes at high, sustained utilization.\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<!-- PRIVACY GATEWAY VIEW -->\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<section class=\"ai-view\" id=\"view-privacy\">\r\n  <div class=\"ai-view-header\">\r\n    <div>\r\n      <div class=\"ai-view-title\">🔒 Two-Step AI Pipeline — Privacy Gateway<\/div>\r\n      <div class=\"ai-view-sub\">Local anonymization → Cloud DeepSeek V4 Pro. Full privacy with cloud intelligence. Production-ready proposal.<\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Architecture Diagram -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🔀 Privacy Gateway Architecture<\/span><\/div>\r\n    <div class=\"ai-diagram-wrap\" id=\"privacy-diagram-svg\"><\/div>\r\n  <\/div>\r\n\r\n  <!-- How It Works -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🔧 How It Works — Step by Step<\/span><\/div>\r\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:12px;line-height:1.7;padding:8px 0\">\r\n      <div style=\"background:var(--ai-local-bg);border:1px solid var(--ai-success);border-radius:8px;padding:14px\">\r\n        <strong style=\"color:var(--ai-local)\">1️⃣ User Types Sensitive Query<\/strong><br>\r\n        \"Draft an audit memo for <strong style=\"color:#dc2626\">ABC Manufacturing Inc.<\/strong> regarding their <strong style=\"color:#dc2626\">$50M revenue recognition issue<\/strong>...\"<br><br>\r\n        This query contains confidential: client name, revenue figures, specific findings. <strong>Cannot send to cloud as-is.<\/strong>\r\n      <\/div>\r\n      <div style=\"background:#ecfdf5;border:1px solid #059669;border-radius:8px;padding:14px\">\r\n        <strong style=\"color:#059669\">2️⃣ Local LLM Anonymizes (DGX Spark / Mac Mini)<\/strong><br>\r\n        Small local model (Phi-4 Mini 3.8B or similar) rewrites the query, stripping all confidential identifiers:<br><br>\r\n        <em>\"Draft an audit memo for <strong style=\"color:#059669\">[Client A]<\/strong> regarding their <strong style=\"color:#059669\">[Revenue Issue B]<\/strong>...\"<\/em><br><br>\r\n        ✅ Names, figures, locations replaced with placeholders. The <strong>mapping table<\/strong> is stored locally.\r\n      <\/div>\r\n      <div style=\"background:#ede9fe;border:1px solid #7c3aed;border-radius:8px;padding:14px\">\r\n        <strong style=\"color:#7c3aed\">3️⃣ Anonymized Query → DeepSeek V4 Pro (Cloud)<\/strong><br>\r\n        The cleaned query is sent to DeepSeek V4 Pro API. The model processes it with full intelligence — but sees NO confidential data.<br><br>\r\n        Cost: ~$0.20 per 1M tokens. Response in ~2-5 seconds. Full cloud intelligence, zero privacy risk.\r\n      <\/div>\r\n      <div style=\"background:#f0fdf4;border:1px solid #10b981;border-radius:8px;padding:14px\">\r\n        <strong style=\"color:#10b981\">4️⃣ Response Re-Identified (Optional)<\/strong><br>\r\n        The cloud response comes back with placeholders. The local system replaces them with real values using the stored mapping table.<br><br>\r\n        <em>\"Draft an audit memo for <strong style=\"color:#059669\">ABC Manufacturing Inc.<\/strong> regarding their <strong style=\"color:#059669\">$50M revenue recognition issue<\/strong>...\"<\/em><br><br>\r\n        User sees the final, re-identified answer. <strong>Confidential data never left the building.<\/strong>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Device Selection -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🖥️ Local Device Options — Anonymization Layer<\/span><\/div>\r\n    <div style=\"overflow-x:auto\">\r\n      <table class=\"ai-compare-table\" style=\"font-size:12px;width:100%\">\r\n        <thead><tr>\r\n          <th>Device<\/th><th>Specs<\/th><th>Model for Anonymization<\/th><th>VRAM Needed<\/th><th>Speed<\/th><th>Cost<\/th><th>Best For<\/th>\r\n        <\/tr><\/thead>\r\n        <tbody>\r\n          <tr style=\"background:#f0fdf4\">\r\n            <td><strong>Mac Mini M4 Pro ⭐<\/strong><\/td>\r\n            <td>24 GB unified · 20-core GPU<\/td>\r\n            <td>Phi-4 Mini 3.8B or Llama 3.2 3B<\/td>\r\n            <td>~3 GB<\/td>\r\n            <td>~130 tok/s<\/td>\r\n            <td>$1,400–2,400<\/td>\r\n            <td>Silent, low power, always-on<\/td>\r\n          <\/tr>\r\n          <tr style=\"background:#fef3c7\">\r\n            <td><strong>NVIDIA DGX Spark<\/strong><\/td>\r\n            <td>GB10 · 128 GB unified · NVLink<\/td>\r\n            <td>Phi-4 Medium 14B or Llama 4 (quant)<\/td>\r\n            <td>~10 GB<\/td>\r\n            <td>~90 tok/s<\/td>\r\n            <td>$3,999<\/td>\r\n            <td>Higher quality anonymization<\/td>\r\n          <\/tr>\r\n          <tr>\r\n            <td><strong>RTX 5070 Workstation<\/strong><\/td>\r\n            <td>16 GB VRAM · 32 GB RAM<\/td>\r\n            <td>Phi-4 Medium 14B<\/td>\r\n            <td>~10 GB<\/td>\r\n            <td>~90 tok/s<\/td>\r\n            <td>$1,500–2,000<\/td>\r\n            <td>Budget NVIDIA option<\/td>\r\n          <\/tr>\r\n          <tr>\r\n            <td><strong>Any laptop (integrated GPU)<\/strong><\/td>\r\n            <td>4-8 GB shared RAM<\/td>\r\n            <td>Phi-4 Mini 3.8B (4-bit)<\/td>\r\n            <td>~3 GB<\/td>\r\n            <td>~80 tok/s<\/td>\r\n            <td>$500+<\/td>\r\n            <td>Minimum viable · PoC only<\/td>\r\n          <\/tr>\r\n        <\/tbody>\r\n      <\/table>\r\n    <\/div>\r\n    <div class=\"ai-rec-highlight\" style=\"margin-top:12px\">\r\n      <strong>💡 Recommended:<\/strong> <strong>Mac Mini M4 Pro (24 GB, $2,000)<\/strong> — silent, always-on, runs Phi-4 Mini for anonymization at 130 tok/s (near-instant for short queries). DGX Spark if you want higher quality anonymization with a larger model (Phi-4 Medium 14B). Neither device needs to be powerful — anonymization is a simple rewrite task, not deep reasoning.\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Model Selection -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🤖 Anonymization Model — What to Run Locally<\/span><\/div>\r\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13px;line-height:1.7;padding:8px 0\">\r\n      <div>\r\n        <strong style=\"color:#7c3aed\">🔹 Option A: Small Model + Prompt Engineering (Recommended)<\/strong><br><br>\r\n        <strong>Model:<\/strong> Phi-4 Mini 3.8B (4 GB VRAM)<br>\r\n        <strong>Method:<\/strong> System prompt instructs the model to anonymize:<br><br>\r\n        <em style=\"font-size:11px\">\"You are a data sanitization filter. Replace ALL confidential information with placeholders: [CLIENT_NAME], [REVENUE], [LOCATION], [DATE], [PERSON_NAME]. For numbers, replace with [FIGURE_X]. Preserve the question structure and intent. Output ONLY the sanitized text.\"<\/em><br><br>\r\n        <strong>Pros:<\/strong> Simple, works with any model. No training needed.<br>\r\n        <strong>Cons:<\/strong> May miss some PII on complex inputs.\r\n      <\/div>\r\n      <div>\r\n        <strong style=\"color:#059669\">🔹 Option B: Fine-Tuned Model (Production)<\/strong><br><br>\r\n        <strong>Model:<\/strong> Phi-4 Medium 14B, fine-tuned on 5,000 sanitized examples<br>\r\n        <strong>Training data:<\/strong> Create 5,000 pairs of (original query → anonymized query) covering PKF-specific patterns: client names, revenue figures, audit findings, tax IDs, addresses<br><br>\r\n        <strong>Pros:<\/strong> Near-perfect PII detection. Handles edge cases. Consistent output format.<br>\r\n        <strong>Cons:<\/strong> Requires 2-4 weeks for data preparation + fine-tuning. Needs DGX Spark or RTX 5080+.\r\n      <\/div>\r\n    <\/div>\r\n    <div style=\"background:#fef3c7;border-radius:8px;padding:12px;font-size:11px;line-height:1.6;margin-top:8px\">\r\n      <strong>💡 Start with Option A for PoC (2 days setup).<\/strong> If the simple prompt-based anonymization is insufficient (misses >5% of PII), invest in Option B. The mapping table and re-identification logic is the same for both.\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Implementation -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🛠️ Implementation — Three Approaches Compared<\/span><\/div>\r\n\r\n    <!-- Quick Comparison Table -->\r\n    <div style=\"overflow-x:auto;margin-bottom:16px\">\r\n      <table class=\"ai-compare-table\" style=\"font-size:11.5px;width:100%\">\r\n        <thead><tr>\r\n          <th><\/th>\r\n          <th style=\"background:#f0fdf4\">🔧 Option A<br>Full Custom Chat App<\/th>\r\n          <th style=\"background:#ede9fe\">🔀 Option B<br>API-Only + Open WebUI<\/th>\r\n          <th style=\"background:#fef3c7\">🧩 Option C<br>Open WebUI Pipeline Plugin<\/th>\r\n        <\/tr><\/thead>\r\n        <tbody>\r\n          <tr><td><strong>What you build<\/strong><\/td>\r\n            <td>Complete chat UI + anonymization pipeline — everything<\/td>\r\n            <td>Only the anonymization API route — Open WebUI provides the chat UI<\/td>\r\n            <td>Only a plugin script — Open WebUI handles everything else<\/td><\/tr>\r\n          <tr><td><strong>Chat Interface<\/strong><\/td>\r\n            <td>✅ Full custom — your design, your UX<\/td>\r\n            <td>✅ Open WebUI provides it (polished, multi-model, conversation history)<\/td>\r\n            <td>✅ Open WebUI provides it<\/td><\/tr>\r\n          <tr><td><strong>Conversation History<\/strong><\/td>\r\n            <td>🔨 You build it (Prisma + PostgreSQL)<\/td>\r\n            <td>✅ Built-in (Open WebUI uses its own DB)<\/td>\r\n            <td>✅ Built-in<\/td><\/tr>\r\n          <tr><td><strong>Multi-User / Auth<\/strong><\/td>\r\n            <td>🔨 You build it (NextAuth.js, 1-2 days)<\/td>\r\n            <td>✅ Built-in (OAuth, RBAC, API keys)<\/td>\r\n            <td>✅ Built-in<\/td><\/tr>\r\n          <tr><td><strong>File Upload<\/strong><\/td>\r\n            <td>🔨 You build it (1 day)<\/td>\r\n            <td>✅ Built-in<\/td>\r\n            <td>✅ Built-in<\/td><\/tr>\r\n          <tr><td><strong>Streaming<\/strong><\/td>\r\n            <td>🔨 Vercel AI SDK (1 day integration)<\/td>\r\n            <td>✅ Built-in + your API streams to it<\/td>\r\n            <td>✅ Built-in<\/td><\/tr>\r\n          <tr><td><strong>Anonymization Pipeline<\/strong><\/td>\r\n            <td>🔨 You build it (~300 lines TS)<\/td>\r\n            <td>🔨 You build it as a standalone API (~300 lines TS)<\/td>\r\n            <td>🔨 You build it as a plugin (~200 lines Python)<\/td><\/tr>\r\n          <tr><td><strong>Tech Stack<\/strong><\/td>\r\n            <td>Next.js 15 · TypeScript · Prisma · AI SDK<\/td>\r\n            <td>Next.js API route + Open WebUI (SvelteKit/Python)<\/td>\r\n            <td>Python plugin + Open WebUI (SvelteKit/Python)<\/td><\/tr>\r\n          <tr><td><strong>Lines of Code<\/strong><\/td>\r\n            <td>~2,000 TSX + ~300 TS pipeline<\/td>\r\n            <td>~300 TS pipeline + Open WebUI config<\/td>\r\n            <td>~200 Python plugin + Open WebUI config<\/td><\/tr>\r\n          <tr style=\"background:#f0fdf4\"><td><strong>Timeline<\/strong><\/td>\r\n            <td><strong>3-5 weeks<\/strong> (MVP → production)<\/td>\r\n            <td><strong>2-3 weeks<\/strong> (API + Open WebUI setup)<\/td>\r\n            <td><strong>1-2 weeks<\/strong> (plugin + Open WebUI setup)<\/td><\/tr>\r\n          <tr><td><strong>Maintenance Burden<\/strong><\/td>\r\n            <td>🔴 High — you own every feature forever<\/td>\r\n            <td>🟡 Medium — you maintain the API; Open WebUI updates are upstream<\/td>\r\n            <td>🟢 Low — you maintain only the plugin; UI updates are automatic<\/td><\/tr>\r\n          <tr><td><strong>PKF Branding / White-Label<\/strong><\/td>\r\n            <td>✅ Full control — PKF colors, logo, custom UX<\/td>\r\n            <td>⚠️ Limited — Open WebUI supports branding but not deep customization<\/td>\r\n            <td>⚠️ Limited — same as Option B<\/td><\/tr>\r\n          <tr><td><strong>Audit Trail Customization<\/strong><\/td>\r\n            <td>✅ Full control — log every anonymization step in your DB<\/td>\r\n            <td>✅ Full control — your API logs all pipeline steps<\/td>\r\n            <td>⚠️ Partial — plugin logs exist but harder to surface in UI<\/td><\/tr>\r\n          <tr><td><strong>GDPR / Compliance<\/strong><\/td>\r\n            <td>✅ Full control over data flow & storage<\/td>\r\n            <td>⚠️ Two systems to audit (your API + Open WebUI)<\/td>\r\n            <td>⚠️ Two systems to audit<\/td><\/tr>\r\n          <tr><td><strong>Vendor Lock-in Risk<\/strong><\/td>\r\n            <td>🟢 None — you own the code<\/td>\r\n            <td>🟡 Medium — if Open WebUI stagnates, you still have your API<\/td>\r\n            <td>🔴 Medium-High — plugin API may change with Open WebUI versions<\/td><\/tr>\r\n        <\/tbody>\r\n      <\/table>\r\n    <\/div>\r\n\r\n    <!-- Detailed Breakdown -->\r\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;font-size:12.5px;line-height:1.7\">\r\n      <div style=\"background:#f0fdf4;border:1px solid #10b981;border-radius:10px;padding:14px\">\r\n        <strong style=\"color:#059669;font-size:14px\">🔧 Option A: Full Custom Chat App<\/strong><br><br>\r\n        <strong>Build a complete ChatGPT-like app in Next.js.<\/strong><br><br>\r\n        <strong>Architecture:<\/strong><br>\r\n        • <code>app/chat/page.tsx<\/code> — Chat UI with conversation sidebar<br>\r\n        • <code>app/api/chat/route.ts<\/code> — Anonymization pipeline API route<br>\r\n        • <code>prisma/schema.prisma<\/code> — Conversations, messages, mapping tables<br>\r\n        • NextAuth.js — PKF Azure AD / Entra ID SSO<br>\r\n        • Vercel AI SDK — Streaming responses to the UI<br><br>\r\n        <strong>✅ Pros:<\/strong><br>\r\n        • Full PKF branding — exact UX your team needs<br>\r\n        • Single codebase — one Next.js app, one deployment<br>\r\n        • Complete audit trail — every anonymization logged in your DB<br>\r\n        • No dependency on third-party chat UIs<br>\r\n        • Your team's existing Next.js skills — zero new platform<br><br>\r\n        <strong>❌ Cons:<\/strong><br>\r\n        • ~2,300 lines of code to write & maintain<br>\r\n        • You own everything — bugs, features, updates<br>\r\n        • Chat UI is commodity work (sidebar, message bubbles, etc.) — reinventing wheels<br>\r\n        • 3-5 weeks before production-ready<br><br>\r\n        <strong>📋 Best for:<\/strong> Teams that need full branding control, custom audit workflows, or plan to add PKF-specific features long-term.\r\n      <\/div>\r\n\r\n      <div style=\"background:#ede9fe;border:1px solid #7c3aed;border-radius:10px;padding:14px\">\r\n        <strong style=\"color:#7c3aed;font-size:14px\">🔀 Option B: API-Only + Open WebUI ⭐<\/strong><br><br>\r\n        <strong>Build only the anonymization pipeline as a Next.js API route. Use Open WebUI as the chat front-end.<\/strong><br><br>\r\n        <strong>Architecture:<\/strong><br>\r\n        • Your API: <code>POST /api/anonymized-chat<\/code> runs the 7-step pipeline<br>\r\n        • Open WebUI: Pointed at your API as a custom \"OpenAI-compatible\" endpoint<br>\r\n        • Open WebUI handles: chat UI, conversations, auth, file upload, model switching<br>\r\n        • Your API handles: anonymization, DeepSeek call, re-identification, audit logging<br><br>\r\n        <strong>✅ Pros:<\/strong><br>\r\n        • Fastest path to a polished chat experience<br>\r\n        • Open WebUI is mature — conversation branching, RAG, tool use, multi-model<br>\r\n        • You focus only on the privacy pipeline (~300 lines)<br>\r\n        • Open WebUI updates bring new features for free<br>\r\n        • Can migrate to Option A later — your API is reusable<br><br>\r\n        <strong>❌ Cons:<\/strong><br>\r\n        • Two systems to deploy & monitor (your API + Open WebUI)<br>\r\n        • Open WebUI is Python/SvelteKit — different stack from your Next.js<br>\r\n        • Limited PKF branding (logo + colors only)<br>\r\n        • Users see Open WebUI UX, not your design<br>\r\n        • Need to ensure the OpenAI-compatible API contract stays aligned<br><br>\r\n        <strong>📋 Best for:<\/strong> Teams that want a ready-made chat experience and only care about the anonymization logic — not the UI.\r\n      <\/div>\r\n\r\n      <div style=\"background:#fef3c7;border:1px solid #d97706;border-radius:10px;padding:14px\">\r\n        <strong style=\"color:#b45309;font-size:14px\">🧩 Option C: Pipeline Plugin Only<\/strong><br><br>\r\n        <strong>Write only an anonymization filter as an Open WebUI Pipeline Plugin. No separate backend.<\/strong><br><br>\r\n        <strong>Architecture:<\/strong><br>\r\n        • Open WebUI Pipeline Plugin system — filters run before/after model calls<br>\r\n        • Your plugin: <code>anonymize_filter.py<\/code> (~200 lines) hooks into the pipeline<br>\r\n        • Inlet filter: intercepts user message → calls local Ollama → replaces PII → passes to cloud model<br>\r\n        • Outlet filter: receives cloud response → re-identifies → passes to user<br>\r\n        • All within Open WebUI — no separate API server<br><br>\r\n        <strong>✅ Pros:<\/strong><br>\r\n        • Fastest to deploy — ~200 lines of Python, 1-2 weeks<br>\r\n        • Zero new infrastructure — Open WebUI runs everything<br>\r\n        • Pipeline plugins are a supported API — cleaner than forking code<br>\r\n        • Automatic UI integration — filter status visible in Open WebUI<br><br>\r\n        <strong>❌ Cons:<\/strong><br>\r\n        • Python only (Open WebUI plugin API is Python)<br>\r\n        • Less control — mapping table storage, audit log format limited by plugin API<br>\r\n        • Plugin API versioning risk — may break on Open WebUI major updates<br>\r\n        • Harder to add custom features later (e.g., approval workflows)<br>\r\n        • Debugging pipeline plugins is harder than debugging your own API<br><br>\r\n        <strong>📋 Best for:<\/strong> Rapid PoC. Teams that want to validate the two-step anonymization concept in 1-2 weeks with minimal investment.\r\n      <\/div>\r\n    <\/div>\r\n\r\n    <div class=\"ai-rec-highlight\" style=\"margin-top:14px\">\r\n      <strong>🏗️ Recommendation:<\/strong> <strong>Start with Option B (API-Only + Open WebUI)<\/strong> — it gives you the best balance. You write ~300 lines of TypeScript for the anonymization pipeline (your team's stack), and Open WebUI provides a polished, production-ready chat experience with conversation history, auth, file upload, and multi-model support — all features you'd spend weeks building yourself. Your API is fully reusable — if you later outgrow Open WebUI, you can build Option A's custom UI on top of the same API with zero pipeline changes. For a quick PoC, try <strong>Option C<\/strong> first (1 week), then graduate to Option B for production. <strong>Skip LibreChat entirely<\/strong> — it has no pipeline/plugin API, so any customization requires fragile core rewrites.\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Cost Breakdown -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">💰 Cost Breakdown — Monthly & One-Time<\/span><\/div>\r\n    <div style=\"overflow-x:auto\">\r\n      <table class=\"ai-compare-table\" style=\"font-size:12px;width:100%\">\r\n        <thead><tr><th>Component<\/th><th>One-Time Cost<\/th><th>Monthly Cost<\/th><th>Notes<\/th><\/tr><\/thead>\r\n        <tbody>\r\n          <tr><td><strong>Mac Mini M4 Pro<\/strong> (local anonymization)<\/td><td>$2,000<\/td><td>$15 (electricity)<\/td><td>Amortized over 3 years: $56/mo<\/td><\/tr>\r\n          <tr><td><strong>DeepSeek V4 Pro API<\/strong> (cloud intelligence)<\/td><td>$0<\/td><td>~$20–200<\/td><td>Depends on query volume. 100K queries/mo ≈ $20.<\/td><\/tr>\r\n          <tr><td><strong>Custom Next.js App<\/strong> (development)<\/td><td>$0 (in-house) or $8,000 (contract)<\/td><td>$0<\/td><td>1 week for MVP, 2-3 weeks for production<\/td><\/tr>\r\n          <tr style=\"background:#f0fdf4\"><td><strong>TOTAL (Recommended)<\/strong><\/td><td><strong>$2,000<\/strong><\/td><td><strong>$71–250/mo<\/strong><\/td><td>Mac Mini + DeepSeek API + in-house dev<\/td><\/tr>\r\n        <\/tbody>\r\n      <\/table>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Security and Compliance -->\r\n  <div class=\"ai-card\" style=\"margin-bottom:16px\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🔐 Security & Compliance Notes<\/span><\/div>\r\n    <div style=\"font-size:13px;line-height:1.7;padding:8px 0\">\r\n      <strong>✅ What NEVER leaves your network:<\/strong> Client names, revenue figures, personal data, audit findings, tax IDs, addresses, document references.<br>\r\n      <strong>✅ What goes to DeepSeek Cloud:<\/strong> Generic placeholders like [Client_A], [Revenue_Issue_B], [Location_C]. Zero semantic link to real entities.<br>\r\n      <strong>✅ Mapping table:<\/strong> Stored locally (SQLite or Redis). Encrypted at rest. Never transmitted.<br>\r\n      <strong>⚠️ DeepSeek API data policy:<\/strong> Review DeepSeek's data processing terms. For maximum compliance, use their API with data processing agreements. Consider if their servers are in acceptable jurisdictions.<br>\r\n      <strong>✅ Audit trail:<\/strong> Log every query: original → anonymized → cloud response → re-identified. Immutable audit log for compliance reviews.<br>\r\n      <strong>✅ GDPR / ISO 27001:<\/strong> This architecture supports both — anonymized data is not personal data under GDPR. Local processing keeps sensitive data within your control boundary.\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Implementation Roadmap -->\r\n  <div class=\"ai-card\">\r\n    <div class=\"ai-card-header\"><span class=\"ai-card-title\">🚀 Implementation Roadmap — 4 Weeks to Production<\/span><\/div>\r\n    <div style=\"font-size:13px;line-height:1.8;padding:8px 0\">\r\n      <strong>Week 1:<\/strong> Set up Mac Mini M4 Pro (or DGX Spark). Install Ollama + Phi-4 Mini. Test anonymization quality with 100 sample PKF queries. Refine the anonymization prompt until PII detection >95%.<br>\r\n      <strong>Week 2:<\/strong> Build the Next.js API route (<code style=\"font-size:11px\">app/api/chat/route.ts<\/code>): receive query → local Ollama anonymize → DeepSeek API → re-identify → stream response. Add Prisma + SQLite for mapping table persistence. Test end-to-end with 500 queries.<br>\r\n      <strong>Week 3:<\/strong> Add audit logging. Build simple web UI (or integrate with existing PKF intranet). Add user authentication. Test with 5 pilot users from audit team.<br>\r\n      <strong>Week 4:<\/strong> Security review: verify no PII leaks in network traces, logs, or error messages. Load test: can the Mac Mini handle 10 concurrent anonymization requests? Deploy to pilot (10-15 users).<br>\r\n      <strong>Month 2:<\/strong> Evaluate Option B (fine-tuned model) if prompt-based anonymization misses edge cases. Consider Open WebUI with Pipeline Plugin if you need a ready-made chat UI — it's far easier to customize than LibreChat for this use case.\r\n    <\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n<!-- 2. CONFIGURE VIEW -->\r\n<!-- ════════════════════════════════════════════════════════ -->\r\n<section class=\"ai-view\" id=\"view-configure\">\r\n  <div class=\"ai-view-header\">\r\n    <div>\r\n      <div class=\"ai-view-title\">⚙️ System Configuration<\/div>\r\n      <div class=\"ai-view-sub\">Adjust all parameters to simulate your AI system architecture<\/div>\r\n    <\/div>\r\n    <div class=\"ai-view-toolbar\">\r\n      <button class=\"ai-btn ai-btn-outline ai-btn-sm\" id=\"btn-preset-copilot\">🪟 Copilot Preset<\/button>\r\n      <button class=\"ai-btn ai-btn-outline ai-btn-sm\" id=\"btn-preset-hybrid\">🔀 Hybrid Preset<\/button>\r\n      <button class=\"ai-btn ai-btn-outline ai-btn-sm\" id=\"btn-preset-onprem\">🖥️ On-Prem Preset<\/button>\r\n      <button class=\"ai-btn ai-btn-outline ai-btn-sm\" id=\"btn-reset-config\">🔄 Reset<\/button>\r\n      <button class=\"ai-btn ai-btn-primary ai-btn-sm\" id=\"btn-apply-config\">✅ Apply & Save<\/button>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <div class=\"ai-config-grid\">\r\n\r\n    <div class=\"ai-card ai-config-card\">\r\n      <div class=\"ai-card-header\"><span class=\"ai-card-title\">🤖 LLM Provider & Model<\/span> <span style=\"font-size:10px;color:var(--ai-text-muted);margin-left:8px\">💡 Choose which AI model powers your system. Cloud = pay-per-use API, Local = runs on your hardware.<\/span><\/div>\r\n      <div class=\"ai-config-body\">\r\n        <div class=\"ai-field\">\r\n          <label class=\"ai-label\">Deployment Type<\/label>\r\n          <select class=\"ai-select\" id=\"cfg-deployment-type\">\r\n            <option value=\"copilot\">🪟 Microsoft Copilot (M365 + Studio)<\/option>\r\n            <option value=\"cloud\">☁️ Cloud LLM (API-Based)<\/option>\r\n            <option value=\"local\">🖥️ On-Prem / Local LLM<\/option>\r\n            <option value=\"hybrid\">🔀 Hybrid (Local + Cloud)<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"ai-field\" id=\"cfg-copilot-group\" style=\"display:none\">\r\n          <label class=\"ai-label\">Copilot Configuration<\/label>\r\n          <select class=\"ai-select\" id=\"cfg-copilot-tier\">\r\n            <option value=\"m365\">Microsoft 365 Copilot (Built-in)<\/option>\r\n            <option value=\"studio\">Copilot Studio (Custom Agents)<\/option>\r\n            <option value=\"azure\">Azure AI + Copilot Stack<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"ai-field\" id=\"cfg-local-model-group\">\r\n          <label class=\"ai-label\">Local Model <span style=\"font-size:9px;color:var(--ai-text-muted)\">💡 Open-source models run on your own GPU. Higher VRAM = larger model. See hardware section for costs.<\/span><\/label>\r\n          <select class=\"ai-select\" id=\"cfg-local-model\">\r\n            <option value=\"deepseek-v4-pro\">DeepSeek V4 Pro — 48 GB VRAM (Best coding & reasoning)<\/option>\r\n            <option value=\"llama-latest\">Llama 4 Latest — 24 GB VRAM (Best all-rounder)<\/option>\r\n            <option value=\"qwen-latest\">Qwen 3 Latest — 48 GB VRAM (Best multilingual)<\/option>\r\n            <option value=\"phi4-medium\">Phi-4 Medium 14B — 16 GB VRAM (Best lightweight)<\/option>\r\n            <option value=\"phi4-mini\">Phi-4 Mini 3.8B — 4 GB VRAM (Laptop friendly)<\/option>\r\n            <option value=\"mistral-small\">Mistral Small 3.1 — 16 GB VRAM (Best structured JSON)<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"ai-field\" id=\"cfg-local-runtime-group\">\r\n          <label class=\"ai-label\">Local Runtime<\/label>\r\n          <select class=\"ai-select\" id=\"cfg-local-runtime\">\r\n            <option value=\"ollama\">Ollama<\/option>\r\n            <option value=\"lmstudio\">LM Studio<\/option>\r\n            <option value=\"llamacpp\">llama.cpp<\/option>\r\n            <option value=\"vllm\">vLLM<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"ai-field\" id=\"cfg-cloud-provider-group\">\r\n          <label class=\"ai-label\">Cloud Provider<\/label>\r\n          <select class=\"ai-select\" id=\"cfg-cloud-provider\">\r\n            <option value=\"anthropic\">Anthropic (Claude Opus 4.8 · Sonnet 4.6)<\/option>\r\n            <option value=\"openai\">OpenAI (GPT-5.4 · GPT-5.5 Mini/Nano)<\/option>\r\n            <option value=\"deepseek-cloud\">DeepSeek Cloud (V4 Pro — Best $/perf)<\/option>\r\n            <option value=\"google\">Google (Gemini 3.0 Ultra · Flash)<\/option>\r\n            <option value=\"glm\">GLM 5.2 (Zhipu AI — Best Chinese LLM)<\/option>\r\n            <option value=\"minimax\">MiniMax-M3 (Strong multilingual)<\/option>\r\n            <option value=\"kimi\">Kimi Latest (Moonshot AI — Long context)<\/option>\r\n            <option value=\"together\">Together AI (Llama 4, DeepSeek V4)<\/option>\r\n            <option value=\"groq\">Groq (Ultra-fast inference)<\/option>\r\n            <option value=\"fireworks\">Fireworks AI<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"ai-field\" id=\"cfg-cloud-model-group\">\r\n          <label class=\"ai-label\">Cloud Model Tier <span style=\"font-size:9px;color:var(--ai-text-muted)\">💡 Premium = most capable (best for complex tasks), Balanced = best value (everyday use), Budget = cheapest (simple tasks).<\/span><\/label>\r\n          <select class=\"ai-select\" id=\"cfg-cloud-model\">\r\n            <option value=\"premium\">🚀 Premium — Best model, highest cost (GPT-5.4 / Claude Opus 4.8 / Gemini 3.0 Ultra)<\/option>\r\n            <option value=\"balanced\">⚖️ Balanced — Best value, good quality (GPT-5.5 Mini / Claude Sonnet 4.6 / Gemini Flash)<\/option>\r\n            <option value=\"budget\">💰 Budget — Lowest cost, basic tasks (GPT-5.5 Nano / Claude Haiku / Gemini Nano)<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"ai-field\">\r\n          <label class=\"ai-label\">Temperature <span class=\"ai-range-val\" id=\"cfg-temp-val\">0.2<\/span> <span style=\"font-size:9px;color:var(--ai-text-muted)\">💡 How \"creative\" the AI is. Lower = more factual & precise (use for coding/audit). Higher = more varied & creative.<\/span><\/label>\r\n          <input type=\"range\" class=\"ai-range\" id=\"cfg-temperature\" min=\"0\" max=\"2\" step=\"0.1\" value=\"0.2\">\r\n          <div style=\"margin-top:4px\"><span style=\"font-size:10px;color:var(--ai-text-muted)\">⚡ Quick Presets: \r\n            <button type=\"button\" class=\"ai-btn ai-btn-sm ai-btn-outline\" onclick=\"var e=document.getElementById('cfg-temperature');e.value='0.2';e.dispatchEvent(new Event('input'));var t=document.getElementById('cfg-max-tokens');t.value='4096';t.dispatchEvent(new Event('input'))\">💻 Coding (temp 0.2, 4K tokens)<\/button>\r\n            <button type=\"button\" class=\"ai-btn ai-btn-sm ai-btn-outline\" onclick=\"var e=document.getElementById('cfg-temperature');e.value='0.7';e.dispatchEvent(new Event('input'));var t=document.getElementById('cfg-max-tokens');t.value='2048';t.dispatchEvent(new Event('input'))\">💬 Everyday Q&amp;A (temp 0.7, 2K tokens)<\/button>\r\n            <button type=\"button\" class=\"ai-btn ai-btn-sm ai-btn-outline\" onclick=\"var e=document.getElementById('cfg-temperature');e.value='0.5';e.dispatchEvent(new Event('input'));var t=document.getElementById('cfg-max-tokens');t.value='32768';t.dispatchEvent(new Event('input'))\">📄 Large Prompts (temp 0.5, 32K tokens)<\/button>\r\n          <\/span><\/div>\r\n        <\/div>\r\n        <div class=\"ai-field\">\r\n          <label class=\"ai-label\">Max Tokens <span class=\"ai-range-val\" id=\"cfg-tokens-val\">4096<\/span> <span style=\"font-size:9px;color:var(--ai-text-muted)\">💡 Maximum words the AI can output in one response. ~1 token ≈ 0.75 words. Higher = longer answers but more cost.<\/span><\/label>\r\n          <input type=\"range\" class=\"ai-range\" id=\"cfg-max-tokens\" min=\"256\" max=\"131072\" step=\"256\" value=\"4096\">\r\n        <\/div>\r\n      <\/div>\r\n    <\/div>\r\n\r\n    <div class=\"ai-card ai-config-card\">\r\n      <div class=\"ai-card-header\"><span class=\"ai-card-title\">📝 Prompts & Agent Persona<\/span> <span style=\"font-size:10px;color:var(--ai-text-muted)\">💡 This defines WHO the AI is and HOW it behaves. The System Prompt is the AI's \"job description\" — it sets the rules, tone, and boundaries for every response.<\/span><\/div>\r\n      <div class=\"ai-config-body\">\r\n        <div class=\"ai-field\">\r\n          <label class=\"ai-label\">Agent Persona <span style=\"font-size:9px;color:var(--ai-text-muted)\">💡 Which role does this agent play? \"All\" runs the full team. Or pick a single role for testing.<\/span><\/label>\r\n          <select class=\"ai-select\" id=\"cfg-agent-persona\">\r\n            <option value=\"all\">All Personas (Doer + Reviewer + Manager)<\/option>\r\n            <option value=\"doer\">Doer Agent Only<\/option>\r\n            <option value=\"reviewer\">Reviewer Agent Only<\/option>\r\n            <option value=\"manager\">Manager Agent Only<\/option>\r\n          <\/select>\r\n        <\/div>\r\n        <div class=\"ai-field\">\r\n          <label class=\"ai-label\">System Prompt Template <span style=\"font-size:9px;color:var(--ai-text-muted)\">💡 This is the AI's permanent instructions. It tells the AI: who you are, what company you work for, how to behave, what tone to use, and what rules to follow. Without it, the AI gives generic answers.<\/span><\/label>\r\n          <textarea class=\"ai-textarea\" id=\"cfg-system-prompt\" rows=\"4\">You are a helpful AI assistant for {{company_name}}. You have ac
