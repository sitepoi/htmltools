><\/label>\r\n          <input type=\"text\" id=\"pec-postalCode\" placeholder=\"A1A 1A1\">\r\n        <\/div>\r\n        <div class=\"pec-field\">\r\n          <label for=\"pec-country\">Country <span class=\"pec-required-star\">*<\/span><\/label>\r\n          <input type=\"text\" id=\"pec-country\" value=\"Canada\" placeholder=\"Country\">\r\n        <\/div>\r\n        <div class=\"pec-field\">\r\n          <label for=\"pec-phone\">Phone Number <span class=\"pec-required-star\">*<\/span><\/label>\r\n          <input type=\"tel\" id=\"pec-phone\" placeholder=\"(555) 555-5555\">\r\n        <\/div>\r\n        <div class=\"pec-field\">\r\n          <label for=\"pec-email\">Email Address <span class=\"pec-required-star\">*<\/span><\/label>\r\n          <input type=\"email\" id=\"pec-email\" placeholder=\"you@example.com\">\r\n        <\/div>\r\n      <\/div>\r\n      <h3 class=\"pec-subtitle\">Emergency Contact<\/h3>\r\n      <div class=\"pec-grid pec-grid-2\">\r\n        <div class=\"pec-field\">\r\n          <label for=\"pec-emergencyContact\">Emergency Contact Name <span class=\"pec-required-star\">*<\/span><\/label>\r\n          <input type=\"text\" id=\"pec-emergencyContact\" placeholder=\"Full name of emergency contact\">\r\n        <\/div>\r\n        <div class=\"pec-field\">\r\n          <label for=\"pec-emergencyPhone\">Emergency Contact Phone <span class=\"pec-required-star\">*<\/span><\/label>\r\n          <input type=\"tel\" id=\"pec-emergencyPhone\" placeholder=\"(555) 555-5555\">\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- ═══════════════════════════════════════════════════════════════ -->\r\n    <!-- SECTION 3: Banking & Payment -->\r\n    <!-- ═══════════════════════════════════════════════════════════════ -->\r\n    <section class=\"pec-section\" id=\"sec-banking\">\r\n      <h2 class=\"pec-section-title\">\r\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"1\" y=\"3\" width=\"22\" height=\"18\" rx=\"2\"/><line x1=\"6\" y1=\"8\" x2=\"6\" y2=\"8.01\"/><line x1=\"10\" y1=\"8\" x2=\"18\" y2=\"8\"/><line x1=\"6\" y1=\"12\" x2=\"6\" y2=\"12.01\"/><line x1=\"10\" y1=\"12\" x2=\"18\" y2=\"12\"/><line x1=\"6\" y1=\"16\" x2=\"6\" y2=\"16.01\"/><line x1=\"10\" y1=\"16\" x2=\"14\" y2=\"16\"/><\/svg>\r\n        Banking &amp; Direct Deposit\r\n        <span class=\"pec-section-status\" data-section=\"banking\"><\/span>\r\n      <\/h2>\r\n      <p class=\"pec-section-hint\">For payroll direct deposit. You can attach a void cheque below instead of filling this manually.<\/p>\r\n      <div class=\"pec-grid pec-grid-2\">\r\n        <div class=\"pec-field pec-span-2\">\r\n          <label for=\"pec-bankName\">Bank / Financial Institution Name<\/label>\r\n          <input type=\"text\" id=\"pec-bankName\" placeholder=\"e.g. TD Canada Trust, RBC, Scotiabank\">\r\n        <\/div>\r\n        <div class=\"pec-field\">\r\n          <label for=\"pec-transitNumber\">Transit / Branch Number (5 digits)<\/label>\r\n          <input type=\"text\" id=\"pec-transitNumber\" placeholder=\"12345\" maxlength=\"5\" inputmode=\"numeric\" pattern=\"[0-9]*\">\r\n        <\/div>\r\n        <div class=\"pec-field\">\r\n          <label for=\"pec-institutionNumber\">Institution Number (3 digits)<\/label>\r\n          <input type=\"text\" id=\"pec-institutionNumber\" placeholder=\"001\" maxlength=\"3\" inputmode=\"numeric\" pattern=\"[0-9]*\">\r\n        <\/div>\r\n        <div class=\"pec-field pec-span-2\">\r\n          <label for=\"pec-accountNumber\">Account Number<\/label>\r\n          <input type=\"text\" id=\"pec-accountNumber\" placeholder=\"Your bank account number\" autocomplete=\"off\">\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- ═══════════════════════════════════════════════════════════════ -->\r\n    <!-- SECTION 4: Documents & Forms -->\r\n    <!-- ═══════════════════════════════════════════════════════════════ -->\r\n    <section class=\"pec-section\" id=\"sec-documents\">\r\n      <h2 class=\"pec-section-title\">\r\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><rect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\"/><path d=\"M9 12l2 2 4-4\"/><\/svg>\r\n        Documents &amp; Forms\r\n        <span class=\"pec-section-status\" data-section=\"documents\"><\/span>\r\n      <\/h2>\r\n      <p class=\"pec-section-hint\">Download each blank form, fill it out, sign it, and upload the completed version. Required forms are marked <span class=\"pec-required-star\">*<\/span>.<\/p>\r\n      <div class=\"pec-doc-templates\" id=\"pec-docTemplates\">\r\n        <p class=\"pec-empty-msg\">Loading document templates…<\/p>\r\n      <\/div>\r\n\r\n      <!-- Person-specific agreements (uploaded by HR) -->\r\n      <div class=\"pec-agreement-group\" style=\"margin-top:18px\">\r\n        <h3 class=\"pec-subtitle\">Your Personal Agreements <span class=\"pec-section-badge\">Assigned to You<\/span><\/h3>\r\n        <div class=\"pec-agreement-list\" id=\"pec-personalAgreements\">\r\n          <p class=\"pec-empty-msg\">No person-specific agreements assigned yet.<\/p>\r\n        <\/div>\r\n        <button class=\"pec-btn pec-btn-outline pec-btn-sm\" id=\"pec-uploadPersonalAgreement\">\r\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><polyline points=\"17 8 12 3 7 8\"/><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/><\/svg>\r\n          Upload Signed Personal Agreement\r\n        <\/button>\r\n      <\/div>\r\n\r\n      <!-- Other ad-hoc documents -->\r\n      <div class=\"pec-agreement-group\">\r\n        <h3 class=\"pec-subtitle\">Other Documents<\/h3>\r\n        <div class=\"pec-doc-list\" id=\"pec-otherDocs\">\r\n          <p class=\"pec-empty-msg\">No additional documents uploaded.<\/p>\r\n        <\/div>\r\n        <button class=\"pec-btn pec-btn-outline pec-btn-sm\" id=\"pec-uploadOtherDoc\">\r\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><polyline points=\"17 8 12 3 7 8\"/><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/><\/svg>\r\n          Upload Other Document\r\n        <\/button>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- ═══════════════════════════════════════════════════════════════ -->\r\n    <!-- SECTION 5: Additional Information (from params) -->\r\n    <!-- ═══════════════════════════════════════════════════════════════ -->\r\n    <section class=\"pec-section\" id=\"sec-customFields\" style=\"display:none\">\r\n      <h2 class=\"pec-section-title\">\r\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/><\/svg>\r\n        Additional Information\r\n        <span class=\"pec-section-status\" data-section=\"custom\"><\/span>\r\n      <\/h2>\r\n      <div class=\"pec-grid pec-grid-2\" id=\"pec-customFieldsGrid\"><\/div>\r\n    <\/section>\r\n\r\n    <!-- Footer -->\r\n    <div class=\"pec-foot\">\r\n      <span class=\"pec-foot-meta pec-autosave-note\">💾 Changes are saved automatically as you type.<\/span>\r\n      <span class=\"pec-foot-meta\" id=\"pec-savedAt\"><\/span>\r\n      <span class=\"pec-foot-meta\" id=\"pec-employeeIdent\"><\/span>\r\n    <\/div>\r\n\r\n  <\/div><!-- /pec-wrap -->\r\n<\/div><!-- /pec -->"},"css":{"name":"EmployeeDataCollection.css","src":"../app/EmployeeDataCollection.css","content":"/* ============================================================\r\n   Employee Data Collection — CSS\r\n   Clean, professional HR/Finance look. Print-friendly.\r\n   ============================================================ */\r\n\r\n:root {\r\n  --pec-blue: #1a56db;\r\n  --pec-blue-deep: #103c9e;\r\n  --pec-blue-soft: #e8effc;\r\n  --pec-green: #0d9488;\r\n  --pec-green-soft: #e6f7f5;\r\n  --pec-amber: #d97706;\r\n  --pec-amber-soft: #fef3c7;\r\n  --pec-red: #c8102e;\r\n  --pec-red-soft: #fde8ec;\r\n  --pec-radius: 10px;\r\n  --pec-fs: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\r\n  --pec-fd: Georgia, 'Times New Roman', serif;\r\n}\r\n\r\n/* ── Guard against host CSS bleed ── */\r\n.pec *,\r\n.pec *::before,\r\n.pec *::after {\r\n  box-sizing: border-box;\r\n  margin: 0;\r\n  padding: 0;\r\n  border: 0 solid #e5e7eb;\r\n  outline: 0;\r\n  background-image: none;\r\n}\r\n\r\n.pec {\r\n  font-family: var(--pec-fs);\r\n  color: #1b1e23;\r\n  line-height: 1.55;\r\n  -webkit-font-smoothing: antialiased;\r\n  background: #f7f8fa;\r\n  padding: 0 16px 40px;\r\n  min-height: 100vh;\r\n}\r\n\r\n.pec h1, .pec h2, .pec h3, .pec h4 {\r\n  font-family: var(--pec-fd);\r\n  font-weight: 600;\r\n  line-height: 1.15;\r\n  letter-spacing: -0.01em;\r\n}\r\n\r\n.pec-wrap {\r\n  max-width: 820px;\r\n  margin: 0 auto;\r\n}\r\n\r\n/* ── Header ── */\r\n.pec-header {\r\n  padding: 22px 0 10px;\r\n  border-bottom: 1px solid #e5e7eb;\r\n  margin-bottom: 24px;\r\n}\r\n\r\n.pec-brand {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 8px;\r\n}\r\n\r\n.pec-header h1 {\r\n  font-size: clamp(22px, 3.5vw, 30px);\r\n}\r\n\r\n.pec-thin {\r\n  font-style: italic;\r\n  font-weight: 400;\r\n  color: #666;\r\n}\r\n\r\n.pec-header-msg {\r\n  margin-top: 10px;\r\n  padding: 12px 16px;\r\n  background: var(--pec-blue-soft);\r\n  border-left: 4px solid var(--pec-blue);\r\n  border-radius: 0 8px 8px 0;\r\n  font-size: 14px;\r\n  color: #1e3a5f;\r\n  line-height: 1.5;\r\n}\r\n.pec-header-msg p { margin: 0; }\r\n\r\n/* ── Progress bar ── */\r\n.pec-progress {\r\n  margin-top: 14px;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n}\r\n\r\n.pec-progress-track {\r\n  flex: 1;\r\n  height: 6px;\r\n  background: #e5e7eb;\r\n  border-radius: 100px;\r\n  overflow: hidden;\r\n}\r\n\r\n.pec-progress-fill {\r\n  height: 100%;\r\n  background: var(--pec-green);\r\n  border-radius: 100px;\r\n  transition: width 0.4s ease;\r\n}\r\n\r\n.pec-progress-label {\r\n  font-size: 11px;\r\n  color: #888;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.05em;\r\n  white-space: nowrap;\r\n}\r\n\r\n/* ── Status banner ── */\r\n.pec-status-banner {\r\n  margin-top: 12px;\r\n  padding: 10px 16px;\r\n  border-radius: 8px;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  font-size: 13px;\r\n  font-weight: 500;\r\n}\r\n.pec-status-banner.draft  { background: var(--pec-amber-soft); color: #92400e; border: 1px solid #fcd34d; }\r\n.pec-status-banner.submitted { background: var(--pec-green-soft); color: #0b5e54; border: 1px solid #5eead4; }\r\n.pec-status-icon { font-size: 16px; }\r\n\r\n/* ── Sections ── */\r\n.pec-section {\r\n  background: #fff;\r\n  border: 1px solid #e5e7eb;\r\n  border-radius: var(--pec-radius);\r\n  padding: 24px;\r\n  margin-bottom: 18px;\r\n  box-shadow: 0 1px 2px rgba(0,0,0,.03);\r\n}\r\n\r\n.pec-section-title {\r\n  font-size: 17px;\r\n  color: var(--pec-blue);\r\n  margin-bottom: 18px;\r\n  padding-bottom: 10px;\r\n  border-bottom: 2px solid var(--pec-blue-soft);\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n.pec-section-title svg { width: 18px; height: 18px; flex: none; }\r\n\r\n/* Section completion badge */\r\n.pec-section-status {\r\n  margin-left: auto;\r\n  font-family: var(--pec-fs);\r\n  font-size: 10px;\r\n  font-weight: 700;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n  padding: 3px 10px;\r\n  border-radius: 100px;\r\n  white-space: nowrap;\r\n  line-height: 1.4;\r\n}\r\n.pec-section-status.complete {\r\n  background: var(--pec-green-soft);\r\n  color: #0b5e54;\r\n  border: 1px solid #a7f3d0;\r\n}\r\n.pec-section-status.incomplete {\r\n  background: #f3f4f6;\r\n  color: #6b7280;\r\n  border: 1px solid #e5e7eb;\r\n}\r\n\r\n.pec-section-badge {\r\n  font-family: var(--pec-fs);\r\n  font-size: 10px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n  background: #f0f0f0;\r\n  color: #666;\r\n  padding: 3px 10px;\r\n  border-radius: 100px;\r\n}\r\n\r\n.pec-subtitle {\r\n  font-size: 14px;\r\n  color: #444;\r\n  margin: 16px 0 12px;\r\n  padding-bottom: 6px;\r\n  border-bottom: 1px dashed #e5e7eb;\r\n}\r\n\r\n.pec-section-hint {\r\n  font-size: 13px;\r\n  color: #777;\r\n  margin-bottom: 14px;\r\n  line-height: 1.5;\r\n}\r\n\r\n.pec-section-hint-sm {\r\n  font-size: 12px;\r\n  color: #999;\r\n  margin-bottom: 10px;\r\n}\r\n\r\n/* ── Grid ── */\r\n.pec-grid { display: grid; gap: 14px; }\r\n.pec-grid-2 { grid-template-columns: 1fr 1fr; }\r\n.pec-grid-3 { grid-template-columns: 1fr 1fr 1fr; }\r\n.pec-span-2 { grid-column: span 2; }\r\n.pec-span-3 { grid-column: span 3; }\r\n\r\n@media (max-width: 560px) {\r\n  .pec-grid-2, .pec-grid-3 { grid-template-columns: 1fr; }\r\n  .pec-span-2, .pec-span-3 { grid-column: span 1; }\r\n}\r\n\r\n/* ── Fields ── */\r\n.pec-field {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 4px;\r\n}\r\n\r\n.pec-field label {\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  color: #444;\r\n  letter-spacing: 0.01em;\r\n  text-transform: uppercase;\r\n}\r\n\r\n.pec-field input,\r\n.pec-field select,\r\n.pec-field textarea {\r\n  font-family: var(--pec-fs);\r\n  font-size: 14px;\r\n  padding: 9px 12px;\r\n  border: 1px solid #d5d8dc;\r\n  border-radius: 6px;\r\n  background: #fff;\r\n  color: #1b1e23;\r\n  transition: border-color 0.15s;\r\n  width: 100%;\r\n}\r\n.pec-field input:focus,\r\n.pec-field select:focus,\r\n.pec-field textarea:focus {\r\n  border-color: var(--pec-blue);\r\n  box-shadow: 0 0 0 3px rgba(26,86,219,.1);\r\n}\r\n.pec-field input::placeholder { color: #aaa; }\r\n.pec-field input[type=\"date\"] { font-family: var(--pec-fs); }\r\n\r\n.pec-required-star {\r\n  color: var(--pec-red);\r\n  font-weight: 700;\r\n}\r\n\r\n/* ── Buttons ── */\r\n.pec-btn {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  font-family: var(--pec-fs);\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  padding: 10px 20px;\r\n  border-radius: 6px;\r\n  cursor: pointer;\r\n  transition: all 0.15s;\r\n  text-decoration: none;\r\n  white-space: nowrap;\r\n}\r\n\r\n.pec-btn-primary {\r\n  background: var(--pec-blue);\r\n  color: #fff;\r\n  border: 1px solid var(--pec-blue);\r\n}\r\n.pec-btn-primary:hover { background: var(--pec-blue-deep); border-color: var(--pec-blue-deep); }\r\n\r\n.pec-btn-outline {\r\n  background: #fff;\r\n  color: var(--pec-blue);\r\n  border: 1px solid #d5d8dc;\r\n}\r\n.pec-btn-outline:hover { background: var(--pec-blue-soft); border-color: var(--pec-blue); }\r\n\r\n.pec-btn-ghost {\r\n  background: transparent;\r\n  color: #555;\r\n  border: 1px solid transparent;\r\n}\r\n.pec-btn-ghost:hover { background: #f0f0f0; border-color: #e5e7eb; }\r\n\r\n.pec-btn-sm { font-size: 12px; padding: 7px 14px; }\r\n\r\n.pec-btn svg { width: 15px; height: 15px; flex: none; }\r\n\r\n/* ── Actions bar ── */\r\n.pec-actions {\r\n  display: flex;\r\n  gap: 10px;\r\n  align-items: center;\r\n  flex-wrap: wrap;\r\n  margin-top: 8px;\r\n  padding: 10px 0 20px;\r\n}\r\n\r\n/* ── Upload areas ── */\r\n\r\n/* Link-styled button (replaces <a> for openUrl compatibility) */\r\n.pec-link-btn {\r\n  background: none;\r\n  border: none;\r\n  color: var(--pec-blue);\r\n  text-decoration: underline;\r\n  cursor: pointer;\r\n  font: inherit;\r\n  font-size: inherit;\r\n  padding: 0;\r\n}\r\n.pec-link-btn:hover { color: var(--pec-blue-deep); }\r\n\r\n/* ── Auto-save note ── */\r\n.pec-autosave-note {\r\n  color: var(--pec-green);\r\n  font-weight: 500;\r\n}\r\n\r\n/* ── Document Templates (config-driven) ── */\r\n.pec-doc-templates {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 16px;\r\n}\r\n\r\n.pec-doc-templates-group {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 6px;\r\n}\r\n\r\n.pec-template-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  padding: 12px 14px;\r\n  background: #fafbfc;\r\n  border: 1px solid #eef0f3;\r\n  border-left: 4px solid #e5e7eb;\r\n  border-radius: 8px;\r\n  transition: background 0.2s, border-color 0.2s;\r\n}\r\n\r\n/* Uploaded — clearly green */\r\n.pec-template-row.uploaded {\r\n  background: #f0fdf4;\r\n  border: 1px solid #bbf7d0;\r\n  border-left: 4px solid var(--pec-green);\r\n}\r\n\r\n/* Pending — clearly amber, action needed */\r\n.pec-template-row.pending {\r\n  background: #fffbeb;\r\n  border: 1px solid #fde68a;\r\n  border-left: 4px solid var(--pec-amber);\r\n}\r\n\r\n.pec-template-icon { flex: none; }\r\n\r\n.pec-template-icon .pec-check-icon {\r\n  width: 28px;\r\n  height: 28px;\r\n  border-radius: 50%;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  flex: none;\r\n  font-size: 15px;\r\n  font-weight: 700;\r\n  line-height: 1;\r\n}\r\n.pec-template-icon .pec-check-icon.done {\r\n  background: var(--pec-green);\r\n  color: #fff;\r\n  box-shadow: 0 2px 6px rgba(13, 148, 136, 0.35);\r\n}\r\n.pec-template-icon .pec-check-icon.todo {\r\n  background: #fff;\r\n  color: var(--pec-amber);\r\n  border: 2px dashed #d97706;\r\n}\r\n\r\n.pec-template-info { flex: 1; min-width: 0; }\r\n.pec-template-name { font-weight: 600; font-size: 13px; }\r\n\r\n.pec-status-pill {\r\n  display: inline-block;\r\n  padding: 1px 8px;\r\n  border-radius: 100px;\r\n  font-size: 9px;\r\n  font-weight: 700;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.05em;\r\n  vertical-align: 1px;\r\n}\r\n.pec-status-pill.ok { background: #d1fae5; color: #065f46; }\r\n.pec-status-pill.wait { background: #fef3c7; color: #92400e; }\r\n\r\n.pec-template-status-ok {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  flex-wrap: wrap;\r\n  font-size: 11px;\r\n  color: #0b5e54;\r\n  margin-top: 4px;\r\n}\r\n.pec-template-status-pending {\r\n  font-size: 11px;\r\n  color: #92400e;\r\n  margin-top: 4px;\r\n}\r\n\r\n.pec-template-actions { display: flex; gap: 6px; flex: none; align-items: center; }\r\n\r\n.pec-template-btn {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  padding: 5px 10px;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  border-radius: 5px;\r\n  border: 1px solid #d5d8dc;\r\n  background: #fff;\r\n  color: #444;\r\n  cursor: pointer;\r\n  text-decoration: none;\r\n  white-space: nowrap;\r\n  font-family: var(--pec-fs);\r\n}\r\n.pec-template-btn svg { width: 12px; height: 12px; flex: none; }\r\n.pec-template-btn:hover { background: #f0f0f0; }\r\n.pec-template-btn.download { color: var(--pec-blue); border-color: #bfdbfe; }\r\n.pec-template-btn.download:hover { background: var(--pec-blue-soft); }\r\n.pec-template-btn.upload { color: var(--pec-green); border-color: #a7f3d0; }\r\n.pec-template-btn.upload:hover { background: var(--pec-green-soft); }\r\n.pec-template-btn.remove { color: var(--pec-red); border-color: #fecaca; }\r\n.pec-template-btn.remove:hover { background: var(--pec-red-soft); }\r\n.pec-template-btn.view { color: #555; }\r\n\r\n/* ── Agreement & Doc lists ── */\r\n.pec-agreement-group {\r\n  margin-bottom: 18px;\r\n  padding: 16px;\r\n  background: #fafbfc;\r\n  border-radius: 8px;\r\n  border: 1px solid #eef0f3;\r\n}\r\n\r\n.pec-agreement-list,\r\n.pec-doc-list {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 8px;\r\n  margin-bottom: 10px;\r\n}\r\n\r\n.pec-empty-msg {\r\n  color: #aaa;\r\n  font-size: 13px;\r\n  font-style: italic;\r\n  padding: 8px 0;\r\n}\r\n\r\n/* ── Document card ── */\r\n.pec-doc-card {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 10px 12px;\r\n  background: #fff;\r\n  border: 1px solid #e5e7eb;\r\n  border-radius: 6px;\r\n  font-size: 13px;\r\n}\r\n\r\n.pec-doc-card .pec-doc-icon {\r\n  width: 32px;\r\n  height: 32px;\r\n  border-radius: 6px;\r\n  background: var(--pec-blue-soft);\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  flex: none;\r\n  color: var(--pec-blue);\r\n}\r\n.pec-doc-card .pec-doc-icon svg { width: 16px; height: 16px; }\r\n\r\n.pec-doc-card .pec-doc-info { flex: 1; min-width: 0; }\r\n.pec-doc-card .pec-doc-name { font-weight: 600; color: #1b1e23; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n.pec-doc-card .pec-doc-meta { font-size: 11px; color: #888; margin-top: 2px; }\r\n\r\n.pec-doc-card .pec-doc-status {\r\n  font-size: 10px;\r\n  font-weight: 600;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.05em;\r\n  padding: 3px 8px;\r\n  border-radius: 100px;\r\n  white-space: nowrap;\r\n}\r\n.pec-doc-status.uploaded { background: #dbeafe; color: #1e40af; }\r\n.pec-doc-status.signed { background: var(--pec-green-soft); color: #0b5e54; }\r\n.pec-doc-status.pending { background: var(--pec-amber-soft); color: #92400e; }\r\n.pec-doc-status.missing { background: var(--pec-red-soft); color: #9e0d24; }\r\n\r\n.pec-doc-card .pec-doc-actions {\r\n  display: flex;\r\n  gap: 4px;\r\n  flex: none;\r\n}\r\n\r\n.pec-doc-card .pec-doc-btn {\r\n  padding: 4px 8px;\r\n  font-size: 11px;\r\n  border-radius: 4px;\r\n  border: 1px solid #e5e7eb;\r\n  background: #fff;\r\n  color: #555;\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n}\r\n.pec-doc-card .pec-doc-btn:hover { background: #f0f0f0; }\r\n.pec-doc-card .pec-doc-btn.danger { color: var(--pec-red); border-color: #fecaca; }\r\n.pec-doc-card .pec-doc-btn.danger:hover { background: var(--pec-red-soft); }\r\n.pec-doc-card .pec-doc-btn.sign { color: var(--pec-green); border-color: #a7f3d0; }\r\n.pec-doc-card .pec-doc-btn.sign:hover { background: var(--pec-green-soft); }\r\n\r\n/* ── Checklist ── */\r\n.pec-checklist {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 8px;\r\n}\r\n\r\n.pec-checklist-item {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 10px 12px;\r\n  background: #fafbfc;\r\n  border: 1px solid #eef0f3;\r\n  border-radius: 6px;\r\n  font-size: 13px;\r\n}\r\n\r\n.pec-checklist-item .pec-check-icon {\r\n  width: 22px;\r\n  height: 22px;\r\n  border-radius: 50%;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  flex: none;\r\n  font-size: 12px;\r\n}\r\n.pec-checklist-item .pec-check-icon.done { background: var(--pec-green-soft); color: var(--pec-green); }\r\n.pec-checklist-item .pec-check-icon.todo { background: #f0f0f0; color: #aaa; }\r\n\r\n.pec-checklist-item .pec-check-label { flex: 1; min-width: 0; }\r\n.pec-checklist-item .pec-check-name { font-weight: 600; }\r\n.pec-checklist-item .pec-check-hint { font-size: 11px; color: #888; margin-top: 2px; }\r\n\r\n.pec-checklist-item .pec-check-upload {\r\n  padding: 4px 10px;\r\n  font-size: 11px;\r\n  border-radius: 4px;\r\n  border: 1px solid #d5d8dc;\r\n  background: #fff;\r\n  color: var(--pec-blue);\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n}\r\n.pec-checklist-item .pec-check-upload:hover { background: var(--pec-blue-soft); border-color: var(--pec-blue); }\r\n\r\n.pec-checklist-item .pec-check-view {\r\n  font-size: 11px;\r\n  color: var(--pec-blue);\r\n  text-decoration: underline;\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n}\r\n\r\n/* ── Confirmation ── */\r\n.pec-confirmation {\r\n  text-align: center;\r\n  padding: 20px 0 30px;\r\n}\r\n\r\n.pec-confirm-box {\r\n  display: inline-flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  gap: 14px;\r\n  background: #fff;\r\n  border: 2px solid var(--pec-green);\r\n  border-radius: var(--pec-radius);\r\n  padding: 32px 40px;\r\n  max-width: 480px;\r\n  margin: 0 auto;\r\n}\r\n\r\n.pec-confirm-box svg { width: 48px; height: 48px; color: var(--pec-green); }\r\n\r\n.pec-confirm-box h3 {\r\n  font-size: 18px;\r\n  color: #1b1e23;\r\n}\r\n\r\n.pec-confirm-box p {\r\n  font-size: 14px;\r\n  color: #666;\r\n}\r\n\r\n/* ── Footer ── */\r\n.pec-foot {\r\n  display: flex;\r\n  gap: 16px;\r\n  flex-wrap: wrap;\r\n  padding: 12px 0 20px;\r\n  border-top: 1px solid #eef0f3;\r\n  margin-top: 8px;\r\n}\r\n\r\n.pec-foot-meta {\r\n  font-size: 11px;\r\n  color: #aaa;\r\n}\r\n\r\n/* ── Read-only mode ── */\r\n.pec[data-readonly=\"true\"] .pec-field input,\r\n.pec[data-readonly=\"true\"] .pec-field select,\r\n.pec[data-readonly=\"true\"] .pec-field textarea {\r\n  background: #f5f6f8;\r\n  pointer-events: none;\r\n  color: #555;\r\n}\r\n\r\n.pec[data-readonly=\"true\"] .pec-btn {\r\n  pointer-events: none;\r\n  opacity: 0.5;\r\n}\r\n\r\n.pec[data-readonly=\"true\"] .pec-doc-btn,\r\n.pec[data-readonly=\"true\"] .pec-check-upload,\r\n.pec[data-readonly=\"true\"] .pec-check-view {\r\n  pointer-events: none;\r\n  opacity: 0.6;\r\n}\r\n\r\n/* ── Print styles ── */\r\n@media print {\r\n  .pec { background: #fff; padding: 0; }\r\n  .pec-section { box-shadow: none; break-inside: avoid; }\r\n  .no-print { display: none !important; }\r\n  .pec-header-msg { background: #fff; border-left-color: #ccc; }\r\n  .pec-actions { display: none; }\r\n  .pec-doc-actions { display: none; }\r\n}\r\n\r\n/* ── Agreement card special ── */\r\n.pec-agreement-card {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 12px;\r\n  background: #fff;\r\n  border: 1px solid #e5e7eb;\r\n  border-radius: 6px;\r\n  font-size: 13px;\r\n}\r\n\r\n.pec-agreement-card .pec-agreement-icon {\r\n  width: 36px; height: 36px;\r\n  border-radius: 8px;\r\n  display: flex; align-items: center; justify-content: center;\r\n  flex: none;\r\n}\r\n.pec-agreement-card .pec-agreement-icon.personal { background: var(--pec-blue-soft); color: var(--pec-blue); }\r\n.pec-agreement-card .pec-agreement-icon.general { background: #f0f0f0; color: #666; }\r\n.pec-agreement-card .pec-agreement-icon svg { width: 18px; height: 18px; }\r\n\r\n.pec-agreement-card .pec-agreement-info { flex: 1; min-width: 0; }\r\n.pec-agreement-card .pec-agreement-name { font-weight: 600; }\r\n.pec-agreement-card .pec-agreement-meta { font-size: 11px; color: #888; margin-top: 2px; }\r\n\r\n.pec-agreement-card .pec-agreement-actions { display: flex; gap: 4px; flex: none; flex-wrap: wrap; }\r\n\r\n/* ── Modal overlay (for viewing documents) ── */\r\n.pec-modal-overlay {\r\n  position: fixed;\r\n  top: 0; left: 0; right: 0; bottom: 0;\r\n  background: rgba(0,0,0,0.5);\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  z-index: 1000;\r\n}\r\n.pec-modal {\r\n  background: #fff;\r\n  border-radius: 10px;\r\n  padding: 20px;\r\n  max-width: 480px;\r\n  width: 90%;\r\n  box-shadow: 0 20px 60px rgba(0,0,0,.2);\r\n}\r\n.pec-modal h4 { font-size: 16px; margin-bottom: 12px; }\r\n.pec-modal p { font-size: 13px; color: #666; margin-bottom: 16px; }\r\n.pec-modal .pec-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }"},"js":{"name":"EmployeeDataCollection.js","src":"../app/EmployeeDataCollection.js","content":"/* ============================================================\r\n   Employee Data Collection — JS\r\n   HR & Finance data + document collection for payroll onboarding.\r\n   Uniconhub CMS html-tool. Entry point: tool.onReady\r\n   ============================================================ */\r\n(function () {\r\n  \"use strict\";\r\n\r\n  /* ---- SDK handle + fallback shim ---- */\r\n  var tool = (ty tegory=\"' + esc(category) + '\">✕<\/button>';\r\n    }\r\n    html += '<\/div>';\r\n    html += '<\/div>';\r\n    return html;\r\n  }\r\n\r\n  function renderPersonalAgreements() {\r\n    var container = $(\"#pec-personalAgreements\");\r\n    if (!container) return;\r\n    var docs = DB.documents.personalAgreements || [];\r\n    if (docs.length === 0) {\r\n      container.innerHTML = '<p class=\"pec-empty-msg\">No person-specific agreements assigned yet.<\/p>';\r\n    } else {\r\n      container.innerHTML = docs.map(function (d) { return renderDocCard(d, \"personalAgreements\"); }).join(\"\");\r\n    }\r\n  }\r\n\r\n  function renderOtherDocs() {\r\n    var container = $(\"#pec-otherDocs\");\r\n    if (!container) return;\r\n    var docs = DB.documents.otherDocs || [];\r\n    if (docs.length === 0) {\r\n      container.innerHTML = '<p class=\"pec-empty-msg\">No additional documents uploaded.<\/p>';\r\n    } else {\r\n      container.innerHTML = docs.map(function (d) { return renderDocCard(d, \"otherDocs\"); }).join(\"\");\r\n    }\r\n  }\r\n\r\n  function renderCustomFields() {\r\n    var section = $(\"#sec-customFields\");\r\n    var grid = $(\"#pec-customFieldsGrid\");\r\n    if (!section || !grid) return;\r\n    var fields = getCustomFields();\r\n    if (fields.length === 0) {\r\n      section.style.display = \"none\";\r\n      return;\r\n    }\r\n    section.style.display = \"\";\r\n\r\n    var html = \"\";\r\n    fields.forEach(function (cf) {\r\n      html += '<div class=\"pec-field\">';\r\n      html += '<label for=\"pec-custom-' + cf.id + '\">' + esc(cf.label) + (cf.required ? ' <span class=\"pec-required-star\">*<\/span>' : '') + '<\/label>';\r\n      if (cf.type === \"toggle\") {\r\n        html += '<label style=\"display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer\">';\r\n        html += '<input type=\"checkbox\" id=\"pec-custom-' + cf.id + '\" style=\"width:auto\">';\r\n        html += '<span style=\"font-size:13px\">' + esc(cf.placehol eturn (person + \" - \" + cleanLabel + ext).substring(0, 180);\r\n  }\r\n\r\n  function doUpload(accept, callback) {\r\n    if (typeof tool.requestUpload !== \"function\") {\r\n      notify(\"File upload is not available. The CMS admin must enable allowUpload in tool params.\", \"warning\");\r\n      if (callback) callback(\"Upload not available\", null);\r\n      return;\r\n    }\r\n    tool.requestUpload(accept, function (err, file) {\r\n      if (err) {\r\n        notify(\"Upload failed: \" + err, \"error\");\r\n        if (callback) callback(err, null);\r\n        return;\r\n      }\r\n      if (callback) callback(null, file);\r\n    });\r\n  }\r\n\r\n  function uploadAndStorePhotoId() {\r\n    doUpload(\".jpg,.jpeg,.png,.pdf\", function (err, file) {\r\n      if (err) return;\r\n      var friendly = friendlyFileName(\"Photo ID\", file.name);\r\n      DB.documents.photoId = {\r\n        id: genDocId(),\r\n        name: friendly,\r\n        originalName: file.name,\r\n        url: file.url,\r\n        size: file.size,\r\n        type: file.type,\r\n        uploadedAt: nowISO()\r\n      };\r\n      readForm();\r\n      persist();\r\n      writeForm();\r\n      notify(\"Photo ID uploaded: \" + friendly, \"success\");\r\n      resize();\r\n    });\r\n  }\r\n\r\n  function uploadTemplateDoc(templateId, accept) {\r\n    doUpload(accept, function (err, file) {\r\n      if (err) return;\r\n      var label = \"Document\";\r\n      getDocumentTemplates().forEach(function (t) {\r\n        if (t.id === templateId) label = t.name;\r\n      });\r\n      var friendly = friendlyFileName(label, file.name);\r\n      if (!DB.documents.templateDocs) DB.documents.templateDocs = {};\r\n      DB.documents.templateDocs[templateId] = {\r\n        id: genDocId(),\r\n        name: friendly,\r\n        originalName: file.name,\r\n        url: file.url,\r\n        size: file.size,\r\n        type: file.type,\r\n        uploadedAt: nowISO()\r\n      };\r\n      persist();\r\n      writeForm( er(\"change\", function () {\r\n        readForm();\r\n        persist();\r\n        updateProgress();\r\n        updateValidity();\r\n        resize();\r\n      });\r\n    });\r\n\r\n    // Upload photo ID\r\n    var photoIdBtn = $(\"#pec-uploadPhotoId\");\r\n    if (photoIdBtn) photoIdBtn.addEventListener(\"click\", function () {\r\n      uploadAndStorePhotoId();\r\n    });\r\n\r\n    // Upload personal agreement\r\n    var persAgrBtn = $(\"#pec-uploadPersonalAgreement\");\r\n    if (persAgrBtn) persAgrBtn.addEventListener(\"click\", function () {\r\n      uploadPersonalAgreementDoc();\r\n    });\r\n\r\n    // Upload other doc\r\n    var otherDocBtn = $(\"#pec-uploadOtherDoc\");\r\n    if (otherDocBtn) otherDocBtn.addEventListener(\"click\", function () {\r\n      uploadOtherDocument();\r\n    });\r\n\r\n    // Delegate events for dynamic elements (remove buttons, sign buttons, upload buttons)\r\n    ROOT.addEventListener(\"click\", function (e) {\r\n      var target = e.target;\r\n\r\n      // Open URL via parent CMS (avoids iframe sandbox popup blocking)\r\n      if (target.hasAttribute && target.getAttribute(\"data-open-url\")) {\r\n        e.preventDefault();\r\n        var urlToOpen = target.getAttribute(\"data-open-url\");\r\n        if (urlToOpen && urlToOpen !== \"#\") openUrl(urlToOpen);\r\n        return;\r\n      }\r\n\r\n      // Remove photo ID\r\n      if (target.hasAttribute && target.getAttribute(\"data-remove\") === \"photoId\") {\r\n        e.preventDefault();\r\n        DB.documents.photoId = null;\r\n        persist();\r\n        writeForm();\r\n        notify(\"Photo ID removed.\", \"info\");\r\n        resize();\r\n        return;\r\n      }\r\n\r\n      // Remove void cheque / TD1 (legacy — keep for old saved data)\r\n      if (target.hasAttribute && (target.getAttribute(\"data-remove\") === \"voidCheque\" || target.getAttribute(\"data-remove\") === \"td1Federal\" || target.getAttribute(\"data-remove\") === \"td1Provincial\")) {\r\n        e         allCats.forEach(function (cat) {\r\n          if (DB.documents[cat]) {\r\n            DB.documents[cat].forEach(function (d) {\r\n              if (d.id === signId) d.signed = true;\r\n            });\r\n          }\r\n        });\r\n        persist();\r\n        writeForm();\r\n        notify(\"Agreement marked as signed.\", \"success\");\r\n        resize();\r\n        return;\r\n      }\r\n    });\r\n  }\r\n\r\n  /* ── Init ── */\r\n\r\n  function init(savedValue, allFields) {\r\n    ROOT = document.querySelector(\".pec\");\r\n    if (!ROOT) return;\r\n\r\n    // Load saved data\r\n    if (savedValue && typeof savedValue === \"object\" && savedValue.personal !== undefined) {\r\n      DB = savedValue;\r\n      // Ensure all nested objects exist\r\n      DB.personal = DB.personal || {};\r\n      DB.contact = DB.contact || {};\r\n      DB.banking = DB.banking || {};\r\n      DB.documents = DB.documents || {};\r\n      DB.documents.photoId = DB.documents.photoId || null;\r\n      DB.documents.templateDocs = DB.documents.templateDocs || {};\r\n      DB.documents.personalAgreements = DB.documents.personalAgreements || [];\r\n      DB.documents.otherDocs = DB.documents.otherDocs || [];\r\n      DB.customFields = DB.customFields || {};\r\n    } else {\r\n      DB = defaultDB();\r\n      // Pre-fill with user info if available\r\n      var user = tool.getUser();\r\n      if (user && user.name) {\r\n        DB.personal.fullName = user.name || \"\";\r\n        DB.contact.email = user.email || \"\";\r\n      }\r\n    }\r\n\r\n    // Read-only check\r\n    readOnly = !!tool.isReadOnly();\r\n\r\n    // Render custom fields from params\r\n    renderCustomFields();\r\n\r\n    // Write form\r\n    writeForm();\r\n    applyReadonly();\r\n    wire();\r\n\r\n    // SDK listeners\r\n    tool.onValueChange(function (v) {\r\n      if (v && typeof v === \"object\" && v.personal !== undefined) {\r\n        DB = v;\r\n        // Re-ensure nested objects\r\n        DB.personal = DB.personal || {};\r\n        DB.contact = DB.contact || {};\r\n        DB.banking = DB.banking || {};\r\n        DB.documents = DB.documents || {};\r\n        DB.documents.photoId = DB.documents.photoId || null;\r\n        DB.documents.templateDocs = DB.documents.templateDocs || {};\r\n        DB.documents.personalAgreements = DB.documents.personalAgreements || [];\r\n        DB.documents.otherDocs = DB.documents.otherDocs || [];\r\n        DB.customFields = DB.customFields || {};\r\n        writeForm();\r\n        applyReadonly();\r\n      }\r\n    });\r\n\r\n    tool.onReadonlyChange(function (ro) {\r\n      readOnly = !!ro;\r\n      applyReadonly();\r\n    });\r\n\r\n    tool.onUserChange(function (u) {\r\n      currentUser = u;\r\n      updateEmployeeIdent();\r\n      if (!DB.personal.fullName && u && u.name) {\r\n        DB.personal.fullName = u.name;\r\n        DB.contact.email = u.email || \"\";\r\n        writeForm();\r\n        persist();\r\n      }\r\n    });\r\n\r\n    // Update validity after initial render\r\n    updateValidity();\r\n\r\n    // Declare schema & params\r\n    try {\r\n      tool.declareOutput({\r\n        type: \"object\",\r\n        properties: {\r\n          personal: { type: \"object\" },\r\n          contact: { type: \"object\" },\r\n          banking: { type: \"object\" },\r\n          documents: { type: \"object\" },\r\n          customFields: { type: \"object\" }\r\n        }\r\n      });\r\n\r\n      tool.declareParams([\r\n        { name: \"documentTemplates\", label: \"Document Templates\", type: \"text\", default: \"[]\", severity: \"mandatory\", hint: \"JSON array of blank forms employees must download, sign, and upload. Each entry: { name, templateUrl, accept, required, category }. Categories group documents visually in the UI. Example: [{ \\\"name\\\": \\\"Direct Deposit Form\\\", \\\"templateUrl\\\": \\\"https://cdn.example.com/dd.pdf\\\", \\\"accept\\\": \\\".pdf\\\", \\\"required\\\": true, \\\"category\\\": \\\"Banking\\\" }, { \\\"name\\\": \\\"TD1 - Federal\\\", \\\"templateUrl\\\": \\\"https://cdn.example.com/td1f.pdf\\\", \\\"accept\\\": \\\".pdf\\\", \\\"required\\\": true, \\\"category\\\": \\\"Tax Forms\\\" }]. Add this in CMS → html-tool field settings → Tool Parameters → key: documentTemplates, value: the JSON array.\" },\r\n        { name: \"sinLabel\", label: \"SIN / SSN Label\", type: \"text\", default: \"SIN / SSN\", severity: \"optional\", hint: \"Override the label for the social insurance / security number field. Defaults to 'SIN / SSN' if not set.\" },\r\n        { name: \"customFields\", label: \"Custom Fields\", type: \"text\", default: \"\", severity: \"optional\", hint: \"Extra form fields to collect. Format per field: Label|type|placeholder|required. Types: text, number, select (options separated by ;), toggle. Fields are comma-separated. Example: Dietary Restrictions|text|e.g. vegetarian, halal|, Needs Parking Pass|toggle|Yes|, Office Location|select|Vancouver;Toronto;Montreal|required\" }\r\n      ]);\r\n    } catch (e) {}\r\n\r\n    // Report missing mandatory params with clear guidance\r\n    try {\r\n      var missing = [];\r\n      var dtRaw = tool.param(\"documentTemplates\", null);\r\n      var dtParsed = parseDocumentTemplates(dtRaw);\r\n      if (!dtParsed) {\r\n        missing.push({\r\n          name: \"documentTemplates\",\r\n          label: \"Document Templates\",\r\n          type: \"text\",\r\n          default: \"[]\",\r\n          severity: \"mandatory\",\r\n          hint: \"JSON array of { name, templateUrl, accept, required, category }. Add in html-tool field settings → Tool Parameters.\",\r\n          reason: \"Document templates define which blank forms employees can download and upload. Configure as a JSON array with your organization's form URLs.\"\r\n        });\r\n      }\r\n      if (missing.length > 0) {\r\n        tool.reportMissingParams(missing,\r\n          \"This tool needs the Document Templates parameter configured with your organization's form URLs.\");\r\n      }\r\n    } catch (e) {}\r\n  }\r\n\r\n  /* ── Boot ── */\r\n  tool.onReady(function (savedValue, allFields) {\r\n    init(savedValue, allFields);\r\n  });\r\n\r\n})();"}}</script>

<!-- SCREENSHOTS-PAYLOAD-START - refresh-docs-index.js replaces the payload between these markers -->
<script type="application/json" id="shots-payload">[]</script>
<!-- SCREENSHOTS-PAYLOAD-END -->

<script>
(function () {
  'use strict';
  var frame = document.getElementById('docs-frame');
  var openButton = document.getElementById('docs-open');
  var codeView = document.getElementById('docs-code-view');
  var codeTitle = document.getElementById('docs-code-title');
  var codeMeta = document.getElementById('docs-code-meta');
  var codeElement = document.getElementById('docs-code-code');
  var codeCopyButton = document.getElementById('docs-code-copy');
  var codeOpenButton = document.getElementById('docs-code-open');
  var navItems = Array.prototype.slice.call(document.querySelectorAll('.docs-nav-item'));
  var currentSource = 'ssot.html';
  var currentCodeKind = '';

  var codePayload = { html: null, css: null, js: null };
  try {
    codePayload = JSON.parse(document.getElementById('code-payload').textContent) || codePayload;
  } catch (error) { /* payload unavailable */ }

  /* ---- screenshots viewer ---- */
  var shotsView = document.getElementById('docs-shots-view');
  var shotsViewer = document.getElementById('docs-shots-viewer');
  var shotsImg = document.getElementById('docs-shots-img');
  var shotsEmpty = document.getElementById('docs-shots-empty');
  var shotsInfo = document.getElementById('docs-shots-info');
  var shotsThumbs = document.getElementById('docs-shots-thumbs');
  var shotsPrev = document.getElementById('docs-shots-prev');
  var shotsNext = document.getElementById('docs-shots-next');
  var shotsPayload = [];
  try {
    shotsPayload = JSON.parse(document.getElementById('shots-payload').textContent) || [];
  } catch (error) { /* payload unavailable */ }
  var currentShotIndex = 0;

  function renderShotsInfo(shot) {
    if (!shotsInfo) return;
    if (!shot) { shotsInfo.innerHTML = ''; return; }
    var fields = [
      ['File', shot.name || ''],
      ['Shot', shot.label || ''],
      ['Page', shot.page || ''],
      ['Viewport', shot.viewport || ''],
      ['Dimensions', shot.width && shot.height ? shot.width + ' \u00d7 ' + shot.height + ' px' : ''],
      ['Captured', shot.capturedAt ? shot.capturedAt.replace('T', ' ').slice(0, 19) + ' UTC' : ''],
      ['Used in', Array.isArray(shot.usedIn) && shot.usedIn.length ? shot.usedIn.join(', ') : 'docs index viewer'],
    ];
    shotsInfo.innerHTML = '<p class="docs-shots-counter">Screenshot ' + (currentShotIndex + 1) + ' of ' + shotsPayload.length + '</p>' +
      '<dl>' + fields.filter(function (field) { return field[1]; })
        .map(function (field) { return '<div><dt>' + field[0] + '</dt><dd>' + field[1] + '</dd></div>'; })
        .join('') + '</dl>';
  }

  function showShot(index) {
    if (!shotsPayload.length) {
      if (shotsImg) shotsImg.style.display = 'none';
      if (shotsEmpty) shotsEmpty.style.display = '';
      if (shotsPrev) shotsPrev.style.display = 'none';
      if (shotsNext) shotsNext.style.display = 'none';
      if (shotsThumbs) shotsThumbs.style.display = 'none';
      renderShotsInfo(null);
      return;
    }
    currentShotIndex = ((index % shotsPayload.length) + shotsPayload.length) % shotsPayload.length;
    var shot = shotsPayload[currentShotIndex];
    if (shotsImg) {
      shotsImg.style.display = '';
      shotsImg.src = shot.src;
    }
    if (shotsEmpty) shotsEmpty.style.display = 'none';
    if (shotsPrev) shotsPrev.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsNext) shotsNext.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsThumbs) {
      shotsThumbs.innerHTML = shotsPayload.map(function (entry, i) {
        return '<button class="docs-shots-thumb' + (i === currentShotIndex ? ' active' : '') + '" type="button" data-shot-index="' + i + '">' +
          '<img src="' + entry.src + '" alt="' + (entry.label || entry.name) + '" loading="lazy" />' +
          '<span>' + (entry.label || entry.name) + '</span></button>';
      }).join('');
    }
    renderShotsInfo(shot);
  }

  function openShotsPane() {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.add('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    showShot(currentShotIndex);
  }

  if (shotsThumbs) {
    shotsThumbs.addEventListener('click', function (event) {
      var thumb = event.target.closest ? event.target.closest('.docs-shots-thumb') : null;
      if (!thumb) return;
      showShot(Number(thumb.getAttribute('data-shot-index')) || 0);
    });
  }
  if (shotsPrev) shotsPrev.addEventListener('click', function () { showShot(currentShotIndex - 1); });
  if (shotsNext) shotsNext.addEventListener('click', function () { showShot(currentShotIndex + 1); });
  document.addEventListener('keydown', function (event) {
    if (!shotsView.classList.contains('visible')) return;
    if (event.key === 'ArrowLeft') showShot(currentShotIndex - 1);
    if (event.key === 'ArrowRight') showShot(currentShotIndex + 1);
    if (event.key === 'Escape') { shotsView.classList.remove('visible'); frame.style.display = ''; if (openButton) openButton.style.display = ''; }
  });

  function activateItem(activeItem) {
    navItems.forEach(function (item) { item.classList.toggle('active', item === activeItem); });
  }

  function showCodePane(kind) {
    var entry = codePayload[kind];
    currentCodeKind = kind;
    codeView.classList.add('visible');
    shotsView.classList.remove('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    if (!entry) {
      codeTitle.textContent = kind.toUpperCase() + ' code';
      codeMeta.textContent = 'no ' + kind + ' file in the app folder';
      codeElement.textContent = '';
      return;
    }
    codeTitle.textContent = entry.name;
    var lineCount = entry.content ? entry.content.split('\n').length : 0;
    codeMeta.textContent = lineCount + ' lines - ' + (entry.content ? entry.content.length : 0) + ' characters';
    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {
      showCodePane(item.getAttribute('data-doc').slice(5));
    } else {
      showDocumentPane(item);
    }
    try { window.location.hash = 'doc=' + item.getAttribute('data-doc'); } catch (error) { /* ignore */ }
  }

  navItems.forEach(function (item) {
    item.addEventListener('click', function () { openItem(item); });
  });

  if (openButton) {
    openButton.addEventListener('click', function () {
      var fullUrl = new URL(currentSource, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  if (codeCopyButton) {
    codeCopyButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      var text = entry && entry.content ? entry.content : '';
      if (!text) return;
      function markCopied() {
        codeCopyButton.textContent = 'Copied ✓';
        codeCopyButton.classList.add('copied');
        setTimeout(function () {
          codeCopyButton.textContent = 'Copy code';
          codeCopyButton.classList.remove('copied');
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function () { fallbackCopy(text, markCopied); });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
</body>
