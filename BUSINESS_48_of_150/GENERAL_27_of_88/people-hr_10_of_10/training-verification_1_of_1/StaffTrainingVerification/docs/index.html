<script type="application/json" id="code-payload">{"html":{"name":"StaffTrainingVerification.html","src":"../app/StaffTrainingVerification.html","content":"<div class=\"stv\" id=\"stvRoot\" data-theme=\"light\">\r\n\r\n  <!-- Header -->\r\n  <div class=\"stv-header\">\r\n    <div class=\"stv-header-titles\">\r\n      <h1 class=\"stv-title\">Staff Training Verification<\/h1>\r\n      <p class=\"stv-sub\">CSJ Workplace Safety &amp; Compliance Training<\/p>\r\n    <\/div>\r\n    <div class=\"stv-progress-wrap\">\r\n      <div class=\"stv-progress-bar\">\r\n        <div class=\"stv-progress-fill\" id=\"progFill\"><\/div>\r\n      <\/div>\r\n      <span class=\"stv-progress-label\" id=\"progLabel\">0 of 11 modules complete<\/span>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Staff info -->\r\n  <div class=\"stv-staff\">\r\n    <label class=\"stv-field\">\r\n      <span class=\"stv-lab\">Staff Name <span class=\"stv-req\">*<\/span><\/span>\r\n      <input type=\"text\" id=\"staffName\" class=\"stv-inp\" placeholder=\"Your full name\" autocomplete=\"off\">\r\n    <\/label>\r\n    <label class=\"stv-field\">\r\n      <span class=\"stv-lab\">Date<\/span>\r\n      <input type=\"date\" id=\"trainDate\" class=\"stv-inp\">\r\n    <\/label>\r\n  <\/div>\r\n\r\n  <!-- Resources banner -->\r\n  <div class=\"stv-resources\" id=\"resBanner\">\r\n    <button type=\"button\" class=\"stv-res-toggle\" id=\"resToggle\" aria-expanded=\"false\">\r\n      <span class=\"stv-res-icon\">📚<\/span> WorkSafeBC Resources\r\n      <span class=\"stv-res-chev\">▾<\/span>\r\n    <\/button>\r\n    <div class=\"stv-res-list\" id=\"resList\" hidden>\r\n      <a href=\"https://www.worksafebc.com/youngworkers\" target=\"_blank\" rel=\"noopener\" class=\"stv-res-link\">Young Worker Safety<\/a>\r\n      <a href=\"https://www.worksafebc.com/ohs-education\" target=\"_blank\" rel=\"noopener\" class=\"stv-res-link\">OHS Orientation Checklist<\/a>\r\n      <a href=\"https://www.worksafebc.com/bullying-harassment\" target=\"_blank\" rel=\"noopener\" class=\"stv-res-link\">Harassment Prevention Toolkit<\/a>\r\n      <a href=\"https://www.worksafebc.com/emergency-planning\" target=\"_blank\" rel=\"noopener\" class=\"stv-res-link\">Emergency Planning<\/a>\r\n      <a href=\"https://www.worksafebc.com/whmis\" target=\"_blank\" rel=\"noopener\" class=\"stv-res-link\">WHMIS 2015<\/a>\r\n      <a href=\"https://www.worksafebc.com/rights-responsibilities\" target=\"_blank\" rel=\"noopener\" class=\"stv-res-link\">Worker Rights &amp; Responsibilities<\/a>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- Modules -->\r\n  <div class=\"stv-modules\" id=\"modulesWrap\">\r\n\r\n    <!-- Section: Legally Required -->\r\n    <div class=\"stv-section-head\">\r\n      <span class=\"stv-section-icon\">⚖<\/span>\r\n      <span class=\"stv-section-label\">Legally Required &mdash; Self-Study + Quiz<\/span>\r\n    <\/div>\r\n\r\n    <!-- MODULE 1: OHS -->\r\n    <section class=\"stv-mod\" id=\"mod-ohs\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"ohs\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">1<\/span>\r\n        <span class=\"stv-mod-title\">Workplace Health &amp; Safety (OHS) Orientation<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-ohs\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-ohs\" hidden>\r\n        <div class=\"stv-content\">\r\n          <h3>Your Safety at Work<\/h3>\r\n          <p>Your health and safety matter. BC law gives you rights and your employer responsibilities. Here is what you need to know.<\/p>\r\n\r\n          <h4>Your Three Worker Rights<\/h4>\r\n          <ol>\r\n            <li><strong>Right to Know<\/strong> — You have the right to know about hazards in your workplace and how to protect yourself.<\/li>\r\n            <li><strong>Right to Participate<\/strong> — You can take part in keeping your workplace safe, like joining the safety committee or reporting concerns.<\/li>\r\n            <li><strong>Right to Refuse Unsafe Work<\/strong> — If you believe a task is dangerous to you or others, you can say no. Tell your supervisor right away. You cannot be punished for refusing unsafe work.<\/li>\r\n          <\/ol>\r\n\r\n          <h4>Reporting Hazards and Injuries<\/h4>\r\n          <p>If you see something unsafe, tell your supervisor immediately. If you get hurt at work, no matter how small it seems:<\/p>\r\n          <ul>\r\n            <li>Tell your supervisor right away<\/li>\r\n            <li>Get first aid if you need it<\/li>\r\n            <li>Fill out an incident report form<\/li>\r\n          <\/ul>\r\n          <p>Reporting is not about getting anyone in trouble — it is about preventing the next injury.<\/p>\r\n\r\n          <h4>Personal Protective Equipment (PPE)<\/h4>\r\n          <p>Your supervisor will tell you what PPE you need for your role. Common PPE includes safety glasses, steel-toed boots, gloves, high-visibility vests, and hard hats. You must wear the PPE required for your tasks — no exceptions.<\/p>\r\n\r\n          <h4>What You Need to Know<\/h4>\r\n          <ul>\r\n            <li>Where the first aid kit is kept<\/li>\r\n            <li>Where fire extinguishers are located<\/li>\r\n            <li>Where emergency exits are (know at least two)<\/li>\r\n            <li>Where the eyewash station is (if applicable)<\/li>\r\n            <li>Where the assembly point is (the meeting spot outside after evacuation)<\/li>\r\n          <\/ul>\r\n          <p><strong>No alcohol or drugs<\/strong> are allowed on the premises. <strong>No phone use<\/strong> while operating equipment or machinery.<\/p>\r\n        <\/div>\r\n\r\n        <div class=\"stv-questions\">\r\n          <h4>Comprehension Check<\/h4>\r\n          <label class=\"stv-q\">1. If you see something unsafe, what do you do first?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"ohs\" data-q=\"0\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">2. Where is the assembly point at your workplace?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"ohs\" data-q=\"1\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">3. Name one thing you must always wear or use for safety in your role.\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"ohs\" data-q=\"2\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n        <\/div>\r\n\r\n        <div class=\"stv-confirm\">\r\n          <label class=\"stv-check\">\r\n            <input type=\"checkbox\" data-mod=\"ohs\" class=\"stv-cb\">\r\n            <span>I have read and understood this training module.<\/span>\r\n          <\/label>\r\n          <label class=\"stv-field stv-init-field\">\r\n            <span class=\"stv-lab\">Your initials<\/span>\r\n            <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"ohs\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n          <\/label>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 2: Harassment -->\r\n    <section class=\"stv-mod\" id=\"mod-harassment\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"harassment\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">2<\/span>\r\n        <span class=\"stv-mod-title\">Workplace Violence &amp; Harassment Prevention<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-harassment\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-harassment\" hidden>\r\n        <div class=\"stv-content\">\r\n          <h3>Respect at Work<\/h3>\r\n          <p>Everyone has the right to a workplace free from harassment and discrimination. BC law protects you.<\/p>\r\n\r\n          <h4>What is Harassment?<\/h4>\r\n          <p>Harassment is any unwanted behaviour that hurts, humiliates, or intimidates someone. It includes:<\/p>\r\n          <ul>\r\n            <li>Verbal abuse, yelling, or insults<\/li>\r\n            <li>Offensive jokes — including \"just joking\" about someone's background, appearance, or identity<\/li>\r\n            <li>Unwanted physical contact — touching, pushing, blocking someone's way<\/li>\r\n            <li>Sexual comments, gestures, or advances<\/li>\r\n            <li>Cyberbullying — nasty messages, posts, or sharing photos without consent<\/li>\r\n            <li>Deliberately excluding or isolating a coworker<\/li>\r\n          <\/ul>\r\n\r\n          <h4>What is Discrimination?<\/h4>\r\n          <p>Treating someone unfairly because of who they are. Protected grounds include: race, gender, age, religion, disability, sexual orientation, Indigenous identity, and more.<\/p>\r\n\r\n          <h4>How to Report<\/h4>\r\n          <p>If you experience or witness harassment:<\/p>\r\n          <ol>\r\n            <li><strong>Tell your supervisor.<\/strong> They must take your report seriously.<\/li>\r\n            <li><strong>If your supervisor is the problem<\/strong>, go to HR or the next level of management.<\/li>\r\n            <li>You are <strong>protected from retaliation<\/strong>. It is illegal to punish you for reporting in good faith.<\/li>\r\n          <\/ol>\r\n\r\n          <h4>Bystander Responsibility<\/h4>\r\n          <p>If you see harassment happening, you have a responsibility to speak up. You can:<\/p>\r\n          <ul>\r\n            <li>Tell the person their behaviour is not okay (if safe to do so)<\/li>\r\n            <li>Support the person being targeted — ask if they are okay<\/li>\r\n            <li>Report what you saw to a supervisor or HR<\/li>\r\n          <\/ul>\r\n          <p>Silence makes it worse. Speaking up makes the workplace safer for everyone.<\/p>\r\n\r\n          <h4>Investigation Timeline<\/h4>\r\n          <p>Reports are investigated within 5 business days. All investigations are confidential. Your privacy is protected.<\/p>\r\n        <\/div>\r\n\r\n        <div class=\"stv-questions\">\r\n          <h4>Comprehension Check<\/h4>\r\n          <label class=\"stv-q\">1. If a coworker makes an offensive joke and you hear it, what should you do?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"harassment\" data-q=\"0\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">2. Who can you report harassment to if your supervisor is the problem?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"harassment\" data-q=\"1\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">3. Will you face consequences for reporting harassment in good faith? (Yes/No)\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"harassment\" data-q=\"2\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n        <\/div>\r\n\r\n        <div class=\"stv-confirm\">\r\n          <label class=\"stv-check\">\r\n            <input type=\"checkbox\" data-mod=\"harassment\" class=\"stv-cb\">\r\n            <span>I have read and understood this training module.<\/span>\r\n          <\/label>\r\n          <label class=\"stv-field stv-init-field\">\r\n            <span class=\"stv-lab\">Your initials<\/span>\r\n            <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"harassment\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n          <\/label>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 3: Emergency -->\r\n    <section class=\"stv-mod\" id=\"mod-emergency\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"emergency\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">3<\/span>\r\n        <span class=\"stv-mod-title\">Emergency Procedures &amp; Evacuation<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-emergency\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-emergency\" hidden>\r\n        <div class=\"stv-content\">\r\n          <h3>Know What to Do in an Emergency<\/h3>\r\n          <p>Emergencies are rare, but being prepared saves lives. Know these procedures.<\/p>\r\n\r\n          <h4>Fire<\/h4>\r\n          <ol>\r\n            <li>Activate the fire alarm pull station if you discover a fire<\/li>\r\n            <li>Call 911<\/li>\r\n            <li>Evacuate using the nearest safe exit<\/li>\r\n            <li><strong>Do NOT use elevators<\/strong> — always use stairs<\/li>\r\n            <li>Go to the assembly point<\/li>\r\n            <li>Do not re-enter the building until emergency officials say it is safe<\/li>\r\n          <\/ol>\r\n\r\n          <h4>Medical Emergency<\/h4>\r\n          <ol>\r\n            <li>Call 911 immediately<\/li>\r\n            <li>Send someone to meet the paramedics at the entrance<\/li>\r\n            <li>Get the first aid kit<\/li>\r\n            <li>Only give first aid if you are trained to do so<\/li>\r\n            <li>Notify your supervisor as soon as possible<\/li>\r\n          <\/ol>\r\n\r\n          <h4>Lockdown / Security Threat<\/h4>\r\n          <p>Use the <strong>Run — Hide — Fight<\/strong> framework:<\/p>\r\n          <ul>\r\n            <li><strong>Run:<\/strong> If there is a safe path, run. Leave belongings behind. Help others if you can.<\/li>\r\n            <li><strong>Hide:<\/strong> If you cannot run, hide. Lock or barricade the door. Turn off lights. Silence your phone.<\/li>\r\n            <li><strong>Fight:<\/strong> As a last resort, if your life is in danger, fight back with anything available.<\/li>\r\n          <\/ul>\r\n          <p><strong>Do not<\/strong> open doors during a lockdown unless you are certain it is safe. <strong>Do not<\/strong> post about the situation on social media — this can put people at risk.<\/p>\r\n\r\n          <h4>Know Your Locations<\/h4>\r\n          <p>Make sure you know where these are at your workplace:<\/p>\r\n          <ul>\r\n            <li>Fire alarm pull stations<\/li>\r\n            <li>Fire extinguishers<\/li>\r\n            <li>First aid kit<\/li>\r\n            <li>Primary and secondary exits<\/li>\r\n            <li>Assembly point (meeting spot outside)<\/li>\r\n            <li>Eyewash station (if applicable)<\/li>\r\n          <\/ul>\r\n        <\/div>\r\n\r\n        <div class=\"stv-questions\">\r\n          <h4>Comprehension Check<\/h4>\r\n          <label class=\"stv-q\">1. During a fire evacuation, can you use the elevator? (Yes/No)\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"emergency\" data-q=\"0\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">2. Where do you go after evacuating the building?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"emergency\" data-q=\"1\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">3. If there is a security threat and you cannot run, what do you do?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"emergency\" data-q=\"2\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n        <\/div>\r\n\r\n        <div class=\"stv-confirm\">\r\n          <label class=\"stv-check\">\r\n            <input type=\"checkbox\" data-mod=\"emergency\" class=\"stv-cb\">\r\n            <span>I have read and understood this training module.<\/span>\r\n          <\/label>\r\n          <label class=\"stv-field stv-init-field\">\r\n            <span class=\"stv-lab\">Your initials<\/span>\r\n            <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"emergency\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n          <\/label>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 4: WHMIS -->\r\n    <section class=\"stv-mod\" id=\"mod-whmis\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"whmis\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">4<\/span>\r\n        <span class=\"stv-mod-title\">WHMIS 2015 — Hazardous Materials<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-whmis\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-whmis\" hidden>\r\n        <div class=\"stv-content\">\r\n          <h3>Understanding Hazardous Materials<\/h3>\r\n          <p><strong>WHMIS<\/strong> stands for <strong>Workplace Hazardous Materials Information System<\/strong>. It is a Canada-wide system for labelling and providing information about hazardous products used at work.<\/p>\r\n\r\n          <h4>How to Read Labels<\/h4>\r\n          <p><strong>Supplier labels<\/strong> appear on products from manufacturers. They include:<\/p>\r\n          <ul>\r\n            <li>Product name<\/li>\r\n            <li>Hazard symbols (pictograms)<\/li>\r\n            <li>Signal words (Danger or Warning)<\/li>\r\n            <li>Hazard statements<\/li>\r\n            <li>Precautionary statements<\/li>\r\n            <li>Supplier information<\/li>\r\n          <\/ul>\r\n          <p><strong>Workplace labels<\/strong> are used when a product is transferred to a new container. They must have the product name, safe handling information, and a reference to the SDS.<\/p>\r\n\r\n          <h4>Safety Data Sheets (SDS)<\/h4>\r\n          <p>An SDS is a detailed document for each hazardous product. It tells you everything you need to know: what the product is, what hazards it has, how to handle it safely, and what to do in an emergency. Your workplace must keep SDSs where you can easily find them. Ask your supervisor where they are located.<\/p>\r\n\r\n          <h4>Common Hazard Symbols<\/h4>\r\n          <div class=\"stv-symbols\">\r\n            <div class=\"stv-sym\"><span class=\"stv-sym-icon\">🔥<\/span> <strong>Flame<\/strong> — Flammable. Keep away from heat and sparks.<\/div>\r\n            <div class=\"stv-sym\"><span class=\"stv-sym-icon\">💀<\/span> <strong>Skull &amp; Crossbones<\/strong> — Toxic. Can cause serious illness or death if swallowed, inhaled, or absorbed through skin.<\/div>\r\n            <div class=\"stv-sym\"><span class=\"stv-sym-icon\">🧪<\/span> <strong>Corrosion<\/strong> — Corrosive. Can burn skin and eyes, or damage metal.<\/div>\r\n            <div class=\"stv-sym\"><span class=\"stv-sym-icon\">⚠️<\/span> <strong>Exclamation Mark<\/strong> — Irritant. May cause skin, eye, or respiratory irritation.<\/div>\r\n            <div class=\"stv-sym\"><span class=\"stv-sym-icon\">💥<\/span> <strong>Exploding Bomb<\/strong> — Explosive. Can explode if exposed to heat, shock, or friction.<\/div>\r\n          <\/div>\r\n\r\n          <h4>If You Are Exposed<\/h4>\r\n          <ol>\r\n            <li><strong>Rinse<\/strong> the affected area with water immediately (15+ minutes for eyes or skin)<\/li>\r\n            <li><strong>Report<\/strong> the incident to your supervisor right away<\/li>\r\n            <li><strong>Seek medical help<\/strong> if needed — bring the SDS or product label with you<\/li>\r\n          <\/ol>\r\n        <\/div>\r\n\r\n        <div class=\"stv-questions\">\r\n          <h4>Comprehension Check<\/h4>\r\n          <label class=\"stv-q\">1. What does the skull and crossbones symbol (💀) mean?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"whmis\" data-q=\"0\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">2. Where do you find Safety Data Sheets in your workplace?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"whmis\" data-q=\"1\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n          <label class=\"stv-q\">3. If a chemical splashes on your skin, what do you do first?\r\n            <input type=\"text\" class=\"stv-inp\" data-mod=\"whmis\" data-q=\"2\" placeholder=\"Your answer...\">\r\n          <\/label>\r\n        <\/div>\r\n\r\n        <div class=\"stv-confirm\">\r\n          <label class=\"stv-check\">\r\n            <input type=\"checkbox\" data-mod=\"whmis\" class=\"stv-cb\">\r\n            <span>I have read and understood this training module.<\/span>\r\n          <\/label>\r\n          <label class=\"stv-field stv-init-field\">\r\n            <span class=\"stv-lab\">Your initials<\/span>\r\n            <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"whmis\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n          <\/label>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- Section: Organizational -->\r\n    <div class=\"stv-section-head stv-section-head-sup\">\r\n      <span class=\"stv-section-icon\">🏢<\/span>\r\n      <span class=\"stv-section-label\">Organizational &mdash; Supervisor-Led<\/span>\r\n    <\/div>\r\n\r\n    <!-- MODULE 5: Orientation -->\r\n    <section class=\"stv-mod stv-mod-sup\" id=\"mod-orientation\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"orientation\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">5<\/span>\r\n        <span class=\"stv-mod-title\">Workplace Orientation &amp; Onboarding<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-orientation\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-orientation\" hidden>\r\n        <div class=\"stv-content\">\r\n          <p>Covers the organization's mission, structure, facilities tour, key contacts, work hours, breaks, dress code, parking/transit, and how to access the staff handbook.<\/p>\r\n        <\/div>\r\n        <div class=\"stv-sup-form\">\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Date Completed<\/span>\r\n              <input type=\"date\" class=\"stv-inp\" data-mod=\"orientation\" data-sup=\"date\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Delivered By (Supervisor/Trainer)<\/span>\r\n              <input type=\"text\" class=\"stv-inp\" data-mod=\"orientation\" data-sup=\"deliveredBy\" placeholder=\"Full name\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Staff Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"orientation\" data-sup=\"staffInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Supervisor Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"orientation\" data-sup=\"supervisorInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-confirm\">\r\n            <label class=\"stv-check\">\r\n              <input type=\"checkbox\" data-mod=\"orientation\" class=\"stv-cb\">\r\n              <span>This training has been delivered and acknowledged.<\/span>\r\n            <\/label>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 6: Paperwork -->\r\n    <section class=\"stv-mod stv-mod-sup\" id=\"mod-paperwork\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"paperwork\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">6<\/span>\r\n        <span class=\"stv-mod-title\">Handbook, Paperwork &amp; Documentation<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-paperwork\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-paperwork\" hidden>\r\n        <div class=\"stv-content\">\r\n          <p>Covers employment contract, tax forms, emergency contact form, confidentiality agreement, code of conduct acknowledgement, and how to access and use the staff handbook as a reference.<\/p>\r\n        <\/div>\r\n        <div class=\"stv-sup-form\">\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Date Completed<\/span>\r\n              <input type=\"date\" class=\"stv-inp\" data-mod=\"paperwork\" data-sup=\"date\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Delivered By (Supervisor/Trainer)<\/span>\r\n              <input type=\"text\" class=\"stv-inp\" data-mod=\"paperwork\" data-sup=\"deliveredBy\" placeholder=\"Full name\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Staff Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"paperwork\" data-sup=\"staffInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Supervisor Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"paperwork\" data-sup=\"supervisorInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-confirm\">\r\n            <label class=\"stv-check\">\r\n              <input type=\"checkbox\" data-mod=\"paperwork\" class=\"stv-cb\">\r\n              <span>This training has been delivered and acknowledged.<\/span>\r\n            <\/label>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 7: Industrial Skills -->\r\n    <section class=\"stv-mod stv-mod-sup\" id=\"mod-industrial\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"industrial\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">7<\/span>\r\n        <span class=\"stv-mod-title\">Industrial Skills &amp; Job-Specific Training<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-industrial\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-industrial\" hidden>\r\n        <div class=\"stv-content\">\r\n          <p>Covers equipment operation, tool safety, job-specific procedures, lifting techniques, workshop/kitchen/field protocols, and any certifications required for the role.<\/p>\r\n        <\/div>\r\n        <div class=\"stv-sup-form\">\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Date Completed<\/span>\r\n              <input type=\"date\" class=\"stv-inp\" data-mod=\"industrial\" data-sup=\"date\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Delivered By (Supervisor/Trainer)<\/span>\r\n              <input type=\"text\" class=\"stv-inp\" data-mod=\"industrial\" data-sup=\"deliveredBy\" placeholder=\"Full name\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Staff Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"industrial\" data-sup=\"staffInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Supervisor Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"industrial\" data-sup=\"supervisorInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-confirm\">\r\n            <label class=\"stv-check\">\r\n              <input type=\"checkbox\" data-mod=\"industrial\" class=\"stv-cb\">\r\n              <span>This training has been delivered and acknowledged.<\/span>\r\n            <\/label>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 8: Ethics -->\r\n    <section class=\"stv-mod stv-mod-sup\" id=\"mod-ethics\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"ethics\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">8<\/span>\r\n        <span class=\"stv-mod-title\">Ethics, Integrity &amp; Professional Conduct<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-ethics\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-ethics\" hidden>\r\n        <div class=\"stv-content\">\r\n          <p>Covers honesty in reporting hours and activities, proper use of organizational resources, conflicts of interest, accepting gifts, maintaining professional boundaries, and representing the organization positively in the community.<\/p>\r\n        <\/div>\r\n        <div class=\"stv-sup-form\">\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Date Completed<\/span>\r\n              <input type=\"date\" class=\"stv-inp\" data-mod=\"ethics\" data-sup=\"date\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Delivered By (Supervisor/Trainer)<\/span>\r\n              <input type=\"text\" class=\"stv-inp\" data-mod=\"ethics\" data-sup=\"deliveredBy\" placeholder=\"Full name\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Staff Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"ethics\" data-sup=\"staffInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Supervisor Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"ethics\" data-sup=\"supervisorInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-confirm\">\r\n            <label class=\"stv-check\">\r\n              <input type=\"checkbox\" data-mod=\"ethics\" class=\"stv-cb\">\r\n              <span>This training has been delivered and acknowledged.<\/span>\r\n            <\/label>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 9: EDI -->\r\n    <section class=\"stv-mod stv-mod-sup\" id=\"mod-edi\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"edi\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">9<\/span>\r\n        <span class=\"stv-mod-title\">Equity, Diversity &amp; Inclusion (EDI)<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-edi\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-edi\" hidden>\r\n        <div class=\"stv-content\">\r\n          <p>Covers the organization's commitment to an inclusive workplace, understanding unconscious bias, respectful language and behaviour, cultural awareness, accessibility and accommodations, and how to raise EDI concerns.<\/p>\r\n        <\/div>\r\n        <div class=\"stv-sup-form\">\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Date Completed<\/span>\r\n              <input type=\"date\" class=\"stv-inp\" data-mod=\"edi\" data-sup=\"date\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Delivered By (Supervisor/Trainer)<\/span>\r\n              <input type=\"text\" class=\"stv-inp\" data-mod=\"edi\" data-sup=\"deliveredBy\" placeholder=\"Full name\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Staff Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"edi\" data-sup=\"staffInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Supervisor Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"edi\" data-sup=\"supervisorInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-confirm\">\r\n            <label class=\"stv-check\">\r\n              <input type=\"checkbox\" data-mod=\"edi\" class=\"stv-cb\">\r\n              <span>This training has been delivered and acknowledged.<\/span>\r\n            <\/label>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- MODULE 10: Confidentiality -->\r\n    <section class=\"stv-mod stv-mod-sup\" id=\"mod-confidentiality\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"confidentiality\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">10<\/span>\r\n        <span class=\"stv-mod-title\">Confidentiality &amp; Data Privacy<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-confidentiality\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-confidentiality\" hidden>\r\n        <div class=\"stv-content\">\r\n          <p>Covers what information is -sup\" id=\"mod-clientservice\">\r\n      <button type=\"button\" class=\"stv-mod-head\" data-mod=\"clientservice\" aria-expanded=\"false\">\r\n        <span class=\"stv-mod-num\">11<\/span>\r\n        <span class=\"stv-mod-title\">Client &amp; Community Service Standards<\/span>\r\n        <span class=\"stv-mod-badge\" id=\"badge-clientservice\"><\/span>\r\n        <span class=\"stv-mod-chev\">▾<\/span>\r\n      <\/button>\r\n      <div class=\"stv-mod-body\" id=\"body-clientservice\" hidden>\r\n        <div class=\"stv-content\">\r\n          <p>Covers how to greet and interact with clients and community members, active listening, handling complaints, respecting client dignity and privacy, cultural sensitivity, and representing the organization in public.<\/p>\r\n        <\/div>\r\n        <div class=\"stv-sup-form\">\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Date Completed<\/span>\r\n              <input type=\"date\" class=\"stv-inp\" data-mod=\"clientservice\" data-sup=\"date\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Delivered By (Supervisor/Trainer)<\/span>\r\n              <input type=\"text\" class=\"stv-inp\" data-mod=\"clientservice\" data-sup=\"deliveredBy\" placeholder=\"Full name\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-sup-row\">\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Staff Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"clientservice\" data-sup=\"staffInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n            <label class=\"stv-field\">\r\n              <span class=\"stv-lab\">Supervisor Initials<\/span>\r\n              <input type=\"text\" class=\"stv-inp stv-init\" data-mod=\"clientservice\" data-sup=\"supervisorInitials\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n            <\/label>\r\n          <\/div>\r\n          <div class=\"stv-confirm\">\r\n            <label class=\"stv-check\">\r\n              <input type=\"checkbox\" data-mod=\"clientservice\" class=\"stv-cb\">\r\n              <span>This training has been delivered and acknowledged.<\/span>\r\n            <\/label>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- Handbook Acknowledgement -->\r\n    <div class=\"stv-handbook\" id=\"handbookSection\">\r\n      <div class=\"stv-handbook-head\">\r\n        <span class=\"stv-handbook-icon\">📖<\/span>\r\n        <h2 class=\"stv-handbook-title\">Handbook Acknowledgement<\/h2>\r\n      <\/div>\r\n      <div class=\"stv-handbook-body\">\r\n        <p class=\"stv-handbook-text\">I confirm that I have received, read, and understood the contents of the <strong>CSJ Staff Handbook<\/strong>. I agree to abide by the rules, policies, and standards outlined in the handbook for the duration of my employment term.<\/p>\r\n        <p class=\"stv-handbook-text\">I understand that:<\/p>\r\n        <ul class=\"stv-handbook-list\">\r\n          <li>This handbook does not guarantee employment beyond my contract term<\/li>\r\n          <li>Policies may be updated and I will be notified of changes<\/li>\r\n          <li>Violations of these policies may result in disciplinary action<\/li>\r\n          <li>My confidentiality obligations continue after my employment ends<\/li>\r\n          <li>I have the right to ask questions about any content in this handbook<\/li>\r\n          <li>Attendance at all mandatory training sessions is a condition of my employment<\/li>\r\n          <li>Ethics and professional standards apply to everything I do in this workplace<\/li>\r\n        <\/ul>\r\n      <\/div>\r\n      <div class=\"stv-handbook-ack\">\r\n        <label class=\"stv-check stv-check-lg\">\r\n          <input type=\"checkbox\" id=\"hbConfirmed\" class=\"stv-cb\">\r\n          <span>I have read and understood the Staff Handbook<\/span>\r\n        <\/label>\r\n        <div class=\"stv-handbook-fields\">\r\n          <label class=\"stv-field\">\r\n            <span class=\"stv-lab\">Your initials<\/span>\r\n            <input type=\"text\" id=\"hbInitials\" class=\"stv-inp stv-init\" placeholder=\"ABC\" maxlength=\"5\" autocomplete=\"off\">\r\n          <\/label>\r\n          <label class=\"stv-field\">\r\n            <span class=\"stv-lab\">Date<\/span>\r\n            <input type=\"date\" id=\"hbDate\" class=\"stv-inp\">\r\n          <\/label>\r\n        <\/div>\r\n        <div class=\"stv-handbook-status\" id=\"hbStatus\"><\/div>\r\n      <\/div>\r\n    <\/div>\r\n\r\n  <\/div>\r\n\r\n  <!-- Full Signature -->\r\n  <div class=\"stv-sig-section\">\r\n    <div class=\"stv-sig-label\">Full Signature<\/div>\r\n    <div class=\"stv-pad-wrap stv-pad-lg\">\r\n      <canvas id=\"sigFull\" width=\"500\" height=\"100\"><\/canvas>\r\n      <button type=\"button\" class=\"stv-pad-clear\" data-target=\"sigFull\">Clear<\/button>\r\n    <\/div>\r\n    <div class=\"stv-sig-hint\">Sign above using your mouse, touch screen, or stylus<\/div>\r\n  <\/div>\r\n\r\n  <!-- Submit area -->\r\n  <div class=\"stv-submit-area\">\r\n    <div class=\"stv-submit-msg\" id=\"submitMsg\"><\/div>\r\n    <button type=\"button\" class=\"stv-btn stv-btn-submit\" id=\"btnSubmit\">Submit All Training Verifications<\/button>\r\n    <button type=\"button\" class=\"stv-btn stv-btn-export\" id=\"btnExport\">🖨 Print / Save PDF<\/button>\r\n  <\/div>\r\n\r\n  <!-- Confirmation overlay -->\r\n  <div class=\"stv-confirmed\" id=\"confirmedPanel\" hidden>\r\n    <div class=\"stv-confirmed-icon\">✓<\/div>\r\n    <h2>Training Verified<\/h2>\r\n    <p>Your training verification has been recorded. Your supervisor will review it.<\/p>\r\n    <p class=\"stv-confirmed-meta\" id=\"confirmedMeta\"><\/p>\r\n  <\/div>\r\n\r\n<\/div>\r\n"},"css":{"name":"StaffTrainingVerification.css","src":"../app/StaffTrainingVerification.css","content":"/* ---- Staff Training Verification - Theme ---- */\r\n:root {\r\n  --stv-red: #c8102e;\r\n  --stv-red-dark: #a00d24;\r\n  --stv-red-light: #fce8eb;\r\n  --stv-bg: #fdfdfd;\r\n  --stv-surface: #ffffff;\r\n  --stv-border: #e2e0dd;\r\n  --stv-text: #1a1a1a;\r\n  --stv-text-soft: #6b6b6b;\r\n  --stv-text-muted: #999;\r\n  --stv-green: #1a7a3a;\r\n  --stv-green-bg: #e6f4ea;\r\n  --stv-amber: #b85c00;\r\n  --stv-amber-bg: #fff8e6;\r\n  --stv-radius: 8px;\r\n  --stv-radius-sm: 5px;\r\n  --stv-shadow: 0 1px 4px rgba(0,0,0,.06);\r\n  --stv-trans: 0.2s ease;\r\n  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;\r\n  font-size: 15px;\r\n  line-height: 1.6;\r\n  color: var(--stv-text);\r\n}\r\n\r\n/* ---- Root ---- */\r\n.stv {\r\n  max-width: 780px;\r\n  margin: 0 auto;\r\n  padding: 20px 16px 40px;\r\n  background: var(--stv-bg);\r\n  animation: stvFadeIn 0.35s ease;\r\n}\r\n@keyframes stvFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }\r\n\r\n/* ---- Header ---- */\r\n.stv-header {\r\n  background: var(--stv-surface);\r\n  border: 1px solid var(--stv-border);\r\n  border-radius: var(--stv-radius);\r\n  padding: 20px 24px;\r\n  margin-bottom: 20px;\r\n  box-shadow: var(--stv-shadow);\r\n}\r\n.stv-title {\r\n  margin: 0;\r\n  font-size: 1.5rem;\r\n  font-weight: 700;\r\n  color: var(--stv-red);\r\n  letter-spacing: -0.01em;\r\n}\r\n.stv-sub {\r\n  margin: 4px 0 0;\r\n  font-size: 0.9rem;\r\n  color: var(--stv-text-soft);\r\n}\r\n\r\n/* ---- Progress ---- */\r\n.stv-progress-wrap {\r\n  margin-top: 16px;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n}\r\n.stv-progress-bar {\r\n  flex: 1;\r\n  height: 8px;\r\n  background: #edebe7;\r\n  border-radius: 4px;\r\n  overflow: hidden;\r\n}\r\n.stv-progress-fill {\r\n  height: 100%;\r\n  width: 0%;\r\n  background: var(--stv-red);\r\n  border-radius: 4px;\r\n  transition: width 0.4s ease;\r\n}\r\n.stv-progress-label {\r\n  font-size: 0.82rem;\r\n  font-weight: 600;\r\n  color: var(--stv-text-soft);\r\n  white-space: nowrap;\r\n  min-width: 140px;\r\n  text-align: right;\r\n}\r\n\r\n/* ---- Staff info ---- */\r\n.stv-staff {\r\n  display: flex;\r\n  gap: 16px;\r\n  margin-bottom: 16px;\r\n}\r\n.stv-staff .stv-field {\r\n  flex: 1;\r\n}\r\n.stv-field {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 4px;\r\n}\r\n.stv-lab {\r\n  font-size: 0.8rem;\r\n  font-weight: 600;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.04em;\r\n  color: var(--stv-text-soft);\r\n}\r\n.stv-req { color: var(--stv-red); }\r\n.stv-inp {\r\n  font-family: inherit;\r\n  font-size: 0.95rem;\r\n  padding: 9px 12px;\r\n  border: 1px solid var(--stv-border);\r\n  border-radius: var(--stv-radius-sm);\r\n  background: var(--stv-surface);\r\n  color: var(--stv-text);\r\n  transition: border-color var(--stv-trans), box-shadow var(--stv-trans);\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n}\r\n.stv-inp:focus {\r\n  outline: none;\r\n  border-color: var(--stv-red);\r\n  box-shadow: 0 0 0 3px var(--stv-red-light);\r\n}\r\n.stv-inp::placeholder { color: var(--stv-text-muted); }\r\n\r\n/* ---- Resources ---- */\r\n.stv-resources {\r\n  margin-bottom: 20px;\r\n}\r\n.stv-res-toggle {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  width: 100%;\r\n  padding: 10px 16px;\r\n  background: var(--stv-surface);\r\n  border: 1px solid var(--stv-border);\r\n  border-radius: var(--stv-radius);\r\n  font-family: inherit;\r\n  font-size: 0.9rem;\r\n  font-weight: 600;\r\n  color: var(--stv-text-soft);\r\n  cursor: pointer;\r\n  transition: background var(--stv-trans);\r\n}\r\n.stv-res-toggle:hover { background: #f8f7f5; }\r\n.stv-res-icon { font-size: 1.1rem; }\r\n.stv-res-chev {\r\n  margin-left: auto;\r\n  transition: transform var(--stv-trans);\r\n  font-size: 0.8rem;\r\n}\r\n.stv-res-toggle[aria-expanded=\"true\"] .stv-res-chev { transform: rotate(180deg); }\r\n.stv-res-list {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 6px;\r\n  padding: 12px 16px;\r\n  background: var(--stv-surface);\r\n  border: 1px solid var(--stv-border);\r\n  border-top: 0;\r\n  border-radius: 0 0 var(--stv-radius) var(--stv-radius);\r\n}\r\n.stv-res-link {\r\n  display: inline-block;\r\n  padding: 5px 12px;\r\n  font-size: 0.82rem;\r\n  color: var(--stv-red);\r\n  text-decoration: none;\r\n  border: 1px solid var(--stv-red-light);\r\n  border-radius: 20px;\r\n  transition: background var(--stv-trans), color var(--stv-trans);\r\n}\r\n.stv-res-link:hover { background: var(--stv-red); color: #fff; }\r\n\r\n/* ---- Section headers ---- */\r\n.stv-section-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 10px 0 4px;\r\n  margin-top: 6px;\r\n}\r\n.stv-section-head:first-child { margin-top: 0; }\r\n.stv-section-icon { font-size: 1.1rem; }\r\n.stv-section-label {\r\n  font-size: 0.78rem;\r\n  font-weight: 700;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.06em;\r\n  color: var(--stv-red-dark);\r\n}\r\n.stv-section-head-sup .stv-section-label { color: #1a5276; }\r\n\r\n/* ---- Modules ---- */\r\n.stv-modules {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 10px;\r\n  margin-bottom: 24px;\r\n}\r\n\r\n/* ---- Module header ---- */\r\n.stv-mod {\r\n  background: var(--stv-surface);\r\n  border: 1px solid var(--stv-border);\r\n  border-radius: var(--stv-radius);\r\n  box-shadow: var(--stv-shadow);\r\n  overflow: hidden;\r\n}\r\n.stv-mod-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  width: 100%;\r\n  padding: 14px 18px;\r\n  background: none;\r\n  border: none;\r\n  font-family: inherit;\r\n  font-size: 0.95rem;\r\n  font-weight: 600;\r\n  color: var(--stv-text);\r\n  cursor: pointer;\r\n  text-align: left;\r\n  transition: background var(--stv-trans);\r\n}\r\n.stv-mod-head:hover { background: #faf9f7; }\r\n.stv-mod-head[aria-expand n.stv-sig-label {\r\n  font-size: 0.9rem;\r\n  font-weight: 700;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.05em;\r\n  color: var(--stv-red-dark);\r\n  margin-bottom: 12px;\r\n  text-align: center;\r\n}\r\n.stv-pad-lg canvas {\r\n  width: 100%;\r\n  height: 100px;\r\n}\r\n.stv-sig-hint {\r\n  text-align: center;\r\n  font-size: 0.78rem;\r\n  color: var(--stv-text-muted);\r\n  margin-top: 6px;\r\n}\r\n\r\n/* Export button */\r\n.stv-btn-export {\r\n  display: block;\r\n  margin: 12px auto 0;\r\n  background: #1a5276;\r\n  color: #fff;\r\n}\r\n.stv-btn-export:hover { background: #143d5c; }\r\n\r\n/* Read-only: disable drawing */\r\n.stv[data-readonly=\"true\"] .stv-pad-wrap canvas {\r\n  pointer-events: none;\r\n  background: #f0f0f0;\r\n  border-color: #ddd;\r\n}\r\n.stv[data-readonly=\"true\"] .stv-pad-clear { display: none; }\r\n.stv[data-readonly=\"true\"] .stv-btn-export { display: none; }\r\n\r\n/* ---- Confirmed panel ---- */\r\n.stv-confirmed {\r\n  text-align: center;\r\n  padding: 40px 20px;\r\n  animation: stvFadeIn 0.5s ease;\r\n}\r\n.stv-confirmed-icon {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  width: 64px;\r\n  height: 64px;\r\n  border-radius: 50%;\r\n  background: var(--stv-green-bg);\r\n  color: var(--stv-green);\r\n  font-size: 2rem;\r\n  font-weight: 700;\r\n  margin-bottom: 16px;\r\n}\r\n.stv-confirmed h2 {\r\n  margin: 0 0 8px;\r\n  font-size: 1.3rem;\r\n  color: var(--stv-green);\r\n}\r\n.stv-confirmed p {\r\n  margin: 0 0 4px;\r\n  font-size: 0.95rem;\r\n  color: var(--stv-text-soft);\r\n  max-width: 440px;\r\n  margin-left: auto;\r\n  margin-right: auto;\r\n}\r\n.stv-confirmed-meta {\r\n  margin-top: 12px !important;\r\n  font-size: 0.82rem !important;\r\n  color: var(--stv-text-muted) !important;\r\n}\r\n\r\n/* ---- Read-only ---- */\r\n.stv[data-readonly=\"true\"] .stv-inp,\r\n.stv[data-readonly=\"true\"] .stv-cb {\r\n  pointer-events: none;\r\n  background: #f5f4f2;\r\n  border-color: #ddd;\r\n}\r\n.stv[data-readonly=\"true\"] .stv-mod-head {\r\n  cursor: default;\r\n  pointer-events: auto;\r\n}\r\n.stv[data-readonly=\"true\"] .stv-btn-submit { display: none; }\r\n.stv-ro-badge {\r\n  display: none;\r\n  background: var(--stv-amber-bg);\r\n  color: var(--stv-amber);\r\n  font-size: 0.75rem;\r\n  font-weight: 700;\r\n  padding: 4px 12px;\r\n  border-radius: 12px;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.05em;\r\n}\r\n.stv[data-readonly=\"true\"] .stv-ro-badge { display: inline-flex; }\r\n\r\n/* ---- Mobile ---- */\r\n@media (max-width: 600px) {\r\n  .stv { padding: 12px 10px 32px; }\r\n  .stv-header { padding: 14px 16px; }\r\n  .stv-title { font-size: 1.25rem; }\r\n  .stv-staff { flex-direction: column; gap: 10px; }\r\n  .stv-mod-head { padding: 12px 14px; font-size: 0.88rem; gap: 8px; }\r\n  .stv-mod-body { padding: 0 14px 16px; }\r\n  .stv-symbols { grid-template-columns: 1fr; }\r\n  .stv-confirm { flex-direction: column; align-items: flex-start; gap: 12px; }\r\n  .stv-progress-wrap { flex-direction: column; align-items: stretch; gap: 6px; }\r\n  .stv-progress-label { text-align: left; min-width: auto; }\r\n  .stv-res-list { flex-direction: column; }\r\n  .stv-sup-row { flex-direction: column; gap: 10px; }\r\n  .stv-handbook-fields { flex-direction: column; gap: 10px; }\r\n}\r\n\r\n/* ---- Print ---- */\r\n@media print {\r\n  .stv { max-width: none; padding: 0; background: #fff; }\r\n  .stv-resources { display: none; }\r\n  .stv-submit-area { display: none; }\r\n  .stv-mod-head { background: none; cursor: default; border-bottom: 2px solid #000; }\r\n  .stv-mod-body { display: block !important; }\r\n  .stv-mod-chev { display: none; }\r\n  .stv-mod { break-inside: avoid; border: 1px solid #ccc; margin-bottom: 12px; }\r\n  .stv-inp { border: 1px solid #ccc; background: #fff; }\r\n  .stv-mod-head[aria-expanded=\"false\"] + .stv-mod-body { display: block !important; }\r\n  .stv-section-head { break-after: avoid; }\r\n  .stv-mod-sup .stv-mod-head { border-bottom-color: #1a5276; }\r\n  .stv-pad-wrap canvas { border: 1.5px solid #999; background: #fff; }\r\n  .stv-pad-clear { display: none; }\r\n  .stv-sig-section { break-inside: avoid; border: 1px solid #ccc; }\r\n  .stv-sig-section canvas { border-color: #999; }\r\n}\r\n"},"js":{"name":"StaffTrainingVerification.js","src":"../app/StaffTrainingVerification.js","content":"/* ---- Staff Training Verification - JS ---- */\r\nvar MODS = [\r\n  { id: 'ohs',          type: 'self', num: 1 },\r\n  { id: 'harassment',   type: 'self', num: 2 },\r\n  { id: 'emergency',    type: 'self', num: 3 },\r\n  { id: 'whmis',        type: 'self', num: 4 },\r\n  { id: 'orientation',  type: 'supervised', num: 5 },\r\n  { id: 'paperwork',    type: 'supervised', num: 6 },\r\n  { id: 'industrial',   type: 'supervised', num: 7 },\r\n  { id: 'ethics',       type: 'supervised', num: 8 },\r\n  { id: 'edi',          type: 'supervised', num: 9 },\r\n  { id: 'confidentiality', type: 'supervised', num: 10 },\r\n  { id: 'clientservice',   type: 'supervised', num: 11 }\r\n];\r\nvar TOTAL_MODS = MODS.length;\r\nvar readOnly = false;\r\nvar _recentSaves = {};\r\nvar _saveTimer = null;\r\nvar $ = function (id) { return document.getElementById(id); };\r\n\r\n/* ---- Signature Pad Engine ---- */\r\nfunction initSignaturePad(canvasId) {\r\n  var canvas = $(canvasId);\r\n  if (!canvas) return;\r\n  var ctx = canvas.getContext('2d'), drawing = false;\r\n  var rect = canvas.getBoundingClientRect();\r\n  if (rect.width === 0 || rect.height === 0) return;\r\n  canvas.width = rect.width * 2;\r\n  canvas.height = rect.height * 2;\r\n  ctx.scale(2, 2);\r\n  ctx.strokeStyle = '#1a1a2e';\r\n  ctx.lineWidth = 2;\r\n  ctx.lineCap = 'round';\r\n  ctx.lineJoin = 'round';\r\n  function gp(e) {\r\n    var r = canvas.getBoundingClientRect();\r\n    return { x: (e.touches ? e.touches[0].clientX : e.clientX) - r.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - r.top };\r\n  }\r\n  function start(e) { if (readOnly) return; e.preventDefault(); drawing = true; var p = gp(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }\r\n  function move(e) { if (!drawing) return; e.preventDefault(); var p = gp(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }\r\n  function stop() { if (!drawing) return; drawing = false; saveDebounced(); }\r\n  canvas.addEventListener('mousedown', start);\r\n  canvas.addEventListener('mousemove', move);\r\n  canvas.addEventListener('mouseup', stop);\r\n  canvas.addEventListener('mouseleave', stop);\r\n  canvas.addEventListener('touchstart', start, { passive: false });\r\n  canvas.addEventListener('touchmove', move, { passive: false });\r\n  canvas.addEventListener('touchend', stop);\r\n}\r\n\r\nfunction clearSignature(canvasId) {\r\n  var c = $(canvasId);\r\n  if (!c) return;\r\n  c.getContext('2d').clearRect(0, 0, c.width, c.height);\r\n  saveDebounced();\r\n  updateProgress();\r\n  updateSubmitState();\r\n}\r\n\r\nfunction isCanvasEmpty(canvas) {\r\n  if (!canvas || canvas.width === 0 || canvas.height === 0) return true;\r\n  var ctx = canvas.getContext('2d', { willReadFrequently: true });\r\n  var d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;\r\n  for (var i = 3; i < d.length; i += 4) { if (d[i] !== 0) return false; }\r\n  return true;\r\n}\r\n\r\nfunction canvasToData(canvasId) {\r\n  var c = $(canvasId);\r\n  if (!c || isCanvasEmpty(c)) return '';\r\n  return c.toDataURL('image/png');\r\n}\r\n\r\nfunction loadCanvasFromData(canvasId, dataUrl) {\r\n  if (!dataUrl) return;\r\n  var c = $(canvasId);\r\n  if (!c) return;\r\n  var img = new Image();\r\n  img.onload = function () { c.getContext('2d').drawImage(img, 0, 0); };\r\n  img.src = dataUrl;\r\n}\r\n\r\n/* ---- Export PDF ---- */\r\nfunction exportPDF() {\r\n  tool.notify('Opening print dialog — use Save as PDF to create the signed record.', 'info');\r\n  setTimeout(function () { window.print(); }, 300);\r\n}\r\n\r\n/* ---- All signature pad IDs ---- */\r\nfunction allPadIds() {\r\n  return ['sigFull'];\r\n}\r\n\r\nfunction isSelf(m) { return m.type === 'self'; }\r\nfunction isSup(m) { return m.type === 'supervised'; }\r\n\r\n/* ---- Data helpers ---- */\r\nfunction defaultModData(m) {\r\n  if (isSelf(m)) {\r\n    return { type: 'self', completed: false, initials: '', answers: ['', '', ''], dateCompleted: '', deliveredBy: '' };\r\n  }\r\n  return { type: 'supervised', completed: false, staffInitials: '', supervisorInitials: '', dateCompleted: '', deliveredBy: '' };\r\n}\r\n\r\nfunction defaultData() {\r\n  var mods = {};\r\n  MODS.forEach(function (m) { mods[m.id] = defaultModData(m); });\r\n  return {\r\n    staffName: '', date: '', modules: mods, submittedAt: '',\r\n    handbookAcknowledged: { confirmed: false, initials: '', dateAcknowledged: '' }\r\n  };\r\n}\r\n\r\n/* ---- Gather current state from DOM ---- */\r\nfunction gatherData() {\r\n  var data = {\r\n    staffName: ($('staffName').value || '').trim(),\r\n    date: ($('trainDate').value || '').trim(),\r\n    modules: {},\r\n    submittedAt: currentValue ? currentValue.submittedAt || '' : '',\r\n    handbookAcknowledged: {\r\n      confirmed: $('hbConfirmed') ? $('hbConfirmed').checked : false,\r\n      initials: $('hbInitials') ? ($('hbInitials').value || '') : '',\r\n      dateAcknowledged: ($('hbDate') ? $('hbDate').value || '' : '').trim()\r\n    },\r\n    signature: canvasToData('sigFull')\r\n  };\r\n  var prev = currentValue ? (currentValue.modules || {}) : {};\r\n\r\n  MODS.forEach(function (m) {\r\n    var cb = document.querySelector('.stv-cb[data-mod=\"' + m.id + '\"]');\r\n    var completed = cb ? cb.checked : false;\r\n\r\n    if (isSelf(m)) {\r\n      var initEl = document.querySelector('.stv-init[data-mod=\"' + m.id + '\"]');\r\n      var answers = [];\r\n      for (var q = 0; q < 3; q++) {\r\n        var inp = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-q=\"' + q + '\"]');\r\n        answers.push(inp ? (inp.value || '') : '');\r\n      }\r\n      data.modules[m.id] = {\r\n        type: 'self',\r\n        completed: completed,\r\n        initials: ((document.querySelector('.stv-init[data-mod=\"' + m.id + '\"]') || {}).value || '').trim(),\r\n        answers: answers,\r\n        dateCompleted: completed ? (prev[m.id] ? prev[m.id].dateCompleted || '' : '') : '',\r\n        deliveredBy: ''\r\n      };\r\n    } else {\r\n      var dateEl = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-sup=\"date\"]');\r\n      var delByEl = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-sup=\"deliveredBy\"]');\r\n      data.modules[m.id] = {\r\n        type: 'supervised',\r\n        completed: completed,\r\n        staffInitials: ((document.querySelector('.stv-init[data-mod=\"' + m.id + '\"][data-sup=\"staffInitials\"]') || {}).value || '').trim(),\r\n        supervisorInitials: ((document.querySelector('.stv-init[data-mod=\"' + m.id + '\"][data-sup=\"supervisorInitials\"]') || {}).value || '').trim(),\r\n        dateCompleted: (dateEl ? dateEl.value || '' : '').trim(),\r\n        deliveredBy: (delByEl ? (delByEl.value || '') : '').trim()\r\n      };\r\n    }\r\n  });\r\n  return data;\r\n}\r\n\r\n/* ---- Populate DOM from saved data ---- */\r\nfunction populateUI(data) {\r\n  if (!data) return;\r\n  if ($('staffName').value !== (data.staffName || '')) $('staffName').value = data.staffName || '';\r\n  if ($('trainDate').value !== (data.date || '')) $('trainDate').value = data.date || '';\r\n\r\n  MODS.forEach(function (m) {\r\n    var cb = document.querySelector('.stv-cb[data-mod=\"' + m.id + '\"]');\r\n    var mod = (data.modules && data.modules[m.id]) ? data.modules[m.id] : defaultModData(m);\r\n    if (cb && cb.checked !== !!mod.completed) cb.checked = !!mod.completed;\r\n\r\n    if (isSelf(m)) {\r\n      var initEl = document.querySelector('.stv-init[data-mod=\"' + m.id + '\"]');\r\n      var newInit = (mod.initials || '').length < 200 ? (mod.initials || '') : '';\r\n      if (initEl && initEl.value !== newInit) initEl.value = newInit;\r\n      for (var q = 0; q < 3; q++) {\r\n        var inp = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-q=\"' + q + '\"]');\r\n        var newAns = (mod.answers && mod.answers[q]) ? mod.answers[q] : '';\r\n        if (inp && inp.value !== newAns) inp.value = newAns;\r\n      }\r\n    } else {\r\n      var dateEl = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-sup=\"date\"]');\r\n      var delByEl = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-sup=\"deliveredBy\"]');\r\n      var staffInitEl = document.querySelector('.stv-init[data-mod=\"' + m.id + '\"][data-sup=\"staffInitials\"]');\r\n      var supInitEl = document.querySelector('.stv-init[data-mod=\"' + m.id + '\"][data-sup=\"supervisorInitials\"]');\r\n      var sNew = (mod.staffInitials || '').length < 200 ? (mod.staffInitials || '') : '';\r\n      var pNew = (mod.supervisorInitials || '').length < 200 ? (mod.supervisorInitials || '') : '';\r\n      if (staffInitEl && staffInitEl.value !== sNew) staffInitEl.value = sNew;\r\n      if (supInitEl && supInitEl.value !== pNew) supInitEl.value = pNew;\r\n      if (dateEl && dateEl.value !== (mod.dateCompleted || '')) dateEl.value = mod.dateCompleted || '';\r\n      if (delByEl && delByEl.value !== (mod.deliveredBy || '')) delByEl.value = mod.deliveredBy || '';\r\n    }\r\n  });\r\n  // Handbook fields\r\n  var hb = data.handbookAcknowledged || { confirmed: false, initials: '', dateAcknowledged: '' };\r\n  if ($('hbConfirmed')) $('hbConfirmed').checked = !!hb.confirmed;\r\n  if ($('hbInitials')) $('hbInitials').value = (hb.initials || '').length < 200 ? (hb.initials || '') : '';\r\n  if ($('hbDate')) $('hbDate').value = hb.dateAcknowledged || '';\r\n  // Full signature\r\n  loadCanvasFromData('sigFull', data.signature);\r\n\r\n  updateProgress();\r\n  updateSubmitState();\r\n}\r\n\r\n/* ---- Check if a supervised module is complete ---- */\r\nfunction isSupComplete(modData) {\r\n  return modData.completed &&\r\n    (modData.staffInitials || '').trim().length > 0 &&\r\n    (modData.supervisorInitials || '').trim().length > 0 &&\r\n    (modData.deliveredBy || '').trim().length > 0 &&\r\n    (modData.dateCompleted || '').length > 0;\r\n}\r\n\r\nfunction isSelfComplete(modData) {\r\n  return modData.completed && (modData.initials || '').trim().length > 0;\r\n}\r\n\r\nfunction isModuleComplete(modData) {\r\n  if (!modData.completed) return false;\r\n  if (modData.type === 'supervised') return isSupComplete(modData);\r\n  return isSelfComplete(modData);\r\n}\r\n\r\n/* ---- Progress ---- */\r\nfunction updateProgress() {\r\n  var done = 0;\r\n  MODS.forEach(function (m) {\r\n    var cb = document.querySelector('.stv-cb[data-mod=\"' + m.id + '\"]');\r\n    var checked = cb ? cb.checked : false;\r\n    var badge = $('badge-' + m.id);\r\n\r\n    if (isSelf(m)) {\r\n      var initEl = document.querySelector('.stv-init[data-mod=\"' + m.id + '\"]');\r\n      var hasInitials = initEl ? (initEl.value || '').trim().length > 0 : false;\r\n      if (checked && hasInitials) {\r\n        done++;\r\n        if (badge) { badge.textContent = 'Done'; badge.className = 'stv-mod-badge stv-badge-done'; }\r\n      } else if (checked || hasInitials) {\r\n        if (badge) { badge.textContent = 'In progress'; badge.className = 'stv-mod-badge stv-badge-progress'; }\r\n      } else {\r\n        if (badge) { badge.textContent = ''; badge.className = 'stv-mod-badge'; }\r\n      }\r\n    } else {\r\n      var delByEl = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-sup=\"deliveredBy\"]');\r\n      var dateEl = document.querySelector('.stv-inp[data-mod=\"' + m.id + '\"][data-sup=\"date\"]');\r\n      var sInitEl = document.querySelector('.stv-init[data-mod=\"' + m.id + '\"][data-sup=\"staffInitials\"]');\r\n      var pInitEl = document.querySelector('.stv-init[data-mod=\"' + m.id + '\"][data-sup=\"supervisorInitials\"]');\r\n      var hasStaffInit = sInitEl ? (sInitEl.value || '').trim().length > 0 : false;\r\n      var hasSupInit = pInitEl ? (pInitEl.value || '').trim().length > 0 : false;\r\n      var hasDelBy = delByEl ? (delByEl.value || '').trim().length > 0 : false;\r\n      var hasDate = dateEl ? (dateEl.value || '').length > 0 : false;\r\n      var supDone = checked && hasStaffInit && hasSupInit && hasDelBy && hasDate;\r\n      var supStarted = checked || hasStaffInit || hasSupInit || hasDelBy || hasDate;\r\n\r\n      if (supDone) {\r\n        done++;\r\n        if (badge) { badge.textContent = 'Complete'; badge.className = 'stv-mod-badge stv-badge-done'; }\r\n      } else if (supStarted) {\r\n        if (badge) { badge.textContent = 'In progress'; badge.className = 'stv-mod-badge stv-badge-progress'; }\r\n      } else {\r\n        if (badge) { badge.textContent = ''; badge.className = 'stv-mod-badge'; }\r\n      }\r\n    }\r\n  });\r\n  // Handbook status\r\n  var hbConfirmed = $('hbConfirmed') ? $('hbConfirmed').checked : false;\r\n  var hbInitials = $('hbInitials') ? ($('hbInitials').value || '').trim().length > 0 : false;\r\n  var hbStatus = $('hbStatus');\r\n  if (hbConfirmed && hbInitials) {\r\n    if (hbStatus) { hbStatus.textContent = 'Handbook Acknowledged \\u2713'; hbStatus.className = 'stv-handbook-status stv-hb-ok'; }\r\n  } else if (hbConfirmed || hbInitials) {\r\n    if (hbStatus) { hbStatus.textContent = 'Handbook acknowledgement incomplete'; hbStatus.className = 'stv-handbook-status stv-hb-pending'; }\r\n  } else {\r\n    if (hbStatus) { hbStatus.textContent = ''; hbStatus.className = 'stv-handbook-status'; }\r\n  }\r\n\r\n  var pct = Math.round((done / TOTAL_MODS) * 100);\r\n  $('progFill').style.width = pct + '%';\r\n  $('progLabel').textContent = done + ' of ' + TOTAL_MODS + ' modules complete';\r\n}\r\n\r\n/* ---- Submit state ---- */\r\nfunction updateSubmitState() {\r\n  var btn = $('btnSubmit');\r\n  if (!btn) return;\r\n  var data = gatherData();\r\n  var hasName = data.staffName.length > 0;\r\n  var allDone = MODS.every(function (m) {\r\n    var mod = data.modules[m.id];\r\n    return isModuleComplete(mod);\r\n  });\r\n  var someStarted = MODS.some(function (m) {\r\n    var mod = data.modules[m.id];\r\n    if (mod.completed) return true;\r\n    if (isSelf(m)) {\r\n      return (mod.initials || '').length > 0 || (mod.answers || []).some(function (a) { return a.length > 0; });\r\n    }\r\n    return (mod.staffInitials || '').length > 0 || (mod.supervisorInitials || '').length > 0 ||\r\n      (mod.deliveredBy || '').length > 0 || (mod.dateCompleted || '').length > 0;\r\n  });\r\n  var hbOk = data.handbookAcknowledged && data.handbookAcknowledged.confirmed && (data.handbookAcknowledged.initials || '').trim().length > 0;\r\n  var hasSig = (data.signature || '').length > 0;\r\n  btn.disabled = !hasName || !allDone || !hbOk || !hasSig;\r\n  var msgEl = $('submitMsg');\r\n  if (!hasName && someStarted) {\r\n    msgEl.textContent = 'Enter your name before submitting.';\r\n  } else if (hasName && !allDone) {\r\n    msgEl.textContent = 'Complete all ' + TOTAL_MODS + ' modules before submitting.';\r\n  } else if (hasName && allDone && !hbOk) {\r\n    msgEl.textContent = 'Acknowledge the Staff Handbook (check the box and sign your initials).';\r\n  } else if (hasName && allDone && hbOk && !hasSig) {\r\n    msgEl.textContent = 'Sign your full signature at the bottom of the form.';\r\n  } else {\r\n    msgEl.textContent = '';\r\n  }\r\n}\r\n\r\n/* ---- Accordion ---- */\r\nfunction toggleModule(modId) {\r\n  var body = $('body-' + modId);\r\n  var head = document.querySelector('.stv-mod-head[data-mod=\"' + modId + '\"]');\r\n  if (!body || !head) return;\r\n  var expanded = head.getAttribute('aria-expanded') === 'true';\r\n  if (expanded) {\r\n    body.hidden = true;\r\n    head.setAttribute('aria-expanded', 'false');\r\n  } else {\r\n    body.hidden = false;\r\n    head.setAttribute('aria-expanded', 'true');\r\n  }\r\n  try { tool.resize(); } catch (e) {}\r\n}\r\n\r\n/* ---- Read-only ---- */\r\nfunction lockUI(ro) {\r\n  readOnly = ro;\r\n  var root = $('stvRoot');\r\n  if (ro) {\r\n    root.setAttribute('data-readonly', 'true');\r\n    $('btnSubmit').style.display = 'none';\r\n    $('submitMsg').style.display = 'none';\r\n  } else {\r\n    root.setAttribute('data-readonly', 'false');\r\n    root.removeAttribute('data-readonly');\r\n    $('btnSubmit').style.display = '';\r\n    $('submitMsg').style.display = '';\r\n  }\r\n}\r\n\r\n/* ---- Validation ---- */\r\nfunction validateForm() {\r\n  var data = gatherData();\r\n  if (!data.staffName) {\r\n    tool.reportValid(false, 'Please enter your name.');\r\n    return;\r\n  }\r\n  var hb = data.handbookAcknowledged || {};\r\n  var incomplete = MODS.filter(function (m) {\r\n    return !isModuleComplete(data.modules[m.id]);\r\n  });\r\n  if (incomplete.length > 0) {\r\n    tool.reportValid(false, 'Complete all ' + TOTAL_MODS + ' modules before saving.');\r\n    return;\r\n  }\r\n  if (!hb.confirmed || !(hb.initials || '').trim()) {\r\n    tool.reportValid(false, 'Acknowledge the Staff Handbook before saving.');\r\n    return;\r\n  }\r\n  if (!(data.signature || '')) {\r\n    tool.reportValid(false, 'Sign your full signature before saving.');\r\n    return;\r\n  }\r\n  tool.reportValid(true);\r\n}\r\n\r\n/* ---- Save ---- */\r\nfunction saveValue(data) {\r\n  var hash = JSON.stringify(data);\r\n  _recentSaves[hash] = Date.now() + 8000; // keep for 8s to catch late echoes\r\n  try { tool.setValue(data); } catch (e) {}\r\n  // Purge expired entries (keep map small)\r\n  var now = Date.now();\r\n  var keys = Object.keys(_recentSaves);\r\n  if (keys.length > 30) {\r\n    for (var i = 0; i < keys.length; i++) {\r\n      if (_recentSaves[keys[i]] < now) delete _recentSaves[keys[i]];\r\n    }\r\n  }\r\n  // Validation only fires on explicit submit/checkbox, not on auto-save strokes\r\n}\r\n\r\n/* ---- Debounced save ---- */\r\nfunction saveDebounced() {\r\n  if (_saveTimer) clearTimeout(_saveTimer);\r\n  _saveTimer = setTimeout(function () {\r\n    var data = gatherData();\r\n    saveValue(data);\r\n    _saveTimer = null;\r\n  }, 400);\r\n}\r\n\r\n/* ---- Submit ---- */\r\nfunction submitAll() {\r\n  if (readOnly) return;\r\n  var data = gatherData();\r\n  if (!data.staffName) {\r\n    tool.notify('Please enter your name before submitting.', 'warning');\r\n    return;\r\n  }\r\n  var incomplete = MODS.filter(function (m) {\r\n    return !isModuleComplete(data.modules[m.id]);\r\n  });\r\n  if (incomplete.length > 0) {\r\n    tool.notify('Please complete all ' + TOTAL_MODS + ' modules before submitting.', 'warning');\r\n    return;\r\n  }\r\n  var hb = data.handbookAcknowledged || {};\r\n  if (!hb.confirmed || !(hb.initials || '').trim()) {\r\n    tool.notify('Please acknowledge the Staff Handbook before submitting.', 'warning');\r\n    return;\r\n  }\r\n  if (!(data.signature || '')) {\r\n    tool.notify('Please sign your full signature at the bottom before submitting.', 'warning');\r\n    return;\r\n  }\r\n  // Timestamp completed modules that don't have a date yet\r\n  var now = new Date().toISOString();\r\n  MODS.forEach(function (m) {\r\n    var mod = data.modules[m.id];\r\n    if (mod.completed && !mod.dateCompleted) {\r\n      mod.dateCompleted = now;\r\n    }\r\n  });\r\n  // Timestamp handbook\r\n  if (data.handbookAcknowledged && data.handbookAcknowledged.confirmed && !data.handbookAcknowledged.dateAcknowledged) {\r\n    data.handbookAcknowledged.dateAcknowledged = now;\r\n  }\r\n  data.submittedAt = now;\r\n  saveValue(data);\r\n\r\n  // Show confirmation\r\n  $('modulesWrap').hidden = true;\r\n  $('submitMsg').hidden = true;\r\n  $('btnSubmit').hidden = true;\r\n  $('resBanner').hidden = true;\r\n  $('confirmedPanel').hidden = false;\r\n  $('confirmedMeta').textContent = 'Submitted: ' + new Date(now).toLocaleString() + ' | Staff: ' + data.staffName;\r\n\r\n  tool.notify('Training verification recorded. Your supervisor will review it.', 'success');\r\n  try { tool.resize(); } catch (e) {}\r\n}\r\n\r\n/* ---- Resources toggle ---- */\r\nfunction toggleResources() {\r\n  var toggle = $('resToggle');\r\n  var list = $('resList');\r\n  var expanded = toggle.getAttribute('aria-expanded') === 'true';\r\n  if (expanded) {\r\n    list.hidden = true;\r\n    toggle.setAttribute('aria-expanded', 'false');\r\n  } else {\r\n    list.hidden = false;\r\n    toggle.setAttribute('aria-expanded', 'true');\r\n  }\r\n  try { tool.resize(); } catch (e) {}\r\n}\r\n\r\n/* ---- Event binding ---- */\r\nfunction bindEvents() {\r\n  // Accordion headers\r\n  document.querySelectorAll('.stv-mod-head').forEach(function (btn) {\r\n    btn.addEventListener('click', function () {\r\n      var mod = this.getAttribute('data-mod');\r\n      if (mod) toggleModule(mod);\r\n    });\r\n  });\r\n\r\n  // Resources toggle\r\n  var resToggle = $('resToggle');\r\n  if (resToggle) resToggle.addEventListener('click', toggleResources);\r\n\r\n  // Checkboxes - update progress\r\n  document.querySelectorAll('.stv-cb').forEach(function (cb) {\r\n    cb.addEventListener('change', function () {\r\n      var data = gatherData();\r\n      saveValue(data);\r\n      updateProgress();\r\n      updateSubmitState();\r\n    });\r\n  });\r\n\r\n  // Init full signature pad only\r\n  initSignaturePad('sigFull');\r\n\r\n  // Clear button for full signature\r\n  document.querySelectorAll('.stv-pad-clear').forEach(function (btn) {\r\n    btn.addEventListener('click', function () {\r\n      var target = this.getAttribute('data-target');\r\n      if (target) clearSignature(target);\r\n    });\r\n  });\r\n\r\n  // Initials text fields (both self and supervised) — debounced save\r\n  document.querySelectorAll('.stv-init').forEach(function (inp) {\r\n    inp.addEventListener('input', function () {\r\n      updateProgress();\r\n      updateSubmitState();\r\n      saveDebounced();\r\n    });\r\n  });\r\n\r\n  // Answer fields (self-study only) - debounced auto-save\r\n  document.querySelectorAll('.stv-inp[data-q]').forEach(function (inp) {\r\n    inp.addEventListener('input', function () {\r\n      updateSubmitState();\r\n      saveDebounced();\r\n    });\r\n  });\r\n\r\n  // Supervised fields (date, deliveredBy) - debounced auto-save\r\n  document.querySelectorAll('.stv-inp[data-sup=\"date\"], .stv-inp[data-sup=\"deliveredBy\"]').forEach(function (inp) {\r\n    inp.addEventListener('input', function () {\r\n      updateProgress();\r\n      updateSubmitState();\r\n      saveDebounced();\r\n    });\r\n    inp.addEventListener('change', function () {\r\n      updateProgress();\r\n      updateSubmitState();\r\n      saveDebounced();\r\n    });\r\n  });\r\n\r\n  // Staff name - debounced auto-save\r\n  var nameEl = $('staffName');\r\n  if (nameEl) {\r\n    nameEl.addEventListener('input', function () {\r\n      updateSubmitState();\r\n      saveDebounced();\r\n    });\r\n  }\r\n\r\n  // Date - auto-save\r\n  var dateEl = $('trainDate');\r\n  if (dateEl) {\r\n    dateEl.addEventListener('change', function () {\r\n      var data = gatherData();\r\n      saveValue(data);\r\n    });\r\n  }\r\n\r\n  // Handbook checkbox + initials\r\n  var hbConfirmed = $('hbConfirmed');\r\n  if (hbConfirmed) {\r\n    hbConfirmed.addEventListener('change', function () {\r\n      updateProgress();\r\n      updateSubmitState();\r\n      saveDebounced();\r\n    });\r\n  }\r\n  var hbInitials = $('hbInitials');\r\n  if (hbInitials) {\r\n    hbInitials.addEventListener('input', function () {\r\n      updateProgress();\r\n      updateSubmitState();\r\n      saveDebounced();\r\n    });\r\n  }\r\n  var hbDate = $('hbDate');\r\n  if (hbDate) {\r\n    hbDate.addEventListener('change', function () {\r\n      saveDebounced();\r\n    });\r\n  }\r\n\r\n  // Export PDF button\r\n  var exportBtn = $('btnExport');\r\n  if (exportBtn) {\r\n    exportBtn.addEventListener('click', exportPDF);\r\n  }\r\n\r\n  // Submit button\r\n  var submitBtn = $('btnSubmit');\r\n  if (submitBtn) {\r\n    submitBtn.addEventListener('click', submitAll);\r\n  }\r\n}\r\n\r\n/* ---- Current value ---- */\r\nvar currentValue = null;\r\n\r\n/* ---- Render ---- */\r\nfunction render(val) {\r\n  currentValue = val || defaultData();\r\n  if (!currentValue.modules) currentValue = defaultData();\r\n  populateUI(currentValue);\r\n\r\n  // If already submitted, show confirmed panel\r\n  if (currentValue.submittedAt) {\r\n    $('modulesWrap').hidden = true;\r\n    $('submitMsg').hidden = true;\r\n    $('btnSubmit').hidden = true;\r\n    $('resBanner').hidden = true;\r\n    $('confirmedPanel').hidden = false;\r\n    $('confirmedMeta').textContent = 'Submitted: ' + new Date(currentValue.submittedAt).toLocaleString() + ' | Staff: ' + (currentValue.staffName || 'Unknown');\r\n  }\r\n\r\n  // Set date defaults if empty\r\n  var todayStr;\r\n  if (!$('trainDate').value) {\r\n    var d = new Date();\r\n    todayStr = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);\r\n    $('trainDate').value = todayStr;\r\n  }\r\n  if (!$('hbDate').value) {\r\n    if (!todayStr) { var d2 = new Date(); todayStr = d2.getFullYear() + '-' + ('0' + (d2.getMonth() + 1)).slice(-2) + '-' + ('0' + d2.getDate()).slice(-2); }\r\n    $('hbDate').value = todayStr;\r\n  }\r\n\r\n  updateProgress();\r\n  updateSubmitState();\r\n  validateForm();\r\n  try { tool.resize(); } catch (e) {}\r\n}\r\n\r\n/* ---- ENTRY POINT ---- */\r\ntool.onReady(function (val) {\r\n  bindEvents();\r\n  render(val);\r\n  if (tool.isReadOnly()) lockUI(true);\r\n\r\n  tool.onValueChange(function (v) {\r\n    if (!v) return;\r\n    // Skip re-render if this is our own save echoing back (handles out-of-order postMessage)\r\n    var incomingHash = JSON.stringify(v);\r\n    if (_recentSaves[incomingHash]) {\r\n      delete _recentSaves[incomingHash];\r\n      return;\r\n    }\r\n    // External change (another user) — full re-render\r\n    currentValue = v;\r\n    render(v);\r\n  });\r\n\r\n  tool.onReadonlyChange(function (ro) {\r\n    lockUI(ro);\r\n  });\r\n});\r\n"}}</script>
