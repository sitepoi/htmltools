  DOCS INDEX TEMPLATE - _docs/templates/_index-template.html
  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), and the test harness
  into a full-page pane - open ONLY this file to review everything about the
  tool. Self-contained (no shared assets) so it works anywhere. Created by

  panes are embedded between the CODE-PAYLOAD markers and refreshed with

<style>

  .docs-nav-item.docs-nav-code:hover { background: #1e293b; color: #fcd34d; }

    .docs-shots-arrow.next { right: 4px; }

    .docs-shell { flex-direction: column; }

    .docs-nav { display: flex; overflow-x: auto; padding: 6px; }
    .docs-nav-item { white-space: nowrap; margin: 0 2px; }
    .docs-brand { display: none; }
    .docs-menu-footer { display: none; }
  }
</style>

oadAll\">⬇ Download all (.zip)<\/button>\r\n    <\/div>\r\n    <div id=\"hbtResults\"><\/div>\r\n  <\/section>\r\n\r\n  <!-- COPY FALLBACK MODAL -->\r\n  <div class=\"hbt-overlay\" id=\"hbtCopyOverlay\" style=\"display:none\">\r\n    <div class=\"hbt-modal\">\r\n      <div class=\"hbt-modal-head\">\r\n        <h3>Copy content<\/h3>\r\n        <button type=\"button\" class=\"hbt-icon-btn\" id=\"hbtCopyClose\">&times;<\/button>\r\n      <\/div>\r\n      <div class=\"hbt-modal-body\">\r\n        <p class=\"hbt-modal-hint\">Clipboard access was blocked. Select the text below and copy it manually.<\/p>\r\n        <textarea id=\"hbtCopyText\" class=\"hbt-copy-textarea\" readonly><\/textarea>\r\n      <\/div>\r\n      <div class=\"hbt-modal-actions\">\r\n        <button type=\"button\" class=\"hbt-btn hbt-btn-primary\" id=\"hbtCopyDone\">Done<\/button>\r\n      <\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n<\/div>\r\n\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\"><\/script>\r\n"},"css":{"name":"HtmlBulkTranslator.css","src":"../app/HtmlBulkTranslator.css","content":"/* HtmlBulkTranslator - styles (Uniconhub CMS html-tool) */\r\n\r\n.hbt-app {\r\n  --hbt-accent: #4f46e5;\r\n  --hbt-accent-2: #7c3aed;\r\n  --hbt-ink: #0f172a;\r\n  --hbt-muted: #64748b;\r\n  --hbt-line: #e2e8f0;\r\n  --hbt-bg: #f1f5f9;\r\n  --hbt-card: #ffffff;\r\n  --hbt-green: #16a34a;\r\n  --hbt-red: #dc2626;\r\n  --hbt-amber: #d97706;\r\n  font-family: system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\r\n  color: var(--hbt-ink);\r\n  background: var(--hbt-bg);\r\n  min-height: 100vh;\r\n  padding: 0 0 28px 0;\r\n}\r\n\r\n/* ---------- Header ---------- */\r\n.hbt-header {\r\n  background: linear-gradient(120deg, #312e81 0%, #4f46e5 55%, #7c3aed 100%);\r\n  color: #fff;\r\n  padding: 22px 28px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  flex-wrap: wrap;\r\n}\r\n.hbt-brand { display: flex; align-items: center; gap: 14px; }\r\n.hbt-badge {\r\n  font-size: 26px;\r\n  width: 52px; height: 52px;\r\n  display: flex; align-items: center; justify-content: center;\r\n  background: rgba(255, 255, 255, 0.14);\r\n  border: 1px solid rgba(255, 255, 255, 0.28);\r\n  border-radius: 14px;\r\n  flex: 0 0 auto;\r\n}\r\n.hbt-title-wrap h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 0.2px; }\r\n.hbt-title-wrap p { margin: 4px 0 0; font-size: 12.5px; color: rgba(255, 255, 255, 0.82); max-width: 640px; line-height: 1.5; }\r\n.hbt-head-side { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\r\n.hbt-role-badge {\r\n  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;\r\n  background: rgba(255, 255, 255, 0.14);\r\n  border: 1px solid rgba(255, 255, 255, 0.28);\r\n  padding: 5px 12px; border-radius: 999px;\r\n}\r\n.hbt-save-state {\r\n  font-size: 11.5px; color: #d1fae5;\r\n  background: rgba(16, 185, 129, 0.22);\r\n  border: 1px solid rgba(16, 185, 129, 0.5);\r\n  padding: 5px 12px; border-radius: 999px;\r\n  display: none;\r\n}\r\n.hbt-save-state.hbt-save-visible { display: inline-block; }\r\n.hbt-save-state.hbt-save-staged { color: #fde68a; background: rgba(217, 119, 6, 0.22); border-color: rgba(217, 119, 6, 0.55); }\r\n\r\n/* ---------- Cards ---------- */\r\n.hbt-card {\r\n  background: var(--hbt-card);\r\n  border: 1px solid var(--hbt-line);\r\n  border-radius: 14px;\r\n  margin: 18px 20px 0;\r\n  padding: 18px 20px 20px;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n}\r\n.hbt-card-head {\r\n  display: flex; align-items: baseline; justify-content: space-between;\r\n  gap: 12px; flex-wrap: wrap;\r\n  margin-bottom: 12px;\r\n}\r\n.hbt-card-head h2 { margin: 0; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }\r\n.hbt-step-num {\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  width: 22px; height: 22px; border-radius: 7px;\r\n  background: var(--hbt-accent); color: #fff;\r\n  font-size: 12px; font-weight: 700; flex: 0 0 auto;\r\n}\r\n.hbt-meta { font-size: 11.5px; color: var(--hbt-muted); }\r\n.hbt-meta.hbt-warn { color: var(--hbt-amber); font-weight: 600; }\r\n\r\n/* ---------- Buttons ---------- */\r\n.hbt-btn {\r\n  font-family: inherit; font-size: 12.5px; font-weight: 600;\r\n  border-radius: 8px; padding: 8px 14px; cursor: pointer;\r\n  border: 1px solid transparent; transition: filter 0.15s ease, opacity 0.15s ease;\r\n}\r\n.hbt-btn:disabled { opacity: 0.45; cursor: not-allowed; }\r\n.hbt-btn-primary {\r\n  background: linear-gradient(120deg, #4f46e5, #7c3aed); color: #fff;\r\n  box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);\r\n}\r\n.hbt-btn-primary:not(:disabled):hover { filter: brightness(1.08); }\r\n.hbt-btn-danger { background: #dc2626; color: #fff; }\r\n.hbt-btn-danger:not(:disabled):hover { filter: brightness(1.08); }\r\n.hbt-btn-outline { background: #fff; color: var(--hbt-ink); border-color: #cbd5e1; }\r\n.hbt-btn-outline:not(:disabled):hover { border-color: var(--hbt-accent); color: var(--hbt-accent); }\r\n.hbt-btn-ghost { background: transparent; color: var(--hbt-muted); }\r\n.hbt-btn-ghost:not(:disabled):hover { background: #f1f5f9; color: var(--hbt-ink); }\r\n.hbt-icon-btn {\r\n  background: transparent; border: none; font-size: 18px; line-height: 1;\r\n  cursor: pointer; color: var(--hbt-muted); padding: 4px 8px; border-radius: 6px;\r\n}\r\n.hbt-icon-btn:hover { background: #f1f5f9; color: var(--hbt-ink); }\r\n\r\n.hbt-source-tools, .hbt-run-tools, .hbt-extract-row {\r\n  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;\r\n}\r\n.hbt-source-tools { margin-bottom: 10px; }\r\n.hbt-extract-row { margin-top: 10px; }\r\n.hbt-extract-info { font-size: 12px; color: var(--hbt-muted); font-weight: 600; }\r\n\r\n/* ---------- Source input ---------- */\r\n.hbt-source-input {\r\n  width: 100%; min-height: 180px; resize: vertical;\r\n  font-family: ui-monospace, SFMono-Regular, Consolas, \"Liberation Mono\", Menlo, monospace;\r\n  font-size: 12px; line-height: 1.55;\r\n  border: 1px solid #cbd5e1; border-radius: 10px;\r\n  padding: 12px; background: #f8fafc; color: #0f172a;\r\n  box-sizing: border-box;\r\n}\r\n.hbt-source-input:focus { outline: 2px solid rgba(79, 70, 229, 0.35); border-color: var(--hbt-accent); background: #fff; }\r\n.hbt-source-input[readonly] { background: #f1f5f9; color: #475569; cursor: not-allowed; }\r\n\r\n/* ---------- Languages ---------- */\r\n.hbt-lang-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }\r\n.hbt-quick-chip {\r\n  font-size: 11.5px; font-weight: 600; color: var(--hbt-muted);\r\n  border: 1px solid #cbd5e1; background: #fff; border-radius: 999px;\r\n  padding: 4px 11px; cursor: pointer;\r\n}\r\n.hbt-quick-chip:hover { border-color: var(--hbt-accent); color: var(--hbt-accent); }\r\n.hbt-quick-chip.hbt-quick-on {\r\n  background: #eef2ff; border-color: var(--hbt-accent); color: var(--hbt-accent);\r\n}\r\n.hbt-lang-input-row { display: flex; gap: 8px; align-items: center; }\r\n.hbt-lang-input-row input {\r\n  flex: 1; min-width: 180px;\r\n  font-family: inherit; font-size: 13px;\r\n  border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 12px;\r\n}\r\n.hbt-lang-input-row input:focus { outline: 2px solid rgba(79, 70, 229, 0.35); border-color: var(--hbt-accent); }\r\n.hbt-lang-input-row input[readonly] { background: #f1f5f9; cursor: not-allowed; }\r\n.hbt-lang-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }\r\n.hbt-lang-chip {\r\n  display: inline-flex; align-items: center; gap: 7px;\r\n  background: #eef2ff; color: #3730a3;\r\n  border: 1px solid #c7d2fe; border-radius: 999px;\r\n  font-size: 12.5px; font-weight: 600; padding: 5px 6px 5px 13px;\r\n}\r\n.hbt-chip-remove {\r\n  border: none; background: transparent; cursor: pointer;\r\n  color: #6366f1; font-size: 14px; line-height: 1; padding: 2px 6px; border-radius: 999px;\r\n}\r\n.hbt-chip-remove:hover { background: #c7d2fe; color: #312e81; }\r\n.hbt-locked .hbt-chip-remove { display: none; }\r\n.hbt-lang-empty { font-size: 12px; color: var(--hbt-muted); margin-top: 8px; }\r\n\r\n/* ---------- Progress ---------- */\r\n.hbt-progress-track {\r\n  height: 8px; background: var(--hbt-line); border-radius: 999px;\r\n  margin: 12px 0 4px; overflow: hidden;\r\n}\r\n.hbt-progress-fill {\r\n  height: 100%; width: 0%;\r\n  background: linear-gradient(90deg, #4f46e5, #7c3aed);\r\n  border-radius: 999px; transition: width 0.35s ease;\r\n}\r\n.hbt-lang-list { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }\r\n.hbt-lang-row {\r\n  display: flex; align-items: center; gap: 12px;\r\n  border: 1px solid var(--hbt-line); border-radius: 10px;\r\n  padding: 9px 13px; background: #f8fafc;\r\n}\r\n.hbt-lang-row.hbt-row-done { background: #f0fdf4; border-color: #bbf7d0; }\r\n.hbt-lang-row.hbt-row-failed { background: #fef2f2; border-color: #fecaca; }\r\n.hbt-lang-row.hbt-row-translating { background: #eef2ff; border-color: #c7d2fe; }\r\n.hbt-lang-status { width: 22px; text-align: center; font-size: 14px; flex: 0 0 auto; }\r\n.hbt-st-done { color: var(--hbt-green); font-weight: 800; }\r\n.hbt-st-failed { color: var(--hbt-red); font-weight: 800; }\r\n.hbt-st-pending { color: #94a3b8; }\r\n.hbt-lang-name { font-size: 13px; font-weight: 700; min-width: 130px; }\r\n.hbt-lang-state { font-size: 11.5px; color: var(--hbt-muted); flex: 1; }\r\n.hbt-lang-actions { display: flex; gap: 6px; }\r\n.hbt-lang-actions .hbt-btn { padding: 4px 10px; font-size: 11px; }\r\n.hbt-spinner {\r\n  display: inline-block; width: 13px; height: 13px;\r\n  border: 2px solid #c7d2fe; border-top-color: var(--hbt-accent);\r\n  border-radius: 50%; animation: hbt-spin 0.8s linear infinite;\r\n}\r\n@keyframes hbt-spin { to { transform: rotate(360deg); } }\r\n\r\n/* ---------- Results ---------- */\r\n.hbt-results-empty {\r\n  font-size: 12.5px; color: var(--hbt-muted);\r\n  border: 1px dashed #cbd5e1; border-radius: 10px;\r\n  padding: 18px; text-align: center; background: #f8fafc;\r\n}\r\n.hbt-result {\r\n  border: 1px solid var(--hbt-line); border-left: 4px solid var(--hbt-green);\r\n  border-radius: 10px; margin-top: 12px; overflow: hidden;\r\n}\r\n.hbt-result-head {\r\n  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\r\n  padding: 10px 14px; background: #f8fafc;\r\n}\r\n.hbt-result-head .hbt-lang-name { min-width: 110px; }\r\n.hbt-result-meta { font-size: 11.5px; color: var(--hbt-muted); flex: 1; }\r\n.hbt-result-head .hbt-btn { padding: 4px 11px; font-size: 11px; }\r\n.hbt-preview-wrap { border-top: 1px solid var(--hbt-line); }\r\n.hbt-preview-wrap summary {\r\n  padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--hbt-accent);\r\n  cursor: pointer; user-select: none;\r\n}\r\n.hbt-preview-frame {\r\n  width: 100%; height: 420px; border: none; display: block; background: #fff;\r\n}\r\n.hbt-missing-note { font-size: 11.5px; color: var(--hbt-amber); font-weight: 600; }\r\n\r\n/* ---------- Modal ---------- */\r\n.hbt-overlay {\r\n  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);\r\n  display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px;\r\n}\r\n.hbt-modal {\r\n  background: #fff; border-radius: 14px; width: 100%; max-width: 680px;\r\n  box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);\r\n}\r\n.hbt-modal-head {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 14px 18px; border-bottom: 1px solid var(--hbt-line);\r\n}\r\n.hbt-modal-head h3 { margin: 0; font-size: 14.5px; }\r\n.hbt-modal-body { padding: 14px 18px; }\r\n.hbt-modal-hint { font-size: 12px; color: var(--hbt-muted); margin: 0 0 10px; }\r\n.hbt-copy-textarea {\r\n  width: 100%; height: 300px; box-sizing: border-box;\r\n  font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px;\r\n  border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; resize: vertical;\r\n}\r\n.hbt-modal-actions {\r\n  display: flex; justify-content: flex-end; gap: 8px;\r\n  padding: 12px 18px; border-top: 1px solid var(--hbt-line);\r\n}\r\n\r\n/* ---------- Responsive ---------- */\r\n@media (max-width: 760px) {\r\n  .hbt-header { padding: 16px 18px; }\r\n  .hbt-card { margin: 12px 10px 0; padding: 14px 14px 16px; }\r\n  .hbt-lang-name { min-width: 100px; }\r\n  .hbt-preview-frame { height: 320px; }\r\n  .hbt-run-tools { gap: 6px; }\r\n  .hbt-run-tools .hbt-btn { flex: 1 1 auto; }\r\n}\r\n"},"js":{"name":"HtmlBulkTranslator.js","src":"../app/HtmlBulkTranslator.js","content":"/* ============================================================\r\n   HtmlBulkTranslator - JS\r\n   Uniconhub CMS html-tool.\r\n   One tool instance = one HTML document. The document is\r\n   translated into every configured language ONE AT A TIME\r\n   (strictly sequential, never parallel).\r\n\r\n   Pipeline (AI never writes full HTML):\r\n     1. Extract translatable text (text nodes + title/alt/\r\n        placeholder/aria-label/meta-description) from the\r\n        source HTML into a JSON segment array. Free, exact.\r\n     2. Per language, one AI call (chunked if huge) that\r\n        returns translated JSON segments with the same ids.\r\n     3. The tool rebuilds each language HTML by walking the\r\n        original DOM and swapping the text in place - the\r\n        markup is copied, not regenerated.\r\n\r\n   Everything is stored in tool.setValue() = the one CMS\r\n   object this tool instance lives on.\r\n\r\n   Entry point: tool.onReady\r\n   ============================================================ */\r\n(function () {\r\n  \"use strict\";\r\n\r\n  /* ---- SDK handle + fallback shim ---- */\r\n  var tool = (typeof window !== \"undefined\" && window.tool) ? window.tool : null;\r\n  if (!tool) {\r\n    var fallbackValue = null;\r\n    tool = {\r\n      onReady: function (cb) { cb(fallbackValue, {}); },\r\n      getValue: function () { return fallbackValue; },\r\n      setValue: function (value) { fallbackValue = value; },\r\n      onValueChange: function () {}, getFields: function () { return {}; },\r\n      watchField: function () {}, setField: function () {}, setFields: function () {},\r\n      onFieldsChange: function () {},\r\n      param: function (name, defaultValue) { return defaultValue; },\r\n      isReadOnly: function () { return false; },\r\n      onReadonlyChange: function () {}, getUser: function () { return null; },\r\n      onUserChange: function () {}, reportValid: function () {},\r\n      notify: function (message, severity) { try { console.log(\"notify:\", message); } catch (e) {} },\r\n      resize: function () {}, declareOutput: function () {}, declareParams: function () {},\r\n      reportMissingParams: function () {},\r\n      getPermittedUsers: function () { return []; }, onPermittedUsersChange: function () {},\r\n      requestAI: function (prompt, context, cb) { cb(\"requestAI not available\", null); },\r\n      requestSave: function (cb) { cb(\"requestSave not available\", false); }\r\n    };\r\n  }\r\n\r\n  /* ---- Constants ---- */\r\n  var HBT_SKIP_TAGS = {\r\n    script: 1, style: 1, noscript: 1, template: 1, svg: 1, math: 1,\r\n    iframe: 1, object: 1, embed: 1, code: 1, kbd: 1, samp: 1, textarea: 1\r\n  };\r\n  var HBT_TRANSLATABLE_ATTRIBUTES = [\"title\", \"alt\", \"placeholder\", \"aria-label\"];\r\n  var HBT_MAX_CHUNK_CHARS = 150000;\r\n  var HBT_IDENTITY_POLL_DELAYS = [400, 1200, 2600, 5000];\r\n  var HBT_QUICK_LANGUAGES = [\r\n    \"English\", \"French\", \"German\", \"Spanish\", \"Italian\", \"Portuguese\", \"Dutch\",\r\n    \"Turkish\", \"Arabic\", \"Russian\", \"Ukrainian\", \"Polish\", \"Greek\", \"Swedish\",\r\n    \"Chinese (Simplified)\", \"Japanese\", \"Korean\", \"Hindi\", \"Hebrew\", \"Persian\"\r\n  ];\r\n  var HBT_SAMPLE_DOCUMENT_HTML = [\r\n    '<div class=\"hero\">',\r\n    '  <h1>Welcome to GreenLeaf Gardens<\/h1>',\r\n    '  <p>Organic produce delivered fresh to your door every week.<\/p>',\r\n    '  <a href=\"/order\" title=\"Start your order\">Order Now<\/a>',\r\n    '  <img src=\"banner.jpg\" alt=\"A basket of fresh vegetables\">',\r\n    '<\/div>',\r\n    '<section class=\"features\">',\r\n    '  <h2>Why choose us<\/h2>',\r\n    '  <ul>',\r\n    '    <li>Certified organic since 2008<\/li>',\r\n    '    <li>Free delivery on orders over $50<\/li>',\r\n    '    <li>Cancel or pause your plan anytime<\/li>',\r\n    '  <\/ul>',\r\n    '  <p>Join more than 12,000 happy customers.<\/p>',\r\n    '  <button type=\"button\">Subscribe today<\/button>',\r\n    '  <form>',\r\n    '    <input type=\"text\" placeholder=\"Enter your email address\">',\r\n    '    <button type=\"submit\">Sign Up<\/button>',\r\n    '  <\/form>',\r\n    '<\/section>'\r\n  ].join(\"\\n\");\r\n\r\n  /* ---- State ---- */\r\n  var DB = null;                 // normalized saved value\r\n  var _extraction = null;        // { segments, stats, dedupeOn } for DB.source.html\r\n  var _running = false;\r\n  var _cancelRequested = false;\r\n  var _queue = [];               // languages still to translate in the current run\r\n  var _runStatusText = \"\";\r\n  var _user = null;\r\n  var _noIdentity = false;\r\n  var _readOnly = false;\r\n  var _identityPollAttempts = 0;\r\n  var _lastStagedJson = \"\";\r\n  var _persistTimer = null;\r\n  var _warnedRequestSave = false;\r\n  var _resetArmed = false;\r\n  var _resetArmTimer = null;\r\n\r\n  /* ============================================================\r\n     Helpers\r\n     ============================================================ */\r\n  function el(id) { return document.getElementById(id); }\r\n  function escHtml(text) {\r\n    return String(text == null ? \"\" : text).replace(/[&<>\"']/g, function (ch) {\r\n      return { \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[ch];\r\n    });\r\n  }\r\n  function nowISO() { return new Date().toISOString(); }\r\n  function fo <script>

    if (!shotsView.classList.contains('visible')) return;
    if (event.key === 'ArrowLeft') showShot(currentShotIndex - 1);
    if (event.key === 'ArrowRight') showShot(currentShotIndex + 1);
    if (event.key === 'Escape') { shotsView.classList.remove('visible'); frame.style.display = ''; if (openButton) openButton.style.display = ''; }
  });

  function activateItem(activeItem) {
    navItems.forEach(function (item) { item.classList.toggle('active', item === activeItem); });
  }

  function showCodePane(kind) {
    var entry = codePayload[kind];
    currentCodeKind = kind;
    codeView.classList.add('visible');
    shotsView.classList.remove('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    if (!entry) {
      codeTitle.textContent = kind.toUpperCase() + ' code';
      codeMeta.textContent = 'no ' + kind + ' file in the app folder';
      codeElement.textContent = '';
      return;
    }
    codeTitle.textContent = entry.name;
    var lineCount = entry.content ? entry.content.split('\n').length : 0;
    codeMeta.textContent = lineCount + ' lines - ' + (entry.content ? entry.content.length : 0) + ' characters';
    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {
      showCodePane(item.getAttribute('data-doc').slice(5));
    } else {
      showDocumentPane(item);
    }
    try { window.location.hash = 'doc=' + item.getAttribute('data-doc'); } catch (error) { /* ignore */ }
  }

  navItems.forEach(function (item) {
    item.addEventListener('click', function () { openItem(item); });
  });

  if (openButton) {
    openButton.addEventListener('click', function () {
      var fullUrl = new URL(currentSource, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  if (codeCopyButton) {
    codeCopyButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      var text = entry && entry.content ? entry.content : '';
      if (!text) return;
      function markCopied() {
        codeCopyButton.textContent = 'Copied ✓';
        codeCopyButton.classList.add('copied');
        setTimeout(function () {
          codeCopyButton.textContent = 'Copy code';
          codeCopyButton.classList.remove('copied');
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function () { fallbackCopy(text, markCopied); });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
</body>
</html>
