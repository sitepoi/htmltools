<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookkeeper Task Manager - Test Harness</title>
<link rel="stylesheet" href="BookkeeperTaskManager.css">
<style>
body { margin: 0; padding-top: 34px !important; }
#app-container { min-height: calc(100vh - 34px); }
#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #0f172a; color: #e6edf5; font-family: system-ui; font-size: 11px; padding: 5px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#th-bar strong { color: #2dd4bf; letter-spacing: 0.5px; }
#th-bar .sep { color: #475569; }
#th-bar button { border: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; font-family: system-ui; font-weight: 600; }
#th-bar .btn-load { background: #0d9488; color: #fff; }
#th-bar .btn-clear { background: #dc2626; color: #fff; }
#th-bar .btn-reload { background: #16a34a; color: #fff; }
#th-bar .btn-ro { background: #d97706; color: #fff; }
#th-bar .btn-role { background: #7c3aed; color: #fff; }
#th-bar .btn-dump { background: #2563eb; color: #fff; }
#th-bar .hint { color: #64748b; font-size: 10px; }
#th-toasts { position: fixed; right: 14px; bottom: 14px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; font-family: system-ui; font-size: 12px; }
#th-toasts div { background: #1f2937; color: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="th-bar">
  <strong>TEST HARNESS - Bookkeeper Task Manager</strong><span class="sep">|</span>
  <button class="btn-load" id="th-load">Load Sample Data</button>
  <button class="btn-clear" id="th-clear">Clear</button>
  <button class="btn-reload" id="th-reload">Reload</button>
  <button class="btn-ro" id="th-ro">Read-Only: Off</button>
  <button class="btn-role" id="th-role">Role: Admin</button>
  <button class="btn-dump" id="th-dump">DB Dump</button>
  <span class="sep">|</span>
  <span class="hint">Ctrl+Shift+R = toggle read-only</span>
  <span class="sep">|</span>
  <span class="hint">Ctrl+Shift+D = DB dump</span>
</div>

<div id="app-container"></div>
<div id="th-toasts"></div>

<script>
/* ---- Mock tool SDK (setValue-only persistence) ---- */
(function () {
  var STORAGE_KEY = "bkt_test_db";
  var listeners = { valueChange: [], readonlyChange: [], userChange: [] };
  var _value = null;
  var _readOnly = false;
  var _roleIndex = 0;

  var USERS = [
    { id: "u-admin", name: "Sarah Chen", email: "sarah@example.org", roles: ["admin"] },
    { id: "u-book", name: "Michael Reed", email: "michael@example.org", roles: ["editor"] },
    { id: "u-view", name: "Alice Lee", email: "alice@example.org", roles: ["viewer"] },
    null
  ];
  var ROLE_LABELS = ["Admin", "Bookkeeper", "Viewer", "No Session"];
  var _user = USERS[0];

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch (error) { _value = null; }
  }

  function save(value) {
    _value = value;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch (error) {}
  }

  function pad2(value) { return value < 10 ? "0" + value : String(value); }
  function isoOfDate(dateObject) { return dateObject.getFullYear() + "-" + pad2(dateObject.getMonth() + 1) + "-" + pad2(dateObject.getDate()); }
  function addDaysIso(isoString, dayCount) {
    var parts = isoString.split("-");
    var dateObject = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    dateObject.setDate(dateObject.getDate() + dayCount);
    return isoOfDate(dateObject);
  }

  function toast(message) {
    var container = document.getElementById("th-toasts");
    var item = document.createElement("div");
    item.textContent = message;
    container.appendChild(item);
    setTimeout(function () { if (item.parentNode) item.parentNode.removeChild(item); }, 2600);
  }

  function buildSampleDatabase() {
    var today = isoOfDate(new Date());
    var now = new Date().toISOString();
    var database = {
      version: 1,
      year: parseInt(today.slice(0, 4), 10),
      definitions: [
        { id: "seed-01", title: "Record cash receipts and payments", category: "cash", taskType: "regular", frequency: "daily", dayOfWeek: 0, dayOfMonth: 1, monthOfYear: 12, dueDate: "", priority: "high", note: "Record cash collections against receipts on the same day.", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-02", title: "Process incoming invoices", category: "payables", taskType: "regular", frequency: "daily", dayOfWeek: 0, dayOfMonth: 1, monthOfYear: 12, dueDate: "", priority: "medium", note: "", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-03", title: "Update task statuses", category: "tracking", taskType: "regular", frequency: "daily", dayOfWeek: 0, dayOfMonth: 1, monthOfYear: 12, dueDate: "", priority: "low", note: "", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-04", title: "Weekly pledge report", category: "cash", taskType: "regular", frequency: "weekly", dayOfWeek: 0, dayOfMonth: 1, monthOfYear: 12, dueDate: "", priority: "medium", note: "Prepare the weekly pledge report and share it with the groups.", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-05", title: "Enter work hours", category: "tracking", taskType: "regular", frequency: "weekly", dayOfWeek: 4, dayOfMonth: 1, monthOfYear: 12, dueDate: "", priority: "medium", note: "", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-10", title: "Bank account reconciliation", category: "reconciliation", taskType: "regular", frequency: "monthly", dayOfWeek: 0, dayOfMonth: 5, monthOfYear: 12, dueDate: "", priority: "high", note: "Compare all bank accounts with statements every month.", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-11", title: "Credit card reconciliation", category: "reconciliation", taskType: "regular", frequency: "monthly", dayOfWeek: 0, dayOfMonth: 5, monthOfYear: 12, dueDate: "", priority: "high", note: "", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-12", title: "Monthly financial statements", category: "reporting", taskType: "regular", frequency: "monthly", dayOfWeek: 0, dayOfMonth: 8, monthOfYear: 12, dueDate: "", priority: "high", note: "", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-16", title: "GST/HST return", category: "payroll", taskType: "regular", frequency: "quarterly", dayOfWeek: 0, dayOfMonth: 15, monthOfYear: 12, dueDate: "", priority: "high", note: "", createdAt: now, createdBy: "Sarah Chen" },
        { id: "seed-20", title: "Year-end closing", category: "yearend", taskType: "regular", frequency: "yearly", dayOfWeek: 0, dayOfMonth: 31, monthOfYear: 12, dueDate: "", priority: "high", note: "", createdAt: now, createdBy: "Sarah Chen" },
        { id: "ad-01", title: "Board request: purchase a printer", category: "purchases", taskType: "adHoc", frequency: "", dayOfWeek: 0, dayOfMonth: 1, monthOfYear: 12, dueDate: addDaysIso(today, -1), priority: "high", note: "Purchase after approval and record it.", createdAt: now, createdBy: "Sarah Chen" },
        { id: "ad-02", title: "Audit document preparation", category: "yearend", taskType: "adHoc", frequency: "", dayOfWeek: 0, dayOfMonth: 1, monthOfYear: 12, dueDate: addDaysIso(today, 5), priority: "medium", note: "", createdAt: now, createdBy: "Sarah Chen" }
      ],
      statuses: {},
      requests: {},
      ui: { tab: "board", scope: "week", statusFilter: "all", category: "all", search: "" }
    };
    function entry(status, actor) {
      var entryObject = { status: status, updatedAt: now, updatedBy: actor, log: [{ status: status, at: now, by: actor }] };
      if (status === "done") { entryObject.completedAt = now; entryObject.completedBy = actor; }
      return entryObject;
    }
    var thisMonth = today.slice(0, 8);
    database.statuses["seed-01|" + today] = entry("done", "Michael Reed");
    database.statuses["seed-02|" + today] = entry("inProgress", "Michael Reed");
    database.statuses["seed-01|" + addDaysIso(today, -1)] = entry("pending", "");
    database.statuses["seed-02|" + addDaysIso(today, -2)] = entry("done", "Michael Reed");
    database.statuses["seed-04|" + today] = entry("inProgress", "Michael Reed");
    database.statuses["seed-10|" + thisMonth + "05"] = entry("done", "Michael Reed");
    database.statuses["seed-11|" + thisMonth + "05"] = entry("done", "Sarah Chen");
    database.statuses["seed-03|" + today] = entry("pending", "");
    database.requests["req-1"] = {
      id: "req-1",
      taskKey: "ad-01|" + addDaysIso(today, -1),
      title: "Board request: purchase a printer",
      dueDate: addDaysIso(today, -1),
      type: "approval",
      message: "Please approve purchasing this printer before I proceed with the vendor.",
      status: "open",
      createdAt: now,
      createdBy: "Michael Reed",
      response: "",
      respondedAt: "",
      respondedBy: ""
    };
    database.requests["req-2"] = {
      id: "req-2",
      taskKey: "seed-12|" + thisMonth + "08",
      title: "Monthly financial statements",
      dueDate: thisMonth + "08",
      type: "information",
      message: "I need the department split for the income report before I can complete it.",
      status: "open",
      createdAt: now,
      createdBy: "Michael Reed",
      response: "",
      respondedAt: "",
      respondedBy: ""
    };
    database.requests["req-3"] = {
      id: "req-3",
      taskKey: "seed-10|" + thisMonth + "05",
      title: "Bank account reconciliation",
      dueDate: thisMonth + "05",
      type: "information",
      message: "Which accounts should I reconcile first?",
      status: "answered",
      createdAt: now,
      createdBy: "Michael Reed",
      response: "Start with the chequing account.",
      respondedAt: now,
      respondedBy: "Sarah Chen"
    };
    return database;
  }

  var tool = {
    onReady: function (callback) { load(); _readyCallback = callback; fireReady(); },
    getValue: function () { return _value; },
    setValue: function (value) {
      save(value);
      listeners.valueChange.forEach(function (listener) { try { listener(value); } catch (error) {} });
    },
    onValueChange: function (callback) { listeners.valueChange.push(callback); },
    getFields: function () { return {}; },
    watchField: function () {},
    setField: function () {},
    setFields: function () {},
    onFieldsChange: function () {},
    param: function (name, defaultValue) { return defaultValue; },
    isReadOnly: function () { return _readOnly; },
    onReadonlyChange: function (callback) { listeners.readonlyChange.push(callback); },
    getUser: function () { return _user; },
    onUserChange: function (callback) { listeners.userChange.push(callback); },
    getPermittedUsers: function () { return []; },
    onPermittedUsersChange: function () {},
    reportValid: function () {},
    notify: function (message, severity) { toast((severity || "") + ": " + message); },
    resize: function () {},
    declareOutput: function () {},
    declareParams: function () {},
    reportMissingParams: function () {},
    requestSave: function (callback) { if (callback) callback(null, true); },
    openUrl: function () {},
    openObjectDetail: function () {},
    _toggleReadOnly: function () {
      _readOnly = !_readOnly;
      document.getElementById("th-ro").textContent = "Read-Only: " + (_readOnly ? "On" : "Off");
      listeners.readonlyChange.forEach(function (listener) { try { listener(_readOnly); } catch (error) {} });
    },
    _cycleRole: function () {
      _roleIndex = (_roleIndex + 1) % USERS.length;
      _user = USERS[_roleIndex];
      document.getElementById("th-role").textContent = "Role: " + ROLE_LABELS[_roleIndex];
      listeners.userChange.forEach(function (listener) { try { listener(_user); } catch (error) {} });
    },
    _loadSample: function () {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSampleDatabase()));
      location.reload();
    },
    _clear: function () {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    },
    _dump: function () {
      console.log("=== BOOKKEEPER DB DUMP ===");
      console.log(JSON.stringify(_value, null, 2));
      toast("DB dumped to console");
    }
  };

  var _readyCallback = null;
  function fireReady() {
    if (_readyCallback && document.getElementById("app-container")) {
      var callback = _readyCallback;
      _readyCallback = null;
      callback(_value, {});
    }
  }

  window.tool = tool;
  window.__fireThReady = fireReady;

  /* QA query params: ?sample=1 preloads sample data, ?role=bookkeeper|admin|viewer presets the user,
     ?scope=today|week|month and ?tab=board|year|defs preset the view */
  try {
    var queryString = location.search || "";
    if (/[?&]sample=1/.test(queryString)) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSampleDatabase()));
    }
    var viewPreset = {};
    if (/[?&]scope=/.test(queryString)) {
      var scopeMatch = queryString.match(/[?&]scope=([a-z]+)/);
      if (scopeMatch) viewPreset.scope = scopeMatch[1];
    }
    if (/[?&]tab=/.test(queryString)) {
      var tabMatch = queryString.match(/[?&]tab=([a-z]+)/);
      if (tabMatch) viewPreset.tab = tabMatch[1];
    }
    if (Object.keys(viewPreset).length) {
      var storedDatabase = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || { ui: {} };
      storedDatabase.ui = storedDatabase.ui || {};
      if (viewPreset.scope) storedDatabase.ui.scope = viewPreset.scope;
      if (viewPreset.tab) storedDatabase.ui.tab = viewPreset.tab;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(storedDatabase));
    }
    if (/[?&]role=bookkeeper/.test(queryString)) { _user = USERS[1]; _roleIndex = 1; }
    if (/[?&]role=admin/.test(queryString)) { _user = USERS[0]; _roleIndex = 0; }
    if (/[?&]role=viewer/.test(queryString)) { _user = USERS[2]; _roleIndex = 2; }
  } catch (error) {}
  var roleButton = document.getElementById("th-role");
  if (roleButton) roleButton.textContent = "Role: " + ROLE_LABELS[_roleIndex];
})();
</script>

<script>
/* ---- Inline tool HTML (generated placeholder) ---- */

pan>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-filter-row\">\r\n        \u003cinput type=\"search\" id=\"bktSearch\" class=\"bkt-search\" placeholder=\"Search tasks...\">\r\n        \u003cselect id=\"bktCatFilter\" class=\"bkt-select\">\u003c/select>\r\n        \u003cselect id=\"bktStatusFilter\" class=\"bkt-select\">\u003c/select>\r\n      \u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cdiv class=\"bkt-pane\" id=\"bktPaneBoard\">\r\n      \u003cdiv class=\"bkt-section\" id=\"bktApprovalSection\" style=\"display:none\">\r\n        \u003cdiv class=\"bkt-section-head\">\r\n          \u003cspan class=\"bkt-section-title\">Open Requests\u003c/span>\r\n          \u003cspan class=\"bkt-section-badge\" id=\"bktApprovalCount\">0\u003c/span>\r\n        \u003c/div>\r\n        \u003cdiv id=\"bktApprovalList\">\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-section\" id=\"bktOverdueSection\" style=\"display:none\">\r\n        \u003cdiv class=\"bkt-section-head\">\u003cspan class=\"bkt-section-title\">Overdue\u003c/span>\u003c/div>\r\n        \u003cdiv id=\"bktOverdueList\">\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-section\" id=\"bktBoardSection\">\r\n        \u003cdiv class=\"bkt-section-head\">\r\n          \u003cspan class=\"bkt-section-title\" id=\"bktBoardTitle\">Tasks\u003c/span>\r\n          \u003cspan class=\"bkt-section-sub\" id=\"bktBoardSub\">\u003c/span>\r\n        \u003c/div>\r\n        \u003cdiv id=\"bktBoardList\">\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-empty\" id=\"bktBoardEmpty\" style=\"display:none\">\u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cdiv class=\"bkt-pane\" id=\"bktPaneDashboard\" style=\"display:none\">\r\n      \u003cdiv class=\"bkt-empty\" id=\"bktDashEmpty\" style=\"display:none\">\u003c/div>\r\n      \u003cdiv id=\"bktDashContent\">\r\n        \u003cdiv class=\"bkt-section\">\r\n          \u003cdiv class=\"bkt-section-head\">\r\n            \u003cspan class=\"bkt-section-title\">Summary\u003c/span>\r\n            \u003cspan class=\"bkt-section-sub\" id=\"bktDashSummaryLabel\">\u003c/span>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-dash-cards\" id=\"bktDashCards\">\u003c/div>\r\n        \u003c/div>\r\n        \u003cdiv class=\"bkt-section\">\r\n          \u003cdiv class=\"bkt-section-head bkt-dash-month-head\">\r\n            \u003cspan class=\"bkt-section-title\">Monthly Breakdown\u003c/span>\r\n            \u003cdiv class=\"bkt-scope-row\" id=\"bktDashMonthChips\">\u003c/div>\r\n          \u003c/div>\r\n          \u003cdiv id=\"bktDashMonthTable\">\u003c/div>\r\n        \u003c/div>\r\n        \u003cdiv class=\"bkt-dash-grid\">\r\n          \u003cdiv class=\"bkt-section\">\r\n            \u003cdiv class=\"bkt-section-head\">\r\n              \u003cspan class=\"bkt-section-title\">Month-by-Month Completion\u003c/span>\r\n              \u003cspan class=\"bkt-section-sub\" id=\"bktDashYearLabel\">\u003c/span>\r\n            \u003c/div>\r\n            \u003cdiv class=\"bkt-chart\" id=\"bktDashMonthChart\">\u003c/div>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-section\">\r\n            \u003cdiv class=\"bkt-section-head\">\u003cspan class=\"bkt-section-title\">By Category\u003c/span>\u003c/div>\r\n            \u003cdiv id=\"bktDashCategories\">\u003c/div>\r\n          \u003c/div>\r\n        \u003c/div>\r\n        \u003cdiv class=\"bkt-dash-grid\">\r\n          \u003cdiv class=\"bkt-section\">\r\n            \u003cdiv class=\"bkt-section-head\">\u003cspan class=\"bkt-section-title\">Recent Activity\u003c/span>\u003c/div>\r\n            \u003cdiv id=\"bktDashActivity\">\u003c/div>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-section\">\r\n            \u003cdiv class=\"bkt-section-head\">\u003cspan class=\"bkt-section-title\">Routine vs Ad-hoc\u003c/span>\u003c/div>\r\n            \u003cdiv class=\"bkt-split-row\" id=\"bktDashSplit\">\u003c/div>\r\n          \u003c/div>\r\n        \u003c/div>\r\n      \u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cdiv class=\"bkt-pane\" id=\"bktPaneYear\" style=\"display:none\">\r\n      \u003cdiv id=\"bktYearList\">\u003c/div>\r\n      \u003cdiv class=\"bkt-empty\" id=\"bktYearEmpty\" style=\"display:none\">\u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cdiv class=\"bkt-pane\" id=\"bktPaneDefs\" style=\"display:none\">\r\n      \u003cdiv class=\"bkt-def-actions\">\r\n        \u003cbutton class=\"bkt-btn bkt-btn-primary\" id=\"bktBtnNewDef\">+ New Task\u003c/button>\r\n        \u003cbutton class=\"bkt-btn bkt-btn-outline\" id=\"bktBtnSeed\">Load Default Tasks\u003c/button>\r\n        \u003cspan class=\"bkt-def-hint\">Task definitions can only be edited by administrators. Tasks on the board are generated automatically from these definitions.\u003c/span>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-section\">\r\n        \u003cdiv class=\"bkt-section-head\">\r\n          \u003cspan class=\"bkt-section-title\">Routine Tasks\u003c/span>\r\n          \u003cspan class=\"bkt-section-sub\" id=\"bktDefsRegularCount\">\u003c/span>\r\n        \u003c/div>\r\n        \u003cdiv id=\"bktDefsRegular\">\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-section\">\r\n        \u003cdiv class=\"bkt-section-head\">\r\n          \u003cspan class=\"bkt-section-title\">Ad-hoc Tasks\u003c/span>\r\n          \u003cspan class=\"bkt-section-sub\" id=\"bktDefsAdhocCount\">\u003c/span>\r\n        \u003c/div>\r\n        \u003cdiv id=\"bktDefsAdhoc\">\u003c/div>\r\n      \u003c/div>\r\n    \u003c/div>\r\n\r\n  \u003c/div>\r\n\r\n  \u003cdiv class=\"bkt-modal-overlay\" id=\"bktDefModal\" style=\"display:none\">\r\n    \u003cdiv class=\"bkt-modal\">\r\n      \u003cdiv class=\"bkt-modal-head\">\r\n        \u003ch3 id=\"bktDefModalTitle\">New Task\u003c/h3>\r\n        \u003cbutton class=\"bkt-icon-btn\" id=\"bktDefClose\" aria-label=\"Close\">×\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-body\">\r\n        \u003cdiv class=\"bkt-form-grid\">\r\n          \u003cdiv class=\"bkt-field bkt-field-full\">\r\n            \u003clabel for=\"bktDefTitle\">Task Name \u003cspan class=\"bkt-req\">*\u003c/span>\u003c/label>\r\n            \u003cinput type=\"text\" id=\"bktDefTitle\" maxlength=\"160\" placeholder=\"e.g. Bank account reconciliation\">\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-full\">\r\n            \u003clabel for=\"bktDefCategory\">Kategori\u003c/label>\r\n            \u003cselect id=\"bktDefCategory\">\u003c/select>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-full\">\r\n            \u003clabel>Task Type\u003c/label>\r\n            \u003cdiv class=\"bkt-radio-row\">\r\n              \u003clabel class=\"bkt-radio\">\u003cinput type=\"radio\" name=\"bktDefType\" id=\"bktDefTypeRegular\" checked> Routine (recurring)\u003c/label>\r\n              \u003clabel class=\"bkt-radio\">\u003cinput type=\"radio\" name=\"bktDefType\" id=\"bktDefTypeAdhoc\"> Ad-hoc (one-off)\u003c/label>\r\n            \u003c/div>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-full\" id=\"bktDefFreqRow\">\r\n            \u003clabel for=\"bktDefFreq\">Frequency\u003c/label>\r\n            \u003cselect id=\"bktDefFreq\">\u003c/select>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-half\" id=\"bktDefWeekdayRow\">\r\n            \u003clabel for=\"bktDefWeekday\">Weekday\u003c/label>\r\n            \u003cselect id=\"bktDefWeekday\">\u003c/select>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-half\" id=\"bktDefDayRow\">\r\n            \u003clabel for=\"bktDefDay\">Day of Month\u003c/label>\r\n            \u003cinput type=\"number\" id=\"bktDefDay\" min=\"1\" max=\"31\" value=\"1\">\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-half\" id=\"bktDefMonthRow\">\r\n            \u003clabel for=\"bktDefMonth\">Month\u003c/label>\r\n            \u003cselect id=\"bktDefMonth\">\u003c/select>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-half\" id=\"bktDefDueRow\">\r\n            \u003clabel for=\"bktDefDueDate\">Date \u003cspan class=\"bkt-req\">*\u003c/span>\u003c/label>\r\n            \u003cinput type=\"date\" id=\"bktDefDueDate\">\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-half\">\r\n            \u003clabel for=\"bktDefPriority\">Priority\u003c/label>\r\n            \u003cselect id=\"bktDefPriority\">\u003c/select>\r\n          \u003c/div>\r\n          \u003cdiv class=\"bkt-field bkt-field-full\">\r\n            \u003clabel for=\"bktDefNote\">Description / Instructions\u003c/label>\r\n            \u003ctextarea id=\"bktDefNote\" rows=\"3\" placeholder=\"Short description of how to do this task...\">\u003c/textarea>\r\n          \u003c/div>\r\n        \u003c/div>\r\n        \u003cdiv class=\"bkt-form-error\" id=\"bktDefError\" style=\"display:none\">\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-actions\">\r\n        \u003cbutton class=\"bkt-btn bkt-btn-primary\" id=\"bktDefSave\">Save\u003c/button>\r\n        \u003cbutton class=\"bkt-btn bkt-btn-ghost\" id=\"bktDefCancel\">Cancel\u003c/button>\r\n        \u003cbutton class=\"bkt-btn bkt-btn-danger bkt-btn-right\" id=\"bktDefDelete\" style=\"display:none\">Delete\u003c/button>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\r\n  \u003cdiv class=\"bkt-modal-overlay\" id=\"bktNoteModal\" style=\"display:none\">\r\n    \u003cdiv class=\"bkt-modal bkt-modal-sm\">\r\n      \u003cdiv class=\"bkt-modal-head\">\r\n        \u003ch3>Note\u003c/h3>\r\n        \u003cbutton class=\"bkt-icon-btn\" id=\"bktNoteClose\" aria-label=\"Close\">×\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-body\">\r\n        \u003cdiv class=\"bkt-note-context\" id=\"bktNoteContext\">\u003c/div>\r\n        \u003ctextarea id=\"bktNoteText\" rows=\"4\" placeholder=\"Note about this task...\" style=\"width:100%;border:1.5px solid #d5d8dc;border-radius:8px;padding:8px 12px;font-size:13.5px;resize:vertical;min-height:84px\">\u003c/textarea>\r\n        \u003cdiv class=\"bkt-log\">\r\n          \u003cdiv class=\"bkt-log-title\">History\u003c/div>\r\n          \u003cdiv id=\"bktNoteLog\">\u003c/div>\r\n        \u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-actions\">\r\n        \u003cbutton class=\"bkt-btn bkt-btn-primary\" id=\"bktNoteSave\">Save\u003c/button>\r\n        \u003cbutton class=\"bkt-btn bkt-btn-ghost\" id=\"bktNoteCancel\">Close\u003c/button>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\r\n  \u003cdiv class=\"bkt-modal-overlay\" id=\"bktAdminModal\" style=\"display:none\">\r\n    \u003cdiv class=\"bkt-modal bkt-modal-sm\">\r\n      \u003cdiv class=\"bkt-modal-head\">\r\n        \u003ch3>Respond to Request\u003c/h3>\r\n        \u003cbutton class=\"bkt-icon-btn\" id=\"bktAdminClose\" aria-label=\"Close\">×\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-body\">\r\n        \u003cdiv class=\"bkt-note-context\" id=\"bktAdminContext\">\u003c/div>\r\n        \u003cselect id=\"bktResponseStatus\" style=\"width:100%;border:1.5px solid #d5d8dc;border-radius:8px;padding:8px 12px;font-size:13.5px;margin-bottom:8px\">\u003c/select>\r\n        \u003ctextarea id=\"bktAdminText\" rows=\"3\" placeholder=\"Your response / reason (optional)...\" style=\"width:100%;border:1.5px solid #d5d8dc;border-radius:8px;padding:8px 12px;font-size:13.5px;resize:vertical;min-height:72px\">\u003c/textarea>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-actions\">\r\n        \u003cbutton class=\"bkt-btn bkt-btn-primary\" id=\"bktAdminSave\">Submit Response\u003c/button>\r\n        \u003cbutton class=\"bkt-btn bkt-btn-ghost\" id=\"bktAdminCancel\">Cancel\u003c/button>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\r\n  \u003cdiv class=\"bkt-modal-overlay\" id=\"bktRequestModal\" style=\"display:none\">\r\n    \u003cdiv class=\"bkt-modal\">\r\n      \u003cdiv class=\"bkt-modal-head\">\r\n        \u003ch3>Task Requests\u003c/h3>\r\n        \u003cbutton class=\"bkt-icon-btn\" id=\"bktRequestClose\" aria-label=\"Close\">×\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-body\">\r\n        \u003cdiv class=\"bkt-note-context\" id=\"bktRequestContext\">\u003c/div>\r\n        \u003cdiv id=\"bktRequestList\">\u003c/div>\r\n        \u003cdiv class=\"bkt-req-form\" id=\"bktRequestForm\">\r\n          \u003cdiv class=\"bkt-req-form-title\">New Request\u003c/div>\r\n          \u003cselect id=\"bktRequestType\">\r\n            \u003coption value=\"approval\">Approval Request - I need authorization (e.g. make a payment)\u003c/option>\r\n            \u003coption value=\"information\">Information Request - I need details to complete this\u003c/option>\r\n          \u003c/select>\r\n          \u003ctextarea id=\"bktRequestText\" rows=\"3\" placeholder=\"What do you need? Example: please approve this payment before I proceed...\">\u003c/textarea>\r\n          \u003cbutton class=\"bkt-btn bkt-btn-primary\" id=\"bktRequestSubmit\">Submit Request\u003c/button>\r\n        \u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-actions\">\r\n        \u003cbutton class=\"bkt-btn bkt-btn-ghost\" id=\"bktRequestCancel\">Close\u003c/button>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\r\n  \u003cdiv class=\"bkt-modal-overlay\" id=\"bktConfirmModal\" style=\"display:none\">\r\n    \u003cdiv class=\"bkt-modal bkt-modal-sm\">\r\n      \u003cdiv class=\"bkt-modal-head\">\r\n        \u003ch3>Confirm\u003c/h3>\r\n        \u003cbutton class=\"bkt-icon-btn\" id=\"bktConfirmClose\" aria-label=\"Close\">×\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-body\">\r\n        \u003cp id=\"bktConfirmMsg\" style=\"font-size:13.5px\">Are you sure?\u003c/p>\r\n      \u003c/div>\r\n      \u003cdiv class=\"bkt-modal-actions\">\r\n        \u003cbutton class=\"bkt-btn bkt-btn-danger\" id=\"bktConfirmYes\">Yes\u003c/button>\r\n        \u003cbutton class=\"bkt-btn bkt-btn-ghost\" id=\"bktConfirmNo\">Cancel\u003c/button>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\r\n\u003c/div>\r\n";

/* ---- Harness controls ---- */
document.getElementById("th-load").addEventListener("click", function () { window.tool._loadSample(); });
document.getElementById("th-clear").addEventListener("click", function () { window.tool._clear(); });
document.getElementById("th-reload").addEventListener("click", function () { location.reload(); });
document.getElementById("th-ro").addEventListener("click", function () { window.tool._toggleReadOnly(); });
document.getElementById("th-role").addEventListener("click", function () { window.tool._cycleRole(); });
document.getElementById("th-dump").addEventListener("click", function () { window.tool._dump(); });
