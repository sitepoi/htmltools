<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Paced Learning — Test Harness</title>
<link rel="stylesheet" href="SelfPacedEducationBySection.css">
<style>
body { padding-top: 28px !important; margin: 0; background: #f8fafc; }
#app { min-height: calc(100vh - 28px); }
#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #0f172a; color: #e6edf5; font-family: system-ui; font-size: 11px; padding: 4px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#th-bar strong { color: #2dd4bf; }
#th-bar .sep { color: #475569; }
#th-bar button { border: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; font-family: system-ui; font-weight: 600; }
#th-bar .btn-load { background: #0d9488; color: #fff; }
#th-bar .btn-clear { background: #dc2626; color: #fff; }
#th-bar .btn-reload { background: #16a34a; color: #fff; }
#th-bar .hint { color: #64748b; font-size: 10px; }
@keyframes toolFadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div id="th-bar">
  <strong>TEST HARNESS — Student Self-Paced Learning</strong><span class="sep">|</span>
  <button class="btn-load" id="th-load-sample">📚 Load Sample Curriculum</button>
  <button class="btn-clear" id="th-clear">Clear Progress</button>
  <button class="btn-reload" id="th-reload">Reload</button>
  <span class="sep">|</span>
  <span id="th-status" class="hint">Ready — Student Mode</span>
</div>

<div id="app">
  <header class="app-header">
    <div class="header-left"><button class="btn-icon" id="btn-back" title="Back" style="display:none">←</button><h1 class="app-title" id="app-title">📚 Self-Paced Learning</h1></div>
    <div class="header-right"><span class="role-badge" id="role-badge"></span></div>
  </header>
  <div class="progress-bar-wrap" id="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar-fill"></div><span class="progress-bar-text" id="progress-bar-text">0% Complete</span></div>
  <div id="view-sections" class="view">
    <div class="toolbar"><input class="search-input" id="search-input" placeholder="🔍 Search sections..."><select class="filter-select" id="filter-status"><option value="all">All Sections</option><option value="not_started">Not Started</option><option value="in_progress">In Progress</option><option value="completed">Completed</option></select></div>
    <div class="section-grid" id="section-group-grid"><div class="empty-state" id="sections-empty"><div class="empty-icon">📖</div><div class="empty-title">No sections available yet</div><div class="empty-desc">A manager needs to add curriculum sections first.</div></div></div>
  </div>
  <div id="view-lessons" class="view" style="display:none">
    <div class="section-info-bar"><span class="section-info-title" id="section-info-title"></span><span class="section-info-progress" id="section-info-progress"></span></div>
    <div class="lesson-list" id="lesson-list"><div class="empty-state" id="lessons-empty"><div class="empty-icon">📝</div><div class="empty-title">No lessons in this section</div><div class="empty-desc">A manager needs to add lessons to this section.</div></div></div>
  </div>
  <div id="view-lesson-detail" class="view" style="display:none">
    <div class="detail-card">
      <div class="detail-header"><h2 class="detail-title" id="detail-title"></h2><span class="detail-badge" id="detail-badge"></span></div>
      <div class="detail-breadcrumb" id="detail-breadcrumb"></div>
      <div class="detail-meta"><span id="detail-estimated"></span><span id="detail-status-label"></span></div>
      <div class="study-flow" id="study-flow"></div>
      <div class="source-links-area" id="source-links-area" style="display:none"><h3 class="source-links-title">📎 Additional Resources</h3><ul class="source-links-list" id="source-links-list"></ul></div>
      <div class="detail-nav"><button class="btn btn-outline" id="btn-prev-lesson" disabled>← Previous</button><div class="detail-nav-center"><button class="btn btn-success" id="btn-mark-complete">✓ Mark Complete</button><button class="btn btn-outline" id="btn-mark-inprogress" style="display:none">📖 Mark In Progress</button></div><button class="btn btn-outline" id="btn-next-lesson" disabled>Next →</button></div>
    </div>
  </div>
  <div class="loading-overlay" id="loading-overlay" style="display:none"><div class="spinner"></div><span>Loading...</span></div>
</div>

<script>
(function() {
  var STORAGE_DATA = 'student_test_data_v2';
  // User with admin role to test setup screen; change to ['worker'] for student view
  var _user = { id: 'u-admin', name: 'Can Öztürk (Admin)', email: 'can@example.com', roles: ['admin'] };

  // Default sample curriculum (simulates what setValue stores in productData)
  var SAMPLE_CURRICULUM = {
    id: 'cur-sample-1',
    contentId: 'cur-sample-1',
    name: 'Sample Curriculum',
    productData: { data_categoriesBased: {
      toolData: { sections: [
      { id: 'sec-fractions', title: 'Fractions Basics', order: 1, lessons: [
        { id: 'les-intro', title: 'Introduction to Fractions', order: 1, estimatedMinutes: 20,
          youtubeUrls: ['https://www.youtube.com/watch?v=dQw4w9WgXcQ'],
          presentationPdfUrls: null, studyDocPdfUrls: null, worksheetPdfUrls: null, answerKeyPdfUrls: null,
          content: '<h2>What Are Fractions?</h2><p>A <strong>fraction</strong> represents a part of a whole.</p><h3>Parts of a Fraction</h3><ul><li><strong>Numerator</strong> — how many parts we have</li><li><strong>Denominator</strong> — total equal parts</li></ul>',
          sourceUrls: [{label:'Khan Academy',url:'https://www.khanacademy.org/'}],
          quiz: [
            {question:'In the fraction 3/4, what is the numerator?',options:['3','4','7','1'],answer:0,difficulty:'easy',explanation_correct:'The top number (3) is the numerator.'},
            {question:'If a pizza has 8 slices and you eat 3, what fraction did you eat?',options:['3/8','8/3','5/8','1/3'],answer:0,difficulty:'easy',explanation_correct:'3 slices out of 8 total = 3/8.'},
            {question:'Which is larger: 1/2 or 1/3?',options:['1/2','1/3','They are equal','Cannot tell'],answer:0,difficulty:'medium',explanation_correct:'Fewer pieces means bigger pieces. 1/2 > 1/3.'},
            {question:'What is 2/6 simplified?',options:['1/3','2/3','1/6','3/6'],answer:0,difficulty:'medium',explanation_correct:'Divide both by 2: 2/6 = 1/3.'},
            {question:'If 3/5 of a class are girls and there are 30 students, how many are girls?',options:['18','12','15','20'],answer:0,difficulty:'hard',explanation_correct:'3/5 × 30 = 90/5 = 18 girls.'}
          ]
        },
        { id: 'les-add', title: 'Adding Fractions', order: 2, estimatedMinutes: 25,
          youtubeUrls: null, presentationPdfUrls: null, studyDocPdfUrls: ['https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'],
          worksheetPdfUrls: null, answerKeyPdfUrls: null,
          content: '<h2>Adding Fractions</h2><h3>Same Denominator</h3><p>Add numerators, keep denominator: 2/7 + 3/7 = <strong>5/7</strong></p><h3>Different Denominators</h3><p>Find common denominator first.</p>',
          sourceUrls: null,
          quiz: [
            {question:'2/5 + 1/5 = ?',options:['3/10','3/5','2/10','1/5'],answer:1,difficulty:'easy',explanation_correct:'2+1=3, keep denominator 5: 3/5.'},
            {question:'1/3 + 1/6 = ?',options:['2/9','1/2','2/6','3/6'],answer:1,difficulty:'medium',explanation_correct:'1/3=2/6, so 2/6+1/6=3/6=1/2.'}
          ]
        }
      ]},
      { id: 'sec-multiply', title: 'Multiplying Fractions', order: 2, lessons: [
        { id: 'les-mult', title: 'Multiplying Fractions', order: 1, estimatedMinutes: 15,
          youtubeUrls: null, presentationPdfUrls: null, studyDocPdfUrls: null, worksheetPdfUrls: null, answerKeyPdfUrls: null,
          content: '<h2>Multiplying Fractions</h2><p>Multiply numerators, multiply denominators: a/b × c/d = (a×c)/(b×d)</p><p>Example: 2/3 × 4/5 = 8/15</p>',
          sourceUrls: [{label:'Math is Fun',url:'https://www.mathsisfun.com/'}],
          quiz: [
            {question:'1/2 × 3/4 = ?',options:['3/8','4/6','3/6','1/8'],answer:0,difficulty:'easy',explanation_correct:'1×3=3, 2×4=8 → 3/8.'},
            {question:'2 × 3/5 = ?',options:['5/5','6/5','3/10','5/3'],answer:1,difficulty:'medium',explanation_correct:'2=2/1, so 2/1×3/5=6/5.'}
          ]
        }
      ]}
    ]}}}
  };

  function loadData() { try { return JSON.parse(localStorage.getItem(STORAGE_DATA)); } catch(e) { return null; } }
  function saveData(v) { try { localStorage.setItem(STORAGE_DATA, JSON.stringify(v)); } catch(e) {} }

  // Pre-populate with default config so curriculum loads instantly (remove to test setup screen)
  var DEFAULT_DATA = {
    config: { curriculumSourceId: 'cur-sample-1', builderFieldName: 'toolData' },
    progress: {}
  };
  if (!localStorage.getItem(STORAGE_DATA)) {
    saveData(DEFAULT_DATA);
  }

  window.tool = {
    getValue: function() { return loadData(); },
    setValue: function(data) { saveData(data); },
    onValueChange: function(cb) { this._onValChange = cb; },
    param: function(name, fallback) {
      if (name === 'builderFieldName') return 'toolData';
      if (name === 'curriculumBuilderAppId') return 'curriculum-builder-uniconbaseapps';
      return (new URLSearchParams(window.location.search)).get(name) || fallback || '';
    },
    isReadOnly: function() { return false; },
    onReadonlyChange: function() {},
    getUser: function() { return _user; },
    onUserChange: function(cb) { this._onUserChange = cb; },
    notify: function(msg, severity) {
      var colors = { info:'#0d9488', success:'#16a34a', warning:'#d97706', error:'#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:'+(colors[severity]||'#333')+';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity='0'; toast.style.transition='opacity .3s'; setTimeout(function(){toast.remove();},300); }, 2500);
    },
    resize: function() {},
    declareParams: function() {},
    reportMissingParams: function() {},
    requestObjects: function(action, params, callback) {
      if (action === 'query') {
        // Return all curriculum objects so contentId filtering works
        setTimeout(function() { callback(null, { objects: [SAMPLE_CURRICULUM] }); }, 100);
      } else if (action === 'get' && params.objectId === 'cur-sample-1') {
        setTimeout(function() { callback(null, { object: SAMPLE_CURRICULUM }); }, 100);
      } else {
        setTimeout(function() { callback('Not found', null); }, 100);
      }
    },
    onReady: function(cb) { cb(loadData(), {}); },
    _setValueChange: function(v) { if (this._onValChange) this._onValChange(v); },
    _loadSample: function() {
      localStorage.removeItem(STORAGE_DATA);
      saveData(DEFAULT_DATA);
      window.location.reload();
    },
    _clear: function() { localStorage.removeItem(STORAGE_DATA); window.location.reload(); }
  };
})();

document.getElementById('th-load-sample').addEventListener('click', function() { window.tool._loadSample(); });
document.getElementById('th-clear').addEventListener('click', function() { if (confirm('Clear all progress?')) window.tool._clear(); });
document.getElementById('th-reload').addEventListener('click', function() { window.location.reload(); });
</script>
<script src="SelfPacedEducationBySection.js"></script>
</body>
</html>
