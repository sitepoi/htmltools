<!-- ═══════════════════════════════════════════════════════
   MOCK TOOL SDK — runs directly on the page (no iframe)
   ═══════════════════════════════════════════════════════ -->
<script>
(function() {
  var STORAGE_KEY = 'staff_permit_test_db';
  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [] };
  var _readOnly = false, _fields = {}, _value = null;
  var _storage = {};

  var _user = { id: 'user-employee-001', name: 'Jane Employee', email: 'employee@example.com', roles: ['employee'], locale: 'en-CA' };

  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { var parsed = JSON.parse(raw); _storage = parsed._storage || {}; _value = parsed._value || null; }
  } catch(e) { _storage = {}; _value = null; }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ _storage: _storage, _value: _value })); } catch(e) {}
  }

  var ROLE_USERS = {
    employee:   { id: 'user-employee-001',   name: 'Jane Employee',    email: 'employee@example.com',    roles: ['employee'] },
    supervisor: { id: 'user-supervisor-001', name: 'Sarah Supervisor',  email: 'supervisor@example.com',  roles: ['supervisor','employee'] },
    admin:      { id: 'user-admin-001',      name: 'Alex Admin',        email: 'admin@example.com',       roles: ['admin','supervisor','employee'] }
  };

  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { _value = data; persist(); listeners.valueChange.forEach(function(cb) { try { cb(data); } catch(e) {} }); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },
    getFields: function() { return Object.assign({}, _fields); },
    setField: function(id, value) { _fields[id] = value; },
    setFields: function(obj) { Object.assign(_fields, obj); },
    watchField: function(id, cb) { listeners.fieldsChange.push(cb); },
    onFieldsChange: function(cb) { listeners.fieldsChange.push(cb); },
    param: function(name, fallback) {
      var defaults = {
        adminRoles: 'admin',
        supervisorRoles: 'editor',
        defaultScheduleStart: '10:00',
        defaultScheduleEnd: '17:30',
        defaultWorkDays: 'Monday,Tuesday,Wednesday,Thursday,Friday',
        escalationThreshold: '3',
        supervisorVarianceThreshold: '20',
        hourlyRate: '17.40'
      };
      if (fallback !== undefined) return fallback;
      return defaults[name] !== undefined ? defaults[name] : '';
    },
    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    getUser: function() { return _user; },
    onUserChange: function(cb) { listeners.userChange.push(cb); },
    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#3182ce', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity]||'#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity='0'; toast.style.transition='opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 3000);
    },
    resize: function() {},
    declareOutput: function() {},
    declareParams: function() {},
    reportMissingParams: function(missing, msg) { console.log('[reportMissingParams]', msg, missing); },
    openUrl: function(url) { window.open(url, '_blank'); },
    requestExportPdf: function(opts, cb) { cb('PDF export not available in test harness', null); },
    requestUpload: function(accept, cb) { cb('Upload not available in test harness', null); },
    requestFileContent: function(url, cb) { cb('File content not available in test harness', null); },
    requestAI: function(prompt, context, cb) { cb('AI not available in test harness', null); },
    requestSendEmail: function(opts, cb) { cb('Email not available in test harness', null); },
    getPermittedUsers: function() { return []; },
    onPermittedUsersChange: function(cb) {},
    onReady: function(cb) { setTimeout(function() { cb(_value, _fields); }, 20); },

    requestObjects: function(action, params, cb) {
      var type = params.mainObjectType;
      if (!_storage[type]) _storage[type] = [];
      var coll = _storage[type];

      if (action === 'query') {
        setTimeout(function() { cb(null, { objects: coll.slice() }); }, 100);
      } else if (action === 'get') {
        var obj = coll.filter(function(o) { return o.id === params.objectId || o._id === params.objectId; })[0] || null;
        setTimeout(function() { cb(null, { object: obj }); }, 50);
      } else if (action === 'create') {
        var newObj = {
          id: 'obj-' + Date.now() + '-' + Math.random().toString(36).substr(2,6),
          _id: 'obj-' + Date.now() + '-' + Math.random().toString(36).substr(2,6),
          name: params.name || 'Untitled',
          cmsObjectType: type,
          typeId: params.typeId || 'default',
          productData: params.productData || { data_categoriesBased: {} },
          created: new Date().toISOString(),
          updated: new Date().toISOString()
        };
        coll.push(newObj);
        persist();
        setTimeout(function() { cb(null, { object: newObj }); }, 100);
      } else if (action === 'update') {
        for (var i = 0; i < coll.length; i++) {
          if (coll[i].id === params.objectId || coll[i]._id === params.objectId) {
            if (params.productData && params.productData.data_categoriesBased) {
              var existing = coll[i].productData.data_categoriesBased || {};
              var updates = params.productData.data_categoriesBased;
              for (var k in updates) { existing[k] = updates[k]; }
              coll[i].productData.data_categoriesBased = existing;
            }
            if (params.name) coll[i].name = params.name;
            coll[i].updated = new Date().toISOString();
            break;
          }
        }
        persist();
        setTimeout(function() { cb(null, { ok: true }); }, 80);
      } else if (action === 'delete') {
        _storage[type] = coll.filter(function(o) { return o.id !== params.objectId && o._id !== params.objectId; });
        persist();
        setTimeout(function() { cb(null, { ok: true }); }, 80);
      } else if (action === 'batch') {
        cb('Batch not implemented in test harness', null);
      } else {
        cb('Unknown action: ' + action, null);
      }
    },

    _switchRole: function(roleKey) {
      _user = ROLE_USERS[roleKey] || ROLE_USERS.employee;
      listeners.userChange.forEach(function(cb) { try { cb(_user); } catch(e) {} });
      tool.notify('Switched to: ' + _user.name + ' (' + roleKey + ')', 'info');
    },
    _toggleReadOnly: function() {
      _readOnly = !_readOnly;
      listeners.readonlyChange.forEach(function(cb) { try { cb(_readOnly); } catch(e) {} });
      tool.notify(_readOnly ? 'READ-ONLY mode' : 'EDIT mode', 'info');
    },
    _clearData: function() { _storage = {}; _value = null; localStorage.removeItem(STORAGE_KEY); },
    _dump: function() { console.log('Storage:', JSON.parse(JSON.stringify(_storage))); console.log('Value:', JSON.parse(JSON.stringify(_value))); },
    _getStorage: function() { return _storage; },
    _addSampleData: function() {
      var REQ = 'staffPermitRequests-uniconbaseapps';
      var EMP = 'staffPermitEmployees-uniconbaseapps';
      if (!_storage[REQ]) _storage[REQ] = [];
      if (!_storage[EMP]) _storage[EMP] = [];
      _storage[EMP].push(
        { id: 'emp-001', _id: 'emp-001', name: 'Jane Employee', cmsObjectType: EMP, typeId: 'default', productData: { data_categoriesBased: { userId: 'user-employee-001', email: 'employee@example.com', startTime: '09:00', endTime: '16:30', workDays: ['Monday','Tuesday','Wednesday','Thursday','Friday'], team: 'Youth Program A', supervisor: 'Sarah Supervisor', period: 'Summer 2026' } }, created: '2026-06-01T00:00:00Z', updated: '2026-06-01T00:00:00Z' },
        { id: 'emp-002', _id: 'emp-002', name: 'John Worker', cmsObjectType: EMP, typeId: 'default', productData: { data_categoriesBased: { userId: 'user-employee-002', email: 'john@example.com', startTime: '09:00', endTime: '16:30', workDays: ['Monday','Tuesday','Wednesday','Thursday','Friday'], team: 'Youth Program A', supervisor: 'Sarah Supervisor', period: 'Summer 2026' } }, created: '2026-06-01T00:00:00Z', updated: '2026-06-01T00:00:00Z' }
      );
      _storage[REQ].push(
        { id: 'req-001', _id: 'req-001', name: 'Jane - Late Arrival - 2026-07-15', cmsObjectType: REQ, typeId: 'default', productData: { data_categoriesBased: { requestType: 'lateArrival', requestDate: '2026-07-15', reason: 'medical', explanation: 'Doctor appointment at 8 AM', status: 'approved', employeeId: 'user-employee-001', employeeName: 'Jane Employee', employeeEmail: 'employee@example.com', employeeTeam: 'Youth Program A', employeeSupervisor: 'Sarah Supervisor', originalStart: '09:00', originalEnd: '16:30', requestedStart: '11:00', requestedEnd: '16:30', decision: 'Approved', decisionComment: 'Approved for medical appointment. Please provide doctor note.', paymentTreatment: 'unpaid', scheduleChange: 'no', reviewedBy: 'Sarah Supervisor', reviewedAt: '2026-07-14T10:00:00Z' } }, created: '2026-07-14T08:00:00Z', updated: '2026-07-14T10:00:00Z' },
        { id: 'req-002', _id: 'req-002', name: 'John - Absence - 2026-07-18', cmsObjectType: REQ, typeId: 'default', productData: { data_categoriesBased: { requestType: 'absenceFullDay', requestDate: '2026-07-18', reason: 'family', explanation: 'Family obligation', status: 'pending', employeeId: 'user-employee-002', employeeName: 'John Worker', employeeEmail: 'john@example.com', employeeTeam: 'Youth Program A', employeeSupervisor: 'Sarah Supervisor', originalStart: '09:00', originalEnd: '16:30', requestedStart: '', requestedEnd: '', decision: '', decisionComment: '', paymentTreatment: '', scheduleChange: 'no', reviewedBy: '', reviewedAt: '' } }, created: '2026-07-18T07:00:00Z', updated: '2026-07-18T07:00:00Z' },
        { id: 'req-003', _id: 'req-003', name: 'Jane - Early Departure - 2026-07-20', cmsObjectType: REQ, typeId: 'default', productData: { data_categoriesBased: { requestType: 'earlyDeparture', requestDate: '2026-07-20', reason: 'personal', explanation: 'Personal appointment at 3 PM', status: 'denied', employeeId: 'user-employee-001', employeeName: 'Jane Employee', employeeEmail: 'employee@example.com', employeeTeam: 'Youth Program A', employeeSupervisor: 'Sarah Supervisor', originalStart: '09:00', originalEnd: '16:30', requestedStart: '09:00', requestedEnd: '14:30', decision: 'Denied', decisionComment: 'Operational needs require full staffing.', denialReason: 'Operational requirements', paymentTreatment: '', scheduleChange: 'no', reviewedBy: 'Sarah Supervisor', reviewedAt: '2026-07-19T14:00:00Z' } }, created: '2026-07-19T09:00:00Z', updated: '2026-07-19T14:00:00Z' }
      );
      persist();
      tool.notify('Sample data loaded! 2 employees, 3 requests.', 'success');
    }
  };

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); window.tool._toggleReadOnly(); }
    if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault(); window.tool._dump(); window.tool.notify('State dumped to console', 'info'); }
  });
})();
</script>

          <p><strong>Schedule Expectations:</strong> Employees are expected to follow their assigned work schedule. Your regular schedule defines your working days, start time, and end time.</p>
          <p><strong>Punctuality:</strong> Arrive on time for every scheduled shift. Late arrivals must be communicated to your supervisor as early as possible.</p>

          <p><strong>Repeated Requests:</strong> Frequent schedule change requests may trigger additional review to ensure fairness and operational consistency.</p>
          <p><strong>Educational Sessions:</strong> Required training and educational sessions cannot be missed without explicit administrator approval.</p>
          <p><strong>CSJ Funding Rules:</strong> Canada Summer Jobs funding requires <strong>30–40 hours of work per week</strong>, evaluated <strong>each individual week</strong> (not cumulatively). If your payable hours for any week drop below 30, that week's wages may be <strong>ineligible for CSJ reimbursement</strong>. Making up hours in a different week does not fix the shortfall. Repeated short weeks may jeopardize funding for the entire placement and could result in <strong>termination of employment</strong>. If you anticipate difficulty meeting the 30-hour weekly minimum, speak with your supervisor immediately.</p>

          <p><strong>Fair Treatment:</strong> Do not create different rules for different employees. All schedule exceptions follow the same process.</p>
          <p><strong>No Unofficial Exceptions:</strong> All schedule changes must go through this formal system. Side agreements are not permitted.</p>

<script>
/* ═══════════════════════════════════════════════════════
   INITIALIZATION — try loading real HTML first (HTTP),
   fall back to EMBEDDED_HTML (file://). JS null guards
   prevent crashes with stale embedded HTML.
   ═══════════════════════════════════════════════════════ */
(function() {
  var status = document.getElementById('th-status');
  var container = document.getElementById('app-container');

  function injectAndLoadJS(html) {
    container.innerHTML = html;
    // Load JS component — DOM must exist first
    status.textContent = 'Loading JS...';
    var script = document.createElement('script');
    script.src = 'StaffPermitManagement.js';
    script.onload = function() { status.textContent = 'Ready'; };
    script.onerror = function() { status.textContent = 'JS FAILED - check console'; };
    document.body.appendChild(script);
  }

  // Load HTML: use fetch when on HTTP, embedded fallback on file://
  var isFileProtocol = window.location.protocol === 'file:';
  status.textContent = isFileProtocol ? 'file:// mode — using embedded HTML' : 'Loading HTML...';

  if (!isFileProtocol) {
    fetch('StaffPermitManagement.html')
      .then(function(r) { return r.text(); })
      .then(function(html) { injectAndLoadJS(html); })
      .catch(function() { injectAndLoadJS(EMBEDDED_HTML); });
  } else {
    injectAndLoadJS(EMBEDDED_HTML);
  }

  // Harness controls
  document.getElementById('th-role').addEventListener('change', function() {
    window.tool._switchRole(this.value);
  });
  document.getElementById('th-sample').addEventListener('click', function() {
    window.tool._addSampleData();
    location.reload();
  });
  document.getElementById('th-clear').addEventListener('click', function() {
    if (confirm('Clear all data? This cannot be undone.')) {
      window.tool._clearData();
      location.reload();
    }
  });
  document.getElementById('th-reload').addEventListener('click', function() {
    location.reload();
  });
})();
</script>
