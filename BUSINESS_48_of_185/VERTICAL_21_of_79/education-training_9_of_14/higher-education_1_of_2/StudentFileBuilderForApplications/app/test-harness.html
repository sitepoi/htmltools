<script>
/* ── Mock tool SDK ── */
(function() {
  var STORAGE_KEY = 'student_file_builder_test_db';
  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [] };
  var _readOnly = false, _user = { id: 'usr_test1', name: 'Grace Hopper', email: 'grace@example.com', roles: ['editor'], effectiveAccess: { isViewer: true, isEditor: true, isManager: false }, locale: 'en' };
  var _fields = {}, _value = null;

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch(e) { _value = null; }
  }
  function save(v) { _value = v; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch(e) {} }

  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { save(data); listeners.valueChange.forEach(function(cb) { try { cb(data); } catch(e) {} }); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },
    getFields: function() { return Object.assign({}, _fields); },
    setField: function(id, value) { _fields[id] = value; },
    setFields: function(obj) { Object.assign(_fields, obj); },
    watchField: function(id, cb) { listeners.fieldsChange.push(cb); },
    onFieldsChange: function(cb) { listeners.fieldsChange.push(cb); },
    param: function(name, fallback) {
      var p = (new URLSearchParams(window.location.search)).get(name);
      return p !== null && p !== '' ? p : fallback;
    },
    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    _setReadOnly: function(v) { _readOnly = v; listeners.readonlyChange.forEach(function(cb) { try { cb(v); } catch(e) {} }); },
    getUser: function() { return _user; },
    onUserChange: function(cb) { listeners.userChange.push(cb); },
    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    reportMissingParams: function(missing, msg) { if (missing && missing.length) console.warn('[Missing params]', msg, missing); },
    declareOutput: function() {},
    declareParams: function() {},
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#0d9488', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 2500);
    },
    resize: function() {},
    openUrl: function(url) { window.open(url, '_blank'); },
    requestUpload: function(accept, cb) {
      var input = document.createElement('input');
      input.type = 'file';
      if (accept) input.accept = accept;
      input.onchange = function() {
        var f = input.files && input.files[0];
        if (!f) { cb('No file selected', null); return; }
        var reader = new FileReader();
        reader.onload = function() {
          cb(null, { name: f.name, url: reader.result, size: f.size, type: f.type || '' });
        };
        reader.onerror = function() { cb('Could not read file', null); };
        reader.readAsDataURL(f);
      };
      input.click();
    },
    requestExportPdf: function(options, cb) {
      var html = options.html || document.body.innerHTML;
      try {
        var blob = new Blob([html], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        cb(null, { name: (options.filename || 'export') + '.html', url: url, size: blob.size, type: 'text/html' });
      } catch(e) { cb('Export failed: ' + e.message, null); }
    },
    requestAI: function(prompt, context, cb) {
      setTimeout(function() {
        var q = (prompt || '').toLowerCase();
        var answer;
        if (q.indexOf('evaluate') > -1 || q.indexOf('verdict') > -1) {
          answer = "VERDICT: POSSIBLE\nEstimated readiness score: 62/100\n\nKey gaps:\n1. Standardized test scores are still pending.\n2. Not all recommendation letters are received yet.\n3. Supplemental essays have not been started.\n\nNext actions:\n• Book the SAT/ACT test date now.\n• Follow up with referees this week.\n• Draft outlines for the supplemental essays.";
        } else if (q.indexOf('missing') > -1 || q.indexOf('left') > -1 || q.indexOf('next') > -1) {
          answer = "Based on the current file, the biggest gaps are:\n\n1. Essays & Statements — most applications still need the personal statement drafted.\n2. References — at least one letter is still 'Requested' and not yet received.\n3. Test Scores — confirm whether SAT/ACT and English proficiency scores are required for each school.\n\nRecommended next step: draft the personal statement outline first, then follow up with referees before the deadlines.";
        } else if (q.indexOf('essay') > -1 || q.indexOf('statement') > -1) {
          answer = "For the personal statement, build the narrative around a single compelling story. Tie the student's robotics leadership and community tutoring into a clear 'why this major' arc, and keep it under the word limit. Start with a vivid scene, show growth, and end with forward-looking intent.";
        } else {
          answer = "Here's my advice as your admissions mentor:\n\n• Focus on the requirements still marked 'In Progress' or 'Not Started'.\n• Prioritize items with due dates in the next 30 days.\n• Make sure each application has at least one strong achievement, a solid grade summary, and two confirmed references.\n\nYou can also add mentor notes in the Mentor tab to track next steps.";
        }
        cb(null, answer);
      }, 600);
    },
    onReady: function(cb) { load(); cb(_value, _fields); },
    _loadSampleData: function(data) { save(data); window.location.reload(); },
    _clearData: function() { localStorage.removeItem(STORAGE_KEY); window.location.reload(); },
    _toggleReadOnly: function() { this._setReadOnly(!_readOnly); },
    _dump: function() { console.log('StudentFile DB:', JSON.parse(JSON.stringify(_value))); }
  };

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); window.tool._toggleReadOnly(); window.tool.notify(window.tool.isReadOnly() ? 'READ-ONLY MODE' : 'EDIT MODE', 'info'); }
    if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault(); window.tool._dump(); window.tool.notify('DB dumped to console', 'info'); }
  });
})();
</script>

(function() {
  var status = document.getElementById('th-status');
  var container = document.getElementById('app-container');

  function loadJS() {
    status.textContent = 'Loading JS...';
    var script = document.createElement('script');
    script.src = 'StudentFileBuilderForApplications.js';
    script.onload = function() { status.textContent = 'Ready — click "Load Sample Data" to test'; };
    script.onerror = function() { status.textContent = 'JS FAILED - check console'; };
    document.body.appendChild(script);
  }

  function injectHTML(html) {
    container.innerHTML = html;
    loadJS();
  }

  status.textContent = 'Fetching HTML...';
  var fallbackTimer = setTimeout(function() {
    status.textContent = 'Using embedded HTML (file:// mode)';
    injectHTML(EMBEDDED_HTML);
  }, 1500);

  fetch('StudentFileBuilderForApplications.html')
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.text();
    })
    .then(function(html) {
      clearTimeout(fallbackTimer);
      status.textContent = 'HTML loaded (live)';
      injectHTML(html);
    })
    .catch(function() { /* fallback already triggered */ });
})();
</script>

<script>
/* ── Sample Data Generator ── */
(function() {
  function dateISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return dateISO(d); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function r(cat, title, desc, status, due, targetYear) { return { id: uid(), cat: cat, title: title, desc: desc || "", status: status || "not-started", due: due || "", targetYear: targetYear || "", notes: "" }; }
  function tgt(inst, program, deadline, status, notes) { return { id: uid(), institution: inst, program: program, deadline: deadline, status: status || "planning", notes: notes || "" }; }
  function cmt(author, role, text, daysAgo) { return { id: uid(), author: author, role: role, text: text, time: new Date(Date.now() - (daysAgo || 0) * 86400000).toISOString() }; }

  function universityReqs() {
    return [
      r("academic", "Academic Transcript / Grade Report", "Official transcript or latest grade report", "done"),
      r("academic", "Predicted Grades", "Predicted final grades from school", "done"),
      r("tests", "Standardized Test Scores", "SAT / ACT score reports", "in-progress", addDays(30)),
      r("tests", "English Proficiency", "TOEFL / IELTS (if required)", "not-started", addDays(60), "Grade 12"),
      r("essays", "Personal Statement / Main Essay", "The primary application essay", "in-progress", addDays(45)),
      r("essays", "Supplemental Essays", "School-specific short essays", "not-started", addDays(75), "Grade 11"),
      r("references", "Letters of Recommendation", "2-3 letters from teachers / counselor", "in-progress", addDays(50)),
      r("documents", "CV / Resume", "Summary of activities and achievements", "done"),
      r("portfolio", "Portfolio", "For arts / design / performance programs", "not-needed"),
