1px 2px rgba(0,0,0,0.3);\r\n  --shadow-md: 0 4px 6px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);\r\n  --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);\r\n}\r\nbody.dark .app-header { background: #1e293b; border-color: #475569; }\r\nbody.dark .detail-hero { background: #1e293b; }\r\nbody.dark .study-step { background: #1e293b; }\r\nbody.dark .study-step.expanded { background: #1e1b2e; }\r\nbody.dark .study-step-body { background: #1e1b2e; }\r\nbody.dark .study-step-header:hover { background: #334155; }\r\nbody.dark .study-step.expanded .study-step-header { background: #1e1b4b; }\r\nbody.dark .pdf-viewer-card { background: #1e293b; }\r\nbody.dark .pdf-viewer-toolbar { background: #334155; }\r\nbody.dark .pdf-page-canvas { background: #1e293b; }\r\nbody.dark .pdf-canvas-error { background: #334155; }\r\nbody.dark .lesson-card { background: #1e293b; }\r\nbody.dark .section-group-card { background: #1e293b; }\r\nbody.dark .quiz-question { background: #1e293b; }\r\nbody.dark .quiz-option { background: #334155; }\r\nbody.dark .quiz-option:hover { background: #1e1b4b; }\r\nbody.dark .sg-quiz-item-v3 { background: #1e293b; }\r\nbody.dark .sg-q-opt { background: #334155; }\r\nbody.dark .sg-q-opt:hover { background: #1e1b4b; }\r\nbody.dark .source-links-area { background: #334155; }\r\nbody.dark .setup-card { background: #1e293b; }\r\nbody.dark .setup-select, body.dark .setup-input { background: #334155; color: #e2e8f0; border-color: #475569; }\r\nbody.dark .search-input, body.dark .filter-select { background: #1e293b; color: #e2e8f0; border-color: #475569; }\r\nbody.dark .btn-outline { background: #334155; color: #e2e8f0; border-color: #475569; }\r\nbody.dark .btn-outline:hover:not(:disabled) { background: #475569; }\r\nbody.dark .html-doc-container { background: #1e293b; }\r\nbody.dark .pdf-zoom-btn { background: #334155; }\r\nbody.dark .pdf-zoom-btn:hover { background: #475569; }\r\n\r\nbody {\r\n  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;\r\n  font-size: 15px;\r\n  color: var(--text);\r\n  background: var(--bg);\r\n  line-height: 1.6;\r\n  -webkit-font-smoothing: antialiased;\r\n}\r\n\r\n/* ── Header ── */\r\n.app-header {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 14px 24px; background: var(--surface);\r\n  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;\r\n  box-shadow: var(--shadow-sm);\r\n}\r\n.header-left { display: flex; align-items: center; gap: 12px; }\r\n.app-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }\r\n.header-right { display: flex; align-items: center; gap: 10px; }\r\n.role-badge {\r\n  font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px;\r\n  background: var(--primary-bg); color: var(--primary-dark); max-width: 280px;\r\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default;\r\n}\r\n\r\n/* ── Buttons ── */\r\n.btn {\r\n  display: inline-flex; align-items: center; gap: 6px;\r\n  padding: 9px 18px; border-radius: var(--radius); border: 1px solid transparent;\r\n  font-size: 14px; font-weight: 500; cursor: pointer;\r\n  transition: all var(--transition); white-space: nowrap;\r\n  font-family: inherit; user-select: none; -webkit-user-select: none;\r\n  letter-spacing: 0.1px;\r\n}\r\n.btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }\r\n.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }\r\n.btn-primary:hover:not(:disabled) { background: var(--primary-dark); box-shadow: 0 2px 8px rgba(79,70,229,0.3); }\r\n.btn-success { background: var(--success); color: #fff; border-color: var(--success); }\r\n.btn-success:hover:not(:disabled) { background: #047857; box-shadow: 0 2px 8px rgba(5,150,105,0.3); }\r\n.btn-outline { background: var(--surface); color: var(--text); border-color: var(--border); }\r\n.btn-outline:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }\r\n.btn-sm { padding: 6px 14px; font-size: 13px; }\r\n.btn-icon {\r\n  background: none; border: none; font-size: 20px; cursor: pointer;\r\n  padding: 4px 8px; border-radius: var(--radius); color: var(--text-muted);\r\n  transition: all var(--transition); line-height: 1;\r\n}\r\n.btn-icon:hover { background: var(--surface-alt); color: var(--text); }\r\n\r\n/* ── Progress Bar ── */\r\n.progress-bar-wrap { margin: 0 24px; padding: 16px 0 8px; }\r\n.progress-bar-bg { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }\r\n.progress-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }\r\n.progress-bar-text { font-size: 12px; color: var(--text-muted); margin-top: 6px; display: block; font-weight: 500; }\r\n\r\n/* ── Course Grade Panel ── */\r\n.grade-panel {\r\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl);\r\n  padding: 18px 20px; margin: 0 24px 18px; box-shadow: var(--shadow-sm);\r\n}\r\n.grade-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }\r\n.grade-head-title { font-size: 13px; font-weight: 800; letter-spacing: .2px; color: var(--text); }\r\n.grade-pill { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px; }\r\n.grade-st-pass { background: var(--success-light); color: #065f46; border: 1px solid #6ee7b7; }\r\n.grade-st-fail { background: var(--danger-light); color: #991b1b; border: 1px solid #fca5a5; }\r\n.grade-st-progress { background: var(--warning-light); color: #92400e; border: 1px solid #fcd34d; }\r\n.grade-st-fresh { background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border); }\r\n.grade-body { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }\r\n.grade-ring { flex-shrink: 0; }\r\n.grade-ring-text { font-size: 20px; font-weight: 800; fill: var(--text); }\r\n.grade-stats { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }\r\n.grade-stat { display: flex; flex-direction: column; }\r\n.grade-stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }\r\n.grade-stat-value { font-size: 15px; font-weight: 800; color: var(--text); }\r\n.grade-stat-note { font-size: 11px; font-weight: 500; color: var(--text-muted); }\r\n.grade-bar { width: 100%; max-width: 340px; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 2px; }\r\n.grade-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); transition: width .5s ease; }\r\n.grade-side { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 18px; background: var(--surface-alt); border-radius: var(--radius-lg); }\r\n.grade-side-num { font-size: 22px; font-weight: 800; color: var(--text); }\r\n.grade-side-num span { font-size: 13px; color: var(--text-muted); font-weight: 600; }\r\n.grade-side-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }\r\n.grade-sections { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px; }\r\n.grade-section-row { display: flex; align-items: center; gap: 10px; }\r\n.grade-section-name { width: 180px; min-width: 120px; font-size: 12px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.grade-section-bar { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }\r\n.grade-section-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--success), #34d399); transition: width .5s ease; }\r\n.grade-section-fill.below { background: linear-gradient(90deg, var(--warning), #fbbf24); }\r\n.grade-section-val { width: 44px; text-align: right; font-size: 12px; font-weight: 700; color: var(--text); }\r\n.grade-note { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text-muted); }\r\nbody.dark .grade-panel { background: #1e293b; }\r\nbody.dark .grade-ring-text { fill: #e2e8f0; }\r\n@media (max-width: 768px) {\r\n  .grade-panel { margin: 0 16px 16px; }\r\n  .grade-side { flex-direction: row; gap: 8px; padding: 8px 14px; }\r\n  .grade-section-name { width: 130px; min-width: 0; }\r\n}\r\n\r\n/* ── Toolbar ── */\r\n.toolbar { display: flex; align-items: center; gap: 12px; padding: 16px 24px 12px; flex-wrap: wrap; }\r\n.search-input, .filter-select {\r\n  padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius);\r\n  font-size: 14px; background: var(--surface); font-family: inherit; color: var(--text);\r\n  transition: all var(--transition);\r\n}\r\n.search-input { flex: 1; min-width: 200px; }\r\n.search-input::placeholder { color: var(--text-light); }\r\n.search-input:focus, .filter-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }\r\n.filter-select { min-width: 160px; cursor: pointer; }\r\n\r\n/* ── Section Group Grid ── */\r\n.section-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 0 24px 24px; }\r\n.section-group-card {\r\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl);\r\n  padding: 24px; cursor: pointer; transition: all var(--transition); box-shadow: var(--shadow-sm);\r\n  position: relative; overflow: hidden;\r\n}\r\n.section-group-card::before {\r\n  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;\r\n  background: var(--primary); opacity: 0; transition: opacity var(--transition);\r\n}\r\n.section-group-card:hover:not(.locked) { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-2px); }\r\n.section-group-card:hover:not(.locked)::before { opacity: 1; }\r\n.section-group-card.locked { opacity: 0.65; cursor: not-allowed; }\r\n.section-group-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }\r\n.section-group-card-num { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-bg); padding: 3px 10px; border-radius: 12px; letter-spacing: 0.3px; text-transform: uppercase; }\r\n.section-group-card-status { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }\r\n.section-group-card-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; color: var(--text); letter-spacing: -0.2px; line-height: 1.3; }\r\n.section-group-card-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; }\r\n.section-group-card-lock { font-size: 13px; color: var(--warning); font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 4px; }\r\n\r\n/* ── Status badges ── */\r\n.status-completed { background: var(--success-light); color: var(--success); }\r\n.status-in_progress { background: var(--warning-light); color: var(--warning); }\r\n.status-not_started { background: var(--surface-alt); color: var(--text-muted); }\r\n.status-locked { background: var(--danger-light); color: var(--danger); }\r\n.status-pending_review { background: #e0e7ff; color: #4338ca; }\r\n.status-studying { background: #fce7f3; color: #be185d; }\r\n\r\n/* ── Empty State ── */\r\n.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; }\r\n.empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.8; }\r\n.empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }\r\n.empty-desc { font-size: 14px; color: var(--text-muted); max-width: 400px; margin: 0 auto; }\r\n\r\n/* ── View container ── */\r\n.view { padding: 0 24px 24px; }\r\n\r\n/* ── Section Info Bar ── */\r\n.section-info-bar {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 18px 0; margin-bottom: 4px;\r\n  border-bottom: 2px solid var(--border); flex-wrap: wrap; gap: 8px;\r\n}\r\n.section-info-title { font-size: 16px; font-weight: 700; color: var(--text); }\r\n.section-info-progress { font-size: 13px; color: var(--text-muted); font-weight: 500; }\r\n\r\n/* ── Lesson List ── */\r\n.lesson-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 100px; }\r\n.lesson-card {\r\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);\r\n  padding: 16px 20px; cursor: pointer; transition: all var(--transition); box-shadow: var(--shadow-sm);\r\n  display: flex; align-items: center; gap: 16px;\r\n}\r\n.lesson-card:hover:not(.locked) { border-color: var(--primary-light); box-shadow: var(--shadow-md); }\r\n.lesson-card.locked { opacity: 0.55; cursor: not-allowed; }\r\n.lesson-card-icon { font-size: 24px; flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface-alt); }\r\n.lesson-card-icon.completed { background: var(--success-light); }\r\n.lesson-card-icon.in_progress { background: var(--warning-light); }\r\n.lesson-card-icon.locked { background: var(--danger-light); }\r\n.lesson-card-body { flex: 1; min-width: 0; }\r\n.lesson-card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }\r\n.lesson-card-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }\r\n.lesson-card-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 10px; flex-shrink: 0; }\r\n\r\n/* ═══════════════════════════════════════════\r\n   LESSON DETAIL VIEW - Full-width, no boxed card\r\n   ═══════════════════════════════════════════ */\r\n#view-lesson-detail.view { padding: 0; }\r\n.detail-breadcrumb {\r\n  font-size: 13px; color: var(--primary); padding: 14px 24px 6px;\r\n  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\r\n}\r\n.detail-breadcrumb span { cursor: pointer; font-weight: 500; }\r\n.detail-breadcrumb span:hover { text-decoration: underline; }\r\n\r\n.detail-hero {\r\n  padding: 10px 24px 24px; border-bottom: 1px solid var(--border);\r\n  background: var(--surface);\r\n}\r\n.detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 10px; }\r\n.detail-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.4px; line-height: 1.2; }\r\n.detail-badge { font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 12px; white-space: nowrap; }\r\n.detail-meta { display: flex; gap: 20px; font-size: 13px; color: var(--text-muted); align-items: center; }\r\n\r\n/* ── Study Flow (Step-by-Step accordion - lesson body) ── */\r\n.study-flow-empty { text-align: center; padding: 60px 24px; }\r\n.study-flow { padding: 0; }\r\n.study-steps { display: flex; flex-direction: column; }\r\n\r\n.study-step {\r\n  position: relative; background: var(--surface);\r\n  border-bottom: 1px solid var(--border);\r\n  transition: all var(--transition);\r\n}\r\n.study-step:first-child { border-top: 1px solid var(--border); }\r\n.study-step.expanded { background: #fafbfe; }\r\n\r\n.study-step-header {\r\n  display: flex; align-items: center; gap: 18px;\r\n  padding: 20px 24px; cursor: pointer; user-select: none;\r\n  transition: background var(--transition);\r\n}\r\n.study-step-header:hover { background: #fafbfc; }\r\n.study-step.expanded .study-step-header { background: var(--primary-bg); }\r\n\r\n.study-step-badge {\r\n  width: 40px; height: 40px; border-radius: 50%;\r\n  background: var(--primary); color: #fff;\r\n  display: flex; align-items: center; justify-content: center;\r\n  font-size: 16px; font-weight: 700; flex-shrink: 0;\r\n  box-shadow: 0 2px 10px rgba(79,70,229,0.25);\r\n  transition: all var(--transition);\r\n}\r\n.study-step.expanded .study-step-badge { background: var(--success); box-shadow: 0 2px 10px rgba(5,150,105,0.25); }\r\n\r\n.study-step-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }\r\n.study-step-icon { font-size: 24px; flex-shrink: 0; line-height: 1; }\r\n.study-step-title { font-size: 16px; font-weight: 600; color: var(--text); }\r\n.study-step-toggle {\r\n  font-size: 12px; color: var(--text-muted); transition: transform 0.3s ease; flex-shrink: 0;\r\n  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;\r\n  border-radius: 50%; background: var(--surface-alt);\r\n}\r\n.study-step.expanded .study-step-toggle { transform: rotate(180deg); background: var(--primary-bg); color: var(--primary); }\r\n\r\n.study-step-body {\r\n  display: none; padding: 0 24px 32px 82px;\r\n  background: #fafbfe;\r\n}\r\n.study-step.expanded .study-step-body { display: block; animation: stepFadeIn 0.3s ease; }\r\n@keyframes stepFadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }\r\n\r\n.study-embed { margin-bottom: 32px; }\r\n.study-embed:last-child { margin-bottom: 0; }\r\n.study-embed-label {\r\n  font-size: 11px; font-weight: 700; color: var(--primary); margin-bottom: 10px;\r\n  text-transform: uppercase; letter-spacing: 0.8px;\r\n}\r\n\r\n/* Video embed - large, centered, never taller than the visible area */\r\n.study-embed .youtube-container {\r\n  padding-bottom: 56.25%; position: relative; border-radius: var(--radius-lg);\r\n  overflow: hidden; box-shadow: var(--shadow-md); background: #000;\r\n  margin: 0 auto; /* center horizontally in the step body */\r\n  max-width: 960px;\r\n  /* Cap the width so the 16:9 height always fits within the viewport\r\n     (minus header, tab bar and a comfortable bottom margin). */\r\n  max-width: min(960px, calc((100vh - 240px) * 16 / 9));\r\n}\r\n.study-embed .youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }\r\n\r\n/* PDF Viewer - full-page, clean, no max-height clamp */\r\n.pdf-viewer-card {\r\n  border: 1px solid var(--border); border-radius: var(--radius-lg);\r\n  background: var(--surface);\r\n}\r\n.pdf-viewer-toolbar {\r\n  display: flex; align-items: center; gap: 8px;\r\n  padding: 10px 16px; background: #fafbfc;\r\n  border-bottom: 1px solid var(--border); flex-wrap: nowrap;\r\n  border-radius: var(--radius-lg) var(--radius-lg) 0 0;\r\n}\r\n.pdf-viewer-icon { font-size: 18px; flex-shrink: 0; }\r\n.pdf-viewer-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n/* Spacer pushes page-nav and open-link to the right as a group */\r\n.pdf-viewer-toolbar .btn[data-open-url] { margin-left: auto; }\r\n.pdf-canvas-container {\r\n  width: 100%; display: flex; flex-direction: column; align-items: center;\r\n  gap: 12px; padding: 20px 0;\r\n}\r\n.pdf-page-canvas {\r\n  max-width: 100%; height: auto;\r\n  box-shadow: 0 2px 12px rgba(0,0,0,0.12);\r\n  border: 1px solid var(--border);\r\n  background: #fff;\r\n  scroll-margin-top: 130px;\r\n}\r\n.pdf-canvas-loading, .pdf-canvas-error {\r\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\r\n  gap: 12px; padding: 60px 24px; text-align: center; min-height: 220px;\r\n  color: var(--text-muted); font-size: 15px;\r\n}\r\n.pdf-canvas-error { background: #fafbfc; border-radius: var(--radius-lg); }\r\n.pdf-canvas-error a { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: underline; }\r\n\r\n/* HTML Document container (inline fetched content) */\r\n.html-doc-container {\r\n  background: var(--surface); padding: 24px;\r\n  min-height: 200px;\r\n}\r\n.html-doc-container .detail-content { margin: 0; }\r\n\r\n/* PDF Page Navigation Dropdown */\r\n.pdf-page-nav {\r\n  position: relative; margin-left: auto; flex-shrink: 0;\r\n}\r\n.pdf-page-nav-trigger {\r\n  display: inline-flex; align-items: center; gap: 4px;\r\n}\r\n.pdf-page-nav-arrow { font-size: 10px; transition: transform 0.2s ease; }\r\n.pdf-page-nav.open .pdf-page-nav-arrow { transform: rotate(180deg); }\r\n.pdf-page-nav-dropdown {\r\n  display: none; position: absolute; right: 0; top: 100%; margin-top: 4px;\r\n  min-width: 140px; max-height: 320px; overflow-y: auto;\r\n  background: var(--surface); border: 1px solid var(--border);\r\n  border-radius: var(--radius); box-shadow: var(--shadow-lg);\r\n  z-index: 20; flex-direction: column; padding: 4px;\r\n}\r\n.pdf-page-nav.open .pdf-page-nav-dropdown { display: flex; }\r\n.pdf-page-nav-item {\r\n  display: block; width: 100%; padding: 8px 14px; border: none; background: none;\r\n  font-size: 13px; color: var(--text); cursor: pointer; text-align: left;\r\n  border-radius: var(--radius); font-family: inherit;\r\n  transition: background var(--transition);\r\n}\r\n.pdf-page-nav-item:hover { background: var(--primary-bg); color: var(--primary); }\r\n.pdf-page-nav-item.active { background: var(--primary-bg); color: var(--primary); font-weight: 600; }\r\n\r\n/* ── PDF Zoom Controls ── */\r\n.pdf-zoom-group {\r\n  display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0;\r\n}\r\n.pdf-zoom-btn {\r\n  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;\r\n  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);\r\n  cursor: pointer; font-size: 13px; color: var(--text-muted); transition: all var(--transition);\r\n  font-family: inherit; line-height: 1; padding: 0;\r\n}\r\n.pdf-zoom-btn:hover { background: var(--surface-alt); color: var(--text); border-color: #cbd5e1; }\r\n.pdf-zoom-label {\r\n  font-size: 11px; font-weight: 600; color: var(--text-muted); min-width: 36px; text-align: center;\r\n  user-select: none; cursor: default; line-height: 1;\r\n}\r\n.pdf-zoom-sep {\r\n  width: 1px; height: 18px; background: var(--border); margin: 0 4px;\r\n}\r\n\r\n/* Quiz wrapper inside study flow */\r\n.study-quiz-wrap { margin-top: 8px; }\r\n.quiz-actions { margin-top: 18px; display: flex; gap: 10px; }\r\n\r\n/* ── Finish-tab Lesson Summary card ── */\r\n.finish-summary {\r\n  max-width: 620px; margin: 0 auto 18px; padding: 18px 20px 8px;\r\n  background: var(--surface); border: 1px solid var(--border);\r\n  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);\r\n}\r\n.finish-sum-head {\r\n  font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;\r\n  color: var(--text-muted); margin-bottom: 10px;\r\n}\r\n.finish-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }\r\n.finish-status-pill { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px; }\r\n.finish-st-completed { background: var(--success-light); color: #065f46; border: 1px solid #6ee7b7; }\r\n.finish-st-pending { background: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }\r\n.finish-st-studying { background: #fce7f3; color: #be185d; border: 1px solid #f9a8d4; }\r\n.finish-st-progress { background: var(--warning-light); color: #92400e; border: 1px solid #fcd34d; }\r\n.finish-st-fresh { background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border); }\r\n.finish-completed-date { font-size: 12px; color: var(--text-muted); }\r\n.finish-block { padding: 12px 0; border-top: 1px dashed var(--border); }\r\n.finish-block-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: .2px; }\r\n\r\n/* Quiz score ring + attempt history */\r\n.finish-quiz-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }\r\n.finish-ring { flex-shrink: 0; }\r\n.finish-ring-text { font-size: 18px; font-weight: 800; fill: var(--text); }\r\n.finish-quiz-meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }\r\n.finish-pill { display: inline-flex; align-self: flex-start; font-size: 11px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }\r\n.finish-attempts { display: flex; align-items: center; gap: 8px; }\r\n.finish-attempts-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }\r\n.finish-attempt-dots { display: inline-flex; gap: 6px; align-items: center; }\r\n.finish-attempt-dot { width: 10px; height: 10px; border-radius: 50%; }\r\n.finish-attempt-dot.fa-pass { background: var(--success); box-shadow: 0 0 0 1px var(--success); }\r\n.finish-attempt-dot.fa-fail { background: var(--danger); box-shadow: 0 0 0 1px var(--danger); }\r\n.finish-meta-line { font-size: 12px; color: var(--text-muted); }\r\n.finish-meta-line strong { color: var(--text); }\r\n\r\n/* Flashcard mastery: progress bar + dot-grid */\r\n.finish-bar { width: 100%; max-width: 420px; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }\r\n.finish-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--success), #34d399); transition: width .5s ease; }\r\n.finish-dots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }\r\n.finish-dot {\r\n  width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;\r\n  border: 1.5px solid #cbd5e1; background: transparent;\r\n  transition: all .15s ease; cursor: default;\r\n}\r\n.finish-dot.mastered { background: var(--success); border-color: var(--success); }\r\n.finish-dot-more { font-size: 10px; font-weight: 700; color: var(--text-muted); line-height: 13px; padding: 0 4px; }\r\n.finish-legend { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }\r\n.finish-legend .finish-dot { width: 11px; height: 11px; }\r\n\r\n/* Checkpoint list */\r\n.finish-check { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); padding: 5px 0; }\r\n.finish-check-ic {\r\n  flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  font-size: 12px; font-weight: 700; background: var(--surface-alt); color: var(--text-muted);\r\n}\r\n.finish-check.done { color: var(--text); }\r\n.finish-check.done .finish-check-ic { background: var(--success-light); color: #065f46; }\r\n.finish-check.pending { color: var(--warning); }\r\n.finish-check.pending .finish-check-ic { background: var(--warning-light); color: #92400e; }\r\n\r\n/* Dark mode */\r\nbody.dark .finish-summary { background: #1e293b; }\r\nbody.dark .finish-dot { border-color: #64748b; }\r\nbody.dark .finish-ring-text { fill: #e2e8f0; }\r\n\r\n/* Nav buttons inside the Completion tab */\r\n.quiz-nav-actions {\r\n  display: flex; align-items: center; justify-content: center; gap: 10px;\r\n  padding: 20px 0; flex-wrap: wrap;\r\n}\r\n\r\n/* ── Flashcard Grid ── */\r\n.flashcards-grid {\r\n  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\r\n  gap: 20px; padding: 24px;\r\n}\r\n.flashcard {\r\n  perspective: 1000px; cursor: pointer;\r\n  height: 240px;\r\n}\r\n.flashcard-inner {\r\n  position: relative; width: 100%; height: 100%;\r\n  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);\r\n  transform-style: preserve-3d;\r\n}\r\n.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }\r\n.flashcard-face {\r\n  position: absolute; inset: 0;\r\n  backface-visibility: hidden;\r\n  border-radius: var(--radius-lg);\r\n  padding: 20px;\r\n  display: flex; flex-direction: column;\r\n  border: 1px solid var(--border);\r\n  box-shadow: var(--shadow-md);\r\n  overflow: hidden;\r\n}\r\n.flashcard-front {\r\n  background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%);\r\n  border-color: #c7d2fe;\r\n}\r\n.flashcard-back {\r\n  background: linear-gradient(145deg, #ecfdf5 0%, #d1fae5 100%);\r\n  border-color: #a7f3d0;\r\n  transform: rotateY(180deg);\r\n}\r\n.flashcard-number {\r\n  font-size: 11px; font-weight: 700; color: var(--primary);\r\n  margin-bottom: 8px; opacity: 0.7;\r\n}\r\n.flashcard-content {\r\n  flex: 1; overflow-y: auto;\r\n  font-size: 15px; line-height: 1.6; color: var(--text);\r\n  display: flex; align-items: center; justify-content: center;\r\n  text-align: center;\r\n  /* Hide scrollbar */\r\n  scrollbar-width: thin;\r\n}\r\n.flashcard-content::-webkit-scrollbar { width: 4px; }\r\n.flashcard-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }\r\n.flashcard-hint {\r\n  font-size: 10px; color: var(--text-muted); text-align: center;\r\n  margin-top: 8px; opacity: 0.6;\r\n  display: flex; align-items: center; justify-content: center; gap: 4px;\r\n}\r\n/* Dark mode */\r\nbody.dark .flashcard-front { background: linear-gradient(145deg, #1e1b4b 0%, #312e81 100%); border-color: #4338ca; }\r\nbody.dark .flashcard-back { background: linear-gradient(145deg, #064e3b 0%, #065f46 100%); border-color: #059669; }\r\nbody.dark .flashcard-content { color: #e2e8f0; }\r\n\r\n/* ── Setup Screen ── */\r\n.setup-card {\r\n  max-width: 560px; margin: 30px auto; background: var(--surface);\r\n  border: 1px solid var(--border); border-radius: var(--radius-xl);\r\n  padding: 40px 32px; box-shadow: var(--shadow-md); text-align: center;\r\n}\r\n.setup-icon { font-size: 48px; margin-bottom: 12px; }\r\n.setup-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }\r\n.setup-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; }\r\n.setup-form { text-align: left; }\r\n.setup-label {\r\n  display: block; font-size: 13px; font-weight: 600; color: var(--text);\r\n  margin-bottom: 6px; margin-top: 16px;\r\n}\r\n.setup-select, .setup-input {\r\n  width: 100%; padding: 10px 14px; border: 1px solid var(--border);\r\n  border-radius: var(--radius); font-size: 14px; font-family: inherit;\r\n  background: var(--surface); color: var(--text);\r\n}\r\n.setup-select:focus, .setup-input:focus {\r\n  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1);\r\n}\r\n.setup-save-btn { margin-top: 20px; width: 100%; justify-content: center; }\r\n.setup-cancel-btn { margin-top: 10px; width: 100%; justify-content: center; }\r\n.setup-hint {\r\n  margin-top: 16px; font-size: 12px; color: var(--text-muted);\r\n  padding: 10px 14px; background: #f8fafc; border-radius: var(--radius);\r\n  line-height: 1.5;\r\n}\r\n\r\n/* ── Embedded Media ── */\r\n.embed-container { position: relative; width: 100%; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }\r\n.youtube-container { padding-bottom: 56.25%; }\r\n.youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }\r\n.embed-download-link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500; }\r\n.embed-download-link:hover { text-decoration: underline; }\r\n\r\n/* ── Source Links ── */\r\n.source-links-area { margin: 20px 24px; padding: 16px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-lg); }\r\n.source-links-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }\r\n.source-links-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }\r\n.source-links-list li a {\r\n  display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--primary);\r\n  text-decoration: none; padding: 6px 10px; border-radius: var(--radius); transition: background var(--transition);\r\n}\r\n.source-links-list li a:hover { background: var(--primary-bg); text-decoration: underline; }\r\n\r\n/* ── Quiz ── */\r\n.quiz-question {\r\n  margin-bottom: 20px; padding: 18px; background: var(--surface);\r\n  border: 1px solid var(--border); border-radius: var(--radius-lg);\r\n  transition: all var(--transition);\r\n}\r\n.quiz-question:last-child { margin-bottom: 0; }\r\n.quiz-q-text {\r\n  font-weight: 600; margin-bottom: 10px; font-size: 14px;\r\n  color: var(--text); line-height: 1.6;\r\n}\r\n.quiz-option {\r\n  display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 6px;\r\n  border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;\r\n  transition: all 0.15s ease; background: #fafbfc; font-size: 14px;\r\n}\r\n.quiz-option:hover { border-color: var(--primary-light); background: var(--primary-bg); }\r\n.quiz-option.selected { border-color: var(--primary); background: var(--primary-bg); font-weight: 500; box-shadow: 0 0 0 1px var(--primary); }\r\n.quiz-option.correct { border-color: var(--success); background: var(--success-light); font-weight: 500; }\r\n.quiz-option.incorrect { border-color: var(--danger); background: var(--danger-light); }\r\n.quiz-option input[type=\"radio\"] { accent-color: var(--primary); width: 16px; height: 16px; flex-shrink: 0; }\r\n.quiz-option input[type=\"radio\"]:disabled { accent-color: #94a3b8; }\r\n.quiz-result {\r\n  margin-top: 16px; padding: 16px 20px; border-radius: var(--radius-lg);\r\n  font-weight: 600; font-size: 15px; text-align: center;\r\n}\r\n.quiz-result.pass { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; border: 1px solid #6ee7b7; }\r\n.quiz-result.fail { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #fcd34d; }\r\n\r\n/* ── Quiz Explanations ── */\r\n.quiz-explanation { margin-top: 6px; padding: 8px 12px; border-radius: var(--radius); font-size: 13px; line-height: 1.5; }\r\n.quiz-explanation.correct { background: var(--success-light); color: #065f46; border-left: 3px solid var(--success); }\r\n.quiz-explanation.incorrect { background: var(--danger-light); color: #991b1b; border-left: 3px solid var(--danger); }\r\n\r\n/* ── Quiz Result Legend ── */\r\n.quiz-legend {\r\n  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;\r\n  padding: 10px 14px; margin-bottom: 14px;\r\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);\r\n  font-size: 12px; color: var(--text-muted);\r\n}\r\n.quiz-legend-item { display: inline-flex; align-items: center; gap: 6px; }\r\n.quiz-legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }\r\n.quiz-legend-dot.dot-correct { background: #059669; }\r\n.quiz-legend-dot.dot-wrong { background: #dc2626; }\r\n.quiz-legend-dot.dot-answer { background: #3b82f6; }\r\n\r\n/* ── Quiz Result Card: options on the left, explanation panel on the right ── */\r\n.quiz-question.q-result { display: flex; flex-direction: column; gap: 12px; }\r\n.quiz-question-main { flex: 1.6 1 0; min-width: 0; }\r\n.quiz-question-aside { flex: 1 1 0; min-width: 0; }\r\n@media (min-width: 960px) {\r\n  .quiz-question.q-result { flex-direction: row; align-items: flex-start; }\r\n}\r\n\r\n/* Question header: number chip + question text + outcome pill */\r\n.quiz-q-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }\r\n.quiz-q-num {\r\n  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;\r\n  background: var(--surface-alt); color: var(--text-muted);\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  font-size: 12px; font-weight: 700;\r\n}\r\n.quiz-q-head .quiz-q-text { flex: 1; min-width: 0; margin-bottom: 0; }\r\n.quiz-q-head .quiz-q-status { flex-shrink: 0; margin: 2px 0 0; }\r\n\r\n/* Per-question outcome pill (Correct / Incorrect / Not answered) */\r\n.quiz-q-status { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }\r\n.q-status-correct { background: var(--success-light); color: #065f46; border: 1px solid #6ee7b7; }\r\n.q-status-wrong { background: var(--danger-light); color: #991b1b; border: 1px solid #fca5a5; }\r\n.q-status-empty { background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border); }\r\n\r\n/* Answer options: letter chip + text + state tag */\r\n.quiz-option { position: relative; }\r\n.quiz-opt-letter {\r\n  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;\r\n  background: var(--surface-alt); color: var(--text-muted);\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  font-size: 11px; font-weight: 700;\r\n}\r\n.quiz-opt-text { flex: 1; min-width: 0; }\r\n.quiz-opt-tag { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }\r\n\r\n/* Student picked this and it was correct → green achievement style */\r\n.quiz-option.state-correct { border-color: #34d399; background: var(--success-light); font-weight: 500; }\r\n.quiz-option.state-correct .quiz-opt-letter { background: var(--success); color: #ffffff; }\r\n.tag-correct { background: var(--success); color: #ffffff; }\r\n/* Student picked this and it was wrong → red */\r\n.quiz-option.state-wrong { border-color: #f87171; background: var(--danger-light); }\r\n.quiz-option.state-wrong .quiz-opt-letter { background: var(--danger); color: #ffffff; }\r\n.tag-wrong { background: var(--danger); color: #ffffff; }\r\n/* The real answer the student did NOT pick → informational blue, not an achievement */\r\n.quiz-option.state-answer { border-color: #93c5fd; background: #eff6ff; }\r\n.quiz-option.state-answer .quiz-opt-letter { background: #3b82f6; color: #ffffff; }\r\n.tag-answer { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }\r\n\r\n/* Explanation panel — neutral side card, clearly not an answer option */\r\n.quiz-explanation-box { background: var(--surface-alt); border: 1px dashed #cbd5e1; border-radius: var(--radius-lg); padding: 12px 14px; font-size: 13px; line-height: 1.6; }\r\n.quiz-explanation-box .exp-label { font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }\r\n.quiz-explanation-box .exp-entry { color: #475569; }\r\n.quiz-explanation-box .exp-wrong { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); color: #991b1b; }\r\n\r\n/* Dark mode */\r\nbody.dark .quiz-legend { background: #1e293b; }\r\nbody.dark .quiz-option.state-correct { background: #064e3b; border-color: #059669; }\r\nbody.dark .quiz-option.state-wrong { background: #450a0a; border-color: #dc2626; }\r\nbody.dark .quiz-option.state-answer { background: #172554; border-color: #3b82f6; }\r\nbody.dark .tag-answer { background: #1e3a8a; color: #93c5fd; border-color: #3b82f6; }\r\nbody.dark .quiz-explanation-box { border-color: #64748b; }\r\nbody.dark .quiz-explanation-box .exp-entry { color: #cbd5e1; }\r\n\r\n/* ── Quiz Difficulty Badge ── */\r\n.quiz-difficulty { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }\r\n.difficulty-easy { background: var(--success-light); color: #065f46; }\r\n.difficulty-medium { background: var(--warning-light); color: #92400e; }\r\n.difficulty-hard { background: var(--danger-light); color: #991b1b; }\r\n\r\n/* ── Quiz Set Label ── */\r\n.quiz-set-label { text-align: center; padding: 8px; margin-bottom: 12px; background: var(--primary-bg); border-radius: var(--radius); font-size: 13px; font-weight: 600; color: var(--primary); }\r\n\r\n/* ── Quiz Study Timer ── */\r\n.quiz-study-timer { text-align: center; padding: 30px 20px; }\r\n.quiz-study-icon { font-size: 48px; margin-bottom: 12px; }\r\n.quiz-study-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }\r\n.quiz-study-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.6; }\r\n.quiz-study-countdown { font-size: 20px; font-weight: 700; color: var(--primary); padding: 12px 20px; background: var(--primary-bg); border-radius: var(--radius-lg); display: inline-block; }\r\n.quiz-study-attempts { margin-top: 12px; font-size: 13px; color: var(--text-muted); }\r\n\r\n/* ── HTML Content (Lesson Notes) ── */\r\n.detail-content { line-height: 1.8; font-size: 15px; }\r\n.detail-content h2 { font-size: 20px; margin: 20px 0 10px; color: var(--text); }\r\n.detail-content h3 { font-size: 17px; margin: 16px 0 8px; color: var(--text); }\r\n.detail-content p { margin-bottom: 12px; }\r\n.detail-content ul, .detail-content ol { margin: 8px 0 12px 24px; }\r\n.detail-content li { margin-bottom: 4px; }\r\n.detail-content strong { color: var(--primary-dark); }\r\n.detail-content blockquote { border-left: 4px solid var(--primary-light); padding: 8px 16px; margin: 12px 0; background: var(--primary-bg); border-radius: 0 var(--radius) var(--radius) 0; }\r\n\r\n/* ── Loading ── */\r\n.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 14px; font-size: 14px; color: var(--text-muted); }\r\n.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }\r\n@keyframes spin { to { transform: rotate(360deg); } }\r\n\r\n/* ── PDF Fallback ── */\r\n.pdf-fallback {\r\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\r\n  gap: 10px; padding: 32px 20px; text-align: center; min-height: 180px;\r\n  background: var(--surface-alt); border-radius: var(--radius-lg);\r\n}\r\n.pdf-fallback-icon { font-size: 36px; opacity: 0.5; }\r\n.pdf-fallback-text { font-size: 14px; color: var(--text-muted); font-weight: 500; }\r\n.pdf-fallback-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }\r\n.pdf-fallback-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; max-width: 320px; line-height: 1.5; }\r\n\r\n/* ── AI-Generated Study Guide Styles ── */\r\n.study-guide { line-height: 1.8; font-size: 15px; }\r\n.sg-hero { text-align: center; padding: 32px 24px; background: linear-gradient(135deg, var(--primary-bg), #f0f4ff); border-radius: var(--radius-xl); margin-bottom: 28px; border: 1px solid var(--primary-light); }\r\n.sg-hero h1 { font-size: 26px; font-weight: 800; color: var(--primary-dark); margin-bottom: 8px; letter-spacing: -0.5px; }\r\n.sg-hero p { font-size: 15px; color: var(--text-muted); max-width: 600px; margin: 0 auto; }\r\n.sg-heading { font-size: 22px; font-weight: 800; color: var(--primary-dark); margin: 32px 0 14px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-bg); letter-spacing: -0.3px; }\r\n.sg-subheading { font-size: 17px; font-weight: 700; color: var(--text); margin: 22px 0 10px; }\r\n.sg-summary { background: linear-gradient(135deg, var(--primary-bg), #f0f4ff); border: 1px solid var(--primary-light); border-radius: var(--radius-lg); padding: 22px 26px; margin-bottom: 24px; }\r\n.sg-summary h2 { font-size: 18px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }\r\n.sg-summary ul, .sg-summary ol { margin: 0 0 0 20px; }\r\n.sg-summary li { margin-bottom: 7px; color: var(--text); }\r\n.sg-recap { background: linear-gradient(135deg, #fef3c7, #fef9e7); border-color: #fcd34d; }\r\n.sg-recap h2 { color: #92400e; }\r\n.sg-note { border-left: 4px solid var(--warning); padding: 14px 18px; margin: 18px 0; background: var(--warning-light); border-radius: 0 var(--radius) var(--radius) 0; font-style: normal; color: #92400e; }\r\n.sg-highlight { background: var(--primary-bg); border: 1px solid var(--primary-light); border-radius: var(--radius-lg); padding: 16px 20px; margin: 16px 0; }\r\n.sg-highlight strong { color: var(--primary-dark); }\r\n.sg-divider { height: 1px; background: var(--border); margin: 28px 0; }\r\n.sg-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--primary-bg); color: var(--primary); margin: 0 2px; }\r\n.sg-list { margin: 8px 0 12px 22px; }\r\n.sg-list li { margin-bottom: 6px; }\r\n.sg-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }\r\n.sg-table th { text-align: left; padding: 10px 14px; background: var(--surface-alt); font-weight: 600; border-bottom: 2px solid var(--border); }\r\n.sg-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }\r\n.sg-table tr:nth-child(even) td { background: #fafbfc; }\r\n.sg-step { display: flex; gap: 14px; margin: 14px 0; align-items: flex-start; }\r\n.sg-step-num { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }\r\n.sg-card { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin: 14px 0; background: var(--surface); }\r\n.sg-card-header { padding: 12px 18px; background: var(--surface-alt); font-weight: 700; border-bottom: 1px solid var(--border); }\r\n.sg-card-body { padding: 16px 18px; }\r\n.sg-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 14px 0; }\r\n.sg-timeline { position: relative; padding-left: 28px; margin: 14px 0; }\r\n.sg-timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--primary-light); }\r\n.sg-timeline-item { position: relative; margin-bottom: 16px; }\r\n.sg-timeline-item::before { content: ''; position: absolute; left: -24px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--primary); }\r\n\r\n/* Interactive Q&A v3 — clickable options with \"Show Answer\" button */\r\n.sg-quiz-section { margin: 28px 0; }\r\n.sg-quiz-item-v3 { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 12px; background: var(--surface); transition: all var(--transition); }\r\n.sg-quiz-item-v3:hover { border-color: var(--primary-light); }\r\n.sg-quiz-question-v3 { font-weight: 700; font-size: 15px; color: var(--text); margin-bottom: 12px; }\r\n.sg-quiz-choices-v3 { position: relative; }\r\n.sg-q-radio { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }\r\n.sg-q-opt { display: block; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; margin-bottom: 6px; background: #fafbfc; font-size: 14px; transition: all 0.15s ease; }\r\n.sg-q-opt:hover { border-color: var(--primary-light); background: var(--primary-bg); }\r\n.sg-q-radio:checked + .sg-q-opt { border-color: var(--primary); background: var(--primary-bg); font-weight: 600; box-shadow: 0 0 0 1px var(--primary); }\r\n.sg-q-radio:disabled + .sg-q-opt { opacity: 0.6; cursor: not-allowed; }\r\n/* Show Answer button */\r\n.sg-show-answer-btn {\r\n  display: inline-flex; align-items: center; gap: 6px;\r\n  margin-top: 14px; padding: 8px 18px;\r\n  border: 1px solid var(--primary); border-radius: var(--radius);\r\n  background: var(--primary-bg); color: var(--primary);\r\n  font-size: 13px; font-weight: 600; cursor: pointer;\r\n  transition: all var(--transition);\r\n  font-family: inherit;\r\n}\r\n.sg-show-answer-btn:hover:not(:disabled) { background: var(--primary); color: #fff; }\r\n.sg-show-answer-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: var(--border); background: var(--surface-alt); color: var(--text-muted); }\r\n/* Feedback — hidden by default (inline style), shown via JS */\r\n.sg-q-feedback {\r\n  display: none; margin-top: 14px; padding: 14px 16px;\r\n  background: linear-gradient(135deg, #d1fae5, #ecfdf5);\r\n  border: 1px solid #6ee7b7; border-radius: var(--radius-lg);\r\n  animation: sgFadeSlide 0.3s ease;\r\n}\r\n.sg-q-feedback .sg-answer-correct { font-size: 15px; margin-bottom: 6px; color: #065f46; }\r\n.sg-q-feedback .sg-answer-correct strong { color: var(--success); }\r\n.sg-q-feedback .sg-answer-wrong { font-size: 15px; margin-bottom: 6px; color: #991b1b; }\r\n.sg-q-feedback .sg-answer-wrong strong { color: var(--danger); }\r\n.sg-q-feedback .sg-explanation { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-top: 6px; }\r\n@keyframes sgFadeSlide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }\r\n\r\n/* Responsive grid */\r\n@media (max-width: 600px) {\r\n  .sg-grid-2 { grid-template-columns: 1fr; }\r\n  .sg-hero { padding: 20px 16px; }\r\n  .sg-hero h1 { font-size: 20px; }\r\n}\r\n\r\n/* ── Study Navigation ──\r\n   Desktop (≥1200px): vertical step rail on the left.\r\n   Tablet (768–1199px): horizontal scrollable bar on top.\r\n   Mobile (<768px): hidden — accordion step headers instead. */\r\n.study-tabs {\r\n  display: none;\r\n  flex-shrink: 0;\r\n  position: sticky; top: 58px; z-index: 6;\r\n  background: var(--surface);\r\n  overflow-y: auto; overflow-x: hidden;\r\n  scrollbar-width: none;\r\n}\r\n.study-tabs::-webkit-scrollbar { display: none; }\r\n.study-tabs-inner {\r\n  display: flex; flex-direction: column; justify-content: flex-start;\r\n  gap: 2px; padding: 12px 10px;\r\n}\r\n.study-tab-btn {\r\n  display: flex; align-items: center; gap: 10px;\r\n  padding: 10px 14px; border: none; border-left: 3px solid transparent;\r\n  background: none; font-size: 13px; font-weight: 500;\r\n  color: var(--text-muted); cursor: pointer;\r\n  transition: all var(--transition);\r\n  font-family: inherit; white-space: normal; line-height: 1.35; text-align: left;\r\n  border-radius: var(--radius);\r\n}\r\n.study-tab-btn:hover { color: var(--text); background: var(--surface-alt); }\r\n.study-tab-btn.active { color: var(--primary); border-left-color: var(--primary); background: var(--primary-bg); font-weight: 600; }\r\n.study-tab-badge {\r\n  width: 22px; height: 22px; border-radius: 50%;\r\n  background: var(--surface-alt); color: var(--text-muted);\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  font-size: 11px; font-weight: 700; flex-shrink: 0;\r\n}\r\n.study-tab-btn.active .study-tab-badge { background: var(--primary); color: #fff; }\r\n\r\n/* Tab text: main title + small one-line subtitle (rail only — keeps the\r\n   tablet bar clean and uncluttered) */\r\n.study-tab-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }\r\n.study-tab-title { font-weight: inherit; color: inherit; }\r\n.study-tab-sub {\r\n  display: none;\r\n  font-size: 11px; font-weight: 400; line-height: 1.25;\r\n  color: var(--text-light);\r\n}\r\n.study-tab-btn.active .study-tab-sub { color: var(--primary-light); }\r\n@media (min-width: 1200px) {\r\n  .study-tab-sub { display: block; }\r\n}\r\n\r\n/* ── Desktop & tablet: tab panels (step headers replaced by tabs) ── */\r\n@media (min-width: 768px) {\r\n  .study-steps { gap: 0; }\r\n  .study-step {\r\n    border: none; border-bottom: none;\r\n    background: var(--surface);\r\n  }\r\n  .study-step-header {\r\n    display: none; /* hidden – tabs replace them */\r\n  }\r\n  .study-step-toggle { display: none; }\r\n  .study-step-connector { display: none; }\r\n  .study-step-body {\r\n    display: none !important; padding: 0; background: var(--surface); animation: none;\r\n  }\r\n  /* Active tab shows its body */\r\n  .study-step.active-tab .study-step-body {\r\n    display: block !important; min-height: 50vh;\r\n    padding-bottom: 48px; /* breathing room below the last block */\r\n  }\r\n  .study-step-body .detail-content { margin-top: 0; padding: 0 24px 36px 24px; }\r\n  .study-step-body .study-embed { padding: 0 24px; }\r\n  .study-step-body .study-embed:last-child { padding-bottom: 32px; }\r\n  .study-step-body .study-quiz-wrap { padding: 0 24px 32px; }\r\n}\r\n\r\n/* ── Tablet: horizontal tab bar on top ── */\r\n@media (min-width: 768px) and (max-width: 1199px) {\r\n  .study-tabs {\r\n    display: block;\r\n    position: sticky; top: 58px; z-index: 6;\r\n    background: var(--surface);\r\n    border-bottom: 1px solid var(--border);\r\n    overflow-x: auto; overflow-y: hidden;\r\n    -webkit-overflow-scrolling: touch;\r\n    scrollbar-width: none;\r\n  }\r\n  .study-tabs-inner { flex-direction: row; gap: 0; min-width: max-content; padding: 0 20px; }\r\n  .study-tab-btn {\r\n    border-left: none; border-bottom: 2px solid transparent;\r\n    padding: 13px 18px; border-radius: 0;\r\n    white-space: nowrap; line-height: 1.5;\r\n  }\r\n  .study-tab-btn.active { border-bottom-color: var(--primary); background: none; }\r\n}\r\n\r\n/* ── Desktop: vertical step rail on the left ── */\r\n@media (min-width: 1200px) {\r\n  .study-flow { display: flex; align-items: flex-start; }\r\n  .study-tabs {\r\n    display: block;\r\n    width: 264px; flex-shrink: 0;\r\n    position: sticky; top: 58px; z-index: 6;\r\n    max-height: calc(100vh - 116px);\r\n    background: var(--surface);\r\n    border-right: 1px solid var(--border);\r\n    overflow-y: auto; overflow-x: hidden;\r\n    scrollbar-width: none;\r\n  }\r\n  .study-tabs-inner { flex-direction: column; gap: 2px; padding: 14px 10px; }\r\n  .study-steps { flex: 1; min-width: 0; }\r\n}\r\n\r\n/* ── Mobile: accordion (tabs hidden) ── */\r\n@media (max-width: 767px) {\r\n  .study-tabs { display: none; }\r\n}\r\n\r\n/* ── Responsive ── */\r\n@media (max-width: 768px) {\r\n  .section-grid { grid-template-columns: 1fr; padding: 0 16px 16px; }\r\n  .view { padding: 0 16px 16px; }\r\n  .toolbar { padding: 14px 16px 10px; }\r\n  .detail-breadcrumb { padding: 12px 16px 4px; }\r\n  .detail-hero { padding: 8px 16px 20px; }\r\n  .detail-title { font-size: 20px; }\r\n  .study-step-header { padding: 16px 16px; gap: 12px; pointer-events: auto; cursor: pointer; }\r\n  .study-step-body { padding: 0 16px 24px 58px; }\r\n  .study-step-badge { width: 32px; height: 32px; font-size: 13px; }\r\n  .study-step-icon { font-size: 24px; }\r\n  .study-step-title { font-size: 16px; font-weight: 600; color: var(--text); }\r\n  .study-step-toggle { display: flex; }\r\n  .study-step-connector { display: block; }\r\n  .detail-nav { padding: 16px; flex-wrap: wrap; justify-content: center; }\r\n  .detail-nav-center { order: -1; width: 100%; justify-content: center; }\r\n  .lesson-card { flex-direction: column; align-items: flex-start; }\r\n  .lesson-card-badge { align-self: flex-start; }\r\n}\r\n@media (max-width: 480px) {\r\n  .study-step-body { padding: 0 12px 20px 12px; }\r\n  .study-step-info { flex-wrap: wrap; }\r\n}\r\n\r\n/* ═══════════════════════════════════════════\r\n   RICH COMPONENT LIBRARY STYLES (72 components)\r\n   Synced with Curriculum Builder — all AI-generated\r\n   study guide components render correctly.\r\n   ═══════════════════════════════════════════ */\r\n\r\n/* ── Inline Flashcards (click-to-flip via checkbox hack) ── */\r\n/* Legacy styles — kept for old generated content */\r\n.fc-card-wrapper { perspective: 600px; }\r\n.fc-card-label { display: block; cursor: pointer; }\r\n.fc-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s ease; transform-style: preserve-3d; }\r\n.fc-flip-check:checked + .fc-card-label .fc-card-inner { transform: rotateY(180deg) !important; }\r\n.fc-card-wrapper:hover .fc-card-inner { box-shadow: 0 4px 16px rgba(79,70,229,0.15); }\r\n.fc-front, .fc-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }\r\n.fc-front { background: linear-gradient(135deg, #eef2ff, #f0f4ff); border: 2px solid #818cf8; }\r\n.fc-back { background: linear-gradient(135deg, #d1fae5, #ecfdf5); border: 2px solid #6ee7b7; transform: rotateY(180deg); }\r\n\r\n/* ── ENHANCED Inline Flashcards (efc- prefix, from Curriculum Builder v2) ── */\r\n.efc-flip-check:checked + .efc-card-label .efc-card-inner { transform: rotateY(180deg) !important; }\r\n.efc-card-label { display: block; cursor: pointer; }\r\n.efc-card-label:hover .efc-front,\r\n.efc-card-label:hover .efc-back { box-shadow: 0 6px 20px rgba(79,70,229,0.15) !important; }\r\n.efc-content { display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; padding: 6px 2px; }\r\n.efc-content > * { margin: auto 0; min-height: 0; }\r\n.efc-content::-webkit-scrollbar { width: 4px; }\r\n.efc-content::-webkit-scrollbar-thumb { background: var(--border, #e2e8f0); border-radius: 4px; }\r\n.efc-mastered-check:checked ~ .efc-card-label .efc-front,\r\n.efc-mastered-check:checked ~ .efc-card-label .efc-back { opacity: 0.5; filter: grayscale(35%); }\r\n/* ── Student Tool: Enhanced Flashcard Grid (sfc- prefix) ── */\r\n.sfc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }\r\n.sfc-card-wrapper { perspective: 1000px; }\r\n.sfc-card { cursor: pointer; height: 260px; }\r\n.sfc-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }\r\n.sfc-flipped .sfc-card-inner { transform: rotateY(180deg); }\r\n.sfc-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.04); overflow: hidden; }\r\n.sfc-front { background: linear-gradient(145deg, #eef2ff 0%, #fff 100%); border: 2px solid #4f46e533; }\r\n.sfc-back { background: linear-gradient(145deg, #ecfdf5 0%, #f0fdf4 100%); border: 2px solid #05966933; transform: rotateY(180deg); }\r\n.sfc-card-wrapper:hover .sfc-face { box-shadow: 0 6px 20px rgba(79,70,229,0.12); }\r\n.sfc-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; min-height: 0; padding: 6px 2px; }\r\n.sfc-content > * { margin: auto 0; min-height: 0; }\r\n.sfc-content::-webkit-scrollbar { width: 4px; }\r\n.sfc-content::-webkit-scrollbar-thumb { background: var(--border, #e2e8f0); border-radius: 4px; }\r\n.sfc-filter-chip { transition: all 0.15s ease; }\r\n.sfc-filter-chip:hover { opacity: 0.85; transform: translateY(-1px); }\r\n.sfc-filter-active { box-shadow: 0 2px 8px rgba(79,70,229,0.3) !important; }\r\n.sfc-know-btn { transition: all 0.2s ease; }\r\n.sfc-know-btn:hover { background: #eef2ff !important; border-color: #818cf8 !important; }\r\n\r\n/* Status filter buttons (All / Pending / Done) */\r\n.sfc-status-btn { transition: all 0.15s ease; }\r\n.sfc-status-btn:hover { opacity: 0.85; transform: translateY(-1px); }\r\n.sfc-status-active { background: #4f46e5 !important; color: #fff !important; border-color: #4f46e5 !important; box-shadow: 0 2px 8px rgba(79,70,229,0.3); }\r\n/* Mastered cards: extra transparency so they're easily distinguishable from pending */\r\n.sfc-mastered .sfc-front,\r\n.sfc-mastered .sfc-back { opacity: 0.45; filter: grayscale(40%); }\r\n.sfc-mastered .sfc-know-btn { background: #d1fae5 !important; color: #059669 !important; border-color: #6ee7b7 !important; }\r\n\r\n/* Dark mode for enhanced flashcards */\r\nbody.dark .sfc-front { background: linear-gradient(145deg, #1e1b4b 0%, #1e293b 100%); border-color: #4338ca44; }\r\nbody.dark .sfc-back { background: linear-gradient(145deg, #064e3b 0%, #0f172a 100%); border-color: #05966944; }\r\nbody.dark .sfc-content { color: #e2e8f0; }\r\n/* sfc-filter-chip colors set inline — dark mode handled by component */\r\nbody.dark .efc-front { background: linear-gradient(145deg, #1e1b4b 0%, #1e293b 100%) !important; }\r\nbody.dark .efc-back { background: linear-gradient(145deg, #064e3b 0%, #0f172a 100%) !important; }\r\nbody.dark .efc-content { color: #e2e8f0; }\r\n\r\n/* ── Self-Assessment Stars ── */\r\n.sa-radio:checked + .sa-star {\r\n  filter: none !important; opacity: 1 !important;\r\n  transform: scale(1.15);\r\n}\r\n.sa-star {\r\n  transition: all 0.2s ease;\r\n}\r\n.sa-star:hover {\r\n  filter: none !important; opacity: 0.8 !important;\r\n}\r\n\r\n/* ── Study Guide Interactive ── */\r\ndetails summary {\r\n  padding: 8px 0; font-weight: 600; color: var(--primary);\r\n  cursor: pointer; user-select: none;\r\n}\r\ndetails summary:hover { color: var(--primary-dark); }\r\ndetails summary::-webkit-details-marker { display: none; }\r\n\r\n/* Resource link hover */\r\na[rel=\"noopener\"]:hover {\r\n  background: #f8fafc !important; border-color: #818cf8 !important;\r\n}\r\n\r\n/* Blockquote within detail-content */\r\n.detail-content blockquote,\r\n.study-guide blockquote { margin: 0; }\r\n.detail-content blockquote p,\r\n.study-guide blockquote p { margin: 0; }\r\n\r\n/* ── Dark Mode — Rich Components ── */\r\nbody.dark .fc-front {\r\n  background: linear-gradient(135deg, #1e1b4b, #312e81);\r\n  border-color: #4338ca;\r\n}\r\nbody.dark .fc-front div { color: #e2e8f0; }\r\nbody.dark .fc-back {\r\n  background: linear-gradient(135deg, #064e3b, #065f46);\r\n  border-color: #059669;\r\n}\r\nbody.dark .fc-back div { color: #e2e8f0; }\r\nbody.dark details summary { color: #818cf8; }\r\nbody.dark details summary:hover { color: #a5b4fc; }\r\nbody.dark a[rel=\"noopener\"]:hover {\r\n  background: #334155 !important; border-color: #818cf8 !important;\r\n}\r\nbody.dark .sg-table tr:nth-child(even) td { background: #1e293b; }\r\nbody.dark .sg-divider { background: #475569; }\r\nbody.dark .sg-highlight { background: #1e1b4b; border-color: #4338ca; }\r\nbody.dark .sg-highlight strong { color: #a5b4fc; }\r\nbody.dark .sg-summary { background: linear-gradient(135deg, #1e1b4b, #312e81); border-color: #4338ca; }\r\nbody.dark .sg-summary h2 { color: #a5b4fc; }\r\nbody.dark .sg-note { background: #422006; color: #fbbf24; }\r\nbody.dark .sg-recap { background: linear-gradient(135deg, #422006, #78350f); border-color: #d97706; }\r\nbody.dark .sg-card { background: #1e293b; }\r\nbody.dark .sg-card-header { background: #334155; }\r\nbody.dark .sg-timeline::before { background: #4338ca; }\r\nbody.dark .sg-step-num { background: #4338ca; }\r\n\r\n/* ── Charts & Data Viz Dark Mode ── */\r\nbody.dark .sg-quiz-section .sg-q-feedback {\r\n  background: linear-gradient(135deg, #064e3b, #065f46);\r\n  border-color: #059669;\r\n}\r\n\r\n/* ── Spotlight animation ── */\r\n@keyframes sgSpotlight {\r\n  0%, 100% { box-shadow: 0 0 10px rgba(79,70,229,0.15); transform: scale(1); }\r\n  50% { box-shadow: 0 0 25px rgba(79,70,229,0.35); transform: scale(1.01); }\r\n}\r\n.sg-spotlight { animation: sgSpotlight 2.5s ease-in-out infinite; }\r\n\r\n/* ── Flip Card (solo-study key concept drill) ── */\r\n.sg-flip-card { transition: transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }\r\n.sg-flip-card:hover { filter: brightness(0.97); }\r\n\r\n/* ── Process Flow step hover ── */\r\n.process-flow-step:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); transition: all 0.2s; }\r\n\r\n/* ── Mind Map node hover ── */\r\n.mind-map-node { transition: transform 0.2s, box-shadow 0.2s; }\r\n.mind-map-node:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }\r\n\r\n/* ── Hierarchy Tree node hover ── */\r\n.hierarchy-node:hover { filter: brightness(0.96); transform: scale(1.03); transition: all 0.15s; }\r\n\r\n/* ── Slider Compare panel hover ── */\r\n.slider-compare-panel { transition: transform 0.2s; }\r\n.slider-compare-panel:hover { transform: scale(1.01); }\r\n\r\n/* ── Dark mode: flip-card ── */\r\nbody.dark .sg-flip-front { background: #1e293b; border-color: #3730a3; }\r\nbody.dark .sg-flip-front div { color: #c7d2fe; }\r\nbody.dark .sg-flip-front div:first-child { color: #818cf8; }\r\nbody.dark .sg-flip-back { background: #0f2b1a; border-color: #166534; }\r\nbody.dark .sg-flip-back div { color: #d1fae5; }\r\nbody.dark .sg-flip-back div:first-child { color: #34d399; }\r\n\r\n/* ── Dark mode: typewriter ── */\r\nbody.dark .typewriter-box { background: #0f172a; }\r\n\r\n/* ── Dark mode: count-up ── */\r\nbody.dark .count-up-box { background: rgba(79,70,229,0.08); }\r\n\r\n/* ── Dark mode: mind-map / process-flow / hierarchy-tree ── */\r\nbody.dark .mind-map-node,\r\nbody.dark .process-flow-step,\r\nbody.dark .hierarchy-node { background: #1e293b; border-color: #334155; }\r\nbody.dark .slider-compare-panel { background: #1e293b; }\r\n\r\n/* ── Presentation Slides ── */\r\n.pres-slides-wrap { background: var(--surface-alt, #f1f5f9); padding: 16px; }\r\n.pres-slides-wrap .pres-slide { display: none; align-items: center; justify-content: center; width: 100%; aspect-ratio: 16/9; padding: 0; box-sizing: border-box; position: relative; overflow: hidden; page-break-after: always; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); margin-bottom: 16px; }\r\n.pres-slides-wrap .pres-slide:first-child { display: flex; }\r\n.pres-slides-wrap .pres-slide:last-child { margin-bottom: 0; }\r\n/* Remove any forced background — let AI-generated inline styles take precedence */\r\n.pres-slides-wrap .pres-slide .pres-slide-inner { max-width: 800px; width: 100%; margin: auto; } /* Fallback: show first slide even if JS fails */\r\n.pres-slides-wrap .pres-slide-inner { max-width: 800px; width: 100%; }\r\n.pres-fullscreen { position: fixed !important; inset: 0 !important; z-index: 9999 !important; background: #0f172a !important; border-radius: 0 !important; border: none !important; overflow-y: auto !important; padding: 0 !important; }\r\n.pres-fullscreen .pres-slide { min-height: 100vh; aspect-ratio: auto; margin-bottom: 0 !important; border-radius: 0 !important; box-shadow: none !important; }\r\n\r\n/* Fullscreen overlay nav bar */\r\n.pres-fs-nav { display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10001; background: rgba(30,41,59,0.92); backdrop-filter: blur(10px); border-radius: 40px; padding: 8px 18px; gap: 10px; align-items: center; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }\r\n.pres-fs-nav.show { display: flex; }\r\n.pres-fs-nav button { padding: 8px 18px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; transition: all 0.15s; white-space: nowrap; }\r\n.pres-fs-nav button:hover { background: rgba(255,255,255,0.2); }\r\n.pres-fs-nav .pres-fs-counter { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600; min-width: 100px; text-align: center; }\r\n.pres-fs-exit { background: rgba(220,38,38,0.35) !important; border-color: rgba(220,38,38,0.5) !important; }\r\n.pres-fs-exit:hover { background: rgba(220,38,38,0.55) !important; }\r\n\r\n/* Print / PDF export */\r\n@media print {\r\n  body * { visibility: hidden; }\r\n  .pres-slides-wrap, .pres-slides-wrap * { visibility: visible; }\r\n  .pres-slides-wrap { position: absolute; left: 0; top: 0; width: 100%; border: none !important; border-radius: 0 !important; }\r\n  .pres-slides-wrap .pres-slide { page-break-after: always; break-after: page; width: 100vw; height: 100vh; padding: 60px; display: flex !important; }\r\n  .pres-nav { display: none !important; }\r\n  @page { margin: 0; size: landscape; }\r\n}\r\n\r\n/* Dark mode presentation */\r\nbody.dark .pres-slides-wrap { background: #0f172a; }\r\nbody.dark .pres-slides-wrap .pres-slide { color: #e2e8f0; }\r\nbody.dark .pres-fullscreen { background: #0f172a !important; }\r\n\r\n/* ── Progress report / activity log (T27) ── */\r\n#progress-report-panel { margin-bottom: 18px; }\r\n.rp-panel { background: var(--surface); border: 1px solid var(--border, #e2e8f0); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }\r\n.rp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px 10px; flex-wrap: wrap; }\r\n.rp-title { font-weight: 700; font-size: 15px; color: var(--text, #1e293b); }\r\n.rp-sub { font-size: 11px; color: var(--text-muted); }\r\n.rp-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }\r\n.rp-chip { background: var(--surface-alt); border: 1px solid var(--border, #e2e8f0); border-radius: 14px; padding: 3px 10px; font-size: 11px; color: var(--text-muted); }\r\n.rp-chip strong { color: var(--text, #1e293b); }\r\n.rp-chart { display: flex; align-items: flex-end; gap: 6px; padding: 8px 16px 12px; min-height: 110px; }\r\n.rp-bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }\r\n.rp-bar { width: 72%; max-width: 28px; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 4px; }\r\n.rp-bar-zero { background: var(--border, #e2e8f0); }\r\n.rp-bar-val { font-size: 10px; font-weight: 700; color: var(--primary); }\r\n.rp-bar-day { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; text-align: center; }\r\n.rp-list { padding: 0 16px 12px; border-top: 1px solid var(--border, #e2e8f0); }\r\n.rp-day { padding: 8px 0; }\r\n.rp-day + .rp-day { border-top: 1px dashed var(--border, #e2e8f0); }\r\n.rp-day-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--text, #1e293b); margin-bottom: 4px; }\r\n.rp-day-count { font-size: 11px; font-weight: 600; color: var(--primary); background: var(--primary-bg); border-radius: 10px; padding: 1px 8px; }\r\n.rp-item { font-size: 12px; color: var(--text-muted); padding: 2px 0 2px 10px; border-left: 2px solid var(--primary-light); margin-left: 2px; }\r\n.rp-item-sec { opacity: 0.75; }\r\n.rp-item-score { font-weight: 700; color: var(--text, #1e293b); }\r\n.rp-empty { text-align: center; color: var(--text-muted); font-size: 12px; padding: 16px; }\r\n.rp-more { text-align: center; font-size: 11px; color: var(--text-muted); padding-top: 4px; }\r\n.rp-compact .rp-chart { min-height: 90px; }\r\n\r\n/* ── Custom drawer (replaces prompt()/confirm() in sandboxed iframes) ── */\r\n.drawer-overlay { position: fixed; inset: 0; z-index: 10002; display: flex; align-items: flex-end; justify-content: center; }\r\n.drawer-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); }\r\n.drawer-panel { position: relative; width: 100%; max-width: 460px; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.22); padding: 16px 20px 20px; animation: drawer-slide-up 0.18s ease; }\r\n@keyframes drawer-slide-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\r\n.drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }\r\n.drawer-title { font-weight: 700; font-size: 15px; color: var(--text); }\r\n.drawer-close { border: none; background: transparent; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px 8px; font-family: inherit; }\r\n.drawer-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }\r\n.drawer-input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border, #e2e8f0); border-radius: 8px; background: var(--surface); color: var(--text); font-family: inherit; }\r\n.drawer-input:focus { outline: 2px solid var(--primary-light); border-color: var(--primary); }\r\n.drawer-error { margin-top: 8px; font-size: 12px; color: #dc2626; }\r\n.drawer-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }\r\n\r\n/* ── View tabs (supervisor role switch + student sub-tabs) ── */\r\n.view-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0; }\r\n.view-tab { border: 1px solid var(--border, #e2e8f0); background: var(--surface); color: var(--text-muted); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }\r\n.view-tab:hover { border-color: var(--primary-light); color: var(--primary); }\r\n.view-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }\r\n.view-tab-action { margin-left: auto; padding: 6px 12px; }\r\n\r\n/* ── Slim utility header (title, dashboard & change-course buttons removed) ── */\r\n.app-header.app-header-util { padding: 6px 16px; box-shadow: none; }"},"js":{"name":"SelfPacedEducationBySection.js","src":"../app/SelfPacedEducationBySection.js","content":"/* ── Self-Paced Education by Section (STUDENT TOOL) ──\r\n   Reads curriculum from a Curriculum Builder CMS object.\r\n   Progress stored locally per student via tool.setValue().\r\n   Built for UniconHub CMS html-tool system.\r\n────────────────────────────────────────── */\r\n\r\n/* ── Helpers ── */\r\nfunction genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\r\nfunction esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\r\nfunction el(id) { return document.getElementById(id); }\r\n\r\n/* ── State ── */\r\nvar CONFIG = { curriculumSourceId: '', managementType: 'self_paced', dashboardVisible: false, studentName: '', emailAddress: '', courseStartDate: '', targetEndDate: '', coursePageUrl: '' }; // Object-level config (set by admin per object)\r\nvar SECTIONS = [];            // Section array from curriculum\r\nvar PROGRESS = {};            // { sectionId: { lessonId: { status, score, completedAt, quizAnswers, ... } } }\r\nvar currentView = 'sections'; // 'sections' | 'lessons' | 'lesson-detail' | 'setup'\r\nvar currentSectionId = null;\r\nvar currentLessonId = null;\r\nvar quizAnswers = {};\r\nvar quizSubmitted = false;\r\nvar activeStudyTab = 0;                 // remember which tab is open across re-renders\r\nvar _suppressNextValueChange = false;   // skip onValueChange reload after our own save\r\nvar _lastSavedJson = null;              // JSON of our last internal save (to tell internal vs external changes apart)\r\nvar _lastSavedAt = 0;                   // timestamp of our last internal save (stale-echo protection)\r\nvar availableCurriculums = []; // Cached list of Builder objects for the setup picker\r\nvar CURRICULUM_NAME = '';      // Course name from the selected Curriculum Builder object\r\nvar _tenantNameResolved = false; // tenant-name detection ran once\r\nvar _tenantNameValue = '';       // detected tenant name ('' = none)\r\nvar _studyPageUrlResolved = false; // study-page link detection ran once\r\nvar _studyPageUrlValue = '';       // detected study page link ('' = none)\r\nvar currentRoleView = 'supervisor'; // supervisors only: 'supervisor' | 'student'\r\nvar currentStudentTab = 'course';   // student view sub-tab: 'course' | 'dashboard' | 'report'\r\n\r\n/* ── Constants ── */\r\nvar SECTIONS_TYPE = 'curriculum-builder-uniconbaseapps';\r\nvar LESSON_DOC_TYPE = 'curriculum-lessons-uniconbase';\r\nvar MIN_PASS_SCORE = 60;\r\nvar QUIZ_SETS = 3;\r\nvar QUIZ_PER_SET = 5;\r\nvar STUDY_WAIT_MIN = 30;\r\n\r\n/* ── Lesson Doc Loader (Phase 2: read heavy content from separate docs) ── */\r\n/** Fetch a lesson's heavy content from its curriculum-lessons-uniconbase doc.\r\n *  Falls back to the main curriculum doc data if lesson doc is unavailable. */\r\nfunction loadLessonDocData(lesson, callback) {\r\n  if (!lesson || !lesson.lessonDocId || typeof tool.requestObjects !== 'function') {\r\n    // No lesson doc — use data already in the lesson object (backward compat)\r\n    if (callback) callback(null, lesson);\r\n    return;\r\n  }\r\n  tool.requestObjects('get', {\r\n    mainObjectType: LESSON_DOC_TYPE,\r\n    objectId: lesson.lessonDocId\r\n  }, function(err, result) {\r\n    if (err || !result || !result.object) {\r\n      // Fall back to main doc data, but make the misconfiguration visible.\r\n      if (!window._lessonDocLoadWarned) {\r\n        window._lessonDocLoadWarned = true;\r\n        tool.notify('⚠️ Could not load the lesson document. Add { \"mainObjectType\": \"curriculum-lessons-uniconbase\", \"role\": \"editor\", \"scope\": \"shared\", \"targetCollection\": \"private\" } to this field\\'s allowedObjectTypes.', 'warning');\r\n      }\r\n      if (callback) callback(null, lesson);\r\n      return;\r\n    }\r\n    try {\r\n      var pd = result.object.productData;\r\n      var raw = pd && pd.data_categoriesBased && pd.data_categoriesBased.lessonJson;\r\n      var docData = raw ? JSON.parse(raw) : {};\r\n      // Merge: lesson doc data wins, main doc as fallback\r\n      var enriched = JSON.parse(JSON.stringify(lesson));\r\n      if (docData.content !== undefined) enriched.content = docData.content;\r\n      if (docData.htmlCode !== undefined) enriched.htmlCode = docData.htmlCode;\r\n      if (docData.studyHtmlData !== undefined) enriched.studyHtmlData = docData.studyHtmlData;\r\n      if (docData.presentationHtml !== undefined) enriched.presentationHtml = docData.presentationHtml;\r\n      if (docData.flashcards !== undefined) enriched.flashcards = docData.flashcards;\r\n      if (docData.quiz !== undefined) enriched.quiz = docData.quiz;\r\n      if (docData.sourceUrls !== undefined) enriched.sourceUrls = docData.sourceUrls;\r\n      if (docData.hiddenSections !== undefined) enriched.hiddenSections = docData.hiddenSections;\r\n      if (callback) callback(null, enriched);\r\n    } catch(e) {\r\n      // Parse error — fall back to main doc\r\n      if (callback) callback(null, lesson);\r\n    }\r\n  });\r\n}\r\n\r\n/** One-time startup probe: verify the tool can read lesson docs via CRUD.\r\n *  If not, the field's allowedObjectTypes is missing the lesson-doc type —\r\n *  show the admin exactly what to add. */\r\nfunction probeLessonDocAccess() {\r\n  if (window._lessonDocProbeDone || typeof tool.requestObjects !== 'function') return;\r\n  window._lessonDocProbeDone = true;\r\n  var all = getAllLessonsInOrder();\r\n  var probeId = null;\r\n  for (var i = 0; i < all.length; i++) {\r\n    if (all[i].lesson && all[i].lesson.lessonDocId) { probeId = all[i].lesson.lessonDocId; break; }\r\n  }\r\n  if (!probeId) return;\r\n  tool.requestObjects('get', {\r\n    mainObjectType: LESSON_DOC_TYPE,\r\n    objectId: probeId\r\n  }, function(err, result) {\r\n    if (err || !result || !result.object) {\r\n      tool.notify('⚠️ Lesson documents are not readable from this tool. Add { \"mainObjectType\": \"curriculum-lessons-uniconbase\", \"role\": \"editor\", \"scope\": \"shared\", \"targetCollection\": \"private\" } to this field\\'s allowedObjectTypes.', 'warning');\r\n    }\r\n  });\r\n}\r\n\r\n/* ── Role check ── */\r\n/** Uses effectiveAccess.isManager (raw object-level admin flag) to determine\r\n *  if the current user has admin/manager rights on this CMS record.\r\n *  This disambiguates system-level from object-level access — unlike the\r\n *  merged roles[] array, which may include 'admin' for everyone if the\r\n *  object's folder/app permissions grant broad access. */\r\nfunction isAdmin() {\r\n  var user = tool.getUser();\r\n  if (!user) return false;\r\n  // Primary: raw object-level manager flag (most reliable)\r\n  if (user.effectiveAccess && user.effectiveAccess.isManager) return true;\r\n  // Fallback: system-level developer/owner always have full access\r\n  var roles = user.roles || [];\r\n  for (var i = 0; i < roles.length; i++) {\r\n    var r = (roles[i] || '').toLowerCase();\r\n    if (r === 'developer' || r === 'owner') return true;\r\n  }\r\n  return false;\r\n}\r\n\r\n/* ── URL Transform: Storage → Hosting proxy ── */\r\nfunction toHostingUrl(url) {\r\n  if (!url) return url;\r\n  // Firebase Storage URL → Firebase Hosting + Cloud Function proxy\r\n  // https://firebasestorage.googleapis.com/v0/b/PROJECTID.appspot.com/o/PATH?alt=media&token=X\r\n  // → https://PROJECTID.firebaseapp.com/files/PATH?alt=media&token=X\r\n  // The Cloud Function at /files/** reads from Storage server-side and returns\r\n  // the PDF with embed-friendly headers (no X-Frame-Options).\r\n  // NOTE: using .firebaseapp.com (not .web.app) — .web.app is frequently on\r\n  // ad-blocker/security blocklists since it's a common free-hosting domain.
