\r\n  return url.replace(\r\n    /https:\\/\\/firebasestorage\\.googleapis\\.com\\/v0\\/b\\/([^/]+?)(?:\\.appspot\\.com)?\\/o\\//,\r\n    'https://$1.firebaseapp.com/files/'\r\n  );\r\n}\r\n\r\n/* ── PDF.js: dynamic ES-module loader + canvas renderer (avoids nested iframes entirely) ── */\r\n// PDF.js v4+ ships ONLY as ES modules (pdf.mjs / pdf.worker.mjs) — there is no\r\n// legacy \"pdf.min.js\" global-script build anymore, so we must load it via a\r\n// dynamic import() rather than a <script src> tag (which 404s every time).\r\n// Try our own Firebase Hosting domain FIRST (proven reliable all session), then\r\n// fall back to the public CDN in case the self-hosted copy is missing/not deployed yet.\r\nvar PDFJS_SOURCES = [\r\n  { base: 'https://websites-a0e13.firebaseapp.com/vendor/pdfjs/', lib: 'pdf.mjs', worker: 'pdf.worker.mjs' },\r\n  { base: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/', lib: 'pdf.min.mjs', worker: 'pdf.worker.min.mjs' }\r\n];\r\nvar pdfJsLoadPromise = null;\r\n\r\nfunction loadModuleFrom(source) {\r\n  return import(/* webpackIgnore: true */ source.base + source.lib).then(function(mod) {\r\n    mod.GlobalWorkerOptions.workerSrc = source.base + source.worker;\r\n    window.pdfjsLib = mod;\r\n  });\r\n}\r\n\r\nfunction ensurePdfJsLoaded() {\r\n  if (window.pdfjsLib) return Promise.resolve();\r\n  if (pdfJsLoadPromise) return pdfJsLoadPromise;\r\n  pdfJsLoadPromise = PDFJS_SOURCES.reduce(function(chain, source) {\r\n    return chain.catch(function() { return loadModuleFrom(source); });\r\n  }, Promise.reject());\r\n  return pdfJsLoadPromise;\r\n}\r\n\r\n/** Fetches a PDF via fetch() (NOT an iframe navigation — avoids the sandboxed\r\n *  nested-frame blocking seen on this CMS) and renders every page as a\r\n *  <canvas> directly into the given container element. */\r\nfunction renderPdfIntoContainer(containerId, url) {\r\n  var container = el(containerId);\r\n  if (!container) return;\r\n  container.innerHTML = '<div class=\"pdf-canvas-loading\">⏳ Loading PDF…<\/div>';\r\n\r\n  ensurePdfJsLoaded()\r\n    .then(function() {\r\n      return fetch(url).then(function(resp) {\r\n        if (!resp.ok) throw new Error('HTTP ' + resp.status);\r\n        return resp.arrayBuffer();\r\n      });\r\n    })\r\n    .then(function(buf) {\r\n      return window.pdfjsLib.getDocument({ data: buf }).promise;\r\n    })\r\n    .then(function(pdf) {\r\n      container.innerHTML = '';\r\n      var totalPages = pdf.numPages;\r\n      var safeId = containerId.replace(/[^a-zA-Z0-9_-]/g, '_');\r\n\r\n      // Store state for zoom re-rendering\r\n      container._pdfDoc = pdf;\r\n      container._pdfUrl = url;\r\n      container._pdfSafeId = safeId;\r\n      container._pdfTotalPages = totalPages;\r\n\r\n      /** Render all pages at the given zoom factor (1.0 = fit-width). Returns a Promise. */\r\n      function renderAllPages(zoomFactor) {\r\n        // Clear existing canvases\r\n        var existingCanvases = container.querySelectorAll('.pdf-page-canvas');\r\n        for (var ec = 0; ec < existingCanvases.length; ec++) {\r\n          existingCanvases[ec].remove();\r\n        }\r\n        container._pdfZoom = zoomFactor;\r\n        var containerWidth = container.clientWidth || 760;\r\n\r\n        function renderPage(pageNum) {\r\n          return pdf.getPage(pageNum).then(function(page) {\r\n            var baseViewport = page.getViewport({ scale: 1 });\r\n            var fitScale = Math.min(3.0, (containerWidth - 24) / baseViewport.width);\r\n            var scale = fitScale * zoomFactor;\r\n            var viewport = page.getViewport({ scale: scale });\r\n            var canvas = document.createElement('canvas');\r\n            canvas.className = 'pdf-page-canvas';\r\n            canvas.id = 'pdf-page-' + safeId + '-' + pageNum;\r\n            canvas.setAttribute('data-page', pageNum);\r\n            canvas.width = viewport.width;\r\n            canvas.height = viewport.height;\r\n            container.appendChild(canvas);\r\n            var ctx = canvas.getContext('2d');\r\n            return page.render({ canvasContext: ctx, viewport: viewport }).promise;\r\n          });\r\n        }\r\n\r\n        // Sequential render, return promise that resolves when all pages are done\r\n        var promise = Promise.resolve();\r\n        for (var pn = 1; pn <= totalPages; pn++) {\r\n          (function(n) {\r\n            promise = promise\r\n              .then(function() { return renderPage(n); })\r\n              .then(function() { tool.resize(); });\r\n          })(pn);\r\n        }\r\n        return promise.then(function() {\r\n          buildPdfPageNav(container, safeId, totalPages);\r\n        });\r\n      }\r\n      container._renderAllPages = renderAllPages;\r\n\r\n      // Initial render at fit-width, then add zoom controls\r\n      return renderAllPages(1.0).then(function() {\r\n        var card = container.closest('.pdf-viewer-card');\r\n        if (!card) return;\r\n        var toolbar = card.querySelector('.pdf-viewer-toolbar');\r\n        if (!toolbar) return;\r\n        // Avoid duplicate zoom controls\r\n        if (toolbar.querySelector('.pdf-zoom-group')) return;\r\n\r\n        var zoomGroup = document.createElement('span');\r\n        zoomGroup.className = 'pdf-zoom-group';\r\n        zoomGroup.innerHTML =\r\n          '<span class=\"pdf-zoom-sep\"><\/span>' +\r\n          '<button class=\"pdf-zoom-btn\" title=\"Zoom Out\" data-zoom-dir=\"-1\">➖<\/button>' +\r\n          '<span class=\"pdf-zoom-label\">100%<\/span>' +\r\n          '<button class=\"pdf-zoom-btn\" title=\"Zoom In\" data-zoom-dir=\"1\">➕<\/button>' +\r\n          '<button class=\"pdf-zoom-btn pdf-zoom-fit\" title=\"Fit Width\">⊡<\/button>';\r\n\r\n        var openLink = toolbar.querySelector('[data-open-url]');\r\n        if (openLink) {\r\n          toolbar.insertBefore(zoomGroup, openLink);\r\n        } else {\r\n          toolbar.appendChild(zoomGroup);\r\n        }\r\n\r\n        // Wire zoom buttons\r\n        var zoomBtns = zoomGroup.querySelectorAll('[data-zoom-dir]');\r\n        var zoomLabel = zoomGroup.querySelector('.pdf-zoom-label');\r\n        var zoomFitBtn = zoomGroup.querySelector('.pdf-zoom-fit');\r\n        for (var zb = 0; zb < zoomBtns.length; zb++) {\r\n          (function(btn) {\r\n            btn.addEventListener('click', function(e) {\r\n              e.stopPropagation();\r\n              var dir = parseInt(btn.getAttribute('data-zoom-dir'));\r\n              var newZoom = Math.max(0.25, Math.min(3.0, container._pdfZoom + dir * 0.25));\r\n              renderAllPages(newZoom).then(function() {\r\n                if (zoomLabel) zoomLabel.textContent = Math.round(newZoom * 100) + '%';\r\n              });\r\n            });\r\n          })(zoomBtns[zb]);\r\n        }\r\n        if (zoomFitBtn) {\r\n          zoomFitBtn.addEventListener('click', function(e) {\r\n            e.stopPropagation();\r\n            renderAllPages(1.0).then(function() {\r\n              if (zoomLabel) zoomLabel.textContent = '100%';\r\n            });\r\n          });\r\n        }\r\n      });\r\n    })\r\n    .catch(function(err) {\r\n      container.innerHTML = '';\r\n      var errBox = document.createElement('div');\r\n      errBox.className = 'pdf-canvas-error';\r\n      var msg = document.createElement('div');\r\n      msg.textContent = '⚠️ Could not load PDF preview.';\r\n      var link = document.createElement('a');\r\n      link.textContent = '↗ Open PDF in New Tab';\r\n      link.addEventListener('click', function() { tool.openUrl(url); });\r\n      errBox.appendChild(msg);\r\n      errBox.appendChild(link);\r\n      container.appendChild(errBox);\r\n      tool.resize();\r\n    });\r\n}\r\n\r\n/** Build a page-navigation dropdown in the PDF toolbar.\r\n *  On desktop it opens on hover; on mobile it's a click-to-toggle dropdown.\r\n *  The trigger text auto-updates to show the current visible page as the user scrolls. */\r\nfunction buildPdfPageNav(canvasContainer, safeId, totalPages) {\r\n  if (totalPages <= 1) return; // no need for nav with single page\r\n  // Find the parent pdf-viewer-card and its toolbar\r\n  var card = canvasContainer.closest('.pdf-viewer-card');\r\n  if (!card) return;\r\n  var toolbar = card.querySelector('.pdf-viewer-toolbar');\r\n  if (!toolbar) return;\r\n\r\n  // Remove existing nav if re-building (e.g., after zoom change)\r\n  var existingNav = toolbar.querySelector('.pdf-page-nav');\r\n  if (existingNav) existingNav.remove();\r\n\r\n  // Create the pages dropdown\r\n  var navWrap = document.createElement('div');\r\n  navWrap.className = 'pdf-page-nav';\r\n\r\n  var trigger = document.createElement('button');\r\n  trigger.className = 'btn btn-sm btn-outline pdf-page-nav-trigger';\r\n  trigger.innerHTML = '📄 <span class=\"pdf-page-nav-label\">Page 1<\/span> of ' + totalPages + ' <span class=\"pdf-page-nav-arrow\">▾<\/span>';\r\n\r\n  var dropdown = document.createElement('div');\r\n  dropdown.className = 'pdf-page-nav-dropdown';\r\n  var listHtml = '';\r\n  for (var p = 1; p <= totalPages; p++) {\r\n    listHtml += '<button class=\"pdf-page-nav-item\" data-page=\"' + p + '\" data-target=\"pdf-page-' + safeId + '-' + p + '\">Page ' + p + '<\/button>';\r\n  }\r\n  dropdown.innerHTML = listHtml;\r\n\r\n  navWrap.appendChild(trigger);\r\n  navWrap.appendChild(dropdown);\r\n  toolbar.appendChild(navWrap);\r\n\r\n  // ── Scroll spy: update trigger label to current visible page ──\r\n  var labelEl = trigger.querySelector('.pdf-page-nav-label');\r\n  var currentPage = 1;\r\n\r\n  function updateTriggerText(pageNum) {\r\n    if (pageNum === currentPage) return;\r\n    currentPage = pageNum;\r\n    if (labelEl) labelEl.textContent = 'Page ' + pageNum;\r\n    // Also highlight the active item in the dropdown\r\n    var items = dropdown.querySelectorAll('.pdf-page-nav-item');\r\n    for (var i = 0; i < items.length; i++) {\r\n      items[i].classList.toggle('active', parseInt(items[i].getAttribute('data-page')) === pageNum);\r\n    }\r\n  }\r\n\r\n  // Use IntersectionObserver to detect which page is most visible\r\n  if (typeof IntersectionObserver !== 'undefined') {\r\n    var pageCanvases = [];\r\n    for (var cp = 1; cp <= totalPages; cp++) {\r\n      var c = document.getElementById('pdf-page-' + safeId + '-' + cp);\r\n      if (c) pageCanvases.push(c);\r\n    }\r\n    var visMap = {}; // pageNum → ratio\r\n    var observer = new IntersectionObserver(function(entries) {\r\n      for (var ei = 0; ei < entries.length; ei++) {\r\n        var e = entries[ei];\r\n        var pn = parseInt(e.target.getAttribute('data-page'));\r\n        if (!isNaN(pn)) visMap[pn] = e.intersectionRatio;\r\n      }\r\n      // Find page with highest intersection ratio\r\n      var bestPage = 1;\r\n      var bestRatio = 0;\r\n      var keys = Object.keys(visMap);\r\n      for (var ki = 0; ki < keys.length; ki++) {\r\n        var k = parseInt(keys[ki]);\r\n        if (visMap[k] > bestRatio) { bestRatio = visMap[k]; bestPage = k; }\r\n      }\r\n      if (bestRatio > 0) updateTriggerText(bestPage);\r\n    }, { threshold: [0, 0.1, 0.25, 0.5, 0.75, 1] });\r\n    for (var op = 0; op < pageCanvases.length; op++) {\r\n      observer.observe(pageCanvases[op]);\r\n    }\r\n  }\r\n\r\n  // ── Wire hover/click ──\r\n  var hideTimer = null;\r\n\r\n  function showDropdown() {\r\n    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }\r\n    navWrap.classList.add('open');\r\n  }\r\n  function hideDropdown() {\r\n    hideTimer = setTimeout(function() { navWrap.classList.remove('open'); }, 150);\r\n  }\r\n\r\n  // Desktop: hover to open\r\n  trigger.addEventListener('mouseenter', showDropdown);\r\n  navWrap.addEventListener('mouseenter', function() { if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } });\r\n  navWrap.addEventListener('mouseleave', hideDropdown);\r\n\r\n  // Mobile: click to toggle\r\n  trigger.addEventListener('click', function(e) {\r\n    e.preventDefault();\r\n    e.stopPropagation();\r\n    if (navWrap.classList.contains('open')) {\r\n      navWrap.classList.remove('open');\r\n    } else {\r\n      showDropdown();\r\n    }\r\n  });\r\n\r\n  // Page items: click to scroll to that canvas\r\n  var items = dropdown.querySelectorAll('.pdf-page-nav-item');\r\n  for (var i = 0; i < items.length; i++) {\r\n    items[i].addEventListener('click', function(e) {\r\n      e.stopPropagation();\r\n      var pageNum = parseInt(this.getAttribute('data-page'));\r\n      var targetId = this.getAttribute('data-target');\r\n      var target = document.getElementById(targetId);\r\n      if (target) {\r\n        // Update the trigger text immediately for responsiveness\r\n        updateTriggerText(pageNum);\r\n        target.scrollIntoView({ behavior: 'smooth', block: 'start' });\r\n        var containerRect = canvasContainer.getBoundingClientRect();\r\n        var targetRect = target.getBoundingClientRect();\r\n        canvasContainer.scrollTop += targetRect.top - containerRect.top - 20;\r\n      }\r\n      navWrap.classList.remove('open');\r\n    });\r\n  }\r\n\r\n  // Close on outside click\r\n  document.addEventListener('click', function closeNav(e) {\r\n    if (!navWrap.contains(e.target)) navWrap.classList.remove('open');\r\n  });\r\n}\r\n\r\n/** Fetches an HTML document via the proxy URL and renders it inline. */\r\nfunction renderHtmlDocIntoContainer(containerId, url) {\r\n  var container = el(containerId);\r\n  if (!container) return;\r\n  fetch(url)\r\n    .then(function(resp) {\r\n      if (!resp.ok) throw new Error('HTTP ' + resp.status);\r\n      return resp.text();\r\n    })\r\n    .then(function(htmlText) {\r\n      // Strip out scripts for safety, then inject\r\n      var safeHtml = htmlText.replace(/<script\\b[^<]*(?:(?!<\\/script>)<[^<]*)*<\\/script>/gi, '');\r\n      container.innerHTML = '<div class=\"detail-content\">' + safeHtml + '<\/div>';\r\n      tool.resize();\r\n    })\r\n    .catch(function(err) {\r\n      container.innerHTML = '<div class=\"pdf-canvas-error\"><div>⚠️ Could not load document.<\/div><a onclick=\"tool.openUrl(\\'' + url + '\\')\">↗ Open in New Tab<\/a><\/div>';\r\n      tool.resize();\r\n    });\r\n}\r\n\r\n/* ── YouTube ID extraction ── */\r\nfunction extractYouTubeId(url) {\r\n  if (!url) return null;\r\n  url = url.trim().replace(/&amp;/g, '&');\r\n  var m = url.match(/(?:youtu\\.be\\/|embed\\/|[?&]v=)([a-zA-Z0-9_-]{8,15})(?:[?\\/\\#&]|$)/);\r\n  return m ? m[1] : null;\r\n}\r\n\r\nfunction normalizePdfArray(field) {\r\n  if (!field) return [];\r\n  if (typeof field === 'string') return [field];\r\n  if (Array.isArray(field)) return JSON.parse(JSON.stringify(field));\r\n  return [];\r\n}\r\n\r\nfunction hasLessonVideo(les) {\r\n  return les.youtubeUrls && Array.isArray(les.youtubeUrls) && les.youtubeUrls.length > 0;\r\n}\r\n\r\n/* ═══════════════════════════════════════════\r\n   DATA HELPERS\r\n   ═══════════════════════════════════════════ */\r\n\r\nfunction getSortedSections() {\r\n  return SECTIONS\r\n    .filter(function(s) { return !!s && typeof s === 'object'; })\r\n    .slice().sort(function(a, b) {\r\n      return (a.order || 9999) - (b.order || 9999);\r\n    });\r\n}\r\n\r\nfunction getLessons(section) {\r\n  // Guard against corrupted section data: null entries or lessons without an\r\n  // id must never break rendering (a throwing render is what left the lesson\r\n  // list frozen on the previous section's lessons).\r\n  var lessons = (section && Array.isArray(section.lessons)) ? section.lessons : [];\r\n  return lessons\r\n    .filter(function(l) { return !!l && typeof l === 'object' && !!l.id; })\r\n    .slice().sort(function(a, b) {\r\n      return (a.order || 9999) - (b.order || 9999);\r\n    });\r\n}\r\n\r\nfunction getAllLessonsInOrder() {\r\n  var result = [];\r\n  var sorted = getSortedSections();\r\n  for (var i = 0; i < sorted.length; i++) {\r\n    var lessons = getLessons(sorted[i]);\r\n    for (var j = 0; j < lessons.length; j++) {\r\n      result.push({ sectionId: sorted[i].id, sectionName: sorted[i].title || '', lessonId: lessons[j].id, lesson: lessons[j] });\r\n    }\r\n  }\r\n  return result;\r\n}\r\n\r\nfunction getLessonProgress(sectionId, lessonId) {\r\n  var sp = PROGRESS[sectionId];\r\n  if (!sp) return { status: 'not_started' };\r\n  return sp[lessonId] || { status: 'not_started' };\r\n}\r\n\r\nfunction getOverallProgressPct() {\r\n  var all = getAllLessonsInOrder();\r\n  if (all.length === 0) return 0;\r\n  var completed = 0;\r\n  for (var i = 0; i < all.length; i++) {\r\n    if (getLessonProgress(all[i].sectionId, all[i].lessonId).status === 'completed') completed++;\r\n  }\r\n  return Math.round((completed / all.length) * 100);\r\n}\r\n\r\nfunction isLessonAccessible(sectionId, lessonId) {\r\n  var mgmtType = (CONFIG.managementType || 'self_paced');\r\n  // A lesson the student already finished is NEVER locked, regardless of\r\n  // what older/legacy progress entries around it look like. (Fixes completed\r\n  // lessons appearing as \"Locked\" when an earlier lesson still has a legacy\r\n  // status like pending_review-with-approval or studying.)\r\n  var own = getLessonProgress(sectionId, lessonId);\r\n  if (own.status === 'completed') return true;\r\n  if (mgmtType === 'supervised' && own.supervisorStatus === 'approved') return true;\r\n\r\n  var all = getAllLessonsInOrder();\r\n  var targetIdx = -1;\r\n  for (var i = 0; i < all.length; i++) {\r\n    if (all[i].sectionId === sectionId && all[i].lessonId === lessonId) { targetIdx = i; break; }\r\n  }\r\n  if (targetIdx === -1) return false;\r\n  if (targetIdx === 0) return true;\r\n  // Check management type: supervised requires previous lesson approved,\r\n  // self-paced requires completed. Legacy-friendly: an already completed\r\n  // lesson counts as unlocked even if its approval flag is missing.\r\n  for (var i = 0; i < targetIdx; i++) {\r\n    var prevProg = getLessonProgress(all[i].sectionId, all[i].lessonId);\r\n    if (mgmtType === 'supervised') {\r\n      if (prevProg.supervisorStatus !== 'approved' && prevProg.status !== 'completed') return false;\r\n    } else {\r\n      if (prevProg.status !== 'completed') return false;\r\n    }\r\n  }\r\n  return true;\r\n}\r\n\r\n/** Human-readable reason a section is locked, or null when it is open.\r\n *  Rules: every previous section must be fully finished, AND the previous\r\n *  section must average ≥ MIN_PASS_SCORE over its RECORDED scores only\r\n *  (no-score lessons are ignored). A section with no recorded scores at all\r\n *  does NOT unlock automatically — the supervisor must resend a lesson or\r\n *  set a score. Pure-content sections unlock by completion alone. */\r\nfunction getSectionLockReason(sectionId) {\r\n  var section = findSection(sectionId);\r\n  if (!section) return 'Section not found.';\r\n  var mgmtType = (CONFIG.managementType || 'self_paced');\r\n  var sortedSections = getSortedSections();\r\n  var sectionIdx = -1;\r\n  for (var i = 0; i < sortedSections.length; i++) {\r\n    if (sortedSections[i].id === sectionId) { sectionIdx = i; break; }\r\n  }\r\n  if (sectionIdx <= 0) return null; // first section is always open\r\n  for (var j = 0; j < sectionIdx; j++) {\r\n    var prevSection = sortedSections[j];\r\n    var prevLessons = getLessons(prevSection);\r\n    if (prevLessons.length === 0) continue; // empty sections contribute nothing\r\n    for (var k = 0; k < prevLessons.length; k++) {\r\n      var prevProg = getLessonProgress(prevSection.id, prevLessons[k].id);\r\n      var done = mgmtType === 'supervised'\r\n        ? (prevProg.supervisorStatus === 'approved' || prevProg.status === 'completed')\r\n        : (prevProg.status === 'completed');\r\n      if (!done) return 'Complete all lessons in “' + (prevSection.title || 'the previous section') + '” first.';\r\n    }\r\n    var prevScore = getSectionScoreInfo(prevSection.id);\r\n    // Pure-content sections (no quiz data anywhere) unlock by completion.\r\n    if (prevScore.assessmentLessons === 0) continue;\r\n    // Only the scores that exist are averaged. A section with NO recorded\r\n    // scores must NOT unlock automatically — the supervisor should resend a\r\n    // lesson (↺) or set a score (🎯) so at least one real result exists.\r\n    if (prevScore.scoredLessons === 0) {\r\n      return 'No quiz scores were recorded for “' + (prevSection.title || 'the previous section') + '” — please contact your supervisor.';\r\n    }\r\n    if (prevScore.average < MIN_PASS_SCORE) {\r\n      return '“' + (prevSection.title || 'The previous section') + '” averages ' + prevScore.average + '% — ' + MIN_PASS_SCORE + '% is required to unlock the next section.';\r\n    }\r\n  }\r\n  return null;\r\n}\r\n\r\nfunction isSectionAccessible(sectionId) {\r\n  return getSectionLockReason(sectionId) === null;\r\n}\r\n\r\nfunction getSectionProgressSummary(sectionId) {\r\n  var section = findSection(sectionId);\r\n  if (!section) return { status: 'not_started', completed: 0, total: 0 };\r\n  var lessons = getLessons(section);\r\n  var completed = 0;\r\n  var active = 0;\r\n  for (var j = 0; j < lessons.length; j++) {\r\n    var st = getLessonProgress(sectionId, lessons[j].id).status;\r\n    if (st === 'completed') completed++;\r\n    else if (st === 'in_progress' || st === 'studying' || st === 'pending_review') active++;\r\n  }\r\n  var total = lessons.length;\r\n  var status = total === 0 ? 'not_started' : completed === total ? 'completed' : (completed + active) > 0 ? 'in_progress' : 'not_started';\r\n  return { status: status, completed: completed, total: total };\r\n}\r\n\r\n/* ═══════════════════════════════════════════\r\n   COURSE & SECTION SCORING\r\n   ═══════════════════════════════════════════ */\r\n/** Does this lesson have quiz questions inline in the main curriculum doc?\r\n *  (Quiz content can also live in a separate lesson document.) */\r\nfunction lessonHasQuiz(lesson) {\r\n  if (!lesson) return false;\r\n  var quiz = lesson.quiz;\r\n  if (quiz && typeof quiz === 'string') { try { quiz = JSON.parse(quiz); } catch(e) { quiz = null; } }\r\n  return !!(quiz && Array.isArray(quiz) && quiz.length > 0);\r\n}\r\n\r\n/** Might this lesson have quiz questions? True when quiz questions are inline\r\n *  OR the lesson uses a lesson document (the quiz may be stored there). Used\r\n *  only to tell assessment sections apart from pure-content sections. */\r\nfunction lessonMayHaveQuiz(lesson) {\r\n  return lessonHasQuiz(lesson) || !!(lesson && lesson.lessonDocId);\r\n}\r\n\r\n/** A lesson's score value for averages. A supervisor override (Set Score)\r\n *  wins; otherwise a missing score counts as 0 (business rule). */\r\nfunction getLessonScoreValue(prog) {\r\n  if (prog && typeof prog.scoreOverride === 'number') return Math.max(0, Math.min(100, prog.scoreOverride));\r\n  return typeof prog.score === 'number' ? prog.score : 0;\r\n}\r\n\r\n/** Section score over lessons that HAVE a recorded score (or supervisor\r\n *  override). No-score lessons are IGNORED — the average always reflects the\r\n *  scores that actually exist (per review: only available scores count). */\r\nfunction getSectionScoreInfo(sectionId) {\r\n  var lessons = getLessons(findSection(sectionId));\r\n  var points = 0, scoredLessons = 0, assessmentLessons = 0;\r\n  for (var i = 0; i < lessons.length; i++) {\r\n    if (lessonMayHaveQuiz(lessons[i])) assessmentLessons++;\r\n    var p = getLessonProgress(sectionId, lessons[i].id);\r\n    if (typeof p.score === 'number' || typeof p.scoreOverride === 'number') {\r\n      scoredLessons++;\r\n      points += getLessonScoreValue(p);\r\n    }\r\n  }\r\n  return { total: scoredLessons * 100, points: points, average: scoredLessons > 0 ? Math.round(points / scoredLessons) : 0, scoredLessons: scoredLessons, assessmentLessons: assessmentLessons, lessonCount: lessons.length };\r\n}\r\n\r\n/** Section score summary (compatible shape for the UI). */\r\nfunction getSectionScore(sectionId) {\r\n  var info = getSectionScoreInfo(sectionId);\r\n  return { total: info.total, points: info.points, average: info.average };\r\n}\r\n\r\n/** Course score over lessons with recorded scores: total points, collected\r\n *  points, average %, completion counts. No-score lessons are ignored. */\r\nfunction getCourseScore() {\r\n  var all = getAllLessonsInOrder();\r\n  if (!all.length) return { total: 0, points: 0, average: 0, completed: 0, lessonCount: 0, scoredLessons: 0, assessmentLessons: 0, completedScoreless: 0 };\r\n  var points = 0, completed = 0, scoredLessons = 0, assessmentLessons = 0, completedScoreless = 0;\r\n  for (var i = 0; i < all.length; i++) {\r\n    var p = getLessonProgress(all[i].sectionId, all[i].lessonId);\r\n    if (p.status === 'completed') {\r\n      completed++;\r\n      if (typeof p.score !== 'number' && typeof p.scoreOverride !== 'number' && lessonMayHaveQuiz(all[i].lesson)) completedScoreless++;\r\n    }\r\n    if (lessonMayHaveQuiz(all[i].lesson)) assessmentLessons++;\r\n    if (typeof p.score === 'number' || typeof p.scoreOverride === 'number') {\r\n      scoredLessons++;\r\n      points += getLessonScoreValue(p);\r\n    }\r\n  }\r\n  return { total: scoredLessons * 100, points: points, average: scoredLessons > 0 ? Math.round(points / scoredLessons) : 0, completed: completed, lessonCount: all.length, scoredLessons: scoredLessons, assessmentLessons: assessmentLessons, completedScoreless: completedScoreless };\r\n}\r\n\r\nfunction findSection(sectionId) {\r\n  for (var i = 0; i < SECTIONS.length; i++) {\r\n    if (SECTIONS[i].id === sectionId) return SECTIONS[i];\r\n  }\r\n  return null;\r\n}\r\n\r\nfunction findLesson(section, lessonId) {\r\n  var lessons = getLessons(section);\r\n  for (var i = 0; i < lessons.length; i++) {\r\n    if (lessons[i].id === lessonId) return lessons[i];\r\n  }\r\n  return null;\r\n}\r\n\r\nfunction getNextLesson(sectionId, lessonId) {\r\n  var all = getAllLessonsInOrder();\r\n  for (var i = 0; i < all.length - 1; i++) {\r\n    if (all[i].sectionId === sectionId && all[i].lessonId === lessonId) return all[i + 1];\r\n  }\r\n  return null;\r\n}\r\n\r\nfunction getPrevLesson(sectionId, lessonId) {\r\n  var all = getAllLessonsInOrder();\r\n  for (var i = 1; i < all.length; i++) {\r\n    if (all[i].sectionId === sectionId && all[i].lessonId === lessonId) return all[i - 1];\r\n  }\r\n  return null;\r\n}\r\n\r\n/* ── Persist progress to the parent CMS object ──\r\n *  Progress lives on the REAL CMS record this tool is installed on.\r\n *  Save semantics (verified with the CMS codebase):\r\n *    • tool.setValue() only STAGES the value in the parent form.\r\n *    • tool.requestSave(cb) asks the parent to commit the whole record to\r\n *      Firestore NOW — same cascade as the parent Save button.\r\n *      Requires the field setting allowRequestSave: 'yes'.\r\n *  saveProgress(immediate) stages on every call; when immediate=true\r\n *  (Submit Answers, Mark Complete, …) it also fires requestSave and reports\r\n *  the true outcome. We never claim \"saved\" unless the save was accepted. */\r\nfunction saveProgress(immediate, onDone) {\r\n  var data = { config: CONFIG, progress: PROGRESS };\r\n  // Remember the student's name so supervisors see WHO owns this record.\r\n  if (!isAdmin()) {\r\n    var _sName = getUserDisplayName();\r\n    if (_sName) CONFIG.studentName = _sName;\r\n  }\r\n  _lastSavedJson = JSON.stringify(data || null);\r\n  _lastSavedAt = Date.now();\r\n  _suppressNextValueChange = true;\r\n  var readOnly = false;\r\n  try { readOnly = !!(tool.isReadOnly && tool.isReadOnly()); } catch(e) {}\r\n  try { tool.reportValid(true, ''); } catch(e) {}\r\n  // 1) Stage the latest value in the parent form.\r\n  try { tool.setValue(data); } catch(e) {}\r\n  var staged = false;\r\n  try { staged = JSON.stringify(tool.getValue() || null) === _lastSavedJson; } catch(e) {}\r\n  var result = { ok: true, readOnly: readOnly, staged: staged, saved: false, saveError: '' };\r\n  // 2) On explicit user actions, ask the parent CMS to commit the record to\r\n  //    Firestore immediately (it flushes the latest staged value first).\r\n  if (immediate) {\r\n    if (typeof tool.requestSave === 'function') {\r\n      try {\r\n        tool.requestSave(function(err, ok) {\r\n          if (ok) {\r\n            result.saved = true;\r\n          } else {\r\n            result.saveError = err || 'denied — enable \"Allow Save Request\" in the field settings';\r\n          }\r\n          if (onDone) onDone(result);\r\n        });\r\n        return;\r\n      } catch(e) {\r\n        result.saveError = String(e);\r\n      }\r\n    } else {\r\n      result.saveError = 'CMS does not support requestSave — update the CMS or enable \"Save on Change\" on the field.';\r\n    }\r\n  }\r\n  if (onDone) onDone(result);\r\n}\r\n\r\n/** Report a save outcome honestly — \"Saved ✓\" only when the parent CMS\r\n *  accepted the save request (real Firestore commit dispatched). */\r\nfunction reportSaveResult(res, successPrefix) {\r\n  var st = el('quiz-save-status-inline');\r\n  if (res.readOnly) {\r\n    var m1 = '⚠️ Could not save — the page is read-only. Ask an admin to save the record.';\r\n    if (st) { st.textContent = m1; st.style.color = '#dc2626'; }\r\n    tool.notify(m1, 'warning');\r\n  } else if (res.saved) {\r\n    var m2 = (successPrefix || 'Saved') + ' ✓';\r\n    if (st) { st.textContent = m2; st.style.color = '#059669'; }\r\n    tool.notify(m2, 'success');\r\n  } else if (res.saveError) {\r\n    var m2b = '⚠️ Save to the course record failed: ' + res.saveError;\r\n    if (st) { st.textContent = m2b; st.style.color = '#dc2626'; }\r\n    tool.notify(m2b, 'error');\r\n  } else if (res.staged) {\r\n    var m4 = '📝 Recorded in the form — click Save in the CMS toolbar to keep it permanently.';\r\n    if (st) { st.textContent = m4; st.style.color = '#d97706'; }\r\n    tool.notify(m4, 'warning');\r\n  } else {\r\n    var m5 = '⚠️ Could not record the value in the form. Please try again.';\r\n    if (st) { st.textContent = m5; st.style.color = '#dc2626'; }\r\n    tool.notify(m5, 'error');\r\n  }\r\n  return res;\r\n}\r\n\r\n/** Flush any pending debounced saves (flashcards, quiz staging) */\r\nfunction flushPendingSaves() {\r\n  var pending = false;\r\n  if (window._quizStageTimer) { clearTimeout(window._quizStageTimer); window._quizStageTimer = null; pending = true; }\r\n  if (window._sfcSaveTimer) { clearTimeout(window._sfcSaveTimer); window._sfcSaveTimer = null; pending = true; }\r\n  if (pending) saveProgress(true);\r\n}\r\n\r\n/** Debounced staging of in-progress quiz answers into PROGRESS + the parent\r\n *  form. This is NOT a database save — the parent CMS only writes to\r\n *  Firestore when the form is saved. The real save happens when the student\r\n *  clicks \"Submit Answers\" (or an admin clicks the CMS Save button).\r\n *  No \"Saved\" message is shown here — that would be misleading. */\r\nfunction scheduleQuizAutoSave() {\r\n  if (!currentSectionId || !currentLessonId) return;\r\n  if (!PROGRESS[currentSectionId]) PROGRESS[currentSectionId] = {};\r\n  if (!PROGRESS[currentSectionId][currentLessonId]) PROGRESS[currentSectionId][currentLessonId] = {};\r\n  PROGRESS[currentSectionId][currentLessonId].quizAnswers = JSON.parse(JSON.stringify(quizAnswers));\r\n  if (window._quizStageTimer) clearTimeout(window._quizStageTimer);\r\n  window._quizStageTimer = setTimeout(function() {\r\n    window._quizStageTimer = null;\r\n    saveProgress();  // silent stage only — never claims \"saved\"\r\n  }, 1000);\r\n}\r\n\r\n/* ═══════════════════════════════════════════\r\n   RENDER: SECTION GROUPS LIST\r\n   ═══════════════════════════════════════════ */\r\n\r\n/** Professional course-grade panel: average ring, points collected,\r\n *  per-section average bars and pass status. Shown on the sections view. */\r\nfunction renderCourseGrade() {\r\n  var panel = el('course-grade-panel');\r\n  if (!panel) return;\r\n  if (!CONFIG.curriculumSourceId) { panel.style.display = 'none'; return; }\r\n  panel.style.display = '';\r\n\r\n  var cs = getCourseScore();\r\n  var allDone = cs.lessonCount > 0 && cs.completed === cs.lessonCount;\r\n  var hasScores = cs.scoredLessons > 0;\r\n  var passed = hasScores && cs.average >= MIN_PASS_SCORE;\r\n  var statusTxt, statusCls;\r\n  if (cs.lessonCount === 0) { statusTxt = 'No lessons yet'; statusCls = 'grade-st-fresh'; }\r\n  else if (allDone && passed) { statusTxt = 'Course passed ✓'; statusCls = 'grade-st-pass'; }\r\n  else if (allDone && !hasScores) { statusTxt = 'Finished — no scores recorded'; statusCls = 'grade-st-fresh'; }\r\n  else if (allDone) { statusTxt = 'Finished below ' + MIN_PASS_SCORE + '%'; statusCls = 'grade-st-fail'; }\r\n  else { statusTxt = 'In progress'; statusCls = 'grade-st-progress'; }\r\n\r\n  var ringColor = !hasScores ? '#94a3b8' : (passed ? '#059669' : (cs.average >= 40 ? '#d97706' : '#dc2626'));\r\n  var rr = 34, rc = 2 * Math.PI * rr;\r\n  var ringPct = Math.max(0, Math.min(100, cs.average));\r\n\r\n  var html = '<div class=\"grade-panel\">';\r\n  html += '<div class=\"grade-head\"><div class=\"grade-head-title\">🎓 Course Grade<\/div><span class=\"grade-pill ' + statusCls + '\">' + statusTxt + '<\/span><\/div>';\r\n  html += '<div class=\"grade-body\">';\r\n  html += '<svg class=\"grade-ring\" viewBox=\"0 0 84 84\" width=\"84\" height=\"84\" aria-hidden=\"true\">' +\r\n    '<circle cx=\"42\" cy=\"42\" r=\"' + rr + '\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"9\"/>' +\r\n    '<circle cx=\"42\" cy=\"42\" r=\"' + rr + '\" fill=\"none\" stroke=\"' + ringColor + '\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-dasharray=\"' + rc.toFixed(2) + '\" stroke-dashoffset=\"' + (rc * (1 - ringPct / 100)).toFixed(2) + '\" transform=\"rotate(-90,42,42)\"/>' +\r\n    '<text x=\"42\" y=\"43\" text-anchor=\"middle\" dominant-baseline=\"central\" class=\"grade-ring-text\">' + (hasScores ? cs.average + '%' : '—') + '<\/text><\/svg>';\r\n  html += '<div class=\"grade-stats\">';\r\n  html += '<div class=\"grade-stat\"><span class=\"grade-stat-label\">Course average<\/span><span class=\"grade-stat-value\">' + (hasScores ? cs.average + '%' : '—') + (hasScores ? ' <span class=\"grade-stat-note\">(need ' + MIN_PASS_SCORE + '% to pass)<\/span>' : '') + '<\/span><\/div>';\r\n  html += '<div class=\"grade-stat\"><span class=\"grade-stat-label\">Points collected<\/span><span class=\"grade-stat-value\">' + (hasScores ? cs.points + ' <span class=\"grade-stat-note\">of ' + cs.total + ' points<\/span>' : '—') + '<\/span><\/div>';\r\n  html += '<div class=\"grade-bar\"><div class=\"grade-bar-fill\" style=\"width:' + (cs.total > 0 ? Math.round(cs.points / cs.total * 100) : 0) + '%\"><\/div><\/div>';\r\n  html += '<\/div>';\r\n  html += '<div class=\"grade-side\"><div class=\"grade-side-num\">' + cs.completed + '<span> /' + cs.lessonCount + '<\/span><\/div><div class=\"grade-side-label\">lessons done<\/div><\/div>';\r\n  html += '<\/div>';\r\n\r\n  var sorted = getSortedSections();\r\n  if (sorted.length > 0) {\r\n    html += '<div class=\"grade-sections\">';\r\n    for (var i = 0; i < sorted.length; i++) {\r\n      var s = sorted[i];\r\n      var sc = getSectionScore(s.id);\r\n      if (sc.total === 0) continue;\r\n      var sPass = sc.average >= MIN_PASS_SCORE;\r\n      html += '<div class=\"grade-section-row\">' +\r\n        '<span class=\"grade-section-name\">' + esc(s.title || 'Section ' + (i + 1)) + '<\/span>' +\r\n        '<div class=\"grade-section-bar\"><div class=\"grade-section-fill' + (sPass ? '' : ' below') + '\" style=\"width:' + sc.average + '%\"><\/div><\/div>' +\r\n        '<span class=\"grade-section-val\">' + sc.average + '%<\/span>' +\r\n      '<\/div>';\r\n    }\r\n    html += '<\/div>';\r\n  }\r\n  var gradeNote = 'ℹ️ Only recorded scores are averaged — lessons without a score are ignored. Each section unlocks the next one at ' + MIN_PASS_SCORE + '% average, and the course is passed at ' + MIN_PASS_SCORE + '% overall.';\r\n  if (cs.completedScoreless > 0) {\r\n    gradeNote += ' ⚠️ ' + cs.completedScoreless + ' completed lesson' + (cs.completedScoreless !== 1 ? 's' : '') + ' have no recorded score — a supervisor can resend the lesson (↺) or set the score (🎯).';\r\n  }\r\n  html += '<div class=\"grade-note\">' + gradeNote + '<\/div>';\r\n  html += '<\/div>';\r\n  panel.innerHTML = html;\r\n}\r\n\r\n/* ═══════════════════════════════════════════\r\n   ACTIVITY LOG & PROGRESS REPORT\r\n   ═══════════════════════════════════════════ */\r\n/** Append an event to a lesson's activity log (bounded at 200 entries).\r\n *  Events are append-only: reopening and completing a lesson again adds NEW\r\n *  entries — the completion history is never overwritten. */\r\nfunction logLessonEvent(sectionId, lessonId, type, detail) {\r\n  if (!sectionId || !lessonId) return;\r\n  if (!PROGRESS[sectionId]) PROGRESS[sectionId] = {};\r\n  if (!PROGRESS[sectionId][lessonId]) PROGRESS[sectionId][lessonId] = {};\r\n  var entry = PROGRESS[sectionId][lessonId];\r\n  if (!entry.activityLog || !Array.isArray(entry.activityLog)) entry.activityLog = [];\r\n  entry.activityLog.push({ type: type, at: new Date().toISOString(), detail: (detail === undefined ? null : detail) });\r\n  if (entry.activityLog.length > 200) entry.activityLog = entry.activityLog.slice(entry.activityLog.length - 200);\r\n}\r\n\r\nfunction pad2(n) { return (n < 10 ? '0' : '') + n; }\r\n\r\n/** Flat, time-sorted list of ALL logged activity across lessons. Legacy\r\n *  records with a completedAt date but no log get a synthesized completion\r\n *  event (display-only backfill — stored student data is never changed). */\r\nfunction getAllActivityEvents() {\r\n  var events = [];\r\n  var all = getAllLessonsInOrder();\r\n  for (var i = 0; i < all.length; i++) {\r\n    var sid = all[i].sectionId;\r\n    var lid = all[i].lessonId;\r\n    var p = getLessonProgress(sid, lid);\r\n    var title = (all[i].lesson && all[i].lesson.title) ? all[i].lesson.title : 'Lesson';\r\n    var log = (p.activityLog && Array.isArray(p.activityLog)) ? p.activityLog : [];\r\n    var hasCompletion = false;\r\n    for (var j = 0; j < log.length; j++) {\r\n      events.push({ sectionId: sid, lessonId: lid, sectionTitle: all[i].sectionName, lessonTitle: title, type: log[j].type, at: log[j].at, detail: log[j].detail });\r\n      if (log[j].type === 'completed' || log[j].type === 'approved') hasCompletion = true;\r\n    }\r\n    if (!hasCompletion && p.completedAt && (p.status === 'completed' || p.supervisorStatus === 'approved')) {\r\n      events.push({ sectionId: sid, lessonId: lid, sectionTitle: all[i].sectionName, lessonTitle: title, type: 'completed', at: p.completedAt, detail: (typeof p.score === 'number' ? p.score : null) });\r\n    }\r\n  }\r\n  events.sort(function(a, b) {\r\n    var ta = new Date(a.at).getTime(), tb = new Date(b.at).getTime();\r\n    if (isNaN(ta)) return 1;\r\n    if (isNaN(tb)) return -1;\r\n    return tb - ta;\r\n  });\r\n  return events;\r\n}\r\n\r\n/** Group completion events by local calendar day (newest day first). */\r\nfunction getDailyCompletionStats(events) {\r\n  var byDay = {};\r\n  for (var i = 0; i < events.length; i++) {\r\n    var e = events[i];\r\n    if (e.type !== 'completed') continue;\r\n    var d = new Date(e.at);\r\n    if (isNaN(d.getTime())) continue;\r\n    var key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());\r\n    if (!byDay[key]) byDay[key] = { dateKey: key, date: d, items: [] };\r\n    byDay[key].items.push(e);\r\n  }\r\n  var keys = Object.keys(byDay).sort().reverse();\r\n  var days = [];\r\n  for (var k = 0; k < keys.length; k++) {\r\n    var g = byDay[keys[k]];\r\n    g.items.sort(function(a, b) {\r\n      var ta = new Date(a.at).getTime(), tb = new Date(b.at).getTime();\r\n      if (isNaN(ta)) return 1;\r\n      if (isNaN(tb)) return -1;\r\n      return tb - ta;\r\n    });\r\n    g.count = g.items.length;\r\n    days.push(g);\r\n  }\r\n  return days;\r\n}\r\n\r\nfunction timeLabel(iso) {\r\n  var d = new Date(iso);\r\n  if (isNaN(d.getTime())) return '';\r\n  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });\r\n}\r\n\r\n/** One-time data repair: if a lesson lost its score but saved quiz attempts\r\n *  still exist, restore the best attempt score (and the pass flag)\r\n *  automatically. Honest recovery — it restores real recorded results, never\r\n *  invents new ones. Runs after the curriculum loads. */\r\nfunction recoverScoresFromAttempts() {\r\n  var all = getAllLessonsInOrder();\r\n  if (all.length === 0) return;\r\n  var recovered = 0;\r\n  for (var i = 0; i < all.length; i++) {\r\n    var sid = all[i].sectionId;\r\n    var lid = all[i].lessonId;\r\n    var p = getLessonProgress(sid, lid);\r\n    if (p.status === 'not_started') continue;\r\n    if (typeof p.score === 'number' || typeof p.scoreOverride === 'number') continue;\r\n    var attempts = (p.quizAttempts && Array.isArray(p.quizAttempts)) ? p.quizAttempts : [];\r\n    var best = null;\r\n    for (var a = 0; a < attempts.length; a++) {\r\n      if (typeof attempts[a].score === 'number' && (best === null || attempts[a].score > best)) best = attempts[a].score;\r\n    }\r\n    if (best !== null) {\r\n      if (!PROGRESS[sid]) PROGRESS[sid] = {};\r\n      if (!PROGRESS[sid][lid]) PROGRESS[sid][lid] = {};\r\n      PROGRESS[sid][lid].score = best;\r\n      if (best >= MIN_PASS_SCORE) PROGRESS[sid][lid].quizPassed = true;\r\n      logLessonEvent(sid, lid, 'score_recovered', best);\r\n      recovered++;\r\n    }\r\n  }\r\n  if (recovered > 0) {\r\n    saveProgress(); // silent stage — the next explicit action persists it\r\n    tool.notify('🩹 Recovered ' + recovered + ' quiz score' + (recovered !== 1 ? 's' : '') + ' from saved attempt history.', 'info');\r\n  }\r\n}\r\n\r\n/** Daily completions bar chart + grouped list. Shown in the shared Activity\r\n *  Report tab (Student view), identical for students and supervisors. */\r\nfunction buildActivityReportHtml() {\r\n  var events = getAllActivityEvents();\r\n  var days = getDailyCompletionStats(events);\r\n  var total = 0, best = null;\r\n  for (var i = 0; i < days.length; i++) {\r\n    total += days[i].count;\r\n    if (!best || days[i].count > best.count) best = days[i];\r\n  }\r\n\r\n  var html = '<div class=\"rp-panel\">';\r\n  html += '<div class=\"rp-head\"><span class=\"rp-title\">📈 Activity Report<\/span>' +\r\n    '<span class=\"rp-sub\">Lesson completions per day<\/span><\/div>';\r\n\r\n  if (days.length === 0) {\r\n    html += '<div class=\"rp-empty\">No lessons completed yet — every completion is recorded here with its date and time.<\/div>';\r\n    html += '<\/div>';\r\n    return html;\r\n  }\r\n\r\n  // ── Summary chips ──\r\n  var last = days[0].items[0];\r\n  var lastDate = last ? new Date(last.at) : null;\r\n  var lastTxt = (lastDate && !isNaN(lastDate.getTime())) ? lastDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + timeLabel(last.at) : '—';\r\n  var bestTxt = best ? best.date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' (' + best.count + ')' : '—';\r\n  html += '<div class=\"rp-chips\">' +\r\n    '<span class=\"rp-chip\">✅ <strong>' + total + '<\/strong> completion' + (total !== 1 ? 's' : '') + '<\/span>' +\r\n    '<span class=\"rp-chip\">📅 <strong>' + days.length + '<\/strong> active day' + (days.length !== 1 ? 's' : '') + '<\/span>' +\r\n    '<span class=\"rp-chip\">🏆 Best day: <strong>' + esc(bestTxt) + '<\/strong><\/span>' +\r\n    '<span class=\"rp-chip\">⏱️ Last: <strong>' + esc(lastTxt) + '<\/strong><\/span>' +\r\n  '<\/div>';\r\n\r\n  // ── Bar chart: last 14 calendar days (zero days shown as empty bars) ──\r\n  var countByKey = {};\r\n  for (var c = 0; c < days.length; c++) countByKey[days[c].dateKey] = days[c].count;\r\n  var maxCount = Math.max(1, best ? best.count : 1);\r\n  html += '<div class=\"rp-chart\">';\r\n  var today = new Date();\r\n  for (var d = 13; d >= 0; d--) {\r\n    var day = new Date(today.getFullYear(), today.getMonth(), today.getDate() - d);\r\n    var key = day.getFullYear() + '-' + pad2(day.getMonth() + 1) + '-' + pad2(day.getDate());\r\n    var count = countByKey[key] || 0;\r\n    var h = count > 0 ? Math.round(8 + (count / maxCount) * 76) : 4;\r\n    var dayLabel = day.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });\r\n    html += '<div class=\"rp-bar-col\" title=\"' + esc(dayLabel + ' — ' + count + ' lesson' + (count !== 1 ? 's' : '')) + '\">' +\r\n      (count > 0 ? '<span class=\"rp-bar-val\">' + count + '<\/span>' : '') +\r\n      '<div class=\"rp-bar' + (count === 0 ? ' rp-bar-zero' : '') + '\" style=\"height:' + h + 'px\"><\/div>' +\r\n      '<span class=\"rp-bar-day\">' + esc(dayLabel) + '<\/span><\/div>';\r\n  }\r\n  html += '<\/div>';\r\n\r\n  // ── Daily list ──\r\n  html += '<div class=\"rp-list\">';\r\n  var maxDays = 30;\r\n  for (var di = 0; di < days.length && di < maxDays; di++) {\r\n    var g = days[di];\r\n    var dateTxt = g.date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });\r\n    html += '<div class=\"rp-day\">';\r\n    html += '<div class=\"rp-day-head\"><span>📅 ' + esc(dateTxt) + '<\/span><span class=\"rp-day-count\">' + g.count + ' lesson' + (g.count !== 1 ? 's' : '') + '<\/span><\/div>';\r\n    for (var it = 0; it < g.items.length; it++) {\r\n      var e = g.items[it];\r\n      html += '<div class=\"rp-item\">' + esc(timeLabel(e.at)) + ' · ' + esc(e.lessonTitle) + ' <span class=\"rp-item-sec\">(' + esc(e.sectionTitle) + ')<\/span>' +\r\n        (typeof e.detail === 'number' ? ' <span class=\"rp-item-score\">' + e.detail + '%<\/span>' : '') + '<\/div>';\r\n    }\r\n    html += '<\/div>';\r\n  }\r\n  if (days.length > maxDays) html += '<div class=\"rp-more\">+ ' + (days.length - maxDays) + ' more day' + (days.length - maxDays !== 1 ? 's' : '') + ' in the log<\/div>';\r\n  html += '<\/div>';\r\n  html += '<\/div>';\r\n  return html;\r\n}\r\n\r\n/** Student-facing report on the Sections view. */\r\nfunction renderProgressReport() {\r\n  var panel = el('progress-report-panel');\r\n  if (!panel) return;\r\n  if (!CONFIG.curriculumSourceId) { panel.style.display = 'none'; return; }\r\n  panel.style.display = '';\r\n  panel.innerHTML = buildActivityReportHtml();\r\n}\r\n\r\n/** Friendly display for a YYYY-MM-DD config date (e.g. 'Sep 10, 2026'). */\r\nfunction formatConfigDate(iso) {\r\n  var p = parseIsoDateOnly(iso);\r\n  if (!p) return String(iso || '');\r\n  return new Date(Date.UTC(p.y, p.m - 1, p.d)).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });\r\n}\r\n\r\n/** Encouraging \"next target\" line for the student view, based on the dates.\r\n *  The target end date is framed as a recommended pace, never a deadline. */\r\nfunction getStudentTargetLine(r) {\r\n  if (!r || !r.schedule) return '';\r\n  var s = r.schedule;\r\n  if (r.totalLessons > 0 && r.completed >= r.totalLessons) {\r\n    return '🎓 All lessons complete — amazing work!';\r\n  }\r\n  var nextTitle = '';\r\n  var all = getAllLessonsInOrder();\r\n  for (var i = 0; i < all.length; i++) {\r\n    var st = getLessonProgress(all[i].sectionId, all[i].lessonId).status;\r\n    if (st !== 'completed') {\r\n      nextTitle = (all[i].lesson && all[i].lesson.title) ? all[i].lesson.title : ('Lesson ' + (i + 1));\r\n      break;\r\n    }\r\n  }\r\n  if (s.state === 'ended') {\r\n    return '🎯 The target date has passed — no rush, every finished lesson still counts. \"' + nextTitle + '\" is next, one lesson at a time!';\r\n  }\r\n  if (r.completed === 0) {\r\n    return '🌱 Your journey starts now — the first lesson is waiting. Take the first step today!';\r\n  }\r\n  if (s.state === 'behind') {\r\n    var gapPct = Math.max(0, s.expectedPct - r.overallPct);\r\n    var lessonsToCatch = Math.max(1, Math.ceil((gapPct / 100) * r.totalLessons));\r\n    return '🎯 Next targe dispOverride = true; }\r\n      else if (typeof prog.score === 'number') dispScore = prog.score;\r\n      var scoreHtml = dispScore !== null ? ' · Score: ' + dispScore + '%' + (dispOverride ? ' 🎯' : '') : '';\r\n      var doneDateHtml = '';\r\n      if (prog.status === 'completed' && prog.completedAt) {\r\n        var doneD = new Date(prog.completedAt);\r\n        if (!isNaN(doneD.getTime())) doneDateHtml = '<span>🏁 ' + doneD.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + '<\/span>';\r\n      }\r\n\r\n      return '<div class=\"lesson-card' + (lock ? ' locked' : '') + '\"' +\r\n        (lock ? '' : ' onclick=\"openLesson(\\'' + esc(section.id) + '\\',\\'' + esc(les.id) + '\\')\"') + '>' +\r\n        '<div class=\"lesson-card-icon ' + iconClass + '\">' + icon + '<\/div>' +\r\n        '<div class=\"lesson-card-body\">' +\r\n          '<div class=\"lesson-card-title\">' + (idx + 1) + '. ' + esc(les.title || 'Untitled Lesson') + '<\/div>' +\r\n          '<div class=\"lesson-card-meta\">' +\r\n            '<span>⏱️ ' + (les.estimatedMinutes || '—') + ' min<\/span>' +\r\n            (hasLessonVideo(les) ? '<span>🎬 Video<\/span>' : '') +\r\n            (les.presentationPdfUrls && les.presentationPdfUrls.length ? '<span>📊 Pres.<\/span>' : '') +\r\n            (les.studyDocPdfUrls && les.studyDocPdfUrls.length ? '<span>📖 Study<\/span>' : '') +\r\n            (les.worksheetPdfUrls && les.worksheetPdfUrls.length ? '<span>📝 WS<\/span>' : '') +\r\n            (les.quiz && les.quiz.length ? '<span>📝 Quiz<\/span>' : '') + scoreHtml + doneDateHtml +\r\n          '<\/div>' +\r\n        '<\/div>' +\r\n        '<span class=\"lesson-card-badge ' + badgeClass + '\">' + badgeLabel + '<\/span>' +\r\n        '<\/div>';\r\n      }).join('');\r\n    } catch(e) {\r\n      cardsHtml = '';\r\n    }\r\n    list.innerHTML = cardsHtml || '<div class=\"empty-state\"><div class=\"empty-icon\">⚠️<\/div><div class=\"empty-title\">Could not list lessons<\/div><div class=\"empty-desc\">The section data is incomplete. Please contact your administrator.<\/div><\/div>';\r\n  }\r\n  updateProgressBar();\r\n}\r\n\r\n/* ═══════════════════════════════════════════\r\n   FINISH TAB: LESSON SUMMARY CARD\r\n   ═══════════════════════════════════════════ */\r\n/** Professional end-of-lesson summary: status pill + completion date, quiz\r\n *  score ring with per-attempt history dots, a flashcard mastery dot-grid\r\n *  with progress bar, and a checkpoint list. Everything shown is backed by\r\n *  real tracked progress — nothing is invented. */\r\nfunction renderFinishSummary(prog, hasQuiz, hasFlashcards, flashcards) {\r\n  var html = '';\r\n  var statusLabel = { completed: 'Completed', pending_review: 'Awaiting Review', studying: 'Study & Retry', in_progress: 'In Progress', not_started: 'Not Started' }[prog.status] || 'Not Started';\r\n  var statusCls = { completed: 'finish-st-completed', pending_review: 'finish-st-pending', studying: 'finish-st-studying', in_progress: 'finish-st-progress' }[prog.status] || 'finish-st-fresh';\r\n  html += '<div class=\"finish-summary\">';\r\n  html += '<div class=\"finish-sum-head\">📋 Lesson Summary<\/div>';\r\n  html += '<div class=\"finish-top\"><span class=\"finish-status-pill ' + statusCls + '\">' + statusLabel + '<\/span>';\r\n  if (prog.status === 'completed' && prog.completedAt) {\r\n    var cd = new Date(prog.completedAt);\r\n    if (!isNaN(cd.getTime())) {\r\n      var dateTxt = cd.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });\r\n      html += '<span class=\"finish-completed-date\">🏁 Completed ' + esc(dateTxt) + '<\/span>';\r\n    }\r\n  }\r\n  html += '<\/div>';\r\n\r\n  // ── Quiz ──\r\n  // Legacy completions: lessons finished by older tool versions can be\r\n  // \"completed\" without a recorded quiz score. They stay completed (no data\r\n  // is changed) and are displayed neutrally — never as failed / needs retry.\r\n  var isLegacyCompletion = prog.status === 'completed' && typeof prog.score !== 'number';\r\n  if (hasQuiz) {\r\n    var score = typeof prog.score === 'number' ? prog.score : null;\r\n    var attempts = (prog.quizAttempts && Array.isArray(prog.quizAttempts)) ? prog.quizAttempts : [];\r\n    var passed = isQuizPassed(prog);\r\n    var ringColor = score === null ? '#94a3b8' : (passed ? '#059669' : '#d97706');\r\n    var quizStatus = isLegacyCompletion ? 'Completed — no score recorded' : (score === null ? 'Not attempted yet' : (passed ? 'Passed ✓' : 'Needs retry'));\r\n    var quizStatusCls = (isLegacyCompletion || score === null) ? 'finish-st-fresh' : (passed ? 'finish-st-completed' : 'finish-st-studying');\r\n    html += '<div class=\"finish-block\">';\r\n    html += '<div class=\"finish-block-title\">📝 Quiz<\/div>';\r\n    html += '<div class=\"finish-quiz-row\">';\r\n    var ringPct = score !== null ? score : 0;\r\n    var rr = 30, rc = 2 * Math.PI * rr;\r\n    html += '<svg class=\"finish-ring\" viewBox=\"0 0 72 72\" width=\"72\" height=\"72\" aria-hidden=\"true\">' +\r\n      '<circle cx=\"36\" cy=\"36\" r=\"' + rr + '\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"7\"/>' +\r\n      '<circle cx=\"36\" cy=\"36\" r=\"' + rr + '\" fill=\"none\" stroke=\"' + ringColor + '\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-dasharray=\"' + rc.toFixed(2) + '\" stroke-dashoffset=\"' + (rc * (1 - ringPct / 100)).toFixed(2) + '\" transform=\"rotate(-90,36,36)\"/>' +\r\n      '<text x=\"36\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"central\" class=\"finish-ring-text\">' + (score !== null ? score + '%' : '—') + '<\/text><\/svg>';\r\n    html += '<div class=\"finish-quiz-meta\">';\r\n    html += '<span class=\"finish-pill ' + quizStatusCls + '\">' + quizStatus + '<\/span>';\r\n    if (attempts.length > 0) {\r\n      html += '<div class=\"finish-attempts\"><span class=\"finish-attempts-label\">Attempts<\/span><span class=\"finish-attempt-dots\">';\r\n      for (var ai = 0; ai < attempts.length; ai++) {\r\n        var at = attempts[ai];\r\n        var atPass = typeof at.score === 'number' && at.score >= MIN_PASS_SCORE;\r\n        var tt = 'Attempt ' + (ai + 1) + ' · ' + (typeof at.score === 'number' ? at.score + '%' : '—') + (typeof at.setIndex === 'number' ? ' · Set ' + (at.setIndex + 1) : '');\r\n        html += '<span class=\"finish-attempt-dot ' + (atPass ? 'fa-pass' : 'fa-fail') + '\" title=\"' + esc(tt) + '\"><\/span>';\r\n      }\r\n      html += '<\/span><\/div>';\r\n    }\r\n    var best = null;\r\n    for (var bi = 0; bi < attempts.length; bi++) {\r\n      var bs = attempts[bi].score;\r\n      if (typeof bs === 'number' && (best === null || bs > best)) best = bs;\r\n    }\r\n    if (best !== null) html += '<div class=\"finish-meta-line\">Best score: <strong>' + best + '%<\/strong><\/div>';\r\n    if (typeof prog.scoreOverride === 'number') html += '<div class=\"finish-meta-line\">🎯 Score set by supervisor: <strong>' + prog.scoreOverride + '%<\/strong><\/div>';\r\n    if (isLegacyCompletion) html += '<div class=\"finish-meta-line\">This lesson was completed before quiz scores were tracked.<\/div>';\r\n    if (prog.status === 'studying' && prog.studyUntil) {\r\n      var su = new Date(prog.studyUntil);\r\n      var mins = Math.ceil((su - new Date()) / 60000);\r\n      if (mins > 0) html += '<div class=\"finish-meta-line\">⏳ Next quiz attempt available in ~' + mins + ' min<\/div>';\r\n    }\r\n    html += '<\/div><\/div><\/div>';\r\n  }\r\n\r\n  // ── Flashcards: mastery dot-grid ──\r\n  if (hasFlashcards && flashcards && flashcards.length > 0) {\r\n    var mastered = (prog.flashcardMastered && Array.isArray(prog.flashcardMastered)) ? prog.flashcardMastered : [];\r\n    var total = flashcards.length;\r\n    var mCount = mastered.length;\r\n    var fPct = Math.round(mCount / total * 100);\r\n    html += '<div class=\"finish-block\">';\r\n    html += '<div class=\"finish-block-title\">🃏 Flashcards<\/div>';\r\n    html += '<div class=\"finish-meta-line\"><strong>' + mCount + '<\/strong> of ' + total + ' marked “I know this”<\/div>';\r\n    html += '<div class=\"finish-bar\"><div class=\"finish-bar-fill\" style=\"width:' + fPct + '%\"><\/div><\/div>';\r\n    var MAX_DOTS = 50;\r\n    html += '<div class=\"finish-dots\">';\r\n    for (var fi = 0; fi < total && fi < MAX_DOTS; fi++) {\r\n      var card = flashcards[fi];\r\n      var frontTxt = card ? (card.front || card.q || card.term || 'Card ' + (fi + 1)) : ('Card ' + (fi + 1));\r\n      var isM = mastered.indexOf(fi) !== -1;\r\n      html += '<span class=\"finish-dot' + (isM ? ' mastered' : '') + '\" title=\"' + esc((fi + 1) + '. ' + frontTxt + (isM ? ' — mastered ✓' : ' — not yet')) + '\"><\/span>';\r\n    }\r\n    if (total > MAX_DOTS) html += '<span class=\"finish-dot-more\">+' + (total - MAX_DOTS) + ' more<\/span>';\r\n    html += '<\/div>';\r\n    html += '<div class=\"finish-legend\"><span class=\"finish-dot mastered\"><\/span> “I know this” <span class=\"finish-dot\"><\/span> Not yet<\/div>';\r\n    html += '<\/div>';\r\n  }\r\n\r\n  // ── Checkpoints ──\r\n  var started = prog.status !== 'not_started';\r\n  var qDone = hasQuiz ? isQuizPassed(prog) : null;\r\n  var finished = prog.status === 'completed';\r\n  var awaiting = prog.status === 'pending_review';\r\n  html += '<div class=\"finish-block\">';\r\n  html += '<div class=\"finish-block-title\">🚦 Checkpoints<\/div>';\r\n  html += '<div class=\"finish-check' + (started ? ' done' : '') + '\"><span class=\"finish-check-ic\">' + (started ? '✓' : '·') + '<\/span> Lesson started<\/div>';\r\n  if (qDone !== null) {\r\n    if (isLegacyCompletion) {\r\n      // Neutral third state — not failed, not pending, just not recorded.\r\n      html += '<div class=\"finish-check\"><span class=\"finish-check-ic\">·<\/span> Quiz — completed without score (legacy)<\/div>';\r\n    } else if (qDone) {\r\n      html += '<div class=\"finish-check done\"><span class=\"finish-check-ic\">✓<\/span> Quiz passed (≥' + MIN_PASS_SCORE + '%)<\/div>';\r\n    } else {\r\n      html += '<div class=\"finish-check pending\"><span class=\"finish-check-ic\">…<\/span> Quiz passed (≥' + MIN_PASS_SCORE + '%)<\/div>';\r\n    }\r\n  }\r\n  if (awaiting) {\r\n    html += '<div class=\"finish-check pending\"><span class=\"finish-check-ic\">⏳<\/span> Submitted — awaiting supervisor approval<\/div>';\r\n  } else {\r\n    html += '<div class=\"finish-check' + (finished ? ' done' : '') + '\"><span class=\"finish-check-ic\">' + (finished ? '✓' : '·') + '<\/span> Lesson completed<\/div>';\r\n  }\r\n  html += '<\/div>';\r\n\r\n  // ── Course standing: total points + average across the whole course ──\r\n  var cs = getCourseScore();\r\n  html += '<div class=\"finish-block\">';\r\n  html += '<div class=\"finish-block-title\">🎓 Course Standing<\/div>';\r\n  html += '<div class=\"finish-meta-line\">Average <strong>' + (cs.scoredLessons > 0 ? cs.average + '%' : '—') + '<\/strong> · Points <strong>' + (cs.scoredLessons > 0 ? cs.points + ' / ' + cs.total : '—') + '<\/strong> · ' + cs.completed + ' of ' + cs.lessonCount + ' lessons done<\/div>';\r\n  var csDone = cs.lessonCount > 0 && cs.completed === cs.lessonCount;\r\n  var courseLine = '';\r\n  if (cs.lessonCount === 0) courseLine = 'No lessons yet.';\r\n  else if (csDone && cs.scoredLessons === 0) courseLine = '⚠️ Course finished with no recorded scores — contact your supervisor.';\r\n  else if (csDone && cs.average >= MIN_PASS_SCORE) courseLine = '🎉 Course passed — average ' + cs.average + '%.';\r\n  else if (csDone) courseLine = '⚠️ Course finished below ' + MIN_PASS_SCORE + '% — improve scores to pass.';\r\n  else if (cs.average >= MIN_PASS_SCORE) courseLine = '✅ On track — course average at or above ' + MIN_PASS_SCORE + '%.';\r\n  else courseLine = '🎯 Aim for ' + MIN_PASS_SCORE + '% course average to pass the course.';\r\n  html += '<div class=\"finish-meta-line\">' + courseLine + '<\/div>';\r\n  html += '<\/div>';\r\n\r\n  html += '<\/div>';\r\n  return html;\r\n}\r\n\r\n/* ═══════════════════════════════════════════\r\n   RENDER: LESSON DETAIL (Step-by-Step Flow)\r\n   ═══════════════════════════════════════════ */\r\n\r\nfunction renderLessonDetail() {\r\n  var section = findSection(currentSectionId);\r\n  if (!section) { showSections(); return; }\r\n  // Use the enriched lesson ONLY when it belongs to the lesson being shown —\r\n  // re-renders (onValueChange, study timer) must not reuse a copy left over\r\n  // from another lesson.\r\n  var enriched = (window._currentEnrichedKey === currentSectionId + '|' + currentLessonId) ? window._currentEnrichedLesson : null;\r\n  var lesson = enriched || findLesson(section, currentLessonId);\r\n  if (!lesson) { openSection(currentSectionId); return; }\r\n\r\n  var prog = getLessonProgress(section.id, lesson.id);\r\n\r\n  el('detail-breadcrumb').innerHTML =\r\n    '<span onclick=\"showSections()\">📚 All Sections<\/span> › ' +\r\n    '<span onclick=\"openSection(\\'' + esc(section.id) + '\\')\">' + esc(section.title || 'Section') + '<\/span> › ' +\r\n    '<span>' + esc(lesson.title || 'Lesson') + '<\/span>';\r\n\r\n  el('detail-title').textContent = lesson.title || 'Untitled Lesson';\r\n  el('detail-estimated').textContent = '⏱️ Estimated: ' + (lesson.estimatedMinutes || '—') + ' min';\r\n\r\n  var badge = el('detail-badge');\r\n  var statusLabels = { not_started: 'Not Started', in_progress: 'In Progress', completed: 'Completed', pending_review: 'Awaiting Review', studying: 'Study & Retry' };\r\n  var statusClasses = { not_started: 'status-not_started', in_progress: 'status-in_progress', completed: 'status-completed', pending_review: 'status-pending_review', studying: 'status-studying' };\r\n  badge.textContent = statusLabels[prog.status] || 'Not Started';\r\n  badge.className = 'detail-badge ' + (statusClasses[prog.status] || 'status-not_started');\r\n  var statusExtra = typeof prog.score === 'number' ? ' | Score: ' + prog.score + '%' : '';\r\n  if (prog.supervisorStatus === 'rejected' && prog.supervisorNotes) {\r\n    statusExtra += ' | 📝 Supervisor feedback: ' + esc(prog.supervisorNotes);\r\n  }\r\n  el('detail-status-label').textContent = statusExtra;\r\n\r\n  var youtubeUrls = normalizePdfArray(lesson.youtubeUrls);\r\n  var presentationPdfs = normalizePdfArray(lesson.presentationPdfUrls);\r\n  var studyDocPdfs = normalizePdfArray(lesson.studyDocPdfUrls);\r\n  var worksheetPdfs = normalizePdfArray(lesson.worksheetPdfUrls);\r\n  var answerKeyPdfs = normalizePdfArray(lesson.answerKeyPdfUrls);\r\n  var htmlDocs = normalizePdfArray(lesson.htmlDocUrls);\r\n\r\n  // Filter out hidden documents (manager toggled them off for students)\r\n  var hiddenDocUrls = normalizePdfArray(lesson.hiddenDocUrls);\r\n  if (hiddenDocUrls.length > 0) {\r\n    function isHiddenDoc(url) {\r\n      for (var hd = 0; hd < hiddenDocUrls.length; hd++) {\r\n        if (hiddenDocUrls[hd] === url) return true;\r\n      }\r\n      return false;\r\n    }\r\n    presentationPdfs = presentationPdfs.filter(function(u) { return !isHiddenDoc(u); });\r\n    studyDocPdfs = studyDocPdfs.filter(function(u) { return !isHiddenDoc(u); });\r\n    worksheetPdfs = worksheetPdfs.filter(function(u) { return !isHiddenDoc(u); });\r\n    answerKeyPdfs = answerKeyPdfs.filter(function(u) { return !isHiddenDoc(u); });\r\n    htmlDocs = htmlDocs.filter(function(u) { return !isHiddenDoc(u); });\r\n  }\r\n\r\n  var content = lesson.content || '';\r\n\r\n  // Check hidden sections (visibility toggles set by manager)\r\n  var hiddenSections = (lesson.hiddenSections && Array.isArray(lesson.hiddenSections)) ? lesson.hiddenSections : [];\r\n  function isHidden(key) { return hiddenSections.indexOf(key) !== -1; }\r\n\r\n  var quizData = lesson.quiz;\r\n  if (quizData && typeof quizData === 'string') { try { quizData = JSON.parse(quizData); } catch(e) { quizData = null; } }\r\n  var hasQuiz = quizData && Array.isArray(quizData) && quizData.length > 0;\r\n\r\n  // Self-heal legacy/inconsistent records: a stored score ≥ MIN_PASS_SCORE\r\n  // means the quiz WAS passed even if the quizPassed flag is missing.\r\n  // (Without this, the Finish summary could show \"Score 100% · Failed\".)\r\n  if (hasQuiz && typeof prog.score === 'number' && prog.score >= MIN_PASS_SCORE && prog.quizPassed !== true) {\r\n    prog.quizPassed = true;\r\n    saveProgress(); // silent stage — the next explicit action persists it\r\n  }\r\n\r\n  var steps = [];\r\n  var stepNum = 0;\r\n\r\n  if (youtubeUrls.length > 0 && !isHidden('videos')) {\r\n    stepNum++;\r\n    var videoIds = [];\r\n    for (var vi = 0; vi < youtubeUrls.length; vi++) { var vid = extractYouTubeId(youtubeUrls[vi]); if (vid) videoIds.push(vid); }\r\n    steps.push({ num: stepNum, icon: '🎬', title: 'Video' + (videoIds.length > 1 ? 's' : ''), type: 'video', videoIds: videoIds, hasContent: videoIds.length > 0 });\r\n  }\r\n  if (presentationPdfs.length > 0 && !isHidden('slides')) { stepNum++; steps.push({ num: stepNum, icon: '📊', title: 'Slides', type: 'pdfs', pdfUrls: presentationPdfs, label: 'Presentation Slide', hasContent: true }); }\r\n  if (studyDocPdfs.length > 0 && !isHidden('studyDocs')) { stepNum++; steps.push({ num: stepNum, icon: '📖', title: 'Documents', type: 'pdfs', pdfUrls: studyDocPdfs, label: 'Study Material', hasContent: true }); }\r\n  if (worksheetPdfs.length > 0 && !isHidden('worksheets')) { stepNum++; steps.push({ num: stepNum, icon: '📝', title: 'Worksheet', type: 'pdfs', pdfUrls: worksheetPdfs, label: 'Worksheet', hasContent: true }); }\r\n  if (answerKeyPdfs.length > 0 && !isHidden('answerKeys')) { stepNum++; steps.push({ num: stepNum, icon: '🔑', title: 'Answers', type: 'pdfs', pdfUrls: answerKeyPdfs, label: 'Answer Key', hasContent: true }); }\r\n  if (htmlDocs.length > 0 && !isHidden('webDocs')) { stepNum++; steps.push({ num: stepNum, icon: '🌐', title: 'Web Doc', type: 'htmlDoc', htmlDocUrls: htmlDocs, label: 'Web Doc', hasContent: true }); }\r\n  var htmlCode = lesson.htmlCode || '';\r\n  if (htmlCode && htmlCode.length > 20 && !isHidden('studyContent')) { stepNum++; steps.push({ num: stepNum, icon: '📖', title: 'Study Guide', type: 'htmlCode', htmlCode: htmlCode, hasContent: true }); }\r\n  // Presentation slides tab\r\n  var presHtml = lesson.presentationHtml || '';\r\n  if (presHtml && presHtml.length > 50 && !isHidden('presentation')) { stepNum++; steps.push({ num: stepNum, icon: '🎞️', title: 'Presentation', type: 'presentation', presHtml: presHtml, hasContent: true }); }\r\n  // Flashcards tab\r\n  var flashcards = lesson.flashcards;\r\n  if (flashcards && typeof flashcards === 'string') { try { flashcards = JSON.parse(flashcards); } catch(e) { flashcards = null; } }\r\n  var hasFlashcards = flashcards && Array.isArray(flashcards) && flashcards.length > 0;\r\n  if (hasFlashcards && !isHidden('flashcards')) { stepNum++; steps.push({ num: stepNum, icon: '🃏', title: 'Flashcards', type: 'flashcards', flashcards: flashcards, hasContent: true }); }\r\n  if (content && content !== '<br>' && content !== '<br>' && !isHidden('notes')) { stepNum++; steps.push({ num: stepNum, icon: '📄', title: 'Notes', type: 'html', html: content, hasContent: true }); }\r\n  if (hasQuiz && !isHidden('questions')) { stepNum++; steps.push({ num: stepNum, icon: '📝', title: 'Quiz', type: 'quiz', quizData: quizData, hasContent: true }); }\r\n  // Always add a nav step at the end with Previous/Next/Complete buttons\r\n  stepNum++; steps.push({ num: stepNum, icon: '✅', title: 'Finish', type: 'nav', hasContent: true });\r\n\r\n  var flowEl = el('study-flow');\r\n  var html = '';\r\n  window._pdfRenderQueue = [];\r\n\r\n  // Build tab bar (shown on desktop, hidden on mobile). Each tab gets a small\r\n  // one-line subtitle describing what is inside the step.\r\n  var tabsHtml = '';\r\n  if (steps.length > 0) {\r\n    tabsHtml = '<div class=\"study-tabs\"><div class=\"study-tabs-inner\">';\r\n    for (var ti = 0; ti < steps.length; ti++) {\r\n      var stp = steps[ti];\r\n      var stpSub = '';\r\n      if (stp.type === 'video') stpSub = stp.videoIds.length + ' video' + (stp.videoIds.length !== 1 ? 's' : '');\r\n      else if (stp.type === 'pdfs') stpSub = stp.pdfUrls.length + ' file' + (stp.pdfUrls.length !== 1 ? 's' : '');\r\n      else if (stp.type === 'htmlDoc') stpSub = stp.htmlDocUrls.length + ' web doc' + (stp.htmlDocUrls.length !== 1 ? 's' : '');\r\n      else if (stp.type === 'htmlCode') stpSub = 'Study guide';\r\n      else if (stp.type === 'presentation') stpSub = 'Slideshow';\r\n      else if (stp.type === 'flashcards') stpSub = (stp.flashcards ? stp.flashcards.length : 0) + ' cards';\r\n      else if (stp.type === 'html') stpSub = 'Reading notes';\r\n      else if (stp.type === 'quiz') stpSub = 'Test your knowledge';\r\n      else if (stp.type === 'nav') stpSub = 'Summary & finish';\r\n      tabsHtml += '<button class=\"study-tab-btn\" data-tab-step=\"' + ti + '\"><span class=\"study-tab-badge\">' + stp.num + '<\/span><span class=\"study-tab-text\"><span class=\"study-tab-title\">' + stp.icon + ' ' + esc(stp.title) + '<\/span>' + (stpSub ? '<span class=\"study-tab-sub\">' + esc(stpSub) + '<\/span>' : '') + '<\/span><\/button>';\r\n    }\r\n    tabsHtml += '<\/div><\/div>';\r\n  }\r\n\r\n  if (steps.length === 0) {\r\n    html = '<div class=\"study-flow-empty\"><div class=\"empty-icon\">📖<\/div><div class=\"empty-title\">No study materials yet<\/div><div class=\"empty-desc\">This lesson has no content. A manager needs to add materials.<\/div><\/div>';\r\n  } else {\r\n    html = tabsHtml + '<div class=\"study-steps\">';\r\n    for (var si = 0; si < steps.length; si++) {\r\n      var step = steps[si];\r\n      var stepId = 'study-step-' + si;\r\n      var isLast = si === steps.length - 1;\r\n      html += '<div class=\"study-step\" id=\"' + stepId + '\">';\r\n      // Connector line between steps\r\n      if (!isLast) html += '<div class=\"study-step-connector\"><\/div>';\r\n      // Step header\r\n      html += '<div class=\"study-step-header\" onclick=\"toggleStudySt
