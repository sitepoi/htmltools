<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="A landscape presentation deck explaining 19 scholarships from the November 2026 cycle: value, deadline, eligibility, judging criteria and application links.">
<title>Scholarships - November 2026</title>
<style>
/* ==========================================================================
   1. Base tokens
   ========================================================================== */
:root {
  --ink: #0b1220;
  --text: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --soft: #f8fafc;
  --accent: #1e3a8a;
  --accent-2: #b45309;
  --accent-soft: #e8effc;
  --good: #15803d;
  --good-soft: #dcfce7;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background-color: #eef2f7;
  background-image: radial-gradient(1200px 600px at 85% -10%, #e3ebfb 0%, transparent 55%),
    radial-gradient(900px 500px at -10% 110%, #fdf3e3 0%, transparent 55%);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ==========================================================================
   2. Fixed deck chrome
   ========================================================================== */
.pres-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 0;
  height: 4px;
  z-index: 80;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.25s ease;
}

.deck-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 22px;
  background: rgba(11, 18, 32, 0.9);
  color: #fff;
}

.deck-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.brand-mark {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: linear-gradient(135deg, #93c5fd, #fcd34d);
  box-shadow: 0 0 10px rgba(252, 211, 77, 0.5);
}

.brand-dim { color: rgba(255, 255, 255, 0.6); font-weight: 500; }

.deck-actions { display: flex; align-items: center; gap: 10px; }

.deck-counter {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.92);
}

.ghost-btn {
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: transparent;
  color: #fff;
  cursor: pointer;
  transition: background 0.15s ease;
}

.ghost-btn:hover { background: rgba(255, 255, 255, 0.12); }

.pres-nav {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 70;
  display: flex;
  gap: 4px;
  padding: 5px;
  border-radius: 999px;
  background: rgba(11, 18, 32, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 18px 40px -14px rgba(11, 18, 32, 0.55);
}

.nav-btn {
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 9px 16px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.86);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); color: #fff; }
.nav-btn:disabled { opacity: 0.32; cursor: default; }

.nav-export {
  color: #fff;
  background: linear-gradient(135deg, var(--accent), #3730a3);
  box-shadow: 0 6px 18px -6px rgba(30, 58, 138, 0.8);
}

.nav-export:hover:not(:disabled) { background: linear-gradient(135deg, #1e40af, #4338ca); }

/* ==========================================================================
   3. Stage and slide frame (screen sizes are tuned to 1122 x 631 px = 297 x 167 mm)
   ========================================================================== */
.pres-stage {
  width: min(1122px, calc(100vw - 48px));
  margin: 0 auto;
  padding: 80px 0 106px;
}

.pres-slide {
  position: relative;
  display: none;
  flex-direction: column;
  width: 100%;
  aspect-ratio: 297 / 167;
  overflow: hidden;
  padding: 1.9em 3.1em 1.6em;
  font-size: 15px;
  color: var(--text);
  background-color: #ffffff;
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 26px 54px -28px rgba(15, 23, 42, 0.28);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.pres-slide.active { display: flex; }

.slide-accent {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.slide-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1.2em;
  flex: none;
}

.slide-head-main { flex: 1; min-width: 0; }

.slide-kicker {
  display: flex;
  align-items: center;
  gap: 0.55em;
  font-size: 0.72em;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}

.kicker-dash {
  display: inline-block;
  width: 1.9em;
  height: 0.22em;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.slide-title {
  margin: 0.3em 0 0;
  font-size: 2.4em;
  line-height: 1.07;
  letter-spacing: -0.025em;
  font-weight: 800;
  color: var(--ink);
}

.slide-sub {
  margin: 0.42em 0 0;
  font-size: 0.96em;
  line-height: 1.45;
  color: var(--muted);
  max-width: 62em;
}

/* Brand rail: Future Bridge logo + deck label on every slide */
.brand-rail {
  display: flex;
  align-items: center;
  gap: 0.55em;
  flex: none;
  padding-bottom: 0.5em;
  margin-bottom: 0.55em;
  border-bottom: 1px solid var(--line);
}

.rail-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 2.35em;
  padding: 0 0.45em;
  border: 1px solid var(--line);
  border-radius: 0.32em;
  background: #ffffff;
}

.rail-badge img {
  display: block;
  height: 1.65em;
  width: auto;
}

.rail-divider { width: 1px; height: 1em; background: var(--line); }

.rail-label {
  font-size: 0.62em;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.slide-num {
  margin-left: auto;
  font-size: 0.62em;
  font-weight: 800;
  letter-spacing: 0.16em;
  color: #94a3b8;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
  flex: none;
  padding: 0.35em 0.85em;
  border-radius: 999px;
  font-size: 0.7em;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  white-space: nowrap;
}

.status-open { background: var(--good-soft); color: var(--good); }
.status-soon { background: var(--warn-soft); color: #92400e; }
.status-today { background: var(--bad-soft); color: var(--bad); }
.status-closed { background: #e2e8f0; color: #475569; }

.head-badges {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.35em;
  flex: none;
}

.writing-pill {
  display: inline-flex;
  align-items: center;
  padding: 0.35em 0.85em;
  border-radius: 999px;
  background: #e0e7ff;
  color: #3730a3;
  font-size: 0.7em;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ==========================================================================
   4. Title slide
   ========================================================================== */
.title-slide {
  justify-content: flex-start;
  padding: 1.5em 3.1em 1.2em;
  border-color: rgba(255, 255, 255, 0.14);
  background-color: #0b1a3a;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(135deg, #081129 0%, #12275a 55%, #1e3a8a 100%);
  background-size: 44px 44px, 44px 44px, auto;
}

.title-slide .slide-accent { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
.title-slide .slide-kicker { color: #fcd34d; }
.title-slide .kicker-dash { background: #fcd34d; }
.title-slide .brand-rail { border-bottom-color: rgba(255, 255, 255, 0.16); }
.title-slide .rail-badge { border-color: rgba(255, 255, 255, 0.24); }
.title-slide .rail-divider { background: rgba(255, 255, 255, 0.22); }
.title-slide .rail-label { color: rgba(255, 255, 255, 0.6); }
.title-slide .slide-num { color: rgba(255, 255, 255, 0.5); }

.title-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 2.2em;
  align-items: center;
  flex: 1;
  min-height: 0;
}

.title-main { min-width: 0; }

.title-slide h1 {
  margin: 0.3em 0 0;
  font-size: 3.2em;
  line-height: 1.04;
  letter-spacing: -0.035em;
  font-weight: 800;
  color: #ffffff;
}

.title-lead {
  margin: 0.5em 0 0;
  font-size: 1.02em;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.84);
  max-width: 30em;
}

.title-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5em;
  margin: 0.9em 0 0;
  font-size: 0.72em;
  color: rgba(255, 255, 255, 0.55);
}

.title-meta i {
  display: inline-block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.35);
}

.title-note {
  margin: 0.85em 0 0;
  padding-left: 0.75em;
  border-left: 2px solid rgba(252, 211, 77, 0.55);
  font-size: 0.74em;
  line-height: 1.45;
  color: rgba(255, 255, 255, 0.58);
  max-width: 34em;
}

.title-card {
  padding: 0.75em 1.05em;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 0.9em;
  background: rgba(255, 255, 255, 0.08);
}

.title-card-row {
  display: flex;
  align-items: baseline;
  gap: 0.75em;
  padding: 0.45em 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.title-card-row:last-child { border-bottom: none; }

.title-card-row b {
  min-width: 1.9em;
  font-size: 1.65em;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.03em;
  color: #ffffff;
}

.title-card-row span {
  font-size: 0.76em;
  line-height: 1.3;
  color: rgba(255, 255, 255, 0.72);
}

.title-partners {
  flex: none;
  margin-top: 0.9em;
  padding-top: 0.8em;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
}

.partner-label {
  display: block;
  margin-bottom: 0.5em;
  font-size: 0.6em;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.55);
}

.partner-wall { display: grid; gap: 0.45em; }

.partner-wall-title { grid-template-columns: repeat(7, 1fr); }

.partner-tile {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 3.8em;
  padding: 0.35em 0.45em;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 0.45em;
  background: #ffffff;
}

.partner-tile img {
  display: block;
  max-width: 100%;
  max-height: 2.5em;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* ==========================================================================
   5. At a glance slide
   ========================================================================== */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 0.9em;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 0.8em;
  background: #ffffff;
  overflow: hidden;
}

.stat-tile {
  padding: 0.75em 1em;
  border-left: 1px solid var(--line);
}

.stat-tile:first-child { border-left: none; }

.stat-value {
  font-size: 2.15em;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--accent);
}

.stat-label {
  margin-top: 0.4em;
  font-size: 0.78em;
  line-height: 1.3;
  color: var(--muted);
}

.split-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8em;
  margin-top: 0.9em;
  flex: 1;
  min-height: 0;
  align-content: center;
  align-items: stretch;
}

.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 0.85em 1em;
  border: 1px solid var(--line);
  border-radius: 0.85em;
  background: #ffffff;
}

.panel h3 {
  display: flex;
  align-items: center;
  gap: 0.5em;
  margin: 0;
  font-size: 0.74em;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.card-dot {
  display: inline-block;
  width: 0.55em;
  height: 0.55em;
  border-radius: 0.16em;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}

.rank-list { display: grid; gap: 0.55em; margin-top: 0.7em; }

.rank-item { display: block; }

.rank-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.6em;
  font-size: 0.84em;
}

.rank-name { font-weight: 700; color: var(--ink); }
.rank-amount { color: var(--muted); font-size: 0.9em; white-space: nowrap; }

.rank-bar {
  height: 0.3em;
  margin-top: 0.3em;
  border-radius: 999px;
  background: #eef2f7;
  overflow: hidden;
}

.rank-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.close-item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.7em;
  padding: 0.48em 0;
  border-bottom: 1px dashed var(--line);
  font-size: 0.84em;
}

.close-item:last-child { border-bottom: none; }
.close-item strong { color: var(--ink); font-weight: 700; }
.close-item span { color: var(--muted); white-space: nowrap; font-size: 0.92em; }

/* ==========================================================================
   6. Deadline board
   ========================================================================== */
.board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.2em 1.6em;
  margin-top: 0.9em;
  flex: 1;
  min-height: 0;
  align-content: start;
}

.board-group {
  display: grid;
  grid-template-columns: 5.2em 1fr;
  gap: 0.7em;
  align-items: start;
  padding: 0.34em 0;
  border-bottom: 1px solid var(--line);
}

.board-date {
  font-size: 0.86em;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
}

.board-date small {
  display: block;
  font-size: 0.8em;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.board-items { display: flex; flex-wrap: wrap; gap: 0.32em; }

.board-item {
  padding: 0.22em 0.7em;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--soft);
  font-size: 0.76em;
  color: var(--text);
}

.board-tip {
  margin-top: 0.7em;
  padding: 0.55em 0.85em;
  border: 1px solid #c7d2fe;
  border-radius: 0.7em;
  background: #eef2ff;
  font-size: 0.76em;
  color: #3730a3;
}

.board-tip strong { color: #1e3a8a; }

/* ==========================================================================
   7. Quick reference grid
   ========================================================================== */
.index-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.7em;
  margin-top: 0.9em;
  flex: 1;
  min-height: 0;
  align-content: start;
}

.index-col { display: grid; gap: 0.34em; align-content: start; }

.index-item {
  padding: 0.32em 0.6em;
  border: 1px solid var(--line);
  border-radius: 0.45em;
  background: #ffffff;
}

.index-name {
  font-size: 0.76em;
  font-weight: 700;
  line-height: 1.2;
  color: var(--ink);
}

.index-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4em;
  margin-top: 0.14em;
  font-size: 0.66em;
  color: var(--muted);
}

.meta-dot {
  display: inline-block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #cbd5e1;
}

.mini-status { font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.mini-status.open { color: var(--good); }
.mini-status.soon { color: var(--warn); }
.mini-status.today { color: var(--bad); }
.mini-status.closed { color: #64748b; }

.index-writing {
  padding: 0.1em 0.45em;
  border-radius: 999px;
  background: #e0e7ff;
  color: #3730a3;
  font-size: 0.92em;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ==========================================================================
   7b. Writing requirements table
   ========================================================================== */
.writing-table {
  width: 100%;
  margin-top: 0.9em;
  border-collapse: collapse;
  table-layout: fixed;
  flex: none;
}

.writing-table th {
  padding: 0.5em 0.6em;
  border-bottom: 1px solid var(--line);
  background: var(--soft);
  font-size: 0.6em;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
}

.writing-table td {
  padding: 0.45em 0.6em;
  border-bottom: 1px solid var(--line);
  font-size: 0.7em;
  line-height: 1.35;
  vertical-align: top;
  color: var(--text);
}

.writing-table tbody tr:nth-child(even) td { background: #fbfcff; }

.writing-table td:first-child strong {
  display: block;
  font-size: 1.02em;
  color: var(--ink);
}

.writing-provider {
  display: block;
  margin-top: 0.1em;
  font-size: 0.86em;
  color: var(--muted);
}

.writing-table th:nth-child(1), .writing-table td:nth-child(1) { width: 23%; }
.writing-table th:nth-child(2), .writing-table td:nth-child(2) { width: 12%; }
.writing-table th:nth-child(3), .writing-table td:nth-child(3) { width: 14%; }
.writing-table th:nth-child(5), .writing-table td:nth-child(5) { width: 10%; }

.writing-note {
  margin-top: auto;
  padding: 0.55em 0.85em;
  border: 1px solid #c7d2fe;
  border-radius: 0.6em;
  background: #eef2ff;
  font-size: 0.72em;
  line-height: 1.4;
  color: #3730a3;
}

.writing-note b { color: #1e3a8a; }

/* ==========================================================================
   8. Scholarship slide
   ========================================================================== */
.sch-facts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 0.8em;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 0.7em;
  background: var(--soft);
  overflow: hidden;
}

.sch-fact {
  padding: 0.5em 0.85em;
  border-left: 1px solid var(--line);
}

.sch-fact:first-child { border-left: none; }

.sch-fact span {
  display: block;
  font-size: 0.64em;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.sch-fact strong {
  display: block;
  margin-top: 0.18em;
  font-size: 0.92em;
  line-height: 1.25;
  color: var(--ink);
}

.sch-fact em {
  display: block;
  margin-top: 0.12em;
  font-size: 0.66em;
  font-style: normal;
  font-weight: 600;
  color: var(--warn);
}

.sch-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.7em;
  margin-top: 0.75em;
  flex: 1;
  min-height: 0;
  align-content: center;
  align-items: stretch;
}

.sch-card {
  min-height: 0;
  overflow: hidden;
  padding: 0.7em 0.9em;
  border: 1px solid var(--line);
  border-radius: 0.8em;
  background: #ffffff;
}

.sch-card h3 {
  display: flex;
  align-items: center;
  gap: 0.5em;
  margin: 0;
  font-size: 0.7em;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.sch-card ul {
  list-style: none;
  margin: 0.55em 0 0;
  padding: 0;
  display: grid;
  gap: 0.38em;
}

.sch-card li {
  display: grid;
  grid-template-columns: 0.6em 1fr;
  gap: 0.55em;
  align-items: start;
  font-size: 0.9em;
  line-height: 1.46;
  color: var(--text);
}

.li-tick {
  display: block;
  width: 2px;
  height: 0.95em;
  margin-top: 0.2em;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
}

.li-text { min-width: 0; }

.sch-foot {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.2em;
  margin-top: 0.65em;
  flex: none;
}

.sch-note {
  font-size: 0.7em;
  line-height: 1.4;
  color: var(--muted);
  max-width: 80%;
}

.sch-note b { color: var(--ink); }

.sch-link {
  flex: none;
  padding-bottom: 0.1em;
  border-bottom: 1px solid rgba(30, 58, 138, 0.35);
  color: var(--accent);
  font-size: 0.72em;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

.sch-link:hover { border-bottom-color: var(--accent); }

.is-closed .slide-accent { background: #cbd5e1; }
.is-closed .sch-facts { background: #f1f5f9; }
.is-closed .sch-fact em { color: #64748b; }
.is-closed .sch-card { background: #fcfdff; }
.is-closed .li-tick { background: #cbd5e1; }

/* ==========================================================================
   9. How to apply + sources
   ========================================================================== */
.step-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.7em;
  margin-top: 1em;
  flex: none;
}

.step {
  padding: 1em 1.15em;
  border: 1px solid var(--line);
  border-radius: 0.8em;
  background: #ffffff;
}

.step-num {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2em;
  height: 2em;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 0.82em;
  font-weight: 800;
}

.step h3 {
  margin: 0.55em 0 0;
  font-size: 1em;
  line-height: 1.3;
  color: var(--ink);
}

.step p {
  margin: 0.35em 0 0;
  font-size: 0.86em;
  line-height: 1.45;
  color: var(--muted);
}

.doc-strip {
  margin-top: 0.8em;
  padding: 0.65em 0.9em;
  border: 1px solid var(--line);
  border-radius: 0.7em;
  background: var(--soft);
  flex: none;
}

.doc-strip h3 {
  margin: 0;
  font-size: 0.68em;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.doc-chips { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.5em; }

.doc-chip {
  padding: 0.24em 0.72em;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #ffffff;
  font-size: 0.74em;
  color: var(--text);
}

.caution {
  margin-top: auto;
  padding: 0.6em 0.9em;
  border: 1px solid #fcd34d;
  border-radius: 0.7em;
  background-color: #fffbeb;
  font-size: 0.76em;
  line-height: 1.4;
  color: #92400e;
}

.plain-list {
  list-style: none;
  margin: 0.7em 0 0;
  padding: 0;
  display: grid;
  gap: 0.55em;
}

.plain-list li {
  display: grid;
  grid-template-columns: 0.6em 1fr;
  gap: 0.55em;
  align-items: start;
  font-size: 0.84em;
  line-height: 1.42;
}

.plain-list .li-tick { margin-top: 0.15em; }

/* ==========================================================================
   9b. Closing slide + partner wall
   ========================================================================== */
.closing-slide {
  justify-content: flex-start;
  padding: 1.5em 3.1em 1.2em;
  border-color: rgba(255, 255, 255, 0.14);
  background-color: #0b1a3a;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(135deg, #081129 0%, #12275a 55%, #1e3a8a 100%);
  background-size: 44px 44px, 44px 44px, auto;
}

.closing-slide .slide-accent { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
.closing-slide .slide-kicker { color: #fcd34d; }
.closing-slide .kicker-dash { background: #fcd34d; }
.closing-slide .brand-rail { border-bottom-color: rgba(255, 255, 255, 0.16); }
.closing-slide .rail-badge { border-color: rgba(255, 255, 255, 0.24); }
.closing-slide .rail-divider { background: rgba(255, 255, 255, 0.22); }
.closing-slide .rail-label { color: rgba(255, 255, 255, 0.6); }
.closing-slide .slide-num { color: rgba(255, 255, 255, 0.5); }
.closing-slide .slide-title { color: #ffffff; }
.closing-slide .slide-sub { color: rgba(255, 255, 255, 0.72); }

.closing-body {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 1.4em;
  align-items: stretch;
  flex: 1;
  min-height: 0;
  margin-top: 0.9em;
}

.closing-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  min-height: 0;
}

.closing-logo-plate {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: flex-start;
  padding: 0.45em 0.8em;
  border-radius: 0.45em;
  background: #ffffff;
}

.closing-logo-plate img {
  display: block;
  height: 3em;
  width: auto;
}

.closing-reminders {
  display: grid;
  gap: 0.55em;
  margin-top: 0.95em;
}

.reminder {
  display: grid;
  grid-template-columns: 1.9em 1fr;
  gap: 0.7em;
  align-items: start;
}

.reminder-num {
  padding-top: 0.15em;
  font-size: 0.72em;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: #fcd34d;
}

.reminder h3 {
  margin: 0;
  font-size: 0.82em;
  font-weight: 700;
  color: #ffffff;
}

.reminder p {
  margin: 0.18em 0 0;
  font-size: 0.74em;
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.68);
}

.partner-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 0.8em 0.9em;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 0.9em;
  background: rgba(255, 255, 255, 0.06);
}

.partner-panel h3 {
  margin: 0;
  font-size: 0.6em;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.62);
}

.partner-wall-closing {
  flex: 1;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: 1fr;
  margin-top: 0.55em;
}

.partner-wall-closing .partner-tile { height: auto; }
.partner-wall-closing .partner-tile:last-child:nth-child(odd) { grid-column: span 2; }

.source-note {
  flex: none;
  margin-top: 1em;
  padding-top: 0.55em;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
  font-size: 0.64em;
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.5);
}

.source-note b { color: rgba(255, 255, 255, 0.76); }

/* ==========================================================================
   10. Overview dialog
   ========================================================================== */
.deck-overview {
  position: fixed;
  inset: 0;
  z-index: 200;
  padding: 42px 24px;
  overflow: auto;
  background: rgba(11, 18, 32, 0.72);
}

.deck-overview[hidden] { display: none; }

.overview-panel {
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 18px;
  background: #ffffff;
  box-shadow: 0 30px 70px -24px rgba(11, 18, 32, 0.6);
}

.overview-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.overview-head h2 { margin: 0; font-size: 20px; color: var(--ink); }
.overview-head p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.overview-head .ghost-btn { border-color: var(--line); color: var(--ink); }
.overview-head .ghost-btn:hover { background: var(--soft); }

.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin-top: 18px;
}

.overview-card {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #ffffff;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.overview-card:hover { border-color: #93c5fd; background: var(--soft); }

.overview-num {
  display: block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: var(--accent);
}

.overview-title {
  display: block;
  margin-top: 3px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.25;
  color: var(--ink);
}

.overview-kicker {
  display: block;
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--muted);
}

.noscript {
  max-width: 640px;
  margin: 120px auto;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  text-align: center;
}

/* ==========================================================================
   11. Responsive downscale (screen only)
   ========================================================================== */
@media screen and (max-width: 1180px) {
  .pres-slide { font-size: calc((100vw - 48px) / 86.3); }
}

@media screen and (max-width: 760px) {
  .deck-bar { padding: 10px 14px; }
  .brand-dim { display: none; }
  .pres-stage { width: calc(100vw - 20px); padding-top: 72px; }
  .pres-nav { width: calc(100vw - 24px); justify-content: center; }
  .nav-btn { padding: 8px 10px; font-size: 11.5px; }
  .pres-slide { padding: 1.3em 1.5em 1.3em; border-radius: 12px; }
  .slide-title { font-size: 1.9em; }
  .sch-facts, .stat-row, .step-row { grid-template-columns: 1fr 1fr; }
  .sch-facts .sch-fact:nth-child(3), .stat-tile:nth-child(3) { border-left: none; }
  .sch-cols, .split-2, .board { grid-template-columns: 1fr; }
  .index-grid { grid-template-columns: 1fr; }
  .title-slide { padding: 1.2em 1.5em 1em; }
  .title-grid { grid-template-columns: 1fr; }
  .title-side { display: none; }
  .title-slide h1 { font-size: 2.2em; }
  .partner-wall-title { grid-template-columns: repeat(4, 1fr); }
  .partner-tile { height: 3em; }
  .closing-slide { padding: 1.2em 1.5em 1em; }
  .closing-body { grid-template-columns: 1fr; }
  .partner-wall-closing .partner-tile { height: 3.2em; }
  .closing-reminders { display: none; }
}

/* ==========================================================================
   12. Print path (Ctrl+P -> Save as PDF)
   ========================================================================== */
@media print {
  @page { size: 297mm 167mm; margin: 0; }

  html, body { background: #fff; }

  .deck-bar, .pres-nav, .pres-progress, .deck-overview { display: none !important; }

  .pres-stage {
    width: 297mm;
    margin: 0;
    padding: 0;
  }

  .pres-slide {
    display: flex !important;
    width: 297mm;
    height: 167mm;
    margin: 0;
    font-size: 15px;
    border: none;
    border-radius: 0;
    box-shadow: none;
    page-break-after: always;
    break-after: page;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .pres-slide:last-child { page-break-after: auto; break-after: auto; }
}
</style>
</head>

<div class="pres-root">

  <div class="pres-progress" id="deckProgress"></div>

  <header class="deck-bar">
    <div class="deck-brand">
      <span class="brand-mark"></span>
      <span>Scholarships <span class="brand-dim">/ November 2026</span></span>
    </div>
    <div class="deck-actions">
      <span class="deck-counter" id="deckCounter">1 / 1</span>

  <main class="pres-stage" id="presStage"></main>

  <nav class="pres-nav" aria-label="Deck navigation">
    <button type="button" class="nav-btn" id="btnPrev">Prev</button>
    <button type="button" class="nav-btn nav-export" id="btnExport" title="Builds a 297 x 167 mm landscape PDF, one slide per page">Export PDF</button>
    <button type="button" class="nav-btn" id="btnPrint">Print</button>
    <button type="button" class="nav-btn" id="btnNext">Next</button>
  </nav>

  <div class="deck-overview" id="deckOverview" hidden>
    <div class="overview-panel">
      <div class="overview-head">
        <div>
          <h2>All slides</h2>
          <p>Jump to any part of the deck.</p>
        </div>
        <button type="button" class="ghost-btn" id="btnOverviewClose">Close</button>
      </div>
      <div class="overview-grid" id="overviewGrid"></div>
    </div>
  </div>

  <noscript>
    <p class="noscript">This presentation needs JavaScript to build its slides. Open it in a browser with scripting enabled.</p>
  </noscript>

</div>

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function pad(number) {
    return (number < 10 ? '0' : '') + number;
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function dateParts(isoDate) {
    var parts = isoDate.split('-');
    return { year: Number(parts[0]), month: Number(parts[1]), day: Number(parts[2]) };
  }

  function formatDate(isoDate, withYear) {
    var parts = dateParts(isoDate);
    return MONTHS[parts.month - 1] + ' ' + parts.day + (withYear === false ? '' : ', ' + parts.year);
  }

  function weekdayOf(isoDate) {
    var parts = dateParts(isoDate);
    return WEEKDAYS[new Date(parts.year, parts.month - 1, parts.day).getDay()];
  }

  function todayAtMidnight() {
    var now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }

  function daysFromToday(isoDate) {
    var parts = dateParts(isoDate);
    var target = new Date(parts.year, parts.month - 1, parts.day);
    return Math.round((target - todayAtMidnight()) / 86400000);
  }

  function statusOf(award) {
    var days = daysFromToday(award.deadline);
    if (days < 0) {
      return { key: 'closed', label: 'Closed ' + formatDate(award.deadline, false), short: 'Closed', detail: 'Closed ' + formatDate(award.deadline), days: days };
    }
    if (days === 0) {
      return { key: 'today', label: 'Closes today', short: 'Today', detail: 'Closes today', days: days };
    }
    if (days <= 7) {
      return {
        key: 'soon',
        label: days === 1 ? 'Closes tomorrow' : 'Closing soon',
        short: 'Soon',
        detail: days === 1 ? 'Closes tomorrow' : 'Closes in ' + days + ' days',
        days: days
      };
    }
    return { key: 'open', label: 'Open', short: 'Open', detail: 'Closes in ' + days + ' days', days: days };
  }

  function sortByDeadline(a, b) {
    return a.deadline.localeCompare(b.deadline) || a.name.localeCompare(b.name);
  }

  var orderedAwards = AWARDS.slice().sort(function (a, b) {

  }

        '<div class="sch-fact"><span>Where</span><strong>' + esc(award.where) + '</strong></div>' +
      '</div>' +
      '<div class="sch-cols">' +
        '<div class="sch-card">' +
          '<h3><i class="card-dot"></i>Who can apply</h3>' +
          '<ul>' + award.eligibility.map(function (line) {
            return '<li><span class="li-tick"></span><span class="li-text">' + esc(line) + '</span></li>';
          }).join('') + '</ul>' +
        '</div>' +
        '<div class="sch-card">' +
          '<h3><i class="card-dot"></i>' + esc(award.reviewLabel) + '</h3>' +
          '<ul>' + award.review.map(function (line) {
            return '<li><span class="li-tick"></span><span class="li-text">' + esc(line) + '</span></li>';
          }).join('') + '</ul>' +
        '</div>' +
      '</div>' +
      '<div class="sch-foot">' +
        '<span class="sch-note"><b>Good to know:</b> ' + esc(award.note) + '</span>' +
        '<a class="sch-link" href="' + esc(award.link) + '" target="_blank" rel="noopener">' + esc(award.linkLabel) + '</a>' +
      '</div>';

    return '' +
      '<section class="pres-slide sch-slide' + (isClosed ? ' is-closed' : '') + '" data-slide-title="' + esc(award.name) + '" data-slide-kicker="' + esc('Award ' + awardIndex + ' of ' + awardTotal) + '">' +
        '<span class="slide-accent"></span>' +
        brandRail() +
        '<div class="slide-head">' +
          '<div class="slide-head-main">' +
            '<div class="slide-kicker"><i class="kicker-dash"></i><span>Award ' + pad(awardIndex) + ' of ' + awardTotal + ' - ' + esc(award.provider) + '</span></div>' +
            '<h2 class="slide-title">' + esc(award.name) + '</h2>' +
          '</div>' +
          '<div class="head-badges">' +
            (writing ? '<span class="writing-pill">Writing required</span>' : '') +
            '<span class="status-pill status-' + status.key + '">' + esc(status.label) + '</span>' +
          '</div>' +
        '</div>' +
        body +
      '</section>';
  }

  function writingSlide() {
    var rows = writingAwards.map(function (award) {
      var writing = WRITING_REQUIREMENTS[award.name];
      return '' +
        '<tr>' +
          '<td><strong>' + esc(award.name) + '</strong><span class="writing-provider">' + esc(award.provider) + '</span></td>' +
          '<td>' + esc(writing.type) + '</td>' +
          '<td>' + esc(writing.length) + '</td>' +
          '<td>' + esc(writing.prompt) + '</td>' +
          '<td>' + esc(formatDate(award.deadline, false)) + '</td>' +
        '</tr>';
    }).join('');

    var body = '' +
      '<table class="writing-table">' +
        '<thead><tr><th>Award</th><th>Type</th><th>Length</th><th>What the piece must cover</th><th>Due</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<div class="writing-note"><b>How to read this table:</b> these awards explicitly ask for original writing in their published criteria. Length is the provider limit; the criteria column is what the piece has to address. Other awards may still include a statement inside the application form, so always check the provider page.</div>';

    return slideFrame({
      className: 'writing-slide',
      kicker: 'Essay and written submissions',
      title: writingAwards.length + ' awards require a written piece',
      subtitle: 'The essays, letters, summaries and proposals named in the award criteria, in deadline order.',
      body: body
    });
  }

  function howToApplySlide() {
    var steps = [
      { title: 'Start with the earliest deadline', text: 'November 1 and November 2 close first: Bernard Erlin, Hydro One, Wolf Scholars, CSEG and Michael Decter.' },
      { title: 'Check the hard filters', text: 'Citizenship, province, GPA, age and enrolment year eliminate most applicants before any writing starts.' },
      { title: 'Collect the documents', text: 'Transcript, references, proof of enrolment, CV, and the essay or proposal the award asks for.' },
      { title: 'Apply on the provider page', text: 'Use the official link on each slide and keep a copy of everything you submitted.' }
    ];

    var stepHtml = steps.map(function (step, index) {
      return '' +
        '<div class="step">' +
          '<span class="step-num">' + (index + 1) + '</span>' +
          '<h3>' + esc(step.title) + '</h3>' +
          '<p>' + esc(step.text) + '</p>' +
        '</div>';
    }).join('');

    var documents = ['Transcript', 'Two references', 'Proof of enrolment', 'CV or resume', 'Essay 500 to 750 words', 'Exhibition or project proposal', 'Portfolio images', 'Test scores (optional)'];

    var body = '' +
      '<div class="step-row">' + stepHtml + '</div>' +
      '<div class="doc-strip">' +
        '<h3><i class="card-dot"></i> Documents to have ready</h3>' +
        '<div class="doc-chips">' + documents.map(function (doc) {
          return '<span class="doc-chip">' + esc(doc) + '</span>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="caution">Dates, amounts and criteria on these slides come from the source records. Always confirm them on the provider official page before you apply.</div>';

    return slideFrame({
      className: 'apply-slide',
      kicker: 'Application checklist',
      title: 'How to work through this list',
      subtitle: 'A simple order that keeps the closest deadlines moving while you prepare the slower applications.',
      body: body
    });
  }

  function closingSlide() {
    var reminders = [
      { title: 'Verify before you write', text: 'Confirm eligibility, the award amount and the exact submission steps on the provider page.' },
      { title: 'Reuse what you already have', text: 'One transcript, one CV and two reference letters cover most of the awards in this deck.' },
      { title: 'Finish early', text: 'Submit at least 48 hours before the deadline so a technical problem does not cost you an award.' }
    ];

    var reminderHtml = reminders.map(function (reminder, index) {
      return '' +
        '<div class="reminder">' +
          '<span class="reminder-num">0' + (index + 1) + '</span>' +
          '<div><h3>' + esc(reminder.title) + '</h3><p>' + esc(reminder.text) + '</p></div>' +
        '</div>';
    }).join('');

    var body = '' +
      '<div class="closing-body">' +
        '<div class="closing-left">' +
          '<span class="closing-logo-plate">' + logoImg('futureBridge', '', 'Future Bridge Academy') + '</span>' +
          '<div class="closing-reminders">' + reminderHtml + '</div>' +
          '<div class="source-note"><b>About this deck:</b> ' + AWARDS.length + ' awards from the November 2026 cycle that are still open for applications. Dates, amounts and criteria come from the provider pages at the time of writing; the provider page always wins.</div>' +
        '</div>' +
        '<div class="partner-panel">' +
          '<h3>In partnership with</h3>' +
          partnerWall('partner-wall-closing') +
        '</div>' +
      '</div>';

    return '' +
      '<section class="pres-slide closing-slide" data-slide-title="Start with the deadline that comes first" data-slide-kicker="Next step">' +
        '<span class="slide-accent"></span>' +
        brandRail() +
        '<div class="slide-head">' +
          '<div class="slide-head-main">' +
            '<div class="slide-kicker"><i class="kicker-dash"></i><span>Next step</span></div>' +
            '<h2 class="slide-title">Start with the deadline that comes first</h2>' +
            '<p class="slide-sub">Five awards close on November 1 and 2. Send those first, then work down the list in deadline order.</p>' +
          '</div>' +
        '</div>' +
        body +
      '</section>';
  }

  /* ==========================================================================
     Build the deck
     ========================================================================== */
  var stage = document.getElementById('presStage');

  var slidesHtml = [
    titleSlide(),
    glanceSlide(),
    deadlineSlide(),
    indexSlide(),
    writingSlide(),
    orderedAwards.map(function (award, index) {
      return scholarshipSlide(award, index + 1, orderedAwards.length);
    }).join(''),
    howToApplySlide(),
    closingSlide()
  ].join('');

  stage.innerHTML = slidesHtml;

  /* ==========================================================================
     Deck engine: navigation, overview, print and PDF export
     ========================================================================== */
  function byId(id) { return document.getElementById(id); }

  var slideElements = Array.prototype.slice.call(document.querySelectorAll('.pres-slide'));
  var totalSlides = slideElements.length;
  var currentIndex = 0;

  slideElements.forEach(function (slide, index) {
    var numberLabel = slide.querySelector('.slide-num');
    if (numberLabel) { numberLabel.textContent = pad(index + 1) + ' / ' + pad(totalSlides); }
  });

  var counter = byId('deckCounter');
  var progress = byId('deckProgress');
  var previousButton = byId('btnPrev');
  var nextButton = byId('btnNext');
  var overview = byId('deckOverview');
  var overviewGrid = byId('overviewGrid');

  function showSlide(index, skipScroll) {
    if (index < 0 || index >= totalSlides) { return; }
    currentIndex = index;
    slideElements.forEach(function (slide, slideIndex) {
      slide.classList.toggle('active', slideIndex === currentIndex);
    });
    if (counter) { counter.textContent = (currentIndex + 1) + ' / ' + totalSlides; }
    if (progress) { progress.style.width = ((currentIndex + 1) / totalSlides) * 100 + '%'; }
    if (previousButton) { previousButton.disabled = currentIndex === 0; }
    if (nextButton) { nextButton.disabled = currentIndex === totalSlides - 1; }
    if (window.location.hash !== '#slide-' + (currentIndex + 1)) {
      try { window.history.replaceState(null, '', '#slide-' + (currentIndex + 1)); } catch (error) { /* file protocol */ }
    }
    if (!skipScroll) {
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (error) { window.scrollTo(0, 0); }
    }
  }

  function stepSlide(delta) { showSlide(currentIndex + delta); }

  if (previousButton) { previousButton.addEventListener('click', function () { stepSlide(-1); }); }
  if (nextButton) { nextButton.addEventListener('click', function () { stepSlide(1); }); }
  if (byId('btnPrint')) {
    byId('btnPrint').addEventListener('click', function () {
      try { window.print(); } catch (error) { window.alert('Print is not available in this browser. Use the browser menu instead.'); }
    });
  }

  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowRight' || event.key === 'ArrowDown' || event.key === 'PageDown') {
      if (!overview.hidden) { return; }
      stepSlide(1);
    } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp' || event.key === 'PageUp') {
      if (!overview.hidden) { return; }
      stepSlide(-1);
    } else if (event.key === 'Home') {
      if (!overview.hidden) { return; }
      showSlide(0);
    } else if (event.key === 'End') {
      if (!overview.hidden) { return; }
      showSlide(totalSlides - 1);
    } else if (event.key === 'Escape') {
      closeOverview();
    } else if (event.key === 'g' || event.key === 'G') {
      if (overview.hidden) { openOverview(); }
    }
  });

  stage.addEventListener('click', function (event) {
    if (event.target.closest('a, button, input, select, textarea')) { return; }
    var middle = window.innerWidth / 2;
    if (event.clientX > middle) { stepSlide(1); } else { stepSlide(-1); }
  });

  function buildOverview() {
    if (!overviewGrid) { return; }
    overviewGrid.innerHTML = '';
    slideElements.forEach(function (slide, index) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'overview-card';
      card.innerHTML = '' +
        '<span class="overview-num">' + pad(index + 1) + '</span>' +
        '<span class="overview-title">' + esc(slide.getAttribute('data-slide-title') || '') + '</span>' +
        '<span class="overview-kicker">' + esc(slide.getAttribute('data-slide-kicker') || '') + '</span>';
      card.addEventListener('click', function () {
        closeOverview();
        showSlide(index);
      });
      overviewGrid.appendChild(card);
    });
  }

  function openOverview() {
    if (!overview) { return; }
    overview.hidden = false;
    var closeButton = byId('btnOverviewClose');
    if (closeButton) { closeButton.focus(); }
  }

  function closeOverview() {
    if (!overview || overview.hidden) { return; }
    overview.hidden = true;
    var openButton = byId('btnOverview');
    if (openButton) { openButton.focus(); }
  }

  if (byId('btnOverview')) { byId('btnOverview').addEventListener('click', openOverview); }
  if (byId('btnOverviewClose')) { byId('btnOverviewClose').addEventListener('click', closeOverview); }
  if (overview) {
    overview.addEventListener('click', function (event) {
      if (event.target === overview) { closeOverview(); }
    });
  }

  buildOverview();

  var hashMatch = window.location.hash.match(/slide-(\d+)/);
  var startIndex = hashMatch ? Math.max(0, Math.min(parseInt(hashMatch[1], 10) - 1, totalSlides - 1)) : 0;
  showSlide(startIndex, true);

  /* ==========================================================================
     PDF export: html2canvas captures each slide, jsPDF assembles the pages
     ========================================================================== */
  function loadPdfEngines(onReady) {
    if (window.html2pdf && window.html2canvas) { onReady(); return; }

    var pendingLoads = 0;
    var loadFailed = false;
    var loadTimeout = setTimeout(function () {
      if (loadFailed) { return; }
      loadFailed = true;
      window.alert('The PDF engine is taking too long. Check your internet connection, then try again.');
    }, 12000);

    function markEngineLoaded() {
      pendingLoads -= 1;
      if (loadFailed) { return; }
      if (pendingLoads === 0) {
        clearTimeout(loadTimeout);
        onReady();
      }
    }

    function markEngineFailed() {
      if (loadFailed) { return; }
      loadFailed = true;
      clearTimeout(loadTimeout);
      window.alert('Could not load the PDF engine. Check your internet connection, or use Print instead.');
    }

    function injectEngineScript(scriptSource, onScriptLoaded) {
      var scriptElement = document.createElement('script');
      scriptElement.src = scriptSource;
      scriptElement.onload = onScriptLoaded;
      scriptElement.onerror = markEngineFailed;
      document.head.appendChild(scriptElement);
    }

    if (!window.html2canvas) {
      pendingLoads += 1;
      injectEngineScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', markEngineLoaded);
    }
    if (!window.html2pdf) {
      pendingLoads += 1;
      injectEngineScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js', markEngineLoaded);
    }
    if (pendingLoads === 0) {
      clearTimeout(loadTimeout);
      onReady();
    }
  }

  function collectSlideTextBlocks(exportShell) {
    var blockSelector = '.slide-kicker, .slide-title, .slide-sub, h1, h2, h3, p, li, span, strong, a, small, cite, th, td';
    var collectedElements = Array.prototype.slice.call(exportShell.querySelectorAll(blockSelector));
    var shellRect = exportShell.getBoundingClientRect();
    var textBlocks = [];

    collectedElements.forEach(function (element) {
      var directText = '';
      for (var nodeIndex = 0; nodeIndex < element.childNodes.length; nodeIndex++) {
        if (element.childNodes[nodeIndex].nodeType === 3) {
          directText += element.childNodes[nodeIndex].nodeValue;
        }
      }
      directText = directText.replace(/\s+/g, ' ').trim();
      if (!directText) { return; }
      var elementRect = element.getBoundingClientRect();
      var fontSizePx = parseFloat(window.getComputedStyle(element).fontSize) || 16;
      textBlocks.push({
        text: directText,
        xMm: (elementRect.left - shellRect.left) / 1122.52 * 297,
        yMm: (elementRect.top - shellRect.top) / 631.18 * 167,
        widthMm: elementRect.width / 1122.52 * 297,
        fontSizePt: fontSizePx / 1122.52 * 297 * 72 / 25.4
      });
    });

    return textBlocks;
  }

  function addInvisibleTextLayer(pdf, textBlocks) {
    textBlocks.forEach(function (block) {
      pdf.setFontSize(block.fontSizePt);
      pdf.text(block.text, block.xMm, block.yMm + block.fontSizePt * 0.28, {
        maxWidth: block.widthMm,
        renderingMode: 'invisible'
      });
    });
  }

  var exportButton = byId('btnExport');

  function exportPdf() {
    if (!exportButton || exportButton.disabled) { return; }
    exportButton.disabled = true;
    var originalLabel = exportButton.textContent;
    exportButton.textContent = 'Loading engines...';

    loadPdfEngines(function () {
      var baseOptions = {
        margin: 0,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 1200 },
        jsPDF: { unit: 'mm', format: [297, 167], orientation: 'landscape', compress: true },
        pageSize: { width: 297, height: 167, unit: 'mm', k: 96 / 25.4 }
      };
      var pdfDocument = null;

      function finishExport() {
        exportButton.disabled = false;
        exportButton.textContent = originalLabel;
      }

      function renderSlide(slideIndex) {
        if (slideIndex >= slideElements.length) {
          if (pdfDocument) {
            pdfDocument.save('Scholarships-November-2026.pdf');
            if (window.console && console.log) {
              console.log('PDF exported: ' + pdfDocument.internal.getNumberOfPages() + ' pages at 297 x 167 mm');
            }
          }
          finishExport();
          return;
        }

        exportButton.textContent = 'Exporting ' + (slideIndex + 1) + ' / ' + slideElements.length + '...';

        var exportShell = document.createElement('div');
        exportShell.style.cssText = 'position: fixed; left: -10000px; top: 0;'
          + ' width: 1122.52px; height: 631.18px;'
          + ' overflow: hidden; background: #ffffff;';

        var slideClone = slideElements[slideIndex].cloneNode(true);
        slideClone.classList.add('active');
        slideClone.style.cssText += '; display: flex !important; width: 100% !important; height: 100% !important;'
          + ' min-height: 0 !important; aspect-ratio: auto !important; margin: 0 !important;'
          + ' box-sizing: border-box !important; border: none !important; border-radius: 0 !important;'
          + ' box-shadow: none !important; animation: none !important;';
        exportShell.appendChild(slideClone);
        document.body.appendChild(exportShell);

        window.html2canvas(exportShell, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          windowWidth: 1200
        }).then(function (slideCanvas) {
          var textBlocks = collectSlideTextBlocks(exportShell);
          if (exportShell.parentNode) { exportShell.parentNode.removeChild(exportShell); }
          if (!slideCanvas) { throw new Error('the slide rendered as an empty image'); }

          var imageDataUrl = slideCanvas.toDataURL('image/jpeg', 0.95);
          if (!imageDataUrl || imageDataUrl.indexOf('data:image') !== 0) {
            throw new Error('the slide rendered as an empty image');
          }

          if (slideIndex === 0) {
            return window.html2pdf().set(baseOptions).set({ canvas: slideCanvas }).toPdf().get('pdf').then(function (firstPdf) {
              pdfDocument = firstPdf;
              while (pdfDocument.internal.getNumberOfPages() > 1) {
                pdfDocument.deletePage(pdfDocument.internal.getNumberOfPages());
              }
              pdfDocument.setPage(1);
              pdfDocument.addImage(imageDataUrl, 'JPEG', 0, 0, 297, 167);
              pdfDocument.setProperties({
                title: 'Scholarships - November 2026',
                subject: 'Scholarship briefing, November 2026 cycle',
                creator: 'Scholarships deck'
              });
              addInvisibleTextLayer(pdfDocument, textBlocks);
              renderSlide(1);
            });
          }

          pdfDocument.addPage([297, 167], 'landscape');
          pdfDocument.addImage(imageDataUrl, 'JPEG', 0, 0, 297, 167);
          addInvisibleTextLayer(pdfDocument, textBlocks);
          renderSlide(slideIndex + 1);
        }).catch(function (exportError) {
          if (exportShell.parentNode) { exportShell.parentNode.removeChild(exportShell); }
          window.alert('PDF export failed: ' + ((exportError && exportError.message) || exportError));
          finishExport();
        });
      }

      renderSlide(0);
    });
  }

  if (exportButton) { exportButton.addEventListener('click', exportPdf); }
})();
</script>
</body>
