<!doctype html>
<html>
<head><meta charset="utf-8"><title>double binder probe</title>
<style>body { margin: 0; padding: 16px; font: 12px system-ui; } pre { white-space: pre-wrap; }</style>
</head>
<body>
<pre id="out">pending</pre>
<script>
var files = [
	'volunteer-apply.html',
	'join.html',
	'contact.html',
	'formpages/career-fair-entry-registration-2026-10-17.html'
];
var lines = [];
var index = 0;
var out = document.getElementById('out');

function run() {
	if (index >= files.length) { out.textContent = lines.join('\n'); return; }
	var file = files[index];
	var frame = document.createElement('iframe');
	frame.style.cssText = 'width:900px;height:1000px;border:0';
	frame.src = file;
	frame.onload = function () {
		var doc = frame.contentDocument;
		var win = frame.contentWindow;
		var form = doc.querySelector('form');
		var posts = [];
		var shellFired = false;

		win.fetch = function (url) {
			posts.push(url);
			return Promise.resolve({
				status: 400,
				text: function () {
					return Promise.resolve(JSON.stringify({ ok: false, error: 'SAMPLE', message: 'example code' }));
				}
			});
		};

		/* the CMS shell's binder in miniature: bubble phase, posts on its own */
		form.addEventListener('submit', function () {
			shellFired = true;
			posts.push('shell:/api/forms/submit');
		}, false);

		var logged = [];
		var realError = win.console.error;
		win.console.error = function () { logged.push(Array.prototype.join.call(arguments, ' ')); };

		/* satisfy every required field so the form is allowed to submit */
		Array.prototype.forEach.call(form.querySelectorAll('[required]'), function (field) {
			if (field.tagName === 'SELECT') { field.selectedIndex = 1; return; }
			if (field.type === 'email') { field.value = 'ayse@example.com'; return; }
			if (field.type === 'tel') { field.value = '(604) 555-0123'; return; }
			if (field.type === 'checkbox') { field.checked = true; return; }
			field.value = 'Ayse Yilmaz';
		});

		form.dispatchEvent(new win.Event('submit', { bubbles: true, cancelable: true }));

		setTimeout(function () {
			win.console.error = realError;
			lines.push(file);
			lines.push('  shell binder fired: ' + shellFired);
			lines.push('  requests: ' + JSON.stringify(posts));
			lines.push('  console: ' + (logged.length ? logged[0].slice(0, 120) : 'none'));
			frame.remove();
			index += 1;
			run();
		}, 300);
	};
	document.body.appendChild(frame);
}
run();
</script>
</body>
</html>
