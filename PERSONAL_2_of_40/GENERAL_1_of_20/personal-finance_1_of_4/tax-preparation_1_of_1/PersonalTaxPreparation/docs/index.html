button class=\"btn btn-primary\" id=\"chat-send\">Send ➤<\/button>\r\n\t\t\t\t\t<\/div>\r\n\t\t\t\t\t<div class=\"chat-status\" id=\"chat-status\"><\/div>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/div>\r\n\t\t<\/section>\r\n\r\n\t\t<!-- REPORTS -->\r\n\t\t<section id=\"sec-reports\" class=\"section\">\r\n\t\t\t<div class=\"page-header\">\r\n\t\t\t\t<div class=\"page-title\">📤 Reports &amp; Handoff<\/div>\r\n\t\t\t\t<div class=\"page-sub\">Everything your accountant or tax software needs, in one package.<\/div>\r\n\t\t\t\t<div class=\"toolbar\">\r\n\t\t\t\t\t<button class=\"btn btn-primary\" id=\"btn-export-package\">📄 Export Preparer Package (PDF)<\/button>\r\n\t\t\t\t\t<button class=\"btn btn-outline\" id=\"btn-export-gst\">🧾 Export GST Summary (PDF)<\/button>\r\n\t\t\t\t\t<button class=\"btn btn-outline\" id=\"btn-email-accountant\">✉️ Email to Accountant<\/button>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/div>\r\n\t\t\t<div class=\"dash-grid\">\r\n\t\t\t\t<div class=\"card\">\r\n\t\t\t\t\t<div class=\"card-header\"><span class=\"card-title\">📦 What's in the Preparer Package<\/span><\/div>\r\n\t\t\t\t\t<div class=\"card-body\">\r\n\t\t\t\t\t\t<ul class=\"plain-list\">\r\n\t\t\t\t\t\t\t<li>✔ Taxpayer &amp; business profile (name, entity, GST/PST registration)<\/li>\r\n\t\t\t\t\t\t\t<li>✔ Income statement — revenue by category<\/li>\r\n\t\t\t\t\t\t\t<li>✔ Expense breakdown by T2125 / T2 schedule category<\/li>\r\n\t\t\t\t\t\t\t<li>✔ Full transaction ledger<\/li>\r\n\t\t\t\t\t\t\t<li>✔ GST / HST summary (GST34 line map) + BC PST paid<\/li>\r\n\t\t\t\t\t\t\t<li>✔ Document register with source links<\/li>\r\n\t\t\t\t\t\t\t<li>✔ Checklist status &amp; open questions from the AI<\/li>\r\n\t\t\t\t\t\t<\/ul>\r\n\t\t\t\t\t<\/div>\r\n\t\t\t\t<\/div>\r\n\t\t\t\t<div class=\"card\">\r\n\t\t\t\t\t<div class=\"card-header\"><span class=\"card-title\">⚠️ Before you file<\/span><\/div>\r\n\t\t\t\t\t<div class=\"card-body\">\r\n\t\t\t\t\t\t<ul class=\"plain-list\">\r\n\t\t\t\t\t\t\t<li>Verify every AI-classified transaction against source documents.<\/li>\r\n\t\t\t\t\t\t\t<li>Home-office and vehicle claims need % and km support.<\/li>\r\n\t\t\t\t\t\t\t<li>Estimates in this tool are planning aids — not filing numbers.<\/li>\r\n\t\t\t\t\t\t\t<li>Consider having an accountant review before submitting to CRA.<\/li>\r\n\t\t\t\t\t\t<\/ul>\r\n\t\t\t\t\t<\/div>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/div>\r\n\t\t<\/section>\r\n\r\n\t\t<!-- SETTINGS -->\r\n\t\t<section id=\"sec-settings\" class=\"section\">\r\n\t\t\t<div class=\"page-header\">\r\n\t\t\t\t<div class=\"page-title\">⚙ Settings &amp; Profile<\/div>\r\n\t\t\t\t<div class=\"page-sub\">Set up the taxpayer, the business, and GST / PST details.<\/div>\r\n\t\t\t\t<div class=\"toolbar\">\r\n\t\t\t\t\t<button class=\"btn btn-primary\" id=\"btn-save-settings\">💾 Save Settings<\/button>\r\n\t\t\t\t\t<button class=\"btn btn-danger-ghost\" id=\"btn-reset-tool\">🗑 Reset everything<\/button>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/div>\r\n\t\t\t<div class=\"dash-grid\">\r\n\t\t\t\t<div class=\"card\">\r\n\t\t\t\t\t<div class=\"card-header\"><span class=\"card-title\">👤 Taxpayer &amp; business<\/span><\/div>\r\n\t\t\t\t\t<div class=\"card-body form-stack\">\r\n\t\t\t\t\t\t<label class=\"field\"><span>Filing entity<\/span>\r\n\t\t\t\t\t\t\t<div class=\"entity-cards\">\r\n\t\t\t\t\t\t\t\t<label class=\"entity-card\"><input type=\"radio\" name=\"set-entityType\" value=\"personal\"><span class=\"ec-title\">Personal<\/span><span class=\"ec-sub\">T1 only<\/span><\/label>\r\n\t\t\t\t\t\t\t\t<label class=\"entity-card\"><input type=\"radio\" name=\"set-entityType\" value=\"soleProp\"><span class=\"ec-title\">Sole Proprietor<\/span><span class=\"ec-sub\">T1 + T2125<\/span><\/label>\r\n\t\t\t\t\t\t\t\t<label class=\"entity-card\"><input type=\"radio\" name=\"set-entityType\" value=\"corporation\"><span class=\"ec-title\">Corporation<\/span><span class=\"ec-sub\">T2 (CCPC)<\/span><\/label>\r\n\t\t\t\t\t\t\t<\/div>\r\n\t\t\t\t\t\t<\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>Your name / business name<\/span><input type=\"text\" class=\"form-input\" id=\"set-businessName\" placeholder=\"e.g. Acme Consulting Ltd.\"><\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>Tax year<\/span><input type=\"number\" class=\"form-input\" id=\"set-taxYear\" min=\"2020\" max=\"2030\"><\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>Fiscal year end<\/span>\r\n\t\t\t\t\t\t\t<select class=\"form-input\" id=\"set-fiscalEnd\">\r\n\t\t\t\t\t\t\t\t<option value=\"12-31\">December 31<\/option><option value=\"06-30\">June 30<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"03-31\">March 31<\/option><option value=\"09-30\">September 30<\/option>\r\n\t\t\t\t\t\t\t<\/select>\r\n\t\t\t\t\t\t<\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>Industry<\/span>\r\n\t\t\t\t\t\t\t<select class=\"form-input\" id=\"set-industry\">\r\n\t\t\t\t\t\t\t\t<option value=\"consulting\">Consulting / Professional<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"tech\">Technology / Software<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"trades\">Trades / Construction<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"retail\">Retail / E-commerce<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"food\">Food &amp; Hospitality<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"transport\">Transport / Delivery<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"creative\">Creative / Media<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"other\">Other<\/option>\r\n\t\t\t\t\t\t\t<\/select>\r\n\t\t\t\t\t\t<\/label>\r\n\t\t\t\t\t<\/div>\r\n\t\t\t\t<\/div>\r\n\t\t\t\t<div class=\"card\">\r\n\t\t\t\t\t<div class=\"card-header\"><span class=\"card-title\">🧾 GST / PST &amp; income extras<\/span><\/div>\r\n\t\t\t\t\t<div class=\"card-body form-stack\">\r\n\t\t\t\t\t\t<label class=\"field\"><span>GST / HST registered<\/span>\r\n\t\t\t\t\t\t\t<select class=\"form-input\" id=\"set-gstRegistered\">\r\n\t\t\t\t\t\t\t\t<option value=\"yes\">Yes — I charge &amp; claim GST<\/option>\r\n\t\t\t\t\t\t\t\t<option value=\"no\">No — not registered<\/option>\r\n\t\t\t\t\t\t\t<\/select>\r\n\t\t\t\t\t\t<\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>GST number<\/span><input type=\"text\" class=\"form-input\" id=\"set-gstNumber\" placeholder=\"9-digit BN (optional)\"><\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>GST filing frequency<\/span>\r\n\t\t\t\t\t\t\t<select class=\"form-input\" id=\"set-gstFrequency\">\r\n\t\t\t\t\t\t\t\t<option value=\"annual\">Annual<\/option><option value=\"quarterly\">Quarterly<\/option><option value=\"monthly\">Monthly<\/option>\r\n\t\t\t\t\t\t\t<\/select>\r\n\t\t\t\t\t\t<\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>BC PST registered<\/span>\r\n\t\t\t\t\t\t\t<select class=\"form-input\" id=\"set-pstRegistered\">\r\n\t\t\t\t\t\t\t\t<option value=\"no\">No<\/option><option value=\"yes\">Yes<\/option>\r\n\t\t\t\t\t\t\t<\/select>\r\n\t\t\t\t\t\t<\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>Employment income (T4) — personal<\/span><input type=\"number\" step=\"0.01\" class=\"form-input\" id=\"set-employmentIncome\" placeholder=\"0.00\"><\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>Other personal income<\/span><input type=\"number\" step=\"0.01\" class=\"form-input\" id=\"set-otherIncome\" placeholder=\"0.00\"><\/label>\r\n\t\t\t\t\t\t<label class=\"field\"><span>Accountant email (for handoff)<\/span><input type=\"text\" class=\"form-input\" id=\"set-accountantEmail\" placeholder=\"accountant@example.com\"><\/label>\r\n\t\t\t\t\t<\/div>\r\n\t\t\t\t<\/div>\r\n\t\t\t<\/div>\r\n\t\t<\/section>\r\n\t<\/main>\r\n\r\n\t<div class=\"modal-overlay\" id=\"modal-overlay\" style=\"display:none\">\r\n\t\t<div class=\"modal\" id=\"modal-box\"><\/div>\r\n\t<\/div>\r\n\t<div class=\"toast-container\" id=\"toast-container\"><\/div>\r\n<\/div>\r\n"},"css":{"name":"PersonalTaxPreparation.css","src":"../app/PersonalTaxPreparation.css","content":"/* ── MapleBooks Tax Prep BC ── */\r\n:root {\r\n\t--bg: #f4f6fa;\r\n\t--bg2: #ffffff;\r\n\t--sidebar-bg: #10233f;\r\n\t--sidebar-text: #c7d4e8;\r\n\t--sidebar-active: #1c3761;\r\n\t--text: #17233a;\r\n\t--muted: #66748c;\r\n\t--border: #dfe5ef;\r\n\t--border2: #b9c4d6;\r\n\t--primary: #0f766e;\r\n\t--primary-hover: #0c625b;\r\n\t--primary-soft: #e0f2f1;\r\n\t--accent: #d43d2f;\r\n\t--accent-soft: #fdecea;\r\n\t--amber: #b45309;\r\n\t--amber-soft: #fef3c7;\r\n\t--green: #15803d;\r\n\t--green-soft: #dcfce7;\r\n\t--red: #b91c1c;\r\n\t--red-soft: #fee2e2;\r\n\t--shadow: 0 1px 3px rgba(16, 35, 63, .08);\r\n\t--shadow-lg: 0 12px 32px rgba(16, 35, 63, .18);\r\n\t--radius: 10px;\r\n}\r\n[data-theme=\"dark\"] {\r\n\t--bg: #0e1524;\r\n\t--bg2: #172036;\r\n\t--sidebar-bg: #0b1220;\r\n\t--sidebar-text: #9fb0cb;\r\n\t--sidebar-active: #182844;\r\n\t--text: #e7edf7;\r\n\t--muted: #8fa0ba;\r\n\t--border: #26334c;\r\n\t--border2: #3b4a68;\r\n\t--primary: #2bb8ab;\r\n\t--primary-hover: #47c9bd;\r\n\t--primary-soft: #0e2a28;\r\n\t--accent: #ef6a5d;\r\n\t--accent-soft: #3a1715;\r\n\t--amber: #f0b35e;\r\n\t--amber-soft: #33260d;\r\n\t--green: #4ade80;\r\n\t--green-soft: #0e2b1a;\r\n\t--red: #f87171;\r\n\t--red-soft: #371414;\r\n\t--shadow: 0 1px 3px rgba(0,0,0,.4);\r\n\t--shadow-lg: 0 12px 32px rgba(0,0,0,.5);\r\n}\r\n* { box-sizing: border-box; }\r\nhtml, body { margin: 0; padding: 0; }\r\nbody {\r\n\tfont-family: -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\r\n\tbackground: var(--bg);\r\n\tcolor: var(--text);\r\n\tfont-size: 13.5px;\r\n\tline-height: 1.45;\r\n}\r\n#app { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }\r\n\r\n/* ── Sidebar ── */\r\n.sidebar {\r\n\tbackground: var(--sidebar-bg);\r\n\tcolor: var(--sidebar-text);\r\n\tdisplay: flex;\r\n\tflex-direction: column;\r\n\tposition: sticky;\r\n\ttop: 0;\r\n\theight: 100vh;\r\n}\r\n.sidebar-brand { padding: 18px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.07); }\r\n.brand-logo { font-size: 22px; }\r\n.brand-name { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: .2px; }\r\n.brand-sub { font-size: 11px; color: #7f91ad; margin-top: 1px; }\r\n.nav { flex: 1; padding: 10px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }\r\n.nav-item {\r\n\tdisplay: flex; align-items: center; gap: 9px;\r\n\tpadding: 9px 12px; border-radius: 8px; cursor: pointer;\r\n\tcolor: var(--sidebar-text); font-weight: 600; font-size: 13px;\r\n\ttransition: background .15s;\r\n}\r\n.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }\r\n.nav-item.active { background: var(--sidebar-active); color: #fff; }\r\n.nav-icon { width: 18px; text-align: center; font-size: 14px; }\r\n.nav-badge {\r\n\tmargin-left: auto; background: var(--accent); color: #fff;\r\n\tfont-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px;\r\n\tmin-width: 18px; text-align: center;\r\n}\r\n.nav-badge:empty { display: none; }\r\n.sidebar-footer { padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.07); font-size: 11.5px; }\r\n.sb-year strong { color: #fff; }\r\n.sb-gst { color: #7f91ad; margin-top: 4px; }\r\n\r\n/* ── Main / topbar ── */\r\n.main { padding: 0 22px 40px; min-width: 0; }\r\n.topbar {\r\n\tdisplay: flex; justify-content: space-between; align-items: center;\r\n\tpadding: 12px 0 4px; position: sticky; top: 0; z-index: 40;\r\n\tbackground: var(--bg);\r\n}\r\n.topbar-save { font-size: 11.5px; color: var(--green); font-weight: 600; }\r\n.topbar-right { display: flex; align-items: center; gap: 10px; }\r\n.ai-pill {\r\n\tfont-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;\r\n\tbackground: var(--amber-soft); color: var(--amber);\r\n}\r\n.ai-pill.ok { background: var(--green-soft); color: var(--green); }\r\n.ai-pill.off { background: var(--red-soft); color: var(--red); }\r\n.user-chip { font-size: 12px; color: var(--muted); font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.theme-toggle {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); color: var(--text);\r\n\tborder-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 14px;\r\n}\r\n.theme-toggle:hover { border-color: var(--border2); }\r\n\r\n/* ── Sections ── */\r\n.section { display: none; padding-top: 14px; }\r\n.section.active { display: block; }\r\n.page-header { margin-bottom: 16px; }\r\n.page-title { font-size: 20px; font-weight: 800; }\r\n.page-sub { color: var(--muted); margin-top: 2px; font-size: 12.5px; }\r\n.toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }\r\n.toolbar-status { font-size: 12px; color: var(--muted); font-weight: 600; }\r\n\r\n/* ── Buttons ── */\r\n.btn {\r\n\tborder: 1px solid transparent; border-radius: 8px; cursor: pointer;\r\n\tpadding: 8px 14px; font-size: 12.5px; font-weight: 700;\r\n\tbackground: var(--bg2); color: var(--text); border-color: var(--border);\r\n\ttransition: all .15s; font-family: inherit;\r\n}\r\n.btn:hover { border-color: var(--border2); }\r\n.btn:disabled { opacity: .5; cursor: not-allowed; }\r\n.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }\r\n.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }\r\n.btn-outline { background: transparent; border-color: var(--primary); color: var(--primary); }\r\n.btn-outline:hover { background: var(--primary-soft); }\r\n.btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }\r\n.btn-ghost:hover { color: var(--text); border-color: var(--border2); }\r\n.btn-danger-ghost { background: transparent; border-color: var(--red); color: var(--red); }\r\n.btn-danger-ghost:hover { background: var(--red-soft); }\r\n.btn-sm { padding: 5px 10px; font-size: 11.5px; border-radius: 7px; }\r\n.icon-btn {\r\n\tbackground: transparent; border: none; cursor: pointer; font-size: 14px;\r\n\tpadding: 3px 6px; border-radius: 6px; color: var(--muted);\r\n}\r\n.icon-btn:hover { background: var(--primary-soft); color: var(--primary); }\r\n.icon-btn.danger:hover { background: var(--red-soft); color: var(--red); }\r\n\r\n/* ── Cards ── */\r\n.card {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);\r\n\tbox-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;\r\n}\r\n.card-header {\r\n\tdisplay: flex; align-items: center; gap: 10px; padding: 13px 16px;\r\n\tborder-bottom: 1px solid var(--border); flex-wrap: wrap;\r\n}\r\n.card-title { font-weight: 800; font-size: 14px; }\r\n.card-sub { color: var(--muted); font-size: 11.5px; font-weight: 600; margin-left: auto; }\r\n.card-body { padding: 14px 16px; }\r\n\r\n/* ── Stats ── */\r\n.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }\r\n.stat-card {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);\r\n\tpadding: 14px 16px; box-shadow: var(--shadow);\r\n}\r\n.stat-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }\r\n.stat-value { font-size: 20px; font-weight: 800; margin-top: 4px; }\r\n.stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }\r\n.stat-card.inc .stat-value { color: var(--green); }\r\n.stat-card.exp .stat-value { color: var(--accent); }\r\n.stat-card.net .stat-value { color: var(--primary); }\r\n\r\n/* ── Dashboard ── */\r\n.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\r\n@media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }\r\n.banner {\r\n\tbackground: var(--amber-soft); color: var(--amber); border: 1px solid #f0d48a;\r\n\tpadding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 600;\r\n\tdisplay: flex; align-items: center; gap: 12px; flex-wrap: wrap;\r\n}\r\n[data-theme=\"dark\"] .banner { border-color: #5b461c; }\r\n.progress-track { height: 10px; background: var(--border); border-radius: 999px; margin: 12px 16px 6px; overflow: hidden; }\r\n.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #2ba8a0); border-radius: 999px; transition: width .4s; }\r\n.readiness-items { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 6px; }\r\n.readiness-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }\r\n.readiness-item .ri-icon { width: 16px; text-align: center; }\r\n.readiness-item.done { color: var(--green); }\r\n.checklist-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; cursor: pointer; }\r\n.checklist-row:last-child { border-bottom: none; }\r\n.checklist-row.done { opacity: .55; }\r\n.checklist-row .ck-text { text-decoration: none; }\r\n.checklist-row.done .ck-text { text-decoration: line-through; }\r\n.action-center { display: flex; flex-direction: column; gap: 8px; }\r\n.action-btn {\r\n\tdisplay: flex; align-items: center; gap: 10px; width: 100%; text-align: left;\r\n\tbackground: var(--bg); border: 1px solid var(--border); padding: 10px 12px;\r\n\tborder-radius: 9px; cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text);\r\n\ttransition: all .15s;\r\n}\r\n.action-btn:hover { border-color: var(--primary); background: var(--primary-soft); }\r\n.action-btn .ab-icon { font-size: 16px; }\r\n.activity-item { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }\r\n.activity-item:last-child { border-bottom: none; }\r\n.activity-item .at-time { color: var(--muted); font-size: 11px; white-space: nowrap; }\r\n\r\n/* ── Dropzone ── */\r\n.dropzone {\r\n\tborder: 2px dashed var(--border2); border-radius: 14px; padding: 30px 20px;\r\n\ttext-align: center; cursor: pointer; margin-bottom: 16px; background: var(--bg2);\r\n\ttransition: all .15s;\r\n}\r\n.dropzone:hover { border-color: var(--primary); background: var(- .est { background: var(--amber-soft); color: var(--amber); border-color: transparent; }\r\n.badge.ok { background: var(--green-soft); color: var(--green); border-color: transparent; }\r\n.badge.warn { background: var(--amber-soft); color: var(--amber); border-color: transparent; }\r\n[data-theme=\"dark\"] .badge.src-ai { background: #2a2150; }\r\n[data-theme=\"dark\"] .badge.src-csv { background: #0e2e44; }\r\n\r\n/* ── Chips row (ledger totals) ── */\r\n.chips-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }\r\n.chip-stat {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); border-radius: 9px;\r\n\tpadding: 8px 14px; font-size: 12.5px; font-weight: 700;\r\n}\r\n.chip-stat span { color: var(--muted); font-weight: 600; margin-right: 4px; }\r\n.chip-stat.inc { color: var(--green); }\r\n.chip-stat.exp { color: var(--accent); }\r\n.chip-stat.net { color: var(--primary); }\r\n\r\n/* ── Expense finder ── */\r\n.finder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\r\n@media (max-width: 900px) { .finder-grid { grid-template-columns: 1fr; } }\r\n.question-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }\r\n.question-card .qc-q { font-weight: 700; margin-bottom: 6px; }\r\n.question-card .qc-hint { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }\r\n.suggestion-card {\r\n\tborder: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px;\r\n\tborder-left: 4px solid var(--primary);\r\n}\r\n.suggestion-card.accepted { opacity: .6; border-left-color: var(--green); }\r\n.suggestion-card.dismissed { display: none; }\r\n.suggestion-card .sc-name { font-weight: 800; font-size: 13.5px; }\r\n.suggestion-card .sc-meta { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; align-items: center; }\r\n.suggestion-card .sc-reason { color: var(--muted); font-size: 12px; margin-top: 6px; }\r\n.suggestion-card .sc-evidence { font-size: 11.5px; color: var(--amber); margin-top: 4px; }\r\n.suggestion-card .sc-actions { display: flex; gap: 8px; margin-top: 10px; }\r\n\r\n/* ── GST ── */\r\n.adjust-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 14px 16px; }\r\n.field { display: flex; flex-direction: column; gap: 5px; }\r\n.field > span { font-size: 11.5px; font-weight: 700; color: var(--muted); }\r\n.form-stack { display: flex; flex-direction: column; gap: 12px; }\r\n.form-input {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); color: var(--text);\r\n\tborder-radius: 8px; padding: 8px 11px; font-size: 13px; font-family: inherit;\r\n\toutline: none; width: 100%;\r\n}\r\n.form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }\r\n.form-inline { width: auto; }\r\n.form-input, select.form-input, input.form-input { max-width: 100%; }\r\nselect.form-input { cursor: pointer; }\r\ntextarea.form-input { resize: vertical; min-height: 70px; }\r\n\r\n/* ── Entity cards ── */\r\n.entity-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\r\n.entity-card {\r\n\tborder: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer;\r\n\tdisplay: flex; flex-direction: column; gap: 2px; background: var(--bg2);\r\n}\r\n.entity-card input { accent-color: var(--primary); }\r\n.entity-card:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }\r\n.ec-title { font-weight: 700; font-size: 12.5px; }\r\n.ec-sub { font-size: 11px; color: var(--muted); }\r\n\r\n/* ── Chat ── */\r\n.chat-layout {\r\n\tdisplay: grid; grid-template-columns: 230px 1fr; gap: 16px; height: calc(100vh - 170px); min-height: 480px;\r\n}\r\n.chat-sessions-panel {\r\n\tbackground: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);\r\n\tdisplay: flex; flex-direction: column; overflow: hidden;\r\n}\r\n.chat-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); }\r\n.chat-sessions-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }\r\n.chat-session {\r\n\tpadding: 9px 11px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600;\r\n\tborder: 1px solid transparent; display: flex; align-items: center; gap: 6px;\r\n}\r\n.chat-session:hover { background: var(--bg); }\r\n.chat-session.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }\r\n.chat-session .cs-del { margin-left: auto; opacity: 0; }\r\n.chat-session:hover .cs-del { opacity: 1; }\r\n.chat-main { display: flex; flex-direction: column; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\r\n.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }\r\n.chat-msg { display: flex; flex-direction: column; max-width: 82%; }\r\n.chat-msg.user { align-self: flex-end; align-items: flex-end; }\r\n.chat-msg.ai { align-self: flex-start; align-items: flex-start; }\r\n.chat-bubble {\r\n\tpadding: 10px 13px; border-radius: 14px; font-size: 13px; white-space: pre-wrap;\r\n\tword-break: break-word; line-height: 1.5;\r\n}\r\n.chat-msg.user .chat-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }\r\n.chat-msg.ai .chat-bubble { background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }\r\n.chat-meta { font-size: 10.5px; color: var(--muted); margin-top: 3px; padding: 0 4px; }\r\n.chat-quick-chips { display: flex; gap: 8px; padding: 8px 14px; flex-wrap: wrap; border-top: 1px solid var(--border); }\r\n.chip {\r\n\tbackground: var(--bg); border: 1px solid var(--border); color: var(--text);\r\n\tborder-radius: 999px; padding: 5px 12px; font-size: 11.5px; font-weight: 600; cursor: pointer;\r\n}\r\n.chip:hover { border-color: var(--primary); color: var(--primary); }\r\n.chat-input-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); align-items: flex-end; }\r\n.chat-input-row textarea {\r\n\tflex: 1; resize: none; max-height: 120px;\r\n}\r\n.chat-status { font-size: 11.5px; color: var(--muted); padding: 0 16px 8px; min-height: 14px; }\r\n.typing-dots::after { content: '…'; animation: blink 1s steps(2) infinite; }\r\n@keyframes blink { 50% { opacity: .2; } }\r\n\r\n/* ── Modal ── */\r\n.modal-overlay {\r\n\tposition: fixed; inset: 0; background: rgba(10, 18, 35, .55); z-index: 100;\r\n\tdisplay: flex; align-items: center; justify-content: center; padding: 20px;\r\n}\r\n.modal {\r\n\tbackground: var(--bg2); border-radius: 14px; box-shadow: var(--shadow-lg);\r\n\twidth: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto; padding: 20px;\r\n}\r\n.modal-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; }\r\n.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }\r\n.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\r\n.form-grid .full { grid-column: 1 / -1; }\r\n\r\n/* ── Toasts ── */\r\n.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }\r\n.toast {\r\n\tbackground: #17233a; color: #fff; padding: 11px 16px; border-radius: 10px;\r\n\tfont-size: 12.5px; font-weight: 600; box-shadow: var(--shadow-lg);\r\n\tanimation: toastIn .25s ease; max-width: 360px;\r\n}\r\n.toast.success { background: #15803d; }\r\n.toast.warning { background: #b45309; }\r\n.toast.error { background: #b91c1c; }\r\n.toast.info { background: #0f766e; }\r\n@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\r\n\r\n/* ── Read-only lock ── */\r\n.is-ro .btn, .is-ro .nav-item[data-page=\"settings\"] .btn,\r\n.is-ro input, .is-ro select, .is-ro textarea, .is-ro .chip,\r\n.is-ro .action-btn, .is-ro .dropzone, .is-ro .checklist-row,\r\n.is-ro .entity-card, .is-ro .icon-btn, .is-ro .suggestion-card .sc-actions { pointer-events: none; opacity: .6; }\r\n\r\n/* ── Misc ── */\r\n.plain-list { margin: 0; padding-left: 2px; list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; }\r\n.muted { color: var(--muted); }\r\n.verif { cursor: pointer; font-size: 15px; }\r\n.verif.unverified { opacity: .35; }\r\n.link-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px; font-weight: 700; padding: 0; font-family: inherit; }\r\n.link-btn:hover { text-decoration: underline; }\r\n.doc-viewer { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-height: 50vh; overflow: auto; word-break: break-word; }\r\n\r\n/* ── Document kind areas ── */\r\n.doc-kinds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }\r\n.doc-kind-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; position: relative; transition: border-color .15s ease, transform .15s ease; }\r\n.doc-kind-card:hover { transform: translateY(-2px); border-color: var(--primary); }\r\n.doc-kind-card.active { border-color: var(--primary); background: var(--primary-soft); }\r\n.dk-icon { font-size: 1.35rem; line-height: 1; }\r\n.dk-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 7px 0 4px; }\r\n.dk-count { background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 700; }\r\n.doc-kind-card.active .dk-count { background: #fff; }\r\n.dk-guide { font-size: 12px; color: var(--muted); margin-bottom: 10px; min-height: 32px; }\r\n.badge-bank { background: #e0f2fe; color: #0369a1; border-color: transparent; }\r\n.badge-paid { background: #fef3c7; color: #b45309; border-color: transparent; }\r\n.badge-sent { background: #dcfce7; color: #15803d; border-color: transparent; }\r\n.badge-other { background: var(--bg); color: var(--muted); }\r\n.is-ro .doc-kind-card { cursor: default; }\r\n"},"js":{"name":"PersonalTaxPreparation.js","src":"../app/PersonalTaxPreparation.js","content":"/* ── MapleBooks Tax Prep · BC ──\r\n   Personal + personal-company tax preparation for a Canadian (BC) taxpayer.\r\n   Loads invoices / bank statements, extracts income & expenses with AI,\r\n   hunts for missed deductions, and prepares regular tax + GST/PST summaries.\r\n   Built for the UniconHub CMS html-tool system (window.tool SDK).\r\n────────────────────────────────────────── */\r\n\r\n/* ══ Constants ══ */\r\nvar SESSION_TYPE = 'ai-chat-sessions-uniconbaseapps';\r\nvar EXTRACT_CAP = 120000;          // chars of document text stored per file\r\nvar CHUNK_SIZE = 50000;            // chars per AI analysis prompt\r\nvar GST_RATE = 0.05;\r\nvar PST_RATE = 0.07;\r\n\r\nvar INCOME_CATEGORIES = [\r\n\t{ id: 'sales', label: 'Sales / Revenue' },\r\n\t{ id: 'services', label: 'Services Rendered' },\r\n\t{ id: 'employmentIncome', label: 'Employment Income (T4)' },\r\n\t{ id: 'interestIncome', label: 'Interest & Investment' },\r\n\t{ id: 'otherIncome', label: 'Other Income' }\r\n];\r\nvar EXPENSE_CATEGORIES = [\r\n\t{ id: 'advertising', label: 'Advertising & Marketing' },\r\n\t{ id: 'meals', label: 'Meals & Entertainment (50%)' },\r\n\t{ id: 'officeSupplies', label: 'Office Supplies' },\r\n\t{ id: 'phoneInternet', label: 'Phone & Internet' },\r\n\t{ id: 'rent', label: 'Rent' },\r\n\t{ id: 'utilities', label: 'Utilities' },\r\n\t{ id: 'vehicle', label: 'Vehicle & Fuel' },\r\n\t{ id: 'travel', label: 'Travel' },\r\n\t{ id: 'insurance', label: 'Insurance' },\r\n\t{ id: 'bankFees', label: 'Bank & Merchant Fees' },\r\n\t{ id: 'professionalFees', label: 'Professional & Legal Fees' },\r\n\t{ id: 'subcontractors', label: 'Subcontractors & Labour' },\r\n\t{ id: 'software', label: 'Software & Subscriptions' },\r\n\t{ id: 'equipment', label: 'Equipment & Tools' },\r\n\t{ id: 'homeOffice', label: 'Home Office' },\r\n\t{ id: 'interest', label: 'Interest on Debt' },\r\n\t{ id: 'training', label: 'Training & Education' },\r\n\t{ id: 'memberships', label: 'Memberships & Licences' },\r\n\t{ id: 'salaries', label: 'Salaries & Wages' },\r\n\t{ id: 'otherExpense', label: 'Other Expense' }\r\n];\r\n\r\n/* Document kinds - each kind gets its own upload area and guidance */\r\nvar DOC_KINDS = {\r\n\tbankStatement: { id: 'bank-statement', label: 'Bank statement', icon: '🏦', badgeClass: 'badge-bank', countId: 'bank', guidance: 'Every monthly bank and credit-card statement. The AI turns them into income and expense transactions.' },\r\n\tinvoicePaid: { id: 'invoice-paid', label: 'Invoice paid', icon: '🧾', badgeClass: 'badge-paid', countId: 'paid', guidance: 'Vendor bills and invoices you paid - your expense side. They become deductible expenses.' },\r\n\tinvoiceSent: { id: 'invoice-sent', label: 'Invoice sent', icon: '📄', badgeClass: 'badge-sent', countId: 'sent', guidance: 'The sales invoices you issued - your income side. They become revenue entries.' },\r\n\tother: { id: 'other', label: 'Other document', icon: '📎', badgeClass: 'badge-other', countId: 'other', guidance: 'Receipts, T4 slips, notices of assessment and anything else that supports your file.' }\r\n};\r\nfunction docKindInfo(kindId) {\r\n\tvar match = null;\r\n\tObject.keys(DOC_KINDS).forEach(function (key) { if (DOC_KINDS[key].id === kindId) match = DOC_KINDS[key]; });\r\n\treturn match || DOC_KINDS.other;\r\n}\r\nfunction normalizeDocKind(kindId) {\r\n\tif (kindId === 'bank-statement' || kindId === 'invoice-paid' || kindId === 'invoice-sent' || kindId === 'other') return kindId;\r\n\tif (kindId === 'csv') return 'bank-statement';   // legacy: bank CSVs were kind csv\r\n\treturn 'other';                                    // legacy 'document' and unknown kinds\r\n}\r\n\r\n/* Approximate 2025 BC combined (federal + provincial) marginal rates — planning only */\r\nvar BC_BRACKETS_2025 = [\r\n\t{ upTo: 47937, rate: 0.2006 },\r\n\t{ upTo: 95875, rate: 0.2270 },\r\n\t{ upTo: 110076, rate: 0.2820 },\r\n\t{ upTo: 133664, rate: 0.3100 },\r\n\t{ upTo: 181232, rate: 0.3279 },\r\n\t{ upTo: 252752, rate: 0.3829 },\r\n\t{ upTo: Infinity, rate: 0.5350 }\r\n];\r\n\r\nvar KEYWORD_MAP = [\r\n\t{ pat: /rent|lease|property tax/i, cat: 'rent' },\r\n\t{ pat: /hydro|electric|fortis|bc hydro|utilit|gas bill|heating/i, cat: 'utilities' },\r\n\t{ pat: /internet|phone|telus|rogers|shaw|bell|mobile|cell|voip/i, cat: 'phoneInternet' },\r\n\t{ pat: /insurance|icbc/i, cat: 'insurance' },\r\n\t{ pat: /petro|shell|chevron|esso|fuel|gas station|husky|co-op/i, cat: 'vehicle' },\r\n\t{ pat: /mechanic|oil change|tire|auto repair|car wash/i, cat: 'vehicle' },\r\n\t{ pat: /uber|lyft|taxi|hotel|flight|air canada|westjet|airbnb|booking|ferry/i, cat: 'travel' },\r\n\t{ pat: /restaurant|coffee|starbucks|tim hortons|mcdonald|dinner|lunch|cater|pizza|sushi/i, cat: 'meals' },\r\n\t{ pat: /advertis|facebook ads|google ads|marketing|promo|flyer|sponsor/i, cat: 'advertising' },\r\n\t{ pat: /office depot|staples|grand.?toy|printer|paper|stationery/i, cat: 'officeSupplies' },\r\n\t{ pat: /accountant|lawyer|legal|bookkeep|notary|professional fee/i, cat: 'professionalFees' },\r\n\t{ pat: /bank fee|service charge|interac|monthly fee|account fee/i, cat: 'bankFees' },\r\n\t{ pat: /microsoft|adobe|dropbox|github|slack|zoom|subscription|domain|hosting|workspace|canva|quickbooks|xero/i, cat: 'software' },\r\n\t{ pat: /subcontract|contractor|freelance|labour|labor|payroll|salary|wage/i, cat: 'subcontractors' },\r\n\t{ pat: /training|course|udemy|coursera|conference|workshop|seminar|tuition/i, cat: 'training' },\r\n\t{ pat: /membership|license|licence|dues|chamber|registration fee/i, cat: 'memberships' },\r\n\t{ pat: /interest charge|loan interest/i, cat: 'interest' },\r\n\t{ pat: /computer|monitor|laptop|keyboard|tool|hardware|equipment/i, cat: 'equipment' }\r\n];\r\n\r\n/* ══ State ══ */\r\nvar DB = null;\r\nvar CHAT = { messages: [], activeSessionId: '' };\r\nvar _sessions = [];\r\nvar _sessionsError = false;\r\nvar _sessionsLoaded = false;\r\nvar _activeSessionId = '';\r\nvar isReadOnly = false;\r\nvar aiBusy = false;\r\nvar _lastRendered = '';\r\nvar _lastPersistAt = 0;\r\n\r\n/* ══ Helpers ══ */\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction qsa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }\r\nfunction esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\r\nfunction genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }\r\nfunction nowIso() { return new Date().toISOString(); }\r\nfunction money(n) {\r\n\ttry { return new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' }).format(n || 0); }\r\n\tcatch (e) { return '$' + (n || 0).toFixed(2); }\r\n}\r\nfunction num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }\r\nfunction numOrNull(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }\r\nfunction yearOf(d) { var y = parseInt(String(d || '').slice(0, 4), 10); return isNaN(y) ? 0 : y; }\r\nfunction fmtDate(d) {\r\n\tif (!d) return '—';\r\n\tvar dt = new Date(d.length === 10 ? d + 'T00:00:00' : d);\r\n\tif (isNaN(dt.getTime())) return String(d);\r\n\treturn dt.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });\r\n}\r\nfunction fmtBytes(b) {\r\n\tif (!b && b !== 0) return '—';\r\n\tif (b < 1024) return b + ' B';\r\n\tif (b < 1048576) return (b / 1024).toFixed(1) + ' KB';\r\n\treturn (b / 1048576).toFixed(1) + ' MB';\r\n}\r\nfunction relTime(iso) {\r\n\tif (!iso) return '';\r\n\tvar diff = Date.now() - new Date(iso).getTime();\r\n\tvar m = Math.floor(diff / 60000);\r\n\tif (m < 1) return 'just now';\r\n\tif (m < 60) return m + 'm ago';\r\n\tvar h = Math.floor(m / 60);\r\n\tif (h < 24) return h + 'h ago';\r\n\tvar d = Math.floor(h / 24);\r\n\tif (d < 30) return d + 'd ago';\r\n\treturn new Date(iso).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });\r\n}\r\nfunction catLabel(id) {\r\n\tvar c = INCOME_CATEGORIES.concat(EXPENSE_CATEGORIES).find(function (x) { return x.id === id; });\r\n\treturn c ? c.label : id;\r\n}\r\nfunction validCat(id, type) {\r\n\tvar list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;\r\n\tif (list.some(function (c) { return c.id === id; })) return id;\r\n\treturn type === 'income' ? 'otherIncome' : 'otherExpense';\r\n}\r\nfunction classifyKeywords(desc) {\r\n\tvar d = String(desc || '');\r\n\tfor (var i = 0; i < KEYWORD_MAP.length; i++) {\r\n\t\tif (KEYWORD_MAP[i].pat.test(d)) return KEYWORD_MAP[i].cat;\r\n\t}\r\n\treturn '';\r\n}\r\nfunction parseJsonAI(text) {\r\n\tif (!text) return null;\r\n\tvar t = String(text).trim();\r\n\tvar m = t.match(/```(?:json)?\\s*([\\s\\S]*?)```/i);\r\n\tif (m) t = m[1].trim();\r\n\tvar s = t.indexOf('{');\r\n\tvar e = t.lastIndexOf('}');\r\n\tif (s > -1 && e > s) t = t.slice(s, e + 1);\r\n\ttry { return JSON.parse(t); } catch (err) { return null; }\r\n}\r\nfunction chunkText(text, size) {\r\n\tvar lines = String(text || '').split(/\\r?\\n/);\r\n\tvar chunks = [];\r\n\tvar cur = '';\r\n\tfor (var i = 0; i < lines.length; i++) {\r\n\t\tif (cur.length + lines[i].length + 1 > size && cur) { chunks.push(cur); cur = ''; }\r\n\t\tcur += lines[i] + '\\n';\r\n\t}\r\n\tif (cur.trim()) chunks.push(cur);\r\n\treturn chunks.length ? chunks : [''];\r\n}\r\nfunction toast(message, severity) {\r\n\tseverity = severity || 'info';\r\n\tvar c = el('toast-container');\r\n\tif (!c) return;\r\n\tvar t = document.createElement('div');\r\n\tt.className = 'toast ' + severity;\r\n\tt.textContent = message;\r\n\tc.appendChild(t);\r\n\tsetTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 300); }, 3200);\r\n}\r\nfunction notify(msg, sev) {\r\n\ttoast(msg, sev);\r\n\tif (typeof tool.notify === 'function') { try { tool.notify(msg, sev); } catch (e) {} }\r\n}\r\nfunction setStatus(id, text) { var n = el(id); if (n) n.textContent = text || ''; }\r\n\r\n/* ══ DB lifecycle ══ */\r\nfunction freshDB() {\r\n\tvar ty = parseInt(tool.param('taxYear', '2025'), 10);\r\n\tif (isNaN(ty)) ty = 2025;\r\n\treturn {\r\n\t\tversion: '1.0.0',\r\n\t\t_instanceId: '',\r\n\t\t_parentRecordId: '',\r\n\t\tprofile: {\r\n\t\t\tentityType: 'soleProp', businessName: '', taxYear: ty, fiscalYearEnd: '12-31',\r\n\t\t\tgstRegistered: 'yes', gstNumber: '', gstFrequency: 'annual', pstRegistered: 'no',\r\n\t\t\tindustry: 'consulting', employmentIncome: 0, otherIncome: 0,\r\n\t\t\taccountantEmail: tool.param('accountantEmail', '') || ''\r\n\t\t},\r\n\t\tdocs: [], transactions: [], checklist: [], suggestions: [], questions: [], activity: [],\r\n\t\tgstAdj: { debits: 0, credits: 0 },\r\n\t\tchatMessages: [], activeSessionId: '',\r\n\t\t_theme: 'light'\r\n\t};\r\n}\r\nfunction normalizeDB(val) {\r\n\tvar d = val && typeof val === 'object' ? val : {};\r\n\tvar fresh = freshDB();\r\n\tvar db = fresh;\r\n\tif (d.version) db.version = d.version;\r\n\tif (d._instanceId) db._instanceId = d._instanceId;\r\n\tif (d._parentRecordId) db._parentRecordId = d._parentRecordId;\r\n\tdb.profile = Object.assign({}, fresh.profile, d.profile || {});\r\n\tdb.profile.taxYear = parseInt(db.profile.taxYear, 10) || fresh.profile.taxYear;\r\n\tdb.gstAdj = Object.assign({}, fresh.gstAdj, d.gstAdj || {});\r\n\tdb.docs = Array.isArray(d.docs) ? d.docs : [];\r\n\tdb.docs.forEach(function (doc) { doc.kind = normalizeDocKind(doc.kind); });\r\n\tdb.transactions = Array.isArray(d.transactions) ? d.transactions : [];\r\n\tdb.checklist = Array.isArray(d.checklist) ? d.checklist : [];\r\n\tdb.suggestions = Array.isArray(d.suggestions) ? d.suggestions : [];\r\n\tdb.questions = Array.isArray(d.questions) ? d.questions : [];\r\n\tdb.activity = Array.isArray(d.activity) ? d.activity : [];\r\n\tdb.chatMessages = Array.isArray(d.chatMessages) ? d.chatMessages : [];\r\n\tdb.activeSessionId = d.activeSessionId || '';\r\n\tdb._theme = d._theme || 'light';\r\n\treturn db;\r\n}\r\nfunction persist() {\r\n\tDB._lastSavedAt = Date.now();\r\n\ttry { tool.setValue(DB); } catch (e) {}\r\n\t_lastRendered = JSON.stringify(DB);\r\n\tvar s = el('topbar-save');\r\n\tif (s) { s.textContent = '✓ Saved ' + new Date().toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }); }\r\n\ttry { tool.resize(); } catch (e) {}\r\n}\r\nfunction pushActivity(type, text) {\r\n\tDB.activity.unshift({ t: nowIso(), type: type || 'info', text: text });\r\n\tif (DB.activity.length > 60) DB.activity.length = 60;\r\n}\r\n\r\n/* ══ Checklist ══ */\r\nfunction defaultChecklist() {\r\n\treturn [\r\n\t\t{ id: 'ck-bank', label: 'All 12 months of bank & credit-card statements', done: false, source: 'system' },\r\n\t\t{ id: 'ck-invoices', label: 'All sales invoices issued during the year', done: false, source: 'system' },\r\n\t\t{ id: 'ck-receipts', label: 'Expense receipts & vendor bills', done: false, source: 'system' },\r\n\t\t{ id: 'ck-t4', label: 'T4 / T4A / T5 slips (personal income)', done: false, source: 'system' },\r\n\t\t{ id: 'ck-gst-prior', label: 'Prior-year GST return + notice of assessment', done: false, source: 'system' },\r\n\t\t{ id: 'ck-assets', label: 'List of equipment & asset purchases (CCA)', done: false, source: 'system' },\r\n\t\t{ id: 'ck-vehicle', label: 'Vehicle logbook — business km', done: false, source: 'system' },\r\n\t\t{ id: 'ck-homeoffice', label: 'Home-office details (area & expenses)', done: false, source: 'system' },\r\n\t\t{ id: 'ck-review', label: 'Review every AI-classified transaction', done: false, source: 'system' },\r\n\t\t{ id: 'ck-accountant', label: 'Send package to accountant / verify figures', done: false, source: 'system' }\r\n\t];\r\n}\r\nfunction ensureChecklist() {\r\n\tif (!DB.checklist.length) DB.checklist = defaultChecklist();\r\n\telse {\r\n\t\tdefaultChecklist().forEach(function (c) {\r\n\t\t\tif (!DB.checklist.some(function (x) { return x.id === c.id; })) DB.checklist.push(c);\r\n\t\t});\r\n\t}\r\n}\r\nfunction addChecklistItem(item) {\r\n\tvar label = String(item.label || '').slice(0, 140);\r\n\tif (!label) return;\r\n\tif (DB.checklist.some(function (c) { return c.label === label; })) return;\r\n\tDB.checklist.push({ id: genId(), label: label, done: false, source: item.source || 'ai' });\r\n}\r\nfunction toggleChecklist(id) {\r\n\tif (isReadOnly) return;\r\n\tvar c = DB.checklist.find(function (x) { return x.id === id; });\r\n\tif (!c) return;\r\n\tc.done = !c.done;\r\n\tif (c.done) pushActivity('check', '✓ ' + c.label);\r\n\tpersist(); refreshAll();\r\n}\r\n\r\n/* ══ Instance ID (session isolation) ══ */\r\nfunction resolveInstanceId() {\r\n\tif (DB._instanceId && DB._instanceId.length > 20) return DB._instanceId;\r\n\tvar parentRecordId = '';\r\n\ttry {\r\n\t\tvar q = window.location.search || '';\r\n\t\tvar m = q.match(/[?&](objectId|recordId)=([^&?#]+)/);\r\n\t\tif (m) parentRecordId = decodeURIComponent(m[2]);\r\n\t} catch (e) {}\r\n\tif (!parentRecordId) {\r\n\t\ttry { parentRecordId = String(tool.param('objectId', '') || tool.param('recordId', '')); } catch (e) {}\r\n\t}\r\n\tif (!parentRecordId) {\r\n\t\ttry {\r\n\t\t\tvar fields = tool.getFields();\r\n\t\t\tif (fields && (fields._id || fields.id)) parentRecordId = String(fields._id || fields.id);\r\n\t\t} catch (e) {}\r\n\t}\r\n\tvar suffix = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);\r\n\tDB._instanceId = parentRecordId ? 'rec_' + parentRecordId + '_' + suffix : 'inst_' + suffix;\r\n\treturn DB._instanceId;\r\n}\r\n\r\n/* ══ AI chat session CRUD ══ */\r\nfunction loadSessions(cb) {\r\n\tif (typeof tool.requestObjects !== 'function') { _se   try {
    codePayload = JSON.parse(document.getElementById('code-payload').textContent) || codePayload;
  } catch (error) { /* payload unavailable */ }

  /* ---- screenshots viewer ---- */
  var shotsView = document.getElementById('docs-shots-view');
  var shotsViewer = document.getElementById('docs-shots-viewer');
  var shotsImg = document.getElementById('docs-shots-img');
  var shotsEmpty = document.getElementById('docs-shots-empty');
  var shotsInfo = document.getElementById('docs-shots-info');
  var shotsThumbs = document.getElementById('docs-shots-thumbs');
  var shotsPrev = document.getElementById('docs-shots-prev');
  var shotsNext = document.getElementById('docs-shots-next');
  var shotsPayload = [];
  try {
    shotsPayload = JSON.parse(document.getElementById('shots-payload').textContent) || [];
  } catch (error) { /* payload unavailable */ }
  var currentShotIndex = 0;

  function renderShotsInfo(shot) {
    if (!shotsInfo) return;
    if (!shot) { shotsInfo.innerHTML = ''; return; }
    var fields = [
      ['File', shot.name || ''],
      ['Shot', shot.label || ''],
      ['Page', shot.page || ''],
      ['Viewport', shot.viewport || ''],
      ['Dimensions', shot.width && shot.height ? shot.width + ' \u00d7 ' + shot.height + ' px' : ''],
      ['Captured', shot.capturedAt ? shot.capturedAt.replace('T', ' ').slice(0, 19) + ' UTC' : ''],
      ['Used in', Array.isArray(shot.usedIn) && shot.usedIn.length ? shot.usedIn.join(', ') : 'docs index viewer'],
    ];
    shotsInfo.innerHTML = '<p class="docs-shots-counter">Screenshot ' + (currentShotIndex + 1) + ' of ' + shotsPayload.length + '</p>' +
      '<dl>' + fields.filter(function (field) { return field[1]; })
        .map(function (field) { return '<div><dt>' + field[0] + '</dt><dd>' + field[1] + '</dd></div>'; })
        .join('') + '</dl>';
  }

  function showShot(index) {
    if (!shotsPayload.length) {
      if (shotsImg) shotsImg.style.display = 'none';
      if (shotsEmpty) shotsEmpty.style.display = '';
      if (shotsPrev) shotsPrev.style.display = 'none';
      if (shotsNext) shotsNext.style.display = 'none';
      if (shotsThumbs) shotsThumbs.style.display = 'none';
      renderShotsInfo(null);
      return;
    }
    currentShotIndex = ((index % shotsPayload.length) + shotsPayload.length) % shotsPayload.length;
    var shot = shotsPayload[currentShotIndex];
    if (shotsImg) {
      shotsImg.style.display = '';
      shotsImg.src = shot.src;
    }
    if (shotsEmpty) shotsEmpty.style.display = 'none';
    if (shotsPrev) shotsPrev.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsNext) shotsNext.style.display = shotsPayload.length > 1 ? '' : 'none';
    if (shotsThumbs) {
      shotsThumbs.innerHTML = shotsPayload.map(function (entry, i) {
        return '<button class="docs-shots-thumb' + (i === currentShotIndex ? ' active' : '') + '" type="button" data-shot-index="' + i + '">' +
          '<img src="' + entry.src + '" alt="' + (entry.label || entry.name) + '" loading="lazy" />' +
          '<span>' + (entry.label || entry.name) + '</span></button>';
      }).join('');
    }
    renderShotsInfo(shot);
  }

  function openShotsPane() {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.add('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    showShot(currentShotIndex);
  }

  if (shotsThumbs) {
    shotsThumbs.addEventListener('click', function (event) {
      var thumb = event.target.closest ? event.target.closest('.docs-shots-thumb') : null;
      if (!thumb) return;
      showShot(Number(thumb.getAttribute('data-shot-index')) || 0);
    });
  }
  if (shotsPrev) shotsPrev.addEventListener('click', function () { showShot(currentShotIndex - 1); });
  if (shotsNext) shotsNext.addEventListener('click', function () { showShot(currentShotIndex + 1); });
  document.addEventListener('keydown', function (event) {
    if (!shotsView.classList.contains('visible')) return;
    if (event.key === 'ArrowLeft') showShot(currentShotIndex - 1);
    if (event.key === 'ArrowRight') showShot(currentShotIndex + 1);
    if (event.key === 'Escape') { shotsView.classList.remove('visible'); frame.style.display = ''; if (openButton) openButton.style.display = ''; }
  });

  function activateItem(activeItem) {
    navItems.forEach(function (item) { item.classList.toggle('active', item === activeItem); });
  }

  function showCodePane(kind) {
    var entry = codePayload[kind];
    currentCodeKind = kind;
    codeView.classList.add('visible');
    shotsView.classList.remove('visible');
    frame.style.display = 'none';
    if (openButton) openButton.style.display = 'none';
    if (!entry) {
      codeTitle.textContent = kind.toUpperCase() + ' code';
      codeMeta.textContent = 'no ' + kind + ' file in the app folder';
      codeElement.textContent = '';
      return;
    }
    codeTitle.textContent = entry.name;
    var lineCount = entry.content ? entry.content.split('\n').length : 0;
    codeMeta.textContent = lineCount + ' lines - ' + (entry.content ? entry.content.length : 0) + ' characters';
    codeElement.textContent = entry.content || '';
    codeView.scrollTop = 0;
  }

  function showDocumentPane(item) {
    currentCodeKind = '';
    codeView.classList.remove('visible');
    shotsView.classList.remove('visible');
    frame.style.display = '';
    if (openButton) openButton.style.display = '';
    currentSource = item.getAttribute('data-src');
    frame.src = currentSource;
  }

  function openItem(item) {
    if (!item) return;
    activateItem(item);
    if (item.getAttribute('data-doc') === 'screenshots') {
      openShotsPane();
    } else if (item.getAttribute('data-doc').indexOf('code-') === 0) {
      showCodePane(item.getAttribute('data-doc').slice(5));
    } else {
      showDocumentPane(item);
    }
    try { window.location.hash = 'doc=' + item.getAttribute('data-doc'); } catch (error) { /* ignore */ }
  }

  navItems.forEach(function (item) {
    item.addEventListener('click', function () { openItem(item); });
  });

  if (openButton) {
    openButton.addEventListener('click', function () {
      var fullUrl = new URL(currentSource, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  if (codeCopyButton) {
    codeCopyButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      var text = entry && entry.content ? entry.content : '';
      if (!text) return;
      function markCopied() {
        codeCopyButton.textContent = 'Copied ✓';
        codeCopyButton.classList.add('copied');
        setTimeout(function () {
          codeCopyButton.textContent = 'Copy code';
          codeCopyButton.classList.remove('copied');
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function () { fallbackCopy(text, markCopied); });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  }

  if (codeOpenButton) {
    codeOpenButton.addEventListener('click', function () {
      var entry = codePayload[currentCodeKind];
      if (!entry || !entry.src) return;
      var fullUrl = new URL(entry.src, window.location.href).href;
      try { window.open(fullUrl, '_blank'); } catch (error) { /* blocked */ }
    });
  }

  function fallbackCopy(text, markCopied) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (error) { /* copying unavailable */ }
    document.body.removeChild(textArea);
    markCopied();
  }

  // ?doc= or #doc= shortcut opens that document on load
  try {
    var requestedDoc = new URLSearchParams(window.location.search).get('doc')
      || window.location.hash.replace(/^#doc=/, '');
    if (requestedDoc) {
      var requestedItem = navItems.find(function (item) { return item.getAttribute('data-doc') === requestedDoc; });
      if (requestedItem) openItem(requestedItem);
    }
  } catch (error) { /* ignore */ }
})();
</script>
</body>
</html>
