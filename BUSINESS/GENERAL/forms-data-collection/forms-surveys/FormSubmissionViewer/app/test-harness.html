<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormSubmissionViewer - Test Harness</title>
<link rel="stylesheet" href="FormSubmissionViewer.css">
<style>
	html, body { margin: 0; padding: 0; background: #eef2f7; }
	body { padding-top: 44px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
	#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 14px; background: #0f172a; color: #e6edf5; font-size: 11px; }
	#th-bar strong { color: #2dd4bf; letter-spacing: 0.5px; }
	#th-bar .sep { color: #475569; }
	#th-bar .hint { color: #94a3b8; font-size: 10px; }
	#th-bar select { font-size: 11px; padding: 3px 5px; border: 1px solid #334155; border-radius: 4px; background: #1e293b; color: #e6edf5; }
	#th-bar button { border: none; border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 600; cursor: pointer; }
	#th-bar button.th-btn-a { background: #0d9488; color: #fff; }
	#th-bar button.th-btn-b { background: #334155; color: #e6edf5; }
	#th-bar label { display: inline-flex; align-items: center; gap: 4px; color: #cbd5e1; font-size: 10px; }
	#th-status { color: #2dd4bf; font-size: 10px; }
	#th-log { position: fixed; right: 12px; bottom: 12px; z-index: 9999; width: 320px; max-height: 200px; overflow: auto; padding: 8px 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.94); color: #e2e8f0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; line-height: 1.5; }
	#th-log p { margin: 0 0 2px; }
	#app-container { padding: 0; }
	@media (max-width: 760px) {
		body { padding-top: 96px; }
	}
</style>
</head>

<div id="th-bar">
	<strong>HARNESS - FormSubmissionViewer</strong><span class="sep">|</span>
	<span class="hint">Record:</span>
	<select id="th-record">
		<option value="trial-exam">Full trial exam record</option>
		<option value="trial-exam-no-consent">Trial exam, no phone, no consent</option>
		<option value="career-fair">Career fair entry</option>
		<option value="contact-message">Contact message with a long answer</option>
		<option value="volunteer-application">Volunteer application</option>
		<option value="unknown-keys">Three unknown keys</option>
		<option value="empty-record">Record with no answers</option>
		<option value="no-record">No record (empty mount)</option>
	</select>
	<span class="hint">User:</span>
	<select id="th-user">
		<option value="u-viewer">Viewer (read-only)</option>
		<option value="u-editor">Editor</option>
	</select>
	<label><input type="checkbox" id="th-mask"> maskContactDetails = yes</label>
	<button class="th-btn-a" id="th-refire">Fire onFieldsChange (same record)</button>
	<button class="th-btn-b" id="th-reinit">Re-run onReady</button>
	<span class="sep">|</span>
	<span id="th-status">Loading...</span>
</div>

<div id="app-container"></div>
<div id="th-log"></div>

<script>
/* ─────────────────────────────────────────────────────────────────────
   Mock window.tool SDK - installed BEFORE the tool script loads.
   ───────────────────────────────────────────────────────────────────── */
(function () {
	var STORAGE_KEY = 'fsv_harness_value';
	var query = new URLSearchParams(window.location.search);
	var params = {
		formTypeLabels: JSON.stringify({
			'2026-11-07-vancouver-cemc-trial-exam-registration': 'CEMC Trial Exam',
			'career-fair-entry': 'Career Fair Entry',
			'contact-message': 'Contact Message',
			'volunteer-application': 'Volunteer Application',
			'unknown-keys-demo': 'Field Test Submission'
		}),
		timeZone: 'UTC'
	};
	var users = {
		'u-viewer': { id: 'u-viewer', name: 'Vera Viewer', email: 'vera@example.org', roles: ['viewer'], effectiveAccess: { isViewer: true, isEditor: false, isManager: false } },
		'u-editor': { id: 'u-editor', name: 'Eddie Editor', email: 'eddie@example.org', roles: ['viewer', 'editor'], effectiveAccess: { isViewer: true, isEditor: true, isManager: false } }
	};
	var state = {
		recordKey: query.get('record') || 'trial-exam',
		userId: query.get('role') === 'editor' ? 'u-editor' : (query.get('role') === 'viewer' ? 'u-viewer' : (localStorage.getItem(STORAGE_KEY + '_user') || 'u-viewer')),
		value: null,
		readyCallback: null,
		fieldsChangeListeners: [],
		valueChangeListeners: [],
		userChangeListeners: [],
		readonlyListeners: [],
		readOnly: false
	};
	if (query.get('mask') === 'yes') { params.maskContactDetails = 'yes'; }
	if (query.get('mask') === 'no') { params.maskContactDetails = 'no'; }
	if (query.get('mask')) { localStorage.removeItem(STORAGE_KEY); }

	try {
		var storedValue = localStorage.getItem(STORAGE_KEY);
		state.value = storedValue ? JSON.parse(storedValue) : null;
	} catch (error) { state.value = null; }

	function logLine(message) {
		var log = document.getElementById('th-log');
		if (!log) { return; }
		var line = document.createElement('p');
		line.textContent = new Date().toISOString().slice(11, 19) + '  ' + message;
		log.appendChild(line);
		log.scrollTop = log.scrollHeight;
	}

	function records() { return window.FSV_RECORDS || {}; }

	function currentFields() {
		var record = records()[state.recordKey];
		if (!record || !record.fields) { return null; }
		return JSON.parse(JSON.stringify(record.fields));
	}

	window.thLog = logLine;
	window.thCurrentFields = currentFields;
	window.thRecordKey = function () { return state.recordKey; };

	window.tool = {
		onReady: function (callback) {
			state.readyCallback = callback;
			window.setTimeout(function () {
				callback(state.value, currentFields());
			}, 0);
		},
		getValue: function () { return state.value; },
		setValue: function (nextValue) {
			state.value = nextValue;
			try { localStorage.setItem(STORAGE_KEY, JSON.stringify(nextValue)); } catch (error) { }
			state.valueChangeListeners.forEach(function (listener) { try { listener(nextValue); } catch (error) { } });
		},
		onValueChange: function (listener) { state.valueChangeListeners.push(listener); },
		getFields: function () { return currentFields(); },
		onFieldsChange: function (listener) { state.fieldsChangeListeners.push(listener); },
		watchField: function () { },
		setField: function () { logLine('setField called (the viewer never writes)'); },
		setFields: function () { logLine('setFields called (the viewer never writes)'); },
		param: function (name, fallback) {
			if (params[name] !== undefined && params[name] !== null) { return params[name]; }
			return fallback;
		},
		isReadOnly: function () { return state.readOnly; },
		onReadonlyChange: function (listener) { state.readonlyListeners.push(listener); },
		getUser: function () { return users[state.userId] || null; },
		onUserChange: function (listener) { state.userChangeListeners.push(listener); },
		getPermittedUsers: function () { return [users['u-viewer'], users['u-editor']]; },
		reportValid: function () { },
		notify: function (message, severity) {
			logLine('notify(' + (severity || 'info') + '): ' + message);
		},
		resize: function () { },
		declareOutput: function () { },
		declareParams: function (list) {
			logLine('declareParams: ' + (Array.isArray(list) ? list.length : 0) + ' parameter(s) declared');
		},
		reportMissingParams: function () { },
		openUrl: function (url) { logLine('openUrl: ' + url); },
		requestExportPdf: function (options, callback) {
			var htmlLength = options && options.html ? options.html.length : 0;
			logLine('requestExportPdf: html ' + htmlLength + ' chars, filename ' + (options ? options.filename : '') +
				', landscape ' + (options ? Boolean(options.landscape) : false));
			window.setTimeout(function () {
				callback(null, {
					name: 'export.html',
					url: 'https://example.invalid/mock-print-document.html',
					size: htmlLength,
					type: 'text/html'
				});
			}, 30);
		},
		_tools: {
			records: records,
			currentFields: currentFields,
			selectRecord: function (key) {
				state.recordKey = key;
				var fields = currentFields();
				state.fieldsChangeListeners.forEach(function (listener) { try { listener(fields); } catch (error) { } });
				return fields;
			},
			refireFieldsChange: function () {
				var fields = currentFields();
				state.fieldsChangeListeners.forEach(function (listener) { try { listener(fields); } catch (error) { } });
			},
			selectUser: function (userId) {
				state.userId = userId;
				try { localStorage.setItem(STORAGE_KEY + '_user', userId); } catch (error) { }
				state.userChangeListeners.forEach(function (listener) { try { listener(users[userId]); } catch (error) { } });
			},
			runReadyAgain: function () {
				if (state.readyCallback) { state.readyCallback(state.value, currentFields()); }
			}
		}
	};
})();
</script>

<script>
/* ─────────────────────────────────────────────────────────────────────
   Loader: live HTML when served, embedded copy for file://, and an
   inline-JS mode (?inlinejs=1) that reproduces the CMS tokenisation.
   ───────────────────────────────────────────────────────────────────── */
(function () {
	var status = document.getElementById('th-status');
	var container = document.getElementById('app-container');
	var inlineMode = /[?&]inlinejs=1/.test(window.location.search);
	var EMBEDDED_HTML = '<div class="fsv" id="fsv-root"><div class="fsv-wrap"><p class="fsv-warning" id="fsv-param-warning" hidden></p><div class="fsv-host" id="fsv-host"></div><p class="fsv-build" id="fsv-build-badge">tool build</p></div></div><noscript><p class="fsv-noscript">This viewer needs JavaScript. Enable it to read the submission.</p></noscript>';

	function loadExternalJS() {
		var script = document.createElement('script');
		script.src = 'FormSubmissionViewer.js';
		script.onload = function () { status.textContent = 'ready (external js)'; };
		script.onerror = function () { status.textContent = 'JS FAILED - check the console'; };
		document.body.appendChild(script);
	}

	function loadInlineJS() {
		window.fetch('FormSubmissionViewer.js')
			.then(function (response) {
				if (!response.ok) { throw new Error('HTTP ' + response.status); }
				return response.text();
			})
			.then(function (code) {
				var script = document.createElement('script');
				script.textContent = code;
				document.body.appendChild(script);
				status.textContent = 'ready (inline js)';
			})
			.catch(function () {
				status.textContent = 'inline fetch failed - external js';
				loadExternalJS();
			});
	}

	function inject(html) {
		container.innerHTML = html;
		if (inlineMode) { loadInlineJS(); } else { loadExternalJS(); }
	}

	var fallbackTimer = window.setTimeout(function () {
		inject(EMBEDDED_HTML);
	}, 1200);

	window.fetch('FormSubmissionViewer.html')
		.then(function (response) {
			if (!response.ok) { throw new Error('HTTP ' + response.status); }
			return response.text();
		})
		.then(function (html) {
			window.clearTimeout(fallbackTimer);
			inject(html);
		})
		.catch(function () { /* the fallback timer injects the embedded copy */ });
})();
</script>

<script>
/* ─────────────────────────────────────────────────────────────────────
   Harness controls.
   ───────────────────────────────────────────────────────────────────── */
(function () {
	var recordSelect = document.getElementById('th-record');
	var userSelect = document.getElementById('th-user');
	var maskCheckbox = document.getElementById('th-mask');
	var status = document.getElementById('th-status');

	recordSelect.value = window.tool._tools ? (new URLSearchParams(window.location.search).get('record') || 'trial-exam') : 'trial-exam';
	if (window.localStorage.getItem('fsv_harness_value_user') === 'u-editor') { userSelect.value = 'u-editor'; }

	recordSelect.addEventListener('change', function () {
		var fields = window.tool._tools.selectRecord(recordSelect.value);
		window.thLog('record switched to ' + recordSelect.value + (fields ? ' (answers re-rendered)' : ' (no record)'));
		status.textContent = 'record: ' + recordSelect.value;
	});

	userSelect.addEventListener('change', function () {
		window.tool._tools.selectUser(userSelect.value);
		window.thLog('role switched to ' + userSelect.value);
	});

	maskCheckbox.addEventListener('change', function () {
		var current = window.thRecordKey();
		var maskValue = maskCheckbox.checked ? 'yes' : 'no';
		var roleValue = userSelect.value === 'u-editor' ? 'editor' : 'viewer';
		window.location.search = '?record=' + encodeURIComponent(current) + '&mask=' + maskValue + '&role=' + roleValue;
	});

	document.getElementById('th-refire').addEventListener('click', function () {
		window.tool._tools.refireFieldsChange();
		window.thLog('onFieldsChange fired again with the same record');
	});

	document.getElementById('th-reinit').addEventListener('click', function () {
		window.tool._tools.runReadyAgain();
		window.thLog('onReady ran again');
	});

	if (new URLSearchParams(window.location.search).get('mask') === 'yes') { maskCheckbox.checked = true; }
	status.textContent = 'record: ' + recordSelect.value;
})();
</script>
