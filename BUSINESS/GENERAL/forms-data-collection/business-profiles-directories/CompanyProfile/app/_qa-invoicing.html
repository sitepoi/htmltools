<script>
/* ── Mock tool SDK ── */
(function() {
  var STORAGE_KEY = 'company_profile_test_db';
  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [] };
  var _readOnly = false, _user = null, _fields = {}, _value = null;
  // ?noupload=1 hides requestUpload so the URL fallback can be tested.
  var _uploadDisabled = (new URLSearchParams(window.location.search)).get('noupload') === '1';

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch(e) { _value = null; }
  }
  function save(v) { _value = v; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch(e) {} }

  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { save(data); listeners.valueChange.forEach(function(cb) { try { cb(data); } catch(e) {} }); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },
    getFields: function() { return Object.assign({}, _fields); },
    setField: function(id, value) { _fields[id] = value; },
    setFields: function(obj) { Object.assign(_fields, obj); },
    watchField: function(id, cb) { listeners.fieldsChange.push(cb); },
    onFieldsChange: function(cb) { listeners.fieldsChange.push(cb); },
    param: function(name, fallback) {
      var p = (new URLSearchParams(window.location.search)).get(name);
      if (!p || p === '') {
        // Check the sections filter dropdown
        var sel = document.getElementById('th-sections-filter');
        if (sel && name === 'visibleSections') {
          return sel.value;
        }
      }
      return p !== null && p !== '' ? p : fallback;
    },
    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    _setReadOnly: function(v) { _readOnly = v; listeners.readonlyChange.forEach(function(cb) { try { cb(v); } catch(e) {} }); },
    getUser: function() { return _user; },
    onUserChange: function(cb) { listeners.userChange.push(cb); },
    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#3b82f6', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 2500);
    },
    resize: function() {},
    declareOutput: function() {},
    declareParams: function() {},
    onReady: function(cb) { load(); cb(_value, _fields); },
    _loadSampleData: function(data) { save(data); window.location.reload(); },
    _clearData: function() { localStorage.removeItem(STORAGE_KEY); window.location.reload(); },
    _toggleReadOnly: function() { this._setReadOnly(!_readOnly); },
    _dump: function() { console.log('DB:', JSON.parse(JSON.stringify(_value))); }
  };

  if (!_uploadDisabled) {
    window.tool.requestUpload = function(accept, callback) {
      var picker = document.createElement('input');
      picker.type = 'file';
      picker.accept = accept || '';
      picker.style.display = 'none';
      document.body.appendChild(picker);
      picker.addEventListener('change', function() {
        var selectedFile = picker.files && picker.files[0];
        picker.remove();
        if (!selectedFile) { callback('No file selected'); return; }
        callback(null, {
          name: selectedFile.name,
          url: URL.createObjectURL(selectedFile),
          size: selectedFile.size,
          type: selectedFile.type
        });
      });
      picker.click();
    };
  }

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); window.tool._toggleReadOnly(); window.tool.notify(window.tool.isReadOnly() ? 'READ-ONLY MODE' : 'EDIT MODE', 'info'); }
    if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault(); window.tool._dump(); window.tool.notify('Database dumped to console', 'info'); }
  });
})();
</script>

		</div>
	</header>

			</div>

		</aside>

		<main class="cp-main" id="cp-main">

			<!-- BASIC INFORMATION -->

					<div class="cp-section-title-group">

						<p class="cp-section-desc">Core company identity and classification</p>
					</div>
					<div class="cp-section-toggle">▾</div>
				</div>
				<div class="cp-section-body">
					<div class="cp-setup">
						<div class="cp-setup-head">
							<span class="cp-step">1</span>
							<div class="cp-setup-head-text">
								<h3 class="cp-block-title">Profile setup</h3>
								<p class="cp-block-sub">Choose the industry and the areas this profile covers. The sidebar adapts - no saved data is ever removed.</p>
							</div>
						</div>
						<div class="cp-template-row">
							<span class="cp-template-label">Start from a template</span>
							<div class="cp-template-chips" id="cp-template-chips"></div>
						</div>
						<div class="cp-field-row">
							<div class="cp-field cp-field-full">
								<label class="cp-label" for="f-profile-industry">Primary Industry <span class="cp-required">*</span></label>
								<select class="cp-input cp-select" id="f-profile-industry"></select>
							</div>
						</div>
						<div class="cp-focus-head">
							<span class="cp-label">What this profile covers</span>
							<span class="cp-focus-hint" id="cp-focus-hint"></span>
						</div>
						<div class="cp-focus-grid" id="cp-focus-grid"></div>
						<p class="cp-note" id="cp-profile-note"></p>
					</div>
					<div class="cp-setup">
						<div class="cp-setup-head">
							<span class="cp-step">2</span>
							<div class="cp-setup-head-text">
								<h3 class="cp-block-title">Company identity</h3>
								<p class="cp-block-sub">Legal details reused across tenders, contracts and invoices.</p>
							</div>
						</div>
						<div class="cp-field-row cp-field-row-2">
							<div class="cp-field">
								<label class="cp-label" for="f-legalName">Legal Company Name <span class="cp-required">*</span></label>
								<input type="text" class="cp-input" id="f-legalName" placeholder="Registered legal name">
							</div>
							<div class="cp-field">
								<label class="cp-label" for="f-tradeName">Trade Name / DBA</label>
								<input type="text" class="cp-input" id="f-tradeName" placeholder="Doing business as (if different)">
							</div>
						</div>
						<div class="cp-field-row cp-field-row-2">
							<div class="cp-field">
								<label class="cp-label" for="f-companyType">Company Type <span class="cp-required">*</span></label>
								<select class="cp-input cp-select" id="f-companyType">
									<option value="">Select company type</option>
									<option value="corporation">Corporation (For-Profit)</option>
									<option value="llc">Limited Liability Company (LLC)</option>
									<option value="partnership">Partnership</option>
									<option value="sole-proprietorship">Sole Proprietorship</option>
									<option value="nonprofit">Non-Profit Organization</option>
									<option value="registered-charity">Registered Charity</option>
									<option value="cooperative">Cooperative</option>

					</div>
					<div class="cp-section-badge" id="cp-taxes-count">0</div>
					<div class="cp-section-toggle">▾</div>
				</div>
				<div class="cp-section-body">

					<div class="cp-section-icon">🏛️</div>

<script>
(function () {
  var consoleErrors = [];
  window.addEventListener('error', function (event) { consoleErrors.push(String(event.message)); });
  function whenReady(cb) {
    var timer = setInterval(function () {
      if (document.getElementById('cp-nav') && document.querySelector('#cp-nav .cp-nav-item')) { clearInterval(timer); cb(); }
    }, 100);
  }
  function setInput(element, value) {
    element.value = value;
    element.dispatchEvent(new Event('input', { bubbles: true }));
    element.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function readDb() {
    try { return JSON.parse(localStorage.getItem('company_profile_test_db') || '{}'); } catch (e) { return {}; }
  }
  function emit(lines) {
    var pre = document.createElement('pre');
    pre.id = 'qa-out';
    pre.textContent = 'QA-START\n' + lines.join('\n') + '\nQA-END';
    document.body.appendChild(pre);
  }
  whenReady(function () {
    setTimeout(function () {
      var out = [];
      var navItem = document.querySelector('[data-nav="invoicing"]');
      out.push('1. navPresent=' + !!navItem + ' state=' + ((document.getElementById('cp-state-invoicing') || {}).textContent || 'none'));
      out.push('2. completion=' + ((document.getElementById('cp-completion-count') || {}).textContent || 'none') + ' pct=' + ((document.getElementById('cp-completion-pct') || {}).textContent || 'none'));

      if (navItem) navItem.click();
      setTimeout(function () {
        var section = document.getElementById('sec-invoicing');
        out.push('3. sectionActive=' + (section ? section.classList.contains('active') : false));
        var summary = document.getElementById('cp-invoice-summary');
        var rows = summary ? Array.prototype.map.call(summary.querySelectorAll('.cp-invoice-summary-row'), function (row) {
          return row.querySelector('.cp-invoice-summary-label').textContent + '=' + row.querySelector('.cp-invoice-summary-value').textContent;
        }) : [];
        out.push('4. summary=' + rows.join(' | '));
        out.push('5. logoField=' + ((document.getElementById('cp-invoice-logo-field') || {}).innerHTML || '').slice(0, 220));

        var payment = document.getElementById('f-invoice-payment');
        var footer = document.getElementById('f-invoice-footer');
        setInput(payment, 'Bank: Test Bank\nAccount: 000111222\nSWIFT: TESTCA00');
        setInput(footer, 'Registered in BC - GST 12345 RT0001');

        setTimeout(function () {
          var saved = readDb().invoicing || {};
          out.push('6. paymentSaved=' + JSON.stringify(saved.paymentInstructions));
          out.push('7. footerSaved=' + JSON.stringify(saved.invoiceFooterNote));
          var outputValue = window.tool.getValue() || {};
          out.push('8. toolValueInvoicing=' + JSON.stringify(outputValue.invoicing || null));

          var removeButton = document.querySelector('[data-invoice-action="remove"]');
          var uploadButton = document.querySelector('[data-invoice-action="upload"]');
          out.push('9. uploadBtn=' + !!uploadButton + ' removeBtn=' + !!removeButton);
          if (removeButton) removeButton.click();
          setTimeout(function () {
            var afterRemove = readDb().invoicing || {};
            out.push('10. logoAfterRemove=' + JSON.stringify(afterRemove.logoUrl) + ' previewGone=' + !document.getElementById('cp-invoice-logo-img'));
            out.push('11. consoleErrors=' + JSON.stringify(consoleErrors));
            emit(out);
          }, 400);
        }, 700);
      }, 500);
    }, 1500);
  });
})();
</script>
