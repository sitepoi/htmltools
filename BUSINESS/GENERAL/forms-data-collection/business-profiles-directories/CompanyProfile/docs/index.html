\">\r\n\t\t<div class=\"cp-modal\" id=\"cp-modal\">\r\n\t\t\t<div class=\"cp-modal-header\">\r\n\t\t\t\t<h3 class=\"cp-modal-title\" id=\"cp-modal-title\"><\/h3>\r\n\t\t\t\t<button class=\"cp-btn cp-btn-icon cp-modal-close\" id=\"cp-modal-close\">✕<\/button>\r\n\t\t\t<\/div>\r\n\t\t\t<div class=\"cp-modal-body\" id=\"cp-modal-body\"><\/div>\r\n\t\t\t<div class=\"cp-modal-footer\">\r\n\t\t\t\t<button class=\"cp-btn cp-btn-secondary\" id=\"cp-modal-cancel\">Cancel<\/button>\r\n\t\t\t\t<button class=\"cp-btn cp-btn-primary\" id=\"cp-modal-save\">Save<\/button>\r\n\t\t\t<\/div>\r\n\t\t<\/div>\r\n\t<\/div>\r\n\r\n<\/div>"},"css":{"name":"CompanyProfile.css","src":"../app/CompanyProfile.css","content":"/* ── Company Profile - design system ──\r\n   Modern light shell with a complete dark token set.\r\n   Every component reads from tokens so the theme toggle works everywhere.\r\n──────────────────────────────────────────────── */\r\n\r\n:root {\r\n\t--cp-bg: #f4f6fb;\r\n\t--cp-surface: #ffffff;\r\n\t--cp-surface-2: #f8fafc;\r\n\t--cp-surface-3: #f1f5f9;\r\n\t--cp-line: #e4e9f3;\r\n\t--cp-line-soft: #eef2f8;\r\n\t--cp-line-strong: #d5ddec;\r\n\r\n\t--cp-ink: #0f172a;\r\n\t--cp-ink-2: #475569;\r\n\t--cp-ink-3: #86909f;\r\n\r\n\t--cp-accent: #4f46e5;\r\n\t--cp-accent-strong: #4338ca;\r\n\t--cp-accent-soft: #eef2ff;\r\n\t--cp-accent-soft-2: #e0e7ff;\r\n\t--cp-accent-line: #c7d2fe;\r\n\r\n\t--cp-success: #15803d;\r\n\t--cp-success-soft: #ecfdf5;\r\n\t--cp-warning: #b45309;\r\n\t--cp-warning-soft: #fffbeb;\r\n\t--cp-danger: #b91c1c;\r\n\t--cp-danger-soft: #fef2f2;\r\n\r\n\t--cp-radius-sm: 8px;\r\n\t--cp-radius: 12px;\r\n\t--cp-radius-lg: 16px;\r\n\r\n\t--cp-shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);\r\n\t--cp-shadow: 0 1px 3px rgba(15, 23, 42, .07), 0 8px 24px rgba(15, 23, 42, .05);\r\n\t--cp-shadow-lg: 0 24px 60px rgba(15, 23, 42, .18);\r\n\r\n\t--cp-sidebar-w: 272px;\r\n\t--cp-header-h: 60px;\r\n\t--cp-transition: .16s cubic-bezier(.4, 0, .2, 1);\r\n\t--cp-font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;\r\n\t--cp-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;\r\n}\r\n\r\n#app.cp-dark {\r\n\t--cp-bg: #0b1220;\r\n\t--cp-surface: #111a2e;\r\n\t--cp-surface-2: #0e1729;\r\n\t--cp-surface-3: #162034;\r\n\t--cp-line: #22304d;\r\n\t--cp-line-soft: #1b2740;\r\n\t--cp-line-strong: #2d3d5e;\r\n\r\n\t--cp-ink: #e9eefb;\r\n\t--cp-ink-2: #a9b6cf;\r\n\t--cp-ink-3: #7f8da8;\r\n\r\n\t--cp-accent: #818cf8;\r\n\t--cp-accent-strong: #c7d2fe;\r\n\t--cp-accent-soft: #1c2547;\r\n\t--cp-accent-soft-2: #242e57;\r\n\t--cp-accent-line: #38457c;\r\n\r\n\t--cp-success: #4ade80;\r\n\t--cp-success-soft: #10281d;\r\n\t--cp-warning: #fbbf24;\r\n\t--cp-warning-soft: #2a2110;\r\n\t--cp-danger: #f87171;\r\n\t--cp-danger-soft: #2c1418;\r\n\r\n\t--cp-shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);\r\n\t--cp-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .25);\r\n\t--cp-shadow-lg: 0 30px 70px rgba(0, 0, 0, .5);\r\n}\r\n\r\n/* ── Reset ── */\r\n#app { font-family: var(--cp-font); background: var(--cp-bg); color: var(--cp-ink); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }\r\n#app *, #app *::before, #app *::after { box-sizing: border-box; }\r\n#app input, #app textarea, #app select, #app button { font-family: inherit; font-size: inherit; }\r\n#app button { cursor: pointer; }\r\n#app input:focus, #app textarea:focus, #app select:focus { outline: none; }\r\n#app h1, #app h2, #app h3, #app p { margin: 0; }\r\n\r\n/* ── Icons ── */\r\n.cp-ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; flex-shrink: 0; }\r\n\r\n/* ── Header ── */\r\n.cp-header {\r\n\tposition: sticky; top: 0; z-index: 60;\r\n\tdisplay: flex; align-items: center; justify-content: space-between; gap: 16px;\r\n\theight: var(--cp-header-h); padding: 0 20px;\r\n\tbackground: var(--cp-surface); border-bottom: 1px solid var(--cp-line);\r\n}\r\n.cp-header-left { display: flex; align-items: center; gap: 11px; min-width: 0; }\r\n.cp-logo {\r\n\twidth: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;\r\n\tdisplay: grid; place-items: center; color: #fff;\r\n\tbackground: linear-gradient(135deg, #6366f1 0%, #7c3aed 55%, #0ea5e9 100%);\r\n\tbox-shadow: 0 6px 16px rgba(79, 70, 229, .28);\r\n}\r\n.cp-logo .cp-ico { width: 18px; height: 18px; stroke-width: 1.8; }\r\n.cp-title-group { display: flex; flex-direction: column; min-width: 0; }\r\n.cp-app-title { font-size: 13px; font-weight: 700; letter-spacing: -.2px; color: var(--cp-ink); line-height: 1.25; }\r\n.cp-app-sub { font-size: 10.5px; font-weight: 500; color: var(--cp-ink-3); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.cp-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }\r\n\r\n.cp-save-indicator {\r\n\tdisplay: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;\r\n\tborder: 1px solid var(--cp-line); border-radius: 999px; background: var(--cp-surface-2);\r\n\tfont-size: 10.5px; font-weight: 500; color: var(--cp-ink-3);\r\n}\r\n.cp-save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cp-success); flex-shrink: 0; }\r\n.cp-save-indicator.saving .cp-save-dot { background: var(--cp-warning); animation: cp-pulse 1s infinite; }\r\n.cp-save-indicator.saving .cp-save-text { color: var(--cp-warning); }\r\n@keyframes cp-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }\r\n\r\n.cp-completion {\r\n\tdisplay: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px 0 5px;\r\n\tborder: 1px solid var(--cp-line); border-radius: 999px; background: var(--cp-surface-2);\r\n}\r\n.cp-ring { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: conic-gradient(var(--cp-accent) 0%, var(--cp-line) 0%); transition: background .4s ease; }\r\n.cp-ring-inner { width: 22px; height: 22px; border-radius: 50%; background: var(--cp-surface); display: grid; place-items: center; font-size: 8.5px; font-weight: 700; color: var(--cp-ink-2); }\r\n.cp-completion-text { display: flex; flex-direction: column; line-height: 1.15; }\r\n.cp-completion-text strong { font-size: 10.5px; font-weight: 700; color: var(--cp-ink); }\r\n.cp-completion-text span { font-size: 9px; color: var(--cp-ink-3); }\r\n\r\n/* ── Buttons ── */\r\n.cp-btn {\r\n\tdisplay: inline-flex; align-items: center; justify-content: center; gap: 6px;\r\n\tmin-height: 34px; padding: 7px 14px;\r\n\tborder: 1px solid var(--cp-line-strong); border-radius: var(--cp-radius-sm);\r\n\tbackground: var(--cp-surface); color: var(--cp-ink);\r\n\tfont-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap;\r\n\ttransition: background var(--cp-transition), border-color var(--cp-transition), color var(--cp-transition), box-shadow var(--cp-transition);\r\n}\r\n.cp-btn:hover { background: var(--cp-surface-2); }\r\n.cp-btn:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 1px; }\r\n.cp-btn-icon { width: 32px; height: 32px; min-height: 32px; padding: 0; color: var(--cp-ink-2); }\r\n.cp-btn-icon:hover { color: var(--cp-ink); border-color: var(--cp-line-strong); }\r\n.cp-btn-primary { background: var(--cp-accent); border-color: var(--cp-accent); color: #fff; }\r\n.cp-btn-primary:hover { filter: brightness(1.06); background: var(--cp-accent); }\r\n.cp-btn-secondary { background: var(--cp-surface-2); }\r\n.cp-btn-danger { background: var(--cp-danger); border-color: var(--cp-danger); color: #fff; }\r\n.cp-btn-sm { min-height: 26px; padding: 4px 9px; font-size: 10.5px; }\r\n.cp-btn-add {\r\n\twidth: 100%; min-height: 38px; padding: 9px 12px;\r\n\tborder: 1px dashed var(--cp-accent-line); border-radius: 10px;\r\n\tbackground: var(--cp-accent-soft); color: var(--cp-accent-strong);\r\n\tfont-weight: 600; font-size: 11.5px;\r\n}\r\n.cp-btn-add:hover { background: var(--cp-accent-soft-2); border-color: var(--cp-accent); }\r\n.cp-linkbtn {\r\n\tborder: 0; background: none; padding: 0; color: var(--cp-accent-strong);\r\n\tfont-size: 11px; font-weight: 600; line-height: 1.4; text-align: left;\r\n}\r\n.cp-linkbtn:hover { text-decoration: underline; }\r\n\r\n/* ── Layout ── */\r\n.cp-layout { display: flex; align-items: flex-start; min-height: calc(100vh - var(--cp-header-h)); }\r\n\r\n/* ── Sidebar ── */\r\n.cp-sidebar {\r\n\twidth: var(--cp-sidebar-w); flex-shrink: 0;\r\n\tposition: sticky; top: var(--cp-header-h); height: calc(100vh - var(--cp-header-h));\r\n\tdisplay: flex; flex-direction: column; gap: 14px;\r\n\tpadding: 16px 12px;\r\n\tbackground: var(--cp-surface); border-right: 1px solid var(--cp-line);\r\n\toverflow-y: auto; overflow-x: hidden;\r\n}\r\n.cp-profile-chip {\r\n\tdisplay: flex; flex-direction: column; gap: 1px;\r\n\tpadding: 10px 12px; border: 1px solid var(--cp-accent-line); border-radius: var(--cp-radius);\r\n\tbackground: linear-gradient(140deg, var(--cp-accent-soft) 0%, var(--cp-surface) 82%);\r\n}\r\n.cp-profile-chip-label { font-size: 8.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--cp-accent-strong); }\r\n.cp-profile-chip-value { font-size: 12.5px; font-weight: 700; color: var(--cp-ink); line-height: 1.3; }\r\n.cp-profile-chip-sub { font-size: 10px; color: var(--cp-ink-3); line-height: 1.4; }\r\n\r\n.cp-nav { flex: 1; display: flex; flex-direction: column; gap: 1px; }\r\n.cp-nav-group {\r\n\tmargin: 12px 8px 5px; font-size: 8.5px; font-weight: 700;\r\n\tletter-spacing: .09em; text-transform: uppercase; color: var(--cp-ink-3);\r\n}\r\n.cp-nav-group:first-child { margin-top: 2px; }\r\n.cp-nav-item {\r\n\tdisplay: flex; align-items: center; gap: 9px; width: 100%;\r\n\tpadding: 7px 9px; border: 1px solid transparent; border-radius: 9px;\r\n\tbackground: none; color: var(--cp-ink-2); font-size: 11.5px; font-weight: 500;\r\n\ttext-align: left; transition: background var(--cp-transition), color var(--cp-transition);\r\n}\r\n.cp-nav-item:hover { background: var(--cp-surface-3); color: var(--cp-ink); }\r\n.cp-nav-item.active { background: var(--cp-accent-soft); color: var(--cp-accent-strong); font-weight: 600; box-shadow: inset 2px 0 0 var(--cp-accent); }\r\n.cp-nav-icon { display: grid; place-items: center; width: 16px; height: 16px; opacity: .8; flex-shrink: 0; }\r\n.cp-nav-item.active .cp-nav-icon { opacity: 1; }\r\n.cp-nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.cp-nav-badge {\r\n\tmin-width: 18px; height: 17px; padding: 0 5px; border-radius: 6px;\r\n\tdisplay: grid; place-items: center;\r\n\tbackground: var(--cp-surface-3); color: var(--cp-ink-3);\r\n\tfont-size: 9px; font-weight: 700;\r\n}\r\n.cp-nav-item.active .cp-nav-badge { background: var(--cp-surface); color: var(--cp-accent-strong); }\r\n.cp-nav-done { color: var(--cp-success); display: grid; place-items: center; }\r\n.cp-nav-done .cp-ico { width: 13px; height: 13px; stroke-width: 2.4; }\r\n\r\n.cp-sidebar-foot { display: flex; flex-direction: column; gap: 5px; padding-top: 11px; border-top: 1px solid var(--cp-line-soft); }\r\n.cp-hidden-note { font-size: 10px; line-height: 1.45; color: var(--cp-ink-3); }\r\n\r\n/* ── Main ── */\r\n.cp-main {\r\n\tflex: 1; min-width: 0; width: 100%; max-width: 1060px; margin: 0 auto;\r\n\tpadding: 22px 24px 44px; display: flex; flex-direction: column; gap: 18px;\r\n}\r\n\r\n/* ── Section card ── */\r\n.cp-section {\r\n\tdisplay: none; background: var(--cp-surface);\r\n\tborder: 1px solid var(--cp-line); border-radius: var(--cp-radius-lg);\r\n\tbox-shadow: var(--cp-shadow-sm); overflow: hidden;\r\n}\r\n.cp-section.active { display: block; animation: cp-section-in .18s ease; }\r\n@keyframes cp-section-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\r\n.cp-section-header {\r\n\tdisplay: flex; align-items: center; gap: 13px;\r\n\tpadding: 17px 22px; border-bottom: 1px solid var(--cp-line-soft);\r\n\tbackground: linear-gradient(180deg, var(--cp-surface) 0%, var(--cp-surface-2) 100%);\r\n}\r\n.cp-section-icon {\r\n\twidth: 36px; height: 36px; flex-shrink: 0; border-radius: 10px;\r\n\tdisplay: grid; place-items: center;\r\n\tbackground: var(--cp-accent-soft); border: 1px solid var(--cp-accent-line); color: var(--cp-accent-strong);\r\n}\r\n.cp-section-icon .cp-ico { width: 18px; height: 18px; }\r\n.cp-section-title-group { flex: 1; min-width: 0; }\r\n.cp-section-title { font-size: 14.5px; font-weight: 700; letter-spacing: -.2px; color: var(--cp-ink); }\r\n.cp-section-desc { font-size: 11.5px; color: var(--cp-ink-3); margin-top: 2px; }\r\n.cp-section-state {\r\n\tflex-shrink: 0; padding: 4px 9px; border-radius: 999px;\r\n\tborder: 1px solid var(--cp-line); background: var(--cp-surface-3);\r\n\tfont-size: 9.5px; font-weight: 600; color: var(--cp-ink-3); white-space: nowrap;\r\n}\r\n.cp-section-state.complete { border-color: transparent; background: var(--cp-success-soft); color: var(--cp-success); }\r\n.cp-section-badge {\r\n\tflex-shrink: 0; min-width: 22px; height: 20px; padding: 0 7px;\r\n\tdisplay: grid; place-items: center;\r\n\tborder: 1px solid var(--cp-line); border-radius: 6px;\r\n\tbackground: var(--cp-surface-3); color: var(--cp-ink-3);\r\n\tfont-size: 9.5px; font-weight: 700;\r\n}\r\n.cp-section-badge:empty { display: none; }\r\n.cp-section-toggle { display: none; }\r\n.cp-section-body { padding: 20px 22px 22px; }\r\n\r\n/* ── Profile setup blocks ── */\r\n.cp-setup {\r\n\tpadding: 16px 18px; border: 1px solid var(--cp-line); border-radius: 14px;\r\n\tbackground: var(--cp-surface-2);\r\n}\r\n.cp-setup + .cp-setup { margin-top: 16px; }\r\n.cp-setup .cp-field-row { margin-bottom: 0; }\r\n.cp-setup .cp-field { margin-bottom: 0; }\r\n.cp-setup .cp-field-row + .cp-field-row { margin-top: 14px; }\r\n.cp-setup .cp-field-row + .cp-focus-head { margin-top: 18px; }\r\n.cp-setup-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom ft); }\r\n.cp-section-edit { width: 28px; height: 28px; min-height: 28px; color: var(--cp-ink-3); }\r\n.cp-section-edit:hover { color: var(--cp-accent-strong); border-color: var(--cp-accent-line); }\r\n.cp-custom-block { margin-top: 18px; padding-top: 15px; border-top: 1px dashed var(--cp-line-strong); }\r\n.cp-custom-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }\r\n.cp-custom-title { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; color: var(--cp-ink-2); }\r\n.cp-custom-note { font-size: 10px; color: var(--cp-ink-3); }\r\n.cp-custom-rows { display: flex; flex-direction: column; gap: 8px; }\r\n.cp-custom-row { display: grid; grid-template-columns: 1.1fr 128px 1.6fr 30px; gap: 8px; align-items: start; }\r\n.cp-custom-row-head {\r\n\talign-items: center;\r\n\tfont-size: 8.5px; font-weight: 700; letter-spacing: .07em;\r\n\ttext-transform: uppercase; color: var(--cp-ink-3);\r\n}\r\n.cp-custom-row-head span { padding-left: 2px; }\r\n.cp-custom-row .cp-input { min-height: 34px; padding: 6px 9px; font-size: 11.5px; }\r\n.cp-custom-value { min-width: 0; }\r\n.cp-custom-remove {\r\n\twidth: 30px; height: 34px; min-height: 34px; padding: 0;\r\n\tborder-color: transparent; background: transparent; color: var(--cp-ink-3);\r\n}\r\n.cp-custom-remove:hover { background: var(--cp-danger-soft); color: var(--cp-danger); }\r\n\r\n.cp-linkbtn-strong { margin-top: 2px; font-size: 10.5px; color: var(--cp-accent-strong); }\r\n.cp-modal-danger { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--cp-line); display: flex; justify-content: flex-start; }\r\n\r\n/* ── Scrollbars ── */\r\n.cp-sidebar::-webkit-scrollbar { width: 6px; }\r\n.cp-sidebar::-webkit-scrollbar-track { background: transparent; }\r\n.cp-sidebar::-webkit-scrollbar-thumb { background: var(--cp-line-strong); border-radius: 6px; }\r\n\r\n/* ── Responsive ── */\r\n@media (max-width: 1000px) {\r\n\t.cp-sidebar { --cp-sidebar-w: 236px; }\r\n\t.cp-main { padding: 18px 16px 36px; }\r\n}\r\n\r\n@media (max-width: 820px) {\r\n\t.cp-layout { flex-direction: column; }\r\n\t.cp-sidebar {\r\n\t\tposition: static; width: 100%; height: auto;\r\n\t\tflex-direction: column; gap: 10px; padding: 10px 12px;\r\n\t\tborder-right: 0; border-bottom: 1px solid var(--cp-line);\r\n\t\toverflow: visible;\r\n\t}\r\n\t.cp-profile-chip { display: none; }\r\n\t.cp-nav { flex-direction: row; gap: 6px; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }\r\n\t.cp-nav-group { display: none; }\r\n\t.cp-stmt-grid { grid-template-columns: minmax(0, 1fr); }\r\n\t.cp-custom-row { grid-template-columns: minmax(0, 1fr); }\r\n\t.cp-custom-row-head { display: none; }\r\n\t.cp-custom-remove { justify-self: end; }\r\n\t.cp-subsection-note { display: none; }\r\n\t.cp-nav-item {\r\n\t\twidth: auto; flex: 0 0 auto; white-space: nowrap;\r\n\t\tpadding: 7px 11px; border-color: var(--cp-line); background: var(--cp-surface);\r\n\t}\r\n\t.cp-nav-label { overflow: visible; }\r\n\t.cp-nav-badge { display: none; }\r\n\t.cp-nav-done { display: none; }\r\n\t.cp-sidebar-foot { flex-direction: row; align-items: center; justify-content: space-between; padding-top: 0; border-top: 0; }\r\n\t.cp-main { padding: 14px 12px 32px; gap: 14px; }\r\n\t.cp-section-header { padding: 14px 16px; }\r\n\t.cp-section-body { padding: 16px; }\r\n\t.cp-section-state { display: none; }\r\n\t.cp-field-row, .cp-field-row-2, .cp-field-row-3 { grid-template-columns: minmax(0, 1fr); }\r\n\t.cp-pager-btn { max-width: 42%; }\r\n}\r\n\r\n@media (max-width: 600px) {\r\n\t.cp-header { padding: 0 12px; gap: 8px; }\r\n\t.cp-app-sub { display: none; }\r\n\t.cp-completion-text { display: none; }\r\n\t.cp-completion { padding: 0 4px; height: 36px; }\r\n\t.cp-save-indicator { display: none; }\r\n\t.cp-focus-grid { grid-template-columns: minmax(0, 1fr); }\r\n\t.cp-pager { flex-wrap: wrap; }\r\n\t.cp-pager-btn { max-width: 100%; }\r\n\t.cp-pager-count { order: 2; width: 100%; text-align: center; }\r\n}\r\n"},"js":{"name":"CompanyProfile.js","src":"../app/CompanyProfile.js","content":"/* ── Company Profile ──\r\n   Comprehensive company/organization data collection tool.\r\n   Built for UniconHub CMS HTML-tool system.\r\n────────────────────────────────────────── */\r\n\r\n/* ── Helpers ── */\r\nfunction genId() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }\r\nfunction esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction val(id) { return (el(id) || {}).value || ''; }\r\nfunction setVal(id, v) { var e = el(id); if (e) e.value = v || ''; }\r\nfunction parseLines(text) { return (text || '').split('\\n').map(function(l){ return l.trim(); }).filter(Boolean); }\r\nfunction parseCsv(text) { return (text || '').split(',').map(function(l){ return l.trim(); }).filter(Boolean); }\r\n\r\n/* ── Section Definitions ── */\r\nvar SECTIONS = [\r\n\t{ id: 'basic',         group: 'Foundation',         icon: 'building', title: 'Basic Information',          desc: 'Core company identity and classification' },\r\n\t{ id: 'mission',       group: 'Foundation',         icon: 'target',   title: 'Brand & Positioning',        desc: 'Purpose, direction and how the company presents itself' },\r\n\t{ id: 'industry',      group: 'Foundation',         icon: 'factory',  title: 'Industry & Capabilities',    desc: 'Sector classification, capabilities and procurement codes' },\r\n\t{ id: 'headquarters',  group: 'Contact & Locations', icon: 'pin',     title: 'Headquarters',               desc: 'Primary business address and contact information' },\r\n\t{ id: 'offices',       group: 'Contact & Locations', icon: 'offices', title: 'Other Offices & Branches',   navLabel: 'Offices & Branches', desc: 'Additional locations, branches and satellite offices', needs: ['locations'], count: function() { return DB.otherOffices.length; } },\r\n\t{ id: 'billing',       group: 'Contact & Locations', icon: 'card',    title: 'Billing Address',            desc: 'Address used for invoicing and financial correspondence', needs: ['salesTax'] },\r\n\t{ id: 'geographic',    group: 'Contact & Locations', icon: 'globe',   title: 'Geographic Coverage',        desc: 'Areas where the business operates, used for tender matching', needs: ['coverage', 'tenders'] },\r\n\t{ id: 'contacts',      group: 'Contact & Locations', icon: 'users',   title: 'Contacts',                   desc: 'Key people and points of contact', count: function() { return DB.contacts.others.length; } },\r\n\t{ id: 'weblinks',      group: 'Contact & Locations', icon: 'link',    title: 'Weblinks & Social Media',    navLabel: 'Weblinks & Social', desc: 'Online presence and digital channels' },\r\n\t{ id: 'taxes',         group: 'Commercial',         icon: 'receipt',  title: 'Sales Tax Registrations',    navLabel: 'Sales Tax', desc: 'Tax numbers, rates and responsibilities', needs: ['salesTax'], count: function() { return DB.salesTaxDefinitions.length; } },\r\n\t{ id: 'financials',    group: 'Commercial',         icon: 'chart',    title: 'Financial Standing',         desc: 'Revenue history and financial position', needs: ['financials', 'tenders', 'grants'] },\r\n\t{ id: 'documents',     group: 'Compliance',         icon: 'shield',   title: 'Documents & Certificates',   navLabel: 'Documents', desc: 'Licences, certifications, insurance and supporting documents', needs: ['compliance', 'tenders'], count: function() { return (DB.documents.certificates || []).length; } },\r\n\t{ id: 'refletters',    group: 'Compliance',         icon: 'mail',     title: 'Reference Letters',          desc: 'Recommendations from clients and partners', needs: ['portfolio', 'tenders'], count: function() { return (DB.referenceLetters || []).length; } },\r\n\t{ id: 'assets-owned',  group: 'Capacity',           icon: 'truck',    title: 'Owned Assets',               desc: 'Equipment, vehicles, facilities and other owned resources', needs: ['fleet'], count: function() { return (DB.assets.owned || []).length; } },\r\n\t{ id: 'assets-partner',group: 'Capacity',           icon: 'share',    title: 'Partner Assets',             desc: 'Resources available through partnerships and alliances', needs: ['fleet'], count: function() { return (DB.assets.partnerAccessible || []).length; } },\r\n\t{ id: 'hr',            group: 'Capacity',           icon: 'users2',   title: 'Workforce & Skills',         desc: 'Team structure, roles and expertise', needs: ['workforce'], count: function() { return (DB.humanResources.staffCapabilities || []).length; } },\r\n\t{ id: 'projects',      group: 'Experience',         icon: 'folder',   title: 'Reference Projects',         desc: 'Past projects, clients and outcomes', needs: ['portfolio', 'tenders'], count: function() { return (DB.referenceProjects || []).length; } }\r\n];\r\n\r\n/* ── Profile focus areas (drive which sections are shown) ── */\r\nvar PROFILE_FOCUS_AREAS = [\r\n\t{ id: 'tenders',    label: 'Bids & tenders',        desc: 'Public procurement, RFPs, prequalification' },\r\n\t{ id: 'grants',     label: 'Grants & funding',      desc: 'Grant applications and public funding' },\r\n\t{ id: 'compliance', label: 'Certifications',        desc: 'Licences, insurance, safety and quality' },\r\n\t{ id: 'fleet',      label: 'Equipment & fleet',     desc: 'Owned and partner-accessible equipment' },\r\n\t{ id: 'locations',  label: 'Multiple locations',    desc: 'Branches, sites and satellite offices' },\r\n\t{ id: 'coverage',   label: 'Service coverage',      desc: 'Regions, cities and service radius' },\r\n\t{ id: 'salesTax',   label: 'Sales tax',             desc: 'Tax registrations and billing details' },\r\n\t{ id: 'workforce',  label: 'Workforce',             desc: 'Team capacity, roles and skills' },\r\n\t{ id: 'financials', label: 'Financial standing',    desc: 'Revenue history and financial ratios' },\r\n\t{ id: 'portfolio',  label: 'Projects & references', desc: 'Reference projects and client letters' }\r\n];\r\n\r\n/* ── Industries with the sections they usually need ── */\r\nvar INDUSTRIES = [\r\n\t{ id: 'construction',   label: 'Construction & Trades',              preset: ['tenders', 'compliance', 'fleet', 'workforce', 'portfolio', 'financials', 'salesTax'] },\r\n\t{ id: 'technology',     label: 'Technology & IT',                    preset: ['portfolio', 'workforce', 'compliance', 'salesTax'] },\r\n\t{ id: 'consulting',     label: 'Consulting & Professional Services', preset: ['portfolio', 'workforce', 'financials', 'salesTax'] },\r\n\t{ id: 'healthcare',     label: 'Healthcare & Life Sciences',         preset: ['compliance', 'workforce', 'salesTax'] },\r\n\t{ id: 'education',      label: 'Education & Training',               preset: ['grants', 'workforce', 'compliance'] },\r\n\t{ id: 'manufacturing',  label: 'Manufacturing',                      preset: ['tenders', 'compliance', 'fleet', 'workforce', 'portfolio', 'salesTax'] },\r\n\t{ id: 'retail',         label: 'Retail & Wholesale',                 preset: ['salesTax', 'locations'] },\r\n\t{ id: 'transportation', label: 'Transportation & Logistics',         preset: ['tenders', 'fleet', 'compliance', 'workforce', 'coverage', 'salesTax'] },\r\n\t{ id: 'energy',         label: 'Energy & Utilities',                 preset: ['tenders', 'compliance', 'fleet', 'workforce', 'portfolio', 'financials', 'salesTax'] },\r\n\t{ id: 'agriculture',    label: 'Agriculture & Food',                 preset: ['fleet', 'compliance', 'salesTax'] },\r\n\t{ id: 'hospitality',    label: 'Hospitality & Tourism',              preset: ['locations', 'workforce', 'salesTax'] },\r\n\t{ id: 'realestate',     label: 'Real Estate',                        preset: ['portfolio', 'locations', 'financials', 'salesTax'] },\r\n\t{ id: 'finance',        label: 'Finance & Insurance',                preset: ['compliance', 'workforce', 'financials'] },\r\n\t{ id: 'nonprofit',      label: 'Non-Profit & Social Services',       preset: ['grants', 'workforce', 'compliance'] },\r\n\t{ id: 'media',          label: 'Media & Communications',             preset: ['portfolio', 'workforce', 'salesTax'] },\r\n\t{ id: 'mining',         label: 'Mining & Natural Resources',         preset: ['tenders', 'compliance', 'fleet', 'workforce', 'financials', 'salesTax'] },\r\n\t{ id: 'pharma',         label: 'Pharmaceuticals & Life Sciences',    preset: ['compliance', 'workforce', 'financials', 'salesTax'] },\r\n\t{ id: 'environmental',  label: 'Environmental Services',             preset: ['tenders', 'compliance', 'fleet', 'workforce', 'portfolio', 'salesTax'] },\r\n\t{ id: 'security',       label: 'Security & Defense',                 preset: ['tenders', 'compliance', 'workforce', 'portfolio', 'salesTax'] },\r\n\t{ id: 'government',     label: 'Government & Public Sector',         preset: ['tenders', 'compliance', 'workforce', 'financials'] },\r\n\t{ id: 'other',          label: 'Other',                              preset: [] }\r\n];\r\n\r\n/* ── Starting templates for common profile scenarios ──\r\n   Adding a new scenario is a data change: append one entry with the industry\r\n   and the coverage areas it needs. No other code has to change. */\r\nvar PROFILE_TEMPLATES = [\r\n\t{ id: 'general',   label: 'General company',       desc: 'Identity, contacts and brand only',                    industry: 'other',        focus: [] },\r\n\t{ id: 'tenders',   label: 'Public tenders',        desc: 'Procurement, certifications, capacity and references', industry: 'construction', focus: ['tenders', 'compliance', 'fleet', 'workforce', 'portfolio', 'financials', 'salesTax', 'coverage'] },\r\n\t{ id: 'software',  label: 'Software / IT vendor',  desc: 'Projects, team and security documentation',            industry: 'technology',   focus: ['portfolio', 'workforce', 'compliance', 'salesTax'] },\r\n\t{ id: 'grants',    label: 'Nonprofit &
