<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #f1f5f9; }
  #frame { display: block; width: 390px; height: 1400px; border: 0; background: #f8fafc; }
</style>
</head>
<body>
<iframe id="frame" src="../test-harness.html?sample=a&amp;bare=1"></iframe>
<script>
  window.setTimeout(function () {
    var frameNode = document.getElementById('frame');
    try {
      var frameDocument = frameNode.contentDocument;
      var appNode = frameDocument.getElementById('wim-app');
      var overflow = frameDocument.documentElement.scrollWidth - frameDocument.documentElement.clientWidth;
      document.title = 'scrollWidth ' + frameDocument.documentElement.scrollWidth + ' clientWidth ' + frameDocument.documentElement.clientWidth + ' overflow ' + overflow + ' appWidth ' + Math.round(appNode.getBoundingClientRect().width);
    } catch (error) { document.title = 'measure failed: ' + error.message; }
  }, 2500);
</script>
</body>
</html>
