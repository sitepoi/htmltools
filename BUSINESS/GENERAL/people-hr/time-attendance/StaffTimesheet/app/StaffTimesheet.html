<!-- html build 2026-11-10-1 -->
<div id="tms-app" class="tms-app">

  <aside class="tms-sidebar" id="tms-sidebar">
    <div class="tms-brand">
      <div class="tms-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
        </svg>
      </div>
      <div class="tms-brand-text">
        <div class="tms-brand-name">TimeLedger</div>
        <div class="tms-brand-sub">Staff timesheet</div>
      </div>
    </div>

    <nav class="tms-nav" id="tms-nav" aria-label="Sections">
      <button type="button" class="tms-nav-item is-active" data-tab="timesheet">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="M4 9h16M8 13h3M8 16h6"></path></svg>
        <span>Timesheet</span>
        <span class="tms-nav-badge" id="tms-nav-entries">0</span>
      </button>
      <button type="button" class="tms-nav-item" data-tab="clock">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span>Clock in / out</span>
      </button>
      <button type="button" class="tms-nav-item" data-tab="reports">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19V5M5 19h14"></path><path d="M9 15v-4M13 15V8M17 15v-6"></path></svg>
        <span>Reports</span>
      </button>
      <button type="button" class="tms-nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-4l-.4 2.1a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.1h4l.4-2.1a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"></path></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="tms-side-status" id="tms-side-status"></div>
    <div class="tms-side-foot" id="tms-user-chip"></div>
  </aside>

  <main class="tms-main">

    <header class="tms-topbar">
      <div class="tms-topbar-title">
        <h1 id="tms-page-title">Timesheet</h1>
        <div class="tms-topbar-meta" id="tms-period-label"></div>
      </div>
      <div class="tms-topbar-actions">
        <span class="tms-build" id="tms-build" title="Tool build number"></span>
        <button type="button" class="tms-btn tms-btn-primary" id="tms-btn-add-entry">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add entry
        </button>
        <button type="button" class="tms-btn" id="tms-btn-submit">Submit</button>
        <div class="tms-menu-wrap">
          <button type="button" class="tms-btn tms-btn-ghost" id="tms-btn-more" aria-haspopup="true" aria-expanded="false">More</button>
          <div class="tms-menu" id="tms-more-menu">
            <button type="button" class="tms-menu-item" data-action="copy-day">Copy previous day</button>
            <button type="button" class="tms-menu-item" data-action="print-timesheet">Print timesheet</button>
            <button type="button" class="tms-menu-item" data-action="export-csv">Export CSV</button>
            <button type="button" class="tms-menu-item" data-action="export-json">Export JSON backup</button>
            <div class="tms-menu-sep"></div>
            <button type="button" class="tms-menu-item" data-action="import">Import entries</button>
          </div>
        </div>
      </div>
    </header>

    <div id="tms-banner"></div>

    <section class="tms-pane is-active" data-pane="timesheet">
      <div class="tms-stats" id="tms-stats"></div>
      <div class="tms-alerts" id="tms-alerts"></div>

      <div class="tms-card">
        <div class="tms-card-head">
          <div class="tms-card-head-main">
            <h2>Time entries</h2>
            <p id="tms-entries-sub">Every entry inside this period.</p>
          </div>
          <div class="tms-card-actions">
            <input type="search" class="tms-input tms-search" id="tms-search" placeholder="Search project, note or tag" aria-label="Search entries">
            <select class="tms-select" id="tms-filter-category" aria-label="Filter by category">
              <option value="all">All categories</option>
            </select>
            <select class="tms-select" id="tms-filter-billable" aria-label="Filter by billable state">
              <option value="all">Billable + non-billable</option>
              <option value="billable">Billable only</option>
              <option value="nonbillable">Non-billable only</option>
            </select>
          </div>
        </div>
        <div id="tms-entries" class="tms-entries"></div>
      </div>
    </section>

    <section class="tms-pane" data-pane="clock">
      <div class="tms-clock-grid">
        <div class="tms-clock-card">
          <div class="tms-clock-kicker" id="tms-clock-kicker">Ready to start</div>
          <div class="tms-clock-now" id="tms-clock-now">00:00:00</div>
          <div class="tms-clock-date" id="tms-clock-date"></div>
          <div class="tms-clock-status" id="tms-clock-status"></div>

          <div class="tms-clock-fields">
            <label class="tms-field">
              <span>Project</span>
              <select class="tms-select" id="tms-clock-project"></select>
            </label>
            <label class="tms-field">
              <span>Activity</span>
              <select class="tms-select" id="tms-clock-activity"></select>
            </label>
            <label class="tms-field">
              <span>Unpaid break (minutes)</span>
              <input type="number" class="tms-input" id="tms-clock-break" min="0" max="600" step="5">
            </label>
            <label class="tms-field">
              <span>Note (optional)</span>
              <input type="text" class="tms-input" id="tms-clock-notes" maxlength="240" placeholder="What are you working on?">
            </label>
          </div>

          <button type="button" class="tms-clock-btn" id="tms-btn-clock">
            <span class="tms-clock-btn-dot" aria-hidden="true"></span>
            <span id="tms-clock-btn-label">Clock in</span>
          </button>
          <div class="tms-clock-hint" id="tms-clock-hint"></div>
        </div>

        <div class="tms-clock-side">
          <div class="tms-card tms-today-card">
            <div class="tms-card-head">
              <div class="tms-card-head-main">
                <h2>Today</h2>
                <p id="tms-today-sub">No entries yet</p>
              </div>
            </div>
            <div id="tms-today-entries" class="tms-today-entries"></div>
          </div>
          <div class="tms-card">
            <div class="tms-card-head">
              <div class="tms-card-head-main">
                <h2>This week</h2>
                <p id="tms-week-sub"></p>
              </div>
            </div>
            <div id="tms-week-strip" class="tms-week-strip"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="tms-pane" data-pane="reports">
      <div class="tms-report-toolbar">
        <div class="tms-report-tabs" id="tms-report-tabs" role="tablist">
          <button type="button" class="tms-report-tab is-active" data-report="summary">Summary</button>
          <button type="button" class="tms-report-tab" data-report="day">By day</button>
          <button type="button" class="tms-report-tab" data-report="project">By project</button>
          <button type="button" class="tms-report-tab" data-report="week">By week</button>
          <button type="button" class="tms-report-tab" data-report="audit">Audit log</button>
        </div>
        <div class="tms-report-actions">
          <button type="button" class="tms-btn tms-btn-ghost" id="tms-btn-print-report">Print / PDF</button>
          <button type="button" class="tms-btn tms-btn-ghost" id="tms-btn-report-csv">CSV</button>
        </div>
      </div>
      <div id="tms-report-body" class="tms-report-body"></div>
    </section>

    <section class="tms-pane" data-pane="settings">
      <div id="tms-settings-body" class="tms-settings"></div>
    </section>

  </main>
</div>

<div class="tms-modal-overlay" id="tms-modal-overlay" aria-hidden="true">
  <div class="tms-modal" id="tms-modal" role="dialog" aria-modal="true" aria-labelledby="tms-modal-title">
    <div class="tms-modal-head">
      <h3 id="tms-modal-title">Entry</h3>
      <button type="button" class="tms-modal-close" id="tms-modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="tms-modal-body" id="tms-modal-body"></div>
    <div class="tms-modal-foot" id="tms-modal-foot"></div>
  </div>
</div>

<div class="tms-toasts" id="tms-toasts" aria-live="polite"></div>
