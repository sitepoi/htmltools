	var PROFILE_EXAMPLE_SETTING = JSON.stringify([

	function loadStoredState() {
		try { storedValue = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (error) { storedValue = null; }
		try {
			var savedRole = localStorage.getItem(ROLE_KEY);
			if (savedRole && ROLE_USERS.hasOwnProperty(savedRole)) currentRole = savedRole;
		} catch (error) { }
		try { readOnly = localStorage.getItem(READ_ONLY_KEY) === '1'; } catch (error) { readOnly = false; }

		var params = new URLSearchParams(window.location.search);
		var roleParam = params.get('role');
		if (roleParam && ROLE_USERS.hasOwnProperty(roleParam)) currentRole = roleParam;

		var sample = params.get('sample');

	function saveValue(value, silent) {
		storedValue = value;
		try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch (error) { }

	}

	function emit(eventName, payload) {
		(listeners[eventName] || []).forEach(function (callback) {
			try { callback(payload); } catch (error) { console.warn('[harness listener]', error); }

			window.tool.notify('Printable summary created (harness mock).', 'success');
			callback(null, { name: (options && options.filename ? options.filename : 'export') + '.html', url: url, size: blob.size, type: 'text/html' });

		declareOutput: function (schema) { console.log('[harness] declareOutput', schema); },

		reportMissingParams: function (missing, message) { console.warn('[harness] missing params', missing, message); },

		_setRole: function (role) {
			currentRole = role;
			try { localStorage.setItem(ROLE_KEY, role); } catch (error) { }
			emit('user', ROLE_USERS[role] || null);
		},
		_setReadOnly: function (value) {
			readOnly = !!value;

			emit('readonly', readOnly);

		_loadSample: function (kind) {
			saveValue(kind === 'company' ? buildCompanySample() : buildPersonSample());

		_clear: function () {
			try { localStorage.removeItem(STORAGE_KEY); } catch (error) { }

			window.location.reload();
		},
		_getValue: function () { return JSON.parse(JSON.stringify(storedValue)); },

<script>
/* ── Harness controls ───────────────────────────────────────────── */
(function () {
	var status = document.getElementById('th-status');
	function setStatus(text) { if (status) status.textContent = text; }
	window.addEventListener('error', function (event) {
		setStatus('JS ERROR: ' + (event.message || 'unknown error'));
		console.error('[harness] uncaught error', event.error || event.message);
	});
	window.addEventListener('unhandledrejection', function (event) {
		setStatus('PROMISE ERROR: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
	});
	document.getElementById('th-sample-person').onclick = function () { window.tool._loadSample('person'); };
	document.getElementById('th-sample-company').onclick = function () { window.tool._loadSample('company'); };
	document.getElementById('th-clear').onclick = function () { window.tool._clear(); };
	document.getElementById('th-reload').onclick = function () { window.location.reload(); };
	document.getElementById('th-dump').onclick = function () { window.tool._dump(); };
	document.getElementById('th-role').onchange = function () {
		window.tool._setRole(this.value);
		window.tool.notify('Now acting as: ' + (this.options[this.selectedIndex].text), 'info');
	};
	document.getElementById('th-readonly').onchange = function () {
		window.tool._setReadOnly(this.checked);
		window.tool.notify(this.checked ? 'Read-only mode on' : 'Edit mode on', 'info');
	};
	window.__thSetStatus = setStatus;
})();
</script>

<script>
/* ── Loader: external JS normally, inline JS with ?inlinejs=1 ──── */
(function () {
	var status = window.__thSetStatus || function () { };
	var container = document.getElementById('app-container');
	var inlineMode = /[?&]inlinejs=1/.test(window.location.search);
	var htmlInjected = false;
	var jsLoaded = false;

	function loadExternalJs() {
		if (jsLoaded) return;
		jsLoaded = true;
		status('Loading JS (external)...');
		var script = document.createElement('script');
		script.src = 'CustomerProfile.js';
		script.onload = function () { status('Ready - external JS'); };
		script.onerror = function () { status('JS FAILED - check the console'); };
		document.body.appendChild(script);
	}

	function loadInlineJs() {
		if (jsLoaded) return;
		jsLoaded = true;
		status('Loading JS (inline mode)...');
		fetch('CustomerProfile.js')
			.then(function (response) {
				if (!response.ok) throw new Error('HTTP ' + response.status);
				return response.text();
			})
			.then(function (code) {
				var script = document.createElement('script');
				script.textContent = code;
				document.body.appendChild(script);
				status('Ready - inline JS');
			})
			.catch(function (error) {
				status('Inline fetch failed, falling back to external JS');
				jsLoaded = false;
				loadExternalJs();
			});
	}

	function injectHtml(html) {
		if (htmlInjected) return;
		htmlInjected = true;
		container.innerHTML = html;
		if (inlineMode) loadInlineJs();
		else loadExternalJs();
	}

	var fallbackTimer = setTimeout(function () {
		status('Using embedded HTML (file:// mode)');
		injectHtml(window.EMBEDDED_CUSTOMER_PROFILE_HTML || '<div class="cp-app"><p style="padding:24px">Embedded HTML not built. Run the harness build step.</p></div>');
	}, 1500);

	fetch('CustomerProfile.html')
		.then(function (response) {
			if (!response.ok) throw new Error('HTTP ' + response.status);
			return response.text();
		})
		.then(function (html) {
			clearTimeout(fallbackTimer);
			status('HTML loaded (live file)');
			injectHtml(html);
		})
		.catch(function () { /* the fallback timer handles file:// */ });
})();
</script>
