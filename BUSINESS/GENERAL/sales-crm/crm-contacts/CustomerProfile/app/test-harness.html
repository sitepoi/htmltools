	body.th-bare { padding-top: 0; }
	body.th-bare #th-bar { display: none; }
	#th-bar {
		position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
		display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
		padding: 5px 14px; min-height: 34px; box-sizing: border-box;
		background: #0f172a; color: #e6edf5; font-size: 11px;
	}
	#th-bar strong { color: #7dd3fc; letter-spacing: 0.05em; }
	#th-bar .sep { color: #475569; }
	#th-bar button { border: 0; border-radius: 4px; padding: 3px 9px; font-size: 10px; font-weight: 700; cursor: pointer; color: #fff; }
	#th-bar .btn-person { background: #0f766e; }
	#th-bar .btn-company { background: #3f56e0; }
	#th-bar .btn-clear { background: #b91c1c; }
	#th-bar .btn-reload { background: #15803d; }
	#th-bar .btn-quiet { background: #334155; }
	#th-bar select { border: 1px solid #334155; border-radius: 4px; background: #1e293b; color: #e6edf5; font-size: 11px; padding: 2px 4px; }
	#th-bar label { display: inline-flex; align-items: center; gap: 4px; }
	#th-bar .hint { color: #94a3b8; font-size: 10px; }
	#th-status { color: #cbd5e1; }
	#app-container { min-height: 400px; }
	#app-container .cp-top, #app-container .cp-header { top: 34px; }
	body.th-bare #app-container .cp-top, body.th-bare #app-container .cp-header { top: 0; }
	.th-toast {
		position: fixed; right: 18px; bottom: 18px; z-index: 9999; max-width: 380px;
		padding: 9px 16px; border-radius: 7px; color: #fff;
		font-size: 12px; line-height: 1.4; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
	}
	@keyframes thFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

	function loadStoredState() {
		try { storedValue = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (error) { storedValue = null; }
		try {
			var savedRole = localStorage.getItem(ROLE_KEY);
			if (savedRole && ROLE_USERS.hasOwnProperty(savedRole)) currentRole = savedRole;
		} catch (error) { }
		try { readOnly = localStorage.getItem(READ_ONLY_KEY) === '1'; } catch (error) { readOnly = false; }

		var params = new URLSearchParams(window.location.search);
		var roleParam = params.get('role');
		if (roleParam && ROLE_USERS.hasOwnProperty(roleParam)) currentRole = roleParam;
		if (params.get('ro') === '1') readOnly = true;
		if (params.get('bare') === '1') document.body.classList.add('th-bare');

		var sample = params.get('sample');
		if (sample && !storedValue) {
			storedValue = sample === 'company' ? buildCompanySample() : buildPersonSample();
			saveValue(storedValue, true);
		}
	}

	function saveValue(value, silent) {
		storedValue = value;
		try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch (error) { }
		if (!silent) emit('value', value);
	}

	function emit(eventName, payload) {
		(listeners[eventName] || []).forEach(function (callback) {
			try { callback(payload); } catch (error) { console.warn('[harness listener]', error); }
		});
	}

				return JSON.stringify(window.HARNESS_PROFILE_PRESETS[presetKey].config);
			}
			if (params.has(name)) return params.get(name);
			var defaults = {
				defaultCustomerType: 'person',
				defaultProfileKey: '',
				statusOptions: '',
				sourceOptions: '',
				showInteractions: 'yes',
				allowExportPdf: 'yes'
			};
			return defaults.hasOwnProperty(name) ? defaults[name] : fallback;
		},
		isReadOnly: function () { return readOnly; },
		onReadonlyChange: function (callback) { listeners.readonly.push(callback); },
		getUser: function () { return ROLE_USERS[currentRole] || null; },
		onUserChange: function (callback) { listeners.user.push(callback); },
		reportValid: function (isValid, message) { if (!isValid) console.warn('[harness] reportValid false:', message); },
		notify: function (message, severity) {
			var colors = { info: '#0f766e', success: '#15803d', warning: '#a9660b', error: '#b91c1c' };
			var toast = document.createElement('div');
			toast.className = 'th-toast';
			toast.style.background = colors[severity] || colors.info;
			toast.style.animation = 'thFade 0.2s ease';
			toast.textContent = message;
			document.body.appendChild(toast);
			setTimeout(function () {
				toast.style.transition = 'opacity 0.25s';
				toast.style.opacity = '0';
				setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 260);
			}, 2600);
		},
		resize: function () { },
		openUrl: function (url) { console.log('[harness] openUrl', url); window.tool.notify('Would open: ' + url, 'info'); },
		requestExportPdf: function (options, callback) {
			console.log('[harness] requestExportPdf', options);
			var html = (options && options.html) || '';
			window.__lastPdfHtml = html;
			var blob = new Blob([html], { type: 'text/html' });
			var url = URL.createObjectURL(blob);
			window.tool.notify('Printable summary created (harness mock).', 'success');
			callback(null, { name: (options && options.filename ? options.filename : 'export') + '.html', url: url, size: blob.size, type: 'text/html' });
		},
		declareOutput: function (schema) { console.log('[harness] declareOutput', schema); },
		declareParams: function (params) { console.log('[harness] declareParams', params); },
		reportMissingParams: function (missing, message) { console.warn('[harness] missing params', missing, message); },

		_setRole: function (role) {
			currentRole = role;
			try { localStorage.setItem(ROLE_KEY, role); } catch (error) { }
			emit('user', ROLE_USERS[role] || null);
		},
		_setReadOnly: function (value) {
			readOnly = !!value;
			try { localStorage.setItem(READ_ONLY_KEY, readOnly ? '1' : '0'); } catch (error) { }
			emit('readonly', readOnly);
		},
		_loadSample: function (kind) {
			saveValue(kind === 'company' ? buildCompanySample() : buildPersonSample());
			window.tool.notify('Sample ' + kind + ' loaded.', 'success');
		},
		_clear: function () {
			try { localStorage.removeItem(STORAGE_KEY); } catch (error) { }
			storedValue = null;
			window.location.reload();
		},
		_getValue: function () { return JSON.parse(JSON.stringify(storedValue)); },
		_dump: function () {
			console.log('[harness] current value', JSON.parse(JSON.stringify(storedValue)));
			window.tool.notify('Value written to the browser console.', 'info');
		}
	};

	window.tool._setRole(currentRole);
	window.tool._setReadOnly(readOnly);
	document.getElementById('th-role').value = currentRole;
	document.getElementById('th-readonly').checked = readOnly;
})();
</script>

<script>
/* ── Harness controls ───────────────────────────────────────────── */
(function () {
	var status = document.getElementById('th-status');
	var presetSelect = document.getElementById('th-profile-preset');
	var initialParams = new URLSearchParams(window.location.search);
	var initialPreset = initialParams.get('profilePreset') || '';
	function setStatus(text) { if (status) status.textContent = text; }
	if (presetSelect && window.HARNESS_PROFILE_PRESETS) {
		Object.keys(window.HARNESS_PROFILE_PRESETS).sort(function (left, right) {
			return window.HARNESS_PROFILE_PRESETS[left].name.localeCompare(window.HARNESS_PROFILE_PRESETS[right].name);
		}).forEach(function (key) {
			var preset = window.HARNESS_PROFILE_PRESETS[key];
			var option = document.createElement('option');
			option.value = key;
			option.textContent = preset.name + ' (' + preset.mode + ')';
			presetSelect.appendChild(option);
		});
		presetSelect.value = initialPreset;
		presetSelect.onchange = function () {
			try { localStorage.removeItem('customerprofile_test_value'); } catch (error) { }
			var url = new URL(window.location.href);
			if (this.value) url.searchParams.set('profilePreset', this.value);
			else url.searchParams.delete('profilePreset');
			url.searchParams.delete('segments');
			url.searchParams.set('sample', 'person');
			window.location.href = url.toString();
		};
	}
	window.addEventListener('error', function (event) {
		setStatus('JS ERROR: ' + (event.message || 'unknown error'));
		console.error('[harness] uncaught error', event.error || event.message);
	});
	window.addEventListener('unhandledrejection', function (event) {
		setStatus('PROMISE ERROR: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
	});
	document.getElementById('th-sample-person').onclick = function () { window.tool._loadSample('person'); };
	document.getElementById('th-sample-company').onclick = function () { window.tool._loadSample('company'); };
	document.getElementById('th-clear').onclick = function () { window.tool._clear(); };
	document.getElementById('th-reload').onclick = function () { window.location.reload(); };
	document.getElementById('th-dump').onclick = function () { window.tool._dump(); };
	document.getElementById('th-role').onchange = function () {
		window.tool._setRole(this.value);
		window.tool.notify('Now acting as: ' + (this.options[this.selectedIndex].text), 'info');
	};
	document.getElementById('th-readonly').onchange = function () {
		window.tool._setReadOnly(this.checked);
		window.tool.notify(this.checked ? 'Read-only mode on' : 'Edit mode on', 'info');
	};
	window.__thSetStatus = setStatus;
})();
</script>

<script>
/* ── Loader: external JS normally, inline JS with ?inlinejs=1 ──── */
(function () {
	var status = window.__thSetStatus || function () { };
	var container = document.getElementById('app-container');
	var inlineMode = /[?&]inlinejs=1/.test(window.location.search);
	var htmlInjected = false;
	var jsLoaded = false;

	function loadExternalJs() {
		if (jsLoaded) return;
		jsLoaded = true;
		status('Loading JS (external)...');
		var script = document.createElement('script');
		script.src = 'CustomerProfile.js';
		script.onload = function () { status('Ready - external JS'); };
		script.onerror = function () { status('JS FAILED - check the console'); };
		document.body.appendChild(script);
	}

	function loadInlineJs() {
		if (jsLoaded) return;
		jsLoaded = true;
		status('Loading JS (inline mode)...');
		fetch('CustomerProfile.js')
			.then(function (response) {
				if (!response.ok) throw new Error('HTTP ' + response.status);
				return response.text();
			})
			.then(function (code) {
				var script = document.createElement('script');
				script.textContent = code;
				document.body.appendChild(script);
				status('Ready - inline JS');
			})
			.catch(function (error) {
				status('Inline fetch failed, falling back to external JS');
				jsLoaded = false;
				loadExternalJs();
			});
	}

	function injectHtml(html) {
		if (htmlInjected) return;
		htmlInjected = true;
		container.innerHTML = html;
		if (inlineMode) loadInlineJs();
		else loadExternalJs();
	}

	var fallbackTimer = setTimeout(function () {
		status('Using embedded HTML (file:// mode)');
		injectHtml(window.EMBEDDED_CUSTOMER_PROFILE_HTML || '<div class="cp-app"><p style="padding:24px">Embedded HTML not built. Run the harness build step.</p></div>');
	}, 1500);

	fetch('CustomerProfile.html')
		.then(function (response) {
			if (!response.ok) throw new Error('HTTP ' + response.status);
			return response.text();
		})
		.then(function (html) {
			clearTimeout(fallbackTimer);
			status('HTML loaded (live file)');
			injectHtml(html);
		})
		.catch(function () { /* the fallback timer handles file:// */ });
})();
</script>
