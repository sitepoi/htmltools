  and the screenshots payload with `npm run docs:index-shots -- <Tool>`

ub\" id=\"mtn-meet-meta\">0 subjects - 0 decisions - 0 open tasks<\/div>\r\n        <\/div>\r\n        <div class=\"mtn-grid2\">\r\n          <div class=\"mtn-field mtn-span2\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-title\">Meeting title<\/label>\r\n            <input class=\"mtn-input\" id=\"mtn-meet-title\" data-field=\"meet.title\" placeholder=\"e.g. Board of Directors - Monthly Meeting\" maxlength=\"160\" />\r\n          <\/div>\r\n          <div class=\"mtn-field\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-date\">Date<\/label>\r\n            <input type=\"date\" class=\"mtn-input\" id=\"mtn-meet-date\" data-field=\"meet.date\" />\r\n          <\/div>\r\n          <div class=\"mtn-field\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-location\">Location / link<\/label>\r\n            <input class=\"mtn-input\" id=\"mtn-meet-location\" data-field=\"meet.location\" placeholder=\"Room A or video link\" maxlength=\"120\" />\r\n          <\/div>\r\n          <div class=\"mtn-field\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-timestart\">Starts at<\/label>\r\n            <input type=\"time\" class=\"mtn-input\" id=\"mtn-meet-timestart\" data-field=\"meet.timestart\" />\r\n          <\/div>\r\n          <div class=\"mtn-field\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-timeend\">Ends at<\/label>\r\n            <input type=\"time\" class=\"mtn-input\" id=\"mtn-meet-timeend\" data-field=\"meet.timeend\" />\r\n          <\/div>\r\n          <div class=\"mtn-field\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-chair\">Chair<\/label>\r\n            <input class=\"mtn-input\" id=\"mtn-meet-chair\" data-field=\"meet.chair\" placeholder=\"Who runs the meeting\" maxlength=\"120\" />\r\n          <\/div>\r\n          <div class=\"mtn-field\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-minutetaker\">Minute taker<\/label>\r\n            <input class=\"mtn-input\" id=\"mtn-meet-minutetaker\" data-field=\"meet.minutetaker\" placeholder=\"Who writes the notes\" maxlength=\"120\" />\r\n          <\/div>\r\n          <div class=\"mtn-field mtn-span2\">\r\n            <label class=\"mtn-label\" for=\"mtn-meet-attendees\">Attendees (one per line)<\/label>\r\n            <textarea class=\"mtn-textarea\" id=\"mtn-meet-attendees\" data-field=\"meet.attendees\" rows=\"3\" placeholder=\"Names of everyone present, one per line\"><\/textarea>\r\n          <\/div>\r\n        <\/div>\r\n        <p class=\"mtn-hint mtn-single-note\">One meeting per tool instance - this record holds exactly one meeting. Create a new CMS object for the next meeting.<\/p>\r\n      <\/div>\r\n\r\n      <details class=\"mtn-card mtn-raw\">\r\n        <summary>Import from another meeting (JSON)<\/summary>\r\n        <p class=\"mtn-hint\">Paste the \"Full Meeting JSON\" exported from a previous Meeting Notes record (or the JSON of an old CMS object). The content is resolved and imported into this meeting - merge to continue last week's meeting, or replace to start over from it.<\/p>\r\n        <textarea class=\"mtn-textarea\" id=\"mtn-import-json\" rows=\"6\" placeholder='Paste JSON here - e.g. {\"meeting\":{\"title\":\"...\"},\"subjects\":[...],\"tasks\":[...]}'><\/textarea>\r\n        <div class=\"mtn-import-actions\">\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-primary\" data-act=\"import-analyze\">Analyze<\/button>\r\n        <\/div>\r\n        <div id=\"mtn-import-result\"><\/div>\r\n      <\/details>\r\n\r\n      <details class=\"mtn-card mtn-raw\">\r\n        <summary>Raw notes / transcript (optional)<\/summary>\r\n        <p class=\"mtn-hint\">Paste quick notes or a full transcript here. The AI Assistant reads it when summarizing the meeting or extracting action items.<\/p>\r\n        <textarea class=\"mtn-textarea\" id=\"mtn-raw-notes\" data-field=\"rawnotes\" rows=\"8\" placeholder=\"Paste raw notes here...\"><\/textarea>\r\n      <\/details>\r\n    <\/section>\r\n\r\n    <!-- ── TASKS ── -->\r\n    <section class=\"mtn-pane\" id=\"mtn-pane-tasks\">\r\n      <div class=\"mtn-card\">\r\n        <div class=\"mtn-card-head\">\r\n          <div class=\"mtn-card-title\">Action items<\/div>\r\n          <div class=\"mtn-card-sub\" id=\"mtn-task-stats\"><\/div>\r\n        <\/div>\r\n        <div class=\"mtn-task-filters\">\r\n          <div class=\"mtn-chips\" id=\"mtn-task-filter-status\"><\/div>\r\n          <select class=\"mtn-select mtn-filter-priority\" id=\"mtn-task-filter-priority\">\r\n            <option value=\"all\">All priorities<\/option>\r\n            <option value=\"high\">High<\/option>\r\n            <option value=\"medium\">Medium<\/option>\r\n            <option value=\"low\">Low<\/option>\r\n          <\/select>\r\n          <input class=\"mtn-input mtn-filter-search\" id=\"mtn-task-search\" placeholder=\"Search tasks...\" maxlength=\"80\" />\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" data-act=\"ai-extract\">Extract from AI<\/button>\r\n        <\/div>\r\n      <\/div>\r\n      <div id=\"mtn-tasks\"><\/div>\r\n      <div class=\"mtn-task-add\">\r\n        <div class=\"mtn-task-add-head\">\r\n          <span class=\"mtn-task-add-title\">New action item<\/span>\r\n          <span class=\"mtn-task-add-hint\">Enter adds it to the list<\/span>\r\n        <\/div>\r\n        <textarea class=\"mtn-textarea mtn-task-new-text\" id=\"mtn-task-new-text\" rows=\"2\" placeholder=\"What needs to be done?\" maxlength=\"240\"><\/textarea>\r\n        <div class=\"mtn-task-add-row\">\r\n          <label class=\"mtn-task-meta\"><span>Assignee<\/span><input class=\"mtn-input\" id=\"mtn-task-new-assignee\" placeholder=\"Assign someone\" maxlength=\"80\" /><\/label>\r\n          <label class=\"mtn-task-meta\"><span>Due<\/span><input type=\"date\" class=\"mtn-input\" id=\"mtn-task-new-due\" /><\/label>\r\n          <label class=\"mtn-task-meta\"><span>Priority<\/span><select class=\"mtn-select\" id=\"mtn-task-new-priority\">\r\n            <option value=\"medium\">Medium<\/option>\r\n            <option value=\"high\">High<\/option>\r\n            <option value=\"low\">Low<\/option>\r\n          <\/select><\/label>\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-primary\" data-act=\"add-task\">Add task<\/button>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- ── AI ASSISTANT ── -->\r\n    <section class=\"mtn-pane\" id=\"mtn-pane-ai\">\r\n      <div class=\"mtn-ai-banner\" id=\"mtn-ai-missing\">\r\n        AI features are not enabled for this tool. Ask an admin to set the field setting <code>allowAi: yes<\/code> in the CMS tool configuration.\r\n      <\/div>\r\n\r\n      <div class=\"mtn-card mtn-ai-card\">\r\n        <div class=\"mtn-ai-head\">\r\n          <div>\r\n            <div class=\"mtn-card-title\">Summarize meeting<\/div>\r\n            <div class=\"mtn-card-sub\">Executive summary, key points, decisions and next steps built from your subjects, notes and raw transcript.<\/div>\r\n          <\/div>\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-primary\" data-act=\"ai-summarize\" id=\"mtn-btn-ai-summarize\">Summarize<\/button>\r\n        <\/div>\r\n        <div class=\"mtn-ai-out\" id=\"mtn-ai-summary-out\"><\/div>\r\n      <\/div>\r\n\r\n      <div class=\"mtn-card mtn-ai-card\">\r\n        <div class=\"mtn-ai-head\">\r\n          <div>\r\n            <div class=\"mtn-card-title\">Extract action items<\/div>\r\n            <div class=\"mtn-card-sub\">Reads the meeting and lists the tasks with assignees, due dates and priorities. Review, then merge them into the Tasks tab.<\/div>\r\n          <\/div>\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-primary\" data-act=\"ai-extract\" id=\"mtn-btn-ai-extract\">Extract tasks<\/button>\r\n        <\/div>\r\n        <div class=\"mtn-ai-out\" id=\"mtn-ai-extract-out\"><\/div>\r\n      <\/div>\r\n\r\n      <div class=\"mtn-card mtn-ai-card\">\r\n        <div class=\"mtn-ai-head\">\r\n          <div>\r\n            <div class=\"mtn-card-title\">Draft board minutes<\/div>\r\n            <div class=\"mtn-card-sub\">Formal minutes draft for a board meeting - attendance, agenda, resolutions and signature lines. Copy it or download it as text.<\/div>\r\n          <\/div>\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-primary\" data-act=\"ai-draft\" id=\"mtn-btn-ai-draft\">Draft minutes<\/button>\r\n        <\/div>\r\n        <div class=\"mtn-ai-out\" id=\"mtn-ai-draft-out\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <!-- ── EXPORTS ── -->\r\n    <section class=\"mtn-pane\" id=\"mtn-pane-exports\">\r\n      <h3 class=\"mtn-export-h\">PDF documents<\/h3>\r\n      <div class=\"mtn-export-grid\" id=\"mtn-exports-pdf\"><\/div>\r\n      <h3 class=\"mtn-export-h\">Data files (Excel / JSON)<\/h3>\r\n      <div class=\"mtn-export-grid\" id=\"mtn-exports-data\"><\/div>\r\n      <h3 class=\"mtn-export-h\">Text copies<\/h3>\r\n      <div class=\"mtn-export-grid\" id=\"mtn-exports-text\"><\/div>\r\n    <\/section>\r\n  <\/main>\r\n\r\n  <!-- ── PROJECTION DRAWER (big text for meeting-room screens) ── -->\r\n  <div class=\"mtn-projection\" id=\"mtn-projection\">\r\n    <aside class=\"mtn-project-side\">\r\n      <div class=\"mtn-project-side-head\">\r\n        <span>Subjects<\/span>\r\n        <span class=\"mtn-project-total-spent\" id=\"mtn-proj-total-spent\">Total 0:00<\/span>\r\n        <button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" data-act=\"project-close\">Close<\/button>\r\n      <\/div>\r\n      <div class=\"mtn-project-nav\" id=\"mtn-project-nav\"><\/div>\r\n    <\/aside>\r\n    <div class=\"mtn-project-main\">\r\n      <div class=\"mtn-project-bar\">\r\n        <button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" id=\"mtn-project-side-toggle\" data-act=\"project-side-toggle\" title=\"Collapse / expand the subjects list\">&#9664; Subjects<\/button>\r\n        <button type=\"button\" class=\"mtn-icon-btn\" data-act=\"project-prev\" title=\"Previous subject\">&#8592;<\/button>\r\n        <button type=\"button\" class=\"mtn-icon-btn\" data-act=\"project-next\" title=\"Next subject\">&#8594;<\/button>\r\n        <span class=\"mtn-project-counter\" id=\"mtn-project-counter\"><\/span>\r\n        <div class=\"mtn-project-zoom\">\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" data-act=\"project-smaller\" title=\"Smaller text\">A-<\/button>\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" data-act=\"project-reset\" title=\"Reset text size\">1:1<\/button>\r\n          <button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" data-act=\"project-bigger\" title=\"Larger text\">A+<\/button>\r\n        <\/div>\r\n      <\/div>\r\n      <div class=\"mtn-project-body\" id=\"mtn-project-body\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"MeetingNotes.css","src":"../app/MeetingNotes.css","content":"/* Meeting Notes - boardroom style tool CSS (class prefix mtn-) */\r\n\r\n:root {\r\n  --primary: #1e4e79;\r\n  --primary-soft: #e8f0f8;\r\n  --accent: #0f766e;\r\n  --bg: #f1f5f9;\r\n  --ink: #0f172a;\r\n  --muted: #64748b;\r\n  --line: #e2e8f0;\r\n  --danger: #dc2626;\r\n  --amber: #d97706;\r\n  --green: #15803d;\r\n}\r\n\r\n.mtn-app {\r\n  height: 100vh;\r\n  height: 100dvh;\r\n  display: flex;\r\n  flex-direction: column;\r\n  overflow: hidden;\r\n  background: var(--bg);\r\n  color: var(--ink);\r\n  font-family: system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\r\n  font-size: 14px;\r\n  line-height: 1.5;\r\n}\r\n\r\n.mtn-app * { box-sizing: border-box; }\r\n\r\n/* ── Tab bar ── */\r\n.mtn-tabs {\r\n  flex: 0 0 auto;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 2px;\r\n  background: #ffffff;\r\n  border-bottom: 2px solid var(--line);\r\n  padding: 0 18px;\r\n  overflow-x: auto;\r\n}\r\n\r\n.mtn-tab {\r\n  appearance: none;\r\n  border: none;\r\n  background: none;\r\n  cursor: pointer;\r\n  font: inherit;\r\n  font-weight: 600;\r\n  font-size: 13.5px;\r\n  color: var(--muted);\r\n  padding: 14px 14px 12px;\r\n  border-bottom: 3px solid transparent;\r\n  margin-bottom: -2px;\r\n  white-space: nowrap;\r\n}\r\n\r\n.mtn-tab:hover { color: var(--ink); background: #f8fafc; }\r\n.mtn-tab.active { color: var(--primary); border-bottom-color: var(--primary); }\r\n\r\n.mtn-tab-count {\r\n  display: inline-block;\r\n  min-width: 20px;\r\n  padding: 1px 7px;\r\n  margin-left: 6px;\r\n  border-radius: 999px;\r\n  background: var(--primary-soft);\r\n  color: var(--primary);\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  text-align: center;\r\n}\r\n\r\n.mtn-ro-badge {\r\n  margin-left: auto;\r\n  padding: 3px 12px;\r\n  border-radius: 999px;\r\n  background: #fef3c7;\r\n  color: #92400e;\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  letter-spacing: 0.3px;\r\n}\r\n\r\n/* ── Stage + panes ── */\r\n.mtn-stage {\r\n  flex: 1;\r\n  min-height: 0;\r\n  overflow-y: auto;\r\n  padding: 20px;\r\n}\r\n\r\n.mtn-pane { display: none; }\r\n.mtn-pane.active {\r\n  display: block;\r\n  max-width: 1000px;\r\n  margin: 0 auto;\r\n  animation: mtnFadeIn 0.18s ease;\r\n}\r\n@keyframes mtnFadeIn {\r\n  from { opacity: 0; transform: translateY(6px); }\r\n  to { opacity: 1; transform: translateY(0); }\r\n}\r\n\r\n/* ── Cards ── */\r\n.mtn-card {\r\n  background: #ffffff;\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n  padding: 18px;\r\n  margin-bottom: 16px;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n}\r\n\r\n.mtn-card-head {\r\n  display: flex;\r\n  align-items: baseline;\r\n  justify-content: space-between;\r\n  gap: 12px;\r\n  margin-bottom: 14px;\r\n}\r\n\r\n.mtn-card-title { font-size: 15px; font-weight: 700; color: var(--ink); }\r\n.mtn-card-sub { font-size: 12px; color: var(--muted); }\r\n\r\n.mtn-section-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 12px;\r\n  margin: 4px 0 12px;\r\n}\r\n\r\n/* ── Form fields ── */\r\n.mtn-grid2 {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 14px;\r\n}\r\n.mtn-span2 { grid-column: span 2; }\r\n@media (max-width: 720px) {\r\n  .mtn-grid2 { grid-template-columns: 1fr; }\r\n  .mtn-span2 { grid-column: span 1; }\r\n}\r\n\r\n.mtn-label {\r\n  display: block;\r\n  font-size: 11.5px;\r\n  font-weight: 700;\r\n  letter-spacing: 0.3px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n  margin-bottom: 5px;\r\n}\r\n\r\n.mtn-input, .mtn-select, .mtn-textarea {\r\n  width: 100%;\r\n  font: inherit;\r\n  color: var(--ink);\r\n  background: #ffffff;\r\n  border: 1px solid var(--line);\r\n  border-radius: 8px;\r\n  padding: 8px 10px;\r\n  transition: border-color 0.15s, box-shadow 0.15s;\r\n}\r\n\r\n.mtn-textarea { resize: vertical; min-height: 56px; }\r\n\r\n.mtn-input:focus, .mtn-select:focus, .mtn-textarea:focus {\r\n  outline: none;\r\n  border-color: var(--primary);\r\n  box-shadow: 0 0 0 3px rgba(30, 78, 121, 0.12);\r\n}\r\n\r\n.mtn-input:disabled, .mtn-select:disabled, .mtn-textarea:disabled {\r\n  background: #f8fafc;\r\n  color: var(--muted);\r\n  cursor: not-allowed;\r\n}\r\n\r\n.mtn-hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; }\r\n\r\n/* ── Buttons ── */\r\n.mtn-btn {\r\n  appearance: none;\r\n  border: 1px solid transparent;\r\n  border-radius: 8px;\r\n  padding: 8px 14px;\r\n  font: inherit;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n  transition: background 0.15s, color 0.15s, border-color 0.15s;\r\n}\r\n\r\n.mtn-btn-primary { background: var(--primary); color: #ffffff; }\r\n.mtn-btn-primary:hover { background: #163f63; }\r\n.mtn-btn-ghost { background: #ffffff; color: var(--primary); border-color: var(--line); }\r\n.mtn-btn-ghost:hover { border-color: var(--primary); background: var(--primary-soft); }\r\n.mtn-btn-soft { background: var(--primary-soft); color: var(--primary); }\r\n.mtn-btn-soft:hover { background: #d8e6f4; }\r\n.mtn-btn-danger { background: #fef2f2; color: var(--danger); border-color: #fecaca; }\r\n.mtn-btn-danger:hover { background: #fee2e2; }\r\n.mtn-btn:disabled { opacity: 0.55; cursor: not-allowed; }\r\n\r\n.mtn-icon-btn {\r\n  appearance: none;\r\n  border: 1px solid var(--line);\r\n  background: #ffffff;\r\n  color: var(--muted);\r\n  width: 28px;\r\n  height: 28px;\r\n  border-radius: 7px;\r\n  font-size: 13px;\r\n  line-height: 1;\r\n  cursor: pointer;\r\n  flex: 0 0 auto;\r\n  padding: 0;\r\n}\r\n.mtn-icon-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }\r\n.mtn-icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }\r\n\r\n/* ── Raw notes ── */\r\n.mtn-raw summary {\r\n  cursor: pointer;\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  color: var(--muted);\r\n  user-select: none;\r\n}\r\n.mtn-raw summary:hover { color: var(--primary); }\r\n.mtn-raw[open] summary { margin-bottom: 10px; }\r\n\r\n/* ── Subjects ── */\r\n.mtn-subject { border-left: 4px solid var(--primary); }\r\n\r\n.mtn-head-actions { display: flex; align-items: center; gap: 8px; }\r\n\r\n.mtn-subject-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  margin-bottom: 10px;\r\n}\r\n\r\n.mtn-subject-num {\r\n  flex: 0 0 auto;\r\n  width: 26px;\r\n  height: 26px;\r\n  border-radius: 8px;\r\n  background: var(--primary);\r\n  color: #ffffff;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n}\r\n\r\n.mtn-subject-title {\r\n  flex: 1;\r\n  font-weight: 700;\r\n  font-size: 17px;\r\n  border-color: transparent;\r\n  background: #f8fafc;\r\n}\r\n.mtn-subject-title:focus { background: #ffffff; }\r\n\r\n.mtn-subject-body { display: none; padding-left: 2px; }\r\n.mtn-subject:not(.mtn-subject-collapsed) .mtn-subject-body { display: block; }\r\n\r\n.mtn-subject-notes { margin-bottom: 12px; font-size: 16px; line-height: 1.6; }\r\n\r\n.mtn-decisions-label {\r\n  font-size: 11.5px;\r\n  font-weight: 700;\r\n  letter-spacing: 0.3px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n  margin-bottom: 6px;\r\n}\r\n\r\n.mtn-decision-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  margin-bottom: 6px;\r\n}\r\n.mtn-decision-row .mtn-input { background: #fefce8; border-color: #fde68a; font-size: 15px; }\r\n.mtn-decision-row .mtn-input:focus { background: #ffffff; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12); }\r\n\r\n.mtn-decision-meta {\r\n  font-size: 12px;\r\n  color: var(--muted);\r\n  margin: -2px 0 8px 6px;\r\n}\r\n.mtn-decision-meta b { color: var(--ink); font-weight: 600; }\r\n\r\n.mtn-decision-extra {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 8px;\r\n  margin: -2px 0 10px 6px;\r\n  padding: 10px;\r\n  background: #f8fafc;\r\n  border: 1px solid var(--line);\r\n  border-radius: 8px;\r\n}\r\n@media (max-width: 720px) { .mtn-decision-extra { grid-template-columns: 1fr; } }\r\n\r\n.mtn-subject-empty {\r\n  padding: 26px 12px;\r\n  text-align: center;\r\n  color: var(--muted);\r\n  font-size: 13px;\r\n  background: #ffffff;\r\n  border: 1px dashed var(--line);\r\n  border-radius: 12px;\r\n  margin-bottom: 16px;\r\n}\r\n\r\n/* ── Tasks ── */\r\n.mtn-task-add {\r\n  margin-top: 16px;\r\n  padding: 16px;\r\n  background: #ffffff;\r\n  border: 1px solid var(--line);\r\n  border-radius: 14px;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 10px;\r\n}\r\n\r\n.mtn-task-add-head {\r\n  display: flex;\r\n  align-items: baseline;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n}\r\n\r\n.mtn-task-add-title {\r\n  font-size: 12px;\r\n  font-weight: 800;\r\n  letter-spacing: 1.2px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n}\r\n\r\n.mtn-task-add-hint { font-size: 12px; color: var(--muted); }\r\n\r\n.mtn-task-new-text {\r\n  width: 100%;\r\n  resize: vertical;\r\n  min-height: 64px;\r\n  max-height: 240px;\r\n  font: inherit;\r\n  font-size: 15px;\r\n}\r\n\r\n.mtn-task-add-row {\r\n  display: flex;\r\n  gap: 10px;\r\n  align-items: center;\r\n  flex-wrap: wrap;\r\n}\r\n.mtn-task-add-row .mtn-input,\r\n.mtn-task-add-row .mtn-select { flex: 1 1 140px; min-width: 0; }\r\n.mtn-task-add-row .mtn-btn { flex: 0 0 auto; }\r\n@media (max-width: 720px) {\r\n  .mtn-task-add-row { flex-direction: column; align-items: stretch; }\r\n  .mtn-task-add-row .mtn-btn { width: 100%; }\r\n}\r\n\r\n.mtn-task-filters {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  flex-wrap: wrap;\r\n  padding-top: 12px;\r\n  border-top: 1px solid var(--line);\r\n}\r\n\r\n.mtn-chips { display: flex; gap: 6px; flex-wrap: wrap; }\r\n\r\n.mtn-chip {\r\n  appearance: none;\r\n  border: 1px solid var(--line);\r\n  background: #ffffff;\r\n  color: var(--muted);\r\n  border-radius: 999px;\r\n  padding: 4px 12px;\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  cursor: pointer;\r\n}\r\n.mtn-chip:hover { border-color: var(--primary); color: var(--primary); }\r\n.mtn-chip.active { background: var(--primary); border-color: var(--primary); color: #ffffff; }\r\n\r\n.mtn-filter-priority { width: 140px; }\r\n.mtn-filter-search { width: 190px; }\r\n\r\n.mtn-task-row {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 8px;\r\n  padding: 12px 14px;\r\n  margin-bottom: 10px;\r\n  background: #ffffff;\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);\r\n  transition: border-color 0.12s;\r\n}\r\n.mtn-task-row:focus-within { border-color: var(--primary-soft); }\r\n\r\n.mtn-task-row.mtn-task-done { opacity: 0.62; }\r\n\r\n.mtn-task-row-top {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n}\r\n\r\n.mtn-task-text {\r\n  flex: 1;\r\n  min-width: 0;\r\n  font: inherit;\r\n  font-size: 15px;\r\n  font-weight: 600;\r\n  color: var(--ink);\r\n  border: none;\r\n  background: transparent;\r\n  padding: 2px 0;\r\n  word-break: break-word;\r\n}\r\n.mtn-task-text:focus { outline: none; }\r\n.mtn-task-done .mtn-task-text { text-decoration: line-through; color: var(--muted); }\r\n\r\n.mtn-task-row-meta {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  align-items: center;\r\n  gap: 8px 18px;\r\n}\r\n\r\n.mtn-task-meta {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n}\r\n.mtn-task-meta span {\r\n  font-size: 10.5px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.8px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n  white-space: nowrap;\r\n}\r\n.mtn-task-meta .mtn-input,\r\n.mtn-task-meta .mtn-select {\r\n  padding: 4px 8px;\r\n  font-size: 13px;\r\n}\r\n\r\n.mtn-status-pill {\r\n  appearance: none;\r\n  border: none;\r\n  border-radius: 999px;\r\n  padding: 4px 10px;\r\n  font-size: 11.5px;\r\n  font-weight: 700;\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n}\r\n.mtn-status-pill.st-open { background: #e0f2fe; color: #075985; }\r\n.mtn-status-pill.st-inProgress { background: #fef3c7; color: #92400e; }\r\n.mtn-status-pill.st-done { background: #dcfce7; color: #166534; }\r\n\r\n.mtn-priority {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  padding: 3px 9px;\r\n  border-radius: 6px;\r\n  white-space: nowrap;\r\n}\r\n.mtn-priority.high { background: #fee2e2; color: #991b1b; }\r\n.mtn-priority.medium { background: #fef3c7; color: #92400e; }\r\n.mtn-priority.low { background: #e0f2fe; color: #075985; }\r\n\r\n.mtn-task-empty {\r\n  padding: 26px 12px;\r\n  text-align: center;\r\n  color: var(--muted);\r\n  font-size: 13px;\r\n  background: #ffffff;\r\n  border: 1px dashed var(--line);\r\n  border-radius: 12px;\r\n}\r\n\r\n/* ── AI ── */\r\n.mtn-ai-banner {\r\n  background: #fef3c7;\r\n  border: 1px solid #fde68a;\r\n  color: #92400e;\r\n  border-radius: 12px;\r\n  padding: 12px 16px;\r\n  font-size: 13px;\r\n  margin-bottom: 16px;\r\n}\r\n.mtn-ai-banner code { font-weight: 700; }\r\n\r\n.mtn-ai-head {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  margin-bottom: 10px;\r\n}\r\n@media (max-width: 720px) { .mtn-ai-head { flex-direction: column; } }\r\n\r\n.mtn-ai-out { margin-top: 4px; }\r\n\r\n.mtn-ai-hint {\r\n  color: var(--muted);\r\n  font-size: 12.5px;\r\n  padding: 10px 12px;\r\n  background: #f8fafc;\r\n  border: 1px dashed var(--line);\r\n  border-radius: 8px;\r\n}\r\n\r\n.mtn-ai-result {\r\n  border: 1px solid var(--line);\r\n  border-radius: 10px;\r\n  overflow: hidden;\r\n}\r\n.mtn-ai-result pre {\r\n  margin: 0;\r\n  padding: 14px;\r\n  white-space: pre-wrap;\r\n  word-break: break-word;\r\n  font: inherit;\r\n  font-size: 13px;\r\n  max-height: 340px;\r\n  overflow-y: auto;\r\n  background: #f8fafc;\r\n}\r\n.mtn-ai-actions {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 8px 10px;\r\n  border-top: 1px solid var(--line);\r\n  background: #ffffff;\r\n}\r\n.mtn-ai-saved { margin-left: auto; font-size: 11.5px; color: var(--green); font-weight: 600; }\r\n\r\n.mtn-extract-row {\r\n  display: grid;\r\n  grid-template-columns: 1fr 150px 130px 100px;\r\n  gap: 8px;\r\n  align-items: center;\r\n  padding: 8px 12px;\r\n  border-bottom: 1px solid var(--line);\r\n  font-size: 13px;\r\n}\r\n.mtn-extract-row:last-child { border-bottom: none; }\r\n@media (max-width: 720px) { .mtn-extract-row { grid-template-columns: 1fr; } }\r\n\r\n.mtn-extract-meta { font-size: 11.5px; color: var(--muted); }\r\n.mtn-extract-meta b { color: var(--ink); }\r\n\r\n/* ── Exports ── */\r\n.mtn-export-h {\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  letter-spacing: 0.6px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n  margin: 22px 0 10px;\r\n}\r\n.mtn-export-h:first-child { margin-top: 0; }\r\n\r\n.mtn-export-grid {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 12px;\r\n  margin-bottom: 8px;\r\n}\r\n@media (max-width: 760px) { .mtn-export-grid { grid-template-columns: 1fr; } }\r\n\r\n.mtn-export-card {\r\n  background: #ffffff;\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n  padding: 16px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 10px;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);\r\n}\r\n\r\n.mtn-export-name { font-size: 14px; font-weight: 700; }\r\n.mtn-export-desc { font-size: 12.5px; color: var(--muted); flex: 1; }\r\n.mtn-export-actions { display: flex; gap: 8px; flex-wrap: wrap; }\r\n\r\n/* ── Tooltip-ish status note under exports ── */\r\n.mtn-export-note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }\r\n\r\n/* ── Single-meeting note in the Meeting tab ── */\r\n.mtn-single-note { margin: 12px 0 0; padding: 8px 12px; background: #f8fafc; border: 1px dashed var(--line); border-radius: 8px; }\r\n\r\n/* ── Projection drawer (big text for meeting-room screens) ── */\r\n.mtn-projection {\r\n  display: none;\r\n  position: fixed;\r\n  inset: 0;\r\n  z-index: 9990;\r\n  background: #ffffff;\r\n  flex-direction: row;\r\n}\r\n.mtn-projection.open { display: flex; }\r\n\r\n/* Project button in the Subjects tab - prominent, teal */\r\n.mtn-btn-project {\r\n  background: var(--accent);\r\n  color: #ffffff;\r\n  font-weight: 700;\r\n}\r\n.mtn-btn-project:hover { background: #0b5f59; }\r\n\r\n/* left sidebar: vertical subject list, scrollable, fits any number of subjects */\r\n.mtn-project-side {\r\n  flex: 0 0 300px;\r\n  min-height: 0;\r\n  display: flex;\r\n  flex-direction: column;\r\n  background: #f8fafc;\r\n  border-right: 1px solid var(--line);\r\n}\r\n\r\n.mtn-project-side-head {\r\n  flex: 0 0 auto;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n  padding: 12px 16px;\r\n  border-bottom: 1px solid var(--line);\r\n  font-size: 13px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.8px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n}\r\n\r\n.mtn-project-nav {\r\n  flex: 1;\r\n  min-height: 0;\r\n  overflow-y: auto;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 4px;\r\n  padding: 12px;\r\n}\r\n\r\n.mtn-project-chip {\r\n  display: flex;\r\n  align-items: stretch;\r\n  border: 1px solid transparent;\r\n  background: transparent;\r\n  color: var(--ink);\r\n  border-radius: 10px;\r\n}\r\n.mtn-project-chip:hover { background: #e8f0f8; color: var(--primary); }\r\n.mtn-project-chip.active { background: var(--primary); color: #ffffff; }\r\n\r\n.mtn-chip-body {\r\n  flex: 1;\r\n  min-width: 0;\r\n  display: flex;\r\n  flex-direction: column;\r\n}\r\n\r\n.mtn-project-chip-main {\r\n  appearance: none;\r\n  flex: 1;\r\n  min-width: 0;\r\n  border: none;\r\n  background: transparent;\r\n  color: inherit;\r\n  font-size: 15px;\r\n  font-weight: 600;\r\n  text-align: left;\r\n  cursor: pointer;\r\n  padding: 10px 12px 2px;\r\n  white-space: normal;\r\n  word-break: break-word;\r\n  line-height: 1.3;\r\n}\r\n\r\n.mtn-chip-time {\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  color: var(--muted);\r\n  padding: 0 12px 8px;\r\n  white-space: normal;\r\n  line-height: 1.3;\r\n}\r\n.mtn-project-chip.active .mtn-chip-time { color: rgba(255, 255, 255, 0.85); }\r\n\r\n.mtn-chip-done {\r\n  appearance: none;\r\n  flex: 0 0 auto;\r\n  align-self: center;\r\n  border: none;\r\n  background: transparent;\r\n  color: inherit;\r\n  font-size: 14px;\r\n  font-weight: 800;\r\n  cursor: pointer;\r\n  padding: 10px 2px 10px 12px;\r\n  opacity: 0.5;\r\n}\r\n.mtn-chip-done.done { color: #16a34a; opacity: 1; }\r\n.mtn-project-chip.active .mtn-chip-done.done { color: #bbf7d0; }\r\n\r\n.mtn-project-total-spent {\r\n  margin-left: auto;\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  color: var(--muted);\r\n  white-space: nowrap;\r\n}\r\n\r\n/* waiting / break entry pinned at the bottom of the subjects sidebar */\r\n.mtn-waiting-sep {\r\n  border-top: 1px solid var(--line);\r\n  margin: 8px 4px 4px;\r\n}\r\n\r\n.mtn-waiting-chip { border-color: #dbeafe; background: #eff6ff; }\r\n.mtn-waiting-chip:hover { background: #e0edff; color: var(--primary); }\r\n.mtn-waiting-chip.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }\r\n\r\n.mtn-waiting-chip-time {\r\n  flex: 0 0 auto;\r\n  align-self: center;\r\n  padding: 10px 12px 10px 0;\r\n  font-size: 12px;\r\n  font-weight: 800;\r\n  color: inherit;\r\n  opacity: 0.8;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n/* waiting / break screen in the content area */\r\n.mtn-waiting-screen {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 8px;\r\n  height: 100%;\r\n  min-height: 300px;\r\n  text-align: center;\r\n  padding: 30px;\r\n}\r\n.mtn-waiting-icon { font-size: 44px; line-height: 1; }\r\n.mtn-waiting-label {\r\n  font-size: calc(16px * var(--proj-scale));\r\n  font-weight: 800;\r\n  letter-spacing: 1.5px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n}\r\n.mtn-waiting-time {\r\n  font-size: calc(64px * var(--proj-scale));\r\n  font-weight: 800;\r\n  color: var(--primary);\r\n  font-variant-numeric: tabular-nums;\r\n  line-height: 1.1;\r\n}\r\n.mtn-waiting-note {\r\n  font-size: calc(14px * var(--proj-scale));\r\n  color: var(--muted);\r\n  max-width: 520px;\r\n}\r\n\r\n/* right side: controls bar + big text */\r\n.mtn-project-main {\r\n  flex: 1;\r\n  min-width: 0;\r\n  display: flex;\r\n  flex-direction: column;\r\n}\r\n\r\n.mtn-project-bar {\r\n  flex: 0 0 auto;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 10px 18px;\r\n  border-bottom: 1px solid var(--line);\r\n  background: #f8fafc;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.mtn-project-zoom { display: flex; gap: 6px; margin-left: auto; }\r\n\r\n.mtn-project-counter {\r\n  font-size: 13px;\r\n  color: var(--muted);\r\n  font-weight: 700;\r\n  white-space: nowrap;\r\n}\r\n\r\n.mtn-project-body {\r\n  --proj-scale: 1;\r\n  flex: 1;\r\n  min-height: 0;\r\n  overflow: hidden;\r\n  display: flex;\r\n  flex-direction: column;\r\n  padding: 12px 18px 16px;\r\n  background: #eef2f7;\r\n}\r\n\r\n/* side-by-side layout: main content + side panel */\r\n.mtn-proj-layout {\r\n  flex: 1;\r\n  min-height: 0;\r\n  display: grid;\r\n  gap: 16px;\r\n  align-items: stretch;\r\n  max-width: 1500px;\r\n  width: 100%;\r\n  margin: 0 auto;\r\n}\r\n.mtn-proj-layout-side { grid-template-columns: minmax(0, 1fr) 360px; }\r\n.mtn-proj-layout-bottom {\r\n  grid-template-columns: minmax(0, 1fr);\r\n  grid-template-rows: minmax(0, 1fr) auto;\r\n}\r\n@media (max-width: 980px) {\r\n  .mtn-proj-layout-side {\r\n    grid-template-columns: minmax(0, 1fr);\r\n    grid-template-rows: minmax(0, 1fr) auto;\r\n  }\r\n  .mtn-proj-layout-side .mtn-proj-sidepanel { max-height: 45vh; }\r\n}\r\n.mtn-proj-layout-bottom .mtn-proj-sidepanel { max-height: 45vh; }\r\n\r\n.mtn-proj-main-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }\r\n\r\n.mtn-proj-decisions {\r\n  border: 1px solid var(--line);\r\n  border-radius: 14px;\r\n  background: #ffffff;\r\n  padding: 16px;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n}\r\n\r\n.mtn-proj-decisions-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n  margin-bottom: 12px;\r\n}\r\n\r\n.mtn-proj-decisions-label {\r\n  font-size: calc(13px * var(--proj-scale));\r\n  font-weight: 800;\r\n  letter-spacing: 1.5px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n}\r\n\r\n.mtn-proj-layout-toggle { font-size: 12px; }\r\n\r\n.mtn-proj-no-decisions {\r\n  font-size: calc(15px * var(--proj-scale));\r\n  color: var(--muted);\r\n  padding: 10px 4px 14px;\r\n}\r\n\r\n.mtn-proj-add-decision { margin-top: 12px; }\r\n\r\n/* narrow screens: sidebar collapses into a horizontal strip on top */\r\n@media (max-width: 820px) {\r\n  .mtn-projection { flex-direction: column; }\r\n  .mtn-project-side {\r\n    flex: 0 0 auto;\r\n    max-height: 42vh;\r\n    border-right: none;\r\n    border-bottom: 1px solid var(--line);\r\n  }\r\n  .mtn-project-nav { flex-direction: row; overflow-x: auto; overflow-y: hidden; }\r\n  .mtn-project-chip { white-space: nowrap; }\r\n}\r\n\r\n.mtn-proj-title-input {\r\n  width: 100%;\r\n  font: inherit;\r\n  font-size: calc(28px * var(--proj-scale));\r\n  line-height: 1.15;\r\n  color: var(--primary);\r\n  font-weight: 800;\r\n  margin: 0 0 6px;\r\n  padding: 0;\r\n  border: none;\r\n  border-bottom: 2px solid transparent;\r\n  background: transparent;\r\n  word-break: break-word;\r\n}\r\n.mtn-proj-title-input::placeholder { color: #b6c6d8; }\r\n.mtn-proj-title-input:focus { outline: none; border-bottom-color: var(--primary-soft); }\r\n.mtn-proj-title-input:disabled { border-bottom-color: transparent; cursor: default; }\r\n\r\n.mtn-proj-decision-input {\r\n  width: 100%;\r\n  font: inherit;\r\n  font-size: calc(21px * var(--proj-scale));\r\n  line-height: 1.45;\r\n  color: var(--ink);\r\n  background: transparent;\r\n  border: none;\r\n  padding: 0;\r\n  word-break: break-word;\r\n}\r\n.mtn-proj-decision-input::placeholder { color: #99c2c0; }\r\n.mtn-proj-decision-input:focus { outline: none; }\r\n.mtn-proj-decision-input:disabled { cursor: default; }\r\n\r\n.mtn-proj-decision {\r\n  font-size: calc(21px * var(--proj-scale));\r\n  line-height: 1.45;\r\n  padding: 14px 18px;\r\n  border-left: 5px solid var(--accent);\r\n  background: #f0fdfa;\r\n  border-radius: 0 12px 12px 0;\r\n  margin-bottom: 12px;\r\n  word-break: break-word;\r\n}\r\n\r\n.mtn-proj-decision-meta {\r\n  font-size: calc(15px * var(--proj-scale));\r\n  color: var(--muted);\r\n  margin-top: 6px;\r\n}\r\n.mtn-proj-decision-meta b { color: var(--ink); font-weight: 600; }\r\n\r\n.mtn-proj-empty {\r\n  font-size: calc(22px * var(--proj-scale));\r\n  color: var(--muted);\r\n  text-align: center;\r\n  padding: 60px 20px;\r\n}\r\n\r\n/* ── Meeting Mode rich notes editor (the projected page IS the editor) ── */\r\n.mtn-proj-editor-toolbar {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 2px;\r\n  flex-wrap: wrap;\r\n  flex: 0 0 auto;\r\n  margin: 0 0 8px;\r\n  padding: 4px 6px;\r\n  background: #f8fafc;\r\n  border: 1px solid var(--line);\r\n  border-radius: 10px;\r\n}\r\n.mtn-proj-editor-toolbar .mtn-ed-btn { padding: 4px 8px; font-size: 12px; }\r\n.mtn-proj-editor-toolbar .mtn-ed-swatch { width: 16px; height: 16px; }\r\n.mtn-proj-editor-toolbar .mtn-ed-sep { height: 16px; }\r\n\r\n.mtn-ed-btn {\r\n  appearance: none;\r\n  border: 1px solid transparent;\r\n  background: none;\r\n  color: var(--ink);\r\n  border-radius: 7px;\r\n  padding: 6px 10px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  cursor: pointer;\r\n  line-height: 1.2;\r\n}\r\n.mtn-ed-btn:hover { background: var(--primary-soft); color: var(--primary); }\r\n\r\n.mtn-ed-sep {\r\n  width: 1px;\r\n  height: 20px;\r\n  background: var(--line);\r\n  margin: 0 4px;\r\n}\r\n\r\n.mtn-ed-swatch {\r\n  appearance: none;\r\n  width: 18px;\r\n  height: 18px;\r\n  border-radius: 50%;\r\n  border: 2px solid #ffffff;\r\n  box-shadow: 0 0 0 1px var(--line);\r\n  cursor: pointer;\r\n  padding: 0;\r\n}\r\n.mtn-ed-swatch:hover { box-shadow: 0 0 0 2px var(--primary); }\r\n\r\n.mtn-proj-editor-page {\r\n  flex: 1 1 auto;\r\n  width: 100%;\r\n  min-height: 120px;\r\n  overflow-y: auto;\r\n  font: inherit;\r\n  font-size: calc(24px * var(--proj-scale));\r\n  line-height: 1.5;\r\n  color: var(--ink);\r\n  border: 1px solid var(--line);\r\n  border-radius: 14px;\r\n  background: #ffffff;\r\n  padding: 14px 16px;\r\n  margin: 0;\r\n  outline: none;\r\n  word-break: break-word;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n}\r\n.mtn-proj-editor-page:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 78, 121, 0.12); }\r\n.mtn-proj-editor-page[contenteditable=\"false\"] { cursor: default; }\r\n.mtn-proj-editor-page:empty::before {\r\n  content: 'Write the notes here - they appear on the room screen as you type.';\r\n  color: #a8b6c6;\r\n  pointer-events: none;\r\n}\r\n\r\n/* ── classic rich notes editor (single editable page) ── */\r\n.mtn-proj-editor-page h2 { font-size: calc(30px * var(--proj-scale)); color: var(--primary); margin: 20px 0 10px; line-height: 1.25; }\r\n.mtn-proj-editor-page h3 { font-size: calc(26px * var(--proj-scale)); color: var(--primary); margin: 16px 0 8px; line-height: 1.3; }\r\n.mtn-proj-editor-page h4 { font-size: calc(24px * var(--proj-scale)); color: var(--ink); margin: 14px 0 6px; }\r\n.mtn-proj-editor-page p { margin: 0 0 10px; }\r\n.mtn-proj-editor-page ul, .mtn-proj-editor-page ol { margin: 0 0 12px; padding-left: 1.6em; }\r\n.mtn-proj-editor-page li { margin: 4px 0; }\r\n.mtn-proj-editor-page ul ul, .mtn-proj-editor-page ol ul, .mtn-proj-editor-page ul ol, .mtn-proj-editor-page ol ol { margin-bottom: 0; }\r\n.mtn-proj-editor-page blockquote {\r\n  border-left: 4px solid var(--primary-soft);\r\n  margin: 0 0 12px;\r\n  padding: 4px 16px;\r\n  color: var(--muted);\r\n  font-style: italic;\r\n}\r\n\r\n/* ── Per-subject timer + progress bar (Meeting Mode) - compact strip ── */\r\n.mtn-proj-timer {\r\n  flex: 0 0 auto;\r\n  background: #ffffff;\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n  padding: 6px 12px;\r\n  margin-bottom: 8px;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n}\r\n\r\n.mtn-proj-timer-top {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.mtn-proj-timer-label {\r\n  font-size: calc(11px * var(--proj-scale));\r\n  font-weight: 800;\r\n  letter-spacing: 1.2px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n}\r\n\r\n.mtn-proj-timer-time {\r\n  font-size: calc(20px * var(--proj-scale));\r\n  font-weight: 800;\r\n  color: var(--primary);\r\n  font-variant-numeric: tabular-nums;\r\n  line-height: 1;\r\n}\r\n.mtn-proj-timer-time.over { color: #b91c1c; }\r\n\r\n.mtn-proj-timer-status {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  border-radius: 999px;\r\n  padding: 2px 9px;\r\n  white-space: nowrap;\r\n}\r\n.mtn-proj-timer-status.waiting { background: #e2e8f0; color: #475569; }\r\n.mtn-proj-timer-status.running { background: #dcfce7; color: #166534; }\r\n.mtn-proj-timer-status.over { background: #fee2e2; color: #b91c1c; }\r\n\r\n.mtn-proj-timer-spent {\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  color: var(--muted);\r\n  white-space: nowrap;\r\n}\r\n\r\n.mtn-proj-timer-controls {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  flex-wrap: wrap;\r\n  margin-left: auto;\r\n}\r\n.mtn-proj-timer-controls .mtn-btn { padding: 4px 10px; font-size: 12px; }\r\n\r\n.mtn-proj-timer-quick { display: flex; gap: 4px; flex-wrap: wrap; }\r\n\r\n.mtn-timer-quick-btn {\r\n  appearance: none;\r\n  border: 1px solid var(--line);\r\n  background: #ffffff;\r\n  color: var(--muted);\r\n  border-radius: 999px;\r\n  padding: 3px 9px;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  cursor: pointer;\r\n}\r\n.mtn-timer-quick-btn:hover { border-color: var(--primary); color: var(--primary); }\r\n.mtn-timer-quick-btn.active { background: var(--primary); border-color: var(--primary); color: #ffffff; }\r\n\r\n.mtn-proj-timer-track {\r\n  height: 6px;\r\n  background: #e2e8f0;\r\n  border-radius: 999px;\r\n  overflow: hidden;\r\n  margin-top: 5px;\r\n}\r\n\r\n.mtn-proj-timer-fill {\r\n  height: 100%;\r\n  width: 0%;\r\n  background: var(--accent);\r\n  border-radius: 999px;\r\n  transition: width 0.5s linear;\r\n}\r\n.mtn-proj-timer-fill.over { background: var(--danger); }\r\n\r\n/* ── Tasks + decisions side panel in Meeting Mode ── */\r\n.mtn-proj-sidepanel {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 16px;\r\n  min-width: 0;\r\n  min-height: 0;\r\n  overflow-y: auto;\r\n}\r\n\r\n.mtn-proj-tasks,\r\n.mtn-proj-decisions {\r\n  border: 1px solid var(--line);\r\n  border-radius: 14px;\r\n  background: #ffffff;\r\n  padding: 16px;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n}\r\n\r\n.mtn-proj-panel-head {\r\n  display: flex;\r\n  align-items: baseline;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n  margin-bottom: 10px;\r\n}\r\n\r\n.mtn-proj-panel-note {\r\n  font-size: 11px;\r\n  color: var(--muted);\r\n  font-weight: 600;\r\n}\r\n\r\n.mtn-proj-task-add {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 6px;\r\n  margin-bottom: 10px;\r\n}\r\n.mtn-proj-task-add .mtn-input { font-size: 14px; padding: 6px 9px; width: 100%; }\r\n\r\n.mtn-proj-task-add-row {\r\n  display: flex;\r\n  gap: 6px;\r\n}\r\n.mtn-proj-task-add-row .mtn-input { flex: 1; min-width: 0; }\r\n.mtn-proj-task-add-row .mtn-btn { flex: 0 0 auto; white-space: nowrap; }\r\n\r\n.mtn-proj-task-row {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 6px;\r\n  padding: 9px 10px;\r\n  margin-bottom: 8px;\r\n  border: 1px solid var(--line);\r\n  border-radius: 10px;\r\n  background: #ffffff;\r\n  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);\r\n}\r\n.mtn-proj-task-row.done { opacity: 0.65; }\r\n\r\n.mtn-proj-task-top {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n\r\n.mtn-proj-task-row .mtn-status-pill { flex: 0 0 auto; font-size: 11px; padding: 3px 9px; }\r\n\r\n.mtn-proj-task-input {\r\n  flex: 1;\r\n  min-width: 0;\r\n  font: inherit;\r\n  font-size: calc(17px * var(--proj-scale));\r\n  line-height: 1.4;\r\n  color: var(--ink);\r\n  border: none;\r\n  background: transparent;\r\n  padding: 2px 0;\r\n  word-break: break-word;\r\n}\r\n.mtn-proj-task-input:focus { outline: none; }\r\n.mtn-proj-task-row.done .mtn-proj-task-input { text-decoration: line-through; color: var(--muted); }\r\n\r\n.mtn-proj-task-meta {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 6px 12px;\r\n}\r\n\r\n.mtn-proj-task-meta-item {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n}\r\n.mtn-proj-task-meta-item span {\r\n  font-size: 9.5px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.6px;\r\n  text-transform: uppercase;\r\n  color: var(--muted);\r\n  white-space: nowrap;\r\n}\r\n.mtn-proj-task-meta-item .mtn-input,\r\n.mtn-proj-task-meta-item .mtn-select {\r\n  padding: 3px 7px;\r\n  font-size: 12px;\r\n}\r\n\r\n/* ── Collapsible subjects sidebar ── */\r\n.mtn-projection.side-collapsed .mtn-project-side { display: none; }\r\n\r\n/* ── Subject follow-up status pill (subjects tab) ── */\r\n.mtn-subj-status {\r\n  appearance: none;\r\n  flex: 0 0 auto;\r\n  border: none;\r\n  border-radius: 999px;\r\n  padding: 3px 10px;\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  cursor: pointer;\r\n  background: #e0f2fe;\r\n  color: #075985;\r\n  display: inline-flex;\r\n  align-items: center;\r\n}\r\n.mtn-subj-status.done { background: #dcfce7; color: #166534; }\r\n.mtn-subject-done { opacity: 0.75; }\r\n.mtn-subject-done .mtn-subject-title { text-decoration: line-through; color: var(--muted); }\r\n\r\n/* ── Subjects reading mode (professional agenda view) ── */\r\n.mtn-subject-read { cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s; }\r\n.mtn-subject-read:hover {\r\n  border-color: var(--primary-soft);\r\n  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.09);\r\n}\r\n\r\n.mtn-subject-title-read {\r\n  flex: 1;\r\n  min-width: 0;\r\n  font-size: 19px;\r\n  font-weight: 800;\r\n  color: var(--primary);\r\n  line-height: 1.3;\r\n  word-break: break-word;\r\n}\r\n.mtn-subject-done .mtn-subject-title-read { text-decoration: line-through; color: var(--muted); }\r\n\r\n.mtn-subject-duration {\r\n  flex: 0 0 auto;\r\n  background: #e0f2fe;\r\n  color: #075985;\r\n  border-radius: 999px;\r\n  padding: 2px 9px;\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  white-space: nowrap;\r\n}\r\n\r\n.mtn-subject-spent {\r\n  flex: 0 0 auto;\r\n  background: #fef3c7;\r\n  color: #92400e;\r\n  border-radius: 999px;\r\n  padding: 2px 9px;\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  white-space: nowrap;\r\n}\r\n\r\n.mtn-subject-edit-btn { flex: 0 0 auto; }\r\n.mtn-subject-done-btn { flex: 0 0 auto; }\r\n\r\n.mtn-subject-notes-read {\r\n  font-size: 15.5px;\r\n  line-height: 1.75;\r\n  color: #1e293b;\r\n  padding: 2px 0 8px;\r\n}\r\n.mtn-subject-notes-read p { margin: 0 0 10px; }\r\n.mtn-subject-notes-read h2 { font-size: 18px; color: var(--primary); margin: 14px 0 6px; }\r\n.mtn-subject-notes-read h3 { font-size: 16px; color: var(--primary); margin: 12px 0 4px; }\r\n.mtn-subject-notes-read ul, .mtn-subject-notes-read ol { margin: 0 0 10px; padding-left: 1.5em; }\r\n.mtn-subject-notes-read li { margin: 2px 0; }\r\n.mtn-subject-notes-read blockquote {\r\n  border-left: 3px solid var(--primary-soft);\r\n  margin: 0 0 10px;\r\n  padding: 2px 12px;\r\n  color: var(--muted);\r\n  font-style: italic;\r\n}\r\n\r\n.mtn-subject-notes-empty {\r\n  font-size: 13px;\r\n  color: var(--muted);\r\n  font-style: italic;\r\n  padding: 4px 0 8px;\r\n}\r\n\r\n.mtn-decision-read {\r\n  display: flex;\r\n  gap: 10px;\r\n  align-items: flex-start;\r\n  padding: 10px 12px;\r\n  margin-bottom: 8px;\r\n  border-left: 4px solid var(--accent);\r\n  background: #f0fdfa;\r\n  border-radius: 0 10px 10px 0;\r\n}\r\n.mtn-decision-read-num {\r\n  flex: 0 0 auto;\r\n  font-size: 15px;\r\n  font-weight: 800;\r\n  color: var(--accent);\r\n  line-height: 1.5;\r\n}\r\n.mtn-decision-read-body { min-width: 0; }\r\n.mtn-decision-read-text {\r\n  font-size: 15px;\r\n  font-weight: 600;\r\n  color: var(--ink);\r\n  line-height: 1.5;\r\n  word-break: break-word;\r\n}\r\n.mtn-decision-read-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }\r\n.mtn-decision-read-meta b { color: var(--ink); font-weight: 600; }\r\n\r\n/* ── Import from another meeting ── */\r\n.mtn-import-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }\r\n.mtn-import-preview {\r\n  margin-top: 10px;\r\n  border: 1px solid var(--line);\r\n  border-radius: 10px;\r\n  padding: 12px 14px;\r\n  background: #f8fafc;\r\n}\r\n.mtn-import-found { font-size: 13.5px; color: var(--ink); }\r\n.mtn-import-meta { font-size: 12px; color: var(--muted); margin: 4px 0 10px; }\r\n.mtn-import-error {\r\n  margin-top: 10px;\r\n  border: 1px solid #fecaca;\r\n  background: #fef2f2;\r\n  color: #991b1b;\r\n  border-radius: 10px;\r\n  padding: 10px 14px;\r\n  font-size: 13px;\r\n}\r\n"},"js":{"name":"MeetingNotes.js","src":"../app/MeetingNotes.js","content":"// ── Meeting Notes - meeting minutes tool for the UniconHub CMS html-tool system ──\r\n// Class prefix mtn-. Everything is stored in tool.setValue() (no requestObjects).\r\n// Value shape:\r\n//   { version, meeting{title,date,timestart,timeend,location,chair,minutetaker,attendees},\r\n//     subjects[{id,title,notes,decisions[{id,text}]}],\r\n//     tasks[{id,text,assignee,dueDate,priority,status,source}],\r\n//     rawnotes, ai{summary,minutesDraft} }\r\n(function () {\r\n  'use strict'\r\n\r\n  // ── small helpers ──\r\n  function byId(id) { return document.getElementById(id) }\r\n  function esc(text) {\r\n    return String(text == null ? '' : text)\r\n      .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;')\r\n  }\r\n  function nl2br(text) { return esc(text).replace(/\\n/g, '<br>') }\r\n  function uid() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) }\r\n  function todayIso() {\r\n    var d = new Date()\r\n    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')\r\n  }\r\n  function validIso(value) { return /^\\d{4}-\\d{2}-\\d{2}$/.test(String(value || '')) }\r\n  function clampText(value, max) { return String(value == null ? '' : value).slice(0, max) }\r\n  var MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']\r\n  function fmtDate(iso) {\r\n    if (!validIso(iso)) return ''\r\n    var parts = iso.split('-')\r\n    var day = parseInt(parts[2], 10)\r\n    var month = MONTHS_SHORT[parseInt(parts[1], 10) - 1]\r\n    return day + ' ' + month + ' ' + parts[0]\r\n  }\r\n  // Turkish-aware slugification: strip combining marks before transliteration\r\n  // so dotted I does not turn into \"i-\" artifacts, and map the remaining\r\n  // Turkish-only letters (dotless i included).\r\n  function slugify(text) {\r\n    var normalized = String(text || '').normalize ? String(text || '').normalize('NFKD') : String(text || '')\r\n    var stripped = normalized.replace(/[\\u0300-\\u036f]/g, '')\r\n    var trMap = {\r\n      '\\u00e7': 'c', '\\u00c7': 'c',\r\n      '\\u011f': 'g', '\\u011e': 'g',\r\n      '\\u0131': 'i', '\\u0130': 'i',\r\n      '\\u00f6': 'o', '\\u00d6': 'o',\r\n      '\\u015f': 's', '\\u015e': 's',\r\n      '\\u00fc': 'u', '\\u00dc': 'u'\r\n    }\r\n    var transliterated = stripped.replace(/[\\u00e7\\u00c7\\u011f\\u011e\\u0131\\u0130\\u00f6\\u00d6\\u015f\\u015e\\u00fc\\u00dc]/g, function (ch) { return trMap[ch] })\r\n    return transliterated\r\n      .toLowerCase()\r\n      .replace(/[^a-z0-9]+/g, '-')\r\n      .replace(/^-+|-+$/g, '')\r\n      .slice(0, 60) || 'meeting-notes'\r\n  }\r\n\r\n  var PRIORITIES = ['low', 'medium', 'high']\r\n  var TASK_STATUSES = ['open', 'inProgress', 'done']\r\n  var STATUS_LABELS = { open: 'Open', inProgress: 'In Progress', done: 'Done' }\r\n  var PRIORITY_LABELS = { low: 'Low', medium: 'Medium', high: 'High' }\r\n  var RAWNOTES_MAX = 100000\r\n  var SUMMARY_MAX = 20000\r\n  var DRAFT_MAX = 30000\r\n  var NOTES_HTML_MAX = 30000\r\n\r\n  // ── rich-text notes helpers ──\r\n  var ALLOWED_NOTES_TAGS = { p: 1, div: 1, br: 1, h2: 1, h3: 1, h4: 1, ul: 1, ol: 1, li: 1, b: 1, strong: 1, i: 1, em: 1, u: 1, span: 1, blockquote: 1, font: 1 }\r\n  function sanitizeNotesHtml(htmlText) {\r\n    var out = String(htmlText || '')\r\n    out = out\r\n      .replace(/<script[\\s\\S]*?<\\/script>/gi, '')\r\n      .replace(/<style[\\s\\S]*?<\\/style>/gi, '')\r\n      .replace(/<iframe[\\s\\S]*?<\\/iframe>/gi, '')\r\n      .replace(/\\son\\w+\\s*=\\s*(\"[^\"]*\"|'[^']*'|[^\\s>]+)/gi, '')\r\n      .replace(/(href|src)\\s*=\\s*([\"']?)\\s*javascript:[^\"'\\s>]*\\2/gi, '')\r\n    // unwrap tags that are not whitelisted (keep their text)\r\n    out = out.replace(/<\\/?([a-zA-Z][a-zA-Z0-9]*)(?:\\s[^>]*)?>/g, function (match, tagName) {\r\n      return ALLOWED_NOTES_TAGS[tagName.toLowerCase()] ? match : ''\r\n    })\r\n    // strip attributes from whitelisted tags except span/style and font/color\r\n    out = out.replace(/<([a-zA-Z][a-zA-Z0-9]*)(\\s[^>]*)?>/g, function (match, tagName, attrs) {\r\n      var lower = tagName.toLowerCase()\r\n      attrs = attrs || ''\r\n      if (lower === 'span') {\r\n        var styleMatch = attrs.match(/\\sstyle\\s*=\\s*(\"[^\"]*\"|'[^']*')/i)\r\n        return '<span' + (styleMatch ? styleMatch[0] : '') + '>'\r\n      }\r\n      if (lower === 'font') {\r\n        var colorMatch = attrs.match(/\\scolor\\s*=\\s*(\"[^\"]*\"|'[^']*')/i)\r\n        return '<font' + (colorMatch ? colorMatch[0] : '') + '>'\r\n      }\r\n      return '<' + lower + '>'\r\n    })\r\n    return out.slice(0, NOTES_HTML_MAX)\r\n  }\r\n\r\n  function htmlToPlainText(htmlText) {\r\n    var text = String(htmlText || '')\r\n      .replace(/<br\\s*\\/?>/gi, '\\n')\r\n      .replace(/<\\/(p|div|h[1-6]|ul|ol|blockquote)>/gi, '\\n')\r\n      .replace(/<\\/li>/gi, '\\n')\r\n      .replace(/<li[^>]*>/gi, '\\n\\u2022 ')\r\n      .replace(/<[^>]+>/g, '')\r\n      .replace(/&nbsp;/gi, ' ')\r\n      .replace(/&lt;/g, '<')\r\n      .replace(/&gt;/g, '>')\r\n      .replace(/&amp;/g, '&')\r\n      .replace(/&quot;/g, '\"')\r\n    text = text.replace(/[ \\t]+\\n/g, '\\n').replace(/\\n{3,}/g, '\\n\\n').replace(/^\\n+/, '').replace(/\\n+$/, '')\r\n    return text.slice(0, 20000)\r\n  }\r\n\r\n  function plainTextToNotesHtml(text) {\r\n    return String(text || '').split('\\n').map(function (line) {\r\n      var trimmed = line.trim()\r\n      return trimmed ? '<p>' + esc(trimmed) + '<\/p>' : ''\r\n    }).join('')\r\n  }\r\n\r\n  // ── state ──\r\n  var DB = defaultDatabase()\r\n  var _ui = { tab: 'subjects', taskStatusFilter: 'all', taskPriorityFilter: 'all', taskSearch: '', collapsed: {}, decisionExpanded: {}, projScale: 1, projDecisionsSide: true, projSideCollapsed: false, editingSubjectId: '' }\r\n  var _aiBusy = {}\r\n  var _aiExtracted = null\r\n  var _readOnly = false\r\n  var _user = null\r\n  var _noIdentity = false\r\n  var _permittedUsers = []\r\n  var _persistTimer = null\r\n  var _lastStagedJson = ''\r\n  var _warnedAutosave = false\r\n\r\n  // ── permitted users (object ACL from the CMS) → assignee dropdowns ──\r\n  function loadPermittedUsers() {\r\n    try {\r\n      if (typeof tool.getPermittedUsers === 'function') {\r\n        var users = tool.getPermittedUsers()\r\n        _permittedUsers = Array.isArray(users) ? users : []\r\n      }\r\n    } catch (e) { _permittedUsers = [] }\r\n  }\r\n  function assigneeOptionsHtml(selectedName) {\r\n    var options = '<option value=\"\">- No assignee -<\/option>'\r\n    for (var i = 0; i < _permittedUsers.length; i++) {\r\n      var user = _permittedUsers[i]\r\n      var name = user && user.name ? user.name : ''\r\n      if (!name) continue\r\n      options += '<option value=\"' + esc(name) + '\"' + (selectedName === name ? ' selected' : '') + '>' + esc(name) + '<\/option>'\r\n    }\r\n    return options\r\n  }\r\n  function assigneeFieldHtml(selectedName, attrs) {\r\n    if (!_permittedUsers.length) {\r\n      // fallback: free text input when the CMS gives no permitted users\r\n      return '<input class=\"mtn-input\" value=\"' + esc(selectedName || '') + '\" placeholder=\"Assign someone\" maxlength=\"80\"' + attrs + ' />'\r\n    }\r\n    return '<select class=\"mtn-input\"' + attrs + '>' + assigneeOptionsHtml(selectedName) + '<\/select>'\r\n  }\r\n  function applyAssigneePickers() {\r\n    if (!_permittedUsers.length) return\r\n    var newAssignee = byId('mtn-task-new-assignee')\r\n    if (newAssignee && typeof newAssignee.outerHTML === 'string' && newAssignee.tagNam +\r\n        '<\/div><\/div>'\r\n    } else {\r\n      extractOut.innerHTML = aiOutHint('No extraction yet. Click Extract tasks to read the meeting and list its action items.')\r\n    }\r\n\r\n    var draftOut = byId('mtn-ai-draft-out')\r\n    if (DB.ai.minutesDraft) {\r\n      draftOut.innerHTML =\r\n        '<div class=\"mtn-ai-result\">' +\r\n        '<pre>' + esc(DB.ai.minutesDraft) + '<\/pre>' +\r\n        '<div class=\"mtn-ai-actions\">' +\r\n        '<button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" data-act=\"ai-copy\" data-target=\"draft\">Copy<\/button>' +\r\n        '<button type=\"button\" class=\"mtn-btn mtn-btn-ghost\" data-act=\"ai-download\" data-target=\"draft\">Download .txt<\/button>' +\r\n        '<span class=\"mtn-ai-saved\">Saved with the meeting<\/span>' +\r\n        '<\/div><\/div>'\r\n    } else {\r\n      draftOut.innerHTML = aiOutHint('No draft yet. Click Draft minutes to generate formal board minutes from the meeting.')\r\n    }\r\n  }\r\n\r\n  function renderAiBusyStates() {\r\n    var buttons = {\r\n      'mtn-btn-ai-summarize': 'summarize',\r\n      'mtn-btn-ai-extract': 'extract',\r\n      'mtn-btn-ai-draft': 'draft'\r\n    }\r\n    Object.keys(buttons).forEach(function (id) {\r\n      var button = byId(id)\r\n      if (!button) return\r\n      button.disabled = !!_aiBusy[buttons[id]]\r\n      if (_aiBusy[buttons[id]]) {\r\n        button.textContent = 'Working...'\r\n      } else {\r\n        button.textContent = id === 'mtn-btn-ai-summarize' ? 'Summarize' : (id === 'mtn-btn-ai-extract' ? 'Extract tasks' : 'Draft minutes')\r\n      }\r\n    })\r\n  }\r\n\r\n  function renderAiBanner() {\r\n    byId('mtn-ai-missing').style.display = allowAi() ? 'none' : ''\r\n  }\r\n\r\n  // ── rendering: exports pane ──\r\n  function exportCardHtml(name, description, buttons) {\r\n    return '<div class=\"mtn-export-card\">' +\r\n      '<div class=\"mtn-export-name\">' + esc(name) + '<\/div>' +\r\n      '<div class=\"mtn-export-desc\">' + description + '<\/div>' +\r\n      '<div class=\"mtn-export-actions\">' + buttons + '<\/div>' +\r\n      '<\/div>'\r\n  }\r\n  function exportButtonHtml(label, action) {\r\n    return '<button type=\"button\" class=\"mtn-btn mtn-btn-primary\" data-act=\"' + action + '\">' + label + '<\/button>'\r\n  }\r\n\r\n  function renderExportCards() {\r\n    byId('mtn-exports-pdf').innerHTML =\r\n      exportCardHtml('Meeting Minutes', 'Professional minutes document with agenda, notes per subject, decisions and action items.', exportButtonHtml('Export PDF', 'export-pdf-minutes')) +\r\n      exportCardHtml('Board Meeting Format', 'Formal board format with numbered resolutions, attendance and signature lines.', exportButtonHtml('Export PDF', 'export-pdf-board')) +\r\n      exportCardHtml('Meeting Summary', 'One-page executive summary. Uses the AI summary when one exists.', exportButtonHtml('Export PDF', 'export-pdf-summary')) +\r\n      exportCardHtml('Action Item List', 'All tasks grouped by status with assignees and due dates.', exportButtonHtml('Export PDF', 'export-pdf-tasks'))\r\n\r\n    byId('mtn-exports-data').innerHTML =\r\n      exportCardHtml('Tasks CSV', 'Comma-separated action items - opens directly in Excel.', exportButtonHtml('Download CSV', 'export-tasks-csv')) +\r\n      exportCardHtml('Tasks XLS', 'Styled spreadsheet table for Excel.', exportButtonHtml('Download XLS', 'export-tasks-xls')) +\r\n      exportCardHtml('Tasks JSON', 'Action items as a clean JSON array for other systems.', exportButtonHtml('Download JSON', 'export-tasks-json')) +\r\n      exportCardHtml('Full Meeting JSON', 'Everything in one file: meeting, subjects, decisions, tasks and AI results.', exportButtonHtml('Download JSON', 'export-full-json'))\r\n\r\n    byId('mtn-exports-text').innerHTML =\r\n      exportCardHtml('Markdown Minutes', 'Meeting minutes as Markdown for wikis, repos and shared docs.', exportButtonHtml('Download .md', 'export-markdown')) +\r\n      exportCardHtml('Email-ready Summary', 'Short plain-text summary you can paste straight into an email.', exportButtonHtml('Download .txt', 'export-email-text'))\r\n  }\r\n\r\n  // ── rendering: shared ──\r\n  function updateTabCounts() {\r\n    byId('mtn-count-subjects').textContent = DB.subjects.length\r\n    byId('mtn-count-tasks').textContent = taskCounts().open || DB.tasks.length\r\n  }\r\n\r\n  function applyReadOnlyState() {\r\n    var writable = canWrite()\r\n    byId('mtn-ro-badge').style.display = writable ? 'none' : ''\r\n    var staticEdits = [\r\n      'mtn-meet-title', 'mtn-meet-date', 'mtn-meet-location', 'mtn-meet-timestart', 'mtn-meet-timeend',\r\n      'mtn-meet-chair', 'mtn-meet-minutetaker', 'mtn-meet-attendees', 'mtn-raw-notes',\r\n      'mtn-task-new-text', 'mtn-task-new-assignee', 'mtn-task-new-due', 'mtn-task-new-priority',\r\n      'mtn-task-search', 'mtn-task-filter-priority'\r\n    ]\r\n    staticEdits.forEach(function (id) {\r\n      var element = byId(id)\r\n      if (element) element.disabled = !writable\r\n    })\r\n    var buttons = byId('mtn-app').querySelectorAll('[data-act=\"add-subject\"], [data-act=\"add-task\"]')\r\n    buttons.forEach(function (button) { button.disabled = !writable })\r\n    renderSubjects()\r\n    renderTasks()\r\n    renderAiOutputs()\r\n    renderProjection()\r\n  }\r\n\r\n  function renderAll() {\r\n    syncMeetingInputs()\r\n    renderMeetingMeta()\r\n    renderSubjects()\r\n    renderTaskFilters()\r\n    renderTasks()\r\n    renderAiBanner()\r\n    renderAiOutputs()\r\n    renderAiBusyStates()\r\n    renderExportCards()\r\n    renderProjection()\r\n    updateTabCounts()\r\n    applyReadOnlyState()\r\n    updateValidation()\r\n  }\r\n\r\n  function syncMeetingInputs() {\r\n    var fields = {\r\n      'mtn-meet-title': DB.meeting.title,\r\n      'mtn-meet-date': DB.meeting.date,\r\n      'mtn-meet-location': DB.meeting.location,\r\n      'mtn-meet-timestart': DB.meeting.timestart,\r\n      'mtn-meet-timeend': DB.meeting.timeend,\r\n      'mtn-meet-chair': DB.meeting.chair,\r\n      'mtn-meet-minutetaker': DB.meeting.minutetaker,\r\n      'mtn-meet-attendees': DB.meeting.attendees\r\n    }\r\n    Object.keys(fields).forEach(function (id) {\r\n      var element = byId(id)\r\n      if (element && element.value !== fields[id]) element.value = fields[id]\r\n    })\r\n    var raw = byId('mtn-raw-notes')\r\n    if (raw && raw.value !== DB.rawnotes) raw.value = DB.rawnotes\r\n    var prioritySelect = byId('mtn-task-filter-priority')\r\n    if (prioritySelect && prioritySelect.value !== _ui.taskPriorityFilter) prioritySelect.value = _ui.taskPriorityFilter\r\n    var search = byId('mtn-task-search')\r\n    if (search && search.value !== _ui.taskSearch) search.value = _ui.taskSearch\r\n  }\r\n\r\n  function updateValidation() {\r\n    if (!byId('mtn-app')) return\r\n    var hasContent = DB.subjects.length > 0 || DB.tasks.length > 0 || DB.rawnotes || decisionCount() > 0\r\n    if (!DB.meeting.title && hasContent) {\r\n      try { tool.reportValid(false, 'Enter a meeting title before saving.') } catch (e) { /* no-op */ }\r\n    } else {\r\n      try { tool.reportValid(true) } catch (e) { /* no-op */ }\r\n    }\r\n  }\r\n\r\n  function switchTab(tab) {\r\n    var tabs = ['subjects', 'meeting', 'tasks', 'ai', 'exports']\r\n    if (tabs.indexOf(tab) === -1) tab = 'subjects'\r\n    _ui.tab = tab\r\n    var buttons = byId('mtn-tabs').querySelectorAll('.mtn-tab')\r\n    buttons.forEach(function (button) {\r\n      button.classList.toggle('active', button.getAttribute('data-tab') === tab)\r\n    })\r\n    tabs.forEach(function (paneTab) {\r\n      byId('mtn-pane-' + paneTab).classList.toggle('active', paneTab === tab)\r\n    })\r\n    try { tool.resize() } catch (e) { /* no-op */ }\r\n  }\r\n\r\n  // ── mutations ──\r\n  function addSubject() {\r\n    var subject = { id: uid(), title: '', notes: '', notesHtml: '', status: 'open', durationMinutes: 15, spentMs: 0, decisions: [] }\r\n    DB.subjects.push(subject)\r\n    _ui.collapsed = {}\r\n    _ui.editingSubjectId = subject.id\r\n    persistSoon()\r\n    renderAll()\r\n    focusLastSubjectTitle()\r\n  }\r\n  function focusLastSubjectTitle() {\r\n    var inputs = byId('mtn-subjects').querySelectorAll('.mtn-subject-title')\r\n    if (inputs.length) {\r\n      inputs[inputs.length - 1].focus()\r\n      inputs[inputs.length - 1].scrollIntoView({ block: 'nearest' })\r\n    }\r\n  }\r\n  function moveSubject(id, direction) {\r\n    var index = -1\r\n    for (var i = 0; i < DB.subjects.length; i++) {\r\n      if (DB.subjects[i].id === id) { index = i; break }\r\n    }\r\n    var target = index + direction\r\n    if (index === -1 || target < 0 || target >= DB.subjects.length) return\r\n    var item = DB.subjects.splice(index, 1)[0]\r\n    DB.subjects.splice(target, 0, item)\r\n    persistSoon()\r\n    renderAll()\r\n  }\r\n  function removeSubject(id) {\r\n    DB.subjects = DB.subjects.filter(function (s) { return s.id !== id })\r\n    if (_ui.editingSubjectId === id) _ui.editingSubjectId = ''\r\n    persistSoon()\r\n    renderAll()\r\n  }\r\n  function addDecision(subjectId) {\r\n    var subject = subjectById(subjectId)\r\n    if (!subject) return\r\n    subject.decisions.push({ id: uid(), text: '', movedBy: '', secondedBy: '' })\r\n    persistSoon()\r\n    renderSubjects()\r\n    if (_projectionOpen) {\r\n      renderProjectionBody()\r\n      var projectedInputs = byId('mtn-project-body').querySelectorAll('.mtn-proj-decision-input')\r\n      if (projectedInputs && projectedInputs.length) {\r\n        projectedInputs[projectedInputs.length - 1].focus()\r\n        projectedInputs[projectedInputs.length - 1].scrollIntoView({ block: 'nearest' })\r\n      }\r\n      return\r\n    }\r\n    var lastRow = byId('mtn-subjects').querySelector('[data-subject-id=\"' + subjectId + '\"] .mtn-decision-row:last-of-type input')\r\n    if (lastRow) lastRow.focus()\r\n  }\r\n  function removeDecision(subjectId, decisionId) {\r\n    var subject = subjectById(subjectId)\r\n    if (!subject) return\r\n    subject.decisions = subject.decisions.filter(function (d) { return d.id !== decisionId })\r\n    persistSoon()\r\n    renderSubjects()\r\n  }\r\n  function autoGrowTextarea(element) {\r\n    if (!element || !element.style || typeof element.scrollHeight !== 'number') return\r\n    element.style.height = 'auto'\r\n    element.style.height = Math.min(Math.max(element.scrollHeight, 64), 240) + 'px'\r\n  }\r\n  function addTask() {\r\n    var text = byId('mtn-task-new-text').value.trim()\r\n    if (!text) {\r\n      tryNotify('Enter a task description first.', 'warning')\r\n      return\r\n    }\r\n    var due = byId('mtn-task-new-due').value\r\n    DB.tasks.push({\r\n      id: uid(),\r\n      text: clampText(text, 240),\r\n      assignee: clampText(byId('mtn-task-new-assignee').value.trim(), 80),\r\n      dueDate: validIso(due) ? due : '',\r\n      priority: byId('mtn-task-new-priority').value,\r\n      status: 'open',\r\n      source: 'manual'\r\n    })\r\n    byId('mtn-task-new-text').value = ''\r\n    byId('mtn-task-new-assignee').value = ''\r\n    byId('mtn-task-new-due').value = ''\r\n    autoGrowTextarea(byId('mtn-task-new-text'))\r\n    persistSoon()\r\n    renderAll()\r\n  }\r\n  function cycleTaskStatus(taskId) {\r\n    var task = null\r\n    for (var i = 0; i < DB.tasks.length; i++) {\r\n      if (DB.tasks[i].id === taskId) { task = DB.tasks[i]; break }\r\n    }\r\n    if (!task) return\r\n    var current = TASK_STATUSES.indexOf(task.status)\r\n    task.status = TASK_STATUSES[(current + 1) % TASK_STATUSES.length]\r\n    persistSoon()\r\n    renderTasks()\r\n    renderTaskFilters()\r\n    updateTabCounts()\r\n    renderMeetingMeta()\r\n    if (_projectionOpen) renderProjectionBody()\r\n  }\r\n  function removeTask(taskId) {\r\n    DB.tasks = DB.tasks.filter(function (t) { return t.id !== taskId })\r\n    persistSoon()\r\n    renderAll()\r\n  }\r\n\r\n  // ── input delegation ──\r\n  function handleFieldEdit(element) {\r\n    var field = element.getAttribute('data-field')\r\n    if (!field) return\r\n    if (field === 'rawnotes') {\r\n      DB.rawnotes = clampText(element.value, RAWNOTES_MAX)\r\n    } else if (field.indexOf('meet.') === 0) {\r\n      var key = field.slice(5)\r\n      if (key === 'date' && !validIso(element.value)) element.value = DB.meeting.date\r\n      DB.meeting[key] = element.value\r\n    } else if (field === 'subject.title' || field === 'subject.notes') {\r\n      var subject = subjectById(element.getAttribute('data-subject-id'))\r\n      if (subject) {\r\n        subject[field.slice(8)] = clampText(element.value, field === 'subject.title' ? 160 : 20000)\r\n        if (field === 'subject.notes') subject.notesHtml = plainTextToNotesHtml(subject.notes)\r\n      }\r\n    } else if (field === 'decision.text' || field === 'decision.moved' || field === 'decision.second') {\r\n      var subjectForDecision = subjectById(element.getAttribute('data-subject-id'))\r\n      if (subjectForDecision) {\r\n        var decisionId = element.getAttribute('data-decision-id')\r\n        for (var i = 0; i < subjectForDecision.decisions.length; i++) {\r\n          if (subjectForDecision.decisions[i].id === decisionId) {\r\n            if (field === 'decision.text') subjectForDecision.decisions[i].text = clampText(element.value, 500)\r\n            else if (field === 'decision.moved') subjectForDecision.decisions[i].movedBy = clampText(element.value, 80)\r\n            else subjectForDecision.decisions[i].secondedBy = clampText(element.value, 80)\r\n            break\r\n          }\r\n        }\r\n      }\r\n    } else if (field === 'task.text' || field === 'task.assignee' || field === 'task.due') {\r\n      var taskId = element.getAttribute('data-task-id')\r\n      for (var j = 0; j < DB.tasks.length; j++) {\r\n        if (DB.tasks[j].id === taskId) {\r\n          if (field === 'task.text') DB.tasks[j].text = clampText(element.value, 240)\r\n          else if (field === 'task.assignee') DB.tasks[j].assignee = clampText(element.value, 80)\r\n          else if (field === 'task.due') DB.tasks[j].dueDate = validIso(element.value) ? element.value : ''\r\n          break\r\n        }\r\n      }\r\n    }\r\n    persistSoon()\r\n    updateValidation()\r\n    if (_projectionOpen) renderProjectionNav()\r\n  }\r\n\r\n  function handlePriorityChange(element) {\r\n    var taskId = element.getAttribute('data-task-id')\r\n    if (!taskId) return\r\n    for (var i = 0; i < DB.tasks.length; i++) {\r\n      if (DB.tasks[i].id === taskId) {\r\n        DB.tasks[i].priority = PRIORITIES.indexOf(element.value) !== -1 ? element.value : 'medium'\r\n        break\r\n      }\r\n    }\r\n    persistSoon()\r\n    renderTasks()\r\n  }\r\n\r\n  // ── AI actions ──\r\n  function meetingContextJson() {\r\n    return JSON.stringify({\r\n      meeting: DB.meeting,\r\n      subjects: DB.subjects,\r\n      tasks: DB.tasks,\r\n      rawnotes: DB.rawnotes ? DB.rawnotes.slice(0, 30000) : ''\r\n    }, null, 2)\r\n  }\r\n\r\n  function runAiSummarize() {\r\n    if (!allowAi()) { tryNotify('AI is not enabled (allowAi param).', 'warning'); return }\r\n    if (_aiBusy.summarize) return\r\n    _aiBusy.summarize = true\r\n    renderAiBusyStates()\r\n    var prompt = 'TASK: MEETING_SUMMARY\\nAct as a professional meeting assistant. Summarize the meeting below.\\n' +\r\n      'Respond in ' + aiLanguage() + ' with these sections, each headed with the exact marker:\\n' +\r\n      'EXECUTIVE SUMMARY - 3 to 5 sentences.\\nKEY POINTS - the important discussion points as short bullets.\\nDECISIONS - the decisions made.\\nNEXT STEPS - what happens next.\\n\\nMEETING DATA (JSON):\\n' + meetingContextJson()\r\n    tool.requestAI(prompt, '', function (err, text) {\r\n      _aiBusy.summarize = false\r\n      renderAiBusyStates()\r\n      if (text) {\r\n        DB.ai.summary = clampText(text, SUMMARY_MAX)\r\n        if (canWrite()) persistSoon()\r\n        renderAiOutputs()\r\n        tryNotify('Summary generated and saved with the meeting.', 'success')\r\n      } else if (err) {\r\n        tryNotify('AI error: ' + err, 'error')\r\n      }\r\n    })\r\n  }\r\n\r\n  function runAiExtract() {\r\n    if (!allowAi()) { tryNotify('AI is not enabled (allowAi param).', 'warning'); return }\r\n    if (_aiBusy.extract) return\r\n    _aiBusy.extract = true\r\n    renderAiBusyStates()\r\n    var prompt = 'TASK: EXTRACT_ACTION_ITEMS\\nRead the meeting below and extract every action item (who does what by when).\\n' +\r\n      'Respond with ONLY a JSON array, no prose. Each item: {\"text\":\"task description\",\"assignee\":\"person name or empty string\",\"dueDate\":\"YYYY-MM-DD or empty string\",\"priority\":\"high|medium|low\"}.\\n' +\r\n      'If no action items exist, return []. Language of task text: ' + aiLanguage() + '.\\n\\nMEETING DATA (JSON):\\n' + meetingContextJson()\r\n    tool.requestAI(prompt, '', function (err, text) {\r\n      _aiBusy.extract = false\r\n      renderAiBusyStates()\r\n      if (err && !text) {\r\n        tryNotify('AI error: ' + err, 'error')\r\n        return\r\n      }\r\n      var items = parseAiJsonArray(text)\r\n      if (!items.length) {\r\n        _aiExtracted = null\r\n        renderAiOutputs()\r\n        tryNotify('No action items found in the AI response.', 'warning')\r\n        return\r\n      }\r\n      var existing = DB.tasks.map(function (t) { return t.text.toLowerCase().trim() })\r\n      var extracted = []\r\n      items.forEach(function (item) {\r\n        if (!item || typeof item !== 'object' || !item.text) return\r\n        var cleanText = clampText(String(item.text).trim(), 240)\r\n        if (!cleanText) return\r\n        if (existing.indexOf(cleanText.toLowerCase()) !== -1) return\r\n        existing.push(cleanText.toLowerCase())\r\n        extracted.push({\r\n          id: uid(),\r\n          text: cleanText,\r\n          assignee: clampText(item.assignee, 80),\r\n          dueDate: validIso(item.dueDate) ? item.dueDate
