/* - Mock tool SDK - */
(function() {
  var STORAGE_KEY = 'meeting_notes_test_db';
  var listeners = { valueChange: [], readonlyChange: [], userChange: [] };
  var _readOnly = false;
  var _user = { id: 'usr_test1', name: 'Grace Hopper', email: 'grace@example.com', roles: ['editor'], effectiveAccess: { isViewer: true, isEditor: true, isManager: false }, locale: 'en' };
  var _value = null;

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch(e) { _value = null; }
  }
  function save(v) { _value = v; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch(e) {} }

  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { save(data); listeners.valueChange.forEach(function(cb) { try { cb(data); } catch(e) {} }); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },
    getFields: function() { return {}; },
    setField: function() {},
    setFields: function() {},
    param: function(name, fallback) {
      var p = (new URLSearchParams(window.location.search)).get(name);
      return p !== null && p !== '' ? p : fallback;
    },
    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    _setReadOnly: function(v) { _readOnly = v; listeners.readonlyChange.forEach(function(cb) { try { cb(v); } catch(e) {} }); },
    getUser: function() { return _user; },
    _setUser: function(u) { _user = u; listeners.userChange.forEach(function(cb) { try { cb(u); } catch(e) {} }); },
    onUserChange: function(cb) { listeners.userChange.push(cb); },
    getPermittedUsers: function() {
      return [
        { id: 'u-elif', name: 'Elif Yilmaz' },
        { id: 'u-omar', name: 'Omar Hassan' },
        { id: 'u-amina', name: 'Amina Khan' },
        { id: 'u-mark', name: 'Mark Thompson' },
        { id: 'u-sara', name: 'Sara Ozturk' }
      ];
    },
    onPermittedUsersChange: function(cb) { /* static list in the harness */ },
    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    reportMissingParams: function(missing, msg) { if (missing && missing.length) console.warn('[Missing params]', msg, missing); },
    declareOutput: function() {},
    declareParams: function() {},
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#0d9488', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 2500);
    },
    resize: function() {},
    openUrl: function(url) { window.open(url, '_blank'); },
    requestSave: function(cb) { setTimeout(function() { cb(null, true); }, 50); },
    requestExportPdf: function(options, cb) {
      var html = options.html || document.body.innerHTML;
      try {
        var blob = new Blob([html], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        cb(null, { name: (options.filename || 'export') + '.html', url: url, size: blob.size, type: 'text/html' });
      } catch(e) { cb('Export failed: ' + e.message, null); }
    },
    requestAI: function(prompt, context, cb) {
      setTimeout(function() {
        var q = (prompt || '');
        var answer;
        if (q.indexOf('TASK: EXTRACT_ACTION_ITEMS') !== -1) {
          answer = '[\n' +
            '  {"text": "Prepare the Q4 budget draft for the finance committee", "assignee": "Amina K.", "dueDate": "2026-10-10", "priority": "high"},\n' +
            '  {"text": "Book the venue for the annual general meeting", "assignee": "", "dueDate": "2026-10-15", "priority": "medium"},\n' +
            '  {"text": "Send thank-you notes to campaign donors", "assignee": "Omar H.", "dueDate": "", "priority": "low"}\n' +
            ']';
        } else if (q.indexOf('TASK: DRAFT_MINUTES') !== -1) {
          answer = 'MINUTES OF THE BOARD MEETING\n\nDate: ' + new Date().toISOString().slice(0, 10) + '\n\nATTENDANCE\nPresent: ' +
            'Elif Y., Omar H., Amina K., Mark T.\n\nAGENDA\n1. Financial Review\n2. Q3 Fundraising Campaign\n3. Facility and Logistics\n\n' +
            'RESOLUTIONS\n1. RESOLVED, that the revised fundraising budget of $45,000 is approved.\n\n' +
            'ACTION ITEMS\n- Amina K. - prepare the Q4 budget draft (due 10 Oct 2026)\n- Omar H. - send thank-you notes to donors\n\n' +
            'Next meeting: same time next month.\n\nSigned\n______________\nChair\n\n______________\nSecretary';
        } else if (q.indexOf('TASK: MEETING_SUMMARY') !== -1) {
          answer = 'EXECUTIVE SUMMARY\nThe board reviewed the current financial position, approved the revised Q3 fundraising budget and agreed to defer the office move until the lease renewal.\n\n' +
            'KEY POINTS\n- Cash position is healthy; reserves cover four months of operations.\n- The Q3 campaign is tracking 12% above target.\n- The current office lease expires in March; renewal negotiations start in January.\n\n' +
            'DECISIONS\n- Approve the revised fundraising budget of $45,000.\n- Defer the office relocation decision to the January meeting.\n\n' +
            'NEXT STEPS\n- Finance to prepare the Q4 budget draft.\n- Operations to shortlist two venues for the annual general meeting.';
        } else {
          answer = 'No matching AI task marker found in the prompt.';
        }
        cb(null, answer);
      }, 600);
    },
    onReady: function(cb) { load(); cb(_value, {}); },
    _loadSampleData: function(data) { save(data); window.location.reload(); },
    _clearData: function() { localStorage.removeItem(STORAGE_KEY); window.location.reload(); },
    _toggleReadOnly: function() { this._setReadOnly(!_readOnly); },
    _dump: function() { console.log('Meeting Notes DB:', JSON.parse(JSON.stringify(_value))); }
  };

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); window.tool._toggleReadOnly(); window.tool.notify(window.tool.isReadOnly() ? 'READ-ONLY MODE' : 'EDIT MODE', 'info'); }
    if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault(); window.tool._dump(); window.tool.notify('DB dumped to console', 'info'); }
  });
})();

</script>

(function() {
  var status = document.getElementById('th-status');
  var container = document.getElementById('app-container');

  function loadJS() {
    status.textContent = 'Loading JS...';
    var script = document.createElement('script');
    script.src = 'MeetingNotes.js';
    script.onload = function() { status.textContent = 'Ready - click "Load Sample Data" to test'; };
    script.onerror = function() { status.textContent = 'JS FAILED - check console'; };
    document.body.appendChild(script);
  }

  function injectHTML(html) {
    container.innerHTML = html;
    loadJS();
  }

  status.textContent = 'Fetching HTML...';
  var fallbackTimer = setTimeout(function() {
    status.textContent = 'Using embedded HTML (file:// mode)';
    injectHTML(EMBEDDED_HTML);
  }, 1500);

  fetch('MeetingNotes.html')
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.text();
    })
    .then(function(html) {
      clearTimeout(fallbackTimer);
      status.textContent = 'HTML loaded (live)';
      injectHTML(html);
    })
    .catch(function() { /* fallback already triggered */ });
})();

</script>

  });
  document.getElementById('th-reload').addEventListener('click', function() {
    window.location.reload();
  });

  // QA shortcuts: ?sample=1 loads sample data once, ?role= switches the mock role
  (function() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('sample') === '1') {
      setTimeout(function() {
        var raw = localStorage.getItem('meeting_notes_test_db');
        if (!raw) {
          window.tool._loadSampleData(generateSampleData());
        }
      }, 900);
    }
    var role = params.get('role');
    if (role) {
      var roleMap = {
        admin: { roles: ['admin'], effectiveAccess: { isViewer: true, isEditor: true, isManager: true } },
        editor: { roles: ['editor'], effectiveAccess: { isViewer: true, isEditor: true, isManager: false } },
        viewer: { roles: ['viewer'], effectiveAccess: { isViewer: true, isEditor: false, isManager: false } },
        none: null
      };
      var mapped = roleMap[role];
      if (mapped !== undefined) {
        setTimeout(function() {
          window.tool._setUser(mapped);
          if (role === 'viewer') window.tool._setReadOnly(true);
          window.tool.notify('Role: ' + role, 'info');
        }, 300);
      }
    }
    if (params.get('ro') === '1') {
      setTimeout(function() { window.tool._setReadOnly(true); }, 300);
    }
    if (params.get('bare') === '1') {
      document.body.classList.add('th-bare');
    }
    var page = params.get('page');
    if (page) {
      var pageMap = {
        dashboard: { tab: 'subjects' },
        documents: { tab: 'exports' },
        transactions: { tab: 'tasks' },
        finder: { tab: 'ai' },
        gst: { tab: 'meeting' },
        assistant: { tab: 'subjects', drawer: true },
        reports: { tab: 'exports' },
        settings: { tab: 'meeting' }
      };
      var pageTarget = pageMap[page];
      if (pageTarget) {
        setTimeout(function() {
          var tabButton = document.querySelector('.mtn-tab[data-tab="' + pageTarget.tab + '"]');
          if (tabButton) tabButton.click();
          if (pageTarget.drawer) {
            var projectButton = document.querySelector('.mtn-btn-project');
            if (projectButton) projectButton.click();
          }
        }, 1800);
      }
    }
  })();
