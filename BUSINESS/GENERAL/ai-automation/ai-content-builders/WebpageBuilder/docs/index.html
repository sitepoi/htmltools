laceholder { color: #4b5563; }\n.code-textarea::selection { background: rgba(99, 102, 241, 0.32); color: transparent; }\n.code-textarea::-webkit-scrollbar { width: 10px; height: 10px; }\n.code-textarea::-webkit-scrollbar-thumb { background: #2d333b; border-radius: 6px; }\n.code-textarea::-webkit-scrollbar-track { background: #10141c; }\n.tk-comment { color: #8b949e; font-style: italic; }\n.tk-tag { color: #7ee787; }\n.tk-attr { color: #79c0ff; }\n.tk-string { color: #a5d6ff; }\n.tk-keyword { color: #ff7b72; }\n.tk-num { color: #79c0ff; }\n.tk-punc { color: #8b949e; }\n.tk-prop { color: #79c0ff; }\n.tk-sel { color: #d2a8ff; }\n.tk-at { color: #ff7b72; }\n.tk-builtin { color: #d2a8ff; }\n.params-line { font-size: 11.5px; color: var(--text2); margin-bottom: 4px; }\n.params-line b { color: var(--text); font-weight: 600; }\n.params-admin { color: var(--text3); font-size: 10px; margin-left: 4px; }\n\n/* ── Editor fix: no scrollbar overlap + VS Code-style palette (2026-10-02c) ── */\n.editor-wrap { background: #10141c; }\n.code-textarea::-webkit-scrollbar { display: none; }\n.code-textarea { scrollbar-width: none; }\n.code-textarea::selection { background: rgba(38, 79, 120, 0.5); color: transparent; }\n.editor-hl { color: #d4d4d4; }\n.tk-comment { color: #6a9955; font-style: italic; }\n.tk-tag { color: #569cd6; }\n.tk-attr { color: #9cdcfe; }\n.tk-string { color: #ce9178; }\n.tk-keyword { color: #c586c0; }\n.tk-num { color: #b5cea8; }\n.tk-punc { color: #d4d4d4; }\n.tk-prop { color: #9cdcfe; }\n.tk-sel { color: #d7ba7d; }\n.tk-at { color: #c586c0; }\n.tk-builtin { color: #4fc1ff; }\n\n/* Widget library modal */\n.widget-search {\n  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;\n  font-size: 13px; background: var(--bg2); color: var(--text); margin-bottom: 6px; outline: none;\n}\n.widget-search:focus { border-color: var(--accent); }\n.widget-lib-source { font-size: 11px; color: var(--text3); margin-bottom: 6px; }\n.widget-library-list { max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }\n.widget-row-id { font-size: 10.5px; color: var(--text3); background: var(--bg3); border-radius: 4px; padding: 1px 6px; margin-left: 4px; font-family: var(--font-mono); }\n\n/* ── Page widgets (visual widget list — no HTML editing) ── */\n.page-widget-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); }\n.page-widget-name { font-size: 12.5px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.page-widget-pos { font-size: 10px; color: var(--text3); flex-shrink: 0; }\n.page-widgets-actions { display: flex; gap: 8px; margin-top: 10px; }\n.pw-pos { font-size: 11px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2); color: var(--text2); max-width: 190px; min-width: 0; flex-shrink: 1; }\n\n/* Widget library: count + load-more meta (2026-10-04) */\n.widget-lib-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }\n#widget-lib-count { font-size: 11.5px; color: var(--text2); font-weight: 600; }\n#btn-widget-more { font-size: 11px; }\n\n/* ── Page-widgets modal: meta + island markup + config editor (2026-10-10-2) ── */\n.page-widget-meta { margin: 0 0 10px 6px; padding: 6px 10px; background: var(--bg3); border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }\n.pw-meta-line { font-size: 11px; color: var(--text2); padding: 2px 0; }\n.pw-meta-line b { color: var(--text); font-weight: 600; }\n.pw-details { margin: 4px 0; }\n.pw-details summary { font-size: 11px; font-weight: 600; color: var(--accent); cursor: pointer; user-select: none; padding: 2px 0; }\n.pw-code { margin: 4px 0; padding: 8px 10px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: #1f2937; white-space: pre-wrap; word-break: break-all; }\n.pw-config { width: 100%; margin: 4px 0 6px; padding: 8px 10px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: #1f2937; resize: vertical; }\n\n/* ── Light code editors, no syntax highlight (2026-10-10-2) ── */\n#editor-html, #editor-css, #editor-js { background: #ffffff; }\n#editor-html .code-lines, #editor-css .code-lines, #editor-js .code-lines { background: #f3f4f6; color: #6b7280; border-right-color: #d1d5db; }\n.editor-wrap { background: #ffffff; }\n.editor-hl { display: none; }\n.code-textarea { background: #ffffff; color: #1f2937; caret-color: #111827; -webkit-text-fill-color: #1f2937; }\n.code-textarea::placeholder { color: #9ca3af; }\n.code-textarea::selection { background: rgba(59, 130, 246, 0.25); color: #1f2937; -webkit-text-fill-color: #1f2937; }\n.code-textarea::-webkit-scrollbar { width: 10px; height: 10px; display: block; }\n.code-textarea::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 6px; }\n.code-textarea::-webkit-scrollbar-track { background: #f3f4f6; }\n.code-textarea { scrollbar-width: auto; }\n"},"js":{"name":"WebpageBuilder.js","src":"../app/WebpageBuilder.js","content":"/* build 2026-10-10-3 */\r\n/* ── Webpage Builder ──\r\n   AI-first single-page website design studio.\r\n   Chat-left + Studio-right. Chat handles initial design & iterative refinement.\r\n   Preview updates live on every code change. Built for UniconHub CMS HTML-tool system.\r\n────────────────────────────────────────── */\r\n\r\n/* Tool build stamp — MANDATORY (html-tool-rules GLOBAL REQUIREMENT):\r\n   visible in the UI badge (#tool-build), logged on boot, and stamped as a\r\n   comment at the top of all three files. INCREMENT on EVERY code change. */\r\nvar TOOL_BUILD = '2026-10-10-3';\r\n\r\n/* INLINE-SAFETY RULE (CMS): the platform INLINES this file into one script\r\n   element. The HTML tokenizer treats the sequence '\\u003C!--' (HTML comment\r\n   opener, only ever written in this file as '\\u003C!--') inside script text\r\n   as an escaped state — if no closer appears on the SAME line, later script\r\n   end tags get swallowed as text and the whole file never executes. Builds\r\n   -4 and -5 were dead in the CMS exactly because of the compliance regex\r\n   /^\\u003C!-- v[\\d.]+/. NEVER write the raw comment-opener sequence in this\r\n   file — write '\\u003C!--' (same rendered meaning, tokenizer-safe). */\r\n\r\n/* ── Helpers ── */\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction qs(sel) { return document.querySelector(sel); }\r\nfunction qsa(sel) {\r\n  try { return Array.prototype.slice.call(document.querySelectorAll(sel)); } catch (e) { return []; }\r\n}\r\nfunction esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\r\nfunction debounce(fn, ms) {\r\n  var t = null;\r\n  return function() {\r\n    var args = arguments, self = this;\r\n    if (t) clearTimeout(t);\r\n    t = setTimeout(function() { fn.apply(self, args); }, ms);\r\n  };\r\n}\r\n\r\n/* ── SDK-safe wrappers: a CMS SDK quirk must NEVER kill the UI ── */\r\nfunction _renderBuildBadge() {\r\n  var b = el('tool-build');\r\n  if (b) b.textContent = 'tool build ' + TOOL_BUILD;\r\n}\r\nfunction _resize() { try { tool.resize(); } catch (e) {} }\r\nfunction _bind(id, fn) {\r\n  try { var e = el(id); if (e) e.onclick = fn; } catch (err) {\r\n    console.warn('[WEBPAGEBUILDER:BIND] ' + id + ': ' + (err && err.message ? err.message : err));\r\n  }\r\n}\r\n\r\n/* ── Turkish-safe slugifier (NFKD before transliteration — avoids İ → i- artifacts) ── */\r\nfunction slugify(s) {\r\n  var str = String(s || '').normalize('NFKD').replace(/[\\u0300-\\u036f]/g, '');\r\n  str = str\r\n    .replace(/ş/g, 's').replace(/Ş/g, 's')\r\n    .replace(/ğ/g, 'g').replace(/Ğ/g, 'g')\r\n    .replace(/ü/g, 'u').replace(/Ü/g, 'u')\r\n    .replace(/ö/g, 'o').replace(/Ö/g, 'o')\r\n    .replace(/ç/g, 'c').replace(/Ç/g, 'c')\r\n    .replace(/ı/g, 'i').replace(/İ/g, 'i');\r\n  str = str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');\r\n  return str || 'page';\r\n}\r\n\r\n/* ── State ──\r\n   The SAVED value is slim: only page code + version + session plumbing.\r\n   Version snapshots live as SEPARATE objects (never in this object) so it\r\n   stays far below the 1 MB Firestore document limit. Identity/SEO live on the parent CMS content record;\r\n   design direction comes from ADMIN PARAMETERS (shared across pages);\r\n   chatMessages stay in memory (canonical copy in ai-chat-sessions-uniconbaseapps); history snapshots in webpagebuilder-history-uniconbaseapps. ── */\r\nvar DB = {\r\n  code: { html: '', css: '', js: '' },\r\n  history: [],\r\n  chatMessages: [],   // in-memory — canonical copy in ai-chat-sessions-uniconbaseapps\r\n  chatCache: { sessionId: '', messages: [] }, // bounded fallback kept IN the record value so chat survives even if session storage fails\r\n  seo: null,          // === SEO === JSON from the AI (publicwebsite rules)\r\n  pageMeta: null,     // === PAGE META === JSON from the AI\r\n  configNeeded: '',   // === CMS CONFIG NEEDED === notes for the CMS author\r\n  emailTemplate: '',  // === EMAIL TEMPLATE === artifact (for email hooks)\r\n  activeSessionId: '',\r\n  version: '1.0.0',\r\n  sharedCatalog: [],  // known shared-sources objects (in-memory + localStorage fallback)\r\n  widgetCatalog: [],  // known library widgets from the application store (in-memory + localStorage fallback)\r\n  widgets: []         // widgets added to THIS page (name + config + placement) — rendered in preview & publish, never in the HTML editor\r\n};\r\n\r\nvar _theme = 'light';          // builder UI theme (in-memory only)\r\nvar currentDevice = 'desktop'; // preview device (in-memory only)\r\n\r\nvar isReadOnly = false;\r\nvar currentTab = 'preview';\r\nvar _advSubCurrent = '';   // last active Advanced sub-tab (html/css/js/console/settings/compliance)\r\nvar attachedFile = null;        // { name, url, size, type, extractedText }\r\nvar interviewMode = false;      // Guided interview mode\r\nvar _lastPersistedSnapshot = '';\r\nvar _snapshotInitialized = false;\r\nvar _aiJustUpdated = false;\r\nvar _currentTemplate = null;\r\nvar _aiCallActive = false;\r\nvar _reqToken = null;\r\nvar _streamingMsgEl = null;   // live tabbed streaming bubble (DOM)\r\nvar _streamingMsgIdx = -1;    // index of the streaming placeholder in DB.chatMessages\r\nvar _streamCurrentTab = 'text'; // which tab receives tokens: text|html|css|js\r\nvar _streamTabEls = {};        // { text: <pre>, html: <pre>, css: <pre>, js: <pre> }\r\nvar _streamBuf = '';           // buffer for detecting code-block boundaries\r\nvar _aiTimeoutId = null;       // AI watchdog timer\r\nvar _thinkingTimer = null;\r\nvar _thinkingMsgEl = null;\r\nvar _thinkingStartTime = 0;\r\nvar _lastTokenAt = 0;   // last streamed token time — distinguishes \"working\" from \"waiting\"\r\nvar _streamCallback = null;\r\nvar _pendingScrollId = '';\r\nvar _consoleEntries = [];\r\nvar _previewBuildSeq = 0;   // stamp counter — forces the preview iframe to re-navigate every render\r\nvar _renderWidgets = true;  // preview mode: render widget islands client-side (toggle in the preview toolbar)\r\n\r\n/* ── Session state ── */\r\nvar _sessions = [];\r\nvar _activeSessionId = '';\r\nvar _sessionsLoaded = false;\r\nvar SESSION_TYPE = 'ai-chat-sessions-uniconbaseapps';\r\nvar HISTORY_TYPE = 'webpagebuilder-history-uniconbaseapps'; // version snapshots live as separate objects — the main CMS object stays tiny\r\nvar HISTORY_MAX = 50;\r\nvar _historyMigrated = false; // one-shot migration of legacy `history` arrays found inside the saved value\r\nvar _imagesUpgraded = false; // one-shot: random picsum placeholders → concept-relevant keyword images\r\n\r\n/* ── Shared sources + widget library types ── */\r\nvar SHARED_TYPE = 'shared-sources';\r\nvar WIDGET_TYPE = 'gw-widgets';\r\nvar SHARED_LS = 'webpagebuilder_shared_cache_v1';\r\nvar WIDGET_LS = 'webpagebuilder_widget_cache_v2'; // v2: fixed code classification (js-as-html text bug)\r\n\r\n/* ── Rules text — loaded from embedded DOM element ──\r\n   Priority: admin tool.param('pageRules') → built-in embedded copy of\r\n   generalwebsite-page-rules.txt. ── */\r\nvar pageGuideText = '';\r\n\r\nfunction _decodeEmbedded(t) {\r\n  // The embedded rules text is HTML-entity escaped so it can never terminate\r\n  // the <script type=\"text/plain\"> element. Decode all entities back.\r\n  return String(t || '')\r\n    .replace(/&lt;/g, '<')\r\n    .replace(/&gt;/g, '>')\r\n    .replace(/&amp;/g, '&');\r\n}\r\n\r\nfunction getActiveRules() {\r\n  try {\r\n    var p = tool.param('pageRules', '');\r\n    if (p && String(p).trim().length > 200) return String(p).trim();\r\n  } catch (e) {}\r\n  return pageGuideText || '';\r\n}\r\n\r\nfunction getRulesSourceName() {\r\n  try {\r\n    var p = tool.param('pageRules', '');\r\n    if (p && String(p).trim().length > 200) return 'Admin parameter (pageRules)';\r\n  } catch (e) {}\r\n  return 'Built-in (public-website-page-rules.txt v2.0)';\r\n}\r\n\r\n/* ── Stable instance ID for chat-session isolation ──\r\n   DETERMINISTIC: derived from the parent record id (no random suffix), so it\r\n   recomputes the SAME id on every load — sessions can never be orphaned even\r\n   if the saved value was lost. */\r\nfunction _resolveInstanceId() {\r\n  if (DB._instanceId) return DB._instanceId;\r\n  var parentId = DB._parentRecordId || '';\r\n  if (!parentId) {\r\n    try {\r\n      var m = (window.location.search || '').match(/[?&](?:objectId|recordId|id)=([^&?#]+)/);\r\n      if (m) parentId = decodeURIComponent(m[1]);\r\n    } catch (e) {}\r\n  }\r\n  if (!parentId) {\r\n    try {\r\n      var f = tool.getFields();\r\n      if (f && (f._id || f.id)) parentId = String(f._id || f.id);\r\n    } catch (e) {}\r\n  }\r\n  if (!parentId) {\r\n    try { var p = tool.param('objectId', ''); if (p) parentId = String(p); } catch (e) {}\r\n  }\r\n  if (!parentId) {\r\n    try { var s = tool.param('recordId', ''); if (s) parentId = String(s); } catch (e) {}\r\n  }\r\n  DB._instanceId = parentId ? ('rec_' + parentId) : 'inst_unknown';\r\n  try { persist(); } catch (e) {}\r\n  return DB._instanceId;\r\n}\r\n\r\n/* ── Admin parameter helper — design direction & context shared across pages ── */\r\nfunction _p(name, def) {\r\n  try {\r\n    var v = tool.param(name, def);\r\n    return (v === null || v === undefined || v === '') ? def : String(v);\r\n  } catch (e) { return def; }\r\n}\r\n\r\n/* ── Parent CMS object fields (cached) — page identity, slug and SEO live on the\r\n   object itself, so we read them instead of asking for duplicate parameters ── */\r\nvar _parentFields = null;\r\nfunction _fields() {\r\n  if (_parentFields === null) {\r\n    _parentFields = {};\r\n    try {\r\n      var f = tool.getFields();\r\n      if (f && typeof f === 'object') _parentFields = f;\r\n    } catch (e) {}\r\n  }\r\n  return _parentFields;\r\n}\r\nfunction _parentSlug() {\r\n  var f = _fields();\r\n  return String(f.slug || f.pageSlug || '');\r\n}\r\nfunction _parentBrand() {\r\n  var f = _fields();\r\n  return String(f.brandName || f.brand || f.companyName || f.organizationName || f.title || f.name || '');\r\n}\r\nfunction _parentSeo() {\r\n  var f = _fields();\r\n  var seo = (f.seo && typeof f.seo === 'object') ? f.seo : {};\r\n  return {\r\n    title: String(seo.metaTitle || f.seoTitle || f.title || f.name || ''),\r\n    desc: String(seo.metaDesc || f.seoDesc || ''),\r\n    keywords: String(seo.metaKeywords || f.seoKeywords || '')\r\n  };\r\n}\r\n\r\n/* ── Shared sources (shared-sources objects) + widget library (gw-widgets) ──\r\n   The Shared Sources picker writes pageMeta.data.sections; the Widgets picker\r\n   inserts data-gw-app islands; the forms builder generates data-gw-form\r\n   fragments. Catalogs load via tool.requestObjects with a localStorage\r\n   fallback so preview works even when object CRUD is unavailable. ── */\r\nvar _previewShared = { html: '', css: '', js: '' };\r\nvar _widgetDialogName = '';\r\nvar _widgetEditIndex = -1;  // -1 = ADD mode; >= 0 = edit that DB.widgets entry (config + placement)\r\nvar _formFields = [];\r\nvar _storeTotal = 0;      // total widgets in the store catalog (API v2 objects list)\r\nvar _storeRevealed = 0;   // how many of the loaded catalog are currently revealed (client-side paging)\r\nvar _searchSeq = 0;       // token to discard stale search responses\r\nvar WIDGET_PAGE_SIZE = 100;      // reveal step for client-side paging\r\nvar WIDGET_INITIAL_PAGES = 2;    // how many reveal steps show initially\r\n// NOTE: no built-in platform widgets are listed in the UI — the widget\r\n// library comes from the application store (widgetCatalogUrl API) with a\r\n// fallback to site gw-widgets objects. (D-WB-08)\r\nfunction _lsGet(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }\r\nfunction _lsSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }\r\n\r\nfunction _sectionPicks() {\r\n  var pm = DB.pageMeta;\r\n  var secs = (pm && pm.data && Array.isArray(pm.data.sections)) ? pm.data.sections : [];\r\n  var picks = [];\r\n  for (var i = 0; i < secs.length; i++) {\r\n    if (secs[i] && secs[i].cmsObjectType === SHARED_TYPE && secs[i].objectId) picks.push(secs[i].objectId);\r\n  }\r\n  return picks;\r\n}\r\nfunction _setSectionPicks(picks) {\r\n  if (!DB.pageMeta) DB.pageMeta = {};\r\n  if (!DB.pageMeta.data) DB.pageMeta.data = {};\r\n  var existing = Array.isArray(DB.pageMeta.data.sections) ? DB.pageMeta.data.sections : [];\r\n  var kept = [];\r\n  for (var i = 0; i < existing.length; i++) {\r\n    if (!(existing[i] && existing[i].cmsObjectType === SHARED_TYPE)) kept.push(existing[i])
