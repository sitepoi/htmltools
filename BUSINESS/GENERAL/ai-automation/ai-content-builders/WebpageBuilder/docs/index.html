ow .ff-label { flex: 1 1 140px; min-width: 120px; }\n.form-field-row .ff-type { flex: 0 0 110px; }\n.form-field-row .ff-required { font-size: 11px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }\n.form-field-row input[type=\"text\"], .form-field-row select {\n  border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 12.5px;\n  background: var(--bg2, #fff); color: var(--text, #1e2430);\n}\n@media (max-width: 700px) { .form-builder-grid { grid-template-columns: 1fr; } }\n\n/* ── UI simplification + syntax-highlighted editors (build 2026-10-02b) ── */\n#editor-html, #editor-css, #editor-js { background: #10141c; }\n#editor-html .code-lines, #editor-css .code-lines, #editor-js .code-lines { background: #0d1117; color: #4b5563; border-right-color: #1f2937; }\n.editor-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }\n.editor-hl {\n  position: absolute; inset: 0; margin: 0; padding: 12px 14px;\n  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6;\n  white-space: pre; overflow: hidden; pointer-events: none;\n  color: #e6edf3; background: transparent; tab-size: 2;\n}\n.editor-hl code { font: inherit; white-space: inherit; tab-size: inherit; }\n.code-textarea {\n  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;\n  background: transparent; color: transparent; caret-color: #e6edf3;\n}\n.code-textarea::placeholder { color: #4b5563; }\n.code-textarea::selection { background: rgba(99, 102, 241, 0.32); color: transparent; }\n.code-textarea::-webkit-scrollbar { width: 10px; height: 10px; }\n.code-textarea::-webkit-scrollbar-thumb { background: #2d333b; border-radius: 6px; }\n.code-textarea::-webkit-scrollbar-track { background: #10141c; }\n.tk-comment { color: #8b949e; font-style: italic; }\n.tk-tag { color: #7ee787; }\n.tk-attr { color: #79c0ff; }\n.tk-string { color: #a5d6ff; }\n.tk-keyword { color: #ff7b72; }\n.tk-num { color: #79c0ff; }\n.tk-punc { color: #8b949e; }\n.tk-prop { color: #79c0ff; }\n.tk-sel { color: #d2a8ff; }\n.tk-at { color: #ff7b72; }\n.tk-builtin { color: #d2a8ff; }\n.params-line { font-size: 11.5px; color: var(--text2); margin-bottom: 4px; }\n.params-line b { color: var(--text); font-weight: 600; }\n.params-admin { color: var(--text3); font-size: 10px; margin-left: 4px; }\n\n/* ── Editor fix: no scrollbar overlap + VS Code-style palette (2026-10-02c) ── */\n.editor-wrap { background: #10141c; }\n.code-textarea::-webkit-scrollbar { display: none; }\n.code-textarea { scrollbar-width: none; }\n.code-textarea::selection { background: rgba(38, 79, 120, 0.5); color: transparent; }\n.editor-hl { color: #d4d4d4; }\n.tk-comment { color: #6a9955; font-style: italic; }\n.tk-tag { color: #569cd6; }\n.tk-attr { color: #9cdcfe; }\n.tk-string { color: #ce9178; }\n.tk-keyword { color: #c586c0; }\n.tk-num { color: #b5cea8; }\n.tk-punc { color: #d4d4d4; }\n.tk-prop { color: #9cdcfe; }\n.tk-sel { color: #d7ba7d; }\n.tk-at { color: #c586c0; }\n.tk-builtin { color: #4fc1ff; }\n\n/* Widget library modal */\n.widget-search {\n  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;\n  font-size: 13px; background: var(--bg2); color: var(--text); margin-bottom: 6px; outline: none;\n}\n.widget-search:focus { border-color: var(--accent); }\n.widget-lib-source { font-size: 11px; color: var(--text3); margin-bottom: 6px; }\n.widget-library-list { max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }\n.widget-row-id { font-size: 10.5px; color: var(--text3); background: var(--bg3); border-radius: 4px; padding: 1px 6px; margin-left: 4px; font-family: var(--font-mono); }\n\n/* ── Page widgets (visual widget list — no HTML editing) ── */\n.page-widget-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); }\n.page-widget-name { font-size: 12.5px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.page-widget-pos { font-size: 10px; color: var(--text3); flex-shrink: 0; }\n.page-widgets-actions { display: flex; gap: 8px; margin-top: 10px; }\n.pw-pos { font-size: 11px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2); color: var(--text2); max-width: 190px; min-width: 0; flex-shrink: 1; }\n\n/* Widget library: count + load-more meta (2026-10-04) */\n.widget-lib-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }\n#widget-lib-count { font-size: 11.5px; color: var(--text2); font-weight: 600; }\n#btn-widget-more { font-size: 11px; }\n\n/* ── Page-widgets modal: meta + island markup + config editor (2026-10-10-2) ── */\n.page-widget-meta { margin: 0 0 10px 6px; padding: 6px 10px; background: var(--bg3); border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }\n.pw-meta-line { font-size: 11px; color: var(--text2); padding: 2px 0; }\n.pw-meta-line b { color: var(--text); font-weight: 600; }\n.pw-details { margin: 4px 0; }\n.pw-details summary { font-size: 11px; font-weight: 600; color: var(--accent); cursor: pointer; user-select: none; padding: 2px 0; }\n.pw-code { margin: 4px 0; padding: 8px 10px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: #1f2937; white-space: pre-wrap; word-break: break-all; }\n.pw-config { width: 100%; margin: 4px 0 6px; padding: 8px 10px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: #1f2937; resize: vertical; }\n\n/* ── Light code editors, no syntax highlight (2026-10-10-2) ── */\n#editor-html, #editor-css, #editor-js { background: #ffffff; }\n#editor-html .code-lines, #editor-css .code-lines, #editor-js .code-lines { background: #f3f4f6; color: #6b7280; border-right-color: #d1d5db; }\n.editor-wrap { background: #ffffff; }\n.editor-hl { display: none; }\n.code-textarea { background: #ffffff; color: #1f2937; caret-color: #111827; -webkit-text-fill-color: #1f2937; }\n.code-textarea::placeholder { color: #9ca3af; }\n.code-textarea::selection { background: rgba(59, 130, 246, 0.25); color: #1f2937; -webkit-text-fill-color: #1f2937; }\n.code-textarea::-webkit-scrollbar { width: 10px; height: 10px; display: block; }\n.code-textarea::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 6px; }\n.code-textarea::-webkit-scrollbar-track { background: #f3f4f6; }\n.code-textarea { scrollbar-width: auto; }\n"},"js":{"name":"WebpageBuilder.js","src":"../app/WebpageBuilder.js","content":"/* build 2026-10-10-4 */\n/* ── Webpage Builder ──\n   AI-first single-page website design studio.\n   Chat-left + Studio-right. Chat handles initial design & iterative refinement.\n   Preview updates live on every code change. Built for UniconHub CMS HTML-tool system.\n────────────────────────────────────────── */\n\n/* Tool build stamp — MANDATORY (html-tool-rules GLOBAL REQUIREMENT):\n   visible in the UI badge (#tool-build), logged on boot, and stamped as a\n   comment at the top of all three files. INCREMENT on EVERY code change. */\nvar TOOL_BUILD = '2026-10-10-4';\n\n/* INLINE-SAFETY RULE (CMS): the platform INLINES this file into one script\n   element. The HTML tokenizer treats the sequence '\\u003C!--' (HTML comment\n   opener, only ever written in this file as '\\u003C!--') inside script text\n   as an escaped state — if no closer appears on the SAME line, later script\n   end tags get swallowed as text and the whole file never executes. Builds\n   -4 and -5 were dead in the CMS exactly because of the compliance regex\n   /^\\u003C!-- v[\\d.]+/. NEVER write the raw comment-opener sequence in this\n   file — write '\\u003C!--' (same rendered meaning, tokenizer-safe). */\n\n/* ── Helpers ── */\nfunction el(id) { return document.getElementById(id); }\nfunction qs(sel) { return document.querySelector(sel); }\nfunction qsa(sel) {\n  try { return Array.prototype.slice.call(document.querySelectorAll(sel)); } catch (e) { return []; }\n}\nfunction esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\nfunction debounce(fn, ms) {\n  var t = null;\n  return function() {\n    var args = arguments, self = this;\n    if (t) clearTimeout(t);\n    t = setTimeout(function() { fn.apply(self, args); }, ms);\n  };\n}\n\n/* ── SDK-safe wrappers: a CMS SDK quirk must NEVER kill the UI ── */\nfunction _renderBuildBadge() {\n  var b = el('tool-build');\n  if (b) b.textContent = 'tool build ' + TOOL_BUILD;\n}\nfunction _resize() { try { tool.resize(); } catch (e) {} }\nfunction _bind(id, fn) {\n  try { var e = el(id); if (e) e.onclick = fn; } catch (err) {\n    console.warn('[WEBPAGEBUILDER:BIND] ' + id + ': ' + (err && err.message ? err.message : err));\n  }\n}\n\n/* ── Turkish-safe slugifier (NFKD before transliteration — avoids İ → i- artifacts) ── */\nfunction slugify(s) {\n  var str = String(s || '').normalize('NFKD').replace(/[\\u0300-\\u036f]/g, '');\n  str = str\n    .replace(/ş/g, 's').replace(/Ş/g, 's')\n    .replace(/ğ/g, 'g').replace(/Ğ/g, 'g')\n    .replace(/ü/g, 'u').replace(/Ü/g, 'u')\n    .replace(/ö/g, 'o').replace(/Ö/g, 'o')\n    .replace(/ç/g, 'c').replace(/Ç/g, 'c')\n    .replace(/ı/g, 'i').replace(/İ/g, 'i');\n  str = str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');\n  return str || 'page';\n}\n\n/* ── State ──\n   The SAVED value is slim: only page code + version + session plumbing.\n   Version snapshots live as SEPARATE objects (never in this object) so it\n   stays far below the 1 MB Firestore document limit. Identity/SEO live on the parent CMS content record;\n   design direction comes from ADMIN PARAMETERS (shared across pages);\n   chatMessages stay in memory (canonical copy in ai-chat-sessions-uniconbaseapps); history snapshots in webpagebuilder-history-uniconbaseapps. ── */\nvar DB = {\n  code: { html: '', css: '', js: '' },\n  history: [],\n  chatMessages: [],   // in-memory — canonical copy in ai-chat-sessions-uniconbaseapps\n  chatCache: { sessionId: '', messages: [] }, // bounded fallback kept IN the record value so chat survives even if session storage fails\n  seo: null,          // === SEO === JSON from the AI (publicwebsite rules)\n  pageMeta: null,     // === PAGE META === JSON from the AI\n  configNeeded: '',   // === CMS CONFIG NEEDED === notes for the CMS author\n  emailTemplate: '',  // === EMAIL TEMPLATE === artifact (for email hooks)\n  activeSessionId: '',\n  version: '1.0.0',\n  widgetCatalog: [],  // known library widgets from the application store (in-memory + localStorage fallback)\n  widgets: []         // widgets added to THIS page (name + config + placement) — rendered in preview & publish, never in the HTML editor\n};\n\nvar _theme = 'light';          // builder UI theme (in-memory only)\nvar currentDevice = 'desktop'; // preview device (in-memory only)\n\nvar isReadOnly = false;\nvar currentTab = 'preview';\nvar _advSubCurrent = '';   // last active Advanced sub-tab (html/css/js/console/settings/compliance)\nvar attachedFile = null;        // { name, url, size, type, extractedText }\nvar interviewMode = false;      // Guided interview mode\nvar _lastPersistedSnapshot = '';\nvar _snapshotInitialized = false;\nvar _aiJustUpdated = false;\nvar _currentTemplate = null;\nvar _aiCallActive = false;\nvar _reqToken = null;\nvar _streamingMsgEl = null;   // live tabbed streaming bubble (DOM)\nvar _streamingMsgIdx = -1;    // index of the streaming placeholder in DB.chatMessages\nvar _streamCurrentTab = 'text'; // which tab receives tokens: text|html|css|js\nvar _streamTabEls = {};        // { text: <pre>, html: <pre>, css: <pre>, js: <pre> }\nvar _streamBuf = '';           // buffer for detecting code-block boundaries\nvar _aiTimeoutId = null;       // AI watchdog timer\nvar _thinkingTimer = null;\nvar _thinkingMsgEl = null;\nvar _thinkingStartTime = 0;\nvar _lastTokenAt = 0;   // last streamed token time — distinguishes \"working\" from \"waiting\"\nvar _streamCallback = null;\nvar _pendingScrollId = '';\nvar _consoleEntries = [];\nvar _previewBuildSeq = 0;   // stamp counter — forces the preview iframe to re-navigate every render\nvar _renderWidgets = true;  // preview mode: render widget islands client-side (toggle in the preview toolbar)\n\n/* ── Session state ── */\nvar _sessions = [];\nvar _activeSessionId = '';\nvar _sessionsLoaded = false;\nvar SESSION_TYPE = 'ai-chat-sessions-uniconbaseapps';\nvar HISTORY_TYPE = 'webpagebuilder-history-uniconbaseapps'; // version snapshots live as separate objects — the main CMS object stays tiny\nvar HISTORY_MAX = 50;\nvar _historyMigrated = false; // one-shot migration of legacy `history` arrays found inside the saved value\nvar _imagesUpgraded = false; // one-shot: random picsum placeholders → concept-relevant keyword images\n\n/* ── Widget library types (D-WFLOW-38) ──\n   The site-local widget channel is the object type\n   website-html-tools-local-uniconbaseapps - RENAMED from the old \"gw-widgets\"\n   id because \"gw\" is the page-runtime namespace (window.gw, data-gw-*, the\n   reserved gw-* CSS prefix) and must never appear in a type id; the old id also\n   collided with the platform asset /gw-widgets.js. Per-page shared sources are\n   RETIRED (D-WFLOW-31): the shared-sources type, its sharedMode flag and its\n   localStorage cache are gone - shared content is MANDATORY-only and lives in\n   reserved-slug chrome objects (default-header / default-footer). ── */\nvar WIDGET_TYPE = 'website-html-tools-local-uniconbaseapps';\nvar WIDGET_LS = 'webpagebuilder_widget_cache_v2'; // v2: fixed code classification (js-as-html text bug)\n\n/* ── Rules text — loaded from embedded DOM element ──\n   Priority: admin tool.param('pageRules') → built-in embedded copy of\n   generalwebsite-page-rules.txt. ── */\nvar pageGuideText = '';\n\nfunction _decodeEmbedded(t) {\n  // The embedded rules text is HTML-entity escaped so it can never terminate\n  // the <script type=\"text/plain\"> element. Decode all entities back.\n  return String(t || '')\n    .replace(/&lt;/g, '<')\n    .replace(/&gt;/g, '>')\n    .replace(/&amp;/g, '&');\n}\n\nfunction getActiveRules() {\n  try {\n    var p = tool.param('pageRules', '');\n    if (p && String(p).trim().length > 200) return String(p).trim();\n  } catch (e) {}\n  return pageGuideText || '';\n}\n\nfunction getRulesSourceName() {\n  try {\n    var p = tool.param('pageRules', '');\n    if (p && String(p).trim().length > 200) return 'Admin parameter (pageRules)';\n  } catch (e) {}\n  return 'Built-in (public-website-page-rules.txt v2.0)';\n}\n\n/* ── Stable instance ID for chat-session isolation ──\n   DETERMINISTIC: derived from the parent record id (no random suffix), so it\n   recomputes the SAME id on every load — sessions can never be orphaned even\n   if the saved value was lost. */\nfunction _resolveInstanceId() {\n  if (DB._instanceId) return DB._instanceId;\n  var parentId = DB._parentRecordId || '';\n  if (!parentId) {\n    try {\n      var m = (window.location.search || '').match(/[?&](?:objectId|recordId|id)=([^&?#]+)/);\n      if (m) parentId = decodeURIComponent(m[1]);\n    } catch (e) {}\n  }\n  if (!parentId) {\n    try {\n      var f = tool.getFields();\n      if (f && (f._id || f.id)) parentId = String(f._id || f.id);\n    } catch (e) {}\n  }\n  if (!parentId) {\n    try { var p = tool.param('objectId', ''); if (p) parentId = String(p); } catch (e) {}\n  }\n  if (!parentId) {\n    try { var s = tool.param('recordId', ''); if (s) parentId = String(s); } catch (e) {}\n  }\n  DB._instanceId = parentId ? ('rec_' + parentId) : 'inst_unknown';\n  try { persist(); } catch (e) {}\n  return DB._instanceId;\n}\n\n/* ── Admin parameter helper — design direction & context shared across pages ── */\nfunction _p(name, def) {\n  try {\n    var v = tool.param(name, def);\n    return (v === null || v === undefined || v === '') ? def : String(v);\n  } catch (e) { return def; }\n}\n\n/* ── Parent CMS object fields (cached) — page identity, slug and SEO live on the\n   object itself, so we read them instead of asking for duplicate parameters ── */\nvar _parentFields = null;\nfunction _fields() {\n  if (_parentFields === null) {\n    _parentFields = {};\n    try {\n      var f = tool.getFields();\n      if (f && typeof f === 'object') _parentFields = f;\n    } catch (e) {}\n  }\n  return _parentFields;\n}\nfunction _parentSlug() {\n  var f = _fields();\n  return String(f.slug || f.pageSlug || '');\n}\nfunction _parentBrand() {\n  var f = _fields();\n  return String(f.brandName || f.brand || f.companyName || f.organizationName || f.title || f.name || '');\n}\nfunction _parentSeo() {\n  var f = _fields();\n  var seo = (f.seo && typeof f.seo === 'object') ? f.seo : {};\n  return {\n    title: String(seo.metaTitle || f.seoTitle || f.title || f.name || ''),\n    desc: String(seo.metaDesc || f.seoDesc || ''),\n    keywords: String(seo.metaKeywords || f.seoKeywords || '')\n  };\n}\n\n/* ── Widget library (website-html-tools-local-uniconbaseapps) + forms ──\n   The Widgets picker inserts data-gw-app islands; the forms builder generates\n   data-gw-form fragments. Catalogs load via tool.requestObjects with a\n   localStorage fallback so preview works even when object CRUD is\n   unavailable. Per-page shared sources are RETIRED (D-WFLOW-31). ── */\nvar _widgetDialogName = '';\nvar _widgetEditIndex = -1;  // -1 = ADD mode; >= 0 = edit that DB.widgets entry (config + placement)\nvar _formFields = [];\nvar _storeTotal = 0;      // total widgets in the store catalog (API v2 objects list)\nvar _storeRevealed = 0;   // how many of the loaded catalog are currently revealed (client-side paging)\nvar _searchSeq = 0;       // token to discard stale search respons
