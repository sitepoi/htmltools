iffData = {\r\n        _id: 'd' + Date.now().toString(36),\r\n        html: dHtml, css: dCss, js: dJs,\r\n        stats: {\r\n          html: countStats(dHtml),\r\n          css: countStats(dCss),\r\n          js: countStats(dJs)\r\n        }\r\n      };\r\n\r\n      // Only show tabs if there are actual changes\r\n      var totalChanges = diffData.stats.html.added + diffData.stats.html.removed +\r\n                         diffData.stats.css.added + diffData.stats.css.removed +\r\n                         diffData.stats.js.added + diffData.stats.js.removed;\r\n      if (totalChanges > 0) {\r\n        diffHtml = buildDiffTabs(diffData);\r\n      } else {\r\n        diffHtml = '<p style=\"font-size:11px;color:var(--text3);margin-top:6px\">📊 <b>Changes:<\/b> (no significant line changes detected)<\/p>';\r\n      }\r\n    } else if (hasCode && !isDeveloper()) {\r\n      // Non-developer: simple text summary only, no diff tabs\r\n      var oldTotal = (oldHtml||'').length + (oldCss||'').length + (oldJs||'').length;\r\n      var newTotal = DB.code.html.length + DB.code.css.length + DB.code.js.length;\r\n      if (oldTotal !== newTotal) {\r\n        diffHtml = '<p style=\"font-size:11px;color:var(--text3);margin-top:6px\">📊 <b>Code updated<\/b> — see Preview tab for changes.<\/p>';\r\n      }\r\n    }\r\n\r\n    addChatMessage('ai', summary + '\\n\\n✅ *Code updated.*', false, diffHtml);\r\n    persist();\r\n\r\n    if (!hasCode) switchTab('preview');\r\n    // Auto-review disabled — was doubling request time and Gateway batch path is broken.\r\n    // To re-enable, call runAutoReview() manually from console.\r\n    // runAutoReview();\r\n  } else {\r\n    addChatMessage('ai', response);\r\n  }\r\n}\r\n\r\n/* ── Agentic Auto-Review ── */\r\nfunction runAutoReview() {\r\n  var reviewPrompt = [\r\n    'You just generated an HTML tool for UniconHub CMS. Review YOUR OWN output for compliance with these rules:',\r\n    '',\r\n    '1. HTML block: Contains NO <html>, <head>, <style>, <script>, <body>, or <!DOCTYPE> tags. Body markup only.',\r\n    '2. CSS block: Contains NO <style> tag. Pure CSS rules only.',\r\n    '3. JS block: Contains NO <script> tag. Pure JavaScript only.',\r\n    '4. JS uses tool.onReady(cb) as entry point. No DOMContentLoaded or window.onload.',\r\n    '5. JS uses ONLY ES5: var (not let/const), no spread (...), no template literals (`), no arrow functions (=>), no destructuring, no for...of, no class/Promise/async.',\r\n    '6. JS handles tool.isReadOnly(), tool.resize(), tool.setValue()/getValue().',\r\n    '7. No localStorage, sessionStorage, fetch, alert, confirm, prompt, or raw postMessage in JS.',\r\n    '8. All three blocks are present and complete. No placeholders or TODO comments.',\r\n    '9. HTML event handlers (onclick, onchange) reference functions DEFINED in JS. No dangling calls.',\r\n    '10. HTML is semantic and complete. CSS uses variables and is responsive. JS has error handling.',\r\n    '',\r\n    '=== CURRENT CODE (review this) ===',\r\n    '[HTML]',\r\n    DB.code.html || '(empty)',\r\n    '',\r\n    '[CSS]',\r\n    DB.code.css || '(empty)',\r\n    '',\r\n    '[JS]',\r\n    DB.code.js || '(empty)',\r\n    '',\r\n    'If you find ANY issues, output the CORRECTED three blocks. If everything is already perfect,',\r\n    'respond with \"✅ REVIEW PASSED — no issues found.\" and do NOT output code blocks.',\r\n    'Be strict about the rules. Fix even minor issues. Output format if fixing: [HTML]...[CSS]...[JS]'\r\n  ].join('\\n');\r\n\r\n  showThinkingBubble('AI is reviewing code', true);\r\n\r\n  // Prefer streaming — batch path in AI Gateway returns errorMessage type\r\n  if (typeof tool.requestAIStream === 'function') {\r\n    var reviewText = '';\r\n    tool.requestAIStream(reviewPrompt, '', {\r\n      onToken: function(t) { reviewText += t; if (_streamCallback) _streamCallback(t); },\r\n      onComplete: function() {\r\n        _markThinkingComplete(0);\r\n        applyReviewFixes(reviewText);\r\n        tool.resize();\r\n      },\r\n      onError: function(err) {\r\n        _markThinkingComplete(0);\r\n        console.warn('[VIBECODING] runAutoReview stream error —', err);\r\n        addChatMessage('ai', '🔍 **Auto-review:** Skipped (stream error). Code from first pass is in place.');\r\n        tool.resize();\r\n      }\r\n    });\r\n  } else {\r\n    // Fallback: batch (may not work if Gateway batch path is broken)\r\n    tool.requestAI(reviewPrompt, '', function(err, response) {\r\n      _markThinkingComplete(0);\r\n      if (response && response.length > 10) {\r\n        applyReviewFixes(response);\r\n      } else {\r\n        addChatMessage('ai', '🔍 **Auto-review:** Skipped (batch response empty). Code from first pass is in place.');\r\n      }\r\n      tool.resize();\r\n    });\r\n  }\r\n}\r\n\r\nfunction applyReviewFixes(response) {\r\n  var fixed = parseGeneratedCode(response);\r\n  if (fixed.html || fixed.css || fixed.js) {\r\n    if (fixed.html) DB.code.html = fixed.html;\r\n    if (fixed.css) DB.code.css = fixed.css;\r\n    if (fixed.js) DB.code.js = fixed.js;\r\n    displayAllCode(DB.code);\r\n    // AI auto-review fixed code → bump MINOR\r\n    _aiJustUpdated = true;\r\n    _bumpVersion('minor');\r\n    addChatMessage('ai', '🔍 **Auto-review:** Found and fixed issues for rule compliance. Code updated.');\r\n    persist();\r\n  } else if (response.indexOf('REVIEW PASSED') !== -1 || response.indexOf('no issues') !== -1) {\r\n    addChatMessage('ai', '🔍 **Auto-review:** ✅ All rule checks passed. Code is ready.');\r\n  } else {\r\n    addChatMessage('ai', '🔍 **Auto-review:** ' + response.substring(0, 300));\r\n  }\r\n}\r\n\r\n/* ── Suggestion Detail Prompts ──\r\n   Each suggestion ID maps to a short display title AND a detailed prompt\r\n   that gets added to the chat input when the user clicks a suggestion button.\r\n   The detailed prompt gives the AI more context for a better result.\r\n────────────────────────────────────────── */\r\nvar SUGGEST_DETAILS = {\r\n  suggest_validation: {\r\n    title: 'Add input validation & error messages',\r\n    detail: 'Please add input validation throughout the tool. For every form field, validate that required fields are not empty, email fields contain valid emails, numbers are within reasonable ranges, and dates are valid. Show clear error messages next to each invalid field in red text. Disable the submit/save button until all validation passes. Use tool.notify() for summary errors.'\r\n  },\r\n  suggest_search: {\r\n    title: 'Add search/filter functionality',\r\n    detail: 'Please add a search bar and filter capabilities to this tool. Add a text search input at the top that filters the list/table in real-time as the user types (filter by name, description, or any relevant text fields). Add dropdown filters for key categories (status, type, date range, etc.). Show a \"No results found\" message when filters return empty. Make sure filtering works together with sorting.'\r\n  },\r\n  suggest_export: {\r\n    title: 'Add CSV or PDF export',\r\n    detail: 'Please add data export functionality. Add an \"Export\" button that provides options to export the current data as CSV (for spreadsheets) or as a print-friendly PDF layout. For CSV: generate proper comma-separated values with a header row and trigger a download. For PDF: use a printable layout that formats the data neatly with the tool name as the title. Show a tool.notify() success message after export.'\r\n  },\r\n  suggest_darkmode: {\r\n    title: 'Add dark mode toggle',\r\n    detail: 'Please add a dark mode / light mode toggle to this tool. Add a toggle button (sun/moon icon) in the header. Define CSS variables for both themes using [data-theme=\"dark\"] and [data-theme=\"light\"] selectors. Save the user\\'s preference using tool.setValue() so it persists across sessions. Apply smooth transitions on color changes. Make sure all text, backgrounds, borders, and shadows adapt properly in both modes.'\r\n  },\r\n  suggest_sort: {\r\n    title: 'Add sortable columns / drag-to-reorder',\r\n    detail: 'Please add sorting and reordering capabilities. Make table column headers clickable to sort ascending/descending with a visual arrow indicator. Support sorting by text, numbers, and dates. If the layout uses cards, add drag-and-drop reordering with visual feedback during the drag. Save the sort order and custom ordering via tool.setValue().'\r\n  },\r\n  suggest_print: {\r\n    title: 'Add print-friendly layout',\r\n    detail: 'Please add a print-friendly layout with a \"Print\" button. Add a @media print CSS block that hides navigation, buttons, and shadows, adjusts font sizes for paper, and ensures tables fit the page width. Show the tool name and date in the print header. Use page-break-inside: avoid on table rows and cards. The print layout should look professional and clean.'\r\n  },\r\n  suggest_responsive: {\r\n    title: 'Improve mobile/tablet responsiveness',\r\n    detail: 'Please improve the responsive design for mobile phones and tablets. Add CSS media queries at breakpoints 768px (tablet) and 480px (mobile). On small screens: stack columns vertically, make tables horizontally scrollable or switch to card layout, increase touch targets to at least 44px, reduce font sizes slightly, and ensure modals and forms are full-width. Test that all buttons and inputs are easily tappable on mobile.'\r\n  },\r\n  suggest_undo: {\r\n    title: 'Add undo/redo or confirmation dialogs',\r\n    detail: 'Please add undo capability and confirmation dialogs for destructive actions. Before any delete, clear, or reset action, show a confirmation dialog with a clear warning message and Cancel/Confirm buttons. Track the last 10 actions in an undo stack and show an \"Undo\" button or toast after each action. Use tool.notify() to show what was undone. Disable undo when the stack is empty.'\r\n  },\r\n  suggest_autosave: {\r\n    title: 'Add auto-save / draft persistence',\r\n    detail: 'Please add auto-save functionality. Save form data automatically to tool.setValue() after the user stops typing for 1.5 seconds (debounce). Show a small \"Saving...\" / \"Saved\" indicator near the save button or in the header. When the tool loads, restore any auto-saved draft. If there is unsaved data and the user tries to leave or reset, show a confirmation warning.'\r\n  },\r\n  suggest_dashboard: {\r\n    title: 'Add summary dashboard or stats view',\r\n    detail: 'Please add a dashboard or summary statistics view. Show key metrics at the top: total count, active items, completed items, overdue items, etc. Use card-style stat boxes with large numbers and labels. Add simple visual indicators like progress bars, color coding (green/yellow/red), or percentage complete. The dashboard should update automatically when the underlying data changes.'\r\n  },\r\n  suggest_import: {\r\n    title: 'Add bulk import from file',\r\n    detail: 'Please add bulk data import functionality. Add an \"Import\" button that uses tool.requestUpload() to accept CSV or JSON files. Parse the uploaded file content (use tool.requestFileContent() for extraction) and validate each row before adding. Show a preview of the first 5 rows before confirming the import. Report how many records were imported and any errors via tool.notify(). Support merging with existing data or replacing all data.'\r\n  },\r\n  suggest_notify: {\r\n    title: 'Add in-app notifications or reminders',\r\n    detail: 'Please add a notification/reminder system. Show a notification bell icon with an unread count badge. Track events like approaching due dates, status changes, or assigned tasks. Display notifications in a dropdown panel when the bell is clicked. Mark notifications as read when viewed. Optionally allow setting custom reminders with a date and note. Save notification state via tool.setValue().'\r\n  },\r\n  suggest_roles: {\r\n    title: 'Add user roles & permissions',\r\n    detail: 'Please add role-based access control. Define roles like Admin, Editor, and Viewer using tool.getUser() and tool.getPermittedUsers(). Admins can create, edit, and delete all records. Editors can create and edit but not delete. Viewers can only view (respect tool.isReadOnly()). Show/hide action buttons based on the user\\'s role. Display the current user\\'s role and name in the header. When in read-only mode, disable all inputs and hide save/delete buttons.'\r\n  },\r\n  suggest_history: {\r\n    title: 'Add change history / audit log',\r\n    detail: 'Please add a change history or audit log. Track every create, edit, and delete action with timestamp, user name (from tool.getUser()), action type, and a brief description of what changed. Display the history in a timeline or table view, sorted newest first. Add a \"View History\" button on each record. Allow filtering the log by action type or date range. Store history entries alongside the main data using tool.setValue().'\r\n  },\r\n  suggest_reports: {\r\n    title: 'Add report generation',\r\n    detail: 'Please add report generation capabilities. Create a \"Reports\" section or tab that lets users generate summary reports. Include options for date range filtering, grouping by category/status/type, and showing totals and averages. Display results in a formatted table with subtotals. Add a \"Print Report\" button that opens a print-friendly view. Optionally allow exporting the report as CSV.'\r\n  },\r\n  suggest_calendar: {\r\n    title: 'Add calendar / date-picker view',\r\n    detail: 'Please add a calendar view for date-based data. Show a monthly calendar grid with event/item dots on dates that have entries. Allow clicking a date to see all items for that day in a side panel or popup. Include month navigation (prev/next arrows) and a \"Today\" button. Highlight the current date. Add a date-picker input for forms that shows a mini calendar dropdown instead of requiring manual date typing.'\r\n  },\r\n  suggest_form: {\r\n    title: 'Add e' },\r\n    { id: 'suggest_notify', text: 'Add in-app notifications or reminders' },\r\n    { id: 'suggest_roles', text: 'Add user roles & permissions' },\r\n    { id: 'suggest_history', text: 'Add change history / audit log' },\r\n    { id: 'suggest_reports', text: 'Add report generation' },\r\n    { id: 'suggest_calendar', text: 'Add calendar / date-picker view' },\r\n    { id: 'suggest_form', text: 'Add more form fields for richer data entry' }\r\n  ];\r\n  // Filter out suggestions that overlap with enabled features\r\n  var enabled = DB.features || [];\r\n  var candidates = [];\r\n  for (var i = 0; i < all.length; i++) {\r\n    var s = all[i];\r\n    // Skip if feature already enabled (crude check by keyword)\r\n    var skip = false;\r\n    for (var j = 0; j < enabled.length; j++) {\r\n      if (s.id.indexOf(enabled[j]) !== -1 || enabled[j].indexOf(s.id.replace('suggest_','')) !== -1) {\r\n        skip = true; break;\r\n      }\r\n    }\r\n    if (!skip) candidates.push(s);\r\n  }\r\n  // Shuffle and pick 4-5\r\n  for (var k = candidates.length - 1; k > 0; k--) {\r\n    var ri = Math.floor(Math.random() * (k + 1));\r\n    var tmp = candidates[k]; candidates[k] = candidates[ri]; candidates[ri] = tmp;\r\n  }\r\n  var picked = candidates.slice(0, Math.min(5, candidates.length));\r\n  // Return as formatted lines\r\n  var lines = [];\r\n  for (var p = 0; p < picked.length; p++) {\r\n    lines.push('[[' + picked[p].id + ']] ' + picked[p].text);\r\n  }\r\n  return lines.join('\\n');\r\n}\r\n\r\nfunction extractSummary(text) {\r\n  // Snag suggestion lines BEFORE stripping code blocks (they live after [JS])\r\n  var suggestLines = [];\r\n  var suggestRe = /^\\[\\[suggest_[a-zA-Z0-9_-]+\\]\\]\\s+.+$/gm;\r\n  var sm;\r\n  while ((sm = suggestRe.exec(text)) !== null) {\r\n    suggestLines.push(sm[0]);\r\n  }\r\n\r\n  // ── Line-by-line state machine to strip code blocks ──\r\n  // More robust than regex — won't leak CSS when markers appear out of order,\r\n  // when code contains marker-like strings, or when AI mixes fence styles.\r\n  var lines = text.split('\\n');\r\n  var result = [];\r\n  var inCodeBlock = false;   // true when inside [HTML]/[CSS]/[JS] or ``` fence\r\n\r\n  for (var i = 0; i < lines.length; i++) {\r\n    var line = lines[i];\r\n    var trimmed = line.trim();\r\n\r\n    // Detect marker-style block starts: [HTML], [CSS], [JS] (case-insensitive)\r\n    if (/^\\[HTML\\]/i.test(trimmed) || /^\\[CSS\\]/i.test(trimmed) || /^\\[JS\\]/i.test(trimmed)) {\r\n      inCodeBlock = true;\r\n      continue;\r\n    }\r\n\r\n    // Detect markdown fence starts: ```html, ```css, ```js, ```javascript\r\n    if (/^```(html|css|js|javascript)/i.test(trimmed)) {\r\n      inCodeBlock = true;\r\n      continue;\r\n    }\r\n\r\n    // Detect markdown fence end: ```  (only when inside a code block)\r\n    if (trimmed === '```' && inCodeBlock) {\r\n      inCodeBlock = false;\r\n      continue;\r\n    }\r\n\r\n    // Skip suggestion lines from the summary body (re-appended later)\r\n    if (/^\\[\\[suggest_[a-zA-Z0-9_-]+\\]\\]/.test(trimmed)) continue;\r\n\r\n    // Keep lines that are NOT inside a code block\r\n    if (!inCodeBlock) {\r\n      result.push(line);\r\n    }\r\n  }\r\n\r\n  var cleaned = result.join('\\n').replace(/\\n{3,}/g, '\\n\\n').trim();\r\n\r\n  // Append suggestions at the end\r\n  if (suggestLines.length > 0) {\r\n    if (cleaned) cleaned += '\\n\\n';\r\n    cleaned += suggestLines.join('\\n');\r\n  }\r\n\r\n  // Show up to 3000 chars of the AI's commentary — the bubble scrolls now\r\n  if (cleaned.length > 3000) cleaned = cleaned.substring(0, 3000) + '...';\r\n  return cleaned || 'Here are the updated files:';\r\n}\r\n\r\nfunction addChatMessage(role, text, isError, diffHtml) {\r\n  if (!Array.isArray(DB.chatMessages)) DB.chatMessages = [];\r\n  var user = tool.getUser() || {};\r\n  DB.chatMessages.push({\r\n    role: role, text: text, time: new Date().toISOString(), isError: !!isError,\r\n    userId: role === 'ai argetPre.scrollTop = targetPre.scrollHeight;\r\n      }\r\n    }\r\n  }\r\n\r\n  // Auto-scroll chat to bottom — but only if user hasn't scrolled up\r\n  var chatContainer = el('chat-messages');\r\n  if (chatContainer) {\r\n    var distFromBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;\r\n    if (distFromBottom < 80) {\r\n      chatContainer.scrollTop = chatContainer.scrollHeight;\r\n    }\r\n  }\r\n}\r\n\r\nfunction _finalizeStreamingMessage(fullText, hasCode) {\r\n  // Remove the placeholder streaming message — processAIResponse will add the final version\r\n  if (_streamingMsgIdx >= 0 && _streamingMsgIdx < DB.chatMessages.length) {\r\n    DB.chatMessages.splice(_streamingMsgIdx, 1);\r\n  }\r\n  _streamingMsgEl = null;\r\n  _streamingMsgIdx = -1;\r\n  _streamTabEls = {};\r\n  _streamCurrentTab = 'text';\r\n  _streamBuf = '';\r\n  _setAiUIActive(false);\r\n  // Now process the full response normally (adds the proper final message)\r\n  updateConnStatus('ok');\r\n  processAIResponse(fullText, hasCode);\r\n  clearAttachment();\r\n  tool.resize();\r\n}\r\n\r\nfunction updateConnStatus(status) {\r\n  _connStatus = status;\r\n  var dot = el('chat-conn-status');\r\n  if (dot) { dot.className = 'chat-status-dot ' + status; dot.title = status === 'ok' ? 'Ready' : status === 'busy' ? 'AI working...' : 'Error — check console'; }\r\n}\r\n\r\n/* Toggle AI-active UI state: disable send button + input, show/hide stop button */\r\nfunction _setAiUIActive(active) {\r\n  var sendBtn = el('btn-chat-send');\r\n  var stopBtn = el('btn-chat-stop');\r\n  var input = el('chat-input');\r\n  if (sendBtn) { sendBtn.disabled = active; sendBtn.style.opacity = active ? '0.4' : ''; }\r\n  if (stopBtn) stopBtn.style.display = active ? '' : 'none';\r\n  if (input) { input.disabled = active; input.style.opacity = active ? '0.5' : ''; }\r\n}\r\n\r\nfunction setAiTimeout(promptLen) {\r\n  clearAiTimeout();\r\n  _aiTimeoutId = setTimeout(function() {\r\n    console.warn('[VIBECODING:TIMEOUT] 🔴 AI request timed out after 600 seconds');\r\n    console.warn('  promptChars:', promptLen, 'estTokens:', Math.round(promptLen / 4));\r\n    console.warn('  _aiCallActive was:', _aiCallActive);\r\n    console.warn('  _connStatus was:', _connStatus);\r\n    console.warn('  Likely cause: AI Gateway never called back — check JWT token and Gateway connectivity');\r\n    _aiCallActive = false;\r\n    _markThinkingComplete(600000); // timed out\r\n    var devStatusTO = document.getElementById('dev-raw-status');\r\n    if (devStatusTO) devStatusTO.textContent = '⏰ Timed out after 600s';\r\n    _setAiUIActive(false);\r\n    var errMsg = '⏰ **AI request timed out after 600 seconds.**\\n\\n' +\r\n      'Possible causes:\\n' +\r\n      '• The AI Gateway or model is overloaded\\n' +\r\n      '• Prompt too large? (' + promptLen.toLocaleString() + ' chars — dynamic limit based on model)\\n' +\r\n      '• Network issue between browser and AI Gateway\\n' +\r\n      '• allowAi parameter not set to \"yes\"\\n\\n' +\r\n      '🔧 Try sending again or simplifying your request.';\r\n    addChatMessage('ai', errMsg, true);\r\n    updateConnStatus('error');\r\n    tool.resize();\r\n  }, 605000); // 600s AI timeout + 5s buffer\r\n}\r\n\r\nfunction clearAiTimeout() {\r\n  if (_aiTimeoutId) { clearTimeout(_aiTimeoutId); _aiTimeoutId = null; }\r\n}\r\n\r\nfunction cancelAiRequest() {\r\n  console.warn('[VIBECODING] Request CANCELLED by user');\r\n  _aiCallActive = false;\r\n  clearAiTimeout();\r\n  _setAiUIActive(false);\r\n  _markThinkingComplete(0); // will fade out\r\n  // Update dev panel status\r\n  var devStatus = document.getElementById('dev-raw-status');\r\n  if (devStatus) devStatus.textContent = '⏹ Cancelled';\r\n  updateConnStatus('error');\r\n  addChatMessage('ai', '⏹ **Request cancelled.** You can try again or check your AI configuration.', true);\r\n  tool.resize();\r\n}\r\n\r\n/* ── Console capture from preview iframe ── */\r\nfunction initConsoleCapture() {\r\n  window.addEventListener('message', function(e) {\r\n    if (e.data && e.data.vibeConsole) {\r\n      var entry = e.data.vibeConsole;\r\n      _consoleEntries.push(entry);\r\n      if (_consoleEntries.length > 500) _consoleEntries.shift();\r\n      if (currentTab === 'console') renderConsole();\r\n      updateConsoleBadge();\r\n    }\r\n  });\r\n}\r\n\r\nfunction renderConsole() {\r\n  var out = el('console-output');\r\n  if (!out) return;\r\n  if (!_consoleEntries.length) {\r\n    out.innerHTML = '<div class=\"console-empty\">🪲 Console output from preview will appear here.<br>Click buttons in the Preview tab and watch for logs.<\/div>';\r\n    return;\r\n  }\r\n  var html = '';\r\n  for (var i = 0; i < _consoleEntries.length; i++) {\r\n    var e = _consoleEntries[i];\r\n    var cls = e.level === 'error' ? 'console-err' : e.level === 'warn' ? 'console-warn' : 'console-log';\r\n    var time = '';\r\n    try { time = new Date(e.time).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch(ex) {}\r\n    html += '<div class=\"console-line ' + cls + '\"><span class=\"console-time\">' + time + '<\/span> ' + esc(e.msg) + '<\/div>';\r\n  }\r\n  out.innerHTML = html;\r\n  out.scrollTop = out.scrollHeight;\r\n  el('console-count').textContent = _consoleEntries.length + ' entries';\r\n}\r\n\r\nfunction updateConsoleBadge() {\r\n  // Update tab badge if needed\r\n}\r\n\r\nfunction clearConsole() {\r\n  _consoleEntries = [];\r\n  renderConsole();\r\n}\r\n\r\nfunction appendStreamToken(token) {\r\n  if (!_thinkingMsgEl) return;\r\n  var stream = _thinkingMsgEl.querySelector('#think-stream');\r\n  if (stream) {\r\n    // Hide \"Thinking…\" label on first content\r\n    var label = _thinkingMsgEl.querySelector('#think-stream-label');\r\n    if (label && stream.textContent === '') label.style.display = 'none';\r\n    stream.textContent += token;\r\n    _thinkingMsgEl.scrollTop = _thinkingMsgEl.scrollHeight;\r\n    var container = el('chat-messages');\r\n    if (container) {\r\n      var dist = container.scrollHeight - container.scrollTop - container.clientHeight;\r\n      if (dist < 80) container.scrollTop = container.scrollHeight;\r\n    }\r\n  }\r\n}\r\n\r\nfunction hideThinkingBubble() {\r\n  if (_thinkingTimer) { clearInterval(_thinkingTimer); _thinkingTimer = null; }\r\n  if (_thinkingMsgEl) {\r\n    _thinkingMsgEl.style.opacity = '0';\r\n    _thinkingMsgEl.style.transform = 'translateY(-8px)';\r\n    _thinkingMsgEl.style.transition = 'opacity 0.2s, transform 0.2s';\r\n    var el = _thinkingMsgEl;\r\n    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 200);\r\n    _thinkingMsgEl = null;\r\n  }\r\n}\r\n\r\n/* ── Mark the thinking bubble as complete (keep it visible briefly) ── */\r\nfunction _markThinkingComplete(elapsedMs) {\r\n  if (_thinkingTimer) { clearInterval(_thinkingTimer); _thinkingTimer = null; }\r\n  if (!_thinkingMsgEl) return;\r\n  var bubble = _thinkingMsgEl;\r\n  var label = bubble.querySelector('#think-label');\r\n  var dots = bubble.querySelector('.chat-thinking-dots');\r\n  var icon = bubble.querySelector('.think-icon');\r\n  var cancel = bubble.querySelector('#think-cancel');\r\n  var timeEl = bubble.querySelector('#think-time');\r\n  if (label) label.textContent = '✓ Complete in ' + (elapsedMs/1000).toFixed(1) + 's';\r\n  if (dots) dots.style.display = 'none';\r\n  if (icon) { icon.textContent = '✅'; icon.style.animation = 'none'; }\r\n  if (cancel) cancel.style.display = 'none';\r\n  var secs = Math.floor(elapsedMs / 1000);\r\n  var mins = Math.floor(secs / 60);\r\n  if (timeEl) timeEl.textContent = mins + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60);\r\n  // Fade out after 4 seconds\r\n  var el = bubble;\r\n  setTimeout(function() {\r\n    if (el && el.parentNode) {\r\n      el.style.opacity = '0';\r\n      el.style.transition = 'opacity 0.5s';\r\n      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 500);\r\n    }\r\n  }, 4000);\r\n}\r\n\r\n/* ── Developer raw response panel (now tab-based) ── */\r\nfunction _updateDevPanel() {\r\n  var content = document.getElementById('dev-raw-content');\r\n  if (content) {\r\n    content.textContent = _devRawContent;\r\n    content.scrollTop = content.scrollHeight;\r\n  }\r\n}\r\n\r\nfunction _showDevPanel() {\r\n  if (!isDeveloper()) return;\r\n  _devRawContent = '';\r\n  var content = document.getElementById('dev-raw-content');\r\n  if (content) content.textContent = '';\r\n  var status = document.getElementById('dev-raw-status');\r\n  if (status) status.textContent = '⏳ Streaming…';\r\n  // Also clear the prompt content (it gets set once at send time)\r\n}\r\n\r\nfunction _hideDevPanel() {\r\n  // No-op: tabs replace the old close button\r\n}\r\n\r\n/* ── Chat Tab Switching ── */\r\nfunction switchChatTab(tabName) {\r\n  _activeChatTab = tabName;\r\n  // Update tab button states\r\n  var allTabs = document.querySelectorAll('.chat-tab');\r\n  for (var i = 0; i < allTabs.length; i++) {\r\n    allTabs[i].classList.toggle('active', allTabs[i].getAttribute('data-chat-tab') === tabName);\r\n  }\r\n  // Update tab panel visibility\r\n  var allPanels = document.querySelectorAll('.chat-tab-panel');\r\n  for (var j = 0; j < allPanels.length; j++) {\r\n    allPanels[j].classList.toggle('active', allPanels[j].getAttribute('data-chat-panel') === tabName);\r\n  }\r\n  // Show chat input & attachment only on the Chat tab\r\n  var inputArea = document.querySelector('.chat-input-area');\r\n  var attachBar = document.getElementById('chat-attachment');\r\n  if (inputArea) inputArea.style.display = tabName === 'chat' ? '' : 'none';\r\n  if (attachBar) attachBar.style.display = (tabName === 'chat' && attachedFile) ? 'flex' : 'none';\r\n  // If switching to history, refresh the list\r\n  if (tabName === 'history') renderSessionList();\r\n  // Scroll chat to bottom if switching to chat\r\n  if (tabName === 'chat') {\r\n    var chatContainer = el('chat-messages');\r\n    if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;\r\n  }\r\n}\r\n\r\nfunction renderChatMessages() {\r\n  var container = el('chat-messages'); if (!container) return;\r\n  // Preserve the thinking bubble if AI is currently streaming\r\n  var thinkingEl = document.getElementById('thinking-bubble');\r\n  if (!DB.chatMessages || !DB.chatMessages.length) {\r\n    container.innerHTML = '<div class=\"chat-welcome\">' +\r\n      '<div class=\"chat-welcome-icon\">👋<\/div>' +\r\n      '<h3>Welcome to VibeCoding<\/h3>' +\r\n      '<p>Pick a template below, or just <b>describe what you need<\/b> in the chat — the AI will build it for you.<\/p>' +\r\n      '<div class=\"template-gallery\" id=\"template-gallery\"><\/div>' +\r\n      '<div class=\"template-view-all\"><button id=\"btn-view-all-templates\">View all 8 templates →<\/button><\/div>' +\r\n      '<p style=\"font-size:10px;color:var(--text3);margin-top:12px\">💡 <b>Tip:<\/b> Try <b>🪄 Guided<\/b> mode — the AI will ask you questions step by step.<\/p>' +\r\n    '<\/div>';\r\n    // Render template cards into the gallery\r\n    var gal = container.querySelector('#template-gallery');\r\n    if (gal) renderTemplateGallery(gal);\r\n    // Bind view-all button\r\n    var vaBtn = container.querySelector('#btn-view-all-templates');\r\n    if (vaBtn) vaBtn.onclick = function() {\r\n      // Show all templates list in the modal\r\n      _currentTemplate = null;\r\n      openModal('modal-template');\r\n    };\r\n    return;\r\n  }\r\n  var html = '';\r\n  for (var i = 0; i < DB.chatMessages.length; i++) {\r\n    var m = DB.chatMessages[i];\r\n    var timeStr = ''; try { timeStr = new Date(m.time).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); } catch(e) {}\r\n    var cls = m.role === 'user' ? 'chat-msg-user' : (m.isError ? 'chat-msg-ai chat-msg-err' : 'chat-msg-ai');\r\n    var label = m.role === 'user' ? 'YOU' : (m.isError ? '⚠ ERROR' : 'AI');\r\n\r\n    /* Extract suggestions from text — render them AFTER code tabs (diffBlock) */\r\n    var rawText = m.text || '';\r\n    var suggestLines = [];\r\n    var cleanedText = rawText.replace(/^\\[\\[suggest_[a-zA-Z0-9_-]+\\]\\]\\s*.+$/gm, function(match) {\r\n      suggestLines.push(match); return '';\r\n    }).replace(/\\n{3,}/g, '\\n\\n').trim();\r\n    if (!cleanedText) cleanedText = rawText.trim();\r\n\r\n    var text = esc(cleanedText).replace(/\\*\\*(.+?)\\*\\*/g, '<b>$1<\/b>').replace(/\\[HTML\\]/gi, '<b>[HTML]<\/b>').replace(/\\[CSS\\]/gi, '<b>[CSS]<\/b>').replace(/\\[JS\\]/gi, '<b>[JS]<\/b>').replace(/\\n/g, '<br>');\r\n    var diffBlock = m.diffHtml || '';\r\n\r\n    /* Build suggestions HTML (rendered AFTER code tabs) */\r\n    var suggestHtml = '';\r\n    if (suggestLines.length > 0) {\r\n      suggestHtml += '<div class=\"chat-suggestions\"><div class=\"chat-suggestions-label\">💡 Next steps — click to select:<\/div>';\r\n      for (var si = 0; si < suggestLines.length; si++) {\r\n        var line = suggestLines[si];\r\n        // Parse: [[suggest_xxx]] Title text\r\n        var idMatch = line.match(/^\\[\\[(suggest_[a-zA-Z0-9_-]+)\\]\\]\\s*(.+)/);\r\n        if (idMatch) {\r\n          var sugId = idMatch[1];\r\n          var sugTitle = idMatch[2].trim();\r\n          var sugDetail = _getSuggestDetail(sugId, sugTitle);\r\n          suggestHtml += '<button class=\"chat-option-btn chat-suggest-btn\" data-opt-id=\"' + esc(sugId) + '\" data-opt-text=\"' + esc(sugTitle) + '\" data-opt-detail=\"' + esc(sugDetail) + '\" onclick=\"handleOptionClick(this)\">' +\r\n            '<span class=\"opt-check\">☐<\/span>' + esc(sugTitle) + '<\/button>';\r\n        } else {\r\n          // Fallback: could not parse ID, show as plain text\r\n          var sl = line.replace(/^\\[\\[suggest_[a-zA-Z0-9_-]+\\]\\]\\s*/, '');\r\n          suggestHtml += '<div class=\"chat-suggestion-item\">' + esc(sl) + '<\/div>';\r\n        }\r\n      }\r\n      suggestHtml += '<\/div>';\r\n    }\r\n\r\n    html += '<div class=\"chat-msg ' + cls + '\"><div class=\"chat-msg-label\">' + label + '<\/div><div>' + text + '<\/div>' + diffBlock + suggestHtml + '<div class=\"chat-msg-time\">' + timeStr + '<\/div><\/div>';\r\n  }\r\n  container.innerHTML = html;\r\n\r\n  // Bind diff tab button clicks (delegated)\r\n  var diffBtns = container.querySelectorAll('.diff-tab-btn');\r\n  for (var db = 0; db < diffBtns.length; db++) {\r\n    diffBtns[db].onclick = function() { handleDiffTabClick(this); };\r\n  }\r\n\r\n  // Post-process: find AI messages with [[options]] and render clickable buttons\r\n  var aiMsgs = container.querySelectorAll('.chat-msg-ai');\r\n  for (var j = 0; j < aiMsgs.length; j++) {\r\n    var msgEl = aiMsgs[j];\r\n    var rawText = msgEl.querySelector('div:nth-child(2)');\r\n    if (rawText) {\r\n      var innerHTML = rawText.innerHTML;\r\n      // Check if message has [[option_id]] patterns\r\n      if (/\\[\\[[a-zA-Z0-9_-]+\\]\\]/.test(innerHTML)) {\r\n        // Replace <br> back to \\n for parsing, then render options\r\n        var plainText = innerHTML.replace(/<br\\s*\\/?>/gi, '\\n').replace(/<[^>]+>/g, '');\r\n        var rendered = parseAndRenderOptions(plainText);\r\n        // Convert back: escape, process bold, convert newlines\r\n        var escaped = esc(rendered).replace(/\\*\\*(.+?)\\*\\*/g, '<b>$1<\/b>').replace(/\\n/g, '<br>');\r\n        // But parseAndRenderOptions already returns HTML — we need to use it directly\r\n        // Actually, let's rebuild: split on the options part\r\n        var optIdx = rendered.indexOf('<div class=\"chat-options\">');\r\n        if (optIdx !== -1) {\r\n          var beforeOpts = rendered.substring(0, optIdx);\r\n          var optsHtml = rendered.substring(optIdx);\r\n          rawText.innerHTML = esc(beforeOpts).replace(/\\*\\*(.+?)\\*\\*/g, '<b>$1<\/b>').replace(/\\n/g, '<br>') + optsHtml;\r\n        }\r\n      }\r\n    }\r\n  }\r\n\r\n  container.scrollTop = container.scrollHeight;\r\n}\r\n\r\nfunction updateChatBadge() {\r\n  var badge = el('chat-msg-count'); if (badge) badge.textContent = (DB.chatMessages || []).length;\r\n}\r\n\r\n/* ── Full Generation (from Config tab button) ── */\r\nfunction runFullGeneration() {\r\n  collectFormData(); persist();\r\n  var reqId = nextReqId();\r\n  _currentReqId = reqId;\r\n  var prompt = buildFullPrompt();\r\n  // Store prompt for the Prompt tab\r\n  _lastPromptSent = prompt;\r\n  var promptContent = document.getElementById('dev-prompt-content');\r\n  if (promptContent) promptContent.textContent = prompt;\r\n  var promptStatus = document.getElementById('dev-prompt-status');\r\n  if (promptStatus) promptStatus.textContent = prompt.length.toLocaleString() + ' chars';\r\n  var hasChat = DB.chatMessages && DB.chatMessages.length > 0;\r\n  updateConnStatus('busy');\r\n  setAiTimeout(prompt.length);\r\n  _aiCallActive = true;\r\n  _setAiUIActive(true);\r\n\r\n  if (typeof tool.requestAIStream === 'function') {\r\n    var fullResponse = '';\r\n    var fullGenStart = Date.now();\r\n    showThinkingBubble('AI is generating full tool', true);\r\n    _showDevPanel();\r\n\r\n    try {\r\n      tool.requestAIStream(prompt, '', {\r\n        onToken: function(token) {\r\n          if (!_streamingMsgEl) {\r\n            // Update thinking bubble instead of hiding it\r\n            var thinkLabel = document.getElementById('think-label');\r\n            if (thinkLabel) thinkLabel.textContent = 'AI is generating…';\r\n            var thinkBody = document.getElementById('think-body');\r\n            var thinkToggle = document.getElementById('think-toggle');\r\n            if (thinkBody) thinkBody.style.display = 'block';\r\n            if (thinkToggle) thinkToggle.textContent = '▼';\r\n            _beginStreamingMessage();\r\n          }\r\n          fullResponse += token;\r\n          setAiTimeout(prompt.length);\r\n          _appendStreamingToken(token);\r\n          _devRawContent += token;\r\n          _updateDevPanel();\r\n        },\r\n
