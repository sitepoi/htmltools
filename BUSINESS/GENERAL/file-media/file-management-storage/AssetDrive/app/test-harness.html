<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetDrive - Test Harness</title>
<link rel="stylesheet" href="AssetDrive.css">
<style>
	html, body { margin: 0; padding: 0; background: #eef2f7; }
	body { padding-top: 44px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
	#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 14px; background: #0f172a; color: #e6edf5; font-size: 11px; }
	#th-bar strong { color: #a5b4fc; letter-spacing: 0.5px; }
	#th-bar .sep { color: #475569; }
	#th-bar .hint { color: #94a3b8; font-size: 10px; }
	#th-bar select { font-size: 11px; padding: 3px 5px; border: 1px solid #334155; border-radius: 4px; background: #1e293b; color: #e6edf5; }
	#th-bar button { border: none; border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 600; cursor: pointer; }
	#th-bar button.th-btn-a { background: #4f46e5; color: #fff; }
	#th-bar button.th-btn-b { background: #334155; color: #e6edf5; }
	#th-bar label { display: inline-flex; align-items: center; gap: 4px; color: #cbd5e1; font-size: 10px; }
	#th-status { color: #a5b4fc; font-size: 10px; }
	#th-last-notify { color: #fbbf24; font-size: 10px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#th-log { position: fixed; right: 12px; bottom: 12px; z-index: 9999; width: 340px; max-height: 190px; overflow: auto; padding: 8px 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.94); color: #e2e8f0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; line-height: 1.5; }
	#th-log p { margin: 0 0 2px; }
	#app-container { padding: 0 0 20px; }
	@media (max-width: 900px) {
		body { padding-top: 96px; }
	}
</style>
</head>
<body>
<div id="th-bar">
	<strong>HARNESS - AssetDrive</strong><span class="sep">|</span>
	<span class="hint">Role:</span>
	<select id="th-role">
		<option value="admin">Admin</option>
		<option value="editor">Editor</option>
		<option value="viewer">Viewer</option>
		<option value="none">No identity</option>
	</select>
	<label><input type="checkbox" id="th-ro"> read-only (isReadOnly)</label>
	<button class="th-btn-a" id="th-sample">Load sample drive</button>
	<button class="th-btn-b" id="th-empty">Clear value</button>
	<button class="th-btn-b" id="th-reinit">Re-run onReady</button>
	<span class="sep">|</span>
	<span id="th-status">Loading...</span>
	<span class="sep">|</span>
	<span id="th-last-notify"></span>
</div>

<div id="app-container"></div>
<div id="th-log"></div>

<script>
/* ─────────────────────────────────────────────────────────────────────
   Mock window.tool SDK - installed BEFORE the tool script loads.
   ───────────────────────────────────────────────────────────────────── */
(function () {
	var STORAGE_KEY = 'assetdrive_harness_value';
	var query = new URLSearchParams(window.location.search);
	var roleFromQuery = query.get('role');
	var roles = ['admin', 'editor', 'viewer', 'none'];
	if (roles.indexOf(roleFromQuery) < 0) { roleFromQuery = localStorage.getItem(STORAGE_KEY + '_role') || 'admin'; }
	var params = {
		driveLabel: new URLSearchParams(window.location.search).get('label') || 'Asset Drive',
		maxUploadSizeMb: query.get('maxmb') || '5'
	};
	if (query.get('save') === '1') { params.showSaveButton = 'yes'; }
	var users = {
		admin: { id: 'u-admin', name: 'Ada Admin', email: 'ada@example.org', roles: ['admin'], effectiveAccess: { isViewer: true, isEditor: true, isManager: true } },
		editor: { id: 'u-editor', name: 'Eddie Editor', email: 'eddie@example.org', roles: ['viewer', 'editor'], effectiveAccess: { isViewer: true, isEditor: true, isManager: false } },
		viewer: { id: 'u-viewer', name: 'Vera Viewer', email: 'vera@example.org', roles: ['viewer'], effectiveAccess: { isViewer: true, isEditor: false, isManager: false } }
	};
	var state = {
		role: roleFromQuery,
		readOnly: query.get('ro') === '1',
		value: null,
		readyCallback: null,
		valueChangeListeners: [],
		readonlyListeners: [],
		userChangeListeners: [],
		openUrlCount: 0,
		uploadCount: 0
	};
	if (query.get('fresh') === '1') {
		try { localStorage.removeItem(STORAGE_KEY); } catch (error) { }
	}
	try {
		var storedValue = localStorage.getItem(STORAGE_KEY);
		state.value = storedValue ? JSON.parse(storedValue) : null;
	} catch (error) { state.value = null; }

	if (query.get('empty') === '1') { state.value = null; }
	var sampleRequested = query.get('sample') === '1';

	function logLine(message) {
		var log = document.getElementById('th-log');
		if (!log) { return; }
		var line = document.createElement('p');
		line.textContent = new Date().toISOString().slice(11, 19) + '  ' + message;
		log.appendChild(line);
		log.scrollTop = log.scrollHeight;
	}

	function setLastNotify(message) {
		var element = document.getElementById('th-last-notify');
		if (element) { element.textContent = message; element.title = message; }
	}

	function persistStoredValue(value) {
		try {
			if (value === null || value === undefined) { localStorage.removeItem(STORAGE_KEY); }
			else { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); }
		} catch (error) { }
	}

	window.thLog = logLine;

	window.tool = {
		onReady: function (callback) {
			state.readyCallback = callback;
			if (sampleRequested && !state.value) {
				state.value = window.AD_CREATE_SAMPLE ? window.AD_CREATE_SAMPLE() : null;
				sampleRequested = false;
			}
			window.setTimeout(function () { callback(state.value, null); }, 0);
		},
		getValue: function () { return state.value; },
		setValue: function (nextValue) {
			state.value = nextValue;
			persistStoredValue(nextValue);
			state.valueChangeListeners.forEach(function (listener) { try { listener(nextValue); } catch (error) { logLine('listener error: ' + error.message); } });
		},
		onValueChange: function (listener) { state.valueChangeListeners.push(listener); },
		getFields: function () { return { id: 'harness-record', name: 'Asset Drive record', cmsObjectType: 'harness' }; },
		onFieldsChange: function () { },
		watchField: function () { },
		setField: function () { logLine('setField called'); },
		setFields: function () { logLine('setFields called'); },
		param: function (name, fallback) {
			if (Object.prototype.hasOwnProperty.call(params, name) && params[name] !== undefined && params[name] !== null && params[name] !== '') { return params[name]; }
			return fallback;
		},
		isReadOnly: function () { return state.readOnly; },
		onReadonlyChange: function (listener) { state.readonlyListeners.push(listener); },
		getUser: function () { return users[state.role] || null; },
		onUserChange: function (listener) { state.userChangeListeners.push(listener); },
		getPermittedUsers: function () { return [users.admin, users.editor, users.viewer]; },
		reportValid: function () { },
		notify: function (message, severity) {
			logLine('notify(' + (severity || 'info') + '): ' + message);
			setLastNotify(message);
		},
		resize: function () { },
		declareOutput: function (schema) { logLine('declareOutput: ' + (schema ? Object.keys(schema.properties || {}).join(', ') : '')); },
		declareParams: function (list) { logLine('declareParams: ' + (Array.isArray(list) ? list.length : 0) + ' parameter(s)'); },
		reportMissingParams: function (missing) { logLine('reportMissingParams: ' + ((missing && missing.length) || 0)); },
		openUrl: function (url) {
			state.openUrlCount += 1;
			logLine('openUrl #' + state.openUrlCount + ': ' + url);
		},
		requestSave: function (callback) {
			logLine('requestSave');
			window.setTimeout(function () { callback(null, true); }, 40);
		},
		requestUpload: function (accept, callback) {
			logLine('requestUpload(' + accept + ')');
			var input = document.createElement('input');
			input.type = 'file';
			input.accept = accept || '*/*';
			input.style.position = 'fixed';
			input.style.left = '-9999px';
			document.body.appendChild(input);
			input.addEventListener('change', function () {
				var file = input.files && input.files[0];
				document.body.removeChild(input);
				if (!file) { callback('No file selected', null); return; }
				state.uploadCount += 1;
				var url = URL.createObjectURL(file);
				logLine('uploaded: ' + file.name + ' (' + file.size + ' bytes, ' + (file.type || 'no type') + ')');
				callback(null, { name: file.name, url: url, size: file.size, type: file.type });
			});
			input.click();
		},
		_tools: {
			setRole: function (role) {
				state.role = role;
				try { localStorage.setItem(STORAGE_KEY + '_role', role); } catch (error) { }
				state.userChangeListeners.forEach(function (listener) { try { listener(users[role] || null); } catch (error) { } });
			},
			setReadOnly: function (readOnly) {
				state.readOnly = !!readOnly;
				state.readonlyListeners.forEach(function (listener) { try { listener(state.readOnly); } catch (error) { } });
			},
			setValue: function (value) { window.tool.setValue(value); },
			createSample: function () { return window.AD_CREATE_SAMPLE ? window.AD_CREATE_SAMPLE() : null; },
			runReadyAgain: function () { if (state.readyCallback) { state.readyCallback(state.value, null); } },
			stats: function () { return { openUrlCount: state.openUrlCount, uploadCount: state.uploadCount, stored: state.value }; }
		}
	};
})();
</script>

vg>\u003cspan>Delete\u003c/span>\r\n\t\t\u003c/button>\r\n\t\u003c/div>\r\n\r\n\t\u003cdiv class=\"ad-menu ad-context-menu\" id=\"ad-context-menu\" role=\"menu\" hidden>\u003c/div>\r\n\r\n\t\u003cdiv class=\"ad-modal-overlay\" id=\"ad-modal\" hidden>\r\n\t\t\u003cdiv class=\"ad-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ad-modal-title\">\r\n\t\t\t\u003cdiv class=\"ad-modal-head\">\r\n\t\t\t\t\u003ch2 class=\"ad-modal-title\" id=\"ad-modal-title\">Title\u003c/h2>\r\n\t\t\t\t\u003cbutton type=\"button\" class=\"ad-icon-btn\" data-ad-act=\"modal-close\" aria-label=\"Close dialog\">\r\n\t\t\t\t\t\u003csvg class=\"ad-ico\" aria-hidden=\"true\">\u003cuse href=\"#ad-i-x\">\u003c/use>\u003c/svg>\r\n\t\t\t\t\u003c/button>\r\n\t\t\t\u003c/div>\r\n\t\t\t\u003cdiv class=\"ad-modal-body\" id=\"ad-modal-body\">\u003c/div>\r\n\t\t\t\u003cdiv class=\"ad-modal-actions\">\r\n\t\t\t\t\u003cbutton type=\"button\" class=\"ad-btn\" data-ad-act=\"modal-cancel\">Cancel\u003c/button>\r\n\t\t\t\t\u003cbutton type=\"button\" class=\"ad-btn ad-btn-primary\" data-ad-act=\"modal-confirm\" id=\"ad-modal-confirm\">Confirm\u003c/button>\r\n\t\t\t\u003c/div>\r\n\t\t\u003c/div>\r\n\t\u003c/div>\r\n\r\n\t\u003cp class=\"ad-param-warning\" id=\"ad-param-warning\" hidden>\u003c/p>\r\n\u003c/div>\r\n\u003cnoscript>\u003cp class=\"ad-noscript\">This asset manager needs JavaScript. Enable it to browse the drive.\u003c/p>\u003c/noscript>\r\n";

	function loadExternalJS() {
		var script = document.createElement('script');
		script.src = 'AssetDrive.js';
		script.onload = function () { status.textContent = 'ready (external js)'; };
		script.onerror = function () { status.textContent = 'JS FAILED - check the console'; };
		document.body.appendChild(script);
	}

	function loadInlineJS() {
		window.fetch('AssetDrive.js')
			.then(function (response) {
				if (!response.ok) { throw new Error('HTTP ' + response.status); }
				return response.text();
			})
			.then(function (code) {
				var script = document.createElement('script');
				script.textContent = code;
				document.body.appendChild(script);
				status.textContent = 'ready (inline js)';
			})
			.catch(function () {
				status.textContent = 'inline fetch failed - external js';
				loadExternalJS();
			});
	}

	function inject(html) {
		container.innerHTML = html;
		if (inlineMode) { loadInlineJS(); } else { loadExternalJS(); }
	}

	var fallbackTimer = window.setTimeout(function () {
		inject(EMBEDDED_HTML);
	}, 1200);

	window.fetch('AssetDrive.html')
		.then(function (response) {
			if (!response.ok) { throw new Error('HTTP ' + response.status); }
			return response.text();
		})
		.then(function (html) {
			window.clearTimeout(fallbackTimer);
			inject(html);
		})
		.catch(function () { /* the fallback timer injects the embedded copy */ });
})();
</script>

<script>
/* ─────────────────────────────────────────────────────────────────────
   Harness controls.
   ───────────────────────────────────────────────────────────────────── */
(function () {
	var query = new URLSearchParams(window.location.search);
	var roleSelect = document.getElementById('th-role');
	var readOnlyCheckbox = document.getElementById('th-ro');
	var status = document.getElementById('th-status');

	roleSelect.value = query.get('role') || localStorage.getItem('assetdrive_harness_value_role') || 'admin';
	readOnlyCheckbox.checked = query.get('ro') === '1';
	if (roleSelect.value === 'none') { roleSelect.value = 'none'; }

	roleSelect.addEventListener('change', function () {
		window.tool._tools.setRole(roleSelect.value);
		window.thLog('role switched to ' + roleSelect.value);
	});

	readOnlyCheckbox.addEventListener('change', function () {
		window.tool._tools.setReadOnly(readOnlyCheckbox.checked);
		window.thLog('isReadOnly changed to ' + readOnlyCheckbox.checked);
	});

	document.getElementById('th-sample').addEventListener('click', function () {
		var sample = window.tool._tools.createSample();
		window.tool.setValue(sample);
		window.thLog('sample drive loaded (' + sample.files.length + ' files)');
	});

	document.getElementById('th-empty').addEventListener('click', function () {
		window.tool.setValue(null);
		window.thLog('value cleared');
	});

	document.getElementById('th-reinit').addEventListener('click', function () {
		window.tool._tools.runReadyAgain();
		window.thLog('onReady ran again');
	});

	status.textContent = 'value ' + (window.tool.getValue() ? 'present' : 'empty') + ' - role ' + roleSelect.value;
})();
</script>
