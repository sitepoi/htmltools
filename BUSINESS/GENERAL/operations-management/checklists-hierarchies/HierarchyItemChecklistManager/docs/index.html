=\"cbt-btn cbt-btn-ghost\" id=\"btn-only-overdue\" title=\"Show only overdue tasks\">⚠ Overdue<\/button>\r\n        <span class=\"cbt-spacer\"><\/span>\r\n        <button class=\"cbt-btn cbt-btn-ghost\" id=\"btn-undo\" title=\"Nothing to undo\">↶ Undo<\/button>\r\n        <button class=\"cbt-btn cbt-btn-ghost\" id=\"btn-expand-all\" title=\"Expand all sections\">⊞ Expand all<\/button>\r\n        <button class=\"cbt-btn cbt-btn-ghost\" id=\"btn-collapse-all\" title=\"Collapse all sections\">⊟ Collapse all<\/button>\r\n      <\/div>\r\n    <\/div>\r\n    <div class=\"cbt-tree\" id=\"cbt-tree\"><\/div>\r\n  <\/section>\r\n\r\n  <section class=\"cbt-pane\" id=\"pane-grid\">\r\n    <div class=\"cbt-grid-hint\"><span class=\"cbt-grid-hint-text\">One row per lesson — one column per standard task. Click a cell to change its status, hover a row or section and click ↗ to jump to it in the outline. <span id=\"cbt-grid-summary\"><\/span><\/span><span class=\"cbt-grid-hint-actions\"><button class=\"cbt-btn cbt-btn-ghost cbt-btn-xs\" id=\"btn-grid-expand-all\" title=\"Expand all sections\">⊞ Expand all<\/button><button class=\"cbt-btn cbt-btn-ghost cbt-btn-xs\" id=\"btn-grid-collapse-all\" title=\"Collapse all sections\">⊟ Collapse all<\/button><\/span><\/div>\r\n    <div class=\"cbt-grid-wrap\" id=\"cbt-grid\"><\/div>\r\n  <\/section>\r\n\r\n  <section class=\"cbt-pane\" id=\"pane-reports\">\r\n    <div class=\"cbt-reports-head\">\r\n      <div class=\"cbt-reports-title\">Program progress report<\/div>\r\n      <div class=\"cbt-reports-actions\">\r\n        <button class=\"cbt-btn cbt-btn-ghost\" id=\"btn-export-csv\" title=\"Download all tasks as CSV\">⬇ CSV<\/button>\r\n        <button class=\"cbt-btn cbt-btn-ghost\" id=\"btn-export-pdf\" title=\"Export a printable report\">🖨 PDF report<\/button>\r\n      <\/div>\r\n    <\/div>\r\n    <div class=\"cbt-reports\" id=\"cbt-reports\"><\/div>\r\n  <\/section>\r\n\r\n  <div class=\"cbt-modal-overlay\" id=\"cbt-modal\" hidden>\r\n    <div class=\"cbt-modal\">\r\n      <div class=\"cbt-modal-head\">\r\n        <div class=\"cbt-modal-title\" id=\"cbt-modal-title\"><\/div>\r\n        <button class=\"cbt-modal-x\" id=\"cbt-modal-close\" title=\"Close\">✕<\/button>\r\n      <\/div>\r\n      <div class=\"cbt-modal-body\" id=\"cbt-modal-body\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n<\/div>\r\n"},"css":{"name":"HierarchyItemChecklistManager.css","src":"../app/HierarchyItemChecklistManager.css","content":"/* ── HierarchyItemChecklistManager ──────────────────\r\n   Hierarchy item checklist manager for UniconHub CMS.\r\n   Class prefix: cbt-\r\n────────────────────────────────────────────────────── */\r\n\r\n.cbt-app {\r\n  --cbt-bg: #eef0f7;\r\n  --cbt-card: #ffffff;\r\n  --cbt-ink: #1e293b;\r\n  --cbt-mut: #64748b;\r\n  --cbt-line: #e2e8f0;\r\n  --cbt-primary: #4f46e5;\r\n  --cbt-primary-d: #4338ca;\r\n  --cbt-soft: #eef2ff;\r\n  --cbt-radius: 12px;\r\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\r\n  color: var(--cbt-ink);\r\n  font-size: 14px;\r\n  line-height: 1.45;\r\n  padding: 14px 16px 22px;\r\n  max-width: 1280px;\r\n  margin: 0 auto;\r\n}\r\n.cbt-app * { box-sizing: border-box; }\r\n\r\n/* ── Progress ring (in the stats ribbon) ── */\r\n.cbt-ring {\r\n  --p: 0; --rc: #4f46e5;\r\n  width: 42px; height: 42px; border-radius: 50%; flex: none; position: relative;\r\n  background: conic-gradient(var(--rc) calc(var(--p) * 1%), #e8ebf5 0);\r\n  display: flex; align-items: center; justify-content: center;\r\n}\r\n.cbt-ring::before {\r\n  content: \"\"; width: 32px; height: 32px; border-radius: 50%;\r\n  background: var(--cbt-card);\r\n}\r\n.cbt-ring span {\r\n  position: absolute; font-size: 10px; font-weight: 800; color: var(--cbt-ink);\r\n}\r\n\r\n/* ── Buttons ── */\r\n.cbt-btn {\r\n  border: 1px solid var(--cbt-line); background: #fff; color: var(--cbt-ink);\r\n  padding: 7px 12px; border-radius: 8px; cursor: pointer;\r\n  font: inherit; font-size: 13px; font-weight: 600;\r\n  display: inline-flex; align-items: center; gap: 5px;\r\n  transition: background .15s, border-color .15s, transform .05s;\r\n}\r\n.cbt-btn:hover { background: #f6f7fb; border-color: #cbd5e1; }\r\n.cbt-btn:active { transform: translateY(1px); }\r\n.cbt-btn-primary { background: var(--cbt-primary); border-color: var(--cbt-primary); color: #fff; }\r\n.cbt-btn-primary:hover { background: var(--cbt-primary-d); border-color: var(--cbt-primary-d); }\r\n.cbt-badge {\r\n  background: rgba(255,255,255,.25); border-radius: 20px;\r\n  padding: 0 7px; font-size: 11px; line-height: 16px; font-weight: 700;\r\n}\r\n.cbt-btn-ghost .cbt-badge { background: var(--cbt-soft); color: var(--cbt-primary); }\r\n\r\n/* ── Stats ribbon (distinct from tabs) ── */\r\n.cbt-stats {\r\n  display: flex; flex-wrap: wrap; margin-top: 12px;\r\n  background: var(--cbt-card); border: 1px solid var(--cbt-line);\r\n  border-radius: 12px; overflow: hidden;\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);\r\n}\r\n.cbt-stat {\r\n  flex: 1; min-width: 108px;\r\n  padding: 9px 14px 8px; border-right: 1px solid #f1f3f9;\r\n  display: flex; flex-direction: column; gap: 2px;\r\n}\r\n.cbt-stat:last-child { border-right: none; }\r\n.cbt-stat-label {\r\n  display: flex; align-items: center; gap: 6px;\r\n  font-size: 10px; font-weight: 700; letter-spacing: .5px;\r\n  text-transform: uppercase; color: var(--cbt-mut); white-space: nowrap;\r\n}\r\n.cbt-stat b { font-size: 17px; line-height: 1.25; }\r\n.cbt-stat .cbt-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }\r\n.cbt-stat.cbt-stat-ring { flex-direction: row; align-items: center; gap: 10px; min-width: 132px; }\r\n.cbt-stat.cbt-stat-ring .cbt-stat-label { letter-spacing: 0; text-transform: none; }\r\n\r\n/* ── Tabs: underline navigation (clearly different from stats) ── */\r\n.cbt-tabs {\r\n  display: flex; gap: 26px; margin-top: 14px; padding: 0 4px;\r\n  border-bottom: 2px solid var(--cbt-line);\r\n}\r\n.cbt-tab {\r\n  border: none; border-radius: 0; background: transparent;\r\n  color: var(--cbt-mut); padding: 7px 2px 9px; cursor: pointer;\r\n  font: inherit; font-size: 14px; font-weight: 600;\r\n  border-bottom: 3px solid transparent; margin-bottom: -2px;\r\n}\r\n.cbt-tab:hover { color: var(--cbt-ink); background: transparent; }\r\n.cbt-tab.active {\r\n  color: var(--cbt-primary); background: transparent; box-shadow: none;\r\n  border-bottom-color: var(--cbt-primary);\r\n}\r\n\r\n/* ── Panes ── */\r\n.cbt-pane { display: none; margin-top: 10px; }\r\n.cbt-pane.active { display: block; }\r\n\r\n/* ── Toolbar ── */\r\n.cbt-toolbar {\r\n  background: var(--cbt-card); border: 1px solid var(--cbt-line);\r\n  border-radius: var(--cbt-radius); padding: 10px 12px; margin-bottom: 10px;\r\n  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\r\n}\r\n.cbt-quickadd { display: flex; gap: 8px; flex-wrap: nowrap; }\r\nselect.cbt-sel {\r\n  border: 1.5px solid var(--cbt-line); border-radius: 8px; padding: 7px 8px;\r\n  font: inherit; font-size: 13px; background: #fff; color: var(--cbt-ink);\r\n  max-width: 240px; outline: none;\r\n}\r\nselect.cbt-sel:focus { border-color: var(--cbt-primary); }\r\n.cbt-filterrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 220px; }\r\n.cbt-filterrow input[type=text] {\r\n  flex: 1; min-width: 120px; border: 1.5px solid var(--cbt-line); border-radius: 8px;\r\n  padding: 7px 12px; font: inherit; font-size: 13px; outline: none; background: #fbfcfe;\r\n}\r\n.cbt-filterrow input[type=text]:focus { border-color: var(--cbt-primary); background: #fff; }\r\n.cbt-spacer { flex: 1; }\r\n\r\n/* ── Tree ── */\r\n.cbt-tree {\r\n  background: var(--cbt-card); border: 1px solid var(--cbt-line);\r\n  border-radius: var(--cbt-radius); padding: 8px;\r\n  min-height: 200px;\r\n}\r\n.cbt-children { border-left: 2px solid #eef0f6; margin-left: 17px; }\r\n.cbt-node.cbt-collapsed > .cbt-children { display: none; }\
