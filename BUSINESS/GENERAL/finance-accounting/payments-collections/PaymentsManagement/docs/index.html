cer\"><\/div><button class=\"pm-btn pm-btn-primary\" type=\"button\" id=\"btn-add-type\" onclick=\"openTypeForm()\">＋ Add Type<\/button><\/div>\r\n      <div class=\"pm-list\" id=\"types-list\"><\/div>\r\n\r\n      <div class=\"pm-mv-title\" style=\"margin-top:18px\">🏦 Money Sources <span class=\"pm-mv-total\">where the money comes from — grants, bank accounts, cash…<\/span><\/div>\r\n      <div class=\"pm-toolbar\" style=\"margin-top:6px\"><div class=\"pm-spacer\"><\/div><button class=\"pm-btn pm-btn-primary\" type=\"button\" id=\"btn-add-source\" onclick=\"openSourceForm()\">＋ Add Source<\/button><\/div>\r\n      <div class=\"pm-list\" id=\"sources-list\"><\/div>\r\n    <\/section>\r\n\r\n  <\/main>\r\n\r\n  <div class=\"pm-backdrop\" id=\"pm-backdrop\" style=\"display:none\">\r\n    <div class=\"pm-modal\" id=\"pm-modal\" role=\"dialog\" aria-modal=\"true\"><\/div>\r\n  <\/div>\r\n\r\n  <datalist id=\"pm-cat-options\"><\/datalist>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"PaymentsManagement.css","src":"../app/PaymentsManagement.css","content":"/* ══ Payments Management — UniconHub html-tool ══ */\r\n:root {\r\n  --pm-bg: #f5f7f9;\r\n  --pm-card: #ffffff;\r\n  --pm-border: #e2e8f0;\r\n  --pm-text: #0f1b2d;\r\n  --pm-muted: #64748b;\r\n  --pm-accent: #0f766e;\r\n  --pm-accent-strong: #115e59;\r\n  --pm-accent-soft: #ccfbf1;\r\n  --pm-blue: #2563eb;\r\n  --pm-blue-soft: #dbeafe;\r\n  --pm-amber: #b45309;\r\n  --pm-amber-soft: #fef3c7;\r\n  --pm-red: #b91c1c;\r\n  --pm-red-soft: #fee2e2;\r\n  --pm-green: #15803d;\r\n  --pm-green-soft: #dcfce7;\r\n  --pm-slate: #475569;\r\n  --pm-slate-soft: #e8edf3;\r\n  --pm-radius: 14px;\r\n  --pm-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 4px 14px rgba(15, 23, 42, .06);\r\n  --pm-shadow-lg: 0 12px 40px rgba(15, 23, 42, .22);\r\n}\r\n* { box-sizing: border-box; }\r\n.pm-shell {\r\n  font-family: system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", sans-serif;\r\n  color: var(--pm-text);\r\n  background: var(--pm-bg);\r\n  border-radius: var(--pm-radius);\r\n  overflow: hidden;\r\n  line-height: 1.45;\r\n}\r\n\r\n/* ── Header ─────────────────────────────────────────── */\r\n.pm-header {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 12px;\r\n  flex-wrap: wrap;\r\n  padding: 16px 18px 14px;\r\n  background: linear-gradient(120deg, #0f766e 0%, #115e59 60%, #134e4a 100%);\r\n  color: #fff;\r\n}\r\n.pm-brand { display: flex; align-items: center; gap: 12px; }\r\n.pm-logo {\r\n  width: 44px; height: 44px; border-radius: 12px;\r\n  background: rgba(255, 255, 255, .14);\r\n  display: flex; align-items: center; justify-content: center;\r\n  font-size: 22px;\r\n  border: 1px solid rgba(255, 255, 255, .22);\r\n}\r\n.pm-title { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .2px; }\r\n.pm-sub { margin: 2px 0 0; font-size: 12px; opacity: .85; }\r\n.pm-head-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }\r\n.pm-chip {\r\n  display: inline-flex; align-items: center; gap: 6px;\r\n  background: rgba(255, 255, 255, .14);\r\n  border: 1px solid rgba(255, 255, 255, .22);\r\n  color: #fff;\r\n  border-radius: 999px;\r\n  padding: 4px 12px;\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n}\r\n\r\n/* ── Lock banner ────────────────────────────────────── */\r\n.pm-lockbanner {\r\n  background: var(--pm-amber-soft);\r\n  color: var(--pm-amber);\r\n  border-bottom: 1px solid #fde68a;\r\n  padding: 8px 18px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n}\r\n\r\n/* ── Stats (KPI cards) ──────────────────────────────── */\r\n.pm-stat {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 12px;\r\n  background: var(--pm-card);\r\n  border: 1px solid var(--pm-border);\r\n  border-radius: 16px;\r\n  padding: 14px 16px 16px;\r\n  box-shadow: var(--pm-shadow);\r\n  position: relative;\r\n  overflow: hidden;\r\n  min-width: 0;\r\n}\r\n.pm-stat::before {\r\n  content: '';\r\n  position: absolute;\r\n  left: 0; top: 0; bottom: 0;\r\n  width: 4px;\r\n  background: var(--pm-slate);\r\n  opacity: .45;\r\n}\r\n.pm-stat--due::before { background: var(--pm-blue); }\r\n.pm-stat--overdue::before { background: var(--pm-red); }\r\n.pm-stat--paid::before { background: var(--pm-green); }\r\n.pm-stat--pending::before { background: var(--pm-amber); }\r\n.pm-stat--owed::before { background: #8b5cf6; }\r\n.pm-stat-top {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n}\r\n.pm-stat-icon {\r\n  width: 40px; height: 40px; flex: 0 0 40px;\r\n  border-radius: 12px;\r\n  display: flex; align-items: center; justify-content: center;\r\n  font-size: 19px;\r\n  background: var(--pm-slate-soft);\r\n}\r\n.pm-stat--due .pm-stat-icon { background: var(--pm-blue-soft); }\r\n.pm-stat--overdue .pm-stat-icon { background: var(--pm-red-soft); }\r\n.pm-stat--paid .pm-stat-icon { background: var(--pm-green-soft); }\r\n.pm-stat--pending .pm-stat-icon { background: var(--pm-amber-soft); }\r\n.pm-stat--owed .pm-stat-icon { background: #ede9fe; }\r\n.pm-stat-label {\r\n  font-size: 10.5px;\r\n  font-weight: 700;\r\n  text-transform: uppercase;\r\n  letter-spacing: .6px;\r\n  color: var(--pm-muted);\r\n  text-align: right;\r\n  line-height: 1.3;\r\n}\r\n.pm-stat-value {\r\n  font-size: 24px;\r\n  font-weight: 800;\r\n  letter-spacing: -.3px;\r\n  color: var(--pm-text);\r\n  line-height: 1.15;\r\n  word-break: break-word;\r\n}\r\n.pm-stat-value.money {\r\n  color: var(--pm-accent-strong);\r\n  font-size: 21px;\r\n  letter-spacing: -.2px;\r\n}\r\n.pm-stat-sub {\r\n  font-size: 11.5px;\r\n  color: var(--pm-muted);\r\n  font-weight: 600;\r\n}\r\n\r\n/* ── Body: sidebar + content ─────────────────────────── */\r\n.pm-body { display: flex; align-items: stretch; min-height: 480px; }\r\n\r\n/* ── Sidebar menu ────────────────────────────────────── */\r\n.pm-side {\r\n  width: 232px;\r\n  flex-shrink: 0;\r\n  background: var(--pm-card);\r\n  border-right: 1px solid var(--pm-border);\r\n  padding: 12px 10px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 3px;\r\n}\r\n.pm-tabs { display: flex; flex-wrap: wrap; }\r\n.pm-tab-btn {\r\n  border: 1px solid transparent;\r\n  background: transparent;\r\n  color: var(--pm-slate);\r\n  font-family: inherit;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  padding: 9px 12px;\r\n  border-radius: 10px;\r\n  cursor: pointer;\r\n  display: flex; align-items: center; gap: 8px;\r\n  transition: all .15s;\r\n  width: 100%;\r\n  text-align: left;\r\n}\r\n.pm-tab-btn:hover { background: var(--pm-bg); color: var(--pm-accent-strong); }\r\n.pm-tab-btn.active {\r\n  background: var(--pm-accent);\r\n  border-color: var(--pm-accent);\r\n  color: #fff;\r\n  box-shadow: 0 2px 8px rgba(15, 118, 110, .35);\r\n}\r\n.pm-tab-btn .pm-badge { margin-left: auto; }\r\n.pm-badge {\r\n  background: var(--pm-red-soft); color: var(--pm-red);\r\n  border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700;\r\n}\r\n.pm-tab-btn.active .pm-badge { background: rgba(255,255,255,.25); color: #fff; }\r\n.pm-badge--count { background: var(--pm-blue-soft); color: var(--pm-blue); }\r\n.pm-tab-btn.active .pm-badge--count { background: rgba(255,255,255,.25); color: #fff; }\r\n\r\n/* ── Main / panes ───────────────────────────────────── */\r\n.pm-main { flex: 1; min-width: 0; padding: 14px 18px 18px; }\r\n.pm-tabpane { display: none; }\r\n.pm-tabpane.active { display: block; }\r\n\r\n/* ── Dashboard ───────────────────────────────────────── */\r\n.pm-stats {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));\r\n  gap: 14px;\r\n}\r\n.pm-dash-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; }\r\n.pm-dash-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\r\n  gap: 14px;\r\n  margin-top: 12px;\r\n}\r\n.pm-dash-card {\r\n  background: var(--pm-card);\r\n  border: 1px solid var(--pm-border);\r\n  border-radius: var(--pm-radius);\r\n  box-shadow: var(--pm-shadow);\r\n  padding: 14px 16px;\r\n}\r\n.pm-dash-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }\r\n.pm-dash-title { font-size: 13px; font-weight: 800; color: var(--pm-text); }\r\n.pm-dash-row {\r\n  display: flex; align-items: center; gap: 8px;\r\n  padding: 8px 0;\r\n  border-bottom: 1px solid #eef2f6;\r\n  font-size: 12.5px;\r\n}\r\n.pm-dash-row:last-child { border-bottom: none; }\r\n.pm-dash-icon { flex-shrink: 0; }\r\n.pm-dash-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.pm-dash-date { color: var(--pm-muted); font-size: 11.5px; white-space: nowrap; }\r\n.pm-dash-date.pm-dash-overdue { color: var(--pm-red); font-weight: 700; }\r\n.pm-dash-amt { font-weight: 700; color: var(--pm-accent-strong); white-space: nowrap; }\r\n.pm-dash-empty { font-size: 12px; color: var(--pm-muted); padding: 10px 0 2px; }\r\n.pm-dash-more { font-size: 11px; color: var(--pm-accent); font-weight: 700; padding-top: 8px; }\r\n\r\n.pm-toolbar {\r\n  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\r\n  margin-bottom: 12px;\r\n}\r\n.pm-spacer { flex: 1; }\r\n.pm-toolbar-hint { font-size: 12px; color: var(--pm-muted); max-width: 460px; }\r\n.pm-search {\r\n  display: flex; align-items: center; gap: 6px;\r\n  background: var(--pm-card);\r\n  border: 1px solid var(--pm-border);\r\n  border-radius: 10px;\r\n  padding: 0 10px;\r\n  min-width: 200px;\r\n  flex: 0 1 260px;\r\n}\r\n.pm-search-ic { font-size: 13px; opacity: .7; }\r\n.pm-search .pm-input { border: none; box-shadow: none; background: transparent; padding: 8px 0; width: 100%; }\r\n\r\n/* ── Inputs / buttons ───────────────────────────────── */\r\n.pm-input {\r\n  font-family: inherit; font-size: 13px;\r\n  border: 1px solid var(--pm-border);\r\n  border-radius: 10px;\r\n  padding: 8px 10px;\r\n  background: var(--pm-card);\r\n  color: var(--pm-text);\r\n  width: 100%;\r\n  outline: none;\r\n  transition: border-color .15s, box-shadow .15s;\r\n}\r\n.pm-input:focus { border-color: var(--pm-accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, .14); }\r\n.pm-select { width: auto; min-width: 150px; cursor: pointer; }\r\n.pm-btn {\r\n  font-family: inherit; font-size: 13px; font-weight: 600;\r\n  border-radius: 10px;\r\n  padding: 8px 14px;\r\n  cursor: pointer;\r\n  border: 1px solid var(--pm-border);\r\n  background: var(--pm-card);\r\n  color: var(--pm-text);\r\n  display: inline-flex; align-items: center; gap: 6px;\r\n  transition: all .15s;\r\n  white-space: nowrap;\r\n}\r\n.pm-btn:hover { border-color: var(--pm-slate); }\r\n.pm-btn-primary { background: var(--pm-accent); border-color: var(--pm-accent); color: #fff; }\r\n.pm-btn-primary:hover { background: var(--pm-accent-strong); border-color: var(--pm-accent-strong); }\r\n.pm-btn-ghost { background: transparent; border-color: var(--pm-border); color: var(--pm-slate); }\r\n.pm-btn-ghost:hover { border-color: var(--pm-accent); color: var(--pm-accent-strong); }\r\n.pm-btn-danger { background: #fff; border-color: #fecaca; color: var(--pm-red); }\r\n.pm-btn-danger:hover { background: var(--pm-red-soft); border-color: #fca5a5; }\r\n.pm-btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }\r\n.pm-btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 7px; }\r\n.pm-btn:disabled { opacity: .5; cursor: not-allowed; }\r\n\r\n/* ── Chips ──────────────────────────────────────────── */\r\n.pm-chip {\r\n  display: inline-flex; align-items: center; gap: 4px;\r\n  border-radius: 999px; padding: 2px 9px;\r\n  font-size: 11px; font-weight: 700;\r\n  white-space: nowrap;\r\n}\r\n.pm-chip-slate { background: var(--pm-slate-soft); color: var(--pm-slate); }\r\n.pm-chip-red { background: var(--pm-red-soft); color: var(--pm-red); }\r\n.pm-chip-amber { background: var(--pm-amber-soft); color: var(--pm-amber); }\r\n.pm-chip-green { background: var(--pm-green-soft); color: var(--pm-green); }\r\n.pm-chip-blue { background: var(--pm-blue-soft); color: var(--pm-blue); }\r\n.pm-chip-accent { background: var(--pm-accent-soft); color: var(--pm-accent-strong); }\r\n\r\n/* ── List items ─────────────────────────────────────── */\r\n.pm-list { display: flex; flex-direction: column; gap: 10px; }\r\n.pm-item {\r\n  display: grid;\r\n  grid-template-columns: minmax(0, 1fr) auto auto;\r\n  gap: 14px;\r\n  align-items: center;\r\n  background: var(--pm-card);\r\n  border: 1px solid var(--pm-border);\r\n  border-left: 4px solid var(--pm-slate);\r\n  border-radius: var(--pm-radius);\r\n  padding: 12px 14px;\r\n  box-shadow: var(--pm-shadow);\r\n}\r\n.pm-item--overdue { border-left-color: var(--pm-red); }\r\n.pm-item--month { border-left-color: var(--pm-accent); }\r\n.pm-item--upcoming { border-left-color: var(--pm-slate); }\r\n.pm-item--paused { opacity: .62; }\r\n.pm-item-main { min-width: 0; }\r\n.pm-item-title {\r\n  font-size: 14px; font-weight: 700;\r\n  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;\r\n  word-break: break-word;\r\n}\r\n.pm-item-meta {\r\n  font-size: 12px; color: var(--pm-muted);\r\n  margin-top: 3px;\r\n  word-break: break-word;\r\n}\r\n.pm-item-meta b { color: var(--pm-slate); font-weight: 600; }\r\n.pm-item-due { text-align: right; }\r\n.pm-due-date { font-size: 13px; font-weight: 700; }\r\n.pm-due-sub { font-size: 11px; color: var(--pm-muted); margin-top: 2px; }\r\n.pm-item-amount { text-align: right; font-size: 15px; font-weight: 800; color: var(--pm-accent-strong); white-space: nowrap; }\r\n.pm-item-amount .cur { font-size: 11px; font-weight: 600; color: var(--pm-muted); margin-left: 3px; }\r\n.pm-item-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }\r\n.pm-subrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }\r\n\r\n/* ── History expander ───────────────────────────────── */\r\n.pm-hist-box {\r\n  margin: 10px 0 0;\r\n  border: 1px solid var(--pm-border);\r\n  border-radius: 10px;\r\n  background: #fbfcfd;\r\n  overflow: hidden;\r\n}\r\n.pm-hist-row {\r\n  display: grid;\r\n  grid-template-columns: 110px minmax(0, 1fr) auto auto;\r\n  gap: 10px;\r\n  align-items: center;\r\n  padding: 7px 12px;\r\n  font-size: 12px;\r\n  border-bottom: 1px solid var(--pm-border);\r\n}\r\n.pm-hist-row:last-child { border-bottom: none; }\r\n.pm-hist-row .h-due { font-weight: 700; }\r\n.pm-hist-row .h-amt { font-weight: 700; color: var(--pm-accent-strong); white-space: nowrap; }\r\n.pm-hist-row .h-by { color: var(--pm-muted); }\r\n.pm-hist-empty { padding: 10px 12px; font-size: 12px; color: var(--pm-muted); }\r\n\r\n/* ── Empty state ────────────────────────────────────── */\r\n.pm-empty {\r\n  text-align: center;\r\n  padding: 44px 20px;\r\n  background: var(--pm-card);\r\n  border: 1px dashed var(--pm-border);\r\n  border-radius: var(--pm-radius);\r\n}\r\n.pm-empty-ic { font-size: 34px; }\r\n.pm-empty-title { font-size: 15px; font-weight: 700; margin: 10px 0 4px; }\r\n.pm-empty-sub { font-size: 13px; color: var(--pm-muted); max-width: 460px; margin: 0 auto; }\r\n.pm-empty-actions { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }\r\n\r\n/* ── Table ──────────────────────────────────────────── */\r\n.pm-table-card {\r\n  background: var(--pm-card);\r\n  border: 1px solid var(--pm-border);\r\n  border-radius: var(--pm-radius);\r\n  box-shadow: var(--pm-shadow);\r\n  overflow-x: auto;\r\n}\r\n.pm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }\r\n.pm-table th {\r\n  text-align: left; padding: 10px 12px;\r\n  background: #f8fafc;\r\n  color: var(--pm-muted);\r\n  font-size: 11px; text-transform: uppercase; letter-spacing: .4px;\r\n  border-bottom: 1px solid var(--pm-border);\r\n  white-space: nowrap;\r\n}\r\n.pm-table td { padding: 9px 12px; border-bottom: 1px solid #eef2f6; vertical-align: top; }\r\n.pm-table tr:last-child td { border-bottom: none; }\r\n.pm-table .t-amt { font-weight: 700; color: var(--pm-accent-strong); white-space: nowrap; }\r\n.pm-table .t-name { font-weight: 600; }\r\n.pm-rowcount { font-size: 12px; color: var(--pm-muted); padding: 8px 2px; }\r\n.pm-hist-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }\r\n\r\n/* ── Modal ──────────────────────────────────────────── */\r\n.pm-backdrop {\r\n  position: fixed; inset: 0;\r\n  background: rgba(15, 23, 42, .5);\r\n  display: flex; align-items: flex-start; justify-content: center;\r\n  padding: 40px 16px;\r\n  overflow: auto;\r\n  z-index: 60;\r\n}\r\n.pm-modal {\r\n  background: #fff;\r\n  border-radius: 16px;\r\n  width: 100%;\r\n  max-width: 620px;\r\n  box-shadow: var(--pm-shadow-lg);\r\n  animation: pmPop .18s ease-out;\r\n}\r\n@keyframes pmPop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }\r\n.pm-modal-head {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 14px 18px;\r\n  border-bottom: 1px solid var(--pm-border);\r\n}\r\n.pm-modal-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }\r\n.pm-modal-close {\r\n  border: none; background: var(--pm-slate-soft);\r\n  width: 28px; height: 28px; border-radius: 8px;\r\n  cursor: pointer; font-size: 13px; color: var(--pm-slate);\r\n}\r\n.pm-modal-close:hover { background: var(--pm-red-soft); color: var(--pm-red); }\r\n.pm-modal-body { padding: 16px 18px; }\r\n.pm-modal-foot {\r\n  display: flex; justify-content: flex-end; gap: 10px;\r\n  padding: 14px 18px;\r\n  border-top: 1px solid var(--pm-border);\r\n  background: #f8fafc;\r\n  border-radius: 0 0 16px 16px;\r\n}\r\n.pm-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\r\n.pm-fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }\r\n.pm-fld-full { grid-column: 1 / -1; }\r\n.pm-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--pm-slate); }\r\n.pm-req { color: var(--pm-red); }\r\n.pm-hint { font-size: 11px; color: var(--pm-muted); }\r\n.pm-modal-note {\r\n  margin: 0 0 14px; padding: 10px 12px;\r\n  background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 10px;\r\n  font-size: 12.5px; color: var(--pm-accent-strong);\r\n}\r\n.pm-newpayee-box {\r\n  grid-column: 1 / -1;\r\n  border: 1px dashed var(--pm-accent);\r\n  background: #f0fdfa;\r\n  border-radius: 10px;\r\n  padding: 12px;\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr 1fr;\r\n  gap: 10px;\r\n}\r\n.pm-newpayee-box .pm-fld { grid-column: auto; }\r\n.pm-confirm-text { font-size: 14px; margin: 0; }\r\n\r\n/* ── Month view section titles ──────────────────────── */\r\n.pm-mv-title {\r\n  display: flex; align-items: center; gap: 8px;\r\n  font-size: 13px; font-weight: 700;\r\n  padding: 4px 2px;\r\n}\r\n.pm-mv-title .pm-mv-total { margin-left: auto; color: var(--pm-muted); font-weight: 600; }\r\n\r\n/* ── Textarea (export/import) ────────────────────────── */\r\n.pm-textarea {\r\n  min-height: 190px;\r\n  resize: vertical;\r\n  font-family: ui-monospace, Consolas, \"Courier New\", monospace;\r\n  font-size: 12px;\r\n  line-height: 1.5;\r\n}\r\n.pm-check {\r\n  display: flex; align-items: center; gap: 8px;\r\n  font-size: 13px; font-weight: 600; color: var(--pm-text);\r\n  cursor: pointer;\r\n}\r\n.pm-check input { accent-color: var(--pm-accent); width: 15px; height: 15px; }\r\n\r\n/* ── Budget progress ─────────────────────────────────── */\r\n.pm-progress {\r\n  height: 8px; border-radius: 999px;\r\n  background: var(--pm-slate-soft);\r\n  overflow: hidden;\r\n  margin-top: 8px;\r\n  max-width: 440px;\r\n}\r\n.pm-progress i {\r\n  display: block; height: 100%;\r\n  background: var(--pm-accent);\r\n  border-radius: 999px;\r\n  transition: width .3s;\r\n}\r\n.pm-progress i.pm-progress-warn { background: var(--pm-amber); }\r\n.pm-progress i.pm-progress-over { background: var(--pm-red); }\r\n\r\n/* ── QuickBooks import preview ───────────────────────── */\r\n.pm-qb-rows { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }\r\n.pm-qb-row {\r\n  display: grid;\r\n  grid-template-columns: 90px minmax(0, 1.2fr) minmax(0, 1fr) 90px minmax(140px, 1fr);\r\n  gap: 8px; align-items: center;\r\n  padding: 6px 8px;\r\n  border: 1px solid var(--pm-border);\r\n  border-radius: 8px;\r\n  background: var(--pm-card);\r\n  font-size: 12px;\r\n}\r\n.pm-qb-row .pm-qb-date { font-weight: 700; color: var(--pm-slate); white-space: nowrap; }\r\n.pm-qb-row .pm-qb-payee { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.pm-qb-row .pm-qb-memo { color: var(--pm-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.pm-qb-row .pm-qb-amt { font-weight: 700; color: var(--pm-accent-strong); white-space: nowrap; }\r\n.pm-qb-row .pm-select { min-width: 120px; width: 100%; padding: 4px 6px; font-size: 11px; }\r\n@media (max-width: 720px) {\r\n  .pm-qb-row { grid-template-columns: 80px minmax(0, 1fr) 80px; }\r\n  .pm-qb-row .pm-qb-memo { display: none; }\r\n  .pm-qb-row .pm-select { grid-column: 1 / -1; }\r\n}\r\n\r\n/* ── Responsive ─────────────────────────────────────── */\r\n@media (max-width: 860px) {\r\n  .pm-body { flex-direction: column; }\r\n  .pm-side {\r\n    width: 100%;\r\n    flex-direction: row;\r\n    flex-wrap: nowrap;\r\n    overflow-x: auto;\r\n    border-right: none;\r\n    border-bottom: 1px solid var(--pm-border);\r\n    padding: 8px 10px;\r\n  }\r\n  .pm-side .pm-tab-btn { width: auto; white-space: nowrap; flex-shrink: 0; }\r\n}\r\n@media (max-width: 720px) {\r\n  .pm-item { grid-template-columns: minmax(0, 1fr) auto; }\r\n  .pm-item-due { text-align: left; }\r\n  .pm-item-amount { grid-column: 1 / -1; text-align: left; }\r\n  .pm-item-actions { grid-column: 1 / -1; justify-content: flex-start; }\r\n  .pm-form-grid { grid-template-columns: 1fr; }\r\n  .pm-fld-full { grid-column: auto; }\r\n  .pm-newpayee-box { grid-template-columns: 1fr; }\r\n  .pm-hist-row { grid-template-columns: 80px minmax(0, 1fr) auto; }\r\n  .pm-hist-row .h-by { display: none; }\r\n}\r\n"},"js":{"name":"PaymentsManagement.js","src":"../app/PaymentsManagement.js","content":"// ════════════════════════════════════════════════════════════════\r\n// Payments Management — UniconHub html-tool\r\n// All data lives in the tool value:\r\n//   { version, payees: [], regulars: [], requests: [] }\r\n// No CMS object CRUD needed — simple, instant, zero admin setup.\r\n// ════════════════════════════════════════════════════════════════\r\n'use strict';\r\n\r\n// ── Constants ────────────────────────────────────────────────\r\nvar METHODS = [\r\n  { id: 'interac', label: 'Interac e-Transfer', hint: 'Email address for the e-Transfer' },\r\n  { id: 'eft', label: 'Bank Transfer / EFT', hint: 'Account / routing details' },\r\n  { id: 'cheque', label: 'Cheque', hint: 'Payable-to name / mailing info' },\r\n  { id: 'cash', label: 'Cash', hint: 'Where / who handles the cash' },\r\n  { id: 'card', label: 'Credit Card', hint: 'Card / account reference' },\r\n  { id: 'paypal', label: 'PayPal', hint: 'PayPal email address' },\r\n  { id: 'wire', label: 'Wire Transfer', hint: 'SWIFT / IBAN / bank details' },\r\n  { id: 'other', label: 'Other', hint: 'Any details needed to make the payment' }\r\n];\r\nvar CADENCES = [\r\n  { id: 'weekly', label: 'Weekly', every: 'every 7 days' },\r\n  { id: 'biweekly', label: 'Bi-weekly', every: 'every 14 days' },\r\n  { id: 'monthly', label: 'Monthly', every: 'every month' },\r\n  { id: 'quarterly', label: 'Quarterly', every: 'every 3 months' },\r\n  { id: 'yearly', label: 'Yearly', every: 'every 12 months' }\r\n];\r\nvar CURRENCIES = ['CAD', 'USD', 'TRY', 'EUR', 'GBP', 'AUD', 'AED', 'SAR'];\r\nvar DEFAULT_CATS = 'Rent,Utilities,Payroll,Insurance,Taxes,Software,Supplies,Reimbursement,Other';\r\n\r\n// ── State ────────────────────────────────────────────────────\r\nvar DB = null;\r\nvar _user = null;\r\nvar _readOnly = false;\r\nvar _saving = false;\r\nvar _defaultCurrency = 'CAD';\r\nvar _resizeRaf = null;\r\n\r\n// ── Small helpers ────────────────────────────────────────────\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction esc(s) {\r\n  return String(s === null || s === undefined ? '' : s)\r\n    .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\r\n}\r\nfunction uid(p) { return (p || 'pm') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\r\nfunction pad2(n) { return (n < 10 ? '0' : '') + n; }\r\nfunction parseISO(s) {\r\n  if (!s) return null;\r\n  var p = String(s).slice(0, 10).split('-');\r\n  if (p.length !== 3) return null;\r\n  return new Date(+p[0], +p[1] - 1, +p[2]);\r\n}\r\nfunction isoDay(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }\r\nfunction startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }\r\nfunction addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }\r\nfunction clampDay(y, m1, day) { var dim = new Date(y, m1, 0).getDate(); return Math.min(day, dim); }\r\nfunction monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }\r\nfunction monthEnd(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }\r\nfunction fmtDate(d) {\r\n  if (!d) return '—';\r\n  var t = new Date();\r\n  var sameYear = d.getFullYear() === t.getFullYear();\r\n  var opts = { month: 'short', day: 'numeric' };\r\n  if (!sameYear) opts.year = 'numeric';\r\n  return d.toLocaleDateString(undefined, opts);\r\n}\r\nfunction fmtDateFull(d) {\r\n  if (!d) return '—';\r\n  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });\r\n}\r\nfunction monthLabel(ym) {\r\n  if (!ym) return '—';\r\n  var p = ym.split('-');\r\n  var d = new Date(+p[0], +p[1] - 1, 1);\r\n  return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });\r\n}\r\nfunction fmtMoney(amount, cur) {\r\n  if (amount === '' || amount === null || amount === undefined || isNaN(+amount)) return '—';\r\n  cur = cur || defCurrency();\r\n  try {\r\n    return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(+amount);\r\n  } catch (e) {\r\n    return cur + ' ' + Number(amount).toFixed(2);\r\n  }\r\n}\r\nfunction defCurrency() {\r\n  if (!_defaultCurrency) _defaultCurrency = tool.param('defaultCurrency', 'CAD') || 'CAD';\r\n  return _defaultCurrency;\r\n}\r\nfunction methodById(id) {\r\n  for (var i = 0; i < METHODS.length; i++) if (METHODS[i].id === id) return METHODS[i];\r\n  return null;\r\n}\r\nfunction methodLabel(id) { var m = methodById(id); return m ? m.label : (id || '—'); }\r\nfunction cadenceById(id) {\r\n  for (var i = 0; i < CADENCES.length; i++) if (CADENCES[i].id === id) return CADENCES[i];\r\n  return null;\r\n}\r\nfunction sumByCurrency(rows) {\r\n  var map = {};\r\n  rows.forEach(function (r) {\r\n    var c = r.currency || defCurrency();\r\n    var a = +r.amount;\r\n    if (!isNaN(a) && a > 0) map[c] = (map[c] || 0) + a;\r\n  });\r\n  return map;\r\n}\r\nfunction fmtSumMap(map) {\r\n  var keys = Object.keys(map);\r\n  if (!keys.length) return '—';\r\n  return keys.map(function (c) { return fmtMoney(map[c], c); }).join(' &middot; ');\r\n}\r\nfunction scheduleResize() {\r\n  if (_resizeRaf) cancelAnimationFrame(_resizeRaf);\r\n  _resizeRaf = requestAnimationFrame(function () {\r\n    _resizeRaf = null;\r\n    if (tool && tool.resize) tool.resize();\r\n  });\r\n}\r\n\r\n// ── Document size (1 MB Firestore limit) ──────────────────\r\nfunction estSizeBytes() {\r\n  try {\r\n    var s = JSON.stringify(DB);\r\n    var ascii = 0, nonAscii = 0;\r\n    for (var i = 0; i < s.length; i++) {\r\n      if (s.charCodeAt(i) < 128) ascii++; else nonAscii++;\r\n    }\r\n    return ascii + nonAscii * 2; // UTF-8 estimate\r\n  } catch (e) { return 0; }\r\n}\r\nfunction fmtSize(b) {\r\n  if (b < 1024) return b + ' B';\r\n  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';\r\n  return (b / 1048576).toFixed(2) + ' MB';\r\n}\r\n\r\n// ── Roles / permissions ─────────────────────────────────────\r\nfunction getRoles() {\r\n  var u = _user || (tool.getUser ? tool.getUser() : null);\r\n  return (u && u.roles) ? u.roles : [];\r\n}\r\nfunction canWrite() {\r\n  var r = getRoles();\r\n  return r.indexOf('developer') !== -1 || r.indexOf('owner') !== -1 || r.indexOf('admin') !== -1 ||\r\n    r.indexOf('user-manager') !== -1 || r.indexOf('editor') !== -1;\r\n}\r\nfunction canAdmin() {\r\n  var r = getRoles();\r\n  return r.indexOf('developer') !== -1 || r.indexOf('owner') !== -1 || r.indexOf('admin') !== -1 ||\r\n    r.indexOf('user-manager') !== -1;\r\n}\r\nfunction currentUserName() {\r\n  var u = _user || (tool.getUser ? tool.getUser() : null);\r\n  return (u && u.name) ? u.name : 'Unknown';\r\n}\r\nfunction currentUserId() {\r\n  var u = _user || (tool.getUser ? tool.getUser() : null);\r\n  return (u && u.id) ? u.id : 'unknown';\r\n}\r\nfunction currentUserEmail() {\r\n  var u = _user || (tool.getUser ? tool.getUser() : null);\r\n  return (u && u.email) ? String(u.email) : '';\r\n}\r\n// Users listed in the 'paymentsTeamEmails' param can manage regulars and mark\r\n// things paid (like the accountant). Admins are always on the team.\r\nfunction teamEmails() {\r\n  var s = tool.param('paymentsTeamEmails', '');\r\n  return (s || '').split(',').map(function (x) { return x.trim().toLowerCase(); }).filter(Boolean);\r\n}\r\nfunction isPaymentTeam() {\r\n  if (canAdmin()) return true;\r\n  var e = currentUserEmail().toLowerCase();\r\n  return !!e && teamEmails().indexOf(e) !== -1;\r\n}\r\n// 'own' = users see only the requests they added themselves (per department).\r\n// 'all' = everyone with access sees all requests.\r\nfunction requestVisibilityOwn() {\r\n  return String(tool.param('requestVisibility', 'own')).toLowerCase() !== 'all';\r\n}\r\nfunction isOwnRequest(q) {\r\n  var uid = currentUserId();\r\n  if (q.requestedById && uid !== 'unknown' && q.requestedById === uid) return true;\r\n  var email = currentUserEmail().toLowerCase();\r\n  if (q.requestedByEmail && email && String(q.requestedByEmail).toLowerCase() === email) return true;\r\n  if (q.requestedById && uid === 'unknown') return false;\r\n  // legacy fallback: match by display name only when no id was ever stored\r\n  if (!q.requestedById && !q.requestedByEmail && q.requestedBy && currentUserName() === q.requestedBy) return true;\r\n  return false;\r\n}\r\nfunction canSeeRequest(q) {\r\n  if (canAdmin() || isPaymentTeam()) return true;\r\n  if (!requestVisibilityOwn()) return true;\r\n  return isOwnRequest(q);\r\n}\r\nfunction canAddRequest() { return !_readOnly && canWrite(); }\r\n// Manage regular payments, payees, and check anything off — admin or payments team.\r\nfunction canManage() { return !_readOnly && canWrite() && isPaymentTeam(); }\r\n// A requester can still edit or withdraw their own pending/declined request.\r\nfunction canEditRequestRow(q) {\r\n  if (_readOnly || !canWrite()) return false;\r\n  if (canAdmin()) return true;\r\n  return isOwnRequest(q) && (q.status === 'pending' || q.status === 'declined');\r\n}\r\nfunction visiblePendingRequests() {\r\n  return DB.requests.filter(function (r) { return r.status === 'pending' && canSeeRequest(r); });\r\n}\r\nfunction roleLabel() {\r\n  var r = getRoles();\r\n  if (!_user) return 'Not signed in';\r\n  if (r.indexOf('admin') !== -1 || r.indexOf('owner') !== -1) return 'Admin';\r\n  if (r.indexOf('developer') !== -1) return 'Developer';\r\n  if (r.indexOf('editor') !== -1) return 'Editor';\r\n  return 'Viewer';\r\n}\r\n\r\n// ── DB normalisation / persistence ──────────────────────────\r\nfunction normalizeDB(v) {\r\n  var out = (v && typeof v === 'object') ? v : {};\r\n  if (!Array.isArray(out.payees)) out.payees = [];\r\n  if (!Array.isArray(out.regulars)) out.regulars = [];\r\n  if (!Array.isArray(out.requests)) out.requests = [];\r\n  if (!Array.isArray(out.departments)) out.departments = [];\r\n  if (!Array.isArray(out.types)) out.types = [];\r\n  if (!Array.isArray(out.sources)) out.sources = [];\r\n  out.version = 1;\r\n  out.payees.forEach(function (p) {\r\n    if (!p.id) p.id = uid('pye');\r\n    if (!p.method) p.method = 'interac';\r\n    if (!p.detail) p.detail = '';\r\n    if (!p.note) p.note = '';\r\n  });\r\n  out.departments.forEach(function (d) {\r\n    if (!d.id) d.id = uid('dep');\r\n    if (!d.name) d.name = 'Department';\r\n    if (!d.budget) d.budget = 0;\r\n    if (!d.currency) d.currency = defCurrency();\r\n    if (!d.note) d.note = '';\r\n  });\r\n  out.types.forEach(function (t) {\r\n    if (!t.id) t.id = uid('typ');\r\n    if (!t.name) t.name = 'Type';\r\n    if (!t.note) t.note = '';\r\n  });\r\n  out.sources.forEach(function (s) {\r\n    if (!s.id) s.id = uid('src');\r\n    if (!s.name) s.name = 'Source';\r\n    if (!s.note) s.note = '';\r\n  });\r\n  var typeByName = {};\r\n  out.types.forEach(function (t) { typeByName[String(t.name).toLowerCase()] = t; });\r\n  function findOrCreateType(name) {\r\n    name = String(name || '').trim();\r\n    if (!name) return '';\r\n    var key = name.toLowerCase();\r\n    if (typeByName[key]) return typeByName[key].id;\r\n    var t = { id: uid('typ'), name: name, note: '' };\r\n    out.types.push(t);\r\n    typeByName[key] = t;\r\n    return t.id;\r\n  }\r\n  out.regulars.forEach(function (r) {\r\n    if (!r.id) r.id = uid('reg');\r\n    if (!r.cadence) r.cadence = 'monthly';\r\n    if (!r.currency) r.currency = defCurrency();\r\n    if (!Array.isArray(r.history)) r.history = [];\r\n    if (r.active === undefined || r.active === null) r.active = true;\r\n    if (!r.category) r.category = '';\r\n    if (!r.typeId) r.typeId = findOrCreateType(r.category);\r\n    if (!r.departmentId) r.departmentId = '';\r\n    if (!r.sourceId) r.sourceId = '';\r\n    if (!r.note) r. ' +\r\n      '<div class=\"pm-item-amount\">' + fmtMoney(r.amount, r.currency) + '<\/div>' +\r\n      '<div class=\"pm-item-actions\">' + actions + '<\/div>' +\r\n    '<\/div>';\r\n  });\r\n  list.innerHTML = html;\r\n}\r\nfunction approveRequest(id) {\r\n  var r = findRequest(id);\r\n  if (!r) return;\r\n  r.status = 'approved';\r\n  r.approvedBy = currentUserName();\r\n  r.approvedAt = new Date().toISOString();\r\n  persist();\r\n  renderAll();\r\n  notify('Request approved: ' + r.title, 'success');\r\n}\r\nfunction declineRequest(id) {\r\n  var r = findRequest(id);\r\n  if (!r) return;\r\n  confirmDlg('Decline this request?', '<strong>' + esc(r.title) + '<\/strong> will be marked as declined.', 'Decline', 'danger', function () {\r\n    r.status = 'declined';\r\n    r.approvedBy = currentUserName();\r\n    r.approvedAt = new Date().toISOString();\r\n    persist();\r\n    renderAll();\r\n    notify('Request declined: ' + r.title, 'warning');\r\n  });\r\n}\r\nfunction reopenRequest(id) {\r\n  var r = findRequest(id);\r\n  if (!r) return;\r\n  r.status = 'pending';\r\n  r.paidAt = '';\r\n  r.paidBy = '';\r\n  persist();\r\n  renderAll();\r\n  notify('Request moved back to pending: ' + r.title, 'info');\r\n}\r\nfunction deleteRequest(id) {\r\n  var r = findRequest(id);\r\n  if (!r) return;\r\n  confirmDlg('Delete this request?', '<strong>' + esc(r.title) + '<\/strong> will be removed. This cannot be undone.', 'Delete', 'danger', function () {\r\n    DB.requests = DB.requests.filter(function (x) { return x.id !== id; });\r\n    persist();\r\n    renderAll();\r\n    notify('Deleted: ' + r.title, 'info');\r\n  });\r\n}\r\n\r\n// ── Payees tab ──────────────────────────────────────────────\r\nfunction payeeUsage(payeeId) {\r\n  var n = 0;\r\n  DB.regulars.forEach(function (r) { if (r.payeeId === payeeId) n++; });\r\n  DB.requests.forEach(function (r) { if (r.payeeId === payeeId) n++; });\r\n  return n;\r\n}\r\nfunction renderPayees() {\r\n  var list = el('payees-list');\r\n  if (!list) return;\r\n  if (!DB.payees.length) {\r\n    list.innerHTML = emptyState('👥', 'No payees saved yet',\r\n      'Save who you pay (and how) once, then pick them from the dropdown when adding any payment.');\r\n    return;\r\n  }\r\n  var html = '';\r\n  DB.payees.slice().sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); }).forEach(function (p) {\r\n    var used = payeeUsage(p.id);\r\n    html += '<div class=\"pm-item\">' +\r\n      '<div class=\"pm-item-main\">' +\r\n        '<div class=\"pm-item-title\">' + esc(p.name) +\r\n          ' <span class=\"pm-chip pm-chip-accent\">' + methodLabel(p.method) + '<\/span>' +\r\n        '<\/div>' +\r\n        '<div class=\"pm-item-meta\">' + (p.detail ? esc(p.detail) : 'no method details') + (p.note ? ' &middot; ' + esc(p.note) : '') + '<\/div>' +\r\n      '<\/div>' +\r\n      '<div class=\"pm-item-due\"><div class=\"pm-due-date\">' + used + '<\/div><div class=\"pm-due-sub\">payments use this<\/div><\/div>' +\r\n      '<div class=\"pm-item-actions\">' +\r\n        (canManage() ?\r\n          '<button class=\"pm-btn pm-btn-ghost pm-btn-sm\" type=\"button\" onclick=\"openPayeeForm(\\'' + p.id + '\\')\">✏️<\/button>' +\r\n          '<button class=\"pm-btn pm-btn-danger pm-btn-sm\" type=\"button\" onclick=\"deletePayee(\\'' + p.id + '\\')\">🗑<\/button>' :\r\n          '<span class=\"pm-chip pm-chip-slate\">🔒<\/span>') +\r\n      '<\/div>' +\r\n    '<\/div>';\r\n  });\r\n  list.innerHTML = html;\r\n}\r\nfunction deletePayee(id) {\r\n  var p = findPayee(id);\r\n  if (!p) return;\r\n  confirmDlg('Delete this payee?',\r\n    '<strong>' + esc(p.name) + '<\/strong> will be removed from the list. Existing payments keep their details.',\r\n    'Delete', 'danger', function () {\r\n      DB.payees = DB.payees.filter(function (x) { return x.id !== id; });\r\n      persist();\r\n      renderAll();\r\n      notify('Payee deleted: ' + p.name, 'info');\r\n    });\r\n}\r\n\r\n// ── Departments, types, sources (org tab) ────────────────────\r\nfunction monthlyEquivalent(reg) {\r\n  var a = +reg.amount;\r\n  if (isNaN(a) || a <= 0) return 0;\r\n  switch (reg.cadence) {\r\n    case 'weekly': return a * 52 / 12;\r\n    case 'biweekly': return a * 26 / 12;\r\n    case 'quarterly': return a / 3;\r\n    case 'yearly': return a / 12;\r\n    default: return a;\r\n  }\r\n}\r\nfunction deptStats(dept) {\r\n  var yStr = String(new Date().getFullYear());\r\n  var cur = dept.currency || defCurrency();\r\n  var used = 0, planned = 0, activeRegs = 0;\r\n  DB.regulars.forEach(function (r) {\r\n    if (r.departmentId !== dept.id) return;\r\n    if ((r.currency || defCurrency()) !== cur) return;\r\n    if (r.active) { planned += monthlyEquivalent(r); activeRegs++; }\r\n    (r.history || []).forEach(function (h) {\r\n      var d = (h.departmentId !== undefined && h.departmentId !== '') ? h.departmentId : r.departmentId;\r\n      if (d !== dept.id) return;\r\n      if (String(h.paidAt || '').slice(0, 4) !== yStr) return;\r\n      used += +h.amount || 0;\r\n    });\r\n  });\r\n  DB.requests.forEach(function (q) {\r\n    if (q.departmentId !== dept.id) return;\r\n    if ((q.currency || defCurrency()) !== cur) return;\r\n    if (q.status === 'paid' && String(q.paidAt || '').slice(0, 4) === yStr) {\r\n      used += +(q.paidAmount !== '' && q.paidAmount !== undefined && q.paidAmount !== null ? q.paidAmount : q.amount) || 0;\r\n    }\r\n  });\r\n  var budget = +dept.budget || 0;\r\n  var left = budget - used;\r\n  var monthsLeft = planned > 0 ? left / planned : null;\r\n  return { used: used, planned: planned, budget: budget, left: left, monthsLeft: monthsLeft, activeRegs: activeRegs, currency: cur };\r\n}\r\nfunction renderOrg() {\r\n  renderDepartments();\r\n  renderTypes();\r\n  renderSources();\r\n}\r\nfunction renderDepartments() {\r\n  var list = el('dept-list');\r\n  if (!list) return;\r\n  if (!DB.departments.length) {\r\n    list.innerHTML = emptyState('🏢', 'No departments yet',\r\n ue=\"all\">All months<\/option>';\r\n  Object.keys(months).sort().reverse().forEach(function (m) {\r\n    mOpts += '<option value=\"' + esc(m) + '\">' + esc(monthLabel(m)) + '<\/option>';\r\n  });\r\n  monthSel.innerHTML = mOpts;\r\n  if (prevMonth && months[prevMonth]) monthSel.value = prevMonth;\r\n  var cOpts = '<option value=\"all\">All categories<\/option>';\r\n  Object.keys(cats).sort().forEach(function (c) {\r\n    cOpts += '<option value=\"' + esc(c) + '\">' + esc(c) + '<\/option>';\r\n  });\r\n  catSel.innerHTML = cOpts;\r\n  if (prevCat && cats[prevCat]) catSel.value = prevCat;\r\n\r\n  var rows = historyFiltered();\r\n  var body = el('history-body');\r\n  var summary = el('history-summary');\r\n  var sums = sumByCurrency(rows.map(function (r) { return { amount: r.amount, currency: r.currency }; }));\r\n  summary.innerHTML =\r\n    statChip('🧾', 'Payments', rows.length, 'in this view', '') +\r\n    statChip('💰', 'Total', fmtSumMap(sums), 'all currencies', 'pm-stat--paid');\r\n  if (!rows.length) {\r\n    body.innerHTML = '<tr><td colspan=\"9\"><div class=\"pm-empty\" style=\"border:none\"><div class=\"pm-empty-ic\">📊<\/div><div class=\"pm-empty-title\">No paid payments here<\/div><div class=\"pm-empty-sub\">Mark payments as paid and they will show up in this log automatically.<\/div><\/div><\/td><\/tr>';\r\n    el('history-count').textContent = '';\r\n    return;\r\n  }\r\n  var html = '';\r\n  rows.forEach(function (h) {\r\n    html += '<tr>' +\r\n      '<td>' + esc(fmtDate(parseISO(h.paidAt))) + '<\/td>' +\r\n      '<td>' + esc(fmtDate(parseISO(h.due))) + '<\/td>' +\r\n      '<td class=\"t-name\" title=\"' + esc(h.note) + '\">' + esc(h.name) + '<\/td>' +\r\n      '<td>' + (h.kind === 'Regular' ? '🔁' : '📩') + ' ' + esc(h.kind) + '<\/td>' +\r\n      '<td>' + esc(h.category) + '<\/td>' +\r\n      '<td>' + esc(methodLabel(h.method)) + '<\/td>' +\r\n      '<td>' + esc(h.who) + '<\/td>' +\r\n      '<td class=\"t-amt\">' + fmtMoney(h.amount, h.currency) + '<\/t \n      note: q.payNote || q.note || '',\r\n      requestedBy: q.requestedBy\r\n    });\r\n  });\r\n  var notDone = [], done = [];\r\n  rows.forEach(function (row) {\r\n    if (row.status === 'paid' || row.status === 'declined') done.push(row);\r\n    else notDone.push(row);\r\n  });\r\n  notDone.sort(function (a, b) {\r\n    var ta = a.due ? a.due.getTime() : 8640000000000;\r\n    var tb = b.due ? b.due.getTime() : 8640000000000;\r\n    return ta - tb;\r\n  });\r\n  done.sort(function (a, b) { return String(b.paidAt).localeCompare(String(a.paidAt)); });\r\n  var sumNot = sumByCurrency(notDone.map(function (r) { return { amount: r.amount, currency: r.currency }; }));\r\n  var sumPaid = sumByCurrency(done.filter(function (r) { return r.status === 'paid'; }).map(function (r) { return { amount: r.amount, currency: r.currency }; }));\r\n  var sumTotal = {};\r\n  [sumNot, sumPaid].forEach(function (m) { Object.keys(m).forEach(function (c) { sumTotal[c] = (sumTotal[c] || 0) + m[c]; }); });\r\n  return { rows: rows, notDone: notDone, done: done, sumNot: sumNot, sumPaid: sumPaid, sumTotal: sumTotal };\r\n}\r\nfunction monthViewRowHtml(row) {\r\n  var today = startOfDay(new Date());\r\n  var isLate = row.status !== 'paid' && row.status !== 'declined' && row.due && row.due < today;\r\n  var typeChip = row.kind === 'regular' ? '<span class=\"pm-chip pm-chip-slate\">🔁 Regular<\/span>' : '<span class=\"pm-chip pm-chip-slate\">📩 Request<\/span>';\r\n  var statusChip;\r\n  if (row.status === 'paid') statusChip = '<span class=\"pm-chip pm-chip-green\">✓ Paid<\/span>';\r\n  else if (row.status === 'declined') statusChip = '<span class=\"pm-chip pm-chip-slate\">✕ Declined<\/span>';\r\n  else if (row.status === 'pending') statusChip = '<span class=\"pm-chip pm-chip-amber\">🕐 Pending approval<\/span>';\r\n  else if (row.status === 'approved') statusChip = '<span class=\"pm-chip pm-chip-blue\">✅ Approved<\/span>';\r\n  else statusChip = '<span class=\"pm-chip pm-chip-red\">✗ Not paid<\/   }\r\n  var after = estSizeBytes();\r\n  persist();\r\n  closeModal();\r\n  renderAll();\r\n  notify('Trimmed ' + removed + ' old record' + (removed !== 1 ? 's' : '') + ' — freed ~' + fmtSize(Math.max(0, before - after)), 'success');\r\n}\r\n\r\n// ── Exports ─────────────────────────────────────────────────\r\nfunction csvCell(c) {\r\n  c = String(c === null || c === undefined ? '' : c);\r\n  return /[\",\\n]/.test(c) ? '\"' + c.replace(/\"/g, '\"\"') + '\"' : c;\r\n}\r\nfunction downloadCsv(filename, lines) {\r\n  var csv = lines.map(function (row) { return row.map(csvCell).join(','); }).join('\\r\\n');\r\n  try {\r\n    var blob = new Blob(['\\ufeff' + csv], { type: 'text/csv;charset=utf-8' });\r\n    var a = document.createElement('a');\r\n    a.href = URL.createObjectURL(blob);\r\n    a.download = filename;\r\n    document.body.appendChild(a);\r\n    a.click();\r\n    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);\r\n    return true;\r\n  } catch (e) {\r\n    return false;\r\n  }\r\n}\r\nfunction exportCsv() {\r\n  var rows = historyFiltered();\r\n  if (!rows.length) { notify('Nothing to export with the current filters', 'warning'); return; }\r\n  var lines = [['Paid on', 'Due', 'Payment', 'Type', 'Category', 'Method', 'Who', 'Amount', 'Currency', 'Paid by', 'Note']];\r\n  rows.forEach(function (h) {\r\n    lines.push([h.paidAt, h.due, h.name, h.kind, h.category, methodLabel(h.method), h.who, h.amount, h.currency, h.paidBy, h.note]);\r\n  });\r\n  if (downloadCsv('payments-history-' + isoDay(new Date()) + '.csv', lines)) notify('CSV downloaded', 'success');\r\n  else notify('CSV export failed in this browser', 'error');\r\n}\r\nfunction exportPdf() {\r\n  var rows = historyFiltered();\r\n  if (!rows.length) { notify('Nothing to export with the current filters', 'warning'); return; }\r\n  var rowsHtml = rows.map(function (h) {\r\n    return '<tr>' +\r\n      '<td>' + esc(fmtDate(parseISO(h.paidAt))) + '<\/td>' +\r\n      '<td>' + esc \r\n      '<select class=\"pm-input pm-select\" id=\"qb-row-match-' + p.idx + '\">' + matchOpts(p) + '<\/select>' +\r\n    '<\/div>';\r\n  });\r\n  el('qb-map-area').innerHTML =\r\n    '<div class=\"pm-mv-title\" style=\"margin-top:12px\">2️⃣ Review ' + _qb.preview.length + ' row' + (_qb.preview.length !== 1 ? 's' : '') + (skipped ? ' (' + skipped + ' skipped — missing date/payee/amount)' : '') + '<\/div>' +\r\n    '<div class=\"pm-qb-rows\">' + rowsHtml + '<\/div>' +\r\n    '<div class=\"pm-form-grid\" style=\"margin-top:12px\">' +\r\n      '<div class=\"pm-fld\"><label class=\"pm-label\">Assign department to all<\/label><select class=\"pm-input\" id=\"qb-dept\">' + deptOpts + '<\/select><\/div>' +\r\n      '<div class=\"pm-fld\"><label class=\"pm-label\">Assign type to all<\/label><select class=\"pm-input\" id=\"qb-type\">' + typeOpts + '<\/select><\/div>' +\r\n      '<div class=\"pm-fld\"><label class=\"pm-label\">Assign source to all<\/label><select class=\"pm-input\" id=\"qb-src\">' + srcOpts + '<\/select><\/div>' +\r\n    '<\/div>' +\r\n    '<div class=\"pm-fld pm-fld-full\" style=\"margin-top:10px\"><label class=\"pm-check\"><input type=\"checkbox\" id=\"qb-autocheck\" checked> Auto-check off matching regular payments (mark the unpaid period near each expense date as paid)<\/label><\/div>' +\r\n    '<div class=\"pm-modal-foot\" style=\"margin-top:12px;border-radius:10px\">' +\r\n      '<button class=\"pm-btn pm-btn-ghost\" type=\"button\" onclick=\"closeModal()\">Cancel<\/button>' +\r\n      '<button class=\"pm-btn pm-btn-primary\" type=\"button\" onclick=\"qbDoImport()\">Import ' + _qb.preview.length + ' expense' + (_qb.preview.length !== 1 ? 's' : '') + '<\/button>' +\r\n    '<\/div>';\r\n  scheduleResize();\r\n}\r\nfunction qbDoImport() {\r\n  if (!_qb || !_qb.preview.length) return;\r\n  var deptId = el('qb-dept').value, typeId = el('qb-type').value, srcId = el('qb-src').value;\r\n  var autoCheck = el('qb-autocheck') ? el('qb-autocheck').checked : true;\r itle=\"' + esc(it.name) + '\">' + esc(it.name) + '<\/span>' +\r\n          '<span class=\"pm-dash-date' + (b === 'overdue' ? ' pm-dash-overdue' : '') + '\">' + (it.due ? esc(fmtDate(it.due)) : 'Anytime') + '<\/span>' +\r\n          '<span class=\"pm-dash-amt\">' + fmtMoney(it.amount, it.currency) + '<\/span>' +\r\n        '<\/div>';\r\n      });\r\n      if (items.length > 5) html += '<div class=\"pm-dash-more\">+' + (items.length - 5) + ' more in Due &amp; Check-off<\/div>';\r\n      dueBox.innerHTML = html;\r\n    }\r\n  }\r\n  var dBox = el('dash-depts');\r\n  if (dBox) {\r\n    if (!DB.departments.length) dBox.innerHTML = dashEmpty('No departments yet — add them in Departments &amp; Budgets.');\r\n    else {\r\n      var html = '';\r\n      DB.departments.slice(0, 6).forEach(function (d) {\r\n        var st = deptStats(d);\r\n        var pct = st.budget > 0 ? Math.min(100, st.used / st.budget * 100) : 0;\r\n        html += '<div class=\"pm-dash-row\">' +\r\n          '<span class=\"pm-dash-name\" title=\"' + esc(d.name) + '\">' + esc(d.name) + '<\/span>' +\r\n          '<span class=\"pm-dash-amt\">' + fmtMoney(st.used, st.currency) + ' / ' + fmtMoney(st.budget, st.currency) + '<\/span>' +\r\n        '<\/div>' +\r\n        '<div class=\"pm-progress\" style=\"margin:-2px 0 6px\"><i style=\"width:' + Math.min(100, Math.max(0, pct)) + '%\"><\/i><\/div>';\r\n      });\r\n      dBox.innerHTML = html;\r\n    }\r\n  }\r\n  var pBox = el('dash-pending');\r\n  if (pBox) {\r\n    var pend = visiblePendingRequests();\r\n    if (!pend.length) pBox.innerHTML = dashEmpty('No requests waiting for approval.');\r\n    else {\r\n      var html = '';\r\n      pend.slice(0, 5).forEach(function (q) {\r\n        html += '<div class=\"pm-dash-row\">' +\r\n          '<span class=\"pm-dash-icon\">📩<\/span>' +\r\n          '<span class=\"pm-dash-name\" title=\"' + esc(q.title) + '\">' + esc(q.title) + '<\/span>' +\r\n          '<span class=\"pm-dash-date\">' + esc(q.requestedBy || '') + '
