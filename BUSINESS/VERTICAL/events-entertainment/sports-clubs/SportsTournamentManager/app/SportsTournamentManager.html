<!-- html build 2026-11-08-1 -->
<div class="stm-app" id="stm-app">
	<div class="stm-header">
		<div class="stm-head-left">
			<h1 class="stm-title" id="stm-title">Sports Tournament Manager</h1>
			<span class="stm-sport-badge" id="stm-sport-badge">Soccer</span>
			<p class="stm-subtitle" id="stm-subtitle">League standings - 2026 Season</p>
		</div>
		<div class="stm-head-right">
			<span class="stm-save-chip" id="stm-save-chip" title="When this instance was last saved to the CMS record">Not saved yet</span>
			<span class="stm-build-badge" id="stm-build-badge">tool build</span>
		</div>
	</div>

	<div class="stm-readonly-banner" id="stm-readonly-banner" hidden>
		This tournament is open in read-only mode. Ask an editor or admin to grant you edit access.
	</div>

	<nav class="stm-tabs" id="stm-tabs" aria-label="Tournament sections">
		<button type="button" class="stm-tab" data-tab="overview">Overview</button>
		<button type="button" class="stm-tab" data-tab="teams">Teams</button>
		<button type="button" class="stm-tab" data-tab="players">Players</button>
		<button type="button" class="stm-tab" data-tab="matches">Matches</button>
		<button type="button" class="stm-tab" data-tab="standings">Standings</button>
		<button type="button" class="stm-tab" data-tab="bracket">Bracket</button>
		<button type="button" class="stm-tab" data-tab="settings">Settings</button>
	</nav>

	<main class="stm-body">
		<section class="stm-pane" id="pane-overview"></section>
		<section class="stm-pane" id="pane-teams"></section>
		<section class="stm-pane" id="pane-players"></section>
		<section class="stm-pane" id="pane-matches"></section>
		<section class="stm-pane" id="pane-standings"></section>
		<section class="stm-pane" id="pane-bracket"></section>
		<section class="stm-pane" id="pane-settings"></section>
	</main>

	<div class="stm-modal-overlay" id="stm-modal-overlay" hidden>
		<div class="stm-modal" id="stm-modal" role="dialog" aria-modal="true" aria-labelledby="stm-modal-title">
			<div class="stm-modal-head">
				<h2 class="stm-modal-title" id="stm-modal-title">Title</h2>
				<button type="button" class="stm-modal-close" id="stm-modal-close" aria-label="Close dialog">&#215;</button>
			</div>
			<div class="stm-modal-body" id="stm-modal-body"></div>
			<div class="stm-modal-foot" id="stm-modal-foot"></div>
		</div>
	</div>

	<div class="stm-toast" id="stm-toast" role="status" hidden></div>

	<noscript>
		<p class="stm-noscript">This tournament manager needs JavaScript to run. Enable JavaScript in your browser.</p>
	</noscript>
</div>
