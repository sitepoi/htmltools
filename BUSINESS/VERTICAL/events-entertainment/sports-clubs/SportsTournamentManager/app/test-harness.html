<style>
	html, body { margin: 0; padding: 0; background: #eef2f7; }
	body { padding-top: 44px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
	#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 14px; background: #0f172a; color: #e6edf5; font-size: 11px; }

	#th-log p { margin: 0 0 2px; }

		body { padding-top: 132px; }
	}

<div id="app-container"></div>

<script>
/* ---------------------------------------------------------------
   Mock window.tool SDK - installed BEFORE the tool script loads.
   --------------------------------------------------------------- */
(function () {
	var STORAGE_KEY = 'stm_harness_value';
	var query = new URLSearchParams(window.location.search);
	var users = {
		'u-admin': { id: 'u-admin', name: 'Ada Admin', email: 'ada@example.org', roles: ['viewer', 'editor', 'admin'], effectiveAccess: { isViewer: true, isEditor: true, isManager: true } },
		'u-editor': { id: 'u-editor', name: 'Eddie Editor', email: 'eddie@example.org', roles: ['viewer', 'editor'], effectiveAccess: { isViewer: true, isEditor: true, isManager: false } },
		'u-viewer': { id: 'u-viewer', name: 'Vera Viewer', email: 'vera@example.org', roles: ['viewer'], effectiveAccess: { isViewer: true, isEditor: false, isManager: false } },
		'u-none': null
	};
	var params = {
		allowRequestSave: 'yes'
	};
	var state = {
		userId: query.get('role') || (localStorage.getItem(STORAGE_KEY + '_user') || 'u-admin'),
		value: null,
		readyCallback: null,
		valueChangeListeners: [],
		userChangeListeners: [],
		readonlyListeners: [],
		readOnly: false
	};

	try {
		var storedValue = localStorage.getItem(STORAGE_KEY);
		state.value = storedValue ? JSON.parse(storedValue) : null;
	} catch (error) { state.value = null; }

	function logLine(message) {
		var log = document.getElementById('th-log');
		if (!log) { return; }
		var line = document.createElement('p');
		line.textContent = new Date().toISOString().slice(11, 19) + '  ' + message;
		log.appendChild(line);
		log.scrollTop = log.scrollHeight;
	}

	window.thLog = logLine;
	window.thSetValue = function (value) {
		state.value = value;
		try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch (error) { }
		state.valueChangeListeners.forEach(function (listener) { try { listener(value); } catch (error) { } });
	};

	window.tool = {
		onReady: function (callback) {
			state.readyCallback = callback;
			window.setTimeout(function () { callback(state.value); }, 0);
		},
		getValue: function () { return state.value; },
		setValue: function (nextValue) {
			state.value = nextValue;
			try { localStorage.setItem(STORAGE_KEY, JSON.stringify(nextValue)); } catch (error) { }
			state.valueChangeListeners.forEach(function (listener) { try { listener(nextValue); } catch (error) { } });
		},
		onValueChange: function (listener) { state.valueChangeListeners.push(listener); },
		param: function (name, fallback) {
			if (params[name] !== undefined && params[name] !== null) { return params[name]; }
			return fallback;
		},
		isReadOnly: function () { return state.readOnly; },
		onReadonlyChange: function (listener) { state.readonlyListeners.push(listener); },
		getUser: function () { return users[state.userId] || null; },
		onUserChange: function (listener) { state.userChangeListeners.push(listener); },
		reportValid: function () { },
		notify: function (message, severity) { logLine('notify(' + (severity || 'info') + '): ' + message); },
		resize: function () { },
		requestSave: function () { logLine('requestSave - record saved by the CMS'); },
		declareOutput: function () { },
		declareParams: function (list) { logLine('declareParams: ' + (Array.isArray(list) ? list.length : 0) + ' parameter(s)'); },
		reportMissingParams: function () { },
		_tools: {
			selectUser: function (userId) {
				state.userId = userId;
				try { localStorage.setItem(STORAGE_KEY + '_user', userId); } catch (error) { }
				state.userChangeListeners.forEach(function (listener) { try { listener(users[userId]); } catch (error) { } });
			},
			setReadOnly: function (readOnly) {
				state.readOnly = readOnly;
				state.readonlyListeners.forEach(function (listener) { try { listener(readOnly); } catch (error) { } });
			},
			loadSample: function (sampleData) {
				window.thSetValue(sampleData);
			},
			runReadyAgain: function () {
				if (state.readyCallback) { state.readyCallback(state.value); }
			}
		}
	};
})();
</script>

<script>

   inline-JS mode (?inlinejs=1) that reproduces CMS tokenisation.
   --------------------------------------------------------------- */
(function () {
	var status = document.getElementById('th-status');
	var container = document.getElementById('app-container');
	var inlineMode = /[?&]inlinejs=1/.test(window.location.search);
var EMBEDDED_HTML = '\u003c!-- html build 2026-11-08-1 -->\r\n\u003cdiv class=\"stm-app\" id=\"stm-app\">\r\n\t\u003cdiv class=\"stm-header\">\r\n\t\t\u003cdiv class=\"stm-head-left\">\r\n\t\t\t\u003ch1 class=\"stm-title\" id=\"stm-title\">Sports Tournament Manager\u003c/h1>\r\n\t\t\t\u003cspan class=\"stm-sport-badge\" id=\"stm-sport-badge\">Soccer\u003c/span>\r\n\t\t\t\u003cp class=\"stm-subtitle\" id=\"stm-subtitle\">League standings - 2026 Season\u003c/p>\r\n\t\t\u003c/div>\r\n\t\t\u003cdiv class=\"stm-head-right\">\r\n\t\t\t\u003cspan class=\"stm-save-chip\" id=\"stm-save-chip\" title=\"When this instance was last saved to the CMS record\">Not saved yet\u003c/span>\r\n\t\t\t\u003cspan class=\"stm-build-badge\" id=\"stm-build-badge\">tool build\u003c/span>\r\n\t\t\u003c/div>\r\n\t\u003c/div>\r\n\r\n\t\u003cdiv class=\"stm-readonly-banner\" id=\"stm-readonly-banner\" hidden>\r\n\t\tThis tournament is open in read-only mode. Ask an editor or admin to grant you edit access.\r\n\t\u003c/div>\r\n\r\n\t\u003cnav class=\"stm-tabs\" id=\"stm-tabs\" aria-label=\"Tournament sections\">\r\n\t\t\u003cbutton type=\"button\" class=\"stm-tab\" data-tab=\"overview\">Overview\u003c/button>\r\n\t\t\u003cbutton type=\"button\" class=\"stm-tab\" data-tab=\"teams\">Teams\u003c/button>\r\n\t\t\u003cbutton type=\"button\" class=\"stm-tab\" data-tab=\"players\">Players\u003c/button>\r\n\t\t\u003cbutton type=\"button\" class=\"stm-tab\" data-tab=\"matches\">Matches\u003c/button>\r\n\t\t\u003cbutton type=\"button\" class=\"stm-tab\" data-tab=\"standings\">Standings\u003c/button>\r\n\t\t\u003cbutton type=\"button\" class=\"stm-tab\" data-tab=\"bracket\">Bracket\u003c/button>\r\n\t\t\u003cbutton type=\"button\" class=\"stm-tab\" data-tab=\"settings\">Settings\u003c/button>\r\n\t\u003c/nav>\r\n\r\n\t\u003cmain class=\"stm-body\">\r\n\t\t\u003csection class=\"stm-pane\" id=\"pane-overview\">\u003c/section>\r\n\t\t\u003csection class=\"stm-pane\" id=\"pane-teams\">\u003c/section>\r\n\t\t\u003 	function loadExternalJS() {
		var script = document.createElement('script');
		script.src = 'SportsTournamentManager.js';
		script.onload = function () { status.textContent = 'ready (external js)'; };
		script.onerror = function () { status.textContent = 'JS FAILED - check the console'; };
		document.body.appendChild(script);
	}

	function loadInlineJS() {
		window.fetch('SportsTournamentManager.js')
			.then(function (response) {
				if (!response.ok) { throw new Error('HTTP ' + response.status); }
				return response.text();
			})
			.then(function (code) {
				var script = document.createElement('script');
				script.textContent = code;
				document.body.appendChild(script);
				status.textContent = 'ready (inline js)';
			})
			.catch(function () {
				status.textContent = 'inline fetch failed - external js';
				loadExternalJS();
			});
	}

	function inject(html) {
		container.innerHTML = html;
		if (inlineMode) { loadInlineJS(); } else { loadExternalJS(); }
	}

	var fallbackTimer = window.setTimeout(function () {
		inject(EMBEDDED_HTML);
	}, 1200);

	window.fetch('SportsTournamentManager.html')
		.then(function (response) {
			if (!response.ok) { throw new Error('HTTP ' + response.status); }

		.then(function (html) {
			window.clearTimeout(fallbackTimer);
			inject(html);
		})
		.catch(function () { /* the fallback timer injects the embedded copy */ });
})();
</script>

<script>
/* ---------------------------------------------------------------
   Harness controls.
   --------------------------------------------------------------- */
(function () {
	function ready(fn) {
		if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', fn); }
		else { fn(); }
	}

	ready(function () {
		var query = new URLSearchParams(window.location.search);
		var userSelect = document.getElementById('th-user');
		userSelect.value = query.get('role') || (localStorage.getItem('stm_harness_value_user') || 'u-admin');
		tool._tools.selectUser(userSelect.value);

		userSelect.addEventListener('change', function () {
			tool._tools.selectUser(userSelect.value);
		});

		document.getElementById('th-readonly').addEventListener('change', function (event) {
			tool._tools.setReadOnly(event.target.checked);
		});

		document.getElementById('th-sample-soccer').addEventListener('click', function () {
			tool._tools.loadSample(window.buildSoccerSample());
		});

		document.getElementById('th-sample-hockey').addEventListener('click', function () {
			tool._tools.loadSample(window.buildHockeySample());
		});

		document.getElementById('th-clear').addEventListener('click', function () {
			tool._tools.loadSample(null);
			tool._tools.runReadyAgain();
		});

		if (query.get('sample') === 'soccer') { tool._tools.loadSample(window.buildSoccerSample()); }
		if (query.get('sample') === 'hockey') { tool._tools.loadSample(window.buildHockeySample()); }
		if (query.get('sample') === '1') { tool._tools.loadSample(window.buildSoccerSample()); }

		var desiredTab = query.get('tab');
		if (desiredTab) {
			var tabAttempts = 0;
			var tabTimer = window.setInterval(function () {
				tabAttempts += 1;
				var tabButton = document.querySelector('.stm-tab[data-tab="' + desiredTab + '"]');
				if (tabButton) {
					tabButton.click();
					window.clearInterval(tabTimer);
				} else if (tabAttempts > 40) {
					window.clearInterval(tabTimer);
				}
			}, 150);
		}

		function waitFor(selector, callback, attemptLimit) {
			var attempts = 0;
			var timer = window.setInterval(function () {
				attempts += 1;
				var found = document.querySelector(selector);
				if (found) {
					window.clearInterval(timer);
					callback(found);
				} else if (attempts > (attemptLimit || 40)) {
					window.clearInterval(timer);
				}
			}, 150);
		}

		if (query.get('bracket') === '1') {
			waitFor('.stm-tab[data-tab="bracket"]', function (tabButton) {
				tabButton.click();
				waitFor('[data-act="rebuild-bracket"]', function (generateButton) {
					generateButton.click();
					waitFor('[data-act="pick-bracket-winner"]', function (teamButton) {
						teamButton.click();
						window.thLog('QA: bracket generated and first winner picked');
					});
				});
			});
		}

		if (query.get('matchmodal') === '1') {
			waitFor('.stm-tab[data-tab="matches"]', function (tabButton) {
				tabButton.click();
				waitFor('[data-act="open-match-modal"]', function (editButton) {
					editButton.click();
					window.thLog('QA: match edit modal opened');
				});
			});
		}

		if (query.get('playermodal') === '1') {
			waitFor('.stm-tab[data-tab="players"]', function (tabButton) {
				tabButton.click();
				waitFor('[data-act="open-player-modal"]', function (addButton) {
					addButton.click();
					window.thLog('QA: player add modal opened');
				});
			});
		}
	});
})();
</script>
</body>
</html>
