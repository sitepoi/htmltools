ace-between;\r\n  padding: 16px 20px; border-bottom: 1px solid var(--slate-100);\r\n  background: var(--slate-50);\r\n}\r\n.drawer-header h3 { font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--slate-700); letter-spacing: -.01em; }\r\n\r\n.drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }\r\n\r\n.drawer-footer {\r\n  display: flex; align-items: center; gap: 10px;\r\n  padding: 14px 20px; border-top: 1px solid var(--slate-100);\r\n  background: var(--slate-50);\r\n}\r\n\r\n/* Photo */\r\n.upload-btn {\r\n  display: inline-flex; align-items: center; gap: 6px;\r\n  padding: 8px 16px; border-radius: var(--r-sm);\r\n  background: var(--surface); color: var(--slate-600);\r\n  font-family: var(--font); font-size: 13px; font-weight: var(--weight-medium);\r\n  cursor: pointer; border: 1.5px dashed var(--slate-200);\r\n  transition: all var(--duration-fast); white-space: nowrap;\r\n}\r\n.upload-btn:hover { border-color: var(--accent-300); color: var(--accent-700); background: var(--accent-50); }\r\n.upload-btn-sm { padding: 6px 12px; font-size: 12px; }\r\n\r\n.photo-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; min-height: 40px; }\r\n\r\n.photo-pool-item {\r\n  width: 64px; height: 64px; border-radius: var(--r-xs);\r\n  border: 2px solid var(--slate-100); overflow: hidden;\r\n  cursor: pointer; position: relative; transition: all var(--duration-fast);\r\n}\r\n.photo-pool-item:hover { border-color: var(--accent-300); }\r\n.photo-pool-item.dragging { opacity: 0.4; }\r\n.photo-pool-item img { width: 100%; height: 100%; object-fit: cover; }\r\n.photo-pool-item.primary { border-color: var(--accent-500); box-shadow: 0 0 0 2px rgba(245,158,11,.15); }\r\n\r\n.photo-pool-item .pool-primary-badge {\r\n  position: absolute; top: 1px; left: 1px;\r\n  font-size: 16px; color: #f59e0b; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));\r\n  pointer-events: none; z-index: 2;\r\n}\r\n.photo-pool-item .pool-primary-label {\r\n  position: absolute; bottom: 0; left: 0; right: 0;\r\n  background: rgba(245,158,11,0.85); color: #fff;\r\n  font-size: 8px; font-weight: var(--weight-bold); text-align: center;\r\n  padding: 1px 0; pointer-events: none; z-index: 2;\r\n  letter-spacing: .04em; text-transform: uppercase;\r\n}\r\n.photo-pool-item .pool-set-primary {\r\n  position: absolute; top: 2px; right: 2px;\r\n  font-size: 12px; color: rgba(255,255,255,0.7);\r\n  background: rgba(0,0,0,0.3); border-radius: 50%;\r\n  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;\r\n  cursor: pointer; opacity: 0; transition: opacity var(--duration-fast); z-index: 2;\r\n}\r\n.photo-pool-item:hover .pool-set-primary { opacity: 1; }\r\n.photo-pool-item:hover .pool-set-primary:hover { background: rgba(245,158,11,0.8); color: #fff; }\r\n.photo-pool-item.primary .pool-set-primary { display: none; }\r\n\r\n.photo-pool-item .pool-delete {\r\n  position: absolute; top: -3px; right: -3px; width: 20px; height: 20px;\r\n  background: var(--red-500); color: #fff; border-radius: 50%; font-size: 10px;\r\n  display: flex; align-items: center; justify-content: center;\r\n  cursor: pointer; opacity: 0; transition: opacity var(--duration-fast);\r\n  box-shadow: 0 2px 6px rgba(0,0,0,.15);\r\n}\r\n.photo-pool-item:hover .pool-delete { opacity: 1; }\r\n\r\n/* Single photo area (modifier group & option) */\r\n.single-photo-area { margin-bottom: 4px; min-height: 40px; }\r\n.single-photo-area .single-photo-thumb {\r\n  display: inline-flex; align-items: center; gap: 8px;\r\n  background: var(--slate-50); border: 1px solid var(--slate-100);\r\n  border-radius: var(--r-xs); padding: 4px 8px 4px 4px;\r\n}\r\n.single-photo-area .single-photo-thumb img {\r\n  width: 48px; height: 48px; object-fit: cover; border-radius: 4px;\r\n}\r\n.single-photo-area .single-photo-thumb .single-photo-remove {\r\n  font-size: 16px; color: var(--red-500); cursor: pointer; line-height: 1;\r\n}\r\n.single-photo-area .single-photo-thumb .single-photo-remove:hover { color: var(--red-600); }\r\n\r\n/* Spice */\r\n.spice-slider {\r\n  width: 100%; appearance: none; -webkit-appearance: none;\r\n  height: 8px; border-radius: 4px;\r\n  background: linear-gradient(to right, #22c55e, #eab308, #f97316, #ef4444);\r\n  outline: none; cursor: pointer;\r\n}\r\n.spice-slider::-webkit-slider-thumb {\r\n  -webkit-appearance: none; width: 24px; height: 24px;\r\n  border-radius: 50%; background: #fff; border: 2.5px solid var(--accent-500);\r\n  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12);\r\n  transition: transform var(--duration-fast);\r\n}\r\n.spice-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }\r\n.spice-slider::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2.5px solid var(--accent-500); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }\r\n.spice-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--slate-300); margin-top: 4px; font-weight: var(--weight-medium); }\r\n\r\n.chip-picker { display: flex; flex-wrap: wrap; gap: 6px; }\r\n.chip-picker .chip { cursor: pointer; }\r\n\r\n.checkbox-list { display: flex; flex-direction: column; gap: 6px; }\r\n.checkbox-list label {\r\n  display: flex; align-items: center; gap: 10px;\r\n  font-size: var(--text-sm); color: var(--slate-600); cursor: pointer;\r\n  padding: 6px 10px; border-radius: var(--r-xs);\r\n  transition: background var(--duration-fast);\r\n}\r\n.checkbox-list label:hover { background: var(--slate-50); }\r\n.checkbox-list label input[type=\"checkbox\"] { accent-color: var(--accent-500); width: 17px; height: 17px; }\r\n\r\n/* Collapsible advanced section in drawer */\r\n.advanced-toggle {\r\n  display: flex; align-items: center; gap: 8px;\r\n  padding: 8px 0; cursor: pointer; user-select: none;\r\n  font-size: var(--text-sm); font-weight: var(--weight-semibold);\r\n  color: var(--slate-500); border-top: 1px solid var(--slate-75);\r\n  margin-top: 8px; transition: color var(--duration-fast);\r\n}\r\n.advanced-toggle:hover { color: var(--slate-700); }\r\n.advanced-toggle .adv-arrow { font-size: 10px; transition: transform var(--duration-fast); }\r\n.advanced-toggle.open .adv-arrow { transform: rotate(90deg); }\r\n.advanced-body { display: none; }\r\n.advanced-body.open { display: block; }\r\n\r\n/* Modifier Chip Picker (multi-select dropdown) */\r\n.mod-picker {\r\n  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;\r\n  position: relative;\r\n}\r\n.mod-picker-chip {\r\n  display: inline-flex; align-items: center; gap: 4px;\r\n  font-size: var(--text-xs); font-weight: var(--weight-medium);\r\n  color: #1e40af; background: #dbeafe;\r\n  padding: 4px 8px; border-radius: 6px;\r\n  cursor: default;\r\n}\r\n.mod-picker-chip small { opacity: 0.6; font-size: 10px; }\r\n.mod-picker-chip-settings {\r\n  cursor: pointer; font-size: 10px; color: #93c5fd; margin: 0 2px;\r\n  transition: color var(--duration-fast);\r\n}\r\n.mod-picker-chip-settings:hover { color: #f59e0b; }\r\n.mod-picker-chip-remove {\r\n  cursor: pointer; font-size: 10px; color: #93c5fd; margin-left: 2px;\r\n  transition: color var(--duration-fast);\r\n}\r\n.mod-picker-chip-remove:hover { color: #ef4444; }\r\n.mod-picker-trigger {\r\n  font-size: var(--text-xs); color: var(--accent-500);\r\n  background: none; border: 1px dashed var(--accent-300);\r\n  padding: 4px 10px; border-radius: 6px; cursor: pointer;\r\n  transition: all var(--duration-fast);\r\n}\r\n.mod-picker-trigger:hover { background: var(--accent-50); border-color: var(--accent-500); }\r\n.mod-picker-dropdown {\r\n  position: absolute; top: 100%; left: 0; right: 0; z-index: 50;\r\n  background: #fff; border: 1px solid var(--slate-200);\r\n  border-radius: var(--r-md); box-shadow: 0 8px 24px rgba(0,0,0,0.12);\r\n  max-height: 240px; overflow-y: auto; margin-top: 4px;\r\n}\r\n.mod-picker-option {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  padding: 8px 12px; cursor: pointer; font-size: var(--text-xs);\r\n  color: var(--slate-700); transition: background var(--duration-fast);\r\n  border-bottom: 1px solid var(--slate-75);\r\n}\r\n.mod-picker-option:last-child { border-bottom: none; }\r\n.mod-picker-option:hover { background: var(--accent-50); }\r\n.mod-picker-option.checked { color: var(--accent-600); font-weight: var(--weight-semibold); background: var(--accent-25); }\r\n.mod-picker-option-name { flex: 1; }\r\n.mod-picker-option-meta { font-size: 10px; color: var(--slate-400); }\r\n.mod-picker-empty { padding: 16px; text-align: center; font-size: var(--text-xs); color: var(--slate-400); }\r\n\r\n/* Override popup for modifier assignment settings */\r\n.mod-override-popup {\r\n  background: #fff; border: 1px solid var(--slate-200);\r\n  border-radius: var(--r-md); box-shadow: 0 8px 24px rgba(0,0,0,0.15);\r\n  padding: 10px 14px; z-index: 1000; min-width: 200px;\r\n  font-size: var(--text-xs);\r\n}\r\n.mod-override-title {\r\n  font-weight: var(--weight-semibold); color: var(--slate-700);\r\n  margin-bottom: 8px; font-size: var(--text-xs);\r\n}\r\n.mod-override-row {\r\n  display: flex; align-items: center; gap: 6px; padding: 4px 0;\r\n  cursor: pointer; color: var(--slate-600);\r\n}\r\n.mod-override-row input[type=\"checkbox\"] { accent-color: var(--accent-500); width: 15px; height: 15px; }\r\n.mod-override-close {\r\n  display: block; width: 100%; margin-top: 8px; padding: 5px;\r\n  background: var(--accent-50); color: var(--accent-700); border: none;\r\n  border-radius: 4px; cursor: pointer; font-family: var(--font); font-size: 11px;\r\n  font-weight: var(--weight-medium);\r\n}\r\n.mod-override-close:hover { background: var(--accent-100); }\r\n\r\n/* Device panel */\r\n.device-connect-panel {\r\n  margin-top: 14px; padding: 20px; background: var(--slate-50);\r\n  border: 1.5px solid var(--slate-100); border-radius: var(--r-md);\r\n}\r\n.device-connect-panel h4 { font-size: var(--text-md); margin-bottom: 14px; color: var(--slate-700); font-weight: var(--weight-semibold); }\r\n\r\n/* ═══════════════════════════════════════════════════════════════════════\r\n   DRAG & DROP / LEAFTLET\r\n   ═══════════════════════════════════════════════════════════════════════ */\r\n.sortable-ghost { opacity: .3; background: var(--accent-50) !important; border-radius: var(--r-xs); }\r\n.sortable-chosen { box-shadow: var(--shadow-md) !important; }\r\n\r\n.leaflet-draw-toolbar a { background: var(--surface) !important; border-color: var(--slate-200) !important; border-radius: var(--r-xs) !important; }\r\n.leaflet-draw-toolbar a:hover { background: var(--accent-50) !important; }\r\n.leaflet-draw-actions a { background: var(--accent-500) !important; color: #fff !important; }\r\n\r\n/* Keep Leaflet map controls below the sticky nav */\r\n.leaflet-top,\r\n.leaflet-bottom {\r\n  z-index: 40 !important;\r\n}\r\n\r\n/* ═══════════════════════════════════════════════════════════════════════\r\n   CONFIRMATION MODAL\r\n   ═══════════════════════════════════════════════════════════════════════ */\r\n.modal-overlay {\r\n  position: fixed; inset: 0; z-index: 500;\r\n  display: flex; align-items: center; justify-content: center;\r\n  background: rgba(15,23,42,.6); backdrop-filter: blur(4px);\r\n  -webkit-backdrop-filter: blur(4px);\r\n  animation: modalFadeIn .2s ease;\r\n}\r\n@keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }\r\n\r\n.modal-dialog {\r\n  background: var(--surface); border-radius: var(--r-lg);\r\n  padding: 32px; max-width: 440px; width: 90%;\r\n  box-shadow: 0 20px 60px rgba(0,0,0,.2);\r\n  text-align: center;\r\n  animation: modalSlideUp .25s ease;\r\n}\r\n@keyframes modalSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }\r\n\r\n.modal-icon { font-size: 48px; margin-bottom: 16px; }\r\n.modal-title { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--slate-800); margin-bottom: 12px; }\r\n.modal-body { font-size: var(--text-sm); color: var(--slate-500); line-height: 1.6; margin-bottom: 24px; }\r\n.modal-body strong { color: var(--slate-700); }\r\n\r\n.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }\r\n.modal-actions .btn-danger { background: var(--red-500); color: #fff; border-color: var(--red-500); padding: 8px 20px; border-radius: var(--r-sm); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; transition: background var(--duration-fast); }\r\n.modal-actions .btn-danger:hover { background: var(--red-600); border-color: var(--red-600); }\r\n\r\n/* Modal separator (between form fields and action buttons) */\r\nhr.modal-sep { border: none; border-top: 1px solid var(--slate-100); margin: 12px 0 8px 0; }\r\n\r\n/* Custom chip input (for adding custom allergens) */\r\n.custom-chip-input {\r\n  font-size: 11px; padding: 5px 10px; border-radius: 22px;\r\n  border: 1.5px dashed var(--slate-200); background: var(--surface);\r\n  transition: border-color var(--duration-fast);\r\n}\r\n.custom-chip-input:focus { border-color: var(--accent-400); border-style: solid; outline: none; }\r\n.custom-chip-input::placeholder { color: var(--slate-300); font-style: italic; }\r\n\r\n/* Nutrition table */\r\n.nutrition-per-select { margin-bottom: 8px; max-width: 160px; }\r\n.nutrition-table-wrap { overflow-x: auto; }\r\n.nutrition-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }\r\n.nutrition-table th, .nutrition-table td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--slate-100); }\r\n.nutrition-table th { font-weight: var(--weight-semibold); color: var(--slate-500); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; background: var(--slate-50); }\r\n.nutrition-table td:first-child { font-weight: var(--weight-medium); color: var(--slate-600); }\r\n.nutrition-table td input { width: 80px; padding: 4px 8px; border: 1px solid var(--slate-200); border-radius: var(--r-xs); font-size: var(--text-sm); text-align: right; }\r\n.nutrition-table td input:focus { border-color: var(--accent-400); outline: none; }\r\n.nutrition-table .nutrient-unit { color: var(--slate-400); font-size: 11px; margin-left: 2px; }\r\n\r\n/* Zone delete form button */\r\n.zone-delete-form-btn { margin-left: auto; }\r\n\r\n/* ═══════════════════════════════════════════════════════════════════════\r\n   ZONE SHAPES TABLE (inside edit form)\r\n   ═══════════════════════════════════════════════════════════════════════ */\r\n.zone-shapes-section {\r\n  margin-top: 14px; padding-top: 14px;\r\n  border-top: 1px solid var(--slate-100);\r\n}\r\n.zone-shapes-count { font-weight: var(--weight-normal); color: var(--slate-400); font-size: var(--text-xs); }\r\n\r\n.zone-shapes-list { margin-top: 6px; }\r\n.zone-shapes-empty { font-size: var(--text-xs); color: var(--slate-400); font-style: italic; padding: 6px 0; }\r\n\r\n.zone-shape-table { width: 100%; border-collapse: collapse; }\r\n.zone-shape-table th {\r\n  text-align: left; font-size: 10px; font-weight: var(--weight-semibold);\r\n  color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.5px;\r\n  padding: 6px 10px; border-bottom: 1px solid var(--slate-100);\r\n}\r\n.zone-shape-table td {\r\n  padding: 8px 10px; font-size: var(--text-xs); color: var(--slate-600);\r\n  border-bottom: 1px solid var(--slate-50); vertical-align: middle;\r\n}\r\n.zone-shape-table tbody tr { transition: background var(--duration-fast); }\r\n.zone-shape-table tbody tr:hover { background: var(--slate-50); }\r\n.zone-shape-table .shape-type-cell { width: 32px; }\r\n.zone-shape-table .shape-icon {\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  width: 24px; height: 24px; border-radius: var(--r-xs);\r\n}\r\n.zone-shape-table .shape-icon.polygon { color: var(--accent-600); }\r\n.zone-shape-table .shape-icon.circle   { color: #6366f1; }\r\n.zone-shape-table .shape-icon.rectangle { color: #0ea5e9; }\r\n.zone-shape-table .shape-icon svg { width: 16px; height: 16px; }\r\n\r\n.zone-shape-table .shape-desc-cell { font-weight: var(--weight-medium); }\r\n.zone-shape-table .shape-meta-cell { color: var(--slate-400); }\r\n.zone-shape-table .shape-action-cell { width: 36px; text-align: center; }\r\n\r\n.shape-delete-btn {\r\n  display: inline-flex; align-items: center; justify-content: center;\r\n  width: 28px; height: 28px; border-radius: var(--r-xs);\r\n  border: none; background: transparent; color: var(--slate-300); cursor: pointer;\r\n  font-size: 16px; transition: all var(--duration-fast);\r\n}\r\n.shape-delete-btn:hover { background: var(--red-50); color: var(--red-500); }\r\n\r\n/* Small modal variant */\r\n.modal-dialog-sm { max-width: 380px; padding: 28px; }\r\n\r\n/* ═══════════════════════════════════════════════════════════════════════\r\n   DELIVERY SETTINGS (inside zones-list-side)\r\n   ═══════════════════════════════════════════════════════════════════════ */\r\n.delivery-settings-section {\r\n  margin-top: 8px; padding-top: 14px;\r\n  border-top: 2px solid var(--accent-200);\r\n}\r\n.delivery-settings-header {\r\n  font-size: var(--text-sm); font-weight: var(--weight-bold);\r\n  color: var(--slate-700); margin-bottom: 14px;\r\n  display: flex; align-items: center; gap: 6px;\r\n}\r\n.delivery-settings-icon { font-size: 15px; }\r\n\r\n.delivery-setting-row {\r\n  display: flex; align-items: flex-start; justify-content: space-between;\r\n  gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--slate-50);\r\n}\r\n.delivery-setting-row:last-of-type { border-bottom: none; }\r\n.delivery-setting-info { flex: 1; min-width: 0; }\r\n.delivery-setting-label { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--slate-600); display: block; }\r\n.delivery-setting-hint { font-size: 11px; color: var(--slate-400); margin-top: 2px; display: block; line-height: 1.4; }\r\n\r\n.delivery-setting-group {\r\n  margin-top: 14px; padding-top: 12px;\r\n  border-top: 1px solid var(--slate-100);\r\n}\r\n.delivery-setting-group-title {\r\n  font-size: var(--text-xs); font-weight: var(--weight-semibold);\r\n  color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.3px;\r\n  margin-bottom: 4px;\r\n}\r\n\r\n/* Delivery fields table */\r\n.delivery-fields-table { margin-top: 8px; }\r\n.delivery-field-row {\r\n  display: flex; align-items: center; gap: 8px;\r\n  padding: 5px 0; border-bottom: 1px solid var(--slate-50);\r\n}\r\n.delivery-field-row:last-child { border-bottom: none; }\r\n.delivery-field-name { flex: 1; font-size: var(--text-xs); color: var(--slate-600); min-width: 0; }\r\n.delivery-field-toggles { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }\r\n.delivery-field-tag {\r\n  font-size: 10px; font-weight: var(--weight-semibold); padding: 2px 8px; border-radius: 10px;\r\n  cursor: pointer; border: 1px solid transparent; transition: all var(--duration-fast);\r\n  user-select: none; -webkit-user-select: none;\r\n}\r\n.delivery-field-tag.enabled  { background: var(--accent-50); color: var(--accent-700); border-color: var(--accent-200); }\r\n.delivery-field-tag.disabled { background: var(--slate-50); color: var(--slate-400); border-color: var(--slate-100); }\r\n.delivery-field-tag.required { background: var(--red-50); color: var(--red-500); border-color: var(--red-200); }\r\n.delivery-field-tag.optional { background: var(--slate-50); color: var(--slate-400); border-color: var(--slate-100); }\r\n\r\n/* Custom fields list */\r\n#delivery-custom-fields-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }\r\n.delivery-custom-field-row {\r\n  display: flex; align-items: center; gap: 6px;\r\n  padding: 5px 8px; background: var(--slate-50); border-radius: var(--r-xs);\r\n  font-size: var(--text-xs); color: var(--slate-600);\r\n}\r\n.delivery-custom-field-row .cf-label { flex: 1; }\r\n.delivery-custom-field-r ex column layout */\r\n.tab-panel[data-tab=\"delivery\"].active { display: flex; flex-direction: column; }\r\n\r\n/* Card hint text */\r\n.card-hint { font-size: var(--text-xs); color: var(--slate-400); margin: 0 0 12px 0; line-height: 1.5; }\r\n\r\n/* Centered max-width container for settings sub-tab */\r\n.settings-container { max-width: 720px; margin: 0 auto; padding: 4px 0; }\r\n\r\n/* ═══════════════════════════════════════════════════════════════════════\r\n   RESPONSIVE\r\n   ═══════════════════════════════════════════════════════════════════════ */\r\n@media (max-width: 1200px) {\r\n  .right-panel { width: 380px; min-width: 380px; }\r\n  .zones-layout { grid-template-columns: 1fr 320px; }\r\n}\r\n\r\n@media (max-width: 1024px) {\r\n  .items-grid { grid-template-columns: repeat(2, 1fr); }\r\n  .right-panel { width: 340px; min-width: 340px; }\r\n  .left-panel { width: 240px; min-width: 240px; }\r\n}\r\n\r\n@media (max-width: 768px) {\r\n  .zones-layout { grid-template-columns: 1fr; grid-template-rows: 300px auto; height: auto; }\r\n  #delivery-map { height: 300px; min-height: 200px; }\r\n  .zones-list-side { max-height: 380px; }\r\n  .menu-layout { flex-direction: column; }\r\n  .left-panel { width: 100%; min-width: 100%; max-height: 240px; }\r\n  .center-panel { flex: 1; min-height: 320px; }\r\n  .right-panel { width: 100%; min-width: 100%; position: fixed; inset: 0; z-index: 100; top: var(--nav-h); }\r\n  .hours-grid { grid-template-columns: repeat(4, 1fr); }\r\n  .form-row { grid-template-columns: 1fr; }\r\n  .tab-scroll { padding: 16px; }\r\n  .main-tab { padding: 0 12px; font-size: 12px; }\r\n  .items-grid { grid-template-columns: repeat(2, 1fr); }\r\n}\r\n\r\n@media (max-width: 480px) {\r\n  .hours-grid { grid-template-columns: repeat(2, 1fr); }\r\n  .main-tab { padding: 0 8px; font-size: 11px; gap: 4px; }\r\n  .items-grid { grid-template-columns: 1fr; }\r\n  .card-body { padding: 16px; }\r\n  .tab-scroll { padding: 10px; }\r\n}\r\n"},"js":{"name":"Resta
