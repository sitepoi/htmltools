<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant Delivery Zones - Docs Index</title>
<!--
  DOCS INDEX TEMPLATE - _docs/templates/_index-template.html
  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), the screenshots
  viewer (MEDIA) and the test harness into a full-page pane - open ONLY
  this file to review everything about the tool.
  MINIMAL BY DESIGN: this file carries ONLY the tool's DATA (the two JSON
  payloads below). All design and behavior live ONCE in
  _docs/assets/index.css + index.js - edit those to change every docs
  index at once, no per-file updates needed.
  The code panes are refreshed with `npm run docs:index-code -- <Tool>`
  and the screenshots payload with `npm run docs:index-shots -- <Tool>`
  (both replace the JSON between their marker comments).
  URL shortcut: index.html?doc=help (or ?doc=code-js) opens directly.
-->
<link rel="stylesheet" href="../../../../../../_docs/assets/index.css" />
<script src="../../../../../../_docs/assets/index.js" defer="defer"></script>
</head>
<body>
<div class="docs-shell">

  <aside class="docs-menu">
    <div class="docs-brand">
      <div class="docs-brand-name">Restaurant Delivery Zones</div>
      <div class="docs-brand-sub">docs index</div>
    </div>
    <nav class="docs-nav">
      <div class="docs-nav-group-label">Documents</div>
      <button class="docs-nav-item active" data-doc="ssot" data-src="ssot.html">SSOT<span class="docs-nav-sub">single source of truth</span></button>
      <button class="docs-nav-item" data-doc="webpage" data-src="webpage.html">Marketing webpage<span class="docs-nav-sub">website content block</span></button>
      <button class="docs-nav-item" data-doc="help" data-src="help.html">User help<span class="docs-nav-sub">how to use the tool</span></button>
      <button class="docs-nav-item" data-doc="presentation" data-src="presentation.html">Presentation<span class="docs-nav-sub">marketing deck</span></button>
      <button class="docs-nav-item" data-doc="updates" data-src="updates.html">Updates<span class="docs-nav-sub">release history</span></button>
      <button class="docs-nav-item" data-doc="social" data-src="social.html">Social share kit<span class="docs-nav-sub">posts and WhatsApp</span></button>
      <hr class="docs-nav-sep" />
      <div class="docs-nav-group-label">Code</div>
      <button class="docs-nav-item docs-nav-code" data-doc="code-html">HTML code<span class="docs-nav-sub">markup of the tool</span></button>
      <button class="docs-nav-item docs-nav-code" data-doc="code-css">CSS code<span class="docs-nav-sub">stylesheet of the tool</span></button>
      <button class="docs-nav-item docs-nav-code" data-doc="code-js">JS code<span class="docs-nav-sub">logic of the tool</span></button>
      <hr class="docs-nav-sep" />
      <div class="docs-nav-group-label">Media</div>
      <button class="docs-nav-item docs-nav-shots" data-doc="screenshots">Screenshots<span class="docs-nav-sub">captured views of the tool</span></button>
      <hr class="docs-nav-sep" />
      <!-- no app/test-harness.html for this tool -->
    </nav>
    <div class="docs-menu-footer">One page for everything in this docs folder. 2026-09-23</div>
  </aside>

  <main class="docs-stage">
    <iframe class="docs-frame" id="docs-frame" src="ssot.html" title="Document viewer"></iframe>
    <button class="docs-open" id="docs-open" type="button" title="Open the current document in a new browser tab">Open in new tab ↗</button>
    <div class="docs-code-view" id="docs-code-view">
      <div class="docs-code-head">
        <span class="docs-code-title" id="docs-code-title"></span>
        <span class="docs-code-meta" id="docs-code-meta"></span>
        <button class="docs-code-btn" id="docs-code-copy" type="button">Copy code</button>
        <button class="docs-code-btn" id="docs-code-open" type="button" title="Open the code file in a new browser tab">Open ↗</button>
      </div>
      <pre class="docs-code-pre"><code class="docs-code-code" id="docs-code-code"></code></pre>
    </div>
    <div class="docs-shots-view" id="docs-shots-view">
      <div class="docs-shots-viewer" id="docs-shots-viewer">
        <button class="docs-shots-arrow prev" id="docs-shots-prev" type="button" title="Previous screenshot">&#9664;</button>
        <img class="docs-shots-img" id="docs-shots-img" alt="Screenshot of the tool" />
        <button class="docs-shots-arrow next" id="docs-shots-next" type="button" title="Next screenshot">&#9654;</button>
        <div class="docs-shots-empty" id="docs-shots-empty">No screenshots yet.<br />Run <b>npm run screenshots -- &lt;ToolName&gt;</b> to capture them.</div>
      </div>
      <div class="docs-shots-info" id="docs-shots-info"></div>
      <div class="docs-shots-thumbs" id="docs-shots-thumbs"></div>
    </div>
  </main>

</div>

<!-- CODE-PAYLOAD-START - refresh-docs-index.js replaces the payload between these markers -->
<script type="application/json" id="code-payload">{"html":null,"css":null,"js":null}</script>
<!-- CODE-PAYLOAD-END -->

<!-- SCREENSHOTS-PAYLOAD-START - refresh-docs-index.js replaces the payload between these markers -->
<script type="application/json" id="shots-payload">[]</script>
<!-- SCREENSHOTS-PAYLOAD-END -->
</body>
</html>
