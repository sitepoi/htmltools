<script type="application/json" id="code-payload">{"html":{"name":"RestaurantOrderTakingApp.html","src":"../app/RestaurantOrderTakingApp.html","content":"<!-- build 2026-10-30-1 -->\r\n<div class=\"roa\" id=\"roa-root\">\r\n  <div class=\"roa-shell\">\r\n\r\n    <header class=\"roa-top\">\r\n      <div class=\"roa-top-main\">\r\n        <h1 class=\"roa-title\">Orders<\/h1>\r\n        <p class=\"roa-top-sub\" id=\"roa-top-sub\">Active orders board<\/p>\r\n      <\/div>\r\n      <div class=\"roa-top-actions\">\r\n        <span class=\"roa-live\" id=\"roa-live\"><span class=\"roa-live-dot\"><\/span>Live<\/span>\r\n        <button type=\"button\" class=\"roa-btn roa-btn-ghost roa-btn-small\" id=\"roa-refresh\">Refresh<\/button>\r\n      <\/div>\r\n    <\/header>\r\n\r\n    <div class=\"roa-banner roa-banner-readonly\" id=\"roa-readonly\" hidden><\/div>\r\n    <div class=\"roa-banner roa-banner-config\" id=\"roa-config\" hidden><\/div>\r\n\r\n    <nav class=\"roa-tabs\" id=\"roa-tabs\"><\/nav>\r\n\r\n    <div class=\"roa-toolbar\">\r\n      <input type=\"text\" class=\"roa-search\" id=\"roa-search\" placeholder=\"Search order number, customer, phone, table, address\">\r\n      <label class=\"roa-sortlabel\" for=\"roa-sort\">Sort<\/label>\r\n      <select class=\"roa-select\" id=\"roa-sort\">\r\n        <option value=\"waiting\">Longest waiting first<\/option>\r\n        <option value=\"newest\">Newest first<\/option>\r\n        <option value=\"total\">Highest total first<\/option>\r\n      <\/select>\r\n    <\/div>\r\n\r\n    <div class=\"roa-state\" id=\"roa-state\" hidden><\/div>\r\n\r\n    <main class=\"roa-board\" id=\"roa-board\"><\/main>\r\n\r\n    <footer class=\"roa-foot\">\r\n      <span class=\"roa-loaded\" id=\"roa-loaded\"><\/span>\r\n      <span class=\"roa-refreshed\" id=\"roa-refreshed\"><\/span>\r\n      <span class=\"roa-build\" id=\"roa-build\">tool build<\/span>\r\n    <\/footer>\r\n\r\n  <\/div>\r\n\r\n  <div class=\"roa-modal\" id=\"roa-modal\" hidden>\r\n    <div class=\"roa-modal-card\" role=\"dialog\" aria-modal=\"true\">\r\n      <div class=\"roa-modal-head\">\r\n        <span class=\"roa-modal-title\" id=\"roa-modal-title\"><\/span>\r\n        <button type=\"button\" class=\"roa-modal-x\" data-act=\"modal-close\" aria-label=\"Close\">&#10005;<\/button>\r\n      <\/div>\r\n      <div class=\"roa-modal-body\" id=\"roa-modal-body\"><\/div>\r\n      <div class=\"roa-modal-foot\" id=\"roa-modal-foot\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <div class=\"roa-detail-overlay\" id=\"roa-detail\" hidden><\/div>\r\n<\/div>\r\n"},"css":{"name":"RestaurantOrderTakingApp.css","src":"../app/RestaurantOrderTakingApp.css","content":"/* build 2026-10-30-1 */\r\n\r\n/* =====================================================================\r\n   RestaurantOrderTakingApp - active orders board for the kitchen /\r\n   order takers. One live board of today's orders with fast accept /\r\n   advance actions. Theme tokens fall back to the UniconHub palette;\r\n   every color is read through a CSS custom property so a hosting\r\n   application theme re-skins the board automatically.\r\n   ===================================================================== */\r\n\r\n.roa {\r\n  --roa-accent: var(--primary, #ea580c);\r\n  --roa-accent-soft: var(--primary-soft, #fff7ed);\r\n  --roa-action: #16a34a;\r\n  --roa-action-ink: #ffffff;\r\n  --roa-danger: #b91c1c;\r\n  --roa-bg: var(--bg, #f5f6f8);\r\n  --roa-paper: var(--surface, #ffffff);\r\n  --roa-paper-soft: var(--surface-2, #f8fafc);\r\n  --roa-ink: var(--text, #1f2937);\r\n  --roa-ink-strong: var(--text-strong, #111827);\r\n  --roa-muted: var(--text-muted, #6b7280);\r\n  --roa-line: var(--border, #e5e7eb);\r\n  --roa-radius: var(--radius, 14px);\r\n  --roa-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\r\n\r\n  --roa-st-new: #d97706;\r\n  --roa-st-new-bg: #fef3c7;\r\n  --roa-st-accepted: #1d4ed8;\r\n  --roa-st-accepted-bg: #dbeafe;\r\n  --roa-st-prep: #c2410c;\r\n  --roa-st-prep-bg: #ffedd5;\r\n  --roa-st-ready: #15803d;\r\n  --roa-st-ready-bg: #dcfce7;\r\n  --roa-st-done: #166534;\r\n  --roa-st-done-bg: #f0fdf4;\r\n  --roa-st-declined: #b91c1c;\r\n  --roa-st-declined-bg: #fee2e2;\r\n  --roa-st-cancelled: #64748b;\r\n  --roa-st-cancelled-bg: #f1f5f9;\r\n\r\n  box-sizing: border-box;\r\n  color: var(--roa-ink);\r\n  font-family: var(--font, \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif);\r\n  font-size: 14px;\r\n  line-height: 1.5;\r\n  background: var(--roa-bg);\r\n  padding: 14px;\r\n  min-height: 100%;\r\n}\r\n\r\n.roa *,\r\n.roa *::before,\r\n.roa *::after { box-sizing: border-box; }\r\n\r\n.roa [hidden] { display: none !important; }\r\n\r\n/* ---------------------------------------------------------------- shell */\r\n\r\n.roa-shell {\r\n  max-width: 1180px;\r\n  margin: 0 auto;\r\n  background: var(--roa-bg);\r\n}\r\n\r\n/* ------------------------------------------------------------------ top */\r\n\r\n.roa-top {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 14px;\r\n  flex-wrap: wrap;\r\n  padding: 2px 2px 12px;\r\n}\r\n\r\n.roa-top-main { min-width: 0; }\r\n\r\n.roa-title {\r\n  margin: 0;\r\n  font-size: 23px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.01em;\r\n  color: var(--roa-ink-strong);\r\n}\r\n\r\n.roa-top-sub {\r\n  margin: 2px 0 0;\r\n  font-size: 12.5px;\r\n  color: var(--roa-muted);\r\n}\r\n\r\n.roa-top-actions {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.roa-live {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  font-size: 11.5px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n  color: var(--roa-action);\r\n}\r\n\r\n.roa-live-dot {\r\n  width: 8px;\r\n  height: 8px;\r\n  border-radius: 50%;\r\n  background: var(--roa-action);\r\n  animation: roa-pulse 2s ease-in-out infinite;\r\n}\r\n\r\n@keyframes roa-pulse {\r\n  0%, 100% { opacity: 1; }\r\n  50% { opacity: 0.35; }\r\n}\r\n\r\n/* -------------------------------------------------------------- banners */\r\n\r\n.roa-banner {\r\n  margin: 0 2px 10px;\r\n  padding: 9px 14px;\r\n  border-radius: 10px;\r\n  font-size: 12.5px;\r\n  font-weight: 600;\r\n}\r\n\r\n.roa-banner-readonly {\r\n  background: var(--roa-paper-soft);\r\n  border: 1px solid var(--roa-line);\r\n  color: var(--roa-muted);\r\n}\r\n\r\n.roa-banner-config {\r\n  background: #fffbeb;\r\n  border: 1px solid #f59e0b;\r\n  border-left-width: 4px;\r\n  color: #92400e;\r\n}\r\n\r\n/* ----------------------------------------------------------------- tabs */\r\n\r\n.roa-tabs {\r\n  display: flex;\r\n  align-items: stretch;\r\n  gap: 4px;\r\n  padding: 4px;\r\n  margin: 0 2px 10px;\r\n  background: var(--roa-paper);\r\n  border: 1px solid var(--roa-line);\r\n  border-radius: 12px;\r\n  overflow-x: auto;\r\n}\r\n\r\n.roa-tab {\r\n  flex: 0 0 auto;\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 7px;\r\n  padding: 7px 14px;\r\n  border: none;\r\n  border-radius: 9px;\r\n  background: transparent;\r\n  font: inherit;\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  color: var(--roa-muted);\r\n  cursor: pointer;\r\n}\r\n\r\n.roa-tab:hover { color: var(--roa-ink-strong); background: var(--roa-paper-soft); }\r\n\r\n.roa-tab.roa-tab-on {\r\n  color: var(--roa-accent);\r\n  background: var(--roa-accent-soft);\r\n}\r\n\r\n.roa-tab-count {\r\n  min-width: 20px;\r\n  padding: 0 6px;\r\n  border-radius: 999px;\r\n  font-size: 11px;\r\n  font-weight: 800;\r\n  text-align: center;\r\n  color: var(--roa-muted);\r\n  background: var(--roa-paper-soft);\r\n  border: 1px solid var(--roa-line);\r\n}\r\n\r\n.roa-tab-on .roa-tab-count {\r\n  color: var(--roa-accent);\r\n  background: var(--roa-paper);\r\n  border-color: currentColor;\r\n}\r\n\r\n/* -------------------------------------------------------------- toolbar */\r\n\r\n.roa-toolbar {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  margin: 0 2px 12px;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.roa-search {\r\n  flex: 1 1 240px;\r\n  min-width: 180px;\r\n  padding: 8px 12px;\r\n  font: inherit;\r\n  font-size: 13px;\r\n  color: var(--roa-ink);\r\n  background: var(--roa-paper);\r\n  border: 1px solid var(--roa-line);\r\n  border-radius: 10px;\r\n}\r\n\r\n.roa-search:focus { outline: 2px solid var(--roa-accent); outline-offset: 1px; }\r\n\r\n.roa-sortlabel {\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  color: var(--roa-muted);\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.05em;\r\n}\r\n\r\n.roa-select {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 7px 10px;\r\n  border: 1px solid var(--roa-line);\r\n  border-radius: 10px;\r\n  background: var(--roa-paper);\r\n  color: var(--roa-ink);\r\n}\r\n\r\n.roa-legend {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  margin-left: auto;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.roa-legend-item {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  font-size: 12px;\r\n  color: var(--roa-muted);\r\n  font-weight: 600;\r\n}\r\n\r\n.roa-legend-dot { width: 9px; height: 9px; border-radius: 50%; }\r\n.roa-legend-dot-pickup { background: var(--roa-st-accepted); }\r\n.roa-legend-dot-delivery { background: var(--roa-accent); }\r\n.roa-legend-dot-dinein { background: var(--roa-st-ready); }\r\n\r\n/* ----------------------------------------------------------------- state */\r\n\r\n.roa-state {\r\n  margin: 0 2px 12px;\r\n  padding: 26px 18px;\r\n  text-align: center;\r\n  color: var(--roa-muted);\r\n  font-size: 13.5px;\r\n  background: var(--roa-paper);\r\n  border: 1px dashed var(--roa-line);\r\n  border-radius: var(--roa-radius);\r\n}\r\n\r\n.roa-state .roa-btn { margin-top: 10px; }\r\n\r\n/* ----------------------------------------------------------------- board */\r\n\r\n.roa-board {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));\r\n  gap: 12px;\r\n  margin: 0 2px;\r\n}\r\n\r\n.roa-card {\r\n  position: relative;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 8px;\r\n  padding: 13px 14px 12px;\r\n  background: var(--roa-paper);\r\n  border: 1px solid var(--roa-line);\r\n  border-left: 4px solid var(--roa-line);\r\n  border-radius: var(--roa-radius);\r\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);\r\n  cursor: pointer;\r\n  transition: box-shadow 0.15s ease, transform 0.15s ease;\r\n}\r\n\r\n.roa-card:hover {\r\n  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1);\r\n  transform: translateY(-1px);\r\n}\r\n\r\n.roa-card.st-new { border-left-color: var(--roa-st-new); }\r\n.roa-card.st-accepted { border-left-color: var(--roa-st-accepted); }\r\n.roa-card.st-prep { border-left-color: var(--roa-st-prep); }\r\n.roa-card.st-ready { border-left-color: var(--roa-st-ready); }\r\n.roa-card.st-done { border-left-color: var(--roa-st-done); }\r\n.roa-card.st-declined { border-left-color: var(--roa-st-declined); }\r\n.roa-card.st-cancelled { border-left-color: var(--roa-st-cancelled); }\r\n\r\n.roa-card.roa-card-warn { border-left-color: var(--roa-danger); background: #fffafa; }\r\n\r\n.roa-card.roa-card-fresh { box-shadow: 0 0 0 2px var(--roa-accent); }\r\n\r\n.roa-card-top {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 8px;\r\n}\r\n\r\n.roa-channel {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  font-size: 11px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.05em;\r\n  text-transform: uppercase;\r\n  color: var(--roa-muted);\r\n}\r\n\r\n.roa-elapsed {\r\n  font-family: var(--roa-mono);\r\n  font-size: 15px;\r\n  font-weight: 800;\r\n  color: var(--roa-ink-strong);\r\n  white-space: nowrap;\r\n}\r\n\r\n.roa-elapsed.roa-elapsed-warn { color: var(--roa-danger); }\r\n.roa-elapsed.roa-elapsed-ready { color: var(--roa-st-ready); }\r\n\r\n.roa-card-name {\r\n  margin: 0;\r\n  font-size: 15.5px;\r\ p-on {\r\n  background: var(--roa-accent-soft);\r\n  border-color: var(--roa-accent);\r\n  color: var(--roa-accent);\r\n}\r\n\r\n.roa-eta-input-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  margin-bottom: 12px;\r\n  font-size: 13px;\r\n  color: var(--roa-muted);\r\n}\r\n\r\n.roa-eta-input {\r\n  width: 82px;\r\n  padding: 7px 10px;\r\n  font: inherit;\r\n  font-size: 13px;\r\n  color: var(--roa-ink);\r\n  background: var(--roa-paper);\r\n  border: 1px solid var(--roa-line);\r\n  border-radius: 9px;\r\n}\r\n\r\n.roa-eta-result {\r\n  padding: 9px 12px;\r\n  background: var(--roa-st-ready-bg);\r\n  border: 1px solid var(--roa-st-ready);\r\n  border-radius: 10px;\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  color: #14532d;\r\n}\r\n\r\n.roa-eta-result-empty { background: var(--roa-paper-soft); border-color: var(--roa-line); color: var(--roa-muted); }\r\n\r\n/* ------------------------------------------------------------------ foot */\r\n\r\n.roa-foot {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  flex-wrap: wrap;\r\n  padding: 10px 2px 0;\r\n  font-size: 11.5px;\r\n  color: var(--roa-muted);\r\n}\r\n\r\n.roa-refreshed { margin-left: auto; }\r\n.roa-loaded { font-weight: 700; }\r\n\r\n.roa-build {\r\n  font-family: var(--roa-mono);\r\n  font-size: 10.5px;\r\n  letter-spacing: 0.04em;\r\n}\r\n\r\n/* ----------------------------------------------------------- responsive */\r\n\r\n@media (max-width: 820px) {\r\n  .roa { padding: 8px; }\r\n  .roa-detail-grid { grid-template-columns: 1fr; }\r\n  .roa-detail-side { border-right: none; border-bottom: 2px dashed var(--roa-line); }\r\n  .roa-title { font-size: 20px; }\r\n}\r\n\r\n@media print {\r\n  .roa { padding: 0; background: #ffffff; }\r\n  .roa-top-actions, .roa-toolbar, .roa-modal { display: none !important; }\r\n  .roa-card { box-shadow: none; }\r\n}\r\n"},"js":{"name":"RestaurantOrderTakingApp.js","src":"../app/RestaurantOrderTakingApp.js","content":"/* build 2026-10-30-1 */\r\n\r\n/* =====================================================================\r\n   RestaurantOrderTakingApp - application-level ACTIVE ORDERS BOARD\r\n   (listing tool, TYPE 3) for the restaurant order application.\r\n\r\n   READ  : all order records of the CMS object type (restaurant-orders)\r\n           through tool.requestObjects('query'). The board refreshes on\r\n           a timer and on demand, so the kitchen always sees the latest\r\n           state of today's orders.\r\n   WRITE : order status advances through tool.requestObjects('update')\r\n           (status, statusChangedAt and the optional acceptedAt /\r\n           estimatedReadyAt fields). Never a direct database or REST\r\n           call from the sandbox.\r\n   ===================================================================== */\r\n\r\n/* Tool build stamp - MANDATORY (html-tool-rules GLOBAL REQUIREMENT):\r\n   bump on EVERY code change so stale CMS uploads are detectable. */\r\nvar TOOL_BUILD = '2026-10-30-1';\r\nconsole.log('[TOOL:BOOT] build ' + TOOL_BUILD + ' RestaurantOrderTakingApp starting...');\r\n\r\n(function () {\r\n  'use strict';\r\n\r\n  /* ----------------------------------------------------------- constants */\r\n\r\n  var STATUS_FIELD = 'status';\r\n  var STATUS_TIME_FIELD = 'statusChangedAt';\r\n  var ACCEPTED_AT_FIELD = 'acceptedAt';\r\n  var ETA_FIELD = 'estimatedReadyAt';\r\n\r\n  var STATUS_NEW = 'new';\r\n  var STATUS_ACCEPTED = 'accepted';\r\n  var STATUS_PREP = 'in-preparation';\r\n  var STATUS_READY = 'ready';\r\n  var STATUS_DONE = 'completed';\r\n  var STATUS_DECLINED = 'declined';\r\n  var STATUS_CANCELLED = 'cancelled';\r\n\r\n  var ACTIVE_STATUSES = [STATUS_NEW, STATUS_ACCEPTED, STATUS_PREP, STATUS_READY];\r\n  var TERMINAL_STATUSES = [STATUS_DONE, STATUS_DECLINED, STATUS_CANCELLED];\r\n\r\n  var STATUS_META = {\r\n    'new': { label: 'New', cls: 'new', next: STATUS_ACCEPTED, nextLabel: 'Accept', tab: 'new', action: 'accept' },\r\n    'accepted': { label: 'Accepted', cls: 'accepted', next: STATUS_PREP, nextLabel: 'Start prep', tab: 'progress', action: 'status' },\r\n    'in-preparation': { label: 'In preparation', cls: 'prep', next: STATUS_READY, nextLabel: 'Mark ready', tab: 'progress', action: 'status' },\r\n    'ready': { label: 'Ready', cls: 'ready', next: STATUS_DONE, nextLabel: 'Complete', tab: 'ready', action: 'status' },\r\n    'completed': { label: 'Completed', cls: 'done', next: null, nextLabel: '', tab: 'finished', action: '' },\r\n    'declined': { label: 'Declined', cls: 'declined', next: null, nextLabel: '', tab: 'finished', action: '' },\r\n    'cancelled': { label: 'Cancelled', cls: 'cancelled', next: null, nextLabel: '', tab: 'finished', action: '' }\r\n  };\r\n\r\n  var TABS = [\r\n    { id: 'all', label: 'All' },\r\n    { id: 'new', label: 'New' },\r\n    { id: 'progress', label: 'In progress' },\r\n    { id: 'ready', label: 'Ready' },\r\n    { id: 'finished', label: 'Finished' }\r\n  ];\r\n\r\n  var ORDER_FIELDS = [\r\n    'orderNumber', 'placedAt', 'channel', 'customer', 'address',\r\n    'customAddressFields', 'tableNumber', 'deliveryZone', 'scheduledFor',\r\n    'paymentMethod', 'paymentDetails', 'lines', 'totals',\r\n    'status', 'statusChangedAt', 'internalNote',\r\n    ACCEPTED_AT_FIELD, ETA_FIELD\r\n  ];\r\n\r\n  var CHANNEL_META = {\r\n    'pickup': { label: 'Pickup', icon: '\\uD83E\\uDD61' },\r\n    'delivery': { label: 'Delivery', icon: '\\uD83D\\uDEF5' },\r\n    'on_premise': { label: 'Dine-in', icon: '\\uD83C\\uDF7D' },\r\n    'on-premise': { label: 'Dine-in', icon: '\\uD83C\\uDF7D' },\r\n    'onpremise': { label: 'Dine-in', icon: '\\uD83C\\uDF7D' }\r\n  };\r\n\r\n  var PAYMENT_LABELS = {\r\n    'cash': 'Cash',\r\n    'card': 'Card',\r\n    'interac': 'Interac',\r\n    'online': 'Online payment'\r\n  };\r\n\r\n  var WRITE_ROLES = ['admin', 'owner', 'developer', 'user-manager', 'editor'];\r\n\r\n  var ETA_CHIPS = [15, 30, 45, 60, 90, 120];\r\n\r\n  var MAX_BOARD_ITEMS = 200;\r\n  var ARM_SECONDS = 6000;\r\n  var UI_SAVE_DEBOUNCE = 300;\r\n  var SEARCH_DEBOUNCE = 250;\r\n\r\n  /* --------------------------------------------------------------- state */\r\n\r\n  var _orders = [];            /* normalized order list from the last load */\r\n  var _orderById = {};         /* id -> normalized order */\r\n  var _knownIds = {};          /* ids seen on the previous successful load */\r\n  var _freshIds = {};          /* ids that appeared in the last load (new-order flash) */\r\n  var _firstLoadDone = false;\r\n\r\n  var _ui = { tab: 'all', sort: 'waiting', search: '' };\r\n  var _lastStagedUi = '';\r\n  var _saveUiTimer = null;\r\n\r\n  var _detailId = '';\r\n  var _acceptFor = '';         /* order id the accept modal is open for */\r\n  var _etaMinutes = 0;         /* chosen minutes in the accept modal, 0 = none */\r\n  var _armed = { orderId: '', status: '', timer: null };\r\n  var _busy = {};              /* orderId -> true while a write is in flight */\r\n\r\n  var _loading = false;\r\n  var _error = '';\r\n  var _lastRefreshAt = 0;\r\n\r\n  var _readOnly = false;\r\n  var _noIdentity = false;\r\n  var _user = null;\r\n  var _canWrite = false;\r\n  var _wired = false;\r\n  var _warnedAccess = false;\r\n  var _pollTimer = null;\r\n  var _tickTimer = null;\r\n  var _searchTimer = null;\r\n\r\n  var _cfg = {\r\n    ordersType: 'restaurant-orders',\r\n    autoRefreshSeconds: 20,\r\n    newOrderNotifications: true,\r\n    warnMinutes: 10,\r\n    timeZone: '',\r\n    currency: ''\r\n  };\r\n\r\n  /* ------------------------------------------------------- tiny helpers */\r\n\r\n  function $id(id) { return document.getElementById(id); }\r\n\r\n  function esc(value) {\r\n    if (value === undefined || value === null) return '';\r\n    return String(value)\r\n      .replace(/&/g, '&amp;')\r\n      .replace(/<\/g, '&lt;')\r\n      .replace(/>/g, '&gt;')\r\n      .replace(/\"/g, '&quot;');\r\n  }\r\n\r\n  function num(value) {\r\n    if (typeof value === 'number') return isFinite(value) ? value : 0;\r\n    var parsed = parseFloat(String(value === undefined || value === null ? '' : value).replace(/[^0-9.\\-]/g, ''));\r\n    return isFinite(parsed) ? parsed : 0;\r\n  }\r\n\r\n  function pad2(n) { return (n < 10 ? '0' : '') + n; }\r\n\r\n  function fmtMoney(value) {\r\n    var amount = num(value);\r\n    if (_cfg.currency) {\r\n      try {\r\n        return new Intl.NumberFormat(undefined, {\r\n          style: 'currency',\r\n          currency: _cfg.currency,\r\n          currencyDisplay: 'narrowSymbol',\r\n          minimumFractionDigits: 2,\r\n          maximumFractionDigits: 2\r\n        }).format(amount);\r\n      } catch (err) { /* fall through to plain amount */ }\r\n    }\r\n    return amount.toFixed(2);\r\n  }\r\n\r\n  function fmtTime(tsOrIso) {\r\n    if (!tsOrIso) return '';\r\n    var date = new Date(tsOrIso);\r\n    if (isNaN(date.getTime())) return '';\r\n    var options = { hour: '2-digit', minute: '2-digit' };\r\n    if (_cfg.timeZone) options.timeZone = _cfg.timeZone;\r\n    try {\r\n      return new Intl.DateTimeFormat(undefined, options).format(date);\r\n    } catch (err) {\r\n      return date.toLocaleTimeString();\r\n    }\r\n  }\r\n\r\n  function fmtDateTime(iso) {\r\n    if (!iso) return '';\r\n    var date = new Date(iso);\r\n    if (isNaN(date.getTime())) return String(iso);\r\n    var options = { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' };\r\n    if (_cfg.timeZone) options.timeZone = _cfg.timeZone;\r\n    try {\r\n      return new Intl.DateTimeFormat(undefined, options).format(date);\r\n    } catch (err) {\r\n      return date.toLocaleString();\r\n    }\r\n  }\r\n\r\n  function tsOf(iso) {\r\n    if (!iso) return 0;\r\n    var t = new Date(iso).getTime();\r\n    return isNaN(t) ? 0 : t;\r\n  }\r\n\r\n  function minutesSince(iso) {\r\n    var t = tsOf(iso);\r\n    if (!t) return null;\r\n    return Math.floor((Date.now() - t) / 60000);\r\n  }\r\n\r\n  function secondsSince(iso) {\r\n    var t = tsOf(iso);\r\n    if (!t) return null;\r\n    return Math.max(0, Math.floor((Date.now() - t) / 1000));\r\n  }\r\n\r\n  /* Kitchen-style clock: \"05:10\", then \"1h 05m\" past an hour. */\r\n  function fmtElapsedClock(seconds) {\r\n    if (seconds === null || seconds === undefined) return '';\r\n    if (seconds < 0) seconds = 0;\r\n    if (seconds >= 3600) {\r\n      var hours = Math.floor(seconds / 3600);\r\n      var rest = Math.floor((seconds % 3600) / 60);\r\n      return hours + 'h ' + pad2(rest) + 'm';\r\n    }\r\n    return pad2(Math.floor(seconds / 60)) + ':' + pad2(seconds % 60);\r\n  }\r\n\r\n  function fmtDurationMinutes(minutes) {\r\n    if (minutes === null || minutes === undefined) return '';\r\n    if (minutes < 1) return 'less than a minute';\r\n    if (minutes < 60) return minutes + ' min';\r\n    var hours = Math.floor(minutes / 60);\r\n    var rest = minutes % 60;\r\n    return hours + 'h' + (rest ? ' ' + rest + 'm' : '');\r\n  }\r\n\r\n  function isSameLocalDay(ts) {\r\n    if (!ts) return false;\r\n    var a = new Date(ts);\r\n    var b = new Date();\r\n    return a.getFullYear() === b.getFullYear() &&\r\n      a.getMonth() === b.getMonth() &&\r\n      a.getDate() === b.getDate();\r\n  }\r\n\r\n  function asArray(value) {\r\n    if (Array.isArray(value)) return value;\r\n    if (typeof value === 'string' && value.trim()) {\r\n      try {\r\n        var parsed = JSON.parse(value);\r\n        return Array.isArray(parsed) ? parsed : [];\r\n      } catch (err) { return []; }\r\n    }\r\n    return [];\r\n  }\r\n\r\n  function asObject(value) {\r\n    if (value && typeof value === 'object' && !Array.isArray(value)) return value;\r\n    if (typeof value === 'string' && value.trim()) {\r\n      try {\r\n        var parsed = JSON.parse(value);\r\n        return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : null;\r\n      } catch (err) { return null; }\r\n    }\r\n    return null;\r\n  }\r\n\r\n  function merge(objectA, objectB) {\r\n    var out = {};\r\n    var key;\r\n    if (objectA && typeof objectA === 'object') {\r\n      for (key in objectA) { if (Object.prototype.hasOwnProperty.call(objectA, key)) out[key] = objectA[key]; }\r\n    }\r\n    if (objectB && typeof objectB === 'object') {\r\n      for (key in objectB) { if (Object.prototype.hasOwnProperty.call(objectB, key)) out[key] = objectB[key]; }\r\n    }\r\n    return out;\r\n  }\r\n\r\n  function notify(message, severity) {\r\n    try {\r\n      if (typeof tool.notify === 'function') { tool.notify(message, severity || 'info'); return; }\r\n    } catch (err) { /* ignore */ }\r\n    console.log('[RestaurantOrderTakingApp] ' + (severity || 'info') + ': ' + message);\r\n  }\r\n\r\n  /* --------------------------------------------- reading order records */\r\n\r\n  function normalizeKey(key) {\r\n    return String(key === undefined || key === null ? '' : key).toLowerCase().replace(/[^a-z0-9]/g, '');\r\n  }\r\n\r\n  function findKey(bag, name) {\r\n    if (!bag || typeof bag !== 'object') return undefined;\r\n    if (Object.prototype.hasOwnProperty.call(bag, name)) return bag[name];\r\n    var wanted = normalizeKey(name);\r\n    for (var key in bag) {\r\n      if (!Object.prototype.hasOwnProperty.call(bag, key)) continue;\r\n      if (normalizeKey(key) === wanted) return bag[key];\r\n    }\r\n    return undefined;\r\n  }\r\n\r\n  function collectBags(source) {\r\n    var bags = [];\r\n    if (!source || typeof source !== 'object') return bags;\r\n    bags.push(source);\r\n    if (source.data_categoriesBased) bags.push(source.data_categoriesBased);\r\n    if (source.data && typeof source.data === 'object') bags.push(source.data);\r\n    if (source.objectData && typeof source.objectData === 'object') {\r\n      bags.push(source.objectData);\r\n      if (source.objectData.data_categoriesBased) bags.push(source.objectData.data_categoriesBased);\r\n    }\r\n    if (source.productData && typeof source.productData === 'object') {\r\n      bags.push(source.productData);\r\n      if (source.productData.data_categoriesBased) bags.push(source.productData.data_categoriesBased);\r\n    }\r\n    return bags;\r\n  }\r\n\r\n  function bagScore(bag) {\r\n    if (!bag || typeof bag !== 'object') return 0;\r\n    var score = 0;\r\n    for (var i = 0; i < ORDER_FIELDS.length; i++) {\r\n      if (findKey(bag, ORDER_FIELDS[i]) !== undefined) score++;\r\n    }\r\n    return score;\r\n  }\r\n\r\n  function orderedBags(source) {\r\n    var bags = collectBags(source);\r\n    var scored = [];\r\n    for (var b = 0; b < bags.length; b++) {\r\n      var score = bagScore(bags[b]);\r\n      if (score > 0) scored.push({ bag: bags[b], score: score });\r\n    }\r\n    scored.sort(function (x, y) { return y.score - x.score; });\r\n    return scored.map(function (entry) { return entry.bag; });\r\n  }\r\n\r\n  function readField(bags, name) {\r\n    for (var i = 0; i < bags.length; i++) {\r\n      var value = findKey(bags[i], name);\r\n      if (value !== undefined && value !== null && value !== '') return value;\r\n    }\r\n    return undefined;\r\n  }\r\n\r\n  function statusKeyOf(status) {\r\n    var key = String(status === undefined || status === null ? '' : status).toLowerCase().trim();\r\n    if (STATUS_META[key]) return key;\r\n    return '';\r\n  }\r\n\r\n  function normalizeOrder(obj) {\r\n    var bags = orderedBags(obj);\r\n    var order = {};\r\n    for (var i = 0; i < ORDER_FIELDS.length; i++) {\r\n      order[ORDER_FIELDS[i]] = readField(bags, ORDER_FIELDS[i]);\r\n    }\r\n    order.id = String(obj && (obj.id || obj._id) ? (obj.id || obj._id) : readField(bags, 'id') || '');\r\n    order.name = obj && obj.name ? String(obj.name) : '';\r\n    order.created = obj && obj.created ? String(obj.created) : '';\r\n    order.updated = obj && obj.updated ? String(obj.updated) : '';\r\n\r\n    var status = statusKeyOf(order.status);\r\n    order.status = status || STATUS_NEW;           /* missing status = new (default per order app) */\r\n    order.statusKnown = !!status;\r\n\r\n    order.lines = asArray(order.lines);\r\n    order.totals = asObject(order.totals) || {};\r\n    order.customer = asObject(order.customer) || {};\r\n    order.address = asObject(order.address);\r\n    order.customAddressFields = asObject(order.customAddressFields);\r\n    order.deliveryZone = asObject(order.deliveryZone);\r\n    order.paymentDetails = asObject(order.paymentDetails) || {};\r\n\r\n    order.totalNum = num(order.totals.total);\r\n    order.placeTs = tsOf(order.placedAt);\r\n    order.isTerminal = TERMINAL_STATUSES.indexOf(order.status) !== -1;\r\n    order.isActive = !order.isTerminal;\r\n    order.isToday = order.placeTs ? isSameLocalDay(order.placeTs) : true;\r\n    order.onBoard = order.isActive || order.isToday;\r\n    order.channelKey = String(order.channel || '').toLowerCase().trim();\r\n    return order;\r\n  }\r\n\r\n  function findOrder(orderId) { return _orderById[orderId] || null; }\r\n\r\n  function orderTitleOf(order) {\r\n    var channel = channelMetaOf(order.channelKey);\r\n    var customer = order.customer || {};\r\n    if (order.tableNumber) return 'Table ' + order.tableNumber;\r\n    if (customer.fullName || customer.name) return String(customer.fullName || customer.name);\r\n    return channel.label + ' order';\r\n  }\r\n\r\n  function cardSublineOf(order) {\r\n    if (order.tableNumber) return order.customer.fullName || order.customer.name || '';\r\n    if (order.address) return addressFirstLine(order.address);\r\n    return '';\r\n  }\r\n\r\n  function lineCountOf(order) {\r\n    var count = 0;\r\n    for (var i = 0; i < order.lines.length; i++) {\r\n      count += num(order.lines[i].quantity) || 1;\r\n    }\r\n    return count;\r\n  }\r\n\r\n  function statusMetaOf(status) {\r\n    return STATUS_META[status] || { label: 'New', cls: 'new', next: null, nextLabel: '', tab: 'new', action: '' };\r\n  }\r\n\r\n  function channelMetaOf(channelKey) {\r\n    if (CHANNEL_META[channelKey]) return CHANNEL_META[channelKey];\r\n    if (!channelKey) return { label: 'Order', icon: '\\uD83E\\uDD61' };\r\n    return { label: channelKey, icon: '\\uD83C\\uDF7D' };\r\n  }\r\n\r\n  function paymentLabelOf(method) {\r\n    var key = String(method || '').toLowerCase().trim();\r\n    if (!key) return '';\r\n    return PAYMENT_LABELS[key] || String(method);\r\n  }\r\n\r\n  /* Only the last 4 digits and the expiry of a card are ever surfaced. */\r\n  function cardSummary(card) {\r\n    if (!card || typeof card !== 'object') return '';\r\n    var brand = card.brand || card.scheme || card.network || '';\r\n    var last4 = card.last4 || card.lastFour || card.last_4 || '';\r\n    var expiry = '';\r\n    if (card.expiry) expiry = String(card.expiry);\r\n    else if (card.exp_month && card.exp_year) expiry = String(card.exp_month) + '/' + String(card.exp_year).slice(-2);\r\n    else if (card.expMonth && card.expYear) expiry = String(card.expMonth) + '/' + String(card.expYear).slice(-2);\r\n    var parts = [];\r\n    if (brand) parts.push(String(brand));\r\n    if (last4) parts.push('**** ' + String(last4).slice(-4));\r\n    if (expiry) parts.push('exp ' + expiry);\r\n    return parts.join(' ');\r\n  }\r\n\r\n  function addressFirstLine(address) {\r\n    if (!address || typeof address !== 'object') return '';\r\n    if (address.street) return String(address.street);\r\n    var bits = [];\r\n    if (address.city) bits.push(String(address.city));\r\n    if (address.postal_code || address.postalCode || address.zip) {\r\n      bits.push(String(address.postal_code || address.postalCode || address.zip));\r\n    }\r\n    return bits.join(', ');\r\n  }\r\n\r\n  function addressLines(address) {\r\n    var lines = [];\r\n    if (!address || typeof address !== 'object') return lines;\r\n    if (address.street) lines.push(String(address.street));\r\n    var cityBits = [];\r\n    if (address.city) cityBits.push(String(address.city));\r\n    if
