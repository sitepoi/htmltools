<script type="application/json" id="code-payload">{"html":{"name":"RestaurantOrderTakingApp.html","src":"../app/RestaurantOrderTakingApp.html","content":"<!-- build 2026-10-31-6 -->\r\n<div class=\"roa\" id=\"roa-root\">\r\n  <div class=\"roa-shell\">\r\n\r\n    <div class=\"roa-topbar\">\r\n      <nav class=\"roa-tabs\" id=\"roa-tabs\"><\/nav>\r\n      <div class=\"roa-top-actions\">\r\n        <span class=\"roa-live\" id=\"roa-live\"><span class=\"roa-live-dot\"><\/span>Live<\/span>\r\n        <button type=\"button\" class=\"roa-btn roa-btn-ghost roa-btn-small\" id=\"roa-refresh\">Refresh<\/button>\r\n        <div class=\"roa-menu\" id=\"roa-menu\">\r\n          <button type=\"button\" class=\"roa-btn roa-btn-ghost roa-btn-small\" id=\"roa-menu-btn\" data-act=\"menu\" aria-haspopup=\"true\" aria-expanded=\"false\">&#8942;<\/button>\r\n          <div class=\"roa-menu-panel\" id=\"roa-menu-panel\" hidden>\r\n            <button type=\"button\" class=\"roa-menu-item\" id=\"roa-menu-import\" data-act=\"import-file\">Import sample JSON...<\/button>\r\n            <button type=\"button\" class=\"roa-menu-item\" id=\"roa-menu-clear\" data-act=\"clear-today\">Remove all items from today<\/button>\r\n            <button type=\"button\" class=\"roa-menu-item roa-menu-item-danger\" id=\"roa-menu-clear-confirm\" data-act=\"clear-today-confirm\" hidden>Confirm remove today's orders<\/button>\r\n            <p class=\"roa-menu-hint\">Temporary QA tools - they create and delete CMS order objects.<\/p>\r\n          <\/div>\r\n        <\/div>\r\n        <input type=\"file\" id=\"roa-import-file\" accept=\".json,application/json\" hidden>\r\n      <\/div>\r\n    <\/div>\r\n\r\n    <div class=\"roa-banner roa-banner-readonly\" id=\"roa-readonly\" hidden><\/div>\r\n    <div class=\"roa-banner roa-banner-config\" id=\"roa-config\" hidden><\/div>\r\n\r\n    <div class=\"roa-toolbar\">\r\n      <input type=\"text\" class=\"roa-search\" id=\"roa-search\" placeholder=\"Search order number, customer, phone, table, address\">\r\n      <label class=\"roa-sortlabel\" for=\"roa-sort\">Sort<\/label>\r\n      <select class=\"roa-select\" id=\"roa-sort\">\r\n        <option value=\"waiting\">Longest waiting first<\/option>\r\n        <option value=\"newest\">Newest first<\/option>\r\n        <option value=\"total\">Highest total first<\/option>\r\n      <\/select>\r\n    <\/div>\r\n\r\n    <div class=\"roa-state\" id=\"roa-state\" hidden><\/div>\r\n\r\n    <main class=\"roa-board\" id=\"roa-board\"><\/main>\r\n\r\n    <footer class=\"roa-foot\">\r\n      <span class=\"roa-loaded\" id=\"roa-loaded\"><\/span>\r\n      <span class=\"roa-refreshed\" id=\"roa-refreshed\"><\/span>\r\n      <span class=\"roa-build\" id=\"roa-build\">tool build<\/span>\r\n    <\/footer>\r\n\r\n  <\/div>\r\n\r\n  <div class=\"roa-modal\" id=\"roa-modal\" hidden>\r\n    <div class=\"roa-modal-card\" role=\"dialog\" aria-modal=\"true\">\r\n      <div class=\"roa-modal-head\">\r\n        <span class=\"roa-modal-title\" id=\"roa-modal-title\"><\/span>\r\n        <button type=\"button\" class=\"roa-modal-x\" data-act=\"modal-close\" aria-label=\"Close\">&#10005;<\/button>\r\n      <\/div>\r\n      <div class=\"roa-modal-body\" id=\"roa-modal-body\"><\/div>\r\n      <div class=\"roa-modal-foot\" id=\"roa-modal-foot\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <div class=\"roa-detail-overlay\" id=\"roa-detail\" hidden><\/div>\r\n<\/div>\r\n"},"css":{"name":"RestaurantOrderTakingApp.css","src":"../app/RestaurantOrderTakingApp.css","content":"/* build 2026-10-31-15 */\n\n/* =====================================================================\n   RestaurantOrderTakingApp - active orders board for the kitchen /\n   order takers. One live board of today's orders with fast accept /\n   advance actions. Theme tokens fall back to the UniconHub palette;\n   every color is read through a CSS custom property so a hosting\n   application theme re-skins the board automatically.\n   ===================================================================== */\n\n.roa {\n  --roa-accent: var(--primary, #ea580c);\n  --roa-accent-soft: var(--primary-soft, #fff7ed);\n  --roa-action: #16a34a;\n  --roa-action-ink: #ffffff;\n  --roa-danger: #b91c1c;\n  --roa-bg: var(--bg, #f5f6f8);\n  --roa-paper: var(--surface, #ffffff);\n  --roa-paper-soft: var(--surface-2, #f8fafc);\n  --roa-ink: var(--text, #1f2937);\n  --roa-ink-strong: var(--text-strong, #111827);\n  --roa-muted: var(--text-muted, #6b7280);\n  --roa-line: var(--border, #e5e7eb);\n  --roa-radius: var(--radius, 14px);\n  --roa-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n\n  /* Status color semantics (D-ROTA-17):\n     new = blue (incoming, needs a decision)\n     accepted = teal (acknowledged)\n     in-preparation = orange (work happening)\n     ready = green (go)\n     completed = purple (done - one hue per status, D-ROTA-20)\n     declined = red (rejected - a real problem)\n     cancelled = gray (neutral end)\n     LATE and urgent stay red / amber - red is reserved for real problems. */\n  --roa-st-new: #2563eb;\n  --roa-st-new-bg: #eff6ff;\n  --roa-st-accepted: #0d9488;\n  --roa-st-accepted-bg: #f0fdfa;\n  --roa-st-prep: #ea580c;\n  --roa-st-prep-bg: #fff7ed;\n  --roa-st-ready: #16a34a;\n  --roa-st-ready-bg: #f0fdf4;\n  --roa-st-done: #7c3aed;\n  --roa-st-done-bg: #f5f3ff;\n  --roa-st-declined: #dc2626;\n  --roa-st-declined-bg: #fef2f2;\n  --roa-st-cancelled: #64748b;\n  --roa-st-cancelled-bg: #f8fafc;\n\n  box-sizing: border-box;\n  color: var(--roa-ink);\n  font-family: var(--font, \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif);\n  font-size: 14px;\n  line-height: 1.5;\n  background: var(--roa-bg);\n  padding: 14px;\n  min-height: 100%;\n}\n\n.roa *,\n.roa *::before,\n.roa *::after { box-sizing: border-box; }\n\n.roa [hidden] { display: none !important; }\n\n/* ---------------------------------------------------------------- shell */\n\n.roa-shell {\n  max-width: 1180px;\n  margin: 0 auto;\n  background: var(--roa-bg);\n}\n\n/* ------------------------------------------------------------- topbar */\n\n/* Compact header (D-ROTA-25): no page title, no counter subtitle - the\n   tabs and the LIVE / Refresh / menu actions share one row so the board\n   gets the space. */\n.roa-topbar {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  margin: 0 2px 10px;\n  flex-wrap: wrap;\n}\n\n.roa-topbar .roa-tabs {\n  flex: 1 1 460px;\n  margin: 0;\n}\n\n.roa-top-actions {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  flex-wrap: wrap;\n}\n\n.roa-live {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 11.5px;\n  font-weight: 800;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--roa-action);\n}\n\n.roa-live-dot {\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background: var(--roa-action);\n  animation: roa-pulse 2s ease-in-out infinite;\n}\n\n@keyframes roa-pulse {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0.35; }\n}\n\n/* -------------------------------------------------------------- banners */\n\n.roa-banner {\n  margin: 0 2px 10px;\n  padding: 9px 14px;\n  border-radius: 10px;\n  font-size: 12.5px;\n  font-weight: 600;\n}\n\n.roa-banner-readonly {\n  background: var(--roa-paper-soft);\n  border: 1px solid var(--roa-line);\n  color: var(--roa-muted);\n}\n\n.roa-banner-config {\n  background: #fffbeb;\n  border: 1px solid #f59e0b;\n  border-left-width: 4px;\n  color: #92400e;\n}\n\n/* ----------------------------------------------------------------- tabs */\n\n.roa-tabs {\n  display: flex;\n  align-items: stretch;\n  gap: 4px;\n  padding: 4px;\n  margin: 0 2px 10px;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  border-radius: 12px;\n  overflow-x: auto;\n}\n\n.roa-tab {\n  flex: 0 0 auto;\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  padding: 9px 17px;\n  border: 1px solid transparent;\n  border-radius: 9px;\n  background: var(--roa-paper-soft);\n  font: inherit;\n  font-size: 14.5px;\n  font-weight: 700;\n  color: var(--roa-muted);\n  cursor: pointer;\n}\n\n/* One soft color identity per tab (D-ROTA-15): pastel background + the\n   status's normal color as text and active ring. */\n.roa-tab-all { color: var(--roa-accent); background: var(--roa-accent-soft); }\n.roa-tab-new { color: var(--roa-st-new); background: var(--roa-st-new-bg); }\n.roa-tab-progress { color: var(--roa-st-prep); background: var(--roa-st-prep-bg); }\n.roa-tab-ready { color: var(--roa-st-ready); background: var(--roa-st-ready-bg); }\n.roa-tab-finished { color: var(--roa-st-cancelled); background: var(--roa-st-cancelled-bg); }\n\n.roa-tab:hover { filter: brightness(0.97); }\n\n.roa-tab.roa-tab-on {\n  box-shadow: inset 0 0 0 1.5px currentColor;\n  font-weight: 800;\n}\n\n.roa-tab-count {\n  min-width: 22px;\n  padding: 0 6px;\n  border-radius: 999px;\n  font-size: 12px;\n  font-weight: 800;\n  text-align: center;\n  color: inherit;\n  background: var(--roa-paper);\n  border: 1px solid currentColor;\n}\n\n/* -------------------------------------------------------------- toolbar */\n\n.roa-toolbar {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  margin: 0 2px 12px;\n  flex-wrap: wrap;\n}\n\n.roa-search {\n  flex: 1 1 240px;\n  min-width: 180px;\n  padding: 8px 12px;\n  font: inherit;\n  font-size: 13px;\n  color: var(--roa-ink);\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n}\n\n.roa-search:focus { outline: 2px solid var(--roa-accent); outline-offset: 1px; }\n\n.roa-sortlabel {\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--roa-muted);\n  text-transform: uppercase;\n  letter-spacing: 0.05em;\n}\n\n.roa-select {\n  font: inherit;\n  font-size: 13px;\n  padding: 7px 10px;\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n  background: var(--roa-paper);\n  color: var(--roa-ink);\n}\n\n.roa-status-select {\n  font: inherit;\n  font-size: 13.5px;\n  font-weight: 700;\n  width: 100%;\n  padding: 8px 10px;\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n  background: var(--roa-paper);\n  color: var(--roa-ink-strong);\n  cursor: pointer;\n}\n\n.roa-status-select:disabled {\n  opacity: 0.6;\n  cursor: not-allowed;\n}\n\n.roa-status-hint {\n  margin-top: 6px;\n  font-size: 11.5px;\n  color: var(--roa-muted);\n}\n\n/* Three-dots action menu (temporary QA tools - D-ROTA-21) */\n.roa-menu {\n  position: relative;\n  display: inline-flex;\n}\n\n.roa-menu-btn {\n  font-size: 16px;\n  line-height: 1;\n  padding: 6px 10px;\n}\n\n.roa-menu-panel {\n  position: absolute;\n  top: calc(100% + 6px);\n  right: 0;\n  z-index: 60;\n  min-width: 230px;\n  padding: 6px;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  border-radius: 12px;\n  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.roa-menu-item {\n  font: inherit;\n  font-size: 13px;\n  font-weight: 600;\n  text-align: left;\n  padding: 8px 10px;\n  border: none;\n  border-radius: 8px;\n  background: transparent;\n  color: var(--roa-ink);\n  cursor: pointer;\n}\n\n.roa-menu-item:hover { background: var(--roa-paper-soft); }\n\n.roa-menu-item-danger {\n  color: var(--roa-danger);\n}\n\n.roa-menu-item-danger:hover { background: var(--roa-st-declined-bg); }\n\n.roa-menu-hint {\n  margin: 4px 4px 2px;\n  font-size: 11px;\n  color: var(--roa-muted);\n}\n\n.roa-legend {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  margin-left: auto;\n  flex-wrap: wrap;\n}\n\n.roa-legend-item {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 12px;\n  color: var(--roa-muted);\n  font-weight: 600;\n}\n\n.roa-legend-dot { width: 9px; height: 9px; border-radius: 50%; }\n.roa-legend-dot-pickup { background: var(--roa-st-accepted); }\n.roa-legend-dot-delivery { background: var(--roa-accent); }\n.roa-legend-dot-dinein { background: var(--roa-st-ready); }\n\n/* ----------------------------------------------------------------- state */\n\n.roa-state {\n  margin: 0 2px 12px;\n  padding: 26px 18px;\n  text-align: center;\n  color: var(--roa-muted);\n  font-size: 13.5px;\n  background: var(--roa-paper);\n  border: 1px dashed var(--roa-line);\n  border-radius: var(--roa-radius);\n}\n\n.roa-state .roa-btn { margin-top: 10px; }\n\n/* ----------------------------------------------------------------- board */\n\n.roa-board {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));\n  gap: 12px;\n  margin: 0 2px;\n}\n\n.roa-card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  height: 100%;\n  gap: 9px;\n  padding: 14px 15px 13px;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  border-left: 4px solid var(--roa-line);\n  border-radius: var(--roa-radius);\n  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);\n  cursor: pointer;\n  transition: box-shadow 0.15s ease, transform 0.15s ease;\n}\n\n.roa-card:hover {\n  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1);\n  transform: translateY(-1px);\n}\n\n.roa-card.st-new { background: var(--roa-st-new-bg); border-color: var(--roa-st-new); border-left-color: var(--roa-st-new); }\n.roa-card.st-accepted { background: var(--roa-st-accepted-bg); border-color: var(--roa-st-accepted); border-left-color: var(--roa-st-accepted); }\n.roa-card.st-prep { background: var(--roa-st-prep-bg); border-color: var(--roa-st-prep); border-left-color: var(--roa-st-prep); }\n.roa-card.st-ready { background: var(--roa-st-ready-bg); border-color: var(--roa-st-ready); border-left-color: var(--roa-st-ready); }\n.roa-card.st-done { background: var(--roa-st-done-bg); border-color: var(--roa-st-done); border-left-color: var(--roa-st-done); }\n.roa-card.st-declined { background: var(--roa-st-declined-bg); border-color: var(--roa-st-declined); border-left-color: var(--roa-st-declined); }\n.roa-card.st-cancelled { background: var(--roa-st-cancelled-bg); border-color: var(--roa-st-cancelled); border-left-color: var(--roa-st-cancelled); }\n\n/* A just-arrived order gets a short BLUE ring (new = blue, never red) for\n   FRESH_FLASH_MS - sample imports are silent (D-ROTA-22). */\n.roa-card.roa-card-fresh { box-shadow: 0 0 0 2px var(--roa-st-new), 0 6px 16px rgba(37, 99, 235, 0.18); }\n\n/* Time-remaining overrides - declared AFTER the status colors so they win\n   (D-ROTA-17): a new order waiting too long gets a DEEPER BLUE attention\n   treatment (never red - red means a real problem like late or declined);\n   orders inside the last minutes turn amber; late orders turn red. */\n.roa-card.roa-card-warn { background: #dbeafe; border-color: #1d4ed8; border-left-color: #1d4ed8; }\n.roa-card.roa-card-urgent { background: #fffbeb; border-color: #f59e0b; border-left-color: #f59e0b; }\n.roa-card.roa-card-late { background: var(--roa-st-declined-bg); border-color: var(--roa-danger); border-left-color: var(--roa-danger); }\n\n.roa-card-top {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 8px;\n}\n\n.roa-channel {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-elapsed {\n  font-family: var(--roa-mono);\n  font-size: 16px;\n  font-weight: 800;\n  color: var(--roa-ink-strong);\n  white-space: nowrap;\n  letter-spacing: -0.02em;\n}\n\n.roa-elapsed.roa-elapsed-warn { color: #b45309; }\n.roa-elapsed.roa-elapsed-ready { color: var(--roa-st-ready); }\n\n.roa-card-name {\n  margin: 0;\n  font-size: 16.5px;\n  font-weight: 800;\n  color: var(--roa-ink-strong);\n  letter-spacing: -0.01em;\n  word-break: break-word;\n}\n\n/* Fixed info rows (D-ROTA-31): a soft panel with one hairline row per\n   data type, so the same data always sits in the same place. */\n.roa-card-fields {\n  display: flex;\n  flex-direction: column;\n  padding: 1px 10px;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n}\n\n.roa-field {\n  display: grid;\n  grid-template-columns: 46px minmax(0, 1fr);\n  align-items: center;\n  gap: 8px;\n  min-height: 27px;\n  padding: 4px 0;\n  border-bottom: 1px dashed var(--roa-line);\n}\n\n.roa-field:last-child { border-bottom: none; }\n\n.roa-field-k {\n  font-size: 9.5px;\n  font-weight: 800;\n  letter-spacing: 0.09em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-field-v {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  min-width: 0;\n  font-size: 12.5px;\n  font-weight: 600;\n  color: var(--roa-ink);\n}\n\n.roa-field-at {\n  font-family: var(--roa-mono);\n  font-size: 11.5px;\n  font-weight: 600;\n  color: var(--roa-muted);\n}\n\n.roa-field-where {\n  display: block;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n.roa-field-note {\n  font-size: 12px;\n  font-weight: 500;\n  overflow-wrap: anywhere;\n}\n\n.roa-field-empty {\n  font-size: 12px;\n  font-style: italic;\n  font-weight: 500;\n  color: var(--roa-muted);\n}\n\n.roa-order-no {\n  font-family: var(--roa-mono);\n  font-size: 11px;\n  font-weight: 800;\n  padding: 1px 9px;\n  border-radius: 999px;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  color: var(--roa-ink);\n  white-space: nowrap;\n}\n\n.roa-status {\n  display: inline-flex;\n  align-items: center;\n  padding: 3px 11px;\n  border-radius: 999px;\n  font-size: 11.5px;\n  font-weight: 800;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  white-space: nowrap;\n}\n\n.roa-status.st-new { color: var(--roa-st-new); background: var(--roa-st-new-bg); }\n.roa-status.st-accepted { color: var(--roa-st-accepted); background: var(--roa-st-accepted-bg); }\n.roa-status.st-prep { color: var(--roa-st-prep); background: var(--roa-st-prep-bg); }\n.roa-status.st-ready { color: var(--roa-st-ready); background: var(--roa-st-ready-bg); }\n.roa-status.st-done { color: var(--roa-st-done); background: var(--roa-st-done-bg); }\n.roa-status.st-declined { color: var(--roa-st-declined); background: var(--roa-st-declined-bg); }\n.roa-status.st-cancelled { color: var(--roa-st-cancelled); background: var(--roa-st-cancelled-bg); }\n\n.roa-est {\n  font-size: 10.5px;\n  font-weight: 800;\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n/* The remaining-time counter is the most-read number on a kitchen card:\n   a bigger, bordered pill with a monospace face (D-ROTA-23). */\n.roa-countdown {\n  display: inline-flex;\n  align-items: center;\n  font-family: var(--roa-mono);\n  font-size: 15px;\n  font-weight: 800;\n  letter-spacing: -0.02em;\n  line-height: 1.25;\n  padding: 2px 10px;\n  border-radius: 999px;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  color: var(--roa-st-accepted);\n  white-space: nowrap;\n}\n\n.roa-countdown-urgent {\n  color: #b45309;\n  border-color: #f59e0b;\n  background: #fffbeb;\n}\n\n.roa-countdown-late {\n  color: var(--roa-danger);\n  border-color: var(--roa-danger);\n  background: var(--roa-st-declined-bg);\n}\n\n/* Group 3 - money: total on its own line, pushed to the card bottom */\n.roa-card-money {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 10px;\n  margin-top: auto;\n  padding-top: 9px;\n  border-top: 1px dashed var(--roa-line);\n}\n\n.roa-money-label {\n  font-size: 10.5px;\n  font-weight: 800;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-money-items {\n  margin-left: 4px;\n  font-weight: 600;\n  letter-spacing: 0;\n  text-transform: none;\n  opacity: 0.85;\n}\n\n.roa-card-total {\n  font-family: var(--roa-mono);\n  font-size: 20px;\n  font-weight: 800;\n  color: var(--roa-ink-strong);\n  white-space: nowrap;\n}\n\n/* Group 4 - action: next-step button + quiet link on ONE line, always the\n   very bottom of the card (D-ROTA-27). */\n.roa-card-actionbar {\n  display: flex;\n  flex-direction: row;\n  align-items: center;\n  gap: 10px;\n}\n\n.roa-card-note {\n  display: none;\n}\n\n/* ---------------------------------------------------------------- buttons */\n\n.roa-btn {\n  font: inherit;\n  font-size: 13px;\n  font-weight: 700;\n  padding: 8px 15px;\n  border-radius: 10px;\n  border: 1px solid transparent;\n  cursor: pointer;\n  transition: filter 0.12s ease;\n  white-space: nowrap;\n}\n\n.roa-btn:hover { filter: brightness(0.95); }\n.roa-btn:disabled { opacity: 0.55; cursor: not-allowed; }\n\n.roa-btn-primary { background: var(--roa-action); color: var(--roa-action-ink); }\n.roa-btn-accent { background: var(--roa-accent); color: #ffffff; }\n.roa-btn-danger { background: var(--roa-danger); color: #ffffff; }\n.roa-btn-ghost {\n  background: var(--roa-paper);\n  color: var(--roa-ink);\n  border-color: var(--roa-line);\n}\n.roa-btn-small { font-size: 12px; padding: 6px 11px; }\n\n/* Quiet destructive actions (Decline / Cancel) - deliberately link-like so\n   the primary next-step button dominates the card (D-ROTA-24). */\n.roa-btn-quiet {\n  background: transparent;\n  border-color: transparent;\n  color: var(--roa-muted);\n  font-size: 12px;\n  font-weight: 600;\n  padding: 6px 4px;\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(107, 114, 128, 0.45);\n}\n\n.roa-btn-quiet:hover {\n  color: var(--roa-danger);\n  filter: none;\n  text-decoration-color: currentColor;\n}\n\n/* The next step is what staff do 95% of the time - it takes the free width\n   of the action line; Decline/Cancel stays a small quiet link beside it\n   (D-ROTA-24 / D-ROTA-26 / D-ROTA-27). */\n.roa-card-actionbar .roa-btn-primary,\n.roa-card-actionbar .roa-btn-danger {\n  flex: 1 1 auto;\n  justify-content: center;\n  padding: 11px 18px;\n  font-size: 14px;\n  font-weight: 800;\n  border-radius: 10px;\n}\n\n.roa-card-actionbar .roa-btn-primary {\n  box-shadow: 0 1px 2px rgba(22, 163, 74, 0.25);\n}\n\n.roa-card-actionbar .roa-btn-quiet {\n  flex: 0 0 auto;\n  margin: 0;\n  padding: 4px 8px;\n  font-size: 11.5px;\n}\n\n.roa-card-actionbar .roa-btn-ghost {\n  flex: 0 0 auto;\n  justify-content: center;\n}\n\n.roa-card-actionbar .roa-btn:only-child {\n  flex: 1 1 auto;\n}\n\n/* ----------------------------------------------------------------- detail */\n\n.roa-detail-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 40;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px;\n  background: rgba(15, 23, 42, 0.45);\n}\n\n.roa-detail-shell {\n  width: min(980px, 100%);\n  max-height: calc(100vh - 40px);\n  display: flex;\n  flex-direction: column;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  border-radius: var(--roa-radius);\n  box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);\n  overflow: hidden;\n}\n\n.roa-detail-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  flex-wrap: wrap;\n  padding: 13px 16px;\n  border-bottom: 2px dashed var(--roa-line);\n  background: var(--roa-paper-soft);\n}\n\n.roa-detail-title {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  flex-wrap: wrap;\n  min-width: 0;\n}\n\n.roa-detail-number {\n  display: inline-flex;\n  align-items: center;\n  font-family: var(--roa-mono);\n  font-size: 15px;\n  font-weight: 800;\n  padding: 2px 12px;\n  border-radius: 999px;\n  background: var(--roa-paper-soft);\n  border: 1px solid var(--roa-line);\n  color: var(--roa-ink-strong);\n  white-space: nowrap;\n}\n\n.roa-detail-actions {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  flex-wrap: wrap;\n}\n\n/* Print sits between the workflow actions and the three-dots menu. */\n.roa-btn-print {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n}\n\n.roa-detail-grid {\n  display: grid;\n  grid-template-columns: 330px 1fr;\n  overflow-y: auto;\n}\n\n.roa-detail-side {\n  border-right: 2px dashed var(--roa-line);\n  padding: 15px 16px;\n}\n\n.roa-detail-main { min-width: 0; padding: 15px 16px; }\n\n/* Order timeline (D-ROTA-29 / D-ROTA-32) - the full workflow as one rail\n   under the detail content: a dot per step, the minutes between the steps\n   written on the line in a readable size, and a live \"and counting\" gap\n   for the step in flight. The band is the footer of the popup. */\n\n.roa-tl-band {\n  padding: 12px 16px 12px;\n  border-top: 2px dashed var(--roa-line);\n  background: var(--roa-paper);\n}\n\n.roa-tl-head {\n  display: flex;\n  align-items: flex-end;\n  justify-content: space-between;\n  gap: 14px;\n  flex-wrap: wrap;\n  margin-bottom: 12px;\n}\n\n.roa-tl-title {\n  margin: 0;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-tl-stats {\n  display: flex;\n  align-items: flex-end;\n  gap: 22px;\n  flex-wrap: wrap;\n}\n\n.roa-tl-stat {\n  display: flex;\n  flex-direction: column;\n  gap: 1px;\n}\n\n.roa-tl-stat-k {\n  font-size: 9.5px;\n  font-weight: 800;\n  letter-spacing: 0.09em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-tl-stat-v {\n  font-family: var(--roa-mono);\n  font-size: 19px;\n  font-weight: 800;\n  letter-spacing: -0.02em;\n  line-height: 1.15;\n  color: var(--roa-ink-strong);\n  white-space: nowrap;\n}\n\n.roa-tl-stat-v.is-urgent { color: #b45309; }\n.roa-tl-stat-v.is-late { color: var(--roa-danger); }\n.roa-tl-stat-v.is-empty {\n  font-family: var(--font, \"Segoe UI\", system-ui, sans-serif);\n  font-size: 13px;\n  font-weight: 600;\n  font-style: italic;\n  color: var(--roa-muted);\n}\n\n.roa-tl { overflow-x: auto; }\n\n.roa-tl-rail {\n  display: flex;\n  align-items: flex-start;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n  min-width: 420px;\n}\n\n.roa-tl-node {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  flex: 0 0 auto;\n  min-width: 70px;\n  text-align: center;\n}\n\n.roa-tl-dot {\n  width: 13px;\n  height: 13px;\n  border-radius: 50%;\n  border: 2px solid var(--roa-line);\n  background: var(--roa-paper);\n  flex: 0 0 auto;\n}\n\n.roa-tl-done .roa-tl-dot { background: var(--roa-st-ready); border-color: var(--roa-st-ready); }\n\n.roa-tl-active .roa-tl-dot {\n  background: var(--roa-paper);\n  border-color: var(--roa-st-prep);\n  box-shadow: 0 0 0 3px var(--roa-st-prep-bg);\n}\n\n/* Steps still ahead: hollow dashed dots so the whole route is visible. */\n.roa-tl-pending .roa-tl-dot { border-style: dashed; border-color: var(--roa-muted); }\n\n.roa-tl-closed .roa-tl-dot { background: var(--roa-muted); border-color: var(--roa-muted); }\n.roa-tl-tone-done .roa-tl-dot { background: var(--roa-st-done); border-color: var(--roa-st-done); }\n.roa-tl-tone-declined .roa-tl-dot { background: var(--roa-st-declined); border-color: var(--roa-st-declined); }\n.roa-tl-tone-cancelled .roa-tl-dot { background: var(--roa-st-cancelled); border-color: var(--roa-st-cancelled); }\n\n.roa-tl-label {\n  font-size: 10px;\n  font-weight: 800;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n  white-space: nowrap;\n}\n\n.roa-tl-done .roa-tl-label,\n.roa-tl-active .roa-tl-label,\n.roa-tl-closed .roa-tl-label { color: var(--roa-ink-strong); }\n\n.roa-tl-pending .roa-tl-label { color: var(--roa-muted); opacity: 0.85; }\n\n.roa-tl-tone-declined .roa-tl-label { color: var(--roa-st-declined); }\n\n.roa-tl-time {\n  font-family: var(--roa-mono);\n  font-size: 11px;\n  font-weight: 700;\n  color: var(--roa-ink-strong);\n  white-space: nowrap;\n}\n\n.roa-tl-time-empty { color: var(--roa-muted); font-weight: 600; font-size: 10.5px; }\n.roa-tl-time-est { color: var(--roa-accent); font-weight: 800; }\n\n.roa-tl-gap {\n  position: relative;\n  flex: 1 1 24px;\n  align-self: flex-start;\n  height: 13px;\n  min-width: 42px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.roa-tl-line {\n  position: absolute;\n  left: 0;\n  right: 0;\n  top: 6px;\n  height: 0;\n  border-top: 2px solid var(--roa-line);\n}\n\n.roa-tl-gap-done .roa-tl-line { border-top-color: var(--roa-st-ready); }\n.roa-tl-gap-live .roa-tl-line { border-top-style: dashed; border-top-color: var(--roa-accent); }\n.roa-tl-gap-pending .roa-tl-line { border-top-style: dashed; }\n.roa-tl-gap-closed .roa-tl-line { border-top-color: var(--roa-muted); }\n.roa-tl-gap-unknown .roa-tl-line { border-top-style: dotted; }\n.roa-tl-gap-late .roa-tl-line { border-top-style: solid; border-top-color: var(--roa-st-declined); }\n\n/* The minutes between two steps are the point of the rail - bigger than\n   the labels and the clocks. */\n.roa-tl-gap-text {\n  position: relative;\n  z-index: 1;\n  padding: 0 7px;\n  font-size: 13px;\n  font-weight: 800;\n  letter-spacing: -0.01em;\n  white-space: nowrap;\n  color: var(--roa-ink-strong);\n  background: var(--roa-paper);\n}\n\n.roa-tl-gap-live .roa-tl-gap-text { color: var(--roa-accent); }\n.roa-tl-gap-late .roa-tl-gap-text { color: var(--roa-st-declined); }\n\n.roa-block + .roa-block { margin-top: 18px; }\n\n.roa-block-title {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin: 0 0 8px;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-block-count {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 20px;\n  padding: 0 7px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 0;\n  color: var(--roa-ink-strong);\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n}\n\n.roa-row {\n  display: flex;\n  gap: 10px;\n  justify-content: space-between;\n  align-items: baseline;\n  padding: 3px 0;\n  font-size: 13px;\n}\n\n/* Collapsible side blocks (D-ROTA-30) - the raw timestamps and the extra\n   payment rows stay closed until somebody opens them. */\n\n.roa-fold > summary.roa-block-title {\n  cursor: pointer;\n  list-style: none;\n  margin: 0;\n  user-select: none;\n}\n\n.roa-fold > summary.roa-block-title::-webkit-details-marker { display: none; }\n.roa-fold > summary.roa-block-title::marker { content: ''; }\n.roa-fold > summary.roa-block-title:hover { color: var(--roa-ink-strong); }\n\n.roa-fold-caret {\n  margin-left: auto;\n  font-size: 10px;\n  line-height: 1;\n  transition: transform 0.15s ease;\n}\n\n.roa-fold[open] .roa-fold-caret { transform: rotate(180deg); }\n\n.roa-fold-value {\n  margin-left: auto;\n  max-width: 62%;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-size: 11.5px;\n  font-weight: 700;\n  letter-spacing: 0;\n  text-transform: none;\n  color: var(--roa-ink-strong);\n}\n\n.roa-fold-value + .roa-fold-caret { margin-left: 6px; }\n\n.roa-fold-body { margin-top: 8px; }\n\n/* Small \"?\" next to a block title - the explanation lives in the tooltip\n   instead of a permanent line of text (D-ROTA-34). */\n.roa-help {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 15px;\n  height: 15px;\n  border-radius: 50%;\n  border: 1px solid var(--roa-line);\n  background: var(--roa-paper-soft);\n  font-size: 10px;\n  font-weight: 800;\n  letter-spacing: 0;\n  color: var(--roa-muted);\n  cursor: help;\n}\n\n.roa-help:hover { color: var(--roa-ink-strong); border-color: var(--roa-muted); }\n\n.roa-fold-empty {\n  margin: 0;\n  font-size: 12.5px;\n  color: var(--roa-muted);\n}\n\n.roa-row-block { align-items: flex-start; }\n\n.roa-k { color: var(--roa-muted); flex: 0 0 auto; font-size: 12.5px; }\n.roa-v { text-align: right; font-weight: 600; color: var(--roa-ink-strong); word-break: break-word; }\n.roa-v.warn { color: var(--roa-st-new); }\n.roa-addr { font-weight: 500; line-height: 1.45; }\n\n.roa-link {\n  background: none;\n  border: none;\n  padding: 0;\n  margin: 0;\n  font: inherit;\n  font-weight: 700;\n  color: var(--roa-accent);\n  cursor: pointer;\n  text-decoration: underline dotted;\n}\n\n.roa-link:hover { text-decoration: underline solid; }\n\n.roa-empty-inline {\n  padding: 12px;\n  color: var(--roa-muted);\n  font-size: 13px;\n  text-align: center;\n  border: 1px dashed var(--roa-line);\n  border-radius: 8px;\n}\n\n/* lines - the prep ticket the kitchen reads (D-ROTA-28) */\n\n.roa-lines {\n  background: var(--roa-paper-soft);\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n  padding: 2px 12px;\n}\n\n.roa-line {\n  display: flex;\n  justify-content: space-between;\n  gap: 14px;\n  padding: 12px 0;\n  border-bottom: 1px dashed var(--roa-line);\n}\n\n.roa-line:last-child { border-bottom: none; }\n\n.roa-line-main { min-width: 0; flex: 1 1 auto; }\n\n.roa-line-title {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  flex-wrap: wrap;\n}\n\n/* Quantity badge - the first thing the kitchen reads. */\n.roa-qty {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 30px;\n  padding: 1px 8px;\n  border-radius: 8px;\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-ink-strong);\n  font-family: var(--roa-mono);\n  font-size: 15px;\n  font-weight: 800;\n  color: var(--roa-ink-strong);\n}\n\n.roa-item {\n  font-size: 16px;\n  font-weight: 800;\n  letter-spacing: -0.01em;\n  color: var(--roa-ink-strong);\n}\n\n.roa-size {\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n  border: 1px solid var(--roa-line);\n  border-radius: 999px;\n  padding: 1px 8px;\n  background: var(--roa-paper);\n}\n\n.roa-line-internal { font-size: 11.5px; color: var(--roa-muted); font-style: italic; margin-top: 2px; }\n\n.roa-mods { list-style: none; margin: 7px 0 0; padding: 0; }\n\n.roa-mods li {\n  position: relative;\n  padding: 2px 0 2px 14px;\n  font-size: 13.5px;\n  line-height: 1.4;\n  color: var(--roa-ink);\n}\n\n.roa-mods li::before {\n  content: '';\n  position: absolute;\n  left: 2px;\n  top: 9px;\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--roa-ink-strong);\n}\n\n.roa-mod-name { font-weight: 700; color: var(--roa-ink-strong); }\n.roa-mod-qty { font-family: var(--roa-mono); font-weight: 700; color: var(--roa-muted); }\n.roa-mod-price { font-family: var(--roa-mono); font-weight: 600; color: var(--roa-muted); font-size: 12px; }\n.roa-mod-group { color: var(--roa-muted); font-size: 12px; }\n\n/* Cooking instructions must not be missed - full-width amber callout. */\n.roa-instr {\n  display: flex;\n  align-items: flex-start;\n  gap: 8px;\n  margin-top: 8px;\n  padding: 7px 10px;\n  font-size: 13px;\n  font-weight: 700;\n  line-height: 1.4;\n  color: #92400e;\n  background: #fffbeb;\n  border: 1px solid #fde68a;\n  border-left: 3px solid #f59e0b;\n  border-radius: 8px;\n}\n\n.roa-instr-label {\n  flex: 0 0 auto;\n  font-size: 10px;\n  font-weight: 800;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  padding-top: 2px;\n  color: #b45309;\n}\n\n.roa-line-price {\n  flex: 0 0 auto;\n  text-align: right;\n  font-family: var(--roa-mono);\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  min-width: 86px;\n}\n\n.roa-unit { font-size: 11.5px; color: var(--roa-muted); }\n.roa-unit-note { font-size: 11px; color: var(--roa-muted); }\n.roa-line-total { font-size: 14.5px; font-weight: 800; color: var(--roa-ink-strong); }\n\n/* totals */\n\n.roa-totals {\n  background: var(--roa-paper-soft);\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n  padding: 12px 14px;\n}\n\n.roa-totals-title {\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n  margin-bottom: 8px;\n}\n\n.roa-total-row {\n  display: flex;\n  justify-content: space-between;\n  gap: 12px;\n  font-size: 13px;\n  padding: 2px 0;\n  color: var(--roa-ink);\n}\n\n.roa-total-row span:last-child { font-family: var(--roa-mono); font-weight: 600; }\n\n.roa-total-grand {\n  display: flex;\n  justify-content: space-between;\n  gap: 12px;\n  margin-top: 8px;\n  padding-top: 9px;\n  border-top: 2px solid var(--roa-ink-strong);\n  font-size: 17px;\n  font-weight: 800;\n  color: var(--roa-ink-strong);\n}\n\n.roa-total-grand span:last-child { font-family: var(--roa-mono); }\n\n/* Totals inside the collapsed block: no heading, no grand-total row, the\n   summary already shows the amount. */\n.roa-totals-flat { padding: 10px 12px; }\n\n/* Rare detail actions live in this menu. */\n.roa-detail-menu .roa-menu-panel { min-width: 190px; }\n\n/* note (display-only on this board) */\n\n.roa-note-box {\n  margin-top: 8px;\n  padding: 9px 12px;\n  background: var(--roa-paper-soft);\n  border: 1px dashed var(--roa-line);\n  border-radius: 8px;\n  font-size: 12.5px;\n  color: var(--roa-ink);\n  white-space: pre-wrap;\n  word-break: break-word;\n}\n\n/* ----------------------------------------------------------------- modal */\n\n.roa-modal {\n  position: fixed;\n  inset: 0;\n  z-index: 50;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px;\n  background: rgba(15, 23, 42, 0.45);\n}\n\n.roa-modal-card {\n  width: min(430px, 100%);\n  max-height: calc(100vh - 40px);\n  display: flex;\n  flex-direction: column;\n  background: var(--roa-paper);\n  border-radius: var(--roa-radius);\n  box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);\n  overflow: hidden;\n}\n\n.roa-modal-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n  padding: 13px 16px;\n  border-bottom: 1px solid var(--roa-line);\n}\n\n.roa-modal-title { font-size: 15px; font-weight: 800; color: var(--roa-ink-strong); }\n\n.roa-modal-x {\n  border: none;\n  background: none;\n  font: inherit;\n  font-size: 15px;\n  color: var(--roa-muted);\n  cursor: pointer;\n  padding: 4px;\n  line-height: 1;\n}\n\n.roa-modal-x:hover { color: var(--roa-ink-strong); }\n\n.roa-modal-body {\n  padding: 14px 16px;\n  overflow-y: auto;\n}\n\n.roa-modal-foot {\n  display: flex;\n  align-items: center;\n  justify-content: flex-end;\n  gap: 8px;\n  flex-wrap: wrap;\n  padding: 12px 16px;\n  border-top: 1px solid var(--roa-line);\n  background: var(--roa-paper-soft);\n}\n\n.roa-modal-order {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n  padding: 9px 12px;\n  margin-bottom: 12px;\n  background: var(--roa-paper-soft);\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n  font-size: 13px;\n  font-weight: 700;\n}\n\n.roa-eta-label {\n  display: block;\n  margin-bottom: 8px;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-eta-chips {\n  display: flex;\n  gap: 7px;\n  flex-wrap: wrap;\n  margin-bottom: 10px;\n}\n\n.roa-eta-chip {\n  font: inherit;\n  font-size: 12.5px;\n  font-weight: 700;\n  padding: 6px 12px;\n  border-radius: 999px;\n  border: 1px solid var(--roa-line);\n  background: var(--roa-paper);\n  color: var(--roa-ink);\n  cursor: pointer;\n}\n\n.roa-eta-chip:hover { border-color: var(--roa-accent); color: var(--roa-accent); }\n\n.roa-eta-chip.roa-eta-chip-on {\n  background: var(--roa-accent-soft);\n  border-color: var(--roa-accent);\n  color: var(--roa-accent);\n}\n\n.roa-eta-input-row {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin-bottom: 12px;\n  font-size: 13px;\n  color: var(--roa-muted);\n}\n\n.roa-eta-input {\n  width: 82px;\n  padding: 7px 10px;\n  font: inherit;\n  font-size: 13px;\n  color: var(--roa-ink);\n  background: var(--roa-paper);\n  border: 1px solid var(--roa-line);\n  border-radius: 9px;\n}\n\n.roa-eta-result {\n  padding: 9px 12px;\n  background: var(--roa-st-ready-bg);\n  border: 1px solid var(--roa-st-ready);\n  border-radius: 10px;\n  font-size: 13px;\n  font-weight: 700;\n  color: #14532d;\n}\n\n.roa-eta-result-empty { background: var(--roa-paper-soft); border-color: var(--roa-line); color: var(--roa-muted); }\n\n/* ------------------------------------------------------------------ foot */\n\n.roa-foot {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  flex-wrap: wrap;\n  padding: 10px 2px 0;\n  font-size: 11.5px;\n  color: var(--roa-muted);\n}\n\n.roa-refreshed { margin-left: auto; }\n.roa-loaded { font-weight: 700; }\n\n.roa-build {\n  font-family: var(--roa-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.04em;\n}\n\n/* ----------------------------------------------------------- responsive */\n\n@media (max-width: 820px) {\n  .roa { padding: 8px; }\n  .roa-detail-grid { grid-template-columns: 1fr; }\n  .roa-detail-side { border-right: none; border-bottom: 2px dashed var(--roa-line); }\n  .roa-topbar .roa-tabs { flex-basis: 100%; }\n  .roa-top-actions { width: 100%; justify-content: flex-start; }\n  .roa-toolbar .roa-search { flex: 1 1 100%; }\n  .roa-toolbar .roa-sortlabel { display: none; }\n  .roa-toolbar .roa-select { flex: 1 1 auto; width: 100%; }\n  .roa-board { grid-template-columns: 1fr; }\n  .roa-card-actionbar .roa-btn-primary,\n  .roa-card-actionbar .roa-btn-danger { font-size: 14px; padding: 12px 16px; }\n\n  /* Timeline turns vertical on a phone: dot on the left, label and time\n     to the right, the gap written next to a vertical line. */\n  .roa-tl { overflow-x: visible; }\n  .roa-tl-rail { flex-direction: column; align-items: stretch; min-width: 0; }\n  .roa-tl-node {\n    flex-direction: row;\n    align-items: center;\n    gap: 9px;\n    min-width: 0;\n    text-align: left;\n  }\n  .roa-tl-time { margin-left: auto; }\n  .roa-tl-gap {\n    flex: 0 0 30px;\n    height: 30px;\n    min-width: 0;\n    justify-content: flex-start;\n    margin-left: 7px;\n  }\n  .roa-tl-line {\n    left: 0;\n    right: auto;\n    top: -10px;\n    bottom: -4px;\n    width: 0;\n    height: auto;\n    border-top: none;\n    border-left: 2px solid var(--roa-line);\n  }\n  .roa-tl-gap-done .roa-tl-line { border-left-color: var(--roa-st-ready); }\n  .roa-tl-gap-live .roa-tl-line { border-left-style: dashed; border-left-color: var(--roa-accent); }\n  .roa-tl-gap-pending .roa-tl-line { border-left-style: dashed; }\n  .roa-tl-gap-closed .roa-tl-line { border-left-color: var(--roa-muted); }\n  .roa-tl-gap-unknown .roa-tl-line { border-left-style: dotted; }\n  .roa-tl-gap-late .roa-tl-line { border-left-style: solid; border-left-color: var(--roa-st-declined); }\n  .roa-tl-gap-text { margin-left: 20px; padding: 0; background: transparent; font-size: 12px; line-height: 1.2; }\n  .roa-tl-stats { gap: 16px; }\n  .roa-tl-stat-v { font-size: 17px; }\n}\n\n/* ------------------------------------------------------- thermal ticket */\n/* Black text only, 80 mm roll (D-ROTA-36). The sheet exists in the DOM but\n   is hidden on screen; the print media query shows the ticket and hides the\n   app, so Ctrl+P from the print button prints the ticket alone. */\n\n.roa-print { display: none; }\n\n.roa-print-sheet {\n  width: 72mm;\n  color: #000000;\n  background: #ffffff;\n  font-family: var(--roa-mono);\n  font-size: 11pt;\n  line-height: 1.35;\n}\n\n.roa-print-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 4mm;\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  font-weight: 800;\n}\n\n.roa-print-brand { font-size: 11pt; }\n.roa-print-num { font-size: 20pt; letter-spacing: 0; }\n\n.roa-print-rule {\n  border-top: 1px dashed #000000;\n  margin: 3mm 0;\n}\n\n.roa-print-meta > div {\n  display: flex;\n  justify-content: space-between;\n  gap: 6mm;\n}\n\n.roa-print-meta span:first-child { text-transform: uppercase; }\n.roa-print-meta span:last-child { text-align: right; font-weight: 700; }\n\n.roa-print-items {\n  display: flex;\n  flex-direction: column;\n  gap: 3mm;\n}\n\n.roa-print-item-line {\n  display: flex;\n  align-items: baseline;\n  gap: 2mm;\n}\n\n.roa-print-qty { font-size: 13pt; font-weight: 800; }\n.roa-print-name { flex: 1 1 auto; font-size: 13pt; font-weight: 800; }\n.roa-print-size { font-size: 10pt; text-transform: uppercase; }\n\n.roa-print-mod { padding-left: 6mm; font-size: 11pt; }\n\n.roa-print-note {\n  margin-top: 1mm;\n  padding-left: 6mm;\n  font-size: 11pt;\n  font-weight: 800;\n  text-transform: uppercase;\n}\n\n.roa-print-total {\n  display: flex;\n  justify-content: space-between;\n  font-size: 12pt;\n  font-weight: 800;\n  text-transform: uppercase;\n}\n\n.roa-print-foot {\n  font-size: 9pt;\n  text-align: center;\n}\n\n@media print {\n  @page { size: 80mm auto; margin: 4mm; }\n  html, body { background: #ffffff !important; }\n  .roa { padding: 0; background: #ffffff; }\n  .roa-shell, .roa-modal, .roa-detail-overlay { display: none !important; }\n  .roa-print { display: block !important; }\n}\n\n/* ------------------------------------------- accept dialog summary */\n/* Customer, address, items and note shown before an order is accepted\n   (D-ROTA-39). */\n\n.roa-modal-summary {\n  margin-bottom: 14px;\n  padding: 8px 12px;\n  background: var(--roa-paper-soft);\n  border: 1px solid var(--roa-line);\n  border-radius: 10px;\n}\n\n.roa-modal-row {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 3px 0;\n  font-size: 13px;\n}\n\n.roa-modal-row-block { align-items: flex-start; }\n\n.roa-modal-k {\n  flex: 0 0 auto;\n  padding-top: 2px;\n  font-size: 10px;\n  font-weight: 800;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--roa-muted);\n}\n\n.roa-modal-v {\n  min-width: 0;\n  text-align: right;\n  font-weight: 700;\n  color: var(--roa-ink-strong);\n  word-break: break-word;\n}\n\n.roa-modal-addr { line-height: 1.45; }\n\n.roa-modal-note {\n  font-weight: 600;\n  line-height: 1.4;\n}\n\n/* Closing-time warning inside the accept dialog (D-ROTA-41) - only shown\n   inside the last two hours of the day. */\n.roa-closing {\n  margin: 0 0 12px;\n  padding: 8px 11px;\n  font-size: 12.5px;\n  font-weight: 700;\n  line-height: 1.4;\n  color: #92400e;\n  background: #fffbeb;\n  border: 1px solid #fde68a;\n  border-left: 3px solid #f59e0b;\n  border-radius: 8px;\n}\n\n.roa-closing-urgent {\n  color: var(--roa-danger);\n  background: var(--roa-st-declined-bg);\n  border-color: #fca5a5;\n  border-left-color: var(--roa-danger);\n}\n"},"js":{"name":"RestaurantOrderTakingApp.js","src":"../app/RestaurantOrderTakingApp.js","content":"/* build 2026-11-13-5 */\n\n/* =====================================================================\n   RestaurantOrderTakingApp - application-level ACTIVE ORDERS BOARD\n   (listing tool, TYPE 3) for the restaurant order application.\n\n   APPLICATIONS (see docs/ssot.html section 4.1):\n     1. restaurants-easyorder                 - one object per restaurant\n        (profile, hours, closing time). The board resolves exactly ONE of\n        them AT RUNTIME from the CMS page it is opened on (the board record\n        or the restaurant in the page address); the tool definition itself\n        is tenant wide and cannot name a restaurant per restaurant\n        (D-ROTA-46).\n     2. restaurant-orders-easyorder   - every order of every\n        restaurant, one object per order. Each order carries\n        restaurantId = the restaurant SLUG, which is the join key.\n     3. restaurant-order-taking-app-easyorder - this tool. One record per\n        restaurant; the tool shows only the active day slice of that\n        restaurant's orders: 1:N.\n\n   READ  : order records of the configured object type (parameter\n           ordersObjectType, default restaurant-orders-easyorder) through\n           tool.requestObjects('query'). The board refreshes on\n           a timer and on demand, so the kitchen always sees the latest\n           state of today's orders.\n   WRITE : order status advances through tool.requestObjects('update')\n           (status, statusChangedAt and the optional acceptedAt /\n           estimatedReadyAt fields). Never a direct database or REST\n           call from the sandbox.\n   ===================================================================== */\n\n/* Tool build stamp - MANDATORY (html-tool-rules GLOBAL REQUIREMENT):\n   bump on EVERY code change so stale CMS uploads are detectable. */\nvar TOOL_BUILD = '2026-11-13-5';\nconsole.log('[TOOL:BOOT] build ' + TOOL_BUILD + ' RestaurantOrderTakingApp starting...');\n\n(function () {\n  'use strict';\n\n  /* ----------------------------------------------------------- constants */\n\n  var STATUS_FIELD = 'status';\n  var STATUS_TIME_FIELD = 'statusChangedAt';\n  var ACCEPTED_AT_FIELD = 'acceptedAt';\n  var ETA_FIELD = 'estimatedReadyAt';\n\n  var STATUS_NEW = 'new';\n  var STATUS_ACCEPTED = 'accepted';\n  var STATUS_PREP = 'in-preparation';\n  var STATUS_READY = 'ready';\n  var STATUS_DONE = 'completed';\n  var STATUS_DECLINED = 'declined';\n  var STATUS_CANCELLED = 'cancelled';\n\n  var ACTIVE_STATUSES = [STATUS_NEW, STATUS_ACCEPTED, STATUS_PREP, STATUS_READY];\n  var TERMINAL_STATUSES = [STATUS_DONE, STATUS_DECLINED, STATUS_CANCELLED];\n  /* Workflow order for the status selector in the detail popup (D-ROTA-18). */\n  var STATUS_ORDER = [STATUS_NEW, STATUS_ACCEPTED, STATUS_PREP, STATUS_READY, STATUS_DONE, STATUS_DECLINED, STATUS_CANCELLED];\n\n  var STATUS_META = {\n    'new': { label: 'New', cls: 'new', next: STATUS_ACCEPTED, nextLabel: 'Accept', tab: 'new', action: 'accept' },\n    'accepted': { label: 'Accepted', cls: 'accepted', next: STATUS_PREP, nextLabel: 'Start prep', tab: 'progress', action: 'status' },\n    'in-preparation': { label: 'In preparation', cls: 'prep', next: STATUS_READY, nextLabel: 'Mark ready', tab: 'progress', action: 'status' },\n    'ready': { label: 'Ready', cls: 'ready', next: STATUS_DONE, nextLabel: 'Complete', tab: 'ready', action: 'status' },\n    'completed': { label: 'Completed', cls: 'done', next: null, nextLabel: '', tab: 'finished', action: '' },\n    'declined': { label: 'Declined', cls: 'declined', next: null, nextLabel: '', tab: 'finished', action: '' },\n    'cancelled': { label: 'Cancelled', cls: 'cancelled', next: null, nextLabel: '', tab: 'finished', action: '' }\n  };\n\n  var TABS = [\n    { id: 'all', label: 'All' },\n    { id: 'new', label: 'New' },\n    { id: 'progress', label: 'In progress' },\n    { id: 'ready', label: 'Ready' },\n    { id: 'finished', label: 'Finished' }\n  ];\n\n  var ORDER_FIELDS = [\n    'orderNumber', 'placedAt', 'channel', 'customer', 'address',\n    'customAddressFields', 'tableNumber', 'deliveryZone', 'scheduledFor',\n    'paymentMethod', 'paymentDetails', 'lines', 'totals',\n    'status', 'statusChangedAt', 'internalNote',\n    'restaurantId', 'restaurantSlug', 'restaurant_slug', 'restaurantKey',\n    'restaurant', 'siteId', 'cmsRestaurantId',\n    ACCEPTED_AT_FIELD, ETA_FIELD\n  ];\n\n  /* Where an order carries its restaurant. Production orders of the\n     restaurant-orders-easyorder type store the restaurant SLUG in\n     restaurantSlug (D-ROTA-50); the other names stay as aliases for older\n     writers, but the slug is the documented contract. */\n  var ORDER_RESTAURANT_FIELDS = [\n    'restaurantId', 'restaurantSlug', 'restaurant_slug', 'restaurantKey',\n    'restaurant', 'siteId', 'cmsRestaurantId'\n  ];\n\n  var CHANNEL_META = {\n    'pickup': { label: 'Pickup', icon: '\\uD83E\\uDD61' },\n    'delivery': { label: 'Delivery', icon: '\\uD83D\\uDEF5' },\n    'on_premise': { label: 'Dine-in', icon: '\\uD83C\\uDF7D' },\n    'on-premise': { label: 'Dine-in', icon: '\\uD83C\\uDF7D' },\n    'onpremise': { label: 'Dine-in', icon: '\\uD83C\\uDF7D' }\n  };\n\n  var PAYMENT_LABELS = {\n    'cash': 'Cash',\n    'card': 'Card',\n    'interac': 'Interac',\n    'online': 'Online payment'\n  };\n\n  var WRITE_ROLES = ['admin', 'owner', 'developer', 'user-manager', 'editor'];\n\n  var ETA_CHIPS = [15, 30, 45, 60, 90, 120];\n\n  var MAX_BOARD_ITEMS = 200;\n  var ARM_SECONDS = 6000;\n  var FRESH_FLASH_MS = 6000;   /* how long a just-arrived order keeps its ring */\n  var UI_SAVE_DEBOUNCE = 300;\n  var SEARCH_DEBOUNCE = 250;\n  var URGENT_WINDOW_MINUTES = 5;\n\n  /* --------------------------------------------------------------- state */\n\n  var _orders = [];            /* normalized order list from the last load */\n  var _orderById = {};         /* id -> normalized order */\n  var _knownIds = {};          /* ids seen on the previous successful load */\n  var _freshIds = {};          /* ids that appeared in the last load (new-order flash) */\n  var _freshClearTimer = null; /* clears the fresh rings after FRESH_FLASH_MS */\n  var _silentNextLoad = false; /* true right after a sample import - no fresh rings, no toasts */\n  var _firstLoadDone = false;\n\n  var _ui = { tab: 'all', sort: 'waiting', search: '' };\n  var _lastStagedUi = '';\n  var _saveUiTimer = null;\n\n  var _detailId = '';\n  var _acceptFor = '';         /* order id the accept modal is open for */\n  var _etaMinutes = 0;         /* chosen minutes in the accept modal, 0 = none */\n  var _armed = { orderId: '', status: '', timer: null };\n  var _busy = {};              /* orderId -> true while a write is in flight */\n\n  /* Kitchen state the order type may not define (D-ROTA-51). The board never\n     requires status timestamps or an ETA on the order: what the CMS refuses\n     is remembered here so the board keeps showing the truth for this session\n     and the next write stops asking for it. */\n  var _rejectedOrderFields = {};  /* field name -> true once the CMS refused it */\n  var _localOrderState = {};      /* orderId -> status values the board shows even when they are not stored */\n\n  var _menuOpen = false;       /* three-dots action menu visibility */\n  var _importBusy = false;     /* true while a sample import is running */\n  var _clearArmed = false;     /* true while the remove-today confirm is armed */\n  var _clearArmTimer = null;\n\n  var _loading = false;\n  var _error = '';\n  var _lastRefreshAt = 0;\n\n  /* Restaurant scope (D-ROTA-42): the settings object of THIS restaurant,\n     the state of the slug lookup, and the counts behind the empty state. */\n  var _restaurantSettings = null;\n  var _restaurantState = 'pending';  /* pending | ready | no-context | not-found | duplicate | error */\n  var _instanceRestaurantReferences = []; /* restaurant ids read from the board record (one record per restaurant) */\n  var _boardRecordCount = 0;         /* board records found on the application page */\n  var _boardRecordSummaries = [];    /* their restaurant references, for the diagnostic message */\n  var _boardRecordError = '';        /* why the board-record list could not be read */\n  var _boardRecordNotice = '';       /* 'not-allowed' | 'disabled' - read skipped on purpose */\n  var _restaurantSlugSuggestions = []; /* restaurant slugs found when no board record exists */\n  var _diagDone = false;             /* the reachability dump is printed once per boot */\n  var _allOrders = [];               /* every order of the last load, before scoping */\n  var _hiddenOrderCount = 0;         /* orders that belong to another restaurant */\n  var _unassignedOrderCount = 0;     /* orders that carry no restaurant at all */\n  var _warnedUnassignedOrders = false;\n\n  var _readOnly = false;\n  var _noIdentity = false;\n  var _user = null;\n  var _canWrite = false;\n  var _wired = false;\n  var _warnedAccess = false;\n  var _pollTimer = null;\n  var _tickTimer = null;\n  var _searchTimer = null;\n\n  var _cfg = {\n    ordersType: 'restaurant-orders-easyorder',\n    settingsType: 'restaurants-easyorder',\n    ordersDataCategory: '',         /* empty = use the category the orders were read from (e.g. orderData) */\n    toolAppType: 'restaurant-order-taking-app-easyorder', /* the per-restaurant record this board runs in */\n    readBoardRecords: true,        /* read this application's own records to find the restaurant (needs the type in allowedObjectTypes) */\n    allowUnassignedOrders: false,  /* legacy escape hatch - off by default (cross-restaurant risk) */\n    autoRefreshSeconds: 20,\n    newOrderNotifications: true,\n    warnMinutes: 10,\n    timeZone: '',                  /* filled from the restaurant object, never from a parameter */\n    currency: '',                  /* filled from the restaurant object, never from a parameter */\n    printMode: 'dialog',        /* dialog = browser print dialog, rawbt = direct print through the RawBT app */\n    printAgentUrl: ''           /* reserved - unused, kept out of the params */\n  };\n\n  /* ------------------------------------------------------- tiny helpers */\n\n  function $id(id) { return document.getElementById(id); }\n\n  function esc(value) {\n    if (value === undefined || value === null) return '';\n    return String(value)\n      .replace(/&/g, '&amp;')\n      .replace(/<\/g, '&lt;')\n      .replace(/>/g, '&gt;')\n      .replace(/\"/g, '&quot;');\n  }\n\n  function num(value) {\n    if (typeof value === 'number') return isFinite(value) ? value : 0;\n    var parsed = parseFloat(String(value === undefined || value === null ? '' : value).replace(/[^0-9.\\-]/g, ''));\n    return isFinite(parsed) ? parsed : 0;\n  }\n\n  function pad2(n) { return (n < 10 ? '0' : '') + n; }\n\n  function fmtMoney(value) {\n    var amount = num(value);\n    if (_cfg.currency) {\n      try {\n        return new Intl.NumberFormat(undefined, {\n          style: 'currency',\n          currency: _cfg.currency,\n          currencyDisplay: 'narrowSymbol',\n          minimumFractionDigits: 2,\n          maximumFractionDigits: 2\n        }).format(amount);\n      } catch (err) { /* fall through to plain amount */ }\n    }\n    return amount.toFixed(2);\n  }\n\n  function fmtTime(tsOrIso) {\n    if (!tsOrIso) return '';\n    var date = new Date(tsOrIso);\n    if (isNaN(date.getTime())) return '';\n    var options = { hour: '2-digit', minute: '2-digit' };\n    if (_cfg.timeZone) options.timeZone = _cfg.timeZone;\n    try {\n      return new Intl.DateTimeFormat(undefined, options).format(date);\n    } catch (err) {\n      return date.toLocaleTimeString();\n    }\n  }\n\n  function fmtDateTime(iso) {\n    if (!iso) return '';\n    var date = new Date(iso);\n    if (isNaN(date.getTime())) return String(iso);\n    var options = { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' };\n    if (_cfg.timeZone) options.timeZone = _cfg.timeZone;\n    try {\n      return new Intl.DateTimeFormat(undefined, options).format(date);\n    } catch (err) {\n      return date.toLocaleString();\n    }\n  }\n\n  /* Date without the clock - the thermal ticket prints times separately so\n     every line stays short on 80 mm paper. */\n  function fmtDateOnly(iso) {\n    if (!iso) return '';\n    var date = new Date(iso);\n    if (isNaN(date.getTime())) return '';\n    var options = { year: 'numeric', month: 'short', day: '2-digit' };\n    if (_cfg.timeZone) options.timeZone = _cfg.timeZone;\n    try {\n      return new Intl.DateTimeFormat(undefined, options).format(date);\n    } catch (err) {\n      return date.toLocaleDateString();\n    }\n  }\n\n  function tsOf(iso) {\n    if (!iso) return 0;\n    var t = new Date(iso).getTime();\n    return isNaN(t) ? 0 : t;\n  }\n\n  function minutesSince(iso) {\n    var t = tsOf(iso);\n    if (!t) return null;\n    return Math.floor((Date.now() - t) / 60000);\n  }\n\n  function secondsSince(iso) {\n    var t = tsOf(iso);\n    if (!t) return null;\n    return Math.max(0, Math.floor((Date.now() - t) / 1000));\n  }\n\n  /* Kitchen-style clock: \"05:10\", then \"1h 05m\" past an hour. */\n  function fmtElapsedClock(seconds) {\n    if (seconds === null || seconds === undefined) return '';\n    if (seconds < 0) seconds = 0;\n    if (seconds >= 3600) {\n      var hours = Math.floor(seconds / 3600);\n      var rest = Math.floor((seconds % 3600) / 60);\n      return hours + 'h ' + pad2(rest) + 'm';\n    }\n    return pad2(Math.floor(seconds / 60)) + ':' + pad2(seconds % 60);\n  }\n\n  function fmtDurationMinutes(minutes) {\n    if (minutes === null || minutes === undefined) return '';\n    if (minutes < 1) return 'less than a minute';\n    if (minutes < 60) return minutes + ' min';\n    var hours = Math.floor(minutes / 60);\n    var rest = minutes % 60;\n    return hours + 'h' + (rest ? ' ' + rest + 'm' : '');\n  }\n\n  /* Compact gap label used on the order timeline line: \"8 min\", \"1h 5m\". */\n  function fmtShortGap(milliseconds) {\n    var minutes = Math.round(Math.abs(Number(milliseconds) || 0) / 60000);\n    if (minutes < 1) return 'under 1 min';\n    if (minutes < 60) return minutes + ' min';\n    var hours = Math.floor(minutes / 60);\n    var rest = minutes % 60;\n    return hours + 'h' + (rest ? ' ' + rest + 'm' : '');\n  }\n\n  function isSameLocalDay(ts) {\n    if (!ts) return false;\n    var a = new Date(ts);\n    var b = new Date();\n    return a.getFullYear() === b.getFullYear() &&\n      a.getMonth() === b.getMonth() &&\n      a.getDate() === b.getDate();\n  }\n\n  function asArray(value) {\n    if (Array.isArray(value)) return value;\n    if (typeof value === 'string' && value.trim()) {\n      try {\n        var parsed = JSON.parse(value);\n        return Array.isArray(parsed) ? parsed : [];\n      } catch (err) { return []; }\n    }\n    return [];\n  }\n\n  function asObject(value) {\n    if (value && typeof value === 'object' && !Array.isArray(value)) return value;\n    if (typeof value === 'string' && value.trim()) {\n      try {\n        var parsed = JSON.parse(value);\n        return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : null;\n      } catch (err) { return null; }\n    }\n    return null;\n  }\n\n  function merge(objectA, objectB) {\n    var out = {};\n    var key;\n    if (objectA && typeof objectA === 'object') {\n      for (key in objectA) { if (Object.prototype.hasOwnProperty.call(objectA, key)) out[key] = objectA[key]; }\n    }\n    if (objectB && typeof objectB === 'object') {\n      for (key in objectB) { if (Object.prototype.hasOwnProperty.call(objectB, key)) out[key] = objectB[key]; }\n    }\n    return out;\n  }\n\n  function notify(message, severity) {\n    try {\n      if (typeof tool.notify === 'function') { tool.notify(message, severity || 'info'); return; }\n    } catch (err) { /* ignore */ }\n    console.log('[RestaurantOrderTakingApp] ' + (severity || 'info') + ': ' + message);\n  }\n\n  /* --------------------------------------------- reading order records */\n\n  function normalizeKey(key) {\n    return String(key === undefined || key === null ? '' : key).toLowerCase().replace(/[^a-z0-9]/g, '');\n  }\n\n  function findKey(bag, name) {\n    if (!bag || typeof bag !== 'object') return undefined;\n    if (Object.prototype.hasOwnProperty.call(bag, name)) return bag[name];\n    var wanted = normalizeKey(name);\n    for (var key in bag) {\n      if (!Object.prototype.hasOwnProperty.call(bag, key)) continue;\n      if (normalizeKey(key) === wanted) return bag[key];\n    }\n    return undefined;\n  }\n\n  /* Category-based CMS data keeps the field values under a CATEGORY key on the\n     real tenant objects - data_categoriesBased.orderData = { orderNumber,\n     lines, totals, ... } - while the platform reference describes the flat\n     shape data_categoriesBased = { fieldId: value }. Both shapes are read, so\n     the board works on every tenant without a setting (D-ROTA-50). */\n  function pushCategoryBags(bags, container) {\n    if (!container || typeof container !== 'object' || Array.isArray(container)) return;\n    for (var key in container) {\n      if (!Object.prototype.hasOwnProperty.call(container, key)) continue;\n      var value = container[key];\n      if (!value || typeof value !== 'object' || Array.isArray(value)) continue;\n      if (bags.indexOf(value) !== -1) continue;\n      bags.push(value);\n    }\n  }\n\n  function collectBags(source) {\n    var bags = [];\n    if (!source || typeof source !== 'object') return bags;\n    bags.push(source);\n    if (source.data_categoriesBased && typeof source.data_categoriesBased === 'object') {\n      bags.push(source.data_categoriesBased);\n      pushCategoryBags(bags, source.data_categoriesBased);\n    }\n    if (source.data && typeof source.data === 'object') bags.push(source.data);\n    if (source.objectData && typeof source.objectData === 'object') {\n      bags.push(source.objectData);\n      if (source.objectData.data_categoriesBased && typeof source.objectData.data_categoriesBased === 'object') {\n        bags.push(source.objectData.data_categoriesBased);\n        pushCategoryBags(bags, source.objectData.data_categoriesBased);\n      }\n    }\n    if (source.productData && typeof source.productData === 'object') {\n      bags.push(source.productData);\n      if (source.productData.data_categoriesBased && typeof source.productData.data_categoriesBased === 'object') {\n        bags.push(source.productData.data_categoriesBased);\n        pushCategoryBags(bags, source.productData.data_categoriesBased);\n      }\n    }\n    return bags;\n  }\n\n  /* Key of the category that holds the order fields (e.g. \"orderData\"), or\n     empty when the tenant stores the fields flat under data_categoriesBased.\n     The write path mirrors whatever the read path found, so a status change\n     lands in the same place the order app reads it from. */\n  function dataCategoryOf(source) {\n    if (!source || typeof source !== 'object') return '';\n    var containers = [];\n    if (source.productData && source.productData.data_categoriesBased) containers.push(source.productData.data_categoriesBased);\n    if (source.data_categoriesBased) containers.push(source.data_categoriesBased);\n    if (source.objectData && source.objectData.data_categoriesBased) containers.push(source.objectData.data_categoriesBased);\n\n    for (var c = 0; c < containers.length; c++) {\n      var container = containers[c];\n      if (!container || typeof container !== 'object' || Array.isArray(container)) continue;\n      var flat = false;\n      for (var f = 0; f < ORDER_FIELDS.length; f++) {\n        if (Object.prototype.hasOwnProperty.call(container, ORDER_FIELDS[f])) { flat = true; break; }\n      }\n      if (flat) continue;\n      for (var key in container) {\n        if (!Object.prototype.hasOwnProperty.call(container, key)) continue;\n        var value = container[key];\n        if (!value || typeof value !== 'object' || Array.isArray(value)) continue;\n        for (var g = 0; g < ORDER_FIELDS.length; g++) {\n          if (Object.prototype.hasOwnProperty.call(value, ORDER_FIELDS[g])) return key;\n        }\n      }\n    }\n    return '';\n  }\n\n  /* Wraps a field patch in the category the order was read from. */\n  function wrapOrderPatch(category, patch) {\n    if (!category) return patch;\n    var bag = {};\n    bag[category] = patch;\n    return bag;\n  }\n\n  function bagScore(bag) {\n    if (!bag || typeof bag !== 'object') return 0;\n    var score = 0;\n    for (var i = 0; i < ORDER_FIELDS.length; i++) {\n      if (findKey(bag, ORDER_FIELDS[i]) !== undefined) score++;\n    }\n    return score;\n  }\n\n  function orderedBags(source) {\n    var bags = collectBags(source);\n    var scored = [];\n    for (var b = 0; b < bags.length; b++) {\n      var score = bagScore(bags[b]);\n      if (score > 0) scored.push({ bag: bags[b], score: score });\n    }\n    scored.sort(function (x, y) { return y.score - x.score; });\n    return scored.map(function (entry) { return entry.bag; });\n  }\n\n  function readField(bags, name) {\n    for (var i = 0; i < bags.length; i++) {\n      var value = findKey(bags[i], name);\n      if (value !== undefined && value !== null && value !== '') return value;\n    }\n    return undefined;\n  }\n\n  function statusKeyOf(status) {\n    var key = String(status === undefined || status === null ? '' : status).toLowerCase().trim();\n    if (STATUS_META[key]) return key;\n    return '';\n  }\n\n  /* ------------------------------------------------ restaurant scope */\n  /* ONE tool instance = ONE restaurant (D-ROTA-42 / D-ROTA-43).\n     The SYSTEM ADMIN stores the restaurant SLUG on the tool instance; a\n     restaurant user never edits tool parameters, so a board can never be\n     pointed at another restaurant from inside the app. The board stays\n     CLOSED until the slug resolves - there is no default restaurant and no\n     \"first object\" fallback. */\n\n  var RESTAURANT_KEY_FIELDS = ['restaurantId', 'restaurantKey', 'restaurant', 'siteId', 'cmsRestaurantId'];\n  var RESTAURANT_SLUG_FIELDS = ['slug', 'restaurantSlug', 'restaurant_slug', 'storeSlug'];\n\n  function normalizeSlug(value) {\n    return String(value === undefined || value === null ? '' : value).trim().toLowerCase();\n  }\n\n  function restaurantKeyOfValue(value) {\n    if (value === undefined || value === null || value === '') return '';\n    if (typeof value === 'object') {\n      return String(value.id || value._id || value.slug || value.restaurantId || '');\n    }\n    return String(value);\n  }\n\n  /* Slug of a restaurant settings object: the object's own slug first, then\n     the same key inside its data bags (the names restaurant admins use). */\n  function restaurantSlugOf(source) {\n    if (!source || typeof source !== 'object') return '';\n    if (source.slug) return normalizeSlug(source.slug);\n    var bags = collectBags(source);\n    for (var b = 0; b < bags.length; b++) {\n      for (var k = 0; k < RESTAURANT_SLUG_FIELDS.length; k++) {\n        var slug = normalizeSlug(findKey(bags[b], RESTAURANT_SLUG_FIELDS[k]));\n        if (slug) return slug;\n      }\n    }\n    return '';\n  }\n\n  /* Every identifier that can point at ONE restaurant object: its own id and\n     slug, plus the ids an order writer may copy onto an order\n     (restaurantId, restaurantKey, siteId, ...). */\n  function restaurantIdentifiersOf(source) {\n    var identifiers = [];\n    function push(value) {\n      var key = normalizeSlu  = findOrder(orderId);\n    if (!order) return;\n    if (_readOnly || !_canWrite) { notify('You cannot change orders in this view.', 'warning'); return; }\n    if (isBusy(orderId)) return;\n    _acceptFor = orderId;\n    _etaMinutes = 0;\n    renderAcceptModal();\n    var modal = $id('roa-modal');\n    if (modal) modal.hidden = false;\n    var input = $id('roa-eta-min');\n    if (input) input.value = '';\n    updateEtaResult();\n    requestResize();\n  }\n\n  function closeModal() {\n    _acceptFor = '';\n    _etaMinutes = 0;\n    var modal = $id('roa-modal');\n    if (modal) modal.hidden = true;\n  }\n\n  /* Summary shown inside the accept dialog (D-ROTA-39): the customer, the\n     delivery address (or the table / counter), the item count and the\n     internal note, so the order taker sees where it goes before accepting. */\n  function modalSummaryHtml(order) {\n    var customer = order.customer || {};\n    var rows = '';\n\n    var customerText = customer.fullName || customer.name || '';\n    if (customer.phone) customerText += (customerText ? ' \\u00B7 ' : '') + customer.phone;\n    if (customerText) {\n      rows += '<div class=\"roa-modal-row\"><span class=\"roa-modal-k\">Customer<\/span>' +\n        '<span class=\"roa-modal-v\">' + esc(customerText) + '<\/span><\/div>';\n    }\n\n    /* Delivery decides the destination line (D-ROTA-40): the address is\n       shown for delivery orders only, never for pickup / dine-in. */\n    if (order.channelKey === 'delivery') {\n      var addrLines = addressLines(order.address);\n      rows += '<div class=\"roa-modal-row roa-modal-row-block\"><span class=\"roa-modal-k\">Deliver to<\/span>' +\n        '<span class=\"roa-modal-v roa-modal-addr\">' +\n        (addrLines.length ? addrLines.map(esc).join('<br>') : 'Address not provided') +\n        '<\/span><\/div>';\n      var zone = order.deliveryZone;\n      if (zone && (zone.name || zone.id)) {\n        rows += '<div class=\"roa-modal-row\"><span class=\"roa-modal-k\">Zone oseEtaChip(minutes) {\n    _etaMinutes = minutes;\n    var input = $id('roa-eta-min');\n    if (input) input.value = '';\n    var chips = document.querySelectorAll('.roa-eta-chip');\n    for (var i = 0; i < chips.length; i++) {\n      var chip = chips[i];\n      chip.classList.toggle('roa-eta-chip-on', parseInt(chip.getAttribute('data-min') || '0', 10) === minutes);\n    }\n    updateEtaResult();\n  }\n\n  function chooseEtaInput() {\n    var input = $id('roa-eta-min');\n    if (!input) return;\n    var minutes = parseInt(input.value, 10);\n    if (!isFinite(minutes) || minutes < 0) minutes = 0;\n    _etaMinutes = minutes;\n    var chips = document.querySelectorAll('.roa-eta-chip');\n    for (var i = 0; i < chips.length; i++) {\n      chips[i].classList.remove('roa-eta-chip-on');\n    }\n    updateEtaResult();\n  }\n\n  /* ------------------------------------------------------------ actions */\n\n  function callPhone(phone) {\n    var digits = String(phone || '').replace(/[^0-9+]/g, '');\n    if (!digits) return;\n    try {\n      if (typeof tool.openUrl === 'function') { tool.openUrl('tel:' + digits); return; }\n    } catch (err) { /* ignore */ }\n    notify('Phone: ' + phone, 'info');\n  }\n\n  function openInCms(orderId) {\n    var order = findOrder(orderId);\n    if (!order) return;\n    try {\n      if (typeof tool.openObjectDetail === 'function') {\n        tool.openObjectDetail(_cfg.ordersType, order.id);\n        return;\n      }\n    } catch (err) { /* ignore */ }\n    notify('The CMS detail view is not available here.', 'warning');\n  }\n\n  /* ------------------------------------------------------------- print */\n  /* Black-only thermal ticket (D-ROTA-36). The sheet is built into a hidden\n     container and revealed by the print media query, so window.print prints\n     the ticket only - never the board. No colors, no logos, no line prices:\n     a pick ticket for the kitchen and the driver. */\n\n  function ensurePrintRoot() {\n    var host = $id('roa- t-brand\">Kitchen order<\/span>' +\n      '<span class=\"roa-print-num\">' + esc(orderLabelOf(order)) + '<\/span>' +\n      '<\/div>';\n    html += '<div class=\"roa-print-rule\"><\/div>';\n\n    html += '<div class=\"roa-print-meta\">';\n    html += printRowHtml('Record', order.orderNumber || '');\n    html += printRowHtml('Status', meta.label);\n    html += printRowHtml('Type', channel.label);\n    html += printRowHtml('Date', fmtDateOnly(order.placedAt));\n    html += printRowHtml('Placed', fmtTime(order.placedAt));\n    html += printRowHtml('Accepted', order[ACCEPTED_AT_FIELD] ? fmtTime(order[ACCEPTED_AT_FIELD]) : '');\n    html += printRowHtml(order.channelKey === 'delivery' ? 'Deliver by' : 'Ready by',\n      order[ETA_FIELD] ? fmtTime(order[ETA_FIELD]) : '');\n    html += '<\/div>';\n\n    html += '<div class=\"roa-print-rule\"><\/div>';\n    html += '<div class=\"roa-print-items\">';\n    if (!order.lines.length) {\n      html += '<div class=\"roa-print-item\">No line items on this order.<\/div>';\n    } else {\n      for (var i = 0; i < order.lines.length; i++) html += printLineHtml(order.lines[i]);\n    }\n    html += '<\/div>';\n\n    html += '<div class=\"roa-print-rule\"><\/div>';\n    var items = lineCountOf(order);\n    html += '<div class=\"roa-print-total\"><span>' + esc(String(items)) + ' item' + (items === 1 ? '' : 's') + '<\/span>' +\n      '<span>' + esc(fmtMoney(order.totalNum)) + '<\/span><\/div>';\n\n    html += '<div class=\"roa-print-rule\"><\/div>';\n    html += '<div class=\"roa-print-meta\">';\n    html += printRowHtml('Customer', customer.fullName || customer.name || '');\n    html += printRowHtml('Phone', customer.phone || '');\n    if (order.tableNumber) html += printRowHtml('Table', order.tableNumber);\n    var addrLines = addressLines(order.address);\n    if (addrLines.length) {\n      html += '<div><span>Address<\/span><span>' + addrLines.map(esc).join('<br>') + '<\/span><\/div>';\n    }\n    html += printRowHtml('Payment', paymentLabelOf(order.paymentMethod) || '');\n    if (order.internalNote) html += printRowHtml('Note', order.internalNote);\n    html += '<\/div>';\n\n    html += '<div class=\"roa-print-rule\"><\/div>';\n    html += '<div class=\"roa-print-foot\">Printed ' + esc(fmtDateOnly(new Date().toISOString())) + ' ' + esc(fmtTime(new Date().toISOString())) + '<\/div>';\n    html += '<\/div>';\n\n    return html;\n  }\n\n  function printOrder(orderId) {\n    var order = findOrder(orderId || _detailId);\n    if (!order) return;\n    closeDetailMenu();\n    if (_cfg.printMode === 'rawbt') {\n      printViaRawbt(order);\n      return;\n    }\n    printViaDialog(order);\n  }\n\n  function printViaDialog(order) {\n    var host = ensurePrintRoot();\n    if (!host) { notify('Printing is not available in this environment.', 'warning'); return; }\n    host.innerHTML = printSheetHtml(order);\n    try {\n      if (typeof window !== 'undefined' && typeof window.print === 'function') window.print();\n      else notify('Printing is not available in this environment.', 'warning');\n    } catch (err) {\n      notify('Printing failed - open the order in admin and print it there.', 'warning');\n    }\n  }\n\n  /* --------------------------------------------- ESC/POS direct printing */\n  /* A web page cannot skip the print dialog by itself. Anything faster needs\n     a print owner on the device. On an Android tablet that owner can be the\n     RawBT app: it accepts a base64 ESC/POS ticket in the URL, prints it on\n     the printer configured inside the app and never shows a dialog. The URL\n     is opened with tool.openUrl, the only external channel a tool has. */\n\n  var ESC = '\\u001B';\n  var GS = '\\u001D';\n\n  function escPosInit() { return ESC + '@'; }\n  function escPosAlignLeft() { return ESC + 'a' + '\\u0000'; }\n  function escPosAlignCenter() { return ESC + 'a' + '\\u0001'; }\n  function escPosBold(on) { return ESC + 'E' + (on ? '\\u0001' : '\\u0000'); }\n  function escPosDouble(on) { ret
