<!-- build 2026-10-10-1 -->
<div class="rom" id="rom-root">
  <div class="rom-ticket">

    <header class="rom-head">
      <div class="rom-head-main">
        <div class="rom-head-top">
          <span class="rom-channel" id="rom-channel-badge">-</span>
          <span class="rom-order-number" id="rom-order-number">-</span>
        </div>
        <div class="rom-head-sub">
          <span id="rom-placed-at"></span>
          <span class="rom-sep" id="rom-sep-placed">|</span>
          <span class="rom-waiting" id="rom-waiting"></span>
        </div>
      </div>
      <div class="rom-status" id="rom-status-badge">-</div>
    </header>

    <div class="rom-warning" id="rom-warning" style="display:none;">
      <span class="rom-warning-icon">&#9888;</span>
      <span id="rom-warning-text"></span>
    </div>

    <div class="rom-readonly" id="rom-readonly" style="display:none;"></div>

    <div class="rom-empty" id="rom-empty" style="display:none;">
      No order data is attached to this record yet.
    </div>

    <div class="rom-body" id="rom-body">
      <div class="rom-col rom-col-side">
        <section class="rom-block" id="rom-customer"></section>
        <section class="rom-block" id="rom-zone"></section>
        <section class="rom-block" id="rom-schedule"></section>
        <section class="rom-block" id="rom-payment"></section>
      </div>
      <div class="rom-col rom-col-main">
        <section class="rom-block">
          <h3 class="rom-block-title">Order lines</h3>
          <div class="rom-lines" id="rom-lines"></div>
        </section>
        <section class="rom-block">
          <div class="rom-totals" id="rom-totals"></div>
        </section>
        <section class="rom-block">
          <h3 class="rom-block-title">Internal note</h3>
          <textarea class="rom-note" id="rom-note" rows="3" placeholder="Add a note for the kitchen or a colleague (saved on the order record)"></textarea>
          <div class="rom-note-actions">
            <button type="button" class="rom-btn rom-btn-ghost rom-btn-small" id="rom-note-save">Save note</button>
            <span class="rom-note-status" id="rom-note-status"></span>
          </div>
        </section>
      </div>
    </div>

    <section class="rom-actions" id="rom-actions"></section>

    <footer class="rom-foot">
      <span class="rom-build" id="rom-build">tool build</span>
    </footer>

  </div>
</div>
