  <\/div>\r\n        <\/div>\r\n        <div class=\"csj-list\" id=\"csjAddressesList\"><\/div>\r\n      <\/section>\r\n\r\n      <!-- ── Jobs ── -->\r\n      <section class=\"csj-panel\" data-panel=\"jobs\" id=\"csjPanelJobs\" hidden>\r\n        <div class=\"csj-page-head\">\r\n          <div class=\"csj-page-head-text\">\r\n            <div class=\"csj-kicker\">Section 4<\/div>\r\n            <h2 class=\"csj-page-title\">Job descriptions<\/h2>\r\n            <p class=\"csj-page-sub\">Each job holds the full CSJ description, skill development plan, employment terms, supervision, mentorship, recruitment plan and priorities.<\/p>\r\n          <\/div>\r\n          <div class=\"csj-page-actions\">\r\n            <button type=\"button\" class=\"csj-btn csj-btn-primary\" data-act=\"add-job\" id=\"csjBtnAddJob\">Add job<\/button>\r\n          <\/div>\r\n        <\/div>\r\n        <div class=\"csj-strip\" id=\"csjJobsSummary\"><\/div>\r\n        <div class=\"csj-jobs-list\" id=\"csjJobsList\"><\/div>\r\n      <\/section>\r\n\r\n      <!-- ── Documents ── -->\r\n      <section class=\"csj-panel\" data-panel=\"documents\" id=\"csjPanelDocuments\" hidden>\r\n        <div class=\"csj-page-head\">\r\n          <div class=\"csj-page-head-text\">\r\n            <div class=\"csj-kicker\">Section 5<\/div>\r\n            <h2 class=\"csj-page-title\">Documents and conditional requirements<\/h2>\r\n            <p class=\"csj-page-sub\">Upload the files that support the application. Only file names and storage links are stored in the application.<\/p>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-doc-grid\">\r\n          <div class=\"csj-doc-card\" data-cat=\"proofOfBusinessRegistration\">\r\n            <div class=\"csj-doc-head\">\r\n              <div>\r\n                <div class=\"csj-doc-title\">Proof of business registration <span class=\"csj-req\">*<\/span><\/div>\r\n                <div class=\"csj-doc-hint\">Incorporation document or CRA registration.<\/div>\r\n              <\/div>\r\n              <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"upload-doc\" data-cat=\"proofOfBusinessRegistration\">Upload<\/button>\r\n            <\/div>\r\n            <div class=\"csj-doc-files\" id=\"csjDocListProofOfBusinessRegistration\"><\/div>\r\n          <\/div>\r\n          <div class=\"csj-doc-card\" data-cat=\"proofOfAddress\">\r\n            <div class=\"csj-doc-head\">\r\n              <div>\r\n                <div class=\"csj-doc-title\">Proof of address <span class=\"csj-req\">*<\/span><\/div>\r\n                <div class=\"csj-doc-hint\">Bill or bank statement showing the mailing address.<\/div>\r\n              <\/div>\r\n              <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"upload-doc\" data-cat=\"proofOfAddress\">Upload<\/button>\r\n            <\/div>\r\n            <div class=\"csj-doc-files\" id=\"csjDocListProofOfAddress\"><\/div>\r\n          <\/div>\r\n          <div class=\"csj-doc-card\" data-cat=\"voidCheque\">\r\n            <div class=\"csj-doc-head\">\r\n              <div>\r\n                <div class=\"csj-doc-title\">Void cheque or direct deposit form<\/div>\r\n                <div class=\"csj-doc-hint\">Payment information for the grant.<\/div>\r\n              <\/div>\r\n              <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"upload-doc\" data-cat=\"voidCheque\">Upload<\/button>\r\n            <\/div>\r\n            <div class=\"csj-doc-files\" id=\"csjDocListVoidCheque\"><\/div>\r\n          <\/div>\r\n          <div class=\"csj-doc-card\" data-cat=\"healthAndSafetyPolicy\">\r\n            <div class=\"csj-doc-head\">\r\n              <div>\r\n                <div class=\"csj-doc-title\">Health and safety policy <span class=\"csj-req\">*<\/span><\/div>\r\n                <div class=\"csj-doc-hint\">The organization's current health and safety policy.<\/div>\r\n              <\/div>\r\n              <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"upload-doc\" data-cat=\"healthAndSafetyPolicy\">Upload<\/button>\r\n            <\/div>\r\n            <div class=\"csj-doc-files\" id=\"csjDocListHealthAndSafety\"><\/div>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-card\">\r\n          <div class=\"csj-card-head\">\r\n            <div>\r\n              <h3>Hiring and discrimination policies<\/h3>\r\n              <p class=\"csj-card-sub\">Upload every policy the organization has. Hiring and discrimination policies are expected.<\/p>\r\n            <\/div>\r\n            <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"add-policy\">Add policy<\/button>\r\n          <\/div>\r\n          <div class=\"csj-policy-list\" id=\"csjPolicyList\"><\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-two-col\">\r\n          <div class=\"csj-doc-card\" data-cat=\"accessibilityDocuments\">\r\n            <div class=\"csj-doc-head\">\r\n              <div>\r\n                <div class=\"csj-doc-title\">Accessibility documents<\/div>\r\n                <div class=\"csj-doc-hint\">Supporting documents when hiring youth facing barriers.<\/div>\r\n              <\/div>\r\n              <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"upload-doc\" data-cat=\"accessibilityDocuments\">Upload<\/button>\r\n            <\/div>\r\n            <div class=\"csj-doc-files\" id=\"csjDocListAccessibility\"><\/div>\r\n          <\/div>\r\n          <div class=\"csj-doc-card\" data-cat=\"trainingProof\">\r\n            <div class=\"csj-doc-head\">\r\n              <div>\r\n                <div class=\"csj-doc-title\">Proof of required training<\/div>\r\n                <div class=\"csj-doc-hint\">Training schedule, mentorship plan, supervision schedule, safety manual or skills framework.<\/div>\r\n              <\/div>\r\n              <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"upload-doc\" data-cat=\"trainingProof\">Upload<\/button>\r\n            <\/div>\r\n            <div class=\"csj-doc-files\" id=\"csjDocListTrainingProof\"><\/div>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-card\">\r\n          <div class=\"csj-card-head\">\r\n            <div>\r\n              <h3>Accommodation plan explanation<\/h3>\r\n              <p class=\"csj-card-sub\">Explain how the organization will accommodate youth facing barriers.<\/p>\r\n            <\/div>\r\n            <span class=\"csj-save-state\" id=\"csjAccommodationState\">Saved<\/span>\r\n          <\/div>\r\n          <textarea class=\"csj-textarea\" id=\"csjAccommodationPlan\" data-app-field=\"accommodationPlan\" rows=\"5\" maxlength=\"4000\" placeholder=\"Describe the accommodation measures, supports and training that will be in place.\"><\/textarea>\r\n        <\/div>\r\n      <\/section>\r\n\r\n      <!-- ── Review and submit ── -->\r\n      <section class=\"csj-panel\" data-panel=\"review\" id=\"csjPanelReview\" hidden>\r\n        <div class=\"csj-page-head\">\r\n          <div class=\"csj-page-head-text\">\r\n            <div class=\"csj-kicker\">Section 6<\/div>\r\n            <h2 class=\"csj-page-title\">Review and submit<\/h2>\r\n            <p class=\"csj-page-sub\">Resolve the blocking items, then freeze the application and export the package.<\/p>\r\n          <\/div>\r\n          <div class=\"csj-page-actions\">\r\n            <button type=\"button\" class=\"csj-btn csj-btn-quiet\" data-act=\"export-json\" id=\"csjBtnExportJson\">Export JSON<\/button>\r\n            <button type=\"button\" class=\"csj-btn csj-btn-quiet\" data-act=\"export-pdf\" id=\"csjBtnExportPdf\">Export PDF<\/button>\r\n          <\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-review-head\" id=\"csjReviewHead\"><\/div>\r\n        <div class=\"csj-card\">\r\n          <div class=\"csj-card-head\"><h3>Readiness checklist<\/h3><\/div>\r\n          <div id=\"csjReviewList\" class=\"csj-review-groups\"><\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-card\">\r\n          <div class=\"csj-card-head\">\r\n            <div>\r\n              <h3>Status<\/h3>\r\n              <p class=\"csj-card-sub\">Submitted applications are locked. An administrator can reopen them.<\/p>\r\n            <\/div>\r\n            <span class=\"csj-status-pill is-draft\" id=\"csjReviewStatusPill\">Draft<\/span>\r\n          <\/div>\r\n          <div class=\"csj-status-actions\" id=\"csjReviewStatusActions\"><\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-card\">\r\n          <div class=\"csj-card-head\">\r\n            <div>\r\n              <h3>Frozen snapshots<\/h3>\r\n              <p class=\"csj-card-sub\">A snapshot is written on submit. It is a separate document, never inside the live entries.<\/p>\r\n            <\/div>\r\n            <button type=\"button\" class=\"csj-btn csj-btn-sm\" data-act=\"create-snapshot\">Create snapshot<\/button>\r\n          <\/div>\r\n          <div id=\"csjSnapshots\" class=\"csj-snapshot-list\"><\/div>\r\n        <\/div>\r\n\r\n        <div class=\"csj-card\">\r\n          <div class=\"csj-card-head\"><h3>Audit trail<\/h3><\/div>\r\n          <div id=\"csjAuditList\" class=\"csj-activity\"><\/div>\r\n        <\/div>\r\n      <\/section>\r\n\r\n    <\/main>\r\n  <\/div>\r\n\r\n  <!-- ══ Job editor drawer ══ -->\r\n  <div class=\"csj-drawer-overlay\" id=\"csjDrawerOverlay\" hidden><\/div>\r\n  <aside class=\"csj-drawer\" id=\"csjDrawer\" aria-hidden=\"true\" hidden>\r\n    <div class=\"csj-drawer-head\">\r\n      <div class=\"csj-drawer-head-text\">\r\n        <div class=\"csj-drawer-kicker\" id=\"csjDrawerKicker\">Job description<\/div>\r\n        <h2 class=\"csj-drawer-title\" id=\"csjDrawerTitle\">Edit job<\/h2>\r\n        <div class=\"csj-drawer-meta\" id=\"csjDrawerMeta\"><\/div>\r\n      <\/div>\r\n      <button type=\"button\" class=\"csj-icon-btn\" id=\"csjDrawerClose\" aria-label=\"Close job editor\">&times;<\/button>\r\n    <\/div>\r\n    <div class=\"csj-drawer-tabs\" id=\"csjDrawerTabs\" role=\"tablist\">\r\n      <button type=\"button\" class=\"csj-dtab is-active\" data-tab=\"definition\" role=\"tab\">Description<\/button>\r\n      <button type=\"button\" class=\"csj-dtab\" data-tab=\"skills\" role=\"tab\">Skills<\/button>\r\n      <button type=\"button\" class=\"csj-dtab\" data-tab=\"employment\" role=\"tab\">Employment<\/button>\r\n      <button type=\"button\" class=\"csj-dtab\" data-tab=\"supervision\" role=\"tab\">Supervision<\/button>\r\n      <button type=\"button\" class=\"csj-dtab\" data-tab=\"mentorship\" role=\"tab\">Mentorship<\/button>\r\n      <button type=\"button\" class=\"csj-dtab\" data-tab=\"recruitment\" role=\"tab\">Recruitment<\/button>\r\n      <button type=\"button\" class=\"csj-dtab\" data-tab=\"priorities\" role=\"tab\">Priorities<\/button>\r\n    <\/div>\r\n    <div class=\"csj-drawer-remote\" id=\"csjDrawerRemote\" hidden><\/div>\r\n    <div class=\"csj-drawer-body\" id=\"csjDrawerBody\"><\/div>\r\n    <div class=\"csj-drawer-foot\">\r\n      <span class=\"csj-save-state\" id=\"csjDrawerDirty\">No unsaved changes<\/span>\r\n      <div class=\"csj-drawer-foot-actions\">\r\n        <button type=\"button\" class=\"csj-btn csj-btn-quiet\" id=\"csjDrawerCancel\">Close<\/button>\r\n        <button type=\"button\" class=\"csj-btn csj-btn-primary\" id=\"csjDrawerSave\">Save job<\/button>\r\n      <\/div>\r\n    <\/div>\r\n  <\/aside>\r\n\r\n  <!-- ══ Generic modal ══ -->\r\n  <div class=\"csj-modal-overlay\" id=\"csjModalOverlay\" hidden>\r\n    <div class=\"csj-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"csjModalTitle\">\r\n      <div class=\"csj-modal-head\">\r\n        <h3 id=\"csjModalTitle\">Dialog<\/h3>\r\n        <button type=\"button\" class=\"csj-icon-btn\" id=\"csjModalClose\" aria-label=\"Close dialog\">&times;<\/button>\r\n      <\/div>\r\n      <div class=\"csj-modal-body\" id=\"csjModalBody\"><\/div>\r\n      <div class=\"csj-modal-foot\" id=\"csjModalFoot\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n\r\n  <!-- ══ In-app toast ══ -->\r\n  <div class=\"csj-toast\" id=\"csjToast\" hidden><\/div>\r\n<\/div>\r\n"},"css":{"name":"CSJGrantApplication.css","src":"../app/CSJGrantApplication.css","content":"/* css build 2026-11-28-1 */\r\n/* ═══════════════════════════════════════════════════════════\r\n   CSJ Grant Application\r\n   One application per record. Job descriptions and every\r\n   supporting entry are separate CMS documents.\r\n   ═══════════════════════════════════════════════════════════ */\r\n\r\n.csj-app {\r\n  --csj-blue: #1d4ed8;\r\n  --csj-blue-dark: #1e3a8a;\r\n  --csj-blue-soft: #eef2ff;\r\n  --csj-blue-line: #c7d2fe;\r\n  --csj-teal: #0f766e;\r\n  --csj-teal-soft: #ecfdf5;\r\n  --csj-green: #15803d;\r\n  --csj-green-soft: #f0fdf4;\r\n  --csj-amber: #b45309;\r\n  --csj-amber-soft: #fffbeb;\r\n  --csj-red: #b91c1c;\r\n  --csj-red-soft: #fef2f2;\r\n  --csj-ink: #0f172a;\r\n  --csj-text: #1e293b;\r\n  --csj-muted: #64748b;\r\n  --csj-faint: #94a3b8;\r\n  --csj-line: #e2e8f0;\r\n  --csj-line-soft: #eef2f7;\r\n  --csj-bg: #f4f7fb;\r\n  --csj-card: #ffffff;\r\n  --csj-radius: 12px;\r\n  --csj-radius-sm: 8px;\r\n  --csj-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);\r\n  --csj-shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1);\r\n  --csj-shadow-lg: 0 24px 70px rgba(15, 23, 42, 0.24);\r\n\r\n  font-family: \"Segoe UI\", -apple-system, BlinkMacSystemFont, Roboto, \"Helvetica Neue\", Arial, sans-serif;\r\n  font-size: 14px;\r\n  line-height: 1.55;\r\n  color: var(--csj-text);\r\n  background: var(--csj-bg);\r\n  min-height: 100vh;\r\n  -webkit-font-smoothing: antialiased;\r\n}\r\n\r\n.csj-app *,\r\n.csj-app *::before,\r\n.csj-app *::after { box-sizing: border-box; }\r\n\r\n.csj-app h1,\r\n.csj-app h2,\r\n.csj-app h3,\r\n.csj-app h4,\r\n.csj-app p,\r\n.csj-app ul,\r\n.csj-app ol { margin: 0; padding: 0; }\r\n\r\n.csj-app button { font-family: inherit; }\r\n.csj-app [hidden] { display: none !important; }\r\n\r\n/* ── Header ─────────────────────────────────────────────── */\r\n.csj-header {\r\n  position: sticky;\r\n  top: 0;\r\n  z-index: 30;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  padding: 12px 18px;\r\n  background: #fff;\r\n  border-bottom: 1px solid var(--csj-line);\r\n  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);\r\n}\r\n\r\n.csj-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }\r\n\r\n.csj-brand-mark {\r\n  width: 44px;\r\n  height: 44px;\r\n  flex: 0 0 auto;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  border-radius: 12px;\r\n  background: linear-gradient(135deg, #1e3a8a, #1d4ed8 55%, #0f766e);\r\n  color: #fff;\r\n  font-size: 12px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.06em;\r\n  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.28);\r\n}\r\n\r\n.csj-brand-text { min-width: 0; }\r\n.csj-title {\r\n  font-size: 17px;\r\n  font-weight: 800;\r\n  letter-spacing: -0.015em;\r\n  color: var(--csj-ink);\r\n  white-space: nowrap;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n}\r\n.csj-subline {\r\n  display: flex;\r\n  align-items: center;\r\n  flex-wrap: wrap;\r\n  gap: 8px;\r\n  margin-top: 3px;\r\n  font-size: 11.5px;\r\n  color: var(--csj-muted);\r\n}\r\n.csj-sep {\r\n  width: 3px;\r\n  height: 3px;\r\n  border-radius: 50%;\r\n  background: #cbd5e1;\r\n}\r\n.csj-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }\r\n\r\n.csj-build-badge {\r\n  padding: 3px 8px;\r\n  border: 1px solid var(--csj-line);\r\n  border-radius: 6px;\r\n  background: #f8fafc;\r\n  color: var(--csj-muted);\r\n  font-size: 10px;\r\n  font-weight: 700;\r\n  font-family: \"Cascadia Code\", Consolas, monospace;\r\n  white-space: nowrap;\r\n}\r\n.csj-user-chip {\r\n  padding: 4px 10px;\r\n  border: 1px solid var(--csj-blue-line);\r\n  border-radius: 999px;\r\n  background: var(--csj-blue-soft);\r\n  color: var(--csj-blue-dark);\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  white-space: nowrap;\r\n  max-width: 220px;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n}\r\n.csj-user-chip.is-viewer {\r\n  background: #f1f5f9;\r\n  border-color: var(--csj-line);\r\n  color: var(--csj-muted);\r\n}\r\n\r\n.csj-status-pill {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  padding: 2px 9px;\r\n  border-radius: 999px;\r\n  border: 1px solid transparent;\r\n  font-size: 10.5px;\r\n  font-weight: 800;\r\n  letter-spacing: 0.02em;\r\n  white-space: nowrap;\r\n}\r\n.csj-status-pill::before {\r\n  content: \"\";\r\n  width: 6px;\r\n  height: 6px;\r\n  border-radius: 50%;\r\n  background: currentColor;\r\n}\r\n.csj-status-pill.is-draft { background: #f1f5f9; border-color: #e2e8f0; color: #475569; }\r\n.csj-status-pill.is-review { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }\r\n.csj-status-pill.is-ready { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }\r\n.csj-status-pill.is-submitted { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; }\r\n.csj-status-pill.is-approved { background: #f0fdf4; border-color: #86efac; color: #15803d; }\r\n.csj-status-pill.is-declined { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }\r\n\r\n.csj-live-chip {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  padding: 2px 8px;\r\n  border-radius: 999px;\r\n  background: #f8fafc;\r\n  border: 1px solid var(--csj-line);\r\n  color: var(--csj-muted);\r\n  font-size: 10.5px;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n}\r\n.csj-live-chip::before {\r\n  content: \"\";\r\n  width: 6px;\r\n  height: 6px;\r\n  border-radius: 50%;\r\n  background: #22c55e;\r\n}\r\n.csj-live-chip.is-off::before { background: #94a3b8; }\r\n.csj-live-chip.is-error { border-color: #fecaca; background: #fef2f2; color: var(--csj-red); }\r\n.csj-live-chip.is-error::before { background: var(--csj-red); }\r\n\r\n/* ── Buttons ────────────────────────────────────────────── */\r\n.csj-btn {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 6px;\r\n  padding: 8px 14px;\r\n  border: 1px solid var(--csj-line);\r\n  border-radius: 9px;\r\n  background: #fff;\r\n  color: var(--csj-text);\r\n  font-size: 12.5px;\r\n  font-weight: 700;\r\n  line-height: 1.2;\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;\r\n}\r\n.csj-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }\r\n.csj-btn:active:not(:disabled) { transform: translateY(1px); }\r\n.csj-btn:disabled { opacity: 0.5; cursor: not-allowed; }\r\n.csj-btn:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }\r\n\r\n.csj-btn-primary {\r\n  background: linear-gradient(135deg, #1e40af, #1d4ed8);\r\n  border-color: #1d4ed8;\r\n  color: #fff;\r\n  box-shadow: 0 2px 8px rgba(29, 78, 216, 0.24);\r\n}\r\n.csj-btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #1e3a8a, #1e40af); border-color: #1e40af; }\r\n\r\n.csj-btn-quiet { background: #f8fafc; color: #334155; }\r\n.csj-btn-danger { background: #fef2f2; border-color: #fecaca; color: var(--csj-red); }\r\n.csj-btn-danger:hover:not(:disabled) { background: #fee2e2; border-color: #fca5a5; }\r\n\r\n.csj-btn-sm { padding: 5px 10px; font-size: 11.5px; border-radius: 7px; }\r\n.csj-btn-xs { padding: 3px 8px; font-size: 10.5px; border-radius: 6px; }\r\n\r\n.csj-icon-btn {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  width: 32px;\r\n  height: 32px;\r\n  padding: 0;\r\n  border: 1px solid transparent;\r\n  border-radius: 8px;\r\n  background: #f8fafc;\r\n  color: var(--csj-muted);\r\n  font-size: 18px;\r\n  line-height: 1;\r\n  cursor: pointer;\r\n}\r\n.csj-icon-btn:hover { background: var(--csj-blue-soft); border-color: var(--csj-blue-line); color: var(--csj-blue-dark); }\r\n.csj-icon-btn:focu
