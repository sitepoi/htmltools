<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Occupation catalogue - Canada - Occupation Knowledge Hub</title>
<style>
  :root {
    --occ-bg: #f1f5f9;
    --occ-card: #ffffff;
    --occ-ink: #121a2b;
    --occ-soft: #35405a;
    --occ-muted: #5d6a83;
    --occ-faint: #8b95a8;
    --occ-line: #dfe6f1;
    --occ-line-soft: #eef2f8;
    --occ-accent: #1b3a7a;
    --occ-accent-2: #0f766e;
    --occ-accent-soft: #eef3ff;
    --occ-grad: #6d28d9;
    --occ-grad-soft: #f3eeff;
    --occ-bach: #1d4ed8;
    --occ-bach-soft: #eaf0ff;
    --occ-coll: #0f766e;
    --occ-coll-soft: #e7f6f3;
    --occ-appr: #a16207;
    --occ-appr-soft: #fdf6e3;
    --occ-hs: #475569;
    --occ-hs-soft: #eef1f6;
    --occ-none: #6b7280;
    --occ-none-soft: #f3f4f6;
    --occ-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 24px -18px rgba(16, 24, 40, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--occ-bg);
    color: var(--occ-ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    padding: 22px 16px 40px;
  }
  .occ { max-width: 1240px; margin: 0 auto; }
  .occ-head {
    position: relative;
    background: var(--occ-card);
    border: 1px solid var(--occ-line);
    border-radius: 18px;
    box-shadow: var(--occ-shadow);
    padding: 22px 24px;
    overflow: hidden;
  }
  .occ-head::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: linear-gradient(90deg, var(--occ-accent), var(--occ-accent-2));
  }
  .occ-kicker {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--occ-accent-2);
    margin-bottom: 4px;
  }
  .occ h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: -.02em;
  }
  .occ-lede {
    margin: 8px 0 0;
    max-width: 86ch;
    color: var(--occ-muted);
    font-size: 13.5px;
  }
  .occ-head-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .occ-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 13px;
    border-radius: 9px;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .occ-btn-primary { background: var(--occ-accent); border-color: #16326a; color: #fff; }
  .occ-btn-primary:hover { background: #16326a; }
  .occ-btn-ghost { background: var(--occ-card); border-color: var(--occ-line); color: var(--occ-soft); }
  .occ-btn-ghost:hover { border-color: #c3d2ea; color: var(--occ-accent); }

  .occ-stats {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
    margin: 14px 0;
  }
  .occ-stat {
    background: var(--occ-card);
    border: 1px solid var(--occ-line);
    border-radius: 12px;
    padding: 11px 13px;
    box-shadow: var(--occ-shadow);
  }
  .occ-stat strong { display: block; font-size: 20px; letter-spacing: -.02em; }
  .occ-stat span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--occ-faint); font-weight: 700; }
  .occ-stat.is-total strong { color: var(--occ-accent); }
  .occ-stat.is-grad strong { color: var(--occ-grad); }
  .occ-stat.is-bach strong { color: var(--occ-bach); }
  .occ-stat.is-coll strong { color: var(--occ-coll); }
  .occ-stat.is-appr strong { color: var(--occ-appr); }
  .occ-stat.is-entry strong { color: var(--occ-accent-2); }
  .occ-stat.is-video strong { color: #b4232a; }
  .occ-deptline { margin: -4px 0 14px; font-size: 12px; color: var(--occ-faint); }

  .occ-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--occ-card);
    border: 1px solid var(--occ-line);
    border-radius: 14px;
    box-shadow: var(--occ-shadow);
    padding: 11px 13px;
    margin-bottom: 12px;
  }
  .occ-toolbar input[type="search"],
  .occ-toolbar select {
    font-family: inherit;
    font-size: 13px;
    color: var(--occ-ink);
    background: #fbfcfe;
    border: 1px solid var(--occ-line);
    border-radius: 9px;
    padding: 8px 10px;
    outline: none;
  }
  .occ-toolbar input[type="search"] { flex: 1 1 250px; min-width: 180px; }
  .occ-toolbar input:focus, .occ-toolbar select:focus { border-color: #9db3e0; box-shadow: 0 0 0 3px rgba(27, 58, 122, .1); }
  .occ-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .occ-chip {
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--occ-line);
    background: var(--occ-card);
    color: var(--occ-soft);
    cursor: pointer;
  }
  .occ-chip:hover { border-color: #c3d2ea; }
  .occ-chip.is-on { background: var(--occ-accent); border-color: var(--occ-accent); color: #fff; }
  .occ-result { margin-left: auto; font-size: 11.5px; color: var(--occ-faint); white-space: nowrap; }

  .occ-ind {
    background: var(--occ-card);
    border: 1px solid var(--occ-line);
    border-radius: 16px;
    box-shadow: var(--occ-shadow);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .occ-ind-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #f8faff, #f1f6fd);
    border-bottom: 1px solid var(--occ-line);
  }
  .occ-ind-code {
    flex: 0 0 auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--occ-accent);
    background: var(--occ-accent-soft);
    border: 1px solid #dbe5fb;
    border-radius: 7px;
    padding: 3px 7px;
    margin-top: 2px;
  }
  .occ-ind-text { min-width: 0; flex: 1; }
  .occ-ind-name { margin: 0; font-size: 15.5px; letter-spacing: -.01em; }
  .occ-ind-desc { margin: 2px 0 0; font-size: 12.5px; color: var(--occ-muted); }
  .occ-ind-count {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--occ-soft);
    background: var(--occ-card);
    border: 1px solid var(--occ-line);
    border-radius: 999px;
    padding: 3px 10px;
  }

  table.occ-table { width: 100%; border-collapse: collapse; }
  table.occ-table th {
    text-align: left;
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--occ-faint);
    background: #fbfcfe;
    padding: 8px 18px;
    border-bottom: 1px solid var(--occ-line-soft);
    font-weight: 700;
  }
  table.occ-table td {
    padding: 9px 18px;
    border-bottom: 1px solid var(--occ-line-soft);
    vertical-align: top;
    font-size: 13.2px;
    color: var(--occ-soft);
  }
  table.occ-table tr:last-child td { border-bottom: 0; }
  table.occ-table tbody tr:hover td { background: #f9fbff; }
  .occ-name { font-weight: 700; color: var(--occ-ink); }
  .occ-dept { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--occ-faint); }
  .occ-stage {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    border: 1px solid var(--occ-line);
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    vertical-align: middle;
    white-space: nowrap;
  }
  .occ-stage.s-entry { background: #e8f7f1; color: #0f766e; border-color: #c8ebe1; }
  .occ-stage.s-experienced { background: #fff7e6; color: #a16207; border-color: #f0e0b5; }
  .occ-stage.s-leadership { background: #f3eeff; color: #6d28d9; border-color: #e3d7ff; }
  .occ-path { display: block; margin-top: 3px; font-size: 10.5px; font-weight: 500; line-height: 1.35; color: var(--occ-muted); max-width: 56ch; }
  .occ-blurb { color: var(--occ-muted); font-size: 12.6px; }
  .occ-watch {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .03em;
    color: #b4232a;
    text-decoration: none;
    border: 1px solid #eccfd0;
    background: #fdf5f5;
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .occ-watch:hover { border-color: #cf9698; background: #fbe9ea; }
  .occ-watch-none { color: var(--occ-faint); font-size: 11.5px; }
  .occ-res {
    color: var(--occ-accent);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .occ-res:hover { text-decoration: underline; }
  .occ-res-sep { color: var(--occ-faint); margin: 0 3px; }
  .occ-resline { margin: -4px 0 14px; font-size: 11.5px; color: var(--occ-faint); }
  .occ-route {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .occ-route.r-university-graduate { background: var(--occ-grad-soft); color: var(--occ-grad); border-color: #e3d7ff; }
  .occ-route.r-university-bachelor { background: var(--occ-bach-soft); color: var(--occ-bach); border-color: #d5e0fd; }
  .occ-route.r-college { background: var(--occ-coll-soft); color: var(--occ-coll); border-color: #cfeee7; }
  .occ-route.r-apprenticeship { background: var(--occ-appr-soft); color: var(--occ-appr); border-color: #f0e0b5; }
  .occ-route.r-high-school { background: var(--occ-hs-soft); color: var(--occ-hs); border-color: #e2e8f0; }
  .occ-route.r-no-formal { background: var(--occ-none-soft); color: var(--occ-none); border-color: #e5e7eb; }
  .occ-col-route { width: 190px; }

  .occ-empty {
    background: var(--occ-card);
    border: 1px dashed #c8d5ea;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    color: var(--occ-muted);
  }
  .occ-empty h2 { margin: 0 0 6px; color: var(--occ-ink); font-size: 17px; }

  .occ-how {
    background: var(--occ-card);
    border: 1px solid var(--occ-line);
    border-radius: 16px;
    box-shadow: var(--occ-shadow);
    padding: 20px 22px;
    margin-top: 18px;
  }
  .occ-how h2 { margin: 0 0 4px; font-size: 17px; }
  .occ-how p { margin: 0 0 12px; color: var(--occ-muted); font-size: 13px; }
  .occ-how ol { margin: 0 0 14px; padding-left: 20px; }
  .occ-how li { margin: 0 0 7px; font-size: 13.2px; color: var(--occ-soft); }
  .occ-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.6;
    color: #24304a;
    background: #f7f9fd;
    border: 1px solid var(--occ-line);
    border-radius: 10px;
    padding: 12px 14px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .occ-foot {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--occ-faint);
    text-align: center;
    line-height: 1.7;
  }

  @media (max-width: 960px) {
    .occ-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    body { padding: 12px 10px 28px; }
    .occ-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .occ-col-route { width: auto; }
    table.occ-table th:nth-child(2), table.occ-table td:nth-child(2) { display: none; }
    .occ-ind-head { flex-wrap: wrap; }
    .occ-result { margin-left: 0; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .occ-toolbar, .occ-head-actions, .occ-result { display: none !important; }
    .occ-stat, .occ-ind, .occ-head, .occ-how { box-shadow: none; }
    .occ-ind { break-inside: avoid; }
  }
</style>
<style>
  /* Compact full-height catalogue layout */
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .occ {
    max-width: none;
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .occ-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    box-shadow: none;
  }
  .occ-head-title { min-width: 0; }
  .occ-kicker { font-size: 9px; margin-bottom: 1px; }
  .occ h1 { font-size: 16px; }
  .occ-head-actions { margin: 0 0 0 auto; }
  .occ-btn { padding: 5px 10px; font-size: 11.5px; }

  .occ-body {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: 0;
    min-width: 0;
  }
  .occ-side {
    background: var(--occ-card);
    border-right: 1px solid var(--occ-line);
    padding: 12px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .occ-toolbar {
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: 8px;
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
    margin: 0;
  }
  .occ-toolbar input[type="search"],
  .occ-toolbar select {
    width: 100%;
    flex: none;
    min-width: 0;
    padding: 7px 9px;
    font-size: 12.5px;
  }
  .occ-toolbar .occ-chip { width: 100%; }
  .occ-chips { gap: 5px; }
  .occ-chips .occ-chip { font-size: 10.5px; padding: 4px 8px; }
  .occ-result { margin: 0; font-size: 11px; }
  .occ-stage-note { margin: 0; font-size: 10px; line-height: 1.45; color: var(--occ-faint); overflow-wrap: anywhere; }
  .occ-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    margin: 0;
  }
  .occ-stat { padding: 7px 9px; border-radius: 8px; box-shadow: none; }
  .occ-stat strong { font-size: 15px; }
  .occ-stat span { font-size: 8.5px; letter-spacing: .06em; }
  .occ-deptline { margin: 0; font-size: 10.5px; }
  .occ-resline { margin: 0; font-size: 10.5px; line-height: 1.6; overflow-wrap: anywhere; }

  .occ-list {
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    padding: 12px 16px 40px;
  }
  .occ-ind { margin-bottom: 12px; border-radius: 12px; }
  .occ-ind-head { padding: 10px 14px; }
  .occ-ind-name { font-size: 14.5px; }
  .occ-ind-desc { font-size: 11.5px; }
  table.occ-table th { padding: 6px 12px; }
  table.occ-table td { padding: 7px 12px; font-size: 12.4px; }
  .occ-col-route { width: 150px; }
  .occ-blurb { font-size: 12px; }

  @media (max-width: 1200px) {
    .occ-col-res, .occ-col-blurb, .occ-blurb { display: none; }
  }
  @media (max-width: 1000px) {
    body { overflow-x: hidden; overflow-y: auto; }
    .occ { height: auto; min-height: 100vh; }
    .occ-body { grid-template-columns: 1fr; }
    .occ-side {
      border-right: 0;
      border-bottom: 1px solid var(--occ-line);
      overflow: visible;
    }
    .occ-toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .occ-toolbar input[type="search"] { grid-column: 1 / -1; }
    .occ-toolbar .occ-chip { grid-column: 1 / -1; }
    .occ-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .occ-list { overflow: visible; padding: 12px 10px 30px; }
  }
  @media (max-width: 640px) {
    .occ-head { flex-wrap: wrap; align-items: stretch; }
    .occ-head-title, .occ-head-actions { flex: 1 1 100%; }
    .occ-head-actions { margin-left: 0; }
    .occ-toolbar { grid-template-columns: 1fr; }
    .occ-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .occ-col-route { width: auto; }
    table.occ-table th:nth-child(2), table.occ-table td:nth-child(2) { display: none; }
  }
  @media print {
    body { overflow: visible; height: auto; }
    .occ { height: auto; display: block; }
    .occ-body { display: block; }
    .occ-side { display: none; }
    .occ-list { overflow: visible; padding: 0; }
  }
</style>
</head>
<body>
<div class="occ">

  <header class="occ-head">
    <div class="occ-head-title">
      <span class="occ-kicker">Occupation Knowledge Hub</span>
      <h1>Occupation catalogue - Canada</h1>
    </div>
    <div class="occ-head-actions">
      <button type="button" class="occ-btn occ-btn-primary" id="occ-export-json">Export filtered JSON</button>
      <button type="button" class="occ-btn occ-btn-ghost" id="occ-export-csv">Export CSV</button>
      <a class="occ-btn occ-btn-ghost" href="occupations-import.json" download="occupations-import.json" title="Download the complete import package">Full JSON</a>
      <a class="occ-btn occ-btn-ghost" href="ventures.html" title="Open the business and venture catalogue">Venture catalogue</a>
      <a class="occ-btn occ-btn-ghost" href="ssot.html">SSOT</a>
    </div>
  </header>

  <div class="occ-body">
    <aside class="occ-side" aria-label="Catalogue filters">
      <div class="occ-toolbar">
        <input type="search" id="occ-search" placeholder="Search occupations" aria-label="Search occupations">
        <select id="occ-industry" aria-label="Filter by industry"></select>
        <select id="occ-faculty" aria-label="Filter by faculty"></select>
        <select id="occ-department" aria-label="Filter by graduation department"></select>
        <select id="occ-route" aria-label="Filter by education route"></select>
        <select id="occ-stage" aria-label="Filter by career stage" title="Entry: first role after the listed education or training. Experienced: usually requires prior related work experience. Leadership: management, executive or appointment role reached after substantial experience."></select>
        <button type="button" class="occ-chip" id="occ-video-chip">With video only</button>
      </div>
      <p class="occ-stage-note" id="occ-stage-note"></p>
      <div class="occ-chips" id="occ-route-chips" aria-label="Education route shortcuts"></div>
      <span class="occ-result" id="occ-result" role="status" aria-live="polite"></span>
      <section class="occ-stats" id="occ-stats" aria-label="Catalogue totals"></section>
      <p class="occ-deptline" id="occ-deptline" aria-label="Graduation department summary"></p>
      <p class="occ-resline" id="occ-resline" aria-label="Canada-wide career resources"></p>
    </aside>
    <main id="occ-list" class="occ-list"></main>
  </div>
</div>

  function syncChips() {
    var active = currentRoute();
    Array.prototype.forEach.call(chipsElement.querySelectorAll('.occ-chip'), function (chip) {
      chip.classList.toggle('is-on', (chip.getAttribute('data-route') || '') === active);
    });
  }

  chipsElement.addEventListener('click', function (event) {
    var chip = event.target.closest('.occ-chip');
    if (!chip) return;
    routeElement.value = chip.getAttribute('data-route') || '';
    render();
  });

  searchElement.addEventListener('input', render);
  industryElement.addEventListener('change', render);
  facultyElement.addEventListener('change', function () {
    departmentElement.innerHTML = departmentOptionsHtml(facultyElement.value || '');
    departmentElement.value = '';
    render();
  });
  departmentElement.addEventListener('change', render);
  routeElement.addEventListener('change', function () { syncChips(); render(); });
  stageElement.addEventListener('change', render);
  videoChipElement.addEventListener('click', function () {
    videoOnly = !videoOnly;
    videoChipElement.classList.toggle('is-on', videoOnly);
    render();
  });
  document.getElementById('occ-export-json').addEventListener('click', downloadFilteredJson);
  document.getElementById('occ-export-csv').addEventListener('click', downloadFilteredCsv);

  /* ---------------------------------------------------------- render */

  function getMatches() {
    var query = String(searchElement.value || '').trim().toLowerCase();
    var industry = industryElement.value || '';
    var faculty = facultyElement.value || '';
    var department = departmentElement.value || '';
    var route = currentRoute();
    var stage = stageElement.value || '';
    return occupations.filter(function (occupation) {
      if (industry && occupation.industry !== industry) return false;
      if (faculty && (!occupation.department || occupation.department.faculty !== faculty)) return false;
      if (department && (!occupation.department || occupation.department.slug !== department)) return false;
      if (route && occupation.education !== route) return false;
      if (stage && occupation.careerStage !== stage) return false;
      if (videoOnly && !occupation.videos.length) return false;
      if (!query) return true;
      var videoTitles = occupation.videos.map(function (video) { return video.title; }).join(' ');
      var departmentText = occupation.department ? occupation.department.label + ' ' + occupation.department.facultyLabel : '';
      var stageText = (STAGE_LABELS[occupation.careerStage] || '') + ' ' + (occupation.careerPath || '');
      return (occupation.name + ' ' + occupation.blurb + ' ' + departmentText + ' ' + stageText + ' ' + videoTitles).toLowerCase().indexOf(query) !== -1;
    });
  }

  function render() {
    var matches = getMatches();
    currentMatches = matches;
    var stage = stageElement.value || '';
    var parts = [matches.length + ' of ' + occupations.length + ' occupations'];
    if (stage) parts.push(STAGE_LABELS[stage] || stage);
    if (videoOnly) parts.push('with video');
    resultElement.textContent = parts.join(' · ');

    if (!matches.length) {
      listElement.innerHTML = '<div class="occ-empty"><h2>No occupation matches</h2><p>Clear the search or choose another industry, faculty, department, education route or career stage.</p></div>';
      return;
    }

    var byIndustry = {};
    matches.forEach(function (occupation) {
      (byIndustry[occupation.industry] = byIndustry[occupation.industry] || []).push(occupation);
    });

    var html = '';
    data.folders.forEach(function (folder) {
      var list = byIndustry[folder.slug];
      if (!list || !list.length) return;
      list.sort(function (first, second) { return first.name.localeCompare(second.name); });
      html += industrySection(folder, list);
    });
    listElement.innerHTML = html;
  }

  function industrySection(folder, list) {
    var html = '<section class="occ-ind" id="industry-' + escapeHtml(folder.slug) + '">' +
      '<header class="occ-ind-head">' +
      '<span class="occ-ind-code">' + escapeHtml(folder.code) + '</span>' +
      '<div class="occ-ind-text"><h2 class="occ-ind-name">' + escapeHtml(folder.name) + '</h2>' +
      '<p class="occ-ind-desc">' + escapeHtml(folder.description || '') + '</p></div>' +
      '<span class="occ-ind-count">' + list.length + (list.length === 1 ? ' occupation' : ' occupations') + '</span>' +
      '</header>' +
      '<table class="occ-table"><thead><tr><th>Occupation</th><th class="occ-col-route">Education route</th><th class="occ-col-video">Watch</th><th class="occ-col-res">Resources</th><th class="occ-col-blurb">What it is</th></tr></thead><tbody>';
    list.forEach(function (occupation) {
      html += '<tr>' +
        '<td class="occ-name">' + escapeHtml(occupation.name) +
          '<span class="occ-stage s-' + escapeHtml(occupation.careerStage) + '" title="' +
          escapeHtml((STAGE_DESCRIPTIONS[occupation.careerStage] || '') + (occupation.careerPath ? ' ' + occupation.careerPath : '')) + '">' +
          escapeHtml(STAGE_SHORT[occupation.careerStage] || occupation.careerStage) + '</span>' +
          (occupation.department ? '<span class="occ-dept">' + escapeHtml(occupation.department.label) + '</span>' : '') +
          (occupation.careerPath ? '<span class="occ-path">' + escapeHtml(occupation.careerPath) + '</span>' : '') +
        '</td>' +
        '<td><span class="occ-route r-' + escapeHtml(occupation.education) + '" title="' + escapeHtml(ROUTE_LABELS[occupation.education] || '') + '">' +
        escapeHtml(ROUTE_SHORT[occupation.education] || occupation.education) + '</span></td>' +
        '<td class="occ-col-video">' + watchCell(occupation) + '</td>' +
        '<td class="occ-col-res">' + resourcesCell(occupation) + '</td>' +
        '<td class="occ-blurb">' + escapeHtml(occupation.blurb) + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></section>';
    return html;
  }

  function watchCell(occupation) {
    if (!occupation.videos.length) return '<span class="occ-watch-none">-</span>';
    return occupation.videos.map(function (video, index) {
      var label = occupation.videos.length > 1 ? 'Watch ' + (index + 1) : 'Watch';
      return '<a class="occ-watch" href="' + escapeHtml(video.url) + '" target="_blank" rel="noopener" title="' +
        escapeHtml(video.title + (video.source ? ' - ' + video.source : '')) + '">' + label + '</a>';
    }).join(' ');
  }

  function resourcesCell(occupation) {
    var parts = [];
    if (JOB_SEARCH_TEMPLATE) {
      parts.push('<a class="occ-res" href="' + escapeHtml(JOB_SEARCH_TEMPLATE.replace('{query}', encodeURIComponent(occupation.name))) +
        '" target="_blank" rel="noopener" title="Job Bank job search">Jobs</a>');
    }
    ['NOC', 'WorkBC'].forEach(function (short) {
      var link = RESOURCE_LINKS.filter(function (item) { return item.short === short; })[0];
      if (link) {
        parts.push('<a class="occ-res" href="' + escapeHtml(link.url) + '" target="_blank" rel="noopener" title="' +
          escapeHtml(link.label) + '">' + escapeHtml(link.short) + '</a>');
      }
    });
    return parts.join('<span class="occ-res-sep"> · </span>');
  }

  function exportFilters() {
    var query = String(searchElement.value || '').trim();
    var industry = industryElement.value || '';
    var faculty = facultyElement.value || '';
    var department = departmentElement.value || '';
    var route = currentRoute();
    var stage = stageElement.value || '';
    return {
      search: query,
      industry: industry,
      industryLabel: industry && folderBySlug[industry] ? folderBySlug[industry].name : '',
      faculty: faculty,
      facultyLabel: faculty ? (FACULTY_LABELS[faculty] || faculty) : '',
      department: department,
      departmentLabel: department ? (DEPARTMENT_BY_SLUG[department] ? DEPARTMENT_BY_SLUG[department].label : department) : '',
      educationRoute: route,
      educationRouteLabel: route ? (ROUTE_LABELS[route] || route) : '',
      careerStage: stage,
      careerStageLabel: stage ? (STAGE_LABELS[stage] || stage) : '',
      videoOnly: videoOnly
    };
  }

  function exportRows() {
    return currentMatches.map(function (occupation) {
      return {
        name: occupation.name,
        slug: occupation.slug,
        industry: occupation.industry,
        industryLabel: folderBySlug[occupation.industry] ? folderBySlug[occupation.industry].name : occupation.industry,
        education: occupation.education,
        educationLabel: ROUTE_LABELS[occupation.education] || occupation.education,
        careerStage: occupation.careerStage,
        careerStageLabel: STAGE_LABELS[occupation.careerStage] || occupation.careerStage,
        careerPath: occupation.careerPath,
        department: occupation.department ? occupation.department.label : '',
        faculty: occupation.department ? occupation.department.facultyLabel : '',
        blurb: occupation.blurb,
        videos: occupation.videos.map(function (video) {
          return { title: video.title, url: video.url, source: video.source };
        })
      };
    });
  }

  function downloadBlob(content, mimeType, fileName) {
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function downloadFilteredJson() {
    if (!currentMatches.length) {
      resultElement.textContent = 'No occupations to export.';
      return;
    }
    var payload = {
      exportedAt: new Date().toISOString(),
      filters: exportFilters(),
      count: currentMatches.length,
      careerStages: CAREER_STAGES,
      objects: exportRows()
    };
    downloadBlob(JSON.stringify(payload, null, 2), 'application/json;charset=utf-8', 'occupations-filtered.json');
  }

  function csvCell(value) {
    var text = String(value === undefined || value === null ? '' : value);
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function downloadFilteredCsv() {
    if (!currentMatches.length) {
      resultElement.textContent = 'No occupations to export.';
      return;
    }
    var rows = [['Occupation', 'Slug', 'Industry', 'Education route', 'Career stage', 'Career path', 'Department', 'Faculty', 'What it is', 'Video URLs']];
    currentMatches.forEach(function (occupation) {
      rows.push([
        occupation.name,
        occupation.slug,
        folderBySlug[occupation.industry] ? folderBySlug[occupation.industry].name : occupation.industry,
        ROUTE_LABELS[occupation.education] || occupation.education,
        STAGE_LABELS[occupation.careerStage] || occupation.careerStage,
        occupation.careerPath,
        occupation.department ? occupation.department.label : '',
        occupation.department ? occupation.department.facultyLabel : '',
        occupation.blurb,
        occupation.videos.map(function (video) { return video.url; }).join(' | ')
      ]);
    });
    var csv = '\ufeff' + rows.map(function (row) { return row.map(csvCell).join(','); }).join('\r\n');
    downloadBlob(csv, 'text/csv;charset=utf-8', 'occupations-filtered.csv');
  }

  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  syncChips();
  render();
})();
</script>
</body>
</html>
