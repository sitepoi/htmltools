<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business and venture catalogue - Entrepreneur Knowledge Hub</title>
<style>
  :root {
    --ven-bg: #f1f5f9;
    --ven-card: #ffffff;
    --ven-ink: #121a2b;
    --ven-soft: #35405a;
    --ven-muted: #5d6a83;
    --ven-faint: #8b95a8;
    --ven-line: #dfe6f1;
    --ven-line-soft: #eef2f8;
    --ven-accent: #1b3a7a;
    --ven-accent-2: #0f766e;
    --ven-accent-soft: #eef3ff;
    --ven-grad: #6d28d9;
    --ven-grad-soft: #f3eeff;
    --ven-bach: #1d4ed8;
    --ven-bach-soft: #eaf0ff;
    --ven-coll: #0f766e;
    --ven-coll-soft: #e7f6f3;
    --ven-appr: #a16207;
    --ven-appr-soft: #fdf6e3;
    --ven-hs: #475569;
    --ven-hs-soft: #eef1f6;
    --ven-none: #6b7280;
    --ven-none-soft: #f3f4f6;
    --ven-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 24px -18px rgba(16, 24, 40, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ven-bg);
    color: var(--ven-ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    padding: 22px 16px 40px;
  }
  .ven { max-width: 1240px; margin: 0 auto; }
  .ven-head {
    position: relative;
    background: var(--ven-card);
    border: 1px solid var(--ven-line);
    border-radius: 18px;
    box-shadow: var(--ven-shadow);
    padding: 22px 24px;
    overflow: hidden;
  }
  .ven-head::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: linear-gradient(90deg, var(--ven-accent), var(--ven-accent-2));
  }
  .ven-kicker {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ven-accent-2);
    margin-bottom: 4px;
  }
  .ven h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: -.02em;
  }
  .ven-lede {
    margin: 8px 0 0;
    max-width: 86ch;
    color: var(--ven-muted);
    font-size: 13.5px;
  }
  .ven-head-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .ven-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 13px;
    border-radius: 9px;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .ven-btn-primary { background: var(--ven-accent); border-color: #16326a; color: #fff; }
  .ven-btn-primary:hover { background: #16326a; }
  .ven-btn-ghost { background: var(--ven-card); border-color: var(--ven-line); color: var(--ven-soft); }
  .ven-btn-ghost:hover { border-color: #c3d2ea; color: var(--ven-accent); }

  .ven-stats {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
    margin: 14px 0;
  }
  .ven-stat {
    background: var(--ven-card);
    border: 1px solid var(--ven-line);
    border-radius: 12px;
    padding: 11px 13px;
    box-shadow: var(--ven-shadow);
  }
  .ven-stat strong { display: block; font-size: 20px; letter-spacing: -.02em; }
  .ven-stat span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ven-faint); font-weight: 700; }
  .ven-stat.is-total strong { color: var(--ven-accent); }
  .ven-stat.is-grad strong { color: var(--ven-grad); }
  .ven-stat.is-bach strong { color: var(--ven-bach); }
  .ven-stat.is-coll strong { color: var(--ven-coll); }
  .ven-stat.is-appr strong { color: var(--ven-appr); }
  .ven-stat.is-entry strong { color: var(--ven-accent-2); }
  .ven-stat.is-video strong { color: #b4232a; }
  .ven-deptline { margin: -4px 0 14px; font-size: 12px; color: var(--ven-faint); }

  .ven-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--ven-card);
    border: 1px solid var(--ven-line);
    border-radius: 14px;
    box-shadow: var(--ven-shadow);
    padding: 11px 13px;
    margin-bottom: 12px;
  }
  .ven-toolbar input[type="search"],
  .ven-toolbar select {
    font-family: inherit;
    font-size: 13px;
    color: var(--ven-ink);
    background: #fbfcfe;
    border: 1px solid var(--ven-line);
    border-radius: 9px;
    padding: 8px 10px;
    outline: none;
  }
  .ven-toolbar input[type="search"] { flex: 1 1 250px; min-width: 180px; }
  .ven-toolbar input:focus, .ven-toolbar select:focus { border-color: #9db3e0; box-shadow: 0 0 0 3px rgba(27, 58, 122, .1); }
  .ven-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ven-chip {
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--ven-line);
    background: var(--ven-card);
    color: var(--ven-soft);
    cursor: pointer;
  }
  .ven-chip:hover { border-color: #c3d2ea; }
  .ven-chip.is-on { background: var(--ven-accent); border-color: var(--ven-accent); color: #fff; }
  .ven-result { margin-left: auto; font-size: 11.5px; color: var(--ven-faint); white-space: nowrap; }

  .ven-ind {
    background: var(--ven-card);
    border: 1px solid var(--ven-line);
    border-radius: 16px;
    box-shadow: var(--ven-shadow);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .ven-ind-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #f8faff, #f1f6fd);
    border-bottom: 1px solid var(--ven-line);
  }
  .ven-ind-code {
    flex: 0 0 auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ven-accent);
    background: var(--ven-accent-soft);
    border: 1px solid #dbe5fb;
    border-radius: 7px;
    padding: 3px 7px;
    margin-top: 2px;
  }
  .ven-ind-text { min-width: 0; flex: 1; }
  .ven-ind-name { margin: 0; font-size: 15.5px; letter-spacing: -.01em; }
  .ven-ind-desc { margin: 2px 0 0; font-size: 12.5px; color: var(--ven-muted); }
  .ven-ind-count {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--ven-soft);
    background: var(--ven-card);
    border: 1px solid var(--ven-line);
    border-radius: 999px;
    padding: 3px 10px;
  }

  table.ven-table { width: 100%; border-collapse: collapse; }
  table.ven-table th {
    text-align: left;
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ven-faint);
    background: #fbfcfe;
    padding: 8px 18px;
    border-bottom: 1px solid var(--ven-line-soft);
    font-weight: 700;
  }
  table.ven-table td {
    padding: 9px 18px;
    border-bottom: 1px solid var(--ven-line-soft);
    vertical-align: top;
    font-size: 13.2px;
    color: var(--ven-soft);
  }
  table.ven-table tr:last-child td { border-bottom: 0; }
  table.ven-table tbody tr:hover td { background: #f9fbff; }
  .ven-name { font-weight: 700; color: var(--ven-ink); }
  .ven-dept { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--ven-faint); }
  .ven-stage {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    border: 1px solid var(--ven-line);
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    vertical-align: middle;
    white-space: nowrap;
  }
  .ven-stage.s-entry { background: #e8f7f1; color: #0f766e; border-color: #c8ebe1; }
  .ven-stage.s-experienced { background: #fff7e6; color: #a16207; border-color: #f0e0b5; }
  .ven-stage.s-leadership { background: #f3eeff; color: #6d28d9; border-color: #e3d7ff; }
  .ven-path { display: block; margin-top: 3px; font-size: 10.5px; font-weight: 500; line-height: 1.35; color: var(--ven-muted); max-width: 56ch; }
  .ven-blurb { color: var(--ven-muted); font-size: 12.6px; }
  .ven-watch {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .03em;
    color: #b4232a;
    text-decoration: none;
    border: 1px solid #eccfd0;
    background: #fdf5f5;
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .ven-watch:hover { border-color: #cf9698; background: #fbe9ea; }
  .ven-watch-none { color: var(--ven-faint); font-size: 11.5px; }
  .ven-res {
    color: var(--ven-accent);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .ven-res:hover { text-decoration: underline; }
  .ven-res-sep { color: var(--ven-faint); margin: 0 3px; }
  .ven-resline { margin: -4px 0 14px; font-size: 11.5px; color: var(--ven-faint); }
  .ven-route {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .ven-route.r-university-graduate { background: var(--ven-grad-soft); color: var(--ven-grad); border-color: #e3d7ff; }
  .ven-route.r-university-bachelor { background: var(--ven-bach-soft); color: var(--ven-bach); border-color: #d5e0fd; }
  .ven-route.r-college { background: var(--ven-coll-soft); color: var(--ven-coll); border-color: #cfeee7; }
  .ven-route.r-apprenticeship { background: var(--ven-appr-soft); color: var(--ven-appr); border-color: #f0e0b5; }
  .ven-route.r-high-school { background: var(--ven-hs-soft); color: var(--ven-hs); border-color: #e2e8f0; }
  .ven-route.r-no-formal { background: var(--ven-none-soft); color: var(--ven-none); border-color: #e5e7eb; }
  .ven-col-route { width: 190px; }

  .ven-empty {
    background: var(--ven-card);
    border: 1px dashed #c8d5ea;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    color: var(--ven-muted);
  }
  .ven-empty h2 { margin: 0 0 6px; color: var(--ven-ink); font-size: 17px; }

  .ven-how {
    background: var(--ven-card);
    border: 1px solid var(--ven-line);
    border-radius: 16px;
    box-shadow: var(--ven-shadow);
    padding: 20px 22px;
    margin-top: 18px;
  }
  .ven-how h2 { margin: 0 0 4px; font-size: 17px; }
  .ven-how p { margin: 0 0 12px; color: var(--ven-muted); font-size: 13px; }
  .ven-how ol { margin: 0 0 14px; padding-left: 20px; }
  .ven-how li { margin: 0 0 7px; font-size: 13.2px; color: var(--ven-soft); }
  .ven-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.6;
    color: #24304a;
    background: #f7f9fd;
    border: 1px solid var(--ven-line);
    border-radius: 10px;
    padding: 12px 14px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .ven-foot {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--ven-faint);
    text-align: center;
    line-height: 1.7;
  }

  @media (max-width: 960px) {
    .ven-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    body { padding: 12px 10px 28px; }
    .ven-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ven-col-route { width: auto; }
    table.ven-table th:nth-child(2), table.ven-table td:nth-child(2) { display: none; }
    .ven-ind-head { flex-wrap: wrap; }
    .ven-result { margin-left: 0; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .ven-toolbar, .ven-head-actions, .ven-result { display: none !important; }
    .ven-stat, .ven-ind, .ven-head, .ven-how { box-shadow: none; }
    .ven-ind { break-inside: avoid; }
  }
</style>
<style>
  /* Compact full-height catalogue layout */
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .ven {
    max-width: none;
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .ven-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    box-shadow: none;
  }
  .ven-head-title { min-width: 0; }
  .ven-kicker { font-size: 9px; margin-bottom: 1px; }
  .ven h1 { font-size: 16px; }
  .ven-head-actions { margin: 0 0 0 auto; }
  .ven-btn { padding: 5px 10px; font-size: 11.5px; }

  .ven-body {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: 0;
    min-width: 0;
  }
  .ven-side {
    background: var(--ven-card);
    border-right: 1px solid var(--ven-line);
    padding: 12px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ven-toolbar {
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: 8px;
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
    margin: 0;
  }
  .ven-toolbar input[type="search"],
  .ven-toolbar select {
    width: 100%;
    flex: none;
    min-width: 0;
    padding: 7px 9px;
    font-size: 12.5px;
  }
  .ven-toolbar .ven-chip { width: 100%; }
  .ven-chips { gap: 5px; }
  .ven-chips .ven-chip { font-size: 10.5px; padding: 4px 8px; }
  .ven-result { margin: 0; font-size: 11px; }
  .ven-stage-note { margin: 0; font-size: 10px; line-height: 1.45; color: var(--ven-faint); overflow-wrap: anywhere; }
  .ven-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    margin: 0;
  }
  .ven-stat { padding: 7px 9px; border-radius: 8px; box-shadow: none; }
  .ven-stat strong { font-size: 15px; }
  .ven-stat span { font-size: 8.5px; letter-spacing: .06em; }
  .ven-deptline { margin: 0; font-size: 10.5px; }
  .ven-resline { margin: 0; font-size: 10.5px; line-height: 1.6; overflow-wrap: anywhere; }

  .ven-list {
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    padding: 12px 16px 40px;
  }
  .ven-ind { margin-bottom: 12px; border-radius: 12px; }
  .ven-ind-head { padding: 10px 14px; }
  .ven-ind-name { font-size: 14.5px; }
  .ven-ind-desc { font-size: 11.5px; }
  table.ven-table th { padding: 6px 12px; }
  table.ven-table td { padding: 7px 12px; font-size: 12.4px; }
  .ven-col-route { width: 150px; }
  .ven-blurb { font-size: 12px; }

  @media (max-width: 1200px) {
    .ven-col-res, .ven-col-blurb, .ven-blurb { display: none; }
  }
  @media (max-width: 1000px) {
    body { overflow-x: hidden; overflow-y: auto; }
    .ven { height: auto; min-height: 100vh; }
    .ven-body { grid-template-columns: 1fr; }
    .ven-side {
      border-right: 0;
      border-bottom: 1px solid var(--ven-line);
      overflow: visible;
    }
    .ven-toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .ven-toolbar input[type="search"] { grid-column: 1 / -1; }
    .ven-toolbar .ven-chip { grid-column: 1 / -1; }
    .ven-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .ven-list { overflow: visible; padding: 12px 10px 30px; }
  }
  @media (max-width: 640px) {
    .ven-head { flex-wrap: wrap; align-items: stretch; }
    .ven-head-title, .ven-head-actions { flex: 1 1 100%; }
    .ven-head-actions { margin-left: 0; }
    .ven-toolbar { grid-template-columns: 1fr; }
    .ven-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ven-col-route { width: auto; }
    table.ven-table th:nth-child(2), table.ven-table td:nth-child(2) { display: none; }
  }
  @media print {
    body { overflow: visible; height: auto; }
    .ven { height: auto; display: block; }
    .ven-body { display: block; }
    .ven-side { display: none; }
    .ven-list { overflow: visible; padding: 0; }
  }
</style>
<style>
  .ven-col-capital { width: 132px; }
  .ven-col-model { width: 168px; }
  .ven-col-barrier { width: 116px; }
  .ven-col-rev { width: 118px; }
  .ven-cap {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid #dbe5fb;
    background: var(--ven-accent-soft);
    color: var(--ven-accent);
    white-space: nowrap;
  }
  .ven-cap.c-over-100b { background: #fdecec; border-color: #f5c2c2; color: #b4232a; }
  .ven-cap.c-1b-100b { background: #fdf2e3; border-color: #f3d6a4; color: #92400e; }
  .ven-cap.c-100m-1b { background: #fef7e6; border-color: #f2ddad; color: #8a5a05; }
  .ven-model, .ven-barrier { display: inline-block; font-size: 11.5px; color: var(--ven-soft); }
  .ven-barrier.b-licence, .ven-barrier.b-industrial, .ven-barrier.b-state { color: #92400e; font-weight: 600; }
  .ven-barrier.b-state { color: #b4232a; }
  .ven-rev { font-size: 11.5px; color: var(--ven-muted); }
  .ven-scale {
    display: inline-block;
    margin-left: 6px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 999px;
    background: #eef1f6;
    color: var(--ven-hs);
    vertical-align: 2px;
  }
  .ven-reality {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    line-height: 1.45;
    color: #9a3412;
    background: #fff7ed;
    border-left: 3px solid #fb923c;
    border-radius: 0 6px 6px 0;
    padding: 3px 8px;
    max-width: 74ch;
  }
  .ven-reality strong { font-weight: 700; }
  .ven-note { margin: 0; font-size: 10.5px; line-height: 1.5; color: var(--ven-faint); }
  .ven-chip.is-on { background: var(--ven-accent-2); border-color: var(--ven-accent-2); color: #fff; }
  .ven-empty {
    background: var(--ven-card);
    border: 1px solid var(--ven-line);
    border-radius: 14px;
    padding: 22px 24px;
    box-shadow: var(--ven-shadow);
  }
  .ven-empty h2 { margin: 0 0 6px; font-size: 16px; }
  .ven-empty p { margin: 0; color: var(--ven-muted); font-size: 13px; }
  @media (max-width: 1420px) {
    .ven-col-model { display: none; }
  }
  @media (max-width: 1240px) {
    .ven-col-barrier, .ven-col-rev { display: none; }
  }
  @media (max-width: 1200px) {
    .ven-blurb, .ven-col-blurb { display: table-cell; }
  }
  @media (max-width: 1100px) {
    .ven-col-capital { width: auto; }
  }
  @media (max-width: 640px) {
    .ven-col-capital { display: none; }
  }
</style>
</head>
<body>
<div class="ven">

  <header class="ven-head">
    <div class="ven-head-title">
      <span class="ven-kicker">Entrepreneur Knowledge Hub</span>
      <h1>Business and venture catalogue</h1>
    </div>
    <div class="ven-head-actions">
      <button type="button" class="ven-btn ven-btn-primary" id="ven-export-json">Export filtered JSON</button>
      <button type="button" class="ven-btn ven-btn-ghost" id="ven-export-csv">Export CSV</button>
      <a class="ven-btn ven-btn-ghost" href="ventures-import.json" download="ventures-import.json" title="Download the complete import package">Full JSON</a>
      <a class="ven-btn ven-btn-ghost" href="occupations.html" title="Open the occupation catalogue">Occupation catalogue</a>
      <a class="ven-btn ven-btn-ghost" href="ssot.html">SSOT</a>
    </div>
  </header>

  <div class="ven-body">
    <aside class="ven-side" aria-label="Catalogue filters">
      <div class="ven-toolbar">

roup and solo walks sold as recurring weekly packages.",""],["Pet sitting service","pet-animal","under-1k","service","none","local","days","In-home visits and overnight care while owners travel.",""],["Dog grooming salon","pet-animal","10k-50k","service","licence","local","weeks","Bathing, clipping and styling from a fitted salon or a mobile van.",""],["Dog training business","pet-animal","1k-10k","service","skill","regional","weeks","Puppy classes, obedience and behaviour work sold in packages.",""],["Pet daycare and boarding","pet-animal","250k-1m","service","licence","regional","months","Supervised daytime care and overnight stays with runs and staff.",""],["Mobile veterinary practice","pet-animal","50k-250k","regulated","licence","regional","months","A fitted vehicle brings exams, vaccines and basic care to clients.",""],["Pet food brand","pet-animal","10k-50k","manufacturing","licence","national","months","Formulates and packages food with contract manufacturers and sells direct.",""],["Aquarium maintenance service","pet-animal","1k-10k","service","skill","local","weeks","Cleans, stocks and services home and office aquariums on a schedule.",""],["Pet photography business","pet-animal","under-1k","service","skill","regional","days","Studio and outdoor pet portraits sold as prints and digital files.",""],["Pet transport service","pet-animal","1k-10k","service","licence","regional","weeks","Moves pets between homes, airports and vets with safe crating.",""],["Dog breeding kennel","pet-animal","10k-50k","product","licence","regional","months","Breeds and raises a specific breed under animal welfare rules.",""],["Pet waste removal service","pet-animal","under-1k","service","none","local","days","Recurring yard clean-up for dog owners on a weekly route.",""],["Animal rescue and adoption operation","pet-animal","10k-50k","service","licence","regional","months","Fosters, treats and rehomes animals, funded by donations and fees.",""],["Equine boarding stable","pet-animal","250k-1m","service","licence","regional","months","Stalls, pasture, feed and care sold as monthly boarding.",""],["Satellite manufacturing company","frontier-space","10m-100m","manufacturing","industrial","global","years","Builds spacecraft buses and payloads for operators and governments.",""],["Earth observation data service","frontier-space","10m-100m","infrastructure","industrial","global","years","Sells imagery and analysis of the planet to industry and agencies.",""],["Small orbital launch company","frontier-space","1b-100b","manufacturing","industrial","global","years","Develops a rocket, launch site and customers for small satellites.","Rocket Lab needed more than a decade and over a billion dollars to reach orbit regularly."],["Satellite internet constellation","frontier-space","1b-100b","infrastructure","industrial","global","years","Hundreds of satellites, ground stations, spectrum and user terminals.","Spectrum filings, launch capacity and terminal subsidies make this a capital-markets project."],["Private space station","frontier-space","1b-100b","infrastructure","industrial","global","years","Habitat modules, launch contracts and life-support certification.","Certification and rescue planning are government-grade problems."],["Space tourism operator","frontier-space","1b-100b","infrastructure","industrial","global","years","Vehicles, training, medical screening and a licensed launch operation.","Insurance and licensing are as hard as the vehicle itself."],["Lunar landing and services company","frontier-space","1b-100b","infrastructure","industrial","global","years","Landers, payload integration and contracts with space agencies.","Revenue depends on agency contracts awarded years in advance."],["Industrial robotics company","frontier-space","1m-10m","manufacturing","capital","global","years","Sells automation cells and the software that runs them.",""],["Humanoid robotics company","frontier-space","100m-1b","manufacturing","capital","global","years","Actuators, perception, control software and manufacturing partnerships.","Every unit is a hardware and safety problem; the field is still pre-scale."],["Drone manufacturer","frontier-space","1m-10m","manufacturing","licence","global","months","Builds and certifies drones for inspection, mapping and delivery.",""],["Quantum computing company","frontier-space","100m-1b","digital","industrial","global","years","Hardware, error correction and cloud access to a quantum machine.","Error correction at useful scale has not been demonstrated; expect patient science capital."],["AI foundation model lab","frontier-space","1b-100b","digital","industrial","global","years","Compute clusters, research teams and training runs at frontier scale.","Training runs at the frontier cost hundreds of millions per cycle."],["Semiconductor chip design company (fabless)","frontier-space","10m-100m","digital","capital","global","years","Designs chips and outsources fabrication to a foundry.",""],["Gene therapy company","frontier-space","100m-1b","manufacturing","licence","global","years","Preclinical work, trials and manufacturing for a genetic treatment.","A single programme can take a decade and several hundred million dollars to reach approval."],["Neural interface company","frontier-space","100m-1b","manufacturing","industrial","global","years","Implants, surgical robotics and clinical evidence over many years.","Regulators treat implants as high-risk devices; clinical evidence takes years to collect."],["Synthetic biology company","frontier-space","10m-100m","manufacturing","licence","global","years","Engineers organisms or enzymes and scales them into production.",""],["Global software platform at Microsoft scale","public-scale","over-100b","digital","state","global","years","Operating systems, productivity suites and cloud sold to most of the world's organisations.","Requires a product ecosystem, a developer base and decades of capital. Nobody starts here; companies arrive here."],["Global search engine at Google scale","public-scale","over-100b","digital","state","global","years","An index of the entire web plus the advertising system that funds it.","Search is a data and capital war. The workable entry is vertical search inside one industry."],["Global social network at Meta scale","public-scale","over-100b","digital","state","global","years","Billions of users, moderation at scale and an advertising machine.","Network effects protect the incumbent. A niche community is the realistic entry."],["Smartphone ecosystem at Apple scale","public-scale","over-100b","manufacturing","state","global","years","Hardware, an operating system, an app store and a services business.","Requires chip design, manufacturing partners and a developer ecosystem measured in millions."],["Rocket and constellation at SpaceX scale","public-scale","over-100b","manufacturing","state","global","years","Reusable launch, a satellite constellation and a launch site.","Reusability took SpaceX two decades and repeated failures. Small launch is the realistic entry."],["Automaker at Toyota scale","public-scale","over-100b","manufacturing","state","global","years","Global factories, supplier networks, dealers and model lines.","Toyota-scale production is a national industrial project with decades of supplier development."],["Aircraft manufacturer at Boeing scale","public-scale","over-100b","manufacturing","state","global","years","Certificated airframes, engine partnerships and a decades-long order book.","Certification alone takes years. A realistic entry is parts, interiors or drones."],["Semiconductor foundry at TSMC scale","public-scale","over-100b","manufacturing","state","global","years","Leading-edge fabs, water and power contracts, and process know-how.","Each generation costs more than the last. Fabless chip design is the accessible route."],["Oil major at Exxon scale","public-scale","over-100b","infrastructure","state","global","years","Reserves, upstream, refining, chemicals and a global trading desk.","Requires sovereign-scale reserves and a century of accumulated assets."],["Global bank at JPMorgan scale","public-scale","over-100b","regulated","state","global","years","Balance sheet, capital ratios, regulators in every market and technology.","Banking licences are granted per country against capital that no individual can raise."],["Pharmaceutical major at Pfizer scale","public-scale","over-100b","manufacturing","state","global","years","A pipeline, trials, regulatory approvals and a global sales force.","A single approved drug can cost a billion. A portfolio at this scale is a public company."],["Global shipping line at Maersk scale","public-scale","over-100b","infrastructure","state","global","years","Vessels, container fleets, terminals and route networks.","Asset heavy and cyclical. A niche trade lane is the realistic entry."],["Global cloud provider at AWS scale","public-scale","over-100b","infrastructure","state","global","years","Data centres in dozens of regions with custom hardware and networking.","Built on a decade of capital spending and an existing enterprise customer base."],["National electricity grid","public-scale","over-100b","infrastructure","state","national","years","Transmission lines, substations, control rooms and regulators.","Owned or regulated by governments; a private developer can only build one project on the edge."],["National health system","public-scale","over-100b","infrastructure","state","national","years","Hospitals, clinics, staff and funding across a whole country.","A state function. Private operators sell services into it, not replace it."],["National university system","public-scale","over-100b","infrastructure","state","national","years","Campuses, faculties, research funding and accreditation across a country.","Requires endowment, land and accreditation built over generations."],["New planned city","public-scale","over-100b","infrastructure","state","regional","years","Land, roads, water, power, housing and decades of construction.","Only governments and sovereign funds attempt this; the record of private attempts is poor."],["Metro rail system","public-scale","1b-100b","infrastructure","state","regional","years","Tunnels, stations, rolling stock and a public procurement process.","A public procurement, not a startup. Suppliers to the project are the investable layer."],["International airport","public-scale","1b-100b","infrastructure","state","regional","years","Runways, terminals, navigation systems and airline agreements.","Land, noise studies and airline commitments make this a government project."],["Container port","public-scale","1b-100b","infrastructure","state","regional","years","Berths, cranes, dredging and rail connections.","Granted by a port authority on waterfront that is almost never privately available."],["National defense contractor at Lockheed scale","public-scale","over-100b","manufacturing","state","global","years","Classified programmes, cleared staff and multi-decade government contracts.","Entry is as a supplier or a services subcontractor, not as a prime."],["Global telecom carrier at national scale","public-scale","over-100b","infrastructure","state","national","years","Spectrum, towers, fibre and a national regulatory licence.","Spectrum auctions and national licences are awarded through public processes."]]}</script>

<script>
(function () {
  'use strict';

  var dataElement = document.getElementById('venture-catalog-data');
  if (!dataElement) return;
  var data;
  try { data = JSON.parse(dataElement.textContent); } catch (error) { return; }

  function indexById(list) {
    var map = {};
    list.forEach(function (item) { map[item.id] = item; });
    return map;
  }
  var BAND_BY_ID = indexById(data.capitalBands);
  var MODEL_BY_ID = indexById(data.models);
  var BARRIER_BY_ID = indexById(data.barriers);
  var SCALE_BY_ID = indexById(data.scales);
  var REVENUE_BY_ID = indexById(data.firstRevenue);
  var familyBySlug = {};
  data.folders.forEach(function (family) { familyBySlug[family.slug] = family; });

  var ventures = data.objects.map(function (row) {
    return {
      name: row[0],
      family: row[1],
      capital: row[2],
      model: row[3],
      barrier: row[4],
      scale: row[5],
      firstRevenue: row[6],
      blurb: row[7],
      reality: row[8] || ''
    };
  });

  /* ---------------------------------------------------------- summary */

  var familyCounts = {};
  ventures.forEach(function (venture) { familyCounts[venture.family] = (familyCounts[venture.family] || 0) + 1; });

  function countBand(ids) {
    return ventures.filter(function (venture) { return ids.indexOf(venture.capital) !== -1; }).length;
  }
  function countModel(ids) {
    return ventures.filter(function (venture) { return ids.indexOf(venture.model) !== -1; }).length;
  }

  var statsElement = document.getElementById('ven-stats');
  statsElement.innerHTML =
    statCard('is-total', ventures.length, 'Venture types') +
    statCard('is-entry', countBand(['under-1k', '1k-10k']), 'Under $10K') +
    statCard('is-coll', countBand(['under-1k', '1k-10k', '10k-50k', '50k-250k']), 'Under $250K') +
    statCard('is-bach', countBand(['1m-10m', '10m-100m', '100m-1b', '1b-100b', 'over-100b']), '$1M and up') +
    statCard('is-video', countBand(['over-100b']), 'Impossible today') +
    statCard('is-appr', ventures.filter(function (venture) { return venture.barrier === 'licence'; }).length, 'Needs a licence') +
    statCard('is-grad', countModel(['ecommerce', 'digital', 'content', 'marketplace']), 'Online first');

  function statCard(className, value, label) {
    return '<div class="ven-stat ' + className + '"><strong>' + value + '</strong><span>' + escapeHtml(label) + '</span></div>';
  }

  var familyLine = document.getElementById('ven-deptline');
  if (familyLine) familyLine.textContent = data.folders.length + ' venture families · ' + data.capitalBands.length + ' capital bands';

  var reslineElement = document.getElementById('ven-resline');
  if (reslineElement) {
    reslineElement.textContent = 'Bands run from under $1K to $100B and up. A band is the money needed to open, not to dominate the market.';
  }

  /* ---------------------------------------------------------- filters */

  var searchElement = document.getElementById('ven-search');
  var familyElement = document.getElementById('ven-family');
  var capitalElement = document.getElementById('ven-capital');
  var modelElement = document.getElementById('ven-model');
  var barrierElement = document.getElementById('ven-barrier');
  var scaleElement = document.getElementById('ven-scale');
  var quickChipsElement = document.getElementById('ven-quick-chips');
  var listElement = document.getElementById('ven-list');
  var resultElement = document.getElementById('ven-result');
  var currentMatches = [];
  var quickFilters = { under10k: false, noLicence: false, impossible: false, online: false };

  var familyOptions = '<option value="">All venture families (' + data.folders.length + ')</option>';
  data.folders.forEach(function (family) {
    familyOptions += '<option value="' + escapeHtml(family.slug) + '">' + escapeHtml(family.name) + ' (' + (familyCounts[family.slug] || 0) + ')</option>';
  });
  familyElement.innerHTML = familyOptions;

  var capitalOptions = '<option value="">All capital bands (' + ventures.length + ')</option>';
  data.capitalBands.forEach(function (band) {
    capitalOptions += '<option value="' + escapeHtml(band.id) + '">' + escapeHtml(band.short) + ' (' + countBand([band.id]) + ')</option>';
  });
  capitalElement.innerHTML = capitalOptions;

  var modelOptions = '<option value="">All business models</option>';
  data.models.forEach(function (model) {
    modelOptions += '<option value="' + escapeHtml(model.id) + '">' + escapeHtml(model.label) + ' (' + countModel([model.id]) + ')</option>';
  });
  modelElement.innerHTML = modelOptions;

  var barrierOptions = '<option value="">Any barrier</option>';
  data.barriers.forEach(function (barrier) {
    barrierOptions += '<option value="' + escapeHtml(barrier.id) + '">' + escapeHtml(barrier.label) + ' (' + ventures.filter(function (venture) { return venture.barrier === barrier.id; }).length + ')</option>';
  });
  barrierElement.innerHTML = barrierOptions;

  var scaleOptions = '<option value="">Any reach</option>';
  data.scales.forEach(function (scale) {
    scaleOptions += '<option value="' + escapeHtml(scale.id) + '">' + escapeHtml(scale.label) + ' (' + ventures.filter(function (venture) { return venture.scale === scale.id; }).length + ')</option>';
  });
  scaleElement.innerHTML = scaleOptions;

  var QUICK_FILTERS = [
    { id: 'under10k', label: 'Under $10K' },
    { id: 'noLicence', label: 'No licence needed' },
    { id: 'impossible', label: 'Impossible today' },
    { id: 'online', label: 'Online first' }
  ];
  quickChipsElement.innerHTML = QUICK_FILTERS.map(function (filter) {
    return '<button type="button" class="ven-chip" data-quick="' + filter.id + '">' + escapeHtml(filter.label) + '</button>';
  }).join('');

  quickChipsElement.addEventListener('click', function (event) {
    var chip = event.target.closest('.ven-chip');
    if (!chip) return;
    var id = chip.getAttribute('data-quick');
    quickFilters[id] = !quickFilters[id];
    chip.classList.toggle('is-on', quickFilters[id]);
    render();
  });

  searchElement.addEventListener('input', render);
  familyElement.addEventListener('change', render);
  capitalElement.addEventListener('change', render);
  modelElement.addEventListener('change', render);
  barrierElement.addEventListener('change', render);
  scaleElement.addEventListener('change', render);
  document.getElementById('ven-export-json').addEventListener('click', downloadFilteredJson);
  document.getElementById('ven-export-csv').addEventListener('click', downloadFilteredCsv);

  /* ---------------------------------------------------------- render */

  function getMatches() {
    var query = String(searchElement.value || '').trim().toLowerCase();
    var family = familyElement.value || '';
    var capital = capitalElement.value || '';
    var model = modelElement.value || '';
    var barrier = barrierElement.value || '';
    var scale = scaleElement.value || '';
    return ventures.filter(function (venture) {
      if (family && venture.family !== family) return false;
      if (capital && venture.capital !== capital) return false;
      if (model && venture.model !== model) return false;
      if (barrier && venture.barrier !== barrier) return false;
      if (scale && venture.scale !== scale) return false;
      if (quickFilters.under10k && ['under-1k', '1k-10k'].indexOf(venture.capital) === -1) return false;
      if (quickFilters.noLicence && (venture.barrier === 'licence' || venture.barrier === 'state')) return false;
      if (quickFilters.impossible && venture.capital !== 'over-100b') return false;
      if (quickFilters.online && ['ecommerce', 'digital', 'content', 'marketplace'].indexOf(venture.model) === -1) return false;
      if (!query) return true;
      var familyName = familyBySlug[venture.family] ? familyBySlug[venture.family].name : '';
      var modelLabel = MODEL_BY_ID[venture.model] ? MODEL_BY_ID[venture.model].label : '';
      var barrierLabel = BARRIER_BY_ID[venture.barrier] ? BARRIER_BY_ID[venture.barrier].label : '';
      var scaleLabel = SCALE_BY_ID[venture.scale] ? SCALE_BY_ID[venture.scale].label : '';
      var text = venture.name + ' ' + venture.blurb + ' ' + venture.reality + ' ' + familyName + ' ' + modelLabel + ' ' + barrierLabel + ' ' + scaleLabel;
      return text.toLowerCase().indexOf(query) !== -1;
    });
  }

  function render() {
    var matches = getMatches();
    currentMatches = matches;

    var parts = [matches.length + ' of ' + ventures.length + ' venture types'];
    if (quickFilters.under10k) parts.push('under $10K');
    if (quickFilters.noLicence) parts.push('no licence');
    if (quickFilters.impossible) parts.push('impossible today');
    if (quickFilters.online) parts.push('online first');
    resultElement.textContent = parts.join(' · ');

    if (!matches.length) {
      listElement.innerHTML = '<div class="ven-empty"><h2>No venture matches</h2><p>Clear the search or choose another family, capital band, business model, barrier or reach.</p></div>';
      return;
    }

    var byFamily = {};
    matches.forEach(function (venture) {
      (byFamily[venture.family] = byFamily[venture.family] || []).push(venture);
    });

    var html = '';
    data.folders.forEach(function (family) {
      var list = byFamily[family.slug];
      if (!list || !list.length) return;
      list.sort(function (first, second) { return first.name.localeCompare(second.name); });
      html += familySection(family, list);
    });
    listElement.innerHTML = html;
  }

  function familySection(family, list) {
    var html = '<section class="ven-ind" id="family-' + escapeHtml(family.slug) + '">' +
      '<header class="ven-ind-head">' +
      '<span class="ven-ind-code">' + escapeHtml(family.code) + '</span>' +
      '<div class="ven-ind-text"><h2 class="ven-ind-name">' + escapeHtml(family.name) + '</h2>' +
      '<p class="ven-ind-desc">' + escapeHtml(family.description || '') + '</p></div>' +
      '<span class="ven-ind-count">' + list.length + (list.length === 1 ? ' venture' : ' ventures') + '</span>' +
      '</header>' +
      '<table class="ven-table"><thead><tr><th>Venture</th><th class="ven-col-capital">Capital to start</th><th class="ven-col-model">Model</th><th class="ven-col-barrier">Barrier</th><th class="ven-col-rev">First revenue</th><th class="ven-col-blurb">What it is</th></tr></thead><tbody>';
    list.forEach(function (venture) {
      var band = BAND_BY_ID[venture.capital] || { short: venture.capital };
      var model = MODEL_BY_ID[venture.model] || { label: venture.model };
      var barrier = BARRIER_BY_ID[venture.barrier] || { short: venture.barrier, label: venture.barrier, note: '' };
      var scale = SCALE_BY_ID[venture.scale] || { short: venture.scale, note: '' };
      var revenue = REVENUE_BY_ID[venture.firstRevenue] || { short: venture.firstRevenue, note: '' };
      html += '<tr>' +
        '<td class="ven-name">' + escapeHtml(venture.name) +
          '<span class="ven-scale" title="' + escapeHtml(scale.note) + '">' + escapeHtml(scale.short) + '</span>' +
          (venture.reality ? '<span class="ven-reality"><strong>Reality check:</strong> ' + escapeHtml(venture.reality) + '</span>' : '') +
        '</td>' +
        '<td class="ven-col-capital"><span class="ven-cap c-' + escapeHtml(venture.capital) + '" title="' + escapeHtml(band.note) + '">' + escapeHtml(band.short) + '</span></td>' +
        '<td class="ven-col-model"><span class="ven-model">' + escapeHtml(model.label) + '</span></td>' +
        '<td class="ven-col-barrier"><span class="ven-barrier b-' + escapeHtml(venture.barrier) + '" title="' + escapeHtml(barrier.note) + '">' + escapeHtml(barrier.short) + '</span></td>' +
        '<td class="ven-col-rev"><span class="ven-rev" title="' + escapeHtml(revenue.note) + '">' + escapeHtml(revenue.short) + '</span></td>' +
        '<td class="ven-blurb">' + escapeHtml(venture.blurb) + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></section>';
    return html;
  }

  function exportFilters() {
    var filters = {
      search: String(searchElement.value || '').trim(),
      family: familyElement.value || '',
      familyLabel: familyElement.value && familyBySlug[familyElement.value] ? familyBySlug[familyElement.value].name : '',
      capital: capitalElement.value || '',
      capitalLabel: capitalElement.value && BAND_BY_ID[capitalElement.value] ? BAND_BY_ID[capitalElement.value].label : '',
      model: modelElement.value || '',
      modelLabel: modelElement.value && MODEL_BY_ID[modelElement.value] ? MODEL_BY_ID[modelElement.value].label : '',
      barrier: barrierElement.value || '',
      barrierLabel: barrierElement.value && BARRIER_BY_ID[barrierElement.value] ? BARRIER_BY_ID[barrierElement.value].label : '',
      scale: scaleElement.value || '',
      scaleLabel: scaleElement.value && SCALE_BY_ID[scaleElement.value] ? SCALE_BY_ID[scaleElement.value].label : ''
    };
    QUICK_FILTERS.forEach(function (filter) { filters[filter.id] = quickFilters[filter.id]; });
    return filters;
  }

  function exportRows() {
    return currentMatches.map(function (venture) {
      return {
        name: venture.name,
        family: venture.family,
        familyLabel: familyBySlug[venture.family] ? familyBySlug[venture.family].name : venture.family,
        capital: venture.capital,
        capitalLabel: BAND_BY_ID[venture.capital] ? BAND_BY_ID[venture.capital].label : venture.capital,
        model: venture.model,
        modelLabel: MODEL_BY_ID[venture.model] ? MODEL_BY_ID[venture.model].label : venture.model,
        barrier: venture.barrier,
        barrierLabel: BARRIER_BY_ID[venture.barrier] ? BARRIER_BY_ID[venture.barrier].label : venture.barrier,
        scale: venture.scale,
        scaleLabel: SCALE_BY_ID[venture.scale] ? SCALE_BY_ID[venture.scale].label : venture.scale,
        firstRevenue: venture.firstRevenue,
        firstRevenueLabel: REVENUE_BY_ID[venture.firstRevenue] ? REVENUE_BY_ID[venture.firstRevenue].label : venture.firstRevenue,
        blurb: venture.blurb,
        reality: venture.reality
      };
    });
  }

  function downloadBlob(content, mimeType, fileName) {
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function downloadFilteredJson() {
    if (!currentMatches.length) {
      resultElement.textContent = 'No ventures to export.';
      return;
    }
    var payload = {
      exportedAt: new Date().toISOString(),
      filters: exportFilters(),
      count: currentMatches.length,
      capitalBands: data.capitalBands,
      models: data.models,
      barriers: data.barriers,
      scales: data.scales,
      firstRevenue: data.firstRevenue,
      objects: exportRows()
    };
    downloadBlob(JSON.stringify(payload, null, 2), 'application/json;charset=utf-8', 'ventures-filtered.json');
  }

  function csvCell(value) {
    var text = String(value === undefined || value === null ? '' : value);
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function downloadFilteredCsv() {
    if (!currentMatches.length) {
      resultElement.textContent = 'No ventures to export.';
      return;
    }
    var rows = [['Venture', 'Family', 'Capital to start', 'Business model', 'Barrier', 'Reach', 'First revenue', 'What it is', 'Reality check']];
    currentMatches.forEach(function (venture) {
      rows.push([
        venture.name,
        familyBySlug[venture.family] ? familyBySlug[venture.family].name : venture.family,
        BAND_BY_ID[venture.capital] ? BAND_BY_ID[venture.capital].label : venture.capital,
        MODEL_BY_ID[venture.model] ? MODEL_BY_ID[venture.model].label : venture.model,
        BARRIER_BY_ID[venture.barrier] ? BARRIER_BY_ID[venture.barrier].label : venture.barrier,
        SCALE_BY_ID[venture.scale] ? SCALE_BY_ID[venture.scale].label : venture.scale,
        REVENUE_BY_ID[venture.firstRevenue] ? REVENUE_BY_ID[venture.firstRevenue].label : venture.firstRevenue,
        venture.blurb,
        venture.reality
      ]);
    });
    var csv = '\ufeff' + rows.map(function (row) { return row.map(csvCell).join(','); }).join('\r\n');
    downloadBlob(csv, 'text/csv;charset=utf-8', 'ventures-filtered.csv');
  }

  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  if (window.location && window.location.search) {
    var params = new URLSearchParams(window.location.search);
    var wantedFamily = params.get('family');
    var wantedQuery = params.get('q');
    if (wantedFamily && familyBySlug[wantedFamily]) familyElement.value = wantedFamily;
    if (wantedQuery) searchElement.value = wantedQuery;
  }

  render();
})();
</script>
</body>
</html>
