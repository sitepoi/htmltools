/* ===================================================================
   Mock window.tool SDK
   - value  -> localStorage (the dossier of this record)
   - objects -> localStorage (question board + chat sessions)
   - AI     -> canned answers routed by prompt markers
   Query params: ?sample=1&role=editor&ro=1&tab=questions&crud=no&noai=1
   =================================================================== */
(function () {
  var VALUE_KEY = 'okh_test_value';
  var OBJECTS_KEY = 'okh_test_objects';
  var ROLE_KEY = 'okh_test_role';
  var RO_KEY = 'okh_test_ro';

  var ROLES = ['admin', 'editor', 'viewer', 'none'];
  var params = {};
  window.location.search.replace(/^\?/, '').split('&').forEach(function (pair) {
    if (!pair) return;
    var bits = pair.split('=');
    params[decodeURIComponent(bits[0])] = decodeURIComponent(bits[1] || '');
  });

  function status(message) {
    var element = document.getElementById('th-status');
    if (element) element.textContent = message;
  }

  function readJson(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (err) { return fallback; }
  }

  function writeJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (err) { status('localStorage write failed'); }
  }

  function loadObjects() { return readJson(OBJECTS_KEY, []); }
  function saveObjects(list) { writeJson(OBJECTS_KEY, list); }

  var currentRole = localStorage.getItem(ROLE_KEY) || 'admin';
  if (params.role && ROLES.indexOf(params.role) !== -1) {
    currentRole = params.role;
    localStorage.setItem(ROLE_KEY, currentRole);
  }
  var readOnly = localStorage.getItem(RO_KEY) === '1';
  if (params.ro === '1') { readOnly = true; localStorage.setItem(RO_KEY, '1'); }
  if (params.ro === '0') { readOnly = false; localStorage.setItem(RO_KEY, '0'); }

  function currentUser() {
    if (currentRole === 'none') return null;
    var user = {
      id: 'user-' + currentRole,
      name: currentRole.charAt(0).toUpperCase() + currentRole.slice(1) + ' User',
      email: currentRole + '@example.com',
      roles: [currentRole],
      locale: 'en'
    };
    if (currentRole === 'admin') user.effectiveAccess = { isViewer: true, isEditor: true, isManager: true };
    if (currentRole === 'editor') user.effectiveAccess = { isViewer: true, isEditor: true, isManager: false };
    if (currentRole === 'viewer') user.effectiveAccess = { isViewer: true, isEditor: false, isManager: false };
    return user;
  }

        skills: 'Clinical judgment | It decides what you notice and what you do first. | Practise scenarios and ask why a nurse chose one action over another.\nCommunication | You explain hard things to scared people. | Practise plain language and take every chance to explain a procedure.\nDocumentation | Clear records protect the patient and you. | Write complete notes during clinical placements and get feedback.\nTeamwork | Care is handed over several times a day. | Learn a structured handover format and use it every time.\nResilience | The work is emotionally heavy. | Build routines outside work and use the support your employer offers.',

        salary: 'Pay is set by province and by collective agreement, so it is very different across the country.\n\nAs a rough planning range, a new hospital RN in Canada earns about CAD 70,000 to 85,000 per year, and an experienced RN at the top of the scale earns about CAD 95,000 to 120,000 before overtime and premiums. Night, weekend and specialty premiums add to that.\n\nThese are estimates for planning only. Check the current collective agreement in the province where you want to work.',
        jobMarket: 'Demand is strong and is expected to stay strong because the population is aging and many nurses are retiring. Hospitals, long-term care and community care all report shortages, and rural areas have the most open positions.\n\nHiring is not the hard part: getting into a nursing program and passing the licensing exam are. A second language, a specialty certification or willingness to work in a rural community improves a candidate.',
        careerLadder: 'New graduate | Staff nurse | 0 to 2 years\nExperienced RN | Charge nurse or preceptor | 3 to 6 years\nSpecialty | Emergency, intensive care, pediatrics, public health | 5 to 10 years\nAdvanced | Nurse educator, clinical manager, nurse practitioner (extra degree) | 8 years or more',
        tools: 'Electronic health record | Charting, medication orders and results\nIV pumps and monitors | Delivering medication and watching vital signs\nPatient lifting equipment | Safe movement of patients\nMedication dispensing systems | Controlled storage and tracking of drugs',
        relatedOccupations: 'Licensed practical nurse | Shorter diploma, closely related bedside work\nParamedic | Emergency care outside the hospital\nNurse practitioner | RN role with advanced prescribing authority\nHealth care assistant | Entry level support work in long-term care',
        glossary: 'NCLEX-RN | The licensing exam every Canadian RN must pass.\nRPN | Registered practical nurse, a college-level licence with a narrower scope.\nPreceptor | An experienced nurse who supervises a student on placement.\nScope of practice | What a licence legally allows you to do.',
        faq: 'Q: How long does it take to become an RN?\nA: Four years for a BScN, plus the licensing exam. A second degree can shorten it.\n\nQ: Can I study nursing in college?\nA: Colleges offer practical nursing, which leads to the RPN licence. Some offer a bridge to the RN degree.\n\nQ: Is nursing only hospital work?\nA: No. Public health, community care, long-term care, schools and clinics all employ RNs.\n\nQ: Do I need to speak French?\nA: Not in most provinces. In Quebec, French is required for most nursing jobs.',

  function seedSample() {
    writeJson(VALUE_KEY, sampleContent());
    saveObjects(sampleQuestions());

  if (params.reset === '1') {
    localStorage.removeItem(VALUE_KEY);
    localStorage.removeItem(OBJECTS_KEY);
  }

  /* --------------------------------------------------------- mock SDK */

  function objectsOfType(type) {
    return loadObjects().filter(function (record) { return !type || record.cmsObjectType === type; });
  }

  function nowIso() { return new Date().toISOString(); }

  window.tool = {
    getValue: function () { return readJson(VALUE_KEY, null); },
    setValue: function (value) { writeJson(VALUE_KEY, value); },

    reportValid: function () {},

    notify: function (message, severity) {

      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:18px;right:18px;z-index:99999;background:' + (colors[severity] || '#333') +
        ';color:#fff;padding:9px 16px;border-radius:8px;font-family:inherit;font-size:12px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:420px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3200);
      status(severity + ': ' + message);
    },

    requestObjects: function (action, request, callback) {
      setTimeout(function () {
        var list = loadObjects();
        if (action === 'query') {
          callback(null, { objects: objectsOfType(request.mainObjectType) });
          return;
        }
        if (action === 'get') {
          var found = null;
          list.forEach(function (record) { if (record.id === request.objectId) found = record; });
          callback(null, { object: found });
          return;
        }
        if (action === 'create') {
          var created = {
            id: 'obj-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            name: request.name || 'Object',
            cmsObjectType: request.mainObjectType,
            productData: { data_categoriesBased: request.productData ? (request.productData.data_categoriesBased || {}) : {} },
            created: nowIso(),
            updated: nowIso()
          };
          list.push(created);
          saveObjects(list);
          callback(null, { object: created });
          return;
        }
        if (action === 'update') {
          var target = null;
          list.forEach(function (record) { if (record.id === request.objectId) target = record; });
          if (!target) { callback('object not found', null); return; }
          target.productData = target.productData || {};
          target.productData.data_categoriesBased = target.productData.data_categoriesBased || {};
          var patch = request.productData && request.productData.data_categoriesBased ? request.productData.data_categoriesBased : {};
          Object.keys(patch).forEach(function (key) {
            var incoming = patch[key];
            var existing = target.productData.data_categoriesBased[key];
            var bothObjects = incoming && typeof incoming === 'object' && !Array.isArray(incoming) &&
              existing && typeof existing === 'object' && !Array.isArray(existing);
            if (bothObjects) {
              Object.keys(incoming).forEach(function (innerKey) { existing[innerKey] = incoming[innerKey]; });
              return;
            }
            target.productData.data_categoriesBased[key] = incoming;
          });
          if (request.name) target.name = request.name;
          target.updated = nowIso();
          saveObjects(list);
          callback(null, { ok: true });
          return;
        }
        if (action === 'delete') {
          saveObjects(list.filter(function (record) { return record.id !== request.objectId; }));
          callback(null, { ok: true });
          return;
        }
        if (action === 'batch') {
          callback('batch is not mocked', null);
          return;
        }
        callback('unknown action ' + action, null);
      }, 40);
    },

    onReady: function (callback) { callback(window.tool.getValue(), window.tool.getFields()); },

    _setRole: function (role) {
      localStorage.setItem(ROLE_KEY, role);
      window.location.reload();
    },
    _dump: function () {
      console.log('[harness] value', readJson(VALUE_KEY, null));
      console.log('[harness] objects', loadObjects());
      status('Dumped value + objects to console');
    }
  };

  var roleButton = document.getElementById('th-role');
  if (roleButton) roleButton.textContent = 'Role: ' + currentRole;
  var roButton = document.getElementById('th-ro');
  if (roButton) {
    roButton.textContent = 'RO: ' + (readOnly ? 'ON' : 'OFF');
    if (readOnly) roButton.classList.add('on');
  }

  document.getElementById('th-sample').addEventListener('click', function () {
    seedSample();
    window.location.reload();
  });
  document.getElementById('th-reset').addEventListener('click', function () {
    localStorage.removeItem(VALUE_KEY);
    localStorage.removeItem(OBJECTS_KEY);
    window.location.reload();
  });
  document.getElementById('th-dump').addEventListener('click', function () { window.tool._dump(); });
  document.getElementById('th-role').addEventListener('click', function () {
    var nextIndex = (ROLES.indexOf(localStorage.getItem(ROLE_KEY) || 'admin') + 1) % ROLES.length;
    window.tool._setRole(ROLES[nextIndex]);
  });
  document.getElementById('th-ro').addEventListener('click', function () {
    localStorage.setItem(RO_KEY, readOnly ? '0' : '1');
    window.location.reload();
  });

  ['overview', 'study', 'ask', 'questions', 'edit'].forEach(function (tabId) {
    var button = document.getElementById('th-tab-' + tabId);
    if (!button) return;
    button.addEventListener('click', function () {
      var tab = document.querySelector('[data-act="tab"][data-tab="' + tabId + '"]');
      if (tab) tab.click();
    });
  });
})();
</script>
