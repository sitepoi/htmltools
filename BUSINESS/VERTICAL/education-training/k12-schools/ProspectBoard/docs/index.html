<script type="application/json" id="code-payload">{"html":{"name":"ProspectBoard.html","src":"../app/ProspectBoard.html","content":"<!-- ProspectBoard html-tool (TYPE 1)\r\n     Reusable enrollment pipeline tool: tracks prospects and converts\r\n     them into student, ledger, parent contact and communication log\r\n     objects in one batch. -->\r\n<div class=\"prb-app\" id=\"prb-app\">\r\n  <header class=\"prb-header\">\r\n    <div class=\"prb-head-main\">\r\n      <h1 class=\"prb-title\">Prospect Board<\/h1>\r\n      <p class=\"prb-subtitle\">Track new families and convert them to enrolled students.<\/p>\r\n    <\/div>\r\n    <div class=\"prb-head-side\">\r\n      <span class=\"prb-save-note\">Changes save automatically<\/span>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <main class=\"prb-body\">\r\n\r\n    <section class=\"prb-card prb-toolbar\">\r\n      <div class=\"prb-search-wrap\">\r\n        <input class=\"prb-input\" id=\"prb-search\" placeholder=\"Search name, parent or phone...\">\r\n      <\/div>\r\n      <div class=\"prb-chips\" id=\"prb-chips\"><\/div>\r\n      <button class=\"prb-btn prb-btn-primary\" id=\"prb-add\" data-act=\"prospect-add\">+ New prospect<\/button>\r\n    <\/section>\r\n\r\n    <section class=\"prb-card\">\r\n      <div class=\"prb-card-title\">Pipeline\r\n        <span class=\"prb-counts\" id=\"prb-counts\"><\/span>\r\n      <\/div>\r\n      <div id=\"prb-list\"><\/div>\r\n    <\/section>\r\n\r\n  <\/main>\r\n\r\n  <div class=\"prb-modal-overlay\" id=\"prb-modal-overlay\">\r\n    <div class=\"prb-modal\">\r\n      <div class=\"prb-modal-title\" id=\"prb-modal-title\">Title<\/div>\r\n      <div class=\"prb-modal-body\" id=\"prb-modal-body\"><\/div>\r\n      <div class=\"prb-modal-foot\" id=\"prb-modal-foot\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"ProspectBoard.css","src":"../app/ProspectBoard.css","content":"/* ProspectBoard styles */\r\n.prb-app {\r\n  --prb-ink: #1f2430;\r\n  --prb-muted: #5c6370;\r\n  --prb-line: #d8dce3;\r\n  --prb-panel: #ffffff;\r\n  --prb-bg: #f3f5f8;\r\n  --prb-accent: #0f766e;\r\n  --prb-accent-soft: #e6f2f0;\r\n  --prb-danger: #b3261e;\r\n  font-family: \"Segoe UI\", system-ui, sans-serif;\r\n  color: var(--prb-ink);\r\n  background: var(--prb-bg);\r\n  min-height: 100%;\r\n}\r\n.prb-header {\r\n  display: flex;\r\n  align-items: flex-end;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  padding: 18px 22px 14px;\r\n  border-bottom: 1px solid var(--prb-line);\r\n  background: var(--prb-panel);\r\n}\r\n.prb-title { margin: 0; font-size: 19px; font-weight: 600; }\r\n.prb-subtitle { margin: 2px 0 0; font-size: 13px; color: var(--prb-muted); }\r\n.prb-save-note { font-size: 12px; color: var(--prb-muted); }\r\n.prb-body { padding: 16px 22px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 1060px; }\r\n.prb-card { background: var(--prb-panel); border: 1px solid var(--prb-line); border-radius: 8px; padding: 14px 16px; }\r\n.prb-card-title { font-size: 14px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }\r\n.prb-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\r\n.prb-search-wrap { flex: 1 1 240px; }\r\n.prb-input, .prb-textarea, .prb-select {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 7px 9px;\r\n  border: 1px solid var(--prb-line);\r\n  border-radius: 6px;\r\n  background: #fff;\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n}\r\n.prb-input:focus, .prb-textarea:focus, .prb-select:focus { outline: 2px solid var(--prb-accent); outline-offset: -1px; }\r\n.prb-textarea { resize: vertical; line-height: 1.45; }\r\n.prb-btn {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 7px 14px;\r\n  border-radius: 6px;\r\n  border: 1px solid transparent;\r\n  cursor: pointer;\r\n  background: #e8eaee;\r\n  color: var(--prb-ink);\r\n}\r\n.prb-btn-primary { background: var(--prb-accent); color: #fff; }\r\n.prb-btn-outline { background: #fff; border-color: var(--prb-accent); color: var(--prb-accent); }\r\n.prb-btn-danger { background: transparent; border-color: var(--prb-danger); color: var(--prb-danger); }\r\n.prb-btn-sm { padding: 4px 10px; font-size: 12px; }\r\n.prb-btn:disabled { opacity: .5; cursor: default; }\r\n.prb-chips { display: flex; gap: 6px; flex-wrap: wrap; }\r\n.prb-chip {\r\n  padding: 4px 12px;\r\n  border-radius: 14px;\r\n  border: 1px solid var(--prb-line);\r\n  background: #fff;\r\n  font-size: 12px;\r\n  cursor: pointer;\r\n  color: var(--prb-muted);\r\n}\r\n.prb-chip.active { background: var(--prb-accent); border-color: var(--prb-accent); color: #fff; }\r\n.prb-counts { font-weight: 400; font-size: 12px; color: var(--prb-muted); }\r\n.prb-row {\r\n  display: grid;\r\n  grid-template-columns: 1.5fr 1fr 1fr 110px 120px;\r\n  gap: 10px;\r\n  align-items: center;\r\n  border-top: 1px solid var(--prb-line);\r\n  padding: 10px 2px;\r\n}\r\n.prb-row:first-of-type { border-top: none; }\r\n.prb-row-name { font-weight: 600; font-size: 13px; }\r\n.prb-row-parent { font-size: 12px; color: var(--prb-muted); }\r\n.prb-row-phone { font-size: 12px; color: var(--prb-muted); }\r\n.prb-status {\r\n  display: inline-block;\r\n  padding: 2px 10px;\r\n  border-radius: 12px;\r\n  font-size: 11px;\r\n  text-align: center;\r\n}\r\n.prb-status.new { background: #e3e8f0; color: #334; }\r\n.prb-status.contacted { background: #fdf0d5; color: #8a5a00; }\r\n.prb-status.interested { background: var(--prb-accent-soft); color: var(--prb-accent); }\r\n.prb-status.enrolled { background: #e2f2e4; color: #1e6b32; }\r\n.prb-status.inactive { background: #f0e9f2; color: #70427a; }\r\n.prb-nextcall { font-size: 12px; color: var(--prb-muted); }\r\n.prb-empty { color: var(--prb-muted); font-size: 13px; padding: 10px 2px; }\r\n.prb-hint { font-size: 12px; color: var(--prb-muted); margin: 4px 0 0; }\r\n.prb-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }\r\n.prb-field { display: fl
