  One-page shell for a tool's docs folder: a thin left menu loads every
  document (SSOT, webpage, help, presentation, updates, social), the tool's
  HTML / CSS / JS code (embedded, with a Copy button), the screenshots
  viewer (MEDIA) and the test harness into a full-page pane - open ONLY

  _docs/assets/index.css + index.js - edit those to change every docs
  index at once, no per-file updates needed.
  The code panes are refreshed with `npm run docs:index-code -- <Tool>`
  and the screenshots payload with `npm run docs:index-shots -- <Tool>`
  (both replace the JSON between their marker comments).
  URL shortcut: index.html?doc=help (or ?doc=code-js) opens directly.
-->

<script type="application/json" id="code-payload">{"html":{"name":"SchoolConsole.html","src":"../app/SchoolConsole.html","content":"<!-- SchoolConsole html-tool (TYPE 3 - application level listing tool)\r\n     Reusable school console: lists students, attendance, payments and\r\n     builds reports across the whole school application. Placed on the\r\n     application level, not on an object. -->\r\n<div class=\"sco-app\" id=\"sco-app\">\r\n  <header class=\"sco-header\">\r\n    <div class=\"sco-head-main\">\r\n      <h1 class=\"sco-title\">School Console<\/h1>\r\n      <p class=\"sco-subtitle\">Students, attendance, payments and reports across the school application.<\/p>\r\n    <\/div>\r\n    <div class=\"sco-head-side\">\r\n      <button class=\"sco-btn sco-btn-outline sco-btn-sm\" id=\"sco-refresh\">Refresh<\/button>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <nav class=\"sco-tabs\" id=\"sco-tabs\">\r\n    <button class=\"sco-tab active\" data-tab=\"students\">Students<\/button>\r\n    <button class=\"sco-tab\" data-tab=\"attendance\">Attendance<\/button>\r\n    <button class=\"sco-tab\" data-tab=\"payments\">Payments<\/button>\r\n    <button class=\"sco-tab\" data-tab=\"reports\">Reports<\/button>\r\n  <\/nav>\r\n\r\n  <main class=\"sco-body\">\r\n\r\n    <section class=\"sco-pane active\" data-pane=\"students\">\r\n      <div class=\"sco-card\">\r\n        <div class=\"sco-toolbar\">\r\n          <input class=\"sco-input sco-search\" id=\"sco-student-search\" placeholder=\"Search student name...\">\r\n          <input class=\"sco-input sco-search\" id=\"sco-student-class\" placeholder=\"Class group filter...\">\r\n          <span class=\"sco-hint\" id=\"sco-student-count\"><\/span>\r\n        <\/div>\r\n        <div id=\"sco-student-list\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"sco-pane\" data-pane=\"attendance\">\r\n      <div class=\"sco-card\">\r\n        <div class=\"sco-toolbar\">\r\n          <label class=\"sco-label\" for=\"sco-attendance-date\">Day<\/label>\r\n          <input class=\"sco-input\" id=\"sco-attendance-date\" type=\"date\">\r\n          <span class=\"sco-hint\" id=\"sco-attendance-summary\"><\/span>\r\n        <\/div>\r\n        <div id=\"sco-attendance-list\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"sco-pane\" data-pane=\"payments\">\r\n      <div class=\"sco-card\">\r\n        <div class=\"sco-toolbar\">\r\n          <input class=\"sco-input sco-search\" id=\"sco-payment-search\" placeholder=\"Search student...\">\r\n          <label class=\"sco-label\"><input type=\"checkbox\" id=\"sco-payment-waiting-only\" checked> Waiting only<\/label>\r\n          <span class=\"sco-hint\" id=\"sco-payment-summary\"><\/span>\r\n        <\/div>\r\n        <div id=\"sco-payment-list\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"sco-pane\" data-pane=\"reports\">\r\n      <div class=\"sco-card\">\r\n        <div class=\"sco-toolbar\">\r\n          <label class=\"sco-label\" for=\"sco-report-week\">Week of<\/label>\r\n          <input class=\"sco-input\" id=\"sco-report-week\" type=\"date\">\r\n          <button class=\"sco-btn sco-btn-primary\" id=\"sco-report-build\">Build report<\/button>\r\n          <button class=\"sco-btn\" id=\"sco-report-copy\">Copy<\/button>\r\n          <button class=\"sco-btn\" id=\"sco-report-download\">Download .txt<\/button>\r\n        <\/div>\r\n        <pre class=\"sco-report-text\" id=\"sco-report-text\">Select a week and press Build report.<\/pre>\r\n      <\/div>\r\n    <\/section>\r\n\r\n  <\/main>\r\n<\/div>\r\n"},"css":{"name":"SchoolConsole.css","src":"../app/SchoolConsole.css","content":"/* SchoolConsole styles */\r\n.sco-app {\r\n  --sco-ink: #1f2430;\r\n  --sco-muted: #5c6370;\r\n  --sco-line: #d8dce3;\r\n  --sco-panel: #ffffff;\r\n  --sco-bg: #f3f5f8;\r\n  --sco-accent: #0f766e;\r\n  --sco-accent-soft: #e6f2f0;\r\n  --sco-danger: #b3261e;\r\n  font-family: \"Segoe UI\", system-ui, sans-serif;\r\n  color: var(--sco-ink);\r\n  background: var(--sco-bg);\r\n  min-height: 100%;\r\n}\r\n.sco-header {\r\n  display: flex;\r\n  align-items: flex-end;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  padding: 18px 22px 14px;\r\n  border-bottom: 1px solid var(--sco-line);\r\n  background: var(--sco-panel);\r\n}\r\n.sco-title { margin: 0; font-size: 19px; font-weight: 600; }\r\n.sco-subtitle { margin: 2px 0 0; font-size: 13px; color: var(--sco-muted); }\r\n.sco-tabs { display: flex; gap: 4px; padding: 10px 22px 0; background: var(--sco-panel); border-bottom: 1px solid var(--sco-line); }\r\n.sco-tab {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 8px 16px;\r\n  border: none;\r\n  border-bottom: 3px solid transparent;\r\n  background: none;\r\n  cursor: pointer;\r\n  color: var(--sco-muted);\r\n}\r\n.sco-tab.active { color: var(--sco-accent); border-bottom-color: var(--sco-accent); font-weight: 600; }\r\n.sco-body { padding: 16px 22px 40px; max-width: 1100px; }\r\n.sco-pane { display: none; }\r\n.sco-pane.active { display: block; }\r\n.sco-card { background: var(--sco-panel); border: 1px solid var(--sco-line); border-radius: 8px; padding: 14px 16px; }\r\n.sco-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }\r\n.sco-search { max-width: 240px; }\r\n.sco-input, .sco-textarea, .sco-select {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 7px 9px;\r\n  border: 1px solid var(--sco-line);\r\n  border-radius: 6px;\r\n  background: #fff;\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n}\r\n.sco-input:focus, .sco-textarea:focus, .sco-select:focus { outline: 2px solid var(--sco-accent); outline-offset: -1px; }\r\n.sco-label { font-size: 12px; color: var(--sco-muted); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }\r\n.sco-btn {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 7px 14px;\r\n  border-radius: 6px;\r\n  border: 1px solid transparent;\r\n  cursor: pointer;\r\n  background: #e8eaee;\r\n  color: var(--sco-ink);\r\n}\r\n.sco-btn-primary { background: var(--sco-accent); color: #fff; }\r\n.sco-btn-outline { background: #fff; border-color: var(--sco-accent); color: var(--sco-accent); }\r\n.sco-btn-sm { padding: 4px 10px; font-size: 12px; }\r\n.sco-btn:disabled { opacity: .5; cursor: default; }\r\n.sco-hint { font-size: 12px; color: var(--sco-muted); }\r\n.sco-empty { color: var(--sco-muted); font-size: 13px; padding: 10px 2px; }\r\n.sco-table { width: 100%; border-collapse: collapse; font-size: 13px; }\r\n.sco-table th, .sco-table td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--sco-line); }\r\n.sco-table th { font-size: 11px; color: var(--sco-muted); text-transform: uppercase; letter-spacing: .3px; border-top: none; }\r\n.sco-table tr:hover td { background: #f7f9fb; }\r\n.sco-pill {\r\n  display: inline-block;\r\n  padding: 2px 10px;\r\n  border-radius: 12px;\r\n  font-size: 11px;\r\n  background: #e3e8f0;\r\n  color: #334;\r\n}\r\n.sco-pill.good { background: #e2f2e4; color: #1e6b32; }\r\n.sco-pill.warn { background: #fdf0d5; color: #8a5a00; }\r\n.sco-pill.bad { background: #fbe3e3; color: #8a1f1f; }\r\n.sco-link { color: var(--sco-accent); cursor: pointer; font-weight: 600; background: none; border: none; padding: 0; font: inherit; }\r\n.sco-lesson-block { margin-bottom: 14px; }\r\n.sco-lesson-block-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; }\r\n.sco-report-text {\r\n  font-family: \"Cascadia Code\", Consolas, monospace;\r\n  font-size: 12px;\r\n  white-space: pre-wrap;\r\n  background: #f7f9fb;\r\n  border: 1px solid var(--sco-line);\r\n  border-radius: 6px;\r\n  padding: 12px;\r\n  min-height: 180px;\r\n  margin: 0;\r\n}\r\n@media (max-width: 640px) {\r\n  .sco-search { max-width: 100%; }\r\n}\r\n"},"js":{"name":"SchoolConsole.js","src":"../app/SchoolConsole.js","content":"/* SchoolConsole - reusable application level listing tool (TYPE 3).\r\n   Lists students, attendance records and payment ledgers across the\r\n   school application and builds text reports. Installed in the\r\n   application's single listingTool slot with mode 'replace-listings'. */\r\n(function () {\r\n  \"use strict\";\r\n\r\n  var tool = (typeof window !== \"undefined\" && window.tool) ? window.tool : null;\r\n  if (!tool) {\r\n    var _shimValue = null;\r\n    tool = {\r\n      onReady: function (cb) { cb(_shimValue, {}); },\r\n      getValue: function () { return _shimValue; },\r\n      setValue: function (v) { _shimValue = v; },\r\n      onValueChange: function () { },\r\n      param: function (n, d) { return d; },\r\n      isReadOnly: function () { return false; },\r\n      getUser: function () { return null; },\r\n      requestObjects: function () { },\r\n      notify: function (m) { try { console.log(\"notify:\", m); } catch (e) { } },\r\n      resize: function () { },\r\n      declareOutput: function () { },\r\n      declareParams: function () { },\r\n      reportMissingParams: function () { }\r\n    };\r\n  }\r\n\r\n  function $(s, r) { return (r || document).querySelector(s); }\r\n  function esc(s) {\r\n    return String(s == null ? \"\" : s).replace(/[&<>\"']/g, function (c) {\r\n      return { \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c];\r\n    });\r\n  }\r\n  function notify(msg, sev) { try { tool.notify(msg, sev || \"success\"); } catch (e) { } }\r\n  function resize() { try { tool.resize(); } catch (e) { } }\r\n  function todayIso() {\r\n    var d = new Date();\r\n    return d.getFullYear() + \"-\" + String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(d.getDate()).padStart(2, \"0\");\r\n  }\r\n  function thisSundayIso() {\r\n    var d = new Date();\r\n    d.setDate(d.getDate() + (7 - d.getDay()) % 7);\r\n    return d.getFullYear() + \"-\" + String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(d.getDate()).padStart(2, \"0\");\r\n  }\r\n  function mondayOfWeek(sundayIso) {\r\n    var d = new Date(sundayIso + \"T00:00:00\");\r\n    d.setDate(d.getDate() - 6);\r\n    return d.getFullYear() + \"-\" + String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(d.getDate()).padStart(2, \"0\");\r\n  }\r\n  function fmtDate(iso) {\r\n    if (!iso) return \"\";\r\n    var d = new Date(iso + \"T00:00:00\");\r\n    if (isNaN(d.getTime())) return iso;\r\n    return d.toLocaleDateString(undefined, { year: \"numeric\", month: \"short\", day: \"numeric\" });\r\n  }\r\n\r\n  var SETUP_FIELD_ID = \"schoolSetup\";\r\n  var STUDENT_FIELD_ID = \"studentRecord\";\r\n  var ATTENDANCE_FIELD_ID = \"attendanceRecord\";\r\n  var LEDGER_FIELD_ID = \"paymentLedger\";\r\n  var LESSON_FIELD_ID = \"lessonBoard\";\r\n  var MARK_LABELS = { P: \"Present\", A: \"Absent\", L: \"Late\", E: \"Excused\" };\r\n\r\n  var UI = { version: 1, ui: { tab: \"students\" } };\r\n  var _folderMap = null;\r\n  var _state = {\r\n    students: [], attendanceFolders: [], attendanceRecords: [],\r\n    ledgers: [], lessons: [], settingsName: \"\"\r\n  };\r\n  var _paymentSearch = \"\";\r\n  var _studentSearch = \"\";\r\n  var _studentClassFilter = \"\";\r\n  var _waitingOnly = true;\r\n  var _loading = false;\r\n\r\n  function appType() { return tool.param(\"appObjectType\", \"weekendSchool\"); }\r\n\r\n  function callObjects(action, params, callback) {\r\n    try {\r\n      if (typeof tool.requestObjects !== \"function\") { callback(\"requestObjects is not available.\", null); return; }\r\n      tool.requestObjects(action, params, callback);\r\n    } catch (e) { callback(String(e && e.message ? e.message : e), null); }\r\n  }\r\n\r\n  function queryFolder(folderId, callback) {\r\n    if (!folderId) { callback(null, []); return; }\r\n    callObjects(\"query\", { mainObjectType: appType(), typeId: folderId }, function (error, result) {\r\n      if (error) { callback(error, []); return; }\r\n      callback(null, (result && Array.isArray(result.objects)) ? result.objects : []);\r\n    });\r\n  }\r\n\r\n
