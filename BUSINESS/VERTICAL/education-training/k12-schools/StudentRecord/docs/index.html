ord.css","content":"/* StudentRecord styles */\r\n.srec-app {\r\n  --srec-ink: #1f2430;\r\n  --srec-muted: #5c6370;\r\n  --srec-line: #d8dce3;\r\n  --srec-panel: #ffffff;\r\n  --srec-bg: #f3f5f8;\r\n  --srec-accent: #0f766e;\r\n  --srec-accent-soft: #e6f2f0;\r\n  --srec-danger: #b3261e;\r\n  font-family: \"Segoe UI\", system-ui, sans-serif;\r\n  color: var(--srec-ink);\r\n  background: var(--srec-bg);\r\n  min-height: 100%;\r\n}\r\n.srec-header {\r\n  display: flex;\r\n  align-items: flex-end;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  padding: 18px 22px 14px;\r\n  border-bottom: 1px solid var(--srec-line);\r\n  background: var(--srec-panel);\r\n}\r\n.srec-title { margin: 0; font-size: 19px; font-weight: 600; }\r\n.srec-subtitle { margin: 2px 0 0; font-size: 13px; color: var(--srec-muted); }\r\n.srec-head-side { display: flex; align-items: center; gap: 12px; }\r\n.srec-save-note { font-size: 12px; color: var(--srec-muted); }\r\n.srec-tabs { display: flex; gap: 4px; padding: 10px 22px 0; background: var(--srec-panel); border-bottom: 1px solid var(--srec-line); }\r\n.srec-tab {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 8px 16px;\r\n  border: none;\r\n  border-bottom: 3px solid transparent;\r\n  background: none;\r\n  cursor: pointer;\r\n  color: var(--srec-muted);\r\n}\r\n.srec-tab.active { color: var(--srec-accent); border-bottom-color: var(--srec-accent); font-weight: 600; }\r\n.srec-body { padding: 16px 22px 40px; max-width: 900px; display: flex; flex-direction: column; gap: 14px; }\r\n.srec-pane { display: none; }\r\n.srec-pane.active { display: flex; flex-direction: column; gap: 14px; }\r\n.srec-card { background: var(--srec-panel); border: 1px solid var(--srec-line); border-radius: 8px; padding: 14px 16px; }\r\n.srec-card-title { font-size: 14px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }\r\n.srec-card-actions { display: inline-flex; gap: 8px; }\r\n.srec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; }\r\n.srec-item { display: flex; flex-direction: column; gap: 2px; }\r\n.srec-item-label { font-size: 11px; color: var(--srec-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }\r\n.srec-item-value { font-size: 13px; word-break: break-word; }\r\n.srec-field { display: flex; flex-direction: column; gap: 4px; }\r\n.srec-label { font-size: 12px; color: var(--srec-muted); font-weight: 600; }\r\n.srec-input, .srec-textarea, .srec-select {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 7px 9px;\r\n  border: 1px solid var(--srec-line);\r\n  border-radius: 6px;\r\n  background: #fff;\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n}\r\n.srec-input:focus, .srec-textarea:focus, .srec-select:focus { outline: 2px solid var(--srec-accent); outline-offset: -1px; }\r\n.srec-textarea { resize: vertical; line-height: 1.45; }\r\n.srec-btn {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 7px 14px;\r\n  border-radius: 6px;\r\n  border: 1px solid transparent;\r\n  cursor: pointer;\r\n  background: #e8eaee;\r\n  color: var(--srec-ink);\r\n}\r\n.srec-btn-primary { background: var(--srec-accent); color: #fff; }\r\n.srec-btn-outline { background: #fff; border-color: var(--srec-accent); color: var(--srec-accent); }\r\n.srec-btn-danger { background: transparent; border-color: var(--srec-danger); color: var(--srec-danger); }\r\n.srec-btn-ghost { background: transparent; border-color: var(--srec-line); }\r\n.srec-btn-sm { padding: 4px 10px; font-size: 12px; }\r\n.srec-hint { font-size: 12px; color: var(--srec-muted); margin: 4px 0 0; }\r\n.srec-empty { color: var(--srec-muted); font-size: 13px; padding: 10px 2px; }\r\n.srec-doc-row {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 12px;\r\n  border-top: 1px solid var(--srec-line);\r\n  padding: 8px 2px;\r\n}\r\n.srec-doc-row:first-of-type { border-top: none; }\r\n.srec-doc-name { font-size: 13px; font-weight: 600; }\r\n.srec-doc-meta { font-size: 12px; color: var(--srec-muted); }\r\n.srec-entry {\r\n  border-top: 1px solid var(--srec-line);\r\n  padding: 8px 2px;\r\n  font-size: 13px;\r\n}\r\n.srec-entry:first-of-type { border-top: none; }\r\n.srec-entry-head { font-weight: 600; }\r\n.srec-entry-sub { font-size: 12px; color: var(--srec-muted); }\r\n.srec-mark {\r\n  display: inline-block;\r\n  padding: 2px 10px;\r\n  border-radius: 12px;\r\n  font-size: 11px;\r\n  background: #e3e8f0;\r\n  color: #334;\r\n}\r\n.srec-mark.P { background: #e2f2e4; color: #1e6b32; }\r\n.srec-mark.A { background: #fbe3e3; color: #8a1f1f; }\r\n.srec-mark.L { background: #fdf0d5; color: #8a5a00; }\r\n.srec-mark.E { background: #e6f2f0; color: var(--srec-accent); }\r\n.srec-modal-overlay {\r\n  position: fixed;\r\n  inset: 0;\r\n  background: rgba(15, 23, 42, .45);\r\n  display: none;\r\n  align-items: flex-start;\r\n  justify-content: center;\r\n  padding: 40px 16px;\r\n  z-index: 80;\r\n  overflow-y: auto;\r\n}\r\n.srec-modal-overlay.open { display: flex; }\r\n.srec-modal {\r\n  background: #fff;\r\n  border-radius: 10px;\r\n  width: 100%;\r\n  max-width: 640px;\r\n  box-shadow: 0 10px 34px rgba(15, 23, 42, .25);\r\n}\r\n.srec-modal-title { padding: 14px 18px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--srec-line); }\r\n.srec-modal-body { padding: 16px 18px; }\r\n.srec-modal-foot { padding: 12px 18px; border-top: 1px solid var(--srec-line); display: flex; justify-content: flex-end; gap: 8px; }\r\n@media (max-width: 640px) {\r\n  .srec-grid { grid-template-columns: 1fr 1fr; }\r\n}\r\n"},"js":{"name":"StudentRecord.js","src":"../app/StudentRecord.js","content":"/* StudentRecord - reusable student file tool for the UniconHub CMS.\r\n   One tool per student object. Holds identity, health and documents.\r\n   Reads attendance, progress, communication log and parent contact\r\n   objects of the same application (the CMS ACL already limits what\r\n   each user can see). */\r\n(function () {\r\n  \"use strict\";\r\n\r\n  var tool = (typeof window !== \"undefined\" && window.tool) ? window.tool : null;\r\n  if (!tool) {\r\n    var _shimValue = null;\r\n    tool = {\r\n      onReady: function (cb) { cb(_shimValue, {}); },\r\n      getValue: function () { return _shimValue; },\r\n      setValue: function (v) { _shimValue = v; },\r\n      onValueChange: function () { },\r\n      getFields: function () { return {}; },\r\n      param: function (n, d) { return d; },\r\n      isReadOnly: function () { return false; },\r\n      onReadonlyChange: function () { },\r\n      getUser: function () { return null; },\r\n      onUserChange: function () { },\r\n      requestSave: function () { },\r\n      requestObjects: function () { },\r\n      notify: function (m) { try { console.log(\"notify:\", m); } catch (e) { } },\r\n      resize: function () { },\r\n      declareOutput: function () { },\r\n      declareParams: function () { },\r\n      reportMissingParams: function () { }\r\n    };\r\n  }\r\n\r\n  function $(s, r) { return (r || document).querySelector(s); }\r\n  function esc(s) {\r\n    return String(s == null ? \"\" : s).replace(/[&<>\"']/g, function (c) {\r\n      return { \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c];\r\n    });\r\n  }\r\n  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\r\n  function todayIso() {\r\n    var d = new Date();\r\n    return d.getFullYear() + \"-\" + String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(d.getDate()).padStart(2, \"0\");\r\n  }\r\n  function fmtDate(iso) {\r\n    if (!iso) return \"\";\r\n    var d = new Date(iso + \"T00:00:00\");\r\n    if (isNaN(d.getTime())) return iso;\r\n    return d.toLocaleDateString(undefined, { year: \"numeric\", month: \"short\", day: \"numeric\" });\r\n  }\r\n  function notify(msg, sev) { try { tool.notify(msg, sev || \"success\"); } catch (e) { } }\r\n
