<script type="application/json" id="code-payload">{"html":{"name":"SchoolSetup.html","src":"../app/SchoolSetup.html","content":"<!-- SchoolSetup html-tool (TYPE 1)\r\n     Reusable school settings tool. One School Setup object per school\r\n     year. Tabs: Overview, Class Groups, Payments, Lessons, Folders. -->\r\n<div class=\"ssu-app\" id=\"ssu-app\">\r\n  <header class=\"ssu-header\">\r\n    <div class=\"ssu-head-main\">\r\n      <div class=\"ssu-title-row\">\r\n        <h1 class=\"ssu-title\">School Setup<\/h1>\r\n        <span class=\"ssu-year-pill\" id=\"ssu-year-pill\">No school year yet<\/span>\r\n      <\/div>\r\n      <p class=\"ssu-subtitle\">The yearly setup for this school: profile, payment settings and brackets, lessons with their levels, and the folder ids that connect every tool.<\/p>\r\n    <\/div>\r\n    <div class=\"ssu-head-side\">\r\n      <span class=\"ssu-save-note\">Changes save automatically<\/span>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <nav class=\"ssu-tabs\" id=\"ssu-tabs\">\r\n    <button class=\"ssu-tab active\" data-tab=\"overview\">Overview<\/button>\r\n    <button class=\"ssu-tab\" data-tab=\"payments\">Payments<\/button>\r\n    <button class=\"ssu-tab\" data-tab=\"lessons\">Lessons<\/button>\r\n    <button class=\"ssu-tab\" data-tab=\"classes\">Classes<\/button>\r\n    <button class=\"ssu-tab\" data-tab=\"teachers\">Teachers<\/button>\r\n    <button class=\"ssu-tab\" data-tab=\"calendar\">Calendar<\/button>\r\n    <button class=\"ssu-tab\" data-tab=\"folders\">Folders<\/button>\r\n  <\/nav>\r\n\r\n  <main class=\"ssu-body\">\r\n\r\n    <section class=\"ssu-pane active\" data-pane=\"overview\">\r\n      <div class=\"ssu-note\">\r\n        <div class=\"ssu-note-title\">What is this page?<\/div>\r\n        <p>This is the setup of the <strong id=\"ssu-note-year\">current<\/strong> school year of\r\n          <strong id=\"ssu-note-school\">this school<\/strong>. Everything you configure here - classes,\r\n          payment brackets, lessons, the school calendar and folder ids - belongs to this school\r\n          year only. When a new school year starts, create a new School Setup object inside that\r\n          year's <em>0-Setup<\/em> folder.<\/p>\r\n      <\/div>\r\n\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">School profile<\/div>\r\n        <div class=\"ssu-grid-3\">\r\n          <div class=\"ssu-field\">\r\n            <label class=\"ssu-label\" for=\"ssu-school-name\">School name<\/label>\r\n            <input class=\"ssu-input\" id=\"ssu-school-name\" placeholder=\"e.g. Horizon Weekend School\">\r\n            <span class=\"ssu-hint\">Shown on reports and on the school console.<\/span>\r\n          <\/div>\r\n          <div class=\"ssu-field\">\r\n            <label class=\"ssu-label\" for=\"ssu-school-year\">School year<\/label>\r\n            <input class=\"ssu-input\" id=\"ssu-school-year\" placeholder=\"e.g. 2026-2027\">\r\n            <span class=\"ssu-hint\">One School Setup object per school year. Everything on this page belongs to this year.<\/span>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"ssu-pane\" data-pane=\"payments\">\r\n      <div class=\"ssu-note\">\r\n        <div class=\"ssu-note-title\">What are payment brackets?<\/div>\r\n        <p>Payment brackets are the pricing plans of this school year. Each bracket has a\r\n          <strong>monthly fee<\/strong> and an optional <strong>discounted monthly fee<\/strong>.\r\n          When a bracket is assigned to a student, its fee becomes that student's monthly\r\n          installment. Because this School Setup object lives in the school year's\r\n          <em>0-Setup<\/em> folder, brackets are automatically scoped to this school year - next\r\n          year's setup gets its own brackets.<\/p>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">Payment settings<\/div>\r\n        <div class=\"ssu-grid-2\">\r\n          <div class=\"ssu-field\">\r\n            <label class=\"ssu-label\" for=\"ssu-currency\">Currency<\/label>\r\n            <input class=\"ssu-input\" id=\"ssu-currency\" placeholder=\"CAD\">\r\n            <span class=\"ssu-hint\">Shown next to every price on this page.<\/span>\r\n          <\/div>\r\n          <div class=\"ssu-field\">\r\n            <label class=\"ssu-label\" for=\"ssu-payment-due-day\">Payment due day<\/label>\r\n            <input class=\"ssu-input\" id=\"ssu-payment-due-day\" type=\"number\" min=\"1\" max=\"31\">\r\n            <span class=\"ssu-hint\">The day of the month when monthly installments are due.<\/span>\r\n          <\/div>\r\n        <\/div>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">Payment brackets for <span id=\"ssu-payments-year\">this year<\/span>\r\n          <span class=\"ssu-card-actions\"><button class=\"ssu-btn ssu-btn-ghost\" id=\"ssu-bracket-add\" data-act=\"bracket-add\">+ Add bracket<\/button><\/span>\r\n        <\/div>\r\n        <div class=\"ssu-bracket-head\">\r\n          <span>Bracket name<\/span><span>Monthly fee<\/span><span>Discounted monthly fee<\/span><span><\/span>\r\n        <\/div>\r\n        <div id=\"ssu-bracket-rows\"><\/div>\r\n        <p class=\"ssu-hint\">Removing a bracket does not touch students who were already assigned to it - their ledger entries stay as recorded.<\/p>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"ssu-pane\" data-pane=\"lessons\">\r\n      <div class=\"ssu-note\">\r\n        <div class=\"ssu-note-title\">Why are lessons managed here?<\/div>\r\n        <p>Every lesson is a <strong>subject<\/strong> taught at the school - for example the\r\n          subject <em>Quran<\/em> with its levels <em>Level 1<\/em> and <em>Level 2<\/em>. Students\r\n          belong to a class (see the <strong>Classes<\/strong> tab) and attend one or more lessons.\r\n          The lesson also carries the teacher, schedule, progress checklist, its attendance and\r\n          progress subfolders, and its attendance requirement - so the other school tools\r\n          (attendance, progress, reports) reuse it as is.<\/p>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">Attendance requirement<\/div>\r\n        <select class=\"ssu-select ssu-rule-select\" id=\"ssu-attendance-rule\">\r\n          <option value=\"all\">Every lesson<\/option>\r\n          <option value=\"first\">First lesson of the day only<\/option>\r\n          <option value=\"firstAndAfternoon\">First lesson + afternoon lessons<\/option>\r\n          <option value=\"custom\">Choose per lesson (custom)<\/option>\r\n        <\/select>\r\n        <p class=\"ssu-hint\" id=\"ssu-attendance-rule-hint\"><\/p>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">Lessons of <span id=\"ssu-lessons-year\">this year<\/span>\r\n          <span class=\"ssu-card-actions\"><button class=\"ssu-btn ssu-btn-primary\" id=\"ssu-lesson-add\" data-act=\"lesson-add\">+ Add lesson<\/button><\/span>\r\n        <\/div>\r\n        <div id=\"ssu-lesson-list\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"ssu-pane\" data-pane=\"classes\">\r\n      <div class=\"ssu-note\">\r\n        <div class=\"ssu-note-title\">What are classes?<\/div>\r\n        <p>Classes are the <strong>groups students belong to<\/strong> - for example <em>Grade 1-A<\/em>,\r\n          <em>Grade 1-B<\/em>, <em>Grade 3-4<\/em>, or flower names. They are separate from lessons: a\r\n          student sits in one class but attends several lessons. Define the class names here, then\r\n          assign each student to a class in the student record tool.<\/p>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">Classes of <span id=\"ssu-classes-year\">this year<\/span><\/div>\r\n        <div class=\"ssu-add-row\">\r\n          <input class=\"ssu-input\" id=\"ssu-class-name-input\" placeholder=\"New class name, e.g. Grade 1-A...\">\r\n          <button class=\"ssu-btn ssu-btn-primary\" data-act=\"class-name-add\">Add class<\/button>\r\n        <\/div>\r\n        <div id=\"ssu-class-list\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"ssu-pane\" data-pane=\"teachers\">\r\n      <div class=\"ssu-note\">\r\n        <div class=\"ssu-note-title\">What are teachers?<\/div>\r\n        <p>Teachers are the <strong>real users<\/strong> of this application. Record their name and\r\n          email here - the email is their login identity. Then assign teachers to lessons and\r\n          classes from these lists. In the application's permission settings, grant the same email\r\n          access to the teacher's lesson folders so they only see their own lessons.<\/p>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">Teachers of <span id=\"ssu-teachers-year\">this year<\/span><\/div>\r\n        <div class=\"ssu-add-row\">\r\n          <input class=\"ssu-input\" id=\"ssu-teacher-name-input\" placeholder=\"Teacher name...\">\r\n          <input class=\"ssu-input\" id=\"ssu-teacher-email-input\" placeholder=\"Email (login identity)...\">\r\n          <button class=\"ssu-btn ssu-btn-primary\" data-act=\"teacher-add\">Add teacher<\/button>\r\n        <\/div>\r\n        <div id=\"ssu-teacher-list\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"ssu-pane\" data-pane=\"calendar\">\r\n      <div class=\"ssu-note\">\r\n        <div class=\"ssu-note-title\">How does the school calendar work?<\/div>\r\n        <p>You build an <strong>explicit list of school days<\/strong>. Add a recurring weekly pattern\r\n          (one day per week, several days per week, or every second week), then add or remove single\r\n          dates for weeks that differ - a different day in one week, an extra session, or a make-up\r\n          day. Attendance tools use exactly this list.<\/p>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">School days of <span id=\"ssu-calendar-year\">this year<\/span>\r\n          <span class=\"ssu-card-actions\">\r\n            <button class=\"ssu-btn ssu-btn-primary\" data-act=\"cal-recurring-open\">+ Add recurring days<\/button>\r\n            <button class=\"ssu-btn ssu-btn-outline\" data-act=\"cal-single-open\">+ Add a single date<\/button>\r\n            <button class=\"ssu-btn ssu-btn-ghost\" data-act=\"cal-clear\">Clear<\/button>\r\n          <\/span>\r\n        <\/div>\r\n        <p class=\"ssu-hint\" id=\"ssu-cal-stats\"><\/p>\r\n        <div id=\"ssu-calendar-view\"><\/div>\r\n      <\/div>\r\n    <\/section>\r\n\r\n    <section class=\"ssu-pane\" data-pane=\"folders\">\r\n      <div class=\"ssu-note\">\r\n        <div class=\"ssu-note-title\">What are folder ids?<\/div>\r\n        <p>All school tools live inside the <strong>same application<\/strong>. The folders below are\r\n          folders of that application, and the folder ids are the connection between them: students\r\n          are stored in the <em>Students<\/em> folder, lesson objects in the <em>Lessons<\/em> folder,\r\n          payment ledgers in the <em>Payments<\/em> folder and so on. Set them once per year - teachers\r\n          and other tools read them automatically and never need to type them.<\/p>\r\n        <p><strong>Changing an id later can disconnect data:<\/strong> objects already created keep\r\n          living in the old folder, and the tools would start reading the new folder instead. When\r\n          you save changed ids, you will be asked to confirm.<\/p>\r\n      <\/div>\r\n      <div class=\"ssu-card\">\r\n        <div class=\"ssu-card-title\">Folder ids of <span id=\"ssu-folders-year\">this year<\/span><\/div>\r\n        <div class=\"ssu-folder-head\"><span>Folder<\/span><span>What is stored there<\/span><span>Folder id<\/span><\/div>\r\n        <div id=\"ssu-folder-rows\"><\/div>\r\n        <div class=\"ssu-folder-actions\">\r\n          <button class=\"ssu-btn ssu-btn-outline\" id=\"ssu-folder-generate\" data-act=\"folder-generate\">Fill suggested ids<\/button>\r\n          <button class=\"ssu-btn ssu-btn-primary\" id=\"ssu-folder-save\" data-act=\"folder-save\">Save folder ids<\/button>\r\n          <button class=\"ssu-btn ssu-btn-ghost\" id=\"ssu-folder-copy\" data-act=\"folder-copy\">Copy JSON<\/button>\r\n          <button class=\"ssu-btn ssu-btn-ghost\" id=\"ssu-folder-paste\" data-act=\"folder-paste\">Paste JSON<\/button>\r\n          <span class=\"ssu-hint\" id=\"ssu-folder-status\"><\/span>\r\n        <\/div>\r\n        <p class=\"ssu-hint\" style=\"margin-top:8px\">Copy JSON backs up these ids or carries them to another School Setup or another tool's folderMapJson parameter. Paste JSON restores a copied set into the fields above.<\/p>\r\n      <\/div>\r\n    <\/section>\r\n\r\n  <\/main>\r\n\r\n  <div class=\"ssu-modal-overlay\" id=\"ssu-modal-overlay\">\r\n    <div class=\"ssu-modal\">\r\n      <div class=\"ssu-modal-title\" id=\"ssu-modal-title\">Title<\/div>\r\n      <div class=\"ssu-modal-body\" id=\"ssu-modal-body\"><\/div>\r\n      <div class=\"ssu-modal-foot\" id=\"ssu-modal-foot\"><\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/div>\r\n"},"css":{"name":"SchoolSetup.css","src":"../app/SchoolSetup.css","content":"/* SchoolSetup styles */\r\n.ssu-app {\r\n  --ssu-ink: #1f2430;\r\n  --ssu-muted: #5c6370;\r\n  --ssu-line: #dde2e9;\r\n  --ssu-panel: #ffffff;\r\n  --ssu-bg: #f4f6f9;\r\n  --ssu-accent: #0f766e;\r\n  --ssu-accent-strong: #0b5f59;\r\n  --ssu-accent-soft: #e6f2f0;\r\n  --ssu-danger: #b3261e;\r\n  font-family: \"Segoe UI\", system-ui, sans-serif;\r\n  color: var(--ssu-ink);\r\n  background: var(--ssu-bg);\r\n  min-height: 100%;\r\n}\r\n.ssu-header {\r\n  display: flex;\r\n  align-items: flex-end;\r\n  justify-content: space-between;\r\n  gap: 16px;\r\n  padding: 20px 24px 16px;\r\n  border-bottom: 1px solid var(--ssu-line);\r\n  background: var(--ssu-panel);\r\n}\r\n.ssu-head-main { max-width: 760px; }\r\n.ssu-title-row { display: flex; align-items: center; gap: 10px; }\r\n.ssu-title { margin: 0; font-size: 20px; font-weight: 600; }\r\n.ssu-year-pill {\r\n  padding: 3px 12px;\r\n  border-radius: 14px;\r\n  background: var(--ssu-accent-soft);\r\n  color: var(--ssu-accent-strong);\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n}\r\n.ssu-subtitle { margin: 4px 0 0; font-size: 13px; color: var(--ssu-muted); line-height: 1.5; }\r\n.ssu-save-note { font-size: 12px; color: var(--ssu-muted); white-space: nowrap; }\r\n\r\n/* Tabs */\r\n.ssu-tabs {\r\n  display: flex;\r\n  gap: 2px;\r\n  padding: 0 24px;\r\n  background: var(--ssu-panel);\r\n  border-bottom: 1px solid var(--ssu-line);\r\n  overflow-x: auto;\r\n}\r\n.ssu-tab {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 11px 18px;\r\n  border: none;\r\n  border-bottom: 3px solid transparent;\r\n  background: none;\r\n  cursor: pointer;\r\n  color: var(--ssu-muted);\r\n  white-space: nowrap;\r\n}\r\n.ssu-tab:hover { color: var(--ssu-ink); }\r\n.ssu-tab.active { color: var(--ssu-accent-strong); border-bottom-color: var(--ssu-accent); font-weight: 600; }\r\n\r\n.ssu-body { padding: 18px 24px 48px; max-width: 1020px; }\r\n.ssu-pane { display: none; flex-direction: column; gap: 14px; }\r\n.ssu-pane.active { display: flex; }\r\n\r\n/* Explainer note */\r\n.ssu-note {\r\n  background: var(--ssu-accent-soft);\r\n  border: 1px solid #cfe5e0;\r\n  border-left: 4px solid var(--ssu-accent);\r\n  border-radius: 8px;\r\n  padding: 13px 16px;\r\n}\r\n.ssu-note-title { font-size: 13px; font-weight: 600; color: var(--ssu-accent-strong); margin-bottom: 4px; }\r\n.ssu-note p { margin: 0; font-size: 13px; line-height: 1.55; color: #2f4a46; }\r\n\r\n/* Cards */\r\n.ssu-card {\r\n  background: var(--ssu-panel);\r\n  border: 1px solid var(--ssu-line);\r\n  border-radius: 10px;\r\n  padding: 16px 18px;\r\n  box-shadow: 0 1px 2px rgba(31, 36, 48, .04);\r\n}\r\n.ssu-card-title {\r\n  font-size: 14px;\r\n  font-weight: 600;\r\n  margin: 0 0 14px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n}\r\n.ssu-card-actions { display: inline-flex; gap: 8px; }\r\n\r\n/* Fields */\r\n.ssu-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }\r\n.ssu-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }\r\n.ssu-rule-select { max-width: 320px; }\r\n.ssu-field { display: flex; flex-direction: column; gap: 5px; }\r\n.ssu-label { font-size: 12px; color: var(--ssu-muted); font-weight: 600; }\r\n.ssu-input, .ssu-textarea, .ssu-select {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 8px 10px;\r\n  border: 1px solid var(--ssu-line);\r\n  border-radius: 7px;\r\n  background: #fff;\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n}\r\n.ssu-input:focus, .ssu-textarea:focus, .ssu-select:focus { outline: 2px solid var(--ssu-accent); outline-offset: -1px; }\r\n.ssu-textarea { resize: vertical; line-height: 1.45; }\r\n.ssu-hint { font-size: 12px; color: var(--ssu-muted); margin: 0; line-height: 1.45; }\r\n.ssu-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; margin: 4px 0 2px; }\r\n.ssu-row-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }\r\n.ssu-migrate { margin-bottom: 10px; }\r\n.ssu-chip-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\r\n.ssu-class-row, .ssu-teacher-row {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1.6fr auto;\r\n  gap: 10px;\r\n  align-items: center;\r\n  padding: 7px 0;\r\n  border-top: 1px solid var(--ssu-line);\r\n}\r\n.ssu-class-row:first-child, .ssu-teacher-row:first-child { border-top: none; }\r\n.ssu-teacher-email { font-size: 12px; color: var(--ssu-muted); word-break: break-all; }\r\n\r\n/* Calendar */\r\n.ssu-weekdays { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 6px 0; }\r\n.ssu-cal-view { display: flex; flex-wrap: wrap; gap: 16px 20px; margin-top: 10px; }\r\n.ssu-cal-month { flex: 0 0 auto; }\r\n.ssu-cal-month-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: baseline; gap: 8px; }\r\n.ssu-cal-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(7, 30px);\r\n  gap: 3px;\r\n}\r\n.ssu-cal-weekday {\r\n  font-size: 10px;\r\n  color: var(--ssu-muted);\r\n  font-weight: 600;\r\n  text-align: center;\r\n  padding: 2px 0;\r\n}\r\n.ssu-cal-cell {\r\n  position: relative;\r\n  height: 26px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  font-size: 11px;\r\n  font-family: inherit;\r\n  border: none;\r\n  padding: 0;\r\n  border-radius: 5px;\r\n  background: #f2f4f7;\r\n  color: #a9b0bd;\r\n}\r\n.ssu-cal-cell.empty { cursor: pointer; }\r\n.ssu-cal-cell.empty:hover { background: #d9e9e5; color: var(--ssu-accent-strong); }\r\n.ssu-cal-cell.school {\r\n  background: var(--ssu-accent-soft);\r\n  color: var(--ssu-accent-strong);\r\n  font-weight: 600;\r\n  border: 1px solid #bfe0d9;\r\n  cursor: default;\r\n}\r\n.ssu-cal-remove {\r\n  position: absolute;\r\n  top: 0;\r\n  right: 0;\r\n  width: 13px;\r\n  height: 13px;\r\n  border: none;\r\n  border-radius: 50%;\r\n  background: #fff;\r\n  color: var(--ssu-muted);\r\n  font-size: 9px;\r\n  line-height: 1;\r\n  cursor: pointer;\r\n  padding: 0;\r\n  opacity: .75;\r\n}\r\n.ssu-cal-remove:hover { background: #f6dcdc; color: var(--ssu-danger); opacity: 1; }\r\n\r\n/* Buttons */\r\n.ssu-btn {\r\n  font: inherit;\r\n  font-size: 13px;\r\n  padding: 8px 16px;\r\n  border-radius: 7px;\r\n  border: 1px solid transparent;\r\n  cursor: pointer;\r\n  background: #e8ebf0;\r\n  color: var(--ssu-ink);\r\n}\r\n.ssu-btn:hover { filter: brightness(.97); }\r\n.ssu-btn-primary { background: var(--ssu-accent); color: #fff; }\r\n.ssu-btn-primary:hover { background: var(--ssu-accent-strong); filter: none; }\r\n.ssu-btn-outline { background: #fff; border-color: var(--ssu-accent); color: var(--ssu-accent-strong); }\r\n.ssu-btn-ghost { background: transparent; border-color: var(--ssu-line); }\r\n.ssu-btn-danger { background: transparent; border-color: #e6c3c3; color: var(--ssu-danger); }\r\n.ssu-btn-sm { padding: 4px 10px; font-size: 12px; }\r\n.ssu-btn:disabled { opacity: .5; cursor: default; }\r\n\r\n/* Overview map */\r\n.ssu-map-list { display: flex; flex-direction: column; gap: 8px; }\r\n.ssu-map-row {\r\n  display: grid;\r\n  grid-template-columns: 120px 1fr;\r\n  gap: 12px;\r\n  align-items: start;\r\n  font-size: 13px;\r\n  line-height: 1.5;\r\n  color: var(--ssu-muted);\r\n  border-top: 1px dashed var(--ssu-line);\r\n  padding-top: 8px;\r\n}\r\n.ssu-map-row:first-child { border-top: none; padding-top: 0; }\r\n.ssu-map-tab { font-weight: 600; color: var(--ssu-ink); }\r\n\r\n/* Class groups */\r\n.ssu-add-row { display: flex; gap: 10px; margin-bottom: 14px; }\r\n.ssu-add-row .ssu-input { flex: 1; }\r\n.ssu-class-list { display: flex; flex-direction: column; gap: 12px; }\r\n.ssu-class-card { border: 1px solid var(--ssu-line); border-radius: 10px; padding: 12px 14px; background: #fbfcfe; }\r\n.ssu-class-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }\r\n.ssu-class-name { font-weight: 600; font-size: 14px; }\r\n.ssu-level-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\r\n.ssu-level-chip {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  background: #fff;\r\n  border: 1px solid var(--ssu-line);\r\n  border-radius: 18px;\r\n  padding: 6px 8px 6px 14px;\r\n  font-size: 13px;\r\n  box-shadow: 0 1px 2px rgba(31, 36, 48, .05);\r\n}\r\n.ssu-level-chip .ssu-group-remove { margin-left: 2px; }\r\n.ssu-level-add { display: flex; gap: 6px; }\r\n.ssu-level-input { width: 170px; }\r\n.ssu-group-remove {\r\n  border: none;\r\n  background: #eef0f4;\r\n  color: var(--ssu-muted);\r\n  width: 20px;\r\n  height: 20px;\r\n  border-radius: 50%;\r\n  cursor: pointer;\r\n  font-size: 13px;\r\n  line-height: 1;\r\n}\r\n.ssu-group-remove:hover { background: #f6dcdc; color: var(--ssu-danger); }\r\n.ssu-empty { color: var(--ssu-muted); font-size: 13px; padding: 10px 2px; }\r\n\r\n/* Payment brackets */\r\n.ssu-bracket-head, .ssu-bracket-row {\r\n  display: grid;\r\n  grid-template-columns: 1.2fr 1fr 1fr 72px;\r\n  gap: 10px;\r\n  align-items: center;\r\n}\r\n.ssu-bracket-row .ssu-btn-sm { white-space: nowrap; padding: 4px 8px; }\r\n.ssu-bracket-head { font-size: 11px; color: var(--ssu-muted); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }\r\n.ssu-bracket-row { margin-bottom: 8px; }\r\n.ssu-bracket-price {\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  color: var(--ssu-accent-strong);\r\n  white-space: nowrap;\r\n}\r\n.ssu-bracket-price.discounted { color: var(--ssu-danger); text-decoration: line-through; opacity: .8; }\r\n.ssu-bracket-price.both { display: flex; flex-direction: column; line-height: 1.3; }\r\n\r\n/* Lessons */\r\n.ssu-lesson-card {\r\n  border: 1px solid var(--ssu-line);\r\n  border-radius: 10px;\r\n  padding: 12px 14px;\r\n  background: #fbfcfe;\r\n  margin-bottom: 10px;\r\n}\r\n.ssu-lesson-card:last-child { margin-bottom: 0; }\r\n.ssu-lesson-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }\r\n.ssu-lesson-name { font-weight: 600; font-size: 14px; }\r\n.ssu-lesson-meta { font-size: 12px; color: var(--ssu-muted); line-height: 1.5; margin-top: 2px; }\r\n.ssu-lesson-badges { display: flex; gap: 6px; flex-wrap: wrap; }\r\n.ssu-lesson-actions { display: flex; gap: 6px; }\r\n.ssu-lesson-levels { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\r\n.ssu-pill {\r\n  display: inline-block;\r\n  padding: 2px 9px;\r\n  border-radius: 11px;\r\n  font-size: 11px;\r\n  background: var(--ssu-accent-soft);\r\n  color: var(--ssu-accent-strong);\r\n}\r\n.ssu-pill.warn { background: #fdf0d5; color: #8a5a00; }\r\n.ssu-pill.muted { background: #eef0f4; color: var(--ssu-muted); }\r\n\r\n/* Folders */\r\n.ssu-folder-head, .ssu-folder-row {\r\n  display: grid;\r\n  grid-template-columns: 170px 1fr 1.3fr;\r\n  gap: 12px;\r\n  align-items: center;\r\n}\r\n.ssu-folder-head { font-size: 11px; color: var(--ssu-muted); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }\r\n.ssu-folder-row { padding: 8px 0; border-top: 1px solid var(--ssu-line); }\r\n.ssu-folder-row:first-of-type { border-top: none; }\r\n.ssu-folder-name { font-weight: 600; font-size: 13px; }\r\n.ssu-folder-desc { font-size: 12px; color: var(--ssu-muted); line-height: 1.45; }\r\n.ssu-folder-id { font-family: \"Cascadia Code\", Consolas, monospace; font-size: 12px; }\r\n.ssu-folder-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }\r\n\r\n/* Modal */\r\n.ssu-modal-overlay {\r\n  position: fixed;\r\n  inset: 0;\r\n  background: rgba(15, 23, 42, .45);\r\n  display: none;\r\n  align-items: flex-start;\r\n  justify-content: center;\r\n  padding: 40px 16px;\r\n  z-index: 80;\r\n  overflow-y: auto;\r\n}\r\n.ssu-modal-overlay.open { display: flex; }\r\n.ssu-modal {\r\n  background: #fff;\r\n  border-radius: 10px;\r\n  width: 100%;\r\n  max-width: 640px;\r\n  box-shadow: 0 10px 34px rgba(15, 23, 42, .25);\r\n}\r\n.ssu-modal-title { padding: 14px 18px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--ssu-line); }\r\n.ssu-modal-body { padding: 16px 18px; }\r\n.ssu-modal-body p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; }\r\n.ssu-confirm-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }\r\n.ssu-confirm-table td { padding: 6px 8px; border-top: 1px solid var(--ssu-line); }\r\n.ssu-confirm-table td:first-child { width: 150px; }\r\n.ssu-confirm-table .ssu-confirm-arrow { color: var(--ssu-muted); white-space: nowrap; width: 30px; }\r\n.ssu-confirm-table td:last-child { font-family: \"Cascadia Code\", Consolas, monospace; font-size: 12px; word-break: break-all; }\r\n.ssu-modal-foot { padding: 12px 18px; border-top: 1px solid var(--ssu-line); display: flex; justify-content: flex-end; gap: 8px; }\r\n\r\n@media (max-width: 760px) {\r\n  .ssu-grid-3, .ssu-grid-2 { grid-template-columns: 1fr; }\r\n  .ssu-lesson-row, .ssu-bracket-row, .ssu-folder-row { grid-template-columns: 1fr; }\r\n  .ssu-bracket-head, .ssu-folder-head { display: none; }\r\n  .ssu-map-row { grid-template-columns: 1fr; }\r\n}\r\n"},"js":{"name":"SchoolSetup.js","src":"../app/SchoolSetup.js","content":"/* SchoolSetup - reusable school settings tool for the UniconHub CMS.\r\n   One tool per school year, placed on the school settings object.\r\n   Tabs: Overview, Class Groups, Payments, Lessons, Folders. */\r\n(function () {\r\n  \"use strict\";\r\n\r\n  /* SDK handle + fallback shim */\r\n  var tool = (typeof window !== \"undefined\" && window.tool) ? window.tool : null;\r\n  if (!tool) {\r\n    var _shimValue = null;\r\n    tool = {\r\n      onReady: function (cb) { cb(_shimValue, {}); },\r\n      getValue: function () { return _shimValue; },\r\n      setValue: function (v) { _shimValue = v; },\r\n      onValueChange: function () { },\r\n      getFields: function () { return {}; },\r\n      param: function (n, d) { return d; },\r\n      isReadOnly: function () { return false; },\r\n      onReadonlyChange: function () { },\r\n      getUser: function () { return null; },\r\n      onUserChange: function () { },\r\n      requestSave: function () { },\r\n      requestObjects: function () { },\r\n      notify: function (m) { try { console.log(\"notify:\", m); } catch (e) { } },\r\n      resize: function () { },\r\n      declareOutput: function () { },\r\n      declareParams: function () { },\r\n      reportMissingParams: function () { }\r\n    };\r\n  }\r\n\r\n  /* Helpers */\r\n  function $(s, r)
