<!-- MOCK TOOL SDK -->
<script>
(function() {
  var STORAGE_KEY = 'egitim_sunumu_test_db';
  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [] };
  var _readOnly = false;
  var _user = { id: 'user-1', name: 'Test Kullanıcı', email: 'test@example.org', roles: ['editor'], locale: 'tr' };
  var _fields = {};
  var _value = null;

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch(e) { _value = null; }
  }
  function save(v) {
    _value = v;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch(e) {}
  }

  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { save(data); listeners.valueChange.forEach(function(cb) { try { cb(data); } catch(e) {} }); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },

    getFields: function() { return Object.assign({}, _fields); },
    setField: function(id, value) { _fields[id] = value; },
    setFields: function(obj) { Object.assign(_fields, obj); },
    watchField: function(id, cb) { listeners.fieldsChange.push(cb); },
    onFieldsChange: function(cb) { listeners.fieldsChange.push(cb); },

    param: function(name, fallback) {
      var p = (new URLSearchParams(window.location.search)).get(name);
      return p !== null && p !== '' ? p : fallback;
    },

    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    _setReadOnly: function(v) {
      _readOnly = !!v;
      listeners.readonlyChange.forEach(function(cb) { try { cb(v); } catch(e) {} });
      document.getElementById('th-status').textContent = _readOnly ? 'SALT OKUNUR MOD' : 'DÜZENLEME MODU';
    },

    getUser: function() { return _user; },
    onUserChange: function(cb) { listeners.userChange.push(cb); },

    getPermittedUsers: function() { return [
      { id: 'user-1', name: 'Test Kullanıcı', email: 'test@example.org', roles: ['editor'] },
      { id: 'user-2', name: 'Ayşe Yılmaz', email: 'ayse@example.org', roles: ['viewer'] },
      { id: 'user-3', name: 'Mehmet Demir', email: 'mehmet@example.org', roles: ['editor'] }
    ]; },
    onPermittedUsersChange: function(cb) { /* no-op for test */ },

    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#0d9488', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 2500);
    },
    resize: function() {},

    declareOutput: function() {},
    declareParams: function() {},

    onReady: function(cb) {
      load();
      cb(_value, _fields);
    },

    /* Test helpers */
    _loadSampleData: function() {
      save({ currentSlide: 5 }); /* Slide 6: Kayıt & Sınav Süreci */
      window.location.reload();
    },
    _clearData: function() {
      localStorage.removeItem(STORAGE_KEY);
      window.location.reload();
    },
    _toggleReadOnly: function() {
      this._setReadOnly(!_readOnly);
    },
    _dump: function() {
      console.log('📊 Eğitim Sunumu DB:', JSON.parse(JSON.stringify(_value)));
      console.log('📋 Mevcut Slide:', _value ? _value.currentSlide : '(yok)');
    },

    /* Async channel mocks (no-ops for presentation) */
    requestAI: function(prompt, context, callback) {
      console.log('[MOCK AI] Prompt:', prompt.slice(0, 80) + '...');
      setTimeout(function() { callback(null, 'AI yanıtı (mock)'); }, 300);
    },
    requestUpload: function(accept, callback) {
      var mockFile = { name: 'test.pdf', url: 'https://example.org/mock/test.pdf', size: 102400, type: 'application/pdf' };
      setTimeout(function() { callback(null, mockFile); }, 300);
    },
    requestFileContent: function(url, callback) {
      setTimeout(function() { callback(null, 'Mock dosya içeriği...'); }, 300);
    },
    requestExportPdf: function(options, callback) {
      var mockFile = { name: (options.filename || 'export') + '.html', url: 'https://example.org/mock/export.html', size: 5000, type: 'text/html' };
      setTimeout(function() { callback(null, mockFile); }, 300);
    },
    requestSendEmail: function(options, callback) {
      console.log('[MOCK EMAIL] To:', options.to, 'Subject:', options.subject);
      setTimeout(function() { callback(null, { ok: true }); }, 300);
    },
    requestObjects: function(action, params, callback) {
      console.log('[MOCK CRUD]', action, params.mainObjectType);
      setTimeout(function() { callback(null, { objects: [], ok: true }); }, 200);
    }
  };

  /* Keyboard shortcuts */
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') {
      e.preventDefault();
      window.tool._toggleReadOnly();
      window.tool.notify(window.tool.isReadOnly() ? 'SALT OKUNUR MOD' : 'DÜZENLEME MODU', 'info');
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'D') {
      e.preventDefault();
      window.tool._dump();
      window.tool.notify('DB konsola yazıldı', 'info');
    }
  });
})();
</script>

          '<div class="accordion-item open"><div class="accordion-header" data-toggle="acc-reg"><span>📝 Kayıt Aşaması</span><span class="acc-arrow">▾</span></div><div class="accordion-body" id="acc-reg"><ul class="detail-list"><li><strong>Kayıt Paketi:</strong> Form, kayıt sayfası, broşür ve WhatsApp mesajları paket halinde hazırlanıp herkese gönderilecek.</li><li><strong>Kayıt Formu:</strong> Adres dahil tüm bilgilerin düzenli toplanması</li><li><strong>Tanıtım:</strong> Kayıt formları ve broşürlerin WhatsApp gruplarında birkaç defa paylaşılması</li><li><strong>Kayıt Emaili:</strong> Sistem üzerinden kayıtlı tüm öğrencilere email gönderilmesi</li><li><strong>Hatırlatma Mesajları:</strong> Standart formatlarda WhatsApp\'tan gönderilmesi</li><li><strong>Öğrenci Kayıtları:</strong> Sisteme kayıt ve bilgi güncellemesi</li></ul></div></div>' +
          '<div class="accordion-item"><div class="accordion-header" data-toggle="acc-exam"><span>🧪 Sınav Aşaması</span><span class="acc-arrow">▸</span></div><div class="accordion-body" id="acc-exam" style="display:none"><ul class="detail-list"><li><strong>Son Hatırlatma Emaili:</strong> Sınavdan bir gece önce hatırlatma</li><li><strong>Fotoğraf:</strong> Sınav sırasında sınıfın arkadan 1-2 fotoğrafı çekilerek gruplarda paylaşılması (şehir veli grubu + School Advisory Group)</li></ul></div></div>' +
          '<div class="accordion-item"><div class="accordion-header" data-toggle="acc-post"><span>📊 Sınav Sonrası</span><span class="acc-arrow">▸</span></div><div class="accordion-body" id="acc-post" style="display:none"><ul class="detail-list"><li><strong>Yeni Öğrenci Kaydı:</strong> Sistemde kaydı olmayan öğrencilerin eklenmesi</li><li><strong>Sınavların Okunması:</strong> Sonuçların öğrenci kaydı altına girilmesi</li><li><strong>Sonuç Emaili:</strong> Veli ve öğrenci emaillerine gönderilmesi</li><li><strong>Email Güncellemeleri:</strong> Hatalı emaillerin tespiti ve güncellenmesi</li></ul></div></div>' +
        '</div>' +
      '</div>' +
    '</section>',

    /* 7 - Online Matematik Dersleri */
    '<section class="slide" data-slide="7">' +
      '<div class="slide-header"><span class="slide-num">07</span><h2>Online Matematik Dersleri</h2><p class="slide-tagline">Her grade için haftalık online dersler ile sürekli akademik destek</p></div>' +
      '<div class="slide-body">' +
        '<div class="phase-timeline"><div class="phase-step"><div class="phase-dot">1</div><div class="phase-label">Planlama</div></div><div class="phase-line"></div><div class="phase-step"><div class="phase-dot">2</div><div class="phase-label">Ders Öncesi</div></div><div class="phase-line"></div><div class="phase-step"><div class="phase-dot">3</div><div class="phase-label">Ders Sırası</div></div><div class="phase-line"></div><div class="phase-step"><div class="phase-dot">4</div><div class="phase-label">Ders Sonrası</div></div></div>' +
        '<div class="accordion">' +
          '<div class="accordion-item open"><div class="accordion-header" data-toggle="acc-plan"><span>📅 Planlama</span><span class="acc-arrow">▾</span></div><div class="accordion-body" id="acc-plan"><ul class="detail-list"><li><strong>Takvim Planı:</strong> Ders takviminin düzenli şekilde planlanması</li><li><strong>Takvimi Paylaşma:</strong> Haftalık takvimin WhatsApp gruplarında paylaşılması</li><li><strong>Öğretmen Yetiştirme:</strong> 2 haftada bir zümre, sorumlu belirlenecek</li><li><strong>Grade 10:</strong> Ömer abi zümreleri yapacak</li></ul></div></div>' +
          '<div class="accordion-item"><div class="accordion-header" data-toggle="acc-pre"><span>⏰ Ders Öncesi</span><span class="acc-arrow">▸</span></div><div class="accordion-body" id="acc-pre" style="display:none"><ul class="detail-list"><li><strong>Erken Hatırlatma:</strong> Her dersten 15-30 dk önce standart mesaj</li><li><strong>Başlama Mesajı:</strong> Ders başladığı anda standart format mesajı</li></ul></div></div>' +
          '<div class="accordion-item"><div class="accordion-header" data-toggle="acc-during"><span>💻 Ders Sırasında</span><span class="acc-arrow">▸</span></div><div class="accordion-body" id="acc-during" style="display:none"><ul class="detail-list"><li><strong>Platform:</strong> Zoom veya Teams</li><li><strong>Ücretli Yazılım:</strong> Süresiz program, 45 dk free ile ders yapılmayacak</li><li><strong>Kolay Giriş:</strong> Login istemeyecek</li><li><strong>Öğretmen Yetkinliği:</strong> Aracı iyi kullanacak</li></ul></div></div>' +
          '<div class="accordion-item"><div class="accordion-header" data-toggle="acc-post2"><span>📤 Ders Sonrası</span><span class="acc-arrow">▸</span></div><div class="accordion-body" id="acc-post2" style="display:none"><ul class="detail-list"><li><strong>Ödev Gönderme:</strong> Mümkünse IXL, değilse PDF</li><li><strong>Ödev Takibi:</strong> Bitirenin işaretleyebileceği kolay sistem</li></ul></div></div>' +
        '</div>' +
      '</div>' +
    '</section>',

    /* 8 - Burs Semineri */
    '<section class="slide" data-slide="8">' +
      '<div class="slide-header"><span class="slide-num">08</span><h2>Burs Semineri</h2><p class="slide-tagline">Aylık online burs semineri ile öğrencilere finansal fırsatlar</p></div>' +
      '<div class="slide-body">' +
        '<div class="card"><div class="card-header"><span class="card-icon">💰</span>Seminer Formatı</div><div class="card-body"><ul class="detail-list"><li><strong>Ayda bir</strong> online burs semineri (Zoom)</li><li>Bir sonraki ay başvurulabilecek <strong>bursların listesi</strong> hazırlanır</li><li>Tüm katılımcılara Zoom üzerinden anlatım</li><li>Sunum dosyası <strong>sadece katılanlara</strong> Zoom chat üzerinden verilir</li></ul></div></div>' +
        '<div class="card accent"><div class="card-header"><span class="card-icon">🔒</span>Gelecek Planı</div><div class="card-body"><p>Sunumu sadece katılımcılarla sınırlamak için, ileride <strong>yazılımsal mekanizma</strong> ile içerik koruması düşünülmektedir.</p></div></div>' +
      '</div>' +
    '</section>',

    /* 9 - Üniversite & Kariyer */
    '<section class="slide" data-slide="9">' +
      '<div class="slide-header"><span class="slide-num">09</span><h2>Üniversite & Kariyer Seminerleri</h2><p class="slide-tagline">Mesleklerinde aktif çalışan veya o bölüme girmiş kişilerden ilham verici sunumlar</p></div>' +
      '<div class="slide-body">' +
        '<div class="card"><div class="card-header"><span class="card-icon">🎯</span>Hedef Kitle</div><div class="card-body"><p>Grade 10\'dan 30 yaşa kadar. Mesleklerinde aktif çalışan profesyoneller veya üniversitede o bölüme girebilmiş öğrenciler tecrübelerini paylaşacak.</p></div></div>' +
        '<div class="card"><div class="card-header"><span class="card-icon">🏥</span>Hedef Meslek Grupları</div><div class="card-body"><div class="career-grid"><div class="career-item"><span class="career-icon">🩺</span>Medicine</div><div class="career-item"><span class="career-icon">🏥</span>Nursing</div><div class="career-item"><span class="career-icon">💻</span>Software Engineering</div><div class="career-item"><span class="career-icon">🏗️</span>Engineering</div><div class="career-item"><span class="career-icon">📊</span>CPA / Accounting</div><div class="career-item"><span class="career-icon">🔧</span>Skilled Trades</div><div class="career-item"><span class="career-icon">⚖️</span>Law</div><div class="career-item"><span class="career-icon">🤖</span>Data / AI</div></div></div></div>' +
        '<div class="info-box"><strong>🔍 İhtiyaç:</strong> Bu mesleklerin uzmanlarını veya o bölümlere girmiş öğrencileri bulup sunum yaptırmamız gerekiyor.</div>' +
      '</div>' +
    '</section>',

    /* 10 - Makale Yarışmaları */
    '<section class="slide" data-slide="10">' +
      '<div class="slide-header"><span class="slide-num">10</span><h2>Makale Yarışmaları</h2><p class="slide-tagline">Her ay yazma becerilerini geliştiren makale yarışmalarına katılım</p></div>' +
      '<div class="slide-body">' +
        '<div class="card"><div class="card-header"><span class="card-icon">✍️</span>Yarışma Sistemi</div><div class="card-body"><ul class="detail-list"><li>Her ay herkesin bir makale yarışmasına yazı göndermesi teşvik edilecek</li><li>Özel <strong>WhatsApp grubu</strong> üzerinden takip</li><li>Yazı gönderenler bizi haberdar edecek</li></ul></div></div>' +
        '<div class="card accent"><div class="card-header"><span class="card-icon">💡</span>Geliştirme Fikirleri</div><div class="card-body"><ul class="detail-list"><li>Yazı yazma <strong>workshop\'ları</strong></li><li>Teşvik mekanizmaları</li><li>Grade 4\'ten üniversite sona kadar</li><li>Başarılı yazıların ödüllendirilmesi</li></ul></div></div>' +
      '</div>' +
    '</section>',

    /* 11 - Drone Pilot Kulübü */
    '<section class="slide" data-slide="11">' +
      '<div class="slide-header"><span class="slide-num">11</span><h2>Drone Pilot License Kulübü</h2><p class="slide-tagline">Kanada\'da drone uçurma lisansı için eğitim ve topluluk</p></div>' +
      '<div class="slide-body"><div class="card"><div class="card-header"><span class="card-icon">🚁</span>Kulüp Amacı</div><div class="card-body"><p>Kanada\'da drone uçurma lisansı almaları için bir kulüp kurulacak.</p><ul class="detail-list"><li>İyi bir <strong>hobi</strong> edinme fırsatı</li><li>Geleceğe dair bir <strong>meslek</strong> öğrenme imkanı</li><li>Drone teknolojisi büyüyen bir sektör</li><li>Transport Canada lisanslama sürecine hazırlık</li></ul></div></div></div>' +
    '</section>',

    /* 12 - Müfredat Bazlı Takip */
    '<section class="slide" data-slide="12">' +
      '<div class="slide-header"><span class="slide-num">12</span><h2>Müfredat Bazlı Kişisel Takip Eğitimi</h2><p class="slide-tagline">Cohort bazlı ve okul derslerine paralel birebir eğitim takibi</p></div>' +
      '<div class="slide-body">' +
        '<div class="two-col">' +
          '<div class="card"><div class="card-header"><span class="card-icon">👥</span>Cohort Bazlı Eğitim</div><div class="card-body"><p>Harici konularda (örn. drone) uzun müfredatlı eğitim içerikleri. Öğrenciler cohort\'lar halinde kaydolup, mentorler adım adım içerik gönderecek ve çalışmaları takip edecek.</p></div></div>' +
          '<div class="card"><div class="card-header"><span class="card-icon">🏫</span>Okul Derslerine Paralel</div><div class="card-body"><p>Örn. Math 9 alan öğrenci kaydedilecek, dönem boyunca dersine paralel içerikler gönderilecek, okul derslerinin yüksek olması takip edilecek.</p></div></div>' +
        '</div>' +
        '<div class="card accent"><div class="card-header"><span class="card-icon">🔥</span>Motivasyon & Katılım</div><div class="card-body"><p>Bu sistem <strong>birebir ilgi</strong> ile çalışacak. Liderlik tablosu, rozet sistemi, cohort içi rekabet gibi mekanizmalar değerlendirilebilir.</p></div></div>' +
      '</div>' +
    '</section>',

    /* 13 - Mentor Sistemi */
    '<section class="slide" data-slide="13">' +
      '<div class="slide-header"><span class="slide-num">13</span><h2>Mentor Sistemi</h2><p class="slide-tagline">Her öğrenciye birebir akademik takip sağlayan mentor ağı</p></div>' +
      '<div class="slide-body">' +
        '<div class="card"><div class="card-header"><span class="card-icon">🧑‍🏫</span>Mentor Görevleri</div><div class="card-body"><ul class="detail-list"><li>Öğrencinin okul derslerinin haftalık takibi</li><li>Müfredat paralelinde içerik gönderimi</li><li>Ödev ve çalışma takibi</li><li>Öğrenci gelişim raporlaması</li><li>Veli ile düzenli iletişim</li></ul></div></div>' +
        '<div class="card accent"><div class="card-header"><span class="card-icon">💼</span>Mentor Modeli</div><div class="card-body"><ul class="detail-list"><li>Mentorler bize <strong>kayıt olmalı</strong></li><li><strong>Gönüllü</strong> veya <strong>ücretli</strong> olabilir</li><li>Ücretli olacaksa hangi level\'dan itibaren belirlenmeli</li><li>Mentor eğitimi ve sertifikasyon programı düşünülebilir</li></ul></div></div>' +
      '</div>' +
    '</section>',

    /* 14 - Yıllık Takvim */
    '<section class="slide" data-slide="14">' +
      '<div class="slide-header"><span class="slide-num">14</span><h2>Yıllık Takvim Uygulaması</h2><p class="slide-tagline">Tüm faaliyetlerin birleştirildiği, filtrelenebilir merkezi takvim</p></div>' +
      '<div class="slide-body">' +
        '<div class="card"><div class="card-header"><span class="card-icon">📅</span>Takvim Özellikleri</div><div class="card-body"><ul class="detail-list"><li>Tüm faaliyetlerin listesine erişim</li><li>Kendileri ile alakalı olmayanları <strong>filtreleyebilme</strong></li><li>Şehir, grade, program türü bazlı filtreleme</li></ul></div></div>' +
        '<div class="info-box"><strong>ℹ️ Not:</strong> Takvim uygulaması şimdi yapılmayacak — bu sunumda açıklaması yer almaktadır. Ayrı bir proje olarak ele alınacak.</div>' +
      '</div>' +
    '</section>',

    /* 15 - Başarılı Öğrenciler */
    '<section class="slide" data-slide="15">' +
      '<div class="slide-header"><span class="slide-num">15</span><h2>Başarılı Öğrenci Sunumları</h2><p class="slide-tagline">Rol model öğrencilerin ilham verici başarı hikayeleri</p></div>' +
      '<div class="slide-body">' +
        '<div class="card"><div class="card-header"><span class="card-icon">🌟</span>Sunum Yapacak Profiller</div><div class="card-body"><div class="profile-grid"><div class="profile-item">🎓 Üniversite bitirmiş</div><div class="profile-item">📖 Üniversite okuyan</div><div class="profile-item">✅ Kabul almış</div><div class="profile-item">💰 Burs bulmuş</div><div class="profile-item">🌍 IB\'ye kabul almış / okuyor / bitirmiş</div><div class="profile-item">🔧 TRADES alanına gitmiş</div><div class="profile-item">⭐ Çıraklık / ustalık yolunda veya tamamlamış</div></div></div></div>' +
        '<div class="info-box"><strong>🎯 Amaç:</strong> Öğrencilerin kendi seviyelerinden rol modeller görmesini sağlamak, "ben de yapabilirim" duygusunu aşılamak.</div>' +
      '</div>' +
    '</section>',

    /* 16 - TRADES & College */
    '<section class="slide" data-slide="16">' +
      '<div class="slide-header"><span class="slide-num">16</span><h2>TRADES & College Programları</h2><p class="slide-tagline">Üniversite dışı kariyer yolları için yapılandırılmış rehberlik</p></div>' +
      '<div class="slide-body">' +
        '<div class="two-col">' +
          '<div class="card"><div class="card-header"><span class="card-icon">🔧</span>TRADES Alanı</div><div class="card-body"><p>Üniversite okumayacak olanlara meslek edinmeleri için mentorluk, meslek tanıtım sunumları, çıraklık ve ustalık yol haritası. TRADES başlı başına bir konu!</p></div></div>' +
          '<div class="card"><div class="card-header"><span class="card-icon">🏛️</span>College Programı</div><div class="card-body"><p>BCIT, JIBC gibi okullardan direk meslek edinme. College başvuru süreci rehberliği, bölüm seçimi danışmanlığı, mezuniyet sonrası iş imkanları.</p></div></div>' +
        '</div>' +
      '</div>' +
    '</section>',

    /* 17 - Finansman Modeli */
    '<section class="slide" data-slide="17">' +
      '<div class="slide-header"><span class="slide-num">17</span><h2>Sürdürülebilirlik & Finansman Modeli</h2><p class="slide-tagline">Charity\'den sürdürülebilir modele geçiş stratejisi</p></div>' +
      '<div class="slide-body">' +
        '<div class="card"><div class="card-header"><span class="card-icon">❤️</span>Öncelikli Model: Charity</div><div class="card-body"><p>Tüm faaliyetler <strong>öncelikle charity faaliyeti ve ücretsiz</strong> olarak planlanmaktadır. Topluma hizmet ve eğitimde fırsat eşitliği temel amaçtır.</p></div></div>' +
        '<div class="card accent"><div class="card-header"><span class="card-icon">⚖️</span>Sürdürülebilirlik Tartışmaları</div><div class="card-body"><div class="funding-grid"><div class="funding-option"><div class="funding-icon">💰</div><div class="funding-title">Ücretli Hizmet</div><div class="funding-desc">Bazı hizmetler ücretli olabilir. Hangi hizmetlerin ücretli olacağı tartışılmalı.</div></div><div class="funding-option"><div class="funding-icon">📝</div><div class="funding-title">Grant Desteği</div><div class="funding-desc">Ücretler grant bulunursa buradan karşılanabilir.</div></div><div class="funding-option"><div class="funding-icon">🤝</div><div class="funding-title">Karma Model</div><div class="funding-desc">Temel hizmetler ücretsiz, premium ücretli. Gönüllü + ücretli mentor karma sistemi.</div></div></div></div></div>' +
      '</div>' +
    '</section>'
  ];

  return slides.join('');
}
