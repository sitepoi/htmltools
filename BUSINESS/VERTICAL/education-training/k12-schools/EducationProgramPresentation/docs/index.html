ale yarışmaları, drone pilot lisansı<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div>\r\n      <div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li><strong>Burs Semineri:<\/strong> Aylık online — başvurulabilecek bursların listesi ve anlatımı<\/li><li><strong>Üniversite & Kariyer:<\/strong> 8 farklı meslek grubunda profesyonellerden sunumlar<\/li><li><strong>Makale Yarışmaları:<\/strong> Her ay yazma becerilerini geliştiren yarışmalara katılım<\/li><li><strong>Drone Pilot Kulübü:<\/strong> Kanada'da drone lisansı için eğitim ve topluluk<\/li><\/ul><\/div><\/div>\r\n    <\/div>\r\n    <div class=\"pres-card\">\r\n      <div class=\"pres-card-front\"><div class=\"pres-card-icon\">🤝<\/div><div class=\"pres-card-title\">Topluluk<\/div><div class=\"pres-card-desc\">Mentor sistemi, başarılı öğrenci sunumları, TRADES & College programları<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div>\r\n      <div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li><strong>Mentor Sistemi:<\/strong> Birebir akademik takip sağlayan gönüllü/ücretli mentor ağı<\/li><li><strong>Başarılı Öğrenciler:<\/strong> Rol model öğrencilerin ilham verici başarı hikayeleri<\/li><li><strong>TRADES Programı:<\/strong> Üniversite dışı mesleki kariyer için mentorluk ve rehberlik<\/li><li><strong>College Programı:<\/strong> BCIT, JIBC gibi okullardan direk meslek edinme desteği<\/li><li><strong>Yıllık Takvim:<\/strong> Tüm faaliyetlerin filtrelenebilir merkezi takvimi<\/li><\/ul><\/div><\/div>\r\n    <\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n<!-- ═══ SLIDE 1 ═══ -->\r\n<section class=\"slide\" data-slide=\"1\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">🏙️<\/div><h2 class=\"pres-title\">Şube Yapılanması & Partner Sorumlulukları<\/h2><p class=\"pres-sub\">Her şehirde standardize operasyon, yazılım kullanımı ve büyüme beklentileri<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n on>\r\n\r\n<!-- ═══ SLIDE 2 ═══ -->\r\n<section class=\"slide\" data-slide=\"2\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">💬<\/div><h2 class=\"pres-title\">WhatsApp — Organizasyonun Bel Kemiği<\/h2><p class=\"pres-sub\">Tüm duyuru, etkinlik ve büyüme WhatsApp grupları üzerinden yürütülür. En kritik iletişim kanalıdır.<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n    <div class=\"pres-card\">\r\n      <div class=\"pres-card-front\"><div class=\"pres-card-icon\">👨‍👩‍👧‍👦<\/div><div class=\"pres-card-title\">Veli WhatsApp Grubu<\/div><div class=\"pres-card-desc\">Her şehir için tek toplu veli grubu — society bağlantıları ile sürekli büyütme<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div>\r\n      <div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><div class=\"emphasis-banner\"><strong>⚠️ Kritik:<\/strong> Tüm organizasyonel duyurular <strong>sadece WhatsApp grupları<\/strong> üzerinden yapılır. Başka bir kanalımız bulunmamaktadır. Her partnerimiz kendi şehrimizin grubunu yönetir ve büyütür.<\/div><p>Her şehir için <strong>tek bir toplu veli WhatsApp grubu<\/strong>:<\/p><ul class=\"detail-list\"><li>Şehir bazlı — her şehir için bir grup<\/li><li>Tüm duyuru ve bilgilendirmelerin <strong>tek ve birincil<\/strong> kanalı<\/li><li>Veli katılımı hedeflenmektedir<\/li><li><strong>Society bağlantıları<\/strong> kullanılarak grubun sürekli büyütülmesi<\/li><li>Etkinlik fotoğrafları bu grupta paylaşılır<\/li><li>Burs, sınav, kamp duyurularının ilk paylaşım noktası<\/li><\/ul><\/div><\/div>\r\n    <\/div>\r\n    <div class=\"pres-card\">\r\n      <div class=\"pres-card-front\"><div class=\"pres-card-icon\">🎒<\/div><div class=\"pres-card-title\">Grade WhatsApp Grupları<\/div><div class=\"pres-card-desc\">Grade 5'ten 12'ye her sınıf seviyesi için ayrı öğrenci grubu<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div>\r\n      <div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><p>Her sınıf seviyesi iç rong>CEMC<\/strong> sınavlarına hazırlık:<\/p><ul class=\"detail-list\"><li><strong>Ayda bir<\/strong> deneme sınavı<\/li><li>Her sınavda düzenli kayıt alınması<\/li><li>Sonuçların öğrenci kaydı altında biriktirilmesi<\/li><li>Zaman içinde gelişim takibi<\/li><li>Pascal (G9), Cayley (G10), Fermat (G11) kategorileri<\/li><\/ul><\/div><\/div><\/div>\r\n    <div class=\"pres-card accent\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">📊<\/div><div class=\"pres-card-title\">Hedef & Ölçüm<\/div><div class=\"pres-card-desc\">CEMC başarısı ile prestijli üniversitelere kabul şansını artırma<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li>Waterloo ve prestijli okullara kabul şansını artırma<\/li><li>Matematik becerilerini uluslararası standartlarda ölçme<\/li><li>Her deneme sınavında ilerlemeyi grafiksel takip<\/li><li>Zayıf alanları tespit edip hedefe yönelik çalışma<\/li><li>CEMC sertifikaları ile özgeçmiş güçlendirme<\/li><\/ul><\/div><\/div><\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n<!-- ═══ SLIDE 5 ═══ -->\r\n<section class=\"slide\" data-slide=\"5\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">🏕️<\/div><h2 class=\"pres-title\">CEMC Matematik Kampı<\/h2><p class=\"pres-sub\">Gerçek sınav öncesi şehirlerde yoğunlaştırılmış tam gün kamp<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">📅<\/div><div class=\"pres-card-title\">Kamp Formatı<\/div><div class=\"pres-card-desc\">Grade 7-8 ve 9-10 için ayrı günlerde tam gün yoğun program<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><p>CEMC gerçek sınavlarından önce <strong>her şehirdeki şube<\/strong> tam gün kamp düzenleyecek.<\/p><div class=\"camp-days\"><div class=\"camp-day-card\"><div class=\"camp-day-title\">📅 1. Gün<\/div><div class=\"camp-day-desc\">Grade 7 & 8<\/div><div class=\"camp-day-info\">Pascal sınavına hazırlık<\/div><\/div><div class=\"camp-day-card\"><div class=\"camp-day-title\">📅 2. Gün<\/div><div class=\"camp-day-desc\">Grade 9 & 10<\/div><div class=\"camp-day-info\">Cayley & Fermat hazırlık<\/div><\/div><\/div><ul class=\"detail-list\"><li>Toplam en az <strong>2 gün<\/strong> (yılda)<\/li><li>Tam gün: 10:00 - 16:00<\/li><li>Öğle yemeği ve ikramlar dahil<\/li><\/ul><\/div><\/div><\/div>\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">🧮<\/div><div class=\"pres-card-title\">Kamp İçeriği<\/div><div class=\"pres-card-desc\">Sınav stratejileri, pratik çözüm teknikleri ve deneyimli eğitmenler<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li>CEMC sınav formatına özel strateji eğitimi<\/li><li>Geçmiş yıl sorularının çözümü ve analizi<\/li><li>Zaman yönetimi teknikleri<\/li><li>Pratik çözüm ve kısa yol yöntemleri<\/li><li>Deneyimli eğitmenler eşliğinde birebir destek<\/li><li>Grup çalışması ve akran öğrenmesi<\/li><li>Kamp sonu değerlendirme ve geri bildirim<\/li><\/ul><\/div><\/div><\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n<!-- ═══ SLIDE 6 ═══ -->\r\n<section class=\"slide\" data-slide=\"6\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">📋<\/div><h2 class=\"pres-title\">Kayıt & Sınav Süreci<\/h2><p class=\"pres-sub\">CEMC deneme sınavları için uçtan uca kayıt, sınav ve sonuç yönetimi<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">📝<\/div><div class=\"pres-card-title\">1. Kayıt Aşaması<\/div><div class=\"pres-card-desc\">Paket hazırlık, form dağıtımı, email ve WhatsApp duyuruları<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"> timi:<\/strong> Mentorlerin öğrencilere göndereceği ders takip içerikleri, çalışma programları ve materyaller <strong>yapay zeka ile hazırlanmaktadır.<\/strong> Bu sayede mentorler içerik hazırlama yükünden kurtulur, asıl işlerine odaklanır.<\/div><ul class=\"detail-list\"><li>AI ile kişiselleştirilmiş çalışma planları<\/li><li>Her öğrenci seviyesine uygun otomatik içerik<\/li><li>Mentorlere içerik hazırlama ve görev paylaşımı desteği<\/li><li>AI araçlarının mentorler tarafından kullanımı için eğitim<\/li><\/ul><\/div><\/div><\/div>\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">🤝<\/div><div class=\"pres-card-title\">Gönüllü İhtiyaçları<\/div><div class=\"pres-card-desc\">Her şehirden müfredat ve burs araştırması için gönüllüler<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><div class=\"emphasis-banner\"><strong>🎯 Hedef:<\/strong> Gönüllü sayısını artırmak sadece iş paylaşımı için değil, topluluk büyüklüğünü ve etki alanımızı genişletmek içindir.<\/div><ul class=\"detail-list\"><li><strong>Her şehirden müfredat gönüllüleri:<\/strong> Müfredat üzerinde çalışacak, içerik hazırlayacak gönüllüler<\/li><li><strong>Her şehirden burs gönüllüleri:<\/strong> Burs araştırması yapacak, sunum hazırlayıp sunacak gönüllüler<\/li><li>Gönüllü sayısının artırılması — temel hedeflerimizden biri<\/li><li>Gönüllülere eğitim ve sertifika programı<\/li><\/ul><\/div><\/div><\/div>\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">💼<\/div><div class=\"pres-card-title\">Mentorluk Modeli<\/div><div class=\"pres-card-desc\">Charity kapsamında ücretsiz, harici olarak profesyonel ücretli hizmet<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><p>İki kanallı mentorluk modeli:<\/p><ul class=\"detail-list\"><li><strong>Charity Kanalı:<\/strong> Öğrencilere ücretsiz mentorluk desteği<\/li><li><strong>Profesyonel Kanal:<\/strong> Dışarıya tamamen profesyonel ve ücretli mentorluk hizmeti olarak sunulması<\/li><li>Bu model charity sürdürülebilirliği için gelir oluşturur<\/li><li>Mentorler gönüllü veya ücretli olarak iki kanalda da görev alabilir<\/li><\/ul><\/div><\/div><\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n<!-- ═══ SLIDE 14 ═══ -->\r\n<section class=\"slide\" data-slide=\"14\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">📅<\/div><h2 class=\"pres-title\">Yıllık Takvim Uygulaması<\/h2><p class=\"pres-sub\">Tüm faaliyetlerin birleştiği, kişiselleştirilebilir ve filtrelenebilir merkezi takvim<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">🗓️<\/div><div class=\"pres-card-title\">Takvim Özellikleri<\/div><div class=\"pres-card-desc\">Şehir, grade ve program türü bazlı filtreleme ile kişiselleştirme<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li>Tüm faaliyet listesine öğrenci/veli erişimi<\/li><li>Alakasız etkinlikleri <strong>filtreleyebilme<\/strong><\/li><li>Örn: Grade 5 burs dinlemez, Grade 9 Grade 7 dersine gelmez<\/li><li>Şehir, grade ve program türü bazlı filtre<\/li><li>Takvim aboneliği ve bildirimler<\/li><\/ul><\/div><\/div><\/div>\r\n  <\/div>\r\n  <div class=\"pres-footer-note\">ℹ️ Bu uygulama şimdi yapılmayacak — konsept açıklaması bu sunumda yer almaktadır. Ayrı proje olarak ele alınacak.<\/div>\r\n<\/section>\r\n\r\n<!-- ═══ SLIDE 15 ═══ -->\r\n<section class=\"slide\" data-slide=\"15\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">🌟<\/div><h2 class=\"pres-title\">Başarılı Öğrenci Sunumları<\/h2><p class=\"pres-sub\">Rol model öğrencilerin ilham verici başarı hikayeleri<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">👥<\/div><div class=\"pres-card-title\">Sunum Yapacak 7 Profil<\/div><div class=\"pres-card-desc\">Üniversite bitiren, kabul alan, burs bulan, IB mezunu, tradesperson...<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><div class=\"profile-grid-detail\"><div class=\"profile-item-detail\">🎓 Üniversite bitirmiş<\/div><div class=\"profile-item-detail\">📖 Üniversite okuyan<\/div><div class=\"profile-item-detail\">✅ Kabul almış<\/div><div class=\"profile-item-detail\">💰 Burs bulmuş<\/div><div class=\"profile-item-detail\">🌍 IB'ye kabul / okuyor / bitirmiş<\/div><div class=\"profile-item-detail\">🔧 TRADES alanına gitmiş<\/div><div class=\"profile-item-detail\">⭐ Çıraklık / ustalık yolunda<\/div><\/div><p style=\"margin-top:16px\"><strong>🎯 Amaç:<\/strong> \"Ben de yapabilirim\" duygusunu aşılamak, rol modellerle ilham vermek.<\/p><\/div><\/div><\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n<!-- ═══ SLIDE 16 ═══ -->\r\n<section class=\"slide\" data-slide=\"16\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">🔧<\/div><h2 class=\"pres-title\">TRADES & College Programları<\/h2><p class=\"pres-sub\">Üniversite dışı kariyer yolları için yapılandırılmış rehberlik<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">🔨<\/div><div class=\"pres-card-title\">TRADES Alanı<\/div><div class=\"pres-card-desc\">Üniversite okumayacaklar için meslek edinme ve çıraklık yol haritası<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><p><strong>TRADES başlı başına bir konu<\/strong> olarak ele alınmalı:<\/p><ul class=\"detail-list\"><li>Mentorluk programı<\/li><li>Meslek tanıtım sunumları<\/li><li>Çıraklık ve ustalık yol haritası<\/li><li>Başarılı tradesperson'larla buluşma<\/li><li>Sertifikasyon ve lisanslama bilgilendirmesi<\/li><li>İş imkanları ve kazanç potansiyeli<\/li><\/ul><\/div><\/div><\/div>\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">🏛️<\/div><div class=\"pres-card-title\">College Programı<\/div><div class=\"pres-card-desc\">BCIT, JIBC gibi okullardan direk meslek edinme rehberliği<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li>BCIT, JIBC gibi okullardan direk meslek edinme<\/li><li>College başvuru süreci rehberliği<\/li><li>Bölüm ve program seçimi danışmanlığı<\/li><li>Mezuniyet sonrası iş imkanları<\/li><li>College-üniversite karşılaştırması (maliyet, süre)<\/li><\/ul><\/div><\/div><\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n<!-- ═══ SLIDE 17 ═══ -->\r\n<section class=\"slide\" data-slide=\"17\">\r\n  <div class=\"pres-hero\"><div class=\"pres-icon\">⚖️<\/div><h2 class=\"pres-title\">Finansman & Sürdürülebilirlik<\/h2><p class=\"pres-sub\">Charity temelli modelden sürdürülebilir yapıya geçiş — karar bekleyen konular<\/p><\/div>\r\n  <div class=\"pres-cards\">\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">❤️<\/div><div class=\"pres-card-title\">Öncelik: Charity<\/div><div class=\"pres-card-desc\">Tüm faaliyetler öncelikle ücretsiz ve toplum hizmeti odaklı<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li>Topluma hizmet ve eğitimde fırsat eşitliği temel amaç<\/li><li>Gönüllü mentor ve eğitmen desteği ile maliyet minimizasyonu<\/li><li>Topluluk kaynaklarının verimli kullanımı<\/li><\/ul><\/div><\/div><\/div>\r\n    <div class=\"pres-card\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">💰<\/div><div class=\"pres-card-title\">Ücretli Hizmet<\/div><div class=\"pres-card-desc\">Ölçeklenebilirlik için bazı hizmetlerin ücretlendirilmesi<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><p>İnsanların daha iyi emek verebilmesi, ölçeklenebilme ve sürdürülebilirlik için:<\/p><ul class=\"detail-list\"><li>Hangi hizmetler ücretli olacak?<\/li><li>Hangi seviyeden itibaren ücret alınacak?<\/li><li>Premium birebir mentorluk paketleri<\/li><li>Özel kurs ve sertifika programları<\/li><\/ul><\/div><\/div><\/div>\r\n    <div class=\"pres-card accent\"><div class=\"pres-card-front\"><div class=\"pres-card-icon\">📝<\/div><div class=\"pres-card-title\">Grant & Karma Model<\/div><div class=\"pres-card-desc\">Grant başvuruları ve gönüllü/ücretli karma mentor sistemi<\/div><div class=\"pres-card-hint\">Detaylar için tıklayın ▸<\/div><\/div><div class=\"pres-card-drawer\"><div class=\"drawer-inner\"><ul class=\"detail-list\"><li>Ücretler grant bulunursa oradan karşılanabilir<\/li><li>Grant yazımı ve başvuru süreci ayrı çalışma konusu<\/li><li><strong>Karma Model:<\/strong> Temel hizmetler ücretsiz, premium ücretli/grant destekli<\/li><li>Gönüllü + ücretli mentor karma sistemi<\/li><li>Sponsorluk ve kurumsal destek arayışları<\/li><\/ul><\/div><\/div><\/div>\r\n  <\/div>\r\n  <div class=\"decisions-section\" id=\"decisions-section\">\r\n    <h4>📋 Karar Bekleyen Konular <span style=\"font-size:13px;color:var(--text-muted);font-weight:400\">— her konunun altına kararı yazın, otomatik kaydedilir<\/span><\/h4>\r\n    <div class=\"decision-item\"><label>💰 Hangi hizmetler ücretli olacak, hangileri ücretsiz kalacak?<\/label><textarea data-decision=\"pricing\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n    <div class=\"decision-item\"><label>📊 Hangi seviyeden (grade) itibaren ücret alınacak?<\/label><textarea data-decision=\"priceLevel\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n    <div class=\"decision-item\"><label>📝 Grant başvurularını kim yapacak, hangi grantlere başvurulacak?<\/label><textarea data-decision=\"grants\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n    <div class=\"decision-item\"><label>🤝 Karma model (ücretsiz + ücretli) nasıl yapılandırılacak?<\/label><textarea data-decision=\"mixedModel\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n    <div class=\"decision-item\"><label>💼 Mentorlar için gönüllü/ücretli dengesi nasıl olacak?<\/label><textarea data-decision=\"mentorModel\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n    <div class=\"decision-item\"><label>🏢 Sponsorluk ve kurumsal destek stratejisi ne olacak?<\/label><textarea data-decision=\"sponsorship\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n    <div class=\"decision-item\"><label>👩‍🏫 Ders anlatacak öğretmenler ücretli mi, gönüllü mü olacak? Şehirden şehire farklı mı, herkes kendi durumuna göre mi karar vermeli?<\/label><textarea data-decision=\"teacherPay\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n    <div class=\"decision-item\"><label>🎓 Mentorluk sistemi: Charity kapsamında öğrencilere ücretsiz, harici olarak profesyonel ücretli hizmet şeklinde iki kanallı model uygulansın mı?<\/label><textarea data-decision=\"mentorChannels\" rows=\"2\" placeholder=\"Kararı buraya yazın...\"><\/textarea><\/div>\r\n  <\/div>\r\n<\/section>\r\n\r\n    <\/div><!-- /slide-container -->\r\n\r\n    <div class=\"slide-nav-bottom\">\r\n      <button class=\"btn-nav\" id=\"btn-prev\" title=\"Önceki (←)\">◀<\/button>\r\n      <div class=\"slide-dots\" id=\"slide-dots\"><\/div>\r\n      <button class=\"btn-nav\" id=\"btn-next\" title=\"Sonraki (→)\">▶<\/button>\r\n    <\/div>\r\n  <\/main>\r\n<\/div>\r\n"},"css":{"name":"EducationProgramPresentation.css","src":"../app/EducationProgramPresentation.css","content":"/* ═══════════════════════════════════════════════════════\r\n   Future Bridge Academy — İnteraktif Sunum (Inline Drawer)\r\n   FBA CMS HTML-Tool\r\n   ═══════════════════════════════════════════════════════ */\r\n\r\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\r\n\r\n:root {\r\n  --bg: #f0f2f7;\r\n  --surface: #ffffff;\r\n  --sidebar-bg: #111827;\r\n  --sidebar-text: #9ca3af;\r\n  --sidebar-active: #ffffff;\r\n  --sidebar-hover: #1f2937;\r\n  --primary: #4f46e5;\r\n  --primary-light: #e0e7ff;\r\n  --primary-dark: #3730a3;\r\n  --accent: #059669;\r\n  --accent-light: #d1fae5;\r\n  --accent-dark: #047857;\r\n  --text: #111827;\r\n  --text-secondary: #6b7280;\r\n  --text-muted: #9ca3af;\r\n  --border: #e5e7eb;\r\n  --border-light: #f3f4f6;\r\n  --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);\r\n  --shadow-card-hover: 0 8px 24px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05);\r\n  --radius-sm: 8px;\r\n  --radius-md: 14px;\r\n  --radius-lg: 20px;\r\n  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);\r\n  --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);\r\n  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;\r\n}\r\n\r\nbody { font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }\r\n#app { display: flex; height: 100vh; width: 100%; }\r\n\r\n/* ── Sidebar ── */\r\n.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; overflow-y: auto; z-index: 100; transform: translateX(-100%); transition: transform var(--transition); }\r\n.sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.3); }\r\n.sidebar-brand { padding: 26px 28px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); }\r\n.brand-logo { font-size: 34px; margin-bottom: 4px; }\r\n.brand-name { font-size: 20px; font-weight: 700; color: #fff; }\r\n.brand-sub { font-size: 11px; color: var(--sidebar-text); letter-spacing: 1.5px; text-transform: uppercase; }\r\n.slide-nav { padding: 10px 0; flex: 1; }\r\n.nav-group-label { padding: 18px 28px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--sidebar-text); opacity: 0.4; font-weight: 600; }\r\n.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 28px; cursor: pointer; font-size: 15px; transition: all var(--transition); border-left: 3px solid transparent; color: var(--sidebar-text); }\r\n.nav-item:hover { background: var(--sidebar-hover); color: #e5e7eb; }\r\n.nav-item.active { background: rgba(79, 70, 229, 0.18); color: #fff; border-left-color: var(--primary); font-weight: 600; }\r\n.nav-num { font-size: 11px; font-weight: 700; opacity: 0.5; min-width: 24px; color: #34d399; }\r\n.nav-item.active .nav-num { opacity: 1; }\r\n\r\n/* ── Main ── */\r\n.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }\r\n\r\n/* ── Topbar ── */\r\n.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }\r\n.btn-menu { display: inline-block; background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; color: var(--text); border-radius: 6px; }\r\n.btn-menu:hover { background: var(--border-light); }\r\n.progress-bar-wrap { flex: 1; height: 5px; background: var(--border-light); border-radius: 3px; overflow: hidden; }\r\n.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 3px; transition: width 0.4s ease; }\r\n.progress-text { font-size: 11px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }\r\n.readonly-badge { font-size: 10px; padding: 2px 10px; border-radius: 20px; background: #fef3c7; color: #92400e; font-weight: 600; }\r\n.btn-config { font-size: 12px; font-weight: 600; padding: 4px 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); color: var(--primary); cursor: pointer; white-space: nowrap; transition: all var(--transition); font-family: var(--font); }\r\n.btn-config:hover { background: var(--primary); color: #fff; border-color: var(--primary); }\r\n\r\n/* ── Slide Container ── */\r\n.slide-container { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }\r\n.slide { display: none; padding: 24px 50px 28px; max-width: 1500px; margin: 0 auto; animation: fadeSlide 0.4s ease; }\r\n.slide.active { display: block; }\r\n@keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }\r\n\r\n/* ── PRESENTATION HERO ── */\r\n.pres-hero { text-align: center; padding: 8px 16px 20px; }\r\n.pres-icon { font-size: 56px; line-height: 1; margin-bottom: 8px; animation: popIn 0.5s ease; }\r\n@keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }\r\n.pres-title { font-size: 36px; font-weight: 800; color: var(--text); margin-bottom: 4px; line-height: 1.15; letter-spacing: -0.5px; }\r\n.pres-sub { font-size: 17px; color: var(--text-secondary); max-width: 900px; margin: 0 auto; line-height: 1.45; }\r\n.pres-stats { display: flex; justify-content: center; gap: 56px; margin-top: 20px; }\r\n.pres-stat { display: flex; flex-direction: column; align-items: center; }\r\n.pres-stat-num { font-size: 52px; font-weight: 800; color: var(--primary); line-height: 1; }\r\n.pres-stat-label { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; font-weight: 600; }\r\n\r\n/* ── CARDS GRID ── */\r\n.pres-cards { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; }\r\n\r\n/* ── PRESENTATION CARD ── */\r\n.pres-card {\r\n  flex: 1 1 320px;\r\n  background: var(--surface);\r\n  border: 2px solid var(--border);\r\n  border-radius: var(--radius-md);\r\n  cursor: pointer;\r\n  transition: flex-basis var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition), background var(--transition), opacity var(--transition);\r\n  position: relative;\r\n  overflow: hidden;\r\n  display: flex;\r\n  flex-direction: column;\r\n}\r\n\r\n.pres-card:hover {\r\n  border-color: var(--primary);\r\n  box-shadow: var(--shadow-card-hover);\r\n  transform: translateY(-3px);\r\n}\r\n\r\n.pres-card.accent { border-left: 4px solid var(--accent); }\r\n.pres-card.accent:hover { border-color: var(--accent); }\r\n\r\n/* ── Card Front (always visible) ── */\r\n.pres-card-front {\r\n  padding: 22px 22px;\r\n  text-align: center;\r\n  transition: padding var(--transition);\r\n}\r\n\r\n.pres-card-icon { font-size: 38px; line-height: 1; margin-bottom: 8px; transition: transform var(--transition), font-size var(--transition), margin-bottom var(--transition); }\r\n.pres-card:hover .pres-card-icon { transform: scale(1.1); }\r\n.pres-card-title { font-size: 19px; font-weight: 700; color: var(--text); margin-bottom: 4px; transition: font-size var(--transition), color var(--transition), margin-bottom var(--transition); }\r\n.pres-card-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.4; max-height: 200px; overflow: hidden; transition: max-height var(--transition), opacity var(--transition), margin-top var(--transition); }\r\n.pres-card-hint {\r\n  font-size: 14px; color: var(--primary); font-weight: 600;\r\n  opacity: 0; transform: translateY(4px); max-height: 24px; overflow: hidden;\r\n  transition: opacity var(--transition), transform var(--transition), max-height var(--transition), margin-top var(--transition);\r\n  margin-top: 10px;\r\n}\r\n.pres-card:hover .pres-card-hint { opacity: 1; transform: translateY(0); }\r\n\r\n/* ═══ TABS MODE — one item selected → all cards shrink into a tab strip,\r\n   sharing one combined content area below (like a tabbed presentation) ═══ */\r\n.pres-cards.tabs-mode { gap: 12px; }\r\n.pres-cards.tabs-mode .pres-card { flex: 1 1 180px; }\r\n.pres-cards.tabs-mode .pres-card:hover { transform: none; }\r\n.pres-cards.tabs-mode .pres-card-front { padding: 18px 14px; }\r\n.pres-cards.tabs-mode .pres-card-icon { font-size: 28px; margin-bottom: 6px; }\r\n.pres-cards.tabs-mode .pres-card-title { font-size: 15px; margin-bottom: 0; }\r\n.pres-cards.tabs-mode .pres-card-desc,\r\n.pres-cards.tabs-mode .pres-card-hint { max-height: 0; opacity: 0; margin-top: 0; }\r\n\r\n.pres-cards.tabs-mode .pres-card:not(.selected) { opacity: 0.6; }\r\n.pres-cards.tabs-mode .pres-card:not(.selected):hover { opacity: 1; border-color: var(--primary); }\r\n\r\n.pres-cards.tabs-mode .pres-card.selected {\r\n  border-color: var(--primary);\r\n  background: var(--primary-light);\r\n  box-shadow: var(--shadow-card-hover);\r\n  cursor: pointer;\r\n}\r\n.pres-cards.tabs-mode .pres-card.selected .pres-card-title { color: var(--primary-dark); }\r\n.pres-cards.tabs-mode .pres-card.accent.selected { border-color: var(--accent); background: var(--accent-light); }\r\n.pres-cards.tabs-mode .pres-card.accent.selected .pres-card-title { color: var(--accent-dark); }\r\n\r\n.pres-cards.tabs-mode .pres-card.selected::after {\r\n  content: '';\r\n  position: absolute;\r\n  left: 50%; bottom: -8px;\r\n  transform: translateX(-50%);\r\n  width: 0; height: 0;\r\n  border-left: 7px solid transparent;\r\n  border-right: 7px solid transparent;\r\n  border-top: 7px solid var(--primary);\r\n  transition: border-top-color var(--transition);\r\n}\r\n.pres-cards.tabs-mode .pres-card.accent.selected::after { border-top-color: var(--accent); }\r\n\r\n/* ═══ Shared Drawer — combined content area below the tab strip ═══ */\r\n.pres-shared-drawer {\r\n  position: relative;\r\n  max-height: 0;\r\n  margin-top: 0;\r\n  overflow: hidden;\r\n  border: 0px solid transparent;\r\n  border-radius: var(--radius-md);\r\n  background: var(--border-light);\r\n  transition: max-height var(--transition-slow), margin-top var(--transition-slow), border-width var(--transition-slow), border-color var(--transition-slow);\r\n}\r\n.pres-shared-drawer.open {\r\n  max-height: 3000px;\r\n  margin-top: 20px;\r\n  border: 1px solid var(--border);\r\n}\r\n.pres-shared-drawer .drawer-close {\r\n  position: absolute;\r\n  top: 12px; right: 14px;\r\n  width: 32px; height: 32px;\r\n  border: none; border-radius: 50%;\r\n  background: var(--surface);\r\n  color: var(--text-secondary);\r\n  font-size: 16px; line-height: 1;\r\n  cursor: pointer;\r\n  display: flex; align-items: center; justify-content: center;\r\n  box-shadow: var(--shadow-card);\r\n  transition: all var(--transition);\r\n  z-index: 2;\r\n}\r\n.pres-shared-drawer .drawer-close:hover { background: var(--primary); color: #fff; }\r\n\r\n/* ── Drawer Inner ── */\r\n.drawer-inner {\r\n  padding: 22px 28px;\r\n  font-size: 16px;\r\n  line-height: 1.6;\r\n  color: var(--text);\r\n  opacity: 1;\r\n  transition: opacity 0.15s ease;\r\n}\r\n.drawer-inner.fading { opacity: 0; }\r\n\r\n.drawer-inner p { margin-bottom: 12px; }\r\n.drawer-inner p:last-child { margin-bottom: 0; }\r\n\r\n/* ── Detail List (inside drawer) ── */\r\n.detail-list { list-style: none; padding: 0; }\r\n.detail-list li { padding: 7px 0; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; font-size: 15px; line-height: 1.5; }\r\n.detail-list li:last-child { border-bottom: none; }\r\n.detail-list li::before { content: '▸'; color: var(--primary); font-weight: 700; flex-shrink: 0; margin-top: 2px; font-size: 14px; }\r\n.detail-list ul { list-style: none; margin-top: 4px; padding-left: 18px; width: 100%; }\r\n.detail-list ul li { font-size: 14px; padding: 2px 0; border-bottom: none; color: var(--text-secondary); }\r\n.detail-list ul li::before { content: '•'; color: var(--text-muted); }\r\n\r\n/* ── Special blocks ── */\r\n.rule-block { padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 10px; font-size: 16px; line-height: 1.6; }\r\n.rule-block:last-child { margin-bottom: 0; }\r\n.grade-grid-big { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }\r\n.grade-grid-big span { padding: 6px 18px; background: var(--primary-light); color: var(--primary-dark); border-radius: 20px; font-size: 15px; font-weight: 600; }\r\n.camp-days { display: flex; gap: 18px; margin: 12px 0 18px; }\r\n.camp-day-card { flex: 1; background: var(--primary-light); border-radius: var(--radius-sm); padding: 20px; text-align: center; }\r\n.camp-day-title { font-weight: 700; font-size: 18px; color: var(--primary-dark); margin-bottom: 4px; }\r\n.camp-day-desc { font-size: 17px; font-weight: 600; color: var(--text); }\r\n.camp-day-info { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }\r\n.career-grid-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\r\n.career-item-detail { padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 10px; }\r\n.profile-grid-detail { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }\r\n.profile-item-detail { padding: 8px 16px; background: var(--accent-light); color: var(--accent-dark); border-radius: 20px; font-size: 15px; font-weight: 600; }\r\n\r\n/* ── Footer Note ── */\r\n.pres-footer-note { margin-top: 22px; padding: 16px 22px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-sm); font-size: 16px; color: #1e40af; text-align: center; line-height: 1.6; }\r\n\r\n/* ── WhatsApp Stats Table ── */\r\n.whatsapp-stats-wrap { margin-top: 20px; }\r\n.whatsapp-stats-wrap h4 { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 10px; }\r\n.whatsapp-stats-wrap h4 .btn-edit-stats { font-size: 13px; font-weight: 600; padding: 5px 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); color: var(--primary); cursor: pointer; transition: all var(--transition); }\r\n.whatsapp-stats-wrap h4 .btn-edit-stats:hover { background: var(--primary); color: #fff; border-color: var(--primary); }\r\n.stats-table { width: 100%; border-collapse: collapse; font-size: 15px; }\r\n.stats-table th { background: var(--sidebar-bg); color: #fff; padding: 10px 14px; text-align: left; font-weight: 600; font-size: 13px; letter-spacing: 0.3px; white-space: nowrap; }\r\n.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }\r\n.stats-table th:first-child { border-radius: 6px 0 0 0; }\r\n.stats-table th:last-child { border-radius: 0 6px 0 0; }\r\n.stats-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); }\r\n.stats-table tr:hover td { background: var(--border-light); }\r\n.stats-table .pct-bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); min-width: 4px; vertical-align: middle; margin-right: 8px; }\r\n.stats-table .pct-text { font-weight: 600; color: var(--accent-dark); font-size: 15px; }\r\n.stats-empty { font-size: 16px; color: var(--text-muted); padding: 20px; text-align: center; border: 2px dashed var(--border); border-radius: var(--radius-sm); }\r\n\r\n/* ── Config Drawer (right-side slide-out panel) ── */\r\n.config-drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }\r\n.config-drawer-overlay.open { opacity: 1; visibility: visible; }\r\n.config-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90vw; background: var(--surface); z-index: 1000; box-shadow: -4px 0 20px rgba(0,0,0,0.15); transform: translateX(100%); transition: transform var(--transition-slow); display: flex; flex-direction: column; }\r\n.config-drawer.open { transform: translateX(0); }\r\n.config-drawer-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }\r\n.config-drawer-header h3 { font-size: 16px; font-weight: 700; }\r\n.config-tab { padding: 5px 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-secondary); transition: all var(--transition); font-family: var(--font); }\r\n.config-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }\r\n.config-tab:hover:not(.active) { background: var(--border-light); }\r\n.config-drawer-close { width: 30px; height: 30px; border: none; border-radius: 50%; background: var(--border-light); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }\r\n.config-drawer-close:hover { background: #fee2e2; color: #dc2626; }\r\n.config-drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }\r\n.config-drawer-body label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }\r\n.config-drawer-body input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; font-family: var(--font); margin-bottom: 12px; transition: border-color var(--transition); }\r\n.config-drawer-body input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px var(--primary-light); }\r\n.config-city-row { background: var(--border-light); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; position: relative; }\r\n.config-city-row .city-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }\r\n.config-city-row .city-header strong { font-size: 14px; }\r\n.config-city-row .btn-remove-city { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; }\r\n.config-city-row .btn-remove-city:hover { background: #fee2e2; }\r\n.config-city-row .field-row { display: flex; gap: 8px; }\r\n.config-city-row .field-row .field-half { flex: 1; }\r\n.config-drawer-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }\r\n.config-drawer-footer button { padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: var(--font); transition: all var(--transition); }\r\n.btn-save-config { background: var(--primary); color: #fff; }\r\n.btn-save-config:hover { background: var(--primary-dark); }\r\n.btn-add-city { background: var(--accent-light); color: var(--accent-dark); font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 1px dashed var(--accent); cursor: pointer; font-weight: 600; margin-bottom: 12px; transition: all var(--transition); }\r\n.btn-add-city:hover { background: var(--accent); color: #fff; }\r\n\r\n/* ── Emphasis banner inside drawer-inner ── */\r\n.emphasis-banner { background: linear-gradient(135deg, #eff6ff, #e0e7ff); border: 1px solid #bfdbfe; border-radius: var(--radius-sm); padding: 16px 20px; margin-bottom: 16px; font-size: 16px; line-height: 1.65; color: #1e40af; }\r\n.emphasis-banner strong { color: #1e3a8a; }\r\n.emphasis-banner.accent { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border-color: #a7f3d0; color: #047857; }\r\n.emphasis-banner.accent strong { color: #064e3b; }\r\n\r\n/* ── Decision textareas (slide 17) ── */\r\n.decisions-section { margin-top: 24px; }\r\n.decisions-section h4 { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--text); }\r\n.decision-item { margin-bottom: 14px; }\r\n.decision-item label { display: block; font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 5px; }\r\n.decision-item textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: var(--font); line-height: 1.55; resize: vertical; transition: border-color var(--transition); background: var(--surface); }\r\n.decision-item textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px var(--primary-light); }\r\n\r\n/* ── Bottom Navigation ── */\r\n.slide-nav-bottom { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 20px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }\r\n.btn-nav { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); font-size: 15px; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; transition: all var(--transition); }\r\n.btn-nav:hover:not(:disabled) { background: var(--primary); color: #fff; border-color: var(--primary); }\r\n.btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }\r\n.slide-dots { display: flex; gap: 5px; align-items: center; }\r\n.slide-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all var(--transition); }\r\n.slide-dot.active { background: var(--primary); width: 20px; border-radius: 4px; }\r\n\r\n/* ── Responsive ── */\r\n@media (max-width: 768px) {\r\n  .slide { padding: 20px 16px 28px; }\r\n  .pres-icon { font-size: 48px; }\r\n  .pres-title { font-size: 26px; }\r\n  .pres-stats { gap: 24px; }\r\n  .pres-stat-num { font-size: 36px; }\r\n  .pres-cards { flex-direction: column; }\r\n  .pres-card { flex-basis: auto; }\r\n  .pres-cards.tabs-mode { flex-direction: row; flex-wrap: wrap; }\r\n  .pres-cards.tabs-mode .pres-card { flex-basis: 110px; }\r\n  .career-grid-detail { grid-template-columns: 1fr; }\r\n  .camp-days { flex-direction: column; }\r\n}\r\n"},"js":{"name":"EducationProgramPresentation.js","src":"../app/EducationProgramPresentation.js","content":"/* ═══════════════════════════════════════════════════════\r\n   Future Bridge Academy — İnteraktif Sunum JS (Inline Drawer)\r\n   FBA CMS HTML-Tool\r\n   ═══════════════════════════════════════════════════════ */\r\n\r\nfunction el(id) { return document.getElementById(id); }\r\nfunction qs(sel) { return document.querySelector(sel); }\r\nfunction qsa(sel) { return document.querySelectorAll(sel); }\r\n\r\nvar currentSlide = 0;\r\nvar totalSlides = 21;\r\nvar isReadOnly = false;\r\nvar tabGroups = []; /* one controller per .pres-cards group */\r\nvar partnerCities = []; /* [{ city, partnerName, veliSunum, ogrenciSunum, sunumKatilim, veliWhatsappGrubu, ogrenciGradeGrubu, onlineDers, denemeSinav, denemeSinavSayi, denemeKayitDuzeni, denemeSonucYazilim, paylasimDuzenli, notes }] */\r\nvar decisions = {}; /* { pricing: '', priceLevel: '', grants: '', mixedModel: '', mentorModel: '', sponsorship: '', teacherPay: '', mentorChannels: '', volunteerRoles: '' } */\r\nvar STEP_LABELS = {\r\n  veliSunum: 'Veli Sunumu',\r\n  ogrenciSunum: 'Öğrenci Sunumu',\r\n  sunumKatilim: 'Sunum Katılım',\r\n  veliWhatsappGrubu: 'Veli WhatsApp Grubu',\r\n  ogrenciGradeGrubu: 'Grade WhatsApp Grubu',\r\n  onlineDers: 'Online Ders',\r\n  denemeSinav: 'Deneme Sınavı',\r\n  denemeSinavSayi: 'Sınav Sayısı',\r\n  denemeKayitDuzeni: 'Kayıt Düzeni',\r\n  denemeSonucYazilim: 'Sonuçlar Yazılımda',\r\n  paylasimDuzenli: 'Düzenli Paylaşım'\r\n};\r\nvar NUMERIC_FIELDS = ['sunumKatilim', 'denemeSinavSayi'];\r\n\r\n/* ── Init ── */\r\ntool.onReady(function(value, fields) {\r\n  if (value && typeof value.currentSlide === 'number') {\r\n    currentSlide = Math.max(0, Math.min(value.currentSlide, totalSlides - 1));\r\n  }\r\n  if (value && value.partnerCities) {\r\n    partnerCities = value.partnerCities;\r\n  }\r\n  if (!partnerCities || !partnerCities.length) {\r\n    partnerCities = [];\r\n  }\r\n  if (value && value.decisions) {\r\n    decisions = value.decisions;\r\n  }\r\n  if (tool.isReadOnly()) {\r\n    isReadOnly = true;\r\n    el('readonly-badge').style.display = 'inline-block';\r\n  }\r\n\r\n  initConfigDrawer();\r\n  initTabGroups();\r\n  renderSlide(currentSlide);\r\n  buildDots();\r\n  updateProgress();\r\n  updateNavButtons();\r\n  bindEvents();\r\n\r\n  tool.onValueChange(function(v) {\r\n    if (v && typeof v.currentSlide === 'number') {\r\n      navigateTo(Math.max(0, Math.min(v.currentSlide, totalSlides - 1)));\r\n    }\r\n  });\r\n\r\n  tool.onReadonlyChange(function(ro) {\r\n    isReadOnly = !!ro;\r\n    el('readonly-badge').style.display = isReadOnly ? 'inline-block' : 'none';\r\n  });\r\n\r\n  setTimeout(function() { tool.resize(); }, 150);\r\n});\r\n\r\n/* ── Slide Navigation ── */\r\nfunction renderSlide(index) {\r\n  /* Collapse any open tab-group before switching */\r\n  resetAllTabGroups();\r\n\r\n  qsa('.slide').forEach(function(s) { s.classList.remove('active'); });\r\n  qsa('.nav-item').forEach(function(n) { n.classList.remove('active'); });\r\n\r\n  var slide = qs('.slide[data-slide=\"' + index + '\"]');\r\n  if (slide) slide.classList.add('active');\r\n\r\n  var navItem = qs('.nav-item[data-slide=\"' + index + '\"]');\r\n  if (navItem) { navItem.classList.add('active'); navItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }\r\n\r\n  el('slide-container').scrollTop = 0;\r\n  currentSlide = index;\r\n  if (index === 1) { setTimeout(renderPartnerTable, 50); }\r\n  if (index === 18) { setTimeout(loadDecisions, 100); }\r\n  if (index === 19) { setTimeout(renderReport, 50); }\r\n  if (index === 17) { /* slide 17 no longer has decisions */ }\r\n  updateProgress();\r\n  updateNavButtons();\r\n  updateDots();\r\n  saveState();\r\n  tool.resize();\r\n}\r\n\r\nfunction navigateTo(index) {\r\n  if (index === currentSlide || index < 0 || index >= totalSlides) return;\r\n  renderSlide(index);\r\n}\r\n\r\nfunction nextSlide() { if (currentSlide < totalSlides - 1) renderSlide(currentSlide + 1); }\r\nfunction prevSlide() { if (currentSlide > 0) renderSlide(currentSlide - 1); }\r\n\r\n/* ── Tab Groups ──────────────────────────────────────────────\r\n   Each .pres-cards block becomes a self-contained \"tab strip\":\r\n   clicking a card shrinks ALL cards in that group into small tabs\r\n   and reveals the clicked card's detail content in one shared\r\n   area below the strip — instead of an inline per-card drawer\r\n   (which used to leave the other cards stretched with empty\r\n   white space at the same row height). ── */\r\nfunction initTabGroups() {\r\n  qsa('.pres-cards').forEach(function(group) {\r\n    tabGroups.push(createTabGroup(group));\r\n  });\r\n}\r\n\r\nfunction createTabGroup(group) {\r\n  var cards = Array.prototype.slice.call(group.children).filter(function(c) {\r\n    return c.classList.contains('pres-card');\r\n  });\r\n\r\n  /* Nothing to tabify — leave a single card (or none) exactly as-is */\r\n  if (cards.length < 2) return { reset: function() {} };\r\n\r\n  /* Pull each card's detail markup out into memory, then remove the\r\n     inline drawer node — the shared drawer below will render it instead */\r\n  var contents = cards.map(function(card) {\r\n    var drawer = card.querySelector('.pres-card-drawer');\r\n    var html = '';\r\n    if (drawer) {\r\n      var innerEl = drawer.querySelector('.drawer-inner');\r\n      html = innerEl ? innerEl.innerHTML : drawer.innerHTML;\r\n      /* Store on card for PDF export */\r\n      card.setAttribute('data-drawer-content', encodeURIComponent(html));\r\n      drawer.parentNode.removeChild(drawer);\r\n    }\r\n    return html;\r\n  });\r\n\r\n  var shared = document.createElement('div');\r\n  shared.className = 'pres-shared-drawer';\r\n  shared.innerHTML = '<button type=\"button\" class=\"drawer-close\" aria-label=\"Kapat\" title=\"Kapat\">&#10005;<\/button><div class=\"drawer-inner\"><\/div>';\r\n  group.parentNode.insertBefore(shared, group.nextSibling);\r\n  var innerBox = shared.querySelector('.drawer-inner');\r\n  var closeBtn = shared.querySelector('.drawer-close');\r\n  var selectedIdx = -1;\r\n\r\n  function closeGroup() {\r\n    if (selectedIdx === -1) return;\r\n    selectedIdx = -1;\r\n    group.classList.remove('tabs-mode');\r\n    cards.forEach(function(c) { c.classList.remove('selected'); });\r\n    shared.classList.remove('open');\r\n    tool.resize();\r\n  }\r\n\r\n  function openCard(idx) {\r\n    var wasOpen = selectedIdx !== -1;\r\n    selectedIdx = idx;\r\n    group.classList.add('tabs-mode');\r\n    cards.forEach(function(c, i) { c.classList.toggle('selected', i === idx); });\r\n\r\n    if (!wasOpen) {\r\n      innerBox.innerHTML = contents[idx];\r\n      shared.classList.add('open');\r\n      tool.resize();\r\n    } else {\r\n      /* Switching tabs while already open — quick cross-fade of content */\r\n      innerBox.classList.add('fading');\r\n      setTimeout(function() {\r\n        innerBox.innerHTML = contents[idx];\r\n        innerBox.classList.remove('fading');\r\n        tool.resize();\r\n      }, 160);\r\n    }\r\n  }\r\n\r\n  cards.forEach(function(card, idx) {\r\n    card.addEventListener('click', function(e) {\r\n      if (e.target.closest('a, button, input, textarea')) return;\r\n      if (selectedIdx === idx) closeGroup();\r\n      else openCard(idx);\r\n    });\r\n  });\r\n\r\n  closeBtn.addEventListener('click', function(e) {\r\n    e.stopPropagation();\r\n    closeGroup();\r\n  });\r\n\r\n  return { reset: closeGroup };\r\n}\r\n\r\nfunction resetAllTabGroups() {\r\n  tabGroups.forEach(function(g) { g.reset(); });\r\n}\r\n\r\n/* ── Partner Cities Table & Config Drawer ──────────── */\r\nfunction renderPartnerTable() {\r\n  var wrap = el('partner-table-wrap');\r\n  if (!wrap) return;\r\n\r\n  if (partnerCities.length === 0) {\r\n    wrap.innerHTML = '<div class=\"stats-empty\">Henüz partner şehir eklenmedi. <strong>⚙️ Düzenle<\/strong> butonuna tıklayarak şehirleri ve durumlarını ekleyin.<\/div>';\r\n    rebindEditBtn();\r\n    return;\r\n  }\r\n\r\n  var stepKeys = Object.keys(STEP_LABELS);\r\n  var boolKeys = stepKeys.filter(function(k) { return NUMERIC_FIELDS.indexOf(k) === -1; });\r\n  var totalDone = 0, totalBoolSteps = partnerCities.length * boolKeys.length;\r\n\r\n  var html = '<h4>📋 Partner Şehir Durum Takibi <button type=\"button\" class=\"btn-edit-stats\" id=\"btn-edit-stats\">⚙️ Düzenle<\/button><\/h4>';\r\n  html += '<div class=\"table-scroll\"><table class=\"stats-table\"><thead><tr><th>Şehir<\/th><th>Partner<\/th>';\r\n  boolKeys.forEach(function(k) { html += '<th>' + STEP_LABELS[k] + '<\/th>'; });\r\n  html += '<th>İlerleme<\/th><\/tr><\/thead><tbody>';\r\n\r\n  partnerCities.forEach(function(p) {\r\n    var done = 0;\r\n    html += '<tr><td><strong>' + escHtml(p.city || '—') + '<\/strong><\/td><td>' + escHtml(p.partnerName || '—') + '<\/td>';\r\n    boolKeys.forEach(function(k) {\r\n      var isDone = !!p[k];\r\n      if (isDone) done++;\r\n      html += '<td style=\"text-align:center\">' + (isDone ? '✅' : '⬜') + '<\/td>';\r\n    });\r\n    var pct = boolKeys.length > 0 ? Math.round(done / boolKeys.length * 100) : 0;\r\n    html += '<td><span class=\"pct-bar\" style=\"width:' + Math.min(pct, 100) + 'px;\"><\/span><span class=\"pct-text\">%' + pct + '<\/span><\/td><\/tr>';\r\n    totalDone += done;\r\n  });\r\n\r\n  html += '<\/tbody><\/table><\/div>';\r\n  var overallPct = totalBoolSteps > 0 ? Math.round(totalDone / totalBoolSteps * 100) : 0;\r\n  html += '<div style=\"margin-top:8px;font-size:13px;color:var(--text-muted)\">Genel ilerleme: <strong>%' + overallPct + '<\/strong> (' + totalDone + '/' + totalBoolSteps + ' adım tamamlandı)<\/div>';\r\n  html += '<div class=\"pres-footer-note\" style=\"margin-top:10px\">💻 Detaylı veri girişi (sayısal değerler, notlar) için <strong>⚙️ Düzenle<\/strong> butonunu kullanın. Bu adımların takibi için özel bir yazılım geliştirilmektedir.<\/div>';\r\n\r\n  wrap.innerHTML = html;\r\n  rebindEditBtn();\r\n}\r\n\r\nfunction rebindEditBtn() {\r\n  var btn = el('btn-edit-stats');\r\n  if (btn) btn.addEventListener('click', openConfigDrawer);\r\n}\r\n\r\nfunction escHtml(s) {\r\n  return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\r\n}\r\n\r\n/* ── Config Drawer (unified partner city form) ── */\r\nfunction initConfigDrawer() {\r\n  var overlay = document.createElement('div');\r\n  overlay.className = 'config-drawer-overlay';\r\n  overlay.id = 'config-drawer-overlay';\r\n  overlay.addEventListener('click', closeConfigDrawer);\r\n\r\n  var drawer = document.createElement('div');\r\n  drawer.className = 'config-drawer';\r\n  drawer.id = 'config-drawer';\r\n  drawer.innerHTML = '<div class=\"config-drawer-header\"><h3>⚙️ Partner Şehir Veri Girişi<\/h3><button type=\"button\" class=\"config-drawer-close\" id=\"config-drawer-close\">✕<\/button><\/div><div class=\"config-drawer-body\" id=\"config-drawer-body\"><\/div><div class=\"config-drawer-footer\"><button type=\"button\" class=\"btn-add-city\" id=\"btn-add-item\">+ Partner Şehir Ekle<\/button><button type=\"button\" class=\"btn-save-config\" id=\"btn-save-config\">Kaydet<\/button><\/div>';\r\n\r\n  document.body.appendChild(overlay);\r\n  document.body.appendChild(drawer);\r\n\r\n  el('config-drawer-close').addEventListener('click', closeConfigDrawer);\r\n\r\n  el('btn-add-item').addEventListener('click', function() {\r\n    var p = { city: '', partnerName: '' };\r\n    Object.keys(STEP_LABELS).forEach(function(k) {\r\n      p[k] = NUMERIC_FIELDS.indexOf(k) !== -1 ? 0 : false;\r\n    });\r\n    p.notes = '';\r\n    partnerCities.push(p);\r\n    renderConfigForm();\r\n  });\r\n\r\n  el('btn-save-config').addEventListener('click', function() {\r\n    readConfigForm();\r\n    closeConfigDrawer();\r\n    renderPartnerTable();\r\n    saveState();\r\n    tool.notify('Partner şehir verileri kaydedildi', 'success');\r\n  });\r\n}\r\n\r\nfunction openConfigDrawer() {\r\n  if (isReadOnly) { tool.notify('Salt okunur modda düzenleme yapılamaz', 'warning'); return; }\r\n  renderConfigForm();\r\n  el('config-drawer-overlay').classList.add('open');\r\n  el('config-drawer').classList.add('open');\r\n}\r\n\r\nfunction closeConfigDrawer() {\r\n  el('config-drawer-overlay').classList.remove('open');\r\n  el('config-drawer').classList.remove('open');\r\n}\r\n\r\nfunction renderConfigForm() {\r\n  var body = el('config-drawer-body');\r\n  if (partnerCities.length === 0) {\r\n    body.innerHTML = '<p style=\"color:var(--text-muted);font-size:13px;text-align:center;padding:20px;\">Henüz partner şehir eklenmedi.<br><strong>+ Partner Şehir Ekle<\/strong> butonunu kullanın.<\/p>';\r\n    return;\r\n  }\r\n  var stepKeys = Object.keys(STEP_LABELS);\r\n  var boolKeys = stepKeys.filter(function(k) { return NUMERIC_FIELDS.indexOf(k) === -1; });\r\n  var html = '';\r\n  partnerCities.forEach(function(p, i) {\r\n    html += '<div class=\"config-city-row\"><div class=\"city-header\"><strong>📍 ' + escHtml(p.city || 'Şehir #' + (i+1)) + '<\/strong><button type=\"button\" class=\"btn-remove-item\" data-idx=\"' + i + '\" title=\"Bu şehri sil\">🗑<\/button><\/div>';\r\n    html += '<div class=\"field-row\"><div class=\"field-half\"><label>Şehir<\/label><input type=\"text\" data-idx=\"' + i + '\" data-field=\"city\" value=\"' + escHtml(p.city || '') + '\" placeholder=\"örn: Toronto\"><\/div><div class=\"field-half\"><label>Partner Adı<\/label><input type=\"text\" data-idx=\"' + i + '\" data-field=\"partnerName\" value=\"' + escHtml(p.partnerName || '') + '\" placeholder=\"örn: Ahmet Yılmaz\"><\/div><\/div>';\r\n    html += '<label style=\"margin-top:8px\">Tamamlanan Adımlar<\/label>';\r\n    html += '<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px\">';\r\n    boolKeys.forEach(function(k) {\r\n      html += '<label style=\"display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;font-weight:400;text-transform:none;letter-spacing:0\"><input type=\"checkbox\" data-idx=\"' + i + '\" data-field=\"' + k + '\"' + (p[k] ? ' checked' : '') + ' style=\"width:auto;margin:0\"> ' + STEP_LABELS[k] + '<\/label>';\r\n    });\r\n    html += '<\/div>';\r\n    NUMERIC_FIELDS.forEach(function(k) {\r\n      html += '<div class=\"field-row\"><div class=\"field-half\"><label>' + STEP_LABELS[k] + '<\/label><input type=\"number\" data-idx=\"' + i + '\" data-field=\"' + k + '\" value=\"' + (p[k] || 0) + '\"><\/div><\/div>';\r\n    });\r\n    html += '<label>Notlar<\/label><input type=\"text\" data-idx=\"' + i + '\" data-field=\"notes\" value=\"' + escHtml(p.notes || '') + '\" placeholder=\"Ek notlar...\">';\r\n    html += '<\/div>';\r\n  });\r\n  body.innerHTML = html;\r\n\r\n  body.querySelectorAll('.btn-remove-item').forEach(function(btn) {\r\n    btn.addEventListener('click', function() {\r\n      var idx = parseInt(this.getAttribute('data-idx'), 10);\r\n      partnerCities.splice(idx, 1);\r\n      renderConfigForm();\r\n    });\r\n  });\r\n}\r\n\r\nfunction readConfigForm() {\r\n  var body = el('config-drawer-body');\r\n  body.querySelectorAll('input[data-field]').forEach(function(inp) {\r\n    var idx = parseInt(inp.getAttribute('data-idx'), 10);\r\n    var field = inp.getAttribute('data-field');\r\n    if (idx >= 0 && idx < partnerCities.length) {\r\n      if (inp.type === 'checkbox') {\r\n        partnerCities[idx][field] = inp.checked;\r\n      } else if (inp.type === 'number') {\r\n        partnerCities[idx][field] = parseInt(inp.value, 10) || 0;\r\n      } else {\r\n        partnerCities[idx][field] = inp.value;\r\n      }\r\n    }\r\n  });\r\n}\r\n\r\n/* ── Decisions (slide 17 textareas) ── */\r\nfunction loadDecisions() {\r\n  qsa('.decision-item textarea').forEach(function(ta) {\r\n    var key = ta.getAttribute('data-decision');\r\n    if (key && decisions[key] !== undefined) {\r\n      ta.value = decisions[key] || '';\r\n    }\r\n    ta.addEventListener('blur', function() {\r\n      saveDecision(key, ta.value);\r\n    });\r\n    var timer;\r\n    ta.addEventListener('input', function() {\r\n      clearTimeout(timer);\r\n      timer = setTimeout(function() { saveDecision(key, ta.value); }, 800);\r\n    });\r\n  });\r\n  /* PDF export button */\r\n  var expBtn = el('btn-export-pdf');\r\n  if (expBtn) expBtn.addEventListener('click', exportDecisionsPdf);\r\n}\r\n\r\nfunction exportDecisionsPdf() {\r\n  var html = '<h2>Future Bridge Academy — Karar Bekleyen Konular<\/h2>';\r\n  html += '<p>Tarih: ' + new Date().toLocaleDateString('tr-TR') + '<\/p><hr>';\r\n  var labels = {\r\n    pricing: 'Hangi hizmetler ücretli olacak?', priceLevel: 'Hangi seviyeden itibaren ücret alınacak?',\r\n    grants: 'Grant başvuruları', mixedModel: 'Karma model',\r\n    mentorModel: 'Mentor gönüllü/ücretli dengesi', sponsorship: 'Sponsorluk stratejisi',\r\n    teacherPay: 'Öğretmenler ücretli mi?', mentorChannels: 'İki kanallı mentorluk modeli',\r\n    volunteerRoles: 'Gönüllü talepleri'\r\n  };\r\n  Object.keys(labels).forEach(function(k) {\r\n    html += '<h3>' + labels[k] + '<\/h3><p>' + (decisions[k] || '(Henüz karar verilmedi)') + '<\/p>';\r\n  });\r\n  openExportWindow(html, 'kararlar');\r\n}\r\n\r\nfunction saveDecision(key, value) {\r\n  if (isReadOnly) return;\r\n  decisions[key] = value;\r\n  saveState();\r\n}\r\n\r\n/* ── Partner Report (slide 19) ── */\r\nfunction renderReport() {\r\n  var wrap = el('partner-report-wrap');\r\n  if (!wrap) return;\r\n  var stepKeys = Object.keys(STEP_LABELS);\r\n  var boolKeys = stepKeys.filter(function(k) { return NUMERIC_FIELDS.indexOf(k) === -1; });\r\n\r\n  if (partnerCities.length === 0) {\r\n    wrap.innerHTML = '<div class=\"stats-empty\">Henüz veri girilmedi. ⚙️ Veri Girişi butonundan partner şehir ekleyin.<\/div>';\r\n    return;\r\n  }\r\n\r\n  var html = '<div style=\"margin-bottom:16px\"><button type=\"button\" class=\"btn-config\" id=\"btn-export-report-pdf\" style=\"font-size:14px;padding:8px 18px\">📄 PDF Olarak Dışa Aktar<\/button><\/div>';\r\n  partnerCities.forEach(function(p) {\r\n    var done = 0;\r\n    boolKeys.forEach(function(k) { if (!!p[k]) done++; });\r\n    var pct = boolKeys.length > 0 ? Math.round(done / boolKeys.length * 100) : 0;\r\n\r\n    html += '<div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;margin-bottom:12px\">';\r\n    html += '<h4 style=\"margin-bottom:8px\">📍 ' + escHtml(p.city || '—') + ' — ' + escHtml(p.partnerName || '—') + ' <span style=\"color:var(--accent-dark);font-size:14px\">%' + pct + '<\/span><\/h4>';\r\n    html += '<div style=\"display:flex;flex-wrap:wrap;gap:6px 14px\">';\r\n    stepKeys.forEach(function(k) {\r\n      if (NUMERIC_FIELDS.indexOf(k) !== -1) {\r\n        html += '<span style=\"font-size:13px\">' + STEP_LABELS[k] + ': <strong>' + (p[k] || 0) + '<\/strong><\/span>';\r\n      } else {\r\n        html += '<span style=\"font-size:13px\">' + (!!p[k] ? '✅' : '⬜') + ' ' + STEP_LABELS[k] + '<\/span>';\r\n      }\r\n    });\r\n    html += '<\/div>';\r\n    if (p.notes) html += '<div style=\"margin-top:6px;font-size:13px;color:var(--text-secondary)\">📝 ' + escHtml(p.notes) + '<\/div>';\r\n    html += '<\/div>';\r\n  });\r\n  wrap.innerHTML = html;\r\n\r\n  var expBtn = el('btn-export-report-pdf');\r\n  if (expBtn) expBtn.addEventListener('click', exportReportPdf);\r\n}\r\n\r\nfunction exportReportPdf() {\r\n  var html = '<h2>Future Bridge Academy — Partner Şehir Raporu<\/h2>';\r\n  html += '<p>Tarih: ' + new Date().toLocaleDateString('tr-TR') + '<\/p><hr>';\r\n  partnerCities.forEach(function(p) {\r\n    html += '<h3>' + escHtml(p.city || '—') + ' — ' + escHtml(p.partnerName || '—') + '<\/h3><ul>';\r\n    Object.keys(STEP_LABELS).forEach(function(k) {\r\n      var val = NUMERIC_FIELDS.indexOf(k) !== -1 ? (p[k] || 0) : (!!p[k] ? '✅' : '⬜');\r\n      html += '<li>' + STEP_LABELS[k] + ': ' + val + '<\/li>';\r\n    });\r\n    if (p.notes) html += '<li>Not: ' + escHtml(p.notes) + '<\/li>';\r\n    html += '<\/ul>';\r\n  });\r\n  openExportWindow(html, 'partner-raporu');\r\n}\r\n\r\n/* ── Full Presentation Export ── */\r\nfunction showExportOptions() {\r\n  /* Simple confirm-style: two buttons */\
