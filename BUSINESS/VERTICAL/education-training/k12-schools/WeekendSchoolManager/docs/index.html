: 1; }\r\n.wsm-nav-item {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 10px;\r\n\tpadding: 9px 12px;\r\n\tborder-radius: 8px;\r\n\tcursor: pointer;\r\n\tfont-size: 13.5px;\r\n\tfont-weight: 500;\r\n\tcolor: var(--wsm-sidebar-ink);\r\n\tuser-select: none;\r\n\ttransition: background 0.15s;\r\n}\r\n.wsm-nav-item:hover { background: rgba(255, 255, 255, 0.07); color: #ffffff; }\r\n.wsm-nav-item.active { background: var(--wsm-primary); color: #ffffff; }\r\n.wsm-nav-icon { font-size: 16px; width: 20px; text-align: center; }\r\n.wsm-nav-badge {\r\n\tmargin-left: auto;\r\n\tbackground: rgba(255, 255, 255, 0.18);\r\n\tcolor: #ffffff;\r\n\tfont-size: 10.5px;\r\n\tpadding: 1px 7px;\r\n\tborder-radius: 10px;\r\n\tfont-weight: 600;\r\n}\r\n.wsm-nav-item.active .wsm-nav-badge { background: rgba(255, 255, 255, 0.28); }\r\n\r\n.wsm-sidebar-foot { padding: 8px 10px 4px; }\r\n.wsm-size-meter {\r\n\tbackground: rgba(255, 255, 255, 0.06);\r\n\tborder: 1px solid rgba(255, 255, 255, 0.1);\r\n\tborder-radius: 8px;\r\n\tpadding: 7px 10px;\r\n\tfont-size: 11px;\r\n\tcolor: #94a3b8;\r\n\ttext-align: center;\r\n\tcursor: help;\r\n}\r\n.wsm-size-meter.warn { border-color: #f59e0b; color: #fbbf24; }\r\n.wsm-size-meter.danger { border-color: #ef4444; color: #f87171; }\r\n\r\n/* ── Main ── */\r\n.wsm-main { flex: 1; min-width: 0; padding: 26px 30px 50px; }\r\n\r\n.wsm-page { display: none; }\r\n.wsm-page.active { display: block; }\r\n\r\n.wsm-page-head {\r\n\tdisplay: flex;\r\n\talign-items: flex-end;\r\n\tflex-wrap: wrap;\r\n\tgap: 8px 18px;\r\n\tmargin-bottom: 20px;\r\n}\r\n.wsm-page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.2px; }\r\n.wsm-page-sub { font-size: 13px; color: var(--wsm-muted); width: 100%; margin-top: 2px; }\r\n.wsm-page-actions {\r\n\tmargin-left: auto;\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 8px;\r\n\tflex-wrap: wrap;\r\n}\r\n\r\n.wsm-flex-spacer { flex: 1; }\r\n\r\n/* ── Buttons ── */\r\n.wsm-btn {\r\n\tborder: none;\r\n\tborder-radius: 8px;\r\n\tpadding: 8px 14px;\r\n\tfont-size: 13px;\r\n\tfont-weight: 600;\r\n\tfont-family: inherit;\r\n\tcursor: pointer;\r\n\ttransition: background 0.15s, opacity 0.15s;\r\n\twhite-space: nowrap;\r\n}\r\n.wsm-btn:disabled { opacity: 0.5; cursor: not-allowed; }\r\n.wsm-btn-primary { background: var(--wsm-primary); color: #ffffff; }\r\n.wsm-btn-primary:hover { background: var(--wsm-primary-dark); }\r\n.wsm-btn-ghost { background: #e2e8f0; color: var(--wsm-ink); }\r\n.wsm-btn-ghost:hover { background: #cbd5e1; }\r\n.wsm-btn-outline { background: #ffffff; color: var(--wsm-primary); border: 1.5px solid var(--wsm-primary); }\r\n.wsm-btn-outline:hover { background: var(--wsm-primary-soft); }\r\n.wsm-btn-danger { background: var(--wsm-red); color: #ffffff; }\r\n.wsm-btn-danger:hover { background: #b91c1c; }\r\n.wsm-btn-icon {\r\n\tbackground: #ffffff;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tcolor: var(--wsm-ink);\r\n\tpadding: 6px 10px;\r\n}\r\n.wsm-btn-icon:hover { background: #f8fafc; }\r\n.wsm-btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }\r\n.wsm-btn-link { background: none; border: none; color: var(--wsm-primary); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 2px 4px; }\r\n.wsm-btn-link:hover { text-decoration: underline; }\r\n\r\n.wsm-search {\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 8px;\r\n\tpadding: 8px 12px;\r\n\tfont-size: 13px;\r\n\tfont-family: inherit;\r\n\tbackground: #ffffff;\r\n\tmin-width: 200px;\r\n}\r\n.wsm-search:focus { outline: 2px solid var(--wsm-primary-soft); border-color: var(--wsm-primary); }\r\n\r\n.wsm-select {\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 8px;\r\n\tpadding: 7px 10px;\r\n\tfont-size: 13px;\r\n\tfont-family: inherit;\r\n\tbackground: #ffffff;\r\n\tmax-width: 230px;\r\n}\r\n.wsm-select:focus { outline: 2px solid var(--wsm-primary-soft); border-color: var(--wsm-primary); }\r\n\r\n.wsm-input {\r\n\twidth: 100%;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 8px;\r\n\tpadding: 8px 10px;\r\n\tfont-size: 13px;\r\n\tfont-family: inherit;\r\n\tbackground: #ffffff;\r\n}\r\n.wsm-input:focus { outline: 2px solid var(--wsm-primary-soft); border-color: var(--wsm-primary); }\r\n\r\ntextarea.wsm-input { resize: vertical; min-height: 70px; }\r\n\r\n.wsm-label { font-size: 12px; font-weight: 700; color: var(--wsm-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }\r\n.wsm-field { margin-bottom: 12px; }\r\n.wsm-field-row { display: flex; gap: 12px; }\r\n.wsm-field-row .wsm-field { flex: 1; }\r\n\r\n/* ── Chips ── */\r\n.wsm-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }\r\n.wsm-chip {\r\n\tborder: 1px solid var(--wsm-line);\r\n\tbackground: #ffffff;\r\n\tborder-radius: 16px;\r\n\tpadding: 4px 12px;\r\n\tfont-size: 12.5px;\r\n\tcursor: pointer;\r\n\tcolor: var(--wsm-muted);\r\n\tfont-weight: 600;\r\n\tuser-select: none;\r\n}\r\n.wsm-chip:hover { border-color: var(--wsm-primary); color: var(--wsm-primary); }\r\n.wsm-chip.active { background: var(--wsm-primary); border-color: var(--wsm-primary); color: #ffffff; }\r\n\r\n/* ── Cards / list ── */\r\n.wsm-card {\r\n\tbackground: var(--wsm-card);\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 12px;\r\n\tpadding: 18px;\r\n}\r\n.wsm-card + .wsm-card { margin-top: 14px; }\r\n.wsm-card-title {\r\n\tfont-size: 14px;\r\n\tfont-weight: 700;\r\n\tmargin-bottom: 10px;\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 8px;\r\n}\r\n.wsm-card-title .wsm-card-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }\r\n\r\n.wsm-student-list { display: flex; flex-direction: column; gap: 8px; }\r\n.wsm-student-row {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 14px;\r\n\tbackground: #ffffff;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 12px;\r\n\tpadding: 12px 16px;\r\n\tcursor: pointer;\r\n\ttransition: box-shadow 0.15s, border-color 0.15s;\r\n}\r\n.wsm-student-row:hover { box-shadow: 0 2px 10px rgba(15, 23, 42, 0.07); border-color: #cbd5e1; }\r\n.wsm-student-avatar {\r\n\twidth: 42px;\r\n\theight: 42px;\r\n\tflex: 0 0 42px;\r\n\tborder-radius: 50%;\r\n\tbackground: var(--wsm-primary-soft);\r\n\tcolor: var(--wsm-primary-dark);\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tjustify-content: center;\r\n\tfont-weight: 700;\r\n\tfont-size: 15px;\r\n}\r\n.wsm-student-main { flex: 1; min-width: 0; }\r\n.wsm-student-name { font-weight: 700; font-size: 14.5px; }\r\n.wsm-student-meta { font-size: 12.5px; color: var(--wsm-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n.wsm-student-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\r\n\r\n/* ── Pills ── */\r\n.wsm-pill {\r\n\tdisplay: inline-block;\r\n\tpadding: 2px 10px;\r\n\tborder-radius: 12px;\r\n\tfont-size: 11.5px;\r\n\tfont-weight: 700;\r\n\tletter-spacing: 0.2px;\r\n}\r\n.wsm-pill-teal { background: var(--wsm-primary-soft); color: var(--wsm-primary-dark); }\r\n.wsm-pill-green { background: var(--wsm-green-soft); color: #166534; }\r\n.wsm-pill-amber { background: var(--wsm-amber-soft); color: #92400e; }\r\n.wsm-pill-red { background: var(--wsm-red-soft); color: #991b1b; }\r\n.wsm-pill-blue { background: var(--wsm-blue-soft); color: #1e40af; }\r\n.wsm-pill-purple { background: var(--wsm-purple-soft); color: #5b21b6; }\r\n.wsm-pill-gray { background: #f1f5f9; color: #475569; }\r\n\r\n/* ── Tables ── */\r\n.wsm-table-wrap { overflow-x: auto; background: #ffffff; border: 1px solid var(--wsm-line); border-radius: 12px; }\r\n.wsm-table { width: 100%; border-collapse: collapse; font-size: 13px; }\r\n.wsm-table th {\r\n\tbackground: #f8fafc;\r\n\tcolor: var(--wsm-muted);\r\n\ttext-align: left;\r\n\tpadding: 10px 12px;\r\n\tfont-size: 11px;\r\n\ttext-transform: uppercase;\r\n\tletter-spacing: 0.6px;\r\n\tborder-bottom: 1px solid var(--wsm-line);\r\n\twhite-space: nowrap;\r\n}\r\n.wsm-table td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }\r\n.wsm-table tr:last-child td { border-bottom: none; }\r\n.wsm-table tbody tr:hover { background: #f8fafc; }\r\n\r\n/* ── Attendance ── */\r\n.wsm-week-nav { display: flex; align-items: center; gap: 8px; }\r\n.wsm-week-title { font-size: 16px; font-weight: 700; margin: 0 6px; min-width: 180px; text-align: center; }\r\n\r\n.wsm-att-status { font-size: 12.5px; display: flex; align-items: center; gap: 8px; }\r\n.wsm-att-status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }\r\n\r\n.wsm-att-tools { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }\r\n\r\n.wsm-att-cell {\r\n\twidth: 34px;\r\n\theight: 30px;\r\n\tborder-radius: 7px;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tbackground: #ffffff;\r\n\tcursor: pointer;\r\n\tfont-size: 12.5px;\r\n\tfont-weight: 700;\r\n\tfont-family: inherit;\r\n\ttransition: transform 0.08s;\r\n}\r\n.wsm-att-cell:hover { transform: scale(1.1); }\r\n.wsm-att-cell.p { background: var(--wsm-green); border-color: var(--wsm-green); color: #ffffff; }\r\n.wsm-att-cell.a { background: var(--wsm-red); border-color: var(--wsm-red); color: #ffffff; }\r\n.wsm-att-cell.l { background: var(--wsm-amber); border-color: var(--wsm-amber); color: #ffffff; }\r\n.wsm-att-cell.e { background: var(--wsm-blue); border-color: var(--wsm-blue); color: #ffffff; }\r\n\r\n.wsm-att-legend { display: flex; gap: 20px; align-items: flex-start; font-size: 12px; color: var(--wsm-muted); margin-top: 10px; flex-wrap: wrap; }\r\n.wsm-legend-item { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; min-width: 54px; text-align: center; }\r\n.wsm-legend-item span:last-child { text-align: center; }\r\n.wsm-legend-hint { display: inline-flex; align-items: center; height: 44px; }\r\n\r\n.wsm-lesson-teacher { font-size: 10px; font-weight: 600; color: var(--wsm-primary); margin-top: 3px; white-space: nowrap; }\r\n.wsm-th-sub { font-size: 10px; color: var(--wsm-muted); font-weight: 600; }\r\n\r\n.wsm-att-open { margin-top: 18px; }\r\n.wsm-att-open-row {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 10px;\r\n\tbackground: #ffffff;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 10px;\r\n\tpadding: 9px 14px;\r\n\tmargin-bottom: 6px;\r\n\tfont-size: 13px;\r\n}\r\n.wsm-att-open-row:hover { border-color: var(--wsm-primary); }\r\n.wsm-att-open-row .wsm-btn { margin-left: auto; }\r\n\r\n/* ── Payments ── */\r\n.wsm-pay-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }\r\n.wsm-stat {\r\n\tbackground: #ffffff;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 12px;\r\n\tpadding: 14px 16px;\r\n}\r\n.wsm-stat-value { font-size: 22px; font-weight: 800; }\r\n.wsm-stat-label { font-size: 11.5px; color: var(--wsm-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }\r\n.wsm-stat-value.warn { color: var(--wsm-red); }\r\n.wsm-stat-value.ok { color: var(--wsm-green); }\r\n\r\n.wsm-pay-select {\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 7px;\r\n\tpadding: 5px 8px;\r\n\tfont-size: 12.5px;\r\n\tfont-family: inherit;\r\n\tbackground: #ffffff;\r\n\tcursor: pointer;\r\n}\r\n.wsm-pay-select.paid { background: var(--wsm-green-soft); border-color: #86efac; color: #166534; }\r\n.wsm-pay-select.partial { background: var(--wsm-blue-soft); border-color: #93c5fd; color: #1e40af; }\r\n.wsm-pay-select.late { background: var(--wsm-amber-soft); border-color: #fcd34d; color: #92400e; }\r\n.wsm-pay-select.exempt { background: var(--wsm-purple-soft); border-color: #c4b5fd; color: #5b21b6; }\r\n.wsm-pay-select.unpaid { background: var(--wsm-red-soft); border-color: #fca5a5; color: #991b1b; }\r\n\r\n.wsm-pay-amount { width: 84px; }\r\n.wsm-pay-note { width: 170px; }\r\n\r\n/* Waiting payments (debts) */\r\n.wsm-debt-row {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 10px;\r\n\tflex-wrap: wrap;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 10px;\r\n\tpadding: 9px 12px;\r\n\tmargin-bottom: 8px;\r\n\tbackground: #ffffff;\r\n}\r\n.wsm-debt-row:hover { border-color: #cbd5e1; }\r\n.wsm-debt-main { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 1px; }\r\n.wsm-debt-meta { font-size: 12px; color: var(--wsm-muted); }\r\n.wsm-debt-due { width: 140px; }\r\n\r\n/* Bracket editor in Settings */\r\n.wsm-bracket-head {\r\n\tdisplay: grid;\r\n\tgrid-template-columns: minmax(140px, 1fr) 110px 110px auto 40px;\r\n\tgap: 8px;\r\n\tpadding: 4px 0 8px;\r\n\tfont-size: 11px;\r\n\tfont-weight: 700;\r\n\tcolor: var(--wsm-muted);\r\n\ttext-transform: uppercase;\r\n\tletter-spacing: 0.5px;\r\n}\r\n.wsm-bracket-row {\r\n\tdisplay: grid;\r\n\tgrid-template-columns: minmax(140px, 1fr) 110px 110px auto 40px;\r\n\tgap: 8px;\r\n\talign-items: center;\r\n\tmargin-bottom: 8px;\r\n}\r\n.wsm-bracket-name { min-width: 0; }\r\n.wsm-bracket-fee { width: 100%; }\r\n.wsm-bracket-currency { font-size: 12px; color: var(--wsm-muted); white-space: nowrap; }\r\n\r\n/* Student documents */\r\n.wsm-doc-upload-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }\r\n.wsm-doc-list { display: flex; flex-direction: column; gap: 6px; }\r\n.wsm-doc-row {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 10px;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 8px;\r\n\tpadding: 7px 10px;\r\n\tbackground: #f8fafc;\r\n\tflex-wrap: wrap;\r\n}\r\n.wsm-doc-name { flex: 1; min-width: 140px; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\r\n\r\n/* Drawer payments list */\r\n.wsm-drawer-pay-add { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }\r\n.wsm-drawer-add-month { width: 150px; }\r\n.wsm-drawer-add-amount { width: 110px; }\r\n.wsm-drawer-pay-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }\r\n.wsm-drawer-pay-row {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 10px;\r\n\tflex-wrap: wrap;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 10px;\r\n\tpadding: 9px 12px;\r\n\tmargin-bottom: 8px;\r\n\tbackground: #ffffff;\r\n}\r\n.wsm-drawer-pay-row:hover { border-color: #cbd5e1; }\r\n.wsm-drawer-pay-row.paid { opacity: 0.72; }\r\n.wsm-drawer-pay-row.paid .wsm-drawer-pay-month { text-decoration: line-through; text-decoration-thickness: 1.5px; }\r\n.wsm-drawer-pay-check { width: 18px; height: 18px; accent-color: var(--wsm-primary); cursor: pointer; flex: 0 0 auto; }\r\n.wsm-drawer-pay-main { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 1px; }\r\n.wsm-drawer-pay-month { font-weight: 700; font-size: 13.5px; }\r\n.wsm-drawer-pay-due { font-size: 11.5px; color: var(--wsm-muted); }\r\n.wsm-drawer-pay-amount { width: 90px; }\r\n.wsm-drawer-pay-currency { font-size: 12px; color: var(--wsm-muted); white-space: nowrap; }\r\n\r\n/* Message modal */\r\n.wsm-msg-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }\r\n.wsm-msg-email-preview { background: #f8fafc; border: 1px solid var(--wsm-line); border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 13px; }\r\n.wsm-msg-email-preview .wsm-kv-row { margin-bottom: 6px; }\r\n\r\n/* ── Progress ── */\r\n.wsm-flag-strip { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }\r\n.wsm-flag-row {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 10px;\r\n\tbackground: var(--wsm-amber-soft);\r\n\tborder: 1px solid #fcd34d;\r\n\tborder-radius: 10px;\r\n\tpadding: 8px 14px;\r\n\tfont-size: 13px;\r\n}\r\n.wsm-flag-row.red { background: var(--wsm-red-soft); border-color: #fca5a5; }\r\n.wsm-flag-row .wsm-btn { margin-left: auto; }\r\n\r\n.wsm-progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\r\n@media (max-width: 1100px) { .wsm-progress-grid { grid-template-columns: 1fr; } }\r\n\r\n.wsm-note-list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }\r\n.wsm-note-row { border: 1px solid var(--wsm-line); border-radius: 10px; padding: 10px 12px; font-size: 13px; background: #ffffff; }\r\n.wsm-note-row.head { border-left: 4px solid var(--wsm-amber); }\r\n.wsm-note-row.drop { border-left: 4px solid var(--wsm-red); }\r\n.wsm-note-meta { font-size: 11px; color: var(--wsm-muted); margin-top: 4px; }\r\n.wsm-note-text { white-space: pre-wrap; }\r\n\r\n.wsm-surah-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--wsm-line); font-size: 13px; }\r\n.wsm-surah-row:last-child { border-bottom: none; }\r\n.wsm-surah-name { font-weight: 700; min-width: 130px; }\r\n\r\n/* ── Communication ── */\r\n.wsm-comm-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--wsm-line); margin-bottom: 18px; flex-wrap: wrap; }\r\n.wsm-comm-tab {\r\n\tborder: none;\r\n\tbackground: none;\r\n\tpadding: 8px 14px;\r\n\tfont-size: 13px;\r\n\tfont-weight: 600;\r\n\tfont-family: inherit;\r\n\tcolor: var(--wsm-muted);\r\n\tcursor: pointer;\r\n\tborder-bottom: 2px solid transparent;\r\n\tmargin-bottom: -2px;\r\n}\r\n.wsm-comm-tab:hover { color: var(--wsm-ink); }\r\n.wsm-comm-tab.active { color: var(--wsm-primary); border-bottom-color: var(--wsm-primary); }\r\n\r\n.wsm-msg-card {\r\n\tbackground: #ffffff;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 12px;\r\n\tpadding: 14px 16px;\r\n\tmargin-bottom: 10px;\r\n}\r\n.wsm-msg-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--wsm-muted); margin-bottom: 6px; }\r\n.wsm-msg-text { white-space: pre-wrap; font-size: 13.5px; }\r\n.wsm-msg-actions { margin-top: 8px; display: flex; gap: 6px; }\r\n\r\n.wsm-sugg-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\r\n.wsm-sugg-followup { flex: 1; min-width: 160px; }\r\n\r\n/* ── Reports ── */\r\n.wsm-report-content { background: #ffffff; border: 1px solid var(--wsm-line); border-radius: 12px; padding: 22px; }\r\n.wsm-report-sec { margin-bottom: 18px; }\r\n.wsm-report-sec h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--wsm-primary); margin-bottom: 8px; }\r\n.wsm-report-sec pre {\r\n\tbackground: #f8fafc;\r\n\tborder: 1px solid var(--wsm-line);\r\n\tborder-radius: 10px;\r\n\tpadding: 14px;\r\n\tfont-size: 12.5px;\r\n\twhite-space: pre-wrap;\r\n\tfont-family: \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\r\n\tline-height: 1.55;\r\n}\r\n\r\n/* ── Settings ── */\r\n.wsm-settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 900px; }\r\n@media (max-width: 1000px) { .wsm-settings-grid { grid-template-columns: 1fr; } }\r\n\r\n/* ── Modal ── */\r\n.wsm-overlay {\r\n\tposition: fixed;\r\n\tinset: 0;\r\n\tbackground: rgba(15, 23, 42, 0.5);\r\n\tdisplay: none;\r\n\talign-items: center;\r\n\tjustify-content: center;\r\n\tz-index: 60;\r\n\tpadding: 20px;\r\n}\r\n.wsm-overlay.open { display: flex; }\r\n\r\n/* Modals must always paint above the student drawer */\r\n#wsm-modal-overlay { z-index: 80; }\r\n#wsm-drawer-overlay { z-index: 60; }\r\n\r\n.wsm-modal {\r\n\tbackground: #ffffff;\r\n\tborder-radius: 14px;\r\n\twidth: 100%;\r\n\tmax-width: 620px;\r\n\tmax-height: 90vh;\r\n\tdisplay: flex;\r\n\tflex-direction: column;\r\n\tbox-shadow: 0 20px 60px rgba(15, 23, 42, 0.3);\r\n}\r\n.wsm-modal-head {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tjustify-content: space-between;\r\n\tpadding: 16px 20px;\r\n\tborder-bottom: 1px solid var(--wsm-line);\r\n}\r\n.wsm-modal-head h3 { font-size: 16px; }\r\n.wsm-modal-body { padding: 18px 20px; overflow-y: auto; }\r\n.wsm-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--wsm-line); }\r\n\r\n/* ── Drawer ── */\r\n.wsm-overlay.drawer-mode { justify-content: flex-end; padding: 0; background: rgba(15, 23, 42, 0.45); }\r\n.wsm-drawer {\r\n\tbackground: var(--wsm-bg);\r\n\twidth: 100%;\r\n\tmax-width: 760px;\r\n\theight: 100%;\r\n\tdisplay: flex;\r\n\tflex-direction: column;\r\n\tbox-shadow: -10px 0 40px rgba(15, 23, 42, 0.25);\r\n\tanimation: wsmSlideIn 0.18s ease;\r\n}\r\n@keyframes wsmSlideIn { from { transform: translateX(40px); opacity: 0.5; } to { transform: none; opacity: 1; } }\r\n\r\n.wsm-drawer-head {\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tgap: 12px;\r\n\tpadding: 16px 20px;\r\n\tbackground: #ffffff;\r\n\tborder-bottom: 1px solid var(--wsm-line);\r\n}\r\n.wsm-drawer-avatar {\r\n\twidth: 46px;\r\n\theight: 46px;\r\n\tborder-radius: 50%;\r\n\tbackground: var(--wsm-primary);\r\n\tcolor: #ffffff;\r\n\tdisplay: flex;\r\n\talign-items: center;\r\n\tjustify-content: center;\r\n\tfont-weight: 700;\r\n\tfont-size: 16px;\r\n}\r\n.wsm-drawer-heading { flex: 1; min-width: 0; }\r\n.wsm-drawer-name { font-size: 17px; font-weight: 800; }\r\n.wsm-drawer-meta { font-size: 12.5px; color: var(--wsm-muted); }\r\n\r\n.wsm-drawer-tabs { display: flex; gap: 4px; background: #ffffff; border-bottom: 1px solid var(--wsm-line); padding: 0 14px; overflow-x: auto; }\r\n.wsm-drawer-tab {\r\n\tborder: none;\r\n\tbackground: none;\r\n\tpadding: 10px 12px;\r\n\tfont-size: 12.5px;\r\n\tfont-weight: 600;\r\n\tfont-family: inherit;\r\n\tcolor: var(--wsm-muted);\r\n\tcursor: pointer;\r\n\tborder-bottom: 2px solid transparent;\r\n\twhite-space: nowrap;\r\n}\r\n.wsm-drawer-tab.active { color: var(--wsm-primary); border-bottom-color: var(--wsm-primary); }\r\n\r\n.wsm-drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px; }\r\n\r\n.wsm-kv { display: flex; flex-direction: column; gap: 10px; }\r\n.wsm-kv-row { display: flex; gap: 12px; font-size: 13.5px; }\r\n.wsm-kv-key { flex: 0 0 150px; color: var(--wsm-muted); font-weight: 600; }\r\n.wsm-kv-val { flex: 1; }\r\n\r\n/* ── Empty state ── */\r\n.wsm-empty {\r\n\tbackground: #ffffff;\r\n\tborder: 1.5px dashed var(--wsm-line);\r\n\tborder-radius: 12px;\r\n\tpadding: 40px 20px;\r\n\ttext-align: center;\r\n\tcolor: var(--wsm-muted);\r\n}\r\n.wsm-empty h3 { color: var(-
