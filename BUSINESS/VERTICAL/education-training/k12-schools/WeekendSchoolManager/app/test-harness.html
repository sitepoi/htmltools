<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekend School Manager - Test Harness</title>
<link rel="stylesheet" href="WeekendSchoolManager.css">
<style>
body { padding-top: 30px !important; margin: 0; }
#app-container { min-height: calc(100vh - 30px); }
#th-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #0f172a; color: #e6edf5; font-family: system-ui; font-size: 11px; padding: 5px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#th-bar strong { color: #2dd4bf; letter-spacing: 0.5px; }
#th-bar .sep { color: #475569; }
#th-bar button { border: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; font-family: system-ui; font-weight: 600; }
#th-bar .btn-load { background: #0d9488; color: #fff; }
#th-bar .btn-clear { background: #dc2626; color: #fff; }
#th-bar .btn-reload { background: #16a34a; color: #fff; }
#th-bar .btn-role { background: #334155; color: #fff; }
#th-bar .hint { color: #64748b; font-size: 10px; }
/* ?bare=1 - marketing screenshots show the real app only */
body.th-bare { padding-top: 0 !important; }
body.th-bare #th-bar { display: none !important; }
body.th-bare #app-container { min-height: 100vh; }
@keyframes toolFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="th-bar">
  <strong>TEST HARNESS - Weekend School Manager</strong><span class="sep">|</span>
  <button class="btn-load" id="th-load-sample">Load Sample Data</button>
  <button class="btn-clear" id="th-clear">Clear All</button>
  <button class="btn-reload" id="th-reload">Reload</button>
  <button class="btn-role" id="th-role">Role: admin</button>
  <span class="sep">|</span>
  <span class="hint">Ctrl+Shift+R = Toggle Read-Only</span>
  <span class="sep">|</span>
  <span id="th-status" class="hint">Loading...</span>
</div>
<div id="app-container"></div>

<script>
/* ── Mock tool SDK ── */
(function() {
  // ?bare=1 hides the harness toolbar (marketing screenshots show the real app only)
  if (new URLSearchParams(window.location.search).get('bare') === '1') {
    document.body.classList.add('th-bare');
  }
  var STORAGE_KEY = 'weekend_school_manager_test_db';
  var listeners = { valueChange: [], fieldsChange: [], readonlyChange: [], userChange: [] };
  var _readOnly = false, _user = null, _fields = {}, _value = null;
  var ROLES = ['admin', 'editor', 'viewer', 'none'];

  function load() {
    try { var raw = localStorage.getItem(STORAGE_KEY); _value = raw ? JSON.parse(raw) : null; }
    catch(e) { _value = null; }
  }
  function save(v) { _value = v; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch(e) {} }
  function currentRole() {
    var p = (new URLSearchParams(window.location.search)).get('role');
    if (p && ROLES.indexOf(p) > -1) return p;
    return localStorage.getItem(STORAGE_KEY + '_role') || 'admin';
  }
  function roleUser(role) {
    if (role === 'none') return null;
    return { id: 'u_' + role, name: 'Harness ' + role, email: role + '@harness.test', roles: [role], effectiveAccess: { isViewer: true, isEditor: role !== 'viewer', isManager: role === 'admin' } };
  }
  function setRole(role) {
    localStorage.setItem(STORAGE_KEY + '_role', role);
    _user = roleUser(role);
    var btn = document.getElementById('th-role');
    if (btn) btn.textContent = 'Role: ' + role;
    listeners.userChange.forEach(function(cb) { try { cb(_user); } catch(e) {} });
  }

  window.tool = {
    getValue: function() { return _value; },
    setValue: function(data) { save(data); },
    onValueChange: function(cb) { listeners.valueChange.push(cb); },
    getFields: function() { return Object.assign({}, _fields); },
    setField: function(id, value) { _fields[id] = value; },
    setFields: function(obj) { Object.assign(_fields, obj); },
    watchField: function(id, cb) { listeners.fieldsChange.push(cb); },
    onFieldsChange: function(cb) { listeners.fieldsChange.push(cb); },
    param: function(name, fallback) {
      var p = (new URLSearchParams(window.location.search)).get(name);
      return p !== null && p !== '' ? p : fallback;
    },
    isReadOnly: function() { return _readOnly; },
    onReadonlyChange: function(cb) { listeners.readonlyChange.push(cb); },
    getUser: function() { return _user; },
    onUserChange: function(cb) { listeners.userChange.push(cb); },
    requestSave: function(cb) { setTimeout(function() { cb(null, true); }, 10); },
    requestUpload: function(accept, cb) {
      setTimeout(function() { cb(null, { name: 'signed-form.pdf', url: 'mock://uploads/signed-form-' + Date.now() + '.pdf', size: 2048, type: 'application/pdf' }); }, 30);
    },
    requestFileContent: function(url, cb) { setTimeout(function() { cb(null, 'Mock extracted document text.'); }, 30); },
    requestSendEmail: function(options, cb) { console.log('[harness] requestSendEmail to:', options.to, '| subject:', options.subject); setTimeout(function() { cb(null, { ok: true }); }, 30); },
    requestExportPdf: function(options, cb) { console.log('[harness] requestExportPdf', options.filename); cb(null, ''); },
    openUrl: function(url) { console.log('[harness] openUrl', url); },
    reportValid: function(bool, msg) { if (!bool) console.warn('[Validation]', msg); },
    notify: function(message, severity) {
      severity = severity || 'info';
      var colors = { info: '#0d9488', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:' + (colors[severity] || '#333') + ';color:#fff;padding:10px 20px;border-radius:6px;font-family:system-ui;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toolFadeIn .3s ease;max-width:400px;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(function() { toast.remove(); }, 300); }, 2500);
    },
    resize: function() {},
    declareOutput: function() {},
    declareParams: function() {},
    onReady: function(cb) {
      load();
      var qa = new URLSearchParams(window.location.search);
      if (qa.get('fresh') === '1') { _value = null; save(_value); }
      if (qa.get('sample') === '1' && !_value && typeof buildSample === 'function') { _value = buildSample(); save(_value); }
      // Only real WESM page names are forwarded to the tool. Generic capture
      // page names (documents, finder, ...) are mapped to views after boot.
      var WSM_PAGES = ['students', 'attendance', 'payments', 'progress', 'communication', 'reports', 'settings'];
      var qaPage = qa.get('page');
      if (qaPage && WSM_PAGES.indexOf(qaPage) > -1 && _value) { _value.ui = _value.ui || {}; _value.ui.activePage = qaPage; save(_value); }
      _user = roleUser(currentRole()); setRole(currentRole()); cb(_value, _fields);
    },
    _loadSampleData: function(data) { save(data); window.location.reload(); },
    _setActivePage: function(page) {
      load();
      _value = _value || {};
      _value.ui = _value.ui || {};
      if (_value.ui.activePage === page) return;
      _value.ui.activePage = page;
      save(_value);
      window.location.reload();
    },
    _clearData: function() { localStorage.removeItem(STORAGE_KEY); window.location.reload(); },
    _toggleReadOnly: function() { _readOnly = !_readOnly; listeners.readonlyChange.forEach(function(cb) { try { cb(_readOnly); } catch(e) {} }); },
    _cycleRole: function() {
      var idx = ROLES.indexOf(currentRole());
      setRole(ROLES[(idx + 1) % ROLES.length]);
      window.location.reload();
    },
    _dump: function() { console.log('WSM DB:', JSON.parse(JSON.stringify(_value))); }
  };

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); window.tool._toggleReadOnly(); window.tool.notify(window.tool.isReadOnly() ? 'READ-ONLY MODE' : 'EDIT MODE', 'info'); }
    if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault(); window.tool._dump(); window.tool.notify('DB dumped to console', 'info'); }
  });
})();
</script>

<script>
/* ── Sample data ── */
function isoOfDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function sundayOf(d) { var c = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var day = c.getDay(); if (day !== 0) c.setDate(c.getDate() - day); return c; }
function monthKeyOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function addMonthsToKey(ym, n) { var p = ym.split('-'); var d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1); return monthKeyOf(d); }
function addDaysIso(iso, n) { var p = iso.split('-').map(Number); var d = new Date(p[0], p[1] - 1, p[2]); d.setDate(d.getDate() + n); return isoOfDate(d); }

function buildSample() {
  var today = new Date();
  var thisSunday = isoOfDate(sundayOf(today));
  var lastSunday = addDaysIso(thisSunday, -7);
  var thisMonth = monthKeyOf(today);
  var lastMonth = addMonthsToKey(thisMonth, -1);
  var bracketFull = 'b_full', bracketSibling = 'b_sibling';

  function student(firstName, lastName, group, bracket, extra) {
    var s = {
      id: 's_' + firstName.toLowerCase(), firstName: firstName, lastName: lastName,
      gender: '', dateOfBirth: '', classGroup: group, startDate: lastMonth + '-05', status: 'active', paymentBracketId: bracket,
      parentName: extra.parentName, parentPhone: extra.parentPhone, parentEmail: extra.parentEmail || '', parentRelation: 'Mother',
      secondParentName: '', secondParentPhone: '',
      address: '', emergencyContactName: '', emergencyContactPhone: '', emergencyContactRelation: '',
      allergies: extra.allergies || '', healthNotes: '', pickupAuthorizedNames: '', pickupNotes: '',
      photoConsent: 'yes',
      paymentEntries: [], documents: [], progressNotes: [], teacherContactLog: [],
      quranReading: { currentLevel: extra.quranLevel, levelHistory: [{ date: lastMonth + '-10', level: extra.prevLevel }] },
      quranMemorization: { surahs: extra.surahs, nextTarget: extra.nextTarget },
      parentCommunication: { oneOnOne: [], absenceCalls: [] },
      attendanceByDate: {}
    };
    s.paymentEntries.push({ id: 'pe_' + firstName.toLowerCase() + '_last', month: lastMonth, amount: extra.fee, dueDate: lastMonth + '-01', status: 'paid', paidDate: lastMonth + '-03', note: '', recordedBy: 'Harness admin' });
    s.paymentEntries.push({ id: 'pe_' + firstName.toLowerCase() + '_this', month: thisMonth, amount: extra.fee, dueDate: thisMonth + '-01', status: extra.thisMonthStatus, paidDate: extra.thisMonthStatus === 'paid' ? thisMonth + '-02' : '', note: '', recordedBy: 'Harness admin' });
    if (extra.extraDebt) {
      s.paymentEntries.push({ id: 'pe_' + firstName.toLowerCase() + '_debt', month: addMonthsToKey(thisMonth, -2), amount: extra.extraDebt.amount, dueDate: extra.extraDebt.dueDate, status: 'late', paidDate: '', note: extra.extraDebt.note, recordedBy: 'Harness admin' });
    }
    if (extra.documents) s.documents = extra.documents;
    var lessons = ['Quran Reading', 'Islamic Studies', 'Prayer Practice', 'Quran Memorization'];
    if (extra.absentLastWeek) {
      s.attendanceByDate[lastSunday] = { lessons: { 'Quran Reading': { mark: 'A', teacherName: 'Harness admin', teacherAt: '' }, 'Islamic Studies': { mark: 'A', teacherName: 'Harness admin', teacherAt: '' }, 'Prayer Practice': { mark: 'A', teacherName: 'Harness admin', teacherAt: '' }, 'Quran Memorization': { mark: 'A', teacherName: 'Harness admin', teacherAt: '' } }, note: '' };
      s.parentCommunication.absenceCalls.push({ date: addDaysIso(lastSunday, 1), reason: 'Sick', outcome: 'Spoke to mother, will return next week.' });
    } else {
      s.attendanceByDate[lastSunday] = { lessons: { 'Quran Reading': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' }, 'Islamic Studies': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' }, 'Prayer Practice': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' }, 'Quran Memorization': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' } }, note: '' };
    }
    if (extra.absentThisWeek) s.attendanceByDate[thisSunday] = { lessons: { 'Quran Reading': { mark: 'L', teacherName: 'Harness admin', teacherAt: '' }, 'Islamic Studies': { mark: '', teacherName: '', teacherAt: '' }, 'Prayer Practice': { mark: '', teacherName: '', teacherAt: '' }, 'Quran Memorization': { mark: '', teacherName: '', teacherAt: '' } }, note: 'Arrived late' };
    else s.attendanceByDate[thisSunday] = { lessons: { 'Quran Reading': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' }, 'Islamic Studies': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' }, 'Prayer Practice': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' }, 'Quran Memorization': { mark: 'P', teacherName: 'Harness admin', teacherAt: '' } }, note: '' };
    if (extra.note) s.progressNotes.push({ date: thisMonth + '-08', note: extra.note.text, flag: extra.note.flag || 'none', recordedBy: 'Harness admin' });
    if (extra.contact) s.teacherContactLog.push({ date: thisMonth + '-05', method: 'WhatsApp', summary: extra.contact, recordedBy: 'Harness admin' });
    return s;
  }

  var students = [
    student('Yusuf', 'Demir', 'Quran Level 1', bracketFull, { parentName: 'Ayse Demir', parentPhone: '604-555-0101', parentEmail: 'ayse.demir@example.com', fee: 40, quranLevel: 'Elifba 2', prevLevel: 'Elifba 1', surahs: [{ name: 'Surah Al-Fatiha', status: 'memorized', portions: '' }, { name: 'Surah Al-Ikhlas', status: 'inProgress', portions: '1/2' }], nextTarget: 'Finish Surah Al-Ikhlas', thisMonthStatus: 'paid', note: { text: 'Reading letters much faster now.', flag: 'none' }, contact: 'Mother confirmed daily home practice.', documents: [{ id: 'd1', name: 'photo-consent-yusuf.pdf', url: 'mock://uploads/photo-consent-yusuf.pdf', kind: 'photoConsent', uploadedAt: lastMonth + '-06T10:00:00.000Z', uploadedBy: 'Harness admin' }, { id: 'd2', name: 'emergency-info-yusuf.pdf', url: 'mock://uploads/emergency-info-yusuf.pdf', kind: 'emergencyInfo', uploadedAt: lastMonth + '-06T10:05:00.000Z', uploadedBy: 'Harness admin' }] }),
    student('Zeynep', 'Kaya', 'Quran Level 1', bracketSibling, { parentName: 'Fatma Kaya', parentPhone: '604-555-0102', fee: 30, quranLevel: 'Quran Level 1', prevLevel: 'Elifba 2', surahs: [{ name: 'Surah Al-Fatiha', status: 'memorized', portions: '' }], nextTarget: 'Surah Al-Nas', thisMonthStatus: 'unpaid', absentLastWeek: true, note: { text: 'Absent twice in a row, parent did not answer messages.', flag: 'attention' }, extraDebt: { amount: 25, dueDate: addMonthsToKey(thisMonth, -2) + '-15', note: 'Registration fee' } }),
    student('Omar', 'Hassan', 'Quran Level 2', bracketFull, { parentName: 'Layla Hassan', parentPhone: '604-555-0103', fee: 40, quranLevel: 'Quran Level 2', prevLevel: 'Quran Level 1', surahs: [{ name: 'Surah Al-Fil', status: 'inProgress', portions: '1/3' }], nextTarget: 'Surah Quraysh', thisMonthStatus: 'paid', note: { text: 'Excellent tajweed progress.', flag: 'none' } }),
    student('Meryem', 'Ozturk', 'Quran Level 2', bracketSibling, { parentName: 'Elif Ozturk', phone: '604-555-0104', parentPhone: '604-555-0104', fee: 30, quranLevel: 'Quran Level 2', prevLevel: 'Quran Level 1', surahs: [], nextTarget: '', thisMonthStatus: 'late', absentThisWeek: true, note: { text: 'Has missed 3 of the last 4 weeks, seems to be losing interest.', flag: 'droppingInterest' } }),
    student('Ali', 'Yildiz', 'Quran Level 3', bracketFull, { parentName: 'Zehra Yildiz', parentPhone: '604-555-0105', fee: 40, quranLevel: 'Quran Level 3', prevLevel: 'Quran Level 2', surahs: [{ name: 'Juz 30 first half', status: 'revision', portions: '' }], nextTarget: 'Finish Juz 30 revision', thisMonthStatus: 'paid', contact: 'Asked about moving to Level 4 next term.' }),
    student('Huda', 'Farah', 'Quran Level 3', bracketFull, { parentName: 'Mariam Farah', parentPhone: '604-555-0106', fee: 40, quranLevel: 'Quran Level 3', prevLevel: 'Quran Level 2', surahs: [], nextTarget: '', thisMonthStatus: 'paid', allergies: 'Peanut allergy' })
  ];

  return {
    version: 1,
    school: {
      name: 'Horizon Weekend School',
      classGroups: ['Quran Level 1', 'Quran Level 2', 'Quran Level 3'],
      lessons: ['Quran Reading', 'Islamic Studies', 'Prayer Practice', 'Quran Memorization'],
      paymentBrackets: [{ id: bracketFull, name: 'Full', monthlyFee: 40 }, { id: bracketSibling, name: 'Sibling', monthlyFee: 30 }],
      currency: 'CAD', paymentDueDay: 1, requiredAttendanceChecksPerDay: 4, seeded: true
    },
    students: students,
    attendanceWeeks: {},
    schoolLogs: {
      groupMessages: [
        { id: 'gm1', date: addDaysIso(lastSunday, 1), language: 'en', title: 'Week summary', text: 'Assalamu alaikum parents, thank you for another great Sunday. This week we studied the meaning of Surah Al-Fatiha. Please practice at home with your children for 10 minutes a day.' },
        { id: 'gm2', date: addDaysIso(lastSunday, 1), language: 'tr', title: 'Haftalik ozet', text: 'Selamun aleykum veliler, guzel bir Pazar icin tesekkurler. Bu hafta Fatiha Suresi uzerinde calistik. Lutfen evde cocuklarinizla gunde 10 dakika tekrar yapin.' }
      ],
      suggestionsComplaints: [
        { id: 'sc1', date: lastMonth + '-12', from: 'Ayse Demir', text: 'Could we add a 10 minute break between lessons?', status: 'open', followUp: 'Discuss with teachers this week.' }
      ]
    },
    ui: { activePage: 'students' }
  };
}
</script>

<script>
/* ── Dynamic HTML loader (fetch with embedded fallback for file://) ── */

(function() {

      status.textContent = 'Ready - click "Load Sample Data" to test';
      var qa = new URLSearchParams(window.location.search);
      if (qa.get('drawer') === '1') {
        setTimeout(function() { var row = document.querySelector('.wsm-student-row'); if (row) row.click(); }, 400);
      }
      if (qa.get('modal') === '1') {

      if (qa.get('reminder') === '1') {
        setTimeout(function() { var btn = document.querySelector('[data-act="pay-reminder"]'); if (btn) btn.click(); }, 400);
      }
      if (qa.get('paytab') === '1') {
        setTimeout(function() {
          var row = document.querySelector('.wsm-student-row'); if (row) row.click();
          setTimeout(function() {
            var tab = document.querySelector('.wsm-drawer-tab[data-tab="payments"]'); if (tab) tab.click();
          }, 300);
        }, 400);
      }

        setTimeout(function() {
          var row = document.querySelector('.wsm-student-row'); if (row) row.click();
          setTimeout(function() {
            var tab = document.querySelector('.wsm-drawer-tab[data-tab="payments"]'); if (tab) tab.click();

            var tab = document.querySelector('.wsm-drawer-tab[data-tab="quran"]'); if (tab) tab.click();

          }, 300);
        }, 400);

      var pageMap = {
        dashboard: 'students',
        documents: 'drawer',
        transactions: 'payments',
        finder: 'attendance',
        gst: 'progress',
        assistant: 'communication',
        reports: 'reports',
        settings: 'settings'
      };
      var pageName = qa.get('page');

            var row = document.querySelector('.wsm-student-row'); if (row) row.click();
